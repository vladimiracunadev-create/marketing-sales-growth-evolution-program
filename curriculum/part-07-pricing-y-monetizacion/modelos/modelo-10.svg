<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1304" width="900" height="1304" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif"><title id="t">Modelo mental · Freemium y pruebas gratuitas</title><desc id="d">Modelo mental de la clase 07.10: Freemium y pruebas gratuitas. Método en 5 pasos; 4 conceptos; 3 señales de medición.</desc><rect x="0" y="0" width="900" height="1304" rx="14" fill="#ffffff"/><rect x="0" y="0" width="900" height="64" rx="14" fill="#6e2048"/><rect x="0" y="40" width="900" height="24" fill="#6e2048"/><text x="40" y="28" font-size="12" fill="#e5bcd1" font-weight="700" letter-spacing="1.6">MODELO MENTAL · CLASE 07.10 · PARTE 07</text><text x="40" y="52" font-size="21" fill="#ffffff" font-weight="700">Freemium y pruebas gratuitas</text><text x="40" y="84" font-size="11.5" fill="#ac3974" font-weight="700" letter-spacing="1.4">MÉTODO PASO A PASO</text><ellipse cx="450.0" cy="376.8" rx="330.0" ry="233.1" fill="none" stroke="#ce8cae" stroke-width="2" stroke-dasharray="3 8" stroke-linecap="round"/><polygon points="653.8,193.3 636.3,190.4 641.2,180.8" fill="#ac3974"/><polygon points="759.3,458.8 761.4,441.2 771.2,445.7" fill="#ac3974"/><polygon points="439.0,609.9 455.9,604.4 455.9,615.3" fill="#ac3974"/><polygon points="131.6,438.8 143.5,451.9 133.7,456.4" fill="#ac3974"/><polygon points="265.8,183.2 253.2,195.8 248.3,186.1" fill="#ac3974"/><circle cx="450.0" cy="376.8" r="100.0" fill="#e5bcd1" stroke="#ce8cae" stroke-width="1.6"/><text x="450.0" y="369.0" font-size="15" fill="#6e2048" font-weight="700" text-anchor="middle"><tspan x="450.0">Freemium y pruebas</tspan><tspan x="450.0" dy="19.8">gratuitas</tspan></text><rect x="361.0" y="114.2" width="178" height="59.0" rx="10" fill="#f7e2ed" stroke="#ce8cae" stroke-width="1.4"/><text x="373.0" y="136.2" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="373.0">Definir el objetivo</tspan><tspan x="373.0" dy="16.5">del modelo gratuito</tspan></text><circle cx="363.0" cy="116.2" r="14" fill="#6e2048"/><text x="363.0" y="120.8" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><rect x="674.8" y="275.3" width="178" height="59.0" rx="10" fill="#f7e2ed" stroke="#ce8cae" stroke-width="1.4"/><text x="686.8" y="297.3" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="686.8">Estimar el costo</tspan><tspan x="686.8" dy="16.5">marginal de servir</tspan></text><circle cx="676.8" cy="277.3" r="14" fill="#6e2048"/><text x="676.8" y="281.8" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><rect x="555.0" y="527.6" width="178" height="75.5" rx="10" fill="#f7e2ed" stroke="#ce8cae" stroke-width="1.4"/><text x="567.0" y="549.6" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="567.0">Diseñar el gatillo de</tspan><tspan x="567.0" dy="16.5">conversión en torno al</tspan><tspan x="567.0" dy="16.5">valor</tspan></text><circle cx="557.0" cy="529.6" r="14" fill="#6e2048"/><text x="557.0" y="534.1" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><rect x="167.0" y="527.6" width="178" height="75.5" rx="10" fill="#f7e2ed" stroke="#ce8cae" stroke-width="1.4"/><text x="179.0" y="549.6" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="179.0">Medir conversión y</tspan><tspan x="179.0" dy="16.5">calidad de la cohorte</tspan><tspan x="179.0" dy="16.5">gratuita</tspan></text><circle cx="169.0" cy="529.6" r="14" fill="#6e2048"/><text x="169.0" y="534.1" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">4</text><rect x="47.2" y="267.0" width="178" height="75.5" rx="10" fill="#f7e2ed" stroke="#ce8cae" stroke-width="1.4"/><text x="59.2" y="289.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="59.2">Ajustar límites o</tspan><tspan x="59.2" dy="16.5">abandonar el modelo</tspan><tspan x="59.2" dy="16.5">con criterio previo</tspan></text><circle cx="49.2" cy="269.0" r="14" fill="#6e2048"/><text x="49.2" y="273.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">5</text><text x="40" y="689.6" font-size="11.5" fill="#ac3974" font-weight="700" letter-spacing="1.4">CONCEPTOS Y DÓNDE ACTÚAN EN EL MÉTODO</text><rect x="40.0" y="703.6" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#ce8cae" stroke-width="1.4"/><rect x="40.0" y="711.6" width="5" height="62.2" rx="2" fill="#ac3974"/><text x="56.0" y="725.6" font-size="13.5" fill="#6e2048" font-weight="700" text-anchor="start"><tspan x="56.0">Freemium</tspan></text><text x="56.0" y="745.4" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Plan gratuito permanente con limitaciones que motivan la</tspan><tspan x="56.0" dy="15.2">migración a un plan pagado</tspan></text><rect x="459.0" y="703.6" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#ce8cae" stroke-width="1.4"/><rect x="459.0" y="711.6" width="5" height="62.2" rx="2" fill="#ac3974"/><text x="475.0" y="725.6" font-size="13.5" fill="#6e2048" font-weight="700" text-anchor="start"><tspan x="475.0">Prueba gratuita</tspan></text><text x="475.0" y="745.4" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Acceso completo por tiempo limitado para que el cliente</tspan><tspan x="475.0" dy="15.2">experimente el valor</tspan></text><rect x="798.0" y="711.6" width="54" height="20" rx="10" fill="#e5bcd1" stroke="#ce8cae" stroke-width="1"/><text x="825.0" y="725.6" font-size="11" fill="#6e2048" font-weight="700" text-anchor="middle">↔ 1, 4</text><rect x="40.0" y="795.8" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#ce8cae" stroke-width="1.4"/><rect x="40.0" y="803.8" width="5" height="62.2" rx="2" fill="#ac3974"/><text x="56.0" y="817.8" font-size="13.5" fill="#6e2048" font-weight="700" text-anchor="start"><tspan x="56.0">Costo marginal de servir gratis</tspan></text><text x="56.0" y="837.6" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Gasto adicional por cada usuario gratuito, incluido</tspan><tspan x="56.0" dy="15.2">soporte</tspan></text><rect x="379.0" y="803.8" width="54" height="20" rx="10" fill="#e5bcd1" stroke="#ce8cae" stroke-width="1"/><text x="406.0" y="817.8" font-size="11" fill="#6e2048" font-weight="700" text-anchor="middle">↔ 2</text><rect x="459.0" y="795.8" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#ce8cae" stroke-width="1.4"/><rect x="459.0" y="803.8" width="5" height="62.2" rx="2" fill="#ac3974"/><text x="475.0" y="817.8" font-size="13.5" fill="#6e2048" font-weight="700" text-anchor="start"><tspan x="475.0">Gatillo de conversión</tspan></text><text x="475.0" y="837.6" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Limitación o momento que hace racional pasar al plan</tspan><tspan x="475.0" dy="15.2">pagado</tspan></text><rect x="798.0" y="803.8" width="54" height="20" rx="10" fill="#e5bcd1" stroke="#ce8cae" stroke-width="1"/><text x="825.0" y="817.8" font-size="11" fill="#6e2048" font-weight="700" text-anchor="middle">↔ 3, 4</text><text x="40" y="905.96" font-size="11.5" fill="#ac3974" font-weight="700" letter-spacing="1.4">QUÉ SE MIDE: NUMERADOR SOBRE DENOMINADOR</text><rect x="40.0" y="920.0" width="261.3" height="122.7" rx="8" fill="#f7e2ed" stroke="#ce8cae" stroke-width="1.4"/><text x="54.0" y="942.0" font-size="13" fill="#6e2048" font-weight="700" text-anchor="start"><tspan x="54.0">Tasa de conversión a pago</tspan></text><text x="54.0" y="971.1" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Usuarios que pasan a plan pagado</tspan></text><line x1="54.0" y1="992.3" x2="287.3" y2="992.3" stroke="#ac3974" stroke-width="2"/><text x="54.0" y="1010.3" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="54.0">Usuarios gratuitos de la cohorte, a</tspan><tspan x="54.0" dy="15.2">90 días</tspan></text><rect x="319.3" y="920.0" width="261.3" height="122.7" rx="8" fill="#f7e2ed" stroke="#ce8cae" stroke-width="1.4"/><text x="333.3" y="942.0" font-size="13" fill="#6e2048" font-weight="700" text-anchor="start"><tspan x="333.3">Costo de soporte por usuario</tspan><tspan x="333.3" dy="17.2">gratuito</tspan></text><text x="333.3" y="988.3" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="333.3">Horas de soporte valorizadas,</tspan></text><line x1="333.3" y1="1009.5" x2="566.7" y2="1009.5" stroke="#ac3974" stroke-width="2"/><text x="333.3" y="1027.5" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="333.3">Usuarios gratuitos activos</tspan></text><rect x="598.7" y="920.0" width="261.3" height="122.7" rx="8" fill="#f7e2ed" stroke="#ce8cae" stroke-width="1.4"/><text x="612.7" y="942.0" font-size="13" fill="#6e2048" font-weight="700" text-anchor="start"><tspan x="612.7">Uso del gatillo de conversión</tspan></text><text x="612.7" y="971.1" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="612.7">Usuarios que alcanzan el límite</tspan><tspan x="612.7" dy="15.2">definido</tspan></text><line x1="612.7" y1="1007.5" x2="846.0" y2="1007.5" stroke="#ac3974" stroke-width="2"/><text x="612.7" y="1025.5" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="612.7">Usuarios gratuitos activos</tspan></text><text x="40" y="1076.64" font-size="11.5" fill="#ac3974" font-weight="700" letter-spacing="1.4">FRONTERA DE APLICACIÓN</text><rect x="40" y="1086.6" width="820" height="65.0" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.4"/><polygon points="70,1104.14 52,1133.14 88,1133.14" fill="#c2410c"/><text x="70" y="1130.14" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">!</text><text x="106" y="1110.6" font-size="12.5" fill="#7c2d12" font-weight="400" text-anchor="start"><tspan x="106">Un plan gratuito con costo de soporte alto puede destruir la economía del negocio incluso con buena</tspan><tspan x="106" dy="16.5">conversión. El costo marginal debe medirse antes de escalar.</tspan></text><text x="40" y="1179.64" font-size="11.5" fill="#ac3974" font-weight="700" letter-spacing="1.4">ERROR FRECUENTE Y SU CORRECCIÓN</text><rect x="40" y="1189.6" width="380.0" height="77.0" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/><text x="54" y="1211.6" font-size="11" fill="#b91c1c" font-weight="700" text-anchor="start"><tspan x="54">Síntoma</tspan></text><text x="54" y="1229.6" font-size="12.5" fill="#7f1d1d" font-weight="400" text-anchor="start"><tspan x="54">Abrir plan gratuito sin límite ni gatillo</tspan></text><line x1="426.0" y1="1228.1" x2="469.0" y2="1228.1" stroke="#ac3974" stroke-width="2.6" stroke-linecap="round"/><polygon points="474.0,1228.1 465.9,1232.1 465.9,1224.2" fill="#ac3974"/><rect x="480.0" y="1189.6" width="380.0" height="77.0" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.4"/><text x="494.0" y="1211.6" font-size="11" fill="#15803d" font-weight="700" text-anchor="start"><tspan x="494.0">Corrección</tspan></text><text x="494.0" y="1229.6" font-size="12.5" fill="#14532d" font-weight="400" text-anchor="start"><tspan x="494.0">Define el límite que activa la conversión y mide el</tspan><tspan x="494.0" dy="16.5">costo marginal de servir antes de escalar.</tspan></text></svg>