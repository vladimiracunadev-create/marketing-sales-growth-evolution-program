text x="40" y="1162.48" font-size="11.5" fill="#4e39ac" font-weight="700" letter-spacing="1.4">ERROR FRECUENTE Y SU CORRECCIÓN</text><rect x="40" y="1172.5" width="380.0" height="77.0" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/><text x="54" y="1194.5" font-size="11" fill="#b91c1c" font-weight="700" text-anchor="start"><tspan x="54">Síntoma</tspan></text><text x="54" y="1212.5" font-size="12.5" fill="#7f1d1d" font-weight="400" text-anchor="start"><tspan x="54">Ocultar información que el visitante busca</tspan></text><line x1="426.0" y1="1211.0" x2="469.0" y2="1211.0" stroke="#4e39ac" stroke-width="2.6" stroke-linecap="round"/><polygon points="474.0,1211.0 465.9,1214.9 465.9,1207.1" fill="#4e39ac"/><rect x="480.0" y="1172.5" width="380.0" height="77.0" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.4"/><text x="494.0" y="1194.5" font-size="11" fill="#15803d" font-weight="700" text-anchor="start"><tspan x="494.0">Corrección</tspan></text><text x="494.0" y="1212.5" font-size="12.5" fill="#14532d" font-weight="400" text-anchor="start"><tspan x="494.0">Incluye la respuesta a la objeción dominante en la</tspan><tspan x="494.0" dy="16.5">página, aunque reduzca el volumen de contactos.</tspan></text></svg>