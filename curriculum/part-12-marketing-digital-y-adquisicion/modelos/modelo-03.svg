<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1090" width="900" height="1090" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif"><title id="t">Modelo mental · Landing pages</title><desc id="d">Modelo mental de la clase 12.03: Landing pages. Método en 5 pasos; 4 conceptos; 3 señales de medición.</desc><rect x="0" y="0" width="900" height="1090" rx="14" fill="#ffffff"/><rect x="0" y="0" width="900" height="64" rx="14" fill="#204f6e"/><rect x="0" y="40" width="900" height="24" fill="#204f6e"/><text x="40" y="28" font-size="12" fill="#bcd5e5" font-weight="700" letter-spacing="1.6">MODELO MENTAL · CLASE 12.03 · PARTE 12</text><text x="40" y="52" font-size="21" fill="#ffffff" font-weight="700">Landing pages</text><text x="40" y="84" font-size="11.5" fill="#397eac" font-weight="700" letter-spacing="1.4">MÉTODO PASO A PASO</text><path d="M66.0,159.0 V202.5 H158.5" fill="none" stroke="#397eac" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="160.5,202.5 151.5,197.5 151.5,207.5" fill="#397eac"/><path d="M188.5,232.0 V275.5 H281.0" fill="none" stroke="#397eac" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="283.0,275.5 274.0,270.5 274.0,280.5" fill="#397eac"/><path d="M311.0,305.0 V348.5 H403.5" fill="none" stroke="#397eac" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="405.5,348.5 396.5,343.5 396.5,353.5" fill="#397eac"/><path d="M433.5,378.0 V421.5 H526.0" fill="none" stroke="#397eac" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="528.0,421.5 519.0,416.5 519.0,426.5" fill="#397eac"/><rect x="40.0" y="100.0" width="330" height="59.0" rx="10" fill="#e2eff7" stroke="#8cb3ce" stroke-width="1.4"/><text x="54.0" y="122.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Definir el objetivo único de la página</tspan></text><circle cx="42.0" cy="102.0" r="14" fill="#204f6e"/><text x="42.0" y="106.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><rect x="162.5" y="173.0" width="330" height="59.0" rx="10" fill="#e2eff7" stroke="#8cb3ce" stroke-width="1.4"/><text x="176.5" y="195.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="176.5">Verificar la coherencia con el mensaje de</tspan><tspan x="176.5" dy="16.5">origen</tspan></text><circle cx="164.5" cy="175.0" r="14" fill="#204f6e"/><text x="164.5" y="179.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><rect x="285.0" y="246.0" width="330" height="59.0" rx="10" fill="#e2eff7" stroke="#8cb3ce" stroke-width="1.4"/><text x="299.0" y="268.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="299.0">Incorporar respuestas a las objeciones</tspan><tspan x="299.0" dy="16.5">documentadas</tspan></text><circle cx="287.0" cy="248.0" r="14" fill="#204f6e"/><text x="287.0" y="252.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><rect x="407.5" y="319.0" width="330" height="59.0" rx="10" fill="#e2eff7" stroke="#8cb3ce" stroke-width="1.4"/><text x="421.5" y="341.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="421.5">Reducir la fricción al mínimo necesario</tspan></text><circle cx="409.5" cy="321.0" r="14" fill="#204f6e"/><text x="409.5" y="325.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">4</text><rect x="530.0" y="392.0" width="330" height="59.0" rx="10" fill="#e2eff7" stroke="#8cb3ce" stroke-width="1.4"/><text x="544.0" y="414.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="544.0">Probar una variable a la vez con muestra</tspan><tspan x="544.0" dy="16.5">suficiente</tspan></text><circle cx="532.0" cy="394.0" r="14" fill="#204f6e"/><text x="532.0" y="398.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">5</text><text x="40" y="493.0" font-size="11.5" fill="#397eac" font-weight="700" letter-spacing="1.4">CONCEPTOS Y DÓNDE ACTÚAN EN EL MÉTODO</text><rect x="40.0" y="507.0" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#8cb3ce" stroke-width="1.4"/><rect x="40.0" y="515.0" width="5" height="62.2" rx="2" fill="#397eac"/><text x="56.0" y="529.0" font-size="13.5" fill="#204f6e" font-weight="700" text-anchor="start"><tspan x="56.0">Coherencia mensaje-página</tspan></text><text x="56.0" y="548.8" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Correspondencia entre lo prometido en el origen y lo que</tspan><tspan x="56.0" dy="15.2">muestra la página</tspan></text><rect x="379.0" y="515.0" width="54" height="20" rx="10" fill="#bcd5e5" stroke="#8cb3ce" stroke-width="1"/><text x="406.0" y="529.0" font-size="11" fill="#204f6e" font-weight="700" text-anchor="middle">↔ 1, 2</text><rect x="459.0" y="507.0" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#8cb3ce" stroke-width="1.4"/><rect x="459.0" y="515.0" width="5" height="62.2" rx="2" fill="#397eac"/><text x="475.0" y="529.0" font-size="13.5" fill="#204f6e" font-weight="700" text-anchor="start"><tspan x="475.0">Objetivo único</tspan></text><text x="475.0" y="548.8" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Acción específica que la página busca producir, sin</tspan><tspan x="475.0" dy="15.2">alternativas que compitan</tspan></text><rect x="798.0" y="515.0" width="54" height="20" rx="10" fill="#bcd5e5" stroke="#8cb3ce" stroke-width="1"/><text x="825.0" y="529.0" font-size="11" fill="#204f6e" font-weight="700" text-anchor="middle">↔ 1</text><rect x="40.0" y="599.2" width="401.0" height="63.0" rx="8" fill="#ffffff" stroke="#8cb3ce" stroke-width="1.4"/><rect x="40.0" y="607.2" width="5" height="47.0" rx="2" fill="#397eac"/><text x="56.0" y="621.2" font-size="13.5" fill="#204f6e" font-weight="700" text-anchor="start"><tspan x="56.0">Manejo de objeciones en página</tspan></text><text x="56.0" y="641.0" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Respuesta anticipada a las dudas que frenan la conversión</tspan></text><rect x="379.0" y="607.2" width="54" height="20" rx="10" fill="#bcd5e5" stroke="#8cb3ce" stroke-width="1"/><text x="406.0" y="621.2" font-size="11" fill="#204f6e" font-weight="700" text-anchor="middle">↔ 1, 3</text><rect x="459.0" y="599.2" width="401.0" height="63.0" rx="8" fill="#ffffff" stroke="#8cb3ce" stroke-width="1.4"/><rect x="459.0" y="607.2" width="5" height="47.0" rx="2" fill="#397eac"/><text x="475.0" y="621.2" font-size="13.5" fill="#204f6e" font-weight="700" text-anchor="start"><tspan x="475.0">Fricción de formulario</tspan></text><text x="475.0" y="641.0" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Esfuerzo que impone la captura de datos sobre el visitante</tspan></text><rect x="798.0" y="607.2" width="54" height="20" rx="10" fill="#bcd5e5" stroke="#8cb3ce" stroke-width="1"/><text x="825.0" y="621.2" font-size="11" fill="#204f6e" font-weight="700" text-anchor="middle">↔ 4</text><text x="40" y="694.1800000000001" font-size="11.5" fill="#397eac" font-weight="700" letter-spacing="1.4">QUÉ SE MIDE: NUMERADOR SOBRE DENOMINADOR</text><rect x="40.0" y="708.2" width="261.3" height="120.7" rx="8" fill="#e2eff7" stroke="#8cb3ce" stroke-width="1.4"/><text x="54.0" y="730.2" font-size="13" fill="#204f6e" font-weight="700" text-anchor="start"><tspan x="54.0">Tasa de conversión de la página</tspan></text><text x="54.0" y="759.3" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Conversiones</tspan></text><line x1="54.0" y1="780.5" x2="287.3" y2="780.5" stroke="#397eac" stroke-width="2"/><text x="54.0" y="798.5" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="54.0">Visitas únicas, por fuente de</tspan><tspan x="54.0" dy="15.2">tráfico</tspan></text><rect x="319.3" y="708.2" width="261.3" height="120.7" rx="8" fill="#e2eff7" stroke="#8cb3ce" stroke-width="1.4"/><text x="333.3" y="730.2" font-size="13" fill="#204f6e" font-weight="700" text-anchor="start"><tspan x="333.3">Coherencia auditada</tspan></text><text x="333.3" y="759.3" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="333.3">Páginas cuyo mensaje coincide con su</tspan><tspan x="333.3" dy="15.2">origen</tspan></text><line x1="333.3" y1="795.7" x2="566.7" y2="795.7" stroke="#397eac" stroke-width="2"/><text x="333.3" y="813.7" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="333.3">Páginas auditadas</tspan></text><rect x="598.7" y="708.2" width="261.3" height="120.7" rx="8" fill="#e2eff7" stroke="#8cb3ce" stroke-width="1.4"/><text x="612.7" y="730.2" font-size="13" fill="#204f6e" font-weight="700" text-anchor="start"><tspan x="612.7">Abandono de formulario</tspan></text><text x="612.7" y="759.3" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="612.7">Abandonos en el formulario</tspan></text><line x1="612.7" y1="780.5" x2="846.0" y2="780.5" stroke="#397eac" stroke-width="2"/><text x="612.7" y="798.5" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="612.7">Inicios de formulario</tspan></text><text x="40" y="862.8800000000001" font-size="11.5" fill="#397eac" font-weight="700" letter-spacing="1.4">FRONTERA DE APLICACIÓN</text><rect x="40" y="872.9" width="820" height="65.0" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.4"/><polygon points="70,890.3800000000001 52,919.3800000000001 88,919.3800000000001" fill="#c2410c"/><text x="70" y="916.3800000000001" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">!</text><text x="106" y="896.9" font-size="12.5" fill="#7c2d12" font-weight="400" text-anchor="start"><tspan x="106">Optimizar la página no arregla una oferta débil ni un tráfico mal segmentado. Antes de testear, hay que</tspan><tspan x="106" dy="16.5">verificar que el visitante corresponde al perfil.</tspan></text><text x="40" y="965.8800000000001" font-size="11.5" fill="#397eac" font-weight="700" letter-spacing="1.4">ERROR FRECUENTE Y SU CORRECCIÓN</text><rect x="40" y="975.9" width="380.0" height="77.0" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/><text x="54" y="997.9" font-size="11" fill="#b91c1c" font-weight="700" text-anchor="start"><tspan x="54">Síntoma</tspan></text><text x="54" y="1015.9" font-size="12.5" fill="#7f1d1d" font-weight="400" text-anchor="start"><tspan x="54">Romper la coherencia entre anuncio y página</tspan></text><line x1="426.0" y1="1014.4" x2="469.0" y2="1014.4" stroke="#397eac" stroke-width="2.6" stroke-linecap="round"/><polygon points="474.0,1014.4 465.9,1018.3 465.9,1010.5" fill="#397eac"/><rect x="480.0" y="975.9" width="380.0" height="77.0" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.4"/><text x="494.0" y="997.9" font-size="11" fill="#15803d" font-weight="700" text-anchor="start"><tspan x="494.0">Corrección</tspan></text><text x="494.0" y="1015.9" font-size="12.5" fill="#14532d" font-weight="400" text-anchor="start"><tspan x="494.0">Audita que la promesa del origen aparezca</tspan><tspan x="494.0" dy="16.5">literalmente en la primera pantalla de la landing.</tspan></text></svg>