name: Revisión de seguridad e higiene

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  higiene:
    name: Dependencias, secretos y datos
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Los generadores no usan dependencias externas
        run: |
          set -e
          prohibidos="requests|pandas|numpy|markdown|jinja2|flask|django|boto3|openai|anthropic|bs4|lxml"
          if grep -REn "^\s*(import|from)\s+($prohibidos)\b" tools/; then
            echo "::error::Los generadores deben usar solo la biblioteca estandar."
            exit 1
          fi
          echo "Generadores sin dependencias externas."

      - name: El portal no carga recursos de terceros
        run: |
          set -e
          python tools/build_site.py --limpiar >/dev/null
          python tools/validate_site.py

      - name: Buscar posibles secretos
        run: |
          set -e
          patron='(AKIA[0-9A-Z]{16}|-----BEGIN [A-Z ]*PRIVATE KEY-----|ghp_[A-Za-z0-9]{36}|sk-[A-Za-z0-9]{32,}|xox[baprs]-[A-Za-z0-9-]{10,})'
          if grep -REn "$patron" --exclude-dir=.git --exclude-dir=site .; then
            echo "::error::Posible secreto en el repositorio."
            exit 1
          fi
          echo "Sin secretos detectados."

      - name: Los conjuntos de datos son sintéticos
        run: |
          set -e
          if grep -REn '[0-9]{7,8}-[0-9kK]\b' datasets/ 2>/dev/null; then
            echo "::error::Posible identificador personal chileno en datasets/."
            exit 1
          fi
          if grep -REin '(@gmail|@hotmail|@outlook|@yahoo)\.' datasets/ 2>/dev/null; then
            echo "::error::Posible correo personal real en datasets/."
            exit 1
          fi
          echo "Datos sin identificadores personales."

      - name: Licencia y avisos presentes
        run: |
          set -e
          test -f LICENSE && grep -q "MIT" LICENSE
          grep -q "no asesoría legal" README.md
          grep -q "datos sintéticos" README.md || grep -q "sintéticos" README.md
          echo "Licencia y avisos de alcance presentes."

      - name: Permisos de los workflows
        run: |
          set -e
          for f in .github/workflows/*.yml; do
            grep -q "permissions:" "$f" || { echo "::error::$f sin bloque permissions"; exit 1; }
          done
          echo "Todos los workflows declaran permisos explícitos."

  enlaces-externos:
    name: Enlaces externos
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Revisar enlaces
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --max-concurrency 4
            --accept 200,206,301,302,403,429
            --exclude-path site
            --exclude-path curriculum
            "*.md" "docs/*.md" "rutas/*.md"
          fail: false
