<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 949" width="900" height="949" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif"><title id="t">Modelo mental · Concesiones</title><desc id="d">Modelo mental de la clase 10.06: Concesiones. Método en 5 pasos; 4 conceptos; 3 señales de medición.</desc><rect x="0" y="0" width="900" height="949" rx="14" fill="#ffffff"/><rect x="0" y="0" width="900" height="64" rx="14" fill="#2d6e20"/><rect x="0" y="40" width="900" height="24" fill="#2d6e20"/><text x="40" y="28" font-size="12" fill="#c3e5bc" font-weight="700" letter-spacing="1.6">MODELO MENTAL · CLASE 10.06 · PARTE 10</text><text x="40" y="52" font-size="21" fill="#ffffff" font-weight="700">Concesiones</text><text x="40" y="84" font-size="11.5" fill="#4cac39" font-weight="700" letter-spacing="1.4">MÉTODO PASO A PASO</text><line x1="450.0" y1="94.0" x2="450.0" y2="300.5" stroke="#97ce8c" stroke-width="3" stroke-linecap="round"/><line x1="450.0" y1="121.2" x2="406.0" y2="121.2" stroke="#97ce8c" stroke-width="2"/><rect x="56.0" y="100" width="350" height="42.5" rx="10" fill="#e6f7e2" stroke="#97ce8c" stroke-width="1.4"/><text x="70.0" y="122" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="70.0">Listar concesiones posibles y su costo real</tspan></text><circle cx="450.0" cy="121.2" r="15" fill="#2d6e20"/><text x="450.0" y="125.8" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><line x1="450.0" y1="159.2" x2="494.0" y2="159.2" stroke="#97ce8c" stroke-width="2"/><rect x="494.0" y="138" width="350" height="42.5" rx="10" fill="#e6f7e2" stroke="#97ce8c" stroke-width="1.4"/><text x="508.0" y="160" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="508.0">Asignar a cada una la contrapartida exigida</tspan></text><circle cx="450.0" cy="159.2" r="15" fill="#2d6e20"/><text x="450.0" y="163.8" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><line x1="450.0" y1="197.2" x2="406.0" y2="197.2" stroke="#97ce8c" stroke-width="2"/><rect x="56.0" y="176" width="350" height="42.5" rx="10" fill="#e6f7e2" stroke="#97ce8c" stroke-width="1.4"/><text x="70.0" y="198" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="70.0">Planificar magnitudes decrecientes</tspan></text><circle cx="450.0" cy="197.2" r="15" fill="#2d6e20"/><text x="450.0" y="201.8" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><line x1="450.0" y1="235.2" x2="494.0" y2="235.2" stroke="#97ce8c" stroke-width="2"/><rect x="494.0" y="214" width="350" height="42.5" rx="10" fill="#e6f7e2" stroke="#97ce8c" stroke-width="1.4"/><text x="508.0" y="236" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="508.0">Condicionar explícitamente cada cesión</tspan></text><circle cx="450.0" cy="235.2" r="15" fill="#2d6e20"/><text x="450.0" y="239.8" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">4</text><line x1="450.0" y1="273.2" x2="406.0" y2="273.2" stroke="#97ce8c" stroke-width="2"/><rect x="56.0" y="252" width="350" height="42.5" rx="10" fill="#e6f7e2" stroke="#97ce8c" stroke-width="1.4"/><text x="70.0" y="274" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="70.0">Documentar lo concedido y lo obtenido</tspan></text><circle cx="450.0" cy="273.2" r="15" fill="#2d6e20"/><text x="450.0" y="277.8" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">5</text><text x="40" y="336.5" font-size="11.5" fill="#4cac39" font-weight="700" letter-spacing="1.4">CONCEPTOS Y DÓNDE ACTÚAN EN EL MÉTODO</text><rect x="40.0" y="350.5" width="401.0" height="63.0" rx="8" fill="#ffffff" stroke="#97ce8c" stroke-width="1.4"/><rect x="40.0" y="358.5" width="5" height="47.0" rx="2" fill="#4cac39"/><text x="56.0" y="372.5" font-size="13.5" fill="#2d6e20" font-weight="700" text-anchor="start"><tspan x="56.0">Concesión planificada</tspan></text><text x="56.0" y="392.3" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Cesión definida de antemano con su contrapartida asociada</tspan></text><rect x="379.0" y="358.5" width="54" height="20" rx="10" fill="#c3e5bc" stroke="#97ce8c" stroke-width="1"/><text x="406.0" y="372.5" font-size="11" fill="#2d6e20" font-weight="700" text-anchor="middle">↔ 1, 3, 5</text><rect x="459.0" y="350.5" width="401.0" height="63.0" rx="8" fill="#ffffff" stroke="#97ce8c" stroke-width="1.4"/><rect x="459.0" y="358.5" width="5" height="47.0" rx="2" fill="#4cac39"/><text x="475.0" y="372.5" font-size="13.5" fill="#2d6e20" font-weight="700" text-anchor="start"><tspan x="475.0">Patrón de concesión</tspan></text><text x="475.0" y="392.3" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Secuencia de magnitudes que comunica cuánto margen queda</tspan></text><rect x="798.0" y="358.5" width="54" height="20" rx="10" fill="#c3e5bc" stroke="#97ce8c" stroke-width="1"/><text x="825.0" y="372.5" font-size="11" fill="#2d6e20" font-weight="700" text-anchor="middle">↔ 1, 5</text><rect x="40.0" y="427.5" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#97ce8c" stroke-width="1.4"/><rect x="40.0" y="435.5" width="5" height="62.2" rx="2" fill="#4cac39"/><text x="56.0" y="449.5" font-size="13.5" fill="#2d6e20" font-weight="700" text-anchor="start"><tspan x="56.0">Condicionalidad</tspan></text><text x="56.0" y="469.3" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Vínculo explícito entre una cesión propia y una</tspan><tspan x="56.0" dy="15.2">contrapartida de la otra parte</tspan></text><rect x="379.0" y="435.5" width="54" height="20" rx="10" fill="#c3e5bc" stroke="#97ce8c" stroke-width="1"/><text x="406.0" y="449.5" font-size="11" fill="#2d6e20" font-weight="700" text-anchor="middle">↔ 4</text><rect x="459.0" y="427.5" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#97ce8c" stroke-width="1.4"/><rect x="459.0" y="435.5" width="5" height="62.2" rx="2" fill="#4cac39"/><text x="475.0" y="449.5" font-size="13.5" fill="#2d6e20" font-weight="700" text-anchor="start"><tspan x="475.0">Señal de agotamiento</tspan></text><text x="475.0" y="469.3" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Comunicación creíble de que se llegó al límite</tspan></text><text x="40" y="537.6800000000001" font-size="11.5" fill="#4cac39" font-weight="700" letter-spacing="1.4">QUÉ SE MIDE: NUMERADOR SOBRE DENOMINADOR</text><rect x="40.0" y="551.7" width="261.3" height="135.9" rx="8" fill="#e6f7e2" stroke="#97ce8c" stroke-width="1.4"/><text x="54.0" y="573.7" font-size="13" fill="#2d6e20" font-weight="700" text-anchor="start"><tspan x="54.0">Razón concesión-contrapartida</tspan></text><text x="54.0" y="602.8" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Concesiones con contrapartida</tspan><tspan x="54.0" dy="15.2">obtenida</tspan></text><line x1="54.0" y1="639.2" x2="287.3" y2="639.2" stroke="#4cac39" stroke-width="2"/><text x="54.0" y="657.2" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="54.0">Concesiones otorgadas</tspan></text><rect x="319.3" y="551.7" width="261.3" height="135.9" rx="8" fill="#e6f7e2" stroke="#97ce8c" stroke-width="1.4"/><text x="333.3" y="573.7" font-size="13" fill="#2d6e20" font-weight="700" text-anchor="start"><tspan x="333.3">Magnitud de la última concesión</tspan></text><text x="333.3" y="602.8" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="333.3">Porcentaje de la última cesión</tspan><tspan x="333.3" dy="15.2">frente a la primera, por negociación</tspan></text><rect x="598.7" y="551.7" width="261.3" height="135.9" rx="8" fill="#e6f7e2" stroke="#97ce8c" stroke-width="1.4"/><text x="612.7" y="573.7" font-size="13" fill="#2d6e20" font-weight="700" text-anchor="start"><tspan x="612.7">Valor obtenido en contrapartidas</tspan></text><text x="612.7" y="602.8" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="612.7">Valor monetario de las</tspan><tspan x="612.7" dy="15.2">contrapartidas obtenidas</tspan></text><line x1="612.7" y1="639.2" x2="846.0" y2="639.2" stroke="#4cac39" stroke-width="2"/><text x="612.7" y="657.2" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="612.7">Valor monetario de las concesiones</tspan><tspan x="612.7" dy="15.2">otorgadas</tspan></text><text x="40" y="721.5600000000001" font-size="11.5" fill="#4cac39" font-weight="700" letter-spacing="1.4">FRONTERA DE APLICACIÓN</text><rect x="40" y="731.6" width="820" height="65.0" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.4"/><polygon points="70,749.0600000000001 52,778.0600000000001 88,778.0600000000001" fill="#c2410c"/><text x="70" y="775.0600000000001" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">!</text><text x="106" y="755.6" font-size="12.5" fill="#7c2d12" font-weight="400" text-anchor="start"><tspan x="106">La rigidez absoluta puede costar el negocio cuando la contraparte necesita mostrar un logro. La clave es</tspan><tspan x="106" dy="16.5">que la concesión tenga contrapartida, no que no exista.</tspan></text><text x="40" y="824.5600000000001" font-size="11.5" fill="#4cac39" font-weight="700" letter-spacing="1.4">ERROR FRECUENTE Y SU CORRECCIÓN</text><rect x="40" y="834.6" width="380.0" height="77.0" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/><text x="54" y="856.6" font-size="11" fill="#b91c1c" font-weight="700" text-anchor="start"><tspan x="54">Síntoma</tspan></text><text x="54" y="874.6" font-size="12.5" fill="#7f1d1d" font-weight="400" text-anchor="start"><tspan x="54">Conceder en magnitudes crecientes</tspan></text><line x1="426.0" y1="873.1" x2="469.0" y2="873.1" stroke="#4cac39" stroke-width="2.6" stroke-linecap="round"/><polygon points="474.0,873.1 465.9,877.0 465.9,869.1" fill="#4cac39"/><rect x="480.0" y="834.6" width="380.0" height="77.0" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.4"/><text x="494.0" y="856.6" font-size="11" fill="#15803d" font-weight="700" text-anchor="start"><tspan x="494.0">Corrección</tspan></text><text x="494.0" y="874.6" font-size="12.5" fill="#14532d" font-weight="400" text-anchor="start"><tspan x="494.0">Planifica concesiones decrecientes y exige</tspan><tspan x="494.0" dy="16.5">contrapartida en cada una.</tspan></text></svg>