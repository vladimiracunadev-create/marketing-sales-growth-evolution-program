<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 957" width="900" height="957" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif"><title id="t">Modelo mental · Sesgos cognitivos y decisiones</title><desc id="d">Modelo mental de la clase 02.09: Sesgos cognitivos y decisiones. Método en 5 pasos; 4 conceptos; 3 señales de medición.</desc><rect x="0" y="0" width="900" height="957" rx="14" fill="#ffffff"/><rect x="0" y="0" width="900" height="64" rx="14" fill="#426e20"/><rect x="0" y="40" width="900" height="24" fill="#426e20"/><text x="40" y="28" font-size="12" fill="#cee5bc" font-weight="700" letter-spacing="1.6">MODELO MENTAL · CLASE 02.09 · PARTE 02</text><text x="40" y="52" font-size="21" fill="#ffffff" font-weight="700">Sesgos cognitivos y decisiones</text><text x="40" y="84" font-size="11.5" fill="#6bac39" font-weight="700" letter-spacing="1.4">MÉTODO PASO A PASO</text><rect x="40.0" y="100" width="246.7" height="75.5" rx="10" fill="#ebf7e2" stroke="#a9ce8c" stroke-width="1.4"/><text x="54.0" y="122" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Identificar qué sesgo está</tspan><tspan x="54.0" dy="16.5">operando en la decisión</tspan><tspan x="54.0" dy="16.5">analizada</tspan></text><circle cx="42.0" cy="102.0" r="14" fill="#426e20"/><text x="42.0" y="106.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><rect x="326.7" y="100" width="246.7" height="75.5" rx="10" fill="#ebf7e2" stroke="#a9ce8c" stroke-width="1.4"/><text x="340.7" y="122" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="340.7">Distinguir si el diseño ayuda o</tspan><tspan x="340.7" dy="16.5">explota</tspan></text><circle cx="328.7" cy="102.0" r="14" fill="#426e20"/><text x="328.7" y="106.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><rect x="613.3" y="100" width="246.7" height="75.5" rx="10" fill="#ebf7e2" stroke="#a9ce8c" stroke-width="1.4"/><text x="627.3" y="122" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="627.3">Aplicar la prueba de</tspan><tspan x="627.3" dy="16.5">reversibilidad</tspan></text><circle cx="615.3" cy="102.0" r="14" fill="#426e20"/><text x="615.3" y="106.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><rect x="613.3" y="213.5" width="246.7" height="75.5" rx="10" fill="#ebf7e2" stroke="#a9ce8c" stroke-width="1.4"/><text x="627.3" y="235.5" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="627.3">Documentar la elección y su</tspan><tspan x="627.3" dy="16.5">justificación</tspan></text><circle cx="615.3" cy="215.5" r="14" fill="#426e20"/><text x="615.3" y="220.0" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">4</text><rect x="326.7" y="213.5" width="246.7" height="75.5" rx="10" fill="#ebf7e2" stroke="#a9ce8c" stroke-width="1.4"/><text x="340.7" y="235.5" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="340.7">Medir el efecto en</tspan><tspan x="340.7" dy="16.5">arrepentimiento, reclamos y</tspan><tspan x="340.7" dy="16.5">bajas</tspan></text><circle cx="328.7" cy="215.5" r="14" fill="#426e20"/><text x="328.7" y="220.0" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">5</text><line x1="289.7" y1="137.8" x2="318.7" y2="137.8" stroke="#6bac39" stroke-width="2.2" stroke-linecap="round"/><polygon points="323.7,137.8 315.6,141.7 315.6,133.8" fill="#6bac39"/><line x1="576.3" y1="137.8" x2="605.3" y2="137.8" stroke="#6bac39" stroke-width="2.2" stroke-linecap="round"/><polygon points="610.3,137.8 602.2,141.7 602.2,133.8" fill="#6bac39"/><line x1="736.7" y1="177.5" x2="736.7" y2="205.5" stroke="#6bac39" stroke-width="2.2" stroke-linecap="round"/><polygon points="736.7,210.5 732.8,202.4 740.6,202.4" fill="#6bac39"/><line x1="610.3" y1="251.2" x2="581.3" y2="251.2" stroke="#6bac39" stroke-width="2.2" stroke-linecap="round"/><polygon points="576.3,251.2 584.4,247.3 584.4,255.2" fill="#6bac39"/><text x="40" y="327.0" font-size="11.5" fill="#6bac39" font-weight="700" letter-spacing="1.4">CONCEPTOS Y DÓNDE ACTÚAN EN EL MÉTODO</text><rect x="40.0" y="341.0" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#a9ce8c" stroke-width="1.4"/><rect x="40.0" y="349.0" width="5" height="62.2" rx="2" fill="#6bac39"/><text x="56.0" y="363.0" font-size="13.5" fill="#426e20" font-weight="700" text-anchor="start"><tspan x="56.0">Anclaje</tspan></text><text x="56.0" y="382.8" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Influencia desproporcionada de la primera cifra o</tspan><tspan x="56.0" dy="15.2">referencia sobre el juicio posterior</tspan></text><rect x="459.0" y="341.0" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#a9ce8c" stroke-width="1.4"/><rect x="459.0" y="349.0" width="5" height="62.2" rx="2" fill="#6bac39"/><text x="475.0" y="363.0" font-size="13.5" fill="#426e20" font-weight="700" text-anchor="start"><tspan x="475.0">Aversión a la pérdida</tspan></text><text x="475.0" y="382.8" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Tendencia a valorar más evitar una pérdida que obtener una</tspan><tspan x="475.0" dy="15.2">ganancia equivalente</tspan></text><rect x="40.0" y="433.2" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#a9ce8c" stroke-width="1.4"/><rect x="40.0" y="441.2" width="5" height="62.2" rx="2" fill="#6bac39"/><text x="56.0" y="455.2" font-size="13.5" fill="#426e20" font-weight="700" text-anchor="start"><tspan x="56.0">Sesgo de statu quo</tspan></text><text x="56.0" y="475.0" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Preferencia por mantener la situación actual aunque exista</tspan><tspan x="56.0" dy="15.2">una alternativa superior</tspan></text><rect x="379.0" y="441.2" width="54" height="20" rx="10" fill="#cee5bc" stroke="#a9ce8c" stroke-width="1"/><text x="406.0" y="455.2" font-size="11" fill="#426e20" font-weight="700" text-anchor="middle">↔ 1</text><rect x="459.0" y="433.2" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#a9ce8c" stroke-width="1.4"/><rect x="459.0" y="441.2" width="5" height="62.2" rx="2" fill="#6bac39"/><text x="475.0" y="455.2" font-size="13.5" fill="#426e20" font-weight="700" text-anchor="start"><tspan x="475.0">Prueba de reversibilidad</tspan></text><text x="475.0" y="475.0" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Verificación de si el cliente mantendría la decisión al</tspan><tspan x="475.0" dy="15.2">conocer toda la información</tspan></text><rect x="798.0" y="441.2" width="54" height="20" rx="10" fill="#cee5bc" stroke="#a9ce8c" stroke-width="1"/><text x="825.0" y="455.2" font-size="11" fill="#426e20" font-weight="700" text-anchor="middle">↔ 3</text><text x="40" y="543.36" font-size="11.5" fill="#6bac39" font-weight="700" letter-spacing="1.4">QUÉ SE MIDE: NUMERADOR SOBRE DENOMINADOR</text><rect x="40.0" y="557.4" width="261.3" height="137.9" rx="8" fill="#ebf7e2" stroke="#a9ce8c" stroke-width="1.4"/><text x="54.0" y="579.4" font-size="13" fill="#426e20" font-weight="700" text-anchor="start"><tspan x="54.0">Tasa de arrepentimiento temprano</tspan></text><text x="54.0" y="608.5" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Cancelaciones dentro de los primeros</tspan><tspan x="54.0" dy="15.2">30 días</tspan></text><line x1="54.0" y1="644.9" x2="287.3" y2="644.9" stroke="#6bac39" stroke-width="2"/><text x="54.0" y="662.9" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="54.0">Ventas del periodo</tspan></text><rect x="319.3" y="557.4" width="261.3" height="137.9" rx="8" fill="#ebf7e2" stroke="#a9ce8c" stroke-width="1.4"/><text x="333.3" y="579.4" font-size="13" fill="#426e20" font-weight="700" text-anchor="start"><tspan x="333.3">Reclamos por condiciones no</tspan><tspan x="333.3" dy="17.2">comprendidas</tspan></text><text x="333.3" y="625.7" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="333.3">Reclamos vinculados a términos,</tspan><tspan x="333.3" dy="15.2">renovación o cobros</tspan></text><line x1="333.3" y1="662.0" x2="566.7" y2="662.0" stroke="#6bac39" stroke-width="2"/><text x="333.3" y="680.0" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="333.3">Transacciones del periodo</tspan></text><rect x="598.7" y="557.4" width="261.3" height="137.9" rx="8" fill="#ebf7e2" stroke="#a9ce8c" stroke-width="1.4"/><text x="612.7" y="579.4" font-size="13" fill="#426e20" font-weight="700" text-anchor="start"><tspan x="612.7">Diferencia de conversión con</tspan><tspan x="612.7" dy="17.2">información completa</tspan></text><text x="612.7" y="625.7" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="612.7">Conversión de la variante con</tspan><tspan x="612.7" dy="15.2">información completa frente a la</tspan><tspan x="612.7" dy="15.2">variante reducida</tspan></text><text x="40" y="729.22" font-size="11.5" fill="#6bac39" font-weight="700" letter-spacing="1.4">FRONTERA DE APLICACIÓN</text><rect x="40" y="739.2" width="820" height="65.0" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.4"/><polygon points="70,756.72 52,785.72 88,785.72" fill="#c2410c"/><text x="70" y="782.72" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">!</text><text x="106" y="763.2" font-size="12.5" fill="#7c2d12" font-weight="400" text-anchor="start"><tspan x="106">Conocer los sesgos no inmuniza contra ellos: el equipo comercial también decide bajo anclaje y aversión a</tspan><tspan x="106" dy="16.5">la pérdida, especialmente al final del trimestre.</tspan></text><text x="40" y="832.22" font-size="11.5" fill="#6bac39" font-weight="700" letter-spacing="1.4">ERROR FRECUENTE Y SU CORRECCIÓN</text><rect x="40" y="842.2" width="380.0" height="77.0" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/><text x="54" y="864.2" font-size="11" fill="#b91c1c" font-weight="700" text-anchor="start"><tspan x="54">Síntoma</tspan></text><text x="54" y="882.2" font-size="12.5" fill="#7f1d1d" font-weight="400" text-anchor="start"><tspan x="54">Usar el sesgo para ocultar una condición relevante</tspan></text><line x1="426.0" y1="880.7" x2="469.0" y2="880.7" stroke="#6bac39" stroke-width="2.6" stroke-linecap="round"/><polygon points="474.0,880.7 465.9,884.6 465.9,876.8" fill="#6bac39"/><rect x="480.0" y="842.2" width="380.0" height="77.0" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.4"/><text x="494.0" y="864.2" font-size="11" fill="#15803d" font-weight="700" text-anchor="start"><tspan x="494.0">Corrección</tspan></text><text x="494.0" y="882.2" font-size="12.5" fill="#14532d" font-weight="400" text-anchor="start"><tspan x="494.0">Aplica la prueba de publicación: si la práctica no</tspan><tspan x="494.0" dy="16.5">resistiría ser explicada al cliente, no se usa.</tspan></text></svg>