<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1495" width="900" height="1495" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif"><title id="t">Modelo mental · Marketing estratégico versus operativo</title><desc id="d">Modelo mental de la clase 01.09: Marketing estratégico versus operativo. Método en 5 pasos; 8 conceptos; 4 señales de medición.</desc><rect x="0" y="0" width="900" height="1495" rx="14" fill="#ffffff"/><rect x="0" y="0" width="900" height="64" rx="14" fill="#6e5d20"/><rect x="0" y="40" width="900" height="24" fill="#6e5d20"/><text x="40" y="28" font-size="12" fill="#e5dcbc" font-weight="700" letter-spacing="1.6">MODELO MENTAL · CLASE 01.09 · PARTE 01</text><text x="40" y="52" font-size="21" fill="#ffffff" font-weight="700">Marketing estratégico versus operativo</text><text x="40" y="84" font-size="11.5" fill="#ac9339" font-weight="700" letter-spacing="1.4">MÉTODO PASO A PASO</text><path d="M66.0,159.0 V202.5 H158.5" fill="none" stroke="#ac9339" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="160.5,202.5 151.5,197.5 151.5,207.5" fill="#ac9339"/><path d="M188.5,232.0 V275.5 H281.0" fill="none" stroke="#ac9339" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="283.0,275.5 274.0,270.5 274.0,280.5" fill="#ac9339"/><path d="M311.0,305.0 V348.5 H403.5" fill="none" stroke="#ac9339" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="405.5,348.5 396.5,343.5 396.5,353.5" fill="#ac9339"/><path d="M433.5,378.0 V421.5 H526.0" fill="none" stroke="#ac9339" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="528.0,421.5 519.0,416.5 519.0,426.5" fill="#ac9339"/><rect x="40.0" y="100.0" width="330" height="59.0" rx="10" fill="#f7f3e2" stroke="#cebf8c" stroke-width="1.4"/><text x="54.0" y="122.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Formular el diagnóstico en una frase con</tspan><tspan x="54.0" dy="16.5">evidencia que lo respalde</tspan></text><circle cx="42.0" cy="102.0" r="14" fill="#6e5d20"/><text x="42.0" y="106.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><rect x="162.5" y="173.0" width="330" height="59.0" rx="10" fill="#f7f3e2" stroke="#cebf8c" stroke-width="1.4"/><text x="176.5" y="195.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="176.5">Declarar la política rectora y lo que se</tspan><tspan x="176.5" dy="16.5">descarta</tspan></text><circle cx="164.5" cy="175.0" r="14" fill="#6e5d20"/><text x="164.5" y="179.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><rect x="285.0" y="246.0" width="330" height="59.0" rx="10" fill="#f7f3e2" stroke="#cebf8c" stroke-width="1.4"/><text x="299.0" y="268.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="299.0">Derivar tres a cinco acciones coherentes con</tspan><tspan x="299.0" dy="16.5">esa política</tspan></text><circle cx="287.0" cy="248.0" r="14" fill="#6e5d20"/><text x="287.0" y="252.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><rect x="407.5" y="319.0" width="330" height="59.0" rx="10" fill="#f7f3e2" stroke="#cebf8c" stroke-width="1.4"/><text x="421.5" y="341.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="421.5">Asignar responsable, presupuesto y plazo a</tspan><tspan x="421.5" dy="16.5">cada acción</tspan></text><circle cx="409.5" cy="321.0" r="14" fill="#6e5d20"/><text x="409.5" y="325.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">4</text><rect x="530.0" y="392.0" width="330" height="59.0" rx="10" fill="#f7f3e2" stroke="#cebf8c" stroke-width="1.4"/><text x="544.0" y="414.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="544.0">Fijar la revisión que confirmaría o</tspan><tspan x="544.0" dy="16.5">refutaría el diagnóstico</tspan></text><circle cx="532.0" cy="394.0" r="14" fill="#6e5d20"/><text x="532.0" y="398.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">5</text><text x="40" y="493.0" font-size="11.5" fill="#ac9339" font-weight="700" letter-spacing="1.4">CONCEPTOS Y DÓNDE ACTÚAN EN EL MÉTODO</text><rect x="40.0" y="507.0" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#cebf8c" stroke-width="1.4"/><rect x="40.0" y="515.0" width="5" height="62.2" rx="2" fill="#ac9339"/><text x="56.0" y="529.0" font-size="13.5" fill="#6e5d20" font-weight="700" text-anchor="start"><tspan x="56.0">Diagnóstico</tspan></text><text x="56.0" y="548.8" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Explicación del obstáculo principal que enfrenta la</tspan><tspan x="56.0" dy="15.2">empresa, con evidencia</tspan></text><rect x="379.0" y="515.0" width="54" height="20" rx="10" fill="#e5dcbc" stroke="#cebf8c" stroke-width="1"/><text x="406.0" y="529.0" font-size="11" fill="#6e5d20" font-weight="700" text-anchor="middle">↔ 1, 5</text><rect x="459.0" y="507.0" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#cebf8c" stroke-width="1.4"/><rect x="459.0" y="515.0" width="5" height="62.2" rx="2" fill="#ac9339"/><text x="475.0" y="529.0" font-size="13.5" fill="#6e5d20" font-weight="700" text-anchor="start"><tspan x="475.0">Política rectora</tspan></text><text x="475.0" y="548.8" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Elección general que orienta la acción y descarta</tspan><tspan x="475.0" dy="15.2">explícitamente otras opciones</tspan></text><rect x="798.0" y="515.0" width="54" height="20" rx="10" fill="#e5dcbc" stroke="#cebf8c" stroke-width="1"/><text x="825.0" y="529.0" font-size="11" fill="#6e5d20" font-weight="700" text-anchor="middle">↔ 2, 3</text><rect x="40.0" y="599.2" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#cebf8c" stroke-width="1.4"/><rect x="40.0" y="607.2" width="5" height="62.2" rx="2" fill="#ac9339"/><text x="56.0" y="621.2" font-size="13.5" fill="#6e5d20" font-weight="700" text-anchor="start"><tspan x="56.0">Plan operativo</tspan></text><text x="56.0" y="641.0" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Conjunto de acciones, responsables, plazos y presupuestos</tspan><tspan x="56.0" dy="15.2">coherentes con la política</tspan></text><rect x="379.0" y="607.2" width="54" height="20" rx="10" fill="#e5dcbc" stroke="#cebf8c" stroke-width="1"/><text x="406.0" y="621.2" font-size="11" fill="#6e5d20" font-weight="700" text-anchor="middle">↔ 3, 4</text><rect x="459.0" y="599.2" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#cebf8c" stroke-width="1.4"/><rect x="459.0" y="607.2" width="5" height="62.2" rx="2" fill="#ac9339"/><text x="475.0" y="621.2" font-size="13.5" fill="#6e5d20" font-weight="700" text-anchor="start"><tspan x="475.0">Coherencia de acciones</tspan></text><text x="475.0" y="641.0" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Grado en que las actividades se refuerzan entre sí en</tspan><tspan x="475.0" dy="15.2">lugar de competir por recursos</tspan></text><rect x="798.0" y="607.2" width="54" height="20" rx="10" fill="#e5dcbc" stroke="#cebf8c" stroke-width="1"/><text x="825.0" y="621.2" font-size="11" fill="#6e5d20" font-weight="700" text-anchor="middle">↔ 3, 4</text><rect x="40.0" y="691.4" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#cebf8c" stroke-width="1.4"/><rect x="40.0" y="699.4" width="5" height="62.2" rx="2" fill="#ac9339"/><text x="56.0" y="713.4" font-size="13.5" fill="#6e5d20" font-weight="700" text-anchor="start"><tspan x="56.0">Orientación de marketing</tspan></text><text x="56.0" y="733.2" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Lógica dominante que prioriza producto, cliente, relación,</tspan><tspan x="56.0" dy="15.2">datos o automatización al decidir</tspan></text><rect x="459.0" y="691.4" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#cebf8c" stroke-width="1.4"/><rect x="459.0" y="699.4" width="5" height="62.2" rx="2" fill="#ac9339"/><text x="475.0" y="713.4" font-size="13.5" fill="#6e5d20" font-weight="700" text-anchor="start"><tspan x="475.0">Marketing mix 7P</tspan></text><text x="475.0" y="733.2" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Decisiones coordinadas sobre producto, precio, plaza,</tspan><tspan x="475.0" dy="15.2">promoción, personas, procesos y evidencia física</tspan></text><rect x="40.0" y="783.5" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#cebf8c" stroke-width="1.4"/><rect x="40.0" y="791.5" width="5" height="62.2" rx="2" fill="#ac9339"/><text x="56.0" y="805.5" font-size="13.5" fill="#6e5d20" font-weight="700" text-anchor="start"><tspan x="56.0">Omnicanalidad</tspan></text><text x="56.0" y="825.4" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Diseño coherente de información, identidad, contexto y</tspan><tspan x="56.0" dy="15.2">continuidad entre puntos de contacto</tspan></text><rect x="459.0" y="783.5" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#cebf8c" stroke-width="1.4"/><rect x="459.0" y="791.5" width="5" height="62.2" rx="2" fill="#ac9339"/><text x="475.0" y="805.5" font-size="13.5" fill="#6e5d20" font-weight="700" text-anchor="start"><tspan x="475.0">Alineación marketing–ventas</tspan></text><text x="475.0" y="825.4" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Acuerdo operativo sobre segmento, definiciones, traspasos,</tspan><tspan x="475.0" dy="15.2">capacidad, feedback y resultados</tspan></text><text x="40" y="893.7200000000003" font-size="11.5" fill="#ac9339" font-weight="700" letter-spacing="1.4">QUÉ SE MIDE: NUMERADOR SOBRE DENOMINADOR</text><rect x="40.0" y="907.7" width="261.3" height="153.0" rx="8" fill="#f7f3e2" stroke="#cebf8c" stroke-width="1.4"/><text x="54.0" y="929.7" font-size="13" fill="#6e5d20" font-weight="700" text-anchor="start"><tspan x="54.0">Proporción de presupuesto</tspan><tspan x="54.0" dy="17.2">alineado</tspan></text><text x="54.0" y="976.0" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Gasto de marketing asignado a</tspan><tspan x="54.0" dy="15.2">acciones derivadas de la política</tspan><tspan x="54.0" dy="15.2">rectora</tspan></text><line x1="54.0" y1="1027.6" x2="287.3" y2="1027.6" stroke="#ac9339" stroke-width="2"/><text x="54.0" y="1045.6" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="54.0">Gasto total</tspan></text><rect x="319.3" y="907.7" width="261.3" height="153.0" rx="8" fill="#f7f3e2" stroke="#cebf8c" stroke-width="1.4"/><text x="333.3" y="929.7" font-size="13" fill="#6e5d20" font-weight="700" text-anchor="start"><tspan x="333.3">Acciones activas sin dueño</tspan></text><text x="333.3" y="958.9" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="333.3">Iniciativas en ejecución sin</tspan><tspan x="333.3" dy="15.2">responsable nombrado</tspan></text><line x1="333.3" y1="995.2" x2="566.7" y2="995.2" stroke="#ac9339" stroke-width="2"/><text x="333.3" y="1013.2" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="333.3">Total de iniciativas</tspan></text><rect x="598.7" y="907.7" width="261.3" height="153.0" rx="8" fill="#f7f3e2" stroke="#cebf8c" stroke-width="1.4"/><text x="612.7" y="929.7" font-size="13" fill="#6e5d20" font-weight="700" text-anchor="start"><tspan x="612.7">Tiempo entre decisión y</tspan><tspan x="612.7" dy="17.2">ejecución</tspan></text><text x="612.7" y="976.0" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="612.7">Días entre la aprobación de una</tspan><tspan x="612.7" dy="15.2">acción y su primera evidencia en el</tspan><tspan x="612.7" dy="15.2">mercado</tspan></text><rect x="40.0" y="1074.8" width="261.3" height="142.6" rx="8" fill="#f7f3e2" stroke="#cebf8c" stroke-width="1.4"/><text x="54.0" y="1096.8" font-size="13" fill="#6e5d20" font-weight="700" text-anchor="start"><tspan x="54.0">Conversión aceptada por ventas</tspan></text><text x="54.0" y="1125.9" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Oportunidades aceptadas que cumplen</tspan><tspan x="54.0" dy="15.2">criterios</tspan></text><line x1="54.0" y1="1162.3" x2="287.3" y2="1162.3" stroke="#ac9339" stroke-width="2"/><text x="54.0" y="1180.3" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="54.0">Traspasos realizados por marketing</tspan></text><text x="54.0" y="1209.5" font-size="10.5" fill="#7b8794" font-weight="400" text-anchor="start"><tspan x="54.0">Ventana: mes calendario por segmento</tspan></text><text x="40" y="1251.3200000000002" font-size="11.5" fill="#ac9339" font-weight="700" letter-spacing="1.4">FRONTERA DE APLICACIÓN</text><rect x="40" y="1261.3" width="820" height="81.5" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.4"/><polygon points="70,1287.0700000000002 52,1316.0700000000002 88,1316.0700000000002" fill="#c2410c"/><text x="70" y="1313.0700000000002" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">!</text><text x="106" y="1285.3" font-size="12.5" fill="#7c2d12" font-weight="400" text-anchor="start"><tspan x="106">Una buena estrategia mal ejecutada rinde menos que una estrategia mediocre bien ejecutada de forma</tspan><tspan x="106" dy="16.5">sostenida. El objetivo no es un documento elegante sino una elección que el equipo pueda aplicar sin</tspan><tspan x="106" dy="16.5">consultar en cada decisión.</tspan></text><text x="40" y="1370.8200000000002" font-size="11.5" fill="#ac9339" font-weight="700" letter-spacing="1.4">ERROR FRECUENTE Y SU CORRECCIÓN</text><rect x="40" y="1380.8" width="380.0" height="77.0" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/><text x="54" y="1402.8" font-size="11" fill="#b91c1c" font-weight="700" text-anchor="start"><tspan x="54">Síntoma</tspan></text><text x="54" y="1420.8" font-size="12.5" fill="#7f1d1d" font-weight="400" text-anchor="start"><tspan x="54">Presentar una lista de actividades como estrategia</tspan></text><line x1="426.0" y1="1419.3" x2="469.0" y2="1419.3" stroke="#ac9339" stroke-width="2.6" stroke-linecap="round"/><polygon points="474.0,1419.3 465.9,1423.2 465.9,1415.4" fill="#ac9339"/><rect x="480.0" y="1380.8" width="380.0" height="77.0" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.4"/><text x="494.0" y="1402.8" font-size="11" fill="#15803d" font-weight="700" text-anchor="start"><tspan x="494.0">Corrección</tspan></text><text x="494.0" y="1420.8" font-size="12.5" fill="#14532d" font-weight="400" text-anchor="start"><tspan x="494.0">Exige que el documento nombre el obstáculo</tspan><tspan x="494.0" dy="16.5">principal y qué opciones quedan descartadas.</tspan></text></svg>