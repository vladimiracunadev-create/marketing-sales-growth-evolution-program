<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1302" width="900" height="1302" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif"><title id="t">Modelo mental · Estrategias de nicho</title><desc id="d">Modelo mental de la clase 04.07: Estrategias de nicho. Método en 5 pasos; 4 conceptos; 3 señales de medición.</desc><rect x="0" y="0" width="900" height="1302" rx="14" fill="#ffffff"/><rect x="0" y="0" width="900" height="64" rx="14" fill="#20646e"/><rect x="0" y="40" width="900" height="24" fill="#20646e"/><text x="40" y="28" font-size="12" fill="#bce0e5" font-weight="700" letter-spacing="1.6">MODELO MENTAL · CLASE 04.07 · PARTE 04</text><text x="40" y="52" font-size="21" fill="#ffffff" font-weight="700">Estrategias de nicho</text><text x="40" y="84" font-size="11.5" fill="#399cac" font-weight="700" letter-spacing="1.4">MÉTODO PASO A PASO</text><ellipse cx="450.0" cy="376.8" rx="330.0" ry="233.1" fill="none" stroke="#8cc5ce" stroke-width="2" stroke-dasharray="3 8" stroke-linecap="round"/><polygon points="653.8,193.3 636.3,190.4 641.2,180.8" fill="#399cac"/><polygon points="759.3,458.8 761.4,441.2 771.2,445.7" fill="#399cac"/><polygon points="439.0,609.9 455.9,604.4 455.9,615.3" fill="#399cac"/><polygon points="131.6,438.8 143.5,451.9 133.7,456.4" fill="#399cac"/><polygon points="265.8,183.2 253.2,195.8 248.3,186.1" fill="#399cac"/><circle cx="450.0" cy="376.8" r="100.0" fill="#bce0e5" stroke="#8cc5ce" stroke-width="1.6"/><text x="450.0" y="369.0" font-size="15" fill="#20646e" font-weight="700" text-anchor="middle"><tspan x="450.0">Estrategias de</tspan><tspan x="450.0" dy="19.8">nicho</tspan></text><rect x="361.0" y="106.0" width="178" height="75.5" rx="10" fill="#e2f5f7" stroke="#8cc5ce" stroke-width="1.4"/><text x="373.0" y="128.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="373.0">Elegir un nicho con</tspan><tspan x="373.0" dy="16.5">circulación interna de</tspan><tspan x="373.0" dy="16.5">referencias</tspan></text><circle cx="363.0" cy="108.0" r="14" fill="#20646e"/><text x="363.0" y="112.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><rect x="674.8" y="267.0" width="178" height="75.5" rx="10" fill="#e2f5f7" stroke="#8cc5ce" stroke-width="1.4"/><text x="686.8" y="289.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="686.8">Especializar oferta y</tspan><tspan x="686.8" dy="16.5">lenguaje para ese</tspan><tspan x="686.8" dy="16.5">grupo</tspan></text><circle cx="676.8" cy="269.0" r="14" fill="#20646e"/><text x="676.8" y="273.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><rect x="555.0" y="527.6" width="178" height="75.5" rx="10" fill="#e2f5f7" stroke="#8cc5ce" stroke-width="1.4"/><text x="567.0" y="549.6" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="567.0">Medir dominancia</tspan><tspan x="567.0" dy="16.5">relativa dentro del</tspan><tspan x="567.0" dy="16.5">nicho</tspan></text><circle cx="557.0" cy="529.6" r="14" fill="#20646e"/><text x="557.0" y="534.1" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><rect x="167.0" y="535.8" width="178" height="59.0" rx="10" fill="#e2f5f7" stroke="#8cc5ce" stroke-width="1.4"/><text x="179.0" y="557.8" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="179.0">Identificar las</tspan><tspan x="179.0" dy="16.5">adyacencias posibles</tspan></text><circle cx="169.0" cy="537.8" r="14" fill="#20646e"/><text x="169.0" y="542.3" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">4</text><rect x="47.2" y="267.0" width="178" height="75.5" rx="10" fill="#e2f5f7" stroke="#8cc5ce" stroke-width="1.4"/><text x="59.2" y="289.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="59.2">Definir la condición</tspan><tspan x="59.2" dy="16.5">que gatilla la</tspan><tspan x="59.2" dy="16.5">expansión</tspan></text><circle cx="49.2" cy="269.0" r="14" fill="#20646e"/><text x="49.2" y="273.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">5</text><text x="40" y="689.6" font-size="11.5" fill="#399cac" font-weight="700" letter-spacing="1.4">CONCEPTOS Y DÓNDE ACTÚAN EN EL MÉTODO</text><rect x="40.0" y="703.6" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#8cc5ce" stroke-width="1.4"/><rect x="40.0" y="711.6" width="5" height="62.2" rx="2" fill="#399cac"/><text x="56.0" y="725.6" font-size="13.5" fill="#20646e" font-weight="700" text-anchor="start"><tspan x="56.0">Nicho</tspan></text><text x="56.0" y="745.4" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Segmento estrecho con necesidades homogéneas y canales de</tspan><tspan x="56.0" dy="15.2">comunicación propios</tspan></text><rect x="379.0" y="711.6" width="54" height="20" rx="10" fill="#bce0e5" stroke="#8cc5ce" stroke-width="1"/><text x="406.0" y="725.6" font-size="11" fill="#20646e" font-weight="700" text-anchor="middle">↔ 1, 3</text><rect x="459.0" y="703.6" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#8cc5ce" stroke-width="1.4"/><rect x="459.0" y="711.6" width="5" height="62.2" rx="2" fill="#399cac"/><text x="475.0" y="725.6" font-size="13.5" fill="#20646e" font-weight="700" text-anchor="start"><tspan x="475.0">Beachhead</tspan></text><text x="475.0" y="745.4" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Nicho inicial elegido por su capacidad de generar</tspan><tspan x="475.0" dy="15.2">referencia hacia segmentos adyacentes</tspan></text><rect x="798.0" y="711.6" width="54" height="20" rx="10" fill="#bce0e5" stroke="#8cc5ce" stroke-width="1"/><text x="825.0" y="725.6" font-size="11" fill="#20646e" font-weight="700" text-anchor="middle">↔ 1</text><rect x="40.0" y="795.8" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#8cc5ce" stroke-width="1.4"/><rect x="40.0" y="803.8" width="5" height="62.2" rx="2" fill="#399cac"/><text x="56.0" y="817.8" font-size="13.5" fill="#20646e" font-weight="700" text-anchor="start"><tspan x="56.0">Dominancia en nicho</tspan></text><text x="56.0" y="837.6" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Posición de liderazgo reconocible dentro del grupo elegido</tspan></text><rect x="379.0" y="803.8" width="54" height="20" rx="10" fill="#bce0e5" stroke="#8cc5ce" stroke-width="1"/><text x="406.0" y="817.8" font-size="11" fill="#20646e" font-weight="700" text-anchor="middle">↔ 1, 3</text><rect x="459.0" y="795.8" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#8cc5ce" stroke-width="1.4"/><rect x="459.0" y="803.8" width="5" height="62.2" rx="2" fill="#399cac"/><text x="475.0" y="817.8" font-size="13.5" fill="#20646e" font-weight="700" text-anchor="start"><tspan x="475.0">Adyacencia</tspan></text><text x="475.0" y="837.6" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Segmento vecino al que se puede expandir aprovechando</tspan><tspan x="475.0" dy="15.2">reputación y producto existentes</tspan></text><rect x="798.0" y="803.8" width="54" height="20" rx="10" fill="#bce0e5" stroke="#8cc5ce" stroke-width="1"/><text x="825.0" y="817.8" font-size="11" fill="#20646e" font-weight="700" text-anchor="middle">↔ 4</text><text x="40" y="905.96" font-size="11.5" fill="#399cac" font-weight="700" letter-spacing="1.4">QUÉ SE MIDE: NUMERADOR SOBRE DENOMINADOR</text><rect x="40.0" y="920.0" width="261.3" height="120.7" rx="8" fill="#e2f5f7" stroke="#8cc5ce" stroke-width="1.4"/><text x="54.0" y="942.0" font-size="13" fill="#20646e" font-weight="700" text-anchor="start"><tspan x="54.0">Participación dentro del nicho</tspan></text><text x="54.0" y="971.1" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Clientes del nicho atendidos</tspan></text><line x1="54.0" y1="992.3" x2="287.3" y2="992.3" stroke="#399cac" 