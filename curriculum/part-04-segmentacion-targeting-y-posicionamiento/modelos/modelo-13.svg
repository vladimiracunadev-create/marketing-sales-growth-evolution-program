<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 924" width="900" height="924" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif"><title id="t">Modelo mental · Prueba de posicionamiento</title><desc id="d">Modelo mental de la clase 04.13: Prueba de posicionamiento. Método en 5 pasos; 4 conceptos; 3 señales de medición.</desc><rect x="0" y="0" width="900" height="924" rx="14" fill="#ffffff"/><rect x="0" y="0" width="900" height="64" rx="14" fill="#20646e"/><rect x="0" y="40" width="900" height="24" fill="#20646e"/><text x="40" y="28" font-size="12" fill="#bce0e5" font-weight="700" letter-spacing="1.6">MODELO MENTAL · CLASE 04.13 · PARTE 04</text><text x="40" y="52" font-size="21" fill="#ffffff" font-weight="700">Prueba de posicionamiento</text><text x="40" y="84" font-size="11.5" fill="#399cac" font-weight="700" letter-spacing="1.4">MÉTODO PASO A PASO</text><rect x="40.0" y="100" width="246.7" height="59.0" rx="10" fill="#e2f5f7" stroke="#8cc5ce" stroke-width="1.4"/><text x="54.0" y="122" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Definir qué debe entenderse,</tspan><tspan x="54.0" dy="16.5">recordarse y asociarse</tspan></text><circle cx="42.0" cy="102.0" r="14" fill="#20646e"/><text x="42.0" y="106.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><rect x="326.7" y="100" width="246.7" height="59.0" rx="10" fill="#e2f5f7" stroke="#8cc5ce" stroke-width="1.4"/><text x="340.7" y="122" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="340.7">Diseñar la prueba con</tspan><tspan x="340.7" dy="16.5">condiciones realistas</tspan></text><circle cx="328.7" cy="102.0" r="14" fill="#20646e"/><text x="328.7" y="106.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><rect x="613.3" y="100" width="246.7" height="59.0" rx="10" fill="#e2f5f7" stroke="#8cc5ce" stroke-width="1.4"/><text x="627.3" y="122" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="627.3">Ejecutar con muestra suficiente</tspan><tspan x="627.3" dy="16.5">del segmento</tspan></text><circle cx="615.3" cy="102.0" r="14" fill="#20646e"/><text x="615.3" y="106.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><rect x="613.3" y="197.0" width="246.7" height="59.0" rx="10" fill="#e2f5f7" stroke="#8cc5ce" stroke-width="1.4"/><text x="627.3" y="219.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="627.3">Analizar comprensión, recuerdo y</tspan><tspan x="627.3" dy="16.5">preferencia por separado</tspan></text><circle cx="615.3" cy="199.0" r="14" fill="#20646e"/><text x="615.3" y="203.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">4</text><rect x="326.7" y="197.0" width="246.7" height="59.0" rx="10" fill="#e2f5f7" stroke="#8cc5ce" stroke-width="1.4"/><text x="340.7" y="219.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="340.7">Decidir con criterio previo y</tspan><tspan x="340.7" dy="16.5">documentar el resultado</tspan></text><circle cx="328.7" cy="199.0" r="14" fill="#20646e"/><text x="328.7" y="203.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">5</text><line x1="289.7" y1="129.5" x2="318.7" y2="129.5" stroke="#399cac" stroke-width="2.2" stroke-linecap="round"/><polygon points="323.7,129.5 315.6,133.4 315.6,125.6" fill="#399cac"/><line x1="576.3" y1="129.5" x2="605.3" y2="129.5" stroke="#399cac" stroke-width="2.2" stroke-linecap="round"/><polygon points="610.3,129.5 602.2,133.4 602.2,125.6" fill="#399cac"/><line x1="736.7" y1="161.0" x2="736.7" y2="189.0" stroke="#399cac" stroke-width="2.2" stroke-linecap="round"/><polygon points="736.7,194.0 732.8,185.9 740.6,185.9" fill="#399cac"/><line x1="610.3" y1="226.5" x2="581.3" y2="226.5" stroke="#399cac" stroke-width="2.2" stroke-linecap="round"/><polygon points="576.3,226.5 584.4,222.6 584.4,230.4" fill="#399cac"/><text x="40" y="294.0" font-size="11.5" fill="#399cac" font-weight="700" letter-spacing="1.4">CONCEPTOS Y DÓNDE ACTÚAN EN EL MÉTODO</text><rect x="40.0" y="308.0" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#8cc5ce" stroke-width="1.4"/><rect x="40.0" y="316.0" width="5" height="62.2" rx="2" fill="#399cac"/><text x="56.0" y="330.0" font-size="13.5" fill="#20646e" font-weight="700" text-anchor="start"><tspan x="56.0">Prueba de comprensión</tspan></text><text x="56.0" y="349.8" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Verificación de que el destinatario puede explicar la</tspan><tspan x="56.0" dy="15.2">promesa con sus palabras</tspan></text><rect x="379.0" y="316.0" width="54" height="20" rx="10" fill="#bce0e5" stroke="#8cc5ce" stroke-width="1"/><text x="406.0" y="330.0" font-size="11" fill="#20646e" font-weight="700" text-anchor="middle">↔ 2, 4</text><rect x="459.0" y="308.0" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#8cc5ce" stroke-width="1.4"/><rect x="459.0" y="316.0" width="5" height="62.2" rx="2" fill="#399cac"/><text x="475.0" y="330.0" font-size="13.5" fill="#20646e" font-weight="700" text-anchor="start"><tspan x="475.0">Prueba de recuerdo</tspan></text><text x="475.0" y="349.8" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Medición de qué se retiene después de una exposición breve</tspan></text><rect x="798.0" y="316.0" width="54" height="20" rx="10" fill="#bce0e5" stroke="#8cc5ce" stroke-width="1"/><text x="825.0" y="330.0" font-size="11" fill="#20646e" font-weight="700" text-anchor="middle">↔ 2, 4</text><rect x="40.0" y="400.2" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#8cc5ce" stroke-width="1.4"/><rect x="40.0" y="408.2" width="5" height="62.2" rx="2" fill="#399cac"/><text x="56.0" y="422.2" font-size="13.5" fill="#20646e" font-weight="700" text-anchor="start"><tspan x="56.0">Prueba de preferencia</tspan></text><text x="56.0" y="442.0" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Comparación entre alternativas con la misma audiencia y</tspan><tspan x="56.0" dy="15.2">las mismas condiciones</tspan></text><rect x="379.0" y="408.2" width="54" height="20" rx="10" fill="#bce0e5" stroke="#8cc5ce" stroke-width="1"/><text x="406.0" y="422.2" font-size="11" fill="#20646e" font-weight="700" text-anchor="middle">↔ 2, 4</text><rect x="459.0" y="400.2" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#8cc5ce" stroke-width="1.4"/><rect x="459.0" y="408.2" width="5" height="62.2" rx="2" fill="#399cac"/><text x="475.0" y="422.2" font-size="13.5" fill="#20646e" font-weight="700" text-anchor="start"><tspan x="475.0">Validez ecológica</tspan></text><text x="475.0" y="442.0" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Grado en que la prueba se parece a la situación real de</tspan><tspan x="475.0" dy="15.2">exposición</tspan></text><text x="40" y="510.36" font-size="11.5" fill="#399cac" font-weight="700" letter-spacing="1.4">QUÉ SE MIDE: NUMERADOR SOBRE DENOMINADOR</text><rect x="40.0" y="524.4" width="261.3" height="137.9" rx="8" fill="#e2f5f7" stroke="#8cc5ce" stroke-width="1.4"/><text x="54.0" y="546.4" font-size="13" fill="#20646e" font-weight="700" text-anchor="start"><tspan x="54.0">Comprensión correcta</tspan></text><text x="54.0" y="575.5" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Personas que reformulan la promesa</tspan><tspan x="54.0" dy="15.2">sin error</tspan></text><line x1="54.0" y1="611.9" x2="287.3" y2="611.9" stroke="#399cac" stroke-width="2"/><text x="54.0" y="629.9" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="54.0">Personas expuestas</tspan></text><rect x="319.3" y="524.4" width="261.3" height="137.9" rx="8" fill="#e2f5f7" stroke="#8cc5ce" stroke-width="1.4"/><text x="333.3" y="546.4" font-size="13" fill="#20646e" font-weight="700" text-anchor="start"><tspan x="333.3">Recuerdo del beneficio central</tspan></text><text x="333.3" y="575.5" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="333.3">Personas que recuerdan el beneficio</tspan><tspan x="333.3" dy="15.2">tras 24 horas</tspan></text><line x1="333.3" y1="611.9" x2="566.7" y2="611.9" stroke="#399cac" stroke-width="2"/><text x="333.3" y="629.9" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="333.3">Expuestas</tspan></text><rect x="598.7" y="524.4" width="261.3" height="137.9" rx="8" fill="#e2f5f7" stroke="#8cc5ce" stroke-width="1.4"/><text x="612.7" y="546.4" font-size="13" fill="#20646e" font-weight="700" text-anchor="start"><tspan x="612.7">Preferencia declarada frente a</tspan><tspan x="612.7" dy="17.2">alternativa</tspan></text><text x="612.7" y="592.7" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="612.7">Proporción que elige la propuesta</tspan></text><line x1="612.7" y1="613.9" x2="846.0" y2="613.9" stroke="#399cac" stroke-width="2"/><text x="612.7" y="631.9" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="612.7">La alternativa, con intervalo</tspan><tspan x="612.7" dy="15.2">reportado</tspan></text><text x="40" y="696.22" font-size="11.5" fill="#399cac" font-weight="700" letter-spacing="1.4">FRONTERA DE APLICACIÓN</text><rect x="40" y="706.2" width="820" height="65.0" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.4"/><polygon points="70,723.72 52,752.72 88,752.72" fill="#c2410c"/><text x="70" y="749.72" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">!</text><text x="106" y="730.2" font-size="12.5" fill="#7c2d12" font-weight="400" text-anchor="start"><tspan x="106">Las pruebas de mensaje predicen comprensión y recuerdo, no ventas. La decisión final debe considerar</tspan><tspan x="106" dy="16.5">también el efecto sobre segmentos no incluidos en la prueba.</tspan></text><text x="40" y="799.22" font-size="11.5" fill="#399cac" font-weight="700" letter-spacing="1.4">ERROR FRECUENTE Y SU CORRECCIÓN</text><rect x="40" y="809.2" width="380.0" height="77.0" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/><text x="54" y="831.2" font-size="11" fill="#b91c1c" font-weight="700" text-anchor="start"><tspan x="54">Síntoma</tspan></text><text x="54" y="849.2" font-size="12.5" fill="#7f1d1d" font-weight="400" text-anchor="start"><tspan x="54">Elegir el mensaje por votación del equipo</tspan></text><line x1="426.0" y1="847.7" x2="469.0" y2="847.7" stroke="#399cac" stroke-width="2.6" stroke-linecap="round"/><polygon points="474.0,847.7 465.9,851.6 465.9,843.8" fill="#399cac"/><rect x="480.0" y="809.2" width="380.0" height="77.0" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.4"/><text x="494.0" y="831.2" font-size="11" fill="#15803d" font-weight="700" text-anchor="start"><tspan x="494.0">Corrección</tspan></text><text x="494.0" y="849.2" font-size="12.5" fill="#14532d" font-weight="400" text-anchor="start"><tspan x="494.0">Prueba con el segmento destinatario y decide por</tspan><tspan x="494.0" dy="16.5">comprensión y recuerdo, no por gusto interno.</tspan></text></svg>