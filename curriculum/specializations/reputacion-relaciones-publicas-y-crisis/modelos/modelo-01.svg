<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1400" width="900" height="1400" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif"><title id="t">Modelo mental · Identidad, imagen y capital reputacional</title><desc id="d">Modelo mental de la clase ESP.01: Identidad, imagen y capital reputacional. Método en 7 pasos; 7 conceptos; 0 señales de medición.</desc><rect x="0" y="0" width="900" height="1400" rx="14" fill="#ffffff"/><rect x="0" y="0" width="900" height="64" rx="14" fill="#406e20"/><rect x="0" y="40" width="900" height="24" fill="#406e20"/><text x="40" y="28" font-size="12" fill="#cde5bc" font-weight="700" letter-spacing="1.6">MODELO MENTAL · CLASE ESP.01 · ESPECIALIZACIÓN</text><text x="40" y="52" font-size="21" fill="#ffffff" font-weight="700">Identidad, imagen y capital reputacional</text><text x="40" y="84" font-size="11.5" fill="#69ac39" font-weight="700" letter-spacing="1.4">MÉTODO PASO A PASO</text><path d="M66.0,175.5 V227.2 H117.7" fill="none" stroke="#69ac39" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="119.7,227.2 110.7,222.2 110.7,232.2" fill="#69ac39"/><path d="M147.7,265.0 V316.8 H199.3" fill="none" stroke="#69ac39" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="201.3,316.8 192.3,311.8 192.3,321.8" fill="#69ac39"/><path d="M229.3,354.5 V406.2 H281.0" fill="none" stroke="#69ac39" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="283.0,406.2 274.0,401.2 274.0,411.2" fill="#69ac39"/><path d="M311.0,444.0 V495.8 H362.7" fill="none" stroke="#69ac39" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="364.7,495.8 355.7,490.8 355.7,500.8" fill="#69ac39"/><path d="M392.7,533.5 V585.2 H444.3" fill="none" stroke="#69ac39" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="446.3,585.2 437.3,580.2 437.3,590.2" fill="#69ac39"/><path d="M474.3,623.0 V674.8 H526.0" fill="none" stroke="#69ac39" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="528.0,674.8 519.0,669.8 519.0,679.8" fill="#69ac39"/><rect x="40.0" y="100.0" width="330" height="75.5" rx="10" fill="#ebf7e2" stroke="#a7ce8c" stroke-width="1.4"/><text x="54.0" y="122.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Listar los públicos clave y el tema sobre el</tspan><tspan x="54.0" dy="16.5">que decidirán confiar o no</tspan></text><circle cx="42.0" cy="102.0" r="14" fill="#406e20"/><text x="42.0" y="106.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><rect x="121.7" y="189.5" width="330" height="75.5" rx="10" fill="#ebf7e2" stroke="#a7ce8c" stroke-width="1.4"/><text x="135.7" y="211.5" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="135.7">Recoger la identidad declarada: cinco</tspan><tspan x="135.7" dy="16.5">palabras, tres promesas y los límites</tspan><tspan x="135.7" dy="16.5">explícitos</tspan></text><circle cx="123.7" cy="191.5" r="14" fill="#406e20"/><text x="123.7" y="196.0" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><rect x="203.3" y="279.0" width="330" height="75.5" rx="10" fill="#ebf7e2" stroke="#a7ce8c" stroke-width="1.4"/><text x="217.3" y="301.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="217.3">Recoger la imagen percibida de cada público</tspan><tspan x="217.3" dy="16.5">con la misma pregunta y la misma escala</tspan></text><circle cx="205.3" cy="281.0" r="14" fill="#406e20"/><text x="205.3" y="285.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><rect x="285.0" y="368.5" width="330" height="75.5" rx="10" fill="#ebf7e2" stroke="#a7ce8c" stroke-width="1.4"/><text x="299.0" y="390.5" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="299.0">Auditar cinco puntos de contacto reales y</tspan><tspan x="299.0" dy="16.5">registrar qué señal emite cada uno</tspan></text><circle cx="287.0" cy="370.5" r="14" fill="#406e20"/><text x="287.0" y="375.0" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">4</text><rect x="366.7" y="458.0" width="330" height="75.5" rx="10" fill="#ebf7e2" stroke="#a7ce8c" stroke-width="1.4"/><text x="380.7" y="480.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="380.7">Clasificar cada brecha como comunicación,</tspan><tspan x="380.7" dy="16.5">ejecución o expectativa</tspan></text><circle cx="368.7" cy="460.0" r="14" fill="#406e20"/><text x="368.7" y="464.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">5</text><rect x="448.3" y="547.5" width="330" height="75.5" rx="10" fill="#ebf7e2" stroke="#a7ce8c" stroke-width="1.4"/><text x="462.3" y="569.5" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="462.3">Priorizar por impacto sobre la confianza y</tspan><tspan x="462.3" dy="16.5">esfuerzo de corrección</tspan></text><circle cx="450.3" cy="549.5" r="14" fill="#406e20"/><text x="450.3" y="554.0" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">6</text><rect x="530.0" y="637.0" width="330" height="75.5" rx="10" fill="#ebf7e2" stroke="#a7ce8c" stroke-width="1.4"/><text x="544.0" y="659.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="544.0">Fijar indicadores con numerador, denominador</tspan><tspan x="544.0" dy="16.5">y ventana, responsable y criterio de</tspan><tspan x="544.0" dy="16.5">revisión</tspan></text><circle cx="532.0" cy="639.0" r="14" fill="#406e20"/><text x="532.0" y="643.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">7</text><text x="40" y="754.5" font-size="11.5" fill="#69ac39" font-weight="700" letter-spacing="1.4">CONCEPTOS Y DÓNDE ACTÚAN EN EL MÉTODO</text><rect x="40.0" y="768.5" width="401.0" height="93.4" rx="8" fill="#ffffff" stroke="#a7ce8c" stroke-width="1.4"/><rect x="40.0" y="776.5" width="5" height="77.4" rx="2" fill="#69ac39"/><text x="56.0" y="790.5" font-size="13.5" fill="#406e20" font-weight="700" text-anchor="start"><tspan x="56.0">Identidad</tspan></text><text x="56.0" y="810.3" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Lo que la organización o persona declara y decide ser:</tspan><tspan x="56.0" dy="15.2">valores, promesa, estilo y límites</tspan></text><rect x="379.0" y="776.5" width="54" height="20" rx="10" fill="#cde5bc" stroke="#a7ce8c" stroke-width="1"/><text x="406.0" y="790.5" font-size="11" fill="#406e20" font-weight="700" text-anchor="middle">↔ 2</text><rect x="459.0" y="768.5" width="401.0" height="93.4" rx="8" fill="#ffffff" stroke="#a7ce8c" stroke-width="1.4"/><rect x="459.0" y="776.5" width="5" height="77.4" rx="2" fill="#69ac39"/><text x="475.0" y="790.5" font-size="13.5" fill="#406e20" font-weight="700" text-anchor="start"><tspan x="475.0">Imagen</tspan></text><text x="475.0" y="810.3" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Lo que un público concreto percibe en un momento dado,</tspan><tspan x="475.0" dy="15.2">formado por señales que la organización no controla por</tspan><tspan x="475.0" dy="15.2">completo</tspan></text><rect x="798.0" y="776.5" width="54" height="20" rx="10" fill="#cde5bc" stroke="#a7ce8c" stroke-width="1"/><text x="825.0" y="790.5" font-size="11" fill="#406e20" font-weight="700" text-anchor="middle">↔ 3</text><rect x="40.0" y="875.9" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#a7ce8c" stroke-width="1.4"/><rect x="40.0" y="883.9" width="5" height="62.2" rx="2" fill="#69ac39"/><text x="56.0" y="897.9" font-size="13.5" fill="#406e20" font-weight="700" text-anchor="start"><tspan x="56.0">Reputación</tspan></text><text x="56.0" y="917.7" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Evaluación acumulada y comparativa de la conducta pasada y</tspan><tspan x="56.0" dy="15.2">las expectativas futuras ante cada público</tspan></text><rect x="459.0" y="875.9" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#a7ce8c" stroke-width="1.4"/><rect x="459.0" y="883.9" width="5" height="62.2" rx="2" fill="#69ac39"/><text x="475.0" y="897.9" font-size="13.5" fill="#406e20" font-weight="700" text-anchor="start"><tspan x="475.0">Legitimidad</tspan></text><text x="475.0" y="917.7" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Reconocimiento social de que la organización tiene derecho</tspan><tspan x="475.0" dy="15.2">a operar como lo hace</tspan></text><rect x="40.0" y="968.0" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#a7ce8c" stroke-width="1.4"/><rect x="40.0" y="976.0" width="5" height="62.2" rx="2" fill="#69ac39"/><text x="56.0" y="990.0" font-size="13.5" fill="#406e20" font-weight="700" text-anchor="start"><tspan x="56.0">Confianza</tspan></text><text x="56.0" y="1009.9" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Disposición a depender de otro asumiendo un riesgo, basada</tspan><tspan x="56.0" dy="15.2">en competencia, buena fe e integridad observadas</tspan></text><rect x="379.0" y="976.0" width="54" height="20" rx="10" fill="#cde5bc" stroke="#a7ce8c" stroke-width="1"/><text x="406.0" y="990.0" font-size="11" fill="#406e20" font-weight="700" text-anchor="middle">↔ 1, 6</text><rect x="459.0" y="968.0" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#a7ce8c" stroke-width="1.4"/><rect x="459.0" y="976.0" width="5" height="62.2" rx="2" fill="#69ac39"/><text x="475.0" y="990.0" font-size="13.5" fill="#406e20" font-weight="700" text-anchor="start"><tspan x="475.0">Capital reputacional</tspan></text><text x="475.0" y="1009.9" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Reserva de credibilidad que reduce el costo de ser creído</tspan><tspan x="475.0" dy="15.2">y amortigua el daño de un error</tspan></text><rect x="40.0" y="1060.2" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#a7ce8c" stroke-width="1.4"/><rect x="40.0" y="1068.2" width="5" height="62.2" rx="2" fill="#69ac39"/><text x="56.0" y="1082.2" font-size="13.5" fill="#406e20" font-weight="700" text-anchor="start"><tspan x="56.0">Brecha reputacional</tspan></text><text x="56.0" y="1102.0" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Distancia medible entre la identidad declarada y la imagen</tspan><tspan x="56.0" dy="15.2">percibida</tspan></text><rect x="379.0" y="1068.2" width="54" height="20" rx="10" fill="#cde5bc" stroke="#a7ce8c" stroke-width="1"/><text x="406.0" y="1082.2" font-size="11" fill="#406e20" font-weight="700" text-anchor="middle">↔ 2, 3, 5</text><text x="40" y="1172.4" font-size="11.5" fill="#69ac39" font-weight="700" letter-spacing="1.4">FRONTERA DE APLICACIÓN</text><rect x="40" y="1182.4" width="820" height="65.0" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.4"/><polygon points="70,1199.9 52,1228.9 88,1228.9" fill="#c2410c"/><text x="70" y="1225.9" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">!</text><text x="106" y="1206.4" font-size="12.5" fill="#7c2d12" font-weight="400" text-anchor="start"><tspan x="106">Riesgo reputacional: Reportar un único índice agregado oculta públicos que desconfían y retrasa la</tspan><tspan x="106" dy="16.5">detección de la crisis.</tspan></text><text x="40" y="1275.4" font-size="11.5" fill="#69ac39" font-weight="700" letter-spacing="1.4">ERROR FRECUENTE Y SU CORRECCIÓN</text><rect x="40" y="1285.4" width="380.0" height="77.0" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/><text x="54" y="1307.4" font-size="11" fill="#b91c1c" font-weight="700" text-anchor="start"><tspan x="54">Síntoma</tspan></text><text x="54" y="1325.4" font-size="12.5" fill="#7f1d1d" font-weight="400" text-anchor="start"><tspan x="54">Tratar la reputación como un puntaje único</tspan></text><line x1="426.0" y1="1323.9" x2="469.0" y2="1323.9" stroke="#69ac39" stroke-width="2.6" stroke-linecap="round"/><polygon points="474.0,1323.9 465.9,1327.8 465.9,1320.0" fill="#69ac39"/><rect x="480.0" y="1285.4" width="380.0" height="77.0" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.4"/><text x="494.0" y="1307.4" font-size="11" fill="#15803d" font-weight="700" text-anchor="start"><tspan x="494.0">Corrección</tspan></text><text x="494.0" y="1325.4" font-size="12.5" fill="#14532d" font-weight="400" text-anchor="start"><tspan x="494.0">Gestiona por público y por tema; un promedio oculta</tspan><tspan x="494.0" dy="16.5">a quienes desconfían.</tspan></text></svg>
