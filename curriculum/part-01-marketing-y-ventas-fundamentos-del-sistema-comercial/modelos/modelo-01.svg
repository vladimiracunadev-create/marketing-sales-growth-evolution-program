<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1418" width="900" height="1418" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif"><title id="t">Modelo mental · Marketing, ventas y crecimiento como sistema</title><desc id="d">Modelo mental de la clase 01.01: Marketing, ventas y crecimiento como sistema. Método en 5 pasos; 4 conceptos; 3 señales de medición.</desc><rect x="0" y="0" width="900" height="1418" rx="14" fill="#ffffff"/><rect x="0" y="0" width="900" height="64" rx="14" fill="#6e5d20"/><rect x="0" y="40" width="900" height="24" fill="#6e5d20"/><text x="40" y="28" font-size="12" fill="#e5dcbc" font-weight="700" letter-spacing="1.6">MODELO MENTAL · CLASE 01.01 · PARTE 01</text><text x="40" y="52" font-size="21" fill="#ffffff" font-weight="700">Marketing, ventas y crecimiento como sistema</text><text x="40" y="84" font-size="11.5" fill="#ac9339" font-weight="700" letter-spacing="1.4">MÉTODO PASO A PASO</text><ellipse cx="450.0" cy="403.2" rx="330.0" ry="251.2" fill="none" stroke="#cebf8c" stroke-width="2" stroke-dasharray="3 8" stroke-linecap="round"/><polygon points="653.6,205.3 636.2,201.8 641.4,192.4" fill="#ac9339"/><polygon points="759.5,490.9 761.2,473.3 771.1,477.5" fill="#ac9339"/><polygon points="439.0,654.4 455.9,649.0 455.9,659.8" fill="#ac9339"/><polygon points="131.8,470.7 143.4,484.1 133.5,488.4" fill="#ac9339"/><polygon points="265.7,194.7 253.5,207.6 248.3,198.1" fill="#ac9339"/><circle cx="450.0" cy="403.2" r="100.0" fill="#e5dcbc" stroke="#cebf8c" stroke-width="1.6"/><text x="450.0" y="385.5" font-size="15" fill="#6e5d20" font-weight="700" text-anchor="middle"><tspan x="450.0">Marketing, ventas y</tspan><tspan x="450.0" dy="19.8">crecimiento como</tspan><tspan x="450.0" dy="19.8">sistema</tspan></text><rect x="361.0" y="114.2" width="178" height="75.5" rx="10" fill="#f7f3e2" stroke="#cebf8c" stroke-width="1.4"/><text x="373.0" y="136.2" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="373.0">Dibujar el sistema</tspan><tspan x="373.0" dy="16.5">completo de atención a</tspan><tspan x="373.0" dy="16.5">renovación</tspan></text><circle cx="363.0" cy="116.2" r="14" fill="#6e5d20"/><text x="363.0" y="120.8" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><rect x="674.8" y="287.8" width="178" height="75.5" rx="10" fill="#f7f3e2" stroke="#cebf8c" stroke-width="1.4"/><text x="686.8" y="309.8" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="686.8">Medir volumen,</tspan><tspan x="686.8" dy="16.5">conversión y tiempo en</tspan><tspan x="686.8" dy="16.5">cada eslabón</tspan></text><circle cx="676.8" cy="289.8" r="14" fill="#6e5d20"/><text x="676.8" y="294.3" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><rect x="555.0" y="568.7" width="178" height="75.5" rx="10" fill="#f7f3e2" stroke="#cebf8c" stroke-width="1.4"/><text x="567.0" y="590.7" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="567.0">Identificar el eslabón</tspan><tspan x="567.0" dy="16.5">limitante con datos y</tspan><tspan x="567.0" dy="16.5">no con opinión</tspan></text><circle cx="557.0" cy="570.7" r="14" fill="#6e5d20"/><text x="557.0" y="575.2" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><rect x="167.0" y="568.7" width="178" height="75.5" rx="10" fill="#f7f3e2" stroke="#cebf8c" stroke-width="1.4"/><text x="179.0" y="590.7" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="179.0">Estimar el efecto de</tspan><tspan x="179.0" dy="16.5">mejorar ese eslabón</tspan><tspan x="179.0" dy="16.5">frente a mejorar otro</tspan></text><circle cx="169.0" cy="570.7" r="14" fill="#6e5d20"/><text x="169.0" y="575.2" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">4</text><rect x="47.2" y="279.6" width="178" height="92.0" rx="10" fill="#f7f3e2" stroke="#cebf8c" stroke-width="1.4"/><text x="59.2" y="301.6" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="59.2">Definir la</tspan><tspan x="59.2" dy="16.5">intervención, su costo</tspan><tspan x="59.2" dy="16.5">y la señal que la</tspan><tspan x="59.2" dy="16.5">validaría</tspan></text><circle cx="49.2" cy="281.6" r="14" fill="#6e5d20"/><text x="49.2" y="286.1" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">5</text><text x="40" y="742.4" font-size="11.5" fill="#ac9339" font-weight="700" letter-spacing="1.4">CONCEPTOS Y DÓNDE ACTÚAN EN EL MÉTODO</text><rect x="40.0" y="756.4" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#cebf8c" stroke-width="1.4"/><rect x="40.0" y="764.4" width="5" height="62.2" rx="2" fill="#ac9339"/><text x="56.0" y="778.4" font-size="13.5" fill="#6e5d20" font-weight="700" text-anchor="start"><tspan x="56.0">Sistema comercial</tspan></text><text x="56.0" y="798.2" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Conjunto de actividades, datos y decisiones que convierten</tspan><tspan x="56.0" dy="15.2">a un desconocido en un cliente rentable y recurrente</tspan></text><rect x="379.0" y="764.4" width="54" height="20" rx="10" fill="#e5dcbc" stroke="#cebf8c" stroke-width="1"/><text x="406.0" y="778.4" font-size="11" fill="#6e5d20" font-weight="700" text-anchor="middle">↔ 1</text><rect x="459.0" y="756.4" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#cebf8c" stroke-width="1.4"/><rect x="459.0" y="764.4" width="5" height="62.2" rx="2" fill="#ac9339"/><text x="475.0" y="778.4" font-size="13.5" fill="#6e5d20" font-weight="700" text-anchor="start"><tspan x="475.0">Eslabón limitante</tspan></text><text x="475.0" y="798.2" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">La etapa cuya capacidad o calidad determina el resultado</tspan><tspan x="475.0" dy="15.2">total, aunque las demás mejoren</tspan></text><rect x="798.0" y="764.4" width="54" height="20" rx="10" fill="#e5dcbc" stroke="#cebf8c" stroke-width="1"/><text x="825.0" y="778.4" font-size="11" fill="#6e5d20" font-weight="700" text-anchor="middle">↔ 2, 3, 4</text><rect x="40.0" y="848.6" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#cebf8c" stroke-width="1.4"/><rect x="40.0" y="856.6" width="5" height="62.2" rx="2" fill="#ac9339"/><text x="56.0" y="870.6" font-size="13.5" fill="#6e5d20" font-weight="700" text-anchor="start"><tspan x="56.0">Métrica local</tspan></text><text x="56.0" y="890.4" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Indicador que mide el desempeño de una etapa sin</tspan><tspan x="56.0" dy="15.2">considerar su efecto sobre las siguientes</tspan></text><rect x="459.0" y="848.6" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#cebf8c" stroke-width="1.4"/><rect x="459.0" y="856.6" width="5" height="62.2" rx="2" fill="#ac9339"/><text x="475.0" y="870.6" font-size="13.5" fill="#6e5d20" font-weight="700" text-anchor="start"><tspan x="475.0">Calidad del ingreso</tspan></text><text x="475.0" y="890.4" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Combinación de margen, permanencia y costo de servir que</tspan><tspan x="475.0" dy="15.2">distingue un peso vendido de otro</tspan></text><text x="40" y="958.76" font-size="11.5" fill="#ac9339" font-weight="700" letter-spacing="1.4">QUÉ SE MIDE: NUMERADOR SOBRE DENOMINADOR</text><rect x="40.0" y="972.8" width="261.3" height="151.1" rx="8" fill="#f7f3e2" stroke="#cebf8c" stroke-width="1.4"/><text x="54.0" y="994.8" font-size="13" fill="#6e5d20" font-weight="700" text-anchor="start"><tspan x="54.0">Conversión etapa a etapa</tspan></text><text x="54.0" y="1023.9" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Unidades que pasan de la etapa N a</tspan><tspan x="54.0" dy="15.2">la N+1</tspan></text><line x1="54.0" y1="1060.3" x2="287.3" y2="1060.3" stroke="#ac9339" stroke-width="2"/><text x="54.0" y="1078.3" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="54.0">Las que entraron a N, en ventana de</tspan><tspan x="54.0" dy="15.2">30 días y por cohorte de origen</tspan></text><rect x="319.3" y="972.8" width="261.3" height="151.1" rx="8" fill="#f7f3e2" stroke="#cebf8c" stroke-width="1.4"/><text x="333.3" y="994.8" font-size="13" fill="#6e5d20" font-weight="700" text-anchor="start"><tspan x="333.3">Ingreso neto retenido</tspan></text><text x="333.3" y="1023.9" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="333.3">Ingreso recurrente del mismo grupo</tspan><tspan x="333.3" dy="15.2">de clientes 12 meses después,</tspan><tspan x="333.3" dy="15.2">incluyendo bajas, contracciones y</tspan><tspan x="333.3" dy="15.2">expansiones,</tspan></text><line x1="333.3" y1="1090.6" x2="566.7" y2="1090.6" stroke="#ac9339" stroke-width="2"/><text x="333.3" y="1108.6" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="333.3">El ingreso inicial</tspan></text><rect x="598.7" y="972.8" width="261.3" height="151.1" rx="8" fill="#f7f3e2" stroke="#cebf8c" stroke-width="1.4"/><text x="612.7" y="994.8" font-size="13" fill="#6e5d20" font-weight="700" text-anchor="start"><tspan x="612.7">Costo por cliente ganado</tspan></text><text x="612.7" y="1023.9" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="612.7">Gasto total de marketing y ventas</tspan><tspan x="612.7" dy="15.2">del periodo, incluidos sueldos,</tspan></text><line x1="612.7" y1="1060.3" x2="846.0" y2="1060.3" stroke="#ac9339" stroke-width="2"/><text x="612.7" y="1078.3" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="612.7">Clientes nuevos del mismo periodo</tspan></text><text x="40" y="1157.82" font-size="11.5" fill="#ac9339" font-weight="700" letter-spacing="1.4">FRONTERA DE APLICACIÓN</text><rect x="40" y="1167.8" width="820" height="81.5" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.4"/><polygon points="70,1193.57 52,1222.57 88,1222.57" fill="#c2410c"/><text x="70" y="1219.57" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">!</text><text x="106" y="1191.8" font-size="12.5" fill="#7c2d12" font-weight="400" text-anchor="start"><tspan x="106">El pensamiento sistémico no reemplaza la ejecución: identificar el eslabón limitante sin capacidad de</tspan><tspan x="106" dy="16.5">intervenir en él sólo produce informes. Si el cuello está en producto u operaciones, la decisión correcta</tspan><tspan x="106" dy="16.5">puede ser comercial únicamente en su cronograma.</tspan></text><text x="40" y="1277.32" font-size="11.5" fill="#ac9339" font-weight="700" letter-spacing="1.4">ERROR FRECUENTE Y SU CORRECCIÓN</text><rect x="40" y="1287.3" width="380.0" height="93.5" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/><text x="54" y="1309.3" font-size="11" fill="#b91c1c" font-weight="700" text-anchor="start"><tspan x="54">Síntoma</tspan></text><text x="54" y="1327.3" font-size="12.5" fill="#7f1d1d" font-weight="400" text-anchor="start"><tspan x="54">Pedir más leads cuando el problema está en la</tspan><tspan x="54" dy="16.5">retención</tspan></text><line x1="426.0" y1="1334.1" x2="469.0" y2="1334.1" stroke="#ac9339" stroke-width="2.6" stroke-linecap="round"/><polygon points="474.0,1334.1 465.9,1338.0 465.9,1330.2" fill="#ac9339"/><rect x="480.0" y="1287.3" width="380.0" height="93.5" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.4"/><text x="494.0" y="1309.3" font-size="11" fill="#15803d" font-weight="700" text-anchor="start"><tspan x="494.0">Corrección</tspan></text><text x="494.0" y="1327.3" font-size="12.5" fill="#14532d" font-weight="400" text-anchor="start"><tspan x="494.0">Calcula el efecto de +20 % de leads frente a −20 %</tspan><tspan x="494.0" dy="16.5">de churn sobre el ingreso a 12 meses antes de</tspan><tspan x="494.0" dy="16.5">aprobar presupuesto.</tspan></text></svg>