<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 952" width="900" height="952" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif"><title id="t">Modelo mental · Lanzamientos</title><desc id="d">Modelo mental de la clase 22.09: Lanzamientos. Método en 5 pasos; 4 conceptos; 3 señales de medición.</desc><rect x="0" y="0" width="900" height="952" rx="14" fill="#ffffff"/><rect x="0" y="0" width="900" height="64" rx="14" fill="#6e205c"/><rect x="0" y="40" width="900" height="24" fill="#6e205c"/><text x="40" y="28" font-size="12" fill="#e5bcdc" font-weight="700" letter-spacing="1.6">MODELO MENTAL · CLASE 22.09 · PARTE 22</text><text x="40" y="52" font-size="21" fill="#ffffff" font-weight="700">Lanzamientos</text><text x="40" y="84" font-size="11.5" fill="#ac3991" font-weight="700" letter-spacing="1.4">MÉTODO PASO A PASO</text><line x1="450.0" y1="94.0" x2="450.0" y2="317.0" stroke="#ce8cbe" stroke-width="3" stroke-linecap="round"/><line x1="450.0" y1="121.2" x2="406.0" y2="121.2" stroke="#ce8cbe" stroke-width="2"/><rect x="56.0" y="100" width="350" height="42.5" rx="10" fill="#f7e2f2" stroke="#ce8cbe" stroke-width="1.4"/><text x="70.0" y="122" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="70.0">Definir el criterio de listeza interna</tspan></text><circle cx="450.0" cy="121.2" r="15" fill="#6e205c"/><text x="450.0" y="125.8" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><line x1="450.0" y1="159.2" x2="494.0" y2="159.2" stroke="#ce8cbe" stroke-width="2"/><rect x="494.0" y="138" width="350" height="42.5" rx="10" fill="#f7e2f2" stroke="#ce8cbe" stroke-width="1.4"/><text x="508.0" y="160" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="508.0">Preparar equipo, materiales y documentación</tspan></text><circle cx="450.0" cy="159.2" r="15" fill="#6e205c"/><text x="450.0" y="163.8" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><line x1="450.0" y1="197.2" x2="406.0" y2="197.2" stroke="#ce8cbe" stroke-width="2"/><rect x="56.0" y="176" width="350" height="42.5" rx="10" fill="#f7e2f2" stroke="#ce8cbe" stroke-width="1.4"/><text x="70.0" y="198" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="70.0">Verificar la listeza antes de comunicar</tspan></text><circle cx="450.0" cy="197.2" r="15" fill="#6e205c"/><text x="450.0" y="201.8" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><line x1="450.0" y1="243.5" x2="494.0" y2="243.5" stroke="#ce8cbe" stroke-width="2"/><rect x="494.0" y="214" width="350" height="59.0" rx="10" fill="#f7e2f2" stroke="#ce8cbe" stroke-width="1.4"/><text x="508.0" y="236" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="508.0">Escalar la comunicación según el nivel del</tspan><tspan x="508.0" dy="16.5">cambio</tspan></text><circle cx="450.0" cy="243.5" r="15" fill="#6e205c"/><text x="450.0" y="248.0" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">4</text><line x1="450.0" y1="281.5" x2="406.0" y2="281.5" stroke="#ce8cbe" stroke-width="2"/><rect x="56.0" y="252" width="350" height="59.0" rx="10" fill="#f7e2f2" stroke="#ce8cbe" stroke-width="1.4"/><text x="70.0" y="274" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="70.0">Medir adopción y problemas en las primeras</tspan><tspan x="70.0" dy="16.5">semanas</tspan></text><circle cx="450.0" cy="281.5" r="15" fill="#6e205c"/><text x="450.0" y="286.0" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">5</text><text x="40" y="353.0" font-size="11.5" fill="#ac3991" font-weight="700" letter-spacing="1.4">CONCEPTOS Y DÓNDE ACTÚAN EN EL MÉTODO</text><rect x="40.0" y="367.0" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#ce8cbe" stroke-width="1.4"/><rect x="40.0" y="375.0" width="5" height="62.2" rx="2" fill="#ac3991"/><text x="56.0" y="389.0" font-size="13.5" fill="#6e205c" font-weight="700" text-anchor="start"><tspan x="56.0">Preparación interna</tspan></text><text x="56.0" y="408.8" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Estado de listeza del equipo comercial, de soporte y de la</tspan><tspan x="56.0" dy="15.2">documentación</tspan></text><rect x="379.0" y="375.0" width="54" height="20" rx="10" fill="#e5bcdc" stroke="#ce8cbe" stroke-width="1"/><text x="406.0" y="389.0" font-size="11" fill="#6e205c" font-weight="700" text-anchor="middle">↔ 1, 2</text><rect x="459.0" y="367.0" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#ce8cbe" stroke-width="1.4"/><rect x="459.0" y="375.0" width="5" height="62.2" rx="2" fill="#ac3991"/><text x="475.0" y="389.0" font-size="13.5" fill="#6e205c" font-weight="700" text-anchor="start"><tspan x="475.0">Criterio de listeza</tspan></text><text x="475.0" y="408.8" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Condiciones verificables que deben cumplirse antes de</tspan><tspan x="475.0" dy="15.2">lanzar</tspan></text><rect x="798.0" y="375.0" width="54" height="20" rx="10" fill="#e5bcdc" stroke="#ce8cbe" stroke-width="1"/><text x="825.0" y="389.0" font-size="11" fill="#6e205c" font-weight="700" text-anchor="middle">↔ 1, 3</text><rect x="40.0" y="459.2" width="401.0" height="63.0" rx="8" fill="#ffffff" stroke="#ce8cbe" stroke-width="1.4"/><rect x="40.0" y="467.2" width="5" height="47.0" rx="2" fill="#ac3991"/><text x="56.0" y="481.2" font-size="13.5" fill="#6e205c" font-weight="700" text-anchor="start"><tspan x="56.0">Nivel de lanzamiento</tspan></text><text x="56.0" y="501.0" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Escala de la comunicación según la importancia del cambio</tspan></text><rect x="379.0" y="467.2" width="54" height="20" rx="10" fill="#e5bcdc" stroke="#ce8cbe" stroke-width="1"/><text x="406.0" y="481.2" font-size="11" fill="#6e205c" font-weight="700" text-anchor="middle">↔ 4</text><rect x="459.0" y="459.2" width="401.0" height="63.0" rx="8" fill="#ffffff" stroke="#ce8cbe" stroke-width="1.4"/><rect x="459.0" y="467.2" width="5" height="47.0" rx="2" fill="#ac3991"/><text x="475.0" y="481.2" font-size="13.5" fill="#6e205c" font-weight="700" text-anchor="start"><tspan x="475.0">Plan de reversión</tspan></text><text x="475.0" y="501.0" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Acción definida si el lanzamiento produce problemas graves</tspan></text><text x="40" y="554.1800000000001" font-size="11.5" fill="#ac3991" font-weight="700" letter-spacing="1.4">QUÉ SE MIDE: NUMERADOR SOBRE DENOMINADOR</text><rect x="40.0" y="568.2" width="261.3" height="122.7" rx="8" fill="#f7e2f2" stroke="#ce8cbe" stroke-width="1.4"/><text x="54.0" y="590.2" font-size="13" fill="#6e205c" font-weight="700" text-anchor="start"><tspan x="54.0">Listeza interna verificada</tspan></text><text x="54.0" y="619.3" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Criterios cumplidos antes del</tspan><tspan x="54.0" dy="15.2">lanzamiento</tspan></text><line x1="54.0" y1="655.7" x2="287.3" y2="655.7" stroke="#ac3991" stroke-width="2"/><text x="54.0" y="673.7" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="54.0">Criterios definidos</tspan></text><rect x="319.3" y="568.2" width="261.3" height="122.7" rx="8" fill="#f7e2f2" stroke="#ce8cbe" stroke-width="1.4"/><text x="333.3" y="590.2" font-size="13" fill="#6e205c" font-weight="700" text-anchor="start"><tspan x="333.3">Adopción en las primeras semanas</tspan></text><text x="333.3" y="619.3" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="333.3">Clientes que usan lo lanzado</tspan></text><line x1="333.3" y1="640.5" x2="566.7" y2="640.5" stroke="#ac3991" stroke-width="2"/><text x="333.3" y="658.5" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="333.3">Clientes elegibles</tspan></text><rect x="598.7" y="568.2" width="261.3" height="122.7" rx="8" fill="#f7e2f2" stroke="#ce8cbe" stroke-width="1.4"/><text x="612.7" y="590.2" font-size="13" fill="#6e205c" font-weight="700" text-anchor="start"><tspan x="612.7">Consultas de soporte por el</tspan><tspan x="612.7" dy="17.2">lanzamiento</tspan></text><text x="612.7" y="636.5" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="612.7">Tickets relacionados</tspan></text><line x1="612.7" y1="657.7" x2="846.0" y2="657.7" stroke="#ac3991" stroke-width="2"/><text x="612.7" y="675.7" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="612.7">Tickets totales del periodo</tspan></text><text x="40" y="724.8600000000001" font-size="11.5" fill="#ac3991" font-weight="700" letter-spacing="1.4">FRONTERA DE APLICACIÓN</text><rect x="40" y="734.9" width="820" height="65.0" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.4"/><polygon points="70,752.3600000000001 52,781.3600000000001 88,781.3600000000001" fill="#c2410c"/><text x="70" y="778.3600000000001" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">!</text><text x="106" y="758.9" font-size="12.5" fill="#7c2d12" font-weight="400" text-anchor="start"><tspan x="106">Esperar la listeza perfecta retrasa indefinidamente. El criterio debe distinguir lo indispensable de lo</tspan><tspan x="106" dy="16.5">deseable.</tspan></text><text x="40" y="827.8600000000001" font-size="11.5" fill="#ac3991" font-weight="700" letter-spacing="1.4">ERROR FRECUENTE Y SU CORRECCIÓN</text><rect x="40" y="837.9" width="380.0" height="77.0" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/><text x="54" y="859.9" font-size="11" fill="#b91c1c" font-weight="700" text-anchor="start"><tspan x="54">Síntoma</tspan></text><text x="54" y="877.9" font-size="12.5" fill="#7f1d1d" font-weight="400" text-anchor="start"><tspan x="54">Comunicar antes de preparar al equipo interno</tspan></text><line x1="426.0" y1="876.4" x2="469.0" y2="876.4" stroke="#ac3991" stroke-width="2.6" stroke-linecap="round"/><polygon points="474.0,876.4 465.9,880.3 465.9,872.4" fill="#ac3991"/><rect x="480.0" y="837.9" width="380.0" height="77.0" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.4"/><text x="494.0" y="859.9" font-size="11" fill="#15803d" font-weight="700" text-anchor="start"><tspan x="494.0">Corrección</tspan></text><text x="494.0" y="877.9" font-size="12.5" fill="#14532d" font-weight="400" text-anchor="start"><tspan x="494.0">Verifica los criterios de listeza interna antes de</tspan><tspan x="494.0" dy="16.5">activar cualquier comunicación externa.</tspan></text></svg>