<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1645" width="900" height="1645" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif"><title id="t">Modelo mental · Arquitectura de monetización</title><desc id="d">Modelo mental de la clase 07.14: Arquitectura de monetización. Método en 5 pasos; 8 conceptos; 4 señales de medición.</desc><rect x="0" y="0" width="900" height="1645" rx="14" fill="#ffffff"/><rect x="0" y="0" width="900" height="64" rx="14" fill="#6e2048"/><rect x="0" y="40" width="900" height="24" fill="#6e2048"/><text x="40" y="28" font-size="12" fill="#e5bcd1" font-weight="700" letter-spacing="1.6">MODELO MENTAL · CLASE 07.14 · PARTE 07</text><text x="40" y="52" font-size="21" fill="#ffffff" font-weight="700">Arquitectura de monetización</text><text x="40" y="84" font-size="11.5" fill="#ac3974" font-weight="700" letter-spacing="1.4">MÉTODO PASO A PASO</text><ellipse cx="450.0" cy="376.8" rx="330.0" ry="233.1" fill="none" stroke="#ce8cae" stroke-width="2" stroke-dasharray="3 8" stroke-linecap="round"/><polygon points="653.8,193.3 636.3,190.4 641.2,180.8" fill="#ac3974"/><polygon points="759.3,458.8 761.4,441.2 771.2,445.7" fill="#ac3974"/><polygon points="439.0,609.9 455.9,604.4 455.9,615.3" fill="#ac3974"/><polygon points="131.6,438.8 143.5,451.9 133.7,456.4" fill="#ac3974"/><polygon points="265.8,183.2 253.2,195.8 248.3,186.1" fill="#ac3974"/><circle cx="450.0" cy="376.8" r="100.0" fill="#e5bcd1" stroke="#ce8cae" stroke-width="1.6"/><text x="450.0" y="369.0" font-size="15" fill="#6e2048" font-weight="700" text-anchor="middle"><tspan x="450.0">Arquitectura de</tspan><tspan x="450.0" dy="19.8">monetización</tspan></text><rect x="361.0" y="106.0" width="178" height="75.5" rx="10" fill="#f7e2ed" stroke="#ce8cae" stroke-width="1.4"/><text x="373.0" y="128.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="373.0">Consolidar métrica de</tspan><tspan x="373.0" dy="16.5">cobro, planes y</tspan><tspan x="373.0" dy="16.5">barreras</tspan></text><circle cx="363.0" cy="108.0" r="14" fill="#6e2048"/><text x="363.0" y="112.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><rect x="674.8" y="275.3" width="178" height="59.0" rx="10" fill="#f7e2ed" stroke="#ce8cae" stroke-width="1.4"/><text x="686.8" y="297.3" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="686.8">Verificar economía</tspan><tspan x="686.8" dy="16.5">unitaria por plan</tspan></text><circle cx="676.8" cy="277.3" r="14" fill="#6e2048"/><text x="676.8" y="281.8" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><rect x="555.0" y="535.8" width="178" height="59.0" rx="10" fill="#f7e2ed" stroke="#ce8cae" stroke-width="1.4"/><text x="567.0" y="557.8" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="567.0">Documentar política de</tspan><tspan x="567.0" dy="16.5">descuentos y autoridad</tspan></text><circle cx="557.0" cy="537.8" r="14" fill="#6e2048"/><text x="557.0" y="542.3" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><rect x="167.0" y="535.8" width="178" height="59.0" rx="10" fill="#f7e2ed" stroke="#ce8cae" stroke-width="1.4"/><text x="179.0" y="557.8" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="179.0">Proyectar ingreso con</tspan><tspan x="179.0" dy="16.5">escenarios</tspan></text><circle cx="169.0" cy="537.8" r="14" fill="#6e2048"/><text x="169.0" y="542.3" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">4</text><rect x="47.2" y="275.3" width="178" height="59.0" rx="10" fill="#f7e2ed" stroke="#ce8cae" stroke-width="1.4"/><text x="59.2" y="297.3" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="59.2">Definir la revisión</tspan><tspan x="59.2" dy="16.5">periódica de precios</tspan></text><circle cx="49.2" cy="277.3" r="14" fill="#6e2048"/><text x="49.2" y="281.8" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">5</text><text x="40" y="689.6" font-size="11.5" fill="#ac3974" font-weight="700" letter-spacing="1.4">CONCEPTOS Y DÓNDE ACTÚAN EN EL MÉTODO</text><rect x="40.0" y="703.6" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#ce8cae" stroke-width="1.4"/><rect x="40.0" y="711.6" width="5" height="62.2" rx="2" fill="#ac3974"/><text x="56.0" y="725.6" font-size="13.5" fill="#6e2048" font-weight="700" text-anchor="start"><tspan x="56.0">Arquitectura de monetización</tspan></text><text x="56.0" y="745.4" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Sistema completo de decisiones de precio, estructura y</tspan><tspan x="56.0" dy="15.2">política</tspan></text><rect x="459.0" y="703.6" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#ce8cae" stroke-width="1.4"/><rect x="459.0" y="711.6" width="5" height="62.2" rx="2" fill="#ac3974"/><text x="475.0" y="725.6" font-size="13.5" fill="#6e2048" font-weight="700" text-anchor="start"><tspan x="475.0">Coherencia precio-valor</tspan></text><text x="475.0" y="745.4" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Correspondencia entre lo que se cobra y el valor que</tspan><tspan x="475.0" dy="15.2">percibe cada segmento</tspan></text><rect x="798.0" y="711.6" width="54" height="20" rx="10" fill="#e5bcd1" stroke="#ce8cae" stroke-width="1"/><text x="825.0" y="725.6" font-size="11" fill="#6e2048" font-weight="700" text-anchor="middle">↔ 5</text><rect x="40.0" y="795.8" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#ce8cae" stroke-width="1.4"/><rect x="40.0" y="803.8" width="5" height="62.2" rx="2" fill="#ac3974"/><text x="56.0" y="817.8" font-size="13.5" fill="#6e2048" font-weight="700" text-anchor="start"><tspan x="56.0">Gobierno de precios</tspan></text><text x="56.0" y="837.6" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Reglas de autoridad, revisión y excepción documentadas</tspan></text><rect x="379.0" y="803.8" width="54" height="20" rx="10" fill="#e5bcd1" stroke="#ce8cae" stroke-width="1"/><text x="406.0" y="817.8" font-size="11" fill="#6e2048" font-weight="700" text-anchor="middle">↔ 3, 5</text><rect x="459.0" y="795.8" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#ce8cae" stroke-width="1.4"/><rect x="459.0" y="803.8" width="5" height="62.2" rx="2" fill="#ac3974"/><text x="475.0" y="817.8" font-size="13.5" fill="#6e2048" font-weight="700" text-anchor="start"><tspan x="475.0">Proyección de ingreso</tspan></text><text x="475.0" y="837.6" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Estimación de ingreso futuro basada en la arquitectura y</tspan><tspan x="475.0" dy="15.2">sus supuestos</tspan></text><rect x="798.0" y="803.8" width="54" height="20" rx="10" fill="#e5bcd1" stroke="#ce8cae" stroke-width="1"/><text x="825.0" y="817.8" font-size="11" fill="#6e2048" font-weight="700" text-anchor="middle">↔ 4</text><rect x="40.0" y="888.0" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#ce8cae" stroke-width="1.4"/><rect x="40.0" y="896.0" width="5" height="62.2" rx="2" fill="#ac3974"/><text x="56.0" y="910.0" font-size="13.5" fill="#6e2048" font-weight="700" text-anchor="start"><tspan x="56.0">Precio basado en valor</tspan></text><text x="56.0" y="929.8" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Precio establecido con evidencia de valor diferencial y</tspan><tspan x="56.0" dy="15.2">disposición a pagar dentro de una arquitectura sostenible</tspan></text><rect x="379.0" y="896.0" width="54" height="20" rx="10" fill="#e5bcd1" stroke="#ce8cae" stroke-width="1"/><text x="406.0" y="910.0" font-size="11" fill="#6e2048" font-weight="700" text-anchor="middle">↔ 5</text><rect x="459.0" y="888.0" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#ce8cae" stroke-width="1.4"/><rect x="459.0" y="896.0" width="5" height="62.2" rx="2" fill="#ac3974"/><text x="475.0" y="910.0" font-size="13.5" fill="#6e2048" font-weight="700" text-anchor="start"><tspan x="475.0">Revenue Management</tspan></text><text x="475.0" y="929.8" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Asignación de precio y capacidad por segmento, momento o</tspan><tspan x="475.0" dy="15.2">condición con reglas y controles</tspan></text><rect x="40.0" y="980.1" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#ce8cae" stroke-width="1.4"/><rect x="40.0" y="988.1" width="5" height="62.2" rx="2" fill="#ac3974"/><text x="56.0" y="1002.1" font-size="13.5" fill="#6e2048" font-weight="700" text-anchor="start"><tspan x="56.0">Unit economics</tspan></text><text x="56.0" y="1022.0" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Relación entre ingreso, costo variable, adquisición,</tspan><tspan x="56.0" dy="15.2">servicio, retención y recuperación a nivel de unidad</tspan></text><rect x="379.0" y="988.1" width="54" height="20" rx="10" fill="#e5bcd1" stroke="#ce8cae" stroke-width="1"/><text x="406.0" y="1002.1" font-size="11" fill="#6e2048" font-weight="700" text-anchor="middle">↔ 2</text><rect x="459.0" y="980.1" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#ce8cae" stroke-width="1.4"/><rect x="459.0" y="988.1" width="5" height="62.2" rx="2" fill="#ac3974"/><text x="475.0" y="1002.1" font-size="13.5" fill="#6e2048" font-weight="700" text-anchor="start"><tspan x="475.0">Rentabilidad segmentada</tspan></text><text x="475.0" y="1022.0" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Margen atribuible calculado por cliente, segmento o</tspan><tspan x="475.0" dy="15.2">producto con alcance de costos declarado</tspan></text><text x="40" y="1090.3200000000002" font-size="11.5" fill="#ac3974" font-weight="700" letter-spacing="1.4">QUÉ SE MIDE: NUMERADOR SOBRE DENOMINADOR</text><rect x="40.0" y="1104.3" width="261.3" height="105.5" rx="8" fill="#f7e2ed" stroke="#ce8cae" stroke-width="1.4"/><text x="54.0" y="1126.3" font-size="13" fill="#6e2048" font-weight="700" text-anchor="start"><tspan x="54.0">Margen por plan</tspan></text><text x="54.0" y="1155.5" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Margen de contribución por plan</tspan></text><line x1="54.0" y1="1176.7" x2="287.3" y2="1176.7" stroke="#ac3974" stroke-width="2"/><text x="54.0" y="1194.7" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="54.0">Ingreso del plan</tspan></text><rect x="319.3" y="1104.3" width="261.3" height="105.5" rx="8" fill="#f7e2ed" stroke="#ce8cae" stroke-width="1.4"/><text x="333.3" y="1126.3" font-size="13" fill="#6e2048" font-weight="700" text-anchor="start"><tspan x="333.3">Desviación de cotizaciones</tspan></text><text x="333.3" y="1155.5" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="333.3">Cotizaciones fuera de política</tspan></text><line x1="333.3" y1="1176.7" x2="566.7" y2="1176.7" stroke="#ac3974" stroke-width="2"/><text x="333.3" y="1194.7" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="333.3">Cotizaciones emitidas</tspan></text><rect x="598.7" y="1104.3" width="261.3" height="105.5" rx="8" fill="#f7e2ed" stroke="#ce8cae" stroke-width="1.4"/><text x="612.7" y="1126.3" font-size="13" fill="#6e2048" font-weight="700" text-anchor="start"><tspan x="612.7">Precisión de la proyección</tspan></text><text x="612.7" y="1155.5" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="612.7">Diferencia entre ingreso proyectado</tspan><tspan x="612.7" dy="15.2">y real, por trimestre</tspan></text><rect x="40.0" y="1223.8" width="261.3" height="159.7" rx="8" fill="#f7e2ed" stroke="#ce8cae" stroke-width="1.4"/><text x="54.0" y="1245.8" font-size="13" fill="#6e2048" font-weight="700" text-anchor="start"><tspan x="54.0">Margen de contribución por</tspan><tspan x="54.0" dy="17.2">segmento</tspan></text><text x="54.0" y="1292.2" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Ingreso neto menos costos variables</tspan><tspan x="54.0" dy="15.2">y de servicio atribuibles</tspan></text><line x1="54.0" y1="1328.5" x2="287.3" y2="1328.5" stroke="#ac3974" stroke-width="2"/><text x="54.0" y="1346.5" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="54.0">Ingreso neto del segmento</tspan></text><text x="54.0" y="1375.7" font-size="10.5" fill="#7b8794" font-weight="400" text-anchor="start"><tspan x="54.0">Ventana: mes y cohorte de 12 meses</tspan></text><text x="40" y="1417.5600000000002" font-size="11.5" fill="#ac3974" font-weight="700" letter-spacing="1.4">FRONTERA DE APLICACIÓN</text><rect x="40" y="1427.6" width="820" height="65.0" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.4"/><polygon points="70,1445.0600000000002 52,1474.0600000000002 88,1474.0600000000002" fill="#c2410c"/><text x="70" y="1471.0600000000002" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">!</text><text x="106" y="1451.6" font-size="12.5" fill="#7c2d12" font-weight="400" text-anchor="start"><tspan x="106">Una arquitectura de precios envejece con el producto y con el mercado. Sin una revisión anual programada,</tspan><tspan x="106" dy="16.5">la estructura queda desalineada del valor entregado.</tspan></text><text x="40" y="1520.5600000000002" font-size="11.5" fill="#ac3974" font-weight="700" letter-spacing="1.4">ERROR FRECUENTE Y SU CORRECCIÓN</text><rect x="40" y="1530.6" width="380.0" height="77.0" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/><text x="54" y="1552.6" font-size="11" fill="#b91c1c" font-weight="700" text-anchor="start"><tspan x="54">Síntoma</tspan></text><text x="54" y="1570.6" font-size="12.5" fill="#7f1d1d" font-weight="400" text-anchor="start"><tspan x="54">Operar sin política de precios escrita</tspan></text><line x1="426.0" y1="1569.1" x2="469.0" y2="1569.1" stroke="#ac3974" stroke-width="2.6" stroke-linecap="round"/><polygon points="474.0,1569.1 465.9,1573.0 465.9,1565.1" fill="#ac3974"/><rect x="480.0" y="1530.6" width="380.0" height="77.0" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.4"/><text x="494.0" y="1552.6" font-size="11" fill="#15803d" font-weight="700" text-anchor="start"><tspan x="494.0">Corrección</tspan></text><text x="494.0" y="1570.6" font-size="12.5" fill="#14532d" font-weight="400" text-anchor="start"><tspan x="494.0">Publica la política con niveles de autoridad y</tspan><tspan x="494.0" dy="16.5">audita mensualmente las excepciones.</tspan></text></svg>