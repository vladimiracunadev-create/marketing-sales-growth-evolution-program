name: Revisión de seguridad e higiene

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  higiene:
    name: Datos, secretos y dependencias
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verificar que no hay dependencias externas en los generadores
        run: |
          set -e
          prohibidos="requests|pandas|numpy|markdown|jinja2|flask|django|boto3|openai|anthropic"
          if grep -REn "^\s*(import|from)\s+($prohibidos)\b" tools/; then
            echo "Los generadores deben usar solo la biblioteca estandar."
            exit 1
          fi
          echo "Generadores sin dependencias externas."

      - name: Verificar que el sitio no carga recursos de terceros
        run: |
          set -e
          python tools/build_site.py --limpiar >/dev/null
          if grep -REn 'src="https?://|href="https?://[^"]*\.(css|js)' site/assets site/index.html; then
            echo "El sitio no debe cargar recursos externos."
            exit 1
          fi
          echo "Sitio autocontenido."

      - name: Buscar posibles secretos
        run: |
          set -e
          patron='(AKIA[0-9A-Z]{16}|-----BEGIN [A-Z ]*PRIVATE KEY-----|ghp_[A-Za-z0-9]{36}|sk-[A-Za-z0-9]{32,})'
          if grep -REn "$patron" --exclude-dir=.git --exclude-dir=site .; then
            echo "Posible secreto en el repositorio."
            exit 1
          fi
          echo "Sin secretos detectados."

      - name: Verificar que los datos son sintéticos
        run: |
          set -e
          if grep -REn '[0-9]{7,8}-[0-9kK]\b' datasets/ 2>/dev/null; then
            echo "Posible identificador personal chileno en datasets/."
            exit 1
          fi
          echo "Datos sin identificadores personales."

      - name: Comprobar declaración de licencia
        run: |
          test -f LICENSE
          grep -q "MIT" LICENSE
          echo "Licencia presente."

  enlaces-externos:
    name: Enlaces externos
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Revisar enlaces
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --max-concurrency 4
            --accept 200,206,301,302,403,429
            --exclude-path site
            --exclude-path curriculum
            "*.md" "docs/*.md"
          fail: false
