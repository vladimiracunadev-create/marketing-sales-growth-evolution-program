<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 966" width="900" height="966" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif"><title id="t">Modelo mental · Atribución básica</title><desc id="d">Modelo mental de la clase 12.11: Atribución básica. Método en 5 pasos; 4 conceptos; 3 señales de medición.</desc><rect x="0" y="0" width="900" height="966" rx="14" fill="#ffffff"/><rect x="0" y="0" width="900" height="64" rx="14" fill="#204f6e"/><rect x="0" y="40" width="900" height="24" fill="#204f6e"/><text x="40" y="28" font-size="12" fill="#bcd5e5" font-weight="700" letter-spacing="1.6">MODELO MENTAL · CLASE 12.11 · PARTE 12</text><text x="40" y="52" font-size="21" fill="#ffffff" font-weight="700">Atribución básica</text><text x="40" y="84" font-size="11.5" fill="#397eac" font-weight="700" letter-spacing="1.4">MÉTODO PASO A PASO</text><line x1="450.0" y1="94.0" x2="450.0" y2="317.0" stroke="#8cb3ce" stroke-width="3" stroke-linecap="round"/><line x1="450.0" y1="121.2" x2="406.0" y2="121.2" stroke="#8cb3ce" stroke-width="2"/><rect x="56.0" y="100" width="350" height="42.5" rx="10" fill="#e2eff7" stroke="#8cb3ce" stroke-width="1.4"/><text x="70.0" y="122" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="70.0">Documentar el modelo y la ventana utilizados</tspan></text><circle cx="450.0" cy="121.2" r="15" fill="#204f6e"/><text x="450.0" y="125.8" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><line x1="450.0" y1="159.2" x2="494.0" y2="159.2" stroke="#8cb3ce" stroke-width="2"/><rect x="494.0" y="138" width="350" height="42.5" rx="10" fill="#e2eff7" stroke="#8cb3ce" stroke-width="1.4"/><text x="508.0" y="160" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="508.0">Comparar resultados bajo dos modelos distintos</tspan></text><circle cx="450.0" cy="159.2" r="15" fill="#204f6e"/><text x="450.0" y="163.8" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><line x1="450.0" y1="205.5" x2="406.0" y2="205.5" stroke="#8cb3ce" stroke-width="2"/><rect x="56.0" y="176" width="350" height="59.0" rx="10" fill="#e2eff7" stroke="#8cb3ce" stroke-width="1.4"/><text x="70.0" y="198" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="70.0">Identificar los canales cuyo valor cambia según</tspan><tspan x="70.0" dy="16.5">el modelo</tspan></text><circle cx="450.0" cy="205.5" r="15" fill="#204f6e"/><text x="450.0" y="210.0" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><line x1="450.0" y1="243.5" x2="494.0" y2="243.5" stroke="#8cb3ce" stroke-width="2"/><rect x="494.0" y="214" width="350" height="59.0" rx="10" fill="#e2eff7" stroke="#8cb3ce" stroke-width="1.4"/><text x="508.0" y="236" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="508.0">Diseñar una prueba de incrementalidad para los</tspan><tspan x="508.0" dy="16.5">casos críticos</tspan></text><circle cx="450.0" cy="243.5" r="15" fill="#204f6e"/><text x="450.0" y="248.0" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">4</text><line x1="450.0" y1="281.5" x2="406.0" y2="281.5" stroke="#8cb3ce" stroke-width="2"/><rect x="56.0" y="252" width="350" height="59.0" rx="10" fill="#e2eff7" stroke="#8cb3ce" stroke-width="1.4"/><text x="70.0" y="274" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="70.0">Decidir presupuesto con evidencia causal donde</tspan><tspan x="70.0" dy="16.5">el monto lo justifique</tspan></text><circle cx="450.0" cy="281.5" r="15" fill="#204f6e"/><text x="450.0" y="286.0" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">5</text><text x="40" y="353.0" font-size="11.5" fill="#397eac" font-weight="700" letter-spacing="1.4">CONCEPTOS Y DÓNDE ACTÚAN EN EL MÉTODO</text><rect x="40.0" y="367.0" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#8cb3ce" stroke-width="1.4"/><rect x="40.0" y="375.0" width="5" height="62.2" rx="2" fill="#397eac"/><text x="56.0" y="389.0" font-size="13.5" fill="#204f6e" font-weight="700" text-anchor="start"><tspan x="56.0">Modelo de atribución</tspan></text><text x="56.0" y="408.8" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Regla convencional que reparte el crédito de la conversión</tspan><tspan x="56.0" dy="15.2">entre puntos de contacto</tspan></text><rect x="379.0" y="375.0" width="54" height="20" rx="10" fill="#bcd5e5" stroke="#8cb3ce" stroke-width="1"/><text x="406.0" y="389.0" font-size="11" fill="#204f6e" font-weight="700" text-anchor="middle">↔ 1, 2, 3</text><rect x="459.0" y="367.0" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#8cb3ce" stroke-width="1.4"/><rect x="459.0" y="375.0" width="5" height="62.2" rx="2" fill="#397eac"/><text x="475.0" y="389.0" font-size="13.5" fill="#204f6e" font-weight="700" text-anchor="start"><tspan x="475.0">Sesgo del último clic</tspan></text><text x="475.0" y="408.8" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Sobrevaloración del canal más cercano a la conversión</tspan></text><rect x="40.0" y="459.2" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#8cb3ce" stroke-width="1.4"/><rect x="40.0" y="467.2" width="5" height="62.2" rx="2" fill="#397eac"/><text x="56.0" y="481.2" font-size="13.5" fill="#204f6e" font-weight="700" text-anchor="start"><tspan x="56.0">Ventana de atribución</tspan></text><text x="56.0" y="501.0" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Periodo dentro del cual un contacto se considera</tspan><tspan x="56.0" dy="15.2">contribuyente</tspan></text><rect x="379.0" y="467.2" width="54" height="20" rx="10" fill="#bcd5e5" stroke="#8cb3ce" stroke-width="1"/><text x="406.0" y="481.2" font-size="11" fill="#204f6e" font-weight="700" text-anchor="middle">↔ 1</text><rect x="459.0" y="459.2" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#8cb3ce" stroke-width="1.4"/><rect x="459.0" y="467.2" width="5" height="62.2" rx="2" fill="#397eac"/><text x="475.0" y="481.2" font-size="13.5" fill="#204f6e" font-weight="700" text-anchor="start"><tspan x="475.0">Incrementalidad</tspan></text><text x="475.0" y="501.0" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Efecto causal real de un canal, estimado con grupo de</tspan><tspan x="475.0" dy="15.2">comparación</tspan></text><rect x="798.0" y="467.2" width="54" height="20" rx="10" fill="#bcd5e5" stroke="#8cb3ce" stroke-width="1"/><text x="825.0" y="481.2" font-size="11" fill="#204f6e" font-weight="700" text-anchor="middle">↔ 4</text><text x="40" y="569.36" font-size="11.5" fill="#397eac" font-weight="700" letter-spacing="1.4">QUÉ SE MIDE: NUMERADOR SOBRE DENOMINADOR</text><rect x="40.0" y="583.4" width="261.3" height="120.7" rx="8" fill="#e2eff7" stroke="#8cb3ce" stroke-width="1.4"/><text x="54.0" y="605.4" font-size="13" fill="#204f6e" font-weight="700" text-anchor="start"><tspan x="54.0">Diferencia de crédito entre</tspan><tspan x="54.0" dy="17.2">modelos</tspan></text><text x="54.0" y="651.7" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Variación del crédito asignado a</tspan><tspan x="54.0" dy="15.2">cada canal según el modelo aplicado</tspan></text><rect x="319.3" y="583.4" width="261.3" height="120.7" rx="8" fill="#e2eff7" stroke="#8cb3ce" stroke-width="1.4"/><text x="333.3" y="605.4" font-size="13" fill="#204f6e" font-weight="700" text-anchor="start"><tspan x="333.3">Cobertura de la atribución</tspan></text><text x="333.3" y="634.5" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="333.3">Conversiones con recorrido</tspan><tspan x="333.3" dy="15.2">registrado</tspan></text><line x1="333.3" y1="670.9" x2="566.7" y2="670.9" stroke="#397eac" stroke-width="2"/><text x="333.3" y="688.9" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="333.3">Conversiones totales</tspan></text><rect x="598.7" y="583.4" width="261.3" height="120.7" rx="8" fill="#e2eff7" stroke="#8cb3ce" stroke-width="1.4"/><text x="612.7" y="605.4" font-size="13" fill="#204f6e" font-weight="700" text-anchor="start"><tspan x="612.7">Resultado de pruebas de</tspan><tspan x="612.7" dy="17.2">incrementalidad</tspan></text><text x="612.7" y="651.7" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="612.7">Efecto causal estimado por canal,</tspan><tspan x="612.7" dy="15.2">con intervalo de confianza</tspan></text><text x="40" y="738.06" font-size="11.5" fill="#397eac" font-weight="700" letter-spacing="1.4">FRONTERA DE APLICACIÓN</text><rect x="40" y="748.1" width="820" height="65.0" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.4"/><polygon points="70,765.56 52,794.56 88,794.56" fill="#c2410c"/><text x="70" y="791.56" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">!</text><text x="106" y="772.1" font-size="12.5" fill="#7c2d12" font-weight="400" text-anchor="start"><tspan x="106">Ningún modelo de atribución establece causalidad. Con presupuestos pequeños, el costo de una prueba de</tspan><tspan x="106" dy="16.5">incrementalidad puede superar su beneficio.</tspan></text><text x="40" y="841.06" font-size="11.5" fill="#397eac" font-weight="700" letter-spacing="1.4">ERROR FRECUENTE Y SU CORRECCIÓN</text><rect x="40" y="851.1" width="380.0" height="77.0" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/><text x="54" y="873.1" font-size="11" fill="#b91c1c" font-weight="700" text-anchor="start"><tspan x="54">Síntoma</tspan></text><text x="54" y="891.1" font-size="12.5" fill="#7f1d1d" font-weight="400" text-anchor="start"><tspan x="54">Asignar presupuesto sólo por último clic</tspan></text><line x1="426.0" y1="889.6" x2="469.0" y2="889.6" stroke="#397eac" stroke-width="2.6" stroke-linecap="round"/><polygon points="474.0,889.6 465.9,893.5 465.9,885.6" fill="#397eac"/><rect x="480.0" y="851.1" width="380.0" height="77.0" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.4"/><text x="494.0" y="873.1" font-size="11" fill="#15803d" font-weight="700" text-anchor="start"><tspan x="494.0">Corrección</tspan></text><text x="494.0" y="891.1" font-size="12.5" fill="#14532d" font-weight="400" text-anchor="start"><tspan x="494.0">Compara al menos dos modelos y valida los canales</tspan><tspan x="494.0" dy="16.5">críticos con una prueba de incrementalidad.</tspan></text></svg>