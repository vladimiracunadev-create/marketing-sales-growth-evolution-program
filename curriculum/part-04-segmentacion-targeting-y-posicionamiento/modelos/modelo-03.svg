<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 951" width="900" height="951" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif"><title id="t">Modelo mental · Variables de segmentación B2B</title><desc id="d">Modelo mental de la clase 04.03: Variables de segmentación B2B. Método en 5 pasos; 4 conceptos; 3 señales de medición.</desc><rect x="0" y="0" width="900" height="951" rx="14" fill="#ffffff"/><rect x="0" y="0" width="900" height="64" rx="14" fill="#20646e"/><rect x="0" y="40" width="900" height="24" fill="#20646e"/><text x="40" y="28" font-size="12" fill="#bce0e5" font-weight="700" letter-spacing="1.6">MODELO MENTAL · CLASE 04.03 · PARTE 04</text><text x="40" y="52" font-size="21" fill="#ffffff" font-weight="700">Variables de segmentación B2B</text><text x="40" y="84" font-size="11.5" fill="#399cac" font-weight="700" letter-spacing="1.4">MÉTODO PASO A PASO</text><line x1="450.0" y1="94.0" x2="450.0" y2="300.5" stroke="#8cc5ce" stroke-width="3" stroke-linecap="round"/><line x1="450.0" y1="121.2" x2="406.0" y2="121.2" stroke="#8cc5ce" stroke-width="2"/><rect x="56.0" y="100" width="350" height="42.5" rx="10" fill="#e2f5f7" stroke="#8cc5ce" stroke-width="1.4"/><text x="70.0" y="122" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="70.0">Cruzar valor obtenible con costo de servir</tspan></text><circle cx="450.0" cy="121.2" r="15" fill="#20646e"/><text x="450.0" y="125.8" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><line x1="450.0" y1="167.5" x2="494.0" y2="167.5" stroke="#8cc5ce" stroke-width="2"/><rect x="494.0" y="138" width="350" height="59.0" rx="10" fill="#e2f5f7" stroke="#8cc5ce" stroke-width="1.4"/><text x="508.0" y="160" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="508.0">Verificar el cruce con datos de retención y</tspan><tspan x="508.0" dy="16.5">margen</tspan></text><circle cx="450.0" cy="167.5" r="15" fill="#20646e"/><text x="450.0" y="172.0" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><line x1="450.0" y1="205.5" x2="406.0" y2="205.5" stroke="#8cc5ce" stroke-width="2"/><rect x="56.0" y="176" width="350" height="59.0" rx="10" fill="#e2f5f7" stroke="#8cc5ce" stroke-width="1.4"/><text x="70.0" y="198" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="70.0">Nombrar segmentos por comportamiento y no por</tspan><tspan x="70.0" dy="16.5">rubro</tspan></text><circle cx="450.0" cy="205.5" r="15" fill="#20646e"/><text x="450.0" y="210.0" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><line x1="450.0" y1="235.2" x2="494.0" y2="235.2" stroke="#8cc5ce" stroke-width="2"/><rect x="494.0" y="214" width="350" height="42.5" rx="10" fill="#e2f5f7" stroke="#8cc5ce" stroke-width="1.4"/><text x="508.0" y="236" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="508.0">Definir tratamiento comercial por segmento</tspan></text><circle cx="450.0" cy="235.2" r="15" fill="#20646e"/><text x="450.0" y="239.8" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">4</text><line x1="450.0" y1="273.2" x2="406.0" y2="273.2" stroke="#8cc5ce" stroke-width="2"/><rect x="56.0" y="252" width="350" height="42.5" rx="10" fill="#e2f5f7" stroke="#8cc5ce" stroke-width="1.4"/><text x="70.0" y="274" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="70.0">Revisar el mapa cada semestre con datos nuevos</tspan></text><circle cx="450.0" cy="273.2" r="15" fill="#20646e"/><text x="450.0" y="277.8" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">5</text><text x="40" y="336.5" font-size="11.5" fill="#399cac" font-weight="700" letter-spacing="1.4">CONCEPTOS Y DÓNDE ACTÚAN EN EL MÉTODO</text><rect x="40.0" y="350.5" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#8cc5ce" stroke-width="1.4"/><rect x="40.0" y="358.5" width="5" height="62.2" rx="2" fill="#399cac"/><text x="56.0" y="372.5" font-size="13.5" fill="#20646e" font-weight="700" text-anchor="start"><tspan x="56.0">Variable firmográfica</tspan></text><text x="56.0" y="392.3" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Atributo objetivo de la organización como tamaño, rubro,</tspan><tspan x="56.0" dy="15.2">antigüedad o estructura</tspan></text><rect x="459.0" y="350.5" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#8cc5ce" stroke-width="1.4"/><rect x="459.0" y="358.5" width="5" height="62.2" rx="2" fill="#399cac"/><text x="475.0" y="372.5" font-size="13.5" fill="#20646e" font-weight="700" text-anchor="start"><tspan x="475.0">Variable operativa</tspan></text><text x="475.0" y="392.3" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Característica del funcionamiento del cliente que</tspan><tspan x="475.0" dy="15.2">condiciona el valor obtenible</tspan></text><rect x="798.0" y="358.5" width="54" height="20" rx="10" fill="#bce0e5" stroke="#8cc5ce" stroke-width="1"/><text x="825.0" y="372.5" font-size="11" fill="#20646e" font-weight="700" text-anchor="middle">↔ 1</text><rect x="40.0" y="442.7" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#8cc5ce" stroke-width="1.4"/><rect x="40.0" y="450.7" width="5" height="62.2" rx="2" fill="#399cac"/><text x="56.0" y="464.7" font-size="13.5" fill="#20646e" font-weight="700" text-anchor="start"><tspan x="56.0">Capacidad de absorción</tspan></text><text x="56.0" y="484.5" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Aptitud del cliente para implementar y sostener el uso de</tspan><tspan x="56.0" dy="15.2">la solución</tspan></text><rect x="459.0" y="442.7" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#8cc5ce" stroke-width="1.4"/><rect x="459.0" y="450.7" width="5" height="62.2" rx="2" fill="#399cac"/><text x="475.0" y="464.7" font-size="13.5" fill="#20646e" font-weight="700" text-anchor="start"><tspan x="475.0">Costo de servir</tspan></text><text x="475.0" y="484.5" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Recursos de implementación, soporte y gestión que consume</tspan><tspan x="475.0" dy="15.2">ese tipo de cliente</tspan></text><rect x="798.0" y="450.7" width="54" height="20" rx="10" fill="#bce0e5" stroke="#8cc5ce" stroke-width="1"/><text x="825.0" y="464.7" font-size="11" fill="#20646e" font-weight="700" text-anchor="middle">↔ 1</text><text x="40" y="552.86" font-size="11.5" fill="#399cac" font-weight="700" letter-spacing="1.4">QUÉ SE MIDE: NUMERADOR SOBRE DENOMINADOR</text><rect x="40.0" y="566.9" width="261.3" height="122.7" rx="8" fill="#e2f5f7" stroke="#8cc5ce" stroke-width="1.4"/><text x="54.0" y="588.9" font-size="13" fill="#20646e" font-weight="700" text-anchor="start"><tspan x="54.0">Margen por segmento</tspan></text><text x="54.0" y="618.0" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Ingreso menos costo de servir,</tspan></text><line x1="54.0" y1="639.2" x2="287.3" y2="639.2" stroke="#399cac" stroke-width="2"/><text x="54.0" y="657.2" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="54.0">Ingreso, calculado por segmento y</tspan><tspan x="54.0" dy="15.2">trimestre</tspan></text><rect x="319.3" y="566.9" width="261.3" height="122.7" rx="8" fill="#e2f5f7" stroke="#8cc5ce" stroke-width="1.4"/><text x="333.3" y="588.9" font-size="13" fill="#20646e" font-weight="700" text-anchor="start"><tspan x="333.3">Tiempo de implementación</tspan></text><text x="333.3" y="618.0" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="333.3">Días entre firma y puesta en marcha,</tspan><tspan x="333.3" dy="15.2">mediana por segmento</tspan></text><rect x="598.7" y="566.9" width="261.3" height="122.7" rx="8" fill="#e2f5f7" stroke="#8cc5ce" stroke-width="1.4"/><text x="612.7" y="588.9" font-size="13" fill="#20646e" font-weight="700" text-anchor="start"><tspan x="612.7">Retención a 12 meses por</tspan><tspan x="612.7" dy="17.2">segmento</tspan></text><text x="612.7" y="635.2" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="612.7">Cuentas activas al mes 12</tspan></text><line x1="612.7" y1="656.4" x2="846.0" y2="656.4" stroke="#399cac" stroke-width="2"/><text x="612.7" y="674.4" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="612.7">Cuentas incorporadas 12 meses antes</tspan></text><text x="40" y="723.54" font-size="11.5" fill="#399cac" font-weight="700" letter-spacing="1.4">FRONTERA DE APLICACIÓN</text><rect x="40" y="733.5" width="820" height="65.0" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.4"/><polygon points="70,751.04 52,780.04 88,780.04" fill="#c2410c"/><text x="70" y="777.04" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">!</text><text x="106" y="757.5" font-size="12.5" fill="#7c2d12" font-weight="400" text-anchor="start"><tspan x="106">Los datos firmográficos públicos suelen estar desactualizados. Antes de construir política sobre ellos,</tspan><tspan x="106" dy="16.5">verifica una muestra contra la realidad operativa del cliente.</tspan></text><text x="40" y="826.54" font-size="11.5" fill="#399cac" font-weight="700" letter-spacing="1.4">ERROR FRECUENTE Y SU CORRECCIÓN</text><rect x="40" y="836.5" width="380.0" height="77.0" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/><text x="54" y="858.5" font-size="11" fill="#b91c1c" font-weight="700" text-anchor="start"><tspan x="54">Síntoma</tspan></text><text x="54" y="876.5" font-size="12.5" fill="#7f1d1d" font-weight="400" text-anchor="start"><tspan x="54">Segmentar B2B sólo por rubro</tspan></text><line x1="426.0" y1="875.0" x2="469.0" y2="875.0" stroke="#399cac" stroke-width="2.6" stroke-linecap="round"/><polygon points="474.0,875.0 465.9,879.0 465.9,871.1" fill="#399cac"/><rect x="480.0" y="836.5" width="380.0" height="77.0" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.4"/><text x="494.0" y="858.5" font-size="11" fill="#15803d" font-weight="700" text-anchor="start"><tspan x="494.0">Corrección</tspan></text><text x="494.0" y="876.5" font-size="12.5" fill="#14532d" font-weight="400" text-anchor="start"><tspan x="494.0">Agrega capacidad de absorción y costo de servir</tspan><tspan x="494.0" dy="16.5">como ejes antes de definir el tratamiento.</tspan></text></svg>