cciones ejecutadas</tspan></text><line x1="333.3" y1="640.5" x2="566.7" y2="640.5" stroke="#ac7639" stroke-width="2"/><text x="333.3" y="658.5" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="333.3">Acciones acordadas en la revisión</tspan><tspan x="333.3" dy="15.2">anterior</tspan></text><rect x="598.7" y="568.2" width="261.3" height="137.9" rx="8" fill="#f7ede2" stroke="#ceaf8c" stroke-width="1.4"/><text x="612.7" y="590.2" font-size="13" fill="#6e4a20" font-weight="700" text-anchor="start"><tspan x="612.7">Riesgos detectados con</tspan><tspan x="612.7" dy="17.2">anticipación</tspan></text><text x="612.7" y="636.5" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="612.7">Negocios donde el riesgo se detectó</tspan><tspan x="612.7" dy="15.2">antes del cierre previsto</tspan></text><line x1="612.7" y1="672.9" x2="846.0" y2="672.9" stroke="#ac7639" stroke-width="2"/><text x="612.7" y="690.9" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="612.7">Negocios perdidos</tspan></text><text x="40" y="740.0400000000001" font-size="11.5" fill="#ac7639" font-weight="700" letter-spacing="1.4">FRONTERA DE APLICACIÓN</text><rect x="40" y="750.0" width="820" height="65.0" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.4"/><polygon points="70,767.5400000000001 52,796.5400000000001 88,796.5400000000001" fill="#c2410c"/><text x="70" y="793.5400000000001" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">!</text><text x="106" y="774.0" font-size="12.5" fill="#7c2d12" font-weight="400" text-anchor="start"><tspan x="106">Revisar todo el pipeline cada semana es imposible y contraproducente. La revisión debe concentrarse en los</tspan><tspan x="106" dy="16.5">negocios que concentran valor o riesgo.</tspan></text><text x="40" y="843.0400000000001" font-size="11.5" fill="#ac7639" font-weight="700" letter-spacing="1.4">ERROR FRECUENTE Y SU CORRECCIÓN</text><rect x="40" y="85