<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1056" width="900" height="1056" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif"><title id="t">Modelo mental · Desinformación, cuentas falsas, suplantación y deepfakes</title><desc id="d">Modelo mental de la clase ESP.09: Desinformación, cuentas falsas, suplantación y deepfakes. Método en 7 pasos; 7 conceptos; 0 señales de medición.</desc><rect x="0" y="0" width="900" height="1056" rx="14" fill="#ffffff"/><rect x="0" y="0" width="900" height="64" rx="14" fill="#406e20"/><rect x="0" y="40" width="900" height="24" fill="#406e20"/><text x="40" y="28" font-size="12" fill="#cde5bc" font-weight="700" letter-spacing="1.6">MODELO MENTAL · CLASE ESP.09 · ESPECIALIZACIÓN</text><text x="40" y="52" font-size="21" fill="#ffffff" font-weight="700">Desinformación, cuentas falsas, suplantación y deepfakes</text><text x="40" y="84" font-size="11.5" fill="#69ac39" font-weight="700" letter-spacing="1.4">MÉTODO PASO A PASO</text><line x1="450.0" y1="94.0" x2="450.0" y2="406.5" stroke="#a7ce8c" stroke-width="3" stroke-linecap="round"/><line x1="450.0" y1="129.5" x2="406.0" y2="129.5" stroke="#a7ce8c" stroke-width="2"/><rect x="56.0" y="100" width="350" height="59.0" rx="10" fill="#ebf7e2" stroke="#a7ce8c" stroke-width="1.4"/><text x="70.0" y="122" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="70.0">Preservar el contenido y su ruta de difusión</tspan><tspan x="70.0" dy="16.5">con fecha, enlace y cuenta</tspan></text><circle cx="450.0" cy="129.5" r="15" fill="#406e20"/><text x="450.0" y="134.0" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><line x1="450.0" y1="168.0" x2="494.0" y2="168.0" stroke="#a7ce8c" stroke-width="2"/><rect x="494.0" y="138" width="350" height="75.5" rx="10" fill="#ebf7e2" stroke="#a7ce8c" stroke-width="1.4"/><text x="508.0" y="160" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="508.0">Clasificar: información errónea, desinformación</tspan><tspan x="508.0" dy="16.5">o malinformación, con la evidencia de falsedad</tspan><tspan x="508.0" dy="16.5">e intención</tspan></text><circle cx="450.0" cy="168.0" r="15" fill="#406e20"/><text x="450.0" y="172.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><line x1="450.0" y1="205.5" x2="406.0" y2="205.5" stroke="#a7ce8c" stroke-width="2"/><rect x="56.0" y="176" width="350" height="59.0" rx="10" fill="#ebf7e2" stroke="#a7ce8c" stroke-width="1.4"/><text x="70.0" y="198" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="70.0">Verificar con la persona involucrada, registros</tspan><tspan x="70.0" dy="16.5">propios y una fuente independiente</tspan></text><circle cx="450.0" cy="205.5" r="15" fill="#406e20"/><text x="450.0" y="210.0" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><line x1="450.0" y1="257.0" x2="494.0" y2="257.0" stroke="#a7ce8c" stroke-width="2"/><rect x="494.0" y="227.5" width="350" height="59.0" rx="10" fill="#ebf7e2" stroke="#a7ce8c" stroke-width="1.4"/><text x="508.0" y="249.5" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="508.0">Evaluar indicios técnicos sin concluir más de</tspan><tspan x="508.0" dy="16.5">lo que muestran</tspan></text><circle cx="450.0" cy="257.0" r="15" fill="#406e20"/><text x="450.0" y="261.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">4</text><line x1="450.0" y1="295.0" x2="406.0" y2="295.0" stroke="#a7ce8c" stroke-width="2"/><rect x="56.0" y="265.5" width="350" height="59.0" rx="10" fill="#ebf7e2" stroke="#a7ce8c" stroke-width="1.4"/><text x="70.0" y="287.5" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="70.0">Contener: reportar a plataformas, avisar a</tspan><tspan x="70.0" dy="16.5">públicos expuestos y activar canales oficiales</tspan></text><circle cx="450.0" cy="295.0" r="15" fill="#406e20"/><text x="450.0" y="299.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">5</text><line x1="450.0" y1="333.0" x2="494.0" y2="333.0" stroke="#a7ce8c" stroke-width="2"/><rect x="494.0" y="303.5" width="350" height="59.0" rx="10" fill="#ebf7e2" stroke="#a7ce8c" stroke-width="1.4"/><text x="508.0" y="325.5" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="508.0">Redactar un desmentido breve que afirme lo</tspan><tspan x="508.0" dy="16.5">verdadero y no repita lo falso</tspan></text><circle cx="450.0" cy="333.0" r="15" fill="#406e20"/><text x="450.0" y="337.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">6</text><line x1="450.0" y1="371.0" x2="406.0" y2="371.0" stroke="#a7ce8c" stroke-width="2"/><rect x="56.0" y="341.5" width="350" height="59.0" rx="10" fill="#ebf7e2" stroke="#a7ce8c" stroke-width="1.4"/><text x="70.0" y="363.5" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="70.0">Evaluar acciones legales con asesoría y</tspan><tspan x="70.0" dy="16.5">documentar para la revisión posterior</tspan></text><circle cx="450.0" cy="371.0" r="15" fill="#406e20"/><text x="450.0" y="375.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">7</text><text x="40" y="442.5" font-size="11.5" fill="#69ac39" font-weight="700" letter-spacing="1.4">CONCEPTOS Y DÓNDE ACTÚAN EN EL MÉTODO</text><rect x="40.0" y="456.5" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#a7ce8c" stroke-width="1.4"/><rect x="40.0" y="464.5" width="5" height="62.2" rx="2" fill="#69ac39"/><text x="56.0" y="478.5" font-size="13.5" fill="#406e20" font-weight="700" text-anchor="start"><tspan x="56.0">Información errónea</tspan></text><text x="56.0" y="498.3" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Contenido falso compartido sin intención de causar daño</tspan></text><rect x="379.0" y="464.5" width="54" height="20" rx="10" fill="#cde5bc" stroke="#a7ce8c" stroke-width="1"/><text x="406.0" y="478.5" font-size="11" fill="#406e20" font-weight="700" text-anchor="middle">↔ 2</text><rect x="459.0" y="456.5" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#a7ce8c" stroke-width="1.4"/><rect x="459.0" y="464.5" width="5" height="62.2" rx="2" fill="#69ac39"/><text x="475.0" y="478.5" font-size="13.5" fill="#406e20" font-weight="700" text-anchor="start"><tspan x="475.0">Desinformación</tspan></text><text x="475.0" y="498.3" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Contenido falso creado o difundido deliberadamente para</tspan><tspan x="475.0" dy="15.2">dañar</tspan></text><rect x="798.0" y="464.5" width="54" height="20" rx="10" fill="#cde5bc" stroke="#a7ce8c" stroke-width="1"/><text x="825.0" y="478.5" font-size="11" fill="#406e20" font-weight="700" text-anchor="middle">↔ 2</text><rect x="40.0" y="548.7" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#a7ce8c" stroke-width="1.4"/><rect x="40.0" y="556.7" width="5" height="62.2" rx="2" fill="#69ac39"/><text x="56.0" y="570.7" font-size="13.5" fill="#406e20" font-weight="700" text-anchor="start"><tspan x="56.0">Malinformación</tspan></text><text x="56.0" y="590.5" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Información verdadera difundida para causar daño, como</tspan><tspan x="56.0" dy="15.2">datos privados filtrados</tspan></text><rect x="379.0" y="556.7" width="54" height="20" rx="10" fill="#cde5bc" stroke="#a7ce8c" stroke-width="1"/><text x="406.0" y="570.7" font-size="11" fill="#406e20" font-weight="700" text-anchor="middle">↔ 2</text><rect x="459.0" y="548.7" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#a7ce8c" stroke-width="1.4"/><rect x="459.0" y="556.7" width="5" height="62.2" rx="2" fill="#69ac39"/><text x="475.0" y="570.7" font-size="13.5" fill="#406e20" font-weight="700" text-anchor="start"><tspan x="475.0">Suplantación de identidad</tspan></text><text x="475.0" y="590.5" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Uso no autorizado del nombre, imagen, voz o cuenta de una</tspan><tspan x="475.0" dy="15.2">persona u organización</tspan></text><rect x="40.0" y="640.9" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#a7ce8c" stroke-width="1.4"/><rect x="40.0" y="648.9" width="5" height="62.2" rx="2" fill="#69ac39"/><text x="56.0" y="662.9" font-size="13.5" fill="#406e20" font-weight="700" text-anchor="start"><tspan x="56.0">Contenido sintético</tspan></text><text x="56.0" y="682.7" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Audio, imagen o video generado o alterado con IA que puede</tspan><tspan x="56.0" dy="15.2">aparentar hechos que no ocurrieron</tspan></text><rect x="379.0" y="648.9" width="54" height="20" rx="10" fill="#cde5bc" stroke="#a7ce8c" stroke-width="1"/><text x="406.0" y="662.9" font-size="11" fill="#406e20" font-weight="700" text-anchor="middle">↔ 1, 5</text><rect x="459.0" y="640.9" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#a7ce8c" stroke-width="1.4"/><rect x="459.0" y="648.9" width="5" height="62.2" rx="2" fill="#69ac39"/><text x="475.0" y="662.9" font-size="13.5" fill="#406e20" font-weight="700" text-anchor="start"><tspan x="475.0">Deepfake</tspan></text><text x="475.0" y="682.7" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Contenido sintético que imita el rostro o la voz de una</tspan><tspan x="475.0" dy="15.2">persona real</tspan></text><rect x="40.0" y="733.0" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#a7ce8c" stroke-width="1.4"/><rect x="40.0" y="741.0" width="5" height="62.2" rx="2" fill="#69ac39"/><text x="56.0" y="755.0" font-size="13.5" fill="#406e20" font-weight="700" text-anchor="start"><tspan x="56.0">Procedencia</tspan></text><text x="56.0" y="774.9" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Registro verificable del origen y de las modificaciones de</tspan><tspan x="56.0" dy="15.2">una pieza</tspan></text><rect x="379.0" y="741.0" width="54" height="20" rx="10" fill="#cde5bc" stroke="#a7ce8c" stroke-width="1"/><text x="406.0" y="755.0" font-size="11" fill="#406e20" font-weight="700" text-anchor="middle">↔ 3</text><text x="40" y="845.2200000000003" font-size="11.5" fill="#69ac39" font-weight="700" letter-spacing="1.4">FRONTERA DE APLICACIÓN</text><rect x="40" y="855.2" width="820" height="48.5" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.4"/><polygon points="70,864.4700000000003 52,893.4700000000003 88,893.4700000000003" fill="#c2410c"/><text x="70" y="890.4700000000003" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">!</text><text x="106" y="879.2" font-size="12.5" fill="#7c2d12" font-weight="400" text-anchor="start"><tspan x="106">Riesgo reputacional: Desmentir con ligereza o amplificar el falso agravan el problema.</tspan></text><text x="40" y="931.7200000000003" font-size="11.5" fill="#69ac39" font-weight="700" letter-spacing="1.4">ERROR FRECUENTE Y SU CORRECCIÓN</text><rect x="40" y="941.7" width="380.0" height="77.0" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/><text x="54" y="963.7" font-size="11" fill="#b91c1c" font-weight="700" text-anchor="start"><tspan x="54">Síntoma</tspan></text><text x="54" y="981.7" font-size="12.5" fill="#7f1d1d" font-weight="400" text-anchor="start"><tspan x="54">Desmentir sin verificar</tspan></text><line x1="426.0" y1="980.2" x2="469.0" y2="980.2" stroke="#69ac39" stroke-width="2.6" stroke-linecap="round"/><polygon points="474.0,980.2 465.9,984.1 465.9,976.3" fill="#69ac39"/><rect x="480.0" y="941.7" width="380.0" height="77.0" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.4"/><text x="494.0" y="963.7" font-size="11" fill="#15803d" font-weight="700" text-anchor="start"><tspan x="494.0">Corrección</tspan></text><text x="494.0" y="981.7" font-size="12.5" fill="#14532d" font-weight="400" text-anchor="start"><tspan x="494.0">Preservar, confirmar con fuente independiente y</tspan><tspan x="494.0" dy="16.5">luego hablar.</tspan></text></svg>
