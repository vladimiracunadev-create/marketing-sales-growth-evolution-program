<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1409" width="900" height="1409" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif"><title id="t">Modelo mental · Prevención, detección y contención de crisis</title><desc id="d">Modelo mental de la clase ESP.07: Prevención, detección y contención de crisis. Método en 7 pasos; 7 conceptos; 0 señales de medición.</desc><rect x="0" y="0" width="900" height="1409" rx="14" fill="#ffffff"/><rect x="0" y="0" width="900" height="64" rx="14" fill="#406e20"/><rect x="0" y="40" width="900" height="24" fill="#406e20"/><text x="40" y="28" font-size="12" fill="#cde5bc" font-weight="700" letter-spacing="1.6">MODELO MENTAL · CLASE ESP.07 · ESPECIALIZACIÓN</text><text x="40" y="52" font-size="21" fill="#ffffff" font-weight="700">Prevención, detección y contención de crisis</text><text x="40" y="84" font-size="11.5" fill="#69ac39" font-weight="700" letter-spacing="1.4">MÉTODO PASO A PASO</text><ellipse cx="450.0" cy="429.6" rx="330.0" ry="269.4" fill="none" stroke="#a7ce8c" stroke-width="2" stroke-dasharray="3 8" stroke-linecap="round"/><polygon points="603.4,190.9 585.7,189.8 589.7,179.7" fill="#69ac39"/><polygon points="774.7,380.3 764.9,365.4 775.3,362.5" fill="#69ac39"/><polygon points="700.3,605.4 708.3,589.5 716.0,597.1" fill="#69ac39"/><polygon points="439.0,699.0 455.9,693.5 455.9,704.4" fill="#69ac39"/><polygon points="184.3,589.7 200.0,598.0 192.3,605.5" fill="#69ac39"/><polygon points="131.2,359.1 131.9,376.8 121.5,373.9" fill="#69ac39"/><polygon points="317.1,182.9 303.3,194.1 299.4,184.1" fill="#69ac39"/><circle cx="450.0" cy="429.6" r="100.0" fill="#cde5bc" stroke="#a7ce8c" stroke-width="1.6"/><text x="450.0" y="402.0" font-size="15" fill="#406e20" font-weight="700" text-anchor="middle"><tspan x="450.0">Prevención,</tspan><tspan x="450.0" dy="19.8">detección y</tspan><tspan x="450.0" dy="19.8">contención de</tspan><tspan x="450.0" dy="19.8">crisis</tspan></text><rect x="361.0" y="114.2" width="178" height="92.0" rx="10" fill="#ebf7e2" stroke="#a7ce8c" stroke-width="1.4"/><text x="373.0" y="136.2" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="373.0">Inventariar riesgos y</tspan><tspan x="373.0" dy="16.5">asignar dueño,</tspan><tspan x="373.0" dy="16.5">indicador de alerta y</tspan><tspan x="373.0" dy="16.5">medida preventiva</tspan></text><circle cx="363.0" cy="116.2" r="14" fill="#406e20"/><text x="363.0" y="120.8" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><rect x="619.0" y="215.7" width="178" height="92.0" rx="10" fill="#ebf7e2" stroke="#a7ce8c" stroke-width="1.4"/><text x="631.0" y="237.7" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="631.0">Definir tres niveles</tspan><tspan x="631.0" dy="16.5">de severidad con</tspan><tspan x="631.0" dy="16.5">criterios observables,</tspan><tspan x="631.0" dy="16.5">responsable y plazo</tspan></text><circle cx="621.0" cy="217.7" r="14" fill="#406e20"/><text x="621.0" y="222.2" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><rect x="682.7" y="451.8" width="178" height="75.5" rx="10" fill="#ebf7e2" stroke="#a7ce8c" stroke-width="1.4"/><text x="694.7" y="473.8" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="694.7">Verificar la señal con</tspan><tspan x="694.7" dy="16.5">fuentes internas antes</tspan><tspan x="694.7" dy="16.5">de comunicar</tspan></text><circle cx="684.7" cy="453.8" r="14" fill="#406e20"/><text x="684.7" y="458.3" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><rect x="504.2" y="626.3" width="178" height="92.0" rx="10" fill="#ebf7e2" stroke="#a7ce8c" stroke-width="1.4"/><text x="516.2" y="648.3" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="516.2">Activar contención:</tspan><tspan x="516.2" dy="16.5">proteger afectados,</tspan><tspan x="516.2" dy="16.5">detener lo que agrava</tspan><tspan x="516.2" dy="16.5">y preservar evidencia</tspan></text><circle cx="506.2" cy="628.3" r="14" fill="#406e20"/><text x="506.2" y="632.8" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">4</text><rect x="217.8" y="626.3" width="178" height="92.0" rx="10" fill="#ebf7e2" stroke="#a7ce8c" stroke-width="1.4"/><text x="229.8" y="648.3" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="229.8">Aplicar la prueba de</tspan><tspan x="229.8" dy="16.5">publicación completa a</tspan><tspan x="229.8" dy="16.5">todo texto antes de</tspan><tspan x="229.8" dy="16.5">emitirlo</tspan></text><circle cx="219.8" cy="628.3" r="14" fill="#406e20"/><text x="219.8" y="632.8" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">5</text><rect x="39.3" y="435.3" width="178" height="108.5" rx="10" fill="#ebf7e2" stroke="#a7ce8c" stroke-width="1.4"/><text x="51.3" y="457.3" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="51.3">Decidir responder,</tspan><tspan x="51.3" dy="16.5">reconocer,</tspan><tspan x="51.3" dy="16.5">disculparse, corregir,</tspan><tspan x="51.3" dy="16.5">suspender o escalar y</tspan><tspan x="51.3" dy="16.5">registrar la decisión</tspan></text><circle cx="41.3" cy="437.3" r="14" fill="#406e20"/><text x="41.3" y="441.8" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">6</text><rect x="103.0" y="215.7" width="178" height="92.0" rx="10" fill="#ebf7e2" stroke="#a7ce8c" stroke-width="1.4"/><text x="115.0" y="237.7" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="115.0">Documentar tiempos,</tspan><tspan x="115.0" dy="16.5">decisiones y desvíos</tspan><tspan x="115.0" dy="16.5">para la revisión</tspan><tspan x="115.0" dy="16.5">posterior</tspan></text><circle cx="105.0" cy="217.7" r="14" fill="#406e20"/><text x="105.0" y="222.2" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">7</text><text x="40" y="795.2" font-size="11.5" fill="#69ac39" font-weight="700" letter-spacing="1.4">CONCEPTOS Y DÓNDE ACTÚAN EN EL MÉTODO</text><rect x="40.0" y="809.2" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#a7ce8c" stroke-width="1.4"/><rect x="40.0" y="817.2" width="5" height="62.2" rx="2" fill="#69ac39"/><text x="56.0" y="831.2" font-size="13.5" fill="#406e20" font-weight="700" text-anchor="start"><tspan x="56.0">Crisis</tspan></text><text x="56.0" y="851.0" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Evento que amenaza expectativas críticas, exige decisiones</tspan><tspan x="56.0" dy="15.2">urgentes y puede afectar la continuidad o la legitimidad</tspan></text><rect x="459.0" y="809.2" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#a7ce8c" stroke-width="1.4"/><rect x="459.0" y="817.2" width="5" height="62.2" rx="2" fill="#69ac39"/><text x="475.0" y="831.2" font-size="13.5" fill="#406e20" font-weight="700" text-anchor="start"><tspan x="475.0">Incidente</tspan></text><text x="475.0" y="851.0" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Evento operativo contenible sin alterar las expectativas</tspan><tspan x="475.0" dy="15.2">críticas de los públicos</tspan></text><rect x="40.0" y="901.4" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#a7ce8c" stroke-width="1.4"/><rect x="40.0" y="909.4" width="5" height="62.2" rx="2" fill="#69ac39"/><text x="56.0" y="923.4" font-size="13.5" fill="#406e20" font-weight="700" text-anchor="start"><tspan x="56.0">Severidad</tspan></text><text x="56.0" y="943.2" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Nivel definido por criterios observables que determina</tspan><tspan x="56.0" dy="15.2">quién decide y en qué plazo se comunica</tspan></text><rect x="379.0" y="909.4" width="54" height="20" rx="10" fill="#cde5bc" stroke="#a7ce8c" stroke-width="1"/><text x="406.0" y="923.4" font-size="11" fill="#406e20" font-weight="700" text-anchor="middle">↔ 2</text><rect x="459.0" y="901.4" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#a7ce8c" stroke-width="1.4"/><rect x="459.0" y="909.4" width="5" height="62.2" rx="2" fill="#69ac39"/><text x="475.0" y="923.4" font-size="13.5" fill="#406e20" font-weight="700" text-anchor="start"><tspan x="475.0">Contención</tspan></text><text x="475.0" y="943.2" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Acciones inmediatas para limitar el daño mientras se</tspan><tspan x="475.0" dy="15.2">establecen los hechos</tspan></text><rect x="798.0" y="909.4" width="54" height="20" rx="10" fill="#cde5bc" stroke="#a7ce8c" stroke-width="1"/><text x="825.0" y="923.4" font-size="11" fill="#406e20" font-weight="700" text-anchor="middle">↔ 4</text><rect x="40.0" y="993.6" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#a7ce8c" stroke-width="1.4"/><rect x="40.0" y="1001.6" width="5" height="62.2" rx="2" fill="#69ac39"/><text x="56.0" y="1015.6" font-size="13.5" fill="#406e20" font-weight="700" text-anchor="start"><tspan x="56.0">Control de daños</tspan></text><text x="56.0" y="1035.4" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Protección de afectados y de la organización con</tspan><tspan x="56.0" dy="15.2">información veraz y acciones verificables</tspan></text><rect x="379.0" y="1001.6" width="54" height="20" rx="10" fill="#cde5bc" stroke="#a7ce8c" stroke-width="1"/><text x="406.0" y="1015.6" font-size="11" fill="#406e20" font-weight="700" text-anchor="middle">↔ 4</text><rect x="459.0" y="993.6" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#a7ce8c" stroke-width="1.4"/><rect x="459.0" y="1001.6" width="5" height="62.2" rx="2" fill="#69ac39"/><text x="475.0" y="1015.6" font-size="13.5" fill="#406e20" font-weight="700" text-anchor="start"><tspan x="475.0">Encubrimiento</tspan></text><text x="475.0" y="1035.4" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Ocultar, retrasar sin justificación o deformar hechos</tspan><tspan x="475.0" dy="15.2">relevantes</tspan></text><rect x="40.0" y="1085.7" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#a7ce8c" stroke-width="1.4"/><rect x="40.0" y="1093.7" width="5" height="62.2" rx="2" fill="#69ac39"/><text x="56.0" y="1107.7" font-size="13.5" fill="#406e20" font-weight="700" text-anchor="start"><tspan x="56.0">Prueba de publicación completa</tspan></text><text x="56.0" y="1127.6" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Pregunta que verifica si la comunicación de hoy sería</tspan><tspan x="56.0" dy="15.2">engañosa si todos los hechos se conocieran mañana</tspan></text><rect x="379.0" y="1093.7" width="54" height="20" rx="10" fill="#cde5bc" stroke="#a7ce8c" stroke-width="1"/><text x="406.0" y="1107.7" font-size="11" fill="#406e20" font-weight="700" text-anchor="middle">↔ 3, 5</text><text x="40" y="1197.9200000000003" font-size="11.5" fill="#69ac39" font-weight="700" letter-spacing="1.4">FRONTERA DE APLICACIÓN</text><rect x="40" y="1207.9" width="820" height="48.5" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.4"/><polygon points="70,1217.1700000000003 52,1246.1700000000003 88,1246.1700000000003" fill="#c2410c"/><text x="70" y="1243.1700000000003" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">!</text><text x="106" y="1231.9" font-size="12.5" fill="#7c2d12" font-weight="400" text-anchor="start"><tspan x="106">Riesgo reputacional: Un comunicado que omite el alcance real se convierte en el segundo escándalo.</tspan></text><text x="40" y="1284.4200000000003" font-size="11.5" fill="#69ac39" font-weight="700" letter-spacing="1.4">ERROR FRECUENTE Y SU CORRECCIÓN</text><rect x="40" y="1294.4" width="380.0" height="77.0" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/><text x="54" y="1316.4" font-size="11" fill="#b91c1c" font-weight="700" text-anchor="start"><tspan x="54">Síntoma</tspan></text><text x="54" y="1334.4" font-size="12.5" fill="#7f1d1d" font-weight="400" text-anchor="start"><tspan x="54">Esperar la causa para comunicar</tspan></text><line x1="426.0" y1="1332.9" x2="469.0" y2="1332.9" stroke="#69ac39" stroke-width="2.6" stroke-linecap="round"/><polygon points="474.0,1332.9 465.9,1336.8 465.9,1329.0" fill="#69ac39"/><rect x="480.0" y="1294.4" width="380.0" height="77.0" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.4"/><text x="494.0" y="1316.4" font-size="11" fill="#15803d" font-weight="700" text-anchor="start"><tspan x="494.0">Corrección</tspan></text><text x="494.0" y="1334.4" font-size="12.5" fill="#14532d" font-weight="400" text-anchor="start"><tspan x="494.0">Informar lo confirmado, lo incierto y la hora de la</tspan><tspan x="494.0" dy="16.5">próxima actualización.</tspan></text></svg>
