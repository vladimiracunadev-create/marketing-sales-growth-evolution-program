<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1319" width="900" height="1319" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif"><title id="t">Modelo mental · Mapeo de cuentas</title><desc id="d">Modelo mental de la clase 09.09: Mapeo de cuentas. Método en 5 pasos; 4 conceptos; 3 señales de medición.</desc><rect x="0" y="0" width="900" height="1319" rx="14" fill="#ffffff"/><rect x="0" y="0" width="900" height="64" rx="14" fill="#6a6e20"/><rect x="0" y="40" width="900" height="24" fill="#6a6e20"/><text x="40" y="28" font-size="12" fill="#e3e5bc" font-weight="700" letter-spacing="1.6">MODELO MENTAL · CLASE 09.09 · PARTE 09</text><text x="40" y="52" font-size="21" fill="#ffffff" font-weight="700">Mapeo de cuentas</text><text x="40" y="84" font-size="11.5" fill="#a6ac39" font-weight="700" letter-spacing="1.4">MÉTODO PASO A PASO</text><ellipse cx="450.0" cy="376.8" rx="330.0" ry="233.1" fill="none" stroke="#cace8c" stroke-width="2" stroke-dasharray="3 8" stroke-linecap="round"/><polygon points="653.8,193.3 636.3,190.4 641.2,180.8" fill="#a6ac39"/><polygon points="759.3,458.8 761.4,441.2 771.2,445.7" fill="#a6ac39"/><polygon points="439.0,609.9 455.9,604.4 455.9,615.3" fill="#a6ac39"/><polygon points="131.6,438.8 143.5,451.9 133.7,456.4" fill="#a6ac39"/><polygon points="265.8,183.2 253.2,195.8 248.3,186.1" fill="#a6ac39"/><circle cx="450.0" cy="376.8" r="100.0" fill="#e3e5bc" stroke="#cace8c" stroke-width="1.6"/><text x="450.0" y="378.9" font-size="15" fill="#6a6e20" font-weight="700" text-anchor="middle"><tspan x="450.0">Mapeo de cuentas</tspan></text><rect x="361.0" y="106.0" width="178" height="75.5" rx="10" fill="#f6f7e2" stroke="#cace8c" stroke-width="1.4"/><text x="373.0" y="128.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="373.0">Recolectar información</tspan><tspan x="373.0" dy="16.5">pública y de</tspan><tspan x="373.0" dy="16.5">conversaciones</tspan></text><circle cx="363.0" cy="108.0" r="14" fill="#6a6e20"/><text x="363.0" y="112.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><rect x="674.8" y="275.3" width="178" height="59.0" rx="10" fill="#f6f7e2" stroke="#cace8c" stroke-width="1.4"/><text x="686.8" y="297.3" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="686.8">Mapear estructura de</tspan><tspan x="686.8" dy="16.5">poder y relaciones</tspan></text><circle cx="676.8" cy="277.3" r="14" fill="#6a6e20"/><text x="676.8" y="281.8" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><rect x="555.0" y="527.6" width="178" height="75.5" rx="10" fill="#f6f7e2" stroke="#cace8c" stroke-width="1.4"/><text x="567.0" y="549.6" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="567.0">Identificar</tspan><tspan x="567.0" dy="16.5">prioridades con</tspan><tspan x="567.0" dy="16.5">presupuesto asociado</tspan></text><circle cx="557.0" cy="529.6" r="14" fill="#6a6e20"/><text x="557.0" y="534.1" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><rect x="167.0" y="527.6" width="178" height="75.5" rx="10" fill="#f6f7e2" stroke="#cace8c" stroke-width="1.4"/><text x="179.0" y="549.6" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="179.0">Detectar iniciativas</tspan><tspan x="179.0" dy="16.5">que compiten por el</tspan><tspan x="179.0" dy="16.5">mismo fondo</tspan></text><circle cx="169.0" cy="529.6" r="14" fill="#6a6e20"/><text x="169.0" y="534.1" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">4</text><rect x="47.2" y="267.0" width="178" height="75.5" rx="10" fill="#f6f7e2" stroke="#cace8c" stroke-width="1.4"/><text x="59.2" y="289.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="59.2">Evaluar la posición y</tspan><tspan x="59.2" dy="16.5">definir el movimiento</tspan><tspan x="59.2" dy="16.5">siguiente</tspan></text><circle cx="49.2" cy="269.0" r="14" fill="#6a6e20"/><text x="49.2" y="273.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">5</text><text x="40" y="689.6" font-size="11.5" fill="#a6ac39" font-weight="700" letter-spacing="1.4">CONCEPTOS Y DÓNDE ACTÚAN EN EL MÉTODO</text><rect x="40.0" y="703.6" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#cace8c" stroke-width="1.4"/><rect x="40.0" y="711.6" width="5" height="62.2" rx="2" fill="#a6ac39"/><text x="56.0" y="725.6" font-size="13.5" fill="#6a6e20" font-weight="700" text-anchor="start"><tspan x="56.0">Estructura de poder</tspan></text><text x="56.0" y="745.4" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Distribución real de influencia, que no siempre coincide</tspan><tspan x="56.0" dy="15.2">con el organigrama</tspan></text><rect x="379.0" y="711.6" width="54" height="20" rx="10" fill="#e3e5bc" stroke="#cace8c" stroke-width="1"/><text x="406.0" y="725.6" font-size="11" fill="#6a6e20" font-weight="700" text-anchor="middle">↔ 2</text><rect x="459.0" y="703.6" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#cace8c" stroke-width="1.4"/><rect x="459.0" y="711.6" width="5" height="62.2" rx="2" fill="#a6ac39"/><text x="475.0" y="725.6" font-size="13.5" fill="#6a6e20" font-weight="700" text-anchor="start"><tspan x="475.0">Prioridad declarada</tspan></text><text x="475.0" y="745.4" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Objetivo público de la organización con presupuesto</tspan><tspan x="475.0" dy="15.2">asociado</tspan></text><rect x="798.0" y="711.6" width="54" height="20" rx="10" fill="#e3e5bc" stroke="#cace8c" stroke-width="1"/><text x="825.0" y="725.6" font-size="11" fill="#6a6e20" font-weight="700" text-anchor="middle">↔ 3</text><rect x="40.0" y="795.8" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#cace8c" stroke-width="1.4"/><rect x="40.0" y="803.8" width="5" height="62.2" rx="2" fill="#a6ac39"/><text x="56.0" y="817.8" font-size="13.5" fill="#6a6e20" font-weight="700" text-anchor="start"><tspan x="56.0">Competencia interna por presupuesto</tspan></text><text x="56.0" y="837.6" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Otras iniciativas que disputan el mismo fondo</tspan></text><rect x="379.0" y="803.8" width="54" height="20" rx="10" fill="#e3e5bc" stroke="#cace8c" stroke-width="1"/><text x="406.0" y="817.8" font-size="11" fill="#6a6e20" font-weight="700" text-anchor="middle">↔ 3, 4</text><rect x="459.0" y="795.8" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#cace8c" stroke-width="1.4"/><rect x="459.0" y="803.8" width="5" height="62.2" rx="2" fill="#a6ac39"/><text x="475.0" y="817.8" font-size="13.5" fill="#6a6e20" font-weight="700" text-anchor="start"><tspan x="475.0">Posición en la cuenta</tspan></text><text x="475.0" y="837.6" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Evaluación de la fortaleza relativa frente a competidores</tspan><tspan x="475.0" dy="15.2">y frente al no hacer nada</tspan></text><rect x="798.0" y="803.8" width="54" height="20" rx="10" fill="#e3e5bc" stroke="#cace8c" stroke-width="1"/><text x="825.0" y="817.8" font-size="11" fill="#6a6e20" font-weight="700" text-anchor="middle">↔ 5</text><text x="40" y="905.96" font-size="11.5" fill="#a6ac39" font-weight="700" letter-spacing="1.4">QUÉ SE MIDE: NUMERADOR SOBRE DENOMINADOR</text><rect x="40.0" y="920.0" width="261.3" height="137.9" rx="8" fill="#f6f7e2" stroke="#cace8c" stroke-width="1.4"/><text x="54.0" y="942.0" font-size="13" fill="#6a6e20" font-weight="700" text-anchor="start"><tspan x="54.0">Cobertura del mapa de cuenta</tspan></text><text x="54.0" y="971.1" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Roles críticos con información</tspan><tspan x="54.0" dy="15.2">registrada</tspan></text><line x1="54.0" y1="1007.5" x2="287.3" y2="1007.5" stroke="#a6ac39" stroke-width="2"/><text x="54.0" y="1025.5" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="54.0">Roles identificados</tspan></text><rect x="319.3" y="920.0" width="261.3" height="137.9" rx="8" fill="#f6f7e2" stroke="#cace8c" stroke-width="1.4"/><text x="333.3" y="942.0" font-size="13" fill="#6a6e20" font-weight="700" text-anchor="start"><tspan x="333.3">Alineación con prioridad</tspan><tspan x="333.3" dy="17.2">declarada</tspan></text><text x="333.3" y="988.3" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="333.3">Oportunidades vinculadas a una</tspan><tspan x="333.3" dy="15.2">prioridad con presupuesto</tspan></text><line x1="333.3" y1="1024.6" x2="566.7" y2="1024.6" stroke="#a6ac39" stroke-width="2"/><text x="333.3" y="1042.6" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="333.3">Oportunidades de la cuenta</tspan></text><rect x="598.7" y="920.0" width="261.3" height="137.9" rx="8" fill="#f6f7e2" stroke="#cace8c" stroke-width="1.4"/><text x="612.7" y="942.0" font-size="13" fill="#6a6e20" font-weight="700" text-anchor="start"><tspan x="612.7">Participación en la cuenta</tspan></text><text x="612.7" y="971.1" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="612.7">Ingreso propio en la cuenta</tspan></text><line x1="612.7" y1="992.3" x2="846.0" y2="992.3" stroke="#a6ac39" stroke-width="2"/><text x="612.7" y="1010.3" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="612.7">Gasto estimado de la cuenta en la</tspan><tspan x="612.7" dy="15.2">categoría</tspan></text><text x="40" y="1091.8200000000002" font-size="11.5" fill="#a6ac39" font-weight="700" letter-spacing="1.4">FRONTERA DE APLICACIÓN</text><rect x="40" y="1101.8" width="820" height="65.0" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.4"/><polygon points="70,1119.3200000000002 52,1148.3200000000002 88,1148.3200000000002" fill="#c2410c"/><text x="70" y="1145.3200000000002" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">!</text><text x="106" y="1125.8" font-size="12.5" fill="#7c2d12" font-weight="400" text-anchor="start"><tspan x="106">La información de cuenta debe obtenerse por medios legítimos. Presionar a empleados para obtener</tspan><tspan x="106" dy="16.5">información confidencial es una práctica indebida y un riesgo legal.</tspan></text><text x="40" y="1194.8200000000002" font-size="11.5" fill="#a6ac39" font-weight="700" letter-spacing="1.4">ERROR FRECUENTE Y SU CORRECCIÓN</text><rect x="40" y="1204.8" width="380.0" height="77.0" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/><text x="54" y="1226.8" font-size="11" fill="#b91c1c" font-weight="700" text-anchor="start"><tspan x="54">Síntoma</tspan></text><text x="54" y="1244.8" font-size="12.5" fill="#7f1d1d" font-weight="400" text-anchor="start"><tspan x="54">Proponer sin conocer las iniciativas que compiten</tspan><tspan x="54" dy="16.5">por el presupuesto</tspan></text><line x1="426.0" y1="1243.3" x2="469.0" y2="1243.3" stroke="#a6ac39" stroke-width="2.6" stroke-linecap="round"/><polygon points="474.0,1243.3 465.9,1247.2 465.9,1239.4" fill="#a6ac39"/><rect x="480.0" y="1204.8" width="380.0" height="77.0" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.4"/><text x="494.0" y="1226.8" font-size="11" fill="#15803d" font-weight="700" text-anchor="start"><tspan x="494.0">Corrección</tspan></text><text x="494.0" y="1244.8" font-size="12.5" fill="#14532d" font-weight="400" text-anchor="start"><tspan x="494.0">Pregunta explícitamente qué otros proyectos</tspan><tspan x="494.0" dy="16.5">disputan el mismo fondo y en qué estado están.</tspan></text></svg>