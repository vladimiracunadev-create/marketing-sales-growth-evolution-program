<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1641" width="900" height="1641" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif"><title id="t">Modelo mental · Employer branding y marca personal</title><desc id="d">Modelo mental de la clase 06.11: Employer branding y marca personal. Método en 10 pasos; 8 conceptos; 4 señales de medición.</desc><rect x="0" y="0" width="900" height="1641" rx="14" fill="#ffffff"/><rect x="0" y="0" width="900" height="64" rx="14" fill="#57206e"/><rect x="0" y="40" width="900" height="24" fill="#57206e"/><text x="40" y="28" font-size="12" fill="#d9bce5" font-weight="700" letter-spacing="1.6">MODELO MENTAL · CLASE 06.11 · PARTE 06</text><text x="40" y="52" font-size="21" fill="#ffffff" font-weight="700">Employer branding y marca personal</text><text x="40" y="84" font-size="11.5" fill="#8939ac" font-weight="700" letter-spacing="1.4">MÉTODO PASO A PASO</text><line x1="450.0" y1="94.0" x2="450.0" y2="507.0" stroke="#ba8cce" stroke-width="3" stroke-linecap="round"/><line x1="450.0" y1="129.5" x2="406.0" y2="129.5" stroke="#ba8cce" stroke-width="2"/><rect x="56.0" y="100" width="350" height="59.0" rx="10" fill="#f1e2f7" stroke="#ba8cce" stroke-width="1.4"/><text x="70.0" y="122" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="70.0">Declarar el contexto y la decisión que la</tspan><tspan x="70.0" dy="16.5">presencia profesional debe facilitar</tspan></text><circle cx="450.0" cy="129.5" r="15" fill="#57206e"/><text x="450.0" y="134.0" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><line x1="450.0" y1="167.5" x2="494.0" y2="167.5" stroke="#ba8cce" stroke-width="2"/><rect x="494.0" y="138" width="350" height="59.0" rx="10" fill="#f1e2f7" stroke="#ba8cce" stroke-width="1.4"/><text x="508.0" y="160" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="508.0">Acordar objetivos, consentimiento y límites del</tspan><tspan x="508.0" dy="16.5">diagnóstico</tspan></text><circle cx="450.0" cy="167.5" r="15" fill="#57206e"/><text x="450.0" y="172.0" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><line x1="450.0" y1="205.5" x2="406.0" y2="205.5" stroke="#ba8cce" stroke-width="2"/><rect x="56.0" y="176" width="350" height="59.0" rx="10" fill="#f1e2f7" stroke="#ba8cce" stroke-width="1.4"/><text x="70.0" y="198" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="70.0">Auditar hechos y señales actuales sin juzgar</tspan><tspan x="70.0" dy="16.5">características corporales</tspan></text><circle cx="450.0" cy="205.5" r="15" fill="#57206e"/><text x="450.0" y="210.0" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><line x1="450.0" y1="243.5" x2="494.0" y2="243.5" stroke="#ba8cce" stroke-width="2"/><rect x="494.0" y="214" width="350" height="59.0" rx="10" fill="#f1e2f7" stroke="#ba8cce" stroke-width="1.4"/><text x="508.0" y="236" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="508.0">Explicitar la identidad personal y la identidad</tspan><tspan x="508.0" dy="16.5">profesional que sí son pertinentes</tspan></text><circle cx="450.0" cy="243.5" r="15" fill="#57206e"/><text x="450.0" y="248.0" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">4</text><line x1="450.0" y1="281.5" x2="406.0" y2="281.5" stroke="#ba8cce" stroke-width="2"/><rect x="56.0" y="252" width="350" height="59.0" rx="10" fill="#f1e2f7" stroke="#ba8cce" stroke-width="1.4"/><text x="70.0" y="274" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="70.0">Recoger la percepción actual y separar</tspan><tspan x="70.0" dy="16.5">observaciones, preferencias e inferencias</tspan></text><circle cx="450.0" cy="281.5" r="15" fill="#57206e"/><text x="450.0" y="286.0" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">5</text><line x1="450.0" y1="319.5" x2="494.0" y2="319.5" stroke="#ba8cce" stroke-width="2"/><rect x="494.0" y="290" width="350" height="59.0" rx="10" fill="#f1e2f7" stroke="#ba8cce" stroke-width="1.4"/><text x="508.0" y="312" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="508.0">Localizar brechas entre identidad, expresión,</tspan><tspan x="508.0" dy="16.5">imagen percibida, reputación y posicionamiento</tspan></text><circle cx="450.0" cy="319.5" r="15" fill="#57206e"/><text x="450.0" y="324.0" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">6</text><line x1="450.0" y1="357.5" x2="406.0" y2="357.5" stroke="#ba8cce" stroke-width="2"/><rect x="56.0" y="328" width="350" height="59.0" rx="10" fill="#f1e2f7" stroke="#ba8cce" stroke-width="1.4"/><text x="70.0" y="350" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="70.0">Formular dos conjuntos de recomendaciones</tspan><tspan x="70.0" dy="16.5">adecuados al contexto</tspan></text><circle cx="450.0" cy="357.5" r="15" fill="#57206e"/><text x="450.0" y="362.0" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">7</text><line x1="450.0" y1="395.5" x2="494.0" y2="395.5" stroke="#ba8cce" stroke-width="2"/><rect x="494.0" y="366" width="350" height="59.0" rx="10" fill="#f1e2f7" stroke="#ba8cce" stroke-width="1.4"/><text x="508.0" y="388" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="508.0">Priorizar e implementar cambios reversibles con</tspan><tspan x="508.0" dy="16.5">evidencia</tspan></text><circle cx="450.0" cy="395.5" r="15" fill="#57206e"/><text x="450.0" y="400.0" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">8</text><line x1="450.0" y1="433.5" x2="406.0" y2="433.5" stroke="#ba8cce" stroke-width="2"/><rect x="56.0" y="404" width="350" height="59.0" rx="10" fill="#f1e2f7" stroke="#ba8cce" stroke-width="1.4"/><text x="70.0" y="426" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="70.0">Observar comprensión, coherencia y</tspan><tspan x="70.0" dy="16.5">consecuencias no deseadas</tspan></text><circle cx="450.0" cy="433.5" r="15" fill="#57206e"/><text x="450.0" y="438.0" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">9</text><line x1="450.0" y1="471.5" x2="494.0" y2="471.5" stroke="#ba8cce" stroke-width="2"/><rect x="494.0" y="442" width="350" height="59.0" rx="10" fill="#f1e2f7" stroke="#ba8cce" stroke-width="1.4"/><text x="508.0" y="464" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="508.0">Ajustar, documentar límites y transferir el</tspan><tspan x="508.0" dy="16.5">criterio a la persona</tspan></text><circle cx="450.0" cy="471.5" r="15" fill="#57206e"/><text x="450.0" y="476.0" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">10</text><text x="40" y="543.0" font-size="11.5" fill="#8939ac" font-weight="700" letter-spacing="1.4">CONCEPTOS Y DÓNDE ACTÚAN EN EL MÉTODO</text><rect x="40.0" y="557.0" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#ba8cce" stroke-width="1.4"/><rect x="40.0" y="565.0" width="5" height="62.2" rx="2" fill="#8939ac"/><text x="56.0" y="579.0" font-size="13.5" fill="#57206e" font-weight="700" text-anchor="start"><tspan x="56.0">Marca empleadora</tspan></text><text x="56.0" y="598.8" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Percepción del mercado laboral sobre cómo es trabajar en</tspan><tspan x="56.0" dy="15.2">la empresa</tspan></text><rect x="459.0" y="557.0" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#ba8cce" stroke-width="1.4"/><rect x="459.0" y="565.0" width="5" height="62.2" rx="2" fill="#8939ac"/><text x="475.0" y="579.0" font-size="13.5" fill="#57206e" font-weight="700" text-anchor="start"><tspan x="475.0">Marca personal profesional</tspan></text><text x="475.0" y="598.8" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Expectativa pública sobre la contribución de una persona,</tspan><tspan x="475.0" dy="15.2">sostenida por conducta y evidencia verificable</tspan></text><rect x="798.0" y="565.0" width="54" height="20" rx="10" fill="#d9bce5" stroke="#ba8cce" stroke-width="1"/><text x="825.0" y="579.0" font-size="11" fill="#57206e" font-weight="700" text-anchor="middle">↔ 1, 4, 10</text><rect x="40.0" y="649.2" width="401.0" height="93.4" rx="8" fill="#ffffff" stroke="#ba8cce" stroke-width="1.4"/><rect x="40.0" y="657.2" width="5" height="77.4" rx="2" fill="#8939ac"/><text x="56.0" y="671.2" font-size="13.5" fill="#57206e" font-weight="700" text-anchor="start"><tspan x="56.0">Imagen profesional</tspan></text><text x="56.0" y="691.0" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Percepción situada producida por señales visuales,</tspan><tspan x="56.0" dy="15.2">verbales, conductuales y digitales en un contexto de</tspan><tspan x="56.0" dy="15.2">trabajo</tspan></text><rect x="379.0" y="657.2" width="54" height="20" rx="10" fill="#d9bce5" stroke="#ba8cce" stroke-width="1"/><text x="406.0" y="671.2" font-size="11" fill="#57206e" font-weight="700" text-anchor="middle">↔ 1, 4, 6</text><rect x="459.0" y="649.2" width="401.0" height="93.4" rx="8" fill="#ffffff" stroke="#ba8cce" stroke-width="1.4"/><rect x="459.0" y="657.2" width="5" height="77.4" rx="2" fill="#8939ac"/><text x="475.0" y="671.2" font-size="13.5" fill="#57206e" font-weight="700" text-anchor="start"><tspan x="475.0">Coherencia omnicanal personal</tspan></text><text x="475.0" y="691.0" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Compatibilidad reconocible entre la presencia física, el</tspan><tspan x="475.0" dy="15.2">CV, los perfiles, el portafolio, las publicaciones y los</tspan><tspan x="475.0" dy="15.2">proyectos</tspan></text><rect x="798.0" y="657.2" width="54" height="20" rx="10" fill="#d9bce5" stroke="#ba8cce" stroke-width="1"/><text x="825.0" y="671.2" font-size="11" fill="#57206e" font-weight="700" text-anchor="middle">↔ 4, 9, 10</text><rect x="40.0" y="756.5" width="401.0" height="93.4" rx="8" fill="#ffffff" stroke="#ba8cce" stroke-width="1.4"/><rect x="40.0" y="764.5" width="5" height="77.4" rx="2" fill="#8939ac"/><text x="56.0" y="778.5" font-size="13.5" fill="#57206e" font-weight="700" text-anchor="start"><tspan x="56.0">Vocería</tspan></text><text x="56.0" y="798.4" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Función de hablar en nombre de una organización con</tspan><tspan x="56.0" dy="15.2">mensajes autorizados, preparación previa y límites</tspan><tspan x="56.0" dy="15.2">definidos</tspan></text><rect x="459.0" y="756.5" width="401.0" height="93.4" rx="8" fill="#ffffff" stroke="#ba8cce" stroke-width="1.4"/><rect x="459.0" y="764.5" width="5" height="77.4" rx="2" fill="#8939ac"/><text x="475.0" y="778.5" font-size="13.5" fill="#57206e" font-weight="700" text-anchor="start"><tspan x="475.0">Mensaje central</tspan></text><text x="475.0" y="798.4" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Idea que la persona vocera debe dejar clara aunque la</tspan><tspan x="475.0" dy="15.2">conversación se desvíe</tspan></text><rect x="40.0" y="863.9" width="401.0" height="93.4" rx="8" fill="#ffffff" stroke="#ba8cce" stroke-width="1.4"/><rect x="40.0" y="871.9" width="5" height="77.4" rx="2" fill="#8939ac"/><text x="56.0" y="885.9" font-size="13.5" fill="#57206e" font-weight="700" text-anchor="start"><tspan x="56.0">Pregunta difícil</tspan></text><text x="56.0" y="905.7" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Pregunta que expone un riesgo, un error o un conflicto y</tspan><tspan x="56.0" dy="15.2">cuya respuesta puede ser citada fuera de contexto</tspan></text><rect x="459.0" y="863.9" width="401.0" height="93.4" rx="8" fill="#ffffff" stroke="#ba8cce" stroke-width="1.4"/><rect x="459.0" y="871.9" width="5" height="77.4" rx="2" fill="#8939ac"/><text x="475.0" y="885.9" font-size="13.5" fill="#57206e" font-weight="700" text-anchor="start"><tspan x="475.0">Exposición pública del empleado</tspan></text><text x="475.0" y="905.7" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Conducta o declaración de una persona de la organización</tspan><tspan x="475.0" dy="15.2">que, por su rol o por su alcance, puede ser atribuida a la</tspan><tspan x="475.0" dy="15.2">empresa</tspan></text><text x="40" y="989.2600000000001" font-size="11.5" fill="#8939ac" font-weight="700" letter-spacing="1.4">QUÉ SE MIDE: NUMERADOR SOBRE DENOMINADOR</text><rect x="40.0" y="1003.3" width="261.3" height="137.9" rx="8" fill="#f1e2f7" stroke="#ba8cce" stroke-width="1.4"/><text x="54.0" y="1025.3" font-size="13" fill="#57206e" font-weight="700" text-anchor="start"><tspan x="54.0">Coherencia de señales</tspan><tspan x="54.0" dy="17.2">profesionales</tspan></text><text x="54.0" y="1071.6" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Señales críticas compatibles con la</tspan><tspan x="54.0" dy="15.2">identidad y el objetivo declarados</tspan></text><line x1="54.0" y1="1107.9" x2="287.3" y2="1107.9" stroke="#8939ac" stroke-width="2"/><text x="54.0" y="1125.9" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="54.0">Señales críticas auditadas por canal</tspan></text><rect x="319.3" y="1003.3" width="261.3" height="137.9" rx="8" fill="#f1e2f7" stroke="#ba8cce" stroke-width="1.4"/><text x="333.3" y="1025.3" font-size="13" fill="#57206e" font-weight="700" text-anchor="start"><tspan x="333.3">Origen de candidatos</tspan></text><text x="333.3" y="1054.4" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="333.3">Postulaciones espontáneas</tspan></text><line x1="333.3" y1="1075.6" x2="566.7" y2="1075.6" stroke="#8939ac" stroke-width="2"/><text x="333.3" y="1093.6" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="333.3">Postulaciones totales, por periodo</tspan></text><rect x="598.7" y="1003.3" width="261.3" height="137.9" rx="8" fill="#f1e2f7" stroke="#ba8cce" stroke-width="1.4"/><text x="612.7" y="1025.3" font-size="13" fill="#57206e" font-weight="700" text-anchor="start"><tspan x="612.7">Rotación temprana</tspan></text><text x="612.7" y="1054.4" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="612.7">Salidas antes de seis meses</tspan></text><line x1="612.7" y1="1075.6" x2="846.0" y2="1075.6" stroke="#8939ac" stroke-width="2"/><text x="612.7" y="1093.6" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="612.7">Incorporaciones del periodo</tspan></text><rect x="40.0" y="1155.1" width="261.3" height="174.9" rx="8" fill="#f1e2f7" stroke="#ba8cce" stroke-width="1.4"/><text x="54.0" y="1177.1" font-size="13" fill="#57206e" font-weight="700" text-anchor="start"><tspan x="54.0">Preparación de vocería</tspan><tspan x="54.0" dy="17.2">completada</tspan></text><text x="54.0" y="1223.4" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Voceros con mensaje central, banco</tspan><tspan x="54.0" dy="15.2">de preguntas y ensayo documentado</tspan><tspan x="54.0" dy="15.2">antes de una exposición</tspan></text><line x1="54.0" y1="1275.0" x2="287.3" y2="1275.0" stroke="#8939ac" stroke-width="2"/><text x="54.0" y="1293.0" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="54.0">Voceros con exposición prevista</tspan></text><text x="54.0" y="1322.2" font-size="10.5" fill="#7b8794" font-weight="400" text-anchor="start"><tspan x="54.0">Ventana: por trimestre</tspan></text><text x="40" y="1364.02" font-size="11.5" fill="#8939ac" font-weight="700" letter-spacing="1.4">FRONTERA DE APLICACIÓN</text><rect x="40" y="1374.0" width="820" height="98.0" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.4"/><polygon points="70,1408.02 52,1437.02 88,1437.02" fill="#c2410c"/><text x="70" y="1434.02" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">!</text><text x="106" y="1398.0" font-size="12.5" fill="#7c2d12" font-weight="400" text-anchor="start"><tspan x="106">La presencia puede influir en una primera impresión, pero no permite inferir competencia, integridad o</tspan><tspan x="106" dy="16.5">potencial. Recomendar una apariencia ideal o penalizar edad, sexo, raza, discapacidad, peso,</tspan><tspan x="106" dy="16.5">características corporales, identidad o expresión de género convierte la consultoría en discriminación.</tspan><tspan x="106" dy="16.5">Además, si el activo comercial reside sólo en una persona, su salida se lleva parte de la relación.</tspan></text><text x="40" y="1500.02" font-size="11.5" fill="#8939ac" font-weight="700" letter-spacing="1.4">ERROR FRECUENTE Y SU CORRECCIÓN</text><rect x="40" y="1510.0" width="380.0" height="93.5" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/><text x="54" y="1532.0" font-size="11" fill="#b91c1c" font-weight="700" text-anchor="start"><tspan x="54">Síntoma</tspan></text><text x="54" y="1550.0" font-size="12.5" fill="#7f1d1d" font-weight="400" text-anchor="start"><tspan x="54">Confundir adecuación contextual con competencia</tspan></text><line x1="426.0" y1="1556.8" x2="469.0" y2="1556.8" stroke="#8939ac" stroke-width="2.6" stroke-linecap="round"/><polygon points="474.0,1556.8 465.9,1560.7 465.9,1552.9" fill="#8939ac"/><rect x="480.0" y="1510.0" width="380.0" height="93.5" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.4"/><text x="494.0" y="1532.0" font-size="11" fill="#15803d" font-weight="700" text-anchor="start"><tspan x="494.0">Corrección</tspan></text><text x="494.0" y="1550.0" font-size="12.5" fill="#14532d" font-weight="400" text-anchor="start"><tspan x="494.0">Describe la señal y el contexto, conserva comodidad</tspan><tspan x="494.0" dy="16.5">e identidad, y exige evidencia de desempeño antes</tspan><tspan x="494.0" dy="16.5">de atribuir capacidad.</tspan></text></svg>