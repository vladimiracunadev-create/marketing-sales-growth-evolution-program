<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 925" width="900" height="925" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif"><title id="t">Modelo mental · A/B testing</title><desc id="d">Modelo mental de la clase 20.10: A/B testing. Método en 5 pasos; 4 conceptos; 3 señales de medición.</desc><rect x="0" y="0" width="900" height="925" rx="14" fill="#ffffff"/><rect x="0" y="0" width="900" height="64" rx="14" fill="#203a6e"/><rect x="0" y="40" width="900" height="24" fill="#203a6e"/><text x="40" y="28" font-size="12" fill="#bccae5" font-weight="700" letter-spacing="1.6">MODELO MENTAL · CLASE 20.10 · PARTE 20</text><text x="40" y="52" font-size="21" fill="#ffffff" font-weight="700">A/B testing</text><text x="40" y="84" font-size="11.5" fill="#395fac" font-weight="700" letter-spacing="1.4">MÉTODO PASO A PASO</text><rect x="40.0" y="100" width="246.7" height="59.0" rx="10" fill="#e2e9f7" stroke="#8ca2ce" stroke-width="1.4"/><text x="54.0" y="122" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Definir hipótesis, métrica</tspan><tspan x="54.0" dy="16.5">principal y guardarraíles</tspan></text><circle cx="42.0" cy="102.0" r="14" fill="#203a6e"/><text x="42.0" y="106.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><rect x="326.7" y="100" width="246.7" height="59.0" rx="10" fill="#e2e9f7" stroke="#8ca2ce" stroke-width="1.4"/><text x="340.7" y="122" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="340.7">Calcular muestra y duración</tspan><tspan x="340.7" dy="16.5">antes de iniciar</tspan></text><circle cx="328.7" cy="102.0" r="14" fill="#203a6e"/><text x="328.7" y="106.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><rect x="613.3" y="100" width="246.7" height="59.0" rx="10" fill="#e2e9f7" stroke="#8ca2ce" stroke-width="1.4"/><text x="627.3" y="122" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="627.3">Ejecutar sin mirar resultados</tspan><tspan x="627.3" dy="16.5">parciales</tspan></text><circle cx="615.3" cy="102.0" r="14" fill="#203a6e"/><text x="615.3" y="106.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><rect x="613.3" y="197.0" width="246.7" height="75.5" rx="10" fill="#e2e9f7" stroke="#8ca2ce" stroke-width="1.4"/><text x="627.3" y="219.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="627.3">Analizar con el criterio previo</tspan><tspan x="627.3" dy="16.5">y corregir por comparaciones</tspan><tspan x="627.3" dy="16.5">múltiples</tspan></text><circle cx="615.3" cy="199.0" r="14" fill="#203a6e"/><text x="615.3" y="203.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">4</text><rect x="326.7" y="197.0" width="246.7" height="75.5" rx="10" fill="#e2e9f7" stroke="#8ca2ce" stroke-width="1.4"/><text x="340.7" y="219.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="340.7">Replicar los resultados que</tspan><tspan x="340.7" dy="16.5">sostienen decisiones importantes</tspan></text><circle cx="328.7" cy="199.0" r="14" fill="#203a6e"/><text x="328.7" y="203.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">5</text><line x1="289.7" y1="129.5" x2="318.7" y2="129.5" stroke="#395fac" stroke-width="2.2" stroke-linecap="round"/><polygon points="323.7,129.5 315.6,133.4 315.6,125.6" fill="#395fac"/><line x1="576.3" y1="129.5" x2="605.3" y2="129.5" stroke="#395fac" stroke-width="2.2" stroke-linecap="round"/><polygon points="610.3,129.5 602.2,133.4 602.2,125.6" fill="#395fac"/><line x1="736.7" y1="161.0" x2="736.7" y2="189.0" stroke="#395fac" stroke-width="2.2" stroke-linecap="round"/><polygon points="736.7,194.0 732.8,185.9 740.6,185.9" fill="#395fac"/><line x1="610.3" y1="234.8" x2="581.3" y2="234.8" stroke="#395fac" stroke-width="2.2" stroke-linecap="round"/><polygon points="576.3,234.8 584.4,230.8 584.4,238.7" fill="#395fac"/><text x="40" y="310.5" font-size="11.5" fill="#395fac" font-weight="700" letter-spacing="1.4">CONCEPTOS Y DÓNDE ACTÚAN EN EL MÉTODO</text><rect x="40.0" y="324.5" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#8ca2ce" stroke-width="1.4"/><rect x="40.0" y="332.5" width="5" height="62.2" rx="2" fill="#395fac"/><text x="56.0" y="346.5" font-size="13.5" fill="#203a6e" font-weight="700" text-anchor="start"><tspan x="56.0">Significancia estadística</tspan></text><text x="56.0" y="366.3" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Probabilidad de observar el resultado si no existiera</tspan><tspan x="56.0" dy="15.2">efecto real</tspan></text><rect x="459.0" y="324.5" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#8ca2ce" stroke-width="1.4"/><rect x="459.0" y="332.5" width="5" height="62.2" rx="2" fill="#395fac"/><text x="475.0" y="346.5" font-size="13.5" fill="#203a6e" font-weight="700" text-anchor="start"><tspan x="475.0">Efecto mínimo detectable</tspan></text><text x="475.0" y="366.3" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Magnitud más pequeña que el test puede identificar con la</tspan><tspan x="475.0" dy="15.2">muestra</tspan></text><rect x="40.0" y="416.7" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#8ca2ce" stroke-width="1.4"/><rect x="40.0" y="424.7" width="5" height="62.2" rx="2" fill="#395fac"/><text x="56.0" y="438.7" font-size="13.5" fill="#203a6e" font-weight="700" text-anchor="start"><tspan x="56.0">Comparaciones múltiples</tspan></text><text x="56.0" y="458.5" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Aumento de falsos positivos al evaluar varias métricas o</tspan><tspan x="56.0" dy="15.2">variantes</tspan></text><rect x="379.0" y="424.7" width="54" height="20" rx="10" fill="#bccae5" stroke="#8ca2ce" stroke-width="1"/><text x="406.0" y="438.7" font-size="11" fill="#203a6e" font-weight="700" text-anchor="middle">↔ 4</text><rect x="459.0" y="416.7" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#8ca2ce" stroke-width="1.4"/><rect x="459.0" y="424.7" width="5" height="62.2" rx="2" fill="#395fac"/><text x="475.0" y="438.7" font-size="13.5" fill="#203a6e" font-weight="700" text-anchor="start"><tspan x="475.0">Replicación</tspan></text><text x="475.0" y="458.5" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Confirmación del resultado al repetir el experimento</tspan></text><rect x="798.0" y="424.7" width="54" height="20" rx="10" fill="#bccae5" stroke="#8ca2ce" stroke-width="1"/><text x="825.0" y="438.7" font-size="11" fill="#203a6e" font-weight="700" text-anchor="middle">↔ 5</text><text x="40" y="526.86" font-size="11.5" fill="#395fac" font-weight="700" letter-spacing="1.4">QUÉ SE MIDE: NUMERADOR SOBRE DENOMINADOR</text><rect x="40.0" y="540.9" width="261.3" height="122.7" rx="8" fill="#e2e9f7" stroke="#8ca2ce" stroke-width="1.4"/><text x="54.0" y="562.9" font-size="13" fill="#203a6e" font-weight="700" text-anchor="start"><tspan x="54.0">Potencia calculada antes de</tspan><tspan x="54.0" dy="17.2">iniciar</tspan></text><text x="54.0" y="609.2" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Tests con cálculo previo de muestra</tspan></text><line x1="54.0" y1="630.4" x2="287.3" y2="630.4" stroke="#395fac" stroke-width="2"/><text x="54.0" y="648.4" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="54.0">Tests ejecutados</tspan></text><rect x="319.3" y="540.9" width="261.3" height="122.7" rx="8" fill="#e2e9f7" stroke="#8ca2ce" stroke-width="1.4"/><text x="333.3" y="562.9" font-size="13" fill="#203a6e" font-weight="700" text-anchor="start"><tspan x="333.3">Tasa de replicación</tspan></text><text x="333.3" y="592.0" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="333.3">Resultados confirmados al repetir</tspan></text><line x1="333.3" y1="613.2" x2="566.7" y2="613.2" stroke="#395fac" stroke-width="2"/><text x="333.3" y="631.2" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="333.3">Resultados positivos</tspan></text><rect x="598.7" y="540.9" width="261.3" height="122.7" rx="8" fill="#e2e9f7" stroke="#8ca2ce" stroke-width="1.4"/><text x="612.7" y="562.9" font-size="13" fill="#203a6e" font-weight="700" text-anchor="start"><tspan x="612.7">Tests detenidos anticipadamente</tspan></text><text x="612.7" y="592.0" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="612.7">Pruebas interrumpidas antes del</tspan><tspan x="612.7" dy="15.2">plazo</tspan></text><line x1="612.7" y1="628.4" x2="846.0" y2="628.4" stroke="#395fac" stroke-width="2"/><text x="612.7" y="646.4" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="612.7">Pruebas ejecutadas</tspan></text><text x="40" y="697.54" font-size="11.5" fill="#395fac" font-weight="700" letter-spacing="1.4">FRONTERA DE APLICACIÓN</text><rect x="40" y="707.5" width="820" height="65.0" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.4"/><polygon points="70,725.04 52,754.04 88,754.04" fill="#c2410c"/><text x="70" y="751.04" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">!</text><text x="106" y="731.5" font-size="12.5" fill="#7c2d12" font-weight="400" text-anchor="start"><tspan x="106">Un test bien ejecutado establece causalidad sólo en el contexto probado. Extrapolar a otro segmento, canal</tspan><tspan x="106" dy="16.5">o temporada exige una nueva verificación.</tspan></text><text x="40" y="800.54" font-size="11.5" fill="#395fac" font-weight="700" letter-spacing="1.4">ERROR FRECUENTE Y SU CORRECCIÓN</text><rect x="40" y="810.5" width="380.0" height="77.0" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/><text x="54" y="832.5" font-size="11" fill="#b91c1c" font-weight="700" text-anchor="start"><tspan x="54">Síntoma</tspan></text><text x="54" y="850.5" font-size="12.5" fill="#7f1d1d" font-weight="400" text-anchor="start"><tspan x="54">Evaluar múltiples métricas y declarar victoria por</tspan><tspan x="54" dy="16.5">la favorable</tspan></text><line x1="426.0" y1="849.0" x2="469.0" y2="849.0" stroke="#395fac" stroke-width="2.6" stroke-linecap="round"/><polygon points="474.0,849.0 465.9,853.0 465.9,845.1" fill="#395fac"/><rect x="480.0" y="810.5" width="380.0" height="77.0" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.4"/><text x="494.0" y="832.5" font-size="11" fill="#15803d" font-weight="700" text-anchor="start"><tspan x="494.0">Corrección</tspan></text><text x="494.0" y="850.5" font-size="12.5" fill="#14532d" font-weight="400" text-anchor="start"><tspan x="494.0">Declara una métrica principal antes de iniciar y</tspan><tspan x="494.0" dy="16.5">corrige por comparaciones múltiples.</tspan></text></svg>