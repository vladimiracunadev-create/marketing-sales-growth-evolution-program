<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 957" width="900" height="957" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif"><title id="t">Modelo mental · Qué es una marca</title><desc id="d">Modelo mental de la clase 06.01: Qué es una marca. Método en 5 pasos; 4 conceptos; 3 señales de medición.</desc><rect x="0" y="0" width="900" height="957" rx="14" fill="#ffffff"/><rect x="0" y="0" width="900" height="64" rx="14" fill="#57206e"/><rect x="0" y="40" width="900" height="24" fill="#57206e"/><text x="40" y="28" font-size="12" fill="#d9bce5" font-weight="700" letter-spacing="1.6">MODELO MENTAL · CLASE 06.01 · PARTE 06</text><text x="40" y="52" font-size="21" fill="#ffffff" font-weight="700">Qué es una marca</text><text x="40" y="84" font-size="11.5" fill="#8939ac" font-weight="700" letter-spacing="1.4">MÉTODO PASO A PASO</text><rect x="40.0" y="100" width="246.7" height="75.5" rx="10" fill="#f1e2f7" stroke="#ba8cce" stroke-width="1.4"/><text x="54.0" y="122" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Identificar las situaciones de</tspan><tspan x="54.0" dy="16.5">compra en que la marca debería</tspan><tspan x="54.0" dy="16.5">aparecer</tspan></text><circle cx="42.0" cy="102.0" r="14" fill="#57206e"/><text x="42.0" y="106.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><rect x="326.7" y="100" width="246.7" height="75.5" rx="10" fill="#f1e2f7" stroke="#ba8cce" stroke-width="1.4"/><text x="340.7" y="122" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="340.7">Medir el recuerdo espontáneo en</tspan><tspan x="340.7" dy="16.5">esas situaciones</tspan></text><circle cx="328.7" cy="102.0" r="14" fill="#57206e"/><text x="328.7" y="106.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><rect x="613.3" y="100" width="246.7" height="75.5" rx="10" fill="#f1e2f7" stroke="#ba8cce" stroke-width="1.4"/><text x="627.3" y="122" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="627.3">Auditar la disponibilidad física</tspan><tspan x="627.3" dy="16.5">en los canales relevantes</tspan></text><circle cx="615.3" cy="102.0" r="14" fill="#57206e"/><text x="615.3" y="106.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><rect x="613.3" y="213.5" width="246.7" height="59.0" rx="10" fill="#f1e2f7" stroke="#ba8cce" stroke-width="1.4"/><text x="627.3" y="235.5" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="627.3">Priorizar la brecha mayor entre</tspan><tspan x="627.3" dy="16.5">ambas disponibilidades</tspan></text><circle cx="615.3" cy="215.5" r="14" fill="#57206e"/><text x="615.3" y="220.0" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">4</text><rect x="326.7" y="213.5" width="246.7" height="59.0" rx="10" fill="#f1e2f7" stroke="#ba8cce" stroke-width="1.4"/><text x="340.7" y="235.5" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="340.7">Definir la inversión y su</tspan><tspan x="340.7" dy="16.5">métrica de seguimiento</tspan></text><circle cx="328.7" cy="215.5" r="14" fill="#57206e"/><text x="328.7" y="220.0" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">5</text><line x1="289.7" y1="137.8" x2="318.7" y2="137.8" stroke="#8939ac" stroke-width="2.2" stroke-linecap="round"/><polygon points="323.7,137.8 315.6,141.7 315.6,133.8" fill="#8939ac"/><line x1="576.3" y1="137.8" x2="605.3" y2="137.8" stroke="#8939ac" stroke-width="2.2" stroke-linecap="round"/><polygon points="610.3,137.8 602.2,141.7 602.2,133.8" fill="#8939ac"/><line x1="736.7" y1="177.5" x2="736.7" y2="205.5" stroke="#8939ac" stroke-width="2.2" stroke-linecap="round"/><polygon points="736.7,210.5 732.8,202.4 740.6,202.4" fill="#8939ac"/><line x1="610.3" y1="243.0" x2="581.3" y2="243.0" stroke="#8939ac" stroke-width="2.2" stroke-linecap="round"/><polygon points="576.3,243.0 584.4,239.1 584.4,246.9" fill="#8939ac"/><text x="40" y="310.5" font-size="11.5" fill="#8939ac" font-weight="700" letter-spacing="1.4">CONCEPTOS Y DÓNDE ACTÚAN EN EL MÉTODO</text><rect x="40.0" y="324.5" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#ba8cce" stroke-width="1.4"/><rect x="40.0" y="332.5" width="5" height="62.2" rx="2" fill="#8939ac"/><text x="56.0" y="346.5" font-size="13.5" fill="#57206e" font-weight="700" text-anchor="start"><tspan x="56.0">Disponibilidad mental</tspan></text><text x="56.0" y="366.3" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Probabilidad de que la marca sea recordada en una</tspan><tspan x="56.0" dy="15.2">situación de compra concreta</tspan></text><rect x="379.0" y="332.5" width="54" height="20" rx="10" fill="#d9bce5" stroke="#ba8cce" stroke-width="1"/><text x="406.0" y="346.5" font-size="11" fill="#57206e" font-weight="700" text-anchor="middle">↔ 1, 3, 4</text><rect x="459.0" y="324.5" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#ba8cce" stroke-width="1.4"/><rect x="459.0" y="332.5" width="5" height="62.2" rx="2" fill="#8939ac"/><text x="475.0" y="346.5" font-size="13.5" fill="#57206e" font-weight="700" text-anchor="start"><tspan x="475.0">Disponibilidad física</tspan></text><text x="475.0" y="366.3" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Facilidad con que el cliente puede encontrar y comprar la</tspan><tspan x="475.0" dy="15.2">marca cuando decide</tspan></text><rect x="798.0" y="332.5" width="54" height="20" rx="10" fill="#d9bce5" stroke="#ba8cce" stroke-width="1"/><text x="825.0" y="346.5" font-size="11" fill="#57206e" font-weight="700" text-anchor="middle">↔ 1, 3, 4</text><rect x="40.0" y="416.7" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#ba8cce" stroke-width="1.4"/><rect x="40.0" y="424.7" width="5" height="62.2" rx="2" fill="#8939ac"/><text x="56.0" y="438.7" font-size="13.5" fill="#57206e" font-weight="700" text-anchor="start"><tspan x="56.0">Estructura de memoria</tspan></text><text x="56.0" y="458.5" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Red de asociaciones entre la marca y las situaciones,</tspan><tspan x="56.0" dy="15.2">necesidades y señales que la evocan</tspan></text><rect x="379.0" y="424.7" width="54" height="20" rx="10" fill="#d9bce5" stroke="#ba8cce" stroke-width="1"/><text x="406.0" y="438.7" font-size="11" fill="#57206e" font-weight="700" text-anchor="middle">↔ 1</text><rect x="459.0" y="416.7" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#ba8cce" stroke-width="1.4"/><rect x="459.0" y="424.7" width="5" height="62.2" rx="2" fill="#8939ac"/><text x="475.0" y="438.7" font-size="13.5" fill="#57206e" font-weight="700" text-anchor="start"><tspan x="475.0">Activo de marca</tspan></text><text x="475.0" y="458.5" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Elemento distintivo que el mercado asocia de forma única</tspan><tspan x="475.0" dy="15.2">con la marca</tspan></text><rect x="798.0" y="424.7" width="54" height="20" rx="10" fill="#d9bce5" stroke="#ba8cce" stroke-width="1"/><text x="825.0" y="438.7" font-size="11" fill="#57206e" font-weight="700" text-anchor="middle">↔ 1</text><text x="40" y="526.86" font-size="11.5" fill="#8939ac" font-weight="700" letter-spacing="1.4">QUÉ SE MIDE: NUMERADOR SOBRE DENOMINADOR</text><rect x="40.0" y="540.9" width="261.3" height="137.9" rx="8" fill="#f1e2f7" stroke="#ba8cce" stroke-width="1.4"/><text x="54.0" y="562.9" font-size="13" fill="#57206e" font-weight="700" text-anchor="start"><tspan x="54.0">Recuerdo espontáneo por</tspan><tspan x="54.0" dy="17.2">situación</tspan></text><text x="54.0" y="609.2" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Personas que nombran la marca ante</tspan><tspan x="54.0" dy="15.2">la situación de compra</tspan></text><line x1="54.0" y1="645.5" x2="287.3" y2="645.5" stroke="#8939ac" stroke-width="2"/><text x="54.0" y="663.5" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="54.0">Personas encuestadas del segmento</tspan></text><rect x="319.3" y="540.9" width="261.3" height="137.9" rx="8" fill="#f1e2f7" stroke="#ba8cce" stroke-width="1.4"/><text x="333.3" y="562.9" font-size="13" fill="#57206e" font-weight="700" text-anchor="start"><tspan x="333.3">Cobertura de canales</tspan></text><text x="333.3" y="592.0" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="333.3">Canales relevantes donde la marca</tspan><tspan x="333.3" dy="15.2">está disponible</tspan></text><line x1="333.3" y1="628.4" x2="566.7" y2="628.4" stroke="#8939ac" stroke-width="2"/><text x="333.3" y="646.4" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="333.3">Canales identificados</tspan></text><rect x="598.7" y="540.9" width="261.3" height="137.9" rx="8" fill="#f1e2f7" stroke="#ba8cce" stroke-width="1.4"/><text x="612.7" y="562.9" font-size="13" fill="#57206e" font-weight="700" text-anchor="start"><tspan x="612.7">Participación en la</tspan><tspan x="612.7" dy="17.2">consideración</tspan></text><text x="612.7" y="609.2" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="612.7">Oportunidades donde la marca fue</tspan><tspan x="612.7" dy="15.2">evaluada</tspan></text><line x1="612.7" y1="645.5" x2="846.0" y2="645.5" stroke="#8939ac" stroke-width="2"/><text x="612.7" y="663.5" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="612.7">Oportunidades detectadas</tspan></text><text x="40" y="712.72" font-size="11.5" fill="#8939ac" font-weight="700" letter-spacing="1.4">FRONTERA DE APLICACIÓN</text><rect x="40" y="722.7" width="820" height="65.0" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.4"/><polygon points="70,740.22 52,769.22 88,769.22" fill="#c2410c"/><text x="70" y="766.22" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">!</text><text x="106" y="746.7" font-size="12.5" fill="#7c2d12" font-weight="400" text-anchor="start"><tspan x="106">La marca no compensa una oferta que no resuelve el problema. Aumentar el recuerdo de un producto</tspan><tspan x="106" dy="16.5">insatisfactorio acelera la difusión de la insatisfacción.</tspan></text><text x="40" y="815.72" font-size="11.5" fill="#8939ac" font-weight="700" letter-spacing="1.4">ERROR FRECUENTE Y SU CORRECCIÓN</text><rect x="40" y="825.7" width="380.0" height="93.5" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/><text x="54" y="847.7" font-size="11" fill="#b91c1c" font-weight="700" text-anchor="start"><tspan x="54">Síntoma</tspan></text><text x="54" y="865.7" font-size="12.5" fill="#7f1d1d" font-weight="400" text-anchor="start"><tspan x="54">Medir marca por gusto del logo</tspan></text><line x1="426.0" y1="872.5" x2="469.0" y2="872.5" stroke="#8939ac" stroke-width="2.6" stroke-linecap="round"/><polygon points="474.0,872.5 465.9,876.4 465.9,868.6" fill="#8939ac"/><rect x="480.0" y="825.7" width="380.0" height="93.5" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.4"/><text x="494.0" y="847.7" font-size="11" fill="#15803d" font-weight="700" text-anchor="start"><tspan x="494.0">Corrección</tspan></text><text x="494.0" y="865.7" font-size="12.5" fill="#14532d" font-weight="400" text-anchor="start"><tspan x="494.0">Mide recuerdo espontáneo ante la situación de</tspan><tspan x="494.0" dy="16.5">compra y disponibilidad en canal, no preferencia</tspan><tspan x="494.0" dy="16.5">estética.</tspan></text></svg>