<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 966" width="900" height="966" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif"><title id="t">Modelo mental · Pricing por competencia</title><desc id="d">Modelo mental de la clase 07.03: Pricing por competencia. Método en 5 pasos; 4 conceptos; 3 señales de medición.</desc><rect x="0" y="0" width="900" height="966" rx="14" fill="#ffffff"/><rect x="0" y="0" width="900" height="64" rx="14" fill="#6e2048"/><rect x="0" y="40" width="900" height="24" fill="#6e2048"/><text x="40" y="28" font-size="12" fill="#e5bcd1" font-weight="700" letter-spacing="1.6">MODELO MENTAL · CLASE 07.03 · PARTE 07</text><text x="40" y="52" font-size="21" fill="#ffffff" font-weight="700">Pricing por competencia</text><text x="40" y="84" font-size="11.5" fill="#ac3974" font-weight="700" letter-spacing="1.4">MÉTODO PASO A PASO</text><line x1="450.0" y1="94.0" x2="450.0" y2="300.5" stroke="#ce8cae" stroke-width="3" stroke-linecap="round"/><line x1="450.0" y1="129.5" x2="406.0" y2="129.5" stroke="#ce8cae" stroke-width="2"/><rect x="56.0" y="100" width="350" height="59.0" rx="10" fill="#f7e2ed" stroke="#ce8cae" stroke-width="1.4"/><text x="70.0" y="122" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="70.0">Construir la comparación con alcance</tspan><tspan x="70.0" dy="16.5">equivalente</tspan></text><circle cx="450.0" cy="129.5" r="15" fill="#6e2048"/><text x="450.0" y="134.0" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><line x1="450.0" y1="167.5" x2="494.0" y2="167.5" stroke="#ce8cae" stroke-width="2"/><rect x="494.0" y="138" width="350" height="59.0" rx="10" fill="#f7e2ed" stroke="#ce8cae" stroke-width="1.4"/><text x="508.0" y="160" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="508.0">Cuantificar el valor diferencial en unidades</tspan><tspan x="508.0" dy="16.5">del cliente</tspan></text><circle cx="450.0" cy="167.5" r="15" fill="#6e2048"/><text x="450.0" y="172.0" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><line x1="450.0" y1="205.5" x2="406.0" y2="205.5" stroke="#ce8cae" stroke-width="2"/><rect x="56.0" y="176" width="350" height="59.0" rx="10" fill="#f7e2ed" stroke="#ce8cae" stroke-width="1.4"/><text x="70.0" y="198" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="70.0">Estimar la capacidad del competidor de sostener</tspan><tspan x="70.0" dy="16.5">su precio</tspan></text><circle cx="450.0" cy="205.5" r="15" fill="#6e2048"/><text x="450.0" y="210.0" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><line x1="450.0" y1="243.5" x2="494.0" y2="243.5" stroke="#ce8cae" stroke-width="2"/><rect x="494.0" y="214" width="350" height="59.0" rx="10" fill="#f7e2ed" stroke="#ce8cae" stroke-width="1.4"/><text x="508.0" y="236" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="508.0">Decidir posición relativa con criterio</tspan><tspan x="508.0" dy="16.5">explícito</tspan></text><circle cx="450.0" cy="243.5" r="15" fill="#6e2048"/><text x="450.0" y="248.0" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">4</text><line x1="450.0" y1="273.2" x2="406.0" y2="273.2" stroke="#ce8cae" stroke-width="2"/><rect x="56.0" y="252" width="350" height="42.5" rx="10" fill="#f7e2ed" stroke="#ce8cae" stroke-width="1.4"/><text x="70.0" y="274" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="70.0">Monitorear el efecto en participación y margen</tspan></text><circle cx="450.0" cy="273.2" r="15" fill="#6e2048"/><text x="450.0" y="277.8" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">5</text><text x="40" y="336.5" font-size="11.5" fill="#ac3974" font-weight="700" letter-spacing="1.4">CONCEPTOS Y DÓNDE ACTÚAN EN EL MÉTODO</text><rect x="40.0" y="350.5" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#ce8cae" stroke-width="1.4"/><rect x="40.0" y="358.5" width="5" height="62.2" rx="2" fill="#ac3974"/><text x="56.0" y="372.5" font-size="13.5" fill="#6e2048" font-weight="700" text-anchor="start"><tspan x="56.0">Precio de referencia competitivo</tspan></text><text x="56.0" y="392.3" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Precio que el cliente considera normal en la categoría,</tspan><tspan x="56.0" dy="15.2">formado por las alternativas visibles</tspan></text><rect x="379.0" y="358.5" width="54" height="20" rx="10" fill="#e5bcd1" stroke="#ce8cae" stroke-width="1"/><text x="406.0" y="372.5" font-size="11" fill="#6e2048" font-weight="700" text-anchor="middle">↔ 3</text><rect x="459.0" y="350.5" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#ce8cae" stroke-width="1.4"/><rect x="459.0" y="358.5" width="5" height="62.2" rx="2" fill="#ac3974"/><text x="475.0" y="372.5" font-size="13.5" fill="#6e2048" font-weight="700" text-anchor="start"><tspan x="475.0">Comparabilidad real</tspan></text><text x="475.0" y="392.3" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Grado en que dos ofertas entregan el mismo alcance, riesgo</tspan><tspan x="475.0" dy="15.2">y servicio</tspan></text><rect x="798.0" y="358.5" width="54" height="20" rx="10" fill="#e5bcd1" stroke="#ce8cae" stroke-width="1"/><text x="825.0" y="372.5" font-size="11" fill="#6e2048" font-weight="700" text-anchor="middle">↔ 1</text><rect x="40.0" y="442.7" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#ce8cae" stroke-width="1.4"/><rect x="40.0" y="450.7" width="5" height="62.2" rx="2" fill="#ac3974"/><text x="56.0" y="464.7" font-size="13.5" fill="#6e2048" font-weight="700" text-anchor="start"><tspan x="56.0">Guerra de precios</tspan></text><text x="56.0" y="484.5" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Espiral de reducciones que erosiona el margen de toda la</tspan><tspan x="56.0" dy="15.2">categoría</tspan></text><rect x="379.0" y="450.7" width="54" height="20" rx="10" fill="#e5bcd1" stroke="#ce8cae" stroke-width="1"/><text x="406.0" y="464.7" font-size="11" fill="#6e2048" font-weight="700" text-anchor="middle">↔ 3</text><rect x="459.0" y="442.7" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#ce8cae" stroke-width="1.4"/><rect x="459.0" y="450.7" width="5" height="62.2" rx="2" fill="#ac3974"/><text x="475.0" y="464.7" font-size="13.5" fill="#6e2048" font-weight="700" text-anchor="start"><tspan x="475.0">Valor diferencial cuantificado</tspan></text><text x="475.0" y="484.5" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Monto en que la oferta supera a la alternativa, expresado</tspan><tspan x="475.0" dy="15.2">en la unidad del cliente</tspan></text><rect x="798.0" y="450.7" width="54" height="20" rx="10" fill="#e5bcd1" stroke="#ce8cae" stroke-width="1"/><text x="825.0" y="464.7" font-size="11" fill="#6e2048" font-weight="700" text-anchor="middle">↔ 2</text><text x="40" y="552.86" font-size="11.5" fill="#ac3974" font-weight="700" letter-spacing="1.4">QUÉ SE MIDE: NUMERADOR SOBRE DENOMINADOR</text><rect x="40.0" y="566.9" width="261.3" height="137.9" rx="8" fill="#f7e2ed" stroke="#ce8cae" stroke-width="1.4"/><text x="54.0" y="588.9" font-size="13" fill="#6e2048" font-weight="700" text-anchor="start"><tspan x="54.0">Brecha de precio ajustada por</tspan><tspan x="54.0" dy="17.2">alcance</tspan></text><text x="54.0" y="635.2" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Diferencia de precio efectivo tras</tspan><tspan x="54.0" dy="15.2">normalizar por alcance y servicio</tspan><tspan x="54.0" dy="15.2">incluido</tspan></text><rect x="319.3" y="566.9" width="261.3" height="137.9" rx="8" fill="#f7e2ed" stroke="#ce8cae" stroke-width="1.4"/><text x="333.3" y="588.9" font-size="13" fill="#6e2048" font-weight="700" text-anchor="start"><tspan x="333.3">Participación en negocios</tspan><tspan x="333.3" dy="17.2">enfrentados</tspan></text><text x="333.3" y="635.2" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="333.3">Negocios ganados frente al</tspan><tspan x="333.3" dy="15.2">competidor</tspan></text><line x1="333.3" y1="671.5" x2="566.7" y2="671.5" stroke="#ac3974" stroke-width="2"/><text x="333.3" y="689.5" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="333.3">Negocios donde estuvo presente</tspan></text><rect x="598.7" y="566.9" width="261.3" height="137.9" rx="8" fill="#f7e2ed" stroke="#ce8cae" stroke-width="1.4"/><text x="612.7" y="588.9" font-size="13" fill="#6e2048" font-weight="700" text-anchor="start"><tspan x="612.7">Evolución del margen tras el</tspan><tspan x="612.7" dy="17.2">ajuste</tspan></text><text x="612.7" y="635.2" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="612.7">Variación del margen de contribución</tspan><tspan x="612.7" dy="15.2">en los dos trimestres posteriores</tspan></text><text x="40" y="738.72" font-size="11.5" fill="#ac3974" font-weight="700" letter-spacing="1.4">FRONTERA DE APLICACIÓN</text><rect x="40" y="748.7" width="820" height="65.0" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.4"/><polygon points="70,766.22 52,795.22 88,795.22" fill="#c2410c"/><text x="70" y="792.22" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">!</text><text x="106" y="772.7" font-size="12.5" fill="#7c2d12" font-weight="400" text-anchor="start"><tspan x="106">Igualar precios con un competidor financiado por capital de riesgo puede ser insostenible. La comparación</tspan><tspan x="106" dy="16.5">debe incluir capacidad de resistencia, no sólo nivel de precio.</tspan></text><text x="40" y="841.72" font-size="11.5" fill="#ac3974" font-weight="700" letter-spacing="1.4">ERROR FRECUENTE Y SU CORRECCIÓN</text><rect x="40" y="851.7" width="380.0" height="77.0" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/><text x="54" y="873.7" font-size="11" fill="#b91c1c" font-weight="700" text-anchor="start"><tspan x="54">Síntoma</tspan></text><text x="54" y="891.7" font-size="12.5" fill="#7f1d1d" font-weight="400" text-anchor="start"><tspan x="54">Comparar precios de lista sin normalizar alcance</tspan></text><line x1="426.0" y1="890.2" x2="469.0" y2="890.2" stroke="#ac3974" stroke-width="2.6" stroke-linecap="round"/><polygon points="474.0,890.2 465.9,894.1 465.9,886.3" fill="#ac3974"/><rect x="480.0" y="851.7" width="380.0" height="77.0" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.4"/><text x="494.0" y="873.7" font-size="11" fill="#15803d" font-weight="700" text-anchor="start"><tspan x="494.0">Corrección</tspan></text><text x="494.0" y="891.7" font-size="12.5" fill="#14532d" font-weight="400" text-anchor="start"><tspan x="494.0">Construye una tabla de equivalencia que incluya</tspan><tspan x="494.0" dy="16.5">implementación, soporte y garantías.</tspan></text></svg>