<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1090" width="900" height="1090" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif"><title id="t">Modelo mental · OKR y KPI</title><desc id="d">Modelo mental de la clase 23.07: OKR y KPI. Método en 5 pasos; 4 conceptos; 3 señales de medición.</desc><rect x="0" y="0" width="900" height="1090" rx="14" fill="#ffffff"/><rect x="0" y="0" width="900" height="64" rx="14" fill="#6e2120"/><rect x="0" y="40" width="900" height="24" fill="#6e2120"/><text x="40" y="28" font-size="12" fill="#e5bdbc" font-weight="700" letter-spacing="1.6">MODELO MENTAL · CLASE 23.07 · PARTE 23</text><text x="40" y="52" font-size="21" fill="#ffffff" font-weight="700">OKR y KPI</text><text x="40" y="84" font-size="11.5" fill="#ac3b39" font-weight="700" letter-spacing="1.4">MÉTODO PASO A PASO</text><path d="M66.0,159.0 V202.5 H158.5" fill="none" stroke="#ac3b39" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="160.5,202.5 151.5,197.5 151.5,207.5" fill="#ac3b39"/><path d="M188.5,232.0 V275.5 H281.0" fill="none" stroke="#ac3b39" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="283.0,275.5 274.0,270.5 274.0,280.5" fill="#ac3b39"/><path d="M311.0,305.0 V348.5 H403.5" fill="none" stroke="#ac3b39" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="405.5,348.5 396.5,343.5 396.5,353.5" fill="#ac3b39"/><path d="M433.5,378.0 V421.5 H526.0" fill="none" stroke="#ac3b39" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="528.0,421.5 519.0,416.5 519.0,426.5" fill="#ac3b39"/><rect x="40.0" y="100.0" width="330" height="59.0" rx="10" fill="#f7e2e2" stroke="#ce8d8c" stroke-width="1.4"/><text x="54.0" y="122.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Separar indicadores de estado de objetivos</tspan><tspan x="54.0" dy="16.5">del periodo</tspan></tex