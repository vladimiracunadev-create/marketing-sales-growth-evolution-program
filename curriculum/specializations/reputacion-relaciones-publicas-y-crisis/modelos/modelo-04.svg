<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1056" width="900" height="1056" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif"><title id="t">Modelo mental · Partes interesadas, asuntos públicos y gestión de controversias</title><desc id="d">Modelo mental de la clase ESP.04: Partes interesadas, asuntos públicos y gestión de controversias. Método en 7 pasos; 7 conceptos; 0 señales de medición.</desc><rect x="0" y="0" width="900" height="1056" rx="14" fill="#ffffff"/><rect x="0" y="0" width="900" height="64" rx="14" fill="#406e20"/><rect x="0" y="40" width="900" height="24" fill="#406e20"/><text x="40" y="28" font-size="12" fill="#cde5bc" font-weight="700" letter-spacing="1.6">MODELO MENTAL · CLASE ESP.04 · ESPECIALIZACIÓN</text><text x="40" y="52" font-size="21" fill="#ffffff" font-weight="700">Partes interesadas, asuntos públicos y gestión de controversias</text><text x="40" y="84" font-size="11.5" fill="#69ac39" font-weight="700" letter-spacing="1.4">MÉTODO PASO A PASO</text><line x1="450.0" y1="94.0" x2="450.0" y2="406.5" stroke="#a7ce8c" stroke-width="3" stroke-linecap="round"/><line x1="450.0" y1="130.0" x2="406.0" y2="130.0" stroke="#a7ce8c" stroke-width="2"/><rect x="56.0" y="100" width="350" height="75.5" rx="10" fill="#ebf7e2" stroke="#a7ce8c" stroke-width="1.4"/><text x="70.0" y="122" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="70.0">Listar partes interesadas por función:</tspan><tspan x="70.0" dy="16.5">afectadas, decisoras, reguladoras, influyentes</tspan><tspan x="70.0" dy="16.5">y colaboradoras</tspan></text><circle cx="450.0" cy="130.0" r="15" fill="#406e20"/><text x="450.0" y="134.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><line x1="450.0" y1="167.5" x2="494.0" y2="167.5" stroke="#a7ce8c" stroke-width="2"/><rect x="494.0" y="138" width="350" height="59.0" rx="10" fill="#ebf7e2" stroke="#a7ce8c" stroke-width="1.4"/><text x="508.0" y="160" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="508.0">Describir para cada una qué espera, qué puede</tspan><tspan x="508.0" dy="16.5">hacer a la organización y qué canal la alcanza</tspan></text><circle cx="450.0" cy="167.5" r="15" fill="#406e20"/><text x="450.0" y="172.0" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><line x1="450.0" y1="219.0" x2="406.0" y2="219.0" stroke="#a7ce8c" stroke-width="2"/><rect x="56.0" y="189.5" width="350" height="59.0" rx="10" fill="#ebf7e2" stroke="#a7ce8c" stroke-width="1.4"/><text x="70.0" y="211.5" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="70.0">Puntuar poder, legitimidad y urgencia de 0 a 3</tspan><tspan x="70.0" dy="16.5">con la evidencia que lo justifica</tspan></text><circle cx="450.0" cy="219.0" r="15" fill="#406e20"/><text x="450.0" y="223.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><line x1="450.0" y1="257.0" x2="494.0" y2="257.0" stroke="#a7ce8c" stroke-width="2"/><rect x="494.0" y="227.5" width="350" height="59.0" rx="10" fill="#ebf7e2" stroke="#a7ce8c" stroke-width="1.4"/><text x="508.0" y="249.5" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="508.0">Ordenar por prominencia y asignar responsable y</tspan><tspan x="508.0" dy="16.5">frecuencia de contacto</tspan></text><circle cx="450.0" cy="257.0" r="15" fill="#406e20"/><text x="450.0" y="261.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">4</text><line x1="450.0" y1="295.0" x2="406.0" y2="295.0" stroke="#a7ce8c" stroke-width="2"/><rect x="56.0" y="265.5" width="350" height="59.0" rx="10" fill="#ebf7e2" stroke="#a7ce8c" stroke-width="1.4"/><text x="70.0" y="287.5" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="70.0">Registrar temas emergentes con probabilidad,</tspan><tspan x="70.0" dy="16.5">impacto, posición y dueño</tspan></text><circle cx="450.0" cy="295.0" r="15" fill="#406e20"/><text x="450.0" y="299.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">5</text><line x1="450.0" y1="333.0" x2="494.0" y2="333.0" stroke="#a7ce8c" stroke-width="2"/><rect x="494.0" y="303.5" width="350" height="59.0" rx="10" fill="#ebf7e2" stroke="#a7ce8c" stroke-width="1.4"/><text x="508.0" y="325.5" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="508.0">Decidir por tema: preparar, dialogar o ajustar</tspan><tspan x="508.0" dy="16.5">práctica</tspan></text><circle cx="450.0" cy="333.0" r="15" fill="#406e20"/><text x="450.0" y="337.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">6</text><line x1="450.0" y1="371.0" x2="406.0" y2="371.0" stroke="#a7ce8c" stroke-width="2"/><rect x="56.0" y="341.5" width="350" height="59.0" rx="10" fill="#ebf7e2" stroke="#a7ce8c" stroke-width="1.4"/><text x="70.0" y="363.5" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="70.0">Definir el umbral que pasa un tema a crisis y</tspan><tspan x="70.0" dy="16.5">revisar el mapa cada trimestre</tspan></text><circle cx="450.0" cy="371.0" r="15" fill="#406e20"/><text x="450.0" y="375.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">7</text><text x="40" y="442.5" font-size="11.5" fill="#69ac39" font-weight="700" letter-spacing="1.4">CONCEPTOS Y DÓNDE ACTÚAN EN EL MÉTODO</text><rect x="40.0" y="456.5" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#a7ce8c" stroke-width="1.4"/><rect x="40.0" y="464.5" width="5" height="62.2" rx="2" fill="#69ac39"/><text x="56.0" y="478.5" font-size="13.5" fill="#406e20" font-weight="700" text-anchor="start"><tspan x="56.0">Parte interesada</tspan></text><text x="56.0" y="498.3" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Persona o grupo que puede afectar o ser afectado por las</tspan><tspan x="56.0" dy="15.2">decisiones de la organización</tspan></text><rect x="379.0" y="464.5" width="54" height="20" rx="10" fill="#cde5bc" stroke="#a7ce8c" stroke-width="1"/><text x="406.0" y="478.5" font-size="11" fill="#406e20" font-weight="700" text-anchor="middle">↔ 1</text><rect x="459.0" y="456.5" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#a7ce8c" stroke-width="1.4"/><rect x="459.0" y="464.5" width="5" height="62.2" rx="2" fill="#69ac39"/><text x="475.0" y="478.5" font-size="13.5" fill="#406e20" font-weight="700" text-anchor="start"><tspan x="475.0">Poder</tspan></text><text x="475.0" y="498.3" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Capacidad de la parte interesada de imponer su voluntad o</tspan><tspan x="475.0" dy="15.2">afectar los resultados</tspan></text><rect x="798.0" y="464.5" width="54" height="20" rx="10" fill="#cde5bc" stroke="#a7ce8c" stroke-width="1"/><text x="825.0" y="478.5" font-size="11" fill="#406e20" font-weight="700" text-anchor="middle">↔ 1, 3</text><rect x="40.0" y="548.7" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#a7ce8c" stroke-width="1.4"/><rect x="40.0" y="556.7" width="5" height="62.2" rx="2" fill="#69ac39"/><text x="56.0" y="570.7" font-size="13.5" fill="#406e20" font-weight="700" text-anchor="start"><tspan x="56.0">Legitimidad</tspan></text><text x="56.0" y="590.5" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Reconocimiento de que su reclamo es deseable, adecuado o</tspan><tspan x="56.0" dy="15.2">apropiado según normas sociales</tspan></text><rect x="379.0" y="556.7" width="54" height="20" rx="10" fill="#cde5bc" stroke="#a7ce8c" stroke-width="1"/><text x="406.0" y="570.7" font-size="11" fill="#406e20" font-weight="700" text-anchor="middle">↔ 3</text><rect x="459.0" y="548.7" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#a7ce8c" stroke-width="1.4"/><rect x="459.0" y="556.7" width="5" height="62.2" rx="2" fill="#69ac39"/><text x="475.0" y="570.7" font-size="13.5" fill="#406e20" font-weight="700" text-anchor="start"><tspan x="475.0">Urgencia</tspan></text><text x="475.0" y="590.5" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Grado en que el reclamo exige atención inmediata por plazo</tspan><tspan x="475.0" dy="15.2">o criticidad</tspan></text><rect x="798.0" y="556.7" width="54" height="20" rx="10" fill="#cde5bc" stroke="#a7ce8c" stroke-width="1"/><text x="825.0" y="570.7" font-size="11" fill="#406e20" font-weight="700" text-anchor="middle">↔ 3</text><rect x="40.0" y="640.9" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#a7ce8c" stroke-width="1.4"/><rect x="40.0" y="648.9" width="5" height="62.2" rx="2" fill="#69ac39"/><text x="56.0" y="662.9" font-size="13.5" fill="#406e20" font-weight="700" text-anchor="start"><tspan x="56.0">Asuntos públicos</tspan></text><text x="56.0" y="682.7" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Gestión de la relación con autoridades, reguladores y</tspan><tspan x="56.0" dy="15.2">política pública que afecta a la organización</tspan></text><rect x="379.0" y="648.9" width="54" height="20" rx="10" fill="#cde5bc" stroke="#a7ce8c" stroke-width="1"/><text x="406.0" y="662.9" font-size="11" fill="#406e20" font-weight="700" text-anchor="middle">↔ 1</text><rect x="459.0" y="640.9" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#a7ce8c" stroke-width="1.4"/><rect x="459.0" y="648.9" width="5" height="62.2" rx="2" fill="#69ac39"/><text x="475.0" y="662.9" font-size="13.5" fill="#406e20" font-weight="700" text-anchor="start"><tspan x="475.0">Tema emergente</tspan></text><text x="475.0" y="682.7" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Asunto con probabilidad de volverse controversia pública</tspan><tspan x="475.0" dy="15.2">por su impacto en personas o valores</tspan></text><rect x="798.0" y="648.9" width="54" height="20" rx="10" fill="#cde5bc" stroke="#a7ce8c" stroke-width="1"/><text x="825.0" y="662.9" font-size="11" fill="#406e20" font-weight="700" text-anchor="middle">↔ 5</text><rect x="40.0" y="733.0" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#a7ce8c" stroke-width="1.4"/><rect x="40.0" y="741.0" width="5" height="62.2" rx="2" fill="#69ac39"/><text x="56.0" y="755.0" font-size="13.5" fill="#406e20" font-weight="700" text-anchor="start"><tspan x="56.0">Mapa de controversias</tspan></text><text x="56.0" y="774.9" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Registro priorizado de temas con probabilidad, impacto,</tspan><tspan x="56.0" dy="15.2">posición y responsable</tspan></text><rect x="379.0" y="741.0" width="54" height="20" rx="10" fill="#cde5bc" stroke="#a7ce8c" stroke-width="1"/><text x="406.0" y="755.0" font-size="11" fill="#406e20" font-weight="700" text-anchor="middle">↔ 5</text><text x="40" y="845.2200000000003" font-size="11.5" fill="#69ac39" font-weight="700" letter-spacing="1.4">FRONTERA DE APLICACIÓN</text><rect x="40" y="855.2" width="820" height="48.5" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.4"/><polygon points="70,864.4700000000003 52,893.4700000000003 88,893.4700000000003" fill="#c2410c"/><text x="70" y="890.4700000000003" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">!</text><text x="106" y="879.2" font-size="12.5" fill="#7c2d12" font-weight="400" text-anchor="start"><tspan x="106">Riesgo reputacional: Un trato privilegiado a un influencer o a un medio se hace público y daña a todos.</tspan></text><text x="40" y="931.7200000000003" font-size="11.5" fill="#69ac39" font-weight="700" letter-spacing="1.4">ERROR FRECUENTE Y SU CORRECCIÓN</text><rect x="40" y="941.7" width="380.0" height="77.0" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/><text x="54" y="963.7" font-size="11" fill="#b91c1c" font-weight="700" text-anchor="start"><tspan x="54">Síntoma</tspan></text><text x="54" y="981.7" font-size="12.5" fill="#7f1d1d" font-weight="400" text-anchor="start"><tspan x="54">Atender al más ruidoso</tspan></text><line x1="426.0" y1="980.2" x2="469.0" y2="980.2" stroke="#69ac39" stroke-width="2.6" stroke-linecap="round"/><polygon points="474.0,980.2 465.9,984.1 465.9,976.3" fill="#69ac39"/><rect x="480.0" y="941.7" width="380.0" height="77.0" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.4"/><text x="494.0" y="963.7" font-size="11" fill="#15803d" font-weight="700" text-anchor="start"><tspan x="494.0">Corrección</tspan></text><text x="494.0" y="981.7" font-size="12.5" fill="#14532d" font-weight="400" text-anchor="start"><tspan x="494.0">Separa legitimidad de volumen y atiende a quien</tspan><tspan x="494.0" dy="16.5">tiene derecho y urgencia.</tspan></text></svg>
