c59" font-weight="400" text-anchor="start"><tspan x="56.0">Propósito cualitativo que orienta los resultados clave</tspan></text><rect x="379.0" y="607.2" width="54" height="20" rx="10" fill="#e5bdbc" stroke="#ce8d8c" stroke-width="1"/><text x="406.0" y="621.2" font-size="11" fill="#6e2120" font-weight="700" text-anchor="middle">↔ 1, 2, 3</text><rect x="459.0" y="599.2" width="401.0" height="63.0" rx="8" fill="#ffffff" stroke="#ce8d8c" stroke-width="1.4"/><rect x="459.0" y="607.2" width="5" height="47.0" rx="2" fill="#ac3b39"/><text x="475.0" y="621.2" font-size="13.5" fill="#6e2120" font-weight="700" text-anchor="start"><tspan x="475.0">Confusión meta-indicador</tspan></text><text x="475.0" y="641.0" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Error de convertir toda métrica en objetivo del periodo</tspan></text><rect x="798.0" y="607.2" width="54" height="20" rx="10" fill="#e5bdbc" stroke="#ce8d8c" stroke-width="1"/><text x="825.0" y="621.2" font-size="11" fill="#6e2120" font-weight="700" text-anchor="middle">↔ 1</text><text x="40" y="694.1800000000001" font-size="11.5" fill="#ac3b39" font-weight="700" letter-spacing="1.4">QUÉ SE MIDE: NUMERADOR SOBRE DENOMINADOR</text><rect x="40.0" y="708.2" width="261.3" height="120.7" rx="8" fill="#f7e2e2" stroke="#ce8d8c" stroke-width="1.4"/><text x="54.0" y="730.2" font-size="13" fill="#6e2120" font-weight="700" text-anchor="start"><tspan x="54.0">Número de objetivos activos</tspan></text><text x="54.0" y="759.3" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Objetivos vigentes por equipo,</tspan><tspan x="54.0" dy="15.2">comparados con el máximo definido</tspan></text><rect x="319.3" y="708.2" width="261.3" height="120.7" rx="8" fill="#f7e2e2" stroke="#ce8d8c" stroke-width="1.4"/><text x="333.3" y="730.2" font-size="13" fill="#6e2120" font-weight="700" text-anchor="start"><tspan x="333.3">Resultados clave medibles</tspan></text><text x="333.3" 