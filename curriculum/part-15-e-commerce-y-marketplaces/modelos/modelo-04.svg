<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 861" width="900" height="861" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif"><title id="t">Modelo mental · Checkout</title><desc id="d">Modelo mental de la clase 15.04: Checkout. Método en 5 pasos; 4 conceptos; 3 señales de medición.</desc><rect x="0" y="0" width="900" height="861" rx="14" fill="#ffffff"/><rect x="0" y="0" width="900" height="64" rx="14" fill="#6e2033"/><rect x="0" y="40" width="900" height="24" fill="#6e2033"/><text x="40" y="28" font-size="12" fill="#e5bcc6" font-weight="700" letter-spacing="1.6">MODELO MENTAL · CLASE 15.04 · PARTE 15</text><text x="40" y="52" font-size="21" fill="#ffffff" font-weight="700">Checkout</text><text x="40" y="84" font-size="11.5" fill="#ac3956" font-weight="700" letter-spacing="1.4">MÉTODO PASO A PASO</text><rect x="40.0" y="100" width="246.7" height="59.0" rx="10" fill="#f7e2e7" stroke="#ce8c9d" stroke-width="1.4"/><text x="54.0" y="122" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Medir el abandono por paso del</tspan><tspan x="54.0" dy="16.5">checkout</tspan></text><circle cx="42.0" cy="102.0" r="14" fill="#6e2033"/><text x="42.0" y="106.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><rect x="326.7" y="100" width="246.7" height="59.0" rx="10" fill="#f7e2e7" stroke="#ce8c9d" stroke-width="1.4"/><text x="340.7" y="122" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="340.7">Revelar todos los costos antes</tspan><tspan x="340.7" dy="16.5">de iniciar el proceso</tspan></text><circle cx="328.7" cy="102.0" r="14" fill="#6e2033"/><text x="328.7" y="106.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><rect x="613.3" y="100" width="246.7" height="59.0" rx="10" fill="#f7e2e7" stroke="#ce8c9d" stroke-width="1.4"/><text x="627.3" y="122" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="627.3">Eliminar campos y pasos no</tspan><tspan x="627.3" dy="16.5">indispensables</tspan></text><circle cx="615.3" cy="102.0" r="14" fill="#6e2033"/><text x="615.3" y="106.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><rect x="613.3" y="197.0" width="246.7" height="59.0" rx="10" fill="#f7e2e7" stroke="#ce8c9d" stroke-width="1.4"/><text x="627.3" y="219.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="627.3">Ofrecer compra sin registro</tspan><tspan x="627.3" dy="16.5">obligatorio</tspan></text><circle cx="615.3" cy="199.0" r="14" fill="#6e2033"/><text x="615.3" y="203.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">4</text><rect x="326.7" y="197.0" width="246.7" height="59.0" rx="10" fill="#f7e2e7" stroke="#ce8c9d" stroke-width="1.4"/><text x="340.7" y="219.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="340.7">Probar el flujo en dispositivos</tspan><tspan x="340.7" dy="16.5">reales del segmento</tspan></text><circle cx="328.7" cy="199.0" r="14" fill="#6e2033"/><text x="328.7" y="203.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">5</text><line x1="289.7" y1="129.5" x2="318.7" y2="129.5" stroke="#ac3956" stroke-width="2.2" stroke-linecap="round"/><polygon points="323.7,129.5 315.6,133.4 315.6,125.6" fill="#ac3956"/><line x1="576.3" y1="129.5" x2="605.3" y2="129.5" stroke="#ac3956" stroke-width="2.2" stroke-linecap="round"/><polygon points="610.3,129.5 602.2,133.4 602.2,125.6" fill="#ac3956"/><line x1="736.7" y1="161.0" x2="736.7" y2="189.0" stroke="#ac3956" stroke-width="2.2" stroke-linecap="round"/><polygon points="736.7,194.0 732.8,185.9 740.6,185.9" fill="#ac3956"/><line x1="610.3" y1="226.5" x2="581.3" y2="226.5" stroke="#ac3956" stroke-width="2.2" stroke-linecap="round"/><polygon points="576.3,226.5 584.4,222.6 584.4,230.4" fill="#ac3956"/><text x="40" y="294.0" font-size="11.5" fill="#ac3956" font-weight="700" letter-spacing="1.4">CONCEPTOS Y DÓNDE ACTÚAN EN EL MÉTODO</text><rect x="40.0" y="308.0" width="401.0" height="63.0" rx="8" fill="#ffffff" stroke="#ce8c9d" stroke-width="1.4"/><rect x="40.0" y="316.0" width="5" height="47.0" rx="2" fill="#ac3956"/><text x="56.0" y="330.0" font-size="13.5" fill="#6e2033" font-weight="700" text-anchor="start"><tspan x="56.0">Abandono de checkout</tspan></text><text x="56.0" y="349.8" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Sesiones que inician el proceso de pago y no lo completan</tspan></text><rect x="379.0" y="316.0" width="54" height="20" rx="10" fill="#e5bcc6" stroke="#ce8c9d" stroke-width="1"/><text x="406.0" y="330.0" font-size="11" fill="#6e2033" font-weight="700" text-anchor="middle">↔ 1, 2</text><rect x="459.0" y="308.0" width="401.0" height="63.0" rx="8" fill="#ffffff" stroke="#ce8c9d" stroke-width="1.4"/><rect x="459.0" y="316.0" width="5" height="47.0" rx="2" fill="#ac3956"/><text x="475.0" y="330.0" font-size="13.5" fill="#6e2033" font-weight="700" text-anchor="start"><tspan x="475.0">Costo sorpresa</tspan></text><text x="475.0" y="349.8" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Cargo revelado al final que altera la decisión ya tomada</tspan></text><rect x="798.0" y="316.0" width="54" height="20" rx="10" fill="#e5bcc6" stroke="#ce8c9d" stroke-width="1"/><text x="825.0" y="330.0" font-size="11" fill="#6e2033" font-weight="700" text-anchor="middle">↔ 2</text><rect x="40.0" y="385.0" width="401.0" height="63.0" rx="8" fill="#ffffff" stroke="#ce8c9d" stroke-width="1.4"/><rect x="40.0" y="393.0" width="5" height="47.0" rx="2" fill="#ac3956"/><text x="56.0" y="407.0" font-size="13.5" fill="#6e2033" font-weight="700" text-anchor="start"><tspan x="56.0">Fricción de registro</tspan></text><text x="56.0" y="426.8" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Obligación de crear cuenta antes de poder pagar</tspan></text><rect x="379.0" y="393.0" width="54" height="20" rx="10" fill="#e5bcc6" stroke="#ce8c9d" stroke-width="1"/><text x="406.0" y="407.0" font-size="11" fill="#6e2033" font-weight="700" text-anchor="middle">↔ 4</text><rect x="459.0" y="385.0" width="401.0" height="63.0" rx="8" fill="#ffffff" stroke="#ce8c9d" stroke-width="1.4"/><rect x="459.0" y="393.0" width="5" height="47.0" rx="2" fill="#ac3956"/><text x="475.0" y="407.0" font-size="13.5" fill="#6e2033" font-weight="700" text-anchor="start"><tspan x="475.0">Señal de seguridad</tspan></text><text x="475.0" y="426.8" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Elemento que reduce la desconfianza en el momento del pago</tspan></text><text x="40" y="480.0" font-size="11.5" fill="#ac3956" font-weight="700" letter-spacing="1.4">QUÉ SE MIDE: NUMERADOR SOBRE DENOMINADOR</text><rect x="40.0" y="494.0" width="261.3" height="105.5" rx="8" fill="#f7e2e7" stroke="#ce8c9d" stroke-width="1.4"/><text x="54.0" y="516.0" font-size="13" fill="#6e2033" font-weight="700" text-anchor="start"><tspan x="54.0">Tasa de abandono por paso</tspan></text><text x="54.0" y="545.2" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Abandonos</tspan></text><line x1="54.0" y1="566.3" x2="287.3" y2="566.3" stroke="#ac3956" stroke-width="2"/><text x="54.0" y="584.3" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="54.0">Entradas a cada paso del checkout</tspan></text><rect x="319.3" y="494.0" width="261.3" height="105.5" rx="8" fill="#f7e2e7" stroke="#ce8c9d" stroke-width="1.4"/><text x="333.3" y="516.0" font-size="13" fill="#6e2033" font-weight="700" text-anchor="start"><tspan x="333.3">Tiempo de finalización</tspan></text><text x="333.3" y="545.2" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="333.3">Mediana de segundos para completar</tspan><tspan x="333.3" dy="15.2">el pago, por dispositivo</tspan></text><rect x="598.7" y="494.0" width="261.3" height="105.5" rx="8" fill="#f7e2e7" stroke="#ce8c9d" stroke-width="1.4"/><text x="612.7" y="516.0" font-size="13" fill="#6e2033" font-weight="700" text-anchor="start"><tspan x="612.7">Tasa de error en pagos</tspan></text><text x="612.7" y="545.2" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="612.7">Intentos fallidos</tspan></text><line x1="612.7" y1="566.3" x2="846.0" y2="566.3" stroke="#ac3956" stroke-width="2"/><text x="612.7" y="584.3" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="612.7">Intentos de pago</tspan></text><text x="40" y="633.52" font-size="11.5" fill="#ac3956" font-weight="700" letter-spacing="1.4">FRONTERA DE APLICACIÓN</text><rect x="40" y="643.5" width="820" height="65.0" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.4"/><polygon points="70,661.02 52,690.02 88,690.02" fill="#c2410c"/><text x="70" y="687.02" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">!</text><text x="106" y="667.5" font-size="12.5" fill="#7c2d12" font-weight="400" text-anchor="start"><tspan x="106">Reducir fricción no puede comprometer la verificación necesaria para prevenir fraude. El equilibrio se</tspan><tspan x="106" dy="16.5">define con datos de contracargos, no por defecto.</tspan></text><text x="40" y="736.52" font-size="11.5" fill="#ac3956" font-weight="700" letter-spacing="1.4">ERROR FRECUENTE Y SU CORRECCIÓN</text><rect x="40" y="746.5" width="380.0" height="77.0" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/><text x="54" y="768.5" font-size="11" fill="#b91c1c" font-weight="700" text-anchor="start"><tspan x="54">Síntoma</tspan></text><text x="54" y="786.5" font-size="12.5" fill="#7f1d1d" font-weight="400" text-anchor="start"><tspan x="54">Revelar el costo de despacho al final</tspan></text><line x1="426.0" y1="785.0" x2="469.0" y2="785.0" stroke="#ac3956" stroke-width="2.6" stroke-linecap="round"/><polygon points="474.0,785.0 465.9,788.9 465.9,781.1" fill="#ac3956"/><rect x="480.0" y="746.5" width="380.0" height="77.0" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.4"/><text x="494.0" y="768.5" font-size="11" fill="#15803d" font-weight="700" text-anchor="start"><tspan x="494.0">Corrección</tspan></text><text x="494.0" y="786.5" font-size="12.5" fill="#14532d" font-weight="400" text-anchor="start"><tspan x="494.0">Muestra el costo total estimado desde la página de</tspan><tspan x="494.0" dy="16.5">producto o el carrito.</tspan></text></svg>