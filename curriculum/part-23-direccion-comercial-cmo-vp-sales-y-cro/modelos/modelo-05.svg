<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1052" width="900" height="1052" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif"><title id="t">Modelo mental · Compensación e incentivos</title><desc id="d">Modelo mental de la clase 23.05: Compensación e incentivos. Método en 5 pasos; 5 conceptos; 3 señales de medición.</desc><rect x="0" y="0" width="900" height="1052" rx="14" fill="#ffffff"/><rect x="0" y="0" width="900" height="64" rx="14" fill="#6e2120"/><rect x="0" y="40" width="900" height="24" fill="#6e2120"/><text x="40" y="28" font-size="12" fill="#e5bdbc" font-weight="700" letter-spacing="1.6">MODELO MENTAL · CLASE 23.05 · PARTE 23</text><text x="40" y="52" font-size="21" fill="#ffffff" font-weight="700">Compensación e incentivos</text><text x="40" y="84" font-size="11.5" fill="#ac3b39" font-weight="700" letter-spacing="1.4">MÉTODO PASO A PASO</text><rect x="40.0" y="100" width="246.7" height="59.0" rx="10" fill="#f7e2e2" stroke="#ce8d8c" stroke-width="1.4"/><text x="54.0" y="122" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Declarar qué comportamiento se</tspan><tspan x="54.0" dy="16.5">quiere producir</tspan></text><circle cx="42.0" cy="102.0" r="14" fill="#6e2120"/><text x="42.0" y="106.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><rect x="326.7" y="100" width="246.7" height="59.0" rx="10" fill="#f7e2e2" stroke="#ce8d8c" stroke-width="1.4"/><text x="340.7" y="122" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="340.7">Diseñar el esquema y simular sus</tspan><tspan x="340.7" dy="16.5">efectos</tspan></text><circle cx="328.7" cy="102.0" r="14" fill="#6e2120"/><text x="328.7" y="106.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><rect x="613.3" y="100" width="246.7" height="59.0" rx="10" fill="#f7e2e2" stroke="#ce8d8c" stroke-width="1.4"/><text x="627.3" y="122" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="627.3">Identificar los efectos no</tspan><tspan x="627.3" dy="16.5">deseados posibles</tspan></text><circle cx="615.3" cy="102.0" r="14" fill="#6e2120"/><text x="615.3" y="106.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><rect x="613.3" y="197.0" width="246.7" height="75.5" rx="10" fill="#f7e2e2" stroke="#ce8d8c" stroke-width="1.4"/><text x="627.3" y="219.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="627.3">Incorporar contrapesos sobre</tspan><tspan x="627.3" dy="16.5">margen, retención, reclamos y</tspan><tspan x="627.3" dy="16.5">transparencia</tspan></text><circle cx="615.3" cy="199.0" r="14" fill="#6e2120"/><text x="615.3" y="203.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">4</text><rect x="326.7" y="197.0" width="246.7" height="75.5" rx="10" fill="#f7e2e2" stroke="#ce8d8c" stroke-width="1.4"/><text x="340.7" y="219.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="340.7">Verificar que base, fórmula,</tspan><tspan x="340.7" dy="16.5">ventana, fuente y suspensión</tspan><tspan x="340.7" dy="16.5">sean comprensibles</tspan></text><circle cx="328.7" cy="199.0" r="14" fill="#6e2120"/><text x="328.7" y="203.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">5</text><line x1="289.7" y1="129.5" x2="318.7" y2="129.5" stroke="#ac3b39" stroke-width="2.2" stroke-linecap="round"/><polygon points="323.7,129.5 315.6,133.4 315.6,125.6" fill="#ac3b39"/><line x1="576.3" y1="129.5" x2="605.3" y2="129.5" stroke="#ac3b39" stroke-width="2.2" stroke-linecap="round"/><polygon points="610.3,129.5 602.2,133.4 602.2,125.6" fill="#ac3b39"/><line x1="736.7" y1="161.0" x2="736.7" y2="189.0" stroke="#ac3b39" stroke-width="2.2" stroke-linecap="round"/><polygon points="736.7,194.0 732.8,185.9 740.6,185.9" fill="#ac3b39"/><line x1="610.3" y1="234.8" x2="581.3" y2="234.8" stroke="#ac3b39" stroke-width="2.2" stroke-linecap="round"/><polygon points="576.3,234.8 584.4,230.8 584.4,238.7" fill="#ac3b39"/><text x="40" y="310.5" font-size="11.5" fill="#ac3b39" font-weight="700" letter-spacing="1.4">CONCEPTOS Y DÓNDE ACTÚAN EN EL MÉTODO</text><rect x="40.0" y="324.5" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#ce8d8c" stroke-width="1.4"/><rect x="40.0" y="332.5" width="5" height="62.2" rx="2" fill="#ac3b39"/><text x="56.0" y="346.5" font-size="13.5" fill="#6e2120" font-weight="700" text-anchor="start"><tspan x="56.0">Estructura de compensación</tspan></text><text x="56.0" y="366.3" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Combinación de fijo, variable y aceleradores del esquema</tspan></text><rect x="459.0" y="324.5" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#ce8d8c" stroke-width="1.4"/><rect x="459.0" y="332.5" width="5" height="62.2" rx="2" fill="#ac3b39"/><text x="475.0" y="346.5" font-size="13.5" fill="#6e2120" font-weight="700" text-anchor="start"><tspan x="475.0">Efecto no deseado</tspan></text><text x="475.0" y="366.3" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Comportamiento perverso inducido por el diseño del</tspan><tspan x="475.0" dy="15.2">incentivo</tspan></text><rect x="798.0" y="332.5" width="54" height="20" rx="10" fill="#e5bdbc" stroke="#ce8d8c" stroke-width="1"/><text x="825.0" y="346.5" font-size="11" fill="#6e2120" font-weight="700" text-anchor="middle">↔ 2, 3</text><rect x="40.0" y="416.7" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#ce8d8c" stroke-width="1.4"/><rect x="40.0" y="424.7" width="5" height="62.2" rx="2" fill="#ac3b39"/><text x="56.0" y="438.7" font-size="13.5" fill="#6e2120" font-weight="700" text-anchor="start"><tspan x="56.0">Contrapeso</tspan></text><text x="56.0" y="458.5" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Componente que penaliza el resultado obtenido a costa de</tspan><tspan x="56.0" dy="15.2">otro objetivo</tspan></text><rect x="379.0" y="424.7" width="54" height="20" rx="10" fill="#e5bdbc" stroke="#ce8d8c" stroke-width="1"/><text x="406.0" y="438.7" font-size="11" fill="#6e2120" font-weight="700" text-anchor="middle">↔ 4</text><rect x="459.0" y="416.7" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#ce8d8c" stroke-width="1.4"/><rect x="459.0" y="424.7" width="5" height="62.2" rx="2" fill="#ac3b39"/><text x="475.0" y="438.7" font-size="13.5" fill="#6e2120" font-weight="700" text-anchor="start"><tspan x="475.0">Comprensibilidad</tspan></text><text x="475.0" y="458.5" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Capacidad del vendedor de calcular su propia remuneración</tspan></text><rect x="798.0" y="424.7" width="54" height="20" rx="10" fill="#e5bdbc" stroke="#ce8d8c" stroke-width="1"/><text x="825.0" y="438.7" font-size="11" fill="#6e2120" font-weight="700" text-anchor="middle">↔ 5</text><rect x="40.0" y="508.9" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#ce8d8c" stroke-width="1.4"/><rect x="40.0" y="516.9" width="5" height="62.2" rx="2" fill="#ac3b39"/><text x="56.0" y="530.9" font-size="13.5" fill="#6e2120" font-weight="700" text-anchor="start"><tspan x="56.0">Base elegible</tspan></text><text x="56.0" y="550.7" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Venta comercial cobrada y válida que excluye aportes de</tspan><tspan x="56.0" dy="15.2">capital, depósitos o captación financiera</tspan></text><text x="40" y="619.04" font-size="11.5" fill="#ac3b39" font-weight="700" letter-spacing="1.4">QUÉ SE MIDE: NUMERADOR SOBRE DENOMINADOR</text><rect x="40.0" y="633.0" width="261.3" height="157.7" rx="8" fill="#f7e2e2" stroke="#ce8d8c" stroke-width="1.4"/><text x="54.0" y="655.0" font-size="13" fill="#6e2120" font-weight="700" text-anchor="start"><tspan x="54.0">Descuento ponderado</tspan></text><text x="54.0" y="684.2" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Suma de descuento monetario</tspan><tspan x="54.0" dy="15.2">concedido</tspan></text><line x1="54.0" y1="720.6" x2="287.3" y2="720.6" stroke="#ac3b39" stroke-width="2"/><text x="54.0" y="738.6" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="54.0">Precio de lista de ventas cerradas</tspan></text><text x="54.0" y="767.7" font-size="10.5" fill="#7b8794" font-weight="400" text-anchor="start"><tspan x="54.0">Ventana: mes</tspan></text><rect x="319.3" y="633.0" width="261.3" height="157.7" rx="8" fill="#f7e2e2" stroke="#ce8d8c" stroke-width="1.4"/><text x="333.3" y="655.0" font-size="13" fill="#6e2120" font-weight="700" text-anchor="start"><tspan x="333.3">Retención por vendedor</tspan></text><text x="333.3" y="684.2" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="333.3">Clientes del vendedor activos a 12</tspan><tspan x="333.3" dy="15.2">meses</tspan></text><line x1="333.3" y1="720.6" x2="566.7" y2="720.6" stroke="#ac3b39" stroke-width="2"/><text x="333.3" y="738.6" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="333.3">Clientes elegibles cerrados por ese</tspan><tspan x="333.3" dy="15.2">vendedor</tspan></text><text x="333.3" y="782.9" font-size="10.5" fill="#7b8794" font-weight="400" text-anchor="start"><tspan x="333.3">Ventana: cohorte de 12 meses</tspan></text><rect x="598.7" y="633.0" width="261.3" height="157.7" rx="8" fill="#f7e2e2" stroke="#ce8d8c" stroke-width="1.4"/><text x="612.7" y="655.0" font-size="13" fill="#6e2120" font-weight="700" text-anchor="start"><tspan x="612.7">Comprensión del esquema</tspan></text><text x="612.7" y="684.2" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="612.7">Vendedores que calculan</tspan><tspan x="612.7" dy="15.2">correctamente un caso</tspan></text><line x1="612.7" y1="720.6" x2="846.0" y2="720.6" stroke="#ac3b39" stroke-width="2"/><text x="612.7" y="738.6" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="612.7">Vendedores evaluados</tspan></text><text x="612.7" y="767.7" font-size="10.5" fill="#7b8794" font-weight="400" text-anchor="start"><tspan x="612.7">Ventana: cada cambio y revisión</tspan><tspan x="612.7" dy="13.9">semestral</tspan></text><text x="40" y="824.78" font-size="11.5" fill="#ac3b39" font-weight="700" letter-spacing="1.4">FRONTERA DE APLICACIÓN</text><rect x="40" y="834.8" width="820" height="65.0" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.4"/><polygon points="70,852.28 52,881.28 88,881.28" fill="#c2410c"/><text x="70" y="878.28" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">!</text><text x="106" y="858.8" font-size="12.5" fill="#7c2d12" font-weight="400" text-anchor="start"><tspan x="106">Un esquema con demasiados componentes deja de orientar el comportamiento porque nadie entiende qué</tspan><tspan x="106" dy="16.5">maximiza. La simplicidad tiene valor propio.</tspan></text><text x="40" y="927.78" font-size="11.5" fill="#ac3b39" font-weight="700" letter-spacing="1.4">ERROR FRECUENTE Y SU CORRECCIÓN</text><rect x="40" y="937.8" width="380.0" height="77.0" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/><text x="54" y="959.8" font-size="11" fill="#b91c1c" font-weight="700" text-anchor="start"><tspan x="54">Síntoma</tspan></text><text x="54" y="977.8" font-size="12.5" fill="#7f1d1d" font-weight="400" text-anchor="start"><tspan x="54">Compensar sólo ingreso firmado</tspan></text><line x1="426.0" y1="976.3" x2="469.0" y2="976.3" stroke="#ac3b39" stroke-width="2.6" stroke-linecap="round"/><polygon points="474.0,976.3 465.9,980.2 465.9,972.4" fill="#ac3b39"/><rect x="480.0" y="937.8" width="380.0" height="77.0" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.4"/><text x="494.0" y="959.8" font-size="11" fill="#15803d" font-weight="700" text-anchor="start"><tspan x="494.0">Corrección</tspan></text><text x="494.0" y="977.8" font-size="12.5" fill="#14532d" font-weight="400" text-anchor="start"><tspan x="494.0">Incorpora contrapesos de margen y permanencia, y</tspan><tspan x="494.0" dy="16.5">verifica que el esquema siga siendo comprensible.</tspan></text></svg>