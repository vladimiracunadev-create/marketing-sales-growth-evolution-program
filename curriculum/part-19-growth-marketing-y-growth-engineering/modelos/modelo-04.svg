<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 968" width="900" height="968" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif"><title id="t">Modelo mental · Growth loops</title><desc id="d">Modelo mental de la clase 19.04: Growth loops. Método en 5 pasos; 4 conceptos; 3 señales de medición.</desc><rect x="0" y="0" width="900" height="968" rx="14" fill="#ffffff"/><rect x="0" y="0" width="900" height="64" rx="14" fill="#206e65"/><rect x="0" y="40" width="900" height="24" fill="#206e65"/><text x="40" y="28" font-size="12" fill="#bce5e0" font-weight="700" letter-spacing="1.6">MODELO MENTAL · CLASE 19.04 · PARTE 19</text><text x="40" y="52" font-size="21" fill="#ffffff" font-weight="700">Growth loops</text><text x="40" y="84" font-size="11.5" fill="#39ac9e" font-weight="700" letter-spacing="1.4">MÉTODO PASO A PASO</text><line x1="450.0" y1="94.0" x2="450.0" y2="317.0" stroke="#8ccec6" stroke-width="3" stroke-linecap="round"/><line x1="450.0" y1="129.5" x2="406.0" y2="129.5" stroke="#8ccec6" stroke-width="2"/><rect x="56.0" y="100" width="350" height="59.0" rx="10" fill="#e2f7f5" stroke="#8ccec6" stroke-width="1.4"/><text x="70.0" y="122" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="70.0">Identificar qué produce el usuario al usar el</tspan><tspan x="70.0" dy="16.5">producto</tspan></text><circle cx="450.0" cy="129.5" r="15" fill="#206e65"/><text x="450.0" y="134.0" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><line x1="450.0" y1="159.2" x2="494.0" y2="159.2" stroke="#8ccec6" stroke-width="2"/><rect x="494.0" y="138" width="350" height="42.5" rx="10" fill="#e2f7f5" stroke="#8ccec6" stroke-width="1.4"/><text x="508.0" y="160" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="508.0">Evaluar si ese output puede atraer a otros</tspan></text><circle cx="450.0" cy="159.2" r="15" fill="#206e65"/><text x="450.0" y="163.8" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><line x1="450.0" y1="197.2" x2="406.0" y2="197.2" stroke="#8ccec6" stroke-width="2"/><rect x="56.0" y="176" width="350" height="42.5" rx="10" fill="#e2f7f5" stroke="#8ccec6" stroke-width="1.4"/><text x="70.0" y="198" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="70.0">Diseñar el mecanismo que cierra el bucle</tspan></text><circle cx="450.0" cy="197.2" r="15" fill="#206e65"/><text x="450.0" y="201.8" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><line x1="450.0" y1="235.2" x2="494.0" y2="235.2" stroke="#8ccec6" stroke-width="2"/><rect x="494.0" y="214" width="350" height="42.5" rx="10" fill="#e2f7f5" stroke="#8ccec6" stroke-width="1.4"/><text x="508.0" y="236" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="508.0">Medir velocidad y factor de amplificación</tspan></text><circle cx="450.0" cy="235.2" r="15" fill="#206e65"/><text x="450.0" y="239.8" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">4</text><line x1="450.0" y1="281.5" x2="406.0" y2="281.5" stroke="#8ccec6" stroke-width="2"/><rect x="56.0" y="252" width="350" height="59.0" rx="10" fill="#e2f7f5" stroke="#8ccec6" stroke-width="1.4"/><text x="70.0" y="274" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="70.0">Decidir si conviene invertir en el bucle o en</tspan><tspan x="70.0" dy="16.5">canales directos</tspan></text><circle cx="450.0" cy="281.5" r="15" fill="#206e65"/><text x="450.0" y="286.0" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">5</text><text x="40" y="353.0" font-size="11.5" fill="#39ac9e" font-weight="700" letter-spacing="1.4">CONCEPTOS Y DÓNDE ACTÚAN EN EL MÉTODO</text><rect x="40.0" y="367.0" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#8ccec6" stroke-width="1.4"/><rect x="40.0" y="375.0" width="5" height="62.2" rx="2" fill="#39ac9e"/><text x="56.0" y="389.0" font-size="13.5" fill="#206e65" font-weight="700" text-anchor="start"><tspan x="56.0">Bucle de crecimiento</tspan></text><text x="56.0" y="408.8" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Sistema donde el resultado de un ciclo alimenta la entrada</tspan><tspan x="56.0" dy="15.2">del siguiente</tspan></text><rect x="379.0" y="375.0" width="54" height="20" rx="10" fill="#bce5e0" stroke="#8ccec6" stroke-width="1"/><text x="406.0" y="389.0" font-size="11" fill="#206e65" font-weight="700" text-anchor="middle">↔ 3, 5</text><rect x="459.0" y="367.0" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#8ccec6" stroke-width="1.4"/><rect x="459.0" y="375.0" width="5" height="62.2" rx="2" fill="#39ac9e"/><text x="475.0" y="389.0" font-size="13.5" fill="#206e65" font-weight="700" text-anchor="start"><tspan x="475.0">Output del usuario</tspan></text><text x="475.0" y="408.8" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Producto de la actividad del cliente que puede atraer a</tspan><tspan x="475.0" dy="15.2">otros</tspan></text><rect x="798.0" y="375.0" width="54" height="20" rx="10" fill="#bce5e0" stroke="#8ccec6" stroke-width="1"/><text x="825.0" y="389.0" font-size="11" fill="#206e65" font-weight="700" text-anchor="middle">↔ 1, 2</text><rect x="40.0" y="459.2" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#8ccec6" stroke-width="1.4"/><rect x="40.0" y="467.2" width="5" height="62.2" rx="2" fill="#39ac9e"/><text x="56.0" y="481.2" font-size="13.5" fill="#206e65" font-weight="700" text-anchor="start"><tspan x="56.0">Velocidad del bucle</tspan></text><text x="56.0" y="501.0" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Tiempo que tarda un ciclo completo en producir nuevos</tspan><tspan x="56.0" dy="15.2">usuarios</tspan></text><rect x="379.0" y="467.2" width="54" height="20" rx="10" fill="#bce5e0" stroke="#8ccec6" stroke-width="1"/><text x="406.0" y="481.2" font-size="11" fill="#206e65" font-weight="700" text-anchor="middle">↔ 1, 3, 4, 5</text><rect x="459.0" y="459.2" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#8ccec6" stroke-width="1.4"/><rect x="459.0" y="467.2" width="5" height="62.2" rx="2" fill="#39ac9e"/><text x="475.0" y="481.2" font-size="13.5" fill="#206e65" font-weight="700" text-anchor="start"><tspan x="475.0">Factor de amplificación</tspan></text><text x="475.0" y="501.0" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Número de nuevos usuarios que genera cada usuario</tspan><tspan x="475.0" dy="15.2">existente por ciclo</tspan></text><rect x="798.0" y="467.2" width="54" height="20" rx="10" fill="#bce5e0" stroke="#8ccec6" stroke-width="1"/><text x="825.0" y="481.2" font-size="11" fill="#206e65" font-weight="700" text-anchor="middle">↔ 4</text><text x="40" y="569.36" font-size="11.5" fill="#39ac9e" font-weight="700" letter-spacing="1.4">QUÉ SE MIDE: NUMERADOR SOBRE DENOMINADOR</text><rect x="40.0" y="583.4" width="261.3" height="122.7" rx="8" fill="#e2f7f5" stroke="#8ccec6" stroke-width="1.4"/><text x="54.0" y="605.4" font-size="13" fill="#206e65" font-weight="700" text-anchor="start"><tspan x="54.0">Factor de amplificación</tspan></text><text x="54.0" y="634.5" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Nuevos usuarios generados por</tspan><tspan x="54.0" dy="15.2">usuario existente, por ciclo</tspan></text><rect x="319.3" y="583.4" width="261.3" height="122.7" rx="8" fill="#e2f7f5" stroke="#8ccec6" stroke-width="1.4"/><text x="333.3" y="605.4" font-size="13" fill="#206e65" font-weight="700" text-anchor="start"><tspan x="333.3">Velocidad del bucle</tspan></text><text x="333.3" y="634.5" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="333.3">Días entre la incorporación de un</tspan><tspan x="333.3" dy="15.2">usuario y la del usuario que trae,</tspan><tspan x="333.3" dy="15.2">mediana por cohorte</tspan></text><rect x="598.7" y="583.4" width="261.3" height="122.7" rx="8" fill="#e2f7f5" stroke="#8ccec6" stroke-width="1.4"/><text x="612.7" y="605.4" font-size="13" fill="#206e65" font-weight="700" text-anchor="start"><tspan x="612.7">Proporción de adquisición por</tspan><tspan x="612.7" dy="17.2">bucle</tspan></text><text x="612.7" y="651.7" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="612.7">Usuarios originados por el bucle</tspan></text><line x1="612.7" y1="672.9" x2="846.0" y2="672.9" stroke="#39ac9e" stroke-width="2"/><text x="612.7" y="690.9" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="612.7">Usuarios nuevos totales</tspan></text><text x="40" y="740.04" font-size="11.5" fill="#39ac9e" font-weight="700" letter-spacing="1.4">FRONTERA DE APLICACIÓN</text><rect x="40" y="750.0" width="820" height="65.0" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.4"/><polygon points="70,767.54 52,796.54 88,796.54" fill="#c2410c"/><text x="70" y="793.54" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">!</text><text x="106" y="774.0" font-size="12.5" fill="#7c2d12" font-weight="400" text-anchor="start"><tspan x="106">No todos los negocios admiten bucles: si el output del usuario no es visible para terceros, no hay</tspan><tspan x="106" dy="16.5">mecanismo posible y forzarlo produce experiencias intrusivas.</tspan></text><text x="40" y="843.04" font-size="11.5" fill="#39ac9e" font-weight="700" letter-spacing="1.4">ERROR FRECUENTE Y SU CORRECCIÓN</text><rect x="40" y="853.0" width="380.0" height="77.0" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/><text x="54" y="875.0" font-size="11" fill="#b91c1c" font-weight="700" text-anchor="start"><tspan x="54">Síntoma</tspan></text><text x="54" y="893.0" font-size="12.5" fill="#7f1d1d" font-weight="400" text-anchor="start"><tspan x="54">Forzar un bucle donde el producto no lo permite</tspan></text><line x1="426.0" y1="891.5" x2="469.0" y2="891.5" stroke="#39ac9e" stroke-width="2.6" stroke-linecap="round"/><polygon points="474.0,891.5 465.9,895.5 465.9,887.6" fill="#39ac9e"/><rect x="480.0" y="853.0" width="380.0" height="77.0" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.4"/><text x="494.0" y="875.0" font-size="11" fill="#15803d" font-weight="700" text-anchor="start"><tspan x="494.0">Corrección</tspan></text><text x="494.0" y="893.0" font-size="12.5" fill="#14532d" font-weight="400" text-anchor="start"><tspan x="494.0">Verifica que exista un output visible para terceros</tspan><tspan x="494.0" dy="16.5">antes de invertir en el mecanismo.</tspan></text></svg>