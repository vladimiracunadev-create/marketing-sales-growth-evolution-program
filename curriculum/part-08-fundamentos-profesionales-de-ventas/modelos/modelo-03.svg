<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 983" width="900" height="983" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif"><title id="t">Modelo mental · Apertura y rapport</title><desc id="d">Modelo mental de la clase 08.03: Apertura y rapport. Método en 5 pasos; 4 conceptos; 3 señales de medición.</desc><rect x="0" y="0" width="900" height="983" rx="14" fill="#ffffff"/><rect x="0" y="0" width="900" height="64" rx="14" fill="#6e3520"/><rect x="0" y="40" width="900" height="24" fill="#6e3520"/><text x="40" y="28" font-size="12" fill="#e5c7bc" font-weight="700" letter-spacing="1.6">MODELO MENTAL · CLASE 08.03 · PARTE 08</text><text x="40" y="52" font-size="21" fill="#ffffff" font-weight="700">Apertura y rapport</text><text x="40" y="84" font-size="11.5" fill="#ac5739" font-weight="700" letter-spacing="1.4">MÉTODO PASO A PASO</text><line x1="450.0" y1="94.0" x2="450.0" y2="317.0" stroke="#ce9e8c" stroke-width="3" stroke-linecap="round"/><line x1="450.0" y1="129.5" x2="406.0" y2="129.5" stroke="#ce9e8c" stroke-width="2"/><rect x="56.0" y="100" width="350" height="59.0" rx="10" fill="#f7e8e2" stroke="#ce9e8c" stroke-width="1.4"/><text x="70.0" y="122" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="70.0">Investigar antes de la reunión y formular una</tspan><tspan x="70.0" dy="16.5">hipótesis</tspan></text><circle cx="450.0" cy="129.5" r="15" fill="#6e3520"/><text x="450.0" y="134.0" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><line x1="450.0" y1="167.5" x2="494.0" y2="167.5" stroke="#ce9e8c" stroke-width="2"/><rect x="494.0" y="138" width="350" height="59.0" rx="10" fill="#f7e8e2" stroke="#ce9e8c" stroke-width="1.4"/><text x="508.0" y="160" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="508.0">Abrir con propósito, duración y acuerdo de</tspan><tspan x="508.0" dy="16.5">agenda</tspan></text><circle cx="450.0" cy="167.5" r="15" fill="#6e3520"/><text x="450.0" y="172.0" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><line x1="450.0" y1="197.2" x2="406.0" y2="197.2" stroke="#ce9e8c" stroke-width="2"/><rect x="56.0" y="176" width="350" height="42.5" rx="10" fill="#f7e8e2" stroke="#ce9e8c" stroke-width="1.4"/><text x="70.0" y="198" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="70.0">Presentar la hipótesis pidiendo corrección</tspan></text><circle cx="450.0" cy="197.2" r="15" fill="#6e3520"/><text x="450.0" y="201.8" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><line x1="450.0" y1="235.2" x2="494.0" y2="235.2" stroke="#ce9e8c" stroke-width="2"/><rect x="494.0" y="214" width="350" height="42.5" rx="10" fill="#f7e8e2" stroke="#ce9e8c" stroke-width="1.4"/><text x="508.0" y="236" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="508.0">Escuchar sin ofrecer solución prematura</tspan></text><circle cx="450.0" cy="235.2" r="15" fill="#6e3520"/><text x="450.0" y="239.8" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">4</text><line x1="450.0" y1="281.5" x2="406.0" y2="281.5" stroke="#ce9e8c" stroke-width="2"/><rect x="56.0" y="252" width="350" height="59.0" rx="10" fill="#f7e8e2" stroke="#ce9e8c" stroke-width="1.4"/><text x="70.0" y="274" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="70.0">Cerrar la apertura con permiso explícito para</tspan><tspan x="70.0" dy="16.5">indagar</tspan></text><circle cx="450.0" cy="281.5" r="15" fill="#6e3520"/><text x="450.0" y="286.0" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">5</text><text x="40" y="353.0" font-size="11.5" fill="#ac5739" font-weight="700" letter-spacing="1.4">CONCEPTOS Y DÓNDE ACTÚAN EN EL MÉTODO</text><rect x="40.0" y="367.0" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#ce9e8c" stroke-width="1.4"/><rect x="40.0" y="375.0" width="5" height="62.2" rx="2" fill="#ac5739"/><text x="56.0" y="389.0" font-size="13.5" fill="#6e3520" font-weight="700" text-anchor="start"><tspan x="56.0">Legitimidad</tspan></text><text x="56.0" y="408.8" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Razón creíble por la que esta conversación merece el</tspan><tspan x="56.0" dy="15.2">tiempo del cliente</tspan></text><rect x="459.0" y="367.0" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#ce9e8c" stroke-width="1.4"/><rect x="459.0" y="375.0" width="5" height="62.2" rx="2" fill="#ac5739"/><text x="475.0" y="389.0" font-size="13.5" fill="#6e3520" font-weight="700" text-anchor="start"><tspan x="475.0">Acuerdo de agenda</tspan></text><text x="475.0" y="408.8" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Explicitación de objetivo, duración y siguiente paso al</tspan><tspan x="475.0" dy="15.2">inicio de la reunión</tspan></text><rect x="798.0" y="375.0" width="54" height="20" rx="10" fill="#e5c7bc" stroke="#ce9e8c" stroke-width="1"/><text x="825.0" y="389.0" font-size="11" fill="#6e3520" font-weight="700" text-anchor="middle">↔ 2</text><rect x="40.0" y="459.2" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#ce9e8c" stroke-width="1.4"/><rect x="40.0" y="467.2" width="5" height="62.2" rx="2" fill="#ac5739"/><text x="56.0" y="481.2" font-size="13.5" fill="#6e3520" font-weight="700" text-anchor="start"><tspan x="56.0">Hipótesis de problema</tspan></text><text x="56.0" y="501.0" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Suposición informada sobre la dificultad del cliente,</tspan><tspan x="56.0" dy="15.2">presentada para ser corregida</tspan></text><rect x="379.0" y="467.2" width="54" height="20" rx="10" fill="#e5c7bc" stroke="#ce9e8c" stroke-width="1"/><text x="406.0" y="481.2" font-size="11" fill="#6e3520" font-weight="700" text-anchor="middle">↔ 1, 3</text><rect x="459.0" y="459.2" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#ce9e8c" stroke-width="1.4"/><rect x="459.0" y="467.2" width="5" height="62.2" rx="2" fill="#ac5739"/><text x="475.0" y="481.2" font-size="13.5" fill="#6e3520" font-weight="700" text-anchor="start"><tspan x="475.0">Escucha calibrada</tspan></text><text x="475.0" y="501.0" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Capacidad de sostener el silencio y repreguntar en lugar</tspan><tspan x="475.0" dy="15.2">de completar la respuesta</tspan></text><rect x="798.0" y="467.2" width="54" height="20" rx="10" fill="#e5c7bc" stroke="#ce9e8c" stroke-width="1"/><text x="825.0" y="481.2" font-size="11" fill="#6e3520" font-weight="700" text-anchor="middle">↔ 4</text><text x="40" y="569.36" font-size="11.5" fill="#ac5739" font-weight="700" letter-spacing="1.4">QUÉ SE MIDE: NUMERADOR SOBRE DENOMINADOR</text><rect x="40.0" y="583.4" width="261.3" height="137.9" rx="8" fill="#f7e8e2" stroke="#ce9e8c" stroke-width="1.4"/><text x="54.0" y="605.4" font-size="13" fill="#6e3520" font-weight="700" text-anchor="start"><tspan x="54.0">Proporción de tiempo hablado por</tspan><tspan x="54.0" dy="17.2">el cliente</tspan></text><text x="54.0" y="651.7" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Minutos del cliente</tspan></text><line x1="54.0" y1="672.9" x2="287.3" y2="672.9" stroke="#ac5739" stroke-width="2"/><text x="54.0" y="690.9" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="54.0">Minutos totales de la reunión,</tspan><tspan x="54.0" dy="15.2">medido en grabaciones</tspan></text><rect x="319.3" y="583.4" width="261.3" height="137.9" rx="8" fill="#f7e8e2" stroke="#ce9e8c" stroke-width="1.4"/><text x="333.3" y="605.4" font-size="13" fill="#6e3520" font-weight="700" text-anchor="start"><tspan x="333.3">Reuniones con agenda acordada</tspan></text><text x="333.3" y="634.5" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="333.3">Reuniones con agenda explicitada al</tspan><tspan x="333.3" dy="15.2">inicio</tspan></text><line x1="333.3" y1="670.9" x2="566.7" y2="670.9" stroke="#ac5739" stroke-width="2"/><text x="333.3" y="688.9" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="333.3">Reuniones sostenidas</tspan></text><rect x="598.7" y="583.4" width="261.3" height="137.9" rx="8" fill="#f7e8e2" stroke="#ce9e8c" stroke-width="1.4"/><text x="612.7" y="605.4" font-size="13" fill="#6e3520" font-weight="700" text-anchor="start"><tspan x="612.7">Tasa de avance tras la primera</tspan><tspan x="612.7" dy="17.2">reunión</tspan></text><text x="612.7" y="651.7" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="612.7">Reuniones que producen un siguiente</tspan><tspan x="612.7" dy="15.2">paso acordado</tspan></text><line x1="612.7" y1="688.0" x2="846.0" y2="688.0" stroke="#ac5739" stroke-width="2"/><text x="612.7" y="706.0" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="612.7">Reuniones realizadas</tspan></text><text x="40" y="755.22" font-size="11.5" fill="#ac5739" font-weight="700" letter-spacing="1.4">FRONTERA DE APLICACIÓN</text><rect x="40" y="765.2" width="820" height="65.0" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.4"/><polygon points="70,782.72 52,811.72 88,811.72" fill="#c2410c"/><text x="70" y="808.72" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">!</text><text x="106" y="789.2" font-size="12.5" fill="#7c2d12" font-weight="400" text-anchor="start"><tspan x="106">El rapport no reemplaza el ajuste: una relación excelente con un cliente que no pertenece al perfil</tspan><tspan x="106" dy="16.5">produce un negocio que fracasará en la implementación.</tspan></text><text x="40" y="858.22" font-size="11.5" fill="#ac5739" font-weight="700" letter-spacing="1.4">ERROR FRECUENTE Y SU CORRECCIÓN</text><rect x="40" y="868.2" width="380.0" height="77.0" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/><text x="54" y="890.2" font-size="11" fill="#b91c1c" font-weight="700" text-anchor="start"><tspan x="54">Síntoma</tspan></text><text x="54" y="908.2" font-size="12.5" fill="#7f1d1d" font-weight="400" text-anchor="start"><tspan x="54">Presentar el producto en los primeros minutos</tspan></text><line x1="426.0" y1="906.7" x2="469.0" y2="906.7" stroke="#ac5739" stroke-width="2.6" stroke-linecap="round"/><polygon points="474.0,906.7 465.9,910.6 465.9,902.8" fill="#ac5739"/><rect x="480.0" y="868.2" width="380.0" height="77.0" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.4"/><text x="494.0" y="890.2" font-size="11" fill="#15803d" font-weight="700" text-anchor="start"><tspan x="494.0">Corrección</tspan></text><text x="494.0" y="908.2" font-size="12.5" fill="#14532d" font-weight="400" text-anchor="start"><tspan x="494.0">Reserva la presentación hasta después del</tspan><tspan x="494.0" dy="16.5">diagnóstico y acuerda agenda al inicio.</tspan></text></svg>