↔ 1</text><rect x="459.0" y="427.5" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#8ca2ce" stroke-width="1.4"/><rect x="459.0" y="435.5" width="5" height="62.2" rx="2" fill="#395fac"/><text x="475.0" y="449.5" font-size="13.5" fill="#203a6e" font-weight="700" text-anchor="start"><tspan x="475.0">Costo del experimento</tspan></text><text x="475.0" y="469.3" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Ingreso resignado durante la prueba para obtener la</tspan><tspan x="475.0" dy="15.2">información</tspan></text><text x="40" y="537.6800000000001" font-size="11.5" fill="#395fac" font-weight="700" letter-spacing="1.4">QUÉ SE MIDE: NUMERADOR SOBRE DENOMINADOR</text><rect x="40.0" y="551.7" width="261.3" height="137.9" rx="8" fill="#e2e9f7" stroke="#8ca2ce" stroke-width="1.4"/><text x="54.0" y="573.7" font-size="13" fill="#203a6e" font-weight="700" text-anchor="start"><tspan x="54.0">Efecto incremental estimado</tspan></text><text x="54.0" y="602.8" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Diferencia entre grupo tratado y</tspan><tspan x="54.0" dy="15.2">control, con intervalo de confianza</tspan></text><rect x="319.3" y="551.7" width="261.3" height="137.9" rx="8" fill="#e2e9f7" stroke="#8ca2ce" stroke-width="1.4"/><text x="333.3" y="573.7" font-size="13" fill="#203a6e" font-weight="700" text-anchor="start"><tspan x="333.3">Proporción de resultado</tspan><tspan x="333.3" dy="17.2">incremental</tspan></text><text x="333.3" y="620.0" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="333.3">Efecto incremental</tspan></text><line x1="333.3" y1="641.2" x2="566.7" y2="641.2" stroke="#395fac" stroke-width="2"/><text x="333.3" y="659.2" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="333.3">Resultado atribuido por el modelo de</tspan><tspan x="333.3" dy="15.2">atribución</tspan></text><rect x="598.7" y="551.7" width="261.