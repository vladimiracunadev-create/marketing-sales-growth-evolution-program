.4" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="612.7">Brechas detectadas, por revisión</tspan><tspan x="612.7" dy="15.2">quincenal; fuente: registro de</tspan><tspan x="612.7" dy="15.2">riesgos</tspan></text><rect x="40.0" y="1104.6" width="261.3" height="120.7" rx="8" fill="#f7f3e2" stroke="#cec08c" stroke-width="1.4"/><text x="54.0" y="1126.6" font-size="13" fill="#6e5e20" font-weight="700" text-anchor="start"><tspan x="54.0">Claim rejection rate</tspan></text><text x="54.0" y="1155.8" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Claims rechazados por el control</tspan></text><line x1="54.0" y1="1177.0" x2="287.3" y2="1177.0" stroke="#ac9539" stroke-width="2"/><text x="54.0" y="1195.0" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="54.0">Claims extraídos, por versión de</tspan><tspan x="54.0" dy="15.2">campaña</tspan></text><rect x="319.3" y="1104.6" width="261.3" height="120.7" rx="8" fill="#f7f3e2" stroke="#cec08c" stroke-width="1.4"/><text x="333.3" y="1126.6" font-size="13" fill="#6e5e20" font-weight="700" text-anchor="start"><tspan x="333.3">Regulatory incident rate</tspan></text><text x="333.3" y="1155.8" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="333.3">Incidentes regulatorios confirmados</tspan></text><line x1="333.3" y1="1177.0" x2="566.7" y2="1177.0" stroke="#ac9539" stroke-width="2"/><text x="333.3" y="1195.0" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="333.3">Campañas activas, por trimestre</tspan></text><text x="40" y="1259.3200000000004" font-size="11.5" fill="#ac9539" font-weight="700" letter-spacing="1.4">FRONTERA DE APLICACIÓN</text><rect x="40" y="1269.3" width="820" height="65.0" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.4"/><polygon points="70,1286.8200000000004 52,1315.8200000000004 88,1315.8200000000004" fill="#c2410c"/><text x="70" y="1312.82000000