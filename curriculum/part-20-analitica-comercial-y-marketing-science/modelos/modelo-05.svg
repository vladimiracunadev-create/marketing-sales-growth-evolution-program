<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 893" width="900" height="893" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif"><title id="t">Modelo mental · Periodo de recuperación</title><desc id="d">Modelo mental de la clase 20.05: Periodo de recuperación. Método en 5 pasos; 4 conceptos; 3 señales de medición.</desc><rect x="0" y="0" width="900" height="893" rx="14" fill="#ffffff"/><rect x="0" y="0" width="900" height="64" rx="14" fill="#203a6e"/><rect x="0" y="40" width="900" height="24" fill="#203a6e"/><text x="40" y="28" font-size="12" fill="#bccae5" font-weight="700" letter-spacing="1.6">MODELO MENTAL · CLASE 20.05 · PARTE 20</text><text x="40" y="52" font-size="21" fill="#ffffff" font-weight="700">Periodo de recuperación</text><text x="40" y="84" font-size="11.5" fill="#395fac" font-weight="700" letter-spacing="1.4">MÉTODO PASO A PASO</text><rect x="40.0" y="100" width="246.7" height="59.0" rx="10" fill="#e2e9f7" stroke="#8ca2ce" stroke-width="1.4"/><text x="54.0" y="122" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Calcular el margen mensual por</tspan><tspan x="54.0" dy="16.5">cliente</tspan></text><circle cx="42.0" cy="102.0" r="14" fill="#203a6e"/><text x="42.0" y="106.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><rect x="326.7" y="100" width="246.7" height="59.0" rx="10" fill="#e2e9f7" stroke="#8ca2ce" stroke-width="1.4"/><text x="340.7" y="122" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="340.7">Determinar el periodo de</tspan><tspan x="340.7" dy="16.5">recuperación por segmento</tspan></text><circle cx="328.7" cy="102.0" r="14" fill="#203a6e"/><text x="328.7" y="106.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><rect x="613.3" y="100" width="246.7" height="59.0" rx="10" fill="#e2e9f7" stroke="#8ca2ce" stroke-width="1.4"/><text x="627.3" y="122" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="627.3">Compararlo con la vida media</tspan><tspan x="627.3" dy="16.5">observada</tspan></text><circle cx="615.3" cy="102.0" r="14" fill="#203a6e"/><text x="615.3" y="106.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><rect x="613.3" y="197.0" width="246.7" height="59.0" rx="10" fill="#e2e9f7" stroke="#8ca2ce" stroke-width="1.4"/><text x="627.3" y="219.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="627.3">Estimar el ritmo sostenible</tspan><tspan x="627.3" dy="16.5">según la caja disponible</tspan></text><circle cx="615.3" cy="199.0" r="14" fill="#203a6e"/><text x="615.3" y="203.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">4</text><rect x="326.7" y="197.0" width="246.7" height="59.0" rx="10" fill="#e2e9f7" stroke="#8ca2ce" stroke-width="1.4"/><text x="340.7" y="219.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="340.7">Ajustar la meta de adquisición a</tspan><tspan x="340.7" dy="16.5">esa restricción</tspan></text><circle cx="328.7" cy="199.0" r="14" fill="#203a6e"/><text x="328.7" y="203.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">5</text><line x1="289.7" y1="129.5" x2="318.7" y2="129.5" stroke="#395fac" stroke-width="2.2" stroke-linecap="round"/><polygon points="323.7,129.5 315.6,133.4 315.6,125.6" fill="#395fac"/><line x1="576.3" y1="129.5" x2="605.3" y2="129.5" stroke="#395fac" stroke-width="2.2" stroke-linecap="round"/><polygon points="610.3,129.5 602.2,133.4 602.2,125.6" fill="#395fac"/><line x1="736.7" y1="161.0" x2="736.7" y2="189.0" stroke="#395fac" stroke-width="2.2" stroke-linecap="round"/><polygon points="736.7,194.0 732.8,185.9 740.6,185.9" fill="#395fac"/><line x1="610.3" y1="226.5" x2="581.3" y2="226.5" stroke="#395fac" stroke-width="2.2" stroke-linecap="round"/><polygon points="576.3,226.5 584.4,222.6 584.4,230.4" fill="#395fac"/><text x="40" y="294.0" font-size="11.5" fill="#395fac" font-weight="700" letter-spacing="1.4">CONCEPTOS Y DÓNDE ACTÚAN EN EL MÉTODO</text><rect x="40.0" y="308.0" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#8ca2ce" stroke-width="1.4"/><rect x="40.0" y="316.0" width="5" height="62.2" rx="2" fill="#395fac"/><text x="56.0" y="330.0" font-size="13.5" fill="#203a6e" font-weight="700" text-anchor="start"><tspan x="56.0">Periodo de recuperación</tspan></text><text x="56.0" y="349.8" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Meses hasta que el margen acumulado iguala el costo de</tspan><tspan x="56.0" dy="15.2">adquisición</tspan></text><rect x="379.0" y="316.0" width="54" height="20" rx="10" fill="#bccae5" stroke="#8ca2ce" stroke-width="1"/><text x="406.0" y="330.0" font-size="11" fill="#203a6e" font-weight="700" text-anchor="middle">↔ 2</text><rect x="459.0" y="308.0" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#8ca2ce" stroke-width="1.4"/><rect x="459.0" y="316.0" width="5" height="62.2" rx="2" fill="#395fac"/><text x="475.0" y="330.0" font-size="13.5" fill="#203a6e" font-weight="700" text-anchor="start"><tspan x="475.0">Restricción de caja</tspan></text><text x="475.0" y="349.8" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Límite de inversión impuesto por la liquidez disponible</tspan></text><rect x="798.0" y="316.0" width="54" height="20" rx="10" fill="#bccae5" stroke="#8ca2ce" stroke-width="1"/><text x="825.0" y="330.0" font-size="11" fill="#203a6e" font-weight="700" text-anchor="middle">↔ 5</text><rect x="40.0" y="400.2" width="401.0" height="63.0" rx="8" fill="#ffffff" stroke="#8ca2ce" stroke-width="1.4"/><rect x="40.0" y="408.2" width="5" height="47.0" rx="2" fill="#395fac"/><text x="56.0" y="422.2" font-size="13.5" fill="#203a6e" font-weight="700" text-anchor="start"><tspan x="56.0">Ritmo sostenible de adquisición</tspan></text><text x="56.0" y="442.0" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Volumen de clientes nuevos que la caja permite financiar</tspan></text><rect x="379.0" y="408.2" width="54" height="20" rx="10" fill="#bccae5" stroke="#8ca2ce" stroke-width="1"/><text x="406.0" y="422.2" font-size="11" fill="#203a6e" font-weight="700" text-anchor="middle">↔ 4, 5</text><rect x="459.0" y="400.2" width="401.0" height="63.0" rx="8" fill="#ffffff" stroke="#8ca2ce" stroke-width="1.4"/><rect x="459.0" y="408.2" width="5" height="47.0" rx="2" fill="#395fac"/><text x="475.0" y="422.2" font-size="13.5" fill="#203a6e" font-weight="700" text-anchor="start"><tspan x="475.0">Relación con la vida del cliente</tspan></text><text x="475.0" y="442.0" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Comparación entre recuperación y permanencia esperada</tspan></text><rect x="798.0" y="408.2" width="54" height="20" rx="10" fill="#bccae5" stroke="#8ca2ce" stroke-width="1"/><text x="825.0" y="422.2" font-size="11" fill="#203a6e" font-weight="700" text-anchor="middle">↔ 1</text><text x="40" y="495.18" font-size="11.5" fill="#395fac" font-weight="700" letter-spacing="1.4">QUÉ SE MIDE: NUMERADOR SOBRE DENOMINADOR</text><rect x="40.0" y="509.2" width="261.3" height="122.7" rx="8" fill="#e2e9f7" stroke="#8ca2ce" stroke-width="1.4"/><text x="54.0" y="531.2" font-size="13" fill="#203a6e" font-weight="700" text-anchor="start"><tspan x="54.0">Periodo de recuperación por</tspan><tspan x="54.0" dy="17.2">segmento</tspan></text><text x="54.0" y="577.5" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Meses hasta recuperar el costo de</tspan><tspan x="54.0" dy="15.2">adquisición, por segmento</tspan></text><rect x="319.3" y="509.2" width="261.3" height="122.7" rx="8" fill="#e2e9f7" stroke="#8ca2ce" stroke-width="1.4"/><text x="333.3" y="531.2" font-size="13" fill="#203a6e" font-weight="700" text-anchor="start"><tspan x="333.3">Relación</tspan><tspan x="333.3" dy="17.2">recuperación-permanencia</tspan></text><text x="333.3" y="577.5" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="333.3">Periodo de recuperación</tspan></text><line x1="333.3" y1="598.7" x2="566.7" y2="598.7" stroke="#395fac" stroke-width="2"/><text x="333.3" y="616.7" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="333.3">Vida media del cliente</tspan></text><rect x="598.7" y="509.2" width="261.3" height="122.7" rx="8" fill="#e2e9f7" stroke="#8ca2ce" stroke-width="1.4"/><text x="612.7" y="531.2" font-size="13" fill="#203a6e" font-weight="700" text-anchor="start"><tspan x="612.7">Clientes financiables por</tspan><tspan x="612.7" dy="17.2">periodo</tspan></text><text x="612.7" y="577.5" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="612.7">Caja disponible del periodo,</tspan><tspan x="612.7" dy="15.2">dividida por el costo de adquisición</tspan><tspan x="612.7" dy="15.2">por cliente del segmento</tspan></text><text x="40" y="665.86" font-size="11.5" fill="#395fac" font-weight="700" letter-spacing="1.4">FRONTERA DE APLICACIÓN</text><rect x="40" y="675.9" width="820" height="65.0" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.4"/><polygon points="70,693.36 52,722.36 88,722.36" fill="#c2410c"/><text x="70" y="719.36" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">!</text><text x="106" y="699.9" font-size="12.5" fill="#7c2d12" font-weight="400" text-anchor="start"><tspan x="106">El periodo de recuperación ignora el valor posterior. Un negocio con recuperación larga puede ser</tspan><tspan x="106" dy="16.5">excelente si la permanencia es muy alta y hay financiamiento.</tspan></text><text x="40" y="768.86" font-size="11.5" fill="#395fac" font-weight="700" letter-spacing="1.4">ERROR FRECUENTE Y SU CORRECCIÓN</text><rect x="40" y="778.9" width="380.0" height="77.0" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/><text x="54" y="800.9" font-size="11" fill="#b91c1c" font-weight="700" text-anchor="start"><tspan x="54">Síntoma</tspan></text><text x="54" y="818.9" font-size="12.5" fill="#7f1d1d" font-weight="400" text-anchor="start"><tspan x="54">Escalar con recuperación mayor que la vida del</tspan><tspan x="54" dy="16.5">cliente</tspan></text><line x1="426.0" y1="817.4" x2="469.0" y2="817.4" stroke="#395fac" stroke-width="2.6" stroke-linecap="round"/><polygon points="474.0,817.4 465.9,821.3 465.9,813.4" fill="#395fac"/><rect x="480.0" y="778.9" width="380.0" height="77.0" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.4"/><text x="494.0" y="800.9" font-size="11" fill="#15803d" font-weight="700" text-anchor="start"><tspan x="494.0">Corrección</tspan></text><text x="494.0" y="818.9" font-size="12.5" fill="#14532d" font-weight="400" text-anchor="start"><tspan x="494.0">Compara ambos indicadores por segmento antes de</tspan><tspan x="494.0" dy="16.5">aumentar la inversión en adquisición.</tspan></text></svg>