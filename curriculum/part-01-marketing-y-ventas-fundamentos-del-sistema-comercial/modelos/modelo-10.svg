<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 999" width="900" height="999" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif"><title id="t">Modelo mental · Ventas transaccionales y consultivas</title><desc id="d">Modelo mental de la clase 01.10: Ventas transaccionales y consultivas. Método en 5 pasos; 4 conceptos; 3 señales de medición.</desc><rect x="0" y="0" width="900" height="999" rx="14" fill="#ffffff"/><rect x="0" y="0" width="900" height="64" rx="14" fill="#6e5d20"/><rect x="0" y="40" width="900" height="24" fill="#6e5d20"/><text x="40" y="28" font-size="12" fill="#e5dcbc" font-weight="700" letter-spacing="1.6">MODELO MENTAL · CLASE 01.10 · PARTE 01</text><text x="40" y="52" font-size="21" fill="#ffffff" font-weight="700">Ventas transaccionales y consultivas</text><text x="40" y="84" font-size="11.5" fill="#ac9339" font-weight="700" letter-spacing="1.4">MÉTODO PASO A PASO</text><line x1="450.0" y1="94.0" x2="450.0" y2="317.0" stroke="#cebf8c" stroke-width="3" stroke-linecap="round"/><line x1="450.0" y1="129.5" x2="406.0" y2="129.5" stroke="#cebf8c" stroke-width="2"/><rect x="56.0" y="100" width="350" height="59.0" rx="10" fill="#f7f3e2" stroke="#cebf8c" stroke-width="1.4"/><text x="70.0" y="122" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="70.0">Clasificar el negocio por valor del contrato y</tspan><tspan x="70.0" dy="16.5">complejidad de decisión</tspan></text><circle cx="450.0" cy="129.5" r="15" fill="#6e5d20"/><text x="450.0" y="134.0" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><line x1="450.0" y1="167.5" x2="494.0" y2="167.5" stroke="#cebf8c" stroke-width="2"/><rect x="494.0" y="138" width="350" height="59.0" rx="10" fill="#f7f3e2" stroke="#cebf8c" stroke-width="1.4"/><text x="508.0" y="160" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="508.0">Calcular el costo de adquisición admisible para</tspan><tspan x="508.0" dy="16.5">ese ticket</tspan></text><circle cx="450.0" cy="167.5" r="15" fill="#6e5d20"/><text x="450.0" y="172.0" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><line x1="450.0" y1="205.5" x2="406.0" y2="205.5" stroke="#cebf8c" stroke-width="2"/><rect x="56.0" y="176" width="350" height="59.0" rx="10" fill="#f7f3e2" stroke="#cebf8c" stroke-width="1.4"/><text x="70.0" y="198" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="70.0">Elegir el modelo de venta que cabe dentro de</tspan><tspan x="70.0" dy="16.5">ese costo</tspan></text><circle cx="450.0" cy="205.5" r="15" fill="#6e5d20"/><text x="450.0" y="210.0" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><line x1="450.0" y1="243.5" x2="494.0" y2="243.5" stroke="#cebf8c" stroke-width="2"/><rect x="494.0" y="214" width="350" height="59.0" rx="10" fill="#f7f3e2" stroke="#cebf8c" stroke-width="1.4"/><text x="508.0" y="236" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="508.0">Diseñar el proceso mínimo suficiente para ese</tspan><tspan x="508.0" dy="16.5">modelo</tspan></text><circle cx="450.0" cy="243.5" r="15" fill="#6e5d20"/><text x="450.0" y="248.0" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">4</text><line x1="450.0" y1="281.5" x2="406.0" y2="281.5" stroke="#cebf8c" stroke-width="2"/><rect x="56.0" y="252" width="350" height="59.0" rx="10" fill="#f7f3e2" stroke="#cebf8c" stroke-width="1.4"/><text x="70.0" y="274" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="70.0">Revisar la clasificación cuando cambian ticket</tspan><tspan x="70.0" dy="16.5">o ciclo</tspan></text><circle cx="450.0" cy="281.5" r="15" fill="#6e5d20"/><text x="450.0" y="286.0" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">5</text><text x="40" y="353.0" font-size="11.5" fill="#ac9339" font-weight="700" letter-spacing="1.4">CONCEPTOS Y DÓNDE ACTÚAN EN EL MÉTODO</text><rect x="40.0" y="367.0" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#cebf8c" stroke-width="1.4"/><rect x="40.0" y="375.0" width="5" height="62.2" rx="2" fill="#ac9339"/><text x="56.0" y="389.0" font-size="13.5" fill="#6e5d20" font-weight="700" text-anchor="start"><tspan x="56.0">Venta transaccional</tspan></text><text x="56.0" y="408.8" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Proceso corto donde el cliente ya sabe qué quiere y</tspan><tspan x="56.0" dy="15.2">compara principalmente precio y disponibilidad</tspan></text><rect x="379.0" y="375.0" width="54" height="20" rx="10" fill="#e5dcbc" stroke="#cebf8c" stroke-width="1"/><text x="406.0" y="389.0" font-size="11" fill="#6e5d20" font-weight="700" text-anchor="middle">↔ 3</text><rect x="459.0" y="367.0" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#cebf8c" stroke-width="1.4"/><rect x="459.0" y="375.0" width="5" height="62.2" rx="2" fill="#ac9339"/><text x="475.0" y="389.0" font-size="13.5" fill="#6e5d20" font-weight="700" text-anchor="start"><tspan x="475.0">Venta consultiva</tspan></text><text x="475.0" y="408.8" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Proceso donde el vendedor ayuda a definir el problema</tspan><tspan x="475.0" dy="15.2">antes de proponer solución</tspan></text><rect x="798.0" y="375.0" width="54" height="20" rx="10" fill="#e5dcbc" stroke="#cebf8c" stroke-width="1"/><text x="825.0" y="389.0" font-size="11" fill="#6e5d20" font-weight="700" text-anchor="middle">↔ 3</text><rect x="40.0" y="459.2" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#cebf8c" stroke-width="1.4"/><rect x="40.0" y="467.2" width="5" height="62.2" rx="2" fill="#ac9339"/><text x="56.0" y="481.2" font-size="13.5" fill="#6e5d20" font-weight="700" text-anchor="start"><tspan x="56.0">Costo de adquisición admisible</tspan></text><text x="56.0" y="501.0" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Gasto máximo de venta compatible con el margen y el</tspan><tspan x="56.0" dy="15.2">periodo de recuperación del contrato</tspan></text><rect x="379.0" y="467.2" width="54" height="20" rx="10" fill="#e5dcbc" stroke="#cebf8c" stroke-width="1"/><text x="406.0" y="481.2" font-size="11" fill="#6e5d20" font-weight="700" text-anchor="middle">↔ 2, 3</text><rect x="459.0" y="459.2" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#cebf8c" stroke-width="1.4"/><rect x="459.0" y="467.2" width="5" height="62.2" rx="2" fill="#ac9339"/><text x="475.0" y="481.2" font-size="13.5" fill="#6e5d20" font-weight="700" text-anchor="start"><tspan x="475.0">Complejidad de decisión</tspan></text><text x="475.0" y="501.0" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Número de personas, riesgos y evidencias que exige el</tspan><tspan x="475.0" dy="15.2">cliente para avanzar</tspan></text><rect x="798.0" y="467.2" width="54" height="20" rx="10" fill="#e5dcbc" stroke="#cebf8c" stroke-width="1"/><text x="825.0" y="481.2" font-size="11" fill="#6e5d20" font-weight="700" text-anchor="middle">↔ 1</text><text x="40" y="569.36" font-size="11.5" fill="#ac9339" font-weight="700" letter-spacing="1.4">QUÉ SE MIDE: NUMERADOR SOBRE DENOMINADOR</text><rect x="40.0" y="583.4" width="261.3" height="137.9" rx="8" fill="#f7f3e2" stroke="#cebf8c" stroke-width="1.4"/><text x="54.0" y="605.4" font-size="13" fill="#6e5d20" font-weight="700" text-anchor="start"><tspan x="54.0">Costo de venta sobre valor del</tspan><tspan x="54.0" dy="17.2">contrato</tspan></text><text x="54.0" y="651.7" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Horas comerciales valorizadas más</tspan><tspan x="54.0" dy="15.2">gastos directos</tspan></text><line x1="54.0" y1="688.0" x2="287.3" y2="688.0" stroke="#ac9339" stroke-width="2"/><text x="54.0" y="706.0" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="54.0">El valor del primer año del contrato</tspan></text><rect x="319.3" y="583.4" width="261.3" height="137.9" rx="8" fill="#f7f3e2" stroke="#cebf8c" stroke-width="1.4"/><text x="333.3" y="605.4" font-size="13" fill="#6e5d20" font-weight="700" text-anchor="start"><tspan x="333.3">Ciclo mediano por modelo</tspan></text><text x="333.3" y="634.5" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="333.3">Días entre oportunidad calificada y</tspan><tspan x="333.3" dy="15.2">cierre, mediana separada por modelo</tspan><tspan x="333.3" dy="15.2">transaccional y consultivo</tspan></text><rect x="598.7" y="583.4" width="261.3" height="137.9" rx="8" fill="#f7f3e2" stroke="#cebf8c" stroke-width="1.4"/><text x="612.7" y="605.4" font-size="13" fill="#6e5d20" font-weight="700" text-anchor="start"><tspan x="612.7">Tasa de descuento por modelo</tspan></text><text x="612.7" y="634.5" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="612.7">Descuento promedio ponderado por</tspan><tspan x="612.7" dy="15.2">ingreso, comparado entre ambos</tspan><tspan x="612.7" dy="15.2">modelos</tspan></text><text x="40" y="755.22" font-size="11.5" fill="#ac9339" font-weight="700" letter-spacing="1.4">FRONTERA DE APLICACIÓN</text><rect x="40" y="765.2" width="820" height="65.0" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.4"/><polygon points="70,782.72 52,811.72 88,811.72" fill="#c2410c"/><text x="70" y="808.72" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">!</text><text x="106" y="789.2" font-size="12.5" fill="#7c2d12" font-weight="400" text-anchor="start"><tspan x="106">La clasificación no es permanente: un cliente pequeño puede convertirse en cuenta estratégica. El criterio</tspan><tspan x="106" dy="16.5">debe revisarse cuando cambia el potencial de expansión, no sólo el ticket inicial.</tspan></text><text x="40" y="858.22" font-size="11.5" fill="#ac9339" font-weight="700" letter-spacing="1.4">ERROR FRECUENTE Y SU CORRECCIÓN</text><rect x="40" y="868.2" width="380.0" height="93.5" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/><text x="54" y="890.2" font-size="11" fill="#b91c1c" font-weight="700" text-anchor="start"><tspan x="54">Síntoma</tspan></text><text x="54" y="908.2" font-size="12.5" fill="#7f1d1d" font-weight="400" text-anchor="start"><tspan x="54">Atender todo con el proceso más caro</tspan></text><line x1="426.0" y1="915.0" x2="469.0" y2="915.0" stroke="#ac9339" stroke-width="2.6" stroke-linecap="round"/><polygon points="474.0,915.0 465.9,918.9 465.9,911.1" fill="#ac9339"/><rect x="480.0" y="868.2" width="380.0" height="93.5" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.4"/><text x="494.0" y="890.2" font-size="11" fill="#15803d" font-weight="700" text-anchor="start"><tspan x="494.0">Corrección</tspan></text><text x="494.0" y="908.2" font-size="12.5" fill="#14532d" font-weight="400" text-anchor="start"><tspan x="494.0">Define umbrales de ticket y complejidad que</tspan><tspan x="494.0" dy="16.5">determinan qué proceso se aplica, y audítalos cada</tspan><tspan x="494.0" dy="16.5">trimestre.</tspan></text></svg>