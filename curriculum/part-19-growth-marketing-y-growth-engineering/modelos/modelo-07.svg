<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 949" width="900" height="949" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif"><title id="t">Modelo mental · Bucles de referencia</title><desc id="d">Modelo mental de la clase 19.07: Bucles de referencia. Método en 5 pasos; 4 conceptos; 3 señales de medición.</desc><rect x="0" y="0" width="900" height="949" rx="14" fill="#ffffff"/><rect x="0" y="0" width="900" height="64" rx="14" fill="#206e65"/><rect x="0" y="40" width="900" height="24" fill="#206e65"/><text x="40" y="28" font-size="12" fill="#bce5e0" font-weight="700" letter-spacing="1.6">MODELO MENTAL · CLASE 19.07 · PARTE 19</text><text x="40" y="52" font-size="21" fill="#ffffff" font-weight="700">Bucles de referencia</text><text x="40" y="84" font-size="11.5" fill="#39ac9e" font-weight="700" letter-spacing="1.4">MÉTODO PASO A PASO</text><line x1="450.0" y1="94.0" x2="450.0" y2="300.5" stroke="#8ccec6" stroke-width="3" stroke-linecap="round"/><line x1="450.0" y1="129.5" x2="406.0" y2="129.5" stroke="#8ccec6" stroke-width="2"/><rect x="56.0" y="100" width="350" height="59.0" rx="10" fill="#e2f7f5" stroke="#8ccec6" stroke-width="1.4"/><text x="70.0" y="122" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="70.0">Verificar el resultado del cliente antes de</tspan><tspan x="70.0" dy="16.5">invitarlo a referir</tspan></text><circle cx="450.0" cy="129.5" r="15" fill="#206e65"/><text x="450.0" y="134.0" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><line x1="450.0" y1="167.5" x2="494.0" y2="167.5" stroke="#8ccec6" stroke-width="2"/><rect x="494.0" y="138" width="350" height="59.0" rx="10" fill="#e2f7f5" stroke="#8ccec6" stroke-width="1.4"/><text x="508.0" y="160" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="508.0">Elegir el momento posterior a un logro</tspan><tspan x="508.0" dy="16.5">reconocido</tspan></text><circle cx="450.0" cy="167.5" r="15" fill="#206e65"/><text x="450.0" y="172.0" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><line x1="450.0" y1="205.5" x2="406.0" y2="205.5" stroke="#8ccec6" stroke-width="2"/><rect x="56.0" y="176" width="350" height="59.0" rx="10" fill="#e2f7f5" stroke="#8ccec6" stroke-width="1.4"/><text x="70.0" y="198" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="70.0">Diseñar el mecanismo de compartir con esfuerzo</tspan><tspan x="70.0" dy="16.5">mínimo</tspan></text><circle cx="450.0" cy="205.5" r="15" fill="#206e65"/><text x="450.0" y="210.0" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><line x1="450.0" y1="243.5" x2="494.0" y2="243.5" stroke="#8ccec6" stroke-width="2"/><rect x="494.0" y="214" width="350" height="59.0" rx="10" fill="#e2f7f5" stroke="#8ccec6" stroke-width="1.4"/><text x="508.0" y="236" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="508.0">Definir incentivo y declararlo con</tspan><tspan x="508.0" dy="16.5">transparencia</tspan></text><circle cx="450.0" cy="243.5" r="15" fill="#206e65"/><text x="450.0" y="248.0" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">4</text><line x1="450.0" y1="273.2" x2="406.0" y2="273.2" stroke="#8ccec6" stroke-width="2"/><rect x="56.0" y="252" width="350" height="42.5" rx="10" fill="#e2f7f5" stroke="#8ccec6" stroke-width="1.4"/><text x="70.0" y="274" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="70.0">Medir volumen y calidad de los referidos</tspan></text><circle cx="450.0" cy="273.2" r="15" fill="#206e65"/><text x="450.0" y="277.8" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">5</text><text x="40" y="336.5" font-size="11.5" fill="#39ac9e" font-weight="700" letter-spacing="1.4">CONCEPTOS Y DÓNDE ACTÚAN EN EL MÉTODO</text><rect x="40.0" y="350.5" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#8ccec6" stroke-width="1.4"/><rect x="40.0" y="358.5" width="5" height="62.2" rx="2" fill="#39ac9e"/><text x="56.0" y="372.5" font-size="13.5" fill="#206e65" font-weight="700" text-anchor="start"><tspan x="56.0">Condición de valor previo</tspan></text><text x="56.0" y="392.3" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Requisito de que el cliente haya obtenido resultado antes</tspan><tspan x="56.0" dy="15.2">de referir</tspan></text><rect x="379.0" y="358.5" width="54" height="20" rx="10" fill="#bce5e0" stroke="#8ccec6" stroke-width="1"/><text x="406.0" y="372.5" font-size="11" fill="#206e65" font-weight="700" text-anchor="middle">↔ 1</text><rect x="459.0" y="350.5" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#8ccec6" stroke-width="1.4"/><rect x="459.0" y="358.5" width="5" height="62.2" rx="2" fill="#39ac9e"/><text x="475.0" y="372.5" font-size="13.5" fill="#206e65" font-weight="700" text-anchor="start"><tspan x="475.0">Mecanismo de compartir</tspan></text><text x="475.0" y="392.3" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Función que permite referir con esfuerzo mínimo</tspan></text><rect x="798.0" y="358.5" width="54" height="20" rx="10" fill="#bce5e0" stroke="#8ccec6" stroke-width="1"/><text x="825.0" y="372.5" font-size="11" fill="#206e65" font-weight="700" text-anchor="middle">↔ 3</text><rect x="40.0" y="442.7" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#8ccec6" stroke-width="1.4"/><rect x="40.0" y="450.7" width="5" height="62.2" rx="2" fill="#39ac9e"/><text x="56.0" y="464.7" font-size="13.5" fill="#206e65" font-weight="700" text-anchor="start"><tspan x="56.0">Incentivo bilateral</tspan></text><text x="56.0" y="484.5" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Beneficio para quien refiere y para quien es referido</tspan></text><rect x="379.0" y="450.7" width="54" height="20" rx="10" fill="#bce5e0" stroke="#8ccec6" stroke-width="1"/><text x="406.0" y="464.7" font-size="11" fill="#206e65" font-weight="700" text-anchor="middle">↔ 4</text><rect x="459.0" y="442.7" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#8ccec6" stroke-width="1.4"/><rect x="459.0" y="450.7" width="5" height="62.2" rx="2" fill="#39ac9e"/><text x="475.0" y="464.7" font-size="13.5" fill="#206e65" font-weight="700" text-anchor="start"><tspan x="475.0">Calidad del referido</tspan></text><text x="475.0" y="484.5" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Grado en que el referido corresponde al perfil de cliente</tspan><tspan x="475.0" dy="15.2">ideal</tspan></text><rect x="798.0" y="450.7" width="54" height="20" rx="10" fill="#bce5e0" stroke="#8ccec6" stroke-width="1"/><text x="825.0" y="464.7" font-size="11" fill="#206e65" font-weight="700" text-anchor="middle">↔ 1, 5</text><text x="40" y="552.86" font-size="11.5" fill="#39ac9e" font-weight="700" letter-spacing="1.4">QUÉ SE MIDE: NUMERADOR SOBRE DENOMINADOR</text><rect x="40.0" y="566.9" width="261.3" height="120.7" rx="8" fill="#e2f7f5" stroke="#8ccec6" stroke-width="1.4"/><text x="54.0" y="588.9" font-size="13" fill="#206e65" font-weight="700" text-anchor="start"><tspan x="54.0">Tasa de participación</tspan></text><text x="54.0" y="618.0" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Clientes que refieren al menos una</tspan><tspan x="54.0" dy="15.2">vez</tspan></text><line x1="54.0" y1="654.4" x2="287.3" y2="654.4" stroke="#39ac9e" stroke-width="2"/><text x="54.0" y="672.4" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="54.0">Clientes elegibles</tspan></text><rect x="319.3" y="566.9" width="261.3" height="120.7" rx="8" fill="#e2f7f5" stroke="#8ccec6" stroke-width="1.4"/><text x="333.3" y="588.9" font-size="13" fill="#206e65" font-weight="700" text-anchor="start"><tspan x="333.3">Calidad del referido</tspan></text><text x="333.3" y="618.0" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="333.3">Referidos que cumplen el perfil</tspan><tspan x="333.3" dy="15.2">objetivo</tspan></text><line x1="333.3" y1="654.4" x2="566.7" y2="654.4" stroke="#39ac9e" stroke-width="2"/><text x="333.3" y="672.4" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="333.3">Referidos recibidos</tspan></text><rect x="598.7" y="566.9" width="261.3" height="120.7" rx="8" fill="#e2f7f5" stroke="#8ccec6" stroke-width="1.4"/><text x="612.7" y="588.9" font-size="13" fill="#206e65" font-weight="700" text-anchor="start"><tspan x="612.7">Retención de clientes referidos</tspan></text><text x="612.7" y="618.0" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="612.7">Retención a 12 meses de referidos</tspan><tspan x="612.7" dy="15.2">frente a clientes de otros orígenes</tspan></text><text x="40" y="721.56" font-size="11.5" fill="#39ac9e" font-weight="700" letter-spacing="1.4">FRONTERA DE APLICACIÓN</text><rect x="40" y="731.6" width="820" height="65.0" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.4"/><polygon points="70,749.06 52,778.06 88,778.06" fill="#c2410c"/><text x="70" y="775.06" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">!</text><text x="106" y="755.6" font-size="12.5" fill="#7c2d12" font-weight="400" text-anchor="start"><tspan x="106">Los incentivos monetarios pueden atraer referencias de baja calidad. Un incentivo vinculado a la</tspan><tspan x="106" dy="16.5">permanencia del referido corrige parcialmente ese sesgo.</tspan></text><text x="40" y="824.56" font-size="11.5" fill="#39ac9e" font-weight="700" letter-spacing="1.4">ERROR FRECUENTE Y SU CORRECCIÓN</text><rect x="40" y="834.6" width="380.0" height="77.0" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/><text x="54" y="856.6" font-size="11" fill="#b91c1c" font-weight="700" text-anchor="start"><tspan x="54">Síntoma</tspan></text><text x="54" y="874.6" font-size="12.5" fill="#7f1d1d" font-weight="400" text-anchor="start"><tspan x="54">Invitar a referir antes de que el cliente obtenga</tspan><tspan x="54" dy="16.5">valor</tspan></text><line x1="426.0" y1="873.1" x2="469.0" y2="873.1" stroke="#39ac9e" stroke-width="2.6" stroke-linecap="round"/><polygon points="474.0,873.1 465.9,877.0 465.9,869.1" fill="#39ac9e"/><rect x="480.0" y="834.6" width="380.0" height="77.0" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.4"/><text x="494.0" y="856.6" font-size="11" fill="#15803d" font-weight="700" text-anchor="start"><tspan x="494.0">Corrección</tspan></text><text x="494.0" y="874.6" font-size="12.5" fill="#14532d" font-weight="400" text-anchor="start"><tspan x="494.0">Condiciona la invitación al resultado acreditado y</tspan><tspan x="494.0" dy="16.5">mide la calidad del referido.</tspan></text></svg>