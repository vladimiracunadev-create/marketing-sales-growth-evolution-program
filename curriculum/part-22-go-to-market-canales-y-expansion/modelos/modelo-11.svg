<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 964" width="900" height="964" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif"><title id="t">Modelo mental · Expansión por segmento</title><desc id="d">Modelo mental de la clase 22.11: Expansión por segmento. Método en 5 pasos; 4 conceptos; 3 señales de medición.</desc><rect x="0" y="0" width="900" height="964" rx="14" fill="#ffffff"/><rect x="0" y="0" width="900" height="64" rx="14" fill="#6e205c"/><rect x="0" y="40" width="900" height="24" fill="#6e205c"/><text x="40" y="28" font-size="12" fill="#e5bcdc" font-weight="700" letter-spacing="1.6">MODELO MENTAL · CLASE 22.11 · PARTE 22</text><text x="40" y="52" font-size="21" fill="#ffffff" font-weight="700">Expansión por segmento</text><text x="40" y="84" font-size="11.5" fill="#ac3991" font-weight="700" letter-spacing="1.4">MÉTODO PASO A PASO</text><line x1="450.0" y1="94.0" x2="450.0" y2="300.5" stroke="#ce8cbe" stroke-width="3" stroke-linecap="round"/><line x1="450.0" y1="129.5" x2="406.0" y2="129.5" stroke="#ce8cbe" stroke-width="2"/><rect x="56.0" y="100" width="350" height="59.0" rx="10" fill="#f7e2f2" stroke="#ce8cbe" stroke-width="1.4"/><text x="70.0" y="122" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="70.0">Verificar la equivalencia del problema con</tspan><tspan x="70.0" dy="16.5">evidencia</tspan></text><circle cx="450.0" cy="129.5" r="15" fill="#6e205c"/><text x="450.0" y="134.0" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><line x1="450.0" y1="167.5" x2="494.0" y2="167.5" stroke="#ce8cbe" stroke-width="2"/><rect x="494.0" y="138" width="350" height="59.0" rx="10" fill="#f7e2f2" stroke="#ce8cbe" stroke-width="1.4"/><text x="508.0" y="160" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="508.0">Evaluar si las referencias actuales transfieren</tspan><tspan x="508.0" dy="16.5">credibilidad</tspan></text><circle cx="450.0" cy="167.5" r="15" fill="#6e205c"/><text x="450.0" y="172.0" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><line x1="450.0" y1="205.5" x2="406.0" y2="205.5" stroke="#ce8cbe" stroke-width="2"/><rect x="56.0" y="176" width="350" height="59.0" rx="10" fill="#f7e2f2" stroke="#ce8cbe" stroke-width="1.4"/><text x="70.0" y="198" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="70.0">Estimar el ajuste operativo necesario y su</tspan><tspan x="70.0" dy="16.5">costo</tspan></text><circle cx="450.0" cy="205.5" r="15" fill="#6e205c"/><text x="450.0" y="210.0" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><line x1="450.0" y1="243.5" x2="494.0" y2="243.5" stroke="#ce8cbe" stroke-width="2"/><rect x="494.0" y="214" width="350" height="59.0" rx="10" fill="#f7e2f2" stroke="#ce8cbe" stroke-width="1.4"/><text x="508.0" y="236" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="508.0">Probar con un piloto acotado antes de</tspan><tspan x="508.0" dy="16.5">comprometer</tspan></text><circle cx="450.0" cy="243.5" r="15" fill="#6e205c"/><text x="450.0" y="248.0" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">4</text><line x1="450.0" y1="273.2" x2="406.0" y2="273.2" stroke="#ce8cbe" stroke-width="2"/><rect x="56.0" y="252" width="350" height="42.5" rx="10" fill="#f7e2f2" stroke="#ce8cbe" stroke-width="1.4"/><text x="70.0" y="274" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="70.0">Decidir con criterio previo definido</tspan></text><circle cx="450.0" cy="273.2" r="15" fill="#6e205c"/><text x="450.0" y="277.8" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">5</text><text x="40" y="336.5" font-size="11.5" fill="#ac3991" font-weight="700" letter-spacing="1.4">CONCEPTOS Y DÓNDE ACTÚAN EN EL MÉTODO</text><rect x="40.0" y="350.5" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#ce8cbe" stroke-width="1.4"/><rect x="40.0" y="358.5" width="5" height="62.2" rx="2" fill="#ac3991"/><text x="56.0" y="372.5" font-size="13.5" fill="#6e205c" font-weight="700" text-anchor="start"><tspan x="56.0">Adyacencia real</tspan></text><text x="56.0" y="392.3" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Cercanía verificada del problema, del proceso de compra y</tspan><tspan x="56.0" dy="15.2">del contexto</tspan></text><rect x="379.0" y="358.5" width="54" height="20" rx="10" fill="#e5bcdc" stroke="#ce8cbe" stroke-width="1"/><text x="406.0" y="372.5" font-size="11" fill="#6e205c" font-weight="700" text-anchor="middle">↔ 1</text><rect x="459.0" y="350.5" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#ce8cbe" stroke-width="1.4"/><rect x="459.0" y="358.5" width="5" height="62.2" rx="2" fill="#ac3991"/><text x="475.0" y="372.5" font-size="13.5" fill="#6e205c" font-weight="700" text-anchor="start"><tspan x="475.0">Transferencia de credibilidad</tspan></text><text x="475.0" y="392.3" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Grado en que las referencias actuales tienen valor en el</tspan><tspan x="475.0" dy="15.2">nuevo segmento</tspan></text><rect x="798.0" y="358.5" width="54" height="20" rx="10" fill="#e5bcdc" stroke="#ce8cbe" stroke-width="1"/><text x="825.0" y="372.5" font-size="11" fill="#6e205c" font-weight="700" text-anchor="middle">↔ 2</text><rect x="40.0" y="442.7" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#ce8cbe" stroke-width="1.4"/><rect x="40.0" y="450.7" width="5" height="62.2" rx="2" fill="#ac3991"/><text x="56.0" y="464.7" font-size="13.5" fill="#6e205c" font-weight="700" text-anchor="start"><tspan x="56.0">Ajuste operativo</tspan></text><text x="56.0" y="484.5" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Cambios necesarios en producto y servicio para atender al</tspan><tspan x="56.0" dy="15.2">nuevo segmento</tspan></text><rect x="379.0" y="450.7" width="54" height="20" rx="10" fill="#e5bcdc" stroke="#ce8cbe" stroke-width="1"/><text x="406.0" y="464.7" font-size="11" fill="#6e205c" font-weight="700" text-anchor="middle">↔ 3</text><rect x="459.0" y="442.7" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#ce8cbe" stroke-width="1.4"/><rect x="459.0" y="450.7" width="5" height="62.2" rx="2" fill="#ac3991"/><text x="475.0" y="464.7" font-size="13.5" fill="#6e205c" font-weight="700" text-anchor="start"><tspan x="475.0">Costo de la adaptación</tspan></text><text x="475.0" y="484.5" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Inversión requerida para servir al segmento con calidad</tspan></text><rect x="798.0" y="450.7" width="54" height="20" rx="10" fill="#e5bcdc" stroke="#ce8cbe" stroke-width="1"/><text x="825.0" y="464.7" font-size="11" fill="#6e205c" font-weight="700" text-anchor="middle">↔ 3</text><text x="40" y="552.86" font-size="11.5" fill="#ac3991" font-weight="700" letter-spacing="1.4">QUÉ SE MIDE: NUMERADOR SOBRE DENOMINADOR</text><rect x="40.0" y="566.9" width="261.3" height="135.9" rx="8" fill="#f7e2f2" stroke="#ce8cbe" stroke-width="1.4"/><text x="54.0" y="588.9" font-size="13" fill="#6e205c" font-weight="700" text-anchor="start"><tspan x="54.0">Similitud del problema</tspan></text><text x="54.0" y="618.0" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Coincidencia de resultados deseados</tspan><tspan x="54.0" dy="15.2">entre segmentos, verificada en</tspan><tspan x="54.0" dy="15.2">entrevistas</tspan></text><rect x="319.3" y="566.9" width="261.3" height="135.9" rx="8" fill="#f7e2f2" stroke="#ce8cbe" stroke-width="1.4"/><text x="333.3" y="588.9" font-size="13" fill="#6e205c" font-weight="700" text-anchor="start"><tspan x="333.3">Valor de las referencias</tspan></text><text x="333.3" y="618.0" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="333.3">Reconocimiento de los casos actuales</tspan><tspan x="333.3" dy="15.2">por prospectos del nuevo segmento</tspan></text><rect x="598.7" y="566.9" width="261.3" height="135.9" rx="8" fill="#f7e2f2" stroke="#ce8cbe" stroke-width="1.4"/><text x="612.7" y="588.9" font-size="13" fill="#6e205c" font-weight="700" text-anchor="start"><tspan x="612.7">Costo de adaptación estimado</tspan></text><text x="612.7" y="618.0" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="612.7">Inversión estimada de producto y</tspan><tspan x="612.7" dy="15.2">operación</tspan></text><line x1="612.7" y1="654.4" x2="846.0" y2="654.4" stroke="#ac3991" stroke-width="2"/><text x="612.7" y="672.4" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="612.7">Margen esperado del segmento en su</tspan><tspan x="612.7" dy="15.2">primer año</tspan></text><text x="40" y="736.74" font-size="11.5" fill="#ac3991" font-weight="700" letter-spacing="1.4">FRONTERA DE APLICACIÓN</text><rect x="40" y="746.7" width="820" height="65.0" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.4"/><polygon points="70,764.24 52,793.24 88,793.24" fill="#c2410c"/><text x="70" y="790.24" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">!</text><text x="106" y="770.7" font-size="12.5" fill="#7c2d12" font-weight="400" text-anchor="start"><tspan x="106">La adyacencia percibida por la empresa rara vez coincide con la percibida por el mercado. La verificación</tspan><tspan x="106" dy="16.5">debe hacerse con prospectos del segmento nuevo.</tspan></text><text x="40" y="839.74" font-size="11.5" fill="#ac3991" font-weight="700" letter-spacing="1.4">ERROR FRECUENTE Y SU CORRECCIÓN</text><rect x="40" y="849.7" width="380.0" height="77.0" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/><text x="54" y="871.7" font-size="11" fill="#b91c1c" font-weight="700" text-anchor="start"><tspan x="54">Síntoma</tspan></text><text x="54" y="889.7" font-size="12.5" fill="#7f1d1d" font-weight="400" text-anchor="start"><tspan x="54">Suponer que las referencias actuales tienen valor</tspan><tspan x="54" dy="16.5">en el nuevo segmento</tspan></text><line x1="426.0" y1="888.2" x2="469.0" y2="888.2" stroke="#ac3991" stroke-width="2.6" stroke-linecap="round"/><polygon points="474.0,888.2 465.9,892.2 465.9,884.3" fill="#ac3991"/><rect x="480.0" y="849.7" width="380.0" height="77.0" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.4"/><text x="494.0" y="871.7" font-size="11" fill="#15803d" font-weight="700" text-anchor="start"><tspan x="494.0">Corrección</tspan></text><text x="494.0" y="889.7" font-size="12.5" fill="#14532d" font-weight="400" text-anchor="start"><tspan x="494.0">Verifica con prospectos del segmento nuevo si</tspan><tspan x="494.0" dy="16.5">reconocen los casos actuales como pertinentes.</tspan></text></svg>