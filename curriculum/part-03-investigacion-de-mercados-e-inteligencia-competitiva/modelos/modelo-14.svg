<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 973" width="900" height="973" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif"><title id="t">Modelo mental · Informe de oportunidad de mercado</title><desc id="d">Modelo mental de la clase 03.14: Informe de oportunidad de mercado. Método en 5 pasos; 4 conceptos; 3 señales de medición.</desc><rect x="0" y="0" width="900" height="973" rx="14" fill="#ffffff"/><rect x="0" y="0" width="900" height="64" rx="14" fill="#206e3b"/><rect x="0" y="40" width="900" height="24" fill="#206e3b"/><text x="40" y="28" font-size="12" fill="#bce5ca" font-weight="700" letter-spacing="1.6">MODELO MENTAL · CLASE 03.14 · PARTE 03</text><text x="40" y="52" font-size="21" fill="#ffffff" font-weight="700">Informe de oportunidad de mercado</text><text x="40" y="84" font-size="11.5" fill="#39ac61" font-weight="700" letter-spacing="1.4">MÉTODO PASO A PASO</text><rect x="40.0" y="100" width="246.7" height="92.0" rx="10" fill="#e2f7e9" stroke="#8ccea3" stroke-width="1.4"/><text x="54.0" y="122" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Abrir con la decisión,</tspan><tspan x="54.0" dy="16.5">recomendación condicionada y</tspan><tspan x="54.0" dy="16.5">fecha de corte</tspan></text><circle cx="42.0" cy="102.0" r="14" fill="#206e3b"/><text x="42.0" y="106.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><rect x="326.7" y="100" width="246.7" height="92.0" rx="10" fill="#e2f7e9" stroke="#8ccea3" stroke-width="1.4"/><text x="340.7" y="122" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="340.7">Resumir mercado, categoría,</tspan><tspan x="340.7" dy="16.5">segmentos, demanda, canales y</tspan><tspan x="340.7" dy="16.5">precios observables con sus</tspan><tspan x="340.7" dy="16.5">fuentes</tspan></text><circle cx="328.7" cy="102.0" r="14" fill="#206e3b"/><text x="328.7" y="106.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><rect x="613.3" y="100" width="246.7" height="92.0" rx="10" fill="#e2f7e9" stroke="#8ccea3" stroke-width="1.4"/><text x="627.3" y="122" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="627.3">Presentar TAM, SAM, SOM y cuota</tspan><tspan x="627.3" dy="16.5">sólo cuando sea defendible,</tspan><tspan x="627.3" dy="16.5">siempre con supuestos y</tspan><tspan x="627.3" dy="16.5">escenarios</tspan></text><circle cx="615.3" cy="102.0" r="14" fill="#206e3b"/><text x="615.3" y="106.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><rect x="613.3" y="230.0" width="246.7" height="92.0" rx="10" fill="#e2f7e9" stroke="#8ccea3" stroke-width="1.4"/><text x="627.3" y="252.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="627.3">Incorporar la matriz de</tspan><tspan x="627.3" dy="16.5">competidores, sustitutos,</tspan><tspan x="627.3" dy="16.5">tendencias y benchmarks con su</tspan><tspan x="627.3" dy="16.5">nivel de evidencia</tspan></text><circle cx="615.3" cy="232.0" r="14" fill="#206e3b"/><text x="615.3" y="236.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">4</text><rect x="326.7" y="230.0" width="246.7" height="92.0" rx="10" fill="#e2f7e9" stroke="#8ccea3" stroke-width="1.4"/><text x="340.7" y="252.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="340.7">Cerrar con incertidumbres,</tspan><tspan x="340.7" dy="16.5">riesgos, señales de revisión,</tspan><tspan x="340.7" dy="16.5">responsables y enlace al anexo</tspan><tspan x="340.7" dy="16.5">auditable</tspan></text><circle cx="328.7" cy="232.0" r="14" fill="#206e3b"/><text x="328.7" y="236.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">5</text><line x1="289.7" y1="146.0" x2="318.7" y2="146.0" stroke="#39ac61" stroke-width="2.2" stroke-linecap="round"/><polygon points="323.7,146.0 315.6,149.9 315.6,142.1" fill="#39ac61"/><line x1="576.3" y1="146.0" x2="605.3" y2="146.0" stroke="#39ac61" stroke-width="2.2" stroke-linecap="round"/><polygon points="610.3,146.0 602.2,149.9 602.2,142.1" fill="#39ac61"/><line x1="736.7" y1="194.0" x2="736.7" y2="222.0" stroke="#39ac61" stroke-width="2.2" stroke-linecap="round"/><polygon points="736.7,227.0 732.8,218.9 740.6,218.9" fill="#39ac61"/><line x1="610.3" y1="276.0" x2="581.3" y2="276.0" stroke="#39ac61" stroke-width="2.2" stroke-linecap="round"/><polygon points="576.3,276.0 584.4,272.1 584.4,279.9" fill="#39ac61"/><text x="40" y="360.0" font-size="11.5" fill="#39ac61" font-weight="700" letter-spacing="1.4">CONCEPTOS Y DÓNDE ACTÚAN EN EL MÉTODO</text><rect x="40.0" y="374.0" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#8ccea3" stroke-width="1.4"/><rect x="40.0" y="382.0" width="5" height="62.2" rx="2" fill="#39ac61"/><text x="56.0" y="396.0" font-size="13.5" fill="#206e3b" font-weight="700" text-anchor="start"><tspan x="56.0">Informe decisional</tspan></text><text x="56.0" y="415.8" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Documento estructurado alrededor de la decisión que debe</tspan><tspan x="56.0" dy="15.2">informar y no del proceso realizado</tspan></text><rect x="379.0" y="382.0" width="54" height="20" rx="10" fill="#bce5ca" stroke="#8ccea3" stroke-width="1"/><text x="406.0" y="396.0" font-size="11" fill="#206e3b" font-weight="700" text-anchor="middle">↔ 1</text><rect x="459.0" y="374.0" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#8ccea3" stroke-width="1.4"/><rect x="459.0" y="382.0" width="5" height="62.2" rx="2" fill="#39ac61"/><text x="475.0" y="396.0" font-size="13.5" fill="#206e3b" font-weight="700" text-anchor="start"><tspan x="475.0">Declaración de método</tspan></text><text x="475.0" y="415.8" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Sección que describe fuentes, muestra, límites y fecha de</tspan><tspan x="475.0" dy="15.2">la evidencia</tspan></text><rect x="40.0" y="466.2" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#8ccea3" stroke-width="1.4"/><rect x="40.0" y="474.2" width="5" height="62.2" rx="2" fill="#39ac61"/><text x="56.0" y="488.2" font-size="13.5" fill="#206e3b" font-weight="700" text-anchor="start"><tspan x="56.0">Recomendación condicionada</tspan></text><text x="56.0" y="508.0" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Propuesta que explicita bajo qué supuestos es válida y qué</tspan><tspan x="56.0" dy="15.2">la invalidaría</tspan></text><rect x="379.0" y="474.2" width="54" height="20" rx="10" fill="#bce5ca" stroke="#8ccea3" stroke-width="1"/><text x="406.0" y="488.2" font-size="11" fill="#206e3b" font-weight="700" text-anchor="middle">↔ 1</text><rect x="459.0" y="466.2" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#8ccea3" stroke-width="1.4"/><rect x="459.0" y="474.2" width="5" height="62.2" rx="2" fill="#39ac61"/><text x="475.0" y="488.2" font-size="13.5" fill="#206e3b" font-weight="700" text-anchor="start"><tspan x="475.0">Auditabilidad</tspan></text><text x="475.0" y="508.0" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Posibilidad de que un tercero verifique cada afirmación</tspan><tspan x="475.0" dy="15.2">hasta su fuente</tspan></text><rect x="798.0" y="474.2" width="54" height="20" rx="10" fill="#bce5ca" stroke="#8ccea3" stroke-width="1"/><text x="825.0" y="488.2" font-size="11" fill="#206e3b" font-weight="700" text-anchor="middle">↔ 5</text><text x="40" y="576.36" font-size="11.5" fill="#39ac61" font-weight="700" letter-spacing="1.4">QUÉ SE MIDE: NUMERADOR SOBRE DENOMINADOR</text><rect x="40.0" y="590.4" width="261.3" height="120.7" rx="8" fill="#e2f7e9" stroke="#8ccea3" stroke-width="1.4"/><text x="54.0" y="612.4" font-size="13" fill="#206e3b" font-weight="700" text-anchor="start"><tspan x="54.0">Afirmaciones trazables</tspan></text><text x="54.0" y="641.5" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Afirmaciones con fuente, fecha y</tspan><tspan x="54.0" dy="15.2">etiqueta epistemológica</tspan></text><line x1="54.0" y1="677.9" x2="287.3" y2="677.9" stroke="#39ac61" stroke-width="2"/><text x="54.0" y="695.9" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="54.0">Afirmaciones totales del informe</tspan></text><rect x="319.3" y="590.4" width="261.3" height="120.7" rx="8" fill="#e2f7e9" stroke="#8ccea3" stroke-width="1.4"/><text x="333.3" y="612.4" font-size="13" fill="#206e3b" font-weight="700" text-anchor="start"><tspan x="333.3">Tiempo de lectura hasta la</tspan><tspan x="333.3" dy="17.2">recomendación</tspan></text><text x="333.3" y="658.7" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="333.3">Minutos que tarda un lector en</tspan><tspan x="333.3" dy="15.2">encontrar la recomendación y sus</tspan><tspan x="333.3" dy="15.2">condiciones</tspan></text><rect x="598.7" y="590.4" width="261.3" height="120.7" rx="8" fill="#e2f7e9" stroke="#8ccea3" stroke-width="1.4"/><text x="612.7" y="612.4" font-size="13" fill="#206e3b" font-weight="700" text-anchor="start"><tspan x="612.7">Decisiones tomadas con el</tspan><tspan x="612.7" dy="17.2">informe</tspan></text><text x="612.7" y="658.7" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="612.7">Decisiones formalizadas que citan el</tspan><tspan x="612.7" dy="15.2">informe, en los 60 días posteriores</tspan></text><text x="40" y="745.06" font-size="11.5" fill="#39ac61" font-weight="700" letter-spacing="1.4">FRONTERA DE APLICACIÓN</text><rect x="40" y="755.1" width="820" height="65.0" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.4"/><polygon points="70,772.56 52,801.56 88,801.56" fill="#c2410c"/><text x="70" y="798.56" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">!</text><text x="106" y="779.1" font-size="12.5" fill="#7c2d12" font-weight="400" text-anchor="start"><tspan x="106">Un informe no reemplaza la decisión ni la responsabilidad de quien decide. Su función es hacer explícito</tspan><tspan x="106" dy="16.5">el razonamiento, no eliminar la incertidumbre.</tspan></text><text x="40" y="848.06" font-size="11.5" fill="#39ac61" font-weight="700" letter-spacing="1.4">ERROR FRECUENTE Y SU CORRECCIÓN</text><rect x="40" y="858.1" width="380.0" height="77.0" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/><text x="54" y="880.1" font-size="11" fill="#b91c1c" font-weight="700" text-anchor="start"><tspan x="54">Síntoma</tspan></text><text x="54" y="898.1" font-size="12.5" fill="#7f1d1d" font-weight="400" text-anchor="start"><tspan x="54">Estructurar el informe por proceso y no por</tspan><tspan x="54" dy="16.5">decisión</tspan></text><line x1="426.0" y1="896.6" x2="469.0" y2="896.6" stroke="#39ac61" stroke-width="2.6" stroke-linecap="round"/><polygon points="474.0,896.6 465.9,900.5 465.9,892.6" fill="#39ac61"/><rect x="480.0" y="858.1" width="380.0" height="77.0" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.4"/><text x="494.0" y="880.1" font-size="11" fill="#15803d" font-weight="700" text-anchor="start"><tspan x="494.0">Corrección</tspan></text><text x="494.0" y="898.1" font-size="12.5" fill="#14532d" font-weight="400" text-anchor="start"><tspan x="494.0">Abre con la recomendación y sus condiciones; el</tspan><tspan x="494.0" dy="16.5">método va después, no antes.</tspan></text></svg>