<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1493" width="900" height="1493" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif"><title id="t">Modelo mental · Backlog de experimentos</title><desc id="d">Modelo mental de la clase 19.09: Backlog de experimentos. Método en 5 pasos; 8 conceptos; 4 señales de medición.</desc><rect x="0" y="0" width="900" height="1493" rx="14" fill="#ffffff"/><rect x="0" y="0" width="900" height="64" rx="14" fill="#206e65"/><rect x="0" y="40" width="900" height="24" fill="#206e65"/><text x="40" y="28" font-size="12" fill="#bce5e0" font-weight="700" letter-spacing="1.6">MODELO MENTAL · CLASE 19.09 · PARTE 19</text><text x="40" y="52" font-size="21" fill="#ffffff" font-weight="700">Backlog de experimentos</text><text x="40" y="84" font-size="11.5" fill="#39ac9e" font-weight="700" letter-spacing="1.4">MÉTODO PASO A PASO</text><path d="M66.0,159.0 V202.5 H158.5" fill="none" stroke="#39ac9e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="160.5,202.5 151.5,197.5 151.5,207.5" fill="#39ac9e"/><path d="M188.5,232.0 V275.5 H281.0" fill="none" stroke="#39ac9e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="283.0,275.5 274.0,270.5 274.0,280.5" fill="#39ac9e"/><path d="M311.0,305.0 V348.5 H403.5" fill="none" stroke="#39ac9e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="405.5,348.5 396.5,343.5 396.5,353.5" fill="#39ac9e"/><path d="M433.5,378.0 V421.5 H526.0" fill="none" stroke="#39ac9e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="528.0,421.5 519.0,416.5 519.0,426.5" fill="#39ac9e"/><rect x="40.0" y="100.0" width="330" height="59.0" rx="10" fill="#e2f7f5" stroke="#8ccec6" stroke-width="1.4"/><text x="54.0" y="122.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Formular cada idea como hipótesis con</tspan><tspan x="54.0" dy="16.5">fundamento</tspan></text><circle cx="42.0" cy="102.0" r="14" fill="#206e65"/><text x="42.0" y="106.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><rect x="162.5" y="173.0" width="330" height="59.0" rx="10" fill="#e2f7f5" stroke="#8ccec6" stroke-width="1.4"/><text x="176.5" y="195.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="176.5">Estimar esfuerzo y aprendizaje esperado</tspan></text><circle cx="164.5" cy="175.0" r="14" fill="#206e65"/><text x="164.5" y="179.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><rect x="285.0" y="246.0" width="330" height="59.0" rx="10" fill="#e2f7f5" stroke="#8ccec6" stroke-width="1.4"/><text x="299.0" y="268.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="299.0">Priorizar con un criterio explícito</tspan></text><circle cx="287.0" cy="248.0" r="14" fill="#206e65"/><text x="287.0" y="252.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><rect x="407.5" y="319.0" width="330" height="59.0" rx="10" fill="#e2f7f5" stroke="#8ccec6" stroke-width="1.4"/><text x="421.5" y="341.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="421.5">Ejecutar en orden y documentar el resultado</tspan></text><circle cx="409.5" cy="321.0" r="14" fill="#206e65"/><text x="409.5" y="325.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">4</text><rect x="530.0" y="392.0" width="330" height="59.0" rx="10" fill="#e2f7f5" stroke="#8ccec6" stroke-width="1.4"/><text x="544.0" y="414.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="544.0">Revisar el backlog con los aprendizajes</tspan><tspan x="544.0" dy="16.5">acumulados</tspan></text><circle cx="532.0" cy="394.0" r="14" fill="#206e65"/><text x="532.0" y="398.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">5</text><text x="40" y="493.0" font-size="11.5" fill="#39ac9e" font-weight="700" letter-spacing="1.4">CONCEPTOS Y DÓNDE ACTÚAN EN EL MÉTODO</text><rect x="40.0" y="507.0" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#8ccec6" stroke-width="1.4"/><rect x="40.0" y="515.0" width="5" height="62.2" rx="2" fill="#39ac9e"/><text x="56.0" y="529.0" font-size="13.5" fill="#206e65" font-weight="700" text-anchor="start"><tspan x="56.0">Entrada del backlog</tspan></text><text x="56.0" y="548.8" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Experimento formulado con hipótesis, métrica y criterio de</tspan><tspan x="56.0" dy="15.2">decisión</tspan></text><rect x="379.0" y="515.0" width="54" height="20" rx="10" fill="#bce5e0" stroke="#8ccec6" stroke-width="1"/><text x="406.0" y="529.0" font-size="11" fill="#206e65" font-weight="700" text-anchor="middle">↔ 1, 5</text><rect x="459.0" y="507.0" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#8ccec6" stroke-width="1.4"/><rect x="459.0" y="515.0" width="5" height="62.2" rx="2" fill="#39ac9e"/><text x="475.0" y="529.0" font-size="13.5" fill="#206e65" font-weight="700" text-anchor="start"><tspan x="475.0">Fundamento de la hipótesis</tspan></text><text x="475.0" y="548.8" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Evidencia o razonamiento que sostiene la expectativa</tspan></text><rect x="798.0" y="515.0" width="54" height="20" rx="10" fill="#bce5e0" stroke="#8ccec6" stroke-width="1"/><text x="825.0" y="529.0" font-size="11" fill="#206e65" font-weight="700" text-anchor="middle">↔ 1</text><rect x="40.0" y="599.2" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#8ccec6" stroke-width="1.4"/><rect x="40.0" y="607.2" width="5" height="62.2" rx="2" fill="#39ac9e"/><text x="56.0" y="621.2" font-size="13.5" fill="#206e65" font-weight="700" text-anchor="start"><tspan x="56.0">Esfuerzo estimado</tspan></text><text x="56.0" y="641.0" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Recursos necesarios para ejecutar el experimento</tspan></text><rect x="379.0" y="607.2" width="54" height="20" rx="10" fill="#bce5e0" stroke="#8ccec6" stroke-width="1"/><text x="406.0" y="621.2" font-size="11" fill="#206e65" font-weight="700" text-anchor="middle">↔ 2</text><rect x="459.0" y="599.2" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#8ccec6" stroke-width="1.4"/><rect x="459.0" y="607.2" width="5" height="62.2" rx="2" fill="#39ac9e"/><text x="475.0" y="621.2" font-size="13.5" fill="#206e65" font-weight="700" text-anchor="start"><tspan x="475.0">Aprendizaje esperado</tspan></text><text x="475.0" y="641.0" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Valor de la información que producirá el resultado, gane o</tspan><tspan x="475.0" dy="15.2">pierda</tspan></text><rect x="798.0" y="607.2" width="54" height="20" rx="10" fill="#bce5e0" stroke="#8ccec6" stroke-width="1"/><text x="825.0" y="621.2" font-size="11" fill="#206e65" font-weight="700" text-anchor="middle">↔ 2, 5</text><rect x="40.0" y="691.4" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#8ccec6" stroke-width="1.4"/><rect x="40.0" y="699.4" width="5" height="62.2" rx="2" fill="#39ac9e"/><text x="56.0" y="713.4" font-size="13.5" fill="#206e65" font-weight="700" text-anchor="start"><tspan x="56.0">Marco ágil</tspan></text><text x="56.0" y="733.2" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Conjunto de roles, eventos y reglas que orienta la gestión</tspan><tspan x="56.0" dy="15.2">del trabajo bajo incertidumbre</tspan></text><rect x="459.0" y="691.4" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#8ccec6" stroke-width="1.4"/><rect x="459.0" y="699.4" width="5" height="62.2" rx="2" fill="#39ac9e"/><text x="475.0" y="713.4" font-size="13.5" fill="#206e65" font-weight="700" text-anchor="start"><tspan x="475.0">Práctica ágil</tspan></text><text x="475.0" y="733.2" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Técnica puntual como retrospectiva, visualización, WIP o</tspan><tspan x="475.0" dy="15.2">slicing que puede usarse dentro de distintos marcos</tspan></text><rect x="40.0" y="783.5" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#8ccec6" stroke-width="1.4"/><rect x="40.0" y="791.5" width="5" height="62.2" rx="2" fill="#39ac9e"/><text x="56.0" y="805.5" font-size="13.5" fill="#206e65" font-weight="700" text-anchor="start"><tspan x="56.0">Métrica de flujo</tspan></text><text x="56.0" y="825.4" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Medida de tiempo de ciclo, throughput, trabajo en progreso</tspan><tspan x="56.0" dy="15.2">o antigüedad que describe el sistema de entrega</tspan></text><rect x="459.0" y="783.5" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#8ccec6" stroke-width="1.4"/><rect x="459.0" y="791.5" width="5" height="62.2" rx="2" fill="#39ac9e"/><text x="475.0" y="805.5" font-size="13.5" fill="#206e65" font-weight="700" text-anchor="start"><tspan x="475.0">Hipótesis de negocio</tspan></text><text x="475.0" y="825.4" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Predicción refutable que conecta intervención, población,</tspan><tspan x="475.0" dy="15.2">resultado y criterio temporal</tspan></text><rect x="798.0" y="791.5" width="54" height="20" rx="10" fill="#bce5e0" stroke="#8ccec6" stroke-width="1"/><text x="825.0" y="805.5" font-size="11" fill="#206e65" font-weight="700" text-anchor="middle">↔ 1</text><text x="40" y="893.7200000000003" font-size="11.5" fill="#39ac9e" font-weight="700" letter-spacing="1.4">QUÉ SE MIDE: NUMERADOR SOBRE DENOMINADOR</text><rect x="40.0" y="907.7" width="261.3" height="120.7" rx="8" fill="#e2f7f5" stroke="#8ccec6" stroke-width="1.4"/><text x="54.0" y="929.7" font-size="13" fill="#206e65" font-weight="700" text-anchor="start"><tspan x="54.0">Entradas con hipótesis completa</tspan></text><text x="54.0" y="958.9" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Entradas con hipótesis, métrica y</tspan><tspan x="54.0" dy="15.2">criterio</tspan></text><line x1="54.0" y1="995.2" x2="287.3" y2="995.2" stroke="#39ac9e" stroke-width="2"/><text x="54.0" y="1013.2" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="54.0">Entradas del backlog</tspan></text><rect x="319.3" y="907.7" width="261.3" height="120.7" rx="8" fill="#e2f7f5" stroke="#8ccec6" stroke-width="1.4"/><text x="333.3" y="929.7" font-size="13" fill="#206e65" font-weight="700" text-anchor="start"><tspan x="333.3">Tasa de ejecución</tspan></text><text x="333.3" y="958.9" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="333.3">Experimentos ejecutados</tspan></text><line x1="333.3" y1="980.1" x2="566.7" y2="980.1" stroke="#39ac9e" stroke-width="2"/><text x="333.3" y="998.1" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="333.3">Experimentos priorizados en el</tspan><tspan x="333.3" dy="15.2">periodo</tspan></text><rect x="598.7" y="907.7" width="261.3" height="120.7" rx="8" fill="#e2f7f5" stroke="#8ccec6" stroke-width="1.4"/><text x="612.7" y="929.7" font-size="13" fill="#206e65" font-weight="700" text-anchor="start"><tspan x="612.7">Aprendizajes por experimento</tspan></text><text x="612.7" y="958.9" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="612.7">Conclusiones documentadas</tspan></text><line x1="612.7" y1="980.1" x2="846.0" y2="980.1" stroke="#39ac9e" stroke-width="2"/><text x="612.7" y="998.1" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="612.7">Experimentos ejecutados</tspan></text><rect x="40.0" y="1042.4" width="261.3" height="188.8" rx="8" fill="#e2f7f5" stroke="#8ccec6" stroke-width="1.4"/><text x="54.0" y="1064.4" font-size="13" fill="#206e65" font-weight="700" text-anchor="start"><tspan x="54.0">Tiempo de ciclo comercial</tspan><tspan x="54.0" dy="17.2">priorizado</tspan></text><text x="54.0" y="1110.7" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Días acumulados desde entrada lista</tspan><tspan x="54.0" dy="15.2">hasta evidencia de decisión</tspan></text><line x1="54.0" y1="1147.1" x2="287.3" y2="1147.1" stroke="#39ac9e" stroke-width="2"/><text x="54.0" y="1165.1" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="54.0">Unidades terminadas del tipo</tspan><tspan x="54.0" dy="15.2">definido</tspan></text><text x="54.0" y="1209.5" font-size="10.5" fill="#7b8794" font-weight="400" text-anchor="start"><tspan x="54.0">Ventana: mediana semanal y percentil 85</tspan><tspan x="54.0" dy="13.9">mensual</tspan></text><text x="40" y="1265.1800000000003" font-size="11.5" fill="#39ac9e" font-weight="700" letter-spacing="1.4">FRONTERA DE APLICACIÓN</text><rect x="40" y="1275.2" width="820" height="65.0" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.4"/><polygon points="70,1292.6800000000003 52,1321.6800000000003 88,1321.6800000000003" fill="#c2410c"/><text x="70" y="1318.6800000000003" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">!</text><text x="106" y="1299.2" font-size="12.5" fill="#7c2d12" font-weight="400" text-anchor="start"><tspan x="106">Un backlog muy formalizado puede frenar pruebas baratas y rápidas. El nivel de formalidad debe ser</tspan><tspan x="106" dy="16.5">proporcional al costo del experimento.</tspan></text><text x="40" y="1368.1800000000003" font-size="11.5" fill="#39ac9e" font-weight="700" letter-spacing="1.4">ERROR FRECUENTE Y SU CORRECCIÓN</text><rect x="40" y="1378.2" width="380.0" height="77.0" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/><text x="54" y="1400.2" font-size="11" fill="#b91c1c" font-weight="700" text-anchor="start"><tspan x="54">Síntoma</tspan></text><text x="54" y="1418.2" font-size="12.5" fill="#7f1d1d" font-weight="400" text-anchor="start"><tspan x="54">Mantener ideas sin hipótesis en el backlog</tspan></text><line x1="426.0" y1="1416.7" x2="469.0" y2="1416.7" stroke="#39ac9e" stroke-width="2.6" stroke-linecap="round"/><polygon points="474.0,1416.7 465.9,1420.6 465.9,1412.8" fill="#39ac9e"/><rect x="480.0" y="1378.2" width="380.0" height="77.0" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.4"/><text x="494.0" y="1400.2" font-size="11" fill="#15803d" font-weight="700" text-anchor="start"><tspan x="494.0">Corrección</tspan></text><text x="494.0" y="1418.2" font-size="12.5" fill="#14532d" font-weight="400" text-anchor="start"><tspan x="494.0">Exige hipótesis, métrica y criterio de refutación</tspan><tspan x="494.0" dy="16.5">para cada entrada priorizada.</tspan></text></svg>