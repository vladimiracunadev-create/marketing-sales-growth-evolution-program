<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1100" width="900" height="1100" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif"><title id="t">Modelo mental · Entrada a un mercado</title><desc id="d">Modelo mental de la clase 22.02: Entrada a un mercado. Método en 5 pasos; 4 conceptos; 3 señales de medición.</desc><rect x="0" y="0" width="900" height="1100" rx="14" fill="#ffffff"/><rect x="0" y="0" width="900" height="64" rx="14" fill="#6e205c"/><rect x="0" y="40" width="900" height="24" fill="#6e205c"/><text x="40" y="28" font-size="12" fill="#e5bcdc" font-weight="700" letter-spacing="1.6">MODELO MENTAL · CLASE 22.02 · PARTE 22</text><text x="40" y="52" font-size="21" fill="#ffffff" font-weight="700">Entrada a un mercado</text><text x="40" y="84" font-size="11.5" fill="#ac3991" font-weight="700" letter-spacing="1.4">MÉTODO PASO A PASO</text><path d="M66.0,159.0 V202.5 H158.5" fill="none" stroke="#ac3991" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="160.5,202.5 151.5,197.5 151.5,207.5" fill="#ac3991"/><path d="M188.5,232.0 V275.5 H281.0" fill="none" stroke="#ac3991" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="283.0,275.5 274.0,270.5 274.0,280.5" fill="#ac3991"/><path d="M311.0,305.0 V348.5 H403.5" fill="none" stroke="#ac3991" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="405.5,348.5 396.5,343.5 396.5,353.5" fill="#ac3991"/><path d="M433.5,378.0 V421.5 H526.0" fill="none" stroke="#ac3991" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="528.0,421.5 519.0,416.5 519.0,426.5" fill="#ac3991"/><rect x="40.0" y="100.0" width="330" height="59.0" rx="10" fill="#f7e2f2" stroke="#ce8cbe" stroke-width="1.4"/><text x="54.0" y="122.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Verificar la demanda con evidencia primaria</tspan></text><circle cx="42.0" cy="102.0" r="14" fill="#6e205c"/><text x="42.0" y="106.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><rect x="162.5" y="173.0" width="330" height="59.0" rx="10" fill="#f7e2f2" stroke="#ce8cbe" stroke-width="1.4"/><text x="176.5" y="195.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="176.5">Evaluar la capacidad actual de servir ese</tspan><tspan x="176.5" dy="16.5">mercado</tspan></text><circle cx="164.5" cy="175.0" r="14" fill="#6e205c"/><text x="164.5" y="179.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><rect x="285.0" y="246.0" width="330" height="59.0" rx="10" fill="#f7e2f2" stroke="#ce8cbe" stroke-width="1.4"/><text x="299.0" y="268.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="299.0">Identificar y costear el camino de acceso</tspan></text><circle cx="287.0" cy="248.0" r="14" fill="#6e205c"/><text x="287.0" y="252.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><rect x="407.5" y="319.0" width="330" height="59.0" rx="10" fill="#f7e2f2" stroke="#ce8cbe" stroke-width="1.4"/><text x="421.5" y="341.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="421.5">Estimar el costo de entrada y el tiempo</tspan><tspan x="421.5" dy="16.5">hasta el ingreso</tspan></text><circle cx="409.5" cy="321.0" r="14" fill="#6e205c"/><text x="409.5" y="325.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">4</text><rect x="530.0" y="392.0" width="330" height="59.0" rx="10" fill="#f7e2f2" stroke="#ce8cbe" stroke-width="1.4"/><text x="544.0" y="414.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="544.0">Definir el criterio de abandono antes de</tspan><tspan x="544.0" dy="16.5">invertir</tspan></text><circle cx="532.0" cy="394.0" r="14" fill="#6e205c"/><text x="532.0" y="398.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">5</text><text x="40" y="493.0" font-size="11.5" fill="#ac3991" font-weight="700" letter-spacing="1.4">CONCEPTOS Y DÓNDE ACTÚAN EN EL MÉTODO</text><rect x="40.0" y="507.0" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#ce8cbe" stroke-width="1.4"/><rect x="40.0" y="515.0" width="5" height="62.2" rx="2" fill="#ac3991"/><text x="56.0" y="529.0" font-size="13.5" fill="#6e205c" font-weight="700" text-anchor="start"><tspan x="56.0">Demanda verificable</tspan></text><text x="56.0" y="548.8" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Evidencia de que existen clientes dispuestos a pagar en</tspan><tspan x="56.0" dy="15.2">ese mercado</tspan></text><rect x="379.0" y="515.0" width="54" height="20" rx="10" fill="#e5bcdc" stroke="#ce8cbe" stroke-width="1"/><text x="406.0" y="529.0" font-size="11" fill="#6e205c" font-weight="700" text-anchor="middle">↔ 1</text><rect x="459.0" y="507.0" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#ce8cbe" stroke-width="1.4"/><rect x="459.0" y="515.0" width="5" height="62.2" rx="2" fill="#ac3991"/><text x="475.0" y="529.0" font-size="13.5" fill="#6e205c" font-weight="700" text-anchor="start"><tspan x="475.0">Capacidad de servir</tspan></text><text x="475.0" y="548.8" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Aptitud actual para entregar el resultado en ese contexto</tspan></text><rect x="798.0" y="515.0" width="54" height="20" rx="10" fill="#e5bcdc" stroke="#ce8cbe" stroke-width="1"/><text x="825.0" y="529.0" font-size="11" fill="#6e205c" font-weight="700" text-anchor="middle">↔ 2</text><rect x="40.0" y="599.2" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#ce8cbe" stroke-width="1.4"/><rect x="40.0" y="607.2" width="5" height="62.2" rx="2" fill="#ac3991"/><text x="56.0" y="621.2" font-size="13.5" fill="#6e205c" font-weight="700" text-anchor="start"><tspan x="56.0">Camino de acceso</tspan></text><text x="56.0" y="641.0" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Canal viable para alcanzar a esos clientes con costo</tspan><tspan x="56.0" dy="15.2">compatible</tspan></text><rect x="379.0" y="607.2" width="54" height="20" rx="10" fill="#e5bcdc" stroke="#ce8cbe" stroke-width="1"/><text x="406.0" y="621.2" font-size="11" fill="#6e205c" font-weight="700" text-anchor="middle">↔ 3</text><rect x="459.0" y="599.2" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#ce8cbe" stroke-width="1.4"/><rect x="459.0" y="607.2" width="5" height="62.2" rx="2" fill="#ac3991"/><text x="475.0" y="621.2" font-size="13.5" fill="#6e205c" font-weight="700" text-anchor="start"><tspan x="475.0">Costo de entrada</tspan></text><text x="475.0" y="641.0" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Inversión necesaria antes de obtener el primer ingreso</tspan><tspan x="475.0" dy="15.2">relevante</tspan></text><rect x="798.0" y="607.2" width="54" height="20" rx="10" fill="#e5bcdc" stroke="#ce8cbe" stroke-width="1"/><text x="825.0" y="621.2" font-size="11" fill="#6e205c" font-weight="700" text-anchor="middle">↔ 4, 5</text><text x="40" y="709.3600000000001" font-size="11.5" fill="#ac3991" font-weight="700" letter-spacing="1.4">QUÉ SE MIDE: NUMERADOR SOBRE DENOMINADOR</text><rect x="40.0" y="723.4" width="261.3" height="98.7" rx="8" fill="#f7e2f2" stroke="#ce8cbe" stroke-width="1.4"/><text x="54.0" y="745.4" font-size="13" fill="#6e205c" font-weight="700" text-anchor="start"><tspan x="54.0">Evidencia de demanda</tspan></text><text x="54.0" y="774.5" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Señales verificables de disposición</tspan><tspan x="54.0" dy="15.2">a pagar recogidas en el mercado</tspan><tspan x="54.0" dy="15.2">objetivo</tspan></text><rect x="319.3" y="723.4" width="261.3" height="98.7" rx="8" fill="#f7e2f2" stroke="#ce8cbe" stroke-width="1.4"/><text x="333.3" y="745.4" font-size="13" fill="#6e205c" font-weight="700" text-anchor="start"><tspan x="333.3">Costo estimado de acceso</tspan></text><text x="333.3" y="774.5" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="333.3">Gasto necesario para generar una</tspan><tspan x="333.3" dy="15.2">oportunidad calificada en ese</tspan><tspan x="333.3" dy="15.2">mercado</tspan></text><rect x="598.7" y="723.4" width="261.3" height="98.7" rx="8" fill="#f7e2f2" stroke="#ce8cbe" stroke-width="1.4"/><text x="612.7" y="745.4" font-size="13" fill="#6e205c" font-weight="700" text-anchor="start"><tspan x="612.7">Tiempo hasta el primer ingreso</tspan></text><text x="612.7" y="774.5" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="612.7">Meses estimados entre el inicio de</tspan><tspan x="612.7" dy="15.2">la inversión y el primer ingreso</tspan><tspan x="612.7" dy="15.2">relevante</tspan></text><text x="40" y="856.0600000000002" font-size="11.5" fill="#ac3991" font-weight="700" letter-spacing="1.4">FRONTERA DE APLICACIÓN</text><rect x="40" y="866.1" width="820" height="65.0" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.4"/><polygon points="70,883.5600000000002 52,912.5600000000002 88,912.5600000000002" fill="#c2410c"/><text x="70" y="909.5600000000002" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">!</text><text x="106" y="890.1" font-size="12.5" fill="#7c2d12" font-weight="400" text-anchor="start"><tspan x="106">La evidencia de demanda en un mercado no se traslada a otro: cambian competidores, normas, hábitos de pago</tspan><tspan x="106" dy="16.5">y expectativas de servicio.</tspan></text><text x="40" y="959.0600000000002" font-size="11.5" fill="#ac3991" font-weight="700" letter-spacing="1.4">ERROR FRECUENTE Y SU CORRECCIÓN</text><rect x="40" y="969.1" width="380.0" height="93.5" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/><text x="54" y="991.1" font-size="11" fill="#b91c1c" font-weight="700" text-anchor="start"><tspan x="54">Síntoma</tspan></text><text x="54" y="1009.1" font-size="12.5" fill="#7f1d1d" font-weight="400" text-anchor="start"><tspan x="54">Verificar demanda sin costear el acceso</tspan></text><line x1="426.0" y1="1015.8" x2="469.0" y2="1015.8" stroke="#ac3991" stroke-width="2.6" stroke-linecap="round"/><polygon points="474.0,1015.8 465.9,1019.7 465.9,1011.9" fill="#ac3991"/><rect x="480.0" y="969.1" width="380.0" height="93.5" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.4"/><text x="494.0" y="991.1" font-size="11" fill="#15803d" font-weight="700" text-anchor="start"><tspan x="494.0">Corrección</tspan></text><text x="494.0" y="1009.1" font-size="12.5" fill="#14532d" font-weight="400" text-anchor="start"><tspan x="494.0">Estima el costo de generar una oportunidad</tspan><tspan x="494.0" dy="16.5">calificada en ese mercado antes de comprometer</tspan><tspan x="494.0" dy="16.5">inversión.</tspan></text></svg>