name: Publicar portal del programa

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construir:
    name: Construir y validar el portal
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generar el portal
        run: python tools/build_site.py --limpiar

      - name: Validar el artefacto antes de publicar
        run: python tools/validate_site.py

      - name: Resumen de la construcción
        run: |
          paginas=$(find site -name '*.html' | wc -l)
          peso=$(du -sh site | cut -f1)
          entradas=$(python -c "import json;print(len(json.load(open('site/search-index.json',encoding='utf-8'))))")
          {
            echo "### Portal construido"
            echo ""
            echo "| Métrica | Valor |"
            echo "|---|---:|"
            echo "| Páginas HTML | $paginas |"
            echo "| Entradas en el buscador | $entradas |"
            echo "| Peso total | $peso |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  publicar:
    name: Publicar en GitHub Pages
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - name: Desplegar
        id: despliegue
        uses: actions/deploy-pages@v4

  verificar:
    name: Comprobar el sitio ya publicado
    needs: publicar
    runs-on: ubuntu-latest
    steps:
      - name: Verificar páginas clave en producción
        run: |
          set -e
          base="https://vladimiracunadev-create.github.io/marketing-sales-growth-evolution-program"
          rutas=(
            "/"
            "/curriculum/index.html"
            "/rutas/index.html"
            "/rutas/ejecutivo-comercial.html"
            "/curriculum/part-07-pricing-y-monetizacion/class-04-value-based-pricing.html"
            "/apps/learning-dashboard/index.html"
            "/search-index.json"
            "/assets/estilo.css"
          )
          fallos=0
          for r in "${rutas[@]}"; do
            for intento in 1 2 3 4 5; do
              codigo=$(curl -s -o /dev/null -w "%{http_code}" --max-time 25 "$base$r" || echo 000)
              if [ "$codigo" = "200" ]; then break; fi
              sleep 12
            done
            if [ "$codigo" = "200" ]; then
              echo "OK   $codigo  $r"
            else
              echo "::error::$codigo en $r"
              fallos=$((fallos+1))
            fi
          done
          if [ "$fallos" -gt 0 ]; then exit 1; fi
          echo "El sitio publicado responde correctamente en todas las rutas clave."
