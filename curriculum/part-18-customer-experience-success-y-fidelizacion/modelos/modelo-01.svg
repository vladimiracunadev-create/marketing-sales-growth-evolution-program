<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 966" width="900" height="966" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif"><title id="t">Modelo mental · Experiencia de cliente</title><desc id="d">Modelo mental de la clase 18.01: Experiencia de cliente. Método en 5 pasos; 4 conceptos; 3 señales de medición.</desc><rect x="0" y="0" width="900" height="966" rx="14" fill="#ffffff"/><rect x="0" y="0" width="900" height="64" rx="14" fill="#206e27"/><rect x="0" y="40" width="900" height="24" fill="#206e27"/><text x="40" y="28" font-size="12" fill="#bce5c0" font-weight="700" letter-spacing="1.6">MODELO MENTAL · CLASE 18.01 · PARTE 18</text><text x="40" y="52" font-size="21" fill="#ffffff" font-weight="700">Experiencia de cliente</text><text x="40" y="84" font-size="11.5" fill="#39ac44" font-weight="700" letter-spacing="1.4">MÉTODO PASO A PASO</text><line x1="450.0" y1="94.0" x2="450.0" y2="317.0" stroke="#8cce93" stroke-width="3" stroke-linecap="round"/><line x1="450.0" y1="129.5" x2="406.0" y2="129.5" stroke="#8cce93" stroke-width="2"/><rect x="56.0" y="100" width="350" height="59.0" rx="10" fill="#e2f7e4" stroke="#8cce93" stroke-width="1.4"/><text x="70.0" y="122" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="70.0">Inventariar todos los puntos de contacto,</tspan><tspan x="70.0" dy="16.5">incluidos los administrativos</tspan></text><circle cx="450.0" cy="129.5" r="15" fill="#206e27"/><text x="450.0" y="134.0" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><line x1="450.0" y1="159.2" x2="494.0" y2="159.2" stroke="#8cce93" stroke-width="2"/><rect x="494.0" y="138" width="350" height="42.5" rx="10" fill="#e2f7e4" stroke="#8cce93" stroke-width="1.4"/><text x="508.0" y="160" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="508.0">Medir el esfuerzo percibido en los críticos</tspan></text><circle cx="450.0" cy="159.2" r="15" fill="#206e27"/><text x="450.0" y="163.8" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><line x1="450.0" y1="205.5" x2="406.0" y2="205.5" stroke="#8cce93" stroke-width="2"/><rect x="56.0" y="176" width="350" height="59.0" rx="10" fill="#e2f7e4" stroke="#8cce93" stroke-width="1.4"/><text x="70.0" y="198" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="70.0">Priorizar la eliminación de fricción sobre la</tspan><tspan x="70.0" dy="16.5">sorpresa</tspan></text><circle cx="450.0" cy="205.5" r="15" fill="#206e27"/><text x="450.0" y="210.0" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><line x1="450.0" y1="243.5" x2="494.0" y2="243.5" stroke="#8cce93" stroke-width="2"/><rect x="494.0" y="214" width="350" height="59.0" rx="10" fill="#e2f7e4" stroke="#8cce93" stroke-width="1.4"/><text x="508.0" y="236" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="508.0">Corregir primero lo que produce contacto no</tspan><tspan x="508.0" dy="16.5">deseado</tspan></text><circle cx="450.0" cy="243.5" r="15" fill="#206e27"/><text x="450.0" y="248.0" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">4</text><line x1="450.0" y1="281.5" x2="406.0" y2="281.5" stroke="#8cce93" stroke-width="2"/><rect x="56.0" y="252" width="350" height="59.0" rx="10" fill="#e2f7e4" stroke="#8cce93" stroke-width="1.4"/><text x="70.0" y="274" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="70.0">Medir el efecto en retención y en volumen de</tspan><tspan x="70.0" dy="16.5">soporte</tspan></text><circle cx="450.0" cy="281.5" r="15" fill="#206e27"/><text x="450.0" y="286.0" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">5</text><text x="40" y="353.0" font-size="11.5" fill="#39ac44" font-weight="700" letter-spacing="1.4">CONCEPTOS Y DÓNDE ACTÚAN EN EL MÉTODO</text><rect x="40.0" y="367.0" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#8cce93" stroke-width="1.4"/><rect x="40.0" y="375.0" width="5" height="62.2" rx="2" fill="#39ac44"/><text x="56.0" y="389.0" font-size="13.5" fill="#206e27" font-weight="700" text-anchor="start"><tspan x="56.0">Experiencia acumulada</tspan></text><text x="56.0" y="408.8" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Percepción formada por el conjunto de interacciones a lo</tspan><tspan x="56.0" dy="15.2">largo de la relación</tspan></text><rect x="459.0" y="367.0" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#8cce93" stroke-width="1.4"/><rect x="459.0" y="375.0" width="5" height="62.2" rx="2" fill="#39ac44"/><text x="475.0" y="389.0" font-size="13.5" fill="#206e27" font-weight="700" text-anchor="start"><tspan x="475.0">Esfuerzo del cliente</tspan></text><text x="475.0" y="408.8" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Cantidad de pasos, tiempo y energía que exige resolver</tspan><tspan x="475.0" dy="15.2">algo</tspan></text><rect x="798.0" y="375.0" width="54" height="20" rx="10" fill="#bce5c0" stroke="#8cce93" stroke-width="1"/><text x="825.0" y="389.0" font-size="11" fill="#206e27" font-weight="700" text-anchor="middle">↔ 2</text><rect x="40.0" y="459.2" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#8cce93" stroke-width="1.4"/><rect x="40.0" y="467.2" width="5" height="62.2" rx="2" fill="#39ac44"/><text x="56.0" y="481.2" font-size="13.5" fill="#206e27" font-weight="700" text-anchor="start"><tspan x="56.0">Interacción no diseñada</tspan></text><text x="56.0" y="501.0" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Punto de contacto que existe sin haber sido considerado</tspan><tspan x="56.0" dy="15.2">por la empresa</tspan></text><rect x="379.0" y="467.2" width="54" height="20" rx="10" fill="#bce5c0" stroke="#8cce93" stroke-width="1"/><text x="406.0" y="481.2" font-size="11" fill="#206e27" font-weight="700" text-anchor="middle">↔ 1</text><rect x="459.0" y="459.2" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#8cce93" stroke-width="1.4"/><rect x="459.0" y="467.2" width="5" height="62.2" rx="2" fill="#39ac44"/><text x="475.0" y="481.2" font-size="13.5" fill="#206e27" font-weight="700" text-anchor="start"><tspan x="475.0">Deleite frente a reducción de esfuerzo</tspan></text><text x="475.0" y="501.0" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Comparación entre superar expectativas y eliminar fricción</tspan></text><rect x="798.0" y="467.2" width="54" height="20" rx="10" fill="#bce5c0" stroke="#8cce93" stroke-width="1"/><text x="825.0" y="481.2" font-size="11" fill="#206e27" font-weight="700" text-anchor="middle">↔ 2, 3</text><text x="40" y="569.36" font-size="11.5" fill="#39ac44" font-weight="700" letter-spacing="1.4">QUÉ SE MIDE: NUMERADOR SOBRE DENOMINADOR</text><rect x="40.0" y="583.4" width="261.3" height="120.7" rx="8" fill="#e2f7e4" stroke="#8cce93" stroke-width="1.4"/><text x="54.0" y="605.4" font-size="13" fill="#206e27" font-weight="700" text-anchor="start"><tspan x="54.0">Esfuerzo percibido</tspan></text><text x="54.0" y="634.5" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Puntuación declarada por el cliente</tspan><tspan x="54.0" dy="15.2">tras una interacción, con escala</tspan><tspan x="54.0" dy="15.2">uniforme</tspan></text><rect x="319.3" y="583.4" width="261.3" height="120.7" rx="8" fill="#e2f7e4" stroke="#8cce93" stroke-width="1.4"/><text x="333.3" y="605.4" font-size="13" fill="#206e27" font-weight="700" text-anchor="start"><tspan x="333.3">Contactos evitables</tspan></text><text x="333.3" y="634.5" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="333.3">Consultas causadas por procesos</tspan><tspan x="333.3" dy="15.2">deficientes</tspan></text><line x1="333.3" y1="670.9" x2="566.7" y2="670.9" stroke="#39ac44" stroke-width="2"/><text x="333.3" y="688.9" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="333.3">Consultas totales</tspan></text><rect x="598.7" y="583.4" width="261.3" height="120.7" rx="8" fill="#e2f7e4" stroke="#8cce93" stroke-width="1.4"/><text x="612.7" y="605.4" font-size="13" fill="#206e27" font-weight="700" text-anchor="start"><tspan x="612.7">Relación esfuerzo-retención</tspan></text><text x="612.7" y="634.5" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="612.7">Retención comparada entre clientes</tspan><tspan x="612.7" dy="15.2">con alto y bajo esfuerzo declarado</tspan></text><text x="40" y="738.06" font-size="11.5" fill="#39ac44" font-weight="700" letter-spacing="1.4">FRONTERA DE APLICACIÓN</text><rect x="40" y="748.1" width="820" height="65.0" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.4"/><polygon points="70,765.56 52,794.56 88,794.56" fill="#c2410c"/><text x="70" y="791.56" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">!</text><text x="106" y="772.1" font-size="12.5" fill="#7c2d12" font-weight="400" text-anchor="start"><tspan x="106">Reducir esfuerzo tiene un piso: algunas verificaciones son necesarias por seguridad o por norma. El</tspan><tspan x="106" dy="16.5">objetivo es eliminar la fricción que no protege a nadie.</tspan></text><text x="40" y="841.06" font-size="11.5" fill="#39ac44" font-weight="700" letter-spacing="1.4">ERROR FRECUENTE Y SU CORRECCIÓN</text><rect x="40" y="851.1" width="380.0" height="77.0" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/><text x="54" y="873.1" font-size="11" fill="#b91c1c" font-weight="700" text-anchor="start"><tspan x="54">Síntoma</tspan></text><text x="54" y="891.1" font-size="12.5" fill="#7f1d1d" font-weight="400" text-anchor="start"><tspan x="54">Invertir en deleite antes de eliminar fricción</tspan></text><line x1="426.0" y1="889.6" x2="469.0" y2="889.6" stroke="#39ac44" stroke-width="2.6" stroke-linecap="round"/><polygon points="474.0,889.6 465.9,893.5 465.9,885.6" fill="#39ac44"/><rect x="480.0" y="851.1" width="380.0" height="77.0" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.4"/><text x="494.0" y="873.1" font-size="11" fill="#15803d" font-weight="700" text-anchor="start"><tspan x="494.0">Corrección</tspan></text><text x="494.0" y="891.1" font-size="12.5" fill="#14532d" font-weight="400" text-anchor="start"><tspan x="494.0">Identifica los contactos evitables y corrige sus</tspan><tspan x="494.0" dy="16.5">causas antes de agregar gestos de sorpresa.</tspan></text></svg>