<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 983" width="900" height="983" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif"><title id="t">Modelo mental · Procurement y compras</title><desc id="d">Modelo mental de la clase 09.12: Procurement y compras. Método en 5 pasos; 4 conceptos; 3 señales de medición.</desc><rect x="0" y="0" width="900" height="983" rx="14" fill="#ffffff"/><rect x="0" y="0" width="900" height="64" rx="14" fill="#6a6e20"/><rect x="0" y="40" width="900" height="24" fill="#6a6e20"/><text x="40" y="28" font-size="12" fill="#e3e5bc" font-weight="700" letter-spacing="1.6">MODELO MENTAL · CLASE 09.12 · PARTE 09</text><text x="40" y="52" font-size="21" fill="#ffffff" font-weight="700">Procurement y compras</text><text x="40" y="84" font-size="11.5" fill="#a6ac39" font-weight="700" letter-spacing="1.4">MÉTODO PASO A PASO</text><line x1="450.0" y1="94.0" x2="450.0" y2="300.5" stroke="#cace8c" stroke-width="3" stroke-linecap="round"/><line x1="450.0" y1="129.5" x2="406.0" y2="129.5" stroke="#cace8c" stroke-width="2"/><rect x="56.0" y="100" width="350" height="59.0" rx="10" fill="#f6f7e2" stroke="#cace8c" stroke-width="1.4"/><text x="70.0" y="122" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="70.0">Construir valor con el área usuaria antes de la</tspan><tspan x="70.0" dy="16.5">intervención de compras</tspan></text><circle cx="450.0" cy="129.5" r="15" fill="#6a6e20"/><text x="450.0" y="134.0" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><line x1="450.0" y1="167.5" x2="494.0" y2="167.5" stroke="#cace8c" stroke-width="2"/><rect x="494.0" y="138" width="350" height="59.0" rx="10" fill="#f6f7e2" stroke="#cace8c" stroke-width="1.4"/><text x="508.0" y="160" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="508.0">Preparar el costo total de propiedad con</tspan><tspan x="508.0" dy="16.5">evidencia</tspan></text><circle cx="450.0" cy="167.5" r="15" fill="#6a6e20"/><text x="450.0" y="172.0" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><line x1="450.0" y1="205.5" x2="406.0" y2="205.5" stroke="#cace8c" stroke-width="2"/><rect x="56.0" y="176" width="350" height="59.0" rx="10" fill="#f6f7e2" stroke="#cace8c" stroke-width="1.4"/><text x="70.0" y="198" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="70.0">Identificar los criterios con que se evalúa a</tspan><tspan x="70.0" dy="16.5">compras</tspan></text><circle cx="450.0" cy="205.5" r="15" fill="#6a6e20"/><text x="450.0" y="210.0" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><line x1="450.0" y1="243.5" x2="494.0" y2="243.5" stroke="#cace8c" stroke-width="2"/><rect x="494.0" y="214" width="350" height="59.0" rx="10" fill="#f6f7e2" stroke="#cace8c" stroke-width="1.4"/><text x="508.0" y="236" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="508.0">Negociar sobre criterios objetivos y no sólo</tspan><tspan x="508.0" dy="16.5">precio</tspan></text><circle cx="450.0" cy="243.5" r="15" fill="#6a6e20"/><text x="450.0" y="248.0" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">4</text><line x1="450.0" y1="273.2" x2="406.0" y2="273.2" stroke="#cace8c" stroke-width="2"/><rect x="56.0" y="252" width="350" height="42.5" rx="10" fill="#f6f7e2" stroke="#cace8c" stroke-width="1.4"/><text x="70.0" y="274" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="70.0">Documentar los acuerdos y sus condiciones</tspan></text><circle cx="450.0" cy="273.2" r="15" fill="#6a6e20"/><text x="450.0" y="277.8" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">5</text><text x="40" y="336.5" font-size="11.5" fill="#a6ac39" font-weight="700" letter-spacing="1.4">CONCEPTOS Y DÓNDE ACTÚAN EN EL MÉTODO</text><rect x="40.0" y="350.5" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#cace8c" stroke-width="1.4"/><rect x="40.0" y="358.5" width="5" height="62.2" rx="2" fill="#a6ac39"/><text x="56.0" y="372.5" font-size="13.5" fill="#6a6e20" font-weight="700" text-anchor="start"><tspan x="56.0">Incentivo de compras</tspan></text><text x="56.0" y="392.3" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Objetivo con que se mide al área, normalmente ahorro y</tspan><tspan x="56.0" dy="15.2">control de riesgo</tspan></text><rect x="379.0" y="358.5" width="54" height="20" rx="10" fill="#e3e5bc" stroke="#cace8c" stroke-width="1"/><text x="406.0" y="372.5" font-size="11" fill="#6a6e20" font-weight="700" text-anchor="middle">↔ 1, 3</text><rect x="459.0" y="350.5" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#cace8c" stroke-width="1.4"/><rect x="459.0" y="358.5" width="5" height="62.2" rx="2" fill="#a6ac39"/><text x="475.0" y="372.5" font-size="13.5" fill="#6a6e20" font-weight="700" text-anchor="start"><tspan x="475.0">Costo total de propiedad</tspan></text><text x="475.0" y="392.3" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Suma de precio, implementación, operación, cambio y salida</tspan><tspan x="475.0" dy="15.2">durante la vida del contrato</tspan></text><rect x="798.0" y="358.5" width="54" height="20" rx="10" fill="#e3e5bc" stroke="#cace8c" stroke-width="1"/><text x="825.0" y="372.5" font-size="11" fill="#6a6e20" font-weight="700" text-anchor="middle">↔ 2</text><rect x="40.0" y="442.7" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#cace8c" stroke-width="1.4"/><rect x="40.0" y="450.7" width="5" height="62.2" rx="2" fill="#a6ac39"/><text x="56.0" y="464.7" font-size="13.5" fill="#6a6e20" font-weight="700" text-anchor="start"><tspan x="56.0">Estandarización de condiciones</tspan></text><text x="56.0" y="484.5" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Presión por aplicar términos uniformes a todos los</tspan><tspan x="56.0" dy="15.2">proveedores</tspan></text><rect x="379.0" y="450.7" width="54" height="20" rx="10" fill="#e3e5bc" stroke="#cace8c" stroke-width="1"/><text x="406.0" y="464.7" font-size="11" fill="#6a6e20" font-weight="700" text-anchor="middle">↔ 5</text><rect x="459.0" y="442.7" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#cace8c" stroke-width="1.4"/><rect x="459.0" y="450.7" width="5" height="62.2" rx="2" fill="#a6ac39"/><text x="475.0" y="464.7" font-size="13.5" fill="#6a6e20" font-weight="700" text-anchor="start"><tspan x="475.0">Momento de intervención</tspan></text><text x="475.0" y="484.5" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Etapa en que compras entra al proceso y su efecto en el</tspan><tspan x="475.0" dy="15.2">margen</tspan></text><rect x="798.0" y="450.7" width="54" height="20" rx="10" fill="#e3e5bc" stroke="#cace8c" stroke-width="1"/><text x="825.0" y="464.7" font-size="11" fill="#6a6e20" font-weight="700" text-anchor="middle">↔ 1</text><text x="40" y="552.86" font-size="11.5" fill="#a6ac39" font-weight="700" letter-spacing="1.4">QUÉ SE MIDE: NUMERADOR SOBRE DENOMINADOR</text><rect x="40.0" y="566.9" width="261.3" height="137.9" rx="8" fill="#f6f7e2" stroke="#cace8c" stroke-width="1.4"/><text x="54.0" y="588.9" font-size="13" fill="#6a6e20" font-weight="700" text-anchor="start"><tspan x="54.0">Descuento exigido por compras</tspan></text><text x="54.0" y="618.0" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Diferencia entre precio ofrecido y</tspan><tspan x="54.0" dy="15.2">precio final en negocios con</tspan><tspan x="54.0" dy="15.2">intervención de compras</tspan></text><rect x="319.3" y="566.9" width="261.3" height="137.9" rx="8" fill="#f6f7e2" stroke="#cace8c" stroke-width="1.4"/><text x="333.3" y="588.9" font-size="13" fill="#6a6e20" font-weight="700" text-anchor="start"><tspan x="333.3">Negocios con costo total</tspan><tspan x="333.3" dy="17.2">presentado</tspan></text><text x="333.3" y="635.2" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="333.3">Oportunidades con análisis de costo</tspan><tspan x="333.3" dy="15.2">total entregado</tspan></text><line x1="333.3" y1="671.5" x2="566.7" y2="671.5" stroke="#a6ac39" stroke-width="2"/><text x="333.3" y="689.5" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="333.3">Oportunidades con compras</tspan></text><rect x="598.7" y="566.9" width="261.3" height="137.9" rx="8" fill="#f6f7e2" stroke="#cace8c" stroke-width="1.4"/><text x="612.7" y="588.9" font-size="13" fill="#6a6e20" font-weight="700" text-anchor="start"><tspan x="612.7">Plazo adicional por intervención</tspan></text><text x="612.7" y="618.0" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="612.7">Días adicionales al ciclo cuando</tspan><tspan x="612.7" dy="15.2">interviene compras, mediana</tspan></text><text x="40" y="738.72" font-size="11.5" fill="#a6ac39" font-weight="700" letter-spacing="1.4">FRONTERA DE APLICACIÓN</text><rect x="40" y="748.7" width="820" height="65.0" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.4"/><polygon points="70,766.22 52,795.22 88,795.22" fill="#c2410c"/><text x="70" y="792.22" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">!</text><text x="106" y="772.7" font-size="12.5" fill="#7c2d12" font-weight="400" text-anchor="start"><tspan x="106">En algunas organizaciones compras tiene mandato absoluto sobre el precio. Ahí la palanca está en el costo</tspan><tspan x="106" dy="16.5">total y en el riesgo, no en el descuento.</tspan></text><text x="40" y="841.72" font-size="11.5" fill="#a6ac39" font-weight="700" letter-spacing="1.4">ERROR FRECUENTE Y SU CORRECCIÓN</text><rect x="40" y="851.7" width="380.0" height="93.5" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/><text x="54" y="873.7" font-size="11" fill="#b91c1c" font-weight="700" text-anchor="start"><tspan x="54">Síntoma</tspan></text><text x="54" y="891.7" font-size="12.5" fill="#7f1d1d" font-weight="400" text-anchor="start"><tspan x="54">Anticipar concesiones antes de que las pidan</tspan></text><line x1="426.0" y1="898.5" x2="469.0" y2="898.5" stroke="#a6ac39" stroke-width="2.6" stroke-linecap="round"/><polygon points="474.0,898.5 465.9,902.4 465.9,894.6" fill="#a6ac39"/><rect x="480.0" y="851.7" width="380.0" height="93.5" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.4"/><text x="494.0" y="873.7" font-size="11" fill="#15803d" font-weight="700" text-anchor="start"><tspan x="494.0">Corrección</tspan></text><text x="494.0" y="891.7" font-size="12.5" fill="#14532d" font-weight="400" text-anchor="start"><tspan x="494.0">Nunca declares margen disponible; prepara</tspan><tspan x="494.0" dy="16.5">contrapartidas y criterios objetivos antes de</tspan><tspan x="494.0" dy="16.5">negociar.</tspan></text></svg>