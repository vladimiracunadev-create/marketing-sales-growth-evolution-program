<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1188" width="900" height="1188" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif"><title id="t">Modelo mental · Benchmarking competitivo</title><desc id="d">Modelo mental de la clase 03.09: Benchmarking competitivo. Método en 5 pasos; 4 conceptos; 3 señales de medición.</desc><rect x="0" y="0" width="900" height="1188" rx="14" fill="#ffffff"/><rect x="0" y="0" width="900" height="64" rx="14" fill="#206e3b"/><rect x="0" y="40" width="900" height="24" fill="#206e3b"/><text x="40" y="28" font-size="12" fill="#bce5ca" font-weight="700" letter-spacing="1.6">MODELO MENTAL · CLASE 03.09 · PARTE 03</text><text x="40" y="52" font-size="21" fill="#ffffff" font-weight="700">Benchmarking competitivo</text><text x="40" y="84" font-size="11.5" fill="#39ac61" font-weight="700" letter-spacing="1.4">MÉTODO PASO A PASO</text><path d="M66.0,175.5 V227.2 H158.5" fill="none" stroke="#39ac61" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="160.5,227.2 151.5,222.2 151.5,232.2" fill="#39ac61"/><path d="M188.5,265.0 V316.8 H281.0" fill="none" stroke="#39ac61" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="283.0,316.8 274.0,311.8 274.0,321.8" fill="#39ac61"/><path d="M311.0,354.5 V406.2 H403.5" fill="none" stroke="#39ac61" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="405.5,406.2 396.5,401.2 396.5,411.2" fill="#39ac61"/><path d="M433.5,444.0 V495.8 H526.0" fill="none" stroke="#39ac61" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="528.0,495.8 519.0,490.8 519.0,500.8" fill="#39ac61"/><rect x="40.0" y="100.0" width="330" height="75.5" rx="10" fill="#e2f7e9" stroke="#8ccea3" stroke-width="1.4"/><text x="54.0" y="122.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Definir muestra, fecha de corte y regla</tspan><tspan x="54.0" dy="16.5">común de comparación</tspan></text><circle cx="42.0" cy="102.0" r="14" fill="#206e3b"/><text x="42.0" y="106.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><rect x="162.5" y="189.5" width="330" height="75.5" rx="10" fill="#e2f7e9" stroke="#8ccea3" stroke-width="1.4"/><text x="176.5" y="211.5" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="176.5">Registrar propuesta, segmento,</tspan><tspan x="176.5" dy="16.5">posicionamiento, precio, packaging, canal y</tspan><tspan x="176.5" dy="16.5">experiencia por alternativa</tspan></text><circle cx="164.5" cy="191.5" r="14" fill="#206e3b"/><text x="164.5" y="196.0" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><rect x="285.0" y="279.0" width="330" height="75.5" rx="10" fill="#e2f7e9" stroke="#8ccea3" stroke-width="1.4"/><text x="299.0" y="301.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="299.0">Adjuntar fuente observable a cada celda y</tspan><tspan x="299.0" dy="16.5">marcar como no observable lo que no pueda</tspan><tspan x="299.0" dy="16.5">verificarse</tspan></text><circle cx="287.0" cy="281.0" r="14" fill="#206e3b"/><text x="287.0" y="285.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><rect x="407.5" y="368.5" width="330" height="75.5" rx="10" fill="#e2f7e9" stroke="#8ccea3" stroke-width="1.4"/><text x="421.5" y="390.5" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="421.5">Separar fortaleza o debilidad observada de</tspan><tspan x="421.5" dy="16.5">la inferencia sobre su causa o importancia</tspan></text><circle cx="409.5" cy="370.5" r="14" fill="#206e3b"/><text x="409.5" y="375.0" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">4</text><rect x="530.0" y="458.0" width="330" height="75.5" rx="10" fill="#e2f7e9" stroke="#8ccea3" stroke-width="1.4"/><text x="544.0" y="480.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="544.0">Decidir dónde igualar o diferenciarse usando</tspan><tspan x="544.0" dy="16.5">razones de compra y pérdida documentadas</tspan></text><circle cx="532.0" cy="460.0" r="14" fill="#206e3b"/><text x="532.0" y="464.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">5</text><text x="40" y="575.5" font-size="11.5" fill="#39ac61" font-weight="700" letter-spacing="1.4">CONCEPTOS Y DÓNDE ACTÚAN EN EL MÉTODO</text><rect x="40.0" y="589.5" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#8ccea3" stroke-width="1.4"/><rect x="40.0" y="597.5" width="5" height="62.2" rx="2" fill="#39ac61"/><text x="56.0" y="611.5" font-size="13.5" fill="#206e3b" font-weight="700" text-anchor="start"><tspan x="56.0">Tabla de entrada</tspan></text><text x="56.0" y="631.3" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Atributo que todos los competidores ofrecen y cuya</tspan><tspan x="56.0" dy="15.2">ausencia descalifica</tspan></text><rect x="459.0" y="589.5" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#8ccea3" stroke-width="1.4"/><rect x="459.0" y="597.5" width="5" height="62.2" rx="2" fill="#39ac61"/><text x="475.0" y="611.5" font-size="13.5" fill="#206e3b" font-weight="700" text-anchor="start"><tspan x="475.0">Punto de diferencia</tspan></text><text x="475.0" y="631.3" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Atributo donde la empresa supera de forma perceptible y</tspan><tspan x="475.0" dy="15.2">sostenible a las alternativas</tspan></text><rect x="798.0" y="597.5" width="54" height="20" rx="10" fill="#bce5ca" stroke="#8ccea3" stroke-width="1"/><text x="825.0" y="611.5" font-size="11" fill="#206e3b" font-weight="700" text-anchor="middle">↔ 5</text><rect x="40.0" y="681.7" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#8ccea3" stroke-width="1.4"/><rect x="40.0" y="689.7" width="5" height="62.2" rx="2" fill="#39ac61"/><text x="56.0" y="703.7" font-size="13.5" fill="#206e3b" font-weight="700" text-anchor="start"><tspan x="56.0">Brecha de desempeño</tspan></text><text x="56.0" y="723.5" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Diferencia medida entre la empresa y el mejor competidor</tspan><tspan x="56.0" dy="15.2">en un atributo concreto</tspan></text><rect x="459.0" y="681.7" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#8ccea3" stroke-width="1.4"/><rect x="459.0" y="689.7" width="5" height="62.2" rx="2" fill="#39ac61"/><text x="475.0" y="703.7" font-size="13.5" fill="#206e3b" font-weight="700" text-anchor="start"><tspan x="475.0">Costo de cierre de brecha</tspan></text><text x="475.0" y="723.5" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Recursos necesarios para alcanzar el nivel del competidor</tspan><tspan x="475.0" dy="15.2">en ese atributo</tspan></text><text x="40" y="791.8600000000001" font-size="11.5" fill="#39ac61" font-weight="700" letter-spacing="1.4">QUÉ SE MIDE: NUMERADOR SOBRE DENOMINADOR</text><rect x="40.0" y="805.9" width="261.3" height="120.7" rx="8" fill="#e2f7e9" stroke="#8ccea3" stroke-width="1.4"/><text x="54.0" y="827.9" font-size="13" fill="#206e3b" font-weight="700" text-anchor="start"><tspan x="54.0">Brecha por atributo crítico</tspan></text><text x="54.0" y="857.0" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Diferencia comparable con fuente y</tspan><tspan x="54.0" dy="15.2">fecha entre la empresa y las</tspan><tspan x="54.0" dy="15.2">alternativas en cada atributo de</tspan><tspan x="54.0" dy="15.2">decisión</tspan></text><rect x="319.3" y="805.9" width="261.3" height="120.7" rx="8" fill="#e2f7e9" stroke="#8ccea3" stroke-width="1.4"/><text x="333.3" y="827.9" font-size="13" fill="#206e3b" font-weight="700" text-anchor="start"><tspan x="333.3">Tasa de pérdida por atributo</tspan></text><text x="333.3" y="857.0" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="333.3">Negocios perdidos donde el atributo</tspan><tspan x="333.3" dy="15.2">fue citado como razón</tspan></text><line x1="333.3" y1="893.4" x2="566.7" y2="893.4" stroke="#39ac61" stroke-width="2"/><text x="333.3" y="911.4" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="333.3">Pérdidas totales</tspan></text><rect x="598.7" y="805.9" width="261.3" height="120.7" rx="8" fill="#e2f7e9" stroke="#8ccea3" stroke-width="1.4"/><text x="612.7" y="827.9" font-size="13" fill="#206e3b" font-weight="700" text-anchor="start"><tspan x="612.7">Costo estimado de paridad</tspan></text><text x="612.7" y="857.0" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="612.7">Inversión estimada por atributo y</tspan><tspan x="612.7" dy="15.2">supuesto declarado para alcanzar el</tspan><tspan x="612.7" dy="15.2">nivel observable de una tabla de</tspan><tspan x="612.7" dy="15.2">entrada</tspan></text><text x="40" y="960.5600000000002" font-size="11.5" fill="#39ac61" font-weight="700" letter-spacing="1.4">FRONTERA DE APLICACIÓN</text><rect x="40" y="970.6" width="820" height="65.0" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.4"/><polygon points="70,988.0600000000002 52,1017.0600000000002 88,1017.0600000000002" fill="#c2410c"/><text x="70" y="1014.0600000000002" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">!</text><text x="106" y="994.6" font-size="12.5" fill="#7c2d12" font-weight="400" text-anchor="start"><tspan x="106">El benchmarking mira el presente del competidor, no su dirección. Igualar hoy puede significar llegar</tspan><tspan x="106" dy="16.5">tarde mañana si el competidor está construyendo otra cosa.</tspan></text><text x="40" y="1063.5600000000002" font-size="11.5" fill="#39ac61" font-weight="700" letter-spacing="1.4">ERROR FRECUENTE Y SU CORRECCIÓN</text><rect x="40" y="1073.6" width="380.0" height="77.0" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/><text x="54" y="1095.6" font-size="11" fill="#b91c1c" font-weight="700" text-anchor="start"><tspan x="54">Síntoma</tspan></text><text x="54" y="1113.6" font-size="12.5" fill="#7f1d1d" font-weight="400" text-anchor="start"><tspan x="54">Convertir el benchmarking en un plan de desarrollo</tspan></text><line x1="426.0" y1="1112.1" x2="469.0" y2="1112.1" stroke="#39ac61" stroke-width="2.6" stroke-linecap="round"/><polygon points="474.0,1112.1 465.9,1116.0 465.9,1108.1" fill="#39ac61"/><rect x="480.0" y="1073.6" width="380.0" height="77.0" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.4"/><text x="494.0" y="1095.6" font-size="11" fill="#15803d" font-weight="700" text-anchor="start"><tspan x="494.0">Corrección</tspan></text><text x="494.0" y="1113.6" font-size="12.5" fill="#14532d" font-weight="400" text-anchor="start"><tspan x="494.0">Filtra los atributos por su presencia en las</tspan><tspan x="494.0" dy="16.5">razones de compra y de pérdida documentadas.</tspan></text></svg>