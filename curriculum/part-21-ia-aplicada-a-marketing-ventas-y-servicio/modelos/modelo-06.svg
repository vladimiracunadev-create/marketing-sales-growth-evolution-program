<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 951" width="900" height="951" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif"><title id="t">Modelo mental · Investigación de prospectos asistida</title><desc id="d">Modelo mental de la clase 21.06: Investigación de prospectos asistida. Método en 5 pasos; 4 conceptos; 3 señales de medición.</desc><rect x="0" y="0" width="900" height="951" rx="14" fill="#ffffff"/><rect x="0" y="0" width="900" height="64" rx="14" fill="#43206e"/><rect x="0" y="40" width="900" height="24" fill="#43206e"/><text x="40" y="28" font-size="12" fill="#cfbce5" font-weight="700" letter-spacing="1.6">MODELO MENTAL · CLASE 21.06 · PARTE 21</text><text x="40" y="52" font-size="21" fill="#ffffff" font-weight="700">Investigación de prospectos asistida</text><text x="40" y="84" font-size="11.5" fill="#6d39ac" font-weight="700" letter-spacing="1.4">MÉTODO PASO A PASO</text><line x1="450.0" y1="94.0" x2="450.0" y2="300.5" stroke="#aa8cce" stroke-width="3" stroke-linecap="round"/><line x1="450.0" y1="129.5" x2="406.0" y2="129.5" stroke="#aa8cce" stroke-width="2"/><rect x="56.0" y="100" width="350" height="59.0" rx="10" fill="#ece2f7" stroke="#aa8cce" stroke-width="1.4"/><text x="70.0" y="122" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="70.0">Definir qué señales importan para el perfil</tspan><tspan x="70.0" dy="16.5">objetivo</tspan></text><circle cx="450.0" cy="129.5" r="15" fill="#43206e"/><text x="450.0" y="134.0" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><line x1="450.0" y1="167.5" x2="494.0" y2="167.5" stroke="#aa8cce" stroke-width="2"/><rect x="494.0" y="138" width="350" height="59.0" rx="10" fill="#ece2f7" stroke="#aa8cce" stroke-width="1.4"/><text x="508.0" y="160" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="508.0">Usar el sistema para reunir y resumir</tspan><tspan x="508.0" dy="16.5">información pública</tspan></text><circle cx="450.0" cy="167.5" r="15" fill="#43206e"/><text x="450.0" y="172.0" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><line x1="450.0" y1="197.2" x2="406.0" y2="197.2" stroke="#aa8cce" stroke-width="2"/><rect x="56.0" y="176" width="350" height="42.5" rx="10" fill="#ece2f7" stroke="#aa8cce" stroke-width="1.4"/><text x="70.0" y="198" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="70.0">Verificar cada dato antes de mencionarlo</tspan></text><circle cx="450.0" cy="197.2" r="15" fill="#43206e"/><text x="450.0" y="201.8" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><line x1="450.0" y1="235.2" x2="494.0" y2="235.2" stroke="#aa8cce" stroke-width="2"/><rect x="494.0" y="214" width="350" height="42.5" rx="10" fill="#ece2f7" stroke="#aa8cce" stroke-width="1.4"/><text x="508.0" y="236" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="508.0">Limitar la recolección a lo proporcional</tspan></text><circle cx="450.0" cy="235.2" r="15" fill="#43206e"/><text x="450.0" y="239.8" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">4</text><line x1="450.0" y1="273.2" x2="406.0" y2="273.2" stroke="#aa8cce" stroke-width="2"/><rect x="56.0" y="252" width="350" height="42.5" rx="10" fill="#ece2f7" stroke="#aa8cce" stroke-width="1.4"/><text x="70.0" y="274" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="70.0">Medir el efecto en la tasa de respuesta</tspan></text><circle cx="450.0" cy="273.2" r="15" fill="#43206e"/><text x="450.0" y="277.8" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">5</text><text x="40" y="336.5" font-size="11.5" fill="#6d39ac" font-weight="700" letter-spacing="1.4">CONCEPTOS Y DÓNDE ACTÚAN EN EL MÉTODO</text><rect x="40.0" y="350.5" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#aa8cce" stroke-width="1.4"/><rect x="40.0" y="358.5" width="5" height="62.2" rx="2" fill="#6d39ac"/><text x="56.0" y="372.5" font-size="13.5" fill="#43206e" font-weight="700" text-anchor="start"><tspan x="56.0">Señal verificable</tspan></text><text x="56.0" y="392.3" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Hecho comprobable sobre el prospecto que justifica el</tspan><tspan x="56.0" dy="15.2">contacto</tspan></text><rect x="379.0" y="358.5" width="54" height="20" rx="10" fill="#cfbce5" stroke="#aa8cce" stroke-width="1"/><text x="406.0" y="372.5" font-size="11" fill="#43206e" font-weight="700" text-anchor="middle">↔ 1, 3</text><rect x="459.0" y="350.5" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#aa8cce" stroke-width="1.4"/><rect x="459.0" y="358.5" width="5" height="62.2" rx="2" fill="#6d39ac"/><text x="475.0" y="372.5" font-size="13.5" fill="#43206e" font-weight="700" text-anchor="start"><tspan x="475.0">Afirmación no verificada</tspan></text><text x="475.0" y="392.3" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Dato generado que no fue comprobado antes de usarse</tspan></text><rect x="798.0" y="358.5" width="54" height="20" rx="10" fill="#cfbce5" stroke="#aa8cce" stroke-width="1"/><text x="825.0" y="372.5" font-size="11" fill="#43206e" font-weight="700" text-anchor="middle">↔ 3</text><rect x="40.0" y="442.7" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#aa8cce" stroke-width="1.4"/><rect x="40.0" y="450.7" width="5" height="62.2" rx="2" fill="#6d39ac"/><text x="56.0" y="464.7" font-size="13.5" fill="#43206e" font-weight="700" text-anchor="start"><tspan x="56.0">Proporcionalidad de la recolección</tspan></text><text x="56.0" y="484.5" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Límite de información recabada según la finalidad del</tspan><tspan x="56.0" dy="15.2">contacto</tspan></text><rect x="379.0" y="450.7" width="54" height="20" rx="10" fill="#cfbce5" stroke="#aa8cce" stroke-width="1"/><text x="406.0" y="464.7" font-size="11" fill="#43206e" font-weight="700" text-anchor="middle">↔ 4</text><rect x="459.0" y="442.7" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#aa8cce" stroke-width="1.4"/><rect x="459.0" y="450.7" width="5" height="62.2" rx="2" fill="#6d39ac"/><text x="475.0" y="464.7" font-size="13.5" fill="#43206e" font-weight="700" text-anchor="start"><tspan x="475.0">Verificación previa al contacto</tspan></text><text x="475.0" y="484.5" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Comprobación de los datos antes de mencionarlos al</tspan><tspan x="475.0" dy="15.2">prospecto</tspan></text><rect x="798.0" y="450.7" width="54" height="20" rx="10" fill="#cfbce5" stroke="#aa8cce" stroke-width="1"/><text x="825.0" y="464.7" font-size="11" fill="#43206e" font-weight="700" text-anchor="middle">↔ 3</text><text x="40" y="552.86" font-size="11.5" fill="#6d39ac" font-weight="700" letter-spacing="1.4">QUÉ SE MIDE: NUMERADOR SOBRE DENOMINADOR</text><rect x="40.0" y="566.9" width="261.3" height="122.7" rx="8" fill="#ece2f7" stroke="#aa8cce" stroke-width="1.4"/><text x="54.0" y="588.9" font-size="13" fill="#43206e" font-weight="700" text-anchor="start"><tspan x="54.0">Datos verificados antes del</tspan><tspan x="54.0" dy="17.2">contacto</tspan></text><text x="54.0" y="635.2" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Datos comprobados</tspan></text><line x1="54.0" y1="656.4" x2="287.3" y2="656.4" stroke="#6d39ac" stroke-width="2"/><text x="54.0" y="674.4" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="54.0">Datos mencionados en el contacto</tspan></text><rect x="319.3" y="566.9" width="261.3" height="122.7" rx="8" fill="#ece2f7" stroke="#aa8cce" stroke-width="1.4"/><text x="333.3" y="588.9" font-size="13" fill="#43206e" font-weight="700" text-anchor="start"><tspan x="333.3">Tasa de respuesta con</tspan><tspan x="333.3" dy="17.2">investigación asistida</tspan></text><text x="333.3" y="635.2" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="333.3">Respuestas obtenidas, comparadas con</tspan><tspan x="333.3" dy="15.2">contactos sin investigación</tspan></text><rect x="598.7" y="566.9" width="261.3" height="122.7" rx="8" fill="#ece2f7" stroke="#aa8cce" stroke-width="1.4"/><text x="612.7" y="588.9" font-size="13" fill="#43206e" font-weight="700" text-anchor="start"><tspan x="612.7">Errores factuales detectados</tspan></text><text x="612.7" y="618.0" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="612.7">Datos incorrectos encontrados en la</tspan><tspan x="612.7" dy="15.2">verificación</tspan></text><line x1="612.7" y1="654.4" x2="846.0" y2="654.4" stroke="#6d39ac" stroke-width="2"/><text x="612.7" y="672.4" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="612.7">Datos generados</tspan></text><text x="40" y="723.54" font-size="11.5" fill="#6d39ac" font-weight="700" letter-spacing="1.4">FRONTERA DE APLICACIÓN</text><rect x="40" y="733.5" width="820" height="65.0" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.4"/><polygon points="70,751.04 52,780.04 88,780.04" fill="#c2410c"/><text x="70" y="777.04" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">!</text><text x="106" y="757.5" font-size="12.5" fill="#7c2d12" font-weight="400" text-anchor="start"><tspan x="106">La información pública sobre personas sigue siendo dato personal. Su tratamiento requiere finalidad</tspan><tspan x="106" dy="16.5">legítima y no se vuelve libre por estar disponible.</tspan></text><text x="40" y="826.54" font-size="11.5" fill="#6d39ac" font-weight="700" letter-spacing="1.4">ERROR FRECUENTE Y SU CORRECCIÓN</text><rect x="40" y="836.5" width="380.0" height="77.0" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/><text x="54" y="858.5" font-size="11" fill="#b91c1c" font-weight="700" text-anchor="start"><tspan x="54">Síntoma</tspan></text><text x="54" y="876.5" font-size="12.5" fill="#7f1d1d" font-weight="400" text-anchor="start"><tspan x="54">Mencionar datos generados sin verificarlos</tspan></text><line x1="426.0" y1="875.0" x2="469.0" y2="875.0" stroke="#6d39ac" stroke-width="2.6" stroke-linecap="round"/><polygon points="474.0,875.0 465.9,879.0 465.9,871.1" fill="#6d39ac"/><rect x="480.0" y="836.5" width="380.0" height="77.0" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.4"/><text x="494.0" y="858.5" font-size="11" fill="#15803d" font-weight="700" text-anchor="start"><tspan x="494.0">Corrección</tspan></text><text x="494.0" y="876.5" font-size="12.5" fill="#14532d" font-weight="400" text-anchor="start"><tspan x="494.0">Verifica cada hecho antes de citarlo en un contacto</tspan><tspan x="494.0" dy="16.5">comercial.</tspan></text></svg>