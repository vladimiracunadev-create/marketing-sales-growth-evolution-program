<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1092" width="900" height="1092" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif"><title id="t">Modelo mental · Defensa ejecutiva</title><desc id="d">Modelo mental de la clase 24.13: Defensa ejecutiva. Método en 5 pasos; 4 conceptos; 3 señales de medición.</desc><rect x="0" y="0" width="900" height="1092" rx="14" fill="#ffffff"/><rect x="0" y="0" width="900" height="64" rx="14" fill="#6e5e20"/><rect x="0" y="40" width="900" height="24" fill="#6e5e20"/><text x="40" y="28" font-size="12" fill="#e5ddbc" font-weight="700" letter-spacing="1.6">MODELO MENTAL · CLASE 24.13 · PARTE 24</text><text x="40" y="52" font-size="21" fill="#ffffff" font-weight="700">Defensa ejecutiva</text><text x="40" y="84" font-size="11.5" fill="#ac9539" font-weight="700" letter-spacing="1.4">MÉTODO PASO A PASO</text><path d="M66.0,159.0 V202.5 H158.5" fill="none" stroke="#ac9539" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="160.5,202.5 151.5,197.5 151.5,207.5" fill="#ac9539"/><path d="M188.5,232.0 V275.5 H281.0" fill="none" stroke="#ac9539" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="283.0,275.5 274.0,270.5 274.0,280.5" fill="#ac9539"/><path d="M311.0,305.0 V348.5 H403.5" fill="none" stroke="#ac9539" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="405.5,348.5 396.5,343.5 396.5,353.5" fill="#ac9539"/><path d="M433.5,378.0 V421.5 H526.0" fill="none" stroke="#ac9539" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="528.0,421.5 519.0,416.5 519.0,426.5" fill="#ac9539"/><rect x="40.0" y="100.0" width="330" height="59.0" rx="10" fill="#f7f3e2" stroke="#cec08c" stroke-width="1.4"/><text x="54.0" y="122.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Preparar el resumen ejecutivo con la</tspan><tspan x="54.0" dy="16.5">recomendación al inicio</tspan></text><circle cx="42.0" cy="102.0" r="14" fill="#6e5e20"/><text x="42.0" y="106.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><rect x="162.5" y="173.0" width="330" height="59.0" rx="10" fill="#f7f3e2" stroke="#cec08c" stroke-width="1.4"/><text x="176.5" y="195.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="176.5">Anticipar las preguntas de estrés y preparar</tspan><tspan x="176.5" dy="16.5">la respuesta</tspan></text><circle cx="164.5" cy="175.0" r="14" fill="#6e5e20"/><text x="164.5" y="179.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><rect x="285.0" y="246.0" width="330" height="59.0" rx="10" fill="#f7f3e2" stroke="#cec08c" stroke-width="1.4"/><text x="299.0" y="268.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="299.0">Declarar los límites del trabajo</tspan></text><circle cx="287.0" cy="248.0" r="14" fill="#6e5e20"/><text x="287.0" y="252.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><rect x="407.5" y="319.0" width="330" height="59.0" rx="10" fill="#f7f3e2" stroke="#cec08c" stroke-width="1.4"/><text x="421.5" y="341.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="421.5">Responder con evidencia y reconocer lo que</tspan><tspan x="421.5" dy="16.5">no se sabe</tspan></text><circle cx="409.5" cy="321.0" r="14" fill="#6e5e20"/><text x="409.5" y="325.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">4</text><rect x="530.0" y="392.0" width="330" height="59.0" rx="10" fill="#f7f3e2" stroke="#cec08c" stroke-width="1.4"/><text x="544.0" y="414.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="544.0">Registrar las observaciones para la</tspan><tspan x="544.0" dy="16.5">retrospectiva</tspan></text><circle cx="532.0" cy="394.0" r="14" fill="#6e5e20"/><text x="532.0" y="398.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">5</text><text x="40" y="493.0" font-size="11.5" fill="#ac9539" font-weight="700" letter-spacing="1.4">CONCEPTOS Y DÓNDE ACTÚAN EN EL MÉTODO</text><rect x="40.0" y="507.0" width="401.0" height="63.0" rx="8" fill="#ffffff" stroke="#cec08c" stroke-width="1.4"/><rect x="40.0" y="515.0" width="5" height="47.0" rx="2" fill="#ac9539"/><text x="56.0" y="529.0" font-size="13.5" fill="#6e5e20" font-weight="700" text-anchor="start"><tspan x="56.0">Argumento sostenido en evidencia</tspan></text><text x="56.0" y="548.8" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Afirmación respaldada por dato o razonamiento verificable</tspan></text><rect x="379.0" y="515.0" width="54" height="20" rx="10" fill="#e5ddbc" stroke="#cec08c" stroke-width="1"/><text x="406.0" y="529.0" font-size="11" fill="#6e5e20" font-weight="700" text-anchor="middle">↔ 4</text><rect x="459.0" y="507.0" width="401.0" height="63.0" rx="8" fill="#ffffff" stroke="#cec08c" stroke-width="1.4"/><rect x="459.0" y="515.0" width="5" height="47.0" rx="2" fill="#ac9539"/><text x="475.0" y="529.0" font-size="13.5" fill="#6e5e20" font-weight="700" text-anchor="start"><tspan x="475.0">Reconocimiento de límites</tspan></text><text x="475.0" y="548.8" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Declaración honesta de lo que el trabajo no puede sostener</tspan></text><rect x="798.0" y="515.0" width="54" height="20" rx="10" fill="#e5ddbc" stroke="#cec08c" stroke-width="1"/><text x="825.0" y="529.0" font-size="11" fill="#6e5e20" font-weight="700" text-anchor="middle">↔ 3, 4</text><rect x="40.0" y="584.0" width="401.0" height="63.0" rx="8" fill="#ffffff" stroke="#cec08c" stroke-width="1.4"/><rect x="40.0" y="592.0" width="5" height="47.0" rx="2" fill="#ac9539"/><text x="56.0" y="606.0" font-size="13.5" fill="#6e5e20" font-weight="700" text-anchor="start"><tspan x="56.0">Pregunta de estrés</tspan></text><text x="56.0" y="625.8" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Cuestionamiento que somete el plan a un escenario adverso</tspan></text><rect x="379.0" y="592.0" width="54" height="20" rx="10" fill="#e5ddbc" stroke="#cec08c" stroke-width="1"/><text x="406.0" y="606.0" font-size="11" fill="#6e5e20" font-weight="700" text-anchor="middle">↔ 2</text><rect x="459.0" y="584.0" width="401.0" height="63.0" rx="8" fill="#ffffff" stroke="#cec08c" stroke-width="1.4"/><rect x="459.0" y="592.0" width="5" height="47.0" rx="2" fill="#ac9539"/><text x="475.0" y="606.0" font-size="13.5" fill="#6e5e20" font-weight="700" text-anchor="start"><tspan x="475.0">Condición de cambio</tspan></text><text x="475.0" y="625.8" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Resultado que llevaría a modificar la recomendación</tspan></text><text x="40" y="679.0" font-size="11.5" fill="#ac9539" font-weight="700" letter-spacing="1.4">QUÉ SE MIDE: NUMERADOR SOBRE DENOMINADOR</text><rect x="40.0" y="693.0" width="261.3" height="137.9" rx="8" fill="#f7f3e2" stroke="#cec08c" stroke-width="1.4"/><text x="54.0" y="715.0" font-size="13" fill="#6e5e20" font-weight="700" text-anchor="start"><tspan x="54.0">Respuestas sostenidas en</tspan><tspan x="54.0" dy="17.2">evidencia</tspan></text><text x="54.0" y="761.3" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Respuestas con dato o razonamiento</tspan><tspan x="54.0" dy="15.2">verificable</tspan></text><line x1="54.0" y1="797.7" x2="287.3" y2="797.7" stroke="#ac9539" stroke-width="2"/><text x="54.0" y="815.7" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="54.0">Preguntas recibidas</tspan></text><rect x="319.3" y="693.0" width="261.3" height="137.9" rx="8" fill="#f7f3e2" stroke="#cec08c" stroke-width="1.4"/><text x="333.3" y="715.0" font-size="13" fill="#6e5e20" font-weight="700" text-anchor="start"><tspan x="333.3">Límites reconocidos</tspan></text><text x="333.3" y="744.2" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="333.3">Limitaciones declaradas</tspan><tspan x="333.3" dy="15.2">espontáneamente</tspan></text><line x1="333.3" y1="780.5" x2="566.7" y2="780.5" stroke="#ac9539" stroke-width="2"/><text x="333.3" y="798.5" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="333.3">Limitaciones identificables</tspan></text><rect x="598.7" y="693.0" width="261.3" height="137.9" rx="8" fill="#f7f3e2" stroke="#cec08c" stroke-width="1.4"/><text x="612.7" y="715.0" font-size="13" fill="#6e5e20" font-weight="700" text-anchor="start"><tspan x="612.7">Coherencia bajo estrés</tspan></text><text x="612.7" y="744.2" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="612.7">Respuestas consistentes ante</tspan><tspan x="612.7" dy="15.2">escenarios adversos</tspan></text><line x1="612.7" y1="780.5" x2="846.0" y2="780.5" stroke="#ac9539" stroke-width="2"/><text x="612.7" y="798.5" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="612.7">Preguntas de estrés recibidas</tspan></text><text x="40" y="864.86" font-size="11.5" fill="#ac9539" font-weight="700" letter-spacing="1.4">FRONTERA DE APLICACIÓN</text><rect x="40" y="874.9" width="820" height="65.0" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.4"/><polygon points="70,892.36 52,921.36 88,921.36" fill="#c2410c"/><text x="70" y="918.36" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">!</text><text x="106" y="898.9" font-size="12.5" fill="#7c2d12" font-weight="400" text-anchor="start"><tspan x="106">Una defensa brillante no corrige un trabajo débil. La preparación no sustituye la calidad del análisis</tspan><tspan x="106" dy="16.5">subyacente.</tspan></text><text x="40" y="967.86" font-size="11.5" fill="#ac9539" font-weight="700" letter-spacing="1.4">ERROR FRECUENTE Y SU CORRECCIÓN</text><rect x="40" y="977.9" width="380.0" height="77.0" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/><text x="54" y="999.9" font-size="11" fill="#b91c1c" font-weight="700" text-anchor="start"><tspan x="54">Síntoma</tspan></text><text x="54" y="1017.9" font-size="12.5" fill="#7f1d1d" font-weight="400" text-anchor="start"><tspan x="54">Defender afirmaciones que no se pueden sostener</tspan></text><line x1="426.0" y1="1016.4" x2="469.0" y2="1016.4" stroke="#ac9539" stroke-width="2.6" stroke-linecap="round"/><polygon points="474.0,1016.4 465.9,1020.3 465.9,1012.4" fill="#ac9539"/><rect x="480.0" y="977.9" width="380.0" height="77.0" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.4"/><text x="494.0" y="999.9" font-size="11" fill="#15803d" font-weight="700" text-anchor="start"><tspan x="494.0">Corrección</tspan></text><text x="494.0" y="1017.9" font-size="12.5" fill="#14532d" font-weight="400" text-anchor="start"><tspan x="494.0">Reconoce explícitamente los límites y qué evidencia</tspan><tspan x="494.0" dy="16.5">haría falta para cerrarlos.</tspan></text></svg>