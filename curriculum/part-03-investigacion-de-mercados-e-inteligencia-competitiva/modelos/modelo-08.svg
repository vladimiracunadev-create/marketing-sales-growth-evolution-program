<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1302" width="900" height="1302" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif"><title id="t">Modelo mental · TAM, SAM y SOM</title><desc id="d">Modelo mental de la clase 03.08: TAM, SAM y SOM. Método en 5 pasos; 4 conceptos; 3 señales de medición.</desc><rect x="0" y="0" width="900" height="1302" rx="14" fill="#ffffff"/><rect x="0" y="0" width="900" height="64" rx="14" fill="#206e3b"/><rect x="0" y="40" width="900" height="24" fill="#206e3b"/><text x="40" y="28" font-size="12" fill="#bce5ca" font-weight="700" letter-spacing="1.6">MODELO MENTAL · CLASE 03.08 · PARTE 03</text><text x="40" y="52" font-size="21" fill="#ffffff" font-weight="700">TAM, SAM y SOM</text><text x="40" y="84" font-size="11.5" fill="#39ac61" font-weight="700" letter-spacing="1.4">MÉTODO PASO A PASO</text><ellipse cx="450.0" cy="376.8" rx="330.0" ry="233.1" fill="none" stroke="#8ccea3" stroke-width="2" stroke-dasharray="3 8" stroke-linecap="round"/><polygon points="653.8,193.3 636.3,190.4 641.2,180.8" fill="#39ac61"/><polygon points="759.3,458.8 761.4,441.2 771.2,445.7" fill="#39ac61"/><polygon points="439.0,609.9 455.9,604.4 455.9,615.3" fill="#39ac61"/><polygon points="131.6,438.8 143.5,451.9 133.7,456.4" fill="#39ac61"/><polygon points="265.8,183.2 253.2,195.8 248.3,186.1" fill="#39ac61"/><circle cx="450.0" cy="376.8" r="100.0" fill="#bce5ca" stroke="#8ccea3" stroke-width="1.6"/><text x="450.0" y="378.9" font-size="15" fill="#206e3b" font-weight="700" text-anchor="middle"><tspan x="450.0">TAM, SAM y SOM</tspan></text><rect x="361.0" y="106.0" width="178" height="75.5" rx="10" fill="#e2f7e9" stroke="#8ccea3" stroke-width="1.4"/><text x="373.0" y="128.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="373.0">Definir la unidad de</tspan><tspan x="373.0" dy="16.5">consumo y su precio</tspan><tspan x="373.0" dy="16.5">realista</tspan></text><circle cx="363.0" cy="108.0" r="14" fill="#206e3b"/><text x="363.0" y="112.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><rect x="674.8" y="267.0" width="178" height="75.5" rx="10" fill="#e2f7e9" stroke="#8ccea3" stroke-width="1.4"/><text x="686.8" y="289.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="686.8">Estimar el número de</tspan><tspan x="686.8" dy="16.5">unidades con fuentes</tspan><tspan x="686.8" dy="16.5">citadas</tspan></text><circle cx="676.8" cy="269.0" r="14" fill="#206e3b"/><text x="676.8" y="273.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><rect x="555.0" y="535.8" width="178" height="59.0" rx="10" fill="#e2f7e9" stroke="#8ccea3" stroke-width="1.4"/><text x="567.0" y="557.8" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="567.0">Acotar por modelo,</tspan><tspan x="567.0" dy="16.5">geografía y capacidad</tspan></text><circle cx="557.0" cy="537.8" r="14" fill="#206e3b"/><text x="557.0" y="542.3" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><rect x="167.0" y="527.6" width="178" height="75.5" rx="10" fill="#e2f7e9" stroke="#8ccea3" stroke-width="1.4"/><text x="179.0" y="549.6" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="179.0">Construir escenarios</tspan><tspan x="179.0" dy="16.5">conservador, base y</tspan><tspan x="179.0" dy="16.5">optimista</tspan></text><circle cx="169.0" cy="529.6" r="14" fill="#206e3b"/><text x="169.0" y="534.1" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">4</text><rect x="47.2" y="267.0" width="178" height="75.5" rx="10" fill="#e2f7e9" stroke="#8ccea3" stroke-width="1.4"/><text x="59.2" y="289.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="59.2">Declarar los tres</tspan><tspan x="59.2" dy="16.5">supuestos que más</tspan><tspan x="59.2" dy="16.5">mueven el resultado</tspan></text><circle cx="49.2" cy="269.0" r="14" fill="#206e3b"/><text x="49.2" y="273.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">5</text><text x="40" y="689.6" font-size="11.5" fill="#39ac61" font-weight="700" letter-spacing="1.4">CONCEPTOS Y DÓNDE ACTÚAN EN EL MÉTODO</text><rect x="40.0" y="703.6" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#8ccea3" stroke-width="1.4"/><rect x="40.0" y="711.6" width="5" height="62.2" rx="2" fill="#39ac61"/><text x="56.0" y="725.6" font-size="13.5" fill="#206e3b" font-weight="700" text-anchor="start"><tspan x="56.0">TAM</tspan></text><text x="56.0" y="745.4" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Gasto total anual del universo que tiene el problema, si</tspan><tspan x="56.0" dy="15.2">toda la solución fuera provista</tspan></text><rect x="459.0" y="703.6" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#8ccea3" stroke-width="1.4"/><rect x="459.0" y="711.6" width="5" height="62.2" rx="2" fill="#39ac61"/><text x="475.0" y="725.6" font-size="13.5" fill="#206e3b" font-weight="700" text-anchor="start"><tspan x="475.0">SAM</tspan></text><text x="475.0" y="745.4" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Porción del TAM alcanzable con el modelo, la geografía y</tspan><tspan x="475.0" dy="15.2">el idioma actuales</tspan></text><rect x="798.0" y="711.6" width="54" height="20" rx="10" fill="#bce5ca" stroke="#8ccea3" stroke-width="1"/><text x="825.0" y="725.6" font-size="11" fill="#206e3b" font-weight="700" text-anchor="middle">↔ 3</text><rect x="40.0" y="795.8" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#8ccea3" stroke-width="1.4"/><rect x="40.0" y="803.8" width="5" height="62.2" rx="2" fill="#39ac61"/><text x="56.0" y="817.8" font-size="13.5" fill="#206e3b" font-weight="700" text-anchor="start"><tspan x="56.0">SOM</tspan></text><text x="56.0" y="837.6" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Porción del SAM capturable con la capacidad comercial y el</tspan><tspan x="56.0" dy="15.2">presupuesto disponibles en el horizonte definido</tspan></text><rect x="459.0" y="795.8" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#8ccea3" stroke-width="1.4"/><rect x="459.0" y="803.8" width="5" height="62.2" rx="2" fill="#39ac61"/><text x="475.0" y="817.8" font-size="13.5" fill="#206e3b" font-weight="700" text-anchor="start"><tspan x="475.0">Estimación bottom-up</tspan></text><text x="475.0" y="837.6" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Cálculo construido desde unidades observables y precios</tspan><tspan x="475.0" dy="15.2">reales, con fuente por variable</tspan></text><rect x="798.0" y="803.8" width="54" height="20" rx="10" fill="#bce5ca" stroke="#8ccea3" stroke-width="1"/><text x="825.0" y="817.8" font-size="11" fill="#206e3b" font-weight="700" text-anchor="middle">↔ 1, 2</text><text x="40" y="905.96" font-size="11.5" fill="#39ac61" font-weight="700" letter-spacing="1.4">QUÉ SE MIDE: NUMERADOR SOBRE DENOMINADOR</text><rect x="40.0" y="920.0" width="261.3" height="120.7" rx="8" fill="#e2f7e9" stroke="#8ccea3" stroke-width="1.4"/><text x="54.0" y="942.0" font-size="13" fill="#206e3b" font-weight="700" text-anchor="start"><tspan x="54.0">Dispersión entre escenarios</tspan></text><text x="54.0" y="971.1" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Diferencia porcentual entre</tspan><tspan x="54.0" dy="15.2">escenario conservador y optimista</tspan></text><rect x="319.3" y="920.0" width="261.3" height="120.7" rx="8" fill="#e2f7e9" stroke="#8ccea3" stroke-width="1.4"/><text x="333.3" y="942.0" font-size="13" fill="#206e3b" font-weight="700" text-anchor="start"><tspan x="333.3">Supuestos críticos identificados</tspan></text><text x="333.3" y="971.1" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="333.3">Variables cuyo cambio de 10 % altera</tspan><tspan x="333.3" dy="15.2">el resultado en más de 20 %</tspan></text><rect x="598.7" y="920.0" width="261.3" height="120.7" rx="8" fill="#e2f7e9" stroke="#8ccea3" stroke-width="1.4"/><text x="612.7" y="942.0" font-size="13" fill="#206e3b" font-weight="700" text-anchor="start"><tspan x="612.7">Cobertura de fuentes</tspan></text><text x="612.7" y="971.1" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="612.7">Variables del cálculo con fuente</tspan><tspan x="612.7" dy="15.2">citada</tspan></text><line x1="612.7" y1="1007.5" x2="846.0" y2="1007.5" stroke="#39ac61" stroke-width="2"/><text x="612.7" y="1025.5" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="612.7">Variables totales del modelo</tspan></text><text x="40" y="1074.66" font-size="11.5" fill="#39ac61" font-weight="700" letter-spacing="1.4">FRONTERA DE APLICACIÓN</text><rect x="40" y="1084.7" width="820" height="65.0" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.4"/><polygon points="70,1102.16 52,1131.16 88,1131.16" fill="#c2410c"/><text x="70" y="1128.16" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">!</text><text x="106" y="1108.7" font-size="12.5" fill="#7c2d12" font-weight="400" text-anchor="start"><tspan x="106">El TAM no predice ingreso: una empresa puede tener un mercado enorme y cero capacidad de alcanzarlo. Para</tspan><tspan x="106" dy="16.5">decisiones operativas, el SOM y su supuesto de capacidad importan más.</tspan></text><text x="40" y="1177.66" font-size="11.5" fill="#39ac61" font-weight="700" letter-spacing="1.4">ERROR FRECUENTE Y SU CORRECCIÓN</text><rect x="40" y="1187.7" width="380.0" height="77.0" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/><text x="54" y="1209.7" font-size="11" fill="#b91c1c" font-weight="700" text-anchor="start"><tspan x="54">Síntoma</tspan></text><text x="54" y="1227.7" font-size="12.5" fill="#7f1d1d" font-weight="400" text-anchor="start"><tspan x="54">Estimar top-down desde un informe sectorial</tspan></text><line x1="426.0" y1="1226.2" x2="469.0" y2="1226.2" stroke="#39ac61" stroke-width="2.6" stroke-linecap="round"/><polygon points="474.0,1226.2 465.9,1230.1 465.9,1222.2" fill="#39ac61"/><rect x="480.0" y="1187.7" width="380.0" height="77.0" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.4"/><text x="494.0" y="1209.7" font-size="11" fill="#15803d" font-weight="700" text-anchor="start"><tspan x="494.0">Corrección</tspan></text><text x="494.0" y="1227.7" font-size="12.5" fill="#14532d" font-weight="400" text-anchor="start"><tspan x="494.0">Reconstruye la cifra bottom-up con unidades y</tspan><tspan x="494.0" dy="16.5">precios verificables antes de usarla para decidir.</tspan></text></svg>