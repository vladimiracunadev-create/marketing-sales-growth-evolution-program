<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1346" width="900" height="1346" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif"><title id="t">Modelo mental · Síntesis: expediente de cliente accionable</title><desc id="d">Modelo mental de la clase 02.14: Síntesis: expediente de cliente accionable. Método en 5 pasos; 8 conceptos; 4 señales de medición.</desc><rect x="0" y="0" width="900" height="1346" rx="14" fill="#ffffff"/><rect x="0" y="0" width="900" height="64" rx="14" fill="#426e20"/><rect x="0" y="40" width="900" height="24" fill="#426e20"/><text x="40" y="28" font-size="12" fill="#cee5bc" font-weight="700" letter-spacing="1.6">MODELO MENTAL · CLASE 02.14 · PARTE 02</text><text x="40" y="52" font-size="21" fill="#ffffff" font-weight="700">Síntesis: expediente de cliente accionable</text><text x="40" y="84" font-size="11.5" fill="#6bac39" font-weight="700" letter-spacing="1.4">MÉTODO PASO A PASO</text><rect x="40.0" y="100" width="246.7" height="92.0" rx="10" fill="#ebf7e2" stroke="#a9ce8c" stroke-width="1.4"/><text x="54.0" y="122" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Consolidar segmento, ICP,</tspan><tspan x="54.0" dy="16.5">entrevistas, JTBD, dolores y</tspan><tspan x="54.0" dy="16.5">ganancias con origen y fecha por</tspan><tspan x="54.0" dy="16.5">afirmación</tspan></text><circle cx="42.0" cy="102.0" r="14" fill="#426e20"/><text x="42.0" y="106.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><rect x="326.7" y="100" width="246.7" height="92.0" rx="10" fill="#ebf7e2" stroke="#a9ce8c" stroke-width="1.4"/><text x="340.7" y="122" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="340.7">Traducir la evidencia a</tspan><tspan x="340.7" dy="16.5">propuesta de valor, mensaje,</tspan><tspan x="340.7" dy="16.5">oferta, canal y siguiente acción</tspan><tspan x="340.7" dy="16.5">de venta</tspan></text><circle cx="328.7" cy="102.0" r="14" fill="#426e20"/><text x="328.7" y="106.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><rect x="613.3" y="100" width="246.7" height="92.0" rx="10" fill="#ebf7e2" stroke="#a9ce8c" stroke-width="1.4"/><text x="627.3" y="122" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="627.3">Usar el mapa de empatía sólo</tspan><tspan x="627.3" dy="16.5">como vista opcional derivada,</tspan><tspan x="627.3" dy="16.5">sin crear afirmaciones nuevas</tspan></text><circle cx="615.3" cy="102.0" r="14" fill="#426e20"/><text x="615.3" y="106.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><rect x="613.3" y="230.0" width="246.7" height="75.5" rx="10" fill="#ebf7e2" stroke="#a9ce8c" stroke-width="1.4"/><text x="627.3" y="252.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="627.3">Marcar hipótesis no validadas y</tspan><tspan x="627.3" dy="16.5">someter la cadena completa a una</tspan><tspan x="627.3" dy="16.5">prueba de uso</tspan></text><circle cx="615.3" cy="232.0" r="14" fill="#426e20"/><text x="615.3" y="236.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">4</text><rect x="326.7" y="230.0" width="246.7" height="75.5" rx="10" fill="#ebf7e2" stroke="#a9ce8c" stroke-width="1.4"/><text x="340.7" y="252.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="340.7">Corregir los eslabones sin</tspan><tspan x="340.7" dy="16.5">evidencia y fijar responsable y</tspan><tspan x="340.7" dy="16.5">frecuencia de actualización</tspan></text><circle cx="328.7" cy="232.0" r="14" fill="#426e20"/><text x="328.7" y="236.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">5</text><line x1="289.7" y1="146.0" x2="318.7" y2="146.0" stroke="#6bac39" stroke-width="2.2" stroke-linecap="round"/><polygon points="323.7,146.0 315.6,149.9 315.6,142.1" fill="#6bac39"/><line x1="576.3" y1="146.0" x2="605.3" y2="146.0" stroke="#6bac39" stroke-width="2.2" stroke-linecap="round"/><polygon points="610.3,146.0 602.2,149.9 602.2,142.1" fill="#6bac39"/><line x1="736.7" y1="194.0" x2="736.7" y2="222.0" stroke="#6bac39" stroke-width="2.2" stroke-linecap="round"/><polygon points="736.7,227.0 732.8,218.9 740.6,218.9" fill="#6bac39"/><line x1="610.3" y1="267.8" x2="581.3" y2="267.8" stroke="#6bac39" stroke-width="2.2" stroke-linecap="round"/><polygon points="576.3,267.8 584.4,263.8 584.4,271.7" fill="#6bac39"/><text x="40" y="343.5" font-size="11.5" fill="#6bac39" font-weight="700" letter-spacing="1.4">CONCEPTOS Y DÓNDE ACTÚAN EN EL MÉTODO</text><rect x="40.0" y="357.5" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#a9ce8c" stroke-width="1.4"/><rect x="40.0" y="365.5" width="5" height="62.2" rx="2" fill="#6bac39"/><text x="56.0" y="379.5" font-size="13.5" fill="#426e20" font-weight="700" text-anchor="start"><tspan x="56.0">Expediente de cliente</tspan></text><text x="56.0" y="399.3" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Documento único que conecta segmento, ICP, jobs, pains,</tspan><tspan x="56.0" dy="15.2">gains y decisiones comerciales con sus fuentes</tspan></text><rect x="459.0" y="357.5" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#a9ce8c" stroke-width="1.4"/><rect x="459.0" y="365.5" width="5" height="62.2" rx="2" fill="#6bac39"/><text x="475.0" y="379.5" font-size="13.5" fill="#426e20" font-weight="700" text-anchor="start"><tspan x="475.0">Trazabilidad de la evidencia</tspan></text><text x="475.0" y="399.3" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Registro del origen, fecha y estado de validación de cada</tspan><tspan x="475.0" dy="15.2">afirmación del expediente</tspan></text><rect x="798.0" y="365.5" width="54" height="20" rx="10" fill="#cee5bc" stroke="#a9ce8c" stroke-width="1"/><text x="825.0" y="379.5" font-size="11" fill="#426e20" font-weight="700" text-anchor="middle">↔ 1, 2, 5</text><rect x="40.0" y="449.7" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#a9ce8c" stroke-width="1.4"/><rect x="40.0" y="457.7" width="5" height="62.2" rx="2" fill="#6bac39"/><text x="56.0" y="471.7" font-size="13.5" fill="#426e20" font-weight="700" text-anchor="start"><tspan x="56.0">Prueba de uso</tspan></text><text x="56.0" y="491.5" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Verificación de que una persona ajena puede tomar una</tspan><tspan x="56.0" dy="15.2">decisión concreta con el documento</tspan></text><rect x="379.0" y="457.7" width="54" height="20" rx="10" fill="#cee5bc" stroke="#a9ce8c" stroke-width="1"/><text x="406.0" y="471.7" font-size="11" fill="#426e20" font-weight="700" text-anchor="middle">↔ 4</text><rect x="459.0" y="449.7" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#a9ce8c" stroke-width="1.4"/><rect x="459.0" y="457.7" width="5" height="62.2" rx="2" fill="#6bac39"/><text x="475.0" y="471.7" font-size="13.5" fill="#426e20" font-weight="700" text-anchor="start"><tspan x="475.0">Ciclo de actualización</tspan></text><text x="475.0" y="491.5" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Rutina definida que mantiene el expediente vigente con</tspan><tspan x="475.0" dy="15.2">datos nuevos</tspan></text><rect x="798.0" y="457.7" width="54" height="20" rx="10" fill="#cee5bc" stroke="#a9ce8c" stroke-width="1"/><text x="825.0" y="471.7" font-size="11" fill="#426e20" font-weight="700" text-anchor="middle">↔ 5</text><rect x="40.0" y="541.9" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#a9ce8c" stroke-width="1.4"/><rect x="40.0" y="549.9" width="5" height="62.2" rx="2" fill="#6bac39"/><text x="56.0" y="563.9" font-size="13.5" fill="#426e20" font-weight="700" text-anchor="start"><tspan x="56.0">Nivel de confianza del hallazgo</tspan></text><text x="56.0" y="583.7" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Grado explícito de respaldo según cantidad, calidad,</tspan><tspan x="56.0" dy="15.2">convergencia y vigencia de la evidencia</tspan></text><rect x="459.0" y="541.9" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#a9ce8c" stroke-width="1.4"/><rect x="459.0" y="549.9" width="5" height="62.2" rx="2" fill="#6bac39"/><text x="475.0" y="563.9" font-size="13.5" fill="#426e20" font-weight="700" text-anchor="start"><tspan x="475.0">Cita verificable</tspan></text><text x="475.0" y="583.7" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Fragmento anonimizado enlazado al registro consentido del</tspan><tspan x="475.0" dy="15.2">que proviene</tspan></text><rect x="40.0" y="634.0" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#a9ce8c" stroke-width="1.4"/><rect x="40.0" y="642.0" width="5" height="62.2" rx="2" fill="#6bac39"/><text x="56.0" y="656.0" font-size="13.5" fill="#426e20" font-weight="700" text-anchor="start"><tspan x="56.0">Factor de abandono</tspan></text><text x="56.0" y="675.9" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Condición observable asociada a no iniciar, no adoptar o</tspan><tspan x="56.0" dy="15.2">terminar la relación</tspan></text><rect x="459.0" y="634.0" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#a9ce8c" stroke-width="1.4"/><rect x="459.0" y="642.0" width="5" height="62.2" rx="2" fill="#6bac39"/><text x="475.0" y="656.0" font-size="13.5" fill="#426e20" font-weight="700" text-anchor="start"><tspan x="475.0">Mensaje por evidencia</tspan></text><text x="475.0" y="675.9" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Afirmación comercial cuyo beneficio, lenguaje y límite</tspan><tspan x="475.0" dy="15.2">derivan de hallazgos trazables</tspan></text><rect x="798.0" y="642.0" width="54" height="20" rx="10" fill="#cee5bc" stroke="#a9ce8c" stroke-width="1"/><text x="825.0" y="656.0" font-size="11" fill="#426e20" font-weight="700" text-anchor="middle">↔ 2, 3, 5</text><text x="40" y="744.22" font-size="11.5" fill="#6bac39" font-weight="700" letter-spacing="1.4">QUÉ SE MIDE: NUMERADOR SOBRE DENOMINADOR</text><rect x="40.0" y="758.2" width="261.3" height="137.9" rx="8" fill="#ebf7e2" stroke="#a9ce8c" stroke-width="1.4"/><text x="54.0" y="780.2" font-size="13" fill="#426e20" font-weight="700" text-anchor="start"><tspan x="54.0">Proporción de afirmaciones con</tspan><tspan x="54.0" dy="17.2">fuente</tspan></text><text x="54.0" y="826.5" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Afirmaciones con origen permitido,</tspan><tspan x="54.0" dy="15.2">fecha y estado de validación</tspan></text><line x1="54.0" y1="862.9" x2="287.3" y2="862.9" stroke="#6bac39" stroke-width="2"/><text x="54.0" y="880.9" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="54.0">Afirmaciones totales del expediente</tspan></text><rect x="319.3" y="758.2" width="261.3" height="137.9" rx="8" fill="#ebf7e2" stroke="#a9ce8c" stroke-width="1.4"/><text x="333.3" y="780.2" font-size="13" fill="#426e20" font-weight="700" text-anchor="start"><tspan x="333.3">Resultado de la prueba de uso</tspan></text><text x="333.3" y="809.4" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="333.3">Decisiones que la persona ajena</tspan><tspan x="333.3" dy="15.2">logró tomar sin consultar</tspan></text><line x1="333.3" y1="845.7" x2="566.7" y2="845.7" stroke="#6bac39" stroke-width="2"/><text x="333.3" y="863.7" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="333.3">Decisiones planteadas</tspan></text><rect x="598.7" y="758.2" width="261.3" height="137.9" rx="8" fill="#ebf7e2" stroke="#a9ce8c" stroke-width="1.4"/><text x="612.7" y="780.2" font-size="13" fill="#426e20" font-weight="700" text-anchor="start"><tspan x="612.7">Frecuencia de uso del expediente</tspan></text><text x="612.7" y="809.4" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="612.7">Referencias al expediente en</tspan><tspan x="612.7" dy="15.2">materiales y guiones producidos en</tspan><tspan x="612.7" dy="15.2">el trimestre</tspan></text><rect x="40.0" y="910.1" width="261.3" height="157.7" rx="8" fill="#ebf7e2" stroke="#a9ce8c" stroke-width="1.4"/><text x="54.0" y="932.1" font-size="13" fill="#426e20" font-weight="700" text-anchor="start"><tspan x="54.0">Calidad de ficha Buyer Persona</tspan></text><text x="54.0" y="961.2" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Puntos logrados en completitud,</tspan><tspan x="54.0" dy="15.2">trazabilidad, vigencia,</tspan><tspan x="54.0" dy="15.2">contradicciones y accionabilidad</tspan></text><line x1="54.0" y1="1012.8" x2="287.3" y2="1012.8" stroke="#6bac39" stroke-width="2"/><text x="54.0" y="1030.8" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="54.0">Puntos posibles de la rúbrica</tspan></text><text x="54.0" y="1060.0" font-size="10.5" fill="#7b8794" font-weight="400" text-anchor="start"><tspan x="54.0">Ventana: en cada revisión trimestral</tspan></text><text x="40" y="1101.8200000000002" font-size="11.5" fill="#6bac39" font-weight="700" letter-spacing="1.4">FRONTERA DE APLICACIÓN</text><rect x="40" y="1111.8" width="820" height="81.5" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.4"/><polygon points="70,1137.5700000000002 52,1166.5700000000002 88,1166.5700000000002" fill="#c2410c"/><text x="70" y="1163.5700000000002" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">!</text><text x="106" y="1135.8" font-size="12.5" fill="#7c2d12" font-weight="400" text-anchor="start"><tspan x="106">Un mapa de empatía puede ordenar lo aprendido, pero no es investigación y no autoriza a rellenar vacíos</tspan><tspan x="106" dy="16.5">con imaginación. Si el expediente excede lo que alguien puede revisar antes de una reunión, hay que</tspan><tspan x="106" dy="16.5">producir una versión operativa de una página enlazada al detalle.</tspan></text><text x="40" y="1221.3200000000002" font-size="11.5" fill="#6bac39" font-weight="700" letter-spacing="1.4">ERROR FRECUENTE Y SU CORRECCIÓN</text><rect x="40" y="1231.3" width="380.0" height="77.0" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/><text x="54" y="1253.3" font-size="11" fill="#b91c1c" font-weight="700" text-anchor="start"><tspan x="54">Síntoma</tspan></text><text x="54" y="1271.3" font-size="12.5" fill="#7f1d1d" font-weight="400" text-anchor="start"><tspan x="54">Producir un documento sin prueba de uso</tspan></text><line x1="426.0" y1="1269.8" x2="469.0" y2="1269.8" stroke="#6bac39" stroke-width="2.6" stroke-linecap="round"/><polygon points="474.0,1269.8 465.9,1273.7 465.9,1265.9" fill="#6bac39"/><rect x="480.0" y="1231.3" width="380.0" height="77.0" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.4"/><text x="494.0" y="1253.3" font-size="11" fill="#15803d" font-weight="700" text-anchor="start"><tspan x="494.0">Corrección</tspan></text><text x="494.0" y="1271.3" font-size="12.5" fill="#14532d" font-weight="400" text-anchor="start"><tspan x="494.0">Entrega el expediente a alguien ajeno y verifica</tspan><tspan x="494.0" dy="16.5">qué decisiones logra tomar sin ayuda.</tspan></text></svg>