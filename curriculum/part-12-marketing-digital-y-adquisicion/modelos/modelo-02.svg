<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 968" width="900" height="968" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif"><title id="t">Modelo mental · El sitio web como activo comercial</title><desc id="d">Modelo mental de la clase 12.02: El sitio web como activo comercial. Método en 5 pasos; 4 conceptos; 3 señales de medición.</desc><rect x="0" y="0" width="900" height="968" rx="14" fill="#ffffff"/><rect x="0" y="0" width="900" height="64" rx="14" fill="#204f6e"/><rect x="0" y="40" width="900" height="24" fill="#204f6e"/><text x="40" y="28" font-size="12" fill="#bcd5e5" font-weight="700" letter-spacing="1.6">MODELO MENTAL · CLASE 12.02 · PARTE 12</text><text x="40" y="52" font-size="21" fill="#ffffff" font-weight="700">El sitio web como activo comercial</text><text x="40" y="84" font-size="11.5" fill="#397eac" font-weight="700" letter-spacing="1.4">MÉTODO PASO A PASO</text><line x1="450.0" y1="94.0" x2="450.0" y2="317.0" stroke="#8cb3ce" stroke-width="3" stroke-linecap="round"/><line x1="450.0" y1="129.5" x2="406.0" y2="129.5" stroke="#8cb3ce" stroke-width="2"/><rect x="56.0" y="100" width="350" height="59.0" rx="10" fill="#e2eff7" stroke="#8cb3ce" stroke-width="1.4"/><text x="70.0" y="122" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="70.0">Definir la decisión que el visitante debe poder</tspan><tspan x="70.0" dy="16.5">tomar</tspan></text><circle cx="450.0" cy="129.5" r="15" fill="#204f6e"/><text x="450.0" y="134.0" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><line x1="450.0" y1="167.5" x2="494.0" y2="167.5" stroke="#8cb3ce" stroke-width="2"/><rect x="494.0" y="138" width="350" height="59.0" rx="10" fill="#e2eff7" stroke="#8cb3ce" stroke-width="1.4"/><text x="508.0" y="160" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="508.0">Estructurar la página desde el problema y no</tspan><tspan x="508.0" dy="16.5">desde la empresa</tspan></text><circle cx="450.0" cy="167.5" r="15" fill="#204f6e"/><text x="450.0" y="172.0" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><line x1="450.0" y1="197.2" x2="406.0" y2="197.2" stroke="#8cb3ce" stroke-width="2"/><rect x="56.0" y="176" width="350" height="42.5" rx="10" fill="#e2eff7" stroke="#8cb3ce" stroke-width="1.4"/><text x="70.0" y="198" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="70.0">Hacer visible la ruta de conversión</tspan></text><circle cx="450.0" cy="197.2" r="15" fill="#204f6e"/><text x="450.0" y="201.8" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><line x1="450.0" y1="243.5" x2="494.0" y2="243.5" stroke="#8cb3ce" stroke-width="2"/><rect x="494.0" y="214" width="350" height="59.0" rx="10" fill="#e2eff7" stroke="#8cb3ce" stroke-width="1.4"/><text x="508.0" y="236" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="508.0">Aplicar la prueba de cinco segundos con</tspan><tspan x="508.0" dy="16.5">usuarios reales</tspan></text><circle cx="450.0" cy="243.5" r="15" fill="#204f6e"/><text x="450.0" y="248.0" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">4</text><line x1="450.0" y1="281.5" x2="406.0" y2="281.5" stroke="#8cb3ce" stroke-width="2"/><rect x="56.0" y="252" width="350" height="59.0" rx="10" fill="#e2eff7" stroke="#8cb3ce" stroke-width="1.4"/><text x="70.0" y="274" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="70.0">Medir conversión por página y corregir la peor</tspan><tspan x="70.0" dy="16.5">primero</tspan></text><circle cx="450.0" cy="281.5" r="15" fill="#204f6e"/><text x="450.0" y="286.0" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">5</text><text x="40" y="353.0" font-size="11.5" fill="#397eac" font-weight="700" letter-spacing="1.4">CONCEPTOS Y DÓNDE ACTÚAN EN EL MÉTODO</text><rect x="40.0" y="367.0" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#8cb3ce" stroke-width="1.4"/><rect x="40.0" y="375.0" width="5" height="62.2" rx="2" fill="#397eac"/><text x="56.0" y="389.0" font-size="13.5" fill="#204f6e" font-weight="700" text-anchor="start"><tspan x="56.0">Claridad de propuesta</tspan></text><text x="56.0" y="408.8" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Capacidad del sitio de comunicar qué ofrece y para quién</tspan><tspan x="56.0" dy="15.2">en pocos segundos</tspan></text><rect x="459.0" y="367.0" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#8cb3ce" stroke-width="1.4"/><rect x="459.0" y="375.0" width="5" height="62.2" rx="2" fill="#397eac"/><text x="475.0" y="389.0" font-size="13.5" fill="#204f6e" font-weight="700" text-anchor="start"><tspan x="475.0">Ruta de conversión</tspan></text><text x="475.0" y="408.8" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Secuencia de páginas y acciones que lleva de la llegada al</tspan><tspan x="475.0" dy="15.2">contacto</tspan></text><rect x="798.0" y="375.0" width="54" height="20" rx="10" fill="#bcd5e5" stroke="#8cb3ce" stroke-width="1"/><text x="825.0" y="389.0" font-size="11" fill="#204f6e" font-weight="700" text-anchor="middle">↔ 3, 5</text><rect x="40.0" y="459.2" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#8cb3ce" stroke-width="1.4"/><rect x="40.0" y="467.2" width="5" height="62.2" rx="2" fill="#397eac"/><text x="56.0" y="481.2" font-size="13.5" fill="#204f6e" font-weight="700" text-anchor="start"><tspan x="56.0">Transparencia de precio</tspan></text><text x="56.0" y="501.0" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Información de costo suficiente para que el visitante se</tspan><tspan x="56.0" dy="15.2">autocalifique</tspan></text><rect x="459.0" y="459.2" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#8cb3ce" stroke-width="1.4"/><rect x="459.0" y="467.2" width="5" height="62.2" rx="2" fill="#397eac"/><text x="475.0" y="481.2" font-size="13.5" fill="#204f6e" font-weight="700" text-anchor="start"><tspan x="475.0">Prueba de cinco segundos</tspan></text><text x="475.0" y="501.0" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Verificación de qué comprende una persona tras una</tspan><tspan x="475.0" dy="15.2">exposición muy breve</tspan></text><rect x="798.0" y="467.2" width="54" height="20" rx="10" fill="#bcd5e5" stroke="#8cb3ce" stroke-width="1"/><text x="825.0" y="481.2" font-size="11" fill="#204f6e" font-weight="700" text-anchor="middle">↔ 4</text><text x="40" y="569.36" font-size="11.5" fill="#397eac" font-weight="700" letter-spacing="1.4">QUÉ SE MIDE: NUMERADOR SOBRE DENOMINADOR</text><rect x="40.0" y="583.4" width="261.3" height="122.7" rx="8" fill="#e2eff7" stroke="#8cb3ce" stroke-width="1.4"/><text x="54.0" y="605.4" font-size="13" fill="#204f6e" font-weight="700" text-anchor="start"><tspan x="54.0">Tasa de conversión por página</tspan></text><text x="54.0" y="634.5" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Acciones de contacto</tspan></text><line x1="54.0" y1="655.7" x2="287.3" y2="655.7" stroke="#397eac" stroke-width="2"/><text x="54.0" y="673.7" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="54.0">Visitas únicas de la página, mensual</tspan></text><rect x="319.3" y="583.4" width="261.3" height="122.7" rx="8" fill="#e2eff7" stroke="#8cb3ce" stroke-width="1.4"/><text x="333.3" y="605.4" font-size="13" fill="#204f6e" font-weight="700" text-anchor="start"><tspan x="333.3">Comprensión en prueba breve</tspan></text><text x="333.3" y="634.5" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="333.3">Personas que explican correctamente</tspan><tspan x="333.3" dy="15.2">la oferta tras cinco segundos</tspan></text><line x1="333.3" y1="670.9" x2="566.7" y2="670.9" stroke="#397eac" stroke-width="2"/><text x="333.3" y="688.9" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="333.3">Expuestas</tspan></text><rect x="598.7" y="583.4" width="261.3" height="122.7" rx="8" fill="#e2eff7" stroke="#8cb3ce" stroke-width="1.4"/><text x="612.7" y="605.4" font-size="13" fill="#204f6e" font-weight="700" text-anchor="start"><tspan x="612.7">Tasa de rebote por página de</tspan><tspan x="612.7" dy="17.2">entrada</tspan></text><text x="612.7" y="651.7" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="612.7">Sesiones de una sola página</tspan></text><line x1="612.7" y1="672.9" x2="846.0" y2="672.9" stroke="#397eac" stroke-width="2"/><text x="612.7" y="690.9" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="612.7">Sesiones que entraron por esa página</tspan></text><text x="40" y="740.04" font-size="11.5" fill="#397eac" font-weight="700" letter-spacing="1.4">FRONTERA DE APLICACIÓN</text><rect x="40" y="750.0" width="820" height="65.0" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.4"/><polygon points="70,767.54 52,796.54 88,796.54" fill="#c2410c"/><text x="70" y="793.54" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">!</text><text x="106" y="774.0" font-size="12.5" fill="#7c2d12" font-weight="400" text-anchor="start"><tspan x="106">Un sitio excelente no compensa la ausencia de demanda: si nadie llega, la conversión se aplica sobre cero.</tspan><tspan x="106" dy="16.5">El diagnóstico debe distinguir problema de tráfico de problema de conversión.</tspan></text><text x="40" y="843.04" font-size="11.5" fill="#397eac" font-weight="700" letter-spacing="1.4">ERROR FRECUENTE Y SU CORRECCIÓN</text><rect x="40" y="853.0" width="380.0" height="77.0" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/><text x="54" y="875.0" font-size="11" fill="#b91c1c" font-weight="700" text-anchor="start"><tspan x="54">Síntoma</tspan></text><text x="54" y="893.0" font-size="12.5" fill="#7f1d1d" font-weight="400" text-anchor="start"><tspan x="54">Escribir el sitio desde la perspectiva de la</tspan><tspan x="54" dy="16.5">empresa</tspan></text><line x1="426.0" y1="891.5" x2="469.0" y2="891.5" stroke="#397eac" stroke-width="2.6" stroke-linecap="round"/><polygon points="474.0,891.5 465.9,895.5 465.9,887.6" fill="#397eac"/><rect x="480.0" y="853.0" width="380.0" height="77.0" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.4"/><text x="494.0" y="875.0" font-size="11" fill="#15803d" font-weight="700" text-anchor="start"><tspan x="494.0">Corrección</tspan></text><text x="494.0" y="893.0" font-size="12.5" fill="#14532d" font-weight="400" text-anchor="start"><tspan x="494.0">Reescribe la primera pantalla respondiendo qué es,</tspan><tspan x="494.0" dy="16.5">para quién y qué problema resuelve.</tspan></text></svg>