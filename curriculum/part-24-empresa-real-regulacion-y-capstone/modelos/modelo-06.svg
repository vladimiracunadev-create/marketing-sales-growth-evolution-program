t="400" text-anchor="start"><tspan x="54.0">Clientes esperados</tspan></text><rect x="319.3" y="920.0" width="261.3" height="120.7" rx="8" fill="#f7f3e2" stroke="#cec08c" stroke-width="1.4"/><text x="333.3" y="942.0" font-size="13" fill="#6e5e20" font-weight="700" text-anchor="start"><tspan x="333.3">Coherencia movimiento-ticket</tspan></text><text x="333.3" y="971.1" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="333.3">Relación entre costo de adquisición</tspan><tspan x="333.3" dy="15.2">y valor del primer año</tspan></text><rect x="598.7" y="920.0" width="261.3" height="120.7" rx="8" fill="#f7f3e2" stroke="#cec08c" stroke-width="1.4"/><text x="612.7" y="942.0" font-size="13" fill="#6e5e20" font-weight="700" text-anchor="start"><tspan x="612.7">Dependencias identificadas</tspan></text><text x="612.7" y="971.1" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="612.7">Acciones con precondiciones</tspan><tspan x="612.7" dy="15.2">declaradas</tspan></text><line x1="612.7" y1="1007.5" x2="846.0" y2="1007.5" stroke="#ac9539" stroke-width="2"/><text x="612.7" y="1025.5" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="612.7">Acciones del plan</tspan></text><text x="40" y="1074.66" font-size="11.5" fill="#ac9539" font-weight="700" letter-spacing="1.4">FRONTERA DE APLICACIÓN</text><rect x="40" y="1084.7" width="820" height="65.0" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.4"/><polygon points="70,1102.16 52,1131.16 88,1131.16" fill="#c2410c"/><text x="70" y="1128.16" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">!</text><text x="106" y="1108.7" font-size="12.5" fill="#7c2d12" font-weight="400" text-anchor="start"><tspan x="106">Un plan de salida al mercado no ejecutado es una hipótesis. Su evaluación se centra en la calidad del</tspan><tspan x="106" dy="16.5">razonamiento y en la explicitación de supuestos.</tspan></text><text x="40" y="1177.66" font-size="11.5" fill="#ac9539" font-weight="700" letter-spacing="1.4">ERROR FRECUENTE Y SU CORRECCIÓN</text><rect x="40" y="1187.7" width="380.0" height="77.0" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/><text x="54" y="1209.7" font-size="11" fill="#b91c1c" font-weight="700" text-anchor="start"><tspan x="54">Síntoma</tspan></text><text x="54" y="1227.7" font-size="12.5" fill="#7f1d1d" font-weight="400" text-anchor="start"><tspan x="54">Elegir el movimiento sin verificar su economía</tspan></text><line x1="426.0" y1="1226.2" x2="469.0" y2="1226.2" stroke="#ac9539" stroke-width="2.6" stroke-linecap="round"/><polygon points="474.0,1226.2 465.9,1230.1 465.9,1222.2" fill="#ac9539"/><rect x="480.0" y="1187.7" width="380.0" height="77.0" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.4"/><text x="494.0" y="1209.7" font-size="11" fill="#15803d" font-weight="700" text-anchor="start"><tspan x="494.0">Corrección</tspan></text><text x="494.0" y="1227.7" font-size="12.5" fill="#14532d" font-weight="400" text-anchor="start"><tspan x="494.0">Compara el costo del movimiento con el valor del</tspan><tspan x="494.0" dy="16.5">contrato antes de comprometer el plan.</tspan></text></svg>