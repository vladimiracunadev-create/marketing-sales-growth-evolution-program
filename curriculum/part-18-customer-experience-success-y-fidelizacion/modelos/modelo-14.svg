<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1339" width="900" height="1339" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif"><title id="t">Modelo mental · Sistema de retención y expansión</title><desc id="d">Modelo mental de la clase 18.14: Sistema de retención y expansión. Método en 5 pasos; 8 conceptos; 4 señales de medición.</desc><rect x="0" y="0" width="900" height="1339" rx="14" fill="#ffffff"/><rect x="0" y="0" width="900" height="64" rx="14" fill="#206e27"/><rect x="0" y="40" width="900" height="24" fill="#206e27"/><text x="40" y="28" font-size="12" fill="#bce5c0" font-weight="700" letter-spacing="1.6">MODELO MENTAL · CLASE 18.14 · PARTE 18</text><text x="40" y="52" font-size="21" fill="#ffffff" font-weight="700">Sistema de retención y expansión</text><text x="40" y="84" font-size="11.5" fill="#39ac44" font-weight="700" letter-spacing="1.4">MÉTODO PASO A PASO</text><line x1="450.0" y1="94.0" x2="450.0" y2="317.0" stroke="#8cce93" stroke-width="3" stroke-linecap="round"/><line x1="450.0" y1="129.5" x2="406.0" y2="129.5" stroke="#8cce93" stroke-width="2"/><rect x="56.0" y="100" width="350" height="59.0" rx="10" fill="#e2f7e4" stroke="#8cce93" stroke-width="1.4"/><text x="70.0" y="122" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="70.0">Consolidar onboarding, salud, renovación y</tspan><tspan x="70.0" dy="16.5">expansión</tspan></text><circle cx="450.0" cy="129.5" r="15" fill="#206e27"/><text x="450.0" y="134.0" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><line x1="450.0" y1="159.2" x2="494.0" y2="159.2" stroke="#8cce93" stroke-width="2"/><rect x="494.0" y="138" width="350" height="42.5" rx="10" fill="#e2f7e4" stroke="#8cce93" stroke-width="1.4"/><text x="508.0" y="160" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="508.0">Asignar responsabilidad por cartera</tspan></text><circle cx="450.0" cy="159.2" r="15" fill="#206e27"/><text x="450.0" y="163.8" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><line x1="450.0" y1="197.2" x2="406.0" y2="197.2" stroke="#8cce93" stroke-width="2"/><rect x="56.0" y="176" width="350" height="42.5" rx="10" fill="#e2f7e4" stroke="#8cce93" stroke-width="1.4"/><text x="70.0" y="198" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="70.0">Establecer el ritmo de revisión</tspan></text><circle cx="450.0" cy="197.2" r="15" fill="#206e27"/><text x="450.0" y="201.8" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><line x1="450.0" y1="235.2" x2="494.0" y2="235.2" stroke="#8cce93" stroke-width="2"/><rect x="494.0" y="214" width="350" height="42.5" rx="10" fill="#e2f7e4" stroke="#8cce93" stroke-width="1.4"/><text x="508.0" y="236" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="508.0">Validar la capacidad predictiva del sistema</tspan></text><circle cx="450.0" cy="235.2" r="15" fill="#206e27"/><text x="450.0" y="239.8" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">4</text><line x1="450.0" y1="281.5" x2="406.0" y2="281.5" stroke="#8cce93" stroke-width="2"/><rect x="56.0" y="252" width="350" height="59.0" rx="10" fill="#e2f7e4" stroke="#8cce93" stroke-width="1.4"/><text x="70.0" y="274" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="70.0">Medir ingreso neto retenido como resultado</tspan><tspan x="70.0" dy="16.5">agregado</tspan></text><circle cx="450.0" cy="281.5" r="15" fill="#206e27"/><text x="450.0" y="286.0" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">5</text><text x="40" y="353.0" font-size="11.5" fill="#39ac44" font-weight="700" letter-spacing="1.4">CONCEPTOS Y DÓNDE ACTÚAN EN EL MÉTODO</text><rect x="40.0" y="367.0" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#8cce93" stroke-width="1.4"/><rect x="40.0" y="375.0" width="5" height="62.2" rx="2" fill="#39ac44"/><text x="56.0" y="389.0" font-size="13.5" fill="#206e27" font-weight="700" text-anchor="start"><tspan x="56.0">Sistema de retención</tspan></text><text x="56.0" y="408.8" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Conjunto de procesos, indicadores y responsables que</tspan><tspan x="56.0" dy="15.2">sostiene la base de clientes</tspan></text><rect x="379.0" y="375.0" width="54" height="20" rx="10" fill="#bce5c0" stroke="#8cce93" stroke-width="1"/><text x="406.0" y="389.0" font-size="11" fill="#206e27" font-weight="700" text-anchor="middle">↔ 4, 5</text><rect x="459.0" y="367.0" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#8cce93" stroke-width="1.4"/><rect x="459.0" y="375.0" width="5" height="62.2" rx="2" fill="#39ac44"/><text x="475.0" y="389.0" font-size="13.5" fill="#206e27" font-weight="700" text-anchor="start"><tspan x="475.0">Capacidad predictiva</tspan></text><text x="475.0" y="408.8" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Anticipación de las bajas con un margen de error conocido</tspan></text><rect x="798.0" y="375.0" width="54" height="20" rx="10" fill="#bce5c0" stroke="#8cce93" stroke-width="1"/><text x="825.0" y="389.0" font-size="11" fill="#206e27" font-weight="700" text-anchor="middle">↔ 4</text><rect x="40.0" y="459.2" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#8cce93" stroke-width="1.4"/><rect x="40.0" y="467.2" width="5" height="62.2" rx="2" fill="#39ac44"/><text x="56.0" y="481.2" font-size="13.5" fill="#206e27" font-weight="700" text-anchor="start"><tspan x="56.0">Responsabilidad por cartera</tspan></text><text x="56.0" y="501.0" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Asignación explícita de quién responde por cada grupo de</tspan><tspan x="56.0" dy="15.2">cuentas</tspan></text><rect x="379.0" y="467.2" width="54" height="20" rx="10" fill="#bce5c0" stroke="#8cce93" stroke-width="1"/><text x="406.0" y="481.2" font-size="11" fill="#206e27" font-weight="700" text-anchor="middle">↔ 2</text><rect x="459.0" y="459.2" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#8cce93" stroke-width="1.4"/><rect x="459.0" y="467.2" width="5" height="62.2" rx="2" fill="#39ac44"/><text x="475.0" y="481.2" font-size="13.5" fill="#206e27" font-weight="700" text-anchor="start"><tspan x="475.0">Ritmo de revisión</tspan></text><text x="475.0" y="501.0" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Calendario de revisiones de salud, riesgo y renovación</tspan></text><rect x="798.0" y="467.2" width="54" height="20" rx="10" fill="#bce5c0" stroke="#8cce93" stroke-width="1"/><text x="825.0" y="481.2" font-size="11" fill="#206e27" font-weight="700" text-anchor="middle">↔ 1, 3</text><rect x="40.0" y="551.4" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#8cce93" stroke-width="1.4"/><rect x="40.0" y="559.4" width="5" height="62.2" rx="2" fill="#39ac44"/><text x="56.0" y="573.4" font-size="13.5" fill="#206e27" font-weight="700" text-anchor="start"><tspan x="56.0">Momento de la verdad</tspan></text><text x="56.0" y="593.2" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Interacción donde la experiencia confirma o contradice una</tspan><tspan x="56.0" dy="15.2">expectativa importante</tspan></text><rect x="459.0" y="551.4" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#8cce93" stroke-width="1.4"/><rect x="459.0" y="559.4" width="5" height="62.2" rx="2" fill="#39ac44"/><text x="475.0" y="573.4" font-size="13.5" fill="#206e27" font-weight="700" text-anchor="start"><tspan x="475.0">Recuperación de servicio</tspan></text><text x="475.0" y="593.2" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Secuencia de reconocer, resolver, compensar cuando</tspan><tspan x="475.0" dy="15.2">corresponda y prevenir repetición</tspan></text><rect x="40.0" y="643.5" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#8cce93" stroke-width="1.4"/><rect x="40.0" y="651.5" width="5" height="62.2" rx="2" fill="#39ac44"/><text x="56.0" y="665.5" font-size="13.5" fill="#206e27" font-weight="700" text-anchor="start"><tspan x="56.0">Voz del cliente</tspan></text><text x="56.0" y="685.4" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Sistema continuo que recoge, vincula y devuelve acción</tspan><tspan x="56.0" dy="15.2">sobre percepciones y conducta</tspan></text><rect x="459.0" y="643.5" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#8cce93" stroke-width="1.4"/><rect x="459.0" y="651.5" width="5" height="62.2" rx="2" fill="#39ac44"/><text x="475.0" y="665.5" font-size="13.5" fill="#206e27" font-weight="700" text-anchor="start"><tspan x="475.0">Fidelización</tspan></text><text x="475.0" y="685.4" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Aumento sostenible de permanencia, recompra o</tspan><tspan x="475.0" dy="15.2">recomendación basado en valor y confianza, no encierro</tspan></text><text x="40" y="753.72" font-size="11.5" fill="#39ac44" font-weight="700" letter-spacing="1.4">QUÉ SE MIDE: NUMERADOR SOBRE DENOMINADOR</text><rect x="40.0" y="767.7" width="261.3" height="120.7" rx="8" fill="#e2f7e4" stroke="#8cce93" stroke-width="1.4"/><text x="54.0" y="789.7" font-size="13" fill="#206e27" font-weight="700" text-anchor="start"><tspan x="54.0">Ingreso neto retenido</tspan></text><text x="54.0" y="818.9" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Ingreso del mismo grupo 12 meses</tspan><tspan x="54.0" dy="15.2">después</tspan></text><line x1="54.0" y1="855.2" x2="287.3" y2="855.2" stroke="#39ac44" stroke-width="2"/><text x="54.0" y="873.2" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="54.0">Ingreso inicial</tspan></text><rect x="319.3" y="767.7" width="261.3" height="120.7" rx="8" fill="#e2f7e4" stroke="#8cce93" stroke-width="1.4"/><text x="333.3" y="789.7" font-size="13" fill="#206e27" font-weight="700" text-anchor="start"><tspan x="333.3">Precisión de la predicción de</tspan><tspan x="333.3" dy="17.2">bajas</tspan></text><text x="333.3" y="836.0" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="333.3">Diferencia entre bajas previstas y</tspan><tspan x="333.3" dy="15.2">observadas, por trimestre</tspan></text><rect x="598.7" y="767.7" width="261.3" height="120.7" rx="8" fill="#e2f7e4" stroke="#8cce93" stroke-width="1.4"/><text x="612.7" y="789.7" font-size="13" fill="#206e27" font-weight="700" text-anchor="start"><tspan x="612.7">Cuentas con responsable asignado</tspan></text><text x="612.7" y="818.9" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="612.7">Cuentas con dueño definido</tspan></text><line x1="612.7" y1="840.1" x2="846.0" y2="840.1" stroke="#39ac44" stroke-width="2"/><text x="612.7" y="858.1" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="612.7">Cuentas activas</tspan></text><rect x="40.0" y="902.4" width="261.3" height="174.9" rx="8" fill="#e2f7e4" stroke="#8cce93" stroke-width="1.4"/><text x="54.0" y="924.4" font-size="13" fill="#206e27" font-weight="700" text-anchor="start"><tspan x="54.0">Recuperación sostenible de</tspan><tspan x="54.0" dy="17.2">servicio</tspan></text><text x="54.0" y="970.7" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Casos resueltos sin reincidencia del</tspan><tspan x="54.0" dy="15.2">mismo modo de falla en 90 días</tspan></text><line x1="54.0" y1="1007.1" x2="287.3" y2="1007.1" stroke="#39ac44" stroke-width="2"/><text x="54.0" y="1025.1" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="54.0">Casos de recuperación cerrados con</tspan><tspan x="54.0" dy="15.2">seguimiento</tspan></text><text x="54.0" y="1069.5" font-size="10.5" fill="#7b8794" font-weight="400" text-anchor="start"><tspan x="54.0">Ventana: cohorte móvil de 90 días</tspan></text><text x="40" y="1111.3200000000002" font-size="11.5" fill="#39ac44" font-weight="700" letter-spacing="1.4">FRONTERA DE APLICACIÓN</text><rect x="40" y="1121.3" width="820" height="65.0" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.4"/><polygon points="70,1138.8200000000002 52,1167.8200000000002 88,1167.8200000000002" fill="#c2410c"/><text x="70" y="1164.8200000000002" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">!</text><text x="106" y="1145.3" font-size="12.5" fill="#7c2d12" font-weight="400" text-anchor="start"><tspan x="106">Un sistema de retención no compensa un problema de encaje: si el segmento no obtiene valor, la solución</tspan><tspan x="106" dy="16.5">está en la calificación comercial y en el producto.</tspan></text><text x="40" y="1214.3200000000002" font-size="11.5" fill="#39ac44" font-weight="700" letter-spacing="1.4">ERROR FRECUENTE Y SU CORRECCIÓN</text><rect x="40" y="1224.3" width="380.0" height="77.0" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/><text x="54" y="1246.3" font-size="11" fill="#b91c1c" font-weight="700" text-anchor="start"><tspan x="54">Síntoma</tspan></text><text x="54" y="1264.3" font-size="12.5" fill="#7f1d1d" font-weight="400" text-anchor="start"><tspan x="54">Construir el sistema sin validar su capacidad</tspan><tspan x="54" dy="16.5">predictiva</tspan></text><line x1="426.0" y1="1262.8" x2="469.0" y2="1262.8" stroke="#39ac44" stroke-width="2.6" stroke-linecap="round"/><polygon points="474.0,1262.8 465.9,1266.7 465.9,1258.9" fill="#39ac44"/><rect x="480.0" y="1224.3" width="380.0" height="77.0" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.4"/><text x="494.0" y="1246.3" font-size="11" fill="#15803d" font-weight="700" text-anchor="start"><tspan x="494.0">Corrección</tspan></text><text x="494.0" y="1264.3" font-size="12.5" fill="#14532d" font-weight="400" text-anchor="start"><tspan x="494.0">Compara las bajas previstas con las observadas cada</tspan><tspan x="494.0" dy="16.5">trimestre y recalibra el modelo.</tspan></text></svg>