<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 924" width="900" height="924" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif"><title id="t">Modelo mental · Deal review completo</title><desc id="d">Modelo mental de la clase 09.14: Deal review completo. Método en 5 pasos; 4 conceptos; 3 señales de medición.</desc><rect x="0" y="0" width="900" height="924" rx="14" fill="#ffffff"/><rect x="0" y="0" width="900" height="64" rx="14" fill="#6a6e20"/><rect x="0" y="40" width="900" height="24" fill="#6a6e20"/><text x="40" y="28" font-size="12" fill="#e3e5bc" font-weight="700" letter-spacing="1.6">MODELO MENTAL · CLASE 09.14 · PARTE 09</text><text x="40" y="52" font-size="21" fill="#ffffff" font-weight="700">Deal review completo</text><text x="40" y="84" font-size="11.5" fill="#a6ac39" font-weight="700" letter-spacing="1.4">MÉTODO PASO A PASO</text><rect x="40.0" y="100" width="246.7" height="59.0" rx="10" fill="#f6f7e2" stroke="#cace8c" stroke-width="1.4"/><text x="54.0" y="122" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Presentar el diagnóstico y su</tspan><tspan x="54.0" dy="16.5">evidencia</tspan></text><circle cx="42.0" cy="102.0" r="14" fill="#6a6e20"/><text x="42.0" y="106.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><rect x="326.7" y="100" width="246.7" height="59.0" rx="10" fill="#f6f7e2" stroke="#cace8c" stroke-width="1.4"/><text x="340.7" y="122" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="340.7">Revisar comité, calificación y</tspan><tspan x="340.7" dy="16.5">proceso de decisión</tspan></text><circle cx="328.7" cy="102.0" r="14" fill="#6a6e20"/><text x="328.7" y="106.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><rect x="613.3" y="100" width="246.7" height="59.0" rx="10" fill="#f6f7e2" stroke="#cace8c" stroke-width="1.4"/><text x="627.3" y="122" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="627.3">Identificar los tres supuestos</tspan><tspan x="627.3" dy="16.5">más riesgosos</tspan></text><circle cx="615.3" cy="102.0" r="14" fill="#6a6e20"/><text x="615.3" y="106.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><rect x="613.3" y="197.0" width="246.7" height="59.0" rx="10" fill="#f6f7e2" stroke="#cace8c" stroke-width="1.4"/><text x="627.3" y="219.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="627.3">Decidir continuar, ajustar o</tspan><tspan x="627.3" dy="16.5">abandonar</tspan></text><circle cx="615.3" cy="199.0" r="14" fill="#6a6e20"/><text x="615.3" y="203.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">4</text><rect x="326.7" y="197.0" width="246.7" height="59.0" rx="10" fill="#f6f7e2" stroke="#cace8c" stroke-width="1.4"/><text x="340.7" y="219.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="340.7">Registrar el plan de acción con</tspan><tspan x="340.7" dy="16.5">responsables y fechas</tspan></text><circle cx="328.7" cy="199.0" r="14" fill="#6a6e20"/><text x="328.7" y="203.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">5</text><line x1="289.7" y1="129.5" x2="318.7" y2="129.5" stroke="#a6ac39" stroke-width="2.2" stroke-linecap="round"/><polygon points="323.7,129.5 315.6,133.4 315.6,125.6" fill="#a6ac39"/><line x1="576.3" y1="129.5" x2="605.3" y2="129.5" stroke="#a6ac39" stroke-width="2.2" stroke-linecap="round"/><polygon points="610.3,129.5 602.2,133.4 602.2,125.6" fill="#a6ac39"/><line x1="736.7" y1="161.0" x2="736.7" y2="189.0" stroke="#a6ac39" stroke-width="2.2" stroke-linecap="round"/><polygon points="736.7,194.0 732.8,185.9 740.6,185.9" fill="#a6ac39"/><line x1="610.3" y1="226.5" x2="581.3" y2="226.5" stroke="#a6ac39" stroke-width="2.2" stroke-linecap="round"/><polygon points="576.3,226.5 584.4,222.6 584.4,230.4" fill="#a6ac39"/><text x="40" y="294.0" font-size="11.5" fill="#a6ac39" font-weight="700" letter-spacing="1.4">CONCEPTOS Y DÓNDE ACTÚAN EN EL MÉTODO</text><rect x="40.0" y="308.0" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#cace8c" stroke-width="1.4"/><rect x="40.0" y="316.0" width="5" height="62.2" rx="2" fill="#a6ac39"/><text x="56.0" y="330.0" font-size="13.5" fill="#6a6e20" font-weight="700" text-anchor="start"><tspan x="56.0">Revisión de negocio</tspan></text><text x="56.0" y="349.8" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Sesión estructurada que evalúa la posición real de una</tspan><tspan x="56.0" dy="15.2">oportunidad con evidencia</tspan></text><rect x="379.0" y="316.0" width="54" height="20" rx="10" fill="#e3e5bc" stroke="#cace8c" stroke-width="1"/><text x="406.0" y="330.0" font-size="11" fill="#6a6e20" font-weight="700" text-anchor="middle">↔ 2</text><rect x="459.0" y="308.0" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#cace8c" stroke-width="1.4"/><rect x="459.0" y="316.0" width="5" height="62.2" rx="2" fill="#a6ac39"/><text x="475.0" y="330.0" font-size="13.5" fill="#6a6e20" font-weight="700" text-anchor="start"><tspan x="475.0">Evidencia frente a supuesto</tspan></text><text x="475.0" y="349.8" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Distinción explícita entre lo verificado y lo asumido en</tspan><tspan x="475.0" dy="15.2">el negocio</tspan></text><rect x="798.0" y="316.0" width="54" height="20" rx="10" fill="#e3e5bc" stroke="#cace8c" stroke-width="1"/><text x="825.0" y="330.0" font-size="11" fill="#6a6e20" font-weight="700" text-anchor="middle">↔ 1, 3</text><rect x="40.0" y="400.2" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#cace8c" stroke-width="1.4"/><rect x="40.0" y="408.2" width="5" height="62.2" rx="2" fill="#a6ac39"/><text x="56.0" y="422.2" font-size="13.5" fill="#6a6e20" font-weight="700" text-anchor="start"><tspan x="56.0">Decisión de abandono</tspan></text><text x="56.0" y="442.0" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Conclusión legítima de dejar de invertir tiempo en la</tspan><tspan x="56.0" dy="15.2">oportunidad</tspan></text><rect x="379.0" y="408.2" width="54" height="20" rx="10" fill="#e3e5bc" stroke="#cace8c" stroke-width="1"/><text x="406.0" y="422.2" font-size="11" fill="#6a6e20" font-weight="700" text-anchor="middle">↔ 2, 4</text><rect x="459.0" y="400.2" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#cace8c" stroke-width="1.4"/><rect x="459.0" y="408.2" width="5" height="62.2" rx="2" fill="#a6ac39"/><text x="475.0" y="422.2" font-size="13.5" fill="#6a6e20" font-weight="700" text-anchor="start"><tspan x="475.0">Plan de acción</tspan></text><text x="475.0" y="442.0" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Conjunto de pasos con responsable y fecha derivados de la</tspan><tspan x="475.0" dy="15.2">revisión</tspan></text><rect x="798.0" y="408.2" width="54" height="20" rx="10" fill="#e3e5bc" stroke="#cace8c" stroke-width="1"/><text x="825.0" y="422.2" font-size="11" fill="#6a6e20" font-weight="700" text-anchor="middle">↔ 5</text><text x="40" y="510.36" font-size="11.5" fill="#a6ac39" font-weight="700" letter-spacing="1.4">QUÉ SE MIDE: NUMERADOR SOBRE DENOMINADOR</text><rect x="40.0" y="524.4" width="261.3" height="137.9" rx="8" fill="#f6f7e2" stroke="#cace8c" stroke-width="1.4"/><text x="54.0" y="546.4" font-size="13" fill="#6a6e20" font-weight="700" text-anchor="start"><tspan x="54.0">Negocios revisados con evidencia</tspan><tspan x="54.0" dy="17.2">completa</tspan></text><text x="54.0" y="592.7" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Revisiones con todos los elementos</tspan><tspan x="54.0" dy="15.2">documentados</tspan></text><line x1="54.0" y1="629.0" x2="287.3" y2="629.0" stroke="#a6ac39" stroke-width="2"/><text x="54.0" y="647.0" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="54.0">Revisiones realizadas</tspan></text><rect x="319.3" y="524.4" width="261.3" height="137.9" rx="8" fill="#f6f7e2" stroke="#cace8c" stroke-width="1.4"/><text x="333.3" y="546.4" font-size="13" fill="#6a6e20" font-weight="700" text-anchor="start"><tspan x="333.3">Tasa de abandono en revisión</tspan></text><text x="333.3" y="575.5" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="333.3">Oportunidades cerradas tras la</tspan><tspan x="333.3" dy="15.2">revisión</tspan></text><line x1="333.3" y1="611.9" x2="566.7" y2="611.9" stroke="#a6ac39" stroke-width="2"/><text x="333.3" y="629.9" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="333.3">Oportunidades revisadas</tspan></text><rect x="598.7" y="524.4" width="261.3" height="137.9" rx="8" fill="#f6f7e2" stroke="#cace8c" stroke-width="1.4"/><text x="612.7" y="546.4" font-size="13" fill="#6a6e20" font-weight="700" text-anchor="start"><tspan x="612.7">Mejora de precisión del forecast</tspan></text><text x="612.7" y="575.5" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="612.7">Diferencia entre forecast y</tspan><tspan x="612.7" dy="15.2">resultado real, antes y después de</tspan><tspan x="612.7" dy="15.2">instaurar revisiones</tspan></text><text x="40" y="696.22" font-size="11.5" fill="#a6ac39" font-weight="700" letter-spacing="1.4">FRONTERA DE APLICACIÓN</text><rect x="40" y="706.2" width="820" height="65.0" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.4"/><polygon points="70,723.72 52,752.72 88,752.72" fill="#c2410c"/><text x="70" y="749.72" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">!</text><text x="106" y="730.2" font-size="12.5" fill="#7c2d12" font-weight="400" text-anchor="start"><tspan x="106">Una revisión que se convierte en interrogatorio destruye la información: el vendedor aprende a ocultar. El</tspan><tspan x="106" dy="16.5">propósito es mejorar la posición, no juzgar personas.</tspan></text><text x="40" y="799.22" font-size="11.5" fill="#a6ac39" font-weight="700" letter-spacing="1.4">ERROR FRECUENTE Y SU CORRECCIÓN</text><rect x="40" y="809.2" width="380.0" height="77.0" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/><text x="54" y="831.2" font-size="11" fill="#b91c1c" font-weight="700" text-anchor="start"><tspan x="54">Síntoma</tspan></text><text x="54" y="849.2" font-size="12.5" fill="#7f1d1d" font-weight="400" text-anchor="start"><tspan x="54">Usar la revisión para presionar en lugar de decidir</tspan></text><line x1="426.0" y1="847.7" x2="469.0" y2="847.7" stroke="#a6ac39" stroke-width="2.6" stroke-linecap="round"/><polygon points="474.0,847.7 465.9,851.6 465.9,843.8" fill="#a6ac39"/><rect x="480.0" y="809.2" width="380.0" height="77.0" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.4"/><text x="494.0" y="831.2" font-size="11" fill="#15803d" font-weight="700" text-anchor="start"><tspan x="494.0">Corrección</tspan></text><text x="494.0" y="849.2" font-size="12.5" fill="#14532d" font-weight="400" text-anchor="start"><tspan x="494.0">Establece que una conclusión válida de la revisión</tspan><tspan x="494.0" dy="16.5">es abandonar el negocio sin costo político.</tspan></text></svg>