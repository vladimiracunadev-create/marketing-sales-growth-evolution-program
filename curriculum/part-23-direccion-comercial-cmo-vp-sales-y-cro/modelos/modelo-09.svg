<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 935" width="900" height="935" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif"><title id="t">Modelo mental · Reuniones operativas</title><desc id="d">Modelo mental de la clase 23.09: Reuniones operativas. Método en 5 pasos; 4 conceptos; 3 señales de medición.</desc><rect x="0" y="0" width="900" height="935" rx="14" fill="#ffffff"/><rect x="0" y="0" width="900" height="64" rx="14" fill="#6e2120"/><rect x="0" y="40" width="900" height="24" fill="#6e2120"/><text x="40" y="28" font-size="12" fill="#e5bdbc" font-weight="700" letter-spacing="1.6">MODELO MENTAL · CLASE 23.09 · PARTE 23</text><text x="40" y="52" font-size="21" fill="#ffffff" font-weight="700">Reuniones operativas</text><text x="40" y="84" font-size="11.5" fill="#ac3b39" font-weight="700" letter-spacing="1.4">MÉTODO PASO A PASO</text><line x1="450.0" y1="94.0" x2="450.0" y2="317.0" stroke="#ce8d8c" stroke-width="3" stroke-linecap="round"/><line x1="450.0" y1="129.5" x2="406.0" y2="129.5" stroke="#ce8d8c" stroke-width="2"/><rect x="56.0" y="100" width="350" height="59.0" rx="10" fill="#f7e2e2" stroke="#ce8d8c" stroke-width="1.4"/><text x="70.0" y="122" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="70.0">Definir el propósito y los participantes</tspan><tspan x="70.0" dy="16.5">necesarios</tspan></text><circle cx="450.0" cy="129.5" r="15" fill="#6e2120"/><text x="450.0" y="134.0" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><line x1="450.0" y1="159.2" x2="494.0" y2="159.2" stroke="#ce8d8c" stroke-width="2"/><rect x="494.0" y="138" width="350" height="42.5" rx="10" fill="#f7e2e2" stroke="#ce8d8c" stroke-width="1.4"/><text x="508.0" y="160" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="508.0">Distribuir la información con anticipación</tspan></text><circle cx="450.0" cy="159.2" r="15" fill="#6e2120"/><text x="450.0" y="163.8" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><line x1="450.0" y1="197.2" x2="406.0" y2="197.2" stroke="#ce8d8c" stroke-width="2"/><rect x="56.0" y="176" width="350" height="42.5" rx="10" fill="#f7e2e2" stroke="#ce8d8c" stroke-width="1.4"/><text x="70.0" y="198" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="70.0">Usar el tiempo en decisiones y no en informar</tspan></text><circle cx="450.0" cy="197.2" r="15" fill="#6e2120"/><text x="450.0" y="201.8" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><line x1="450.0" y1="235.2" x2="494.0" y2="235.2" stroke="#ce8d8c" stroke-width="2"/><rect x="494.0" y="214" width="350" height="42.5" rx="10" fill="#f7e2e2" stroke="#ce8d8c" stroke-width="1.4"/><text x="508.0" y="236" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="508.0">Registrar decisiones con responsable y fecha</tspan></text><circle cx="450.0" cy="235.2" r="15" fill="#6e2120"/><text x="450.0" y="239.8" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">4</text><line x1="450.0" y1="281.5" x2="406.0" y2="281.5" stroke="#ce8d8c" stroke-width="2"/><rect x="56.0" y="252" width="350" height="59.0" rx="10" fill="#f7e2e2" stroke="#ce8d8c" stroke-width="1.4"/><text x="70.0" y="274" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="70.0">Verificar el cumplimiento en la reunión</tspan><tspan x="70.0" dy="16.5">siguiente</tspan></text><circle cx="450.0" cy="281.5" r="15" fill="#6e2120"/><text x="450.0" y="286.0" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">5</text><text x="40" y="353.0" font-size="11.5" fill="#ac3b39" font-weight="700" letter-spacing="1.4">CONCEPTOS Y DÓNDE ACTÚAN EN EL MÉTODO</text><rect x="40.0" y="367.0" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#ce8d8c" stroke-width="1.4"/><rect x="40.0" y="375.0" width="5" height="62.2" rx="2" fill="#ac3b39"/><text x="56.0" y="389.0" font-size="13.5" fill="#6e2120" font-weight="700" text-anchor="start"><tspan x="56.0">Propósito de la reunión</tspan></text><text x="56.0" y="408.8" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Resultado específico que la reunión debe producir</tspan></text><rect x="379.0" y="375.0" width="54" height="20" rx="10" fill="#e5bdbc" stroke="#ce8d8c" stroke-width="1"/><text x="406.0" y="389.0" font-size="11" fill="#6e2120" font-weight="700" text-anchor="middle">↔ 1, 5</text><rect x="459.0" y="367.0" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#ce8d8c" stroke-width="1.4"/><rect x="459.0" y="375.0" width="5" height="62.2" rx="2" fill="#ac3b39"/><text x="475.0" y="389.0" font-size="13.5" fill="#6e2120" font-weight="700" text-anchor="start"><tspan x="475.0">Información previa</tspan></text><text x="475.0" y="408.8" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Material distribuido antes para que el tiempo se use en</tspan><tspan x="475.0" dy="15.2">decidir</tspan></text><rect x="798.0" y="375.0" width="54" height="20" rx="10" fill="#e5bdbc" stroke="#ce8d8c" stroke-width="1"/><text x="825.0" y="389.0" font-size="11" fill="#6e2120" font-weight="700" text-anchor="middle">↔ 2, 3</text><rect x="40.0" y="459.2" width="401.0" height="63.0" rx="8" fill="#ffffff" stroke="#ce8d8c" stroke-width="1.4"/><rect x="40.0" y="467.2" width="5" height="47.0" rx="2" fill="#ac3b39"/><text x="56.0" y="481.2" font-size="13.5" fill="#6e2120" font-weight="700" text-anchor="start"><tspan x="56.0">Decisión registrada</tspan></text><text x="56.0" y="501.0" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Acuerdo documentado con responsable y fecha</tspan></text><rect x="379.0" y="467.2" width="54" height="20" rx="10" fill="#e5bdbc" stroke="#ce8d8c" stroke-width="1"/><text x="406.0" y="481.2" font-size="11" fill="#6e2120" font-weight="700" text-anchor="middle">↔ 3, 4</text><rect x="459.0" y="459.2" width="401.0" height="63.0" rx="8" fill="#ffffff" stroke="#ce8d8c" stroke-width="1.4"/><rect x="459.0" y="467.2" width="5" height="47.0" rx="2" fill="#ac3b39"/><text x="475.0" y="481.2" font-size="13.5" fill="#6e2120" font-weight="700" text-anchor="start"><tspan x="475.0">Ritmo de gestión</tspan></text><text x="475.0" y="501.0" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Calendario estable de reuniones que sostiene la operación</tspan></text><text x="40" y="554.1800000000001" font-size="11.5" fill="#ac3b39" font-weight="700" letter-spacing="1.4">QUÉ SE MIDE: NUMERADOR SOBRE DENOMINADOR</text><rect x="40.0" y="568.2" width="261.3" height="105.5" rx="8" fill="#f7e2e2" stroke="#ce8d8c" stroke-width="1.4"/><text x="54.0" y="590.2" font-size="13" fill="#6e2120" font-weight="700" text-anchor="start"><tspan x="54.0">Decisiones por reunión</tspan></text><text x="54.0" y="619.3" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Acuerdos registrados, por reunión</tspan><tspan x="54.0" dy="15.2">realizada</tspan></text><rect x="319.3" y="568.2" width="261.3" height="105.5" rx="8" fill="#f7e2e2" stroke="#ce8d8c" stroke-width="1.4"/><text x="333.3" y="590.2" font-size="13" fill="#6e2120" font-weight="700" text-anchor="start"><tspan x="333.3">Cumplimiento de acuerdos</tspan></text><text x="333.3" y="619.3" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="333.3">Acuerdos ejecutados en plazo</tspan></text><line x1="333.3" y1="640.5" x2="566.7" y2="640.5" stroke="#ac3b39" stroke-width="2"/><text x="333.3" y="658.5" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="333.3">Acuerdos registrados</tspan></text><rect x="598.7" y="568.2" width="261.3" height="105.5" rx="8" fill="#f7e2e2" stroke="#ce8d8c" stroke-width="1.4"/><text x="612.7" y="590.2" font-size="13" fill="#6e2120" font-weight="700" text-anchor="start"><tspan x="612.7">Tiempo en reuniones</tspan></text><text x="612.7" y="619.3" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="612.7">Horas semanales en reuniones, por</tspan><tspan x="612.7" dy="15.2">persona del equipo comercial</tspan></text><text x="40" y="707.7" font-size="11.5" fill="#ac3b39" font-weight="700" letter-spacing="1.4">FRONTERA DE APLICACIÓN</text><rect x="40" y="717.7" width="820" height="65.0" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.4"/><polygon points="70,735.2 52,764.2 88,764.2" fill="#c2410c"/><text x="70" y="761.2" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">!</text><text x="106" y="741.7" font-size="12.5" fill="#7c2d12" font-weight="400" text-anchor="start"><tspan x="106">Reducir reuniones sin sustituir su función de coordinación produce desalineamiento. El criterio es mejorar</tspan><tspan x="106" dy="16.5">su diseño, no eliminarlas.</tspan></text><text x="40" y="810.7" font-size="11.5" fill="#ac3b39" font-weight="700" letter-spacing="1.4">ERROR FRECUENTE Y SU CORRECCIÓN</text><rect x="40" y="820.7" width="380.0" height="77.0" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/><text x="54" y="842.7" font-size="11" fill="#b91c1c" font-weight="700" text-anchor="start"><tspan x="54">Síntoma</tspan></text><text x="54" y="860.7" font-size="12.5" fill="#7f1d1d" font-weight="400" text-anchor="start"><tspan x="54">Usar la reunión para informar lo que ya está</tspan><tspan x="54" dy="16.5">publicado</tspan></text><line x1="426.0" y1="859.2" x2="469.0" y2="859.2" stroke="#ac3b39" stroke-width="2.6" stroke-linecap="round"/><polygon points="474.0,859.2 465.9,863.1 465.9,855.3" fill="#ac3b39"/><rect x="480.0" y="820.7" width="380.0" height="77.0" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.4"/><text x="494.0" y="842.7" font-size="11" fill="#15803d" font-weight="700" text-anchor="start"><tspan x="494.0">Corrección</tspan></text><text x="494.0" y="860.7" font-size="12.5" fill="#14532d" font-weight="400" text-anchor="start"><tspan x="494.0">Distribuye la información antes y usa el tiempo</tspan><tspan x="494.0" dy="16.5">exclusivamente en decisiones.</tspan></text></svg>