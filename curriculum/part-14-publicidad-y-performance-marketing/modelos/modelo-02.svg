<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 925" width="900" height="925" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif"><title id="t">Modelo mental · Objetivos de campaña</title><desc id="d">Modelo mental de la clase 14.02: Objetivos de campaña. Método en 5 pasos; 4 conceptos; 3 señales de medición.</desc><rect x="0" y="0" width="900" height="925" rx="14" fill="#ffffff"/><rect x="0" y="0" width="900" height="64" rx="14" fill="#6c206e"/><rect x="0" y="40" width="900" height="24" fill="#6c206e"/><text x="40" y="28" font-size="12" fill="#e4bce5" font-weight="700" letter-spacing="1.6">MODELO MENTAL · CLASE 14.02 · PARTE 14</text><text x="40" y="52" font-size="21" fill="#ffffff" font-weight="700">Objetivos de campaña</text><text x="40" y="84" font-size="11.5" fill="#a839ac" font-weight="700" letter-spacing="1.4">MÉTODO PASO A PASO</text><rect x="40.0" y="100" width="246.7" height="75.5" rx="10" fill="#f7e2f7" stroke="#cb8cce" stroke-width="1.4"/><text x="54.0" y="122" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Definir el resultado de negocio</tspan><tspan x="54.0" dy="16.5">esperado</tspan></text><circle cx="42.0" cy="102.0" r="14" fill="#6c206e"/><text x="42.0" y="106.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><rect x="326.7" y="100" width="246.7" height="75.5" rx="10" fill="#f7e2f7" stroke="#cb8cce" stroke-width="1.4"/><text x="340.7" y="122" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="340.7">Elegir el objetivo de</tspan><tspan x="340.7" dy="16.5">optimización coherente</tspan></text><circle cx="328.7" cy="102.0" r="14" fill="#6c206e"/><text x="328.7" y="106.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><rect x="613.3" y="100" width="246.7" height="75.5" rx="10" fill="#f7e2f7" stroke="#cb8cce" stroke-width="1.4"/><text x="627.3" y="122" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="627.3">Verificar que la señal de</tspan><tspan x="627.3" dy="16.5">conversión esté bien</tspan><tspan x="627.3" dy="16.5">instrumentada</tspan></text><circle cx="615.3" cy="102.0" r="14" fill="#6c206e"/><text x="615.3" y="106.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><rect x="613.3" y="213.5" width="246.7" height="59.0" rx="10" fill="#f7e2f7" stroke="#cb8cce" stroke-width="1.4"/><text x="627.3" y="235.5" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="627.3">Asegurar volumen suficiente de</tspan><tspan x="627.3" dy="16.5">señal para el aprendizaje</tspan></text><circle cx="615.3" cy="215.5" r="14" fill="#6c206e"/><text x="615.3" y="220.0" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">4</text><rect x="326.7" y="213.5" width="246.7" height="59.0" rx="10" fill="#f7e2f7" stroke="#cb8cce" stroke-width="1.4"/><text x="340.7" y="235.5" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="340.7">Evaluar con la misma métrica que</tspan><tspan x="340.7" dy="16.5">se optimizó</tspan></text><circle cx="328.7" cy="215.5" r="14" fill="#6c206e"/><text x="328.7" y="220.0" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">5</text><line x1="289.7" y1="137.8" x2="318.7" y2="137.8" stroke="#a839ac" stroke-width="2.2" stroke-linecap="round"/><polygon points="323.7,137.8 315.6,141.7 315.6,133.8" fill="#a839ac"/><line x1="576.3" y1="137.8" x2="605.3" y2="137.8" stroke="#a839ac" stroke-width="2.2" stroke-linecap="round"/><polygon points="610.3,137.8 602.2,141.7 602.2,133.8" fill="#a839ac"/><line x1="736.7" y1="177.5" x2="736.7" y2="205.5" stroke="#a839ac" stroke-width="2.2" stroke-linecap="round"/><polygon points="736.7,210.5 732.8,202.4 740.6,202.4" fill="#a839ac"/><line x1="610.3" y1="243.0" x2="581.3" y2="243.0" stroke="#a839ac" stroke-width="2.2" stroke-linecap="round"/><polygon points="576.3,243.0 584.4,239.1 584.4,246.9" fill="#a839ac"/><text x="40" y="310.5" font-size="11.5" fill="#a839ac" font-weight="700" letter-spacing="1.4">CONCEPTOS Y DÓNDE ACTÚAN EN EL MÉTODO</text><rect x="40.0" y="324.5" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#cb8cce" stroke-width="1.4"/><rect x="40.0" y="332.5" width="5" height="62.2" rx="2" fill="#a839ac"/><text x="56.0" y="346.5" font-size="13.5" fill="#6c206e" font-weight="700" text-anchor="start"><tspan x="56.0">Objetivo de optimización</tspan></text><text x="56.0" y="366.3" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Señal que la plataforma usa para decidir a quién mostrar</tspan><tspan x="56.0" dy="15.2">el anuncio</tspan></text><rect x="379.0" y="332.5" width="54" height="20" rx="10" fill="#e4bce5" stroke="#cb8cce" stroke-width="1"/><text x="406.0" y="346.5" font-size="11" fill="#6c206e" font-weight="700" text-anchor="middle">↔ 2, 5</text><rect x="459.0" y="324.5" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#cb8cce" stroke-width="1.4"/><rect x="459.0" y="332.5" width="5" height="62.2" rx="2" fill="#a839ac"/><text x="475.0" y="346.5" font-size="13.5" fill="#6c206e" font-weight="700" text-anchor="start"><tspan x="475.0">Coherencia objetivo-métrica</tspan></text><text x="475.0" y="366.3" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Correspondencia entre lo que se optimiza y lo que se</tspan><tspan x="475.0" dy="15.2">evalúa</tspan></text><rect x="798.0" y="332.5" width="54" height="20" rx="10" fill="#e4bce5" stroke="#cb8cce" stroke-width="1"/><text x="825.0" y="346.5" font-size="11" fill="#6c206e" font-weight="700" text-anchor="middle">↔ 2, 5</text><rect x="40.0" y="416.7" width="401.0" height="63.0" rx="8" fill="#ffffff" stroke="#cb8cce" stroke-width="1.4"/><rect x="40.0" y="424.7" width="5" height="47.0" rx="2" fill="#a839ac"/><text x="56.0" y="438.7" font-size="13.5" fill="#6c206e" font-weight="700" text-anchor="start"><tspan x="56.0">Etapa del cliente</tspan></text><text x="56.0" y="458.5" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Momento del recorrido al que la campaña se dirige</tspan></text><rect x="459.0" y="416.7" width="401.0" height="63.0" rx="8" fill="#ffffff" stroke="#cb8cce" stroke-width="1.4"/><rect x="459.0" y="424.7" width="5" height="47.0" rx="2" fill="#a839ac"/><text x="475.0" y="438.7" font-size="13.5" fill="#6c206e" font-weight="700" text-anchor="start"><tspan x="475.0">Señal de conversión</tspan></text><text x="475.0" y="458.5" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Evento registrado que la plataforma usa para aprender</tspan></text><rect x="798.0" y="424.7" width="54" height="20" rx="10" fill="#e4bce5" stroke="#cb8cce" stroke-width="1"/><text x="825.0" y="438.7" font-size="11" fill="#6c206e" font-weight="700" text-anchor="middle">↔ 3, 4</text><text x="40" y="511.68" font-size="11.5" fill="#a839ac" font-weight="700" letter-spacing="1.4">QUÉ SE MIDE: NUMERADOR SOBRE DENOMINADOR</text><rect x="40.0" y="525.7" width="261.3" height="137.9" rx="8" fill="#f7e2f7" stroke="#cb8cce" stroke-width="1.4"/><text x="54.0" y="547.7" font-size="13" fill="#6c206e" font-weight="700" text-anchor="start"><tspan x="54.0">Coherencia entre objetivo y</tspan><tspan x="54.0" dy="17.2">evaluación</tspan></text><text x="54.0" y="594.0" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Campañas cuya métrica de evaluación</tspan><tspan x="54.0" dy="15.2">coincide con su objetivo</tspan></text><line x1="54.0" y1="630.4" x2="287.3" y2="630.4" stroke="#a839ac" stroke-width="2"/><text x="54.0" y="648.4" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="54.0">Campañas activas</tspan></text><rect x="319.3" y="525.7" width="261.3" height="137.9" rx="8" fill="#f7e2f7" stroke="#cb8cce" stroke-width="1.4"/><text x="333.3" y="547.7" font-size="13" fill="#6c206e" font-weight="700" text-anchor="start"><tspan x="333.3">Volumen de señal de conversión</tspan></text><text x="333.3" y="576.8" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="333.3">Conversiones registradas por semana,</tspan><tspan x="333.3" dy="15.2">comparadas con el mínimo de</tspan><tspan x="333.3" dy="15.2">aprendizaje</tspan></text><rect x="598.7" y="525.7" width="261.3" height="137.9" rx="8" fill="#f7e2f7" stroke="#cb8cce" stroke-width="1.4"/><text x="612.7" y="547.7" font-size="13" fill="#6c206e" font-weight="700" text-anchor="start"><tspan x="612.7">Costo por resultado de negocio</tspan></text><text x="612.7" y="576.8" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="612.7">Gasto</tspan></text><line x1="612.7" y1="598.0" x2="846.0" y2="598.0" stroke="#a839ac" stroke-width="2"/><text x="612.7" y="616.0" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="612.7">Oportunidades calificadas, por</tspan><tspan x="612.7" dy="15.2">campaña</tspan></text><text x="40" y="697.5400000000001" font-size="11.5" fill="#a839ac" font-weight="700" letter-spacing="1.4">FRONTERA DE APLICACIÓN</text><rect x="40" y="707.5" width="820" height="65.0" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.4"/><polygon points="70,725.0400000000001 52,754.0400000000001 88,754.0400000000001" fill="#c2410c"/><text x="70" y="751.0400000000001" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">!</text><text x="106" y="731.5" font-size="12.5" fill="#7c2d12" font-weight="400" text-anchor="start"><tspan x="106">Optimizar por una conversión escasa impide el aprendizaje del sistema. En volúmenes bajos puede ser</tspan><tspan x="106" dy="16.5">necesario optimizar por un evento intermedio bien correlacionado.</tspan></text><text x="40" y="800.5400000000001" font-size="11.5" fill="#a839ac" font-weight="700" letter-spacing="1.4">ERROR FRECUENTE Y SU CORRECCIÓN</text><rect x="40" y="810.5" width="380.0" height="77.0" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/><text x="54" y="832.5" font-size="11" fill="#b91c1c" font-weight="700" text-anchor="start"><tspan x="54">Síntoma</tspan></text><text x="54" y="850.5" font-size="12.5" fill="#7f1d1d" font-weight="400" text-anchor="start"><tspan x="54">Optimizar por una métrica y evaluar por otra</tspan></text><line x1="426.0" y1="849.0" x2="469.0" y2="849.0" stroke="#a839ac" stroke-width="2.6" stroke-linecap="round"/><polygon points="474.0,849.0 465.9,853.0 465.9,845.1" fill="#a839ac"/><rect x="480.0" y="810.5" width="380.0" height="77.0" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.4"/><text x="494.0" y="832.5" font-size="11" fill="#15803d" font-weight="700" text-anchor="start"><tspan x="494.0">Corrección</tspan></text><text x="494.0" y="850.5" font-size="12.5" fill="#14532d" font-weight="400" text-anchor="start"><tspan x="494.0">Alinea objetivo de plataforma, señal instrumentada</tspan><tspan x="494.0" dy="16.5">y métrica de evaluación.</tspan></text></svg>