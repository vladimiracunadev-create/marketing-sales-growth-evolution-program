<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 887" width="900" height="887" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif"><title id="t">Modelo mental · Lead scoring asistido por modelos</title><desc id="d">Modelo mental de la clase 21.07: Lead scoring asistido por modelos. Método en 5 pasos; 4 conceptos; 3 señales de medición.</desc><rect x="0" y="0" width="900" height="887" rx="14" fill="#ffffff"/><rect x="0" y="0" width="900" height="64" rx="14" fill="#43206e"/><rect x="0" y="40" width="900" height="24" fill="#43206e"/><text x="40" y="28" font-size="12" fill="#cfbce5" font-weight="700" letter-spacing="1.6">MODELO MENTAL · CLASE 21.07 · PARTE 21</text><text x="40" y="52" font-size="21" fill="#ffffff" font-weight="700">Lead scoring asistido por modelos</text><text x="40" y="84" font-size="11.5" fill="#6d39ac" font-weight="700" letter-spacing="1.4">MÉTODO PASO A PASO</text><rect x="40.0" y="100" width="246.7" height="59.0" rx="10" fill="#ece2f7" stroke="#aa8cce" stroke-width="1.4"/><text x="54.0" y="122" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Verificar volumen y calidad de</tspan><tspan x="54.0" dy="16.5">datos antes de modelar</tspan></text><circle cx="42.0" cy="102.0" r="14" fill="#43206e"/><text x="42.0" y="106.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><rect x="326.7" y="100" width="246.7" height="59.0" rx="10" fill="#ece2f7" stroke="#aa8cce" stroke-width="1.4"/><text x="340.7" y="122" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="340.7">Evaluar el desempeño frente a la</tspan><tspan x="340.7" dy="16.5">regla manual actual</tspan></text><circle cx="328.7" cy="102.0" r="14" fill="#43206e"/><text x="328.7" y="106.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><rect x="613.3" y="100" width="246.7" height="59.0" rx="10" fill="#ece2f7" stroke="#aa8cce" stroke-width="1.4"/><text x="627.3" y="122" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="627.3">Revisar el sesgo por segmento</tspan></text><circle cx="615.3" cy="102.0" r="14" fill="#43206e"/><text x="615.3" y="106.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><rect x="613.3" y="197.0" width="246.7" height="59.0" rx="10" fill="#ece2f7" stroke="#aa8cce" stroke-width="1.4"/><text x="627.3" y="219.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="627.3">Monitorear la deriva y</tspan><tspan x="627.3" dy="16.5">recalibrar</tspan></text><circle cx="615.3" cy="199.0" r="14" fill="#43206e"/><text x="615.3" y="203.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">4</text><rect x="326.7" y="197.0" width="246.7" height="59.0" rx="10" fill="#ece2f7" stroke="#aa8cce" stroke-width="1.4"/><text x="340.7" y="219.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="340.7">Mantener supervisión humana</tspan><tspan x="340.7" dy="16.5">sobre las decisiones</tspan></text><circle cx="328.7" cy="199.0" r="14" fill="#43206e"/><text x="328.7" y="203.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">5</text><line x1="289.7" y1="129.5" x2="318.7" y2="129.5" stroke="#6d39ac" stroke-width="2.2" stroke-linecap="round"/><polygon points="323.7,129.5 315.6,133.4 315.6,125.6" fill="#6d39ac"/><line x1="576.3" y1="129.5" x2="605.3" y2="129.5" stroke="#6d39ac" stroke-width="2.2" stroke-linecap="round"/><polygon points="610.3,129.5 602.2,133.4 602.2,125.6" fill="#6d39ac"/><line x1="736.7" y1="161.0" x2="736.7" y2="189.0" stroke="#6d39ac" stroke-width="2.2" stroke-linecap="round"/><polygon points="736.7,194.0 732.8,185.9 740.6,185.9" fill="#6d39ac"/><line x1="610.3" y1="226.5" x2="581.3" y2="226.5" stroke="#6d39ac" stroke-width="2.2" stroke-linecap="round"/><polygon points="576.3,226.5 584.4,222.6 584.4,230.4" fill="#6d39ac"/><text x="40" y="294.0" font-size="11.5" fill="#6d39ac" font-weight="700" letter-spacing="1.4">CONCEPTOS Y DÓNDE ACTÚAN EN EL MÉTODO</text><rect x="40.0" y="308.0" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#aa8cce" stroke-width="1.4"/><rect x="40.0" y="316.0" width="5" height="62.2" rx="2" fill="#6d39ac"/><text x="56.0" y="330.0" font-size="13.5" fill="#43206e" font-weight="700" text-anchor="start"><tspan x="56.0">Sesgo histórico</tspan></text><text x="56.0" y="349.8" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Reproducción de patrones del pasado que pueden ser</tspan><tspan x="56.0" dy="15.2">injustos o subóptimos</tspan></text><rect x="379.0" y="316.0" width="54" height="20" rx="10" fill="#cfbce5" stroke="#aa8cce" stroke-width="1"/><text x="406.0" y="330.0" font-size="11" fill="#43206e" font-weight="700" text-anchor="middle">↔ 3</text><rect x="459.0" y="308.0" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#aa8cce" stroke-width="1.4"/><rect x="459.0" y="316.0" width="5" height="62.2" rx="2" fill="#6d39ac"/><text x="475.0" y="330.0" font-size="13.5" fill="#43206e" font-weight="700" text-anchor="start"><tspan x="475.0">Explicabilidad</tspan></text><text x="475.0" y="349.8" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Capacidad de indicar qué factores influyeron en la</tspan><tspan x="475.0" dy="15.2">puntuación</tspan></text><rect x="40.0" y="400.2" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#aa8cce" stroke-width="1.4"/><rect x="40.0" y="408.2" width="5" height="62.2" rx="2" fill="#6d39ac"/><text x="56.0" y="422.2" font-size="13.5" fill="#43206e" font-weight="700" text-anchor="start"><tspan x="56.0">Deriva del modelo</tspan></text><text x="56.0" y="442.0" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Pérdida de precisión por cambios en el mercado o en el</tspan><tspan x="56.0" dy="15.2">proceso</tspan></text><rect x="379.0" y="408.2" width="54" height="20" rx="10" fill="#cfbce5" stroke="#aa8cce" stroke-width="1"/><text x="406.0" y="422.2" font-size="11" fill="#43206e" font-weight="700" text-anchor="middle">↔ 1, 4</text><rect x="459.0" y="400.2" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#aa8cce" stroke-width="1.4"/><rect x="459.0" y="408.2" width="5" height="62.2" rx="2" fill="#6d39ac"/><text x="475.0" y="422.2" font-size="13.5" fill="#43206e" font-weight="700" text-anchor="start"><tspan x="475.0">Supervisión humana</tspan></text><text x="475.0" y="442.0" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Revisión de decisiones del modelo por una persona</tspan><tspan x="475.0" dy="15.2">responsable</tspan></text><rect x="798.0" y="408.2" width="54" height="20" rx="10" fill="#cfbce5" stroke="#aa8cce" stroke-width="1"/><text x="825.0" y="422.2" font-size="11" fill="#43206e" font-weight="700" text-anchor="middle">↔ 5</text><text x="40" y="510.36" font-size="11.5" fill="#6d39ac" font-weight="700" letter-spacing="1.4">QUÉ SE MIDE: NUMERADOR SOBRE DENOMINADOR</text><rect x="40.0" y="524.4" width="261.3" height="100.7" rx="8" fill="#ece2f7" stroke="#aa8cce" stroke-width="1.4"/><text x="54.0" y="546.4" font-size="13" fill="#43206e" font-weight="700" text-anchor="start"><tspan x="54.0">Desempeño frente a la regla</tspan><tspan x="54.0" dy="17.2">actual</tspan></text><text x="54.0" y="592.7" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Diferencia de precisión entre el</tspan><tspan x="54.0" dy="15.2">modelo y la regla manual</tspan></text><rect x="319.3" y="524.4" width="261.3" height="100.7" rx="8" fill="#ece2f7" stroke="#aa8cce" stroke-width="1.4"/><text x="333.3" y="546.4" font-size="13" fill="#43206e" font-weight="700" text-anchor="start"><tspan x="333.3">Desempeño por segmento</tspan></text><text x="333.3" y="575.5" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="333.3">Precisión del modelo, comparada</tspan><tspan x="333.3" dy="15.2">entre segmentos</tspan></text><rect x="598.7" y="524.4" width="261.3" height="100.7" rx="8" fill="#ece2f7" stroke="#aa8cce" stroke-width="1.4"/><text x="612.7" y="546.4" font-size="13" fill="#43206e" font-weight="700" text-anchor="start"><tspan x="612.7">Deriva observada</tspan></text><text x="612.7" y="575.5" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="612.7">Variación de la precisión del modelo</tspan><tspan x="612.7" dy="15.2">entre periodos sucesivos</tspan></text><text x="40" y="659.04" font-size="11.5" fill="#6d39ac" font-weight="700" letter-spacing="1.4">FRONTERA DE APLICACIÓN</text><rect x="40" y="669.0" width="820" height="65.0" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.4"/><polygon points="70,686.54 52,715.54 88,715.54" fill="#c2410c"/><text x="70" y="712.54" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">!</text><text x="106" y="693.0" font-size="12.5" fill="#7c2d12" font-weight="400" text-anchor="start"><tspan x="106">Un modelo que no puede explicarse no será usado por el equipo comercial. La explicabilidad no es un lujo:</tspan><tspan x="106" dy="16.5">determina la adopción.</tspan></text><text x="40" y="762.04" font-size="11.5" fill="#6d39ac" font-weight="700" letter-spacing="1.4">ERROR FRECUENTE Y SU CORRECCIÓN</text><rect x="40" y="772.0" width="380.0" height="77.0" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/><text x="54" y="794.0" font-size="11" fill="#b91c1c" font-weight="700" text-anchor="start"><tspan x="54">Síntoma</tspan></text><text x="54" y="812.0" font-size="12.5" fill="#7f1d1d" font-weight="400" text-anchor="start"><tspan x="54">Desplegar el modelo sin revisar el sesgo por</tspan><tspan x="54" dy="16.5">segmento</tspan></text><line x1="426.0" y1="810.5" x2="469.0" y2="810.5" stroke="#6d39ac" stroke-width="2.6" stroke-linecap="round"/><polygon points="474.0,810.5 465.9,814.5 465.9,806.6" fill="#6d39ac"/><rect x="480.0" y="772.0" width="380.0" height="77.0" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.4"/><text x="494.0" y="794.0" font-size="11" fill="#15803d" font-weight="700" text-anchor="start"><tspan x="494.0">Corrección</tspan></text><text x="494.0" y="812.0" font-size="12.5" fill="#14532d" font-weight="400" text-anchor="start"><tspan x="494.0">Compara el desempeño entre segmentos y corrige</tspan><tspan x="494.0" dy="16.5">antes de usarlo para priorizar.</tspan></text></svg>