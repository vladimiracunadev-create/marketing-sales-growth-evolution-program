<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 981" width="900" height="981" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif"><title id="t">Modelo mental · Suscripción e ingreso recurrente</title><desc id="d">Modelo mental de la clase 07.09: Suscripción e ingreso recurrente. Método en 5 pasos; 4 conceptos; 3 señales de medición.</desc><rect x="0" y="0" width="900" height="981" rx="14" fill="#ffffff"/><rect x="0" y="0" width="900" height="64" rx="14" fill="#6e2048"/><rect x="0" y="40" width="900" height="24" fill="#6e2048"/><text x="40" y="28" font-size="12" fill="#e5bcd1" font-weight="700" letter-spacing="1.6">MODELO MENTAL · CLASE 07.09 · PARTE 07</text><text x="40" y="52" font-size="21" fill="#ffffff" font-weight="700">Suscripción e ingreso recurrente</text><text x="40" y="84" font-size="11.5" fill="#ac3974" font-weight="700" letter-spacing="1.4">MÉTODO PASO A PASO</text><line x1="450.0" y1="94.0" x2="450.0" y2="317.0" stroke="#ce8cae" stroke-width="3" stroke-linecap="round"/><line x1="450.0" y1="121.2" x2="406.0" y2="121.2" stroke="#ce8cae" stroke-width="2"/><rect x="56.0" y="100" width="350" height="42.5" rx="10" fill="#f7e2ed" stroke="#ce8cae" stroke-width="1.4"/><text x="70.0" y="122" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="70.0">Elegir la métrica de cobro que sigue al valor</tspan></text><circle cx="450.0" cy="121.2" r="15" fill="#6e2048"/><text x="450.0" y="125.8" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><line x1="450.0" y1="167.5" x2="494.0" y2="167.5" stroke="#ce8cae" stroke-width="2"/><rect x="494.0" y="138" width="350" height="59.0" rx="10" fill="#f7e2ed" stroke="#ce8cae" stroke-width="1.4"/><text x="508.0" y="160" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="508.0">Calcular el periodo de recuperación por</tspan><tspan x="508.0" dy="16.5">segmento</tspan></text><circle cx="450.0" cy="167.5" r="15" fill="#6e2048"/><text x="450.0" y="172.0" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><line x1="450.0" y1="205.5" x2="406.0" y2="205.5" stroke="#ce8cae" stroke-width="2"/><rect x="56.0" y="176" width="350" height="59.0" rx="10" fill="#f7e2ed" stroke="#ce8cae" stroke-width="1.4"/><text x="70.0" y="198" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="70.0">Definir la política de renovación y de</tspan><tspan x="70.0" dy="16.5">cancelación</tspan></text><circle cx="450.0" cy="205.5" r="15" fill="#6e2048"/><text x="450.0" y="210.0" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><line x1="450.0" y1="243.5" x2="494.0" y2="243.5" stroke="#ce8cae" stroke-width="2"/><rect x="494.0" y="214" width="350" height="59.0" rx="10" fill="#f7e2ed" stroke="#ce8cae" stroke-width="1.4"/><text x="508.0" y="236" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="508.0">Verificar el cumplimiento del deber de</tspan><tspan x="508.0" dy="16.5">información</tspan></text><circle cx="450.0" cy="243.5" r="15" fill="#6e2048"/><text x="450.0" y="248.0" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">4</text><line x1="450.0" y1="281.5" x2="406.0" y2="281.5" stroke="#ce8cae" stroke-width="2"/><rect x="56.0" y="252" width="350" height="59.0" rx="10" fill="#f7e2ed" stroke="#ce8cae" stroke-width="1.4"/><text x="70.0" y="274" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="70.0">Seguir expansión, contracción y baja por</tspan><tspan x="70.0" dy="16.5">cohorte</tspan></text><circle cx="450.0" cy="281.5" r="15" fill="#6e2048"/><text x="450.0" y="286.0" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">5</text><text x="40" y="353.0" font-size="11.5" fill="#ac3974" font-weight="700" letter-spacing="1.4">CONCEPTOS Y DÓNDE ACTÚAN EN EL MÉTODO</text><rect x="40.0" y="367.0" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#ce8cae" stroke-width="1.4"/><rect x="40.0" y="375.0" width="5" height="62.2" rx="2" fill="#ac3974"/><text x="56.0" y="389.0" font-size="13.5" fill="#6e2048" font-weight="700" text-anchor="start"><tspan x="56.0">Ingreso recurrente</tspan></text><text x="56.0" y="408.8" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Ingreso comprometido que se repite en periodos sucesivos</tspan><tspan x="56.0" dy="15.2">bajo un contrato vigente</tspan></text><rect x="459.0" y="367.0" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#ce8cae" stroke-width="1.4"/><rect x="459.0" y="375.0" width="5" height="62.2" rx="2" fill="#ac3974"/><text x="475.0" y="389.0" font-size="13.5" fill="#6e2048" font-weight="700" text-anchor="start"><tspan x="475.0">Periodo de recuperación</tspan></text><text x="475.0" y="408.8" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Tiempo necesario para recuperar el costo de adquisición</tspan><tspan x="475.0" dy="15.2">con el margen del cliente</tspan></text><rect x="798.0" y="375.0" width="54" height="20" rx="10" fill="#e5bcd1" stroke="#ce8cae" stroke-width="1"/><text x="825.0" y="389.0" font-size="11" fill="#6e2048" font-weight="700" text-anchor="middle">↔ 2</text><rect x="40.0" y="459.2" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#ce8cae" stroke-width="1.4"/><rect x="40.0" y="467.2" width="5" height="62.2" rx="2" fill="#ac3974"/><text x="56.0" y="481.2" font-size="13.5" fill="#6e2048" font-weight="700" text-anchor="start"><tspan x="56.0">Renovación automática</tspan></text><text x="56.0" y="501.0" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Continuidad del contrato sin acción del cliente, sujeta a</tspan><tspan x="56.0" dy="15.2">deber de información</tspan></text><rect x="379.0" y="467.2" width="54" height="20" rx="10" fill="#e5bcd1" stroke="#ce8cae" stroke-width="1"/><text x="406.0" y="481.2" font-size="11" fill="#6e2048" font-weight="700" text-anchor="middle">↔ 3, 4</text><rect x="459.0" y="459.2" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#ce8cae" stroke-width="1.4"/><rect x="459.0" y="467.2" width="5" height="62.2" rx="2" fill="#ac3974"/><text x="475.0" y="481.2" font-size="13.5" fill="#6e2048" font-weight="700" text-anchor="start"><tspan x="475.0">Contracción</tspan></text><text x="475.0" y="501.0" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Reducción del ingreso de un cliente que permanece activo</tspan></text><rect x="798.0" y="467.2" width="54" height="20" rx="10" fill="#e5bcd1" stroke="#ce8cae" stroke-width="1"/><text x="825.0" y="481.2" font-size="11" fill="#6e2048" font-weight="700" text-anchor="middle">↔ 5</text><text x="40" y="569.36" font-size="11.5" fill="#ac3974" font-weight="700" letter-spacing="1.4">QUÉ SE MIDE: NUMERADOR SOBRE DENOMINADOR</text><rect x="40.0" y="583.4" width="261.3" height="135.9" rx="8" fill="#f7e2ed" stroke="#ce8cae" stroke-width="1.4"/><text x="54.0" y="605.4" font-size="13" fill="#6e2048" font-weight="700" text-anchor="start"><tspan x="54.0">Ingreso recurrente mensual</tspan></text><text x="54.0" y="634.5" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Suma del ingreso comprometido de</tspan><tspan x="54.0" dy="15.2">contratos vigentes, al cierre de</tspan><tspan x="54.0" dy="15.2">cada mes</tspan></text><rect x="319.3" y="583.4" width="261.3" height="135.9" rx="8" fill="#f7e2ed" stroke="#ce8cae" stroke-width="1.4"/><text x="333.3" y="605.4" font-size="13" fill="#6e2048" font-weight="700" text-anchor="start"><tspan x="333.3">Periodo de recuperación</tspan></text><text x="333.3" y="634.5" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="333.3">Costo de adquisición</tspan></text><line x1="333.3" y1="655.7" x2="566.7" y2="655.7" stroke="#ac3974" stroke-width="2"/><text x="333.3" y="673.7" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="333.3">Margen de contribución mensual, por</tspan><tspan x="333.3" dy="15.2">segmento</tspan></text><rect x="598.7" y="583.4" width="261.3" height="135.9" rx="8" fill="#f7e2ed" stroke="#ce8cae" stroke-width="1.4"/><text x="612.7" y="605.4" font-size="13" fill="#6e2048" font-weight="700" text-anchor="start"><tspan x="612.7">Tasa de contracción</tspan></text><text x="612.7" y="634.5" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="612.7">Ingreso perdido por reducciones de</tspan><tspan x="612.7" dy="15.2">plan</tspan></text><line x1="612.7" y1="670.9" x2="846.0" y2="670.9" stroke="#ac3974" stroke-width="2"/><text x="612.7" y="688.9" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="612.7">Ingreso recurrente inicial del</tspan><tspan x="612.7" dy="15.2">periodo</tspan></text><text x="40" y="753.24" font-size="11.5" fill="#ac3974" font-weight="700" letter-spacing="1.4">FRONTERA DE APLICACIÓN</text><rect x="40" y="763.2" width="820" height="65.0" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.4"/><polygon points="70,780.74 52,809.74 88,809.74" fill="#c2410c"/><text x="70" y="806.74" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">!</text><text x="106" y="787.2" font-size="12.5" fill="#7c2d12" font-weight="400" text-anchor="start"><tspan x="106">La renovación automática exige información oportuna y un mecanismo de cancelación equivalente al de</tspan><tspan x="106" dy="16.5">contratación. Dificultar la baja expone a sanción y destruye reputación.</tspan></text><text x="40" y="856.24" font-size="11.5" fill="#ac3974" font-weight="700" letter-spacing="1.4">ERROR FRECUENTE Y SU CORRECCIÓN</text><rect x="40" y="866.2" width="380.0" height="77.0" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/><text x="54" y="888.2" font-size="11" fill="#b91c1c" font-weight="700" text-anchor="start"><tspan x="54">Síntoma</tspan></text><text x="54" y="906.2" font-size="12.5" fill="#7f1d1d" font-weight="400" text-anchor="start"><tspan x="54">Escalar adquisición con periodo de recuperación</tspan><tspan x="54" dy="16.5">mayor que la vida del cliente</tspan></text><line x1="426.0" y1="904.7" x2="469.0" y2="904.7" stroke="#ac3974" stroke-width="2.6" stroke-linecap="round"/><polygon points="474.0,904.7 465.9,908.7 465.9,900.8" fill="#ac3974"/><rect x="480.0" y="866.2" width="380.0" height="77.0" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.4"/><text x="494.0" y="888.2" font-size="11" fill="#15803d" font-weight="700" text-anchor="start"><tspan x="494.0">Corrección</tspan></text><text x="494.0" y="906.2" font-size="12.5" fill="#14532d" font-weight="400" text-anchor="start"><tspan x="494.0">Compara periodo de recuperación con vida media</tspan><tspan x="494.0" dy="16.5">antes de aumentar el gasto comercial.</tspan></text></svg>