<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1464" width="900" height="1464" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif"><title id="t">Modelo mental · Social media</title><desc id="d">Modelo mental de la clase 12.07: Social media. Método en 5 pasos; 8 conceptos; 4 señales de medición.</desc><rect x="0" y="0" width="900" height="1464" rx="14" fill="#ffffff"/><rect x="0" y="0" width="900" height="64" rx="14" fill="#204f6e"/><rect x="0" y="40" width="900" height="24" fill="#204f6e"/><text x="40" y="28" font-size="12" fill="#bcd5e5" font-weight="700" letter-spacing="1.6">MODELO MENTAL · CLASE 12.07 · PARTE 12</text><text x="40" y="52" font-size="21" fill="#ffffff" font-weight="700">Social media</text><text x="40" y="84" font-size="11.5" fill="#397eac" font-weight="700" letter-spacing="1.4">MÉTODO PASO A PASO</text><path d="M66.0,159.0 V202.5 H158.5" fill="none" stroke="#397eac" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="160.5,202.5 151.5,197.5 151.5,207.5" fill="#397eac"/><path d="M188.5,232.0 V275.5 H281.0" fill="none" stroke="#397eac" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="283.0,275.5 274.0,270.5 274.0,280.5" fill="#397eac"/><path d="M311.0,305.0 V348.5 H403.5" fill="none" stroke="#397eac" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="405.5,348.5 396.5,343.5 396.5,353.5" fill="#397eac"/><path d="M433.5,378.0 V421.5 H526.0" fill="none" stroke="#397eac" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="528.0,421.5 519.0,416.5 519.0,426.5" fill="#397eac"/><rect x="40.0" y="100.0" width="330" height="59.0" rx="10" fill="#e2eff7" stroke="#8cb3ce" stroke-width="1.4"/><text x="54.0" y="122.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Definir la función de cada red en el</tspan><tspan x="54.0" dy="16.5">recorrido</tspan></text><circle cx="42.0" cy="102.0" r="14" fill="#204f6e"/><text x="42.0" y="106.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><rect x="162.5" y="173.0" width="330" height="59.0" rx="10" fill="#e2eff7" stroke="#8cb3ce" stroke-width="1.4"/><text x="176.5" y="195.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="176.5">Producir contenido acorde a esa función</tspan></text><circle cx="164.5" cy="175.0" r="14" fill="#204f6e"/><text x="164.5" y="179.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><rect x="285.0" y="246.0" width="330" height="59.0" rx="10" fill="#e2eff7" stroke="#8cb3ce" stroke-width="1.4"/><text x="299.0" y="268.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="299.0">Establecer el protocolo de atención pública</tspan></text><circle cx="287.0" cy="248.0" r="14" fill="#204f6e"/><text x="287.0" y="252.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><rect x="407.5" y="319.0" width="330" height="59.0" rx="10" fill="#e2eff7" stroke="#8cb3ce" stroke-width="1.4"/><text x="421.5" y="341.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="421.5">Medir con indicadores propios de cada</tspan><tspan x="421.5" dy="16.5">función</tspan></text><circle cx="409.5" cy="321.0" r="14" fill="#204f6e"/><text x="409.5" y="325.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">4</text><rect x="530.0" y="392.0" width="330" height="59.0" rx="10" fill="#e2eff7" stroke="#8cb3ce" stroke-width="1.4"/><text x="544.0" y="414.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="544.0">Evaluar la dependencia del alcance orgánico</tspan></text><circle cx="532.0" cy="394.0" r="14" fill="#204f6e"/><text x="532.0" y="398.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">5</text><text x="40" y="493.0" font-size="11.5" fill="#397eac" font-weight="700" letter-spacing="1.4">CONCEPTOS Y DÓNDE ACTÚAN EN EL MÉTODO</text><rect x="40.0" y="507.0" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#8cb3ce" stroke-width="1.4"/><rect x="40.0" y="515.0" width="5" height="62.2" rx="2" fill="#397eac"/><text x="56.0" y="529.0" font-size="13.5" fill="#204f6e" font-weight="700" text-anchor="start"><tspan x="56.0">Función del canal por etapa</tspan></text><text x="56.0" y="548.8" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Papel específico que cumple la red en el recorrido del</tspan><tspan x="56.0" dy="15.2">cliente</tspan></text><rect x="379.0" y="515.0" width="54" height="20" rx="10" fill="#bcd5e5" stroke="#8cb3ce" stroke-width="1"/><text x="406.0" y="529.0" font-size="11" fill="#204f6e" font-weight="700" text-anchor="middle">↔ 1, 2, 4</text><rect x="459.0" y="507.0" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#8cb3ce" stroke-width="1.4"/><rect x="459.0" y="515.0" width="5" height="62.2" rx="2" fill="#397eac"/><text x="475.0" y="529.0" font-size="13.5" fill="#204f6e" font-weight="700" text-anchor="start"><tspan x="475.0">Alcance orgánico</tspan></text><text x="475.0" y="548.8" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Personas alcanzadas sin pago, sujeto a las reglas</tspan><tspan x="475.0" dy="15.2">cambiantes de la plataforma</tspan></text><rect x="798.0" y="515.0" width="54" height="20" rx="10" fill="#bcd5e5" stroke="#8cb3ce" stroke-width="1"/><text x="825.0" y="529.0" font-size="11" fill="#204f6e" font-weight="700" text-anchor="middle">↔ 5</text><rect x="40.0" y="599.2" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#8cb3ce" stroke-width="1.4"/><rect x="40.0" y="607.2" width="5" height="62.2" rx="2" fill="#397eac"/><text x="56.0" y="621.2" font-size="13.5" fill="#204f6e" font-weight="700" text-anchor="start"><tspan x="56.0">Comunidad</tspan></text><text x="56.0" y="641.0" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Grupo de personas con interés común que interactúa entre</tspan><tspan x="56.0" dy="15.2">sí y no sólo con la marca</tspan></text><rect x="459.0" y="599.2" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#8cb3ce" stroke-width="1.4"/><rect x="459.0" y="607.2" width="5" height="62.2" rx="2" fill="#397eac"/><text x="475.0" y="621.2" font-size="13.5" fill="#204f6e" font-weight="700" text-anchor="start"><tspan x="475.0">Atención pública</tspan></text><text x="475.0" y="641.0" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Gestión de consultas y reclamos visibles para terceros</tspan></text><rect x="798.0" y="607.2" width="54" height="20" rx="10" fill="#bcd5e5" stroke="#8cb3ce" stroke-width="1"/><text x="825.0" y="621.2" font-size="11" fill="#204f6e" font-weight="700" text-anchor="middle">↔ 3</text><rect x="40.0" y="691.4" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#8cb3ce" stroke-width="1.4"/><rect x="40.0" y="699.4" width="5" height="62.2" rx="2" fill="#397eac"/><text x="56.0" y="713.4" font-size="13.5" fill="#204f6e" font-weight="700" text-anchor="start"><tspan x="56.0">Moderación</tspan></text><text x="56.0" y="733.2" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Aplicación coherente de reglas de conversación publicadas,</tspan><tspan x="56.0" dy="15.2">sin borrar críticas legítimas</tspan></text><rect x="459.0" y="691.4" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#8cb3ce" stroke-width="1.4"/><rect x="459.0" y="699.4" width="5" height="62.2" rx="2" fill="#397eac"/><text x="475.0" y="713.4" font-size="13.5" fill="#204f6e" font-weight="700" text-anchor="start"><tspan x="475.0">Protocolo de escalamiento</tspan></text><text x="475.0" y="733.2" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Regla que define qué consulta pública pasa a atención,</tspan><tspan x="475.0" dy="15.2">jurídico o dirección y en qué plazo</tspan></text><rect x="798.0" y="699.4" width="54" height="20" rx="10" fill="#bcd5e5" stroke="#8cb3ce" stroke-width="1"/><text x="825.0" y="713.4" font-size="11" fill="#204f6e" font-weight="700" text-anchor="middle">↔ 3</text><rect x="40.0" y="783.5" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#8cb3ce" stroke-width="1.4"/><rect x="40.0" y="791.5" width="5" height="62.2" rx="2" fill="#397eac"/><text x="56.0" y="805.5" font-size="13.5" fill="#204f6e" font-weight="700" text-anchor="start"><tspan x="56.0">Silencio de calendario</tspan></text><text x="56.0" y="825.4" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Suspensión deliberada de publicaciones programadas durante</tspan><tspan x="56.0" dy="15.2">un incidente</tspan></text><rect x="459.0" y="783.5" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#8cb3ce" stroke-width="1.4"/><rect x="459.0" y="791.5" width="5" height="62.2" rx="2" fill="#397eac"/><text x="475.0" y="805.5" font-size="13.5" fill="#204f6e" font-weight="700" text-anchor="start"><tspan x="475.0">Respuesta pública y privada</tspan></text><text x="475.0" y="825.4" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Separación entre lo que se contesta en abierto y lo que se</tspan><tspan x="475.0" dy="15.2">resuelve por un canal con datos personales</tspan></text><rect x="798.0" y="791.5" width="54" height="20" rx="10" fill="#bcd5e5" stroke="#8cb3ce" stroke-width="1"/><text x="825.0" y="805.5" font-size="11" fill="#204f6e" font-weight="700" text-anchor="middle">↔ 3</text><text x="40" y="893.7200000000003" font-size="11.5" fill="#397eac" font-weight="700" letter-spacing="1.4">QUÉ SE MIDE: NUMERADOR SOBRE DENOMINADOR</text><rect x="40.0" y="907.7" width="261.3" height="120.7" rx="8" fill="#e2eff7" stroke="#8cb3ce" stroke-width="1.4"/><text x="54.0" y="929.7" font-size="13" fill="#204f6e" font-weight="700" text-anchor="start"><tspan x="54.0">Alcance y participación por</tspan><tspan x="54.0" dy="17.2">función</tspan></text><text x="54.0" y="976.0" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Alcance e interacciones, segmentados</tspan><tspan x="54.0" dy="15.2">por tipo de contenido y función</tspan></text><rect x="319.3" y="907.7" width="261.3" height="120.7" rx="8" fill="#e2eff7" stroke="#8cb3ce" stroke-width="1.4"/><text x="333.3" y="929.7" font-size="13" fill="#204f6e" font-weight="700" text-anchor="start"><tspan x="333.3">Tiempo de respuesta en atención</tspan><tspan x="333.3" dy="17.2">pública</tspan></text><text x="333.3" y="976.0" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="333.3">Minutos entre la consulta pública y</tspan><tspan x="333.3" dy="15.2">la primera respuesta</tspan></text><rect x="598.7" y="907.7" width="261.3" height="120.7" rx="8" fill="#e2eff7" stroke="#8cb3ce" stroke-width="1.4"/><text x="612.7" y="929.7" font-size="13" fill="#204f6e" font-weight="700" text-anchor="start"><tspan x="612.7">Oportunidades originadas por red</tspan></text><text x="612.7" y="958.9" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="612.7">Oportunidades calificadas atribuidas</tspan><tspan x="612.7" dy="15.2">al canal</tspan></text><line x1="612.7" y1="995.2" x2="846.0" y2="995.2" stroke="#397eac" stroke-width="2"/><text x="612.7" y="1013.2" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="612.7">Oportunidades totales</tspan></text><rect x="40.0" y="1042.4" width="261.3" height="159.7" rx="8" fill="#e2eff7" stroke="#8cb3ce" stroke-width="1.4"/><text x="54.0" y="1064.4" font-size="13" fill="#204f6e" font-weight="700" text-anchor="start"><tspan x="54.0">Tiempo de primera respuesta</tspan><tspan x="54.0" dy="17.2">pública</tspan></text><text x="54.0" y="1110.7" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Minutos desde el comentario hasta la</tspan><tspan x="54.0" dy="15.2">primera respuesta del equipo</tspan></text><line x1="54.0" y1="1147.1" x2="287.3" y2="1147.1" stroke="#397eac" stroke-width="2"/><text x="54.0" y="1165.1" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="54.0">Comentarios que requieren respuesta</tspan></text><text x="54.0" y="1194.3" font-size="10.5" fill="#7b8794" font-weight="400" text-anchor="start"><tspan x="54.0">Ventana: diario y por incidente</tspan></text><text x="40" y="1236.1400000000003" font-size="11.5" fill="#397eac" font-weight="700" letter-spacing="1.4">FRONTERA DE APLICACIÓN</text><rect x="40" y="1246.1" width="820" height="65.0" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.4"/><polygon points="70,1263.6400000000003 52,1292.6400000000003 88,1292.6400000000003" fill="#c2410c"/><text x="70" y="1289.6400000000003" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">!</text><text x="106" y="1270.1" font-size="12.5" fill="#7c2d12" font-weight="400" text-anchor="start"><tspan x="106">La actividad en redes rara vez produce conversión directa en B2B con ciclos largos. Exigirle ventas</tspan><tspan x="106" dy="16.5">atribuibles lleva a abandonar su función real de credibilidad.</tspan></text><text x="40" y="1339.1400000000003" font-size="11.5" fill="#397eac" font-weight="700" letter-spacing="1.4">ERROR FRECUENTE Y SU CORRECCIÓN</text><rect x="40" y="1349.1" width="380.0" height="77.0" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/><text x="54" y="1371.1" font-size="11" fill="#b91c1c" font-weight="700" text-anchor="start"><tspan x="54">Síntoma</tspan></text><text x="54" y="1389.1" font-size="12.5" fill="#7f1d1d" font-weight="400" text-anchor="start"><tspan x="54">Usar redes exclusivamente para publicar ofertas</tspan></text><line x1="426.0" y1="1387.6" x2="469.0" y2="1387.6" stroke="#397eac" stroke-width="2.6" stroke-linecap="round"/><polygon points="474.0,1387.6 465.9,1391.6 465.9,1383.7" fill="#397eac"/><rect x="480.0" y="1349.1" width="380.0" height="77.0" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.4"/><text x="494.0" y="1371.1" font-size="11" fill="#15803d" font-weight="700" text-anchor="start"><tspan x="494.0">Corrección</tspan></text><text x="494.0" y="1389.1" font-size="12.5" fill="#14532d" font-weight="400" text-anchor="start"><tspan x="494.0">Asigna una función por red y mide con indicadores</tspan><tspan x="494.0" dy="16.5">propios de esa función.</tspan></text></svg>