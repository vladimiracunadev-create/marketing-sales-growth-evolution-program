<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1121" width="900" height="1121" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif"><title id="t">Modelo mental · Inteligencia de conversaciones</title><desc id="d">Modelo mental de la clase 21.10: Inteligencia de conversaciones. Método en 5 pasos; 4 conceptos; 3 señales de medición.</desc><rect x="0" y="0" width="900" height="1121" rx="14" fill="#ffffff"/><rect x="0" y="0" width="900" height="64" rx="14" fill="#43206e"/><rect x="0" y="40" width="900" height="24" fill="#43206e"/><text x="40" y="28" font-size="12" fill="#cfbce5" font-weight="700" letter-spacing="1.6">MODELO MENTAL · CLASE 21.10 · PARTE 21</text><text x="40" y="52" font-size="21" fill="#ffffff" font-weight="700">Inteligencia de conversaciones</text><text x="40" y="84" font-size="11.5" fill="#6d39ac" font-weight="700" letter-spacing="1.4">MÉTODO PASO A PASO</text><path d="M66.0,159.0 V202.5 H158.5" fill="none" stroke="#6d39ac" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="160.5,202.5 151.5,197.5 151.5,207.5" fill="#6d39ac"/><path d="M188.5,232.0 V275.5 H281.0" fill="none" stroke="#6d39ac" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="283.0,275.5 274.0,270.5 274.0,280.5" fill="#6d39ac"/><path d="M311.0,305.0 V348.5 H403.5" fill="none" stroke="#6d39ac" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="405.5,348.5 396.5,343.5 396.5,353.5" fill="#6d39ac"/><path d="M433.5,378.0 V421.5 H526.0" fill="none" stroke="#6d39ac" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="528.0,421.5 519.0,416.5 519.0,426.5" fill="#6d39ac"/><rect x="40.0" y="100.0" width="330" height="59.0" rx="10" fill="#ece2f7" stroke="#aa8cce" stroke-width="1.4"/><text x="54.0" y="122.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Verificar el marco legal y obtener</tspan><tspan x="54.0" dy="16.5">consentimiento</tspan></text><circle cx="42.0" cy="102.0" r="14" fill="#43206e"/><text x="42.0" y="106.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><rect x="162.5" y="173.0" width="330" height="59.0" rx="10" fill="#ece2f7" stroke="#aa8cce" stroke-width="1.4"/><text x="176.5" y="195.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="176.5">Definir qué se analizará y para qué</tspan></text><circle cx="164.5" cy="175.0" r="14" fill="#43206e"/><text x="164.5" y="179.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><rect x="285.0" y="246.0" width="330" height="59.0" rx="10" fill="#ece2f7" stroke="#aa8cce" stroke-width="1.4"/><text x="299.0" y="268.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="299.0">Priorizar el análisis agregado sobre el</tspan><tspan x="299.0" dy="16.5">individual</tspan></text><circle cx="287.0" cy="248.0" r="14" fill="#43206e"/><text x="287.0" y="252.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><rect x="407.5" y="319.0" width="330" height="59.0" rx="10" fill="#ece2f7" stroke="#aa8cce" stroke-width="1.4"/><text x="421.5" y="341.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="421.5">Usar los hallazgos para formación y no para</tspan><tspan x="421.5" dy="16.5">sanción</tspan></text><circle cx="409.5" cy="321.0" r="14" fill="#43206e"/><text x="409.5" y="325.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">4</text><rect x="530.0" y="392.0" width="330" height="59.0" rx="10" fill="#ece2f7" stroke="#aa8cce" stroke-width="1.4"/><text x="544.0" y="414.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="544.0">Revisar el efecto sobre el desempeño del</tspan><tspan x="544.0" dy="16.5">equipo</tspan></text><circle cx="532.0" cy="394.0" r="14" fill="#43206e"/><text x="532.0" y="398.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">5</text><text x="40" y="493.0" font-size="11.5" fill="#6d39ac" font-weight="700" letter-spacing="1.4">CONCEPTOS Y DÓNDE ACTÚAN EN EL MÉTODO</text><rect x="40.0" y="507.0" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#aa8cce" stroke-width="1.4"/><rect x="40.0" y="515.0" width="5" height="62.2" rx="2" fill="#6d39ac"/><text x="56.0" y="529.0" font-size="13.5" fill="#43206e" font-weight="700" text-anchor="start"><tspan x="56.0">Consentimiento de grabación</tspan></text><text x="56.0" y="548.8" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Autorización informada de los participantes para registrar</tspan><tspan x="56.0" dy="15.2">la conversación</tspan></text><rect x="379.0" y="515.0" width="54" height="20" rx="10" fill="#cfbce5" stroke="#aa8cce" stroke-width="1"/><text x="406.0" y="529.0" font-size="11" fill="#43206e" font-weight="700" text-anchor="middle">↔ 1</text><rect x="459.0" y="507.0" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#aa8cce" stroke-width="1.4"/><rect x="459.0" y="515.0" width="5" height="62.2" rx="2" fill="#6d39ac"/><text x="475.0" y="529.0" font-size="13.5" fill="#43206e" font-weight="700" text-anchor="start"><tspan x="475.0">Análisis agregado</tspan></text><text x="475.0" y="548.8" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Estudio de patrones del conjunto en lugar de vigilancia</tspan><tspan x="475.0" dy="15.2">individual</tspan></text><rect x="798.0" y="515.0" width="54" height="20" rx="10" fill="#cfbce5" stroke="#aa8cce" stroke-width="1"/><text x="825.0" y="529.0" font-size="11" fill="#43206e" font-weight="700" text-anchor="middle">↔ 2, 3</text><rect x="40.0" y="599.2" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#aa8cce" stroke-width="1.4"/><rect x="40.0" y="607.2" width="5" height="62.2" rx="2" fill="#6d39ac"/><text x="56.0" y="621.2" font-size="13.5" fill="#43206e" font-weight="700" text-anchor="start"><tspan x="56.0">Patrón asociado al resultado</tspan></text><text x="56.0" y="641.0" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Comportamiento conversacional que correlaciona con el</tspan><tspan x="56.0" dy="15.2">cierre</tspan></text><rect x="459.0" y="599.2" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#aa8cce" stroke-width="1.4"/><rect x="459.0" y="607.2" width="5" height="62.2" rx="2" fill="#6d39ac"/><text x="475.0" y="621.2" font-size="13.5" fill="#43206e" font-weight="700" text-anchor="start"><tspan x="475.0">Uso para desarrollo</tspan></text><text x="475.0" y="641.0" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Aplicación orientada a mejorar la habilidad y no a</tspan><tspan x="475.0" dy="15.2">sancionar</tspan></text><text x="40" y="709.3600000000001" font-size="11.5" fill="#6d39ac" font-weight="700" letter-spacing="1.4">QUÉ SE MIDE: NUMERADOR SOBRE DENOMINADOR</text><rect x="40.0" y="723.4" width="261.3" height="135.9" rx="8" fill="#ece2f7" stroke="#aa8cce" stroke-width="1.4"/><text x="54.0" y="745.4" font-size="13" fill="#43206e" font-weight="700" text-anchor="start"><tspan x="54.0">Cobertura de consentimiento</tspan></text><text x="54.0" y="774.5" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Conversaciones grabadas con</tspan><tspan x="54.0" dy="15.2">consentimiento registrado</tspan></text><line x1="54.0" y1="810.9" x2="287.3" y2="810.9" stroke="#6d39ac" stroke-width="2"/><text x="54.0" y="828.9" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="54.0">Grabaciones</tspan></text><rect x="319.3" y="723.4" width="261.3" height="135.9" rx="8" fill="#ece2f7" stroke="#aa8cce" stroke-width="1.4"/><text x="333.3" y="745.4" font-size="13" fill="#43206e" font-weight="700" text-anchor="start"><tspan x="333.3">Patrones identificados</tspan></text><text x="333.3" y="774.5" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="333.3">Comportamientos con correlación</tspan><tspan x="333.3" dy="15.2">verificada con el cierre</tspan></text><line x1="333.3" y1="810.9" x2="566.7" y2="810.9" stroke="#6d39ac" stroke-width="2"/><text x="333.3" y="828.9" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="333.3">Comportamientos analizados en el</tspan><tspan x="333.3" dy="15.2">periodo</tspan></text><rect x="598.7" y="723.4" width="261.3" height="135.9" rx="8" fill="#ece2f7" stroke="#aa8cce" stroke-width="1.4"/><text x="612.7" y="745.4" font-size="13" fill="#43206e" font-weight="700" text-anchor="start"><tspan x="612.7">Uso en formación</tspan></text><text x="612.7" y="774.5" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="612.7">Sesiones de formación basadas en</tspan><tspan x="612.7" dy="15.2">hallazgos, por trimestre</tspan></text><text x="40" y="893.2400000000001" font-size="11.5" fill="#6d39ac" font-weight="700" letter-spacing="1.4">FRONTERA DE APLICACIÓN</text><rect x="40" y="903.2" width="820" height="65.0" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.4"/><polygon points="70,920.7400000000001 52,949.7400000000001 88,949.7400000000001" fill="#c2410c"/><text x="70" y="946.7400000000001" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">!</text><text x="106" y="927.2" font-size="12.5" fill="#7c2d12" font-weight="400" text-anchor="start"><tspan x="106">El análisis conversacional identifica correlaciones, no causas. Imponer un patrón conversacional sin</tspan><tspan x="106" dy="16.5">entender su mecanismo puede empeorar el resultado.</tspan></text><text x="40" y="996.2400000000001" font-size="11.5" fill="#6d39ac" font-weight="700" letter-spacing="1.4">ERROR FRECUENTE Y SU CORRECCIÓN</text><rect x="40" y="1006.2" width="380.0" height="77.0" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/><text x="54" y="1028.2" font-size="11" fill="#b91c1c" font-weight="700" text-anchor="start"><tspan x="54">Síntoma</tspan></text><text x="54" y="1046.2" font-size="12.5" fill="#7f1d1d" font-weight="400" text-anchor="start"><tspan x="54">Grabar sin informar ni obtener consentimiento</tspan></text><line x1="426.0" y1="1044.7" x2="469.0" y2="1044.7" stroke="#6d39ac" stroke-width="2.6" stroke-linecap="round"/><polygon points="474.0,1044.7 465.9,1048.7 465.9,1040.8" fill="#6d39ac"/><rect x="480.0" y="1006.2" width="380.0" height="77.0" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.4"/><text x="494.0" y="1028.2" font-size="11" fill="#15803d" font-weight="700" text-anchor="start"><tspan x="494.0">Corrección</tspan></text><text x="494.0" y="1046.2" font-size="12.5" fill="#14532d" font-weight="400" text-anchor="start"><tspan x="494.0">Verifica el marco legal, informa a todas las partes</tspan><tspan x="494.0" dy="16.5">y obtén el consentimiento antes de grabar.</tspan></text></svg>