<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1359" width="900" height="1359" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif"><title id="t">Modelo mental · Prueba social</title><desc id="d">Modelo mental de la clase 13.12: Prueba social. Método en 5 pasos; 8 conceptos; 4 señales de medición.</desc><rect x="0" y="0" width="900" height="1359" rx="14" fill="#ffffff"/><rect x="0" y="0" width="900" height="64" rx="14" fill="#2e206e"/><rect x="0" y="40" width="900" height="24" fill="#2e206e"/><text x="40" y="28" font-size="12" fill="#c4bce5" font-weight="700" letter-spacing="1.6">MODELO MENTAL · CLASE 13.12 · PARTE 13</text><text x="40" y="52" font-size="21" fill="#ffffff" font-weight="700">Prueba social</text><text x="40" y="84" font-size="11.5" fill="#4e39ac" font-weight="700" letter-spacing="1.4">MÉTODO PASO A PASO</text><line x1="450.0" y1="94.0" x2="450.0" y2="300.5" stroke="#988cce" stroke-width="3" stroke-linecap="round"/><line x1="450.0" y1="129.5" x2="406.0" y2="129.5" stroke="#988cce" stroke-width="2"/><rect x="56.0" y="100" width="350" height="59.0" rx="10" fill="#e6e2f7" stroke="#988cce" stroke-width="1.4"/><text x="70.0" y="122" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="70.0">Seleccionar referentes similares al</tspan><tspan x="70.0" dy="16.5">destinatario</tspan></text><circle cx="450.0" cy="129.5" r="15" fill="#2e206e"/><text x="450.0" y="134.0" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><line x1="450.0" y1="167.5" x2="494.0" y2="167.5" stroke="#988cce" stroke-width="2"/><rect x="494.0" y="138" width="350" height="59.0" rx="10" fill="#e6e2f7" stroke="#988cce" stroke-width="1.4"/><text x="508.0" y="160" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="508.0">Obtener testimonios verificables con</tspan><tspan x="508.0" dy="16.5">autorización</tspan></text><circle cx="450.0" cy="167.5" r="15" fill="#2e206e"/><text x="450.0" y="172.0" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><line x1="450.0" y1="197.2" x2="406.0" y2="197.2" stroke="#988cce" stroke-width="2"/><rect x="56.0" y="176" width="350" height="42.5" rx="10" fill="#e6e2f7" stroke="#988cce" stroke-width="1.4"/><text x="70.0" y="198" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="70.0">Declarar cualquier incentivo entregado</tspan></text><circle cx="450.0" cy="197.2" r="15" fill="#2e206e"/><text x="450.0" y="201.8" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><line x1="450.0" y1="243.5" x2="494.0" y2="243.5" stroke="#988cce" stroke-width="2"/><rect x="494.0" y="214" width="350" height="59.0" rx="10" fill="#e6e2f7" stroke="#988cce" stroke-width="1.4"/><text x="508.0" y="236" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="508.0">Evitar formulaciones que comuniquen baja</tspan><tspan x="508.0" dy="16.5">adopción</tspan></text><circle cx="450.0" cy="243.5" r="15" fill="#2e206e"/><text x="450.0" y="248.0" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">4</text><line x1="450.0" y1="273.2" x2="406.0" y2="273.2" stroke="#988cce" stroke-width="2"/><rect x="56.0" y="252" width="350" height="42.5" rx="10" fill="#e6e2f7" stroke="#988cce" stroke-width="1.4"/><text x="70.0" y="274" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="70.0">Medir el efecto por segmento</tspan></text><circle cx="450.0" cy="273.2" r="15" fill="#2e206e"/><text x="450.0" y="277.8" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">5</text><text x="40" y="336.5" font-size="11.5" fill="#4e39ac" font-weight="700" letter-spacing="1.4">CONCEPTOS Y DÓNDE ACTÚAN EN EL MÉTODO</text><rect x="40.0" y="350.5" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#988cce" stroke-width="1.4"/><rect x="40.0" y="358.5" width="5" height="62.2" rx="2" fill="#4e39ac"/><text x="56.0" y="372.5" font-size="13.5" fill="#2e206e" font-weight="700" text-anchor="start"><tspan x="56.0">Similitud del referente</tspan></text><text x="56.0" y="392.3" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Grado en que quien testimonia se parece al destinatario</tspan><tspan x="56.0" dy="15.2">del mensaje</tspan></text><rect x="379.0" y="358.5" width="54" height="20" rx="10" fill="#c4bce5" stroke="#988cce" stroke-width="1"/><text x="406.0" y="372.5" font-size="11" fill="#2e206e" font-weight="700" text-anchor="middle">↔ 1</text><rect x="459.0" y="350.5" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#988cce" stroke-width="1.4"/><rect x="459.0" y="358.5" width="5" height="62.2" rx="2" fill="#4e39ac"/><text x="475.0" y="372.5" font-size="13.5" fill="#2e206e" font-weight="700" text-anchor="start"><tspan x="475.0">Verificabilidad</tspan></text><text x="475.0" y="392.3" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Posibilidad de que un tercero compruebe que el testimonio</tspan><tspan x="475.0" dy="15.2">es real</tspan></text><rect x="798.0" y="358.5" width="54" height="20" rx="10" fill="#c4bce5" stroke="#988cce" stroke-width="1"/><text x="825.0" y="372.5" font-size="11" fill="#2e206e" font-weight="700" text-anchor="middle">↔ 2</text><rect x="40.0" y="442.7" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#988cce" stroke-width="1.4"/><rect x="40.0" y="450.7" width="5" height="62.2" rx="2" fill="#4e39ac"/><text x="56.0" y="464.7" font-size="13.5" fill="#2e206e" font-weight="700" text-anchor="start"><tspan x="56.0">Prueba social negativa</tspan></text><text x="56.0" y="484.5" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Mensaje que comunica involuntariamente que pocos adoptan</tspan><tspan x="56.0" dy="15.2">la solución</tspan></text><rect x="459.0" y="442.7" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#988cce" stroke-width="1.4"/><rect x="459.0" y="450.7" width="5" height="62.2" rx="2" fill="#4e39ac"/><text x="475.0" y="464.7" font-size="13.5" fill="#2e206e" font-weight="700" text-anchor="start"><tspan x="475.0">Transparencia de incentivos</tspan></text><text x="475.0" y="484.5" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Declaración de si el testimonio fue compensado de alguna</tspan><tspan x="475.0" dy="15.2">forma</tspan></text><rect x="798.0" y="450.7" width="54" height="20" rx="10" fill="#c4bce5" stroke="#988cce" stroke-width="1"/><text x="825.0" y="464.7" font-size="11" fill="#2e206e" font-weight="700" text-anchor="middle">↔ 3</text><rect x="40.0" y="534.9" width="401.0" height="93.4" rx="8" fill="#ffffff" stroke="#988cce" stroke-width="1.4"/><rect x="40.0" y="542.9" width="5" height="77.4" rx="2" fill="#4e39ac"/><text x="56.0" y="556.9" font-size="13.5" fill="#2e206e" font-weight="700" text-anchor="start"><tspan x="56.0">Publicidad engañosa</tspan></text><text x="56.0" y="576.7" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Mensaje comercial que induce a error sobre</tspan><tspan x="56.0" dy="15.2">características, precio, condiciones o resultados de lo</tspan><tspan x="56.0" dy="15.2">ofrecido</tspan></text><rect x="459.0" y="534.9" width="401.0" height="93.4" rx="8" fill="#ffffff" stroke="#988cce" stroke-width="1.4"/><rect x="459.0" y="542.9" width="5" height="77.4" rx="2" fill="#4e39ac"/><text x="475.0" y="556.9" font-size="13.5" fill="#2e206e" font-weight="700" text-anchor="start"><tspan x="475.0">Reseña auténtica</tspan></text><text x="475.0" y="576.7" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Opinión de una persona con experiencia real, sin pago</tspan><tspan x="475.0" dy="15.2">oculto ni incentivo condicionado a su signo</tspan></text><rect x="40.0" y="642.2" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#988cce" stroke-width="1.4"/><rect x="40.0" y="650.2" width="5" height="62.2" rx="2" fill="#4e39ac"/><text x="56.0" y="664.2" font-size="13.5" fill="#2e206e" font-weight="700" text-anchor="start"><tspan x="56.0">Cuenta falsa</tspan></text><text x="56.0" y="684.0" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Perfil que simula identidad o comportamiento orgánico para</tspan><tspan x="56.0" dy="15.2">influir en la percepción</tspan></text><rect x="459.0" y="642.2" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#988cce" stroke-width="1.4"/><rect x="459.0" y="650.2" width="5" height="62.2" rx="2" fill="#4e39ac"/><text x="475.0" y="664.2" font-size="13.5" fill="#2e206e" font-weight="700" text-anchor="start"><tspan x="475.0">Retractación</tspan></text><text x="475.0" y="684.0" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Corrección pública de una afirmación comercial que resultó</tspan><tspan x="475.0" dy="15.2">inexacta</tspan></text><text x="40" y="752.4000000000001" font-size="11.5" fill="#4e39ac" font-weight="700" letter-spacing="1.4">QUÉ SE MIDE: NUMERADOR SOBRE DENOMINADOR</text><rect x="40.0" y="766.4" width="261.3" height="157.7" rx="8" fill="#e6e2f7" stroke="#988cce" stroke-width="1.4"/><text x="54.0" y="788.4" font-size="13" fill="#2e206e" font-weight="700" text-anchor="start"><tspan x="54.0">Efecto de la prueba social</tspan></text><text x="54.0" y="817.6" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Conversiones con testimonio menos</tspan><tspan x="54.0" dy="15.2">conversiones del control</tspan></text><line x1="54.0" y1="853.9" x2="287.3" y2="853.9" stroke="#4e39ac" stroke-width="2"/><text x="54.0" y="871.9" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="54.0">Exposiciones de cada variante</tspan></text><text x="54.0" y="901.1" font-size="10.5" fill="#7b8794" font-weight="400" text-anchor="start"><tspan x="54.0">Ventana: test predefinido</tspan></text><rect x="319.3" y="766.4" width="261.3" height="157.7" rx="8" fill="#e6e2f7" stroke="#988cce" stroke-width="1.4"/><text x="333.3" y="788.4" font-size="13" fill="#2e206e" font-weight="700" text-anchor="start"><tspan x="333.3">Testimonios verificables</tspan></text><text x="333.3" y="817.6" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="333.3">Testimonios con identidad,</tspan><tspan x="333.3" dy="15.2">autorización e incentivo registrado</tspan></text><line x1="333.3" y1="853.9" x2="566.7" y2="853.9" stroke="#4e39ac" stroke-width="2"/><text x="333.3" y="871.9" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="333.3">Testimonios publicados</tspan></text><text x="333.3" y="901.1" font-size="10.5" fill="#7b8794" font-weight="400" text-anchor="start"><tspan x="333.3">Ventana: revisión trimestral</tspan></text><rect x="598.7" y="766.4" width="261.3" height="157.7" rx="8" fill="#e6e2f7" stroke="#988cce" stroke-width="1.4"/><text x="612.7" y="788.4" font-size="13" fill="#2e206e" font-weight="700" text-anchor="start"><tspan x="612.7">Representatividad declarada</tspan></text><text x="612.7" y="817.6" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="612.7">Testimonios que informan si el</tspan><tspan x="612.7" dy="15.2">resultado es típico o excepcional</tspan></text><line x1="612.7" y1="853.9" x2="846.0" y2="853.9" stroke="#4e39ac" stroke-width="2"/><text x="612.7" y="871.9" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="612.7">Testimonios con resultado</tspan><tspan x="612.7" dy="15.2">cuantitativo</tspan></text><text x="612.7" y="916.3" font-size="10.5" fill="#7b8794" font-weight="400" text-anchor="start"><tspan x="612.7">Ventana: ciclo editorial</tspan></text><rect x="40.0" y="938.1" width="261.3" height="159.7" rx="8" fill="#e6e2f7" stroke="#988cce" stroke-width="1.4"/><text x="54.0" y="960.1" font-size="13" fill="#2e206e" font-weight="700" text-anchor="start"><tspan x="54.0">Afirmaciones comerciales con</tspan><tspan x="54.0" dy="17.2">respaldo</tspan></text><text x="54.0" y="1006.5" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Afirmaciones publicadas con fuente</tspan><tspan x="54.0" dy="15.2">archivada</tspan></text><line x1="54.0" y1="1042.8" x2="287.3" y2="1042.8" stroke="#4e39ac" stroke-width="2"/><text x="54.0" y="1060.8" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="54.0">Afirmaciones publicadas</tspan></text><text x="54.0" y="1090.0" font-size="10.5" fill="#7b8794" font-weight="400" text-anchor="start"><tspan x="54.0">Ventana: trimestral</tspan></text><text x="40" y="1131.8600000000001" font-size="11.5" fill="#4e39ac" font-weight="700" letter-spacing="1.4">FRONTERA DE APLICACIÓN</text><rect x="40" y="1141.9" width="820" height="65.0" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.4"/><polygon points="70,1159.3600000000001 52,1188.3600000000001 88,1188.3600000000001" fill="#c2410c"/><text x="70" y="1185.3600000000001" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">!</text><text x="106" y="1165.9" font-size="12.5" fill="#7c2d12" font-weight="400" text-anchor="start"><tspan x="106">En Chile, las reseñas o testimonios falsos y la publicidad encubierta están prohibidas. Los incentivos</tspan><tspan x="106" dy="16.5">entregados deben declararse.</tspan></text><text x="40" y="1234.8600000000001" font-size="11.5" fill="#4e39ac" font-weight="700" letter-spacing="1.4">ERROR FRECUENTE Y SU CORRECCIÓN</text><rect x="40" y="1244.9" width="380.0" height="77.0" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/><text x="54" y="1266.9" font-size="11" fill="#b91c1c" font-weight="700" text-anchor="start"><tspan x="54">Síntoma</tspan></text><text x="54" y="1284.9" font-size="12.5" fill="#7f1d1d" font-weight="400" text-anchor="start"><tspan x="54">Usar testimonios de segmentos distintos al</tspan><tspan x="54" dy="16.5">destinatario</tspan></text><line x1="426.0" y1="1283.4" x2="469.0" y2="1283.4" stroke="#4e39ac" stroke-width="2.6" stroke-linecap="round"/><polygon points="474.0,1283.4 465.9,1287.3 465.9,1279.4" fill="#4e39ac"/><rect x="480.0" y="1244.9" width="380.0" height="77.0" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.4"/><text x="494.0" y="1266.9" font-size="11" fill="#15803d" font-weight="700" text-anchor="start"><tspan x="494.0">Corrección</tspan></text><text x="494.0" y="1284.9" font-size="12.5" fill="#14532d" font-weight="400" text-anchor="start"><tspan x="494.0">Selecciona referentes del mismo rubro y tamaño, con</tspan><tspan x="494.0" dy="16.5">autorización verificable.</tspan></text></svg>