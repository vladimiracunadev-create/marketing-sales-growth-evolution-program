<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1339" width="900" height="1339" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif"><title id="t">Modelo mental · Operating system del CRO</title><desc id="d">Modelo mental de la clase 23.14: Operating system del CRO. Método en 5 pasos; 8 conceptos; 4 señales de medición.</desc><rect x="0" y="0" width="900" height="1339" rx="14" fill="#ffffff"/><rect x="0" y="0" width="900" height="64" rx="14" fill="#6e2120"/><rect x="0" y="40" width="900" height="24" fill="#6e2120"/><text x="40" y="28" font-size="12" fill="#e5bdbc" font-weight="700" letter-spacing="1.6">MODELO MENTAL · CLASE 23.14 · PARTE 23</text><text x="40" y="52" font-size="21" fill="#ffffff" font-weight="700">Operating system del CRO</text><text x="40" y="84" font-size="11.5" fill="#ac3b39" font-weight="700" letter-spacing="1.4">MÉTODO PASO A PASO</text><line x1="450.0" y1="94.0" x2="450.0" y2="317.0" stroke="#ce8d8c" stroke-width="3" stroke-linecap="round"/><line x1="450.0" y1="129.5" x2="406.0" y2="129.5" stroke="#ce8d8c" stroke-width="2"/><rect x="56.0" y="100" width="350" height="59.0" rx="10" fill="#f7e2e2" stroke="#ce8d8c" stroke-width="1.4"/><text x="70.0" y="122" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="70.0">Consolidar estructura, roles y</tspan><tspan x="70.0" dy="16.5">responsabilidades</tspan></text><circle cx="450.0" cy="129.5" r="15" fill="#6e2120"/><text x="450.0" y="134.0" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><line x1="450.0" y1="159.2" x2="494.0" y2="159.2" stroke="#ce8d8c" stroke-width="2"/><rect x="494.0" y="138" width="350" height="42.5" rx="10" fill="#f7e2e2" stroke="#ce8d8c" stroke-width="1.4"/><text x="508.0" y="160" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="508.0">Documentar plan, presupuesto y objetivos</tspan></text><circle cx="450.0" cy="159.2" r="15" fill="#6e2120"/><text x="450.0" y="163.8" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><line x1="450.0" y1="197.2" x2="406.0" y2="197.2" stroke="#ce8d8c" stroke-width="2"/><rect x="56.0" y="176" width="350" height="42.5" rx="10" fill="#f7e2e2" stroke="#ce8d8c" stroke-width="1.4"/><text x="70.0" y="198" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="70.0">Establecer el ritmo de gestión y sus reuniones</tspan></text><circle cx="450.0" cy="197.2" r="15" fill="#6e2120"/><text x="450.0" y="201.8" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><line x1="450.0" y1="235.2" x2="494.0" y2="235.2" stroke="#ce8d8c" stroke-width="2"/><rect x="494.0" y="214" width="350" height="42.5" rx="10" fill="#f7e2e2" stroke="#ce8d8c" stroke-width="1.4"/><text x="508.0" y="236" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="508.0">Definir incentivos, desarrollo y gobierno</tspan></text><circle cx="450.0" cy="235.2" r="15" fill="#6e2120"/><text x="450.0" y="239.8" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">4</text><line x1="450.0" y1="281.5" x2="406.0" y2="281.5" stroke="#ce8d8c" stroke-width="2"/><rect x="56.0" y="252" width="350" height="59.0" rx="10" fill="#f7e2e2" stroke="#ce8d8c" stroke-width="1.4"/><text x="70.0" y="274" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="70.0">Verificar la independencia con una prueba de</tspan><tspan x="70.0" dy="16.5">ausencia</tspan></text><circle cx="450.0" cy="281.5" r="15" fill="#6e2120"/><text x="450.0" y="286.0" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">5</text><text x="40" y="353.0" font-size="11.5" fill="#ac3b39" font-weight="700" letter-spacing="1.4">CONCEPTOS Y DÓNDE ACTÚAN EN EL MÉTODO</text><rect x="40.0" y="367.0" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#ce8d8c" stroke-width="1.4"/><rect x="40.0" y="375.0" width="5" height="62.2" rx="2" fill="#ac3b39"/><text x="56.0" y="389.0" font-size="13.5" fill="#6e2120" font-weight="700" text-anchor="start"><tspan x="56.0">Sistema de dirección</tspan></text><text x="56.0" y="408.8" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Conjunto de estructuras, rutinas e indicadores que</tspan><tspan x="56.0" dy="15.2">gobiernan la función de ingresos</tspan></text><rect x="459.0" y="367.0" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#ce8d8c" stroke-width="1.4"/><rect x="459.0" y="375.0" width="5" height="62.2" rx="2" fill="#ac3b39"/><text x="475.0" y="389.0" font-size="13.5" fill="#6e2120" font-weight="700" text-anchor="start"><tspan x="475.0">Independencia del sistema</tspan></text><text x="475.0" y="408.8" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Capacidad de operar sin intervención permanente de la</tspan><tspan x="475.0" dy="15.2">dirección</tspan></text><rect x="798.0" y="375.0" width="54" height="20" rx="10" fill="#e5bdbc" stroke="#ce8d8c" stroke-width="1"/><text x="825.0" y="389.0" font-size="11" fill="#6e2120" font-weight="700" text-anchor="middle">↔ 5</text><rect x="40.0" y="459.2" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#ce8d8c" stroke-width="1.4"/><rect x="40.0" y="467.2" width="5" height="62.2" rx="2" fill="#ac3b39"/><text x="56.0" y="481.2" font-size="13.5" fill="#6e2120" font-weight="700" text-anchor="start"><tspan x="56.0">Detección temprana</tspan></text><text x="56.0" y="501.0" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Identificación de problemas antes de su efecto financiero</tspan></text><rect x="459.0" y="459.2" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#ce8d8c" stroke-width="1.4"/><rect x="459.0" y="467.2" width="5" height="62.2" rx="2" fill="#ac3b39"/><text x="475.0" y="481.2" font-size="13.5" fill="#6e2120" font-weight="700" text-anchor="start"><tspan x="475.0">Ritmo institucional</tspan></text><text x="475.0" y="501.0" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Calendario de revisiones y decisiones que sostiene la</tspan><tspan x="475.0" dy="15.2">operación</tspan></text><rect x="798.0" y="467.2" width="54" height="20" rx="10" fill="#e5bdbc" stroke="#ce8d8c" stroke-width="1"/><text x="825.0" y="481.2" font-size="11" fill="#6e2120" font-weight="700" text-anchor="middle">↔ 3</text><rect x="40.0" y="551.4" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#ce8d8c" stroke-width="1.4"/><rect x="40.0" y="559.4" width="5" height="62.2" rx="2" fill="#ac3b39"/><text x="56.0" y="573.4" font-size="13.5" fill="#6e2120" font-weight="700" text-anchor="start"><tspan x="56.0">Productividad comercial</tspan></text><text x="56.0" y="593.2" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Resultado de calidad producido por unidad de capacidad y</tspan><tspan x="56.0" dy="15.2">costo, sin trasladar daño a otra etapa</tspan></text><rect x="459.0" y="551.4" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#ce8d8c" stroke-width="1.4"/><rect x="459.0" y="559.4" width="5" height="62.2" rx="2" fill="#ac3b39"/><text x="475.0" y="573.4" font-size="13.5" fill="#6e2120" font-weight="700" text-anchor="start"><tspan x="475.0">Gestión de cartera y territorio</tspan></text><text x="475.0" y="593.2" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Asignación de cuentas, potencial, cobertura y esfuerzo con</tspan><tspan x="475.0" dy="15.2">reglas explícitas</tspan></text><rect x="798.0" y="559.4" width="54" height="20" rx="10" fill="#e5bdbc" stroke="#ce8d8c" stroke-width="1"/><text x="825.0" y="573.4" font-size="11" fill="#6e2120" font-weight="700" text-anchor="middle">↔ 3</text><rect x="40.0" y="643.5" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#ce8d8c" stroke-width="1.4"/><rect x="40.0" y="651.5" width="5" height="62.2" rx="2" fill="#ac3b39"/><text x="56.0" y="665.5" font-size="13.5" fill="#6e2120" font-weight="700" text-anchor="start"><tspan x="56.0">Cuello de botella comercial</tspan></text><text x="56.0" y="685.4" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Restricción que limita el throughput del sistema aunque</tspan><tspan x="56.0" dy="15.2">otras etapas aumenten actividad</tspan></text><rect x="459.0" y="643.5" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#ce8d8c" stroke-width="1.4"/><rect x="459.0" y="651.5" width="5" height="62.2" rx="2" fill="#ac3b39"/><text x="475.0" y="665.5" font-size="13.5" fill="#6e2120" font-weight="700" text-anchor="start"><tspan x="475.0">Forecast accionable</tspan></text><text x="475.0" y="685.4" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Proyección con método, error, sesgo, capacidad y</tspan><tspan x="475.0" dy="15.2">decisiones asociadas</tspan></text><text x="40" y="753.72" font-size="11.5" fill="#ac3b39" font-weight="700" letter-spacing="1.4">QUÉ SE MIDE: NUMERADOR SOBRE DENOMINADOR</text><rect x="40.0" y="767.7" width="261.3" height="137.9" rx="8" fill="#f7e2e2" stroke="#ce8d8c" stroke-width="1.4"/><text x="54.0" y="789.7" font-size="13" fill="#6e2120" font-weight="700" text-anchor="start"><tspan x="54.0">Decisiones tomadas sin</tspan><tspan x="54.0" dy="17.2">escalamiento</tspan></text><text x="54.0" y="836.0" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Decisiones resueltas en el nivel</tspan><tspan x="54.0" dy="15.2">correspondiente</tspan></text><line x1="54.0" y1="872.4" x2="287.3" y2="872.4" stroke="#ac3b39" stroke-width="2"/><text x="54.0" y="890.4" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="54.0">Decisiones tomadas</tspan></text><rect x="319.3" y="767.7" width="261.3" height="137.9" rx="8" fill="#f7e2e2" stroke="#ce8d8c" stroke-width="1.4"/><text x="333.3" y="789.7" font-size="13" fill="#6e2120" font-weight="700" text-anchor="start"><tspan x="333.3">Detección temprana de desvíos</tspan></text><text x="333.3" y="818.9" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="333.3">Desvíos detectados antes del cierre</tspan><tspan x="333.3" dy="15.2">del periodo</tspan></text><line x1="333.3" y1="855.2" x2="566.7" y2="855.2" stroke="#ac3b39" stroke-width="2"/><text x="333.3" y="873.2" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="333.3">Desvíos ocurridos</tspan></text><rect x="598.7" y="767.7" width="261.3" height="137.9" rx="8" fill="#f7e2e2" stroke="#ce8d8c" stroke-width="1.4"/><text x="612.7" y="789.7" font-size="13" fill="#6e2120" font-weight="700" text-anchor="start"><tspan x="612.7">Continuidad ante ausencias</tspan></text><text x="612.7" y="818.9" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="612.7">Cumplimiento de rutinas durante</tspan><tspan x="612.7" dy="15.2">ausencias de la dirección</tspan></text><rect x="40.0" y="919.6" width="261.3" height="157.7" rx="8" fill="#f7e2e2" stroke="#ce8d8c" stroke-width="1.4"/><text x="54.0" y="941.6" font-size="13" fill="#6e2120" font-weight="700" text-anchor="start"><tspan x="54.0">Throughput comercial con calidad</tspan></text><text x="54.0" y="970.7" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Negocios ganados que cumplen margen,</tspan><tspan x="54.0" dy="15.2">perfil y handoff</tspan></text><line x1="54.0" y1="1007.1" x2="287.3" y2="1007.1" stroke="#ac3b39" stroke-width="2"/><text x="54.0" y="1025.1" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="54.0">Capacidad comercial disponible en</tspan><tspan x="54.0" dy="15.2">horas equivalentes</tspan></text><text x="54.0" y="1069.5" font-size="10.5" fill="#7b8794" font-weight="400" text-anchor="start"><tspan x="54.0">Ventana: mes y trimestre por territorio</tspan></text><text x="40" y="1111.3200000000002" font-size="11.5" fill="#ac3b39" font-weight="700" letter-spacing="1.4">FRONTERA DE APLICACIÓN</text><rect x="40" y="1121.3" width="820" height="65.0" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.4"/><polygon points="70,1138.8200000000002 52,1167.8200000000002 88,1167.8200000000002" fill="#c2410c"/><text x="70" y="1164.8200000000002" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">!</text><text x="106" y="1145.3" font-size="12.5" fill="#7c2d12" font-weight="400" text-anchor="start"><tspan x="106">Un sistema de dirección maduro no compensa una estrategia equivocada: ejecuta con disciplina una dirección</tspan><tspan x="106" dy="16.5">que puede ser incorrecta.</tspan></text><text x="40" y="1214.3200000000002" font-size="11.5" fill="#ac3b39" font-weight="700" letter-spacing="1.4">ERROR FRECUENTE Y SU CORRECCIÓN</text><rect x="40" y="1224.3" width="380.0" height="77.0" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/><text x="54" y="1246.3" font-size="11" fill="#b91c1c" font-weight="700" text-anchor="start"><tspan x="54">Síntoma</tspan></text><text x="54" y="1264.3" font-size="12.5" fill="#7f1d1d" font-weight="400" text-anchor="start"><tspan x="54">Escalar el equipo sin corregir el motor comercial</tspan></text><line x1="426.0" y1="1262.8" x2="469.0" y2="1262.8" stroke="#ac3b39" stroke-width="2.6" stroke-linecap="round"/><polygon points="474.0,1262.8 465.9,1266.7 465.9,1258.9" fill="#ac3b39"/><rect x="480.0" y="1224.3" width="380.0" height="77.0" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.4"/><text x="494.0" y="1246.3" font-size="11" fill="#15803d" font-weight="700" text-anchor="start"><tspan x="494.0">Corrección</tspan></text><text x="494.0" y="1264.3" font-size="12.5" fill="#14532d" font-weight="400" text-anchor="start"><tspan x="494.0">Verifica proceso, oferta y retención antes de</tspan><tspan x="494.0" dy="16.5">comprometer contrataciones de escala.</tspan></text></svg>