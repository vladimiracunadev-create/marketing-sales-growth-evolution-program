<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 923" width="900" height="923" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif"><title id="t">Modelo mental · Automatización con propósito</title><desc id="d">Modelo mental de la clase 17.01: Automatización con propósito. Método en 5 pasos; 4 conceptos; 3 señales de medición.</desc><rect x="0" y="0" width="900" height="923" rx="14" fill="#ffffff"/><rect x="0" y="0" width="900" height="64" rx="14" fill="#556e20"/><rect x="0" y="40" width="900" height="24" fill="#556e20"/><text x="40" y="28" font-size="12" fill="#d8e5bc" font-weight="700" letter-spacing="1.6">MODELO MENTAL · CLASE 17.01 · PARTE 17</text><text x="40" y="52" font-size="21" fill="#ffffff" font-weight="700">Automatización con propósito</text><text x="40" y="84" font-size="11.5" fill="#87ac39" font-weight="700" letter-spacing="1.4">MÉTODO PASO A PASO</text><rect x="40.0" y="100" width="246.7" height="59.0" rx="10" fill="#f1f7e2" stroke="#b9ce8c" stroke-width="1.4"/><text x="54.0" y="122" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Documentar el proceso manual y</tspan><tspan x="54.0" dy="16.5">estandarizarlo</tspan></text><circle cx="42.0" cy="102.0" r="14" fill="#556e20"/><text x="42.0" y="106.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><rect x="326.7" y="100" width="246.7" height="59.0" rx="10" fill="#f1f7e2" stroke="#b9ce8c" stroke-width="1.4"/><text x="340.7" y="122" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="340.7">Eliminar pasos innecesarios</tspan><tspan x="340.7" dy="16.5">antes de automatizar</tspan></text><circle cx="328.7" cy="102.0" r="14" fill="#556e20"/><text x="328.7" y="106.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><rect x="613.3" y="100" width="246.7" height="59.0" rx="10" fill="#f1f7e2" stroke="#b9ce8c" stroke-width="1.4"/><text x="627.3" y="122" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="627.3">Identificar los modos de falla y</tspan><tspan x="627.3" dy="16.5">su consecuencia</tspan></text><circle cx="615.3" cy="102.0" r="14" fill="#556e20"/><text x="615.3" y="106.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><rect x="613.3" y="197.0" width="246.7" height="75.5" rx="10" fill="#f1f7e2" stroke="#b9ce8c" stroke-width="1.4"/><text x="627.3" y="219.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="627.3">Instalar detección y alerta</tspan><tspan x="627.3" dy="16.5">antes de activar</tspan></text><circle cx="615.3" cy="199.0" r="14" fill="#556e20"/><text x="615.3" y="203.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">4</text><rect x="326.7" y="197.0" width="246.7" height="75.5" rx="10" fill="#f1f7e2" stroke="#b9ce8c" stroke-width="1.4"/><text x="340.7" y="219.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="340.7">Medir el efecto sobre el</tspan><tspan x="340.7" dy="16.5">resultado y no sólo el ahorro de</tspan><tspan x="340.7" dy="16.5">tiempo</tspan></text><circle cx="328.7" cy="199.0" r="14" fill="#556e20"/><text x="328.7" y="203.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">5</text><line x1="289.7" y1="129.5" x2="318.7" y2="129.5" stroke="#87ac39" stroke-width="2.2" stroke-linecap="round"/><polygon points="323.7,129.5 315.6,133.4 315.6,125.6" fill="#87ac39"/><line x1="576.3" y1="129.5" x2="605.3" y2="129.5" stroke="#87ac39" stroke-width="2.2" stroke-linecap="round"/><polygon points="610.3,129.5 602.2,133.4 602.2,125.6" fill="#87ac39"/><line x1="736.7" y1="161.0" x2="736.7" y2="189.0" stroke="#87ac39" stroke-width="2.2" stroke-linecap="round"/><polygon points="736.7,194.0 732.8,185.9 740.6,185.9" fill="#87ac39"/><line x1="610.3" y1="234.8" x2="581.3" y2="234.8" stroke="#87ac39" stroke-width="2.2" stroke-linecap="round"/><polygon points="576.3,234.8 584.4,230.8 584.4,238.7" fill="#87ac39"/><text x="40" y="310.5" font-size="11.5" fill="#87ac39" font-weight="700" letter-spacing="1.4">CONCEPTOS Y DÓNDE ACTÚAN EN EL MÉTODO</text><rect x="40.0" y="324.5" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#b9ce8c" stroke-width="1.4"/><rect x="40.0" y="332.5" width="5" height="62.2" rx="2" fill="#87ac39"/><text x="56.0" y="346.5" font-size="13.5" fill="#556e20" font-weight="700" text-anchor="start"><tspan x="56.0">Proceso estandarizado</tspan></text><text x="56.0" y="366.3" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Flujo con pasos definidos y resultado consistente antes de</tspan><tspan x="56.0" dy="15.2">ser automatizado</tspan></text><rect x="379.0" y="332.5" width="54" height="20" rx="10" fill="#d8e5bc" stroke="#b9ce8c" stroke-width="1"/><text x="406.0" y="346.5" font-size="11" fill="#556e20" font-weight="700" text-anchor="middle">↔ 1, 2</text><rect x="459.0" y="324.5" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#b9ce8c" stroke-width="1.4"/><rect x="459.0" y="332.5" width="5" height="62.2" rx="2" fill="#87ac39"/><text x="475.0" y="346.5" font-size="13.5" fill="#556e20" font-weight="700" text-anchor="start"><tspan x="475.0">Modo de falla</tspan></text><text x="475.0" y="366.3" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Forma en que la automatización puede producir un resultado</tspan><tspan x="475.0" dy="15.2">incorrecto</tspan></text><rect x="798.0" y="332.5" width="54" height="20" rx="10" fill="#d8e5bc" stroke="#b9ce8c" stroke-width="1"/><text x="825.0" y="346.5" font-size="11" fill="#556e20" font-weight="700" text-anchor="middle">↔ 3</text><rect x="40.0" y="416.7" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#b9ce8c" stroke-width="1.4"/><rect x="40.0" y="424.7" width="5" height="62.2" rx="2" fill="#87ac39"/><text x="56.0" y="438.7" font-size="13.5" fill="#556e20" font-weight="700" text-anchor="start"><tspan x="56.0">Detección de falla</tspan></text><text x="56.0" y="458.5" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Mecanismo que avisa cuando el flujo deja de funcionar como</tspan><tspan x="56.0" dy="15.2">se esperaba</tspan></text><rect x="379.0" y="424.7" width="54" height="20" rx="10" fill="#d8e5bc" stroke="#b9ce8c" stroke-width="1"/><text x="406.0" y="438.7" font-size="11" fill="#556e20" font-weight="700" text-anchor="middle">↔ 3, 4</text><rect x="459.0" y="416.7" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#b9ce8c" stroke-width="1.4"/><rect x="459.0" y="424.7" width="5" height="62.2" rx="2" fill="#87ac39"/><text x="475.0" y="438.7" font-size="13.5" fill="#556e20" font-weight="700" text-anchor="start"><tspan x="475.0">Reversibilidad</tspan></text><text x="475.0" y="458.5" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Capacidad de deshacer o corregir el efecto de una</tspan><tspan x="475.0" dy="15.2">automatización errónea</tspan></text><text x="40" y="526.86" font-size="11.5" fill="#87ac39" font-weight="700" letter-spacing="1.4">QUÉ SE MIDE: NUMERADOR SOBRE DENOMINADOR</text><rect x="40.0" y="540.9" width="261.3" height="120.7" rx="8" fill="#f1f7e2" stroke="#b9ce8c" stroke-width="1.4"/><text x="54.0" y="562.9" font-size="13" fill="#556e20" font-weight="700" text-anchor="start"><tspan x="54.0">Flujos con detección de falla</tspan></text><text x="54.0" y="592.0" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Automatizaciones con alerta</tspan><tspan x="54.0" dy="15.2">configurada</tspan></text><line x1="54.0" y1="628.4" x2="287.3" y2="628.4" stroke="#87ac39" stroke-width="2"/><text x="54.0" y="646.4" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="54.0">Automatizaciones activas</tspan></text><rect x="319.3" y="540.9" width="261.3" height="120.7" rx="8" fill="#f1f7e2" stroke="#b9ce8c" stroke-width="1.4"/><text x="333.3" y="562.9" font-size="13" fill="#556e20" font-weight="700" text-anchor="start"><tspan x="333.3">Incidentes por automatización</tspan></text><text x="333.3" y="592.0" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="333.3">Errores atribuibles a flujos</tspan><tspan x="333.3" dy="15.2">automatizados, por trimestre</tspan></text><rect x="598.7" y="540.9" width="261.3" height="120.7" rx="8" fill="#f1f7e2" stroke="#b9ce8c" stroke-width="1.4"/><text x="612.7" y="562.9" font-size="13" fill="#556e20" font-weight="700" text-anchor="start"><tspan x="612.7">Tiempo ahorrado verificado</tspan></text><text x="612.7" y="592.0" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="612.7">Horas liberadas medidas, comparadas</tspan><tspan x="612.7" dy="15.2">con las estimadas al automatizar</tspan></text><text x="40" y="695.56" font-size="11.5" fill="#87ac39" font-weight="700" letter-spacing="1.4">FRONTERA DE APLICACIÓN</text><rect x="40" y="705.6" width="820" height="65.0" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.4"/><polygon points="70,723.06 52,752.06 88,752.06" fill="#c2410c"/><text x="70" y="749.06" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">!</text><text x="106" y="729.6" font-size="12.5" fill="#7c2d12" font-weight="400" text-anchor="start"><tspan x="106">No todo lo automatizable debe automatizarse: hay interacciones donde el contacto humano es parte del valor</tspan><tspan x="106" dy="16.5">y su reemplazo destruye la relación.</tspan></text><text x="40" y="798.56" font-size="11.5" fill="#87ac39" font-weight="700" letter-spacing="1.4">ERROR FRECUENTE Y SU CORRECCIÓN</text><rect x="40" y="808.6" width="380.0" height="77.0" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/><text x="54" y="830.6" font-size="11" fill="#b91c1c" font-weight="700" text-anchor="start"><tspan x="54">Síntoma</tspan></text><text x="54" y="848.6" font-size="12.5" fill="#7f1d1d" font-weight="400" text-anchor="start"><tspan x="54">Automatizar un proceso sin estandarizarlo antes</tspan></text><line x1="426.0" y1="847.1" x2="469.0" y2="847.1" stroke="#87ac39" stroke-width="2.6" stroke-linecap="round"/><polygon points="474.0,847.1 465.9,851.0 465.9,843.1" fill="#87ac39"/><rect x="480.0" y="808.6" width="380.0" height="77.0" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.4"/><text x="494.0" y="830.6" font-size="11" fill="#15803d" font-weight="700" text-anchor="start"><tspan x="494.0">Corrección</tspan></text><text x="494.0" y="848.6" font-size="12.5" fill="#14532d" font-weight="400" text-anchor="start"><tspan x="494.0">Documenta y simplifica el flujo manual; automatiza</tspan><tspan x="494.0" dy="16.5">sólo cuando el resultado ya es consistente.</tspan></text></svg>