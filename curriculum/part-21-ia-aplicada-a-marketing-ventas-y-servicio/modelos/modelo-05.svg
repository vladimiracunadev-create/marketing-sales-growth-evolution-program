<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1722" width="900" height="1722" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif"><title id="t">Modelo mental · Personalización</title><desc id="d">Modelo mental de la clase 21.05: Personalización. Método en 5 pasos; 8 conceptos; 4 señales de medición.</desc><rect x="0" y="0" width="900" height="1722" rx="14" fill="#ffffff"/><rect x="0" y="0" width="900" height="64" rx="14" fill="#43206e"/><rect x="0" y="40" width="900" height="24" fill="#43206e"/><text x="40" y="28" font-size="12" fill="#cfbce5" font-weight="700" letter-spacing="1.6">MODELO MENTAL · CLASE 21.05 · PARTE 21</text><text x="40" y="52" font-size="21" fill="#ffffff" font-weight="700">Personalización</text><text x="40" y="84" font-size="11.5" fill="#6d39ac" font-weight="700" letter-spacing="1.4">MÉTODO PASO A PASO</text><ellipse cx="450.0" cy="376.8" rx="330.0" ry="233.1" fill="none" stroke="#aa8cce" stroke-width="2" stroke-dasharray="3 8" stroke-linecap="round"/><polygon points="653.8,193.3 636.3,190.4 641.2,180.8" fill="#6d39ac"/><polygon points="759.3,458.8 761.4,441.2 771.2,445.7" fill="#6d39ac"/><polygon points="439.0,609.9 455.9,604.4 455.9,615.3" fill="#6d39ac"/><polygon points="131.6,438.8 143.5,451.9 133.7,456.4" fill="#6d39ac"/><polygon points="265.8,183.2 253.2,195.8 248.3,186.1" fill="#6d39ac"/><circle cx="450.0" cy="376.8" r="100.0" fill="#cfbce5" stroke="#aa8cce" stroke-width="1.6"/><text x="450.0" y="378.9" font-size="15" fill="#43206e" font-weight="700" text-anchor="middle"><tspan x="450.0">Personalización</tspan></text><rect x="361.0" y="106.0" width="178" height="75.5" rx="10" fill="#ece2f7" stroke="#aa8cce" stroke-width="1.4"/><text x="373.0" y="128.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="373.0">Identificar qué datos</tspan><tspan x="373.0" dy="16.5">entregó el cliente</tspan><tspan x="373.0" dy="16.5">conscientemente</tspan></text><circle cx="363.0" cy="108.0" r="14" fill="#43206e"/><text x="363.0" y="112.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><rect x="674.8" y="267.0" width="178" height="75.5" rx="10" fill="#ece2f7" stroke="#aa8cce" stroke-width="1.4"/><text x="686.8" y="289.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="686.8">Verificar la finalidad</tspan><tspan x="686.8" dy="16.5">declarada al</tspan><tspan x="686.8" dy="16.5">recogerlos</tspan></text><circle cx="676.8" cy="269.0" r="14" fill="#43206e"/><text x="676.8" y="273.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><rect x="555.0" y="527.6" width="178" height="75.5" rx="10" fill="#ece2f7" stroke="#aa8cce" stroke-width="1.4"/><text x="567.0" y="549.6" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="567.0">Diseñar la</tspan><tspan x="567.0" dy="16.5">personalización dentro</tspan><tspan x="567.0" dy="16.5">de esa expectativa</tspan></text><circle cx="557.0" cy="529.6" r="14" fill="#43206e"/><text x="557.0" y="534.1" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><rect x="167.0" y="535.8" width="178" height="59.0" rx="10" fill="#ece2f7" stroke="#aa8cce" stroke-width="1.4"/><text x="179.0" y="557.8" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="179.0">Probar la reacción con</tspan><tspan x="179.0" dy="16.5">un grupo pequeño</tspan></text><circle cx="169.0" cy="537.8" r="14" fill="#43206e"/><text x="169.0" y="542.3" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">4</text><rect x="47.2" y="275.3" width="178" height="59.0" rx="10" fill="#ece2f7" stroke="#aa8cce" stroke-width="1.4"/><text x="59.2" y="297.3" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="59.2">Medir efecto en</tspan><tspan x="59.2" dy="16.5">conversión y en bajas</tspan></text><circle cx="49.2" cy="277.3" r="14" fill="#43206e"/><text x="49.2" y="281.8" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">5</text><text x="40" y="689.6" font-size="11.5" fill="#6d39ac" font-weight="700" letter-spacing="1.4">CONCEPTOS Y DÓNDE ACTÚAN EN EL MÉTODO</text><rect x="40.0" y="703.6" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#aa8cce" stroke-width="1.4"/><rect x="40.0" y="711.6" width="5" height="62.2" rx="2" fill="#6d39ac"/><text x="56.0" y="725.6" font-size="13.5" fill="#43206e" font-weight="700" text-anchor="start"><tspan x="56.0">Pertinencia percibida</tspan></text><text x="56.0" y="745.4" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Grado en que el cliente considera útil la adaptación del</tspan><tspan x="56.0" dy="15.2">mensaje</tspan></text><rect x="459.0" y="703.6" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#aa8cce" stroke-width="1.4"/><rect x="459.0" y="711.6" width="5" height="62.2" rx="2" fill="#6d39ac"/><text x="475.0" y="725.6" font-size="13.5" fill="#43206e" font-weight="700" text-anchor="start"><tspan x="475.0">Expectativa de privacidad</tspan></text><text x="475.0" y="745.4" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Supuesto del cliente sobre qué información tiene la</tspan><tspan x="475.0" dy="15.2">empresa y para qué</tspan></text><rect x="798.0" y="711.6" width="54" height="20" rx="10" fill="#cfbce5" stroke="#aa8cce" stroke-width="1"/><text x="825.0" y="725.6" font-size="11" fill="#43206e" font-weight="700" text-anchor="middle">↔ 3</text><rect x="40.0" y="795.8" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#aa8cce" stroke-width="1.4"/><rect x="40.0" y="803.8" width="5" height="62.2" rx="2" fill="#6d39ac"/><text x="56.0" y="817.8" font-size="13.5" fill="#43206e" font-weight="700" text-anchor="start"><tspan x="56.0">Finalidad declarada</tspan></text><text x="56.0" y="837.6" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Uso informado al momento de recoger el dato</tspan></text><rect x="379.0" y="803.8" width="54" height="20" rx="10" fill="#cfbce5" stroke="#aa8cce" stroke-width="1"/><text x="406.0" y="817.8" font-size="11" fill="#43206e" font-weight="700" text-anchor="middle">↔ 2</text><rect x="459.0" y="795.8" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#aa8cce" stroke-width="1.4"/><rect x="459.0" y="803.8" width="5" height="62.2" rx="2" fill="#6d39ac"/><text x="475.0" y="817.8" font-size="13.5" fill="#43206e" font-weight="700" text-anchor="start"><tspan x="475.0">Efecto inquietante</tspan></text><text x="475.0" y="837.6" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Reacción negativa ante una personalización que revela</tspan><tspan x="475.0" dy="15.2">información inesperada</tspan></text><rect x="798.0" y="803.8" width="54" height="20" rx="10" fill="#cfbce5" stroke="#aa8cce" stroke-width="1"/><text x="825.0" y="817.8" font-size="11" fill="#43206e" font-weight="700" text-anchor="middle">↔ 5</text><rect x="40.0" y="888.0" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#aa8cce" stroke-width="1.4"/><rect x="40.0" y="896.0" width="5" height="62.2" rx="2" fill="#6d39ac"/><text x="56.0" y="910.0" font-size="13.5" fill="#43206e" font-weight="700" text-anchor="start"><tspan x="56.0">Personalización contextual</tspan></text><text x="56.0" y="929.8" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Adaptación a situación, canal, etapa o necesidad</tspan><tspan x="56.0" dy="15.2">observable con datos proporcionales</tspan></text><rect x="379.0" y="896.0" width="54" height="20" rx="10" fill="#cfbce5" stroke="#aa8cce" stroke-width="1"/><text x="406.0" y="910.0" font-size="11" fill="#43206e" font-weight="700" text-anchor="middle">↔ 3</text><rect x="459.0" y="888.0" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#aa8cce" stroke-width="1.4"/><rect x="459.0" y="896.0" width="5" height="62.2" rx="2" fill="#6d39ac"/><text x="475.0" y="910.0" font-size="13.5" fill="#43206e" font-weight="700" text-anchor="start"><tspan x="475.0">Hiperpersonalización</tspan></text><text x="475.0" y="929.8" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Adaptación individual de alta granularidad basada en</tspan><tspan x="475.0" dy="15.2">múltiples señales y automatización</tspan></text><rect x="40.0" y="980.1" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#aa8cce" stroke-width="1.4"/><rect x="40.0" y="988.1" width="5" height="62.2" rx="2" fill="#6d39ac"/><text x="56.0" y="1002.1" font-size="13.5" fill="#43206e" font-weight="700" text-anchor="start"><tspan x="56.0">Fatiga de personalización</tspan></text><text x="56.0" y="1022.0" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Caída de respuesta o confianza causada por repetición,</tspan><tspan x="56.0" dy="15.2">intensidad o sensación de vigilancia</tspan></text><rect x="379.0" y="988.1" width="54" height="20" rx="10" fill="#cfbce5" stroke="#aa8cce" stroke-width="1"/><text x="406.0" y="1002.1" font-size="11" fill="#43206e" font-weight="700" text-anchor="middle">↔ 3</text><rect x="459.0" y="980.1" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#aa8cce" stroke-width="1.4"/><rect x="459.0" y="988.1" width="5" height="62.2" rx="2" fill="#6d39ac"/><text x="475.0" y="1002.1" font-size="13.5" fill="#43206e" font-weight="700" text-anchor="start"><tspan x="475.0">Incrementalidad de personalización</tspan></text><text x="475.0" y="1022.0" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Diferencia causal entre resultado con personalización y</tspan><tspan x="475.0" dy="15.2">contrafactual comparable</tspan></text><rect x="798.0" y="988.1" width="54" height="20" rx="10" fill="#cfbce5" stroke="#aa8cce" stroke-width="1"/><text x="825.0" y="1002.1" font-size="11" fill="#43206e" font-weight="700" text-anchor="middle">↔ 3</text><text x="40" y="1090.3200000000002" font-size="11.5" fill="#6d39ac" font-weight="700" letter-spacing="1.4">QUÉ SE MIDE: NUMERADOR SOBRE DENOMINADOR</text><rect x="40.0" y="1104.3" width="261.3" height="137.9" rx="8" fill="#ece2f7" stroke="#aa8cce" stroke-width="1.4"/><text x="54.0" y="1126.3" font-size="13" fill="#43206e" font-weight="700" text-anchor="start"><tspan x="54.0">Efecto en conversión</tspan></text><text x="54.0" y="1155.5" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Diferencia de conversión entre</tspan><tspan x="54.0" dy="15.2">versión personalizada y estándar</tspan></text><rect x="319.3" y="1104.3" width="261.3" height="137.9" rx="8" fill="#ece2f7" stroke="#aa8cce" stroke-width="1.4"/><text x="333.3" y="1126.3" font-size="13" fill="#43206e" font-weight="700" text-anchor="start"><tspan x="333.3">Tasa de baja tras</tspan><tspan x="333.3" dy="17.2">personalización</tspan></text><text x="333.3" y="1172.6" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="333.3">Bajas solicitadas</tspan></text><line x1="333.3" y1="1193.8" x2="566.7" y2="1193.8" stroke="#6d39ac" stroke-width="2"/><text x="333.3" y="1211.8" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="333.3">Destinatarios de la versión</tspan><tspan x="333.3" dy="15.2">personalizada</tspan></text><rect x="598.7" y="1104.3" width="261.3" height="137.9" rx="8" fill="#ece2f7" stroke="#aa8cce" stroke-width="1.4"/><text x="612.7" y="1126.3" font-size="13" fill="#43206e" font-weight="700" text-anchor="start"><tspan x="612.7">Consultas sobre uso de datos</tspan></text><text x="612.7" y="1155.5" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="612.7">Consultas de clientes</tspan></text><line x1="612.7" y1="1176.7" x2="846.0" y2="1176.7" stroke="#6d39ac" stroke-width="2"/><text x="612.7" y="1194.7" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="612.7">El origen de la información, por</tspan><tspan x="612.7" dy="15.2">periodo</tspan></text><rect x="40.0" y="1256.2" width="261.3" height="203.9" rx="8" fill="#ece2f7" stroke="#aa8cce" stroke-width="1.4"/><text x="54.0" y="1278.2" font-size="13" fill="#43206e" font-weight="700" text-anchor="start"><tspan x="54.0">Incrementalidad neta de</tspan><tspan x="54.0" dy="17.2">personalización</tspan></text><text x="54.0" y="1324.5" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Resultado del grupo tratado menos</tspan><tspan x="54.0" dy="15.2">resultado contrafactual, menos costo</tspan><tspan x="54.0" dy="15.2">atribuible</tspan></text><line x1="54.0" y1="1376.0" x2="287.3" y2="1376.0" stroke="#6d39ac" stroke-width="2"/><text x="54.0" y="1394.0" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="54.0">Población elegible o inversión según</tspan><tspan x="54.0" dy="15.2">la decisión</tspan></text><text x="54.0" y="1438.4" font-size="10.5" fill="#7b8794" font-weight="400" text-anchor="start"><tspan x="54.0">Ventana: ventana predefinida por</tspan><tspan x="54.0" dy="13.9">experimento</tspan></text><text x="40" y="1494.1200000000003" font-size="11.5" fill="#6d39ac" font-weight="700" letter-spacing="1.4">FRONTERA DE APLICACIÓN</text><rect x="40" y="1504.1" width="820" height="65.0" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.4"/><polygon points="70,1521.6200000000003 52,1550.6200000000003 88,1550.6200000000003" fill="#c2410c"/><text x="70" y="1547.6200000000003" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">!</text><text x="106" y="1528.1" font-size="12.5" fill="#7c2d12" font-weight="400" text-anchor="start"><tspan x="106">La normativa de datos personales exige finalidad determinada e información al titular. La personalización</tspan><tspan x="106" dy="16.5">basada en inferencias no declaradas es especialmente riesgosa.</tspan></text><text x="40" y="1597.1200000000003" font-size="11.5" fill="#6d39ac" font-weight="700" letter-spacing="1.4">ERROR FRECUENTE Y SU CORRECCIÓN</text><rect x="40" y="1607.1" width="380.0" height="77.0" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/><text x="54" y="1629.1" font-size="11" fill="#b91c1c" font-weight="700" text-anchor="start"><tspan x="54">Síntoma</tspan></text><text x="54" y="1647.1" font-size="12.5" fill="#7f1d1d" font-weight="400" text-anchor="start"><tspan x="54">Personalizar con datos fuera de la finalidad</tspan><tspan x="54" dy="16.5">declarada</tspan></text><line x1="426.0" y1="1645.6" x2="469.0" y2="1645.6" stroke="#6d39ac" stroke-width="2.6" stroke-linecap="round"/><polygon points="474.0,1645.6 465.9,1649.5 465.9,1641.7" fill="#6d39ac"/><rect x="480.0" y="1607.1" width="380.0" height="77.0" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.4"/><text x="494.0" y="1629.1" font-size="11" fill="#15803d" font-weight="700" text-anchor="start"><tspan x="494.0">Corrección</tspan></text><text x="494.0" y="1647.1" font-size="12.5" fill="#14532d" font-weight="400" text-anchor="start"><tspan x="494.0">Limita la personalización a datos entregados</tspan><tspan x="494.0" dy="16.5">conscientemente y para el uso informado.</tspan></text></svg>