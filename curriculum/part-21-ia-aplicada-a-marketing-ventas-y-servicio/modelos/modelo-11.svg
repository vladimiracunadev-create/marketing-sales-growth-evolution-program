<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1304" width="900" height="1304" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif"><title id="t">Modelo mental · IA en customer success</title><desc id="d">Modelo mental de la clase 21.11: IA en customer success. Método en 5 pasos; 4 conceptos; 3 señales de medición.</desc><rect x="0" y="0" width="900" height="1304" rx="14" fill="#ffffff"/><rect x="0" y="0" width="900" height="64" rx="14" fill="#43206e"/><rect x="0" y="40" width="900" height="24" fill="#43206e"/><text x="40" y="28" font-size="12" fill="#cfbce5" font-weight="700" letter-spacing="1.6">MODELO MENTAL · CLASE 21.11 · PARTE 21</text><text x="40" y="52" font-size="21" fill="#ffffff" font-weight="700">IA en customer success</text><text x="40" y="84" font-size="11.5" fill="#6d39ac" font-weight="700" letter-spacing="1.4">MÉTODO PASO A PASO</text><ellipse cx="450.0" cy="376.8" rx="330.0" ry="233.1" fill="none" stroke="#aa8cce" stroke-width="2" stroke-dasharray="3 8" stroke-linecap="round"/><polygon points="653.8,193.3 636.3,190.4 641.2,180.8" fill="#6d39ac"/><polygon points="759.3,458.8 761.4,441.2 771.2,445.7" fill="#6d39ac"/><polygon points="439.0,609.9 455.9,604.4 455.9,615.3" fill="#6d39ac"/><polygon points="131.6,438.8 143.5,451.9 133.7,456.4" fill="#6d39ac"/><polygon points="265.8,183.2 253.2,195.8 248.3,186.1" fill="#6d39ac"/><circle cx="450.0" cy="376.8" r="100.0" fill="#cfbce5" stroke="#aa8cce" stroke-width="1.6"/><text x="450.0" y="369.0" font-size="15" fill="#43206e" font-weight="700" text-anchor="middle"><tspan x="450.0">IA en customer</tspan><tspan x="450.0" dy="19.8">success</tspan></text><rect x="361.0" y="114.2" width="178" height="59.0" rx="10" fill="#ece2f7" stroke="#aa8cce" stroke-width="1.4"/><text x="373.0" y="136.2" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="373.0">Usar modelos para</tspan><tspan x="373.0" dy="16.5">predecir y priorizar</tspan></text><circle cx="363.0" cy="116.2" r="14" fill="#43206e"/><text x="363.0" y="120.8" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><rect x="674.8" y="267.0" width="178" height="75.5" rx="10" fill="#ece2f7" stroke="#aa8cce" stroke-width="1.4"/><text x="686.8" y="289.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="686.8">Definir el momento de</tspan><tspan x="686.8" dy="16.5">escalamiento a una</tspan><tspan x="686.8" dy="16.5">persona</tspan></text><circle cx="676.8" cy="269.0" r="14" fill="#43206e"/><text x="676.8" y="273.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><rect x="555.0" y="527.6" width="178" height="75.5" rx="10" fill="#ece2f7" stroke="#aa8cce" stroke-width="1.4"/><text x="567.0" y="549.6" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="567.0">Mantener humana la</tspan><tspan x="567.0" dy="16.5">conversación de riesgo</tspan><tspan x="567.0" dy="16.5">o reclamo</tspan></text><circle cx="557.0" cy="529.6" r="14" fill="#43206e"/><text x="557.0" y="534.1" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><rect x="167.0" y="527.6" width="178" height="75.5" rx="10" fill="#ece2f7" stroke="#aa8cce" stroke-width="1.4"/><text x="179.0" y="549.6" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="179.0">Medir efecto en</tspan><tspan x="179.0" dy="16.5">retención y en</tspan><tspan x="179.0" dy="16.5">satisfacción</tspan></text><circle cx="169.0" cy="529.6" r="14" fill="#43206e"/><text x="169.0" y="534.1" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">4</text><rect x="47.2" y="267.0" width="178" height="75.5" rx="10" fill="#ece2f7" stroke="#aa8cce" stroke-width="1.4"/><text x="59.2" y="289.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="59.2">Revisar los casos</tspan><tspan x="59.2" dy="16.5">escalados para</tspan><tspan x="59.2" dy="16.5">corregir el diseño</tspan></text><circle cx="49.2" cy="269.0" r="14" fill="#43206e"/><text x="49.2" y="273.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">5</text><text x="40" y="689.6" font-size="11.5" fill="#6d39ac" font-weight="700" letter-spacing="1.4">CONCEPTOS Y DÓNDE ACTÚAN EN EL MÉTODO</text><rect x="40.0" y="703.6" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#aa8cce" stroke-width="1.4"/><rect x="40.0" y="711.6" width="5" height="62.2" rx="2" fill="#6d39ac"/><text x="56.0" y="725.6" font-size="13.5" fill="#43206e" font-weight="700" text-anchor="start"><tspan x="56.0">Predicción de riesgo</tspan></text><text x="56.0" y="745.4" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Estimación automatizada de la probabilidad de baja de una</tspan><tspan x="56.0" dy="15.2">cuenta</tspan></text><rect x="379.0" y="711.6" width="54" height="20" rx="10" fill="#cfbce5" stroke="#aa8cce" stroke-width="1"/><text x="406.0" y="725.6" font-size="11" fill="#43206e" font-weight="700" text-anchor="middle">↔ 3</text><rect x="459.0" y="703.6" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#aa8cce" stroke-width="1.4"/><rect x="459.0" y="711.6" width="5" height="62.2" rx="2" fill="#6d39ac"/><text x="475.0" y="725.6" font-size="13.5" fill="#43206e" font-weight="700" text-anchor="start"><tspan x="475.0">Priorización de cartera</tspan></text><text x="475.0" y="745.4" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Ordenamiento de cuentas por riesgo y valor para asignar</tspan><tspan x="475.0" dy="15.2">atención</tspan></text><rect x="798.0" y="711.6" width="54" height="20" rx="10" fill="#cfbce5" stroke="#aa8cce" stroke-width="1"/><text x="825.0" y="725.6" font-size="11" fill="#43206e" font-weight="700" text-anchor="middle">↔ 1</text><rect x="40.0" y="795.8" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#aa8cce" stroke-width="1.4"/><rect x="40.0" y="803.8" width="5" height="62.2" rx="2" fill="#6d39ac"/><text x="56.0" y="817.8" font-size="13.5" fill="#43206e" font-weight="700" text-anchor="start"><tspan x="56.0">Automatización de la respuesta</tspan></text><text x="56.0" y="837.6" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Sustitución de la interacción humana por un sistema</tspan></text><rect x="459.0" y="795.8" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#aa8cce" stroke-width="1.4"/><rect x="459.0" y="803.8" width="5" height="62.2" rx="2" fill="#6d39ac"/><text x="475.0" y="817.8" font-size="13.5" fill="#43206e" font-weight="700" text-anchor="start"><tspan x="475.0">Momento de escalamiento</tspan></text><text x="475.0" y="837.6" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Condición que obliga a que una persona tome la</tspan><tspan x="475.0" dy="15.2">conversación</tspan></text><rect x="798.0" y="803.8" width="54" height="20" rx="10" fill="#cfbce5" stroke="#aa8cce" stroke-width="1"/><text x="825.0" y="817.8" font-size="11" fill="#43206e" font-weight="700" text-anchor="middle">↔ 2, 5</text><text x="40" y="905.96" font-size="11.5" fill="#6d39ac" font-weight="700" letter-spacing="1.4">QUÉ SE MIDE: NUMERADOR SOBRE DENOMINADOR</text><rect x="40.0" y="920.0" width="261.3" height="122.7" rx="8" fill="#ece2f7" stroke="#aa8cce" stroke-width="1.4"/><text x="54.0" y="942.0" font-size="13" fill="#43206e" font-weight="700" text-anchor="start"><tspan x="54.0">Precisión de la predicción de</tspan><tspan x="54.0" dy="17.2">baja</tspan></text><text x="54.0" y="988.3" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Bajas correctamente anticipadas</tspan></text><line x1="54.0" y1="1009.5" x2="287.3" y2="1009.5" stroke="#6d39ac" stroke-width="2"/><text x="54.0" y="1027.5" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="54.0">Bajas del periodo</tspan></text><rect x="319.3" y="920.0" width="261.3" height="122.7" rx="8" fill="#ece2f7" stroke="#aa8cce" stroke-width="1.4"/><text x="333.3" y="942.0" font-size="13" fill="#43206e" font-weight="700" text-anchor="start"><tspan x="333.3">Tasa de escalamiento a persona</tspan></text><text x="333.3" y="971.1" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="333.3">Conversaciones derivadas a un humano</tspan></text><line x1="333.3" y1="992.3" x2="566.7" y2="992.3" stroke="#6d39ac" stroke-width="2"/><text x="333.3" y="1010.3" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="333.3">Conversaciones iniciadas</tspan></text><rect x="598.7" y="920.0" width="261.3" height="122.7" rx="8" fill="#ece2f7" stroke="#aa8cce" stroke-width="1.4"/><text x="612.7" y="942.0" font-size="13" fill="#43206e" font-weight="700" text-anchor="start"><tspan x="612.7">Satisfacción por tipo de</tspan><tspan x="612.7" dy="17.2">atención</tspan></text><text x="612.7" y="988.3" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="612.7">Puntuación comparada entre atención</tspan><tspan x="612.7" dy="15.2">automatizada y humana</tspan></text><text x="40" y="1076.64" font-size="11.5" fill="#6d39ac" font-weight="700" letter-spacing="1.4">FRONTERA DE APLICACIÓN</text><rect x="40" y="1086.6" width="820" height="65.0" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.4"/><polygon points="70,1104.14 52,1133.14 88,1133.14" fill="#c2410c"/><text x="70" y="1130.14" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">!</text><text x="106" y="1110.6" font-size="12.5" fill="#7c2d12" font-weight="400" text-anchor="start"><tspan x="106">Un modelo predictivo sin capacidad de intervención sólo anticipa la pérdida. La predicción debe estar</tspan><tspan x="106" dy="16.5">acompañada de una acción posible y de capacidad para ejecutarla.</tspan></text><text x="40" y="1179.64" font-size="11.5" fill="#6d39ac" font-weight="700" letter-spacing="1.4">ERROR FRECUENTE Y SU CORRECCIÓN</text><rect x="40" y="1189.6" width="380.0" height="77.0" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/><text x="54" y="1211.6" font-size="11" fill="#b91c1c" font-weight="700" text-anchor="start"><tspan x="54">Síntoma</tspan></text><text x="54" y="1229.6" font-size="12.5" fill="#7f1d1d" font-weight="400" text-anchor="start"><tspan x="54">Automatizar la conversación con clientes en riesgo</tspan></text><line x1="426.0" y1="1228.1" x2="469.0" y2="1228.1" stroke="#6d39ac" stroke-width="2.6" stroke-linecap="round"/><polygon points="474.0,1228.1 465.9,1232.1 465.9,1224.2" fill="#6d39ac"/><rect x="480.0" y="1189.6" width="380.0" height="77.0" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.4"/><text x="494.0" y="1211.6" font-size="11" fill="#15803d" font-weight="700" text-anchor="start"><tspan x="494.0">Corrección</tspan></text><text x="494.0" y="1229.6" font-size="12.5" fill="#14532d" font-weight="400" text-anchor="start"><tspan x="494.0">Define el escalamiento obligatorio a una persona</tspan><tspan x="494.0" dy="16.5">ante señales de frustración o de riesgo.</tspan></text></svg>