<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1005" width="900" height="1005" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif"><title id="t">Modelo mental · Necesidades, deseos, demanda y valor</title><desc id="d">Modelo mental de la clase 01.02: Necesidades, deseos, demanda y valor. Método en 5 pasos; 4 conceptos; 3 señales de medición.</desc><rect x="0" y="0" width="900" height="1005" rx="14" fill="#ffffff"/><rect x="0" y="0" width="900" height="64" rx="14" fill="#6e5d20"/><rect x="0" y="40" width="900" height="24" fill="#6e5d20"/><text x="40" y="28" font-size="12" fill="#e5dcbc" font-weight="700" letter-spacing="1.6">MODELO MENTAL · CLASE 01.02 · PARTE 01</text><text x="40" y="52" font-size="21" fill="#ffffff" font-weight="700">Necesidades, deseos, demanda y valor</text><text x="40" y="84" font-size="11.5" fill="#ac9339" font-weight="700" letter-spacing="1.4">MÉTODO PASO A PASO</text><rect x="40.0" y="100" width="246.7" height="75.5" rx="10" fill="#f7f3e2" stroke="#cebf8c" stroke-width="1.4"/><text x="54.0" y="122" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Describir la carencia en las</tspan><tspan x="54.0" dy="16.5">palabras del cliente y no en las</tspan><tspan x="54.0" dy="16.5">del producto</tspan></text><circle cx="42.0" cy="102.0" r="14" fill="#6e5d20"/><text x="42.0" y="106.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><rect x="326.7" y="100" width="246.7" height="75.5" rx="10" fill="#f7f3e2" stroke="#cebf8c" stroke-width="1.4"/><text x="340.7" y="122" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="340.7">Identificar la alternativa real</tspan><tspan x="340.7" dy="16.5">contra la que se compara,</tspan><tspan x="340.7" dy="16.5">incluido no hacer nada</tspan></text><circle cx="328.7" cy="102.0" r="14" fill="#6e5d20"/><text x="328.7" y="106.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><rect x="613.3" y="100" width="246.7" height="75.5" rx="10" fill="#f7f3e2" stroke="#cebf8c" stroke-width="1.4"/><text x="627.3" y="122" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="627.3">Verificar si existe presupuesto</tspan><tspan x="627.3" dy="16.5">y quién lo controla</tspan></text><circle cx="615.3" cy="102.0" r="14" fill="#6e5d20"/><text x="615.3" y="106.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><rect x="613.3" y="213.5" width="246.7" height="75.5" rx="10" fill="#f7f3e2" stroke="#cebf8c" stroke-width="1.4"/><text x="627.3" y="235.5" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="627.3">Cuantificar beneficio y costo</tspan><tspan x="627.3" dy="16.5">total de cambio</tspan></text><circle cx="615.3" cy="215.5" r="14" fill="#6e5d20"/><text x="615.3" y="220.0" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">4</text><rect x="326.7" y="213.5" width="246.7" height="75.5" rx="10" fill="#f7f3e2" stroke="#cebf8c" stroke-width="1.4"/><text x="340.7" y="235.5" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="340.7">Declarar qué evidencia</tspan><tspan x="340.7" dy="16.5">convertiría el deseo en demanda</tspan><tspan x="340.7" dy="16.5">medible</tspan></text><circle cx="328.7" cy="215.5" r="14" fill="#6e5d20"/><text x="328.7" y="220.0" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">5</text><line x1="289.7" y1="137.8" x2="318.7" y2="137.8" stroke="#ac9339" stroke-width="2.2" stroke-linecap="round"/><polygon points="323.7,137.8 315.6,141.7 315.6,133.8" fill="#ac9339"/><line x1="576.3" y1="137.8" x2="605.3" y2="137.8" stroke="#ac9339" stroke-width="2.2" stroke-linecap="round"/><polygon points="610.3,137.8 602.2,141.7 602.2,133.8" fill="#ac9339"/><line x1="736.7" y1="177.5" x2="736.7" y2="205.5" stroke="#ac9339" stroke-width="2.2" stroke-linecap="round"/><polygon points="736.7,210.5 732.8,202.4 740.6,202.4" fill="#ac9339"/><line x1="610.3" y1="251.2" x2="581.3" y2="251.2" stroke="#ac9339" stroke-width="2.2" stroke-linecap="round"/><polygon points="576.3,251.2 584.4,247.3 584.4,255.2" fill="#ac9339"/><text x="40" y="327.0" font-size="11.5" fill="#ac9339" font-weight="700" letter-spacing="1.4">CONCEPTOS Y DÓNDE ACTÚAN EN EL MÉTODO</text><rect x="40.0" y="341.0" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#cebf8c" stroke-width="1.4"/><rect x="40.0" y="349.0" width="5" height="62.2" rx="2" fill="#ac9339"/><text x="56.0" y="363.0" font-size="13.5" fill="#6e5d20" font-weight="700" text-anchor="start"><tspan x="56.0">Necesidad</tspan></text><text x="56.0" y="382.8" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Estado de carencia funcional, social o emocional que</tspan><tspan x="56.0" dy="15.2">existe con independencia de la oferta</tspan></text><rect x="459.0" y="341.0" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#cebf8c" stroke-width="1.4"/><rect x="459.0" y="349.0" width="5" height="62.2" rx="2" fill="#ac9339"/><text x="475.0" y="363.0" font-size="13.5" fill="#6e5d20" font-weight="700" text-anchor="start"><tspan x="475.0">Demanda</tspan></text><text x="475.0" y="382.8" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Deseo específico respaldado por presupuesto asignado y</tspan><tspan x="475.0" dy="15.2">autoridad para gastarlo</tspan></text><rect x="798.0" y="349.0" width="54" height="20" rx="10" fill="#e5dcbc" stroke="#cebf8c" stroke-width="1"/><text x="825.0" y="363.0" font-size="11" fill="#6e5d20" font-weight="700" text-anchor="middle">↔ 5</text><rect x="40.0" y="433.2" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#cebf8c" stroke-width="1.4"/><rect x="40.0" y="441.2" width="5" height="62.2" rx="2" fill="#ac9339"/><text x="56.0" y="455.2" font-size="13.5" fill="#6e5d20" font-weight="700" text-anchor="start"><tspan x="56.0">Valor percibido</tspan></text><text x="56.0" y="475.0" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Juicio del cliente sobre beneficio menos costo total,</tspan><tspan x="56.0" dy="15.2">siempre relativo a una alternativa concreta</tspan></text><rect x="379.0" y="441.2" width="54" height="20" rx="10" fill="#e5dcbc" stroke="#cebf8c" stroke-width="1"/><text x="406.0" y="455.2" font-size="11" fill="#6e5d20" font-weight="700" text-anchor="middle">↔ 4</text><rect x="459.0" y="433.2" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#cebf8c" stroke-width="1.4"/><rect x="459.0" y="441.2" width="5" height="62.2" rx="2" fill="#ac9339"/><text x="475.0" y="455.2" font-size="13.5" fill="#6e5d20" font-weight="700" text-anchor="start"><tspan x="475.0">Costo de cambio</tspan></text><text x="475.0" y="475.0" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Esfuerzo, riesgo y pérdida temporal que asume el cliente</tspan><tspan x="475.0" dy="15.2">al abandonar su solución actual</tspan></text><rect x="798.0" y="441.2" width="54" height="20" rx="10" fill="#e5dcbc" stroke="#cebf8c" stroke-width="1"/><text x="825.0" y="455.2" font-size="11" fill="#6e5d20" font-weight="700" text-anchor="middle">↔ 4</text><text x="40" y="543.36" font-size="11.5" fill="#ac9339" font-weight="700" letter-spacing="1.4">QUÉ SE MIDE: NUMERADOR SOBRE DENOMINADOR</text><rect x="40.0" y="557.4" width="261.3" height="153.0" rx="8" fill="#f7f3e2" stroke="#cebf8c" stroke-width="1.4"/><text x="54.0" y="579.4" font-size="13" fill="#6e5d20" font-weight="700" text-anchor="start"><tspan x="54.0">Tasa de conversión de interés a</tspan><tspan x="54.0" dy="17.2">presupuesto</tspan></text><text x="54.0" y="625.7" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Oportunidades con presupuesto</tspan><tspan x="54.0" dy="15.2">confirmado</tspan></text><line x1="54.0" y1="662.0" x2="287.3" y2="662.0" stroke="#ac9339" stroke-width="2"/><text x="54.0" y="680.0" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="54.0">Oportunidades que declararon</tspan><tspan x="54.0" dy="15.2">interés, por trimestre</tspan></text><rect x="319.3" y="557.4" width="261.3" height="153.0" rx="8" fill="#f7f3e2" stroke="#cebf8c" stroke-width="1.4"/><text x="333.3" y="579.4" font-size="13" fill="#6e5d20" font-weight="700" text-anchor="start"><tspan x="333.3">Costo de cambio declarado</tspan></text><text x="333.3" y="608.5" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="333.3">Horas de migración y capacitación</tspan><tspan x="333.3" dy="15.2">estimadas por el cliente, recogidas</tspan><tspan x="333.3" dy="15.2">en discovery y contrastadas con la</tspan><tspan x="333.3" dy="15.2">implementación real</tspan></text><rect x="598.7" y="557.4" width="261.3" height="153.0" rx="8" fill="#f7f3e2" stroke="#cebf8c" stroke-width="1.4"/><text x="612.7" y="579.4" font-size="13" fill="#6e5d20" font-weight="700" text-anchor="start"><tspan x="612.7">Razón de pérdida por inacción</tspan></text><text x="612.7" y="608.5" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="612.7">Negocios perdidos ante «no hacer</tspan><tspan x="612.7" dy="15.2">nada»</tspan></text><line x1="612.7" y1="644.9" x2="846.0" y2="644.9" stroke="#ac9339" stroke-width="2"/><text x="612.7" y="662.9" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="612.7">Total de negocios perdidos</tspan></text><text x="40" y="744.4000000000001" font-size="11.5" fill="#ac9339" font-weight="700" letter-spacing="1.4">FRONTERA DE APLICACIÓN</text><rect x="40" y="754.4" width="820" height="81.5" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.4"/><polygon points="70,780.1500000000001 52,809.1500000000001 88,809.1500000000001" fill="#c2410c"/><text x="70" y="806.1500000000001" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">!</text><text x="106" y="778.4" font-size="12.5" fill="#7c2d12" font-weight="400" text-anchor="start"><tspan x="106">El valor percibido no es manipulable de forma indefinida: se puede comunicar mejor un beneficio real, pero</tspan><tspan x="106" dy="16.5">inflar la percepción por encima de la experiencia produce churn y reclamos, y en Chile puede constituir</tspan><tspan x="106" dy="16.5">publicidad engañosa.</tspan></text><text x="40" y="863.9000000000001" font-size="11.5" fill="#ac9339" font-weight="700" letter-spacing="1.4">ERROR FRECUENTE Y SU CORRECCIÓN</text><rect x="40" y="873.9" width="380.0" height="93.5" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/><text x="54" y="895.9" font-size="11" fill="#b91c1c" font-weight="700" text-anchor="start"><tspan x="54">Síntoma</tspan></text><text x="54" y="913.9" font-size="12.5" fill="#7f1d1d" font-weight="400" text-anchor="start"><tspan x="54">Tratar «interés» como demanda en el forecast</tspan></text><line x1="426.0" y1="920.7" x2="469.0" y2="920.7" stroke="#ac9339" stroke-width="2.6" stroke-linecap="round"/><polygon points="474.0,920.7 465.9,924.6 465.9,916.7" fill="#ac9339"/><rect x="480.0" y="873.9" width="380.0" height="93.5" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.4"/><text x="494.0" y="895.9" font-size="11" fill="#15803d" font-weight="700" text-anchor="start"><tspan x="494.0">Corrección</tspan></text><text x="494.0" y="913.9" font-size="12.5" fill="#14532d" font-weight="400" text-anchor="start"><tspan x="494.0">Exige presupuesto identificado y decisor nombrado</tspan><tspan x="494.0" dy="16.5">antes de mover una oportunidad a etapa</tspan><tspan x="494.0" dy="16.5">comprometida.</tspan></text></svg>