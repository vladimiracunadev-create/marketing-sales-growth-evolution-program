<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1106" width="900" height="1106" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif"><title id="t">Modelo mental · Oferta, demanda y captura de valor</title><desc id="d">Modelo mental de la clase 01.06: Oferta, demanda y captura de valor. Método en 5 pasos; 4 conceptos; 3 señales de medición.</desc><rect x="0" y="0" width="900" height="1106" rx="14" fill="#ffffff"/><rect x="0" y="0" width="900" height="64" rx="14" fill="#6e5d20"/><rect x="0" y="40" width="900" height="24" fill="#6e5d20"/><text x="40" y="28" font-size="12" fill="#e5dcbc" font-weight="700" letter-spacing="1.6">MODELO MENTAL · CLASE 01.06 · PARTE 01</text><text x="40" y="52" font-size="21" fill="#ffffff" font-weight="700">Oferta, demanda y captura de valor</text><text x="40" y="84" font-size="11.5" fill="#ac9339" font-weight="700" letter-spacing="1.4">MÉTODO PASO A PASO</text><path d="M66.0,159.0 V202.5 H158.5" fill="none" stroke="#ac9339" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="160.5,202.5 151.5,197.5 151.5,207.5" fill="#ac9339"/><path d="M188.5,232.0 V275.5 H281.0" fill="none" stroke="#ac9339" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="283.0,275.5 274.0,270.5 274.0,280.5" fill="#ac9339"/><path d="M311.0,305.0 V348.5 H403.5" fill="none" stroke="#ac9339" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="405.5,348.5 396.5,343.5 396.5,353.5" fill="#ac9339"/><path d="M433.5,378.0 V421.5 H526.0" fill="none" stroke="#ac9339" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="528.0,421.5 519.0,416.5 519.0,426.5" fill="#ac9339"/><rect x="40.0" y="100.0" width="330" height="59.0" rx="10" fill="#f7f3e2" stroke="#cebf8c" stroke-width="1.4"/><text x="54.0" y="122.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Estimar disposición a pagar del segmento con</tspan><tspan x="54.0" dy="16.5">evidencia y no con intuición</tspan></text><circle cx="42.0" cy="102.0" r="14" fill="#6e5d20"/><text x="42.0" y="106.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><rect x="162.5" y="173.0" width="330" height="59.0" rx="10" fill="#f7f3e2" stroke="#cebf8c" stroke-width="1.4"/><text x="176.5" y="195.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="176.5">Calcular el costo de servir completo,</tspan><tspan x="176.5" dy="16.5">incluida la posventa</tspan></text><circle cx="164.5" cy="175.0" r="14" fill="#6e5d20"/><text x="164.5" y="179.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><rect x="285.0" y="246.0" width="330" height="59.0" rx="10" fill="#f7f3e2" stroke="#cebf8c" stroke-width="1.4"/><text x="299.0" y="268.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="299.0">Identificar quién más se lleva parte del</tspan><tspan x="299.0" dy="16.5">excedente en la cadena</tspan></text><circle cx="287.0" cy="248.0" r="14" fill="#6e5d20"/><text x="287.0" y="252.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><rect x="407.5" y="319.0" width="330" height="59.0" rx="10" fill="#f7f3e2" stroke="#cebf8c" stroke-width="1.4"/><text x="421.5" y="341.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="421.5">Evaluar qué cambio en la oferta modifica la</tspan><tspan x="421.5" dy="16.5">disposición a pagar</tspan></text><circle cx="409.5" cy="321.0" r="14" fill="#6e5d20"/><text x="409.5" y="325.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">4</text><rect x="530.0" y="392.0" width="330" height="59.0" rx="10" fill="#f7f3e2" stroke="#cebf8c" stroke-width="1.4"/><text x="544.0" y="414.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="544.0">Elegir una palanca de captura y medir su</tspan><tspan x="544.0" dy="16.5">efecto en margen y volumen</tspan></text><circle cx="532.0" cy="394.0" r="14" fill="#6e5d20"/><text x="532.0" y="398.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">5</text><text x="40" y="493.0" font-size="11.5" fill="#ac9339" font-weight="700" letter-spacing="1.4">CONCEPTOS Y DÓNDE ACTÚAN EN EL MÉTODO</text><rect x="40.0" y="507.0" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#cebf8c" stroke-width="1.4"/><rect x="40.0" y="515.0" width="5" height="62.2" rx="2" fill="#ac9339"/><text x="56.0" y="529.0" font-size="13.5" fill="#6e5d20" font-weight="700" text-anchor="start"><tspan x="56.0">Valor creado</tspan></text><text x="56.0" y="548.8" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Diferencia entre la disposición a pagar del cliente y el</tspan><tspan x="56.0" dy="15.2">costo de proveer el servicio</tspan></text><rect x="379.0" y="515.0" width="54" height="20" rx="10" fill="#e5dcbc" stroke="#cebf8c" stroke-width="1"/><text x="406.0" y="529.0" font-size="11" fill="#6e5d20" font-weight="700" text-anchor="middle">↔ 1, 2, 4</text><rect x="459.0" y="507.0" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#cebf8c" stroke-width="1.4"/><rect x="459.0" y="515.0" width="5" height="62.2" rx="2" fill="#ac9339"/><text x="475.0" y="529.0" font-size="13.5" fill="#6e5d20" font-weight="700" text-anchor="start"><tspan x="475.0">Valor capturado</tspan></text><text x="475.0" y="548.8" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Parte del valor creado que se convierte en margen para la</tspan><tspan x="475.0" dy="15.2">empresa</tspan></text><rect x="798.0" y="515.0" width="54" height="20" rx="10" fill="#e5dcbc" stroke="#cebf8c" stroke-width="1"/><text x="825.0" y="529.0" font-size="11" fill="#6e5d20" font-weight="700" text-anchor="middle">↔ 5</text><rect x="40.0" y="599.2" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#cebf8c" stroke-width="1.4"/><rect x="40.0" y="607.2" width="5" height="62.2" rx="2" fill="#ac9339"/><text x="56.0" y="621.2" font-size="13.5" fill="#6e5d20" font-weight="700" text-anchor="start"><tspan x="56.0">Poder de negociación</tspan></text><text x="56.0" y="641.0" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Capacidad de una parte de imponer condiciones por la</tspan><tspan x="56.0" dy="15.2">escasez de alternativas de la otra</tspan></text><rect x="459.0" y="599.2" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#cebf8c" stroke-width="1.4"/><rect x="459.0" y="607.2" width="5" height="62.2" rx="2" fill="#ac9339"/><text x="475.0" y="621.2" font-size="13.5" fill="#6e5d20" font-weight="700" text-anchor="start"><tspan x="475.0">Excedente del cliente</tspan></text><text x="475.0" y="641.0" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Diferencia entre lo que el cliente habría pagado y lo que</tspan><tspan x="475.0" dy="15.2">efectivamente pagó</tspan></text><rect x="798.0" y="607.2" width="54" height="20" rx="10" fill="#e5dcbc" stroke="#cebf8c" stroke-width="1"/><text x="825.0" y="621.2" font-size="11" fill="#6e5d20" font-weight="700" text-anchor="middle">↔ 3</text><text x="40" y="709.3600000000001" font-size="11.5" fill="#ac9339" font-weight="700" letter-spacing="1.4">QUÉ SE MIDE: NUMERADOR SOBRE DENOMINADOR</text><rect x="40.0" y="723.4" width="261.3" height="120.7" rx="8" fill="#f7f3e2" stroke="#cebf8c" stroke-width="1.4"/><text x="54.0" y="745.4" font-size="13" fill="#6e5d20" font-weight="700" text-anchor="start"><tspan x="54.0">Margen de contribución por</tspan><tspan x="54.0" dy="17.2">cliente</tspan></text><text x="54.0" y="791.7" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Ingreso menos costos variables de</tspan><tspan x="54.0" dy="15.2">servir, incluida atención y</tspan><tspan x="54.0" dy="15.2">comisiones, por cliente y por mes</tspan></text><rect x="319.3" y="723.4" width="261.3" height="120.7" rx="8" fill="#f7f3e2" stroke="#cebf8c" stroke-width="1.4"/><text x="333.3" y="745.4" font-size="13" fill="#6e5d20" font-weight="700" text-anchor="start"><tspan x="333.3">Brecha entre precio de lista y</tspan><tspan x="333.3" dy="17.2">precio efectivo</tspan></text><text x="333.3" y="791.7" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="333.3">Descuento promedio ponderado por</tspan><tspan x="333.3" dy="15.2">ingreso, por segmento y trimestre</tspan></text><rect x="598.7" y="723.4" width="261.3" height="120.7" rx="8" fill="#f7f3e2" stroke="#cebf8c" stroke-width="1.4"/><text x="612.7" y="745.4" font-size="13" fill="#6e5d20" font-weight="700" text-anchor="start"><tspan x="612.7">Costo de servir por segmento</tspan></text><text x="612.7" y="774.5" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="612.7">Horas de soporte e implementación</tspan><tspan x="612.7" dy="15.2">valorizadas</tspan></text><line x1="612.7" y1="810.9" x2="846.0" y2="810.9" stroke="#ac9339" stroke-width="2"/><text x="612.7" y="828.9" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="612.7">Clientes activos del segmento</tspan></text><text x="40" y="878.0600000000002" font-size="11.5" fill="#ac9339" font-weight="700" letter-spacing="1.4">FRONTERA DE APLICACIÓN</text><rect x="40" y="888.1" width="820" height="65.0" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.4"/><polygon points="70,905.5600000000002 52,934.5600000000002 88,934.5600000000002" fill="#c2410c"/><text x="70" y="931.5600000000002" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">!</text><text x="106" y="912.1" font-size="12.5" fill="#7c2d12" font-weight="400" text-anchor="start"><tspan x="106">Maximizar la captura a corto plazo puede destruir la relación. En mercados pequeños y conectados como el</tspan><tspan x="106" dy="16.5">chileno, un cliente que siente haber sido exprimido no vuelve y además lo comenta.</tspan></text><text x="40" y="981.0600000000002" font-size="11.5" fill="#ac9339" font-weight="700" letter-spacing="1.4">ERROR FRECUENTE Y SU CORRECCIÓN</text><rect x="40" y="991.1" width="380.0" height="77.0" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/><text x="54" y="1013.1" font-size="11" fill="#b91c1c" font-weight="700" text-anchor="start"><tspan x="54">Síntoma</tspan></text><text x="54" y="1031.1" font-size="12.5" fill="#7f1d1d" font-weight="400" text-anchor="start"><tspan x="54">Confundir precio alto con captura de valor</tspan></text><line x1="426.0" y1="1029.6" x2="469.0" y2="1029.6" stroke="#ac9339" stroke-width="2.6" stroke-linecap="round"/><polygon points="474.0,1029.6 465.9,1033.5 465.9,1025.6" fill="#ac9339"/><rect x="480.0" y="991.1" width="380.0" height="77.0" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.4"/><text x="494.0" y="1013.1" font-size="11" fill="#15803d" font-weight="700" text-anchor="start"><tspan x="494.0">Corrección</tspan></text><text x="494.0" y="1031.1" font-size="12.5" fill="#14532d" font-weight="400" text-anchor="start"><tspan x="494.0">Compara margen de contribución por segmento, no</tspan><tspan x="494.0" dy="16.5">precio de lista, antes de declarar rentabilidad.</tspan></text></svg>