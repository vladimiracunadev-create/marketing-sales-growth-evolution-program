<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1108" width="900" height="1108" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif"><title id="t">Modelo mental · Higiene de datos</title><desc id="d">Modelo mental de la clase 16.05: Higiene de datos. Método en 5 pasos; 4 conceptos; 3 señales de medición.</desc><rect x="0" y="0" width="900" height="1108" rx="14" fill="#ffffff"/><rect x="0" y="0" width="900" height="64" rx="14" fill="#6e4a20"/><rect x="0" y="40" width="900" height="24" fill="#6e4a20"/><text x="40" y="28" font-size="12" fill="#e5d2bc" font-weight="700" letter-spacing="1.6">MODELO MENTAL · CLASE 16.05 · PARTE 16</text><text x="40" y="52" font-size="21" fill="#ffffff" font-weight="700">Higiene de datos</text><text x="40" y="84" font-size="11.5" fill="#ac7639" font-weight="700" letter-spacing="1.4">MÉTODO PASO A PASO</text><path d="M66.0,159.0 V202.5 H158.5" fill="none" stroke="#ac7639" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="160.5,202.5 151.5,197.5 151.5,207.5" fill="#ac7639"/><path d="M188.5,232.0 V275.5 H281.0" fill="none" stroke="#ac7639" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="283.0,275.5 274.0,270.5 274.0,280.5" fill="#ac7639"/><path d="M311.0,305.0 V348.5 H403.5" fill="none" stroke="#ac7639" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="405.5,348.5 396.5,343.5 396.5,353.5" fill="#ac7639"/><path d="M433.5,378.0 V421.5 H526.0" fill="none" stroke="#ac7639" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="528.0,421.5 519.0,416.5 519.0,426.5" fill="#ac7639"/><rect x="40.0" y="100.0" width="330" height="59.0" rx="10" fill="#f7ede2" stroke="#ceaf8c" stroke-width="1.4"/><text x="54.0" y="122.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Medir el estado actual de completitud y</tspan><tspan x="54.0" dy="16.5">exactitud</tspan></text><circle cx="42.0" cy="102.0" r="14" fill="#6e4a20"/><text x="42.0" y="106.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><rect x="162.5" y="173.0" width="330" height="59.0" rx="10" fill="#f7ede2" stroke="#ceaf8c" stroke-width="1.4"/><text x="176.5" y="195.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="176.5">Establecer rutinas de deduplicación y</tspan><tspan x="176.5" dy="16.5">verificación</tspan></text><circle cx="164.5" cy="175.0" r="14" fill="#6e4a20"/><text x="164.5" y="179.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><rect x="285.0" y="246.0" width="330" height="59.0" rx="10" fill="#f7ede2" stroke="#ceaf8c" stroke-width="1.4"/><text x="299.0" y="268.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="299.0">Definir la política de retención y</tspan><tspan x="299.0" dy="16.5">eliminación</tspan></text><circle cx="287.0" cy="248.0" r="14" fill="#6e4a20"/><text x="287.0" y="252.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><rect x="407.5" y="319.0" width="330" height="59.0" rx="10" fill="#f7ede2" stroke="#ceaf8c" stroke-width="1.4"/><text x="421.5" y="341.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="421.5">Asignar responsables por tipo de dato</tspan></text><circle cx="409.5" cy="321.0" r="14" fill="#6e4a20"/><text x="409.5" y="325.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">4</text><rect x="530.0" y="392.0" width="330" height="59.0" rx="10" fill="#f7ede2" stroke="#ceaf8c" stroke-width="1.4"/><text x="544.0" y="414.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="544.0">Reportar el estado de la base cada trimestre</tspan></text><circle cx="532.0" cy="394.0" r="14" fill="#6e4a20"/><text x="532.0" y="398.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">5</text><text x="40" y="493.0" font-size="11.5" fill="#ac7639" font-weight="700" letter-spacing="1.4">CONCEPTOS Y DÓNDE ACTÚAN EN EL MÉTODO</text><rect x="40.0" y="507.0" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#ceaf8c" stroke-width="1.4"/><rect x="40.0" y="515.0" width="5" height="62.2" rx="2" fill="#ac7639"/><text x="56.0" y="529.0" font-size="13.5" fill="#6e4a20" font-weight="700" text-anchor="start"><tspan x="56.0">Degradación de datos</tspan></text><text x="56.0" y="548.8" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Pérdida progresiva de vigencia de la información de</tspan><tspan x="56.0" dy="15.2">contacto</tspan></text><rect x="459.0" y="507.0" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#ceaf8c" stroke-width="1.4"/><rect x="459.0" y="515.0" width="5" height="62.2" rx="2" fill="#ac7639"/><text x="475.0" y="529.0" font-size="13.5" fill="#6e4a20" font-weight="700" text-anchor="start"><tspan x="475.0">Deduplicación</tspan></text><text x="475.0" y="548.8" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Proceso de identificar y consolidar registros repetidos</tspan></text><rect x="798.0" y="515.0" width="54" height="20" rx="10" fill="#e5d2bc" stroke="#ceaf8c" stroke-width="1"/><text x="825.0" y="529.0" font-size="11" fill="#6e4a20" font-weight="700" text-anchor="middle">↔ 2</text><rect x="40.0" y="599.2" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#ceaf8c" stroke-width="1.4"/><rect x="40.0" y="607.2" width="5" height="62.2" rx="2" fill="#ac7639"/><text x="56.0" y="621.2" font-size="13.5" fill="#6e4a20" font-weight="700" text-anchor="start"><tspan x="56.0">Exactitud</tspan></text><text x="56.0" y="641.0" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Correspondencia entre el dato registrado y la realidad</tspan><tspan x="56.0" dy="15.2">actual</tspan></text><rect x="379.0" y="607.2" width="54" height="20" rx="10" fill="#e5d2bc" stroke="#ceaf8c" stroke-width="1"/><text x="406.0" y="621.2" font-size="11" fill="#6e4a20" font-weight="700" text-anchor="middle">↔ 1</text><rect x="459.0" y="599.2" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#ceaf8c" stroke-width="1.4"/><rect x="459.0" y="607.2" width="5" height="62.2" rx="2" fill="#ac7639"/><text x="475.0" y="621.2" font-size="13.5" fill="#6e4a20" font-weight="700" text-anchor="start"><tspan x="475.0">Retención de datos</tspan></text><text x="475.0" y="641.0" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Periodo durante el cual se conserva la información según</tspan><tspan x="475.0" dy="15.2">su finalidad</tspan></text><rect x="798.0" y="607.2" width="54" height="20" rx="10" fill="#e5d2bc" stroke="#ceaf8c" stroke-width="1"/><text x="825.0" y="621.2" font-size="11" fill="#6e4a20" font-weight="700" text-anchor="middle">↔ 3</text><text x="40" y="709.3600000000001" font-size="11.5" fill="#ac7639" font-weight="700" letter-spacing="1.4">QUÉ SE MIDE: NUMERADOR SOBRE DENOMINADOR</text><rect x="40.0" y="723.4" width="261.3" height="122.7" rx="8" fill="#f7ede2" stroke="#ceaf8c" stroke-width="1.4"/><text x="54.0" y="745.4" font-size="13" fill="#6e4a20" font-weight="700" text-anchor="start"><tspan x="54.0">Tasa de datos obsoletos</tspan></text><text x="54.0" y="774.5" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Registros con rebote o contacto</tspan><tspan x="54.0" dy="15.2">fallido</tspan></text><line x1="54.0" y1="810.9" x2="287.3" y2="810.9" stroke="#ac7639" stroke-width="2"/><text x="54.0" y="828.9" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="54.0">Registros contactados</tspan></text><rect x="319.3" y="723.4" width="261.3" height="122.7" rx="8" fill="#f7ede2" stroke="#ceaf8c" stroke-width="1.4"/><text x="333.3" y="745.4" font-size="13" fill="#6e4a20" font-weight="700" text-anchor="start"><tspan x="333.3">Duplicados por trimestre</tspan></text><text x="333.3" y="774.5" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="333.3">Duplicados detectados y</tspan><tspan x="333.3" dy="15.2">consolidados, por trimestre</tspan></text><rect x="598.7" y="723.4" width="261.3" height="122.7" rx="8" fill="#f7ede2" stroke="#ceaf8c" stroke-width="1.4"/><text x="612.7" y="745.4" font-size="13" fill="#6e4a20" font-weight="700" text-anchor="start"><tspan x="612.7">Cumplimiento de la política de</tspan><tspan x="612.7" dy="17.2">retención</tspan></text><text x="612.7" y="791.7" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="612.7">Registros eliminados según política</tspan></text><line x1="612.7" y1="812.9" x2="846.0" y2="812.9" stroke="#ac7639" stroke-width="2"/><text x="612.7" y="830.9" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="612.7">Registros que la cumplían</tspan></text><text x="40" y="880.0400000000002" font-size="11.5" fill="#ac7639" font-weight="700" letter-spacing="1.4">FRONTERA DE APLICACIÓN</text><rect x="40" y="890.0" width="820" height="65.0" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.4"/><polygon points="70,907.5400000000002 52,936.5400000000002 88,936.5400000000002" fill="#c2410c"/><text x="70" y="933.5400000000002" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">!</text><text x="106" y="914.0" font-size="12.5" fill="#7c2d12" font-weight="400" text-anchor="start"><tspan x="106">La eliminación de datos puede entrar en tensión con obligaciones de conservación tributaria o contractual.</tspan><tspan x="106" dy="16.5">La política debe distinguir tipos de dato y finalidad.</tspan></text><text x="40" y="983.0400000000002" font-size="11.5" fill="#ac7639" font-weight="700" letter-spacing="1.4">ERROR FRECUENTE Y SU CORRECCIÓN</text><rect x="40" y="993.0" width="380.0" height="77.0" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/><text x="54" y="1015.0" font-size="11" fill="#b91c1c" font-weight="700" text-anchor="start"><tspan x="54">Síntoma</tspan></text><text x="54" y="1033.0" font-size="12.5" fill="#7f1d1d" font-weight="400" text-anchor="start"><tspan x="54">No eliminar datos tras una solicitud del titular</tspan></text><line x1="426.0" y1="1031.5" x2="469.0" y2="1031.5" stroke="#ac7639" stroke-width="2.6" stroke-linecap="round"/><polygon points="474.0,1031.5 465.9,1035.5 465.9,1027.6" fill="#ac7639"/><rect x="480.0" y="993.0" width="380.0" height="77.0" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.4"/><text x="494.0" y="1015.0" font-size="11" fill="#15803d" font-weight="700" text-anchor="start"><tspan x="494.0">Corrección</tspan></text><text x="494.0" y="1033.0" font-size="12.5" fill="#14532d" font-weight="400" text-anchor="start"><tspan x="494.0">Implementa un procedimiento verificable de</tspan><tspan x="494.0" dy="16.5">eliminación con plazo y registro de cumplimiento.</tspan></text></svg>