<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1400" width="900" height="1400" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif"><title id="t">Modelo mental · Análisis de competencia</title><desc id="d">Modelo mental de la clase 03.10: Análisis de competencia. Método en 5 pasos; 8 conceptos; 4 señales de medición.</desc><rect x="0" y="0" width="900" height="1400" rx="14" fill="#ffffff"/><rect x="0" y="0" width="900" height="64" rx="14" fill="#206e3b"/><rect x="0" y="40" width="900" height="24" fill="#206e3b"/><text x="40" y="28" font-size="12" fill="#bce5ca" font-weight="700" letter-spacing="1.6">MODELO MENTAL · CLASE 03.10 · PARTE 03</text><text x="40" y="52" font-size="21" fill="#ffffff" font-weight="700">Análisis de competencia</text><text x="40" y="84" font-size="11.5" fill="#39ac61" font-weight="700" letter-spacing="1.4">MÉTODO PASO A PASO</text><line x1="450.0" y1="94.0" x2="450.0" y2="347.0" stroke="#8ccea3" stroke-width="3" stroke-linecap="round"/><line x1="450.0" y1="129.5" x2="406.0" y2="129.5" stroke="#8ccea3" stroke-width="2"/><rect x="56.0" y="100" width="350" height="59.0" rx="10" fill="#e2f7e9" stroke="#8ccea3" stroke-width="1.4"/><text x="70.0" y="122" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="70.0">Delimitar categoría e inventariar competidores</tspan><tspan x="70.0" dy="16.5">directos, sustitutos y no hacer nada</tspan></text><circle cx="450.0" cy="129.5" r="15" fill="#206e3b"/><text x="450.0" y="134.0" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><line x1="450.0" y1="168.0" x2="494.0" y2="168.0" stroke="#8ccea3" stroke-width="2"/><rect x="494.0" y="138" width="350" height="75.5" rx="10" fill="#e2f7e9" stroke="#8ccea3" stroke-width="1.4"/><text x="508.0" y="160" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="508.0">Aplicar la matriz reproducible de propuesta,</tspan><tspan x="508.0" dy="16.5">segmento, posicionamiento, precio, packaging,</tspan><tspan x="508.0" dy="16.5">canal y experiencia</tspan></text><circle cx="450.0" cy="168.0" r="15" fill="#206e3b"/><text x="450.0" y="172.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><line x1="450.0" y1="206.0" x2="406.0" y2="206.0" stroke="#8ccea3" stroke-width="2"/><rect x="56.0" y="176" width="350" height="75.5" rx="10" fill="#e2f7e9" stroke="#8ccea3" stroke-width="1.4"/><text x="70.0" y="198" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="70.0">Etiquetar cada celda como dato, estimación,</tspan><tspan x="70.0" dy="16.5">hipótesis o inferencia y registrar fuente y</tspan><tspan x="70.0" dy="16.5">fecha</tspan></text><circle cx="450.0" cy="206.0" r="15" fill="#206e3b"/><text x="450.0" y="210.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><line x1="450.0" y1="257.0" x2="494.0" y2="257.0" stroke="#8ccea3" stroke-width="2"/><rect x="494.0" y="227.5" width="350" height="59.0" rx="10" fill="#e2f7e9" stroke="#8ccea3" stroke-width="1.4"/><text x="508.0" y="249.5" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="508.0">Inferir fortalezas, debilidades y movimientos</tspan><tspan x="508.0" dy="16.5">probables sólo desde patrones observables</tspan></text><circle cx="450.0" cy="257.0" r="15" fill="#206e3b"/><text x="450.0" y="261.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">4</text><line x1="450.0" y1="295.5" x2="406.0" y2="295.5" stroke="#8ccea3" stroke-width="2"/><rect x="56.0" y="265.5" width="350" height="75.5" rx="10" fill="#e2f7e9" stroke="#8ccea3" stroke-width="1.4"/><text x="70.0" y="287.5" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="70.0">Definir la respuesta, su condición de</tspan><tspan x="70.0" dy="16.5">activación y la evidencia que obligaría a</tspan><tspan x="70.0" dy="16.5">revisarla</tspan></text><circle cx="450.0" cy="295.5" r="15" fill="#206e3b"/><text x="450.0" y="300.0" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">5</text><text x="40" y="383.0" font-size="11.5" fill="#39ac61" font-weight="700" letter-spacing="1.4">CONCEPTOS Y DÓNDE ACTÚAN EN EL MÉTODO</text><rect x="40.0" y="397.0" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#8ccea3" stroke-width="1.4"/><rect x="40.0" y="405.0" width="5" height="62.2" rx="2" fill="#39ac61"/><text x="56.0" y="419.0" font-size="13.5" fill="#206e3b" font-weight="700" text-anchor="start"><tspan x="56.0">Modelo económico del competidor</tspan></text><text x="56.0" y="438.8" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Forma en que gana dinero, su estructura de costos y su</tspan><tspan x="56.0" dy="15.2">presión de retorno</tspan></text><rect x="379.0" y="405.0" width="54" height="20" rx="10" fill="#bce5ca" stroke="#8ccea3" stroke-width="1"/><text x="406.0" y="419.0" font-size="11" fill="#206e3b" font-weight="700" text-anchor="middle">↔ 1</text><rect x="459.0" y="397.0" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#8ccea3" stroke-width="1.4"/><rect x="459.0" y="405.0" width="5" height="62.2" rx="2" fill="#39ac61"/><text x="475.0" y="419.0" font-size="13.5" fill="#206e3b" font-weight="700" text-anchor="start"><tspan x="475.0">Restricción del competidor</tspan></text><text x="475.0" y="438.8" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Limitación de capital, capacidad, contrato o tecnología</tspan><tspan x="475.0" dy="15.2">que acota lo que puede hacer</tspan></text><rect x="798.0" y="405.0" width="54" height="20" rx="10" fill="#bce5ca" stroke="#8ccea3" stroke-width="1"/><text x="825.0" y="419.0" font-size="11" fill="#206e3b" font-weight="700" text-anchor="middle">↔ 1</text><rect x="40.0" y="489.2" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#8ccea3" stroke-width="1.4"/><rect x="40.0" y="497.2" width="5" height="62.2" rx="2" fill="#39ac61"/><text x="56.0" y="511.2" font-size="13.5" fill="#206e3b" font-weight="700" text-anchor="start"><tspan x="56.0">Movimiento probable</tspan></text><text x="56.0" y="531.0" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Acción esperable del competidor dada su situación, no la</tspan><tspan x="56.0" dy="15.2">que sería óptima en abstracto</tspan></text><rect x="379.0" y="497.2" width="54" height="20" rx="10" fill="#bce5ca" stroke="#8ccea3" stroke-width="1"/><text x="406.0" y="511.2" font-size="11" fill="#206e3b" font-weight="700" text-anchor="middle">↔ 4</text><rect x="459.0" y="489.2" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#8ccea3" stroke-width="1.4"/><rect x="459.0" y="497.2" width="5" height="62.2" rx="2" fill="#39ac61"/><text x="475.0" y="511.2" font-size="13.5" fill="#206e3b" font-weight="700" text-anchor="start"><tspan x="475.0">Intensidad competitiva</tspan></text><text x="475.0" y="531.0" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Grado en que la rivalidad erosiona el margen disponible en</tspan><tspan x="475.0" dy="15.2">la categoría</tspan></text><rect x="798.0" y="497.2" width="54" height="20" rx="10" fill="#bce5ca" stroke="#8ccea3" stroke-width="1"/><text x="825.0" y="511.2" font-size="11" fill="#206e3b" font-weight="700" text-anchor="middle">↔ 1</text><rect x="40.0" y="581.4" width="401.0" height="93.4" rx="8" fill="#ffffff" stroke="#8ccea3" stroke-width="1.4"/><rect x="40.0" y="589.4" width="5" height="77.4" rx="2" fill="#39ac61"/><text x="56.0" y="603.4" font-size="13.5" fill="#206e3b" font-weight="700" text-anchor="start"><tspan x="56.0">PESTEL</tspan></text><text x="56.0" y="623.2" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Barrido estructurado de factores políticos, económicos,</tspan><tspan x="56.0" dy="15.2">sociales, tecnológicos, ambientales y legales que pueden</tspan><tspan x="56.0" dy="15.2">cambiar una decisión</tspan></text><rect x="459.0" y="581.4" width="401.0" height="93.4" rx="8" fill="#ffffff" stroke="#8ccea3" stroke-width="1.4"/><rect x="459.0" y="589.4" width="5" height="77.4" rx="2" fill="#39ac61"/><text x="475.0" y="603.4" font-size="13.5" fill="#206e3b" font-weight="700" text-anchor="start"><tspan x="475.0">Cinco fuerzas</tspan></text><text x="475.0" y="623.2" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Análisis de rivalidad, entrantes, sustitutos y poder de</tspan><tspan x="475.0" dy="15.2">compradores y proveedores que condiciona rentabilidad</tspan></text><rect x="40.0" y="688.7" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#8ccea3" stroke-width="1.4"/><rect x="40.0" y="696.7" width="5" height="62.2" rx="2" fill="#39ac61"/><text x="56.0" y="710.7" font-size="13.5" fill="#206e3b" font-weight="700" text-anchor="start"><tspan x="56.0">Ventaja competitiva</tspan></text><text x="56.0" y="730.5" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Sistema de actividades difícil de replicar que permite</tspan><tspan x="56.0" dy="15.2">costo menor, diferenciación o enfoque sostenible</tspan></text><rect x="379.0" y="696.7" width="54" height="20" rx="10" fill="#bce5ca" stroke="#8ccea3" stroke-width="1"/><text x="406.0" y="710.7" font-size="11" fill="#206e3b" font-weight="700" text-anchor="middle">↔ 1</text><rect x="459.0" y="688.7" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#8ccea3" stroke-width="1.4"/><rect x="459.0" y="696.7" width="5" height="62.2" rx="2" fill="#39ac61"/><text x="475.0" y="710.7" font-size="13.5" fill="#206e3b" font-weight="700" text-anchor="start"><tspan x="475.0">Modelo de negocio</tspan></text><text x="475.0" y="730.5" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Lógica conectada de propuesta de valor, clientes,</tspan><tspan x="475.0" dy="15.2">actividades, recursos, socios, costos e ingresos</tspan></text><text x="40" y="798.9000000000001" font-size="11.5" fill="#39ac61" font-weight="700" letter-spacing="1.4">QUÉ SE MIDE: NUMERADOR SOBRE DENOMINADOR</text><rect x="40.0" y="812.9" width="261.3" height="137.9" rx="8" fill="#e2f7e9" stroke="#8ccea3" stroke-width="1.4"/><text x="54.0" y="834.9" font-size="13" fill="#206e3b" font-weight="700" text-anchor="start"><tspan x="54.0">Participación en negocios</tspan><tspan x="54.0" dy="17.2">enfrentados</tspan></text><text x="54.0" y="881.2" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Negocios ganados frente a cada</tspan><tspan x="54.0" dy="15.2">competidor</tspan></text><line x1="54.0" y1="917.6" x2="287.3" y2="917.6" stroke="#39ac61" stroke-width="2"/><text x="54.0" y="935.6" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="54.0">Negocios donde estuvo presente</tspan></text><rect x="319.3" y="812.9" width="261.3" height="137.9" rx="8" fill="#e2f7e9" stroke="#8ccea3" stroke-width="1.4"/><text x="333.3" y="834.9" font-size="13" fill="#206e3b" font-weight="700" text-anchor="start"><tspan x="333.3">Cambios de precio del competidor</tspan></text><text x="333.3" y="864.1" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="333.3">Variaciones de lista detectadas por</tspan><tspan x="333.3" dy="15.2">trimestre y su efecto en la tasa de</tspan><tspan x="333.3" dy="15.2">descuento propia</tspan></text><rect x="598.7" y="812.9" width="261.3" height="137.9" rx="8" fill="#e2f7e9" stroke="#8ccea3" stroke-width="1.4"/><text x="612.7" y="834.9" font-size="13" fill="#206e3b" font-weight="700" text-anchor="start"><tspan x="612.7">Velocidad de respuesta</tspan></text><text x="612.7" y="864.1" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="612.7">Días entre un movimiento del</tspan><tspan x="612.7" dy="15.2">competidor y la respuesta</tspan><tspan x="612.7" dy="15.2">documentada de la empresa</tspan></text><rect x="40.0" y="964.8" width="261.3" height="173.6" rx="8" fill="#e2f7e9" stroke="#8ccea3" stroke-width="1.4"/><text x="54.0" y="986.8" font-size="13" fill="#206e3b" font-weight="700" text-anchor="start"><tspan x="54.0">Señales externas con respuesta</tspan><tspan x="54.0" dy="17.2">definida</tspan></text><text x="54.0" y="1033.1" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Señales PESTEL con umbral,</tspan><tspan x="54.0" dy="15.2">responsable y acción</tspan></text><line x1="54.0" y1="1069.4" x2="287.3" y2="1069.4" stroke="#39ac61" stroke-width="2"/><text x="54.0" y="1087.4" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="54.0">Señales externas priorizadas</tspan></text><text x="54.0" y="1116.6" font-size="10.5" fill="#7b8794" font-weight="400" text-anchor="start"><tspan x="54.0">Ventana: revisión mensual y escenario</tspan><tspan x="54.0" dy="13.9">trimestral</tspan></text><text x="40" y="1172.3400000000001" font-size="11.5" fill="#39ac61" font-weight="700" letter-spacing="1.4">FRONTERA DE APLICACIÓN</text><rect x="40" y="1182.3" width="820" height="65.0" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.4"/><polygon points="70,1199.8400000000001 52,1228.8400000000001 88,1228.8400000000001" fill="#c2410c"/><text x="70" y="1225.8400000000001" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">!</text><text x="106" y="1206.3" font-size="12.5" fill="#7c2d12" font-weight="400" text-anchor="start"><tspan x="106">La inteligencia competitiva tiene límites legales y éticos: no incluye obtener información confidencial</tspan><tspan x="106" dy="16.5">por medios engañosos ni coordinar precios, práctica sancionada por la libre competencia en Chile.</tspan></text><text x="40" y="1275.3400000000001" font-size="11.5" fill="#39ac61" font-weight="700" letter-spacing="1.4">ERROR FRECUENTE Y SU CORRECCIÓN</text><rect x="40" y="1285.3" width="380.0" height="77.0" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/><text x="54" y="1307.3" font-size="11" fill="#b91c1c" font-weight="700" text-anchor="start"><tspan x="54">Síntoma</tspan></text><text x="54" y="1325.3" font-size="12.5" fill="#7f1d1d" font-weight="400" text-anchor="start"><tspan x="54">Reaccionar a un precio sin comparar estructuras de</tspan><tspan x="54" dy="16.5">costo</tspan></text><line x1="426.0" y1="1323.8" x2="469.0" y2="1323.8" stroke="#39ac61" stroke-width="2.6" stroke-linecap="round"/><polygon points="474.0,1323.8 465.9,1327.8 465.9,1319.9" fill="#39ac61"/><rect x="480.0" y="1285.3" width="380.0" height="77.0" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.4"/><text x="494.0" y="1307.3" font-size="11" fill="#15803d" font-weight="700" text-anchor="start"><tspan x="494.0">Corrección</tspan></text><text x="494.0" y="1325.3" font-size="12.5" fill="#14532d" font-weight="400" text-anchor="start"><tspan x="494.0">Modela cuánto tiempo puede sostener cada parte esa</tspan><tspan x="494.0" dy="16.5">política antes de responder.</tspan></text></svg>