<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1389" width="900" height="1389" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif"><title id="t">Modelo mental · Ética comercial y confianza</title><desc id="d">Modelo mental de la clase 01.13: Ética comercial y confianza. Método en 5 pasos; 4 conceptos; 3 señales de medición.</desc><rect x="0" y="0" width="900" height="1389" rx="14" fill="#ffffff"/><rect x="0" y="0" width="900" height="64" rx="14" fill="#6e5d20"/><rect x="0" y="40" width="900" height="24" fill="#6e5d20"/><text x="40" y="28" font-size="12" fill="#e5dcbc" font-weight="700" letter-spacing="1.6">MODELO MENTAL · CLASE 01.13 · PARTE 01</text><text x="40" y="52" font-size="21" fill="#ffffff" font-weight="700">Ética comercial y confianza</text><text x="40" y="84" font-size="11.5" fill="#ac9339" font-weight="700" letter-spacing="1.4">MÉTODO PASO A PASO</text><ellipse cx="450.0" cy="403.2" rx="330.0" ry="251.2" fill="none" stroke="#cebf8c" stroke-width="2" stroke-dasharray="3 8" stroke-linecap="round"/><polygon points="653.6,205.3 636.2,201.8 641.4,192.4" fill="#ac9339"/><polygon points="759.5,490.9 761.2,473.3 771.1,477.5" fill="#ac9339"/><polygon points="439.0,654.4 455.9,649.0 455.9,659.8" fill="#ac9339"/><polygon points="131.8,470.7 143.4,484.1 133.5,488.4" fill="#ac9339"/><polygon points="265.7,194.7 253.5,207.6 248.3,198.1" fill="#ac9339"/><circle cx="450.0" cy="403.2" r="100.0" fill="#e5dcbc" stroke="#cebf8c" stroke-width="1.6"/><text x="450.0" y="395.4" font-size="15" fill="#6e5d20" font-weight="700" text-anchor="middle"><tspan x="450.0">Ética comercial y</tspan><tspan x="450.0" dy="19.8">confianza</tspan></text><rect x="361.0" y="114.2" width="178" height="75.5" rx="10" fill="#f7f3e2" stroke="#cebf8c" stroke-width="1.4"/><text x="373.0" y="136.2" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="373.0">Revisar cada promesa</tspan><tspan x="373.0" dy="16.5">comercial y su</tspan><tspan x="373.0" dy="16.5">evidencia de respaldo</tspan></text><circle cx="363.0" cy="116.2" r="14" fill="#6e5d20"/><text x="363.0" y="120.8" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><rect x="674.8" y="279.6" width="178" height="92.0" rx="10" fill="#f7f3e2" stroke="#cebf8c" stroke-width="1.4"/><text x="686.8" y="301.6" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="686.8">Identificar dónde la</tspan><tspan x="686.8" dy="16.5">asimetría de</tspan><tspan x="686.8" dy="16.5">información puede</tspan><tspan x="686.8" dy="16.5">dañar al cliente</tspan></text><circle cx="676.8" cy="281.6" r="14" fill="#6e5d20"/><text x="676.8" y="286.1" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><rect x="555.0" y="568.7" width="178" height="75.5" rx="10" fill="#f7f3e2" stroke="#cebf8c" stroke-width="1.4"/><text x="567.0" y="590.7" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="567.0">Verificar base legal y</tspan><tspan x="567.0" dy="16.5">consentimiento del</tspan><tspan x="567.0" dy="16.5">tratamiento de datos</tspan></text><circle cx="557.0" cy="570.7" r="14" fill="#6e5d20"/><text x="557.0" y="575.2" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><rect x="167.0" y="560.4" width="178" height="92.0" rx="10" fill="#f7f3e2" stroke="#cebf8c" stroke-width="1.4"/><text x="179.0" y="582.4" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="179.0">Someter la táctica a</tspan><tspan x="179.0" dy="16.5">la prueba de</tspan><tspan x="179.0" dy="16.5">publicación: ¿resiste</tspan><tspan x="179.0" dy="16.5">ser conocida?</tspan></text><circle cx="169.0" cy="562.4" r="14" fill="#6e5d20"/><text x="169.0" y="566.9" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">4</text><rect x="47.2" y="296.1" width="178" height="59.0" rx="10" fill="#f7f3e2" stroke="#cebf8c" stroke-width="1.4"/><text x="59.2" y="318.1" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="59.2">Documentar la decisión</tspan><tspan x="59.2" dy="16.5">y su responsable</tspan></text><circle cx="49.2" cy="298.1" r="14" fill="#6e5d20"/><text x="49.2" y="302.6" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">5</text><text x="40" y="742.4" font-size="11.5" fill="#ac9339" font-weight="700" letter-spacing="1.4">CONCEPTOS Y DÓNDE ACTÚAN EN EL MÉTODO</text><rect x="40.0" y="756.4" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#cebf8c" stroke-width="1.4"/><rect x="40.0" y="764.4" width="5" height="62.2" rx="2" fill="#ac9339"/><text x="56.0" y="778.4" font-size="13.5" fill="#6e5d20" font-weight="700" text-anchor="start"><tspan x="56.0">Promesa verificable</tspan></text><text x="56.0" y="798.2" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Afirmación comercial que puede acreditarse con evidencia</tspan><tspan x="56.0" dy="15.2">disponible</tspan></text><rect x="379.0" y="764.4" width="54" height="20" rx="10" fill="#e5dcbc" stroke="#cebf8c" stroke-width="1"/><text x="406.0" y="778.4" font-size="11" fill="#6e5d20" font-weight="700" text-anchor="middle">↔ 1, 3</text><rect x="459.0" y="756.4" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#cebf8c" stroke-width="1.4"/><rect x="459.0" y="764.4" width="5" height="62.2" rx="2" fill="#ac9339"/><text x="475.0" y="778.4" font-size="13.5" fill="#6e5d20" font-weight="700" text-anchor="start"><tspan x="475.0">Asimetría de información</tspan></text><text x="475.0" y="798.2" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Ventaja de conocimiento del vendedor que el cliente no</tspan><tspan x="475.0" dy="15.2">puede compensar por sí solo</tspan></text><rect x="798.0" y="764.4" width="54" height="20" rx="10" fill="#e5dcbc" stroke="#cebf8c" stroke-width="1"/><text x="825.0" y="778.4" font-size="11" fill="#6e5d20" font-weight="700" text-anchor="middle">↔ 2</text><rect x="40.0" y="848.6" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#cebf8c" stroke-width="1.4"/><rect x="40.0" y="856.6" width="5" height="62.2" rx="2" fill="#ac9339"/><text x="56.0" y="870.6" font-size="13.5" fill="#6e5d20" font-weight="700" text-anchor="start"><tspan x="56.0">Consentimiento informado</tspan></text><text x="56.0" y="890.4" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Autorización obtenida con información suficiente, libre y</tspan><tspan x="56.0" dy="15.2">específica sobre el uso de los datos</tspan></text><rect x="379.0" y="856.6" width="54" height="20" rx="10" fill="#e5dcbc" stroke="#cebf8c" stroke-width="1"/><text x="406.0" y="870.6" font-size="11" fill="#6e5d20" font-weight="700" text-anchor="middle">↔ 2, 3</text><rect x="459.0" y="848.6" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#cebf8c" stroke-width="1.4"/><rect x="459.0" y="856.6" width="5" height="62.2" rx="2" fill="#ac9339"/><text x="475.0" y="870.6" font-size="13.5" fill="#6e5d20" font-weight="700" text-anchor="start"><tspan x="475.0">Costo reputacional</tspan></text><text x="475.0" y="890.4" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Efecto acumulado de una práctica sobre la disposición</tspan><tspan x="475.0" dy="15.2">futura del mercado a confiar</tspan></text><text x="40" y="958.76" font-size="11.5" fill="#ac9339" font-weight="700" letter-spacing="1.4">QUÉ SE MIDE: NUMERADOR SOBRE DENOMINADOR</text><rect x="40.0" y="972.8" width="261.3" height="137.9" rx="8" fill="#f7f3e2" stroke="#cebf8c" stroke-width="1.4"/><text x="54.0" y="994.8" font-size="13" fill="#6e5d20" font-weight="700" text-anchor="start"><tspan x="54.0">Tasa de reclamos por información</tspan></text><text x="54.0" y="1023.9" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Reclamos vinculados a publicidad,</tspan><tspan x="54.0" dy="15.2">precio o condiciones</tspan></text><line x1="54.0" y1="1060.3" x2="287.3" y2="1060.3" stroke="#ac9339" stroke-width="2"/><text x="54.0" y="1078.3" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="54.0">Transacciones del periodo</tspan></text><rect x="319.3" y="972.8" width="261.3" height="137.9" rx="8" fill="#f7f3e2" stroke="#cebf8c" stroke-width="1.4"/><text x="333.3" y="994.8" font-size="13" fill="#6e5d20" font-weight="700" text-anchor="start"><tspan x="333.3">Promesas sin respaldo</tspan><tspan x="333.3" dy="17.2">documentado</tspan></text><text x="333.3" y="1041.1" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="333.3">Afirmaciones comerciales activas sin</tspan><tspan x="333.3" dy="15.2">evidencia asociada</tspan></text><line x1="333.3" y1="1077.4" x2="566.7" y2="1077.4" stroke="#ac9339" stroke-width="2"/><text x="333.3" y="1095.4" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="333.3">Total auditado</tspan></text><rect x="598.7" y="972.8" width="261.3" height="137.9" rx="8" fill="#f7f3e2" stroke="#cebf8c" stroke-width="1.4"/><text x="612.7" y="994.8" font-size="13" fill="#6e5d20" font-weight="700" text-anchor="start"><tspan x="612.7">Bajas por expectativa incumplida</tspan></text><text x="612.7" y="1023.9" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="612.7">Bajas cuyo motivo declarado es</tspan><tspan x="612.7" dy="15.2">diferencia entre lo prometido y lo</tspan><tspan x="612.7" dy="15.2">recibido</tspan></text><line x1="612.7" y1="1075.5" x2="846.0" y2="1075.5" stroke="#ac9339" stroke-width="2"/><text x="612.7" y="1093.5" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="612.7">Bajas totales</tspan></text><text x="40" y="1144.62" font-size="11.5" fill="#ac9339" font-weight="700" letter-spacing="1.4">FRONTERA DE APLICACIÓN</text><rect x="40" y="1154.6" width="820" height="81.5" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.4"/><polygon points="70,1180.37 52,1209.37 88,1209.37" fill="#c2410c"/><text x="70" y="1206.37" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">!</text><text x="106" y="1178.6" font-size="12.5" fill="#7c2d12" font-weight="400" text-anchor="start"><tspan x="106">La ética no es un catálogo de reglas cerrado: en casos límite hay que decidir con criterio y dejar traza.</tspan><tspan x="106" dy="16.5">Lo que no es discutible es el mínimo legal ni la obligación de no trasladar al cliente un riesgo que no</tspan><tspan x="106" dy="16.5">puede evaluar.</tspan></text><text x="40" y="1264.12" font-size="11.5" fill="#ac9339" font-weight="700" letter-spacing="1.4">ERROR FRECUENTE Y SU CORRECCIÓN</text><rect x="40" y="1274.1" width="380.0" height="77.0" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/><text x="54" y="1296.1" font-size="11" fill="#b91c1c" font-weight="700" text-anchor="start"><tspan x="54">Síntoma</tspan></text><text x="54" y="1314.1" font-size="12.5" fill="#7f1d1d" font-weight="400" text-anchor="start"><tspan x="54">Tratar el cumplimiento como revisión final</tspan></text><line x1="426.0" y1="1312.6" x2="469.0" y2="1312.6" stroke="#ac9339" stroke-width="2.6" stroke-linecap="round"/><polygon points="474.0,1312.6 465.9,1316.5 465.9,1308.7" fill="#ac9339"/><rect x="480.0" y="1274.1" width="380.0" height="77.0" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.4"/><text x="494.0" y="1296.1" font-size="11" fill="#15803d" font-weight="700" text-anchor="start"><tspan x="494.0">Corrección</tspan></text><text x="494.0" y="1314.1" font-size="12.5" fill="#14532d" font-weight="400" text-anchor="start"><tspan x="494.0">Incorpora la verificación de promesa y de datos en</tspan><tspan x="494.0" dy="16.5">el diseño de la campaña, no en la aprobación.</tspan></text></svg>