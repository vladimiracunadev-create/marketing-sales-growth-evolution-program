<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1092" width="900" height="1092" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif"><title id="t">Modelo mental · Optimización de campañas</title><desc id="d">Modelo mental de la clase 14.12: Optimización de campañas. Método en 5 pasos; 4 conceptos; 3 señales de medición.</desc><rect x="0" y="0" width="900" height="1092" rx="14" fill="#ffffff"/><rect x="0" y="0" width="900" height="64" rx="14" fill="#6c206e"/><rect x="0" y="40" width="900" height="24" fill="#6c206e"/><text x="40" y="28" font-size="12" fill="#e4bce5" font-weight="700" letter-spacing="1.6">MODELO MENTAL · CLASE 14.12 · PARTE 14</text><text x="40" y="52" font-size="21" fill="#ffffff" font-weight="700">Optimización de campañas</text><text x="40" y="84" font-size="11.5" fill="#a839ac" font-weight="700" letter-spacing="1.4">MÉTODO PASO A PASO</text><path d="M66.0,159.0 V202.5 H158.5" fill="none" stroke="#a839ac" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="160.5,202.5 151.5,197.5 151.5,207.5" fill="#a839ac"/><path d="M188.5,232.0 V275.5 H281.0" fill="none" stroke="#a839ac" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="283.0,275.5 274.0,270.5 274.0,280.5" fill="#a839ac"/><path d="M311.0,305.0 V348.5 H403.5" fill="none" stroke="#a839ac" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="405.5,348.5 396.5,343.5 396.5,353.5" fill="#a839ac"/><path d="M433.5,378.0 V421.5 H526.0" fill="none" stroke="#a839ac" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="528.0,421.5 519.0,416.5 519.0,426.5" fill="#a839ac"/><rect x="40.0" y="100.0" width="330" height="59.0" rx="10" fill="#f7e2f7" stroke="#cb8cce" stroke-width="1.4"/><text x="54.0" y="122.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Establecer líneas base y rangos de variación</tspan><tspan x="54.0" dy="16.5">normal</tspan></text><circle cx="42.0" cy="102.0" r="14" fill="#6c206e"/><text x="42.0" y="106.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><rect x="162.5" y="173.0" width="330" height="59.0" rx="10" fill="#f7e2f7" stroke="#cb8cce" stroke-width="1.4"/><text x="176.5" y="195.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="176.5">Identificar si el cambio observado es común</tspan><tspan x="176.5" dy="16.5">o especial</tspan></text><circle cx="164.5" cy="175.0" r="14" fill="#6c206e"/><text x="164.5" y="179.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><rect x="285.0" y="246.0" width="330" height="59.0" rx="10" fill="#f7e2f7" stroke="#cb8cce" stroke-width="1.4"/><text x="299.0" y="268.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="299.0">Formular una hipótesis y cambiar una</tspan><tspan x="299.0" dy="16.5">variable</tspan></text><circle cx="287.0" cy="248.0" r="14" fill="#6c206e"/><text x="287.0" y="252.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><rect x="407.5" y="319.0" width="330" height="59.0" rx="10" fill="#f7e2f7" stroke="#cb8cce" stroke-width="1.4"/><text x="421.5" y="341.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="421.5">Esperar la ventana de evaluación completa</tspan></text><circle cx="409.5" cy="321.0" r="14" fill="#6c206e"/><text x="409.5" y="325.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">4</text><rect x="530.0" y="392.0" width="330" height="59.0" rx="10" fill="#f7e2f7" stroke="#cb8cce" stroke-width="1.4"/><text x="544.0" y="414.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="544.0">Documentar el resultado y el aprendizaje</tspan></text><circle cx="532.0" cy="394.0" r="14" fill="#6c206e"/><text x="532.0" y="398.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">5</text><text x="40" y="493.0" font-size="11.5" fill="#a839ac" font-weight="700" letter-spacing="1.4">CONCEPTOS Y DÓNDE ACTÚAN EN EL MÉTODO</text><rect x="40.0" y="507.0" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#cb8cce" stroke-width="1.4"/><rect x="40.0" y="515.0" width="5" height="62.2" rx="2" fill="#a839ac"/><text x="56.0" y="529.0" font-size="13.5" fill="#6c206e" font-weight="700" text-anchor="start"><tspan x="56.0">Variación común</tspan></text><text x="56.0" y="548.8" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Fluctuación normal del proceso que no requiere</tspan><tspan x="56.0" dy="15.2">intervención</tspan></text><rect x="379.0" y="515.0" width="54" height="20" rx="10" fill="#e4bce5" stroke="#cb8cce" stroke-width="1"/><text x="406.0" y="529.0" font-size="11" fill="#6c206e" font-weight="700" text-anchor="middle">↔ 1, 2, 3</text><rect x="459.0" y="507.0" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#cb8cce" stroke-width="1.4"/><rect x="459.0" y="515.0" width="5" height="62.2" rx="2" fill="#a839ac"/><text x="475.0" y="529.0" font-size="13.5" fill="#6c206e" font-weight="700" text-anchor="start"><tspan x="475.0">Variación especial</tspan></text><text x="475.0" y="548.8" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Cambio atribuible a una causa identificable que sí</tspan><tspan x="475.0" dy="15.2">justifica actuar</tspan></text><rect x="798.0" y="515.0" width="54" height="20" rx="10" fill="#e4bce5" stroke="#cb8cce" stroke-width="1"/><text x="825.0" y="529.0" font-size="11" fill="#6c206e" font-weight="700" text-anchor="middle">↔ 1, 2, 3</text><rect x="40.0" y="599.2" width="401.0" height="63.0" rx="8" fill="#ffffff" stroke="#cb8cce" stroke-width="1.4"/><rect x="40.0" y="607.2" width="5" height="47.0" rx="2" fill="#a839ac"/><text x="56.0" y="621.2" font-size="13.5" fill="#6c206e" font-weight="700" text-anchor="start"><tspan x="56.0">Ciclo de optimización</tspan></text><text x="56.0" y="641.0" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Secuencia de medición, hipótesis, cambio y evaluación</tspan></text><rect x="379.0" y="607.2" width="54" height="20" rx="10" fill="#e4bce5" stroke="#cb8cce" stroke-width="1"/><text x="406.0" y="621.2" font-size="11" fill="#6c206e" font-weight="700" text-anchor="middle">↔ 3</text><rect x="459.0" y="599.2" width="401.0" height="63.0" rx="8" fill="#ffffff" stroke="#cb8cce" stroke-width="1.4"/><rect x="459.0" y="607.2" width="5" height="47.0" rx="2" fill="#a839ac"/><text x="475.0" y="621.2" font-size="13.5" fill="#6c206e" font-weight="700" text-anchor="start"><tspan x="475.0">Ventana de evaluación</tspan></text><text x="475.0" y="641.0" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Periodo necesario para juzgar el efecto de un cambio</tspan></text><rect x="798.0" y="607.2" width="54" height="20" rx="10" fill="#e4bce5" stroke="#cb8cce" stroke-width="1"/><text x="825.0" y="621.2" font-size="11" fill="#6c206e" font-weight="700" text-anchor="middle">↔ 4</text><text x="40" y="694.1800000000001" font-size="11.5" fill="#a839ac" font-weight="700" letter-spacing="1.4">QUÉ SE MIDE: NUMERADOR SOBRE DENOMINADOR</text><rect x="40.0" y="708.2" width="261.3" height="122.7" rx="8" fill="#f7e2f7" stroke="#cb8cce" stroke-width="1.4"/><text x="54.0" y="730.2" font-size="13" fill="#6c206e" font-weight="700" text-anchor="start"><tspan x="54.0">Rango de variación normal</tspan></text><text x="54.0" y="759.3" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Límites estadísticos de la métrica</tspan><tspan x="54.0" dy="15.2">en ausencia de cambios</tspan></text><rect x="319.3" y="708.2" width="261.3" height="122.7" rx="8" fill="#f7e2f7" stroke="#cb8cce" stroke-width="1.4"/><text x="333.3" y="730.2" font-size="13" fill="#6c206e" font-weight="700" text-anchor="start"><tspan x="333.3">Cambios por periodo</tspan></text><text x="333.3" y="759.3" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="333.3">Modificaciones realizadas, por</tspan><tspan x="333.3" dy="15.2">campaña y por mes</tspan></text><rect x="598.7" y="708.2" width="261.3" height="122.7" rx="8" fill="#f7e2f7" stroke="#cb8cce" stroke-width="1.4"/><text x="612.7" y="730.2" font-size="13" fill="#6c206e" font-weight="700" text-anchor="start"><tspan x="612.7">Proporción de cambios con</tspan><tspan x="612.7" dy="17.2">hipótesis</tspan></text><text x="612.7" y="776.5" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="612.7">Cambios con hipótesis documentada</tspan></text><line x1="612.7" y1="797.7" x2="846.0" y2="797.7" stroke="#a839ac" stroke-width="2"/><text x="612.7" y="815.7" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="612.7">Cambios realizados</tspan></text><text x="40" y="864.8600000000001" font-size="11.5" fill="#a839ac" font-weight="700" letter-spacing="1.4">FRONTERA DE APLICACIÓN</text><rect x="40" y="874.9" width="820" height="65.0" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.4"/><polygon points="70,892.3600000000001 52,921.3600000000001 88,921.3600000000001" fill="#c2410c"/><text x="70" y="918.3600000000001" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">!</text><text x="106" y="898.9" font-size="12.5" fill="#7c2d12" font-weight="400" text-anchor="start"><tspan x="106">Los sistemas automatizados de las plataformas reoptimizan constantemente. Intervenir demasiado reinicia su</tspan><tspan x="106" dy="16.5">aprendizaje y empeora el resultado.</tspan></text><text x="40" y="967.8600000000001" font-size="11.5" fill="#a839ac" font-weight="700" letter-spacing="1.4">ERROR FRECUENTE Y SU CORRECCIÓN</text><rect x="40" y="977.9" width="380.0" height="77.0" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/><text x="54" y="999.9" font-size="11" 