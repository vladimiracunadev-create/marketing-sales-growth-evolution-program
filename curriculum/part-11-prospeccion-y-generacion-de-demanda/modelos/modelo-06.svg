532.0" y="398.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">5</text><text x="40" y="493.0" font-size="11.5" fill="#39ac80" font-weight="700" letter-spacing="1.4">CONCEPTOS Y DÓNDE ACTÚAN EN EL MÉTODO</text><rect x="40.0" y="507.0" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#8cceb5" stroke-width="1.4"/><rect x="40.0" y="515.0" width="5" height="62.2" rx="2" fill="#39ac80"/><text x="56.0" y="529.0" font-size="13.5" fill="#206e50" font-weight="700" text-anchor="start"><tspan x="56.0">Credibilidad pública</tspan></text><text x="56.0" y="548.8" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Reputación construida con contenido y participación</tspan><tspan x="56.0" dy="15.2">verificables</tspan></text><rect x="379.0" y="515.0" width="54" height="20" rx="10" fill="#bce5d5" stroke="#8cceb5" stroke-width="1"/><text x="406.0" y="529.0" font-size="11" fill="#206e50" font-weight="700" text-anchor="middle">↔ 2</text><rect x="459.0" y="507.0" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#8cceb5" stroke-width="1.4"/><rect x="459.0" y="515.0" width="5" height="62.2" rx="2" fill="#39ac80"/><text x="475.0" y="529.0" font-size="13.5" fill="#206e50" font-weight="700" text-anchor="start"><tspan x="475.0">Contacto personalizado</tspan></text><text x="475.0" y="548.8" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Mensaje que demuestra conocimiento específico del</tspan><tspan x="475.0" dy="15.2">destinatario</tspan></text><rect x="798.0" y="515.0" width="54" height="20" rx="10" fill="#bce5d5" stroke="#8cceb5" stroke-width="1"/><text x="825.0" y="529.0" font-size="11" fill="#206e50" font-weight="700" text-anchor="middle">↔ 1, 4, 5</text><rect x="40.0" y="599.2" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#8cceb5" stroke-width="1.4"/><rect x="40.0" y="607.2" width="5" height="62.2" rx="2" fill="#39ac80"/><text x="56.0" y="621.2" font-size="13.5" fill="#206e50" font-weight="700" text-anchor="start"><tspan x="56.0">Automatización masiva</tspan></text><text x="56.0" y="641.0" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Envío indiscriminado que ignora contexto y degrada la</tspan><tspan x="56.0" dy="15.2">reputación</tspan></text><rect x="459.0" y="599.2" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#8cceb5" stroke-width="1.4"/><rect x="459.0" y="607.2" width="5" height="62.2" rx="2" fill="#39ac80"/><text x="475.0" y="621.2" font-size="13.5" fill="#206e50" font-weight="700" text-anchor="start"><tspan x="475.0">Conversación sostenida</tspan></text><text x="475.0" y="641.0" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Intercambio de al menos dos mensajes con contenido</tspan><tspan x="475.0" dy="15.2">sustantivo</tspan></text><rect x="798.0" y="607.2" width="54" height="20" rx="10" fill="#bce5d5" stroke="#8cceb5" stroke-width="1"/><text x="825.0" y="621.2" font-size="11" fill="#206e50" font-weight="700" text-anchor="middle">↔ 3, 5</text><text x="40" y="709.3600000000001" font-size="11.5" fill="#39ac80" font-weight="700" letter-spacing="1.4">QUÉ SE MIDE: NUMERADOR SOBRE DENOMINADOR</text><rect x="40.0" y="723.4" width="261.3" height="137.9" rx="8" fill="#e2f7ef" stroke="#8cceb5" stroke-width="1.4"/><text x="54.0" y="745.4" font-size="13" fill="#206e50" font-weight="700" text-anchor="start"><tspan x="54.0">Tasa de aceptación de contacto</tspan></text><text x="54.0" y="774.5" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Invitaciones aceptadas</tspan></text><line x1="54.0" y1="795.7" x2="287.3" y2="795.7" stroke="#39ac80" stroke-width="2"/><text x="54.0" y="813.7" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="54.0">Invitaciones enviadas</tspan></text><rect x="319.3" y="723.4" width="261.3" height="137.9" rx="8" fill="#e2f7ef" stroke="#8cceb5" stroke-width="1.4"/><text x="333.3" y="745.4" font-size="13" fill="#206e50" font-weight="700" text-anchor="start"><tspan x="333.3">Conversaciones sostenidas</tspan></text><text x="333.3" y="774.5" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="333.3">Intercambios con dos o más mensajes</tspan><tspan x="333.3" dy="15.2">sustantivos</tspan></text><line x1="333.3" y1="810.9" x2="566.7" y2="810.9" stroke="#39ac80" stroke-width="2"/><text x="333.3" y="828.9" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="333.3">Contactos aceptados</tspan></text><rect x="598.7" y="723.4" width="261.3" height="137.9" rx="8" fill="#e2f7ef" stroke="#8cceb5" stroke-width="1.4"/><text x="612.7" y="745.4" font-size="13" fill="#206e50" font-weight="700" text-anchor="start"><tspan x="612.7">Oportunidades originadas en el</tspan><tspan x="612.7" dy="17.2">canal</tspan></text><text x="612.7" y="791.7" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="612.7">Oportunidades calificadas atribuidas</tspan><tspan x="612.7" dy="15.2">al canal</tspan></text><line x1="612.7" y1="828.0" x2="846.0" y2="828.0" stroke="#39ac80" stroke-width="2"/><text x="612.7" y="846.0" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="612.7">Oportunidades totales</tspan></text><text x="40" y="895.2200000000001" font-size="11.5" fill="#39ac80" font-weight="700" letter-spacing="1.4">FRONTERA DE APLICACIÓN</text><rect x="40" y="905.2" width="820" height="65.0" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.4"/><polygon points="70,922.7200000000001 52,951.7200000000001 88,951.7200000000001" fill="#c2410c"/><text x="70" y="948.7200000000001" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">!</text><text x="106" y="929.2" font-size="12.5" fill="#7c2d12" font-weight="400" text-anchor="start"><tspan x="106">Las plataformas tienen términos de uso que prohíben ciertas automatizaciones. Infringirlos puede costar la</tspan><tspan x="106" dy="16.5">cuenta y la reputación asociada.</tspan></text><text x="40" y="998.2200000000001" font-size="11.5" fill="#39ac80" font-weight="700" letter-spacing="1.4">ERROR FRECUENTE Y SU CORRECCIÓN</text><rect x="40" y="1008.2" width="380.0" height="77.0" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/><text x="54" y="1030.2" font-size="11" fill="#b91c1c" font-weight="700" text-anchor="start"><tspan x="54">Síntoma</tspan></text><text x="54" y="1048.2" font-size="12.5" fill="#7f1d1d" font-weight="400" text-anchor="start"><tspan x="54">Automatizar mensajes idénticos a escala</tspan></text><line x1="426.0" y1="1046.7" x2="469.0" y2="1046.7" stroke="#39ac80" stroke-width="2.6" stroke-linecap="round"/><polygon points="474.0,1046.7 465.9,1050.6 465.9,1042.8" fill="#39ac80"/><rect x="480.0" y="1008.2" width="380.0" height="77.0" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.4"/><text x="494.0" y="1030.2" font-size="11" fill="#15803d" font-weight="700" text-anchor="start"><tspan x="494.0">Corrección</tspan></text><text x="494.0" y="1048.2" font-size="12.5" fill="#14532d" font-weight="400" text-anchor="start"><tspan x="494.0">Personaliza sobre una señal concreta y mide</tspan><tspan x="494.0" dy="16.5">conversaciones sostenidas, no contactos agregados.</tspan></text></svg>