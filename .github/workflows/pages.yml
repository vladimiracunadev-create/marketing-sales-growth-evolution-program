name: Publicar sitio del programa

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construir:
    name: Construir sitio HTML
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generar el sitio
        run: python tools/build_site.py --limpiar

      - name: Verificar que el sitio se generó
        run: |
          paginas=$(find site -name '*.html' | wc -l)
          echo "Páginas generadas: $paginas"
          if [ "$paginas" -lt 500 ]; then
            echo "El sitio tiene menos páginas de las esperadas."
            exit 1
          fi
          test -f site/index.html
          test -f site/search-index.json
          test -f site/assets/estilo.css

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  publicar:
    name: Publicar en GitHub Pages
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - name: Desplegar
        id: despliegue
        uses: actions/deploy-pages@v4
