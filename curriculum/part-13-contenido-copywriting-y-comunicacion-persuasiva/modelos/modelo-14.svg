<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1608" width="900" height="1608" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif"><title id="t">Modelo mental · Sistema editorial completo</title><desc id="d">Modelo mental de la clase 13.14: Sistema editorial completo. Método en 5 pasos; 6 conceptos; 3 señales de medición.</desc><rect x="0" y="0" width="900" height="1608" rx="14" fill="#ffffff"/><rect x="0" y="0" width="900" height="64" rx="14" fill="#2e206e"/><rect x="0" y="40" width="900" height="24" fill="#2e206e"/><text x="40" y="28" font-size="12" fill="#c4bce5" font-weight="700" letter-spacing="1.6">MODELO MENTAL · CLASE 13.14 · PARTE 13</text><text x="40" y="52" font-size="21" fill="#ffffff" font-weight="700">Sistema editorial completo</text><text x="40" y="84" font-size="11.5" fill="#4e39ac" font-weight="700" letter-spacing="1.4">MÉTODO PASO A PASO</text><ellipse cx="450.0" cy="456.0" rx="330.0" ry="287.5" fill="none" stroke="#988cce" stroke-width="2" stroke-dasharray="3 8" stroke-linecap="round"/><polygon points="653.3,229.3 636.1,224.8 641.9,215.7" fill="#4e39ac"/><polygon points="760.0,555.1 760.8,537.4 771.0,541.2" fill="#4e39ac"/><polygon points="439.0,743.5 455.9,738.1 455.9,748.9" fill="#4e39ac"/><polygon points="132.3,534.5 143.3,548.5 133.1,552.3" fill="#4e39ac"/><polygon points="265.3,217.5 253.9,231.1 248.2,222.0" fill="#4e39ac"/><circle cx="450.0" cy="456.0" r="100.0" fill="#c4bce5" stroke="#988cce" stroke-width="1.6"/><text x="450.0" y="448.2" font-size="15" fill="#2e206e" font-weight="700" text-anchor="middle"><tspan x="450.0">Sistema editorial</tspan><tspan x="450.0" dy="19.8">completo</tspan></text><rect x="361.0" y="106.0" width="178" height="125.0" rx="10" fill="#e6e2f7" stroke="#988cce" stroke-width="1.4"/><text x="373.0" y="128.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="373.0">Inventariar</tspan><tspan x="373.0" dy="16.5">afirmaciones,</tspan><tspan x="373.0" dy="16.5">opiniones,</tspan><tspan x="373.0" dy="16.5">testimonios,</tspan><tspan x="373.0" dy="16.5">incentivos y posibles</tspan><tspan x="373.0" dy="16.5">omisiones materiales</tspan></text><circle cx="363.0" cy="108.0" r="14" fill="#2e206e"/><text x="363.0" y="112.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><rect x="674.8" y="304.7" width="178" height="125.0" rx="10" fill="#e6e2f7" stroke="#988cce" stroke-width="1.4"/><text x="686.8" y="326.7" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="686.8">Completar la matriz</tspan><tspan x="686.8" dy="16.5">afirmación → evidencia</tspan><tspan x="686.8" dy="16.5">→ limitación →</tspan><tspan x="686.8" dy="16.5">responsable →</tspan><tspan x="686.8" dy="16.5">publicar, corregir o</tspan><tspan x="686.8" dy="16.5">retirar</tspan></text><circle cx="676.8" cy="306.7" r="14" fill="#2e206e"/><text x="676.8" y="311.2" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><rect x="555.0" y="634.3" width="178" height="108.5" rx="10" fill="#e6e2f7" stroke="#988cce" stroke-width="1.4"/><text x="567.0" y="656.3" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="567.0">Reescribir con</tspan><tspan x="567.0" dy="16.5">alcance, condiciones,</tspan><tspan x="567.0" dy="16.5">incertidumbre y</tspan><tspan x="567.0" dy="16.5">alternativa</tspan><tspan x="567.0" dy="16.5">verificable</tspan></text><circle cx="557.0" cy="636.3" r="14" fill="#2e206e"/><text x="557.0" y="640.8" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><rect x="167.0" y="634.3" width="178" height="108.5" rx="10" fill="#e6e2f7" stroke="#988cce" stroke-width="1.4"/><text x="179.0" y="656.3" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="179.0">Aprobar una política</tspan><tspan x="179.0" dy="16.5">de incentivos que</tspan><tspan x="179.0" dy="16.5">prohíba pagar por</tspan><tspan x="179.0" dy="16.5">ocultar límites y</tspan><tspan x="179.0" dy="16.5">exija divulgación</tspan></text><circle cx="169.0" cy="636.3" r="14" fill="#2e206e"/><text x="169.0" y="640.8" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">4</text><rect x="47.2" y="304.7" width="178" height="125.0" rx="10" fill="#e6e2f7" stroke="#988cce" stroke-width="1.4"/><text x="59.2" y="326.7" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="59.2">Activar ante</tspan><tspan x="59.2" dy="16.5">información adversa un</tspan><tspan x="59.2" dy="16.5">protocolo con</tspan><tspan x="59.2" dy="16.5">contención, aviso,</tspan><tspan x="59.2" dy="16.5">actualización y</tspan><tspan x="59.2" dy="16.5">criterio de término</tspan></text><circle cx="49.2" cy="306.7" r="14" fill="#2e206e"/><text x="49.2" y="311.2" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">5</text><text x="40" y="848.0" font-size="11.5" fill="#4e39ac" font-weight="700" letter-spacing="1.4">CONCEPTOS Y DÓNDE ACTÚAN EN EL MÉTODO</text><rect x="40.0" y="862.0" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#988cce" stroke-width="1.4"/><rect x="40.0" y="870.0" width="5" height="62.2" rx="2" fill="#4e39ac"/><text x="56.0" y="884.0" font-size="13.5" fill="#2e206e" font-weight="700" text-anchor="start"><tspan x="56.0">Flujo de producción</tspan></text><text x="56.0" y="903.8" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Secuencia definida desde la idea hasta la publicación con</tspan><tspan x="56.0" dy="15.2">responsables</tspan></text><rect x="379.0" y="870.0" width="54" height="20" rx="10" fill="#c4bce5" stroke="#988cce" stroke-width="1"/><text x="406.0" y="884.0" font-size="11" fill="#2e206e" font-weight="700" text-anchor="middle">↔ 2</text><rect x="459.0" y="862.0" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#988cce" stroke-width="1.4"/><rect x="459.0" y="870.0" width="5" height="62.2" rx="2" fill="#4e39ac"/><text x="475.0" y="884.0" font-size="13.5" fill="#2e206e" font-weight="700" text-anchor="start"><tspan x="475.0">Control de afirmaciones</tspan></text><text x="475.0" y="903.8" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Verificación obligatoria del respaldo de toda afirmación</tspan><tspan x="475.0" dy="15.2">comercial</tspan></text><rect x="798.0" y="870.0" width="54" height="20" rx="10" fill="#c4bce5" stroke="#988cce" stroke-width="1"/><text x="825.0" y="884.0" font-size="11" fill="#2e206e" font-weight="700" text-anchor="middle">↔ 1, 2</text><rect x="40.0" y="954.2" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#988cce" stroke-width="1.4"/><rect x="40.0" y="962.2" width="5" height="62.2" rx="2" fill="#4e39ac"/><text x="56.0" y="976.2" font-size="13.5" fill="#2e206e" font-weight="700" text-anchor="start"><tspan x="56.0">Biblioteca de piezas</tspan></text><text x="56.0" y="996.0" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Repositorio organizado que permite reutilizar contenido en</tspan><tspan x="56.0" dy="15.2">ventas</tspan></text><rect x="459.0" y="954.2" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#988cce" stroke-width="1.4"/><rect x="459.0" y="962.2" width="5" height="62.2" rx="2" fill="#4e39ac"/><text x="475.0" y="976.2" font-size="13.5" fill="#2e206e" font-weight="700" text-anchor="start"><tspan x="475.0">Continuidad operativa</tspan></text><text x="475.0" y="996.0" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Capacidad del sistema de funcionar sin depender de una</tspan><tspan x="475.0" dy="15.2">persona</tspan></text><rect x="40.0" y="1046.4" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#988cce" stroke-width="1.4"/><rect x="40.0" y="1054.4" width="5" height="62.2" rx="2" fill="#4e39ac"/><text x="56.0" y="1068.4" font-size="13.5" fill="#2e206e" font-weight="700" text-anchor="start"><tspan x="56.0">Matriz de afirmaciones</tspan></text><text x="56.0" y="1088.2" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Registro afirmación → evidencia → limitación → responsable</tspan><tspan x="56.0" dy="15.2">→ decisión de publicar, corregir o retirar</tspan></text><rect x="379.0" y="1054.4" width="54" height="20" rx="10" fill="#c4bce5" stroke="#988cce" stroke-width="1"/><text x="406.0" y="1068.4" font-size="11" fill="#2e206e" font-weight="700" text-anchor="middle">↔ 1, 2</text><rect x="459.0" y="1046.4" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#988cce" stroke-width="1.4"/><rect x="459.0" y="1054.4" width="5" height="62.2" rx="2" fill="#4e39ac"/><text x="475.0" y="1068.4" font-size="13.5" fill="#2e206e" font-weight="700" text-anchor="start"><tspan x="475.0">Omisión material</tspan></text><text x="475.0" y="1088.2" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Información conocida cuya ausencia puede cambiar una</tspan><tspan x="475.0" dy="15.2">decisión razonable del destinatario</tspan></text><rect x="798.0" y="1054.4" width="54" height="20" rx="10" fill="#c4bce5" stroke="#988cce" stroke-width="1"/><text x="825.0" y="1068.4" font-size="11" fill="#2e206e" font-weight="700" text-anchor="middle">↔ 1</text><text x="40" y="1156.5400000000002" font-size="11.5" fill="#4e39ac" font-weight="700" letter-spacing="1.4">QUÉ SE MIDE: NUMERADOR SOBRE DENOMINADOR</text><rect x="40.0" y="1170.5" width="261.3" height="159.7" rx="8" fill="#e6e2f7" stroke="#988cce" stroke-width="1.4"/><text x="54.0" y="1192.5" font-size="13" fill="#2e206e" font-weight="700" text-anchor="start"><tspan x="54.0">Cobertura de control</tspan></text><text x="54.0" y="1221.7" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Afirmaciones con matriz completa</tspan></text><line x1="54.0" y1="1242.9" x2="287.3" y2="1242.9" stroke="#4e39ac" stroke-width="2"/><text x="54.0" y="1260.9" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="54.0">Afirmaciones detectadas</tspan></text><text x="54.0" y="1290.1" font-size="10.5" fill="#7b8794" font-weight="400" text-anchor="start"><tspan x="54.0">Ventana: cada ciclo editorial</tspan></text><rect x="319.3" y="1170.5" width="261.3" height="159.7" rx="8" fill="#e6e2f7" stroke="#988cce" stroke-width="1.4"/><text x="333.3" y="1192.5" font-size="13" fill="#2e206e" font-weight="700" text-anchor="start"><tspan x="333.3">Correcciones antes de</tspan><tspan x="333.3" dy="17.2">publicación</tspan></text><text x="333.3" y="1238.9" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="333.3">Afirmaciones corregidas o retiradas</tspan><tspan x="333.3" dy="15.2">antes de salir</tspan></text><line x1="333.3" y1="1275.2" x2="566.7" y2="1275.2" stroke="#4e39ac" stroke-width="2"/><text x="333.3" y="1293.2" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="333.3">Afirmaciones observadas</tspan></text><text x="333.3" y="1322.4" font-size="10.5" fill="#7b8794" font-weight="400" text-anchor="start"><tspan x="333.3">Ventana: mes</tspan></text><rect x="598.7" y="1170.5" width="261.3" height="159.7" rx="8" fill="#e6e2f7" stroke="#988cce" stroke-width="1.4"/><text x="612.7" y="1192.5" font-size="13" fill="#2e206e" font-weight="700" text-anchor="start"><tspan x="612.7">Respuesta adversa oportuna</tspan></text><text x="612.7" y="1221.7" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="612.7">Incidentes materiales comunicados</tspan><tspan x="612.7" dy="15.2">dentro del plazo</tspan></text><line x1="612.7" y1="1258.1" x2="846.0" y2="1258.1" stroke="#4e39ac" stroke-width="2"/><text x="612.7" y="1276.1" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="612.7">Incidentes materiales</tspan></text><text x="612.7" y="1305.2" font-size="10.5" fill="#7b8794" font-weight="400" text-anchor="start"><tspan x="612.7">Ventana: trimestre</tspan></text><text x="40" y="1364.2600000000002" font-size="11.5" fill="#4e39ac" font-weight="700" letter-spacing="1.4">FRONTERA DE APLICACIÓN</text><rect x="40" y="1374.3" width="820" height="81.5" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.4"/><polygon points="70,1400.0100000000002 52,1429.0100000000002 88,1429.0100000000002" fill="#c2410c"/><text x="70" y="1426.0100000000002" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">!</text><text x="106" y="1398.3" font-size="12.5" fill="#7c2d12" font-weight="400" text-anchor="start"><tspan x="106">Un flujo de aprobación con demasiados pasos mata la producción. El control debe concentrarse en</tspan><tspan x="106" dy="16.5">afirmaciones con riesgo y terminar cuando existe evidencia vigente, responsable y decisión registrada.</tspan><tspan x="106" dy="16.5">Este ejercicio previene persuasión engañosa; no enseña a ocultarla mejor.</tspan></text><text x="40" y="1483.7600000000002" font-size="11.5" fill="#4e39ac" font-weight="700" letter-spacing="1.4">ERROR FRECUENTE Y SU CORRECCIÓN</text><rect x="40" y="1493.8" width="380.0" height="77.0" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/><text x="54" y="1515.8" font-size="11" fill="#b91c1c" font-weight="700" text-anchor="start"><tspan x="54">Síntoma</tspan></text><text x="54" y="1533.8" font-size="12.5" fill="#7f1d1d" font-weight="400" text-anchor="start"><tspan x="54">Publicar sin control de afirmaciones</tspan></text><line x1="426.0" y1="1532.3" x2="469.0" y2="1532.3" stroke="#4e39ac" stroke-width="2.6" stroke-linecap="round"/><polygon points="474.0,1532.3 465.9,1536.2 465.9,1528.3" fill="#4e39ac"/><rect x="480.0" y="1493.8" width="380.0" height="77.0" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.4"/><text x="494.0" y="1515.8" font-size="11" fill="#15803d" font-weight="700" text-anchor="start"><tspan x="494.0">Corrección</tspan></text><text x="494.0" y="1533.8" font-size="12.5" fill="#14532d" font-weight="400" text-anchor="start"><tspan x="494.0">Instala una verificación obligatoria de respaldo</tspan><tspan x="494.0" dy="16.5">para toda afirmación cuantitativa o comparativa.</tspan></text></svg>