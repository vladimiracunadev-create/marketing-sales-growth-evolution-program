<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 923" width="900" height="923" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif"><title id="t">Modelo mental · Variables de segmentación B2C</title><desc id="d">Modelo mental de la clase 04.02: Variables de segmentación B2C. Método en 5 pasos; 4 conceptos; 3 señales de medición.</desc><rect x="0" y="0" width="900" height="923" rx="14" fill="#ffffff"/><rect x="0" y="0" width="900" height="64" rx="14" fill="#20646e"/><rect x="0" y="40" width="900" height="24" fill="#20646e"/><text x="40" y="28" font-size="12" fill="#bce0e5" font-weight="700" letter-spacing="1.6">MODELO MENTAL · CLASE 04.02 · PARTE 04</text><text x="40" y="52" font-size="21" fill="#ffffff" font-weight="700">Variables de segmentación B2C</text><text x="40" y="84" font-size="11.5" fill="#399cac" font-weight="700" letter-spacing="1.4">MÉTODO PASO A PASO</text><rect x="40.0" y="100" width="246.7" height="75.5" rx="10" fill="#e2f5f7" stroke="#8cc5ce" stroke-width="1.4"/><text x="54.0" y="122" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Definir la decisión que la</tspan><tspan x="54.0" dy="16.5">segmentación debe informar</tspan></text><circle cx="42.0" cy="102.0" r="14" fill="#20646e"/><text x="42.0" y="106.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><rect x="326.7" y="100" width="246.7" height="75.5" rx="10" fill="#e2f5f7" stroke="#8cc5ce" stroke-width="1.4"/><text x="340.7" y="122" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="340.7">Priorizar variables conductuales</tspan><tspan x="340.7" dy="16.5">por su disponibilidad y poder</tspan><tspan x="340.7" dy="16.5">predictivo</tspan></text><circle cx="328.7" cy="102.0" r="14" fill="#20646e"/><text x="328.7" y="106.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><rect x="613.3" y="100" width="246.7" height="75.5" rx="10" fill="#e2f5f7" stroke="#8cc5ce" stroke-width="1.4"/><text x="627.3" y="122" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="627.3">Complementar con demográficas</tspan><tspan x="627.3" dy="16.5">sólo si mejoran la predicción</tspan></text><circle cx="615.3" cy="102.0" r="14" fill="#20646e"/><text x="615.3" y="106.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><rect x="613.3" y="213.5" width="246.7" height="59.0" rx="10" fill="#e2f5f7" stroke="#8cc5ce" stroke-width="1.4"/><text x="627.3" y="235.5" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="627.3">Verificar tamaño y</tspan><tspan x="627.3" dy="16.5">alcanzabilidad de cada grupo</tspan></text><circle cx="615.3" cy="215.5" r="14" fill="#20646e"/><text x="615.3" y="220.0" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">4</text><rect x="326.7" y="213.5" width="246.7" height="59.0" rx="10" fill="#e2f5f7" stroke="#8cc5ce" stroke-width="1.4"/><text x="340.7" y="235.5" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="340.7">Medir si el tratamiento</tspan><tspan x="340.7" dy="16.5">diferenciado produce efecto</tspan></text><circle cx="328.7" cy="215.5" r="14" fill="#20646e"/><text x="328.7" y="220.0" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">5</text><line x1="289.7" y1="137.8" x2="318.7" y2="137.8" stroke="#399cac" stroke-width="2.2" stroke-linecap="round"/><polygon points="323.7,137.8 315.6,141.7 315.6,133.8" fill="#399cac"/><line x1="576.3" y1="137.8" x2="605.3" y2="137.8" stroke="#399cac" stroke-width="2.2" stroke-linecap="round"/><polygon points="610.3,137.8 602.2,141.7 602.2,133.8" fill="#399cac"/><line x1="736.7" y1="177.5" x2="736.7" y2="205.5" stroke="#399cac" stroke-width="2.2" stroke-linecap="round"/><polygon points="736.7,210.5 732.8,202.4 740.6,202.4" fill="#399cac"/><line x1="610.3" y1="243.0" x2="581.3" y2="243.0" stroke="#399cac" stroke-width="2.2" stroke-linecap="round"/><polygon points="576.3,243.0 584.4,239.1 584.4,246.9" fill="#399cac"/><text x="40" y="310.5" font-size="11.5" fill="#399cac" font-weight="700" letter-spacing="1.4">CONCEPTOS Y DÓNDE ACTÚAN EN EL MÉTODO</text><rect x="40.0" y="324.5" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#8cc5ce" stroke-width="1.4"/><rect x="40.0" y="332.5" width="5" height="62.2" rx="2" fill="#399cac"/><text x="56.0" y="346.5" font-size="13.5" fill="#20646e" font-weight="700" text-anchor="start"><tspan x="56.0">Variable demográfica</tspan></text><text x="56.0" y="366.3" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Característica objetiva de la persona como edad, ingreso,</tspan><tspan x="56.0" dy="15.2">ocupación o composición del hogar</tspan></text><rect x="379.0" y="332.5" width="54" height="20" rx="10" fill="#bce0e5" stroke="#8cc5ce" stroke-width="1"/><text x="406.0" y="346.5" font-size="11" fill="#20646e" font-weight="700" text-anchor="middle">↔ 2, 3</text><rect x="459.0" y="324.5" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#8cc5ce" stroke-width="1.4"/><rect x="459.0" y="332.5" width="5" height="62.2" rx="2" fill="#399cac"/><text x="475.0" y="346.5" font-size="13.5" fill="#20646e" font-weight="700" text-anchor="start"><tspan x="475.0">Variable psicográfica</tspan></text><text x="475.0" y="366.3" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Valores, actitudes e intereses declarados que se asocian a</tspan><tspan x="475.0" dy="15.2">preferencias</tspan></text><rect x="798.0" y="332.5" width="54" height="20" rx="10" fill="#bce0e5" stroke="#8cc5ce" stroke-width="1"/><text x="825.0" y="346.5" font-size="11" fill="#20646e" font-weight="700" text-anchor="middle">↔ 2</text><rect x="40.0" y="416.7" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#8cc5ce" stroke-width="1.4"/><rect x="40.0" y="424.7" width="5" height="62.2" rx="2" fill="#399cac"/><text x="56.0" y="438.7" font-size="13.5" fill="#20646e" font-weight="700" text-anchor="start"><tspan x="56.0">Variable conductual</tspan></text><text x="56.0" y="458.5" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Acción registrada de compra o uso, como frecuencia,</tspan><tspan x="56.0" dy="15.2">recencia o categoría comprada</tspan></text><rect x="379.0" y="424.7" width="54" height="20" rx="10" fill="#bce0e5" stroke="#8cc5ce" stroke-width="1"/><text x="406.0" y="438.7" font-size="11" fill="#20646e" font-weight="700" text-anchor="middle">↔ 2</text><rect x="459.0" y="416.7" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#8cc5ce" stroke-width="1.4"/><rect x="459.0" y="424.7" width="5" height="62.2" rx="2" fill="#399cac"/><text x="475.0" y="438.7" font-size="13.5" fill="#20646e" font-weight="700" text-anchor="start"><tspan x="475.0">Penetración</tspan></text><text x="475.0" y="458.5" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Proporción de la población objetivo que compró la</tspan><tspan x="475.0" dy="15.2">categoría o la marca en un periodo</tspan></text><text x="40" y="526.86" font-size="11.5" fill="#399cac" font-weight="700" letter-spacing="1.4">QUÉ SE MIDE: NUMERADOR SOBRE DENOMINADOR</text><rect x="40.0" y="540.9" width="261.3" height="120.7" rx="8" fill="#e2f5f7" stroke="#8cc5ce" stroke-width="1.4"/><text x="54.0" y="562.9" font-size="13" fill="#20646e" font-weight="700" text-anchor="start"><tspan x="54.0">Penetración por segmento</tspan></text><text x="54.0" y="592.0" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Compradores del segmento en el</tspan><tspan x="54.0" dy="15.2">periodo</tspan></text><line x1="54.0" y1="628.4" x2="287.3" y2="628.4" stroke="#399cac" stroke-width="2"/><text x="54.0" y="646.4" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="54.0">Población estimada del segmento</tspan></text><rect x="319.3" y="540.9" width="261.3" height="120.7" rx="8" fill="#e2f5f7" stroke="#8cc5ce" stroke-width="1.4"/><text x="333.3" y="562.9" font-size="13" fill="#20646e" font-weight="700" text-anchor="start"><tspan x="333.3">Frecuencia de compra</tspan></text><text x="333.3" y="592.0" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="333.3">Compras por comprador en el periodo,</tspan><tspan x="333.3" dy="15.2">por segmento</tspan></text><rect x="598.7" y="540.9" width="261.3" height="120.7" rx="8" fill="#e2f5f7" stroke="#8cc5ce" stroke-width="1.4"/><text x="612.7" y="562.9" font-size="13" fill="#20646e" font-weight="700" text-anchor="start"><tspan x="612.7">Elasticidad de respuesta</tspan></text><text x="612.7" y="592.0" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="612.7">Cambio porcentual en conversión ante</tspan><tspan x="612.7" dy="15.2">el mismo estímulo, comparado entre</tspan><tspan x="612.7" dy="15.2">segmentos</tspan></text><text x="40" y="695.56" font-size="11.5" fill="#399cac" font-weight="700" letter-spacing="1.4">FRONTERA DE APLICACIÓN</text><rect x="40" y="705.6" width="820" height="65.0" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.4"/><polygon points="70,723.06 52,752.06 88,752.06" fill="#c2410c"/><text x="70" y="749.06" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">!</text><text x="106" y="729.6" font-size="12.5" fill="#7c2d12" font-weight="400" text-anchor="start"><tspan x="106">Los datos demográficos y de comportamiento son datos personales: su tratamiento requiere base legal,</tspan><tspan x="106" dy="16.5">finalidad declarada y medidas de seguridad conforme a la normativa vigente en Chile.</tspan></text><text x="40" y="798.56" font-size="11.5" fill="#399cac" font-weight="700" letter-spacing="1.4">ERROR FRECUENTE Y SU CORRECCIÓN</text><rect x="40" y="808.6" width="380.0" height="77.0" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/><text x="54" y="830.6" font-size="11" fill="#b91c1c" font-weight="700" text-anchor="start"><tspan x="54">Síntoma</tspan></text><text x="54" y="848.6" font-size="12.5" fill="#7f1d1d" font-weight="400" text-anchor="start"><tspan x="54">Construir segmentos psicográficos sin verificar</tspan><tspan x="54" dy="16.5">poder predictivo</tspan></text><line x1="426.0" y1="847.1" x2="469.0" y2="847.1" stroke="#399cac" stroke-width="2.6" stroke-linecap="round"/><polygon points="474.0,847.1 465.9,851.0 465.9,843.1" fill="#399cac"/><rect x="480.0" y="808.6" width="380.0" height="77.0" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.4"/><text x="494.0" y="830.6" font-size="11" fill="#15803d" font-weight="700" text-anchor="start"><tspan x="494.0">Corrección</tspan></text><text x="494.0" y="848.6" font-size="12.5" fill="#14532d" font-weight="400" text-anchor="start"><tspan x="494.0">Compara la capacidad predictiva de la variable</tspan><tspan x="494.0" dy="16.5">psicográfica contra una conductual disponible.</tspan></text></svg>