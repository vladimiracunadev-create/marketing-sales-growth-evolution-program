<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 944" width="900" height="944" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif"><title id="t">Modelo mental · Presupuesto y ritmo de gasto</title><desc id="d">Modelo mental de la clase 14.08: Presupuesto y ritmo de gasto. Método en 5 pasos; 4 conceptos; 3 señales de medición.</desc><rect x="0" y="0" width="900" height="944" rx="14" fill="#ffffff"/><rect x="0" y="0" width="900" height="64" rx="14" fill="#6c206e"/><rect x="0" y="40" width="900" height="24" fill="#6c206e"/><text x="40" y="28" font-size="12" fill="#e4bce5" font-weight="700" letter-spacing="1.6">MODELO MENTAL · CLASE 14.08 · PARTE 14</text><text x="40" y="52" font-size="21" fill="#ffffff" font-weight="700">Presupuesto y ritmo de gasto</text><text x="40" y="84" font-size="11.5" fill="#a839ac" font-weight="700" letter-spacing="1.4">MÉTODO PASO A PASO</text><line x1="450.0" y1="94.0" x2="450.0" y2="317.0" stroke="#cb8cce" stroke-width="3" stroke-linecap="round"/><line x1="450.0" y1="121.2" x2="406.0" y2="121.2" stroke="#cb8cce" stroke-width="2"/><rect x="56.0" y="100" width="350" height="42.5" rx="10" fill="#f7e2f7" stroke="#cb8cce" stroke-width="1.4"/><text x="70.0" y="122" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="70.0">Estimar el retorno marginal por canal</tspan></text><circle cx="450.0" cy="121.2" r="15" fill="#6c206e"/><text x="450.0" y="125.8" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><line x1="450.0" y1="159.2" x2="494.0" y2="159.2" stroke="#cb8cce" stroke-width="2"/><rect x="494.0" y="138" width="350" height="42.5" rx="10" fill="#f7e2f7" stroke="#cb8cce" stroke-width="1.4"/><text x="508.0" y="160" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="508.0">Definir el ritmo según estacionalidad observada</tspan></text><circle cx="450.0" cy="159.2" r="15" fill="#6c206e"/><text x="450.0" y="163.8" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><line x1="450.0" y1="205.5" x2="406.0" y2="205.5" stroke="#cb8cce" stroke-width="2"/><rect x="56.0" y="176" width="350" height="59.0" rx="10" fill="#f7e2f7" stroke="#cb8cce" stroke-width="1.4"/><text x="70.0" y="198" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="70.0">Fijar la frecuencia de revisión y el umbral de</tspan><tspan x="70.0" dy="16.5">cambio</tspan></text><circle cx="450.0" cy="205.5" r="15" fill="#6c206e"/><text x="450.0" y="210.0" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><line x1="450.0" y1="235.2" x2="494.0" y2="235.2" stroke="#cb8cce" stroke-width="2"/><rect x="494.0" y="214" width="350" height="42.5" rx="10" fill="#f7e2f7" stroke="#cb8cce" stroke-width="1.4"/><text x="508.0" y="236" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="508.0">Documentar cada reasignación y su justificación</tspan></text><circle cx="450.0" cy="235.2" r="15" fill="#6c206e"/><text x="450.0" y="239.8" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">4</text><line x1="450.0" y1="281.5" x2="406.0" y2="281.5" stroke="#cb8cce" stroke-width="2"/><rect x="56.0" y="252" width="350" height="59.0" rx="10" fill="#f7e2f7" stroke="#cb8cce" stroke-width="1.4"/><text x="70.0" y="274" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="70.0">Evaluar el efecto de las reasignaciones a fin</tspan><tspan x="70.0" dy="16.5">de periodo</tspan></text><circle cx="450.0" cy="281.5" r="15" fill="#6c206e"/><text x="450.0" y="286.0" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">5</text><text x="40" y="353.0" font-size="11.5" fill="#a839ac" font-weight="700" letter-spacing="1.4">CONCEPTOS Y DÓNDE ACTÚAN EN EL MÉTODO</text><rect x="40.0" y="367.0" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#cb8cce" stroke-width="1.4"/><rect x="40.0" y="375.0" width="5" height="62.2" rx="2" fill="#a839ac"/><text x="56.0" y="389.0" font-size="13.5" fill="#6c206e" font-weight="700" text-anchor="start"><tspan x="56.0">Retorno marginal</tspan></text><text x="56.0" y="408.8" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Resultado adicional que produce el siguiente peso</tspan><tspan x="56.0" dy="15.2">invertido en un canal</tspan></text><rect x="379.0" y="375.0" width="54" height="20" rx="10" fill="#e4bce5" stroke="#cb8cce" stroke-width="1"/><text x="406.0" y="389.0" font-size="11" fill="#6c206e" font-weight="700" text-anchor="middle">↔ 1</text><rect x="459.0" y="367.0" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#cb8cce" stroke-width="1.4"/><rect x="459.0" y="375.0" width="5" height="62.2" rx="2" fill="#a839ac"/><text x="475.0" y="389.0" font-size="13.5" fill="#6c206e" font-weight="700" text-anchor="start"><tspan x="475.0">Ritmo de gasto</tspan></text><text x="475.0" y="408.8" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Distribución del presupuesto en el tiempo dentro del</tspan><tspan x="475.0" dy="15.2">periodo</tspan></text><rect x="798.0" y="375.0" width="54" height="20" rx="10" fill="#e4bce5" stroke="#cb8cce" stroke-width="1"/><text x="825.0" y="389.0" font-size="11" fill="#6c206e" font-weight="700" text-anchor="middle">↔ 2</text><rect x="40.0" y="459.2" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#cb8cce" stroke-width="1.4"/><rect x="40.0" y="467.2" width="5" height="62.2" rx="2" fill="#a839ac"/><text x="56.0" y="481.2" font-size="13.5" fill="#6c206e" font-weight="700" text-anchor="start"><tspan x="56.0">Estacionalidad</tspan></text><text x="56.0" y="501.0" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Variación previsible de la demanda según periodo del año o</tspan><tspan x="56.0" dy="15.2">de la semana</tspan></text><rect x="379.0" y="467.2" width="54" height="20" rx="10" fill="#e4bce5" stroke="#cb8cce" stroke-width="1"/><text x="406.0" y="481.2" font-size="11" fill="#6c206e" font-weight="700" text-anchor="middle">↔ 2</text><rect x="459.0" y="459.2" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#cb8cce" stroke-width="1.4"/><rect x="459.0" y="467.2" width="5" height="62.2" rx="2" fill="#a839ac"/><text x="475.0" y="481.2" font-size="13.5" fill="#6c206e" font-weight="700" text-anchor="start"><tspan x="475.0">Sobrerreacción al ruido</tspan></text><text x="475.0" y="501.0" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Cambio de asignación basado en variación aleatoria y no en</tspan><tspan x="475.0" dy="15.2">señal real</tspan></text><text x="40" y="569.36" font-size="11.5" fill="#a839ac" font-weight="700" letter-spacing="1.4">QUÉ SE MIDE: NUMERADOR SOBRE DENOMINADOR</text><rect x="40.0" y="583.4" width="261.3" height="98.7" rx="8" fill="#f7e2f7" stroke="#cb8cce" stroke-width="1.4"/><text x="54.0" y="605.4" font-size="13" fill="#6c206e" font-weight="700" text-anchor="start"><tspan x="54.0">Desviación del ritmo planificado</tspan></text><text x="54.0" y="634.5" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Diferencia entre gasto real y</tspan><tspan x="54.0" dy="15.2">planificado, por semana</tspan></text><rect x="319.3" y="583.4" width="261.3" height="98.7" rx="8" fill="#f7e2f7" stroke="#cb8cce" stroke-width="1.4"/><text x="333.3" y="605.4" font-size="13" fill="#6c206e" font-weight="700" text-anchor="start"><tspan x="333.3">Retorno marginal estimado</tspan></text><text x="333.3" y="634.5" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="333.3">Resultado adicional por peso</tspan><tspan x="333.3" dy="15.2">invertido, por canal y por tramo de</tspan><tspan x="333.3" dy="15.2">inversión</tspan></text><rect x="598.7" y="583.4" width="261.3" height="98.7" rx="8" fill="#f7e2f7" stroke="#cb8cce" stroke-width="1.4"/><text x="612.7" y="605.4" font-size="13" fill="#6c206e" font-weight="700" text-anchor="start"><tspan x="612.7">Frecuencia de reasignación</tspan></text><text x="612.7" y="634.5" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="612.7">Cambios de presupuesto realizados,</tspan><tspan x="612.7" dy="15.2">por trimestre, y su efecto medido</tspan></text><text x="40" y="716.0600000000001" font-size="11.5" fill="#a839ac" font-weight="700" letter-spacing="1.4">FRONTERA DE APLICACIÓN</text><rect x="40" y="726.1" width="820" height="65.0" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.4"/><polygon points="70,743.5600000000001 52,772.5600000000001 88,772.5600000000001" fill="#c2410c"/><text x="70" y="769.5600000000001" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">!</text><text x="106" y="750.1" font-size="12.5" fill="#7c2d12" font-weight="400" text-anchor="start"><tspan x="106">El retorno marginal es difícil de estimar con precisión y varía con el volumen. Las decisiones deben</tspan><tspan x="106" dy="16.5">tomarse con rangos y no con puntos.</tspan></text><text x="40" y="819.0600000000001" font-size="11.5" fill="#a839ac" font-weight="700" letter-spacing="1.4">ERROR FRECUENTE Y SU CORRECCIÓN</text><rect x="40" y="829.1" width="380.0" height="77.0" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/><text x="54" y="851.1" font-size="11" fill="#b91c1c" font-weight="700" text-anchor="start"><tspan x="54">Síntoma</tspan></text><text x="54" y="869.1" font-size="12.5" fill="#7f1d1d" font-weight="400" text-anchor="start"><tspan x="54">Reasignar presupuesto ante variaciones semanales</tspan></text><line x1="426.0" y1="867.6" x2="469.0" y2="867.6" stroke="#a839ac" stroke-width="2.6" stroke-linecap="round"/><polygon points="474.0,867.6 465.9,871.5 465.9,863.6" fill="#a839ac"/><rect x="480.0" y="829.1" width="380.0" height="77.0" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.4"/><text x="494.0" y="851.1" font-size="11" fill="#15803d" font-weight="700" text-anchor="start"><tspan x="494.0">Corrección</tspan></text><text x="494.0" y="869.1" font-size="12.5" fill="#14532d" font-weight="400" text-anchor="start"><tspan x="494.0">Define un umbral de cambio y una frecuencia de</tspan><tspan x="494.0" dy="16.5">revisión que distinga señal de ruido.</tspan></text></svg>