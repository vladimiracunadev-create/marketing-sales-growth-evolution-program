<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 924" width="900" height="924" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif"><title id="t">Modelo mental · Plan go-to-market completo</title><desc id="d">Modelo mental de la clase 22.14: Plan go-to-market completo. Método en 5 pasos; 4 conceptos; 3 señales de medición.</desc><rect x="0" y="0" width="900" height="924" rx="14" fill="#ffffff"/><rect x="0" y="0" width="900" height="64" rx="14" fill="#6e205c"/><rect x="0" y="40" width="900" height="24" fill="#6e205c"/><text x="40" y="28" font-size="12" fill="#e5bcdc" font-weight="700" letter-spacing="1.6">MODELO MENTAL · CLASE 22.14 · PARTE 22</text><text x="40" y="52" font-size="21" fill="#ffffff" font-weight="700">Plan go-to-market completo</text><text x="40" y="84" font-size="11.5" fill="#ac3991" font-weight="700" letter-spacing="1.4">MÉTODO PASO A PASO</text><rect x="40.0" y="100" width="246.7" height="59.0" rx="10" fill="#f7e2f2" stroke="#ce8cbe" stroke-width="1.4"/><text x="54.0" y="122" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Consolidar segmento, propuesta y</tspan><tspan x="54.0" dy="16.5">movimiento</tspan></text><circle cx="42.0" cy="102.0" r="14" fill="#6e205c"/><text x="42.0" y="106.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><rect x="326.7" y="100" width="246.7" height="59.0" rx="10" fill="#f7e2f2" stroke="#ce8cbe" stroke-width="1.4"/><text x="340.7" y="122" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="340.7">Definir canales con su economía</tspan></text><circle cx="328.7" cy="102.0" r="14" fill="#6e205c"/><text x="328.7" y="106.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><rect x="613.3" y="100" width="246.7" height="59.0" rx="10" fill="#f7e2f2" stroke="#ce8cbe" stroke-width="1.4"/><text x="627.3" y="122" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="627.3">Establecer la secuencia y los</tspan><tspan x="627.3" dy="16.5">criterios de expansión</tspan></text><circle cx="615.3" cy="102.0" r="14" fill="#6e205c"/><text x="615.3" y="106.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><rect x="613.3" y="197.0" width="246.7" height="59.0" rx="10" fill="#f7e2f2" stroke="#ce8cbe" stroke-width="1.4"/><text x="627.3" y="219.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="627.3">Verificar la coherencia con la</tspan><tspan x="627.3" dy="16.5">capacidad disponible</tspan></text><circle cx="615.3" cy="199.0" r="14" fill="#6e205c"/><text x="615.3" y="203.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">4</text><rect x="326.7" y="197.0" width="246.7" height="59.0" rx="10" fill="#f7e2f2" stroke="#ce8cbe" stroke-width="1.4"/><text x="340.7" y="219.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="340.7">Definir las métricas de</tspan><tspan x="340.7" dy="16.5">seguimiento y su periodicidad</tspan></text><circle cx="328.7" cy="199.0" r="14" fill="#6e205c"/><text x="328.7" y="203.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">5</text><line x1="289.7" y1="129.5" x2="318.7" y2="129.5" stroke="#ac3991" stroke-width="2.2" stroke-linecap="round"/><polygon points="323.7,129.5 315.6,133.4 315.6,125.6" fill="#ac3991"/><line x1="576.3" y1="129.5" x2="605.3" y2="129.5" stroke="#ac3991" stroke-width="2.2" stroke-linecap="round"/><polygon points="610.3,129.5 602.2,133.4 602.2,125.6" fill="#ac3991"/><line x1="736.7" y1="161.0" x2="736.7" y2="189.0" stroke="#ac3991" stroke-width="2.2" stroke-linecap="round"/><polygon points="736.7,194.0 732.8,185.9 740.6,185.9" fill="#ac3991"/><line x1="610.3" y1="226.5" x2="581.3" y2="226.5" stroke="#ac3991" stroke-width="2.2" stroke-linecap="round"/><polygon points="576.3,226.5 584.4,222.6 584.4,230.4" fill="#ac3991"/><text x="40" y="294.0" font-size="11.5" fill="#ac3991" font-weight="700" letter-spacing="1.4">CONCEPTOS Y DÓNDE ACTÚAN EN EL MÉTODO</text><rect x="40.0" y="308.0" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#ce8cbe" stroke-width="1.4"/><rect x="40.0" y="316.0" width="5" height="62.2" rx="2" fill="#ac3991"/><text x="56.0" y="330.0" font-size="13.5" fill="#6e205c" font-weight="700" text-anchor="start"><tspan x="56.0">Coherencia del plan</tspan></text><text x="56.0" y="349.8" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Compatibilidad entre segmento, propuesta, movimiento,</tspan><tspan x="56.0" dy="15.2">canal y capacidad</tspan></text><rect x="379.0" y="316.0" width="54" height="20" rx="10" fill="#e5bcdc" stroke="#ce8cbe" stroke-width="1"/><text x="406.0" y="330.0" font-size="11" fill="#6e205c" font-weight="700" text-anchor="middle">↔ 1, 4</text><rect x="459.0" y="308.0" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#ce8cbe" stroke-width="1.4"/><rect x="459.0" y="316.0" width="5" height="62.2" rx="2" fill="#ac3991"/><text x="475.0" y="330.0" font-size="13.5" fill="#6e205c" font-weight="700" text-anchor="start"><tspan x="475.0">Secuencia de expansión</tspan></text><text x="475.0" y="349.8" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Orden definido de segmentos y geografías con sus</tspan><tspan x="475.0" dy="15.2">condiciones</tspan></text><rect x="798.0" y="316.0" width="54" height="20" rx="10" fill="#e5bcdc" stroke="#ce8cbe" stroke-width="1"/><text x="825.0" y="330.0" font-size="11" fill="#6e205c" font-weight="700" text-anchor="middle">↔ 3</text><rect x="40.0" y="400.2" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#ce8cbe" stroke-width="1.4"/><rect x="40.0" y="408.2" width="5" height="62.2" rx="2" fill="#ac3991"/><text x="56.0" y="422.2" font-size="13.5" fill="#6e205c" font-weight="700" text-anchor="start"><tspan x="56.0">Criterio de expansión</tspan></text><text x="56.0" y="442.0" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Condición verificable que autoriza abrir el frente</tspan><tspan x="56.0" dy="15.2">siguiente</tspan></text><rect x="379.0" y="408.2" width="54" height="20" rx="10" fill="#e5bcdc" stroke="#ce8cbe" stroke-width="1"/><text x="406.0" y="422.2" font-size="11" fill="#6e205c" font-weight="700" text-anchor="middle">↔ 3</text><rect x="459.0" y="400.2" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#ce8cbe" stroke-width="1.4"/><rect x="459.0" y="408.2" width="5" height="62.2" rx="2" fill="#ac3991"/><text x="475.0" y="422.2" font-size="13.5" fill="#6e205c" font-weight="700" text-anchor="start"><tspan x="475.0">Capacidad comprometida</tspan></text><text x="475.0" y="442.0" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Recursos que el plan requiere frente a los disponibles</tspan></text><rect x="798.0" y="408.2" width="54" height="20" rx="10" fill="#e5bcdc" stroke="#ce8cbe" stroke-width="1"/><text x="825.0" y="422.2" font-size="11" fill="#6e205c" font-weight="700" text-anchor="middle">↔ 4</text><text x="40" y="510.36" font-size="11.5" fill="#ac3991" font-weight="700" letter-spacing="1.4">QUÉ SE MIDE: NUMERADOR SOBRE DENOMINADOR</text><rect x="40.0" y="524.4" width="261.3" height="137.9" rx="8" fill="#f7e2f2" stroke="#ce8cbe" stroke-width="1.4"/><text x="54.0" y="546.4" font-size="13" fill="#6e205c" font-weight="700" text-anchor="start"><tspan x="54.0">Coherencia auditada</tspan></text><text x="54.0" y="575.5" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Elementos del plan compatibles entre</tspan><tspan x="54.0" dy="15.2">sí</tspan></text><line x1="54.0" y1="611.9" x2="287.3" y2="611.9" stroke="#ac3991" stroke-width="2"/><text x="54.0" y="629.9" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="54.0">Elementos revisados</tspan></text><rect x="319.3" y="524.4" width="261.3" height="137.9" rx="8" fill="#f7e2f2" stroke="#ce8cbe" stroke-width="1.4"/><text x="333.3" y="546.4" font-size="13" fill="#6e205c" font-weight="700" text-anchor="start"><tspan x="333.3">Capacidad comprometida frente a</tspan><tspan x="333.3" dy="17.2">disponible</tspan></text><text x="333.3" y="592.7" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="333.3">Recursos requeridos por el plan</tspan></text><line x1="333.3" y1="613.9" x2="566.7" y2="613.9" stroke="#ac3991" stroke-width="2"/><text x="333.3" y="631.9" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="333.3">Recursos existentes</tspan></text><rect x="598.7" y="524.4" width="261.3" height="137.9" rx="8" fill="#f7e2f2" stroke="#ce8cbe" stroke-width="1.4"/><text x="612.7" y="546.4" font-size="13" fill="#6e205c" font-weight="700" text-anchor="start"><tspan x="612.7">Cumplimiento de criterios de</tspan><tspan x="612.7" dy="17.2">expansión</tspan></text><text x="612.7" y="592.7" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="612.7">Frentes abiertos con criterio</tspan><tspan x="612.7" dy="15.2">cumplido</tspan></text><line x1="612.7" y1="629.0" x2="846.0" y2="629.0" stroke="#ac3991" stroke-width="2"/><text x="612.7" y="647.0" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="612.7">Frentes abiertos</tspan></text><text x="40" y="696.22" font-size="11.5" fill="#ac3991" font-weight="700" letter-spacing="1.4">FRONTERA DE APLICACIÓN</text><rect x="40" y="706.2" width="820" height="65.0" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.4"/><polygon points="70,723.72 52,752.72 88,752.72" fill="#c2410c"/><text x="70" y="749.72" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">!</text><text x="106" y="730.2" font-size="12.5" fill="#7c2d12" font-weight="400" text-anchor="start"><tspan x="106">Un plan coherente sobre supuestos falsos sigue siendo un plan equivocado. La coherencia interna no</tspan><tspan x="106" dy="16.5">reemplaza la validación de los supuestos.</tspan></text><text x="40" y="799.22" font-size="11.5" fill="#ac3991" font-weight="700" letter-spacing="1.4">ERROR FRECUENTE Y SU CORRECCIÓN</text><rect x="40" y="809.2" width="380.0" height="77.0" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/><text x="54" y="831.2" font-size="11" fill="#b91c1c" font-weight="700" text-anchor="start"><tspan x="54">Síntoma</tspan></text><text x="54" y="849.2" font-size="12.5" fill="#7f1d1d" font-weight="400" text-anchor="start"><tspan x="54">Abrir varios frentes simultáneos con la misma</tspan><tspan x="54" dy="16.5">capacidad</tspan></text><line x1="426.0" y1="847.7" x2="469.0" y2="847.7" stroke="#ac3991" stroke-width="2.6" stroke-linecap="round"/><polygon points="474.0,847.7 465.9,851.6 465.9,843.8" fill="#ac3991"/><rect x="480.0" y="809.2" width="380.0" height="77.0" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.4"/><text x="494.0" y="831.2" font-size="11" fill="#15803d" font-weight="700" text-anchor="start"><tspan x="494.0">Corrección</tspan></text><text x="494.0" y="849.2" font-size="12.5" fill="#14532d" font-weight="400" text-anchor="start"><tspan x="494.0">Define la secuencia y el criterio que autoriza</tspan><tspan x="494.0" dy="16.5">abrir cada frente siguiente.</tspan></text></svg>