<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 966" width="900" height="966" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif"><title id="t">Modelo mental · Ticket promedio y paquetes</title><desc id="d">Modelo mental de la clase 15.09: Ticket promedio y paquetes. Método en 5 pasos; 4 conceptos; 3 señales de medición.</desc><rect x="0" y="0" width="900" height="966" rx="14" fill="#ffffff"/><rect x="0" y="0" width="900" height="64" rx="14" fill="#6e2033"/><rect x="0" y="40" width="900" height="24" fill="#6e2033"/><text x="40" y="28" font-size="12" fill="#e5bcc6" font-weight="700" letter-spacing="1.6">MODELO MENTAL · CLASE 15.09 · PARTE 15</text><text x="40" y="52" font-size="21" fill="#ffffff" font-weight="700">Ticket promedio y paquetes</text><text x="40" y="84" font-size="11.5" fill="#ac3956" font-weight="700" letter-spacing="1.4">MÉTODO PASO A PASO</text><line x1="450.0" y1="94.0" x2="450.0" y2="300.5" stroke="#ce8c9d" stroke-width="3" stroke-linecap="round"/><line x1="450.0" y1="121.2" x2="406.0" y2="121.2" stroke="#ce8c9d" stroke-width="2"/><rect x="56.0" y="100" width="350" height="42.5" rx="10" fill="#f7e2e7" stroke="#ce8c9d" stroke-width="1.4"/><text x="70.0" y="122" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="70.0">Analizar qué productos se compran juntos</tspan></text><circle cx="450.0" cy="121.2" r="15" fill="#6e2033"/><text x="450.0" y="125.8" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><line x1="450.0" y1="159.2" x2="494.0" y2="159.2" stroke="#ce8c9d" stroke-width="2"/><rect x="494.0" y="138" width="350" height="42.5" rx="10" fill="#f7e2e7" stroke="#ce8c9d" stroke-width="1.4"/><text x="508.0" y="160" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="508.0">Diseñar paquetes con lógica de uso real</tspan></text><circle cx="450.0" cy="159.2" r="15" fill="#6e2033"/><text x="450.0" y="163.8" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><line x1="450.0" y1="205.5" x2="406.0" y2="205.5" stroke="#ce8c9d" stroke-width="2"/><rect x="56.0" y="176" width="350" height="59.0" rx="10" fill="#f7e2e7" stroke="#ce8c9d" stroke-width="1.4"/><text x="70.0" y="198" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="70.0">Definir umbrales de beneficio con margen</tspan><tspan x="70.0" dy="16.5">verificado</tspan></text><circle cx="450.0" cy="205.5" r="15" fill="#6e2033"/><text x="450.0" y="210.0" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><line x1="450.0" y1="235.2" x2="494.0" y2="235.2" stroke="#ce8c9d" stroke-width="2"/><rect x="494.0" y="214" width="350" height="42.5" rx="10" fill="#f7e2e7" stroke="#ce8c9d" stroke-width="1.4"/><text x="508.0" y="236" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="508.0">Medir efecto conjunto en ticket y en conversión</tspan></text><circle cx="450.0" cy="235.2" r="15" fill="#6e2033"/><text x="450.0" y="239.8" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">4</text><line x1="450.0" y1="273.2" x2="406.0" y2="273.2" stroke="#ce8c9d" stroke-width="2"/><rect x="56.0" y="252" width="350" height="42.5" rx="10" fill="#f7e2e7" stroke="#ce8c9d" stroke-width="1.4"/><text x="70.0" y="274" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="70.0">Revisar devoluciones asociadas a los paquetes</tspan></text><circle cx="450.0" cy="273.2" r="15" fill="#6e2033"/><text x="450.0" y="277.8" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">5</text><text x="40" y="336.5" font-size="11.5" fill="#ac3956" font-weight="700" letter-spacing="1.4">CONCEPTOS Y DÓNDE ACTÚAN EN EL MÉTODO</text><rect x="40.0" y="350.5" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#ce8c9d" stroke-width="1.4"/><rect x="40.0" y="358.5" width="5" height="62.2" rx="2" fill="#ac3956"/><text x="56.0" y="372.5" font-size="13.5" fill="#6e2033" font-weight="700" text-anchor="start"><tspan x="56.0">Ticket promedio</tspan></text><text x="56.0" y="392.3" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Ingreso del periodo dividido por número de pedidos</tspan></text><rect x="379.0" y="358.5" width="54" height="20" rx="10" fill="#e5bcc6" stroke="#ce8c9d" stroke-width="1"/><text x="406.0" y="372.5" font-size="11" fill="#6e2033" font-weight="700" text-anchor="middle">↔ 4</text><rect x="459.0" y="350.5" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#ce8c9d" stroke-width="1.4"/><rect x="459.0" y="358.5" width="5" height="62.2" rx="2" fill="#ac3956"/><text x="475.0" y="372.5" font-size="13.5" fill="#6e2033" font-weight="700" text-anchor="start"><tspan x="475.0">Paquete pertinente</tspan></text><text x="475.0" y="392.3" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Combinación que el cliente usaría efectivamente en</tspan><tspan x="475.0" dy="15.2">conjunto</tspan></text><rect x="798.0" y="358.5" width="54" height="20" rx="10" fill="#e5bcc6" stroke="#ce8c9d" stroke-width="1"/><text x="825.0" y="372.5" font-size="11" fill="#6e2033" font-weight="700" text-anchor="middle">↔ 2, 4, 5</text><rect x="40.0" y="442.7" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#ce8c9d" stroke-width="1.4"/><rect x="40.0" y="450.7" width="5" height="62.2" rx="2" fill="#ac3956"/><text x="56.0" y="464.7" font-size="13.5" fill="#6e2033" font-weight="700" text-anchor="start"><tspan x="56.0">Umbral de beneficio</tspan></text><text x="56.0" y="484.5" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Monto que activa un incentivo como despacho sin costo</tspan></text><rect x="379.0" y="450.7" width="54" height="20" rx="10" fill="#e5bcc6" stroke="#ce8c9d" stroke-width="1"/><text x="406.0" y="464.7" font-size="11" fill="#6e2033" font-weight="700" text-anchor="middle">↔ 3</text><rect x="459.0" y="442.7" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#ce8c9d" stroke-width="1.4"/><rect x="459.0" y="450.7" width="5" height="62.2" rx="2" fill="#ac3956"/><text x="475.0" y="464.7" font-size="13.5" fill="#6e2033" font-weight="700" text-anchor="start"><tspan x="475.0">Efecto sobre conversión</tspan></text><text x="475.0" y="484.5" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Cambio en la tasa de compra provocado por la intervención</tspan><tspan x="475.0" dy="15.2">de ticket</tspan></text><rect x="798.0" y="450.7" width="54" height="20" rx="10" fill="#e5bcc6" stroke="#ce8c9d" stroke-width="1"/><text x="825.0" y="464.7" font-size="11" fill="#6e2033" font-weight="700" text-anchor="middle">↔ 4</text><text x="40" y="552.86" font-size="11.5" fill="#ac3956" font-weight="700" letter-spacing="1.4">QUÉ SE MIDE: NUMERADOR SOBRE DENOMINADOR</text><rect x="40.0" y="566.9" width="261.3" height="137.9" rx="8" fill="#f7e2e7" stroke="#ce8c9d" stroke-width="1.4"/><text x="54.0" y="588.9" font-size="13" fill="#6e2033" font-weight="700" text-anchor="start"><tspan x="54.0">Ticket promedio por segmento</tspan></text><text x="54.0" y="618.0" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Ingreso</tspan></text><line x1="54.0" y1="639.2" x2="287.3" y2="639.2" stroke="#ac3956" stroke-width="2"/><text x="54.0" y="657.2" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="54.0">Pedidos, por segmento y periodo</tspan></text><rect x="319.3" y="566.9" width="261.3" height="137.9" rx="8" fill="#f7e2e7" stroke="#ce8c9d" stroke-width="1.4"/><text x="333.3" y="588.9" font-size="13" fill="#6e2033" font-weight="700" text-anchor="start"><tspan x="333.3">Efecto en conversión</tspan></text><text x="333.3" y="618.0" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="333.3">Tasa de compra del grupo con la</tspan><tspan x="333.3" dy="15.2">intervención</tspan></text><line x1="333.3" y1="654.4" x2="566.7" y2="654.4" stroke="#ac3956" stroke-width="2"/><text x="333.3" y="672.4" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="333.3">Tasa del grupo de control, en el</tspan><tspan x="333.3" dy="15.2">mismo periodo</tspan></text><rect x="598.7" y="566.9" width="261.3" height="137.9" rx="8" fill="#f7e2e7" stroke="#ce8c9d" stroke-width="1.4"/><text x="612.7" y="588.9" font-size="13" fill="#6e2033" font-weight="700" text-anchor="start"><tspan x="612.7">Devoluciones de productos en</tspan><tspan x="612.7" dy="17.2">paquete</tspan></text><text x="612.7" y="635.2" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="612.7">Devoluciones de productos vendidos</tspan><tspan x="612.7" dy="15.2">en paquete</tspan></text><line x1="612.7" y1="671.5" x2="846.0" y2="671.5" stroke="#ac3956" stroke-width="2"/><text x="612.7" y="689.5" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="612.7">Unidades vendidas en paquete</tspan></text><text x="40" y="738.72" font-size="11.5" fill="#ac3956" font-weight="700" letter-spacing="1.4">FRONTERA DE APLICACIÓN</text><rect x="40" y="748.7" width="820" height="65.0" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.4"/><polygon points="70,766.22 52,795.22 88,795.22" fill="#c2410c"/><text x="70" y="792.22" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">!</text><text x="106" y="772.7" font-size="12.5" fill="#7c2d12" font-weight="400" text-anchor="start"><tspan x="106">Subir el ticket puede reducir la frecuencia de compra. La evaluación debe considerar el ingreso por</tspan><tspan x="106" dy="16.5">cliente en el periodo, no sólo el ticket por pedido.</tspan></text><text x="40" y="841.72" font-size="11.5" fill="#ac3956" font-weight="700" letter-spacing="1.4">ERROR FRECUENTE Y SU CORRECCIÓN</text><rect x="40" y="851.7" width="380.0" height="77.0" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/><text x="54" y="873.7" font-size="11" fill="#b91c1c" font-weight="700" text-anchor="start"><tspan x="54">Síntoma</tspan></text><text x="54" y="891.7" font-size="12.5" fill="#7f1d1d" font-weight="400" text-anchor="start"><tspan x="54">Fijar umbrales de beneficio bajo el ticket promedio</tspan></text><line x1="426.0" y1="890.2" x2="469.0" y2="890.2" stroke="#ac3956" stroke-width="2.6" stroke-linecap="round"/><polygon points="474.0,890.2 465.9,894.1 465.9,886.3" fill="#ac3956"/><rect x="480.0" y="851.7" width="380.0" height="77.0" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.4"/><text x="494.0" y="873.7" font-size="11" fill="#15803d" font-weight="700" text-anchor="start"><tspan x="494.0">Corrección</tspan></text><text x="494.0" y="891.7" font-size="12.5" fill="#14532d" font-weight="400" text-anchor="start"><tspan x="494.0">Ubica el umbral por sobre el ticket actual y</tspan><tspan x="494.0" dy="16.5">verifica el efecto en margen y conversión.</tspan></text></svg>