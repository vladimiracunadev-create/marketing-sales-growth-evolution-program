<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 966" width="900" height="966" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif"><title id="t">Modelo mental · Cierre y documentación</title><desc id="d">Modelo mental de la clase 10.13: Cierre y documentación. Método en 5 pasos; 4 conceptos; 3 señales de medición.</desc><rect x="0" y="0" width="900" height="966" rx="14" fill="#ffffff"/><rect x="0" y="0" width="900" height="64" rx="14" fill="#2d6e20"/><rect x="0" y="40" width="900" height="24" fill="#2d6e20"/><text x="40" y="28" font-size="12" fill="#c3e5bc" font-weight="700" letter-spacing="1.6">MODELO MENTAL · CLASE 10.13 · PARTE 10</text><text x="40" y="52" font-size="21" fill="#ffffff" font-weight="700">Cierre y documentación</text><text x="40" y="84" font-size="11.5" fill="#4cac39" font-weight="700" letter-spacing="1.4">MÉTODO PASO A PASO</text><line x1="450.0" y1="94.0" x2="450.0" y2="300.5" stroke="#97ce8c" stroke-width="3" stroke-linecap="round"/><line x1="450.0" y1="121.2" x2="406.0" y2="121.2" stroke="#97ce8c" stroke-width="2"/><rect x="56.0" y="100" width="350" height="42.5" rx="10" fill="#e6f7e2" stroke="#97ce8c" stroke-width="1.4"/><text x="70.0" y="122" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="70.0">Resumir por escrito dentro de las 24 horas</tspan></text><circle cx="450.0" cy="121.2" r="15" fill="#2d6e20"/><text x="450.0" y="125.8" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><line x1="450.0" y1="167.5" x2="494.0" y2="167.5" stroke="#97ce8c" stroke-width="2"/><rect x="494.0" y="138" width="350" height="59.0" rx="10" fill="#e6f7e2" stroke="#97ce8c" stroke-width="1.4"/><text x="508.0" y="160" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="508.0">Detallar condiciones, exclusiones y</tspan><tspan x="508.0" dy="16.5">responsables</tspan></text><circle cx="450.0" cy="167.5" r="15" fill="#2d6e20"/><text x="450.0" y="172.0" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><line x1="450.0" y1="197.2" x2="406.0" y2="197.2" stroke="#97ce8c" stroke-width="2"/><rect x="56.0" y="176" width="350" height="42.5" rx="10" fill="#e6f7e2" stroke="#97ce8c" stroke-width="1.4"/><text x="70.0" y="198" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="70.0">Solicitar confirmación explícita</tspan></text><circle cx="450.0" cy="197.2" r="15" fill="#2d6e20"/><text x="450.0" y="201.8" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><line x1="450.0" y1="235.2" x2="494.0" y2="235.2" stroke="#97ce8c" stroke-width="2"/><rect x="494.0" y="214" width="350" height="42.5" rx="10" fill="#e6f7e2" stroke="#97ce8c" stroke-width="1.4"/><text x="508.0" y="236" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="508.0">Archivar en el sistema accesible para operación</tspan></text><circle cx="450.0" cy="235.2" r="15" fill="#2d6e20"/><text x="450.0" y="239.8" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">4</text><line x1="450.0" y1="273.2" x2="406.0" y2="273.2" stroke="#97ce8c" stroke-width="2"/><rect x="56.0" y="252" width="350" height="42.5" rx="10" fill="#e6f7e2" stroke="#97ce8c" stroke-width="1.4"/><text x="70.0" y="274" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="70.0">Revisar el cumplimiento en los hitos definidos</tspan></text><circle cx="450.0" cy="273.2" r="15" fill="#2d6e20"/><text x="450.0" y="277.8" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">5</text><text x="40" y="336.5" font-size="11.5" fill="#4cac39" font-weight="700" letter-spacing="1.4">CONCEPTOS Y DÓNDE ACTÚAN EN EL MÉTODO</text><rect x="40.0" y="350.5" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#97ce8c" stroke-width="1.4"/><rect x="40.0" y="358.5" width="5" height="62.2" rx="2" fill="#4cac39"/><text x="56.0" y="372.5" font-size="13.5" fill="#2d6e20" font-weight="700" text-anchor="start"><tspan x="56.0">Resumen de acuerdo</tspan></text><text x="56.0" y="392.3" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Documento breve que registra lo convenido, sus condiciones</tspan><tspan x="56.0" dy="15.2">y sus responsables</tspan></text><rect x="379.0" y="358.5" width="54" height="20" rx="10" fill="#c3e5bc" stroke="#97ce8c" stroke-width="1"/><text x="406.0" y="372.5" font-size="11" fill="#2d6e20" font-weight="700" text-anchor="middle">↔ 1, 2</text><rect x="459.0" y="350.5" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#97ce8c" stroke-width="1.4"/><rect x="459.0" y="358.5" width="5" height="62.2" rx="2" fill="#4cac39"/><text x="475.0" y="372.5" font-size="13.5" fill="#2d6e20" font-weight="700" text-anchor="start"><tspan x="475.0">Confirmación bilateral</tspan></text><text x="475.0" y="392.3" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Aceptación explícita de ambas partes sobre el contenido</tspan><tspan x="475.0" dy="15.2">del resumen</tspan></text><rect x="798.0" y="358.5" width="54" height="20" rx="10" fill="#c3e5bc" stroke="#97ce8c" stroke-width="1"/><text x="825.0" y="372.5" font-size="11" fill="#2d6e20" font-weight="700" text-anchor="middle">↔ 3</text><rect x="40.0" y="442.7" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#97ce8c" stroke-width="1.4"/><rect x="40.0" y="450.7" width="5" height="62.2" rx="2" fill="#4cac39"/><text x="56.0" y="464.7" font-size="13.5" fill="#2d6e20" font-weight="700" text-anchor="start"><tspan x="56.0">Trazabilidad del acuerdo</tspan></text><text x="56.0" y="484.5" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Posibilidad de reconstruir qué se acordó, cuándo y con</tspan><tspan x="56.0" dy="15.2">quién</tspan></text><rect x="459.0" y="442.7" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#97ce8c" stroke-width="1.4"/><rect x="459.0" y="450.7" width="5" height="62.2" rx="2" fill="#4cac39"/><text x="475.0" y="464.7" font-size="13.5" fill="#2d6e20" font-weight="700" text-anchor="start"><tspan x="475.0">Divergencia de memoria</tspan></text><text x="475.0" y="484.5" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Diferencia progresiva entre lo que cada parte recuerda</tspan><tspan x="475.0" dy="15.2">haber acordado</tspan></text><text x="40" y="552.86" font-size="11.5" fill="#4cac39" font-weight="700" letter-spacing="1.4">QUÉ SE MIDE: NUMERADOR SOBRE DENOMINADOR</text><rect x="40.0" y="566.9" width="261.3" height="120.7" rx="8" fill="#e6f7e2" stroke="#97ce8c" stroke-width="1.4"/><text x="54.0" y="588.9" font-size="13" fill="#2d6e20" font-weight="700" text-anchor="start"><tspan x="54.0">Acuerdos con resumen enviado</tspan></text><text x="54.0" y="618.0" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Acuerdos con resumen dentro de 24</tspan><tspan x="54.0" dy="15.2">horas</tspan></text><line x1="54.0" y1="654.4" x2="287.3" y2="654.4" stroke="#4cac39" stroke-width="2"/><text x="54.0" y="672.4" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="54.0">Acuerdos alcanzados</tspan></text><rect x="319.3" y="566.9" width="261.3" height="120.7" rx="8" fill="#e6f7e2" stroke="#97ce8c" stroke-width="1.4"/><text x="333.3" y="588.9" font-size="13" fill="#2d6e20" font-weight="700" text-anchor="start"><tspan x="333.3">Tasa de confirmación bilateral</tspan></text><text x="333.3" y="618.0" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="333.3">Resúmenes confirmados por la</tspan><tspan x="333.3" dy="15.2">contraparte</tspan></text><line x1="333.3" y1="654.4" x2="566.7" y2="654.4" stroke="#4cac39" stroke-width="2"/><text x="333.3" y="672.4" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="333.3">Resúmenes enviados</tspan></text><rect x="598.7" y="566.9" width="261.3" height="120.7" rx="8" fill="#e6f7e2" stroke="#97ce8c" stroke-width="1.4"/><text x="612.7" y="588.9" font-size="13" fill="#2d6e20" font-weight="700" text-anchor="start"><tspan x="612.7">Conflictos por interpretación</tspan></text><text x="612.7" y="618.0" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="612.7">Disputas sobre lo acordado</tspan></text><line x1="612.7" y1="639.2" x2="846.0" y2="639.2" stroke="#4cac39" stroke-width="2"/><text x="612.7" y="657.2" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="612.7">Contratos vigentes</tspan></text><text x="40" y="721.56" font-size="11.5" fill="#4cac39" font-weight="700" letter-spacing="1.4">FRONTERA DE APLICACIÓN</text><rect x="40" y="731.6" width="820" height="65.0" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.4"/><polygon points="70,749.06 52,778.06 88,778.06" fill="#c2410c"/><text x="70" y="775.06" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">!</text><text x="106" y="755.6" font-size="12.5" fill="#7c2d12" font-weight="400" text-anchor="start"><tspan x="106">Un resumen demasiado extenso desincentiva la confirmación. Debe ser breve, específico y verificable, con</tspan><tspan x="106" dy="16.5">anexos para el detalle.</tspan></text><text x="40" y="824.56" font-size="11.5" fill="#4cac39" font-weight="700" letter-spacing="1.4">ERROR FRECUENTE Y SU CORRECCIÓN</text><rect x="40" y="834.6" width="380.0" height="93.5" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/><text x="54" y="856.6" font-size="11" fill="#b91c1c" font-weight="700" text-anchor="start"><tspan x="54">Síntoma</tspan></text><text x="54" y="874.6" font-size="12.5" fill="#7f1d1d" font-weight="400" text-anchor="start"><tspan x="54">Cerrar sin resumen escrito confirmado</tspan></text><line x1="426.0" y1="881.3" x2="469.0" y2="881.3" stroke="#4cac39" stroke-width="2.6" stroke-linecap="round"/><polygon points="474.0,881.3 465.9,885.2 465.9,877.4" fill="#4cac39"/><rect x="480.0" y="834.6" width="380.0" height="93.5" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.4"/><text x="494.0" y="856.6" font-size="11" fill="#15803d" font-weight="700" text-anchor="start"><tspan x="494.0">Corrección</tspan></text><text x="494.0" y="874.6" font-size="12.5" fill="#14532d" font-weight="400" text-anchor="start"><tspan x="494.0">Envía el resumen dentro de 24 horas y solicita</tspan><tspan x="494.0" dy="16.5">confirmación explícita antes de iniciar la</tspan><tspan x="494.0" dy="16.5">ejecución.</tspan></text></svg>