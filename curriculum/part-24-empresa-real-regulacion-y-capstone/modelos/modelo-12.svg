<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1487" width="900" height="1487" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif"><title id="t">Modelo mental · Cumplimiento normativo en Chile</title><desc id="d">Modelo mental de la clase 24.12: Cumplimiento normativo en Chile. Método en 9 pasos; 9 conceptos; 5 señales de medición.</desc><rect x="0" y="0" width="900" height="1487" rx="14" fill="#ffffff"/><rect x="0" y="0" width="900" height="64" rx="14" fill="#6e5e20"/><rect x="0" y="40" width="900" height="24" fill="#6e5e20"/><text x="40" y="28" font-size="12" fill="#e5ddbc" font-weight="700" letter-spacing="1.6">MODELO MENTAL · CLASE 24.12 · PARTE 24</text><text x="40" y="52" font-size="21" fill="#ffffff" font-weight="700">Cumplimiento normativo en Chile</text><text x="40" y="84" font-size="11.5" fill="#ac9539" font-weight="700" letter-spacing="1.4">MÉTODO PASO A PASO</text><rect x="40.0" y="100" width="246.7" height="59.0" rx="10" fill="#f7f3e2" stroke="#cec08c" stroke-width="1.4"/><text x="54.0" y="122" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Identificar las obligaciones</tspan><tspan x="54.0" dy="16.5">aplicables a la operación</tspan></text><circle cx="42.0" cy="102.0" r="14" fill="#6e5e20"/><text x="42.0" y="106.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><rect x="326.7" y="100" width="246.7" height="59.0" rx="10" fill="#f7f3e2" stroke="#cec08c" stroke-width="1.4"/><text x="340.7" y="122" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="340.7">Traducir cada una en requisitos</tspan><tspan x="340.7" dy="16.5">de diseño concretos</tspan></text><circle cx="328.7" cy="102.0" r="14" fill="#6e5e20"/><text x="328.7" y="106.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><rect x="613.3" y="100" width="246.7" height="59.0" rx="10" fill="#f7f3e2" stroke="#cec08c" stroke-width="1.4"/><text x="627.3" y="122" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="627.3">Verificar la vigencia en fuente</tspan><tspan x="627.3" dy="16.5">primaria</tspan></text><circle cx="615.3" cy="102.0" r="14" fill="#6e5e20"/><text x="615.3" y="106.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><rect x="613.3" y="197.0" width="246.7" height="75.5" rx="10" fill="#f7f3e2" stroke="#cec08c" stroke-width="1.4"/><text x="627.3" y="219.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="627.3">Documentar el cumplimiento con</tspan><tspan x="627.3" dy="16.5">evidencia</tspan></text><circle cx="615.3" cy="199.0" r="14" fill="#6e5e20"/><text x="615.3" y="203.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">4</text><rect x="326.7" y="197.0" width="246.7" height="75.5" rx="10" fill="#f7f3e2" stroke="#cec08c" stroke-width="1.4"/><text x="340.7" y="219.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="340.7">Separar hechos, alegaciones,</tspan><tspan x="340.7" dy="16.5">posición regulatoria, respuesta</tspan><tspan x="340.7" dy="16.5">y análisis</tspan></text><circle cx="328.7" cy="199.0" r="14" fill="#6e5e20"/><text x="328.7" y="203.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">5</text><rect x="40.0" y="197.0" width="246.7" height="75.5" rx="10" fill="#f7f3e2" stroke="#cec08c" stroke-width="1.4"/><text x="54.0" y="219.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Clasificar claims, testimonios,</tspan><tspan x="54.0" dy="16.5">comparaciones e identidades</tspan><tspan x="54.0" dy="16.5">antes de publicar</tspan></text><circle cx="42.0" cy="199.0" r="14" fill="#6e5e20"/><text x="42.0" y="203.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">6</text><rect x="40.0" y="310.5" width="246.7" height="75.5" rx="10" fill="#f7f3e2" stroke="#cec08c" stroke-width="1.4"/><text x="54.0" y="332.5" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Documentar fecha de hechos,</tspan><tspan x="54.0" dy="16.5">publicación, consulta,</tspan><tspan x="54.0" dy="16.5">jurisdicción y estado procesal</tspan></text><circle cx="42.0" cy="312.5" r="14" fill="#6e5e20"/><text x="42.0" y="317.0" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">7</text><rect x="326.7" y="310.5" width="246.7" height="75.5" rx="10" fill="#f7f3e2" stroke="#cec08c" stroke-width="1.4"/><text x="340.7" y="332.5" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="340.7">Declarar los frentes que</tspan><tspan x="340.7" dy="16.5">requieren asesoría especializada</tspan></text><circle cx="328.7" cy="312.5" r="14" fill="#6e5e20"/><text x="328.7" y="317.0" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">8</text><rect x="613.3" y="310.5" width="246.7" height="75.5" rx="10" fill="#f7f3e2" stroke="#cec08c" stroke-width="1.4"/><text x="627.3" y="332.5" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="627.3">Declarar límites, alternativas y</tspan><tspan x="627.3" dy="16.5">criterio de término</tspan></text><circle cx="615.3" cy="312.5" r="14" fill="#6e5e20"/><text x="615.3" y="317.0" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">9</text><line x1="289.7" y1="129.5" x2="318.7" y2="129.5" stroke="#ac9539" stroke-width="2.2" stroke-linecap="round"/><polygon points="323.7,129.5 315.6,133.4 315.6,125.6" fill="#ac9539"/><line x1="576.3" y1="129.5" x2="605.3" y2="129.5" stroke="#ac9539" stroke-width="2.2" stroke-linecap="round"/><polygon points="610.3,129.5 602.2,133.4 602.2,125.6" fill="#ac9539"/><line x1="736.7" y1="161.0" x2="736.7" y2="189.0" stroke="#ac9539" stroke-width="2.2" stroke-linecap="round"/><polygon points="736.7,194.0 732.8,185.9 740.6,185.9" fill="#ac9539"/><line x1="610.3" y1="234.8" x2="581.3" y2="234.8" stroke="#ac9539" stroke-width="2.2" stroke-linecap="round"/><polygon points="576.3,234.8 584.4,230.8 584.4,238.7" fill="#ac9539"/><line x1="323.7" y1="234.8" x2="294.7" y2="234.8" stroke="#ac9539" stroke-width="2.2" stroke-linecap="round"/><polygon points="289.7,234.8 297.8,230.8 297.8,238.7" fill="#ac9539"/><line x1="163.3" y1="274.5" x2="163.3" y2="302.5" stroke="#ac9539" stroke-width="2.2" stroke-linecap="round"/><polygon points="163.3,307.5 159.4,299.4 167.2,299.4" fill="#ac9539"/><line x1="289.7" y1="348.2" x2="318.7" y2="348.2" stroke="#ac9539" stroke-width="2.2" stroke-linecap="round"/><polygon points="323.7,348.2 315.6,352.2 315.6,344.3" fill="#ac9539"/><line x1="576.3" y1="348.2" x2="605.3" y2="348.2" stroke="#ac9539" stroke-width="2.2" stroke-linecap="round"/><polygon points="610.3,348.2 602.2,352.2 602.2,344.3" fill="#ac9539"/><text x="40" y="424.0" font-size="11.5" fill="#ac9539" font-weight="700" letter-spacing="1.4">CONCEPTOS Y DÓNDE ACTÚAN EN EL MÉTODO</text><rect x="40.0" y="438.0" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#cec08c" stroke-width="1.4"/><rect x="40.0" y="446.0" width="5" height="62.2" rx="2" fill="#ac9539"/><text x="56.0" y="460.0" font-size="13.5" fill="#6e5e20" font-weight="700" text-anchor="start"><tspan x="56.0">Obligación aplicable</tspan></text><text x="56.0" y="479.8" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Requisito normativo que rige la operación propuesta</tspan></text><rect x="379.0" y="446.0" width="54" height="20" rx="10" fill="#e5ddbc" stroke="#cec08c" stroke-width="1"/><text x="406.0" y="460.0" font-size="11" fill="#6e5e20" font-weight="700" text-anchor="middle">↔ 1</text><rect x="459.0" y="438.0" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#cec08c" stroke-width="1.4"/><rect x="459.0" y="446.0" width="5" height="62.2" rx="2" fill="#ac9539"/><text x="475.0" y="460.0" font-size="13.5" fill="#6e5e20" font-weight="700" text-anchor="start"><tspan x="475.0">Requisito de diseño</tspan></text><text x="475.0" y="479.8" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Consecuencia concreta de la norma sobre un proceso o</tspan><tspan x="475.0" dy="15.2">material</tspan></text><rect x="798.0" y="446.0" width="54" height="20" rx="10" fill="#e5ddbc" stroke="#cec08c" stroke-width="1"/><text x="825.0" y="460.0" font-size="11" fill="#6e5e20" font-weight="700" text-anchor="middle">↔ 2, 8</text><rect x="40.0" y="530.2" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#cec08c" stroke-width="1.4"/><rect x="40.0" y="538.2" width="5" height="62.2" rx="2" fill="#ac9539"/><text x="56.0" y="552.2" font-size="13.5" fill="#6e5e20" font-weight="700" text-anchor="start"><tspan x="56.0">Verificación en fuente primaria</tspan></text><text x="56.0" y="572.0" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Comprobación de la norma en su texto oficial vigente</tspan></text><rect x="379.0" y="538.2" width="54" height="20" rx="10" fill="#e5ddbc" stroke="#cec08c" stroke-width="1"/><text x="406.0" y="552.2" font-size="11" fill="#6e5e20" font-weight="700" text-anchor="middle">↔ 3</text><rect x="459.0" y="530.2" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#cec08c" stroke-width="1.4"/><rect x="459.0" y="538.2" width="5" height="62.2" rx="2" fill="#ac9539"/><text x="475.0" y="552.2" font-size="13.5" fill="#6e5e20" font-weight="700" text-anchor="start"><tspan x="475.0">Registro de cumplimiento</tspan></text><text x="475.0" y="572.0" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Documentación que acredita el cumplimiento ante una</tspan><tspan x="475.0" dy="15.2">revisión</tspan></text><rect x="798.0" y="538.2" width="54" height="20" rx="10" fill="#e5ddbc" stroke="#cec08c" stroke-width="1"/><text x="825.0" y="552.2" font-size="11" fill="#6e5e20" font-weight="700" text-anchor="middle">↔ 4</text><rect x="40.0" y="622.4" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#cec08c" stroke-width="1.4"/><rect x="40.0" y="630.4" width="5" height="62.2" rx="2" fill="#ac9539"/><text x="56.0" y="644.4" font-size="13.5" fill="#6e5e20" font-weight="700" text-anchor="start"><tspan x="56.0">Claim no sustentado</tspan></text><text x="56.0" y="664.2" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Afirmación comercial sin evidencia pertinente para</tspan><tspan x="56.0" dy="15.2">producto, población y resultado declarados</tspan></text><rect x="379.0" y="630.4" width="54" height="20" rx="10" fill="#e5ddbc" stroke="#cec08c" stroke-width="1"/><text x="406.0" y="644.4" font-size="11" fill="#6e5e20" font-weight="700" text-anchor="middle">↔ 6</text><rect x="459.0" y="622.4" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#cec08c" stroke-width="1.4"/><rect x="459.0" y="630.4" width="5" height="62.2" rx="2" fill="#ac9539"/><text x="475.0" y="644.4" font-size="13.5" fill="#6e5e20" font-weight="700" text-anchor="start"><tspan x="475.0">Publicidad engañosa</tspan></text><text x="475.0" y="664.2" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Representación u omisión material capaz de inducir una</tspan><tspan x="475.0" dy="15.2">conclusión falsa</tspan></text><rect x="798.0" y="630.4" width="54" height="20" rx="10" fill="#e5ddbc" stroke="#cec08c" stroke-width="1"/><text x="825.0" y="644.4" font-size="11" fill="#6e5e20" font-weight="700" text-anchor="middle">↔ 6, 7</text><rect x="40.0" y="714.5" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#cec08c" stroke-width="1.4"/><rect x="40.0" y="722.5" width="5" height="62.2" rx="2" fill="#ac9539"/><text x="56.0" y="736.5" font-size="13.5" fill="#6e5e20" font-weight="700" text-anchor="start"><tspan x="56.0">Falsa autoridad</tspan></text><text x="56.0" y="756.4" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Identidad o representación que aparenta una credencial</tspan><tspan x="56.0" dy="15.2">profesional no verificable</tspan></text><rect x="459.0" y="714.5" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#cec08c" stroke-width="1.4"/><rect x="459.0" y="722.5" width="5" height="62.2" rx="2" fill="#ac9539"/><text x="475.0" y="736.5" font-size="13.5" fill="#6e5e20" font-weight="700" text-anchor="start"><tspan x="475.0">Información clínica</tspan></text><text x="475.0" y="756.4" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Contenido sobre condición, tratamiento, seguridad,</tspan><tspan x="475.0" dy="15.2">eficacia o uso que exige control especializado</tspan></text><rect x="40.0" y="806.7" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#cec08c" stroke-width="1.4"/><rect x="40.0" y="814.7" width="5" height="62.2" rx="2" fill="#ac9539"/><text x="56.0" y="828.7" font-size="13.5" fill="#6e5e20" font-weight="700" text-anchor="start"><tspan x="56.0">Estado de la fuente</tspan></text><text x="56.0" y="848.5" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Distinción explícita entre alegación, hecho acreditado,</tspan><tspan x="56.0" dy="15.2">condena y recurso</tspan></text><rect x="379.0" y="814.7" width="54" height="20" rx="10" fill="#e5ddbc" stroke="#cec08c" stroke-width="1"/><text x="406.0" y="828.7" font-size="11" fill="#6e5e20" font-weight="700" text-anchor="middle">↔ 3, 5, 7</text><text x="40" y="916.9000000000003" font-size="11.5" fill="#ac9539" font-weight="700" letter-spacing="1.4">QUÉ SE MIDE: NUMERADOR SOBRE DENOMINADOR</text><rect x="40.0" y="930.9" width="261.3" height="159.7" rx="8" fill="#f7f3e2" stroke="#cec08c" stroke-width="1.4"/><text x="54.0" y="952.9" font-size="13" fill="#6e5e20" font-weight="700" text-anchor="start"><tspan x="54.0">Obligaciones identificadas y</tspan><tspan x="54.0" dy="17.2">cubiertas</tspan></text><text x="54.0" y="999.2" font-size="11.5" fi