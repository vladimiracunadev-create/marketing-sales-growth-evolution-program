<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1282" width="900" height="1282" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif"><title id="t">Modelo mental · Crecimiento centrado en retención</title><desc id="d">Modelo mental de la clase 19.06: Crecimiento centrado en retención. Método en 5 pasos; 4 conceptos; 3 señales de medición.</desc><rect x="0" y="0" width="900" height="1282" rx="14" fill="#ffffff"/><rect x="0" y="0" width="900" height="64" rx="14" fill="#206e65"/><rect x="0" y="40" width="900" height="24" fill="#206e65"/><text x="40" y="28" font-size="12" fill="#bce5e0" font-weight="700" letter-spacing="1.6">MODELO MENTAL · CLASE 19.06 · PARTE 19</text><text x="40" y="52" font-size="21" fill="#ffffff" font-weight="700">Crecimiento centrado en retención</text><text x="40" y="84" font-size="11.5" fill="#39ac9e" font-weight="700" letter-spacing="1.4">MÉTODO PASO A PASO</text><ellipse cx="450.0" cy="376.8" rx="330.0" ry="233.1" fill="none" stroke="#8ccec6" stroke-width="2" stroke-dasharray="3 8" stroke-linecap="round"/><polygon points="653.8,193.3 636.3,190.4 641.2,180.8" fill="#39ac9e"/><polygon points="759.3,458.8 761.4,441.2 771.2,445.7" fill="#39ac9e"/><polygon points="439.0,609.9 455.9,604.4 455.9,615.3" fill="#39ac9e"/><polygon points="131.6,438.8 143.5,451.9 133.7,456.4" fill="#39ac9e"/><polygon points="265.8,183.2 253.2,195.8 248.3,186.1" fill="#39ac9e"/><circle cx="450.0" cy="376.8" r="100.0" fill="#bce5e0" stroke="#8ccec6" stroke-width="1.6"/><text x="450.0" y="359.1" font-size="15" fill="#206e65" font-weight="700" text-anchor="middle"><tspan x="450.0">Crecimiento</tspan><tspan x="450.0" dy="19.8">centrado en</tspan><tspan x="450.0" dy="19.8">retención</tspan></text><rect x="361.0" y="106.0" width="178" height="75.5" rx="10" fill="#e2f7f5" stroke="#8ccec6" stroke-width="1.4"/><text x="373.0" y="128.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="373.0">Verificar si la curva</tspan><tspan x="373.0" dy="16.5">de retención se</tspan><tspan x="373.0" dy="16.5">estabiliza</tspan></text><circle cx="363.0" cy="108.0" r="14" fill="#206e65"/><text x="363.0" y="112.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><rect x="674.8" y="267.0" width="178" height="75.5" rx="10" fill="#e2f7f5" stroke="#8ccec6" stroke-width="1.4"/><text x="686.8" y="289.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="686.8">Definir el umbral que</tspan><tspan x="686.8" dy="16.5">autoriza escalar</tspan><tspan x="686.8" dy="16.5">adquisición</tspan></text><circle cx="676.8" cy="269.0" r="14" fill="#206e65"/><text x="676.8" y="273.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><rect x="555.0" y="535.8" width="178" height="59.0" rx="10" fill="#e2f7f5" stroke="#8ccec6" stroke-width="1.4"/><text x="567.0" y="557.8" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="567.0">Calcular el costo de</tspan><tspan x="567.0" dy="16.5">la fuga actual</tspan></text><circle cx="557.0" cy="537.8" r="14" fill="#206e65"/><text x="557.0" y="542.3" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><rect x="167.0" y="527.6" width="178" height="75.5" rx="10" fill="#e2f7f5" stroke="#8ccec6" stroke-width="1.4"/><text x="179.0" y="549.6" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="179.0">Priorizar</tspan><tspan x="179.0" dy="16.5">intervenciones de</tspan><tspan x="179.0" dy="16.5">retención</tspan></text><circle cx="169.0" cy="529.6" r="14" fill="#206e65"/><text x="169.0" y="534.1" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">4</text><rect x="47.2" y="267.0" width="178" height="75.5" rx="10" fill="#e2f7f5" stroke="#8ccec6" stroke-width="1.4"/><text x="59.2" y="289.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="59.2">Escalar adquisición</tspan><tspan x="59.2" dy="16.5">sólo tras superar el</tspan><tspan x="59.2" dy="16.5">umbral</tspan></text><circle cx="49.2" cy="269.0" r="14" fill="#206e65"/><text x="49.2" y="273.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">5</text><text x="40" y="689.6" font-size="11.5" fill="#39ac9e" font-weight="700" letter-spacing="1.4">CONCEPTOS Y DÓNDE ACTÚAN EN EL MÉTODO</text><rect x="40.0" y="703.6" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#8ccec6" stroke-width="1.4"/><rect x="40.0" y="711.6" width="5" height="62.2" rx="2" fill="#39ac9e"/><text x="56.0" y="725.6" font-size="13.5" fill="#206e65" font-weight="700" text-anchor="start"><tspan x="56.0">Curva estabilizada</tspan></text><text x="56.0" y="745.4" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Retención que deja de caer y se aplana en un nivel</tspan><tspan x="56.0" dy="15.2">positivo</tspan></text><rect x="379.0" y="711.6" width="54" height="20" rx="10" fill="#bce5e0" stroke="#8ccec6" stroke-width="1"/><text x="406.0" y="725.6" font-size="11" fill="#206e65" font-weight="700" text-anchor="middle">↔ 1</text><rect x="459.0" y="703.6" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#8ccec6" stroke-width="1.4"/><rect x="459.0" y="711.6" width="5" height="62.2" rx="2" fill="#39ac9e"/><text x="475.0" y="725.6" font-size="13.5" fill="#206e65" font-weight="700" text-anchor="start"><tspan x="475.0">Orden de inversión</tspan></text><text x="475.0" y="745.4" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Secuencia que prioriza retención antes que adquisición</tspan></text><rect x="798.0" y="711.6" width="54" height="20" rx="10" fill="#bce5e0" stroke="#8ccec6" stroke-width="1"/><text x="825.0" y="725.6" font-size="11" fill="#206e65" font-weight="700" text-anchor="middle">↔ 4</text><rect x="40.0" y="795.8" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#8ccec6" stroke-width="1.4"/><rect x="40.0" y="803.8" width="5" height="62.2" rx="2" fill="#39ac9e"/><text x="56.0" y="817.8" font-size="13.5" fill="#206e65" font-weight="700" text-anchor="start"><tspan x="56.0">Costo de la fuga</tspan></text><text x="56.0" y="837.6" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Ingreso perdido por invertir en adquisición sobre una base</tspan><tspan x="56.0" dy="15.2">que no retiene</tspan></text><rect x="379.0" y="803.8" width="54" height="20" rx="10" fill="#bce5e0" stroke="#8ccec6" stroke-width="1"/><text x="406.0" y="817.8" font-size="11" fill="#206e65" font-weight="700" text-anchor="middle">↔ 3</text><rect x="459.0" y="795.8" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#8ccec6" stroke-width="1.4"/><rect x="459.0" y="803.8" width="5" height="62.2" rx="2" fill="#39ac9e"/><text x="475.0" y="817.8" font-size="13.5" fill="#206e65" font-weight="700" text-anchor="start"><tspan x="475.0">Umbral de escalamiento</tspan></text><text x="475.0" y="837.6" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Nivel de retención a partir del cual conviene escalar</tspan><tspan x="475.0" dy="15.2">adquisición</tspan></text><rect x="798.0" y="803.8" width="54" height="20" rx="10" fill="#bce5e0" stroke="#8ccec6" stroke-width="1"/><text x="825.0" y="817.8" font-size="11" fill="#206e65" font-weight="700" text-anchor="middle">↔ 2, 5</text><text x="40" y="905.96" font-size="11.5" fill="#39ac9e" font-weight="700" letter-spacing="1.4">QUÉ SE MIDE: NUMERADOR SOBRE DENOMINADOR</text><rect x="40.0" y="920.0" width="261.3" height="100.7" rx="8" fill="#e2f7f5" stroke="#8ccec6" stroke-width="1.4"/><text x="54.0" y="942.0" font-size="13" fill="#206e65" font-weight="700" text-anchor="start"><tspan x="54.0">Nivel de estabilización de la</tspan><tspan x="54.0" dy="17.2">curva</tspan></text><text x="54.0" y="988.3" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Porcentaje en que la retención se</tspan><tspan x="54.0" dy="15.2">aplana, por cohorte</tspan></text><rect x="319.3" y="920.0" width="261.3" height="100.7" rx="8" fill="#e2f7f5" stroke="#8ccec6" stroke-width="1.4"/><text x="333.3" y="942.0" font-size="13" fill="#206e65" font-weight="700" text-anchor="start"><tspan x="333.3">Costo de la fuga</tspan></text><text x="333.3" y="971.1" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="333.3">Ingreso perdido estimado por bajas</tspan><tspan x="333.3" dy="15.2">de clientes adquiridos en el periodo</tspan></text><rect x="598.7" y="920.0" width="261.3" height="100.7" rx="8" fill="#e2f7f5" stroke="#8ccec6" stroke-width="1.4"/><text x="612.7" y="942.0" font-size="13" fill="#206e65" font-weight="700" text-anchor="start"><tspan x="612.7">Relación inversión</tspan><tspan x="612.7" dy="17.2">retención-adquisición</tspan></text><text x="612.7" y="988.3" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="612.7">Presupuesto asignado a cada frente,</tspan><tspan x="612.7" dy="15.2">por trimestre</tspan></text><text x="40" y="1054.64" font-size="11.5" fill="#39ac9e" font-weight="700" letter-spacing="1.4">FRONTERA DE APLICACIÓN</text><rect x="40" y="1064.6" width="820" height="65.0" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.4"/><polygon points="70,1082.14 52,1111.14 88,1111.14" fill="#c2410c"/><text x="70" y="1108.14" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">!</text><text x="106" y="1088.6" font-size="12.5" fill="#7c2d12" font-weight="400" text-anchor="start"><tspan x="106">Detener toda adquisición mientras se arregla la retención puede matar la caja. La decisión realista es</tspan><tspan x="106" dy="16.5">sostener y no escalar hasta superar el umbral.</tspan></text><text x="40" y="1157.64" font-size="11.5" fill="#39ac9e" font-weight="700" letter-spacing="1.4">ERROR FRECUENTE Y SU CORRECCIÓN</text><rect x="40" y="1167.6" width="380.0" height="77.0" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/><text x="54" y="1189.6" font-size="11" fill="#b91c1c" font-weight="700" text-anchor="start"><tspan x="54">Síntoma</tspan></text><text x="54" y="1207.6" font-size="12.5" fill="#7f1d1d" font-weight="400" text-anchor="start"><tspan x="54">Escalar adquisición con retención no estabilizada</tspan></text><line x1="426.0" y1="1206.1" x2="469.0" y2="1206.1" stroke="#39ac9e" stroke-width="2.6" stroke-linecap="round"/><polygon points="474.0,1206.1 465.9,1210.1 465.9,1202.2" fill="#39ac9e"/><rect x="480.0" y="1167.6" width="380.0" height="77.0" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.4"/><text x="494.0" y="1189.6" font-size="11" fill="#15803d" font-weight="700" text-anchor="start"><tspan x="494.0">Corrección</tspan></text><text x="494.0" y="1207.6" font-size="12.5" fill="#14532d" font-weight="400" text-anchor="start"><tspan x="494.0">Define el umbral de retención que autoriza escalar</tspan><tspan x="494.0" dy="16.5">y respétalo como regla de inversión.</tspan></text></svg>