<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 902" width="900" height="902" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif"><title id="t">Modelo mental · Van Westendorp y técnicas de investigación de precio</title><desc id="d">Modelo mental de la clase 07.07: Van Westendorp y técnicas de investigación de precio. Método en 5 pasos; 4 conceptos; 3 señales de medición.</desc><rect x="0" y="0" width="900" height="902" rx="14" fill="#ffffff"/><rect x="0" y="0" width="900" height="64" rx="14" fill="#6e2048"/><rect x="0" y="40" width="900" height="24" fill="#6e2048"/><text x="40" y="28" font-size="12" fill="#e5bcd1" font-weight="700" letter-spacing="1.6">MODELO MENTAL · CLASE 07.07 · PARTE 07</text><text x="40" y="52" font-size="21" fill="#ffffff" font-weight="700">Van Westendorp y técnicas de investigación de precio</text><text x="40" y="84" font-size="11.5" fill="#ac3974" font-weight="700" letter-spacing="1.4">MÉTODO PASO A PASO</text><rect x="40.0" y="100" width="246.7" height="75.5" rx="10" fill="#f7e2ed" stroke="#ce8cae" stroke-width="1.4"/><text x="54.0" y="122" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Elegir la técnica según</tspan><tspan x="54.0" dy="16.5">decisión, presupuesto y</tspan><tspan x="54.0" dy="16.5">precisión</tspan></text><circle cx="42.0" cy="102.0" r="14" fill="#6e2048"/><text x="42.0" y="106.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><rect x="326.7" y="100" width="246.7" height="75.5" rx="10" fill="#f7e2ed" stroke="#ce8cae" stroke-width="1.4"/><text x="340.7" y="122" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="340.7">Aplicar con muestra</tspan><tspan x="340.7" dy="16.5">representativa del segmento</tspan></text><circle cx="328.7" cy="102.0" r="14" fill="#6e2048"/><text x="328.7" y="106.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><rect x="613.3" y="100" width="246.7" height="75.5" rx="10" fill="#f7e2ed" stroke="#ce8cae" stroke-width="1.4"/><text x="627.3" y="122" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="627.3">Analizar rangos y no puntos</tspan><tspan x="627.3" dy="16.5">únicos</tspan></text><circle cx="615.3" cy="102.0" r="14" fill="#6e2048"/><text x="615.3" y="106.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><rect x="613.3" y="213.5" width="246.7" height="75.5" rx="10" fill="#f7e2ed" stroke="#ce8cae" stroke-width="1.4"/><text x="627.3" y="235.5" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="627.3">Triangular con datos de</tspan><tspan x="627.3" dy="16.5">comportamiento</tspan></text><circle cx="615.3" cy="215.5" r="14" fill="#6e2048"/><text x="615.3" y="220.0" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">4</text><rect x="326.7" y="213.5" width="246.7" height="75.5" rx="10" fill="#f7e2ed" stroke="#ce8cae" stroke-width="1.4"/><text x="340.7" y="235.5" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="340.7">Declarar el nivel de</tspan><tspan x="340.7" dy="16.5">incertidumbre en la</tspan><tspan x="340.7" dy="16.5">recomendación</tspan></text><circle cx="328.7" cy="215.5" r="14" fill="#6e2048"/><text x="328.7" y="220.0" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">5</text><line x1="289.7" y1="137.8" x2="318.7" y2="137.8" stroke="#ac3974" stroke-width="2.2" stroke-linecap="round"/><polygon points="323.7,137.8 315.6,141.7 315.6,133.8" fill="#ac3974"/><line x1="576.3" y1="137.8" x2="605.3" y2="137.8" stroke="#ac3974" stroke-width="2.2" stroke-linecap="round"/><polygon points="610.3,137.8 602.2,141.7 602.2,133.8" fill="#ac3974"/><line x1="736.7" y1="177.5" x2="736.7" y2="205.5" stroke="#ac3974" stroke-width="2.2" stroke-linecap="round"/><polygon points="736.7,210.5 732.8,202.4 740.6,202.4" fill="#ac3974"/><line x1="610.3" y1="251.2" x2="581.3" y2="251.2" stroke="#ac3974" stroke-width="2.2" stroke-linecap="round"/><polygon points="576.3,251.2 584.4,247.3 584.4,255.2" fill="#ac3974"/><text x="40" y="327.0" font-size="11.5" fill="#ac3974" font-weight="700" letter-spacing="1.4">CONCEPTOS Y DÓNDE ACTÚAN EN EL MÉTODO</text><rect x="40.0" y="341.0" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#ce8cae" stroke-width="1.4"/><rect x="40.0" y="349.0" width="5" height="62.2" rx="2" fill="#ac3974"/><text x="56.0" y="363.0" font-size="13.5" fill="#6e2048" font-weight="700" text-anchor="start"><tspan x="56.0">Rango de precios aceptable</tspan></text><text x="56.0" y="382.8" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Intervalo entre el punto de baratura excesiva y el de</tspan><tspan x="56.0" dy="15.2">carestía excesiva</tspan></text><rect x="379.0" y="349.0" width="54" height="20" rx="10" fill="#e5bcd1" stroke="#ce8cae" stroke-width="1"/><text x="406.0" y="363.0" font-size="11" fill="#6e2048" font-weight="700" text-anchor="middle">↔ 1, 3</text><rect x="459.0" y="341.0" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#ce8cae" stroke-width="1.4"/><rect x="459.0" y="349.0" width="5" height="62.2" rx="2" fill="#ac3974"/><text x="475.0" y="363.0" font-size="13.5" fill="#6e2048" font-weight="700" text-anchor="start"><tspan x="475.0">Punto de precio óptimo</tspan></text><text x="475.0" y="382.8" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Cruce de curvas que la técnica sugiere como referencia, no</tspan><tspan x="475.0" dy="15.2">como conclusión</tspan></text><rect x="798.0" y="349.0" width="54" height="20" rx="10" fill="#e5bcd1" stroke="#ce8cae" stroke-width="1"/><text x="825.0" y="363.0" font-size="11" fill="#6e2048" font-weight="700" text-anchor="middle">↔ 1, 3</text><rect x="40.0" y="433.2" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#ce8cae" stroke-width="1.4"/><rect x="40.0" y="441.2" width="5" height="62.2" rx="2" fill="#ac3974"/><text x="56.0" y="455.2" font-size="13.5" fill="#6e2048" font-weight="700" text-anchor="start"><tspan x="56.0">Técnica de compensación</tspan></text><text x="56.0" y="475.0" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Método que fuerza elección entre configuraciones para</tspan><tspan x="56.0" dy="15.2">revelar preferencias</tspan></text><rect x="379.0" y="441.2" width="54" height="20" rx="10" fill="#e5bcd1" stroke="#ce8cae" stroke-width="1"/><text x="406.0" y="455.2" font-size="11" fill="#6e2048" font-weight="700" text-anchor="middle">↔ 1</text><rect x="459.0" y="433.2" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#ce8cae" stroke-width="1.4"/><rect x="459.0" y="441.2" width="5" height="62.2" rx="2" fill="#ac3974"/><text x="475.0" y="455.2" font-size="13.5" fill="#6e2048" font-weight="700" text-anchor="start"><tspan x="475.0">Triangulación de métodos</tspan></text><text x="475.0" y="475.0" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Uso de dos o más técnicas para reducir el sesgo de cada</tspan><tspan x="475.0" dy="15.2">una</tspan></text><rect x="798.0" y="441.2" width="54" height="20" rx="10" fill="#e5bcd1" stroke="#ce8cae" stroke-width="1"/><text x="825.0" y="455.2" font-size="11" fill="#6e2048" font-weight="700" text-anchor="middle">↔ 4</text><text x="40" y="543.36" font-size="11.5" fill="#ac3974" font-weight="700" letter-spacing="1.4">QUÉ SE MIDE: NUMERADOR SOBRE DENOMINADOR</text><rect x="40.0" y="557.4" width="261.3" height="83.5" rx="8" fill="#f7e2ed" stroke="#ce8cae" stroke-width="1.4"/><text x="54.0" y="579.4" font-size="13" fill="#6e2048" font-weight="700" text-anchor="start"><tspan x="54.0">Amplitud del rango aceptable</tspan></text><text x="54.0" y="608.5" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Diferencia entre los extremos del</tspan><tspan x="54.0" dy="15.2">rango identificado, por segmento</tspan></text><rect x="319.3" y="557.4" width="261.3" height="83.5" rx="8" fill="#f7e2ed" stroke="#ce8cae" stroke-width="1.4"/><text x="333.3" y="579.4" font-size="13" fill="#6e2048" font-weight="700" text-anchor="start"><tspan x="333.3">Coincidencia entre métodos</tspan></text><text x="333.3" y="608.5" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="333.3">Diferencia entre el rango declarado</tspan><tspan x="333.3" dy="15.2">y el precio de aceptación observado</tspan></text><rect x="598.7" y="557.4" width="261.3" height="83.5" rx="8" fill="#f7e2ed" stroke="#ce8cae" stroke-width="1.4"/><text x="612.7" y="579.4" font-size="13" fill="#6e2048" font-weight="700" text-anchor="start"><tspan x="612.7">Tamaño de muestra por segmento</tspan></text><text x="612.7" y="608.5" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="612.7">Respuestas válidas por segmento,</tspan><tspan x="612.7" dy="15.2">comparadas con el mínimo definido</tspan></text><text x="40" y="674.88" font-size="11.5" fill="#ac3974" font-weight="700" letter-spacing="1.4">FRONTERA DE APLICACIÓN</text><rect x="40" y="684.9" width="820" height="65.0" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.4"/><polygon points="70,702.38 52,731.38 88,731.38" fill="#c2410c"/><text x="70" y="728.38" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">!</text><text x="106" y="708.9" font-size="12.5" fill="#7c2d12" font-weight="400" text-anchor="start"><tspan x="106">La técnica no considera la alternativa competitiva ni el valor diferencial. Un rango declarado puede estar</tspan><tspan x="106" dy="16.5">completamente por debajo del valor real entregado.</tspan></text><text x="40" y="777.88" font-size="11.5" fill="#ac3974" font-weight="700" letter-spacing="1.4">ERROR FRECUENTE Y SU CORRECCIÓN</text><rect x="40" y="787.9" width="380.0" height="77.0" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/><text x="54" y="809.9" font-size="11" fill="#b91c1c" font-weight="700" text-anchor="start"><tspan x="54">Síntoma</tspan></text><text x="54" y="827.9" font-size="12.5" fill="#7f1d1d" font-weight="400" text-anchor="start"><tspan x="54">Fijar el precio en el extremo inferior del rango</tspan></text><line x1="426.0" y1="826.4" x2="469.0" y2="826.4" stroke="#ac3974" stroke-width="2.6" stroke-linecap="round"/><polygon points="474.0,826.4 465.9,830.3 465.9,822.5" fill="#ac3974"/><rect x="480.0" y="787.9" width="380.0" height="77.0" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.4"/><text x="494.0" y="809.9" font-size="11" fill="#15803d" font-weight="700" text-anchor="start"><tspan x="494.0">Corrección</tspan></text><text x="494.0" y="827.9" font-size="12.5" fill="#14532d" font-weight="400" text-anchor="start"><tspan x="494.0">Contrasta el rango declarado con el valor</tspan><tspan x="494.0" dy="16.5">diferencial cuantificado antes de decidir.</tspan></text></svg>