<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 999" width="900" height="999" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif"><title id="t">Modelo mental · Investigación cuantitativa</title><desc id="d">Modelo mental de la clase 03.07: Investigación cuantitativa. Método en 5 pasos; 4 conceptos; 3 señales de medición.</desc><rect x="0" y="0" width="900" height="999" rx="14" fill="#ffffff"/><rect x="0" y="0" width="900" height="64" rx="14" fill="#206e3b"/><rect x="0" y="40" width="900" height="24" fill="#206e3b"/><text x="40" y="28" font-size="12" fill="#bce5ca" font-weight="700" letter-spacing="1.6">MODELO MENTAL · CLASE 03.07 · PARTE 03</text><text x="40" y="52" font-size="21" fill="#ffffff" font-weight="700">Investigación cuantitativa</text><text x="40" y="84" font-size="11.5" fill="#39ac61" font-weight="700" letter-spacing="1.4">MÉTODO PASO A PASO</text><line x1="450.0" y1="94.0" x2="450.0" y2="317.0" stroke="#8ccea3" stroke-width="3" stroke-linecap="round"/><line x1="450.0" y1="121.2" x2="406.0" y2="121.2" stroke="#8ccea3" stroke-width="2"/><rect x="56.0" y="100" width="350" height="42.5" rx="10" fill="#e2f7e9" stroke="#8ccea3" stroke-width="1.4"/><text x="70.0" y="122" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="70.0">Definir las variables y su forma de medición</tspan></text><circle cx="450.0" cy="121.2" r="15" fill="#206e3b"/><text x="450.0" y="125.8" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><line x1="450.0" y1="167.5" x2="494.0" y2="167.5" stroke="#8ccea3" stroke-width="2"/><rect x="494.0" y="138" width="350" height="59.0" rx="10" fill="#e2f7e9" stroke="#8ccea3" stroke-width="1.4"/><text x="508.0" y="160" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="508.0">Calcular el tamaño de muestra según el efecto</tspan><tspan x="508.0" dy="16.5">mínimo relevante</tspan></text><circle cx="450.0" cy="167.5" r="15" fill="#206e3b"/><text x="450.0" y="172.0" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><line x1="450.0" y1="197.2" x2="406.0" y2="197.2" stroke="#8ccea3" stroke-width="2"/><rect x="56.0" y="176" width="350" height="42.5" rx="10" fill="#e2f7e9" stroke="#8ccea3" stroke-width="1.4"/><text x="70.0" y="198" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="70.0">Recolectar con procedimiento uniforme</tspan></text><circle cx="450.0" cy="197.2" r="15" fill="#206e3b"/><text x="450.0" y="201.8" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><line x1="450.0" y1="235.2" x2="494.0" y2="235.2" stroke="#8ccea3" stroke-width="2"/><rect x="494.0" y="214" width="350" height="42.5" rx="10" fill="#e2f7e9" stroke="#8ccea3" stroke-width="1.4"/><text x="508.0" y="236" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="508.0">Reportar estimación e incertidumbre</tspan></text><circle cx="450.0" cy="235.2" r="15" fill="#206e3b"/><text x="450.0" y="239.8" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">4</text><line x1="450.0" y1="281.5" x2="406.0" y2="281.5" stroke="#8ccea3" stroke-width="2"/><rect x="56.0" y="252" width="350" height="59.0" rx="10" fill="#e2f7e9" stroke="#8ccea3" stroke-width="1.4"/><text x="70.0" y="274" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="70.0">Distinguir explícitamente asociación de</tspan><tspan x="70.0" dy="16.5">causalidad</tspan></text><circle cx="450.0" cy="281.5" r="15" fill="#206e3b"/><text x="450.0" y="286.0" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">5</text><text x="40" y="353.0" font-size="11.5" fill="#39ac61" font-weight="700" letter-spacing="1.4">CONCEPTOS Y DÓNDE ACTÚAN EN EL MÉTODO</text><rect x="40.0" y="367.0" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#8ccea3" stroke-width="1.4"/><rect x="40.0" y="375.0" width="5" height="62.2" rx="2" fill="#39ac61"/><text x="56.0" y="389.0" font-size="13.5" fill="#206e3b" font-weight="700" text-anchor="start"><tspan x="56.0">Variable operacionalizada</tspan></text><text x="56.0" y="408.8" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Concepto traducido en una medición reproducible con unidad</tspan><tspan x="56.0" dy="15.2">y fuente</tspan></text><rect x="379.0" y="375.0" width="54" height="20" rx="10" fill="#bce5ca" stroke="#8ccea3" stroke-width="1"/><text x="406.0" y="389.0" font-size="11" fill="#206e3b" font-weight="700" text-anchor="middle">↔ 1</text><rect x="459.0" y="367.0" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#8ccea3" stroke-width="1.4"/><rect x="459.0" y="375.0" width="5" height="62.2" rx="2" fill="#39ac61"/><text x="475.0" y="389.0" font-size="13.5" fill="#206e3b" font-weight="700" text-anchor="start"><tspan x="475.0">Tamaño de muestra suficiente</tspan></text><text x="475.0" y="408.8" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Número de observaciones necesario para detectar el efecto</tspan><tspan x="475.0" dy="15.2">que importaría</tspan></text><rect x="798.0" y="375.0" width="54" height="20" rx="10" fill="#bce5ca" stroke="#8ccea3" stroke-width="1"/><text x="825.0" y="389.0" font-size="11" fill="#206e3b" font-weight="700" text-anchor="middle">↔ 2</text><rect x="40.0" y="459.2" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#8ccea3" stroke-width="1.4"/><rect x="40.0" y="467.2" width="5" height="62.2" rx="2" fill="#39ac61"/><text x="56.0" y="481.2" font-size="13.5" fill="#206e3b" font-weight="700" text-anchor="start"><tspan x="56.0">Incertidumbre declarada</tspan></text><text x="56.0" y="501.0" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Rango dentro del cual se espera que esté el valor real</tspan></text><rect x="379.0" y="467.2" width="54" height="20" rx="10" fill="#bce5ca" stroke="#8ccea3" stroke-width="1"/><text x="406.0" y="481.2" font-size="11" fill="#206e3b" font-weight="700" text-anchor="middle">↔ 4</text><rect x="459.0" y="459.2" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#8ccea3" stroke-width="1.4"/><rect x="459.0" y="467.2" width="5" height="62.2" rx="2" fill="#39ac61"/><text x="475.0" y="481.2" font-size="13.5" fill="#206e3b" font-weight="700" text-anchor="start"><tspan x="475.0">Asociación frente a causalidad</tspan></text><text x="475.0" y="501.0" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Distinción entre variables que se mueven juntas y</tspan><tspan x="475.0" dy="15.2">variables donde una produce la otra</tspan></text><rect x="798.0" y="467.2" width="54" height="20" rx="10" fill="#bce5ca" stroke="#8ccea3" stroke-width="1"/><text x="825.0" y="481.2" font-size="11" fill="#206e3b" font-weight="700" text-anchor="middle">↔ 5</text><text x="40" y="569.36" font-size="11.5" fill="#39ac61" font-weight="700" letter-spacing="1.4">QUÉ SE MIDE: NUMERADOR SOBRE DENOMINADOR</text><rect x="40.0" y="583.4" width="261.3" height="137.9" rx="8" fill="#e2f7e9" stroke="#8ccea3" stroke-width="1.4"/><text x="54.0" y="605.4" font-size="13" fill="#206e3b" font-weight="700" text-anchor="start"><tspan x="54.0">Potencia del estudio</tspan></text><text x="54.0" y="634.5" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Probabilidad de detectar el efecto</tspan><tspan x="54.0" dy="15.2">mínimo relevante con la muestra</tspan><tspan x="54.0" dy="15.2">disponible, calculada antes de</tspan><tspan x="54.0" dy="15.2">recolectar</tspan></text><rect x="319.3" y="583.4" width="261.3" height="137.9" rx="8" fill="#e2f7e9" stroke="#8ccea3" stroke-width="1.4"/><text x="333.3" y="605.4" font-size="13" fill="#206e3b" font-weight="700" text-anchor="start"><tspan x="333.3">Proporción de resultados con</tspan><tspan x="333.3" dy="17.2">intervalo reportado</tspan></text><text x="333.3" y="651.7" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="333.3">Estimaciones con intervalo de</tspan><tspan x="333.3" dy="15.2">confianza</tspan></text><line x1="333.3" y1="688.0" x2="566.7" y2="688.0" stroke="#39ac61" stroke-width="2"/><text x="333.3" y="706.0" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="333.3">Estimaciones presentadas</tspan></text><rect x="598.7" y="583.4" width="261.3" height="137.9" rx="8" fill="#e2f7e9" stroke="#8ccea3" stroke-width="1.4"/><text x="612.7" y="605.4" font-size="13" fill="#206e3b" font-weight="700" text-anchor="start"><tspan x="612.7">Consistencia entre olas</tspan></text><text x="612.7" y="634.5" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="612.7">Diferencia entre mediciones</tspan><tspan x="612.7" dy="15.2">sucesivas del mismo indicador con el</tspan><tspan x="612.7" dy="15.2">mismo método</tspan></text><text x="40" y="755.22" font-size="11.5" fill="#39ac61" font-weight="700" letter-spacing="1.4">FRONTERA DE APLICACIÓN</text><rect x="40" y="765.2" width="820" height="65.0" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.4"/><polygon points="70,782.72 52,811.72 88,811.72" fill="#c2410c"/><text x="70" y="808.72" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">!</text><text x="106" y="789.2" font-size="12.5" fill="#7c2d12" font-weight="400" text-anchor="start"><tspan x="106">Más muestra no arregla una variable mal definida. Precisión sin validez sólo produce error con más</tspan><tspan x="106" dy="16.5">decimales.</tspan></text><text x="40" y="858.22" font-size="11.5" fill="#39ac61" font-weight="700" letter-spacing="1.4">ERROR FRECUENTE Y SU CORRECCIÓN</text><rect x="40" y="868.2" width="380.0" height="93.5" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/><text x="54" y="890.2" font-size="11" fill="#b91c1c" font-weight="700" text-anchor="start"><tspan x="54">Síntoma</tspan></text><text x="54" y="908.2" font-size="12.5" fill="#7f1d1d" font-weight="400" text-anchor="start"><tspan x="54">Reportar diferencias sin denominador ni</tspan><tspan x="54" dy="16.5">incertidumbre</tspan></text><line x1="426.0" y1="915.0" x2="469.0" y2="915.0" stroke="#39ac61" stroke-width="2.6" stroke-linecap="round"/><polygon points="474.0,915.0 465.9,918.9 465.9,911.1" fill="#39ac61"/><rect x="480.0" y="868.2" width="380.0" height="93.5" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.4"/><text x="494.0" y="890.2" font-size="11" fill="#15803d" font-weight="700" text-anchor="start"><tspan x="494.0">Corrección</tspan></text><text x="494.0" y="908.2" font-size="12.5" fill="#14532d" font-weight="400" text-anchor="start"><tspan x="494.0">Acompaña toda comparación con tamaño de muestra e</tspan><tspan x="494.0" dy="16.5">intervalo, o preséntala como observación</tspan><tspan x="494.0" dy="16.5">exploratoria.</tspan></text></svg>