<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1355" width="900" height="1355" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif"><title id="t">Modelo mental · Internacionalización</title><desc id="d">Modelo mental de la clase 22.12: Internacionalización. Método en 5 pasos; 4 conceptos; 3 señales de medición.</desc><rect x="0" y="0" width="900" height="1355" rx="14" fill="#ffffff"/><rect x="0" y="0" width="900" height="64" rx="14" fill="#6e205c"/><rect x="0" y="40" width="900" height="24" fill="#6e205c"/><text x="40" y="28" font-size="12" fill="#e5bcdc" font-weight="700" letter-spacing="1.6">MODELO MENTAL · CLASE 22.12 · PARTE 22</text><text x="40" y="52" font-size="21" fill="#ffffff" font-weight="700">Internacionalización</text><text x="40" y="84" font-size="11.5" fill="#ac3991" font-weight="700" letter-spacing="1.4">MÉTODO PASO A PASO</text><ellipse cx="450.0" cy="403.2" rx="330.0" ry="251.2" fill="none" stroke="#ce8cbe" stroke-width="2" stroke-dasharray="3 8" stroke-linecap="round"/><polygon points="653.6,205.3 636.2,201.8 641.4,192.4" fill="#ac3991"/><polygon points="759.5,490.9 761.2,473.3 771.1,477.5" fill="#ac3991"/><polygon points="439.0,654.4 455.9,649.0 455.9,659.8" fill="#ac3991"/><polygon points="131.8,470.7 143.4,484.1 133.5,488.4" fill="#ac3991"/><polygon points="265.7,194.7 253.5,207.6 248.3,198.1" fill="#ac3991"/><circle cx="450.0" cy="403.2" r="100.0" fill="#e5bcdc" stroke="#ce8cbe" stroke-width="1.6"/><text x="450.0" y="405.3" font-size="15" fill="#6e205c" font-weight="700" text-anchor="middle"><tspan x="450.0">Internacionalización</tspan></text><rect x="361.0" y="114.2" width="178" height="75.5" rx="10" fill="#f7e2f2" stroke="#ce8cbe" stroke-width="1.4"/><text x="373.0" y="136.2" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="373.0">Evaluar los modos de</tspan><tspan x="373.0" dy="16.5">entrada y su perfil de</tspan><tspan x="373.0" dy="16.5">riesgo</tspan></text><circle cx="363.0" cy="116.2" r="14" fill="#6e205c"/><text x="363.0" y="120.8" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><rect x="674.8" y="279.6" width="178" height="92.0" rx="10" fill="#f7e2f2" stroke="#ce8cbe" stroke-width="1.4"/><text x="686.8" y="301.6" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="686.8">Identificar los</tspan><tspan x="686.8" dy="16.5">requisitos</tspan><tspan x="686.8" dy="16.5">regulatorios del</tspan><tspan x="686.8" dy="16.5">destino</tspan></text><circle cx="676.8" cy="281.6" r="14" fill="#6e205c"/><text x="676.8" y="286.1" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><rect x="555.0" y="576.9" width="178" height="59.0" rx="10" fill="#f7e2f2" stroke="#ce8cbe" stroke-width="1.4"/><text x="567.0" y="598.9" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="567.0">Estimar el costo de</tspan><tspan x="567.0" dy="16.5">coordinación real</tspan></text><circle cx="557.0" cy="578.9" r="14" fill="#6e205c"/><text x="557.0" y="583.4" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><rect x="167.0" y="568.7" width="178" height="75.5" rx="10" fill="#f7e2f2" stroke="#ce8cbe" stroke-width="1.4"/><text x="179.0" y="590.7" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="179.0">Definir hitos y</tspan><tspan x="179.0" dy="16.5">criterio de</tspan><tspan x="179.0" dy="16.5">continuidad</tspan></text><circle cx="169.0" cy="570.7" r="14" fill="#6e205c"/><text x="169.0" y="575.2" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">4</text><rect x="47.2" y="296.1" width="178" height="59.0" rx="10" fill="#f7e2f2" stroke="#ce8cbe" stroke-width="1.4"/><text x="59.2" y="318.1" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="59.2">Revisar la decisión en</tspan><tspan x="59.2" dy="16.5">cada hito con datos</tspan></text><circle cx="49.2" cy="298.1" r="14" fill="#6e205c"/><text x="49.2" y="302.6" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">5</text><text x="40" y="742.4" font-size="11.5" fill="#ac3991" font-weight="700" letter-spacing="1.4">CONCEPTOS Y DÓNDE ACTÚAN EN EL MÉTODO</text><rect x="40.0" y="756.4" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#ce8cbe" stroke-width="1.4"/><rect x="40.0" y="764.4" width="5" height="62.2" rx="2" fill="#ac3991"/><text x="56.0" y="778.4" font-size="13.5" fill="#6e205c" font-weight="700" text-anchor="start"><tspan x="56.0">Modo de entrada</tspan></text><text x="56.0" y="798.2" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Forma jurídica y operativa de operar en el mercado</tspan><tspan x="56.0" dy="15.2">extranjero</tspan></text><rect x="379.0" y="764.4" width="54" height="20" rx="10" fill="#e5bcdc" stroke="#ce8cbe" stroke-width="1"/><text x="406.0" y="778.4" font-size="11" fill="#6e205c" font-weight="700" text-anchor="middle">↔ 1</text><rect x="459.0" y="756.4" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#ce8cbe" stroke-width="1.4"/><rect x="459.0" y="764.4" width="5" height="62.2" rx="2" fill="#ac3991"/><text x="475.0" y="778.4" font-size="13.5" fill="#6e205c" font-weight="700" text-anchor="start"><tspan x="475.0">Complejidad regulatoria</tspan></text><text x="475.0" y="798.2" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Requisitos legales, tributarios y de datos aplicables en</tspan><tspan x="475.0" dy="15.2">el destino</tspan></text><rect x="798.0" y="764.4" width="54" height="20" rx="10" fill="#e5bcdc" stroke="#ce8cbe" stroke-width="1"/><text x="825.0" y="778.4" font-size="11" fill="#6e205c" font-weight="700" text-anchor="middle">↔ 2</text><rect x="40.0" y="848.6" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#ce8cbe" stroke-width="1.4"/><rect x="40.0" y="856.6" width="5" height="62.2" rx="2" fill="#ac3991"/><text x="56.0" y="870.6" font-size="13.5" fill="#6e205c" font-weight="700" text-anchor="start"><tspan x="56.0">Costo de coordinación</tspan></text><text x="56.0" y="890.4" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Esfuerzo de gestionar operaciones en husos, idiomas y</tspan><tspan x="56.0" dy="15.2">culturas distintas</tspan></text><rect x="379.0" y="856.6" width="54" height="20" rx="10" fill="#e5bcdc" stroke="#ce8cbe" stroke-width="1"/><text x="406.0" y="870.6" font-size="11" fill="#6e205c" font-weight="700" text-anchor="middle">↔ 3</text><rect x="459.0" y="848.6" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#ce8cbe" stroke-width="1.4"/><rect x="459.0" y="856.6" width="5" height="62.2" rx="2" fill="#ac3991"/><text x="475.0" y="870.6" font-size="13.5" fill="#6e205c" font-weight="700" text-anchor="start"><tspan x="475.0">Criterio de continuidad</tspan></text><text x="475.0" y="890.4" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Condición que determina si se sostiene o se abandona la</tspan><tspan x="475.0" dy="15.2">operación</tspan></text><rect x="798.0" y="856.6" width="54" height="20" rx="10" fill="#e5bcdc" stroke="#ce8cbe" stroke-width="1"/><text x="825.0" y="870.6" font-size="11" fill="#6e205c" font-weight="700" text-anchor="middle">↔ 4</text><text x="40" y="958.76" font-size="11.5" fill="#ac3991" font-weight="700" letter-spacing="1.4">QUÉ SE MIDE: NUMERADOR SOBRE DENOMINADOR</text><rect x="40.0" y="972.8" width="261.3" height="120.7" rx="8" fill="#f7e2f2" stroke="#ce8cbe" stroke-width="1.4"/><text x="54.0" y="994.8" font-size="13" fill="#6e205c" font-weight="700" text-anchor="start"><tspan x="54.0">Costo acumulado de la operación</tspan><tspan x="54.0" dy="17.2">internacional</tspan></text><text x="54.0" y="1041.1" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Inversión total realizada, comparada</tspan><tspan x="54.0" dy="15.2">con el plan</tspan></text><rect x="319.3" y="972.8" width="261.3" height="120.7" rx="8" fill="#f7e2f2" stroke="#ce8cbe" stroke-width="1.4"/><text x="333.3" y="994.8" font-size="13" fill="#6e205c" font-weight="700" text-anchor="start"><tspan x="333.3">Cumplimiento de hitos</tspan></text><text x="333.3" y="1023.9" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="333.3">Hitos alcanzados en plazo</tspan></text><line x1="333.3" y1="1045.1" x2="566.7" y2="1045.1" stroke="#ac3991" stroke-width="2"/><text x="333.3" y="1063.1" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="333.3">Hitos definidos</tspan></text><rect x="598.7" y="972.8" width="261.3" height="120.7" rx="8" fill="#f7e2f2" stroke="#ce8cbe" stroke-width="1.4"/><text x="612.7" y="994.8" font-size="13" fill="#6e205c" font-weight="700" text-anchor="start"><tspan x="612.7">Contribución de la operación</tspan></text><text x="612.7" y="1023.9" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="612.7">Margen generado por la operación</tspan><tspan x="612.7" dy="15.2">internacional</tspan></text><line x1="612.7" y1="1060.3" x2="846.0" y2="1060.3" stroke="#ac3991" stroke-width="2"/><text x="612.7" y="1078.3" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="612.7">Su costo</tspan></text><text x="40" y="1127.46" font-size="11.5" fill="#ac3991" font-weight="700" letter-spacing="1.4">FRONTERA DE APLICACIÓN</text><rect x="40" y="1137.5" width="820" height="65.0" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.4"/><polygon points="70,1154.96 52,1183.96 88,1183.96" fill="#c2410c"/><text x="70" y="1180.96" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">!</text><text x="106" y="1161.5" font-size="12.5" fill="#7c2d12" font-weight="400" text-anchor="start"><tspan x="106">La internacionalización suele consumir más atención de la dirección de lo previsto, y esa atención se</tspan><tspan x="106" dy="16.5">resta del mercado principal.</tspan></text><text x="40" y="1230.46" font-size="11.5" fill="#ac3991" font-weight="700" letter-spacing="1.4">ERROR FRECUENTE Y SU CORRECCIÓN</text><rect x="40" y="1240.5" width="380.0" height="77.0" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/><text x="54" y="1262.5" font-size="11" fill="#b91c1c" font-weight="700" text-anchor="start"><tspan x="54">Síntoma</tspan></text><text x="54" y="1280.5" font-size="12.5" fill="#7f1d1d" font-weight="400" text-anchor="start"><tspan x="54">Internacionalizar sin definir hitos ni criterio de</tspan><tspan x="54" dy="16.5">continuidad</tspan></text><line x1="426.0" y1="1279.0" x2="469.0" y2="1279.0" stroke="#ac3991" stroke-width="2.6" stroke-linecap="round"/><polygon points="474.0,1279.0 465.9,1282.9 465.9,1275.0" fill="#ac3991"/><rect x="480.0" y="1240.5" width="380.0" height="77.0" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.4"/><text x="494.0" y="1262.5" font-size="11" fill="#15803d" font-weight="700" text-anchor="start"><tspan x="494.0">Corrección</tspan></text><text x="494.0" y="1280.5" font-size="12.5" fill="#14532d" font-weight="400" text-anchor="start"><tspan x="494.0">Establece hitos verificables y la condición que</tspan><tspan x="494.0" dy="16.5">gatillaría el abandono antes de invertir.</tspan></text></svg>