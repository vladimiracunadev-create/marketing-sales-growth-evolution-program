<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1479" width="900" height="1479" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif"><title id="t">Modelo mental · Value Proposition Canvas</title><desc id="d">Modelo mental de la clase 05.02: Value Proposition Canvas. Método en 5 pasos; 8 conceptos; 4 señales de medición.</desc><rect x="0" y="0" width="900" height="1479" rx="14" fill="#ffffff"/><rect x="0" y="0" width="900" height="64" rx="14" fill="#20266e"/><rect x="0" y="40" width="900" height="24" fill="#20266e"/><text x="40" y="28" font-size="12" fill="#bcbfe5" font-weight="700" letter-spacing="1.6">MODELO MENTAL · CLASE 05.02 · PARTE 05</text><text x="40" y="52" font-size="21" fill="#ffffff" font-weight="700">Value Proposition Canvas</text><text x="40" y="84" font-size="11.5" fill="#3942ac" font-weight="700" letter-spacing="1.4">MÉTODO PASO A PASO</text><path d="M66.0,159.0 V202.5 H158.5" fill="none" stroke="#3942ac" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="160.5,202.5 151.5,197.5 151.5,207.5" fill="#3942ac"/><path d="M188.5,232.0 V275.5 H281.0" fill="none" stroke="#3942ac" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="283.0,275.5 274.0,270.5 274.0,280.5" fill="#3942ac"/><path d="M311.0,305.0 V348.5 H403.5" fill="none" stroke="#3942ac" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="405.5,348.5 396.5,343.5 396.5,353.5" fill="#3942ac"/><path d="M433.5,378.0 V421.5 H526.0" fill="none" stroke="#3942ac" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="528.0,421.5 519.0,416.5 519.0,426.5" fill="#3942ac"/><rect x="40.0" y="100.0" width="330" height="59.0" rx="10" fill="#e2e4f7" stroke="#8c92ce" stroke-width="1.4"/><text x="54.0" y="122.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Completar el perfil del cliente sólo con</tspan><tspan x="54.0" dy="16.5">evidencia</tspan></text><circle cx="42.0" cy="102.0" r="14" fill="#20266e"/><text x="42.0" y="106.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><rect x="162.5" y="173.0" width="330" height="59.0" rx="10" fill="#e2e4f7" stroke="#8c92ce" stroke-width="1.4"/><text x="176.5" y="195.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="176.5">Mapear la oferta actual sin idealizarla</tspan></text><circle cx="164.5" cy="175.0" r="14" fill="#20266e"/><text x="164.5" y="179.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><rect x="285.0" y="246.0" width="330" height="59.0" rx="10" fill="#e2e4f7" stroke="#8c92ce" stroke-width="1.4"/><text x="299.0" y="268.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="299.0">Trazar la correspondencia entre ambas</tspan><tspan x="299.0" dy="16.5">mitades</tspan></text><circle cx="287.0" cy="248.0" r="14" fill="#20266e"/><text x="287.0" y="252.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><rect x="407.5" y="319.0" width="330" height="59.0" rx="10" fill="#e2e4f7" stroke="#8c92ce" stroke-width="1.4"/><text x="421.5" y="341.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="421.5">Marcar los supuestos sin evidencia</tspan></text><circle cx="409.5" cy="321.0" r="14" fill="#20266e"/><text x="409.5" y="325.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">4</text><rect x="530.0" y="392.0" width="330" height="59.0" rx="10" fill="#e2e4f7" stroke="#8c92ce" stroke-width="1.4"/><text x="544.0" y="414.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="544.0">Diseñar la validación de los tres supuestos</tspan><tspan x="544.0" dy="16.5">más caros</tspan></text><circle cx="532.0" cy="394.0" r="14" fill="#20266e"/><text x="532.0" y="398.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">5</text><text x="40" y="493.0" font-size="11.5" fill="#3942ac" font-weight="700" letter-spacing="1.4">CONCEPTOS Y DÓNDE ACTÚAN EN EL MÉTODO</text><rect x="40.0" y="507.0" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#8c92ce" stroke-width="1.4"/><rect x="40.0" y="515.0" width="5" height="62.2" rx="2" fill="#3942ac"/><text x="56.0" y="529.0" font-size="13.5" fill="#20266e" font-weight="700" text-anchor="start"><tspan x="56.0">Perfil del cliente</tspan></text><text x="56.0" y="548.8" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Descripción de tareas, dolores y ganancias observadas y no</tspan><tspan x="56.0" dy="15.2">supuestas</tspan></text><rect x="379.0" y="515.0" width="54" height="20" rx="10" fill="#bcbfe5" stroke="#8c92ce" stroke-width="1"/><text x="406.0" y="529.0" font-size="11" fill="#20266e" font-weight="700" text-anchor="middle">↔ 1</text><rect x="459.0" y="507.0" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#8c92ce" stroke-width="1.4"/><rect x="459.0" y="515.0" width="5" height="62.2" rx="2" fill="#3942ac"/><text x="475.0" y="529.0" font-size="13.5" fill="#20266e" font-weight="700" text-anchor="start"><tspan x="475.0">Aliviador de dolor</tspan></text><text x="475.0" y="548.8" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Elemento de la oferta que reduce un dolor específico y</tspan><tspan x="475.0" dy="15.2">documentado</tspan></text><rect x="40.0" y="599.2" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#8c92ce" stroke-width="1.4"/><rect x="40.0" y="607.2" width="5" height="62.2" rx="2" fill="#3942ac"/><text x="56.0" y="621.2" font-size="13.5" fill="#20266e" font-weight="700" text-anchor="start"><tspan x="56.0">Encaje problema-solución</tspan></text><text x="56.0" y="641.0" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Correspondencia verificada entre lo que la oferta hace y</tspan><tspan x="56.0" dy="15.2">lo que el cliente necesita</tspan></text><rect x="459.0" y="599.2" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#8c92ce" stroke-width="1.4"/><rect x="459.0" y="607.2" width="5" height="62.2" rx="2" fill="#3942ac"/><text x="475.0" y="621.2" font-size="13.5" fill="#20266e" font-weight="700" text-anchor="start"><tspan x="475.0">Supuesto no verificado</tspan></text><text x="475.0" y="641.0" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Elemento del canvas sin evidencia asociada, marcado como</tspan><tspan x="475.0" dy="15.2">pendiente de validar</tspan></text><rect x="798.0" y="607.2" width="54" height="20" rx="10" fill="#bcbfe5" stroke="#8c92ce" stroke-width="1"/><text x="825.0" y="621.2" font-size="11" fill="#20266e" font-weight="700" text-anchor="middle">↔ 4, 5</text><rect x="40.0" y="691.4" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#8c92ce" stroke-width="1.4"/><rect x="40.0" y="699.4" width="5" height="62.2" rx="2" fill="#3942ac"/><text x="56.0" y="713.4" font-size="13.5" fill="#20266e" font-weight="700" text-anchor="start"><tspan x="56.0">Valor percibido</tspan></text><text x="56.0" y="733.2" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Balance subjetivo y contextual entre beneficios esperados</tspan><tspan x="56.0" dy="15.2">y sacrificios percibidos por quien decide</tspan></text><rect x="459.0" y="691.4" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#8c92ce" stroke-width="1.4"/><rect x="459.0" y="699.4" width="5" height="62.2" rx="2" fill="#3942ac"/><text x="475.0" y="713.4" font-size="13.5" fill="#20266e" font-weight="700" text-anchor="start"><tspan x="475.0">Sacrificio percibido</tspan></text><text x="475.0" y="733.2" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Precio monetario más costos de transacción, aprendizaje,</tspan><tspan x="475.0" dy="15.2">cambio y riesgos financieros, funcionales o reputacionales</tspan></text><rect x="40.0" y="783.5" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#8c92ce" stroke-width="1.4"/><rect x="40.0" y="791.5" width="5" height="62.2" rx="2" fill="#3942ac"/><text x="56.0" y="805.5" font-size="13.5" fill="#20266e" font-weight="700" text-anchor="start"><tspan x="56.0">Valor creado</tspan></text><text x="56.0" y="825.4" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Beneficio total que la oferta hace posible para cliente,</tspan><tspan x="56.0" dy="15.2">organización y otras partes afectadas</tspan></text><rect x="459.0" y="783.5" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#8c92ce" stroke-width="1.4"/><rect x="459.0" y="791.5" width="5" height="62.2" rx="2" fill="#3942ac"/><text x="475.0" y="805.5" font-size="13.5" fill="#20266e" font-weight="700" text-anchor="start"><tspan x="475.0">Valor capturado</tspan></text><text x="475.0" y="825.4" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Porción del valor creado que la empresa retiene como</tspan><tspan x="475.0" dy="15.2">ingreso, margen, aprendizaje o activo estratégico</tspan></text><text x="40" y="893.7200000000003" font-size="11.5" fill="#3942ac" font-weight="700" letter-spacing="1.4">QUÉ SE MIDE: NUMERADOR SOBRE DENOMINADOR</text><rect x="40.0" y="907.7" width="261.3" height="137.9" rx="8" fill="#e2e4f7" stroke="#8c92ce" stroke-width="1.4"/><text x="54.0" y="929.7" font-size="13" fill="#20266e" font-weight="700" text-anchor="start"><tspan x="54.0">Proporción de elementos con</tspan><tspan x="54.0" dy="17.2">evidencia</tspan></text><text x="54.0" y="976.0" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Elementos del canvas con fuente</tspan><tspan x="54.0" dy="15.2">registrada</tspan></text><line x1="54.0" y1="1012.4" x2="287.3" y2="1012.4" stroke="#3942ac" stroke-width="2"/><text x="54.0" y="1030.4" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="54.0">Elementos totales</tspan></text><rect x="319.3" y="907.7" width="261.3" height="137.9" rx="8" fill="#e2e4f7" stroke="#8c92ce" stroke-width="1.4"/><text x="333.3" y="929.7" font-size="13" fill="#20266e" font-weight="700" text-anchor="start"><tspan x="333.3">Dolores atendidos por la oferta</tspan></text><text x="333.3" y="958.9" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="333.3">Dolores documentados con aliviador</tspan><tspan x="333.3" dy="15.2">correspondiente</tspan></text><line x1="333.3" y1="995.2" x2="566.7" y2="995.2" stroke="#3942ac" stroke-width="2"/><text x="333.3" y="1013.2" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="333.3">Dolores priorizados</tspan></text><rect x="598.7" y="907.7" width="261.3" height="137.9" rx="8" fill="#e2e4f7" stroke="#8c92ce" stroke-width="1.4"/><text x="612.7" y="929.7" font-size="13" fill="#20266e" font-weight="700" text-anchor="start"><tspan x="612.7">Supuestos validados por</tspan><tspan x="612.7" dy="17.2">trimestre</tspan></text><text x="612.7" y="976.0" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="612.7">Supuestos convertidos en hechos con</tspan><tspan x="612.7" dy="15.2">evidencia</tspan></text><line x1="612.7" y1="1012.4" x2="846.0" y2="1012.4" stroke="#3942ac" stroke-width="2"/><text x="612.7" y="1030.4" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="612.7">Supuestos marcados</tspan></text><rect x="40.0" y="1059.6" width="261.3" height="157.7" rx="8" fill="#e2e4f7" stroke="#8c92ce" stroke-width="1.4"/><text x="54.0" y="1081.6" font-size="13" fill="#20266e" font-weight="700" text-anchor="start"><tspan x="54.0">Tasa de valor validado</tspan></text><text x="54.0" y="1110.7" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Beneficios priorizados confirmados</tspan><tspan x="54.0" dy="15.2">con conducta o resultado</tspan></text><line x1="54.0" y1="1147.1" x2="287.3" y2="1147.1" stroke="#3942ac" stroke-width="2"/><text x="54.0" y="1165.1" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="54.0">Beneficios priorizados sometidos a</tspan><tspan x="54.0" dy="15.2">prueba</tspan></text><text x="54.0" y="1209.5" font-size="10.5" fill="#7b8794" font-weight="400" text-anchor="start"><tspan x="54.0">Ventana: por cohorte y trimestre</tspan></text><text x="40" y="1251.3200000000004" font-size="11.5" fill="#3942ac" font-weight="700" letter-spacing="1.4">FRONTERA DE APLICACIÓN</text><rect x="40" y="1261.3" width="820" height="65.0" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.4"/><polygon points="70,1278.8200000000004 52,1307.8200000000004 88,1307.8200000000004" fill="#c2410c"/><text x="70" y="1304.8200000000004" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">!</text><text x="106" y="1285.3" font-size="12.5" fill="#7c2d12" font-weight="400" text-anchor="start"><tspan x="106">El canvas ordena el pensamiento pero no valida nada por sí mismo. Un canvas perfecto puede describir una</tspan><tspan x="106" dy="16.5">propuesta que nadie comprará.</tspan></text><text x="40" y="1354.3200000000004" font-size="11.5" fill="#3942ac" font-weight="700" letter-spacing="1.4">ERROR FRECUENTE Y SU CORRECCIÓN</text><rect x="40" y="1364.3" width="380.0" height="77.0" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/><text x="54" y="1386.3" font-size="11" fill="#b91c1c" font-weight="700" text-anchor="start"><tspan x="54">Síntoma</tspan></text><text x="54" y="1404.3" font-size="12.5" fill="#7f1d1d" font-weight="400" text-anchor="start"><tspan x="54">Llenar el canvas con supuestos sin marcarlos</tspan></text><line x1="426.0" y1="1402.8" x2="469.0" y2="1402.8" stroke="#3942ac" stroke-width="2.6" stroke-linecap="round"/><polygon points="474.0,1402.8 465.9,1406.7 465.9,1398.9" fill="#3942ac"/><rect x="480.0" y="1364.3" width="380.0" height="77.0" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.4"/><text x="494.0" y="1386.3" font-size="11" fill="#15803d" font-weight="700" text-anchor="start"><tspan x="494.0">Corrección</tspan></text><text x="494.0" y="1404.3" font-size="12.5" fill="#14532d" font-weight="400" text-anchor="start"><tspan x="494.0">Marca con color o etiqueta cada elemento sin</tspan><tspan x="494.0" dy="16.5">evidencia y define cómo se validará.</tspan></text></svg>