<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1267" width="900" height="1267" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif"><title id="t">Modelo mental · Análisis de cohortes</title><desc id="d">Modelo mental de la clase 18.09: Análisis de cohortes. Método en 5 pasos; 4 conceptos; 3 señales de medición.</desc><rect x="0" y="0" width="900" height="1267" rx="14" fill="#ffffff"/><rect x="0" y="0" width="900" height="64" rx="14" fill="#206e27"/><rect x="0" y="40" width="900" height="24" fill="#206e27"/><text x="40" y="28" font-size="12" fill="#bce5c0" font-weight="700" letter-spacing="1.6">MODELO MENTAL · CLASE 18.09 · PARTE 18</text><text x="40" y="52" font-size="21" fill="#ffffff" font-weight="700">Análisis de cohortes</text><text x="40" y="84" font-size="11.5" fill="#39ac44" font-weight="700" letter-spacing="1.4">MÉTODO PASO A PASO</text><ellipse cx="450.0" cy="376.8" rx="330.0" ry="233.1" fill="none" stroke="#8cce93" stroke-width="2" stroke-dasharray="3 8" stroke-linecap="round"/><polygon points="653.8,193.3 636.3,190.4 641.2,180.8" fill="#39ac44"/><polygon points="759.3,458.8 761.4,441.2 771.2,445.7" fill="#39ac44"/><polygon points="439.0,609.9 455.9,604.4 455.9,615.3" fill="#39ac44"/><polygon points="131.6,438.8 143.5,451.9 133.7,456.4" fill="#39ac44"/><polygon points="265.8,183.2 253.2,195.8 248.3,186.1" fill="#39ac44"/><circle cx="450.0" cy="376.8" r="100.0" fill="#bce5c0" stroke="#8cce93" stroke-width="1.6"/><text x="450.0" y="369.0" font-size="15" fill="#206e27" font-weight="700" text-anchor="middle"><tspan x="450.0">Análisis de</tspan><tspan x="450.0" dy="19.8">cohortes</tspan></text><rect x="361.0" y="106.0" width="178" height="75.5" rx="10" fill="#e2f7e4" stroke="#8cce93" stroke-width="1.4"/><text x="373.0" y="128.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="373.0">Definir el criterio de</tspan><tspan x="373.0" dy="16.5">cohorte y la métrica a</tspan><tspan x="373.0" dy="16.5">seguir</tspan></text><circle cx="363.0" cy="108.0" r="14" fill="#206e27"/><text x="363.0" y="112.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><rect x="674.8" y="267.0" width="178" height="75.5" rx="10" fill="#e2f7e4" stroke="#8cce93" stroke-width="1.4"/><text x="686.8" y="289.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="686.8">Construir la tabla de</tspan><tspan x="686.8" dy="16.5">cohortes con datos</tspan><tspan x="686.8" dy="16.5">propios</tspan></text><circle cx="676.8" cy="269.0" r="14" fill="#206e27"/><text x="676.8" y="273.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><rect x="555.0" y="527.6" width="178" height="75.5" rx="10" fill="#e2f7e4" stroke="#8cce93" stroke-width="1.4"/><text x="567.0" y="549.6" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="567.0">Comparar cohortes</tspan><tspan x="567.0" dy="16.5">sucesivas en el mismo</tspan><tspan x="567.0" dy="16.5">hito</tspan></text><circle cx="557.0" cy="529.6" r="14" fill="#206e27"/><text x="557.0" y="534.1" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><rect x="167.0" y="527.6" width="178" height="75.5" rx="10" fill="#e2f7e4" stroke="#8cce93" stroke-width="1.4"/><text x="179.0" y="549.6" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="179.0">Atribuir las</tspan><tspan x="179.0" dy="16.5">diferencias a cambios</tspan><tspan x="179.0" dy="16.5">conocidos</tspan></text><circle cx="169.0" cy="529.6" r="14" fill="#206e27"/><text x="169.0" y="534.1" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">4</text><rect x="47.2" y="275.3" width="178" height="59.0" rx="10" fill="#e2f7e4" stroke="#8cce93" stroke-width="1.4"/><text x="59.2" y="297.3" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="59.2">Usar el análisis para</tspan><tspan x="59.2" dy="16.5">evaluar intervenciones</tspan></text><circle cx="49.2" cy="277.3" r="14" fill="#206e27"/><text x="49.2" y="281.8" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">5</text><text x="40" y="689.6" font-size="11.5" fill="#39ac44" font-weight="700" letter-spacing="1.4">CONCEPTOS Y DÓNDE ACTÚAN EN EL MÉTODO</text><rect x="40.0" y="703.6" width="401.0" height="63.0" rx="8" fill="#ffffff" stroke="#8cce93" stroke-width="1.4"/><rect x="40.0" y="711.6" width="5" height="47.0" rx="2" fill="#39ac44"/><text x="56.0" y="725.6" font-size="13.5" fill="#206e27" font-weight="700" text-anchor="start"><tspan x="56.0">Cohorte</tspan></text><text x="56.0" y="745.4" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Grupo de clientes que comparte el periodo de incorporación</tspan></text><rect x="379.0" y="711.6" width="54" height="20" rx="10" fill="#bce5c0" stroke="#8cce93" stroke-width="1"/><text x="406.0" y="725.6" font-size="11" fill="#206e27" font-weight="700" text-anchor="middle">↔ 1, 2, 3</text><rect x="459.0" y="703.6" width="401.0" height="63.0" rx="8" fill="#ffffff" stroke="#8cce93" stroke-width="1.4"/><rect x="459.0" y="711.6" width="5" height="47.0" rx="2" fill="#39ac44"/><text x="475.0" y="725.6" font-size="13.5" fill="#206e27" font-weight="700" text-anchor="start"><tspan x="475.0">Seguimiento longitudinal</tspan></text><text x="475.0" y="745.4" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Observación del mismo grupo a lo largo de varios periodos</tspan></text><rect x="798.0" y="711.6" width="54" height="20" rx="10" fill="#bce5c0" stroke="#8cce93" stroke-width="1"/><text x="825.0" y="725.6" font-size="11" fill="#206e27" font-weight="700" text-anchor="middle">↔ 1</text><rect x="40.0" y="780.6" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#8cce93" stroke-width="1.4"/><rect x="40.0" y="788.6" width="5" height="62.2" rx="2" fill="#39ac44"/><text x="56.0" y="802.6" font-size="13.5" fill="#206e27" font-weight="700" text-anchor="start"><tspan x="56.0">Efecto de mezcla</tspan></text><text x="56.0" y="822.4" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Distorsión del promedio provocada por la combinación de</tspan><tspan x="56.0" dy="15.2">cohortes distintas</tspan></text><rect x="459.0" y="780.6" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#8cce93" stroke-width="1.4"/><rect x="459.0" y="788.6" width="5" height="62.2" rx="2" fill="#39ac44"/><text x="475.0" y="802.6" font-size="13.5" fill="#206e27" font-weight="700" text-anchor="start"><tspan x="475.0">Mejora entre cohortes</tspan></text><text x="475.0" y="822.4" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Diferencia de comportamiento entre grupos incorporados en</tspan><tspan x="475.0" dy="15.2">periodos sucesivos</tspan></text><rect x="798.0" y="788.6" width="54" height="20" rx="10" fill="#bce5c0" stroke="#8cce93" stroke-width="1"/><text x="825.0" y="802.6" font-size="11" fill="#206e27" font-weight="700" text-anchor="middle">↔ 1, 2, 3</text><text x="40" y="890.78" font-size="11.5" fill="#39ac44" font-weight="700" letter-spacing="1.4">QUÉ SE MIDE: NUMERADOR SOBRE DENOMINADOR</text><rect x="40.0" y="904.8" width="261.3" height="100.7" rx="8" fill="#e2f7e4" stroke="#8cce93" stroke-width="1.4"/><text x="54.0" y="926.8" font-size="13" fill="#206e27" font-weight="700" text-anchor="start"><tspan x="54.0">Retención por cohorte en el</tspan><tspan x="54.0" dy="17.2">mismo hito</tspan></text><text x="54.0" y="973.1" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Retención al mes N, comparada entre</tspan><tspan x="54.0" dy="15.2">cohortes sucesivas</tspan></text><rect x="319.3" y="904.8" width="261.3" height="100.7" rx="8" fill="#e2f7e4" stroke="#8cce93" stroke-width="1.4"/><text x="333.3" y="926.8" font-size="13" fill="#206e27" font-weight="700" text-anchor="start"><tspan x="333.3">Ingreso acumulado por cohorte</tspan></text><text x="333.3" y="955.9" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="333.3">Ingreso acumulado por cliente de</tspan><tspan x="333.3" dy="15.2">cada cohorte, a lo largo del tiempo</tspan></text><rect x="598.7" y="904.8" width="261.3" height="100.7" rx="8" fill="#e2f7e4" stroke="#8cce93" stroke-width="1.4"/><text x="612.7" y="926.8" font-size="13" fill="#206e27" font-weight="700" text-anchor="start"><tspan x="612.7">Tendencia entre cohortes</tspan></text><text x="612.7" y="955.9" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="612.7">Dirección y magnitud del cambio</tspan><tspan x="612.7" dy="15.2">entre cohortes consecutivas</tspan></text><text x="40" y="1039.46" font-size="11.5" fill="#39ac44" font-weight="700" letter-spacing="1.4">FRONTERA DE APLICACIÓN</text><rect x="40" y="1049.5" width="820" height="65.0" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.4"/><polygon points="70,1066.96 52,1095.96 88,1095.96" fill="#c2410c"/><text x="70" y="1092.96" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">!</text><text x="106" y="1073.5" font-size="12.5" fill="#7c2d12" font-weight="400" text-anchor="start"><tspan x="106">Las cohortes recientes tienen poca historia y sus proyecciones son inciertas. Comparar sólo en hitos con</tspan><tspan x="106" dy="16.5">datos completos evita conclusiones falsas.</tspan></text><text x="40" y="1142.46" font-size="11.5" fill="#39ac44" font-weight="700" letter-spacing="1.4">ERROR FRECUENTE Y SU CORRECCIÓN</text><rect x="40" y="1152.5" width="380.0" height="77.0" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/><text x="54" y="1174.5" font-size="11" fill="#b91c1c" font-weight="700" text-anchor="start"><tspan x="54">Síntoma</tspan></text><text x="54" y="1192.5" font-size="12.5" fill="#7f1d1d" font-weight="400" text-anchor="start"><tspan x="54">Evaluar retención con promedios agregados</tspan></text><line x1="426.0" y1="1191.0" x2="469.0" y2="1191.0" stroke="#39ac44" stroke-width="2.6" stroke-linecap="round"/><polygon points="474.0,1191.0 465.9,1194.9 465.9,1187.0" fill="#39ac44"/><rect x="480.0" y="1152.5" width="380.0" height="77.0" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.4"/><text x="494.0" y="1174.5" font-size="11" fill="#15803d" font-weight="700" text-anchor="start"><tspan x="494.0">Corrección</tspan></text><text x="494.0" y="1192.5" font-size="12.5" fill="#14532d" font-weight="400" text-anchor="start"><tspan x="494.0">Compara cohortes sucesivas en el mismo hito de</tspan><tspan x="494.0" dy="16.5">antigüedad.</tspan></text></svg>