"700" text-anchor="middle">1</text><rect x="674.8" y="267.0" width="178" height="75.5" rx="10" fill="#e6f7e2" stroke="#97ce8c" stroke-width="1.4"/><text x="686.8" y="289.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="686.8">Estimar el de la</tspan><tspan x="686.8" dy="16.5">contraparte con</tspan><tspan x="686.8" dy="16.5">evidencia disponible</tspan></text><circle cx="676.8" cy="269.0" r="14" fill="#2d6e20"/><text x="676.8" y="273.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><rect x="555.0" y="535.8" width="178" height="59.0" rx="10" fill="#e6f7e2" stroke="#97ce8c" stroke-width="1.4"/><text x="567.0" y="557.8" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="567.0">Verificar si existe</tspan><tspan x="567.0" dy="16.5">superposición</tspan></text><circle cx="557.0" cy="537.8" r="14" fill="#2d6e20"/><text x="557.0" y="542.3" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><rect x="167.0" y="527.6" width="178" height="75.5" rx="10" fill="#e6f7e2" stroke="#97ce8c" stroke-width="1.4"/><text x="179.0" y="549.6" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="179.0">Si no existe,</tspan><tspan x="179.0" dy="16.5">modificar alcance,</tspan><tspan x="179.0" dy="16.5">plazo o condiciones</tspan></text><circle cx="169.0" cy="529.6" r="14" fill="#2d6e20"/><text x="169.0" y="534.1" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">4</text><rect x="47.2" y="267.0" width="178" height="75.5" rx="10" fill="#e6f7e2" stroke="#97ce8c" stroke-width="1.4"/><text x="59.2" y="289.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="59.2">Cerrar dentro de la</tspan><tspan x="59.2" dy="16.5">zona y documentar los</tspan><tspan x="59.2" dy="16.5">supuestos</tspan></text><circle cx="49.2" cy="269.0" r="14" fill="#2d6e20"/><text x="49.2" y="273.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">5</text><text x="40" y="689.6" font-size="11.5" fill="#4cac39" font-weight="700" letter-spacing="1.4">CONCEPTOS Y DÓNDE ACTÚAN EN EL MÉTODO</text><rect x="40.0" y="703.6" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#97ce8c" stroke-width="1.4"/><rect x="40.0" y="711.6" width="5" height="62.2" rx="2" fill="#4cac39"/><text x="56.0" y="725.6" font-size="13.5" fill="#2d6e20" font-weight="700" text-anchor="start"><tspan x="56.0">Zona de posible acuerdo</tspan></text><text x="56.0" y="745.4" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Rango entre el mínimo aceptable de una parte y el máximo</tspan><tspan x="56.0" dy="15.2">aceptable de la otra</tspan></text><rect x="459.0" y="703.6" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#97ce8c" stroke-width="1.4"/><rect x="459.0" y="711.6" width="5" height="62.2" rx="2" fill="#4cac39"/><text x="475.0" y="725.6" font-size="13.5" fill="#2d6e20" font-weight="700" text-anchor="start"><tspan x="475.0">Ausencia de zona</tspan></text><text x="475.0" y="745.4" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Situación en que los valores de reserva no se superponen y</tspan><tspan x="475.0" dy="15.2">el acuerdo es imposible sin cambios</tspan></text><rect x="798.0" y="711.6" width="54" height="20" rx="10" fill="#c3e5bc" stroke="#97ce8c" stroke-width="1"/><text x="825.0" y="725.6" font-size="11" fill="#2d6e20" font-weight="700" text-anchor="middle">↔ 1</text><rect x="40.0" y="795.8" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#97ce8c" stroke-width="1.4"/><rect x="40.0" y="803.8" width="5" height="62.2" rx="2" fill="#4cac39"/><text x="56.0" y="817.8" font-size="13.5" fill="#2d6e20" font-weight="700" text-anchor="start"><tspan x="56.0">Ampliación del alcance</tspan></text><text x="56.0" y="837.6" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Modificación de atributos del acuerdo que crea una zona</tspan><tspan x="56.0" dy="15.2">donde no existía</tspan></text><rect x="379.0" y="803.8" width="54" height="20" rx="10" fill="#c3e5bc" stroke="#97ce8c" stroke-width="1"/><text x="406.0" y="817.8" font-size="11" fill="#2d6e20" font-weight="700" text-anchor="middle">↔ 4</text><rect x="459.0" y="795.8" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#97ce8c" stroke-width="1.4"/><rect x="459.0" y="803.8" width="5" height="62.2" rx="2" fill="#4cac39"/><text x="475.0" y="817.8" font-size="13.5" fill="#2d6e20" font-weight="700" text-anchor="start"><tspan x="475.0">Estimación de la reserva ajena</tspan></text><text x="475.0" y="837.6" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Aproximación al mínimo de la contraparte basada en</tspan><tspan x="475.0" dy="15.2">evidencia y no en supuestos</tspan></text><rect x="798.0" y="803.8" width="54" height="20" rx="10" fill="#c3e5bc" stroke="#97ce8c" stroke-width="1"/><text x="825.0" y="817.8" font-size="11" fill="#2d6e20" font-weight="700" text-anchor="middle">↔ 1, 2</text><text x="40" y="905.96" font-size="11.5" fill="#4cac39" font-weight="700" letter-spacing="1.4">QUÉ SE MIDE: NUMERADOR SOBRE DENOMINADOR</text><rect x="40.0" y="920.0" width="261.3" height="137.9" rx="8" fill="#e6f7e2" stroke="#97ce8c" stroke-width="1.4"/><text x="54.0" y="942.0" font-size="13" fill="#2d6e20" font-weight="700" text-anchor="start"><tspan x="54.0">Negociaciones sin zona</tspan><tspan x="54.0" dy="17.2">identificada</tspan></text><text x="54.0" y="988.3" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Negociaciones abandonadas por</tspan><tspan x="54.0" dy="15.2">ausencia de zona</tspan></text><line x1="54.0" y1="1024.6" x2="287.3" y2="1024.6" stroke="#4cac39" stroke-width="2"/><text x="54.0" y="1042.6" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="54.0">Negociaciones iniciadas</tspan></text><rect x="319.3" y="920.0" width="261.3" height="137.9" rx="8" fill="#e6f7e2" stroke="#97ce8c" stroke-width="1.4"/><text x="333.3" y="942.0" font-size="13" fill="#2d6e20" font-weight="700" text-anchor="start"><tspan x="333.3">Tiempo hasta detectar ausencia</tspan><tspan x="333.3" dy="17.2">de zona</tspan></text><text x="333.3" y="988.3" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="333.3">Días entre el inicio de la</tspan><tspan x="333.3" dy="15.2">negociación y la conclusión de que</tspan><tspan x="333.3" dy="15.2">no hay acuerdo posible</tspan></text><rect x="598.7" y="920.0" width="261.3" height="137.9" rx="8" fill="#e6f7e2" stroke="#97ce8c" stroke-width="1.4"/><text x="612.7" y="942.0" font-size="13" fill="#2d6e20" font-weight="700" text-anchor="start"><tspan x="612.7">Acuerdos con alcance modificado</tspan></text><text x="612.7" y="971.1" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="612.7">Acuerdos cerrados tras modificar</tspan><tspan x="612.7" dy="15.2">alcance o condiciones</tspan></text><line x1="612.7" y1="1007.5" x2="846.0" y2="1007.5" stroke="#4cac39" stroke-width="2"/><text x="612.7" y="1025.5" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="612.7">Acuerdos cerrados</tspan></text><text x="40" y="1091.8200000000002" font-size="11.5" fill="#4cac39" font-weight="700" letter-spacing="1.4">FRONTERA DE APLICACIÓN</text><rect x="40" y="1101.8" width="820" height="65.0" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.4"/><polygon points="70,1119.3200000000002 52,1148.3200000000002 88,1148.3200000000002" fill="#c2410c"/><text x="70" y="1145.3200000000002" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">!</text><text x="106" y="1125.8" font-size="12.5" fill="#7c2d12" font-weight="400" text-anchor="start"><tspan x="106">La estimación de la reserva ajena siempre tiene error. Actuar como si fuera exacta produce rupturas</tspan><tspan x="106" dy="16.5">innecesarias o concesiones excesivas.</tspan></text><text x="40" y="1194.8200000000002" font-size="11.5" fill="#4cac39" font-weight="700" letter-spacing="1.4">ERROR FRECUENTE Y SU CORRECCIÓN</text><rect x="40" y="1204.8" width="380.0" height="93.5" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/><text x="54" y="1226.8" font-size="11" fill="#b91c1c" font-weight="700" text-anchor="start"><tspan x="54">Síntoma</tspan></text><text x="54" y="1244.8" font-size="12.5" fill="#7f1d1d" font-weight="400" text-anchor="start"><tspan x="54">Insistir en una negociación sin zona posible</tspan></text><line x1="426.0" y1="1251.6" x2="469.0" y2="1251.6" stroke="#4cac39" stroke-width="2.6" stroke-linecap="round"/><polygon points="474.0,1251.6 465.9,1255.5 465.9,1247.7" fill="#4cac39"/><rect x="480.0" y="1204.8" width="380.0" height="93.5" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.4"/><text x="494.0" y="1226.8" font-size="11" fill="#15803d" font-weight="700" text-anchor="start"><tspan x="494.0">Corrección</tspan></text><text x="494.0" y="1244.8" font-size="12.5" fill="#14532d" font-weight="400" text-anchor="start"><tspan x="494.0">Verifica temprano la superposición y, si no existe,</tspan><tspan x="494.0" dy="16.5">propone modificar el alcance en lugar de bajar el</tspan><tspan x="494.0" dy="16.5">precio.</tspan></text></svg>