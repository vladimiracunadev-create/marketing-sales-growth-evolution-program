étrica.</tspan></text><text x="40" y="983.0400000000002" font-size="11.5" fill="#a839ac" font-weight="700" letter-spacing="1.4">ERROR FRECUENTE Y SU CORRECCIÓN</text><rect x="40" y="993.0" width="380.0" height="77.0" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/><text x="54" y="1015.0" font-size="11" fill="#b91c1c" font-weight="700" text-anchor="start"><tspan x="54">Síntoma</tspan></text><text x="54" y="1033.0" font-size="12.5" fill="#7f1d1d" font-weight="400" text-anchor="start"><tspan x="54">Presentar un plan sin umbrales ni contingencias</tspan></text><line x1="426.0" y1="1031.5" x2="469.0" y2="1031.5" stroke="#a839ac" stroke-width="2.6" stroke-linecap="round"/><polygon points="474.0,1031.5 465.9,1035.5 465.9,1027.6" fill="#a839ac"/><rect x="480.0" y="993.0" width="380.0" height="77.0" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.4"/><text x="494.0" y="1015.0" font-size="11" fill="#15803d" font-weight="700" text-anchor="start"><tspan x="494.0">Corrección</tspan></text><text x="494.0" y="1033.0" font-size="12.5" fill="#14532d" font-weight="400" text-anchor="start"><tspan x="494.0">Define para cada métrica crítica el valor que</tspan><tspan x="494.0" dy="16.5">activa una acción y cuál es esa acción.</tspan></text></svg>