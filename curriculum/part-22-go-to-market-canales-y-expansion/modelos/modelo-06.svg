<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1537" width="900" height="1537" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif"><title id="t">Modelo mental · Crecimiento liderado por socios</title><desc id="d">Modelo mental de la clase 22.06: Crecimiento liderado por socios. Método en 5 pasos; 5 conceptos; 3 señales de medición.</desc><rect x="0" y="0" width="900" height="1537" rx="14" fill="#ffffff"/><rect x="0" y="0" width="900" height="64" rx="14" fill="#6e205c"/><rect x="0" y="40" width="900" height="24" fill="#6e205c"/><text x="40" y="28" font-size="12" fill="#e5bcdc" font-weight="700" letter-spacing="1.6">MODELO MENTAL · CLASE 22.06 · PARTE 22</text><text x="40" y="52" font-size="21" fill="#ffffff" font-weight="700">Crecimiento liderado por socios</text><text x="40" y="84" font-size="11.5" fill="#ac3991" font-weight="700" letter-spacing="1.4">MÉTODO PASO A PASO</text><ellipse cx="450.0" cy="429.6" rx="330.0" ry="269.4" fill="none" stroke="#ce8cbe" stroke-width="2" stroke-dasharray="3 8" stroke-linecap="round"/><polygon points="653.4,217.3 636.1,213.3 641.7,204.0" fill="#ac3991"/><polygon points="759.8,523.1 761.0,505.4 771.1,509.4" fill="#ac3991"/><polygon points="439.0,699.0 455.9,693.5 455.9,704.4" fill="#ac3991"/><polygon points="132.1,502.6 143.4,516.3 133.3,520.3" fill="#ac3991"/><polygon points="265.5,206.1 253.7,219.3 248.2,210.1" fill="#ac3991"/><circle cx="450.0" cy="429.6" r="100.0" fill="#e5bcdc" stroke="#ce8cbe" stroke-width="1.6"/><text x="450.0" y="421.8" font-size="15" fill="#6e205c" font-weight="700" text-anchor="middle"><tspan x="450.0">Crecimiento</tspan><tspan x="450.0" dy="19.8">liderado por socios</tspan></text><rect x="361.0" y="106.0" width="178" height="108.5" rx="10" fill="#f7e2f2" stroke="#ce8cbe" stroke-width="1.4"/><text x="373.0" y="128.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="373.0">Definir conducta</tspan><tspan x="373.0" dy="16.5">remunerada, conducta</tspan><tspan x="373.0" dy="16.5">prohibida y</tspan><tspan x="373.0" dy="16.5">divulgación del</tspan><tspan x="373.0" dy="16.5">incentivo</tspan></text><circle cx="363.0" cy="108.0" r="14" fill="#6e205c"/><text x="363.0" y="112.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><rect x="674.8" y="316.9" width="178" height="59.0" rx="10" fill="#f7e2f2" stroke="#ce8cbe" stroke-width="1.4"/><text x="686.8" y="338.9" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="686.8">Diseñar el programa de</tspan><tspan x="686.8" dy="16.5">habilitación</tspan></text><circle cx="676.8" cy="318.9" r="14" fill="#6e205c"/><text x="676.8" y="323.4" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><rect x="555.0" y="618.0" width="178" height="59.0" rx="10" fill="#f7e2f2" stroke="#ce8cbe" stroke-width="1.4"/><text x="567.0" y="640.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="567.0">Establecer reglas de</tspan><tspan x="567.0" dy="16.5">conflicto de canal</tspan></text><circle cx="557.0" cy="620.0" r="14" fill="#6e205c"/><text x="557.0" y="624.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><rect x="167.0" y="601.5" width="178" height="92.0" rx="10" fill="#f7e2f2" stroke="#ce8cbe" stroke-width="1.4"/><text x="179.0" y="623.5" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="179.0">Medir ventas válidas y</tspan><tspan x="179.0" dy="16.5">calidad posterior, no</tspan><tspan x="179.0" dy="16.5">incorporaciones ni</tspan><tspan x="179.0" dy="16.5">dinero captado</tspan></text><circle cx="169.0" cy="603.5" r="14" fill="#6e205c"/><text x="169.0" y="608.0" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">4</text><rect x="47.2" y="292.1" width="178" height="108.5" rx="10" fill="#f7e2f2" stroke="#ce8cbe" stroke-width="1.4"/><text x="59.2" y="314.1" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="59.2">Suspender pagos y</tspan><tspan x="59.2" dy="16.5">comunicación cuando</tspan><tspan x="59.2" dy="16.5">falte evidencia o</tspan><tspan x="59.2" dy="16.5">aparezca información</tspan><tspan x="59.2" dy="16.5">adversa material</tspan></text><circle cx="49.2" cy="294.1" r="14" fill="#6e205c"/><text x="49.2" y="298.6" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">5</text><text x="40" y="795.2" font-size="11.5" fill="#ac3991" font-weight="700" letter-spacing="1.4">CONCEPTOS Y DÓNDE ACTÚAN EN EL MÉTODO</text><rect x="40.0" y="809.2" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#ce8cbe" stroke-width="1.4"/><rect x="40.0" y="817.2" width="5" height="62.2" rx="2" fill="#ac3991"/><text x="56.0" y="831.2" font-size="13.5" fill="#6e205c" font-weight="700" text-anchor="start"><tspan x="56.0">Incentivo del socio</tspan></text><text x="56.0" y="851.0" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Beneficio económico que justifica su esfuerzo comercial</tspan></text><rect x="379.0" y="817.2" width="54" height="20" rx="10" fill="#e5bcdc" stroke="#ce8cbe" stroke-width="1"/><text x="406.0" y="831.2" font-size="11" fill="#6e205c" font-weight="700" text-anchor="middle">↔ 1</text><rect x="459.0" y="809.2" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#ce8cbe" stroke-width="1.4"/><rect x="459.0" y="817.2" width="5" height="62.2" rx="2" fill="#ac3991"/><text x="475.0" y="831.2" font-size="13.5" fill="#6e205c" font-weight="700" text-anchor="start"><tspan x="475.0">Habilitación</tspan></text><text x="475.0" y="851.0" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Formación, materiales y apoyo que permiten al socio vender</tspan><tspan x="475.0" dy="15.2">y entregar</tspan></text><rect x="798.0" y="817.2" width="54" height="20" rx="10" fill="#e5bcdc" stroke="#ce8cbe" stroke-width="1"/><text x="825.0" y="831.2" font-size="11" fill="#6e205c" font-weight="700" text-anchor="middle">↔ 2</text><rect x="40.0" y="901.4" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#ce8cbe" stroke-width="1.4"/><rect x="40.0" y="909.4" width="5" height="62.2" rx="2" fill="#ac3991"/><text x="56.0" y="923.4" font-size="13.5" fill="#6e205c" font-weight="700" text-anchor="start"><tspan x="56.0">Socio activo</tspan></text><text x="56.0" y="943.2" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Aliado que generó negocio en el periodo, frente al que</tspan><tspan x="56.0" dy="15.2">sólo firmó acuerdo</tspan></text><rect x="459.0" y="901.4" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#ce8cbe" stroke-width="1.4"/><rect x="459.0" y="909.4" width="5" height="62.2" rx="2" fill="#ac3991"/><text x="475.0" y="923.4" font-size="13.5" fill="#6e205c" font-weight="700" text-anchor="start"><tspan x="475.0">Conflicto de canal</tspan></text><text x="475.0" y="943.2" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Competencia entre el equipo propio y el socio por la misma</tspan><tspan x="475.0" dy="15.2">cuenta</tspan></text><rect x="798.0" y="909.4" width="54" height="20" rx="10" fill="#e5bcdc" stroke="#ce8cbe" stroke-width="1"/><text x="825.0" y="923.4" font-size="11" fill="#6e205c" font-weight="700" text-anchor="middle">↔ 3</text><rect x="40.0" y="993.6" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#ce8cbe" stroke-width="1.4"/><rect x="40.0" y="1001.6" width="5" height="62.2" rx="2" fill="#ac3991"/><text x="56.0" y="1015.6" font-size="13.5" fill="#6e205c" font-weight="700" text-anchor="start"><tspan x="56.0">Incentivo responsable</tspan></text><text x="56.0" y="1035.4" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Pago trazable condicionado a venta válida, información</tspan><tspan x="56.0" dy="15.2">completa y ausencia de reclamos fundados</tspan></text><rect x="3