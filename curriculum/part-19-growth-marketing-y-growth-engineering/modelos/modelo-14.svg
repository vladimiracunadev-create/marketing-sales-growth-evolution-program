<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1348" width="900" height="1348" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif"><title id="t">Modelo mental · Growth model completo</title><desc id="d">Modelo mental de la clase 19.14: Growth model completo. Método en 5 pasos; 5 conceptos; 6 señales de medición.</desc><rect x="0" y="0" width="900" height="1348" rx="14" fill="#ffffff"/><rect x="0" y="0" width="900" height="64" rx="14" fill="#206e65"/><rect x="0" y="40" width="900" height="24" fill="#206e65"/><text x="40" y="28" font-size="12" fill="#bce5e0" font-weight="700" letter-spacing="1.6">MODELO MENTAL · CLASE 19.14 · PARTE 19</text><text x="40" y="52" font-size="21" fill="#ffffff" font-weight="700">Growth model completo</text><text x="40" y="84" font-size="11.5" fill="#39ac9e" font-weight="700" letter-spacing="1.4">MÉTODO PASO A PASO</text><path d="M66.0,159.0 V202.5 H158.5" fill="none" stroke="#39ac9e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="160.5,202.5 151.5,197.5 151.5,207.5" fill="#39ac9e"/><path d="M188.5,232.0 V275.5 H281.0" fill="none" stroke="#39ac9e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="283.0,275.5 274.0,270.5 274.0,280.5" fill="#39ac9e"/><path d="M311.0,305.0 V348.5 H403.5" fill="none" stroke="#39ac9e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="405.5,348.5 396.5,343.5 396.5,353.5" fill="#39ac9e"/><path d="M433.5,378.0 V421.5 H526.0" fill="none" stroke="#39ac9e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="528.0,421.5 519.0,416.5 519.0,426.5" fill="#39ac9e"/><rect x="40.0" y="100.0" width="330" height="59.0" rx="10" fill="#e2f7f5" stroke="#8ccec6" stroke-width="1.4"/><text x="54.0" y="122.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Construir el modelo con las palancas y sus</tspan><tspan x="54.0" dy="16.5">relaciones</tspan></text><circle cx="42.0" cy="102.0" r="14" fill="#206e65"/><text x="42.0" y="106.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><rect x="162.5" y="173.0" width="330" height="59.0" rx="10" fill="#e2f7f5" stroke="#8ccec6" stroke-width="1.4"/><text x="176.5" y="195.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="176.5">Calibrar con datos históricos</tspan></text><circle cx="164.5" cy="175.0" r="14" fill="#206e65"/><text x="164.5" y="179.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><rect x="285.0" y="246.0" width="330" height="59.0" rx="10" fill="#e2f7f5" stroke="#8ccec6" stroke-width="1.4"/><text x="299.0" y="268.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="299.0">Ejecutar el análisis de sensibilidad</tspan></text><circle cx="287.0" cy="248.0" r="14" fill="#206e65"/><text x="287.0" y="252.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><rect x="407.5" y="319.0" width="330" height="59.0" rx="10" fill="#e2f7f5" stroke="#8ccec6" stroke-width="1.4"/><text x="421.5" y="341.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="421.5">Priorizar el backlog con base en el modelo</tspan></text><circle cx="409.5" cy="321.0" r="14" fill="#206e65"/><text x="409.5" y="325.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">4</text><rect x="530.0" y="392.0" width="330" height="59.0" rx="10" fill="#e2f7f5" stroke="#8ccec6" stroke-width="1.4"/><text x="544.0" y="414.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="544.0">Actualizar el modelo con cada aprendizaje</tspan></text><circle cx="532.0" cy="394.0" r="14" fill="#206e65"/><text x="532.0" y="398.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">5</text><text x="40" y="493.0" font-size="11.5" fill="#39ac9e" font-weight="700" letter-spacing="1.4">CONCEPTOS Y DÓNDE ACTÚAN EN EL MÉTODO</text><rect x="40.0" y="507.0" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#8ccec6" stroke-width="1.4"/><rect x="40.0" y="515.0" width="5" height="62.2" rx="2" fill="#39ac9e"/><text x="56.0" y="529.0" font-size="13.5" fill="#206e65" font-weight="700" text-anchor="start"><tspan x="56.0">Modelo de crecimiento</tspan></text><text x="56.0" y="548.8" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Representación cuantitativa de las palancas y su efecto en</tspan><tspan x="56.0" dy="15.2">el resultado</tspan></text><rect x="379.0" y="515.0" width="54" height="20" rx="10" fill="#bce5e0" stroke="#8ccec6" stroke-width="1"/><text x="406.0" y="529.0" font-size="11" fill="#206e65" font-weight="700" text-anchor="middle">↔ 1, 4, 5</text><rect x="459.0" y="507.0" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#8ccec6" stroke-width="1.4"/><rect x="459.0" y="515.0" width="5" height="62.2" rx="2" fill="#39ac9e"/><text x="475.0" y="529.0" font-size="13.5" fill="#206e65" font-weight="700" text-anchor="start"><tspan x="475.0">Palanca</tspan></text><text x="475.0" y="548.8" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Variable que el equipo puede modificar y que afecta la</tspan><tspan x="475.0" dy="15.2">métrica estrella</tspan></text><rect x="798.0" y="515.0" width="54" height="20" rx="10" fill="#bce5e0" stroke="#8ccec6" stroke-width="1"/><text x="825.0" y="529.0" font-size="11" fill="#206e65" font-weight="700" text-anchor="middle">↔ 1</text><rect x="40.0" y="599.2" width="401.0" height="63.0" rx="8" fill="#ffffff" stroke="#8ccec6" stroke-width="1.4"/><rect x="40.0" y="607.2" width="5" height="47.0" rx="2" fill="#39ac9e"/><text x="56.0" y="621.2" font-size="13.5" fill="#206e65" font-weight="700" text-anchor="start"><tspan x="56.0">Sensibilidad del modelo</tspan></text><text x="56.0" y="641.0" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Efecto en el resultado de variar cada palanca</tspan></text><rect x="379.0" y="607.2" width="54" height="20" rx="10" fill="#bce5e0" stroke="#8ccec6" stroke-width="1"/><text x="406.0" y="621.2" font-size="11" fill="#206e65" font-weight="700" text-anchor="middle">↔ 1, 3, 4, 5</text><rect x="459.0" y="599.2" width="401.0" height="63.0" rx="8" fill="#ffffff" stroke="#8ccec6" stroke-width="1.4"/><rect x="459.0" y="607.2" width="5" height="47.0" rx="2" fill="#39ac9e"/><text x="475.0" y="621.2" font-size="13.5" fill="#206e65" font-weight="700" text-anchor="start"><tspan x="475.0">Registro de aprendizajes</tspan></text><text x="475.0" y="641.0" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Documentación acumulada de experimentos y sus conclusiones</tspan></text><rect x="798.0" y="607.2" width="54" height="20" rx="10" fill="#bce5e0" stroke="#8ccec6" stroke-width="1"/><text x="825.0" y="621.2" font-size="11" fill="#206e65" font-weight="700" text-anchor="middle">↔ 5</text><rect x="40.0" y="676.2" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#8ccec6" stroke-width="1.4"/><rect x="40.0" y="684.2" width="5" height="62.2" rx="2" fill="#39ac9e"/><text x="56.0" y="698.2" font-size="13.5" fill="#206e65" font-weight="700" text-anchor="start"><tspan x="56.0">Growth ajustado por riesgo</tspan></text><text x="56.0" y="718.0" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Crecimiento incremental neto de pérdidas esperadas por</tspan><tspan x="56.0" dy="15.2">fallas comerciales y regulatorias</tspan></text><text x="40" y="786.3600000000001" font-size="11.5" fill="#39ac9e" font-weight="700" letter-spacing="1.4">QUÉ SE MIDE: NUMERADOR SOBRE DENOMINADOR</text><rect x="40.0" y="800.4" width="261.3" height="135.9" rx="8" fill="#e2f7f5" stroke="#8ccec6" stroke-width="1.4"/><text x="54.0" y="822.4" font-size="13" fill="#206e65" font-weight="700" text-anchor="start"><tspan x="54.0">Precisión del modelo</tspan></text><text x="54.0" y="851.5" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Diferencia entre el resultado</tspan><tspan x="54.0" dy="15.2">proyectado y el observado, por</tspan><tspan x="54.0" dy="15.2">trimestre</tspan></text><rect x="319.3" y="800.4" width="261.3" height="135.9" rx="8" fill="#e2f7f5" stroke="#8ccec6" stroke-width="1.4"/><text x="333.3" y="822.4" font-size="13" fill="#206e65" font-weight="700" text-anchor="start"><tspan x="333.3">Palancas con efecto verificado</tspan></text><text x="333.3" y="851.5" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="333.3">Palancas cuyo efecto fue medido</tspan><tspan x="333.3" dy="15.2">experimentalmente</tspan></text><line x1="333.3" y1="887.9" x2="566.7" y2="887.9" stroke="#39ac9e" stroke-width="2"/><text x="333.3" y="905.9" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="333.3">Palancas del modelo</tspan></text><rect x="598.7" y="800.4" width="261.3" height="135.9" rx="8" fill="#e2f7f5" stroke="#8ccec6" stroke-width="1.4"/><text x="612.7" y="822.4" font-size="13" fill="#206e65" font-weight="700" text-anchor="start"><tspan x="612.7">Aprendizajes acumulados</tspan></text><text x="612.7" y="851.5" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="612.7">Conclusiones documentadas con</tspan><tspan x="612.7" dy="15.2">evidencia</tspan></text><line x1="612.7" y1="887.9" x2="846.0" y2="887.9" stroke="#39ac9e" stroke-width="2"/><text x="612.7" y="905.9" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="612.7">Experimentos ejecutados en el</tspan><tspan x="612.7" dy="15.2">trimestre</tspan></text><rect x="40.0" y="950.2" width="261.3" height="135.9" rx="8" fill="#e2f7f5" stroke="#8ccec6" stroke-width="1.4"/><text x="54.0" y="972.2" font-size="13" fill="#206e65" font-weight="700" text-anchor="start"><tspan x="54.0">Growth ajustado por riesgo</tspan></text><text x="54.0" y="1001.4" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Margen incremental menos reembolsos,</tspan><tspan x="54.0" dy="15.2">reclamaciones y pérdida esperada de</tspan><tspan x="54.0" dy="15.2">incidentes</tspan></text><line x1="54.0" y1="1052.9" x2="287.3" y2="1052.9" stroke="#39ac9e" stroke-width="2"/><text x="54.0" y="1070.9" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="54.0">Ingreso base de la ventana</tspan></text><rect x="319.3" y="950.2" width="261.3" height="135.9" rx="8" fill="#e2f7f5" stroke="#8ccec6" stroke-width="1.4"/><text x="333.3" y="972.2" font-size="13" fill="#206e65" font-weight="700" text-anchor="start"><tspan x="333.3">Refund rate</tspan></text><text x="333.3" y="1001.4" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="333.3">Transacciones reembolsadas</tspan></text><line x1="333.3" y1="1022.6" x2="566.7" y2="1022.6" stroke="#39ac9e" stroke-width="2"/><text x="333.3" y="1040.6" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="333.3">Transacciones cobradas, por cohorte</tspan><tspan x="333.3" dy="15.2">y treinta días</tspan></text><rect x="598.7" y="950.2" width="261.3" height="135.9" rx="8" fill="#e2f7f5" stroke="#8ccec6" stroke-width="1.4"/><text x="612.7" y="972.2" font-size="13" fill="#206e65" font-weight="700" text-anchor="start"><tspan x="612.7">Complaint rate</tspan></text><text x="612.7" y="1001.4" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="612.7">Reclamos únicos</tspan></text><line x1="612.7" y1="1022.6" x2="846.0" y2="1022.6" stroke="#39ac9e" stroke-width="2"/><text x="612.7" y="1040.6" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="612.7">Clientes o pedidos servidos, por</tspan><tspan x="612.7" dy="15.2">semana</tspan></text><text x="40" y="1120.1200000000001" font-size="11.5" fill="#39ac9e" font-weight="700" letter-spacing="1.4">FRONTERA DE APLICACIÓN</text><rect x="40" y="1130.1" width="820" height="65.0" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.4"/><polygon points="70,1147.6200000000001 52,1176.6200000000001 88,1176.6200000000001" fill="#c2410c"/><text x="70" y="1173.6200000000001" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">!</text><text x="106" y="1154.1" font-size="12.5" fill="#7c2d12" font-weight="400" text-anchor="start"><tspan x="106">Un modelo con supuestos no verificados produce proyecciones falsas. Su valor depende de cuántas relaciones</tspan><tspan x="106" dy="16.5">fueron medidas y no supuestas.</tspan></text><text x="40" y="1223.1200000000001" font-size="11.5" fill="#39ac9e" font-weight="700" letter-spacing="1.4">ERROR FRECUENTE Y SU CORRECCIÓN</text><rect x="40" y="1233.1" width="380.0" height="77.0" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/><text x="54" y="1255.1" font-size="11" fill="#b91c1c" font-weight="700" text-anchor="start"><tspan x="54">Síntoma</tspan></text><text x="54" y="1273.1" font-size="12.5" fill="#7f1d1d" font-weight="400" text-anchor="start"><tspan x="54">Presentar un plan de crecimiento sin modelo</tspan><tspan x="54" dy="16.5">cuantitativo</tspan></text><line x1="426.0" y1="1271.6" x2="469.0" y2="1271.6" stroke="#39ac9e" stroke-width="2.6" stroke-linecap="round"/><polygon points="474.0,1271.6 465.9,1275.5 465.9,1267.7" fill="#39ac9e"/><rect x="480.0" y="1233.1" width="380.0" height="77.0" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.4"/><text x="494.0" y="1255.1" font-size="11" fill="#15803d" font-weight="700" text-anchor="start"><tspan x="494.0">Corrección</tspan></text><text x="494.0" y="1273.1" font-size="12.5" fill="#14532d" font-weight="400" text-anchor="start"><tspan x="494.0">Construye el modelo, declara qué relaciones fueron</tspan><tspan x="494.0" dy="16.5">medidas y cuáles son supuestos.</tspan></text></svg>