<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 966" width="900" height="966" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif"><title id="t">Modelo mental · Canales directos e indirectos</title><desc id="d">Modelo mental de la clase 22.07: Canales directos e indirectos. Método en 5 pasos; 4 conceptos; 3 señales de medición.</desc><rect x="0" y="0" width="900" height="966" rx="14" fill="#ffffff"/><rect x="0" y="0" width="900" height="64" rx="14" fill="#6e205c"/><rect x="0" y="40" width="900" height="24" fill="#6e205c"/><text x="40" y="28" font-size="12" fill="#e5bcdc" font-weight="700" letter-spacing="1.6">MODELO MENTAL · CLASE 22.07 · PARTE 22</text><text x="40" y="52" font-size="21" fill="#ffffff" font-weight="700">Canales directos e indirectos</text><text x="40" y="84" font-size="11.5" fill="#ac3991" font-weight="700" letter-spacing="1.4">MÉTODO PASO A PASO</text><line x1="450.0" y1="94.0" x2="450.0" y2="300.5" stroke="#ce8cbe" stroke-width="3" stroke-linecap="round"/><line x1="450.0" y1="121.2" x2="406.0" y2="121.2" stroke="#ce8cbe" stroke-width="2"/><rect x="56.0" y="100" width="350" height="42.5" rx="10" fill="#f7e2f2" stroke="#ce8cbe" stroke-width="1.4"/><text x="70.0" y="122" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="70.0">Definir qué segmentos corresponden a cada canal</tspan></text><circle cx="450.0" cy="121.2" r="15" fill="#6e205c"/><text x="450.0" y="125.8" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><line x1="450.0" y1="167.5" x2="494.0" y2="167.5" stroke="#ce8cbe" stroke-width="2"/><rect x="494.0" y="138" width="350" height="59.0" rx="10" fill="#f7e2f2" stroke="#ce8cbe" stroke-width="1.4"/><text x="508.0" y="160" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="508.0">Escribir las reglas de conflicto y de registro</tspan><tspan x="508.0" dy="16.5">de cuentas</tspan></text><circle cx="450.0" cy="167.5" r="15" fill="#6e205c"/><text x="450.0" y="172.0" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><line x1="450.0" y1="197.2" x2="406.0" y2="197.2" stroke="#ce8cbe" stroke-width="2"/><rect x="56.0" y="176" width="350" height="42.5" rx="10" fill="#f7e2f2" stroke="#ce8cbe" stroke-width="1.4"/><text x="70.0" y="198" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="70.0">Comparar margen y costo por canal</tspan></text><circle cx="450.0" cy="197.2" r="15" fill="#6e205c"/><text x="450.0" y="201.8" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><line x1="450.0" y1="243.5" x2="494.0" y2="243.5" stroke="#ce8cbe" stroke-width="2"/><rect x="494.0" y="214" width="350" height="59.0" rx="10" fill="#f7e2f2" stroke="#ce8cbe" stroke-width="1.4"/><text x="508.0" y="236" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="508.0">Medir la visibilidad del cliente final en cada</tspan><tspan x="508.0" dy="16.5">uno</tspan></text><circle cx="450.0" cy="243.5" r="15" fill="#6e205c"/><text x="450.0" y="248.0" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">4</text><line x1="450.0" y1="273.2" x2="406.0" y2="273.2" stroke="#ce8cbe" stroke-width="2"/><rect x="56.0" y="252" width="350" height="42.5" rx="10" fill="#f7e2f2" stroke="#ce8cbe" stroke-width="1.4"/><text x="70.0" y="274" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="70.0">Revisar la asignación anualmente con datos</tspan></text><circle cx="450.0" cy="273.2" r="15" fill="#6e205c"/><text x="450.0" y="277.8" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">5</text><text x="40" y="336.5" font-size="11.5" fill="#ac3991" font-weight="700" letter-spacing="1.4">CONCEPTOS Y DÓNDE ACTÚAN EN EL MÉTODO</text><rect x="40.0" y="350.5" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#ce8cbe" stroke-width="1.4"/><rect x="40.0" y="358.5" width="5" height="62.2" rx="2" fill="#ac3991"/><text x="56.0" y="372.5" font-size="13.5" fill="#6e205c" font-weight="700" text-anchor="start"><tspan x="56.0">Canal directo</tspan></text><text x="56.0" y="392.3" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Venta realizada por el equipo propio con relación directa</tspan><tspan x="56.0" dy="15.2">con el cliente</tspan></text><rect x="379.0" y="358.5" width="54" height="20" rx="10" fill="#e5bcdc" stroke="#ce8cbe" stroke-width="1"/><text x="406.0" y="372.5" font-size="11" fill="#6e205c" font-weight="700" text-anchor="middle">↔ 1, 3</text><rect x="459.0" y="350.5" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#ce8cbe" stroke-width="1.4"/><rect x="459.0" y="358.5" width="5" height="62.2" rx="2" fill="#ac3991"/><text x="475.0" y="372.5" font-size="13.5" fill="#6e205c" font-weight="700" text-anchor="start"><tspan x="475.0">Canal indirecto</tspan></text><text x="475.0" y="392.3" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Venta realizada por un tercero que se queda con parte del</tspan><tspan x="475.0" dy="15.2">margen</tspan></text><rect x="798.0" y="358.5" width="54" height="20" rx="10" fill="#e5bcdc" stroke="#ce8cbe" stroke-width="1"/><text x="825.0" y="372.5" font-size="11" fill="#6e205c" font-weight="700" text-anchor="middle">↔ 1, 3</text><rect x="40.0" y="442.7" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#ce8cbe" stroke-width="1.4"/><rect x="40.0" y="450.7" width="5" height="62.2" rx="2" fill="#ac3991"/><text x="56.0" y="464.7" font-size="13.5" fill="#6e205c" font-weight="700" text-anchor="start"><tspan x="56.0">Regla de conflicto</tspan></text><text x="56.0" y="484.5" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Criterio escrito que asigna cuentas y evita competencia</tspan><tspan x="56.0" dy="15.2">interna</tspan></text><rect x="379.0" y="450.7" width="54" height="20" rx="10" fill="#e5bcdc" stroke="#ce8cbe" stroke-width="1"/><text x="406.0" y="464.7" font-size="11" fill="#6e205c" font-weight="700" text-anchor="middle">↔ 2</text><rect x="459.0" y="442.7" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#ce8cbe" stroke-width="1.4"/><rect x="459.0" y="450.7" width="5" height="62.2" rx="2" fill="#ac3991"/><text x="475.0" y="464.7" font-size="13.5" fill="#6e205c" font-weight="700" text-anchor="start"><tspan x="475.0">Visibilidad del cliente final</tspan></text><text x="475.0" y="484.5" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Acceso a información y relación con quien usa el producto</tspan></text><rect x="798.0" y="450.7" width="54" height="20" rx="10" fill="#e5bcdc" stroke="#ce8cbe" stroke-width="1"/><text x="825.0" y="464.7" font-size="11" fill="#6e205c" font-weight="700" text-anchor="middle">↔ 4</text><text x="40" y="552.86" font-size="11.5" fill="#ac3991" font-weight="700" letter-spacing="1.4">QUÉ SE MIDE: NUMERADOR SOBRE DENOMINADOR</text><rect x="40.0" y="566.9" width="261.3" height="120.7" rx="8" fill="#f7e2f2" stroke="#ce8cbe" stroke-width="1.4"/><text x="54.0" y="588.9" font-size="13" fill="#6e205c" font-weight="700" text-anchor="start"><tspan x="54.0">Margen por canal</tspan></text><text x="54.0" y="618.0" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Margen de contribución</tspan></text><line x1="54.0" y1="639.2" x2="287.3" y2="639.2" stroke="#ac3991" stroke-width="2"/><text x="54.0" y="657.2" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="54.0">Ingreso, por canal</tspan></text><rect x="319.3" y="566.9" width="261.3" height="120.7" rx="8" fill="#f7e2f2" stroke="#ce8cbe" stroke-width="1.4"/><text x="333.3" y="588.9" font-size="13" fill="#6e205c" font-weight="700" text-anchor="start"><tspan x="333.3">Conflictos registrados</tspan></text><text x="333.3" y="618.0" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="333.3">Disputas de cuenta</tspan></text><line x1="333.3" y1="639.2" x2="566.7" y2="639.2" stroke="#ac3991" stroke-width="2"/><text x="333.3" y="657.2" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="333.3">Cuentas trabajadas por ambos canales</tspan></text><rect x="598.7" y="566.9" width="261.3" height="120.7" rx="8" fill="#f7e2f2" stroke="#ce8cbe" stroke-width="1.4"/><text x="612.7" y="588.9" font-size="13" fill="#6e205c" font-weight="700" text-anchor="start"><tspan x="612.7">Visibilidad del cliente final</tspan></text><text x="612.7" y="618.0" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="612.7">Clientes con datos de contacto y uso</tspan><tspan x="612.7" dy="15.2">disponibles</tspan></text><line x1="612.7" y1="654.4" x2="846.0" y2="654.4" stroke="#ac3991" stroke-width="2"/><text x="612.7" y="672.4" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="612.7">Clientes del canal</tspan></text><text x="40" y="721.56" font-size="11.5" fill="#ac3991" font-weight="700" letter-spacing="1.4">FRONTERA DE APLICACIÓN</text><rect x="40" y="731.6" width="820" height="65.0" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.4"/><polygon points="70,749.06 52,778.06 88,778.06" fill="#c2410c"/><text x="70" y="775.06" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">!</text><text x="106" y="755.6" font-size="12.5" fill="#7c2d12" font-weight="400" text-anchor="start"><tspan x="106">Reglas de conflicto muy restrictivas pueden desincentivar al canal. El equilibrio requiere registro de</tspan><tspan x="106" dy="16.5">cuentas y protección temporal, no exclusividad permanente.</tspan></text><text x="40" y="824.56" font-size="11.5" fill="#ac3991" font-weight="700" letter-spacing="1.4">ERROR FRECUENTE Y SU CORRECCIÓN</text><rect x="40" y="834.6" width="380.0" height="93.5" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/><text x="54" y="856.6" font-size="11" fill="#b91c1c" font-weight="700" text-anchor="start"><tspan x="54">Síntoma</tspan></text><text x="54" y="874.6" font-size="12.5" fill="#7f1d1d" font-weight="400" text-anchor="start"><tspan x="54">Operar canales mixtos sin reglas de conflicto</tspan></text><line x1="426.0" y1="881.3" x2="469.0" y2="881.3" stroke="#ac3991" stroke-width="2.6" stroke-linecap="round"/><polygon points="474.0,881.3 465.9,885.2 465.9,877.4" fill="#ac3991"/><rect x="480.0" y="834.6" width="380.0" height="93.5" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.4"/><text x="494.0" y="856.6" font-size="11" fill="#15803d" font-weight="700" text-anchor="start"><tspan x="494.0">Corrección</tspan></text><text x="494.0" y="874.6" font-size="12.5" fill="#14532d" font-weight="400" text-anchor="start"><tspan x="494.0">Escribe el criterio de asignación de cuentas y el</tspan><tspan x="494.0" dy="16.5">mecanismo de registro antes de activar el canal</tspan><tspan x="494.0" dy="16.5">indirecto.</tspan></text></svg>