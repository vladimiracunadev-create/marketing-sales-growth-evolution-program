<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1797" width="900" height="1797" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif"><title id="t">Modelo mental · Identidad visual: criterios</title><desc id="d">Modelo mental de la clase 06.06: Identidad visual: criterios. Método en 7 pasos; 8 conceptos; 6 señales de medición.</desc><rect x="0" y="0" width="900" height="1797" rx="14" fill="#ffffff"/><rect x="0" y="0" width="900" height="64" rx="14" fill="#57206e"/><rect x="0" y="40" width="900" height="24" fill="#57206e"/><text x="40" y="28" font-size="12" fill="#d9bce5" font-weight="700" letter-spacing="1.6">MODELO MENTAL · CLASE 06.06 · PARTE 06</text><text x="40" y="52" font-size="21" fill="#ffffff" font-weight="700">Identidad visual: criterios</text><text x="40" y="84" font-size="11.5" fill="#8939ac" font-weight="700" letter-spacing="1.4">MÉTODO PASO A PASO</text><path d="M66.0,175.5 V227.2 H117.7" fill="none" stroke="#8939ac" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="119.7,227.2 110.7,222.2 110.7,232.2" fill="#8939ac"/><path d="M147.7,265.0 V316.8 H199.3" fill="none" stroke="#8939ac" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="201.3,316.8 192.3,311.8 192.3,321.8" fill="#8939ac"/><path d="M229.3,354.5 V406.2 H281.0" fill="none" stroke="#8939ac" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="283.0,406.2 274.0,401.2 274.0,411.2" fill="#8939ac"/><path d="M311.0,444.0 V495.8 H362.7" fill="none" stroke="#8939ac" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="364.7,495.8 355.7,490.8 355.7,500.8" fill="#8939ac"/><path d="M392.7,533.5 V585.2 H444.3" fill="none" stroke="#8939ac" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="446.3,585.2 437.3,580.2 437.3,590.2" fill="#8939ac"/><path d="M474.3,623.0 V674.8 H526.0" fill="none" stroke="#8939ac" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="528.0,674.8 519.0,669.8 519.0,679.8" fill="#8939ac"/><rect x="40.0" y="100.0" width="330" height="75.5" rx="10" fill="#f1e2f7" stroke="#ba8cce" stroke-width="1.4"/><text x="54.0" y="122.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Definir objetivo, audiencia, mensaje y</tspan><tspan x="54.0" dy="16.5">alternativa sin personaje antes de diseñar</tspan></text><circle cx="42.0" cy="102.0" r="14" fill="#57206e"/><text x="42.0" y="106.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><rect x="121.7" y="189.5" width="330" height="75.5" rx="10" fill="#f1e2f7" stroke="#ba8cce" stroke-width="1.4"/><text x="135.7" y="211.5" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="135.7">Traducir personalidad a silueta, rasgos y</tspan><tspan x="135.7" dy="16.5">conductas observables sin confundir gusto</tspan><tspan x="135.7" dy="16.5">con asociación</tspan></text><circle cx="123.7" cy="191.5" r="14" fill="#57206e"/><text x="123.7" y="196.0" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><rect x="203.3" y="279.0" width="330" height="75.5" rx="10" fill="#f1e2f7" stroke="#ba8cce" stroke-width="1.4"/><text x="217.3" y="301.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="217.3">Probar reconocimiento, atribución y</tspan><tspan x="217.3" dy="16.5">accesibilidad en versiones física y digital</tspan></text><circle cx="205.3" cy="281.0" r="14" fill="#57206e"/><text x="205.3" y="285.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><rect x="285.0" y="368.5" width="330" height="75.5" rx="10" fill="#f1e2f7" stroke="#ba8cce" stroke-width="1.4"/><text x="299.0" y="390.5" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="299.0">Presupuestar diseño, uso, intérprete,</tspan><tspan x="299.0" dy="16.5">acompañamiento, transporte, cuidado y</tspan><tspan x="299.0" dy="16.5">medición sin doble conteo</tspan></text><circle cx="287.0" cy="370.5" r="14" fill="#57206e"/><text x="287.0" y="375.0" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">4</text><rect x="366.7" y="458.0" width="330" height="75.5" rx="10" fill="#f1e2f7" stroke="#ba8cce" stroke-width="1.4"/><text x="380.7" y="480.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="380.7">Diseñar operación, interacción respetuosa,</tspan><tspan x="380.7" dy="16.5">seguridad, registro de incidentes y</tspan><tspan x="380.7" dy="16.5">criterios de detención</tspan></text><circle cx="368.7" cy="460.0" r="14" fill="#57206e"/><text x="368.7" y="464.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">5</text><rect x="448.3" y="547.5" width="330" height="75.5" rx="10" fill="#f1e2f7" stroke="#ba8cce" stroke-width="1.4"/><text x="462.3" y="569.5" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="462.3">Comparar con y sin corpóreo controlando</tspan><tspan x="462.3" dy="16.5">horario, afluencia, promoción, ubicación y</tspan><tspan x="462.3" dy="16.5">composición del público</tspan></text><circle cx="450.3" cy="549.5" r="14" fill="#57206e"/><text x="450.3" y="554.0" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">6</text><rect x="530.0" y="637.0" width="330" height="75.5" rx="10" fill="#f1e2f7" stroke="#ba8cce" stroke-width="1.4"/><text x="544.0" y="659.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="544.0">Decidir continuar, ajustar o descartar según</tspan><tspan x="544.0" dy="16.5">evidencia de marca, actividad, respuesta</tspan><tspan x="544.0" dy="16.5">comercial y resultado</tspan></text><circle cx="532.0" cy="639.0" r="14" fill="#57206e"/><text x="532.0" y="643.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">7</text><text x="40" y="754.5" font-size="11.5" fill="#8939ac" font-weight="700" letter-spacing="1.4">CONCEPTOS Y DÓNDE ACTÚAN EN EL MÉTODO</text><rect x="40.0" y="768.5" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#ba8cce" stroke-width="1.4"/><rect x="40.0" y="776.5" width="5" height="62.2" rx="2" fill="#8939ac"/><text x="56.0" y="790.5" font-size="13.5" fill="#57206e" font-weight="700" text-anchor="start"><tspan x="56.0">Activo distintivo</tspan></text><text x="56.0" y="810.3" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Elemento visual que el mercado asocia únicamente con la</tspan><tspan x="56.0" dy="15.2">marca</tspan></text><rect x="379.0" y="776.5" width="54" height="20" rx="10" fill="#d9bce5" stroke="#ba8cce" stroke-width="1"/><text x="406.0" y="790.5" font-size="11" fill="#57206e" font-weight="700" text-anchor="middle">↔ 7</text><rect x="459.0" y="768.5" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#ba8cce" stroke-width="1.4"/><rect x="459.0" y="776.5" width="5" height="62.2" rx="2" fill="#8939ac"/><text x="475.0" y="790.5" font-size="13.5" fill="#57206e" font-weight="700" text-anchor="start"><tspan x="475.0">Reconocimiento a baja atención</tspan></text><text x="475.0" y="810.3" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Capacidad de identificar la marca en una exposición breve</tspan><tspan x="475.0" dy="15.2">y parcial</tspan></text><rect x="798.0" y="776.5" width="54" height="20" rx="10" fill="#d9bce5" stroke="#ba8cce" stroke-width="1"/><text x="825.0" y="790.5" font-size="11" fill="#57206e" font-weight="700" text-anchor="middle">↔ 3</text><rect x="40.0" y="860.7" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#ba8cce" stroke-width="1.4"/><rect x="40.0" y="868.7" width="5" height="62.2" rx="2" fill="#8939ac"/><text x="56.0" y="882.7" font-size="13.5" fill="#57206e" font-weight="700" text-anchor="start"><tspan x="56.0">Aplicabilidad</tspan></text><text x="56.0" y="902.5" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Funcionamiento del sistema visual en todos los soportes y</tspan><tspan x="56.0" dy="15.2">tamaños reales</tspan></text><rect x="459.0" y="860.7" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#ba8cce" stroke-width="1.4"/><rect x="459.0" y="868.7" width="5" height="62.2" rx="2" fill="#8939ac"/><text x="475.0" y="882.7" font-size="13.5" fill="#57206e" font-weight="700" text-anchor="start"><tspan x="475.0">Accesibilidad visual</tspan></text><text x="475.0" y="902.5" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Contraste y legibilidad suficientes para personas con</tspan><tspan x="475.0" dy="15.2">distintas capacidades</tspan></text><rect x="798.0" y="868.7" width="54" height="20" rx="10" fill="#d9bce5" stroke="#ba8cce" stroke-width="1"/><text x="825.0" y="882.7" font-size="11" fill="#57206e" font-weight="700" text-anchor="middle">↔ 3</text><rect x="40.0" y="952.9" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#ba8cce" stroke-width="1.4"/><rect x="40.0" y="960.9" width="5" height="62.2" rx="2" fill="#8939ac"/><text x="56.0" y="974.9" font-size="13.5" fill="#57206e" font-weight="700" text-anchor="start"><tspan x="56.0">Mascota de marca</tspan></text><text x="56.0" y="994.7" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Personaje original y gobernado que representa asociaciones</tspan><tspan x="56.0" dy="15.2">de una marca de manera consistente</tspan></text><rect x="379.0" y="960.9" width="54" height="20" rx="10" fill="#d9bce5" stroke="#ba8cce" stroke-width="1"/><text x="406.0" y="974.9" font-size="11" fill="#57206e" font-weight="700" text-anchor="middle">↔ 2, 7</text><rect x="459.0" y="952.9" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#ba8cce" stroke-width="1.4"/><rect x="459.0" y="960.9" width="5" height="62.2" rx="2" fill="#8939ac"/><text x="475.0" y="974.9" font-size="13.5" fill="#57206e" font-weight="700" text-anchor="start"><tspan x="475.0">Corpóreo</tspan></text><text x="475.0" y="994.7" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Representación física vestible de una mascota o personaje,</tspan><tspan x="475.0" dy="15.2">operada por un intérprete en actividades presenciales</tspan></text><rect x="798.0" y="960.9" width="54" height="20" rx="10" fill="#d9bce5" stroke="#ba8cce" stroke-width="1"/><text x="825.0" y="974.9" font-size="11" fill="#57206e" font-weight="700" text-anchor="middle">↔ 5, 6</text><rect x="40.0" y="1045.0" width="401.0" height="93.4" rx="8" fill="#ffffff" stroke="#ba8cce" stroke-width="1.4"/><rect x="40.0" y="1053.0" width="5" height="77.4" rx="2" fill="#8939ac"/><text x="56.0" y="1067.0" font-size="13.5" fill="#57206e" font-weight="700" text-anchor="start"><tspan x="56.0">Atribución a la marca</tspan></text><text x="56.0" y="1086.9" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Proporción de personas expuestas que vincula correctamente</tspan><tspan x="56.0" dy="15.2">el personaje con la empresa sin ayuda engañosa</tspan></text><rect x="379.0" y="1053.0" width="54" height="20" rx="10" fill="#d9bce5" stroke="#ba8cce" stroke-width="1"/><text x="406.0" y="1067.0" font-size="11" fill="#57206e" font-weight="700" text-anchor="middle">↔ 3, 7</text><rect x="459.0" y="1045.0" width="401.0" height="93.4" rx="8" fill="#ffffff" stroke="#ba8cce" stroke-width="1.4"/><rect x="459.0" y="1053.0" width="5" height="77.4" rx="2" fill="#8939ac"/><text x="475.0" y="1067.0" font-size="13.5" fill="#57206e" font-weight="700" text-anchor="start"><tspan x="475.0">Retorno incremental de activación</tspan></text><text x="475.0" y="1086.9" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Margen de contribución incremental menos costo de</tspan><tspan x="475.0" dy="15.2">activación, dividido por ese costo, bajo un diseño</tspan><tspan x="475.0" dy="15.2">comparativo declarado</tspan></text><rect x="798.0" y="1053.0" width="54" height="20" rx="10" fill="#d9bce5" stroke="#ba8cce" stroke-width="1"/><text x="825.0" y="1067.0" font-size="11" fill="#57206e" font-weight="700" text-anchor="middle">↔ 6, 7</text><text x="40" y="1170.4" font-size="11.5" fill="#8939ac" font-weight="700" letter-spacing="1.4">QUÉ SE MIDE: NUMERADOR SOBRE DENOMINADOR</text><rect x="40.0" y="1184.4" width="261.3" height="151.1" rx="8" fill="#f1e2f7" stroke="#ba8cce" stroke-width="1.4"/><text x="54.0" y="1206.4" font-size="13" fill="#57206e" font-weight="700" text-anchor="start"><tspan x="54.0">Reconocimiento de la mascota</tspan></text><text x="54.0" y="1235.6" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Personas únicas del segmento que</tspan><tspan x="54.0" dy="15.2">reconocen el personaje</tspan></text><line x1="54.0" y1="1271.9" x2="287.3" y2="1271.9" stroke="#8939ac" stroke-width="2"/><text x="54.0" y="1289.9" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="54.0">Personas únicas encuestadas dentro</tspan><tspan x="54.0" dy="15.2">de 48 horas de la exposición</tspan></text><rect x="319.3" y="1184.4" width="261.3" height="151.1" rx="8" fill="#f1e2f7" stroke="#ba8cce" stroke-width="1.4"/><text x="333.3" y="1206.4" font-size="13" fill="#57206e" font-weight="700" text-anchor="start"><tspan x="333.3">Atribución correcta a la empresa</tspan></text><text x="333.3" y="1235.6" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="333.3">Personas únicas que nombran Ruta</tspan><tspan x="333.3" dy="15.2">Andina al ver el personaje</tspan></text><line x1="333.3" y1="1271.9" x2="566.7" y2="1271.9" stroke="#8939ac" stroke-width="2"/><text x="333.3" y="1289.9" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="333.3">Personas únicas que reconocen el</tspan><tspan x="333.3" dy="15.2">personaje en la misma ola</tspan></text><rect x="598.7" y="1184.4" width="261.3" height="151.1" rx="8" fill="#f1e2f7" stroke="#ba8cce" stroke-width="1.4"/><text x="612.7" y="1206.4" font-size="13" fill="#57206e" font-weight="700" text-anchor="start"><tspan x="612.7">Participación única</tspan></text><text x="612.7" y="1235.6" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="612.7">Personas observadas que completan la</tspan><tspan x="612.7" dy="15.2">interacción definida</tspan></text><line x1="612.7" y1="1271.9" x2="846.0" y2="1271.9" stroke="#8939ac" stroke-width="2"/><text x="612.7" y="1289.9" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="612.7">Personas expuestas observadas</tspan><tspan x="612.7" dy="15.2">durante cada bloque; fotografías</tspan><tspan x="612.7" dy="15.2">repetidas se deduplican</tspan></text><rect x="40.0" y="1349.5" width="261.3" height="153.0" rx="8" fill="#f1e2f7" stroke="#ba8cce" stroke-width="1.4"/><text x="54.0" y="1371.5" font-size="13" fill="#57206e" font-weight="700" text-anchor="start"><tspan x="54.0">Respuesta comercial</tspan><tspan x="54.0" dy="17.2">identificable</tspan></text><text x="54.0" y="1417.8" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Contactos pertinentes o visitas con</tspan><tspan x="54.0" dy="15.2">código válido</tspan></text><line x1="54.0" y1="1454.1" x2="287.3" y2="1454.1" stroke="#8939ac" stroke-width="2"/><text x="54.0" y="1472.1" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="54.0">Participantes únicos durante la</tspan><tspan x="54.0" dy="15.2">ventana declarada de siete días</tspan></text><rect x="319.3" y="1349.5" width="261.3" height="153.0" rx="8" fill="#f1e2f7" stroke="#ba8cce" stroke-width="1.4"/><text x="333.3" y="1371.5" font-size="13" fill="#57206e" font-weight="700" text-anchor="start"><tspan x="333.3">Retorno incremental estimado</tspan></text><text x="333.3" y="1400.6" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="333.3">Margen de contribución incremental</tspan><tspan x="333.3" dy="15.2">antes del costo menos costo total de</tspan><tspan x="333.3" dy="15.2">activación,</tspan></text><line x1="333.3" y1="1452.2" x2="566.7" y2="1452.2" stroke="#8939ac" stroke-width="2"/><text x="333.3" y="1470.2" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="333.3">Ese costo en la ventana comparada</tspan></text><rect x="598.7" y="1349.5" width="261.3" height="153.0" rx="8" fill="#f1e2f7" stroke="#ba8cce" stroke-width="1.4"/><text x="612.7" y="1371.5" font-size="13" fill="#57206e" font-weight="700" text-anchor="start"><tspan x="612.7">Cumplimiento de contraste</tspan></text><text x="612.7" y="1400.6" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="612.7">Elementos que cumplen el mínimo de</tspan><tspan x="612.7" dy="15.2">contraste</tspan></text><line x1="612.7" y1="1437.0" x2="846.0" y2="1437.0" stroke="#8939ac" stroke-width="2"/><text x="612.7" y="1455.0" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="612.7">Elementos evaluados</tspan></text><text x="40" y="1536.5" font-size="11.5" fill="#8939ac" font-weight="700" letter-spacing="1.4">FRONTERA DE APLICACIÓN</text><rect x="40" y="1546.5" width="820" height="81.5" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.4"/><polygon points="70,1572.25 52,1601.25 88,1601.25" fill="#c2410c"/><text x="70" y="1598.25" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">!</text><text x="106" y="1570.5" font-size="12.5" fill="#7c2d12" font-weight="400" text-anchor="start"><tspan x="106">No corresponde usar corpóreo cuando contradice el posicionamiento, desplaza una alternativa más eficaz, no</tspan><tspan x="106" dy="16.5">existe capacidad segura de operación o la medición no distinguirá atención de resultado. Una mascota no</tspan><tspan x="106" dy="16.5">sustituye propuesta de valor, producto, atención ni activos ya reconocidos.</tspan></text><text x="40" y="1656.0" font-size="11.5" fill="#8939ac" font-weight="700" letter-spacing="1.4">ERROR FRECUENTE Y SU CORRECCIÓN</text><rect x="40" y="1666.0" width="380.0" height="93.5" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/><text x="54" y="1688.0" font-size="11" fill="#b91c1c" font-weight="700" text-anchor="start"><tspan x="54">Síntoma</tspan></text><text x="54" y="1706.0" font-size="12.5" fill="#7f1d1d" font-weight="400" text-anchor="start"><tspan x="54">Presentar interacción y fotografías como ventas</tspan><tspan x="54" dy="16.5">incrementales</tspan></text><line x1="426.0" y1="1712.8" x2="469.0" y2="1712.8" stroke="#8939ac" stroke-width="2.6" stroke-linecap="round"/><polygon points="474.0,1712.8 465.9,1716.7 465.9,1708.8" fill="#8939ac"/><rect x="480.0" y="1666.0" width="380.0" height="93.5" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.4"/><text x="494.0" y="1688.0" font-size="11" fill="#15803d" font-weight="700" text-anchor="start"><tspan x="494.0">Corrección</tspan></text><text x="494.0" y="1706.0" font-size="12.5" fill="#14532d" font-weight="400" text-anchor="start"><tspan x="494.0">Separa exposición, participantes únicos,</tspan><tspan x="494.0" dy="16.5">atribución, respuesta comercial y resultado;</tspan><tspan x="494.0" dy="16.5">declara el diseño y sus confundidores.</tspan></text></svg>