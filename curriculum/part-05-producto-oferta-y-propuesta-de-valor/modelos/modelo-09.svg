<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1706" width="900" height="1706" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif"><title id="t">Modelo mental · Ciclo de vida del producto</title><desc id="d">Modelo mental de la clase 05.09: Ciclo de vida del producto. Método en 5 pasos; 8 conceptos; 4 señales de medición.</desc><rect x="0" y="0" width="900" height="1706" rx="14" fill="#ffffff"/><rect x="0" y="0" width="900" height="64" rx="14" fill="#20266e"/><rect x="0" y="40" width="900" height="24" fill="#20266e"/><text x="40" y="28" font-size="12" fill="#bcbfe5" font-weight="700" letter-spacing="1.6">MODELO MENTAL · CLASE 05.09 · PARTE 05</text><text x="40" y="52" font-size="21" fill="#ffffff" font-weight="700">Ciclo de vida del producto</text><text x="40" y="84" font-size="11.5" fill="#3942ac" font-weight="700" letter-spacing="1.4">MÉTODO PASO A PASO</text><ellipse cx="450.0" cy="403.2" rx="330.0" ry="251.2" fill="none" stroke="#8c92ce" stroke-width="2" stroke-dasharray="3 8" stroke-linecap="round"/><polygon points="653.6,205.3 636.2,201.8 641.4,192.4" fill="#3942ac"/><polygon points="759.5,490.9 761.2,473.3 771.1,477.5" fill="#3942ac"/><polygon points="439.0,654.4 455.9,649.0 455.9,659.8" fill="#3942ac"/><polygon points="131.8,470.7 143.4,484.1 133.5,488.4" fill="#3942ac"/><polygon points="265.7,194.7 253.5,207.6 248.3,198.1" fill="#3942ac"/><circle cx="450.0" cy="403.2" r="100.0" fill="#bcbfe5" stroke="#8c92ce" stroke-width="1.6"/><text x="450.0" y="395.4" font-size="15" fill="#20266e" font-weight="700" text-anchor="middle"><tspan x="450.0">Ciclo de vida del</tspan><tspan x="450.0" dy="19.8">producto</tspan></text><rect x="361.0" y="106.0" width="178" height="92.0" rx="10" fill="#e2e4f7" stroke="#8c92ce" stroke-width="1.4"/><text x="373.0" y="128.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="373.0">Estimar la fase con</tspan><tspan x="373.0" dy="16.5">datos de categoría y</tspan><tspan x="373.0" dy="16.5">no de la propia</tspan><tspan x="373.0" dy="16.5">empresa</tspan></text><circle cx="363.0" cy="108.0" r="14" fill="#20266e"/><text x="363.0" y="112.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><rect x="674.8" y="287.8" width="178" height="75.5" rx="10" fill="#e2e4f7" stroke="#8c92ce" stroke-width="1.4"/><text x="686.8" y="309.8" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="686.8">Definir la decisión de</tspan><tspan x="686.8" dy="16.5">inversión que</tspan><tspan x="686.8" dy="16.5">corresponde</tspan></text><circle cx="676.8" cy="289.8" r="14" fill="#20266e"/><text x="676.8" y="294.3" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><rect x="555.0" y="568.7" width="178" height="75.5" rx="10" fill="#e2e4f7" stroke="#8c92ce" stroke-width="1.4"/><text x="567.0" y="590.7" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="567.0">Planificar la</tspan><tspan x="567.0" dy="16.5">canibalización si se</tspan><tspan x="567.0" dy="16.5">lanza un reemplazo</tspan></text><circle cx="557.0" cy="570.7" r="14" fill="#20266e"/><text x="557.0" y="575.2" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><rect x="167.0" y="568.7" width="178" height="75.5" rx="10" fill="#e2e4f7" stroke="#8c92ce" stroke-width="1.4"/><text x="179.0" y="590.7" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="179.0">Diseñar el retiro</tspan><tspan x="179.0" dy="16.5">ordenado cuando</tspan><tspan x="179.0" dy="16.5">corresponda</tspan></text><circle cx="169.0" cy="570.7" r="14" fill="#20266e"/><text x="169.0" y="575.2" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">4</text><rect x="47.2" y="296.1" width="178" height="59.0" rx="10" fill="#e2e4f7" stroke="#8c92ce" stroke-width="1.4"/><text x="59.2" y="318.1" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="59.2">Revisar la estimación</tspan><tspan x="59.2" dy="16.5">cada semestre</tspan></text><circle cx="49.2" cy="298.1" r="14" fill="#20266e"/><text x="49.2" y="302.6" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">5</text><text x="40" y="742.4" font-size="11.5" fill="#3942ac" font-weight="700" letter-spacing="1.4">CONCEPTOS Y DÓNDE ACTÚAN EN EL MÉTODO</text><rect x="40.0" y="756.4" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#8c92ce" stroke-width="1.4"/><rect x="40.0" y="764.4" width="5" height="62.2" rx="2" fill="#3942ac"/><text x="56.0" y="778.4" font-size="13.5" fill="#20266e" font-weight="700" text-anchor="start"><tspan x="56.0">Fase del ciclo</tspan></text><text x="56.0" y="798.2" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Etapa estimada según crecimiento de la categoría y</tspan><tspan x="56.0" dy="15.2">comportamiento competitivo</tspan></text><rect x="379.0" y="764.4" width="54" height="20" rx="10" fill="#bcbfe5" stroke="#8c92ce" stroke-width="1"/><text x="406.0" y="778.4" font-size="11" fill="#20266e" font-weight="700" text-anchor="middle">↔ 1</text><rect x="459.0" y="756.4" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#8c92ce" stroke-width="1.4"/><rect x="459.0" y="764.4" width="5" height="62.2" rx="2" fill="#3942ac"/><text x="475.0" y="778.4" font-size="13.5" fill="#20266e" font-weight="700" text-anchor="start"><tspan x="475.0">Decisión por fase</tspan></text><text x="475.0" y="798.2" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Tipo de inversión que corresponde a la fase estimada</tspan></text><rect x="798.0" y="764.4" width="54" height="20" rx="10" fill="#bcbfe5" stroke="#8c92ce" stroke-width="1"/><text x="825.0" y="778.4" font-size="11" fill="#20266e" font-weight="700" text-anchor="middle">↔ 2</text><rect x="40.0" y="848.6" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#8c92ce" stroke-width="1.4"/><rect x="40.0" y="856.6" width="5" height="62.2" rx="2" fill="#3942ac"/><text x="56.0" y="870.6" font-size="13.5" fill="#20266e" font-weight="700" text-anchor="start"><tspan x="56.0">Canibalización planificada</tspan></text><text x="56.0" y="890.4" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Reemplazo deliberado de un producto propio por otro más</tspan><tspan x="56.0" dy="15.2">nuevo</tspan></text><rect x="379.0" y="856.6" width="54" height="20" rx="10" fill="#bcbfe5" stroke="#8c92ce" stroke-width="1"/><text x="406.0" y="870.6" font-size="11" fill="#20266e" font-weight="700" text-anchor="middle">↔ 3</text><rect x="459.0" y="848.6" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#8c92ce" stroke-width="1.4"/><rect x="459.0" y="856.6" width="5" height="62.2" rx="2" fill="#3942ac"/><text x="475.0" y="870.6" font-size="13.5" fill="#20266e" font-weight="700" text-anchor="start"><tspan x="475.0">Retiro ordenado</tspan></text><text x="475.0" y="890.4" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Proceso de discontinuación que protege a los clientes</tspan><tspan x="475.0" dy="15.2">existentes y la reputación</tspan></text><rect x="798.0" y="856.6" width="54" height="20" rx="10" fill="#bcbfe5" stroke="#8c92ce" stroke-width="1"/><text x="825.0" y="870.6" font-size="11" fill="#20266e" font-weight="700" text-anchor="middle">↔ 4</text><rect x="40.0" y="940.8" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#8c92ce" stroke-width="1.4"/><rect x="40.0" y="948.8" width="5" height="62.2" rx="2" fill="#3942ac"/><text x="56.0" y="962.8" font-size="13.5" fill="#20266e" font-weight="700" text-anchor="start"><tspan x="56.0">Etapa de ciclo de vida</tspan></text><text x="56.0" y="982.6" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Patrón diagnosticado con adopción, crecimiento,</tspan><tspan x="56.0" dy="15.2">competencia, margen y comportamiento, no edad del producto</tspan></text><rect x="459.0" y="940.8" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#8c92ce" stroke-width="1.4"/><rect x="459.0" y="948.8" width="5" height="62.2" rx="2" fill="#3942ac"/><text x="475.0" y="962.8" font-size="13.5" fill="#20266e" font-weight="700" text-anchor="start"><tspan x="475.0">Canibalización</tspan></text><text x="475.0" y="982.6" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Ventas o uso de una oferta nueva que desplazan una oferta</tspan><tspan x="475.0" dy="15.2">propia existente</tspan></text><rect x="798.0" y="948.8" width="54" height="20" rx="10" fill="#bcbfe5" stroke="#8c92ce" stroke-width="1"/><text x="825.0" y="962.8" font-size="11" fill="#20266e" font-weight="700" text-anchor="middle">↔ 3</text><rect x="40.0" y="1032.9" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#8c92ce" stroke-width="1.4"/><rect x="40.0" y="1040.9" width="5" height="62.2" rx="2" fill="#3942ac"/><text x="56.0" y="1054.9" font-size="13.5" fill="#20266e" font-weight="700" text-anchor="start"><tspan x="56.0">Renovación de producto</tspan></text><text x="56.0" y="1074.8" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Cambio de propuesta, segmento, tecnología o modelo que</tspan><tspan x="56.0" dy="15.2">busca reabrir crecimiento</tspan></text><rect x="459.0" y="1032.9" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#8c92ce" stroke-width="1.4"/><rect x="459.0" y="1040.9" width="5" height="62.2" rx="2" fill="#3942ac"/><text x="475.0" y="1054.9" font-size="13.5" fill="#20266e" font-weight="700" text-anchor="start"><tspan x="475.0">Retiro gestionado</tspan></text><text x="475.0" y="1074.8" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Decisión planificada de descontinuar protegiendo clientes,</tspan><tspan x="475.0" dy="15.2">datos, contratos y reputación</tspan></text><rect x="798.0" y="1040.9" width="54" height="20" rx="10" fill="#bcbfe5" stroke="#8c92ce" stroke-width="1"/><text x="825.0" y="1054.9" font-size="11" fill="#20266e" font-weight="700" text-anchor="middle">↔ 4</text><text x="40" y="1143.1200000000001" font-size="11.5" fill="#3942ac" font-weight="700" letter-spacing="1.4">QUÉ SE MIDE: NUMERADOR SOBRE DENOMINADOR</text><rect x="40.0" y="1157.1" width="261.3" height="83.5" rx="8" fill="#e2e4f7" stroke="#8c92ce" stroke-width="1.4"/><text x="54.0" y="1179.1" font-size="13" fill="#20266e" font-weight="700" text-anchor="start"><tspan x="54.0">Crecimiento de la categoría</tspan></text><text x="54.0" y="1208.3" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Variación porcentual anual de la</tspan><tspan x="54.0" dy="15.2">demanda estimada de la categoría</tspan></text><rect x="319.3" y="1157.1" width="261.3" height="83.5" rx="8" fill="#e2e4f7" stroke="#8c92ce" stroke-width="1.4"/><text x="333.3" y="1179.1" font-size="13" fill="#20266e" font-weight="700" text-anchor="start"><tspan x="333.3">Participación relativa</tspan></text><text x="333.3" y="1208.3" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="333.3">Participación propia frente al</tspan><tspan x="333.3" dy="15.2">competidor principal en el segmento</tspan></text><rect x="598.7" y="1157.1" width="261.3" height="83.5" rx="8" fill="#e2e4f7" stroke="#8c92ce" stroke-width="1.4"/><text x="612.7" y="1179.1" font-size="13" fill="#20266e" font-weight="700" text-anchor="start"><tspan x="612.7">Margen por producto en el tiempo</tspan></text><text x="612.7" y="1208.3" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="612.7">Evolución del margen de contribución</tspan><tspan x="612.7" dy="15.2">por producto, trimestral</tspan></text><rect x="40.0" y="1254.6" width="261.3" height="190.1" rx="8" fill="#e2e4f7" stroke="#8c92ce" stroke-width="1.4"/><text x="54.0" y="1276.6" font-size="13" fill="#20266e" font-weight="700" text-anchor="start"><tspan x="54.0">Rentabilidad incremental de</tspan><tspan x="54.0" dy="17.2">extensión</tspan></text><text x="54.0" y="1323.0" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Margen incremental nuevo menos</tspan><tspan x="54.0" dy="15.2">margen desplazado y costos de</tspan><tspan x="54.0" dy="15.2">transición</tspan></text><line x1="54.0" y1="1374.5" x2="287.3" y2="1374.5" stroke="#3942ac" stroke-width="2"/><text x="54.0" y="1392.5" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="54.0">Inversión incremental de la</tspan><tspan x="54.0" dy="15.2">extensión</tspan></text><text x="54.0" y="1436.9" font-size="10.5" fill="#7b8794" font-weight="400" text-anchor="start"><tspan x="54.0">Ventana: cohortes de 6 y 12 meses</tspan></text><text x="40" y="1478.72" font-size="11.5" fill="#3942ac" font-weight="700" letter-spacing="1.4">FRONTERA DE APLICACIÓN</text><rect x="40" y="1488.7" width="820" height="65.0" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.4"/><polygon points="70,1506.22 52,1535.22 88,1535.22" fill="#c2410c"/><text x="70" y="1532.22" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">!</text><text x="106" y="1512.7" font-size="12.5" fill="#7c2d12" font-weight="400" text-anchor="start"><tspan x="106">El marco es descriptivo y puede inducir decisiones erróneas si la fase se estima con datos internos en</tspan><tspan x="106" dy="16.5">lugar de datos de categoría.</tspan></text><text x="40" y="1581.72" font-size="11.5" fill="#3942ac" font-weight="700" letter-spacing="1.4">ERROR FRECUENTE Y SU CORRECCIÓN</text><rect x="40" y="1591.7" width="380.0" height="77.0" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/><text x="54" y="1613.7" font-size="11" fill="#b91c1c" font-weight="700" text-anchor="start"><tspan x="54">Síntoma</tspan></text><text x="54" y="1631.7" font-size="12.5" fill="#7f1d1d" font-weight="400" text-anchor="start"><tspan x="54">Estimar la fase con datos propios</tspan></text><line x1="426.0" y1="1630.2" x2="469.0" y2="1630.2" stroke="#3942ac" stroke-width="2.6" stroke-linecap="round"/><polygon points="474.0,1630.2 465.9,1634.1 465.9,1626.3" fill="#3942ac"/><rect x="480.0" y="1591.7" width="380.0" height="77.0" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.4"/><text x="494.0" y="1613.7" font-size="11" fill="#15803d" font-weight="700" text-anchor="start"><tspan x="494.0">Corrección</tspan></text><text x="494.0" y="1631.7" font-size="12.5" fill="#14532d" font-weight="400" text-anchor="start"><tspan x="494.0">Usa datos de la categoría y del comportamiento</tspan><tspan x="494.0" dy="16.5">competitivo, no la curva de ventas propia.</tspan></text></svg>