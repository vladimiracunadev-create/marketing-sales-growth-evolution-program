<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1084" width="900" height="1084" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif"><title id="t">Modelo mental · Clustering conceptual de clientes</title><desc id="d">Modelo mental de la clase 04.04: Clustering conceptual de clientes. Método en 5 pasos; 4 conceptos; 3 señales de medición.</desc><rect x="0" y="0" width="900" height="1084" rx="14" fill="#ffffff"/><rect x="0" y="0" width="900" height="64" rx="14" fill="#20646e"/><rect x="0" y="40" width="900" height="24" fill="#20646e"/><text x="40" y="28" font-size="12" fill="#bce0e5" font-weight="700" letter-spacing="1.6">MODELO MENTAL · CLASE 04.04 · PARTE 04</text><text x="40" y="52" font-size="21" fill="#ffffff" font-weight="700">Clustering conceptual de clientes</text><text x="40" y="84" font-size="11.5" fill="#399cac" font-weight="700" letter-spacing="1.4">MÉTODO PASO A PASO</text><path d="M66.0,159.0 V202.5 H158.5" fill="none" stroke="#399cac" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="160.5,202.5 151.5,197.5 151.5,207.5" fill="#399cac"/><path d="M188.5,232.0 V275.5 H281.0" fill="none" stroke="#399cac" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="283.0,275.5 274.0,270.5 274.0,280.5" fill="#399cac"/><path d="M311.0,305.0 V348.5 H403.5" fill="none" stroke="#399cac" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="405.5,348.5 396.5,343.5 396.5,353.5" fill="#399cac"/><path d="M433.5,378.0 V421.5 H526.0" fill="none" stroke="#399cac" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="528.0,421.5 519.0,416.5 519.0,426.5" fill="#399cac"/><rect x="40.0" y="100.0" width="330" height="59.0" rx="10" fill="#e2f5f7" stroke="#8cc5ce" stroke-width="1.4"/><text x="54.0" y="122.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Elegir variables con justificación de</tspan><tspan x="54.0" dy="16.5">negocio</tspan></text><circle cx="42.0" cy="102.0" r="14" fill="#20646e"/><text x="42.0" y="106.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><rect x="162.5" y="173.0" width="330" height="59.0" rx="10" fill="#e2f5f7" stroke="#8cc5ce" stroke-width="1.4"/><text x="176.5" y="195.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="176.5">Normalizar escalas y documentar el criterio</tspan></text><circle cx="164.5" cy="175.0" r="14" fill="#20646e"/><text x="164.5" y="179.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><rect x="285.0" y="246.0" width="330" height="59.0" rx="10" fill="#e2f5f7" stroke="#8cc5ce" stroke-width="1.4"/><text x="299.0" y="268.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="299.0">Generar agrupaciones y evaluar cohesión</tspan></text><circle cx="287.0" cy="248.0" r="14" fill="#20646e"/><text x="287.0" y="252.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><rect x="407.5" y="319.0" width="330" height="59.0" rx="10" fill="#e2f5f7" stroke="#8cc5ce" stroke-width="1.4"/><text x="421.5" y="341.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="421.5">Describir cada grupo con una regla</tspan><tspan x="421.5" dy="16.5">accionable</tspan></text><circle cx="409.5" cy="321.0" r="14" fill="#20646e"/><text x="409.5" y="325.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">4</text><rect x="530.0" y="392.0" width="330" height="59.0" rx="10" fill="#e2f5f7" stroke="#8cc5ce" stroke-width="1.4"/><text x="544.0" y="414.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="544.0">Verificar estabilidad en un periodo distinto</tspan></text><circle cx="532.0" cy="394.0" r="14" fill="#20646e"/><text x="532.0" y="398.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">5</text><text x="40" y="493.0" font-size="11.5" fill="#399cac" font-weight="700" letter-spacing="1.4">CONCEPTOS Y DÓNDE ACTÚAN EN EL MÉTODO</text><rect x="40.0" y="507.0" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#8cc5ce" stroke-width="1.4"/><rect x="40.0" y="515.0" width="5" height="62.2" rx="2" fill="#399cac"/><text x="56.0" y="529.0" font-size="13.5" fill="#20646e" font-weight="700" text-anchor="start"><tspan x="56.0">Variable de entrada</tspan></text><text x="56.0" y="548.8" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Atributo incluido en el agrupamiento, cuya escala</tspan><tspan x="56.0" dy="15.2">condiciona el resultado</tspan></text><rect x="379.0" y="515.0" width="54" height="20" rx="10" fill="#bce0e5" stroke="#8cc5ce" stroke-width="1"/><text x="406.0" y="529.0" font-size="11" fill="#20646e" font-weight="700" text-anchor="middle">↔ 1</text><rect x="459.0" y="507.0" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#8cc5ce" stroke-width="1.4"/><rect x="459.0" y="515.0" width="5" height="62.2" rx="2" fill="#399cac"/><text x="475.0" y="529.0" font-size="13.5" fill="#20646e" font-weight="700" text-anchor="start"><tspan x="475.0">Cohesión del grupo</tspan></text><text x="475.0" y="548.8" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Grado en que los miembros de un grupo se parecen entre sí</tspan><tspan x="475.0" dy="15.2">más que a los de otros grupos</tspan></text><rect x="798.0" y="515.0" width="54" height="20" rx="10" fill="#bce0e5" stroke="#8cc5ce" stroke-width="1"/><text x="825.0" y="529.0" font-size="11" fill="#20646e" font-weight="700" text-anchor="middle">↔ 3, 4</text><rect x="40.0" y="599.2" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#8cc5ce" stroke-width="1.4"/><rect x="40.0" y="607.2" width="5" height="62.2" rx="2" fill="#399cac"/><text x="56.0" y="621.2" font-size="13.5" fill="#20646e" font-weight="700" text-anchor="start"><tspan x="56.0">Interpretabilidad</tspan></text><text x="56.0" y="641.0" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Posibilidad de describir el grupo con una regla de negocio</tspan><tspan x="56.0" dy="15.2">comprensible</tspan></text><rect x="379.0" y="607.2" width="54" height="20" rx="10" fill="#bce0e5" stroke="#8cc5ce" stroke-width="1"/><text x="406.0" y="621.2" font-size="11" fill="#20646e" font-weight="700" text-anchor="middle">↔ 4</text><rect x="459.0" y="599.2" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#8cc5ce" stroke-width="1.4"/><rect x="459.0" y="607.2" width="5" height="62.2" rx="2" fill="#399cac"/><text x="475.0" y="621.2" font-size="13.5" fill="#20646e" font-weight="700" text-anchor="start"><tspan x="475.0">Estabilidad temporal</tspan></text><text x="475.0" y="641.0" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Permanencia de la estructura de grupos al repetir el</tspan><tspan x="475.0" dy="15.2">análisis en otro periodo</tspan></text><rect x="798.0" y="607.2" width="54" height="20" rx="10" fill="#bce0e5" stroke="#8cc5ce" stroke-width="1"/><text x="825.0" y="621.2" font-size="11" fill="#20646e" font-weight="700" text-anchor="middle">↔ 5</text><text x="40" y="709.3600000000001" font-size="11.5" fill="#399cac" font-weight="700" letter-spacing="1.4">QUÉ SE MIDE: NUMERADOR SOBRE DENOMINADOR</text><rect x="40.0" y="723.4" width="261.3" height="98.7" rx="8" fill="#e2f5f7" stroke="#8cc5ce" stroke-width="1.4"/><text x="54.0" y="745.4" font-size="13" fill="#20646e" font-weight="700" text-anchor="start"><tspan x="54.0">Cohesión y separación</tspan></text><text x="54.0" y="774.5" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Medida de distancia intragrupo</tspan><tspan x="54.0" dy="15.2">frente a distancia entre grupos</tspan></text><rect x="319.3" y="723.4" width="261.3" height="98.7" rx="8" fill="#e2f5f7" stroke="#8cc5ce" stroke-width="1.4"/><text x="333.3" y="745.4" font-size="13" fill="#20646e" font-weight="700" text-anchor="start"><tspan x="333.3">Estabilidad entre periodos</tspan></text><text x="333.3" y="774.5" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="333.3">Proporción de clientes que</tspan><tspan x="333.3" dy="15.2">permanecen en el mismo grupo al</tspan><tspan x="333.3" dy="15.2">repetir el análisis</tspan></text><rect x="598.7" y="723.4" width="261.3" height="98.7" rx="8" fill="#e2f5f7" stroke="#8cc5ce" stroke-width="1.4"/><text x="612.7" y="745.4" font-size="13" fill="#20646e" font-weight="700" text-anchor="start"><tspan x="612.7">Diferencia de valor entre grupos</tspan></text><text x="612.7" y="774.5" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="612.7">Ingreso y retención promedio por</tspan><tspan x="612.7" dy="15.2">grupo, con su dispersión</tspan></text><text x="40" y="856.0600000000002" font-size="11.5" fill="#399cac" font-weight="700" letter-spacing="1.4">FRONTERA DE APLICACIÓN</text><rect x="40" y="866.1" width="820" height="65.0" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.4"/><polygon points="70,883.5600000000002 52,912.5600000000002 88,912.5600000000002" fill="#c2410c"/><text x="70" y="909.5600000000002" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">!</text><text x="106" y="890.1" font-size="12.5" fill="#7c2d12" font-weight="400" text-anchor="start"><tspan x="106">El agrupamiento describe, no explica. No indica causa ni predice respuesta a un tratamiento: para eso hace</tspan><tspan x="106" dy="16.5">falta experimentación.</tspan></text><text x="40" y="959.0600000000002" font-size="11.5" fill="#399cac" font-weight="700" letter-spacing="1.4">ERROR FRECUENTE Y SU CORRECCIÓN</text><rect x="40" y="969.1" width="380.0" height="77.0" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/><text x="54" y="991.1" font-size="11" fill="#b91c1c" font-weight="700" text-anchor="start"><tspan x="54">Síntoma</tspan></text><text x="54" y="1009.1" font-size="12.5" fill="#7f1d1d" font-weight="400" text-anchor="start"><tspan x="54">Aceptar grupos que no se pueden describir en</tspan><tspan x="54" dy="16.5">lenguaje de negocio</tspan></text><line x1="426.0" y1="1007.6" x2="469.0" y2="1007.6" stroke="#399cac" stroke-width="2.6" stroke-linecap="round"/><polygon points="474.0,1007.6 465.9,1011.5 465.9,1003.6" fill="#399cac"/><rect x="480.0" y="969.1" width="380.0" height="77.0" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.4"/><text x="494.0" y="991.1" font-size="11" fill="#15803d" font-weight="700" text-anchor="start"><tspan x="494.0">Corrección</tspan></text><text x="494.0" y="1009.1" font-size="12.5" fill="#14532d" font-weight="400" text-anchor="start"><tspan x="494.0">Exige una regla verbal por grupo; si no existe,</tspan><tspan x="494.0" dy="16.5">revisa las variables de entrada.</tspan></text></svg>