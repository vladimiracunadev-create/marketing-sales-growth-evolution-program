<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1584" width="900" height="1584" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif"><title id="t">Modelo mental · Gobernanza de automatizaciones</title><desc id="d">Modelo mental de la clase 17.13: Gobernanza de automatizaciones. Método en 8 pasos; 5 conceptos; 5 señales de medición.</desc><rect x="0" y="0" width="900" height="1584" rx="14" fill="#ffffff"/><rect x="0" y="0" width="900" height="64" rx="14" fill="#556e20"/><rect x="0" y="40" width="900" height="24" fill="#556e20"/><text x="40" y="28" font-size="12" fill="#d8e5bc" font-weight="700" letter-spacing="1.6">MODELO MENTAL · CLASE 17.13 · PARTE 17</text><text x="40" y="52" font-size="21" fill="#ffffff" font-weight="700">Gobernanza de automatizaciones</text><text x="40" y="84" font-size="11.5" fill="#87ac39" font-weight="700" letter-spacing="1.4">MÉTODO PASO A PASO</text><ellipse cx="450.0" cy="403.2" rx="330.0" ry="251.2" fill="none" stroke="#b9ce8c" stroke-width="2" stroke-dasharray="3 8" stroke-linecap="round"/><polygon points="586.8,174.4 569.0,174.5 572.3,164.2" fill="#87ac39"/><polygon points="760.1,316.7 747.3,304.5 756.8,299.3" fill="#87ac39"/><polygon points="749.6,509.0 753.0,491.6 762.4,496.7" fill="#87ac39"/><polygon points="565.8,638.6 580.3,628.4 583.5,638.7" fill="#87ac39"/><polygon points="313.2,632.0 331.0,631.9 327.7,642.2" fill="#87ac39"/><polygon points="139.9,489.7 152.7,501.9 143.2,507.1" fill="#87ac39"/><polygon points="150.4,297.4 147.0,314.8 137.6,309.7" fill="#87ac39"/><polygon points="334.2,167.8 319.7,178.0 316.5,167.7" fill="#87ac39"/><circle cx="450.0" cy="403.2" r="100.0" fill="#d8e5bc" stroke="#b9ce8c" stroke-width="1.6"/><text x="450.0" y="395.4" font-size="15" fill="#556e20" font-weight="700" text-anchor="middle"><tspan x="450.0">Gobernanza de</tspan><tspan x="450.0" dy="19.8">automatizaciones</tspan></text><rect x="361.0" y="114.2" width="178" height="75.5" rx="10" fill="#f1f7e2" stroke="#b9ce8c" stroke-width="1.4"/><text x="373.0" y="136.2" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="373.0">Definir autoridad de</tspan><tspan x="373.0" dy="16.5">cambio por tipo de</tspan><tspan x="373.0" dy="16.5">automatización</tspan></text><circle cx="363.0" cy="116.2" r="14" fill="#556e20"/><text x="363.0" y="120.8" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><rect x="594.3" y="187.8" width="178" height="75.5" rx="10" fill="#f1f7e2" stroke="#b9ce8c" stroke-width="1.4"/><text x="606.3" y="209.8" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="606.3">Documentar propósito y</tspan><tspan x="606.3" dy="16.5">base legal de cada</tspan><tspan x="606.3" dy="16.5">flujo</tspan></text><circle cx="596.3" cy="189.8" r="14" fill="#556e20"/><text x="596.3" y="194.3" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><rect x="691.0" y="365.4" width="178" height="75.5" rx="10" fill="#f1f7e2" stroke="#b9ce8c" stroke-width="1.4"/><text x="703.0" y="387.4" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="703.0">Registrar afiliados,</tspan><tspan x="703.0" dy="16.5">dominios, contratos y</tspan><tspan x="703.0" dy="16.5">claims autorizados</tspan></text><circle cx="693.0" cy="367.4" r="14" fill="#556e20"/><text x="693.0" y="371.9" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><rect x="594.3" y="534.8" width="178" height="92.0" rx="10" fill="#f1f7e2" stroke="#b9ce8c" stroke-width="1.4"/><text x="606.3" y="556.8" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="606.3">Versionar</tspan><tspan x="606.3" dy="16.5">creatividades y</tspan><tspan x="606.3" dy="16.5">aprobarlas antes de</tspan><tspan x="606.3" dy="16.5">distribuir</tspan></text><circle cx="596.3" cy="536.8" r="14" fill="#556e20"/><text x="596.3" y="541.3" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">4</text><rect x="361.0" y="616.6" width="178" height="75.5" rx="10" fill="#f1f7e2" stroke="#b9ce8c" stroke-width="1.4"/><text x="373.0" y="638.6" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="373.0">Monitorear</tspan><tspan x="373.0" dy="16.5">infracciones y probar</tspan><tspan x="373.0" dy="16.5">el kill switch</tspan></text><circle cx="363.0" cy="618.6" r="14" fill="#556e20"/><text x="363.0" y="623.1" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">5</text><rect x="127.7" y="551.3" width="178" height="59.0" rx="10" fill="#f1f7e2" stroke="#b9ce8c" stroke-width="1.4"/><text x="139.7" y="573.3" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="139.7">Establecer la revisión</tspan><tspan x="139.7" dy="16.5">periódica y su alcance</tspan></text><circle cx="129.7" cy="553.3" r="14" fill="#556e20"/><text x="129.7" y="557.8" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">6</text><rect x="31.0" y="373.7" width="178" height="59.0" rx="10" fill="#f1f7e2" stroke="#b9ce8c" stroke-width="1.4"/><text x="43.0" y="395.7" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="43.0">Retirar los flujos</tspan><tspan x="43.0" dy="16.5">obsoletos</tspan></text><circle cx="33.0" cy="375.7" r="14" fill="#556e20"/><text x="33.0" y="380.2" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">7</text><rect x="127.7" y="187.8" width="178" height="75.5" rx="10" fill="#f1f7e2" stroke="#b9ce8c" stroke-width="1.4"/><text x="139.7" y="209.8" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="139.7">Mantener el registro</tspan><tspan x="139.7" dy="16.5">de tratamiento</tspan><tspan x="139.7" dy="16.5">actualizado</tspan></text><circle cx="129.7" cy="189.8" r="14" fill="#556e20"/><text x="129.7" y="194.3" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">8</text><text x="40" y="742.4" font-size="11.5" fill="#87ac39" font-weight="700" letter-spacing="1.4">CONCEPTOS Y DÓNDE ACTÚAN EN EL MÉTODO</text><rect x="40.0" y="756.4" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#b9ce8c" stroke-width="1.4"/><rect x="40.0" y="764.4" width="5" height="62.2" rx="2" fill="#87ac39"/><text x="56.0" y="778.4" font-size="13.5" fill="#556e20" font-weight="700" text-anchor="start"><tspan x="56.0">Autoridad de cambio</tspan></text><text x="56.0" y="798.2" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Definición de quién puede modificar qué en el sistema</tspan><tspan x="56.0" dy="15.2">automatizado</tspan></text><rect x="379.0" y="764.4" width="54" height="20" rx="10" fill="#d8e5bc" stroke="#b9ce8c" stroke-width="1"/><text x="406.0" y="778.4" font-size="11" fill="#556e20" font-weight="700" text-anchor="middle">↔ 1, 3</text><rect x="459.0" y="756.4" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#b9ce8c" stroke-width="1.4"/><rect x="459.0" y="764.4" width="5" height="62.2" rx="2" fill="#87ac39"/><text x="475.0" y="778.4" font-size="13.5" fill="#556e20" font-weight="700" text-anchor="start"><tspan x="475.0">Registro de tratamiento</tspan></text><text x="475.0" y="798.2" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Documentación de qué datos se usaron, con qué finalidad y</tspan><tspan x="475.0" dy="15.2">bajo qué base</tspan></text><rect x="798.0" y="764.4" width="54" height="20" rx="10" fill="#d8e5bc" stroke="#b9ce8c" stroke-width="1"/><text x="825.0" y="778.4" font-size="11" fill="#556e20" font-weight="700" text-anchor="middle">↔ 3, 8</text><rect x="40.0" y="848.6" width="401.0" height="63.0" rx="8" fill="#ffffff" stroke="#b9ce8c" stroke-width="1.4"/><rect x="40.0" y="856.6" width="5" height="47.0" rx="2" fill="#87ac39"/><text x="56.0" y="870.6" font-size="13.5" fill="#556e20" font-weight="700" text-anchor="start"><tspan x="56.0">Revisión periódica</tspan></text><text x="56.0" y="890.4" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Auditoría programada de las automatizaciones activas</tspan></text><rect x="379.0" y="856.6" width="54" height="20" rx="10" fill="#d8e5bc" stroke="#b9ce8c" stroke-width="1"/><text x="406.0" y="870.6" font-size="11" fill="#556e20" font-weight="700" text-anchor="middle">↔ 6</text><rect x="459.0" y="848.6" width="401.0" height="63.0" rx="8" fill="#ffffff" stroke="#b9ce8c" stroke-width="1.4"/><rect x="459.0" y="856.6" width="5" height="47.0" rx="2" fill="#87ac39"/><text x="475.0" y="870.6" font-size="13.5" fill="#556e20" font-weight="700" text-anchor="start"><tspan x="475.0">Retiro de automatizaciones</tspan></text><text x="475.0" y="890.4" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Proceso de desactivar flujos que ya no cumplen función</tspan></text><rect x="798.0" y="856.6" width="54" height="20" rx="10" fill="#d8e5bc" stroke="#b9ce8c" stroke-width="1"/><text x="825.0" y="870.6" font-size="11" fill="#556e20" font-weight="700" text-anchor="middle">↔ 1, 7</text><rect x="40.0" y="925.6" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#b9ce8c" stroke-width="1.4"/><rect x="40.0" y="933.6" width="5" height="62.2" rx="2" fill="#87ac39"/><text x="56.0" y="947.6" font-size="13.5" fill="#556e20" font-weight="700" text-anchor="start"><tspan x="56.0">Gobernanza de afiliados</tspan></text><text x="56.0" y="967.4" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Sistema que identifica, autoriza, monitorea y puede</tspan><tspan x="56.0" dy="15.2">suspender a cada tercero comercial</tspan></text><rect x="379.0" y="933.6" width="54" height="20" rx="10" fill="#d8e5bc" stroke="#b9ce8c" stroke-width="1"/><text x="406.0" y="947.6" font-size="11" fill="#556e20" font-weight="700" text-anchor="middle">↔ 3</text><text x="40" y="1035.76" font-size="11.5" fill="#87ac39" font-weight="700" letter-spacing="1.4">QUÉ SE MIDE: NUMERADOR SOBRE DENOMINADOR</text><rect x="40.0" y="1049.8" width="261.3" height="137.9" rx="8" fill="#f1f7e2" stroke="#b9ce8c" stroke-width="1.4"/><text x="54.0" y="1071.8" font-size="13" fill="#556e20" font-weight="700" text-anchor="start"><tspan x="54.0">Flujos con base legal</tspan><tspan x="54.0" dy="17.2">documentada</tspan></text><text x="54.0" y="1118.1" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Automatizaciones con finalidad y</tspan><tspan x="54.0" dy="15.2">base registradas</tspan></text><line x1="54.0" y1="1154.4" x2="287.3" y2="1154.4" stroke="#87ac39" stroke-width="2"/><text x="54.0" y="1172.4" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="54.0">Automatizaciones activas</tspan></text><rect x="319.3" y="1049.8" width="261.3" height="137.9" rx="8" fill="#f1f7e2" stroke="#b9ce8c" stroke-width="1.4"/><text x="333.3" y="1071.8" font-size="13" fill="#556e20" font-weight="700" text-anchor="start"><tspan x="333.3">Flujos retirados por revisión</tspan></text><text x="333.3" y="1100.9" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="333.3">Automatizaciones desactivadas por</tspan><tspan x="333.3" dy="15.2">obsolescencia, por semestre</tspan></text><rect x="598.7" y="1049.8" width="261.3" height="137.9" rx="8" fill="#f1f7e2" stroke="#b9ce8c" stroke-width="1.4"/><text x="612.7" y="1071.8" font-size="13" fill="#556e20" font-weight="700" text-anchor="start"><tspan x="612.7">Cambios con aprobación</tspan><tspan x="612.7" dy="17.2">registrada</tspan></text><text x="612.7" y="1118.1" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="612.7">Modificaciones con aprobación</tspan><tspan x="612.7" dy="15.2">documentada</tspan></text><line x1="612.7" y1="1154.4" x2="846.0" y2="1154.4" stroke="#87ac39" stroke-width="2"/><text x="612.7" y="1172.4" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="612.7">Modificaciones realizadas</tspan></text><rect x="40.0" y="1201.6" width="261.3" height="120.7" rx="8" fill="#f1f7e2" stroke="#b9ce8c" stroke-width="1.4"/><text x="54.0" y="1223.6" font-size="13" fill="#556e20" font-weight="700" text-anchor="start"><tspan x="54.0">Affiliate violation rate</tspan></text><text x="54.0" y="1252.8" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Infracciones confirmadas</tspan></text><line x1="54.0" y1="1274.0" x2="287.3" y2="1274.0" stroke="#87ac39" stroke-width="2"/><text x="54.0" y="1292.0" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="54.0">Piezas o afiliados auditados, por</tspan><tspan x="54.0" dy="15.2">mes</tspan></text><rect x="319.3" y="1201.6" width="261.3" height="120.7" rx="8" fill="#f1f7e2" stroke="#b9ce8c" stroke-width="1.4"/><text x="333.3" y="1223.6" font-size="13" fill="#556e20" font-weight="700" text-anchor="start"><tspan x="333.3">Tiempo de kill switch</tspan></text><text x="333.3" y="1252.8" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="333.3">Minutos desde la orden de suspensión</tspan><tspan x="333.3" dy="15.2">hasta el cese verificado en cada</tspan><tspan x="333.3" dy="15.2">canal</tspan></text><text x="40" y="1356.32" font-size="11.5" fill="#87ac39" font-weight="700" letter-spacing="1.4">FRONTERA DE APLICACIÓN</text><rect x="40" y="1366.3" width="820" height="65.0" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.4"/><polygon points="70,1383.82 52,1412.82 88,1412.82" fill="#c2410c"/><text x="70" y="1409.82" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">!</text><text x="106" y="1390.3" font-size="12.5" fill="#7c2d12" font-weight="400" text-anchor="start"><tspan x="106">Una gobernanza pesada frena la operación. El nivel de control debe ser proporcional al riesgo: mayor para</tspan><tspan x="106" dy="16.5">flujos que tratan datos personales o comprometen a la empresa.</tspan></text><text x="40" y="1459.32" font-size="11.5" fill="#87ac39" font-weight="700" letter-spacing="1.4">ERROR FRECUENTE Y SU CORRECCIÓN</text><rect x="40" y="1469.3" width="380.0" height="77.0" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/><text x="54" y="1491.3" font-size="11" fill="#b91c1c" font-weight="700" text-anchor="start"><tspan x="54">Síntoma</tspan></text><text x="54" y="1509.3" font-size="12.5" fill="#7f1d1d" font-weight="400" text-anchor="start"><tspan x="54">Mantener flujos activos sin propósito ni base</tspan><tspan x="54" dy="16.5">documentada</tspan></text><line x1="426.0" y1="1507.8" x2="469.0" y2="1507.8" stroke="#87ac39" stroke-width="2.6" stroke-linecap="round"/><polygon points="474.0,1507.8 465.9,1511.7 465.9,1503.9" fill="#87ac39"/><rect x="480.0" y="1469.3" width="380.0" height="77.0" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.4"/><text x="494.0" y="1491.3" font-size="11" fill="#15803d" font-weight="700" text-anchor="start"><tspan x="494.0">Corrección</tspan></text><text x="494.0" y="1509.3" font-size="12.5" fill="#14532d" font-weight="400" text-anchor="start"><tspan x="494.0">Audita las automatizaciones cada semestre y retira</tspan><tspan x="494.0" dy="16.5">las que no tengan finalidad vigente.</tspan></text></svg>