<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1052" width="900" height="1052" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif"><title id="t">Modelo mental · Medición de marca</title><desc id="d">Modelo mental de la clase 06.13: Medición de marca. Método en 5 pasos; 4 conceptos; 4 señales de medición.</desc><rect x="0" y="0" width="900" height="1052" rx="14" fill="#ffffff"/><rect x="0" y="0" width="900" height="64" rx="14" fill="#57206e"/><rect x="0" y="40" width="900" height="24" fill="#57206e"/><text x="40" y="28" font-size="12" fill="#d9bce5" font-weight="700" letter-spacing="1.6">MODELO MENTAL · CLASE 06.13 · PARTE 06</text><text x="40" y="52" font-size="21" fill="#ffffff" font-weight="700">Medición de marca</text><text x="40" y="84" font-size="11.5" fill="#8939ac" font-weight="700" letter-spacing="1.4">MÉTODO PASO A PASO</text><rect x="40.0" y="100" width="246.7" height="59.0" rx="10" fill="#f1e2f7" stroke="#ba8cce" stroke-width="1.4"/><text x="54.0" y="122" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Definir los indicadores de marca</tspan><tspan x="54.0" dy="16.5">y su método</tspan></text><circle cx="42.0" cy="102.0" r="14" fill="#57206e"/><text x="42.0" y="106.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><rect x="326.7" y="100" width="246.7" height="59.0" rx="10" fill="#f1e2f7" stroke="#ba8cce" stroke-width="1.4"/><text x="340.7" y="122" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="340.7">Establecer la línea base con la</tspan><tspan x="340.7" dy="16.5">primera ola</tspan></text><circle cx="328.7" cy="102.0" r="14" fill="#57206e"/><text x="328.7" y="106.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><rect x="613.3" y="100" width="246.7" height="59.0" rx="10" fill="#f1e2f7" stroke="#ba8cce" stroke-width="1.4"/><text x="627.3" y="122" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="627.3">Mantener método idéntico entre</tspan><tspan x="627.3" dy="16.5">olas</tspan></text><circle cx="615.3" cy="102.0" r="14" fill="#57206e"/><text x="615.3" y="106.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><rect x="613.3" y="197.0" width="246.7" height="59.0" rx="10" fill="#f1e2f7" stroke="#ba8cce" stroke-width="1.4"/><text x="627.3" y="219.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="627.3">Separar efecto de marca y efecto</tspan><tspan x="627.3" dy="16.5">de activación</tspan></text><circle cx="615.3" cy="199.0" r="14" fill="#57206e"/><text x="615.3" y="203.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">4</text><rect x="326.7" y="197.0" width="246.7" height="59.0" rx="10" fill="#f1e2f7" stroke="#ba8cce" stroke-width="1.4"/><text x="340.7" y="219.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="340.7">Vincular la evolución con costo</tspan><tspan x="340.7" dy="16.5">de adquisición y precio</tspan></text><circle cx="328.7" cy="199.0" r="14" fill="#57206e"/><text x="328.7" y="203.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">5</text><line x1="289.7" y1="129.5" x2="318.7" y2="129.5" stroke="#8939ac" stroke-width="2.2" stroke-linecap="round"/><polygon points="323.7,129.5 315.6,133.4 315.6,125.6" fill="#8939ac"/><line x1="576.3" y1="129.5" x2="605.3" y2="129.5" stroke="#8939ac" stroke-width="2.2" stroke-linecap="round"/><polygon points="610.3,129.5 602.2,133.4 602.2,125.6" fill="#8939ac"/><line x1="736.7" y1="161.0" x2="736.7" y2="189.0" stroke="#8939ac" stroke-width="2.2" stroke-linecap="round"/><polygon points="736.7,194.0 732.8,185.9 740.6,185.9" fill="#8939ac"/><line x1="610.3" y1="226.5" x2="581.3" y2="226.5" stroke="#8939ac" stroke-width="2.2" stroke-linecap="round"/><polygon points="576.3,226.5 584.4,222.6 584.4,230.4" fill="#8939ac"/><text x="40" y="294.0" font-size="11.5" fill="#8939ac" font-weight="700" letter-spacing="1.4">CONCEPTOS Y DÓNDE ACTÚAN EN EL MÉTODO</text><rect x="40.0" y="308.0" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#ba8cce" stroke-width="1.4"/><rect x="40.0" y="316.0" width="5" height="62.2" rx="2" fill="#8939ac"/><text x="56.0" y="330.0" font-size="13.5" fill="#57206e" font-weight="700" text-anchor="start"><tspan x="56.0">Notoriedad espontánea</tspan></text><text x="56.0" y="349.8" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Proporción que nombra la marca sin ayuda ante la categoría</tspan><tspan x="56.0" dy="15.2">o la situación</tspan></text><rect x="459.0" y="308.0" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#ba8cce" stroke-width="1.4"/><rect x="459.0" y="316.0" width="5" height="62.2" rx="2" fill="#8939ac"/><text x="475.0" y="330.0" font-size="13.5" fill="#57206e" font-weight="700" text-anchor="start"><tspan x="475.0">Consideración</tspan></text><text x="475.0" y="349.8" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Proporción que incluiría la marca en su conjunto de</tspan><tspan x="475.0" dy="15.2">evaluación</tspan></text><rect x="40.0" y="400.2" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#ba8cce" stroke-width="1.4"/><rect x="40.0" y="408.2" width="5" height="62.2" rx="2" fill="#8939ac"/><text x="56.0" y="422.2" font-size="13.5" fill="#57206e" font-weight="700" text-anchor="start"><tspan x="56.0">Ola de medición</tspan></text><text x="56.0" y="442.0" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Levantamiento periódico con método idéntico que permite</tspan><tspan x="56.0" dy="15.2">comparar en el tiempo</tspan></text><rect x="379.0" y="408.2" width="54" height="20" rx="10" fill="#d9bce5" stroke="#ba8cce" stroke-width="1"/><text x="406.0" y="422.2" font-size="11" fill="#57206e" font-weight="700" text-anchor="middle">↔ 3</text><rect x="459.0" y="400.2" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#ba8cce" stroke-width="1.4"/><rect x="459.0" y="408.2" width="5" height="62.2" rx="2" fill="#8939ac"/><text x="475.0" y="422.2" font-size="13.5" fill="#57206e" font-weight="700" text-anchor="start"><tspan x="475.0">Efecto de largo plazo</tspan></text><text x="475.0" y="442.0" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Resultado que se manifiesta más allá del periodo de la</tspan><tspan x="475.0" dy="15.2">campaña</tspan></text><rect x="798.0" y="408.2" width="54" height="20" rx="10" fill="#d9bce5" stroke="#ba8cce" stroke-width="1"/><text x="825.0" y="422.2" font-size="11" fill="#57206e" font-weight="700" text-anchor="middle">↔ 4</text><text x="40" y="510.36" font-size="11.5" fill="#8939ac" font-weight="700" letter-spacing="1.4">QUÉ SE MIDE: NUMERADOR SOBRE DENOMINADOR</text><rect x="40.0" y="524.4" width="261.3" height="115.9" rx="8" fill="#f1e2f7" stroke="#ba8cce" stroke-width="1.4"/><text x="54.0" y="546.4" font-size="13" fill="#57206e" font-weight="700" text-anchor="start"><tspan x="54.0">Notoriedad espontánea por ola</tspan></text><text x="54.0" y="575.5" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Proporción que nombra la marca sin</tspan><tspan x="54.0" dy="15.2">ayuda, por ola y por segmento</tspan></text><rect x="319.3" y="524.4" width="261.3" height="115.9" rx="8" fill="#f1e2f7" stroke="#ba8cce" stroke-width="1.4"/><text x="333.3" y="546.4" font-size="13" fill="#57206e" font-weight="700" text-anchor="start"><tspan x="333.3">Consideración por ola</tspan></text><text x="333.3" y="575.5" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="333.3">Proporción que incluiría la marca en</tspan><tspan x="333.3" dy="15.2">su evaluación, por ola</tspan></text><rect x="598.7" y="524.4" width="261.3" height="115.9" rx="8" fill="#f1e2f7" stroke="#ba8cce" stroke-width="1.4"/><text x="612.7" y="546.4" font-size="13" fill="#57206e" font-weight="700" text-anchor="start"><tspan x="612.7">Relación marca-costo de</tspan><tspan x="612.7" dy="17.2">adquisición</tspan></text><text x="612.7" y="592.7" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="612.7">Correlación observada entre</tspan><tspan x="612.7" dy="15.2">indicadores de marca y costo por</tspan><tspan x="612.7" dy="15.2">cliente ganado</tspan></text><rect x="40.0" y="654.2" width="261.3" height="135.9" rx="8" fill="#f1e2f7" stroke="#ba8cce" stroke-width="1.4"/><text x="54.0" y="676.2" font-size="13" fill="#57206e" font-weight="700" text-anchor="start"><tspan x="54.0">Atribución del personaje por ola</tspan></text><text x="54.0" y="705.4" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Personas que vinculan correctamente</tspan><tspan x="54.0" dy="15.2">la mascota con la empresa</tspan></text><line x1="54.0" y1="741.7" x2="287.3" y2="741.7" stroke="#8939ac" stroke-width="2"/><text x="54.0" y="759.7" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="54.0">Personas que reconocen el personaje,</tspan><tspan x="54.0" dy="15.2">por segmento y ola</tspan></text><text x="40" y="824.1" font-size="11.5" fill="#8939ac" font-weight="700" letter-spacing="1.4">FRONTERA DE APLICACIÓN</text><rect x="40" y="834.1" width="820" height="65.0" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.4"/><polygon points="70,851.6 52,880.6 88,880.6" fill="#c2410c"/><text x="70" y="877.6" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">!</text><text x="106" y="858.1" font-size="12.5" fill="#7c2d12" font-weight="400" text-anchor="start"><tspan x="106">Las mediciones de marca tienen ruido y costo. En empresas pequeñas conviene una ola semestral acotada</tspan><tspan x="106" dy="16.5">antes que ninguna medición o que un tablero de vanidad.</tspan></text><text x="40" y="927.1" font-size="11.5" fill="#8939ac" font-weight="700" letter-spacing="1.4">ERROR FRECUENTE Y SU CORRECCIÓN</text><rect x="40" y="937.1" width="380.0" height="77.0" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/><text x="54" y="959.1" font-size="11" fill="#b91c1c" font-weight="700" text-anchor="start"><tspan x="54">Síntoma</tspan></text><text x="54" y="977.1" font-size="12.5" fill="#7f1d1d" font-weight="400" text-anchor="start"><tspan x="54">Usar métricas de redes como métricas de marca</tspan></text><line x1="426.0" y1="975.6" x2="469.0" y2="975.6" stroke="#8939ac" stroke-width="2.6" stroke-linecap="round"/><polygon points="474.0,975.6 465.9,979.5 465.9,971.7" fill="#8939ac"/><rect x="480.0" y="937.1" width="380.0" height="77.0" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.4"/><text x="494.0" y="959.1" font-size="11" fill="#15803d" font-weight="700" text-anchor="start"><tspan x="494.0">Corrección</tspan></text><text x="494.0" y="977.1" font-size="12.5" fill="#14532d" font-weight="400" text-anchor="start"><tspan x="494.0">Levanta notoriedad y consideración con método</tspan><tspan x="494.0" dy="16.5">comparable entre olas.</tspan></text></svg>