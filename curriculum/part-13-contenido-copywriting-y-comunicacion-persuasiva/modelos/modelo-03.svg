<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 908" width="900" height="908" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif"><title id="t">Modelo mental · AIDA</title><desc id="d">Modelo mental de la clase 13.03: AIDA. Método en 5 pasos; 4 conceptos; 3 señales de medición.</desc><rect x="0" y="0" width="900" height="908" rx="14" fill="#ffffff"/><rect x="0" y="0" width="900" height="64" rx="14" fill="#2e206e"/><rect x="0" y="40" width="900" height="24" fill="#2e206e"/><text x="40" y="28" font-size="12" fill="#c4bce5" font-weight="700" letter-spacing="1.6">MODELO MENTAL · CLASE 13.03 · PARTE 13</text><text x="40" y="52" font-size="21" fill="#ffffff" font-weight="700">AIDA</text><text x="40" y="84" font-size="11.5" fill="#4e39ac" font-weight="700" letter-spacing="1.4">MÉTODO PASO A PASO</text><rect x="40.0" y="100" width="246.7" height="75.5" rx="10" fill="#e6e2f7" stroke="#988cce" stroke-width="1.4"/><text x="54.0" y="122" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Verificar que el inicio capta</tspan><tspan x="54.0" dy="16.5">atención con algo relevante</tspan></text><circle cx="42.0" cy="102.0" r="14" fill="#2e206e"/><text x="42.0" y="106.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><rect x="326.7" y="100" width="246.7" height="75.5" rx="10" fill="#e6e2f7" stroke="#988cce" stroke-width="1.4"/><text x="340.7" y="122" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="340.7">Conectar con un problema</tspan><tspan x="340.7" dy="16.5">reconocible en las primeras</tspan><tspan x="340.7" dy="16.5">líneas</tspan></text><circle cx="328.7" cy="102.0" r="14" fill="#2e206e"/><text x="328.7" y="106.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><rect x="613.3" y="100" width="246.7" height="75.5" rx="10" fill="#e6e2f7" stroke="#988cce" stroke-width="1.4"/><text x="627.3" y="122" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="627.3">Concretar el beneficio en la</tspan><tspan x="627.3" dy="16.5">situación del lector</tspan></text><circle cx="615.3" cy="102.0" r="14" fill="#2e206e"/><text x="615.3" y="106.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><rect x="613.3" y="213.5" width="246.7" height="59.0" rx="10" fill="#e6e2f7" stroke="#988cce" stroke-width="1.4"/><text x="627.3" y="235.5" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="627.3">Cerrar con una acción específica</tspan><tspan x="627.3" dy="16.5">y de bajo esfuerzo</tspan></text><circle cx="615.3" cy="215.5" r="14" fill="#2e206e"/><text x="615.3" y="220.0" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">4</text><rect x="326.7" y="213.5" width="246.7" height="59.0" rx="10" fill="#e6e2f7" stroke="#988cce" stroke-width="1.4"/><text x="340.7" y="235.5" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="340.7">Probar la pieza con lectores del</tspan><tspan x="340.7" dy="16.5">segmento</tspan></text><circle cx="328.7" cy="215.5" r="14" fill="#2e206e"/><text x="328.7" y="220.0" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">5</text><line x1="289.7" y1="137.8" x2="318.7" y2="137.8" stroke="#4e39ac" stroke-width="2.2" stroke-linecap="round"/><polygon points="323.7,137.8 315.6,141.7 315.6,133.8" fill="#4e39ac"/><line x1="576.3" y1="137.8" x2="605.3" y2="137.8" stroke="#4e39ac" stroke-width="2.2" stroke-linecap="round"/><polygon points="610.3,137.8 602.2,141.7 602.2,133.8" fill="#4e39ac"/><line x1="736.7" y1="177.5" x2="736.7" y2="205.5" stroke="#4e39ac" stroke-width="2.2" stroke-linecap="round"/><polygon points="736.7,210.5 732.8,202.4 740.6,202.4" fill="#4e39ac"/><line x1="610.3" y1="243.0" x2="581.3" y2="243.0" stroke="#4e39ac" stroke-width="2.2" stroke-linecap="round"/><polygon points="576.3,243.0 584.4,239.1 584.4,246.9" fill="#4e39ac"/><text x="40" y="310.5" font-size="11.5" fill="#4e39ac" font-weight="700" letter-spacing="1.4">CONCEPTOS Y DÓNDE ACTÚAN EN EL MÉTODO</text><rect x="40.0" y="324.5" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#988cce" stroke-width="1.4"/><rect x="40.0" y="332.5" width="5" height="62.2" rx="2" fill="#4e39ac"/><text x="56.0" y="346.5" font-size="13.5" fill="#2e206e" font-weight="700" text-anchor="start"><tspan x="56.0">Captura de atención</tspan></text><text x="56.0" y="366.3" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Elemento que detiene el desplazamiento y hace que la</tspan><tspan x="56.0" dy="15.2">persona lea</tspan></text><rect x="379.0" y="332.5" width="54" height="20" rx="10" fill="#c4bce5" stroke="#988cce" stroke-width="1"/><text x="406.0" y="346.5" font-size="11" fill="#2e206e" font-weight="700" text-anchor="middle">↔ 1</text><rect x="459.0" y="324.5" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#988cce" stroke-width="1.4"/><rect x="459.0" y="332.5" width="5" height="62.2" rx="2" fill="#4e39ac"/><text x="475.0" y="346.5" font-size="13.5" fill="#2e206e" font-weight="700" text-anchor="start"><tspan x="475.0">Construcción de interés</tspan></text><text x="475.0" y="366.3" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Conexión entre el contenido y un problema que la persona</tspan><tspan x="475.0" dy="15.2">reconoce</tspan></text><rect x="798.0" y="332.5" width="54" height="20" rx="10" fill="#c4bce5" stroke="#988cce" stroke-width="1"/><text x="825.0" y="346.5" font-size="11" fill="#2e206e" font-weight="700" text-anchor="middle">↔ 2</text><rect x="40.0" y="416.7" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#988cce" stroke-width="1.4"/><rect x="40.0" y="424.7" width="5" height="62.2" rx="2" fill="#4e39ac"/><text x="56.0" y="438.7" font-size="13.5" fill="#2e206e" font-weight="700" text-anchor="start"><tspan x="56.0">Deseo</tspan></text><text x="56.0" y="458.5" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Proyección concreta del beneficio en la situación del</tspan><tspan x="56.0" dy="15.2">lector</tspan></text><rect x="379.0" y="424.7" width="54" height="20" rx="10" fill="#c4bce5" stroke="#988cce" stroke-width="1"/><text x="406.0" y="438.7" font-size="11" fill="#2e206e" font-weight="700" text-anchor="middle">↔ 3</text><rect x="459.0" y="416.7" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#988cce" stroke-width="1.4"/><rect x="459.0" y="424.7" width="5" height="62.2" rx="2" fill="#4e39ac"/><text x="475.0" y="438.7" font-size="13.5" fill="#2e206e" font-weight="700" text-anchor="start"><tspan x="475.0">Acción clara</tspan></text><text x="475.0" y="458.5" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Instrucción específica sobre qué hacer a continuación y</tspan><tspan x="475.0" dy="15.2">con qué esfuerzo</tspan></text><rect x="798.0" y="424.7" width="54" height="20" rx="10" fill="#c4bce5" stroke="#988cce" stroke-width="1"/><text x="825.0" y="438.7" font-size="11" fill="#2e206e" font-weight="700" text-anchor="middle">↔ 4</text><text x="40" y="526.86" font-size="11.5" fill="#4e39ac" font-weight="700" letter-spacing="1.4">QUÉ SE MIDE: NUMERADOR SOBRE DENOMINADOR</text><rect x="40.0" y="540.9" width="261.3" height="105.5" rx="8" fill="#e6e2f7" stroke="#988cce" stroke-width="1.4"/><text x="54.0" y="562.9" font-size="13" fill="#2e206e" font-weight="700" text-anchor="start"><tspan x="54.0">Tasa de lectura completa</tspan></text><text x="54.0" y="592.0" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Lectores que llegan al final</tspan></text><line x1="54.0" y1="613.2" x2="287.3" y2="613.2" stroke="#4e39ac" stroke-width="2"/><text x="54.0" y="631.2" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="54.0">Lectores que iniciaron</tspan></text><rect x="319.3" y="540.9" width="261.3" height="105.5" rx="8" fill="#e6e2f7" stroke="#988cce" stroke-width="1.4"/><text x="333.3" y="562.9" font-size="13" fill="#2e206e" font-weight="700" text-anchor="start"><tspan x="333.3">Tasa de clic en la acción</tspan></text><text x="333.3" y="592.0" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="333.3">Clics en la acción principal</tspan></text><line x1="333.3" y1="613.2" x2="566.7" y2="613.2" stroke="#4e39ac" stroke-width="2"/><text x="333.3" y="631.2" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="333.3">Impresiones de la pieza</tspan></text><rect x="598.7" y="540.9" width="261.3" height="105.5" rx="8" fill="#e6e2f7" stroke="#988cce" stroke-width="1.4"/><text x="612.7" y="562.9" font-size="13" fill="#2e206e" font-weight="700" text-anchor="start"><tspan x="612.7">Comprensión del siguiente paso</tspan></text><text x="612.7" y="592.0" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="612.7">Lectores que identifican</tspan><tspan x="612.7" dy="15.2">correctamente qué se les pide, en</tspan><tspan x="612.7" dy="15.2">prueba con muestra</tspan></text><text x="40" y="680.38" font-size="11.5" fill="#4e39ac" font-weight="700" letter-spacing="1.4">FRONTERA DE APLICACIÓN</text><rect x="40" y="690.4" width="820" height="65.0" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.4"/><polygon points="70,707.88 52,736.88 88,736.88" fill="#c2410c"/><text x="70" y="733.88" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">!</text><text x="106" y="714.4" font-size="12.5" fill="#7c2d12" font-weight="400" text-anchor="start"><tspan x="106">AIDA no distingue persuasión legítima de manipulación. Una pieza puede cumplir el modelo y constituir</tspan><tspan x="106" dy="16.5">publicidad engañosa.</tspan></text><text x="40" y="783.38" font-size="11.5" fill="#4e39ac" font-weight="700" letter-spacing="1.4">ERROR FRECUENTE Y SU CORRECCIÓN</text><rect x="40" y="793.4" width="380.0" height="77.0" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/><text x="54" y="815.4" font-size="11" fill="#b91c1c" font-weight="700" text-anchor="start"><tspan x="54">Síntoma</tspan></text><text x="54" y="833.4" font-size="12.5" fill="#7f1d1d" font-weight="400" text-anchor="start"><tspan x="54">Cerrar sin una acción específica</tspan></text><line x1="426.0" y1="831.9" x2="469.0" y2="831.9" stroke="#4e39ac" stroke-width="2.6" stroke-linecap="round"/><polygon points="474.0,831.9 465.9,835.8 465.9,828.0" fill="#4e39ac"/><rect x="480.0" y="793.4" width="380.0" height="77.0" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.4"/><text x="494.0" y="815.4" font-size="11" fill="#15803d" font-weight="700" text-anchor="start"><tspan x="494.0">Corrección</tspan></text><text x="494.0" y="833.4" font-size="12.5" fill="#14532d" font-weight="400" text-anchor="start"><tspan x="494.0">Sustituye las fórmulas de cortesía por una</tspan><tspan x="494.0" dy="16.5">instrucción concreta y de bajo esfuerzo.</tspan></text></svg>