<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 934" width="900" height="934" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif"><title id="t">Modelo mental · Prospección</title><desc id="d">Modelo mental de la clase 08.02: Prospección. Método en 5 pasos; 4 conceptos; 3 señales de medición.</desc><rect x="0" y="0" width="900" height="934" rx="14" fill="#ffffff"/><rect x="0" y="0" width="900" height="64" rx="14" fill="#6e3520"/><rect x="0" y="40" width="900" height="24" fill="#6e3520"/><text x="40" y="28" font-size="12" fill="#e5c7bc" font-weight="700" letter-spacing="1.6">MODELO MENTAL · CLASE 08.02 · PARTE 08</text><text x="40" y="52" font-size="21" fill="#ffffff" font-weight="700">Prospección</text><text x="40" y="84" font-size="11.5" fill="#ac5739" font-weight="700" letter-spacing="1.4">MÉTODO PASO A PASO</text><line x1="450.0" y1="94.0" x2="450.0" y2="300.5" stroke="#ce9e8c" stroke-width="3" stroke-linecap="round"/><line x1="450.0" y1="129.5" x2="406.0" y2="129.5" stroke="#ce9e8c" stroke-width="2"/><rect x="56.0" y="100" width="350" height="59.0" rx="10" fill="#f7e8e2" stroke="#ce9e8c" stroke-width="1.4"/><text x="70.0" y="122" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="70.0">Construir la lista objetivo desde el perfil de</tspan><tspan x="70.0" dy="16.5">cliente ideal</tspan></text><circle cx="450.0" cy="129.5" r="15" fill="#6e3520"/><text x="450.0" y="134.0" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><line x1="450.0" y1="167.5" x2="494.0" y2="167.5" stroke="#ce9e8c" stroke-width="2"/><rect x="494.0" y="138" width="350" height="59.0" rx="10" fill="#f7e8e2" stroke="#ce9e8c" stroke-width="1.4"/><text x="508.0" y="160" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="508.0">Definir el volumen de actividad semanal</tspan><tspan x="508.0" dy="16.5">necesario</tspan></text><circle cx="450.0" cy="167.5" r="15" fill="#6e3520"/><text x="450.0" y="172.0" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><line x1="450.0" y1="205.5" x2="406.0" y2="205.5" stroke="#ce9e8c" stroke-width="2"/><rect x="56.0" y="176" width="350" height="59.0" rx="10" fill="#f7e8e2" stroke="#ce9e8c" stroke-width="1.4"/><text x="70.0" y="198" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="70.0">Personalizar el mensaje con evidencia del</tspan><tspan x="70.0" dy="16.5">problema</tspan></text><circle cx="450.0" cy="205.5" r="15" fill="#6e3520"/><text x="450.0" y="210.0" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><line x1="450.0" y1="243.5" x2="494.0" y2="243.5" stroke="#ce9e8c" stroke-width="2"/><rect x="494.0" y="214" width="350" height="59.0" rx="10" fill="#f7e8e2" stroke="#ce9e8c" stroke-width="1.4"/><text x="508.0" y="236" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="508.0">Sostener la cadencia aunque el pipeline esté</tspan><tspan x="508.0" dy="16.5">lleno</tspan></text><circle cx="450.0" cy="243.5" r="15" fill="#6e3520"/><text x="450.0" y="248.0" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">4</text><line x1="450.0" y1="273.2" x2="406.0" y2="273.2" stroke="#ce9e8c" stroke-width="2"/><rect x="56.0" y="252" width="350" height="42.5" rx="10" fill="#f7e8e2" stroke="#ce9e8c" stroke-width="1.4"/><text x="70.0" y="274" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="70.0">Medir el retardo real entre actividad y cierre</tspan></text><circle cx="450.0" cy="273.2" r="15" fill="#6e3520"/><text x="450.0" y="277.8" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">5</text><text x="40" y="336.5" font-size="11.5" fill="#ac5739" font-weight="700" letter-spacing="1.4">CONCEPTOS Y DÓNDE ACTÚAN EN EL MÉTODO</text><rect x="40.0" y="350.5" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#ce9e8c" stroke-width="1.4"/><rect x="40.0" y="358.5" width="5" height="62.2" rx="2" fill="#ac5739"/><text x="56.0" y="372.5" font-size="13.5" fill="#6e3520" font-weight="700" text-anchor="start"><tspan x="56.0">Actividad de prospección</tspan></text><text x="56.0" y="392.3" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Número de intentos de contacto de calidad realizados en un</tspan><tspan x="56.0" dy="15.2">periodo</tspan></text><rect x="379.0" y="358.5" width="54" height="20" rx="10" fill="#e5c7bc" stroke="#ce9e8c" stroke-width="1"/><text x="406.0" y="372.5" font-size="11" fill="#6e3520" font-weight="700" text-anchor="middle">↔ 2, 5</text><rect x="459.0" y="350.5" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#ce9e8c" stroke-width="1.4"/><rect x="459.0" y="358.5" width="5" height="62.2" rx="2" fill="#ac5739"/><text x="475.0" y="372.5" font-size="13.5" fill="#6e3520" font-weight="700" text-anchor="start"><tspan x="475.0">Lista objetivo</tspan></text><text x="475.0" y="392.3" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Conjunto acotado de organizaciones que cumplen el perfil</tspan><tspan x="475.0" dy="15.2">de cliente ideal</tspan></text><rect x="798.0" y="358.5" width="54" height="20" rx="10" fill="#e5c7bc" stroke="#ce9e8c" stroke-width="1"/><text x="825.0" y="372.5" font-size="11" fill="#6e3520" font-weight="700" text-anchor="middle">↔ 1</text><rect x="40.0" y="442.7" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#ce9e8c" stroke-width="1.4"/><rect x="40.0" y="450.7" width="5" height="62.2" rx="2" fill="#ac5739"/><text x="56.0" y="464.7" font-size="13.5" fill="#6e3520" font-weight="700" text-anchor="start"><tspan x="56.0">Retardo del pipeline</tspan></text><text x="56.0" y="484.5" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Desfase entre la actividad de prospección y su efecto en</tspan><tspan x="56.0" dy="15.2">oportunidades cerradas</tspan></text><rect x="379.0" y="450.7" width="54" height="20" rx="10" fill="#e5c7bc" stroke="#ce9e8c" stroke-width="1"/><text x="406.0" y="464.7" font-size="11" fill="#6e3520" font-weight="700" text-anchor="middle">↔ 4, 5</text><rect x="459.0" y="442.7" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#ce9e8c" stroke-width="1.4"/><rect x="459.0" y="450.7" width="5" height="62.2" rx="2" fill="#ac5739"/><text x="475.0" y="464.7" font-size="13.5" fill="#6e3520" font-weight="700" text-anchor="start"><tspan x="475.0">Relevancia del mensaje</tspan></text><text x="475.0" y="484.5" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Grado en que el contacto demuestra conocimiento del</tspan><tspan x="475.0" dy="15.2">problema específico del destinatario</tspan></text><rect x="798.0" y="450.7" width="54" height="20" rx="10" fill="#e5c7bc" stroke="#ce9e8c" stroke-width="1"/><text x="825.0" y="464.7" font-size="11" fill="#6e3520" font-weight="700" text-anchor="middle">↔ 3</text><text x="40" y="552.86" font-size="11.5" fill="#ac5739" font-weight="700" letter-spacing="1.4">QUÉ SE MIDE: NUMERADOR SOBRE DENOMINADOR</text><rect x="40.0" y="566.9" width="261.3" height="105.5" rx="8" fill="#f7e8e2" stroke="#ce9e8c" stroke-width="1.4"/><text x="54.0" y="588.9" font-size="13" fill="#6e3520" font-weight="700" text-anchor="start"><tspan x="54.0">Intentos de contacto por semana</tspan></text><text x="54.0" y="618.0" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Contactos de calidad realizados, por</tspan><tspan x="54.0" dy="15.2">vendedor y por semana</tspan></text><rect x="319.3" y="566.9" width="261.3" height="105.5" rx="8" fill="#f7e8e2" stroke="#ce9e8c" stroke-width="1.4"/><text x="333.3" y="588.9" font-size="13" fill="#6e3520" font-weight="700" text-anchor="start"><tspan x="333.3">Tasa de conversación obtenida</tspan></text><text x="333.3" y="618.0" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="333.3">Conversaciones sostenidas</tspan></text><line x1="333.3" y1="639.2" x2="566.7" y2="639.2" stroke="#ac5739" stroke-width="2"/><text x="333.3" y="657.2" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="333.3">Intentos de contacto realizados</tspan></text><rect x="598.7" y="566.9" width="261.3" height="105.5" rx="8" fill="#f7e8e2" stroke="#ce9e8c" stroke-width="1.4"/><text x="612.7" y="588.9" font-size="13" fill="#6e3520" font-weight="700" text-anchor="start"><tspan x="612.7">Retardo observado</tspan></text><text x="612.7" y="618.0" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="612.7">Días entre el primer contacto y el</tspan><tspan x="612.7" dy="15.2">cierre, mediana por segmento</tspan></text><text x="40" y="706.38" font-size="11.5" fill="#ac5739" font-weight="700" letter-spacing="1.4">FRONTERA DE APLICACIÓN</text><rect x="40" y="716.4" width="820" height="65.0" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.4"/><polygon points="70,733.88 52,762.88 88,762.88" fill="#c2410c"/><text x="70" y="759.88" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">!</text><text x="106" y="740.4" font-size="12.5" fill="#7c2d12" font-weight="400" text-anchor="start"><tspan x="106">Volumen sin calidad de lista produce ruido y daña la reputación del dominio. La disciplina de actividad</tspan><tspan x="106" dy="16.5">supone que la lista ya fue filtrada por perfil.</tspan></text><text x="40" y="809.38" font-size="11.5" fill="#ac5739" font-weight="700" letter-spacing="1.4">ERROR FRECUENTE Y SU CORRECCIÓN</text><rect x="40" y="819.4" width="380.0" height="77.0" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/><text x="54" y="841.4" font-size="11" fill="#b91c1c" font-weight="700" text-anchor="start"><tspan x="54">Síntoma</tspan></text><text x="54" y="859.4" font-size="12.5" fill="#7f1d1d" font-weight="400" text-anchor="start"><tspan x="54">Prospectar sólo cuando falta pipeline</tspan></text><line x1="426.0" y1="857.9" x2="469.0" y2="857.9" stroke="#ac5739" stroke-width="2.6" stroke-linecap="round"/><polygon points="474.0,857.9 465.9,861.8 465.9,854.0" fill="#ac5739"/><rect x="480.0" y="819.4" width="380.0" height="77.0" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.4"/><text x="494.0" y="841.4" font-size="11" fill="#15803d" font-weight="700" text-anchor="start"><tspan x="494.0">Corrección</tspan></text><text x="494.0" y="859.4" font-size="12.5" fill="#14532d" font-weight="400" text-anchor="start"><tspan x="494.0">Fija una cadencia semanal mínima e inamovible,</tspan><tspan x="494.0" dy="16.5">calculada desde el retardo observado.</tspan></text></svg>