<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1318" width="900" height="1318" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif"><title id="t">Modelo mental · Fraude, brand safety y privacidad</title><desc id="d">Modelo mental de la clase 14.13: Fraude, brand safety y privacidad. Método en 5 pasos; 5 conceptos; 3 señales de medición.</desc><rect x="0" y="0" width="900" height="1318" rx="14" fill="#ffffff"/><rect x="0" y="0" width="900" height="64" rx="14" fill="#6c206e"/><rect x="0" y="40" width="900" height="24" fill="#6c206e"/><text x="40" y="28" font-size="12" fill="#e4bce5" font-weight="700" letter-spacing="1.6">MODELO MENTAL · CLASE 14.13 · PARTE 14</text><text x="40" y="52" font-size="21" fill="#ffffff" font-weight="700">Fraude, brand safety y privacidad</text><text x="40" y="84" font-size="11.5" fill="#a839ac" font-weight="700" letter-spacing="1.4">MÉTODO PASO A PASO</text><path d="M66.0,175.5 V227.2 H158.5" fill="none" stroke="#a839ac" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="160.5,227.2 151.5,222.2 151.5,232.2" fill="#a839ac"/><path d="M188.5,265.0 V316.8 H281.0" fill="none" stroke="#a839ac" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="283.0,316.8 274.0,311.8 274.0,321.8" fill="#a839ac"/><path d="M311.0,354.5 V406.2 H403.5" fill="none" stroke="#a839ac" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="405.5,406.2 396.5,401.2 396.5,411.2" fill="#a839ac"/><path d="M433.5,444.0 V495.8 H526.0" fill="none" stroke="#a839ac" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="528.0,495.8 519.0,490.8 519.0,500.8" fill="#a839ac"/><rect x="40.0" y="100.0" width="330" height="75.5" rx="10" fill="#f7e2f7" stroke="#cb8cce" stroke-width="1.4"/><text x="54.0" y="122.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Revisar los informes de calidad de tráfico</tspan></text><circle cx="42.0" cy="102.0" r="14" fill="#6c206e"/><text x="42.0" y="106.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><rect x="162.5" y="189.5" width="330" height="75.5" rx="10" fill="#f7e2f7" stroke="#cb8cce" stroke-width="1.4"/><text x="176.5" y="211.5" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="176.5">Definir listas de exclusión de sitios y</tspan><tspan x="176.5" dy="16.5">categorías</tspan></text><circle cx="164.5" cy="191.5" r="14" fill="#6c206e"/><text x="164.5" y="196.0" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><rect x="285.0" y="279.0" width="330" height="75.5" rx="10" fill="#f7e2f7" stroke="#cb8cce" stroke-width="1.4"/><text x="299.0" y="301.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="299.0">Verificar el mecanismo de consentimiento del</tspan><tspan x="299.0" dy="16.5">sitio propio</tspan></text><circle cx="287.0" cy="281.0" r="14" fill="#6c206e"/><text x="287.0" y="285.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><rect x="407.5" y="368.5" width="330" height="75.5" rx="10" fill="#f7e2f7" stroke="#cb8cce" stroke-width="1.4"/><text x="421.5" y="390.5" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="421.5">Auditar el tratamiento de datos y las</tspan><tspan x="421.5" dy="16.5">afirmaciones de seguridad, disponibilidad o</tspan><tspan x="421.5" dy="16.5">retorno</tspan></text><circle cx="409.5" cy="370.5" r="14" fill="#6c206e"/><text x="409.5" y="375.0" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">4</text><rect x="530.0" y="458.0" width="330" height="75.5" rx="10" fill="#f7e2f7" stroke="#cb8cce" stroke-width="1.4"/><text x="544.0" y="480.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="544.0">Retirar la pieza sin respaldo y documentar</tspan><tspan x="544.0" dy="16.5">controles, responsables y próxima revisión</tspan></text><circle cx="532.0" cy="460.0" r="14" fill="#6c206e"/><text x="532.0" y="464.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">5</text><text x="40" y="575.5" font-size="11.5" fill="#a839ac" font-weight="700" letter-spacing="1.4">CONCEPTOS Y DÓNDE ACTÚAN EN EL MÉTODO</text><rect x="40.0" y="589.5" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#cb8cce" stroke-width="1.4"/><rect x="40.0" y="597.5" width="5" height="62.2" rx="2" fill="#a839ac"/><text x="56.0" y="611.5" font-size="13.5" fill="#6c206e" font-weight="700" text-anchor="start"><tspan x="56.0">Tráfico no válido</tspan></text><text x="56.0" y="631.3" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Interacciones generadas por sistemas automatizados que no</tspan><tspan x="56.0" dy="15.2">corresponden a personas</tspan></text><rect x="379.0" y="597.5" width="54" height="20" rx="10" fill="#e4bce5" stroke="#cb8cce" stroke-width="1"/><text x="406.0" y="611.5" font-size="11" fill="#6c206e" font-weight="700" text-anchor="middle">↔ 1</text><rect x="459.0" y="589.5" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#cb8cce" stroke-width="1.4"/><rect x="459.0" y="597.5" width="5" height="62.2" rx="2" fill="#a839ac"/><text x="475.0" y="611.5" font-size="13.5" fill="#6c206e" font-weight="700" text-anchor="start"><tspan x="475.0">Seguridad de marca</tspan></text><text x="475.0" y="631.3" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Control sobre el entorno donde aparece el anuncio</tspan></text><rect x="798.0" y="597.5" width="54" height="20" rx="10" fill="#e4bce5" stroke="#cb8cce" stroke-width="1"/><text x="825.0" y="611.5" font-size="11" fill="#6c206e" font-weight="700" text-anchor="middle">↔ 4</text><rect x="40.0" y="681.7" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#cb8cce" stroke-width="1.4"/><rect x="40.0" y="689.7" width="5" height="62.2" rx="2" fill="#a839ac"/><text x="56.0" y="703.7" font-size="13.5" fill="#6c206e" font-weight="700" text-anchor="start"><tspan x="56.0">Consentimiento de cookies</tspan></text><text x="56.0" y="723.5" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Autorización informada para el uso de identificadores de</tspan><tspan x="56.0" dy="15.2">seguimiento</tspan></text><rect x="379.0" y="689.7" width="54" height="20" rx="10" fill="#e4bce5" stroke="#cb8cce" stroke-width="1"/><text x="406.0" y="703.7" font-size="11" fill="#6c206e" font-weight="700" text-anchor="middle">↔ 3</text><rect x="459.0" y="681.7" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#cb8cce" stroke-width="1.4"/><rect x="459.0" y="689.7" width="5" height="62.2" rx="2" fill="#a839ac"/><text x="475.0" y="703.7" font-size="13.5" fill="#6c206e" font-weight="700" text-anchor="start"><tspan x="475.0">Control previo</tspan></text><text x="475.0" y="723.5" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Medida establecida antes de la exposición que reduce el</tspan><tspan x="475.0" dy="15.2">riesgo</tspan></text><rect x="798.0" y="689.7" width="54" height="20" rx="10" fill="#e4bce5" stroke="#cb8cce" stroke-width="1"/><text x="825.0" y="703.7" font-size="11" fill="#6c206e" font-weight="700" text-anchor="middle">↔ 5</text><rect x="40.0" y="773.9" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#cb8cce" stroke-width="1.4"/><rect x="40.0" y="781.9" width="5" height="62.2" rx="2" fill="#a839ac"/><text x="56.0" y="795.9" font-size="13.5" fill="#6c206e" font-weight="700" text-anchor="start"><tspan x="56.0">Expediente de afirmación</tspan></text><text x="56.0" y="815.7" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Evidencia, alcance, limitación, responsable y decisión</tspan><tspan x="56.0" dy="15.2">asociados a una promesa publicitaria</tspan></text><rect x="379.0" y="781.9" width="54" height="20" rx="10" fill="#e4bce5" stroke="#cb8cce" stroke-width="1"/><text x="406.0" y="795.9" font-size="11" fill="#6c206e" font-weight="700" text-anchor="middle">↔ 4</text><text x="40" y="884.0400000000002" font-size="11.5" fill="#a839ac" font-weight="700" letter-spacing="1.4">QUÉ SE MIDE: NUMERADOR SOBRE DENOMINADOR</text><rect x="40.0" y="898.0" width="261.3" height="158.4" rx="8" fill="#f7e2f7" stroke="#cb8cce" stroke-width="1.4"/><text x="54.0" y="920.0" font-size="13" fill="#6c206e" font-weight="700" text-anchor="start"><tspan x="54.0">Proporción de tráfico no válido</tspan></text><text x="54.0" y="949.2" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Interacciones marcadas como</tspan><tspan x="54.0" dy="15.2">inválidas</tspan></text><line x1="54.0" y1="985.6" x2="287.3" y2="985.6" stroke="#a839ac" stroke-width="2"/><text x="54.0" y="1003.6" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="54.0">Interacciones totales</tspan></text><text x="54.0" y="1032.7" font-size="10.5" fill="#7b8794" font-weight="400" text-anchor="start"><tspan x="54.0">Ventana: mes</tspan></text><rect x="319.3" y="898.0" width="261.3" height="158.4" rx="8" fill="#f7e2f7" stroke="#cb8cce" stroke-width="1.4"/><text x="333.3" y="920.0" font-size="13" fill="#6c206e" font-weight="700" text-anchor="start"><tspan x="333.3">Apariciones en contexto no</tspan><tspan x="333.3" dy="17.2">deseado</tspan></text><text x="333.3" y="966.4" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="333.3">Impresiones en sitios excluidos</tspan></text><line x1="333.3" y1="987.5" x2="566.7" y2="987.5" stroke="#a839ac" stroke-width="2"/><text x="333.3" y="1005.5" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="333.3">Impresiones totales</tspan></text><text x="333.3" y="1034.7" font-size="10.5" fill="#7b8794" font-weight="400" text-anchor="start"><tspan x="333.3">Ventana: semana</tspan></text><rect x="598.7" y="898.0" width="261.3" height="158.4" rx="8" fill="#f7e2f7" stroke="#cb8cce" stroke-width="1.4"/><text x="612.7" y="920.0" font-size="13" fill="#6c206e" font-weight="700" text-anchor="start"><tspan x="612.7">Afirmaciones publicitarias</tspan><tspan x="612.7" dy="17.2">respaldadas</tspan></text><text x="612.7" y="966.4" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="612.7">Afirmaciones con expediente aprobado</tspan></text><line x1="612.7" y1="987.5" x2="846.0" y2="987.5" stroke="#a839ac" stroke-width="2"/><text x="612.7" y="1005.5" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="612.7">Afirmaciones activas</tspan></text><text x="612.7" y="1034.7" font-size="10.5" fill="#7b8794" font-weight="400" text-anchor="start"><tspan x="612.7">Ventana: cada publicación y revisión</tspan><tspan x="612.7" dy="13.9">trimestral</tspan></text><text x="40" y="1090.4400000000003" font-size="11.5" fill="#a839ac" font-weight="700" letter-spacing="1.4">FRONTERA DE APLICACIÓN</text><rect x="40" y="1100.4" width="820" height="65.0" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.4"/><polygon points="70,1117.9400000000003 52,1146.9400000000003 88,1146.9400000000003" fill="#c2410c"/><text x="70" y="1143.9400000000003" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">!</text><text x="106" y="1124.4" font-size="12.5" fill="#7c2d12" font-weight="400" text-anchor="start"><tspan x="106">Los controles reducen el riesgo pero también el alcance disponible y pueden subir el costo. La decisión</tspan><tspan x="106" dy="16.5">debe ser explícita y no un efecto colateral.</tspan></text><text x="40" y="1193.4400000000003" font-size="11.5" fill="#a839ac" font-weight="700" letter-spacing="1.4">ERROR FRECUENTE Y SU CORRECCIÓN</text><rect x="40" y="1203.4" width="380.0" height="77.0" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/><text x="54" y="1225.4" font-size="11" fill="#b91c1c" font-weight="700" text-anchor="start"><tspan x="54">Síntoma</tspan></text><text x="54" y="1243.4" font-size="12.5" fill="#7f1d1d" font-weight="400" text-anchor="start"><tspan x="54">Operar sin listas de exclusión ni revisión de</tspan><tspan x="54" dy="16.5">tráfico</tspan></text><line x1="426.0" y1="1241.9" x2="469.0" y2="1241.9" stroke="#a839ac" stroke-width="2.6" stroke-linecap="round"/><polygon points="474.0,1241.9 465.9,1245.9 465.9,1238.0" fill="#a839ac"/><rect x="480.0" y="1203.4" width="380.0" height="77.0" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.4"/><text x="494.0" y="1225.4" font-size="11" fill="#15803d" font-weight="700" text-anchor="start"><tspan x="494.0">Corrección</tspan></text><text x="494.0" y="1243.4" font-size="12.5" fill="#14532d" font-weight="400" text-anchor="start"><tspan x="494.0">Define exclusiones y revisa mensualmente los</tspan><tspan x="494.0" dy="16.5">informes de calidad de tráfico.</tspan></text></svg>