<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1086" width="900" height="1086" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif"><title id="t">Modelo mental · Empleados, influencers, comunidades e IA responsable</title><desc id="d">Modelo mental de la clase ESP.10: Empleados, influencers, comunidades e IA responsable. Método en 7 pasos; 7 conceptos; 0 señales de medición.</desc><rect x="0" y="0" width="900" height="1086" rx="14" fill="#ffffff"/><rect x="0" y="0" width="900" height="64" rx="14" fill="#406e20"/><rect x="0" y="40" width="900" height="24" fill="#406e20"/><text x="40" y="28" font-size="12" fill="#cde5bc" font-weight="700" letter-spacing="1.6">MODELO MENTAL · CLASE ESP.10 · ESPECIALIZACIÓN</text><text x="40" y="52" font-size="21" fill="#ffffff" font-weight="700">Empleados, influencers, comunidades e IA responsable</text><text x="40" y="84" font-size="11.5" fill="#69ac39" font-weight="700" letter-spacing="1.4">MÉTODO PASO A PASO</text><line x1="450.0" y1="94.0" x2="450.0" y2="420.0" stroke="#a7ce8c" stroke-width="3" stroke-linecap="round"/><line x1="450.0" y1="130.0" x2="406.0" y2="130.0" stroke="#a7ce8c" stroke-width="2"/><rect x="56.0" y="100" width="350" height="75.5" rx="10" fill="#ebf7e2" stroke="#a7ce8c" stroke-width="1.4"/><text x="70.0" y="122" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="70.0">Redactar la política de redes con tres capas y</tspan><tspan x="70.0" dy="16.5">ejemplos de conductas permitidas y no</tspan><tspan x="70.0" dy="16.5">permitidas</tspan></text><circle cx="450.0" cy="130.0" r="15" fill="#406e20"/><text x="450.0" y="134.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><line x1="450.0" y1="168.0" x2="494.0" y2="168.0" stroke="#a7ce8c" stroke-width="2"/><rect x="494.0" y="138" width="350" height="75.5" rx="10" fill="#ebf7e2" stroke="#a7ce8c" stroke-width="1.4"/><text x="508.0" y="160" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="508.0">Definir procedimiento de controversias de</tspan><tspan x="508.0" dy="16.5">empleados con verificación, escucha y</tspan><tspan x="508.0" dy="16.5">proporcionalidad</tspan></text><circle cx="450.0" cy="168.0" r="15" fill="#406e20"/><text x="450.0" y="172.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><line x1="450.0" y1="219.5" x2="406.0" y2="219.5" stroke="#a7ce8c" stroke-width="2"/><rect x="56.0" y="189.5" width="350" height="75.5" rx="10" fill="#ebf7e2" stroke="#a7ce8c" stroke-width="1.4"/><text x="70.0" y="211.5" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="70.0">Establecer el acuerdo con influencers:</tspan><tspan x="70.0" dy="16.5">divulgación, conducta, respaldo de afirmaciones</tspan><tspan x="70.0" dy="16.5">y salida</tspan></text><circle cx="450.0" cy="219.5" r="15" fill="#406e20"/><text x="450.0" y="224.0" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><line x1="450.0" y1="257.0" x2="494.0" y2="257.0" stroke="#a7ce8c" stroke-width="2"/><rect x="494.0" y="227.5" width="350" height="59.0" rx="10" fill="#ebf7e2" stroke="#a7ce8c" stroke-width="1.4"/><text x="508.0" y="249.5" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="508.0">Publicar las reglas de la comunidad y el</tspan><tspan x="508.0" dy="16.5">protocolo de moderación y escalamiento</tspan></text><circle cx="450.0" cy="257.0" r="15" fill="#406e20"/><text x="450.0" y="261.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">4</text><line x1="450.0" y1="308.5" x2="406.0" y2="308.5" stroke="#a7ce8c" stroke-width="2"/><rect x="56.0" y="279.0" width="350" height="59.0" rx="10" fill="#ebf7e2" stroke="#a7ce8c" stroke-width="1.4"/><text x="70.0" y="301.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="70.0">Definir el protocolo de respuesta en crisis por</tspan><tspan x="70.0" dy="16.5">plataforma, con comunicado único</tspan></text><circle cx="450.0" cy="308.5" r="15" fill="#406e20"/><text x="450.0" y="313.0" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">5</text><line x1="450.0" y1="346.5" x2="494.0" y2="346.5" stroke="#a7ce8c" stroke-width="2"/><rect x="494.0" y="317.0" width="350" height="59.0" rx="10" fill="#ebf7e2" stroke="#a7ce8c" stroke-width="1.4"/><text x="508.0" y="339.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="508.0">Crear el registro de uso de IA y las reglas de</tspan><tspan x="508.0" dy="16.5">verificación y divulgación</tspan></text><circle cx="450.0" cy="346.5" r="15" fill="#406e20"/><text x="450.0" y="351.0" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">6</text><line x1="450.0" y1="384.5" x2="406.0" y2="384.5" stroke="#a7ce8c" stroke-width="2"/><rect x="56.0" y="355.0" width="350" height="59.0" rx="10" fill="#ebf7e2" stroke="#a7ce8c" stroke-width="1.4"/><text x="70.0" y="377.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="70.0">Capacitar, probar con una simulación y revisar</tspan><tspan x="70.0" dy="16.5">a los seis meses</tspan></text><circle cx="450.0" cy="384.5" r="15" fill="#406e20"/><text x="450.0" y="389.0" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">7</text><text x="40" y="456.0" font-size="11.5" fill="#69ac39" font-weight="700" letter-spacing="1.4">CONCEPTOS Y DÓNDE ACTÚAN EN EL MÉTODO</text><rect x="40.0" y="470.0" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#a7ce8c" stroke-width="1.4"/><rect x="40.0" y="478.0" width="5" height="62.2" rx="2" fill="#69ac39"/><text x="56.0" y="492.0" font-size="13.5" fill="#406e20" font-weight="700" text-anchor="start"><tspan x="56.0">Política de redes</tspan></text><text x="56.0" y="511.8" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Reglas escritas sobre qué pueden decir personas de la</tspan><tspan x="56.0" dy="15.2">organización a título personal, profesional y corporativo</tspan></text><rect x="379.0" y="478.0" width="54" height="20" rx="10" fill="#cde5bc" stroke="#a7ce8c" stroke-width="1"/><text x="406.0" y="492.0" font-size="11" fill="#406e20" font-weight="700" text-anchor="middle">↔ 1</text><rect x="459.0" y="470.0" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#a7ce8c" stroke-width="1.4"/><rect x="459.0" y="478.0" width="5" height="62.2" rx="2" fill="#69ac39"/><text x="475.0" y="492.0" font-size="13.5" fill="#406e20" font-weight="700" text-anchor="start"><tspan x="475.0">Embajador de marca</tspan></text><text x="475.0" y="511.8" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Persona vinculada a la organización que la representa</tspan><tspan x="475.0" dy="15.2">públicamente de forma voluntaria o contratada</tspan></text><rect x="40.0" y="562.2" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#a7ce8c" stroke-width="1.4"/><rect x="40.0" y="570.2" width="5" height="62.2" rx="2" fill="#69ac39"/><text x="56.0" y="584.2" font-size="13.5" fill="#406e20" font-weight="700" text-anchor="start"><tspan x="56.0">Divulgación de vínculo comercial</tspan></text><text x="56.0" y="604.0" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Aviso claro de que existe un acuerdo o beneficio entre</tspan><tspan x="56.0" dy="15.2">quien comunica y la organización</tspan></text><rect x="379.0" y="570.2" width="54" height="20" rx="10" fill="#cde5bc" stroke="#a7ce8c" stroke-width="1"/><text x="406.0" y="584.2" font-size="11" fill="#406e20" font-weight="700" text-anchor="middle">↔ 3, 6</text><rect x="459.0" y="562.2" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#a7ce8c" stroke-width="1.4"/><rect x="459.0" y="570.2" width="5" height="62.2" rx="2" fill="#69ac39"/><text x="475.0" y="584.2" font-size="13.5" fill="#406e20" font-weight="700" text-anchor="start"><tspan x="475.0">Cláusula de conducta</tspan></text><text x="475.0" y="604.0" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Condición contractual que define comportamientos esperados</tspan><tspan x="475.0" dy="15.2">y consecuencias para colaboradores externos</tspan></text><rect x="798.0" y="570.2" width="54" height="20" rx="10" fill="#cde5bc" stroke="#a7ce8c" stroke-width="1"/><text x="825.0" y="584.2" font-size="11" fill="#406e20" font-weight="700" text-anchor="middle">↔ 1, 2, 3</text><rect x="40.0" y="654.4" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#a7ce8c" stroke-width="1.4"/><rect x="40.0" y="662.4" width="5" height="62.2" rx="2" fill="#69ac39"/><text x="56.0" y="676.4" font-size="13.5" fill="#406e20" font-weight="700" text-anchor="start"><tspan x="56.0">Moderación de comunidad</tspan></text><text x="56.0" y="696.2" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Aplicación pareja de reglas publicadas de conversación</tspan></text><rect x="379.0" y="662.4" width="54" height="20" rx="10" fill="#cde5bc" stroke="#a7ce8c" stroke-width="1"/><text x="406.0" y="676.4" font-size="11" fill="#406e20" font-weight="700" text-anchor="middle">↔ 4, 5</text><rect x="459.0" y="654.4" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#a7ce8c" stroke-width="1.4"/><rect x="459.0" y="662.4" width="5" height="62.2" rx="2" fill="#69ac39"/><text x="475.0" y="676.4" font-size="13.5" fill="#406e20" font-weight="700" text-anchor="start"><tspan x="475.0">Procedimiento justo</tspan></text><text x="475.0" y="696.2" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Secuencia que garantiza ser oído, evidencia,</tspan><tspan x="475.0" dy="15.2">proporcionalidad y decisión motivada</tspan></text><rect x="798.0" y="662.4" width="54" height="20" rx="10" fill="#cde5bc" stroke="#a7ce8c" stroke-width="1"/><text x="825.0" y="676.4" font-size="11" fill="#406e20" 