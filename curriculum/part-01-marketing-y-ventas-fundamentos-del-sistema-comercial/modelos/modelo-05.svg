<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 982" width="900" height="982" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif"><title id="t">Modelo mental · Funnel, flywheel y ciclo de compra</title><desc id="d">Modelo mental de la clase 01.05: Funnel, flywheel y ciclo de compra. Método en 5 pasos; 4 conceptos; 3 señales de medición.</desc><rect x="0" y="0" width="900" height="982" rx="14" fill="#ffffff"/><rect x="0" y="0" width="900" height="64" rx="14" fill="#6e5d20"/><rect x="0" y="40" width="900" height="24" fill="#6e5d20"/><text x="40" y="28" font-size="12" fill="#e5dcbc" font-weight="700" letter-spacing="1.6">MODELO MENTAL · CLASE 01.05 · PARTE 01</text><text x="40" y="52" font-size="21" fill="#ffffff" font-weight="700">Funnel, flywheel y ciclo de compra</text><text x="40" y="84" font-size="11.5" fill="#ac9339" font-weight="700" letter-spacing="1.4">MÉTODO PASO A PASO</text><line x1="450.0" y1="94.0" x2="450.0" y2="317.0" stroke="#cebf8c" stroke-width="3" stroke-linecap="round"/><line x1="450.0" y1="129.5" x2="406.0" y2="129.5" stroke="#cebf8c" stroke-width="2"/><rect x="56.0" y="100" width="350" height="59.0" rx="10" fill="#f7f3e2" stroke="#cebf8c" stroke-width="1.4"/><text x="70.0" y="122" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="70.0">Reconstruir el ciclo de compra desde el</tspan><tspan x="70.0" dy="16.5">disparador y no desde el primer clic</tspan></text><circle cx="450.0" cy="129.5" r="15" fill="#6e5d20"/><text x="450.0" y="134.0" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><line x1="450.0" y1="167.5" x2="494.0" y2="167.5" stroke="#cebf8c" stroke-width="2"/><rect x="494.0" y="138" width="350" height="59.0" rx="10" fill="#f7f3e2" stroke="#cebf8c" stroke-width="1.4"/><text x="508.0" y="160" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="508.0">Mapear las etapas internas que responden a ese</tspan><tspan x="508.0" dy="16.5">ciclo</tspan></text><circle cx="450.0" cy="167.5" r="15" fill="#6e5d20"/><text x="450.0" y="172.0" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><line x1="450.0" y1="197.2" x2="406.0" y2="197.2" stroke="#cebf8c" stroke-width="2"/><rect x="56.0" y="176" width="350" height="42.5" rx="10" fill="#f7f3e2" stroke="#cebf8c" stroke-width="1.4"/><text x="70.0" y="198" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="70.0">Medir volumen, conversión y tiempo por etapa</tspan></text><circle cx="450.0" cy="197.2" r="15" fill="#6e5d20"/><text x="450.0" y="201.8" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><line x1="450.0" y1="243.5" x2="494.0" y2="243.5" stroke="#cebf8c" stroke-width="2"/><rect x="494.0" y="214" width="350" height="59.0" rx="10" fill="#f7f3e2" stroke="#cebf8c" stroke-width="1.4"/><text x="508.0" y="236" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="508.0">Identificar la fricción dominante en la etapa</tspan><tspan x="508.0" dy="16.5">limitante</tspan></text><circle cx="450.0" cy="243.5" r="15" fill="#6e5d20"/><text x="450.0" y="248.0" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">4</text><line x1="450.0" y1="281.5" x2="406.0" y2="281.5" stroke="#cebf8c" stroke-width="2"/><rect x="56.0" y="252" width="350" height="59.0" rx="10" fill="#f7f3e2" stroke="#cebf8c" stroke-width="1.4"/><text x="70.0" y="274" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="70.0">Decidir si conviene remover fricción o aumentar</tspan><tspan x="70.0" dy="16.5">impulso</tspan></text><circle cx="450.0" cy="281.5" r="15" fill="#6e5d20"/><text x="450.0" y="286.0" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">5</text><text x="40" y="353.0" font-size="11.5" fill="#ac9339" font-weight="700" letter-spacing="1.4">CONCEPTOS Y DÓNDE ACTÚAN EN EL MÉTODO</text><rect x="40.0" y="367.0" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#cebf8c" stroke-width="1.4"/><rect x="40.0" y="375.0" width="5" height="62.2" rx="2" fill="#ac9339"/><text x="56.0" y="389.0" font-size="13.5" fill="#6e5d20" font-weight="700" text-anchor="start"><tspan x="56.0">Embudo</tspan></text><text x="56.0" y="408.8" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Representación de etapas internas con volúmenes y tasas de</tspan><tspan x="56.0" dy="15.2">paso entre ellas</tspan></text><rect x="379.0" y="375.0" width="54" height="20" rx="10" fill="#e5dcbc" stroke="#cebf8c" stroke-width="1"/><text x="406.0" y="389.0" font-size="11" fill="#6e5d20" font-weight="700" text-anchor="middle">↔ 2, 3</text><rect x="459.0" y="367.0" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#cebf8c" stroke-width="1.4"/><rect x="459.0" y="375.0" width="5" height="62.2" rx="2" fill="#ac9339"/><text x="475.0" y="389.0" font-size="13.5" fill="#6e5d20" font-weight="700" text-anchor="start"><tspan x="475.0">Flywheel</tspan></text><text x="475.0" y="408.8" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Modelo donde el resultado de los clientes actuales</tspan><tspan x="475.0" dy="15.2">alimenta la adquisición de los siguientes</tspan></text><rect x="40.0" y="459.2" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#cebf8c" stroke-width="1.4"/><rect x="40.0" y="467.2" width="5" height="62.2" rx="2" fill="#ac9339"/><text x="56.0" y="481.2" font-size="13.5" fill="#6e5d20" font-weight="700" text-anchor="start"><tspan x="56.0">Disparador de compra</tspan></text><text x="56.0" y="501.0" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Evento en la vida del cliente que convierte un problema</tspan><tspan x="56.0" dy="15.2">tolerado en un problema urgente</tspan></text><rect x="379.0" y="467.2" width="54" height="20" rx="10" fill="#e5dcbc" stroke="#cebf8c" stroke-width="1"/><text x="406.0" y="481.2" font-size="11" fill="#6e5d20" font-weight="700" text-anchor="middle">↔ 1</text><rect x="459.0" y="459.2" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#cebf8c" stroke-width="1.4"/><rect x="459.0" y="467.2" width="5" height="62.2" rx="2" fill="#ac9339"/><text x="475.0" y="481.2" font-size="13.5" fill="#6e5d20" font-weight="700" text-anchor="start"><tspan x="475.0">Fricción</tspan></text><text x="475.0" y="501.0" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Todo aquello que aumenta el esfuerzo o el riesgo percibido</tspan><tspan x="475.0" dy="15.2">de avanzar a la siguiente etapa</tspan></text><rect x="798.0" y="467.2" width="54" height="20" rx="10" fill="#e5dcbc" stroke="#cebf8c" stroke-width="1"/><text x="825.0" y="481.2" font-size="11" fill="#6e5d20" font-weight="700" text-anchor="middle">↔ 4, 5</text><text x="40" y="569.36" font-size="11.5" fill="#ac9339" font-weight="700" letter-spacing="1.4">QUÉ SE MIDE: NUMERADOR SOBRE DENOMINADOR</text><rect x="40.0" y="583.4" width="261.3" height="120.7" rx="8" fill="#f7f3e2" stroke="#cebf8c" stroke-width="1.4"/><text x="54.0" y="605.4" font-size="13" fill="#6e5d20" font-weight="700" text-anchor="start"><tspan x="54.0">Tiempo por etapa</tspan></text><text x="54.0" y="634.5" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Mediana de días que una oportunidad</tspan><tspan x="54.0" dy="15.2">permanece en cada etapa, por</tspan><tspan x="54.0" dy="15.2">segmento</tspan></text><rect x="319.3" y="583.4" width="261.3" height="120.7" rx="8" fill="#f7f3e2" stroke="#cebf8c" stroke-width="1.4"/><text x="333.3" y="605.4" font-size="13" fill="#6e5d20" font-weight="700" text-anchor="start"><tspan x="333.3">Tasa de referidos activos</tspan></text><text x="333.3" y="634.5" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="333.3">Clientes que originaron al menos una</tspan><tspan x="333.3" dy="15.2">oportunidad en 12 meses</tspan></text><line x1="333.3" y1="670.9" x2="566.7" y2="670.9" stroke="#ac9339" stroke-width="2"/><text x="333.3" y="688.9" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="333.3">Clientes activos</tspan></text><rect x="598.7" y="583.4" width="261.3" height="120.7" rx="8" fill="#f7f3e2" stroke="#cebf8c" stroke-width="1.4"/><text x="612.7" y="605.4" font-size="13" fill="#6e5d20" font-weight="700" text-anchor="start"><tspan x="612.7">Abandono por etapa</tspan></text><text x="612.7" y="634.5" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="612.7">Oportunidades sin actividad en 30</tspan><tspan x="612.7" dy="15.2">días</tspan></text><line x1="612.7" y1="670.9" x2="846.0" y2="670.9" stroke="#ac9339" stroke-width="2"/><text x="612.7" y="688.9" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="612.7">Oportunidades abiertas en esa etapa</tspan></text><text x="40" y="738.06" font-size="11.5" fill="#ac9339" font-weight="700" letter-spacing="1.4">FRONTERA DE APLICACIÓN</text><rect x="40" y="748.1" width="820" height="81.5" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.4"/><polygon points="70,773.81 52,802.81 88,802.81" fill="#c2410c"/><text x="70" y="799.81" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">!</text><text x="106" y="772.1" font-size="12.5" fill="#7c2d12" font-weight="400" text-anchor="start"><tspan x="106">El flywheel no aplica igual a todos los negocios: en compras de una sola vez y baja frecuencia, la</tspan><tspan x="106" dy="16.5">referencia existe pero no compone. Antes de invertir en el bucle, verifica que la frecuencia de contacto</tspan><tspan x="106" dy="16.5">lo haga posible.</tspan></text><text x="40" y="857.56" font-size="11.5" fill="#ac9339" font-weight="700" letter-spacing="1.4">ERROR FRECUENTE Y SU CORRECCIÓN</text><rect x="40" y="867.6" width="380.0" height="77.0" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/><text x="54" y="889.6" font-size="11" fill="#b91c1c" font-weight="700" text-anchor="start"><tspan x="54">Síntoma</tspan></text><text x="54" y="907.6" font-size="12.5" fill="#7f1d1d" font-weight="400" text-anchor="start"><tspan x="54">Optimizar el embudo sin conocer el disparador</tspan></text><line x1="426.0" y1="906.1" x2="469.0" y2="906.1" stroke="#ac9339" stroke-width="2.6" stroke-linecap="round"/><polygon points="474.0,906.1 465.9,910.0 465.9,902.1" fill="#ac9339"/><rect x="480.0" y="867.6" width="380.0" height="77.0" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.4"/><text x="494.0" y="889.6" font-size="11" fill="#15803d" font-weight="700" text-anchor="start"><tspan x="494.0">Corrección</tspan></text><text x="494.0" y="907.6" font-size="12.5" fill="#14532d" font-weight="400" text-anchor="start"><tspan x="494.0">Entrevista a diez clientes ganados y pregunta qué</tspan><tspan x="494.0" dy="16.5">pasó la semana anterior a que buscaran solución.</tspan></text></svg>