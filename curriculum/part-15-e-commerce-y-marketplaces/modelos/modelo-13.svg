<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1357" width="900" height="1357" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif"><title id="t">Modelo mental · Economía del e-commerce</title><desc id="d">Modelo mental de la clase 15.13: Economía del e-commerce. Método en 5 pasos; 4 conceptos; 3 señales de medición.</desc><rect x="0" y="0" width="900" height="1357" rx="14" fill="#ffffff"/><rect x="0" y="0" width="900" height="64" rx="14" fill="#6e2033"/><rect x="0" y="40" width="900" height="24" fill="#6e2033"/><text x="40" y="28" font-size="12" fill="#e5bcc6" font-weight="700" letter-spacing="1.6">MODELO MENTAL · CLASE 15.13 · PARTE 15</text><text x="40" y="52" font-size="21" fill="#ffffff" font-weight="700">Economía del e-commerce</text><text x="40" y="84" font-size="11.5" fill="#ac3956" font-weight="700" letter-spacing="1.4">MÉTODO PASO A PASO</text><ellipse cx="450.0" cy="403.2" rx="330.0" ry="251.2" fill="none" stroke="#ce8c9d" stroke-width="2" stroke-dasharray="3 8" stroke-linecap="round"/><polygon points="653.6,205.3 636.2,201.8 641.4,192.4" fill="#ac3956"/><polygon points="759.5,490.9 761.2,473.3 771.1,477.5" fill="#ac3956"/><polygon points="439.0,654.4 455.9,649.0 455.9,659.8" fill="#ac3956"/><polygon points="131.8,470.7 143.4,484.1 133.5,488.4" fill="#ac3956"/><polygon points="265.7,194.7 253.5,207.6 248.3,198.1" fill="#ac3956"/><circle cx="450.0" cy="403.2" r="100.0" fill="#e5bcc6" stroke="#ce8c9d" stroke-width="1.6"/><text x="450.0" y="395.4" font-size="15" fill="#6e2033" font-weight="700" text-anchor="middle"><tspan x="450.0">Economía del</tspan><tspan x="450.0" dy="19.8">e-commerce</tspan></text><rect x="361.0" y="106.0" width="178" height="92.0" rx="10" fill="#f7e2e7" stroke="#ce8c9d" stroke-width="1.4"/><text x="373.0" y="128.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="373.0">Calcular la</tspan><tspan x="373.0" dy="16.5">contribución por</tspan><tspan x="373.0" dy="16.5">pedido con costos</tspan><tspan x="373.0" dy="16.5">completos</tspan></text><circle cx="363.0" cy="108.0" r="14" fill="#6e2033"/><text x="363.0" y="112.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><rect x="674.8" y="296.1" width="178" height="59.0" rx="10" fill="#f7e2e7" stroke="#ce8c9d" stroke-width="1.4"/><text x="686.8" y="318.1" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="686.8">Medir la frecuencia de</tspan><tspan x="686.8" dy="16.5">recompra por cohorte</tspan></text><circle cx="676.8" cy="298.1" r="14" fill="#6e2033"/><text x="676.8" y="302.6" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><rect x="555.0" y="576.9" width="178" height="59.0" rx="10" fill="#f7e2e7" stroke="#ce8c9d" stroke-width="1.4"/><text x="567.0" y="598.9" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="567.0">Clasificar el modelo</tspan><tspan x="567.0" dy="16.5">del negocio</tspan></text><circle cx="557.0" cy="578.9" r="14" fill="#6e2033"/><text x="557.0" y="583.4" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><rect x="167.0" y="560.4" width="178" height="92.0" rx="10" fill="#f7e2e7" stroke="#ce8c9d" stroke-width="1.4"/><text x="179.0" y="582.4" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="179.0">Asignar esfuerzo a</tspan><tspan x="179.0" dy="16.5">adquisición o</tspan><tspan x="179.0" dy="16.5">retención según el</tspan><tspan x="179.0" dy="16.5">modelo</tspan></text><circle cx="169.0" cy="562.4" r="14" fill="#6e2033"/><text x="169.0" y="566.9" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">4</text><rect x="47.2" y="287.8" width="178" height="75.5" rx="10" fill="#f7e2e7" stroke="#ce8c9d" stroke-width="1.4"/><text x="59.2" y="309.8" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="59.2">Revisar la</tspan><tspan x="59.2" dy="16.5">clasificación con</tspan><tspan x="59.2" dy="16.5">datos cada semestre</tspan></text><circle cx="49.2" cy="289.8" r="14" fill="#6e2033"/><text x="49.2" y="294.3" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">5</text><text x="40" y="742.4" font-size="11.5" fill="#ac3956" font-weight="700" letter-spacing="1.4">CONCEPTOS Y DÓNDE ACTÚAN EN EL MÉTODO</text><rect x="40.0" y="756.4" width="401.0" height="63.0" rx="8" fill="#ffffff" stroke="#ce8c9d" stroke-width="1.4"/><rect x="40.0" y="764.4" width="5" height="47.0" rx="2" fill="#ac3956"/><text x="56.0" y="778.4" font-size="13.5" fill="#6e2033" font-weight="700" text-anchor="start"><tspan x="56.0">Contribución por pedido</tspan></text><text x="56.0" y="798.2" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Ingreso menos todos los costos variables del pedido</tspan></text><rect x="379.0" y="764.4" width="54" height="20" rx="10" fill="#e5bcc6" stroke="#ce8c9d" stroke-width="1"/><text x="406.0" y="778.4" font-size="11" fill="#6e2033" font-weight="700" text-anchor="middle">↔ 1</text><rect x="459.0" y="756.4" width="401.0" height="63.0" rx="8" fill="#ffffff" stroke="#ce8c9d" stroke-width="1.4"/><rect x="459.0" y="764.4" width="5" height="47.0" rx="2" fill="#ac3956"/><text x="475.0" y="778.4" font-size="13.5" fill="#6e2033" font-weight="700" text-anchor="start"><tspan x="475.0">Frecuencia de recompra</tspan></text><text x="475.0" y="798.2" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Número de compras por cliente en un periodo definido</tspan></text><rect x="798.0" y="764.4" width="54" height="20" rx="10" fill="#e5bcc6" stroke="#ce8c9d" stroke-width="1"/><text x="825.0" y="778.4" font-size="11" fill="#6e2033" font-weight="700" text-anchor="middle">↔ 2</text><rect x="40.0" y="833.4" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#ce8c9d" stroke-width="1.4"/><rect x="40.0" y="841.4" width="5" height="62.2" rx="2" fill="#ac3956"/><text x="56.0" y="855.4" font-size="13.5" fill="#6e2033" font-weight="700" text-anchor="start"><tspan x="56.0">Valor del cliente en comercio</tspan></text><text x="56.0" y="875.2" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Contribución acumulada esperada durante la relación</tspan></text><rect x="459.0" y="833.4" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#ce8c9d" stroke-width="1.4"/><rect x="459.0" y="841.4" width="5" height="62.2" rx="2" fill="#ac3956"/><text x="475.0" y="855.4" font-size="13.5" fill="#6e2033" font-weight="700" text-anchor="start"><tspan x="475.0">Modelo de compra única o repetida</tspan></text><text x="475.0" y="875.2" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Clasificación que determina dónde invertir el esfuerzo</tspan><tspan x="475.0" dy="15.2">comercial</tspan></text><rect x="798.0" y="841.4" width="54" height="20" rx="10" fill="#e5bcc6" stroke="#ce8c9d" stroke-width="1"/><text x="825.0" y="855.4" font-size="11" fill="#6e2033" font-weight="700" text-anchor="middle">↔ 3, 4</text><text x="40" y="943.5799999999999" font-size="11.5" fill="#ac3956" font-weight="700" letter-spacing="1.4">QUÉ SE MIDE: NUMERADOR SOBRE DENOMINADOR</text><rect x="40.0" y="957.6" width="261.3" height="137.9" rx="8" fill="#f7e2e7" stroke="#ce8c9d" stroke-width="1.4"/><text x="54.0" y="979.6" font-size="13" fill="#6e2033" font-weight="700" text-anchor="start"><tspan x="54.0">Contribución por pedido</tspan></text><text x="54.0" y="1008.7" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Ingreso menos costos variables,</tspan></text><line x1="54.0" y1="1029.9" x2="287.3" y2="1029.9" stroke="#ac3956" stroke-width="2"/><text x="54.0" y="1047.9" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="54.0">Pedidos</tspan></text><rect x="319.3" y="957.6" width="261.3" height="137.9" rx="8" fill="#f7e2e7" stroke="#ce8c9d" stroke-width="1.4"/><text x="333.3" y="979.6" font-size="13" fill="#6e2033" font-weight="700" text-anchor="start"><tspan x="333.3">Frecuencia de recompra por</tspan><tspan x="333.3" dy="17.2">cohorte</tspan></text><text x="333.3" y="1025.9" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="333.3">Compras por cliente en 12 meses, por</tspan><tspan x="333.3" dy="15.2">cohorte de incorporación</tspan></text><rect x="598.7" y="957.6" width="261.3" height="137.9" rx="8" fill="#f7e2e7" stroke="#ce8c9d" stroke-width="1.4"/><text x="612.7" y="979.6" font-size="13" fill="#6e2033" font-weight="700" text-anchor="start"><tspan x="612.7">Proporción de ingreso de</tspan><tspan x="612.7" dy="17.2">clientes recurrentes</tspan></text><text x="612.7" y="1025.9" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="612.7">Ingreso de clientes con más de una</tspan><tspan x="612.7" dy="15.2">compra</tspan></text><line x1="612.7" y1="1062.3" x2="846.0" y2="1062.3" stroke="#ac3956" stroke-width="2"/><text x="612.7" y="1080.3" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="612.7">Ingreso total</tspan></text><text x="40" y="1129.44" font-size="11.5" fill="#ac3956" font-weight="700" letter-spacing="1.4">FRONTERA DE APLICACIÓN</text><rect x="40" y="1139.4" width="820" height="65.0" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.4"/><polygon points="70,1156.94 52,1185.94 88,1185.94" fill="#c2410c"/><text x="70" y="1182.94" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">!</text><text x="106" y="1163.4" font-size="12.5" fill="#7c2d12" font-weight="400" text-anchor="start"><tspan x="106">La frecuencia de recompra depende de la categoría: un producto duradero no se repite y eso no indica un</tspan><tspan x="106" dy="16.5">problema de retención.</tspan></text><text x="40" y="1232.44" font-size="11.5" fill="#ac3956" font-weight="700" letter-spacing="1.4">ERROR FRECUENTE Y SU CORRECCIÓN</text><rect x="40" y="1242.4" width="380.0" height="77.0" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/><text x="54" y="1264.4" font-size="11" fill="#b91c1c" font-weight="700" text-anchor="start"><tspan x="54">Síntoma</tspan></text><text x="54" y="1282.4" font-size="12.5" fill="#7f1d1d" font-weight="400" text-anchor="start"><tspan x="54">Invertir en retención donde la categoría no permite</tspan><tspan x="54" dy="16.5">recompra</tspan></text><line x1="426.0" y1="1280.9" x2="469.0" y2="1280.9" stroke="#ac3956" stroke-width="2.6" stroke-linecap="round"/><polygon points="474.0,1280.9 465.9,1284.9 465.9,1277.0" fill="#ac3956"/><rect x="480.0" y="1242.4" width="380.0" height="77.0" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.4"/><text x="494.0" y="1264.4" font-size="11" fill="#15803d" font-weight="700" text-anchor="start"><tspan x="494.0">Corrección</tspan></text><text x="494.0" y="1282.4" font-size="12.5" fill="#14532d" font-weight="400" text-anchor="start"><tspan x="494.0">Clasifica el modelo por frecuencia observada antes</tspan><tspan x="494.0" dy="16.5">de asignar presupuesto de fidelización.</tspan></text></svg>