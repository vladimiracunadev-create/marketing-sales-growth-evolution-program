<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1357" width="900" height="1357" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif"><title id="t">Modelo mental · Naming</title><desc id="d">Modelo mental de la clase 06.04: Naming. Método en 5 pasos; 4 conceptos; 3 señales de medición.</desc><rect x="0" y="0" width="900" height="1357" rx="14" fill="#ffffff"/><rect x="0" y="0" width="900" height="64" rx="14" fill="#57206e"/><rect x="0" y="40" width="900" height="24" fill="#57206e"/><text x="40" y="28" font-size="12" fill="#d9bce5" font-weight="700" letter-spacing="1.6">MODELO MENTAL · CLASE 06.04 · PARTE 06</text><text x="40" y="52" font-size="21" fill="#ffffff" font-weight="700">Naming</text><text x="40" y="84" font-size="11.5" fill="#8939ac" font-weight="700" letter-spacing="1.4">MÉTODO PASO A PASO</text><ellipse cx="450.0" cy="403.2" rx="330.0" ry="251.2" fill="none" stroke="#ba8cce" stroke-width="2" stroke-dasharray="3 8" stroke-linecap="round"/><polygon points="653.6,205.3 636.2,201.8 641.4,192.4" fill="#8939ac"/><polygon points="759.5,490.9 761.2,473.3 771.1,477.5" fill="#8939ac"/><polygon points="439.0,654.4 455.9,649.0 455.9,659.8" fill="#8939ac"/><polygon points="131.8,470.7 143.4,484.1 133.5,488.4" fill="#8939ac"/><polygon points="265.7,194.7 253.5,207.6 248.3,198.1" fill="#8939ac"/><circle cx="450.0" cy="403.2" r="100.0" fill="#d9bce5" stroke="#ba8cce" stroke-width="1.6"/><text x="450.0" y="405.3" font-size="15" fill="#57206e" font-weight="700" text-anchor="middle"><tspan x="450.0">Naming</tspan></text><rect x="361.0" y="106.0" width="178" height="92.0" rx="10" fill="#f1e2f7" stroke="#ba8cce" stroke-width="1.4"/><text x="373.0" y="128.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="373.0">Definir criterios y</tspan><tspan x="373.0" dy="16.5">territorio de uso</tspan><tspan x="373.0" dy="16.5">antes de generar</tspan><tspan x="373.0" dy="16.5">opciones</tspan></text><circle cx="363.0" cy="108.0" r="14" fill="#57206e"/><text x="363.0" y="112.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><rect x="674.8" y="279.6" width="178" height="92.0" rx="10" fill="#f1e2f7" stroke="#ba8cce" stroke-width="1.4"/><text x="686.8" y="301.6" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="686.8">Generar alternativas y</tspan><tspan x="686.8" dy="16.5">filtrar por</tspan><tspan x="686.8" dy="16.5">pronunciación y</tspan><tspan x="686.8" dy="16.5">memoria</tspan></text><circle cx="676.8" cy="281.6" r="14" fill="#57206e"/><text x="676.8" y="286.1" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><rect x="555.0" y="568.7" width="178" height="75.5" rx="10" fill="#f1e2f7" stroke="#ba8cce" stroke-width="1.4"/><text x="567.0" y="590.7" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="567.0">Verificar</tspan><tspan x="567.0" dy="16.5">disponibilidad</tspan><tspan x="567.0" dy="16.5">registral y digital</tspan></text><circle cx="557.0" cy="570.7" r="14" fill="#57206e"/><text x="557.0" y="575.2" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><rect x="167.0" y="568.7" width="178" height="75.5" rx="10" fill="#f1e2f7" stroke="#ba8cce" stroke-width="1.4"/><text x="179.0" y="590.7" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="179.0">Probar comprensión y</tspan><tspan x="179.0" dy="16.5">recuerdo con el</tspan><tspan x="179.0" dy="16.5">segmento</tspan></text><circle cx="169.0" cy="570.7" r="14" fill="#57206e"/><text x="169.0" y="575.2" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">4</text><rect x="47.2" y="296.1" width="178" height="59.0" rx="10" fill="#f1e2f7" stroke="#ba8cce" stroke-width="1.4"/><text x="59.2" y="318.1" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="59.2">Decidir y proteger el</tspan><tspan x="59.2" dy="16.5">signo elegido</tspan></text><circle cx="49.2" cy="298.1" r="14" fill="#57206e"/><text x="49.2" y="302.6" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">5</text><text x="40" y="742.4" font-size="11.5" fill="#8939ac" font-weight="700" letter-spacing="1.4">CONCEPTOS Y DÓNDE ACTÚAN EN EL MÉTODO</text><rect x="40.0" y="756.4" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#ba8cce" stroke-width="1.4"/><rect x="40.0" y="764.4" width="5" height="62.2" rx="2" fill="#8939ac"/><text x="56.0" y="778.4" font-size="13.5" fill="#57206e" font-weight="700" text-anchor="start"><tspan x="56.0">Distintividad</tspan></text><text x="56.0" y="798.2" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Capacidad del nombre de identificar el origen comercial y</tspan><tspan x="56.0" dy="15.2">de ser registrable</tspan></text><rect x="459.0" y="756.4" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#ba8cce" stroke-width="1.4"/><rect x="459.0" y="764.4" width="5" height="62.2" rx="2" fill="#8939ac"/><text x="475.0" y="778.4" font-size="13.5" fill="#57206e" font-weight="700" text-anchor="start"><tspan x="475.0">Memorabilidad</tspan></text><text x="475.0" y="798.2" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Facilidad con que el nombre se retiene y se reproduce</tspan><tspan x="475.0" dy="15.2">correctamente</tspan></text><rect x="798.0" y="764.4" width="54" height="20" rx="10" fill="#d9bce5" stroke="#ba8cce" stroke-width="1"/><text x="825.0" y="778.4" font-size="11" fill="#57206e" font-weight="700" text-anchor="middle">↔ 2</text><rect x="40.0" y="848.6" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#ba8cce" stroke-width="1.4"/><rect x="40.0" y="856.6" width="5" height="62.2" rx="2" fill="#8939ac"/><text x="56.0" y="870.6" font-size="13.5" fill="#57206e" font-weight="700" text-anchor="start"><tspan x="56.0">Extensibilidad</tspan></text><text x="56.0" y="890.4" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Capacidad del nombre de acompañar nuevas categorías o</tspan><tspan x="56.0" dy="15.2">mercados</tspan></text><rect x="459.0" y="848.6" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#ba8cce" stroke-width="1.4"/><rect x="459.0" y="856.6" width="5" height="62.2" rx="2" fill="#8939ac"/><text x="475.0" y="870.6" font-size="13.5" fill="#57206e" font-weight="700" text-anchor="start"><tspan x="475.0">Disponibilidad legal</tspan></text><text x="475.0" y="890.4" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Situación registral del signo en las clases y territorios</tspan><tspan x="475.0" dy="15.2">relevantes</tspan></text><rect x="798.0" y="856.6" width="54" height="20" rx="10" fill="#d9bce5" stroke="#ba8cce" stroke-width="1"/><text x="825.0" y="870.6" font-size="11" fill="#57206e" font-weight="700" text-anchor="middle">↔ 3</text><text x="40" y="958.76" font-size="11.5" fill="#8939ac" font-weight="700" letter-spacing="1.4">QUÉ SE MIDE: NUMERADOR SOBRE DENOMINADOR</text><rect x="40.0" y="972.8" width="261.3" height="122.7" rx="8" fill="#f1e2f7" stroke="#ba8cce" stroke-width="1.4"/><text x="54.0" y="994.8" font-size="13" fill="#57206e" font-weight="700" text-anchor="start"><tspan x="54.0">Recuerdo correcto del nombre</tspan></text><text x="54.0" y="1023.9" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Personas que reproducen el nombre</tspan><tspan x="54.0" dy="15.2">sin error tras 24 horas</tspan></text><line x1="54.0" y1="1060.3" x2="287.3" y2="1060.3" stroke="#8939ac" stroke-width="2"/><text x="54.0" y="1078.3" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="54.0">Expuestas</tspan></text><rect x="319.3" y="972.8" width="261.3" height="122.7" rx="8" fill="#f1e2f7" stroke="#ba8cce" stroke-width="1.4"/><text x="333.3" y="994.8" font-size="13" fill="#57206e" font-weight="700" text-anchor="start"><tspan x="333.3">Disponibilidad registral</tspan></text><text x="333.3" y="1023.9" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="333.3">Clases y territorios donde el signo</tspan><tspan x="333.3" dy="15.2">está disponible</tspan></text><line x1="333.3" y1="1060.3" x2="566.7" y2="1060.3" stroke="#8939ac" stroke-width="2"/><text x="333.3" y="1078.3" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="333.3">Los requeridos</tspan></text><rect x="598.7" y="972.8" width="261.3" height="122.7" rx="8" fill="#f1e2f7" stroke="#ba8cce" stroke-width="1.4"/><text x="612.7" y="994.8" font-size="13" fill="#57206e" font-weight="700" text-anchor="start"><tspan x="612.7">Errores de escritura en</tspan><tspan x="612.7" dy="17.2">búsquedas</tspan></text><text x="612.7" y="1041.1" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="612.7">Búsquedas con el nombre mal escrito</tspan></text><line x1="612.7" y1="1062.3" x2="846.0" y2="1062.3" stroke="#8939ac" stroke-width="2"/><text x="612.7" y="1080.3" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="612.7">Búsquedas de marca</tspan></text><text x="40" y="1129.44" font-size="11.5" fill="#8939ac" font-weight="700" letter-spacing="1.4">FRONTERA DE APLICACIÓN</text><rect x="40" y="1139.4" width="820" height="65.0" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.4"/><polygon points="70,1156.94 52,1185.94 88,1185.94" fill="#c2410c"/><text x="70" y="1182.94" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">!</text><text x="106" y="1163.4" font-size="12.5" fill="#7c2d12" font-weight="400" text-anchor="start"><tspan x="106">Un buen nombre no salva una posición débil ni una experiencia deficiente; sólo reduce la fricción para</tspan><tspan x="106" dy="16.5">construir memoria.</tspan></text><text x="40" y="1232.44" font-size="11.5" fill="#8939ac" font-weight="700" letter-spacing="1.4">ERROR FRECUENTE Y SU CORRECCIÓN</text><rect x="40" y="1242.4" width="380.0" height="77.0" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/><text x="54" y="1264.4" font-size="11" fill="#b91c1c" font-weight="700" text-anchor="start"><tspan x="54">Síntoma</tspan></text><text x="54" y="1282.4" font-size="12.5" fill="#7f1d1d" font-weight="400" text-anchor="start"><tspan x="54">Invertir en identidad antes de verificar el</tspan><tspan x="54" dy="16.5">registro</tspan></text><line x1="426.0" y1="1280.9" x2="469.0" y2="1280.9" stroke="#8939ac" stroke-width="2.6" stroke-linecap="round"/><polygon points="474.0,1280.9 465.9,1284.9 465.9,1277.0" fill="#8939ac"/><rect x="480.0" y="1242.4" width="380.0" height="77.0" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.4"/><text x="494.0" y="1264.4" font-size="11" fill="#15803d" font-weight="700" text-anchor="start"><tspan x="494.0">Corrección</tspan></text><text x="494.0" y="1282.4" font-size="12.5" fill="#14532d" font-weight="400" text-anchor="start"><tspan x="494.0">Consulta la disponibilidad en INAPI y en dominios</tspan><tspan x="494.0" dy="16.5">antes de comprometer presupuesto de marca.</tspan></text></svg>