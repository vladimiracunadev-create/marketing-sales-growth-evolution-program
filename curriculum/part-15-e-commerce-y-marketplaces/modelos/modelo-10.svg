iddle">5</text><text x="40" y="493.0" font-size="11.5" fill="#ac3956" font-weight="700" letter-spacing="1.4">CONCEPTOS Y DÓNDE ACTÚAN EN EL MÉTODO</text><rect x="40.0" y="507.0" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#ce8c9d" stroke-width="1.4"/><rect x="40.0" y="515.0" width="5" height="62.2" rx="2" fill="#ac3956"/><text x="56.0" y="529.0" font-size="13.5" fill="#6e2033" font-weight="700" text-anchor="start"><tspan x="56.0">Pertinencia de la recomendación</tspan></text><text x="56.0" y="548.8" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Correspondencia entre lo recomendado y la necesidad real</tspan><tspan x="56.0" dy="15.2">del cliente</tspan></text><rect x="379.0" y="515.0" width="54" height="20" rx="10" fill="#e5bcc6" stroke="#ce8c9d" stroke-width="1"/><text x="406.0" y="529.0" font-size="11" fill="#6e2033" font-weight="700" text-anchor="middle">↔ 3, 5</text><rect x="459.0" y="507.0" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#ce8c9d" stroke-width="1.4"/><rect x="459.0" y="515.0" width="5" height="62.2" rx="2" fill="#ac3956"/><text x="475.0" y="529.0" font-size="13.5" fill="#6e2033" font-weight="700" text-anchor="start"><tspan x="475.0">Momento de la oferta</tspan></text><text x="475.0" y="548.8" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Instante del recorrido donde la sugerencia ayuda en lugar</tspan><tspan x="475.0" dy="15.2">de interrumpir</tspan></text><rect x="798.0" y="515.0" width="54" height="20" rx="10" fill="#e5bcc6" stroke="#ce8c9d" stroke-width="1"/><text x="825.0" y="529.0" font-size="11" fill="#6e2033" font-weight="700" text-anchor="middle">↔ 2</text><rect x="40.0" y="599.2" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#ce8c9d" stroke-width="1.4"/><rect x="40.0" y="607.2" width="5" height="62.2" rx="2" fill="#ac3956"/><text x="56.0" y="621.2" font-size="13.5" fill="#6e2033" font-weight="700" text-anchor="start"><tspan x="56.0">Recomendación basada en comportamiento</tspan></text><text x="56.0" y="641.0" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Sugerencia derivada de patrones reales de compra conjunta</tspan></text><rect x="379.0" y="607.2" width="54" height="20" rx="10" fill="#e5bcc6" stroke="#ce8c9d" stroke-width="1"/><text x="406.0" y="621.2" font-size="11" fill="#6e2033" font-weight="700" text-anchor="middle">↔ 1, 5</text><rect x="459.0" y="599.2" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#ce8c9d" stroke-width="1.4"/><rect x="459.0" y="607.2" width="5" height="62.2" rx="2" fill="#ac3956"/><text x="475.0" y="621.2" font-size="13.5" fill="#6e2033" font-weight="700" text-anchor="start"><tspan x="475.0">Costo de la interrupción</tspan></text><text x="475.0" y="641.0" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Efecto negativo sobre conversión y satisfacción de una</tspan><tspan x="475.0" dy="15.2">oferta inoportuna</tspan></text><text x="40" y="709.3600000000001" font-size="11.5" fill="#ac3956" font-weight="700" letter-spacing="1.4">QUÉ SE MIDE: NUMERADOR SOBRE DENOMINADOR</text><rect x="40.0" y="723.4" width="261.3" height="137.9" rx="8" fill="#f7e2e7" stroke="#ce8c9d" stroke-width="1.4"/><text x="54.0" y="745.4" font-size="13" fill="#6e2033" font-weight="700" text-anchor="start"><tspan x="54.0">Tasa de aceptación de la</tspan><tspan x="54.0" dy="17.2">recomendación</tspan></text><text x="54.0" y="791.7" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Recomendaciones aceptadas</tspan></text><line x1="54.0" y1="812.9" x2="287.3" y2="812.9" stroke="#ac3956" stroke-width="2"/><text x="54.0" y="830.9" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="54.0">Recomendaciones mostradas</tspan></text><rect x="319.3" y="723.4" width="261.3" height="137.9" rx="8" fill="#f7e2e7" stroke="#ce8c9d" stroke-width="1.4"/><text x="333.3" y="745.4" font-size="13" fill="#6e2033" font-weight="700" text-anchor="start"><tspan x="333.3">Efecto en conversión global</tspan></text><text x="333.3" y="774.5" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="333.3">Variación de la tasa de compra total</tspan><tspan x="333.3" dy="15.2">con y sin recomendación</tspan></text><rect x="598.7" y="723.4" width="261.3" height="137.9" rx="8" fill="#f7e2e7" stroke="#ce8c9d" stroke-width="1.4"/><text x="612.7" y="745.4" font-size="13" fill="#6e2033" font-weight="700" text-anchor="start"><tspan x="612.7">Devoluciones de productos</tspan><tspan x="612.7" dy="17.2">recomendados</tspan></text><text x="612.7" y="791.7" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="612.7">Devoluciones de productos añadidos</tspan><tspan x="612.7" dy="15.2">por recomendación</tspan></text><line x1="612.7" y1="828.0" x2="846.0" y2="828.0" stroke="#ac3956" stroke-width="2"/><text x="612.7" y="846.0" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="612.7">Unidades añadidas</tspan></text><text x="40" y="895.2200000000001" font-size="11.5" fill="#ac3956" font-weight="700" letter-spacing="1.4">FRONTERA DE APLICACIÓN</text><rect x="40" y="905.2" width="820" height="65.0" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.4"/><polygon points="70,922.7200000000001 52,951.7200000000001 88,951.7200000000001" fill="#c2410c"/><text x="70" y="948.7200000000001" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">!</text><text x="106" y="929.2" font-size="12.5" fill="#7c2d12" font-weight="400" text-anchor="start"><tspan x="106">Las recomendaciones automatizadas heredan sesgos del histórico y pueden reforzar patrones indeseados.</tspan><tspan x="106" dy="16.5">Requieren revisión humana periódica.</tspan></text><text x="40" y="998.2200000000001" font-size="11.5" fill="#ac3956" font-weight="700" letter-spacing="1.4">ERROR FRECUENTE Y SU CORRECCIÓN</text><rect x="40" y="1008.2" width="380.0" height="93.5" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/><text x="54" y="1030.2" font-size="11" fill="#b91c1c" font-weight="700" text-anchor="start"><tspan x="54">Síntoma</tspan></text><text x="54" y="1048.2" font-size="12.5" fill="#7f1d1d" font-weight="400" text-anchor="start"><tspan x="54">Recomendar por margen y no por pertinencia</tspan></text><line x1="426.0" y1="1055.0" x2="469.0" y2="1055.0" stroke="#ac3956" stroke-width="2.6" stroke-linecap="round"/><polygon points="474.0,1055.0 465.9,1058.9 465.9,1051.1" fill="#ac3956"/><rect x="480.0" y="1008.2" width="380.0" height="93.5" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.4"/><text x="494.0" y="1030.2" font-size="11" fill="#15803d" font-weight="700" text-anchor="start"><tspan x="494.0">Corrección</tspan></text><text x="494.0" y="1048.2" font-size="12.5" fill="#14532d" font-weight="400" text-anchor="start"><tspan x="494.0">Construye las recomendaciones desde patrones reales</tspan><tspan x="494.0" dy="16.5">de compra conjunta y mide el efecto en conversión</tspan><tspan x="494.0" dy="16.5">global.</tspan></text></svg>