<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1272" width="900" height="1272" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif"><title id="t">Modelo mental · Velocidad comercial</title><desc id="d">Modelo mental de la clase 16.10: Velocidad comercial. Método en 5 pasos; 4 conceptos; 3 señales de medición.</desc><rect x="0" y="0" width="900" height="1272" rx="14" fill="#ffffff"/><rect x="0" y="0" width="900" height="64" rx="14" fill="#6e4a20"/><rect x="0" y="40" width="900" height="24" fill="#6e4a20"/><text x="40" y="28" font-size="12" fill="#e5d2bc" font-weight="700" letter-spacing="1.6">MODELO MENTAL · CLASE 16.10 · PARTE 16</text><text x="40" y="52" font-size="21" fill="#ffffff" font-weight="700">Velocidad comercial</text><text x="40" y="84" font-size="11.5" fill="#ac7639" font-weight="700" letter-spacing="1.4">MÉTODO PASO A PASO</text><ellipse cx="450.0" cy="376.8" rx="330.0" ry="233.1" fill="none" stroke="#ceaf8c" stroke-width="2" stroke-dasharray="3 8" stroke-linecap="round"/><polygon points="653.8,193.3 636.3,190.4 641.2,180.8" fill="#ac7639"/><polygon points="759.3,458.8 761.4,441.2 771.2,445.7" fill="#ac7639"/><polygon points="439.0,609.9 455.9,604.4 455.9,615.3" fill="#ac7639"/><polygon points="131.6,438.8 143.5,451.9 133.7,456.4" fill="#ac7639"/><polygon points="265.8,183.2 253.2,195.8 248.3,186.1" fill="#ac7639"/><circle cx="450.0" cy="376.8" r="100.0" fill="#e5d2bc" stroke="#ceaf8c" stroke-width="1.6"/><text x="450.0" y="378.9" font-size="15" fill="#6e4a20" font-weight="700" text-anchor="middle"><tspan x="450.0">Velocidad comercial</tspan></text><rect x="361.0" y="106.0" width="178" height="75.5" rx="10" fill="#f7ede2" stroke="#ceaf8c" stroke-width="1.4"/><text x="373.0" y="128.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="373.0">Calcular las cuatro</tspan><tspan x="373.0" dy="16.5">variables con datos</tspan><tspan x="373.0" dy="16.5">propios</tspan></text><circle cx="363.0" cy="108.0" r="14" fill="#6e4a20"/><text x="363.0" y="112.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><rect x="674.8" y="267.0" width="178" height="75.5" rx="10" fill="#f7ede2" stroke="#ceaf8c" stroke-width="1.4"/><text x="686.8" y="289.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="686.8">Simular el efecto de</tspan><tspan x="686.8" dy="16.5">mejorar cada una por</tspan><tspan x="686.8" dy="16.5">separado</tspan></text><circle cx="676.8" cy="269.0" r="14" fill="#6e4a20"/><text x="676.8" y="273.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><rect x="555.0" y="535.8" width="178" height="59.0" rx="10" fill="#f7ede2" stroke="#ceaf8c" stroke-width="1.4"/><text x="567.0" y="557.8" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="567.0">Identificar la palanca</tspan><tspan x="567.0" dy="16.5">dominante y su costo</tspan></text><circle cx="557.0" cy="537.8" r="14" fill="#6e4a20"/><text x="557.0" y="542.3" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><rect x="167.0" y="535.8" width="178" height="59.0" rx="10" fill="#f7ede2" stroke="#ceaf8c" stroke-width="1.4"/><text x="179.0" y="557.8" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="179.0">Intervenir sobre esa</tspan><tspan x="179.0" dy="16.5">palanca</tspan></text><circle cx="169.0" cy="537.8" r="14" fill="#6e4a20"/><text x="169.0" y="542.3" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">4</text><rect x="47.2" y="275.3" width="178" height="59.0" rx="10" fill="#f7ede2" stroke="#ceaf8c" stroke-width="1.4"/><text x="59.2" y="297.3" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="59.2">Medir el efecto y</tspan><tspan x="59.2" dy="16.5">recalcular</tspan></text><circle cx="49.2" cy="277.3" r="14" fill="#6e4a20"/><text x="49.2" y="281.8" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">5</text><text x="40" y="689.6" font-size="11.5" fill="#ac7639" font-weight="700" letter-spacing="1.4">CONCEPTOS Y DÓNDE ACTÚAN EN EL MÉTODO</text><rect x="40.0" y="703.6" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#ceaf8c" stroke-width="1.4"/><rect x="40.0" y="711.6" width="5" height="62.2" rx="2" fill="#ac7639"/><text x="56.0" y="725.6" font-size="13.5" fill="#6e4a20" font-weight="700" text-anchor="start"><tspan x="56.0">Velocidad comercial</tspan></text><text x="56.0" y="745.4" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Resultado de combinar oportunidades, valor, tasa de cierre</tspan><tspan x="56.0" dy="15.2">y duración del ciclo</tspan></text><rect x="459.0" y="703.6" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#ceaf8c" stroke-width="1.4"/><rect x="459.0" y="711.6" width="5" height="62.2" rx="2" fill="#ac7639"/><text x="475.0" y="725.6" font-size="13.5" fill="#6e4a20" font-weight="700" text-anchor="start"><tspan x="475.0">Palanca dominante</tspan></text><text x="475.0" y="745.4" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Variable cuya mejora produce mayor efecto sobre el</tspan><tspan x="475.0" dy="15.2">resultado</tspan></text><rect x="798.0" y="711.6" width="54" height="20" rx="10" fill="#e5d2bc" stroke="#ceaf8c" stroke-width="1"/><text x="825.0" y="725.6" font-size="11" fill="#6e4a20" font-weight="700" text-anchor="middle">↔ 2, 3, 4</text><rect x="40.0" y="795.8" width="401.0" height="63.0" rx="8" fill="#ffffff" stroke="#ceaf8c" stroke-width="1.4"/><rect x="40.0" y="803.8" width="5" height="47.0" rx="2" fill="#ac7639"/><text x="56.0" y="817.8" font-size="13.5" fill="#6e4a20" font-weight="700" text-anchor="start"><tspan x="56.0">Duración del ciclo</tspan></text><text x="56.0" y="837.6" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Tiempo entre la creación de la oportunidad y su cierre</tspan></text><rect x="459.0" y="795.8" width="401.0" height="63.0" rx="8" fill="#ffffff" stroke="#ceaf8c" stroke-width="1.4"/><rect x="459.0" y="803.8" width="5" height="47.0" rx="2" fill="#ac7639"/><text x="475.0" y="817.8" font-size="13.5" fill="#6e4a20" font-weight="700" text-anchor="start"><tspan x="475.0">Efecto compuesto</tspan></text><text x="475.0" y="837.6" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Resultado de mejorar varias variables simultáneamente</tspan></text><rect x="798.0" y="803.8" width="54" height="20" rx="10" fill="#e5d2bc" stroke="#ceaf8c" stroke-width="1"/><text x="825.0" y="817.8" font-size="11" fill="#6e4a20" font-weight="700" text-anchor="middle">↔ 2, 5</text><text x="40" y="890.78" font-size="11.5" fill="#ac7639" font-weight="700" letter-spacing="1.4">QUÉ SE MIDE: NUMERADOR SOBRE DENOMINADOR</text><rect x="40.0" y="904.8" width="261.3" height="105.5" rx="8" fill="#f7ede2" stroke="#ceaf8c" stroke-width="1.4"/><text x="54.0" y="926.8" font-size="13" fill="#6e4a20" font-weight="700" text-anchor="start"><tspan x="54.0">Duración mediana del ciclo</tspan></text><text x="54.0" y="955.9" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Días entre creación y cierre de la</tspan><tspan x="54.0" dy="15.2">oportunidad, mediana por segmento</tspan></text><rect x="319.3" y="904.8" width="261.3" height="105.5" rx="8" fill="#f7ede2" stroke="#ceaf8c" stroke-width="1.4"/><text x="333.3" y="926.8" font-size="13" fill="#6e4a20" font-weight="700" text-anchor="start"><tspan x="333.3">Valor promedio de oportunidad</tspan></text><text x="333.3" y="955.9" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="333.3">Valor total de negocios ganados</tspan></text><line x1="333.3" y1="977.1" x2="566.7" y2="977.1" stroke="#ac7639" stroke-width="2"/><text x="333.3" y="995.1" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="333.3">Número de negocios ganados</tspan></text><rect x="598.7" y="904.8" width="261.3" height="105.5" rx="8" fill="#f7ede2" stroke="#ceaf8c" stroke-width="1.4"/><text x="612.7" y="926.8" font-size="13" fill="#6e4a20" font-weight="700" text-anchor="start"><tspan x="612.7">Velocidad comercial calculada</tspan></text><text x="612.7" y="955.9" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="612.7">Resultado del cálculo combinado,</tspan><tspan x="612.7" dy="15.2">seguido por trimestre</tspan></text><text x="40" y="1044.3" font-size="11.5" fill="#ac7639" font-weight="700" letter-spacing="1.4">FRONTERA DE APLICACIÓN</text><rect x="40" y="1054.3" width="820" height="65.0" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.4"/><polygon points="70,1071.8 52,1100.8 88,1100.8" fill="#c2410c"/><text x="70" y="1097.8" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">!</text><text x="106" y="1078.3" font-size="12.5" fill="#7c2d12" font-weight="400" text-anchor="start"><tspan x="106">Acelerar el ciclo puede reducir la calidad del diagnóstico y aumentar el churn posterior. La velocidad</tspan><tspan x="106" dy="16.5">debe evaluarse junto con la retención.</tspan></text><text x="40" y="1147.3" font-size="11.5" fill="#ac7639" font-weight="700" letter-spacing="1.4">ERROR FRECUENTE Y SU CORRECCIÓN</text><rect x="40" y="1157.3" width="380.0" height="77.0" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/><text x="54" y="1179.3" font-size="11" fill="#b91c1c" font-weight="700" text-anchor="start"><tspan x="54">Síntoma</tspan></text><text x="54" y="1197.3" font-size="12.5" fill="#7f1d1d" font-weight="400" text-anchor="start"><tspan x="54">Buscar sólo más oportunidades</tspan></text><line x1="426.0" y1="1195.8" x2="469.0" y2="1195.8" stroke="#ac7639" stroke-width="2.6" stroke-linecap="round"/><polygon points="474.0,1195.8 465.9,1199.7 465.9,1191.9" fill="#ac7639"/><rect x="480.0" y="1157.3" width="380.0" height="77.0" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.4"/><text x="494.0" y="1179.3" font-size="11" fill="#15803d" font-weight="700" text-anchor="start"><tspan x="494.0">Corrección</tspan></text><text x="494.0" y="1197.3" font-size="12.5" fill="#14532d" font-weight="400" text-anchor="start"><tspan x="494.0">Simula el efecto de reducir el ciclo y de mejorar</tspan><tspan x="494.0" dy="16.5">la tasa de cierre antes de aumentar la generación.</tspan></text></svg>