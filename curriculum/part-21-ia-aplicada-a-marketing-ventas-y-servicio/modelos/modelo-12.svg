<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1496" width="900" height="1496" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif"><title id="t">Modelo mental · Evaluación y guardrails</title><desc id="d">Modelo mental de la clase 21.12: Evaluación y guardrails. Método en 5 pasos; 8 conceptos; 4 señales de medición.</desc><rect x="0" y="0" width="900" height="1496" rx="14" fill="#ffffff"/><rect x="0" y="0" width="900" height="64" rx="14" fill="#43206e"/><rect x="0" y="40" width="900" height="24" fill="#43206e"/><text x="40" y="28" font-size="12" fill="#cfbce5" font-weight="700" letter-spacing="1.6">MODELO MENTAL · CLASE 21.12 · PARTE 21</text><text x="40" y="52" font-size="21" fill="#ffffff" font-weight="700">Evaluación y guardrails</text><text x="40" y="84" font-size="11.5" fill="#6d39ac" font-weight="700" letter-spacing="1.4">MÉTODO PASO A PASO</text><path d="M66.0,159.0 V202.5 H158.5" fill="none" stroke="#6d39ac" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="160.5,202.5 151.5,197.5 151.5,207.5" fill="#6d39ac"/><path d="M188.5,232.0 V275.5 H281.0" fill="none" stroke="#6d39ac" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="283.0,275.5 274.0,270.5 274.0,280.5" fill="#6d39ac"/><path d="M311.0,305.0 V348.5 H403.5" fill="none" stroke="#6d39ac" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="405.5,348.5 396.5,343.5 396.5,353.5" fill="#6d39ac"/><path d="M433.5,378.0 V421.5 H526.0" fill="none" stroke="#6d39ac" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="528.0,421.5 519.0,416.5 519.0,426.5" fill="#6d39ac"/><rect x="40.0" y="100.0" width="330" height="59.0" rx="10" fill="#ece2f7" stroke="#aa8cce" stroke-width="1.4"/><text x="54.0" y="122.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Construir el conjunto de evaluación con</tspan><tspan x="54.0" dy="16.5">casos reales</tspan></text><circle cx="42.0" cy="102.0" r="14" fill="#43206e"/><text x="42.0" y="106.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><rect x="162.5" y="173.0" width="330" height="59.0" rx="10" fill="#ece2f7" stroke="#aa8cce" stroke-width="1.4"/><text x="176.5" y="195.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="176.5">Definir el umbral de aceptación antes de</tspan><tspan x="176.5" dy="16.5">probar</tspan></text><circle cx="164.5" cy="175.0" r="14" fill="#43206e"/><text x="164.5" y="179.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><rect x="285.0" y="246.0" width="330" height="59.0" rx="10" fill="#ece2f7" stroke="#aa8cce" stroke-width="1.4"/><text x="299.0" y="268.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="299.0">Implementar guardarraíles sobre los riesgos</tspan><tspan x="299.0" dy="16.5">identificados</tspan></text><circle cx="287.0" cy="248.0" r="14" fill="#43206e"/><text x="287.0" y="252.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><rect x="407.5" y="319.0" width="330" height="59.0" rx="10" fill="#ece2f7" stroke="#aa8cce" stroke-width="1.4"/><text x="421.5" y="341.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="421.5">Monitorear el desempeño en producción</tspan></text><circle cx="409.5" cy="321.0" r="14" fill="#43206e"/><text x="409.5" y="325.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">4</text><rect x="530.0" y="392.0" width="330" height="59.0" rx="10" fill="#ece2f7" stroke="#aa8cce" stroke-width="1.4"/><text x="544.0" y="414.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="544.0">Documentar incidentes y ajustar el sistema</tspan></text><circle cx="532.0" cy="394.0" r="14" fill="#43206e"/><text x="532.0" y="398.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">5</text><text x="40" y="493.0" font-size="11.5" fill="#6d39ac" font-weight="700" letter-spacing="1.4">CONCEPTOS Y DÓNDE ACTÚAN EN EL MÉTODO</text><rect x="40.0" y="507.0" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#aa8cce" stroke-width="1.4"/><rect x="40.0" y="515.0" width="5" height="62.2" rx="2" fill="#6d39ac"/><text x="56.0" y="529.0" font-size="13.5" fill="#43206e" font-weight="700" text-anchor="start"><tspan x="56.0">Conjunto de evaluación</tspan></text><text x="56.0" y="548.8" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Casos representativos con resultado esperado que permiten</tspan><tspan x="56.0" dy="15.2">medir el desempeño</tspan></text><rect x="379.0" y="515.0" width="54" height="20" rx="10" fill="#cfbce5" stroke="#aa8cce" stroke-width="1"/><text x="406.0" y="529.0" font-size="11" fill="#43206e" font-weight="700" text-anchor="middle">↔ 1</text><rect x="459.0" y="507.0" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#aa8cce" stroke-width="1.4"/><rect x="459.0" y="515.0" width="5" height="62.2" rx="2" fill="#6d39ac"/><text x="475.0" y="529.0" font-size="13.5" fill="#43206e" font-weight="700" text-anchor="start"><tspan x="475.0">Guardarraíl</tspan></text><text x="475.0" y="548.8" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Restricción que impide un comportamiento inaceptable del</tspan><tspan x="475.0" dy="15.2">sistema</tspan></text><rect x="798.0" y="515.0" width="54" height="20" rx="10" fill="#cfbce5" stroke="#aa8cce" stroke-width="1"/><text x="825.0" y="529.0" font-size="11" fill="#43206e" font-weight="700" text-anchor="middle">↔ 3</text><rect x="40.0" y="599.2" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#aa8cce" stroke-width="1.4"/><rect x="40.0" y="607.2" width="5" height="62.2" rx="2" fill="#6d39ac"/><text x="56.0" y="621.2" font-size="13.5" fill="#43206e" font-weight="700" text-anchor="start"><tspan x="56.0">Monitoreo posterior</tspan></text><text x="56.0" y="641.0" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Medición continua del desempeño tras el despliegue</tspan></text><rect x="379.0" y="607.2" width="54" height="20" rx="10" fill="#cfbce5" stroke="#aa8cce" stroke-width="1"/><text x="406.0" y="621.2" font-size="11" fill="#43206e" font-weight="700" text-anchor="middle">↔ 4</text><rect x="459.0" y="599.2" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#aa8cce" stroke-width="1.4"/><rect x="459.0" y="607.2" width="5" height="62.2" rx="2" fill="#6d39ac"/><text x="475.0" y="621.2" font-size="13.5" fill="#43206e" font-weight="700" text-anchor="start"><tspan x="475.0">Umbral de aceptación</tspan></text><text x="475.0" y="641.0" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Nivel de desempeño mínimo que autoriza el uso en</tspan><tspan x="475.0" dy="15.2">producción</tspan></text><rect x="798.0" y="607.2" width="54" height="20" rx="10" fill="#cfbce5" stroke="#aa8cce" stroke-width="1"/><text x="825.0" y="621.2" font-size="11" fill="#43206e" font-weight="700" text-anchor="middle">↔ 2, 4</text><rect x="40.0" y="691.4" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#aa8cce" stroke-width="1.4"/><rect x="40.0" y="699.4" width="5" height="62.2" rx="2" fill="#6d39ac"/><text x="56.0" y="713.4" font-size="13.5" fill="#43206e" font-weight="700" text-anchor="start"><tspan x="56.0">Suplantación de identidad</tspan></text><text x="56.0" y="733.2" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Uso no autorizado del nombre, imagen, voz o cuenta de una</tspan><tspan x="56.0" dy="15.2">persona u organización</tspan></text><rect x="379.0" y="699.4" width="54" height="20" rx="10" fill="#cfbce5" stroke="#aa8cce" stroke-width="1"/><text x="406.0" y="713.4" font-size="11" fill="#43206e" font-weight="700" text-anchor="middle">↔ 3</text><rect x="459.0" y="691.4" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#aa8cce" stroke-width="1.4"/><rect x="459.0" y="699.4" width="5" height="62.2" rx="2" fill="#6d39ac"/><text x="475.0" y="713.4" font-size="13.5" fill="#43206e" font-weight="700" text-anchor="start"><tspan x="475.0">Deepfake</tspan></text><text x="475.0" y="733.2" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Contenido sintético que imita rostro o voz de una persona</tspan><tspan x="475.0" dy="15.2">para aparentar hechos o declaraciones que no ocurrieron</tspan></text><rect x="40.0" y="783.5" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#aa8cce" stroke-width="1.4"/><rect x="40.0" y="791.5" width="5" height="62.2" rx="2" fill="#6d39ac"/><text x="56.0" y="805.5" font-size="13.5" fill="#43206e" font-weight="700" text-anchor="start"><tspan x="56.0">Procedencia de contenido</tspan></text><text x="56.0" y="825.4" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Registro verificable de origen y modificaciones de una</tspan><tspan x="56.0" dy="15.2">pieza</tspan></text><rect x="459.0" y="783.5" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#aa8cce" stroke-width="1.4"/><rect x="459.0" y="791.5" width="5" height="62.2" rx="2" fill="#6d39ac"/><text x="475.0" y="805.5" font-size="13.5" fill="#43206e" font-weight="700" text-anchor="start"><tspan x="475.0">Verificación independiente</tspan></text><text x="475.0" y="825.4" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Contraste de una afirmación con una fuente que no depende</tspan><tspan x="475.0" dy="15.2">de quien la difunde</tspan></text><text x="40" y="893.7200000000003" font-size="11.5" fill="#6d39ac" font-weight="700" letter-spacing="1.4">QUÉ SE MIDE: NUMERADOR SOBRE DENOMINADOR</text><rect x="40.0" y="907.7" width="261.3" height="137.9" rx="8" fill="#ece2f7" stroke="#aa8cce" stroke-width="1.4"/><text x="54.0" y="929.7" font-size="13" fill="#43206e" font-weight="700" text-anchor="start"><tspan x="54.0">Desempeño en el conjunto de</tspan><tspan x="54.0" dy="17.2">evaluación</tspan></text><text x="54.0" y="976.0" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Casos resueltos correctamente</tspan></text><line x1="54.0" y1="997.2" x2="287.3" y2="997.2" stroke="#6d39ac" stroke-width="2"/><text x="54.0" y="1015.2" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="54.0">Casos del conjunto</tspan></text><rect x="319.3" y="907.7" width="261.3" height="137.9" rx="8" fill="#ece2f7" stroke="#aa8cce" stroke-width="1.4"/><text x="333.3" y="929.7" font-size="13" fill="#43206e" font-weight="700" text-anchor="start"><tspan x="333.3">Incidentes por guardarraíl</tspan><tspan x="333.3" dy="17.2">activado</tspan></text><text x="333.3" y="976.0" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="333.3">Activaciones del guardarraíl</tspan></text><line x1="333.3" y1="997.2" x2="566.7" y2="997.2" stroke="#6d39ac" stroke-width="2"/><text x="333.3" y="1015.2" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="333.3">Solicitudes procesadas por el</tspan><tspan x="333.3" dy="15.2">sistema, por mes</tspan></text><rect x="598.7" y="907.7" width="261.3" height="137.9" rx="8" fill="#ece2f7" stroke="#aa8cce" stroke-width="1.4"/><text x="612.7" y="929.7" font-size="13" fill="#43206e" font-weight="700" text-anchor="start"><tspan x="612.7">Deriva de desempeño</tspan></text><text x="612.7" y="958.9" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="612.7">Variación del resultado en el</tspan><tspan x="612.7" dy="15.2">conjunto de evaluación entre</tspan><tspan x="612.7" dy="15.2">periodos</tspan></text><rect x="40.0" y="1059.6" width="261.3" height="174.9" rx="8" fill="#ece2f7" stroke="#aa8cce" stroke-width="1.4"/><text x="54.0" y="1081.6" font-size="13" fill="#43206e" font-weight="700" text-anchor="start"><tspan x="54.0">Incidentes de suplantación</tspan><tspan x="54.0" dy="17.2">contenidos</tspan></text><text x="54.0" y="1127.9" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Incidentes con retiro o reporte</tspan><tspan x="54.0" dy="15.2">confirmado dentro de 48 horas</tspan></text><line x1="54.0" y1="1164.3" x2="287.3" y2="1164.3" stroke="#6d39ac" stroke-width="2"/><text x="54.0" y="1182.3" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="54.0">Incidentes de suplantación</tspan><tspan x="54.0" dy="15.2">detectados</tspan></text><text x="54.0" y="1226.6" font-size="10.5" fill="#7b8794" font-weight="400" text-anchor="start"><tspan x="54.0">Ventana: trimestral</tspan></text><text x="40" y="1268.4800000000005" font-size="11.5" fill="#6d39ac" font-weight="700" letter-spacing="1.4">FRONTERA DE APLICACIÓN</text><rect x="40" y="1278.5" width="820" height="65.0" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.4"/><polygon points="70,1295.9800000000005 52,1324.9800000000005 88,1324.9800000000005" fill="#c2410c"/><text x="70" y="1321.9800000000005" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">!</text><text x="106" y="1302.5" font-size="12.5" fill="#7c2d12" font-weight="400" text-anchor="start"><tspan x="106">Ningún conjunto de evaluación cubre todos los casos posibles. Los guardarraíles y el monitoreo son</tspan><tspan x="106" dy="16.5">necesarios precisamente porque la evaluación previa es incompleta.</tspan></text><text x="40" y="1371.4800000000005" font-size="11.5" fill="#6d39ac" font-weight="700" letter-spacing="1.4">ERROR FRECUENTE Y SU CORRECCIÓN</text><rect x="40" y="1381.5" width="380.0" height="77.0" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/><text x="54" y="1403.5" font-size="11" fill="#b91c1c" font-weight="700" text-anchor="start"><tspan x="54">Síntoma</tspan></text><text x="54" y="1421.5" font-size="12.5" fill="#7f1d1d" font-weight="400" text-anchor="start"><tspan x="54">Desplegar sin conjunto de evaluación ni umbral</tspan></text><line x1="426.0" y1="1420.0" x2="469.0" y2="1420.0" stroke="#6d39ac" stroke-width="2.6" stroke-linecap="round"/><polygon points="474.0,1420.0 465.9,1423.9 465.9,1416.1" fill="#6d39ac"/><rect x="480.0" y="1381.5" width="380.0" height="77.0" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.4"/><text x="494.0" y="1403.5" font-size="11" fill="#15803d" font-weight="700" text-anchor="start"><tspan x="494.0">Corrección</tspan></text><text x="494.0" y="1421.5" font-size="12.5" fill="#14532d" font-weight="400" text-anchor="start"><tspan x="494.0">Construye casos representativos con respuesta</tspan><tspan x="494.0" dy="16.5">esperada y define el umbral antes del despliegue.</tspan></text></svg>