<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 959" width="900" height="959" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif"><title id="t">Modelo mental · Anclaje</title><desc id="d">Modelo mental de la clase 10.05: Anclaje. Método en 5 pasos; 4 conceptos; 3 señales de medición.</desc><rect x="0" y="0" width="900" height="959" rx="14" fill="#ffffff"/><rect x="0" y="0" width="900" height="64" rx="14" fill="#2d6e20"/><rect x="0" y="40" width="900" height="24" fill="#2d6e20"/><text x="40" y="28" font-size="12" fill="#c3e5bc" font-weight="700" letter-spacing="1.6">MODELO MENTAL · CLASE 10.05 · PARTE 10</text><text x="40" y="52" font-size="21" fill="#ffffff" font-weight="700">Anclaje</text><text x="40" y="84" font-size="11.5" fill="#4cac39" font-weight="700" letter-spacing="1.4">MÉTODO PASO A PASO</text><line x1="450.0" y1="94.0" x2="450.0" y2="300.5" stroke="#97ce8c" stroke-width="3" stroke-linecap="round"/><line x1="450.0" y1="129.5" x2="406.0" y2="129.5" stroke="#97ce8c" stroke-width="2"/><rect x="56.0" y="100" width="350" height="59.0" rx="10" fill="#e6f7e2" stroke="#97ce8c" stroke-width="1.4"/><text x="70.0" y="122" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="70.0">Decidir si conviene anclar primero según</tspan><tspan x="70.0" dy="16.5">información disponible</tspan></text><circle cx="450.0" cy="129.5" r="15" fill="#2d6e20"/><text x="450.0" y="134.0" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><line x1="450.0" y1="159.2" x2="494.0" y2="159.2" stroke="#97ce8c" stroke-width="2"/><rect x="494.0" y="138" width="350" height="42.5" rx="10" fill="#e6f7e2" stroke="#97ce8c" stroke-width="1.4"/><text x="508.0" y="160" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="508.0">Preparar el ancla con su justificación</tspan></text><circle cx="450.0" cy="159.2" r="15" fill="#2d6e20"/><text x="450.0" y="163.8" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><line x1="450.0" y1="205.5" x2="406.0" y2="205.5" stroke="#97ce8c" stroke-width="2"/><rect x="56.0" y="176" width="350" height="59.0" rx="10" fill="#e6f7e2" stroke="#97ce8c" stroke-width="1.4"/><text x="70.0" y="198" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="70.0">Ante un ancla extrema, no contraofertar de</tspan><tspan x="70.0" dy="16.5">inmediato</tspan></text><circle cx="450.0" cy="205.5" r="15" fill="#2d6e20"/><text x="450.0" y="210.0" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><line x1="450.0" y1="235.2" x2="494.0" y2="235.2" stroke="#97ce8c" stroke-width="2"/><rect x="494.0" y="214" width="350" height="42.5" rx="10" fill="#e6f7e2" stroke="#97ce8c" stroke-width="1.4"/><text x="508.0" y="236" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="508.0">Reencuadrar con criterios objetivos</tspan></text><circle cx="450.0" cy="235.2" r="15" fill="#2d6e20"/><text x="450.0" y="239.8" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">4</text><line x1="450.0" y1="273.2" x2="406.0" y2="273.2" stroke="#97ce8c" stroke-width="2"/><rect x="56.0" y="252" width="350" height="42.5" rx="10" fill="#e6f7e2" stroke="#97ce8c" stroke-width="1.4"/><text x="70.0" y="274" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="70.0">Registrar el efecto del anclaje en el resultado</tspan></text><circle cx="450.0" cy="273.2" r="15" fill="#2d6e20"/><text x="450.0" y="277.8" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">5</text><text x="40" y="336.5" font-size="11.5" fill="#4cac39" font-weight="700" letter-spacing="1.4">CONCEPTOS Y DÓNDE ACTÚAN EN EL MÉTODO</text><rect x="40.0" y="350.5" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#97ce8c" stroke-width="1.4"/><rect x="40.0" y="358.5" width="5" height="62.2" rx="2" fill="#4cac39"/><text x="56.0" y="372.5" font-size="13.5" fill="#2d6e20" font-weight="700" text-anchor="start"><tspan x="56.0">Ancla</tspan></text><text x="56.0" y="392.3" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Primera cifra o condición que fija el marco de referencia</tspan><tspan x="56.0" dy="15.2">de la negociación</tspan></text><rect x="379.0" y="358.5" width="54" height="20" rx="10" fill="#c3e5bc" stroke="#97ce8c" stroke-width="1"/><text x="406.0" y="372.5" font-size="11" fill="#2d6e20" font-weight="700" text-anchor="middle">↔ 1, 2, 3, 5</text><rect x="459.0" y="350.5" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#97ce8c" stroke-width="1.4"/><rect x="459.0" y="358.5" width="5" height="62.2" rx="2" fill="#4cac39"/><text x="475.0" y="372.5" font-size="13.5" fill="#2d6e20" font-weight="700" text-anchor="start"><tspan x="475.0">Ancla extrema</tspan></text><text x="475.0" y="392.3" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Propuesta inicial deliberadamente alejada de lo razonable</tspan></text><rect x="798.0" y="358.5" width="54" height="20" rx="10" fill="#c3e5bc" stroke="#97ce8c" stroke-width="1"/><text x="825.0" y="372.5" font-size="11" fill="#2d6e20" font-weight="700" text-anchor="middle">↔ 1, 2, 3, 5</text><rect x="40.0" y="442.7" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#97ce8c" stroke-width="1.4"/><rect x="40.0" y="450.7" width="5" height="62.2" rx="2" fill="#4cac39"/><text x="56.0" y="464.7" font-size="13.5" fill="#2d6e20" font-weight="700" text-anchor="start"><tspan x="56.0">Reencuadre</tspan></text><text x="56.0" y="484.5" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Reconducción de la conversación hacia criterios objetivos</tspan><tspan x="56.0" dy="15.2">en lugar de responder al ancla</tspan></text><rect x="379.0" y="450.7" width="54" height="20" rx="10" fill="#c3e5bc" stroke="#97ce8c" stroke-width="1"/><text x="406.0" y="464.7" font-size="11" fill="#2d6e20" font-weight="700" text-anchor="middle">↔ 4</text><rect x="459.0" y="442.7" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#97ce8c" stroke-width="1.4"/><rect x="459.0" y="450.7" width="5" height="62.2" rx="2" fill="#4cac39"/><text x="475.0" y="464.7" font-size="13.5" fill="#2d6e20" font-weight="700" text-anchor="start"><tspan x="475.0">Rango justificado</tspan></text><text x="475.0" y="484.5" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Propuesta acompañada de la razón que la sostiene</tspan></text><rect x="798.0" y="450.7" width="54" height="20" rx="10" fill="#c3e5bc" stroke="#97ce8c" stroke-width="1"/><text x="825.0" y="464.7" font-size="11" fill="#2d6e20" font-weight="700" text-anchor="middle">↔ 2</text><text x="40" y="552.86" font-size="11.5" fill="#4cac39" font-weight="700" letter-spacing="1.4">QUÉ SE MIDE: NUMERADOR SOBRE DENOMINADOR</text><rect x="40.0" y="566.9" width="261.3" height="131.0" rx="8" fill="#e6f7e2" stroke="#97ce8c" stroke-width="1.4"/><text x="54.0" y="588.9" font-size="13" fill="#2d6e20" font-weight="700" text-anchor="start"><tspan x="54.0">Diferencia entre ancla y cierre</tspan></text><text x="54.0" y="618.0" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Distancia porcentual entre la</tspan><tspan x="54.0" dy="15.2">primera cifra y el acuerdo final</tspan></text><rect x="319.3" y="566.9" width="261.3" height="131.0" rx="8" fill="#e6f7e2" stroke="#97ce8c" stroke-width="1.4"/><text x="333.3" y="588.9" font-size="13" fill="#2d6e20" font-weight="700" text-anchor="start"><tspan x="333.3">Frecuencia de anclaje propio</tspan></text><text x="333.3" y="618.0" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="333.3">Negociaciones donde la empresa fijó</tspan><tspan x="333.3" dy="15.2">la primera cifra</tspan></text><line x1="333.3" y1="654.4" x2="566.7" y2="654.4" stroke="#4cac39" stroke-width="2"/><text x="333.3" y="672.4" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="333.3">Negociaciones realizadas</tspan></text><rect x="598.7" y="566.9" width="261.3" height="131.0" rx="8" fill="#e6f7e2" stroke="#97ce8c" stroke-width="1.4"/><text x="612.7" y="588.9" font-size="13" fill="#2d6e20" font-weight="700" text-anchor="start"><tspan x="612.7">Resultado por estrategia de</tspan><tspan x="612.7" dy="17.2">anclaje</tspan></text><text x="612.7" y="635.2" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="612.7">Precio efectivo promedio de cierre,</tspan><tspan x="612.7" dy="15.2">comparado entre negociaciones donde</tspan><tspan x="612.7" dy="15.2">ancló la empresa y donde ancló la</tspan><tspan x="612.7" dy="15.2">contraparte</tspan></text><text x="40" y="731.9000000000001" font-size="11.5" fill="#4cac39" font-weight="700" letter-spacing="1.4">FRONTERA DE APLICACIÓN</text><rect x="40" y="741.9" width="820" height="65.0" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.4"/><polygon points="70,759.4000000000001 52,788.4000000000001 88,788.4000000000001" fill="#c2410c"/><text x="70" y="785.4000000000001" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">!</text><text x="106" y="765.9" font-size="12.5" fill="#7c2d12" font-weight="400" text-anchor="start"><tspan x="106">Un ancla extrema propia puede terminar la negociación o dañar la relación de largo plazo. La agresividad</tspan><tspan x="106" dy="16.5">debe calibrarse según el valor de la relación futura.</tspan></text><text x="40" y="834.9000000000001" font-size="11.5" fill="#4cac39" font-weight="700" letter-spacing="1.4">ERROR FRECUENTE Y SU CORRECCIÓN</text><rect x="40" y="844.9" width="380.0" height="77.0" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/><text x="54" y="866.9" font-size="11" fill="#b91c1c" font-weight="700" text-anchor="start"><tspan x="54">Síntoma</tspan></text><text x="54" y="884.9" font-size="12.5" fill="#7f1d1d" font-weight="400" text-anchor="start"><tspan x="54">Contraofertar de inmediato ante un ancla extrema</tspan></text><line x1="426.0" y1="883.4" x2="469.0" y2="883.4" stroke="#4cac39" stroke-width="2.6" stroke-linecap="round"/><polygon points="474.0,883.4 465.9,887.3 465.9,879.5" fill="#4cac39"/><rect x="480.0" y="844.9" width="380.0" height="77.0" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.4"/><text x="494.0" y="866.9" font-size="11" fill="#15803d" font-weight="700" text-anchor="start"><tspan x="494.0">Corrección</tspan></text><text x="494.0" y="884.9" font-size="12.5" fill="#14532d" font-weight="400" text-anchor="start"><tspan x="494.0">Reencuadra primero con criterios objetivos y pide</tspan><tspan x="494.0" dy="16.5">la justificación de la cifra recibida.</tspan></text></svg>