<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1292" width="900" height="1292" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif"><title id="t">Modelo mental · Reporte al directorio</title><desc id="d">Modelo mental de la clase 23.13: Reporte al directorio. Método en 5 pasos; 8 conceptos; 4 señales de medición.</desc><rect x="0" y="0" width="900" height="1292" rx="14" fill="#ffffff"/><rect x="0" y="0" width="900" height="64" rx="14" fill="#6e2120"/><rect x="0" y="40" width="900" height="24" fill="#6e2120"/><text x="40" y="28" font-size="12" fill="#e5bdbc" font-weight="700" letter-spacing="1.6">MODELO MENTAL · CLASE 23.13 · PARTE 23</text><text x="40" y="52" font-size="21" fill="#ffffff" font-weight="700">Reporte al directorio</text><text x="40" y="84" font-size="11.5" fill="#ac3b39" font-weight="700" letter-spacing="1.4">MÉTODO PASO A PASO</text><line x1="450.0" y1="94.0" x2="450.0" y2="300.5" stroke="#ce8d8c" stroke-width="3" stroke-linecap="round"/><line x1="450.0" y1="121.2" x2="406.0" y2="121.2" stroke="#ce8d8c" stroke-width="2"/><rect x="56.0" y="100" width="350" height="42.5" rx="10" fill="#f7e2e2" stroke="#ce8d8c" stroke-width="1.4"/><text x="70.0" y="122" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="70.0">Presentar resultado frente a plan con contexto</tspan></text><circle cx="450.0" cy="121.2" r="15" fill="#6e2120"/><text x="450.0" y="125.8" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><line x1="450.0" y1="159.2" x2="494.0" y2="159.2" stroke="#ce8d8c" stroke-width="2"/><rect x="494.0" y="138" width="350" height="42.5" rx="10" fill="#f7e2e2" stroke="#ce8d8c" stroke-width="1.4"/><text x="508.0" y="160" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="508.0">Explicar las causas principales del desvío</tspan></text><circle cx="450.0" cy="159.2" r="15" fill="#6e2120"/><text x="450.0" y="163.8" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><line x1="450.0" y1="205.5" x2="406.0" y2="205.5" stroke="#ce8d8c" stroke-width="2"/><rect x="56.0" y="176" width="350" height="59.0" rx="10" fill="#f7e2e2" stroke="#ce8d8c" stroke-width="1.4"/><text x="70.0" y="198" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="70.0">Declarar los riesgos antes de que se</tspan><tspan x="70.0" dy="16.5">materialicen</tspan></text><circle cx="450.0" cy="205.5" r="15" fill="#6e2120"/><text x="450.0" y="210.0" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><line x1="450.0" y1="243.5" x2="494.0" y2="243.5" stroke="#ce8d8c" stroke-width="2"/><rect x="494.0" y="214" width="350" height="59.0" rx="10" fill="#f7e2e2" stroke="#ce8d8c" stroke-width="1.4"/><text x="508.0" y="236" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="508.0">Solicitar explícitamente las decisiones que</tspan><tspan x="508.0" dy="16.5">requieren aprobación</tspan></text><circle cx="450.0" cy="243.5" r="15" fill="#6e2120"/><text x="450.0" y="248.0" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">4</text><line x1="450.0" y1="273.2" x2="406.0" y2="273.2" stroke="#ce8d8c" stroke-width="2"/><rect x="56.0" y="252" width="350" height="42.5" rx="10" fill="#f7e2e2" stroke="#ce8d8c" stroke-width="1.4"/><text x="70.0" y="274" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="70.0">Registrar los acuerdos y hacer seguimiento</tspan></text><circle cx="450.0" cy="273.2" r="15" fill="#6e2120"/><text x="450.0" y="277.8" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">5</text><text x="40" y="336.5" font-size="11.5" fill="#ac3b39" font-weight="700" letter-spacing="1.4">CONCEPTOS Y DÓNDE ACTÚAN EN EL MÉTODO</text><rect x="40.0" y="350.5" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#ce8d8c" stroke-width="1.4"/><rect x="40.0" y="358.5" width="5" height="62.2" rx="2" fill="#ac3b39"/><text x="56.0" y="372.5" font-size="13.5" fill="#6e2120" font-weight="700" text-anchor="start"><tspan x="56.0">Resultado frente a plan</tspan></text><text x="56.0" y="392.3" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Comparación del desempeño con el compromiso previo</tspan></text><rect x="379.0" y="358.5" width="54" height="20" rx="10" fill="#e5bdbc" stroke="#ce8d8c" stroke-width="1"/><text x="406.0" y="372.5" font-size="11" fill="#6e2120" font-weight="700" text-anchor="middle">↔ 1</text><rect x="459.0" y="350.5" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#ce8d8c" stroke-width="1.4"/><rect x="459.0" y="358.5" width="5" height="62.2" rx="2" fill="#ac3b39"/><text x="475.0" y="372.5" font-size="13.5" fill="#6e2120" font-weight="700" text-anchor="start"><tspan x="475.0">Causa del desvío</tspan></text><text x="475.0" y="392.3" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Explicación verificable de la diferencia entre lo</tspan><tspan x="475.0" dy="15.2">planificado y lo logrado</tspan></text><rect x="798.0" y="358.5" width="54" height="20" rx="10" fill="#e5bdbc" stroke="#ce8d8c" stroke-width="1"/><text x="825.0" y="372.5" font-size="11" fill="#6e2120" font-weight="700" text-anchor="middle">↔ 2</text><rect x="40.0" y="442.7" width="401.0" height="63.0" rx="8" fill="#ffffff" stroke="#ce8d8c" stroke-width="1.4"/><rect x="40.0" y="450.7" width="5" height="47.0" rx="2" fill="#ac3b39"/><text x="56.0" y="464.7" font-size="13.5" fill="#6e2120" font-weight="700" text-anchor="start"><tspan x="56.0">Decisión que requiere aprobación</tspan></text><text x="56.0" y="484.5" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Asunto que excede la autoridad de la gerencia</tspan></text><rect x="379.0" y="450.7" width="54" height="20" rx="10" fill="#e5bdbc" stroke="#ce8d8c" stroke-width="1"/><text x="406.0" y="464.7" font-size="11" fill="#6e2120" font-weight="700" text-anchor="middle">↔ 4</text><rect x="459.0" y="442.7" width="401.0" height="63.0" rx="8" fill="#ffffff" stroke="#ce8d8c" stroke-width="1.4"/><rect x="459.0" y="450.7" width="5" height="47.0" rx="2" fill="#ac3b39"/><text x="475.0" y="464.7" font-size="13.5" fill="#6e2120" font-weight="700" text-anchor="start"><tspan x="475.0">Transparencia sobre riesgos</tspan></text><text x="475.0" y="484.5" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Declaración anticipada de los problemas relevantes</tspan></text><rect x="798.0" y="450.7" width="54" height="20" rx="10" fill="#e5bdbc" stroke="#ce8d8c" stroke-width="1"/><text x="825.0" y="464.7" font-size="11" fill="#6e2120" font-weight="700" text-anchor="middle">↔ 3</text><rect x="40.0" y="519.7" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#ce8d8c" stroke-width="1.4"/><rect x="40.0" y="527.7" width="5" height="62.2" rx="2" fill="#ac3b39"/><text x="56.0" y="541.7" font-size="13.5" fill="#6e2120" font-weight="700" text-anchor="start"><tspan x="56.0">Parte interesada</tspan></text><text x="56.0" y="561.5" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Persona o grupo que puede afectar o ser afectado por las</tspan><tspan x="56.0" dy="15.2">decisiones de la organización</tspan></text><rect x="459.0" y="519.7" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#ce8d8c" stroke-width="1.4"/><rect x="459.0" y="527.7" width="5" height="62.2" rx="2" fill="#ac3b39"/><text x="475.0" y="541.7" font-size="13.5" fill="#6e2120" font-weight="700" text-anchor="start"><tspan x="475.0">Prominencia</tspan></text><text x="475.0" y="561.5" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Grado de atención que merece una parte interesada según su</tspan><tspan x="475.0" dy="15.2">poder, legitimidad y urgencia</tspan></text><rect x="40.0" y="611.9" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#ce8d8c" stroke-width="1.4"/><rect x="40.0" y="619.9" width="5" height="62.2" rx="2" fill="#ac3b39"/><text x="56.0" y="633.9" font-size="13.5" fill="#6e2120" font-weight="700" text-anchor="start"><tspan x="56.0">Asuntos públicos</tspan></text><text x="56.0" y="653.7" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Relación de la organización con autoridades, reguladores y</tspan><tspan x="56.0" dy="15.2">políticas que afectan su operación</tspan></text><rect x="459.0" y="611.9" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#ce8d8c" stroke-width="1.4"/><rect x="459.0" y="619.9" width="5" height="62.2" rx="2" fill="#ac3b39"/><text x="475.0" y="633.9" font-size="13.5" fill="#6e2120" font-weight="700" text-anchor="start"><tspan x="475.0">Gestión de controversias</tspan></text><text x="475.0" y="653.7" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Identificación temprana de temas que pueden transformarse</tspan><tspan x="475.0" dy="15.2">en conflicto público y decisión sobre su tratamiento</tspan></text><text x="40" y="722.0400000000002" font-size="11.5" fill="#ac3b39" font-weight="700" letter-spacing="1.4">QUÉ SE MIDE: NUMERADOR SOBRE DENOMINADOR</text><rect x="40.0" y="736.0" width="261.3" height="120.7" rx="8" fill="#f7e2e2" stroke="#ce8d8c" stroke-width="1.4"/><text x="54.0" y="758.0" font-size="13" fill="#6e2120" font-weight="700" text-anchor="start"><tspan x="54.0">Anticipación de riesgos</tspan></text><text x="54.0" y="787.2" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Riesgos reportados antes de</tspan><tspan x="54.0" dy="15.2">materializarse</tspan></text><line x1="54.0" y1="823.6" x2="287.3" y2="823.6" stroke="#ac3b39" stroke-width="2"/><text x="54.0" y="841.6" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="54.0">Riesgos materializados</tspan></text><rect x="319.3" y="736.0" width="261.3" height="120.7" rx="8" fill="#f7e2e2" stroke="#ce8d8c" stroke-width="1.4"/><text x="333.3" y="758.0" font-size="13" fill="#6e2120" font-weight="700" text-anchor="start"><tspan x="333.3">Decisiones resueltas en sesión</tspan></text><text x="333.3" y="787.2" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="333.3">Decisiones solicitadas y resueltas</tspan></text><line x1="333.3" y1="808.4" x2="566.7" y2="808.4" stroke="#ac3b39" stroke-width="2"/><text x="333.3" y="826.4" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="333.3">Decisiones presentadas</tspan></text><rect x="598.7" y="736.0" width="261.3" height="120.7" rx="8" fill="#f7e2e2" stroke="#ce8d8c" stroke-width="1.4"/><text x="612.7" y="758.0" font-size="13" fill="#6e2120" font-weight="700" text-anchor="start"><tspan x="612.7">Consistencia entre reportes</tspan></text><text x="612.7" y="787.2" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="612.7">Coherencia de las cifras entre</tspan><tspan x="612.7" dy="15.2">sesiones sucesivas</tspan></text><rect x="40.0" y="870.7" width="261.3" height="159.7" rx="8" fill="#f7e2e2" stroke="#ce8d8c" stroke-width="1.4"/><text x="54.0" y="892.7" font-size="13" fill="#6e2120" font-weight="700" text-anchor="start"><tspan x="54.0">Temas emergentes con posición</tspan><tspan x="54.0" dy="17.2">definida</tspan></text><text x="54.0" y="939.1" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Temas priorizados con posición y</tspan><tspan x="54.0" dy="15.2">responsable</tspan></text><line x1="54.0" y1="975.4" x2="287.3" y2="975.4" stroke="#ac3b39" stroke-width="2"/><text x="54.0" y="993.4" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="54.0">Temas priorizados</tspan></text><text x="54.0" y="1022.6" font-size="10.5" fill="#7b8794" font-weight="400" text-anchor="start"><tspan x="54.0">Ventana: trimestral</tspan></text><text x="40" y="1064.4600000000003" font-size="11.5" fill="#ac3b39" font-weight="700" letter-spacing="1.4">FRONTERA DE APLICACIÓN</text><rect x="40" y="1074.5" width="820" height="65.0" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.4"/><polygon points="70,1091.9600000000003 52,1120.9600000000003 88,1120.9600000000003" fill="#c2410c"/><text x="70" y="1117.9600000000003" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">!</text><text x="106" y="1098.5" font-size="12.5" fill="#7c2d12" font-weight="400" text-anchor="start"><tspan x="106">Un reporte exhaustivo consume el tiempo del directorio en detalle operativo. La selección es parte del</tspan><tspan x="106" dy="16.5">trabajo de dirección.</tspan></text><text x="40" y="1167.4600000000003" font-size="11.5" fill="#ac3b39" font-weight="700" letter-spacing="1.4">ERROR FRECUENTE Y SU CORRECCIÓN</text><rect x="40" y="1177.5" width="380.0" height="77.0" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/><text x="54" y="1199.5" font-size="11" fill="#b91c1c" font-weight="700" text-anchor="start"><tspan x="54">Síntoma</tspan></text><text x="54" y="1217.5" font-size="12.5" fill="#7f1d1d" font-weight="400" text-anchor="start"><tspan x="54">Reportar un riesgo cuando ya se materializó</tspan></text><line x1="426.0" y1="1216.0" x2="469.0" y2="1216.0" stroke="#ac3b39" stroke-width="2.6" stroke-linecap="round"/><polygon points="474.0,1216.0 465.9,1219.9 465.9,1212.0" fill="#ac3b39"/><rect x="480.0" y="1177.5" width="380.0" height="77.0" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.4"/><text x="494.0" y="1199.5" font-size="11" fill="#15803d" font-weight="700" text-anchor="start"><tspan x="494.0">Corrección</tspan></text><text x="494.0" y="1217.5" font-size="12.5" fill="#14532d" font-weight="400" text-anchor="start"><tspan x="494.0">Declara los riesgos relevantes en el reporte</tspan><tspan x="494.0" dy="16.5">anterior a su posible materialización.</tspan></text></svg>