<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 886" width="900" height="886" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif"><title id="t">Modelo mental · Valor de vida del cliente</title><desc id="d">Modelo mental de la clase 20.04: Valor de vida del cliente. Método en 5 pasos; 4 conceptos; 3 señales de medición.</desc><rect x="0" y="0" width="900" height="886" rx="14" fill="#ffffff"/><rect x="0" y="0" width="900" height="64" rx="14" fill="#203a6e"/><rect x="0" y="40" width="900" height="24" fill="#203a6e"/><text x="40" y="28" font-size="12" fill="#bccae5" font-weight="700" letter-spacing="1.6">MODELO MENTAL · CLASE 20.04 · PARTE 20</text><text x="40" y="52" font-size="21" fill="#ffffff" font-weight="700">Valor de vida del cliente</text><text x="40" y="84" font-size="11.5" fill="#395fac" font-weight="700" letter-spacing="1.4">MÉTODO PASO A PASO</text><rect x="40.0" y="100" width="246.7" height="75.5" rx="10" fill="#e2e9f7" stroke="#8ca2ce" stroke-width="1.4"/><text x="54.0" y="122" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Calcular el margen de</tspan><tspan x="54.0" dy="16.5">contribución con costos</tspan><tspan x="54.0" dy="16.5">completos</tspan></text><circle cx="42.0" cy="102.0" r="14" fill="#203a6e"/><text x="42.0" y="106.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><rect x="326.7" y="100" width="246.7" height="75.5" rx="10" fill="#e2e9f7" stroke="#8ca2ce" stroke-width="1.4"/><text x="340.7" y="122" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="340.7">Estimar permanencia desde curvas</tspan><tspan x="340.7" dy="16.5">de retención por cohorte</tspan></text><circle cx="328.7" cy="102.0" r="14" fill="#203a6e"/><text x="328.7" y="106.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><rect x="613.3" y="100" width="246.7" height="75.5" rx="10" fill="#e2e9f7" stroke="#8ca2ce" stroke-width="1.4"/><text x="627.3" y="122" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="627.3">Incorporar expansión y</tspan><tspan x="627.3" dy="16.5">contracción observadas</tspan></text><circle cx="615.3" cy="102.0" r="14" fill="#203a6e"/><text x="615.3" y="106.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><rect x="613.3" y="213.5" width="246.7" height="59.0" rx="10" fill="#e2e9f7" stroke="#8ca2ce" stroke-width="1.4"/><text x="627.3" y="235.5" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="627.3">Aplicar tasa de descuento y</tspan><tspan x="627.3" dy="16.5">declarar supuestos</tspan></text><circle cx="615.3" cy="215.5" r="14" fill="#203a6e"/><text x="615.3" y="220.0" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">4</text><rect x="326.7" y="213.5" width="246.7" height="59.0" rx="10" fill="#e2e9f7" stroke="#8ca2ce" stroke-width="1.4"/><text x="340.7" y="235.5" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="340.7">Presentar el resultado como</tspan><tspan x="340.7" dy="16.5">rango y no como cifra única</tspan></text><circle cx="328.7" cy="215.5" r="14" fill="#203a6e"/><text x="328.7" y="220.0" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">5</text><line x1="289.7" y1="137.8" x2="318.7" y2="137.8" stroke="#395fac" stroke-width="2.2" stroke-linecap="round"/><polygon points="323.7,137.8 315.6,141.7 315.6,133.8" fill="#395fac"/><line x1="576.3" y1="137.8" x2="605.3" y2="137.8" stroke="#395fac" stroke-width="2.2" stroke-linecap="round"/><polygon points="610.3,137.8 602.2,141.7 602.2,133.8" fill="#395fac"/><line x1="736.7" y1="177.5" x2="736.7" y2="205.5" stroke="#395fac" stroke-width="2.2" stroke-linecap="round"/><polygon points="736.7,210.5 732.8,202.4 740.6,202.4" fill="#395fac"/><line x1="610.3" y1="243.0" x2="581.3" y2="243.0" stroke="#395fac" stroke-width="2.2" stroke-linecap="round"/><polygon points="576.3,243.0 584.4,239.1 584.4,246.9" fill="#395fac"/><text x="40" y="310.5" font-size="11.5" fill="#395fac" font-weight="700" letter-spacing="1.4">CONCEPTOS Y DÓNDE ACTÚAN EN EL MÉTODO</text><rect x="40.0" y="324.5" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#8ca2ce" stroke-width="1.4"/><rect x="40.0" y="332.5" width="5" height="62.2" rx="2" fill="#395fac"/><text x="56.0" y="346.5" font-size="13.5" fill="#203a6e" font-weight="700" text-anchor="start"><tspan x="56.0">Margen de contribución del cliente</tspan></text><text x="56.0" y="366.3" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Ingreso menos costos variables de servirlo, por periodo</tspan></text><rect x="379.0" y="332.5" width="54" height="20" rx="10" fill="#bccae5" stroke="#8ca2ce" stroke-width="1"/><text x="406.0" y="346.5" font-size="11" fill="#203a6e" font-weight="700" text-anchor="middle">↔ 1, 3</text><rect x="459.0" y="324.5" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#8ca2ce" stroke-width="1.4"/><rect x="459.0" y="332.5" width="5" height="62.2" rx="2" fill="#395fac"/><text x="475.0" y="346.5" font-size="13.5" fill="#203a6e" font-weight="700" text-anchor="start"><tspan x="475.0">Permanencia esperada</tspan></text><text x="475.0" y="366.3" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Duración estimada de la relación, derivada de curvas de</tspan><tspan x="475.0" dy="15.2">retención</tspan></text><rect x="798.0" y="332.5" width="54" height="20" rx="10" fill="#bccae5" stroke="#8ca2ce" stroke-width="1"/><text x="825.0" y="346.5" font-size="11" fill="#203a6e" font-weight="700" text-anchor="middle">↔ 2</text><rect x="40.0" y="416.7" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#8ca2ce" stroke-width="1.4"/><rect x="40.0" y="424.7" width="5" height="62.2" rx="2" fill="#395fac"/><text x="56.0" y="438.7" font-size="13.5" fill="#203a6e" font-weight="700" text-anchor="start"><tspan x="56.0">Heterogeneidad</tspan></text><text x="56.0" y="458.5" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Diferencia sustantiva de valor entre clientes del mismo</tspan><tspan x="56.0" dy="15.2">segmento aparente</tspan></text><rect x="459.0" y="416.7" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#8ca2ce" stroke-width="1.4"/><rect x="459.0" y="424.7" width="5" height="62.2" rx="2" fill="#395fac"/><text x="475.0" y="438.7" font-size="13.5" fill="#203a6e" font-weight="700" text-anchor="start"><tspan x="475.0">Tasa de descuento</tspan></text><text x="475.0" y="458.5" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Ajuste que refleja el valor temporal del dinero en la</tspan><tspan x="475.0" dy="15.2">proyección</tspan></text><rect x="798.0" y="424.7" width="54" height="20" rx="10" fill="#bccae5" stroke="#8ca2ce" stroke-width="1"/><text x="825.0" y="438.7" font-size="11" fill="#203a6e" font-weight="700" text-anchor="middle">↔ 4</text><text x="40" y="526.86" font-size="11.5" fill="#395fac" font-weight="700" letter-spacing="1.4">QUÉ SE MIDE: NUMERADOR SOBRE DENOMINADOR</text><rect x="40.0" y="540.9" width="261.3" height="83.5" rx="8" fill="#e2e9f7" stroke="#8ca2ce" stroke-width="1.4"/><text x="54.0" y="562.9" font-size="13" fill="#203a6e" font-weight="700" text-anchor="start"><tspan x="54.0">Valor de vida por segmento</tspan></text><text x="54.0" y="592.0" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Margen acumulado esperado, por</tspan><tspan x="54.0" dy="15.2">segmento y cohorte</tspan></text><rect x="319.3" y="540.9" width="261.3" height="83.5" rx="8" fill="#e2e9f7" stroke="#8ca2ce" stroke-width="1.4"/><text x="333.3" y="562.9" font-size="13" fill="#203a6e" font-weight="700" text-anchor="start"><tspan x="333.3">Dispersión dentro del segmento</tspan></text><text x="333.3" y="592.0" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="333.3">Diferencia entre percentiles de</tspan><tspan x="333.3" dy="15.2">valor dentro del mismo segmento</tspan></text><rect x="598.7" y="540.9" width="261.3" height="83.5" rx="8" fill="#e2e9f7" stroke="#8ca2ce" stroke-width="1.4"/><text x="612.7" y="562.9" font-size="13" fill="#203a6e" font-weight="700" text-anchor="start"><tspan x="612.7">Sensibilidad a la retención</tspan></text><text x="612.7" y="592.0" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="612.7">Variación del valor de vida ante un</tspan><tspan x="612.7" dy="15.2">cambio de un punto en retención</tspan></text><text x="40" y="658.38" font-size="11.5" fill="#395fac" font-weight="700" letter-spacing="1.4">FRONTERA DE APLICACIÓN</text><rect x="40" y="668.4" width="820" height="65.0" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.4"/><polygon points="70,685.88 52,714.88 88,714.88" fill="#c2410c"/><text x="70" y="711.88" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">!</text><text x="106" y="692.4" font-size="12.5" fill="#7c2d12" font-weight="400" text-anchor="start"><tspan x="106">Con cohortes jóvenes, la proyección tiene error alto. Presentarla como cifra única induce decisiones de</tspan><tspan x="106" dy="16.5">inversión sobre una precisión inexistente.</tspan></text><text x="40" y="761.38" font-size="11.5" fill="#395fac" font-weight="700" letter-spacing="1.4">ERROR FRECUENTE Y SU CORRECCIÓN</text><rect x="40" y="771.4" width="380.0" height="77.0" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/><text x="54" y="793.4" font-size="11" fill="#b91c1c" font-weight="700" text-anchor="start"><tspan x="54">Síntoma</tspan></text><text x="54" y="811.4" font-size="12.5" fill="#7f1d1d" font-weight="400" text-anchor="start"><tspan x="54">Proyectar con retención constante</tspan></text><line x1="426.0" y1="809.9" x2="469.0" y2="809.9" stroke="#395fac" stroke-width="2.6" stroke-linecap="round"/><polygon points="474.0,809.9 465.9,813.8 465.9,806.0" fill="#395fac"/><rect x="480.0" y="771.4" width="380.0" height="77.0" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.4"/><text x="494.0" y="793.4" font-size="11" fill="#15803d" font-weight="700" text-anchor="start"><tspan x="494.0">Corrección</tspan></text><text x="494.0" y="811.4" font-size="12.5" fill="#14532d" font-weight="400" text-anchor="start"><tspan x="494.0">Deriva la permanencia de curvas por cohorte y</tspan><tspan x="494.0" dy="16.5">presenta el resultado como rango.</tspan></text></svg>