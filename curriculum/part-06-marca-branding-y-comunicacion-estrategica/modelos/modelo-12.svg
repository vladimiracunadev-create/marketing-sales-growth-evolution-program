<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1425" width="900" height="1425" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif"><title id="t">Modelo mental · Coherencia omnicanal</title><desc id="d">Modelo mental de la clase 06.12: Coherencia omnicanal. Método en 5 pasos; 4 conceptos; 3 señales de medición.</desc><rect x="0" y="0" width="900" height="1425" rx="14" fill="#ffffff"/><rect x="0" y="0" width="900" height="64" rx="14" fill="#57206e"/><rect x="0" y="40" width="900" height="24" fill="#57206e"/><text x="40" y="28" font-size="12" fill="#d9bce5" font-weight="700" letter-spacing="1.6">MODELO MENTAL · CLASE 06.12 · PARTE 06</text><text x="40" y="52" font-size="21" fill="#ffffff" font-weight="700">Coherencia omnicanal</text><text x="40" y="84" font-size="11.5" fill="#8939ac" font-weight="700" letter-spacing="1.4">MÉTODO PASO A PASO</text><ellipse cx="450.0" cy="429.6" rx="330.0" ry="269.4" fill="none" stroke="#ba8cce" stroke-width="2" stroke-dasharray="3 8" stroke-linecap="round"/><polygon points="653.4,217.3 636.1,213.3 641.7,204.0" fill="#8939ac"/><polygon points="759.8,523.1 761.0,505.4 771.1,509.4" fill="#8939ac"/><polygon points="439.0,699.0 455.9,693.5 455.9,704.4" fill="#8939ac"/><polygon points="132.1,502.6 143.4,516.3 133.3,520.3" fill="#8939ac"/><polygon points="265.5,206.1 253.7,219.3 248.2,210.1" fill="#8939ac"/><circle cx="450.0" cy="429.6" r="100.0" fill="#d9bce5" stroke="#ba8cce" stroke-width="1.6"/><text x="450.0" y="421.8" font-size="15" fill="#57206e" font-weight="700" text-anchor="middle"><tspan x="450.0">Coherencia</tspan><tspan x="450.0" dy="19.8">omnicanal</tspan></text><rect x="361.0" y="122.5" width="178" height="75.5" rx="10" fill="#f1e2f7" stroke="#ba8cce" stroke-width="1.4"/><text x="373.0" y="144.5" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="373.0">Auditar precio,</tspan><tspan x="373.0" dy="16.5">condiciones y mensajes</tspan><tspan x="373.0" dy="16.5">en todos los canales</tspan></text><circle cx="363.0" cy="124.5" r="14" fill="#57206e"/><text x="363.0" y="129.0" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><rect x="674.8" y="308.6" width="178" height="75.5" rx="10" fill="#f1e2f7" stroke="#ba8cce" stroke-width="1.4"/><text x="686.8" y="330.6" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="686.8">Identificar la fuente</tspan><tspan x="686.8" dy="16.5">única de verdad para</tspan><tspan x="686.8" dy="16.5">cada dato</tspan></text><circle cx="676.8" cy="310.6" r="14" fill="#57206e"/><text x="676.8" y="315.1" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><rect x="555.0" y="609.8" width="178" height="75.5" rx="10" fill="#f1e2f7" stroke="#ba8cce" stroke-width="1.4"/><text x="567.0" y="631.8" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="567.0">Corregir las</tspan><tspan x="567.0" dy="16.5">incoherencias visibles</tspan><tspan x="567.0" dy="16.5">primero</tspan></text><circle cx="557.0" cy="611.8" r="14" fill="#57206e"/><text x="557.0" y="616.3" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><rect x="167.0" y="593.3" width="178" height="108.5" rx="10" fill="#f1e2f7" stroke="#ba8cce" stroke-width="1.4"/><text x="179.0" y="615.3" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="179.0">Definir reglas de</tspan><tspan x="179.0" dy="16.5">gobierno por canal,</tspan><tspan x="179.0" dy="16.5">incluida la conducta</tspan><tspan x="179.0" dy="16.5">física y digital del</tspan><tspan x="179.0" dy="16.5">personaje</tspan></text><circle cx="169.0" cy="595.3" r="14" fill="#57206e"/><text x="169.0" y="599.8" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">4</text><rect x="47.2" y="316.9" width="178" height="59.0" rx="10" fill="#f1e2f7" stroke="#ba8cce" stroke-width="1.4"/><text x="59.2" y="338.9" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="59.2">Medir la recurrencia</tspan><tspan x="59.2" dy="16.5">de incoherencias</tspan></text><circle cx="49.2" cy="318.9" r="14" fill="#57206e"/><text x="49.2" y="323.4" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">5</text><text x="40" y="795.2" font-size="11.5" fill="#8939ac" font-weight="700" letter-spacing="1.4">CONCEPTOS Y DÓNDE ACTÚAN EN EL MÉTODO</text><rect x="40.0" y="809.2" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#ba8cce" stroke-width="1.4"/><rect x="40.0" y="817.2" width="5" height="62.2" rx="2" fill="#8939ac"/><text x="56.0" y="831.2" font-size="13.5" fill="#57206e" font-weight="700" text-anchor="start"><tspan x="56.0">Fuente única de verdad</tspan></text><text x="56.0" y="851.0" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Sistema donde reside el dato válido de precio, condición y</tspan><tspan x="56.0" dy="15.2">estado del cliente</tspan></text><rect x="379.0" y="817.2" width="54" height="20" rx="10" fill="#d9bce5" stroke="#ba8cce" stroke-width="1"/><text x="406.0" y="831.2" font-size="11" fill="#57206e" font-weight="700" text-anchor="middle">↔ 1, 2</text><rect x="459.0" y="809.2" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#ba8cce" stroke-width="1.4"/><rect x="459.0" y="817.2" width="5" height="62.2" rx="2" fill="#8939ac"/><text x="475.0" y="831.2" font-size="13.5" fill="#57206e" font-weight="700" text-anchor="start"><tspan x="475.0">Continuidad de la conversación</tspan></text><text x="475.0" y="851.0" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Capacidad de retomar la interacción sin que el cliente</tspan><tspan x="475.0" dy="15.2">repita información</tspan></text><rect x="40.0" y="901.4" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#ba8cce" stroke-width="1.4"/><rect x="40.0" y="909.4" width="5" height="62.2" rx="2" fill="#8939ac"/><text x="56.0" y="923.4" font-size="13.5" fill="#57206e" font-weight="700" text-anchor="start"><tspan x="56.0">Incoherencia visible</tspan></text><text x="56.0" y="943.2" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Diferencia entre canales que el cliente puede detectar y</tspan><tspan x="56.0" dy="15.2">que erosiona la confianza</tspan></text><rect x="379.0" y="909.4" width="54" height="20" rx="10" fill="#d9bce5" stroke="#ba8cce" stroke-width="1"/><text x="406.0" y="923.4" font-size="11" fill="#57206e" font-weight="700" text-anchor="middle">↔ 3, 5</text><rect x="459.0" y="901.4" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#ba8cce" stroke-width="1.4"/><rect x="459.0" y="909.4" width="5" height="62.2" rx="2" fill="#8939ac"/><text x="475.0" y="923.4" font-size="13.5" fill="#57206e" font-weight="700" text-anchor="start"><tspan x="475.0">Gobierno de canal</tspan></text><text x="475.0" y="943.2" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Reglas que definen qué puede prometerse y modificarse en</tspan><tspan x="475.0" dy="15.2">cada canal</tspan></text><rect x="798.0" y="909.4" width="54" height="20" rx="10" fill="#d9bce5" stroke="#ba8cce" stroke-width="1"/><text x="825.0" y="923.4" font-size="11" fill="#57206e" font-weight="700" text-anchor="middle">↔ 1, 4</text><text x="40" y="1011.5600000000002" font-size="11.5" fill="#8939ac" font-weight="700" letter-spacing="1.4">QUÉ SE MIDE: NUMERADOR SOBRE DENOMINADOR</text><rect x="40.0" y="1025.6" width="261.3" height="137.9" rx="8" fill="#f1e2f7" stroke="#ba8cce" stroke-width="1.4"/><text x="54.0" y="1047.6" font-size="13" fill="#57206e" font-weight="700" text-anchor="start"><tspan x="54.0">Incoherencias detectadas por</tspan><tspan x="54.0" dy="17.2">auditoría</tspan></text><text x="54.0" y="1093.9" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Diferencias encontradas entre</tspan><tspan x="54.0" dy="15.2">canales</tspan></text><line x1="54.0" y1="1130.2" x2="287.3" y2="1130.2" stroke="#8939ac" stroke-width="2"/><text x="54.0" y="1148.2" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="54.0">Elementos auditados</tspan></text><rect x="319.3" y="1025.6" width="261.3" height="137.9" rx="8" fill="#f1e2f7" stroke="#ba8cce" stroke-width="1.4"/><text x="333.3" y="1047.6" font-size="13" fill="#57206e" font-weight="700" text-anchor="start"><tspan x="333.3">Consultas por información</tspan><tspan x="333.3" dy="17.2">contradictoria</tspan></text><text x="333.3" y="1093.9" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="333.3">Contactos de clientes citando</tspan><tspan x="333.3" dy="15.2">contradicciones</tspan></text><line x1="333.3" y1="1130.2" x2="566.7" y2="1130.2" stroke="#8939ac" stroke-width="2"/><text x="333.3" y="1148.2" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="333.3">Contactos totales</tspan></text><rect x="598.7" y="1025.6" width="261.3" height="137.9" rx="8" fill="#f1e2f7" stroke="#ba8cce" stroke-width="1.4"/><text x="612.7" y="1047.6" font-size="13" fill="#57206e" font-weight="700" text-anchor="start"><tspan x="612.7">Tiempo de propagación de un</tspan><tspan x="612.7" dy="17.2">cambio</tspan></text><text x="612.7" y="1093.9" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="612.7">Horas entre un cambio de precio o</tspan><tspan x="612.7" dy="15.2">condición y su reflejo en todos los</tspan><tspan x="612.7" dy="15.2">canales</tspan></text><text x="40" y="1197.42" font-size="11.5" fill="#8939ac" font-weight="700" letter-spacing="1.4">FRONTERA DE APLICACIÓN</text><rect x="40" y="1207.4" width="820" height="65.0" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.4"/><polygon points="70,1224.92 52,1253.92 88,1253.92" fill="#c2410c"/><text x="70" y="1250.92" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">!</text><text x="106" y="1231.4" font-size="12.5" fill="#7c2d12" font-weight="400" text-anchor="start"><tspan x="106">La coherencia no obliga a precios idénticos: los canales tienen costos distintos. Lo que exige es que las</tspan><tspan x="106" dy="16.5">diferencias sean explicables y no arbitrarias.</tspan></text><text x="40" y="1300.42" font-size="11.5" fill="#8939ac" font-weight="700" letter-spacing="1.4">ERROR FRECUENTE Y SU CORRECCIÓN</text><rect x="40" y="1310.4" width="380.0" height="77.0" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/><text x="54" y="1332.4" font-size="11" fill="#b91c1c" font-weight="700" text-anchor="start"><tspan x="54">Síntoma</tspan></text><text x="54" y="1350.4" font-size="12.5" fill="#7f1d1d" font-weight="400" text-anchor="start"><tspan x="54">Corregir la comunicación sin corregir el dato</tspan></text><line x1="426.0" y1="1348.9" x2="469.0" y2="1348.9" stroke="#8939ac" stroke-width="2.6" stroke-linecap="round"/><polygon points="474.0,1348.9 465.9,1352.8 465.9,1345.0" fill="#8939ac"/><rect x="480.0" y="1310.4" width="380.0" height="77.0" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.4"/><text x="494.0" y="1332.4" font-size="11" fill="#15803d" font-weight="700" text-anchor="start"><tspan x="494.0">Corrección</tspan></text><text x="494.0" y="1350.4" font-size="12.5" fill="#14532d" font-weight="400" text-anchor="start"><tspan x="494.0">Establece la fuente única de verdad antes de</tspan><tspan x="494.0" dy="16.5">rediseñar mensajes.</tspan></text></svg>