<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 907" width="900" height="907" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif"><title id="t">Modelo mental · El precio como decisión estratégica</title><desc id="d">Modelo mental de la clase 07.01: El precio como decisión estratégica. Método en 5 pasos; 4 conceptos; 3 señales de medición.</desc><rect x="0" y="0" width="900" height="907" rx="14" fill="#ffffff"/><rect x="0" y="0" width="900" height="64" rx="14" fill="#6e2048"/><rect x="0" y="40" width="900" height="24" fill="#6e2048"/><text x="40" y="28" font-size="12" fill="#e5bcd1" font-weight="700" letter-spacing="1.6">MODELO MENTAL · CLASE 07.01 · PARTE 07</text><text x="40" y="52" font-size="21" fill="#ffffff" font-weight="700">El precio como decisión estratégica</text><text x="40" y="84" font-size="11.5" fill="#ac3974" font-weight="700" letter-spacing="1.4">MÉTODO PASO A PASO</text><rect x="40.0" y="100" width="246.7" height="59.0" rx="10" fill="#f7e2ed" stroke="#ce8cae" stroke-width="1.4"/><text x="54.0" y="122" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Calcular el efecto de ±5 % de</tspan><tspan x="54.0" dy="16.5">precio sobre la utilidad</tspan></text><circle cx="42.0" cy="102.0" r="14" fill="#6e2048"/><text x="42.0" y="106.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><rect x="326.7" y="100" width="246.7" height="59.0" rx="10" fill="#f7e2ed" stroke="#ce8cae" stroke-width="1.4"/><text x="340.7" y="122" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="340.7">Documentar la política vigente y</tspan><tspan x="340.7" dy="16.5">sus excepciones reales</tspan></text><circle cx="328.7" cy="102.0" r="14" fill="#6e2048"/><text x="328.7" y="106.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><rect x="613.3" y="100" width="246.7" height="59.0" rx="10" fill="#f7e2ed" stroke="#ce8cae" stroke-width="1.4"/><text x="627.3" y="122" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="627.3">Verificar si la métrica de cobro</tspan><tspan x="627.3" dy="16.5">sigue al valor entregado</tspan></text><circle cx="615.3" cy="102.0" r="14" fill="#6e2048"/><text x="615.3" y="106.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><rect x="613.3" y="197.0" width="246.7" height="59.0" rx="10" fill="#f7e2ed" stroke="#ce8cae" stroke-width="1.4"/><text x="627.3" y="219.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="627.3">Estimar disposición a pagar con</tspan><tspan x="627.3" dy="16.5">evidencia</tspan></text><circle cx="615.3" cy="199.0" r="14" fill="#6e2048"/><text x="615.3" y="203.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">4</text><rect x="326.7" y="197.0" width="246.7" height="59.0" rx="10" fill="#f7e2ed" stroke="#ce8cae" stroke-width="1.4"/><text x="340.7" y="219.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="340.7">Definir la decisión de precio y</tspan><tspan x="340.7" dy="16.5">su responsable</tspan></text><circle cx="328.7" cy="199.0" r="14" fill="#6e2048"/><text x="328.7" y="203.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">5</text><line x1="289.7" y1="129.5" x2="318.7" y2="129.5" stroke="#ac3974" stroke-width="2.2" stroke-linecap="round"/><polygon points="323.7,129.5 315.6,133.4 315.6,125.6" fill="#ac3974"/><line x1="576.3" y1="129.5" x2="605.3" y2="129.5" stroke="#ac3974" stroke-width="2.2" stroke-linecap="round"/><polygon points="610.3,129.5 602.2,133.4 602.2,125.6" fill="#ac3974"/><line x1="736.7" y1="161.0" x2="736.7" y2="189.0" stroke="#ac3974" stroke-width="2.2" stroke-linecap="round"/><polygon points="736.7,194.0 732.8,185.9 740.6,185.9" fill="#ac3974"/><line x1="610.3" y1="226.5" x2="581.3" y2="226.5" stroke="#ac3974" stroke-width="2.2" stroke-linecap="round"/><polygon points="576.3,226.5 584.4,222.6 584.4,230.4" fill="#ac3974"/><text x="40" y="294.0" font-size="11.5" fill="#ac3974" font-weight="700" letter-spacing="1.4">CONCEPTOS Y DÓNDE ACTÚAN EN EL MÉTODO</text><rect x="40.0" y="308.0" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#ce8cae" stroke-width="1.4"/><rect x="40.0" y="316.0" width="5" height="62.2" rx="2" fill="#ac3974"/><text x="56.0" y="330.0" font-size="13.5" fill="#6e2048" font-weight="700" text-anchor="start"><tspan x="56.0">Apalancamiento del precio</tspan></text><text x="56.0" y="349.8" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Efecto de una variación de precio sobre la utilidad,</tspan><tspan x="56.0" dy="15.2">comparado con volumen y costo</tspan></text><rect x="379.0" y="316.0" width="54" height="20" rx="10" fill="#e5bcd1" stroke="#ce8cae" stroke-width="1"/><text x="406.0" y="330.0" font-size="11" fill="#6e2048" font-weight="700" text-anchor="middle">↔ 1, 5</text><rect x="459.0" y="308.0" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#ce8cae" stroke-width="1.4"/><rect x="459.0" y="316.0" width="5" height="62.2" rx="2" fill="#ac3974"/><text x="475.0" y="330.0" font-size="13.5" fill="#6e2048" font-weight="700" text-anchor="start"><tspan x="475.0">Política de precios</tspan></text><text x="475.0" y="349.8" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Conjunto de reglas escritas sobre listas, descuentos,</tspan><tspan x="475.0" dy="15.2">excepciones y autoridad</tspan></text><rect x="798.0" y="316.0" width="54" height="20" rx="10" fill="#e5bcd1" stroke="#ce8cae" stroke-width="1"/><text x="825.0" y="330.0" font-size="11" fill="#6e2048" font-weight="700" text-anchor="middle">↔ 1, 2, 5</text><rect x="40.0" y="400.2" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#ce8cae" stroke-width="1.4"/><rect x="40.0" y="408.2" width="5" height="62.2" rx="2" fill="#ac3974"/><text x="56.0" y="422.2" font-size="13.5" fill="#6e2048" font-weight="700" text-anchor="start"><tspan x="56.0">Métrica de cobro</tspan></text><text x="56.0" y="442.0" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Unidad sobre la que se cobra: usuario, local, transacción,</tspan><tspan x="56.0" dy="15.2">volumen o resultado</tspan></text><rect x="379.0" y="408.2" width="54" height="20" rx="10" fill="#e5bcd1" stroke="#ce8cae" stroke-width="1"/><text x="406.0" y="422.2" font-size="11" fill="#6e2048" font-weight="700" text-anchor="middle">↔ 3</text><rect x="459.0" y="400.2" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#ce8cae" stroke-width="1.4"/><rect x="459.0" y="408.2" width="5" height="62.2" rx="2" fill="#ac3974"/><text x="475.0" y="422.2" font-size="13.5" fill="#6e2048" font-weight="700" text-anchor="start"><tspan x="475.0">Disposición a pagar</tspan></text><text x="475.0" y="442.0" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Monto máximo que un cliente pagaría antes de elegir otra</tspan><tspan x="475.0" dy="15.2">alternativa</tspan></text><rect x="798.0" y="408.2" width="54" height="20" rx="10" fill="#e5bcd1" stroke="#ce8cae" stroke-width="1"/><text x="825.0" y="422.2" font-size="11" fill="#6e2048" font-weight="700" text-anchor="middle">↔ 4</text><text x="40" y="510.36" font-size="11.5" fill="#ac3974" font-weight="700" letter-spacing="1.4">QUÉ SE MIDE: NUMERADOR SOBRE DENOMINADOR</text><rect x="40.0" y="524.4" width="261.3" height="120.7" rx="8" fill="#f7e2ed" stroke="#ce8cae" stroke-width="1.4"/><text x="54.0" y="546.4" font-size="13" fill="#6e2048" font-weight="700" text-anchor="start"><tspan x="54.0">Precio efectivo promedio</tspan></text><text x="54.0" y="575.5" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Ingreso del periodo</tspan></text><line x1="54.0" y1="596.7" x2="287.3" y2="596.7" stroke="#ac3974" stroke-width="2"/><text x="54.0" y="614.7" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="54.0">Unidades vendidas, comparado con el</tspan><tspan x="54.0" dy="15.2">precio de lista</tspan></text><rect x="319.3" y="524.4" width="261.3" height="120.7" rx="8" fill="#f7e2ed" stroke="#ce8cae" stroke-width="1.4"/><text x="333.3" y="546.4" font-size="13" fill="#6e2048" font-weight="700" text-anchor="start"><tspan x="333.3">Elasticidad observada</tspan></text><text x="333.3" y="575.5" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="333.3">Variación porcentual de unidades</tspan><tspan x="333.3" dy="15.2">ante una variación porcentual de</tspan><tspan x="333.3" dy="15.2">precio, en periodos comparables</tspan></text><rect x="598.7" y="524.4" width="261.3" height="120.7" rx="8" fill="#f7e2ed" stroke="#ce8cae" stroke-width="1.4"/><text x="612.7" y="546.4" font-size="13" fill="#6e2048" font-weight="700" text-anchor="start"><tspan x="612.7">Dispersión de descuentos</tspan></text><text x="612.7" y="575.5" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="612.7">Desviación estándar del descuento</tspan><tspan x="612.7" dy="15.2">otorgado, por vendedor y por</tspan><tspan x="612.7" dy="15.2">segmento</tspan></text><text x="40" y="679.06" font-size="11.5" fill="#ac3974" font-weight="700" letter-spacing="1.4">FRONTERA DE APLICACIÓN</text><rect x="40" y="689.1" width="820" height="65.0" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.4"/><polygon points="70,706.56 52,735.56 88,735.56" fill="#c2410c"/><text x="70" y="732.56" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">!</text><text x="106" y="713.1" font-size="12.5" fill="#7c2d12" font-weight="400" text-anchor="start"><tspan x="106">El apalancamiento del precio supone que el volumen no cae de forma proporcional. En categorías muy</tspan><tspan x="106" dy="16.5">elásticas o con competidores capaces de sostener pérdidas, ese supuesto puede fallar.</tspan></text><text x="40" y="782.06" font-size="11.5" fill="#ac3974" font-weight="700" letter-spacing="1.4">ERROR FRECUENTE Y SU CORRECCIÓN</text><rect x="40" y="792.1" width="380.0" height="77.0" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/><text x="54" y="814.1" font-size="11" fill="#b91c1c" font-weight="700" text-anchor="start"><tspan x="54">Síntoma</tspan></text><text x="54" y="832.1" font-size="12.5" fill="#7f1d1d" font-weight="400" text-anchor="start"><tspan x="54">Fijar precio por costo más margen</tspan></text><line x1="426.0" y1="830.6" x2="469.0" y2="830.6" stroke="#ac3974" stroke-width="2.6" stroke-linecap="round"/><polygon points="474.0,830.6 465.9,834.5 465.9,826.6" fill="#ac3974"/><rect x="480.0" y="792.1" width="380.0" height="77.0" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.4"/><text x="494.0" y="814.1" font-size="11" fill="#15803d" font-weight="700" text-anchor="start"><tspan x="494.0">Corrección</tspan></text><text x="494.0" y="832.1" font-size="12.5" fill="#14532d" font-weight="400" text-anchor="start"><tspan x="494.0">Estima primero la disposición a pagar del segmento</tspan><tspan x="494.0" dy="16.5">y usa el costo sólo como piso.</tspan></text></svg>