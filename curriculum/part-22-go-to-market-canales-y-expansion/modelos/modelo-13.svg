<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 876" width="900" height="876" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif"><title id="t">Modelo mental · Métricas de go-to-market</title><desc id="d">Modelo mental de la clase 22.13: Métricas de go-to-market. Método en 5 pasos; 4 conceptos; 3 señales de medición.</desc><rect x="0" y="0" width="900" height="876" rx="14" fill="#ffffff"/><rect x="0" y="0" width="900" height="64" rx="14" fill="#6e205c"/><rect x="0" y="40" width="900" height="24" fill="#6e205c"/><text x="40" y="28" font-size="12" fill="#e5bcdc" font-weight="700" letter-spacing="1.6">MODELO MENTAL · CLASE 22.13 · PARTE 22</text><text x="40" y="52" font-size="21" fill="#ffffff" font-weight="700">Métricas de go-to-market</text><text x="40" y="84" font-size="11.5" fill="#ac3991" font-weight="700" letter-spacing="1.4">MÉTODO PASO A PASO</text><rect x="40.0" y="100" width="246.7" height="59.0" rx="10" fill="#f7e2f2" stroke="#ce8cbe" stroke-width="1.4"/><text x="54.0" y="122" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Definir las métricas por</tspan><tspan x="54.0" dy="16.5">movimiento y por canal</tspan></text><circle cx="42.0" cy="102.0" r="14" fill="#6e205c"/><text x="42.0" y="106.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><rect x="326.7" y="100" width="246.7" height="59.0" rx="10" fill="#f7e2f2" stroke="#ce8cbe" stroke-width="1.4"/><text x="340.7" y="122" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="340.7">Medir eficiencia además de</tspan><tspan x="340.7" dy="16.5">crecimiento</tspan></text><circle cx="328.7" cy="102.0" r="14" fill="#6e205c"/><text x="328.7" y="106.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><rect x="613.3" y="100" width="246.7" height="59.0" rx="10" fill="#f7e2f2" stroke="#ce8cbe" stroke-width="1.4"/><text x="627.3" y="122" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="627.3">Comparar la eficiencia entre</tspan><tspan x="627.3" dy="16.5">movimientos</tspan></text><circle cx="615.3" cy="102.0" r="14" fill="#6e205c"/><text x="615.3" y="106.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><rect x="613.3" y="197.0" width="246.7" height="59.0" rx="10" fill="#f7e2f2" stroke="#ce8cbe" stroke-width="1.4"/><text x="627.3" y="219.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="627.3">Identificar dónde la eficiencia</tspan><tspan x="627.3" dy="16.5">se deteriora al escalar</tspan></text><circle cx="615.3" cy="199.0" r="14" fill="#6e205c"/><text x="615.3" y="203.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">4</text><rect x="326.7" y="197.0" width="246.7" height="59.0" rx="10" fill="#f7e2f2" stroke="#ce8cbe" stroke-width="1.4"/><text x="340.7" y="219.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="340.7">Ajustar la asignación según el</tspan><tspan x="340.7" dy="16.5">resultado</tspan></text><circle cx="328.7" cy="199.0" r="14" fill="#6e205c"/><text x="328.7" y="203.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">5</text><line x1="289.7" y1="129.5" x2="318.7" y2="129.5" stroke="#ac3991" stroke-width="2.2" stroke-linecap="round"/><polygon points="323.7,129.5 315.6,133.4 315.6,125.6" fill="#ac3991"/><line x1="576.3" y1="129.5" x2="605.3" y2="129.5" stroke="#ac3991" stroke-width="2.2" stroke-linecap="round"/><polygon points="610.3,129.5 602.2,133.4 602.2,125.6" fill="#ac3991"/><line x1="736.7" y1="161.0" x2="736.7" y2="189.0" stroke="#ac3991" stroke-width="2.2" stroke-linecap="round"/><polygon points="736.7,194.0 732.8,185.9 740.6,185.9" fill="#ac3991"/><line x1="610.3" y1="226.5" x2="581.3" y2="226.5" stroke="#ac3991" stroke-width="2.2" stroke-linecap="round"/><polygon points="576.3,226.5 584.4,222.6 584.4,230.4" fill="#ac3991"/><text x="40" y="294.0" font-size="11.5" fill="#ac3991" font-weight="700" letter-spacing="1.4">CONCEPTOS Y DÓNDE ACTÚAN EN EL MÉTODO</text><rect x="40.0" y="308.0" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#ce8cbe" stroke-width="1.4"/><rect x="40.0" y="316.0" width="5" height="62.2" rx="2" fill="#ac3991"/><text x="56.0" y="330.0" font-size="13.5" fill="#6e205c" font-weight="700" text-anchor="start"><tspan x="56.0">Eficiencia del crecimiento</tspan></text><text x="56.0" y="349.8" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Relación entre el ingreso incremental y el gasto necesario</tspan><tspan x="56.0" dy="15.2">para producirlo</tspan></text><rect x="379.0" y="316.0" width="54" height="20" rx="10" fill="#e5bcdc" stroke="#ce8cbe" stroke-width="1"/><text x="406.0" y="330.0" font-size="11" fill="#6e205c" font-weight="700" text-anchor="middle">↔ 2, 3, 4</text><rect x="459.0" y="308.0" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#ce8cbe" stroke-width="1.4"/><rect x="459.0" y="316.0" width="5" height="62.2" rx="2" fill="#ac3991"/><text x="475.0" y="330.0" font-size="13.5" fill="#6e205c" font-weight="700" text-anchor="start"><tspan x="475.0">Productividad por movimiento</tspan></text><text x="475.0" y="349.8" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Resultado obtenido por unidad de capacidad en cada</tspan><tspan x="475.0" dy="15.2">movimiento comercial</tspan></text><rect x="798.0" y="316.0" width="54" height="20" rx="10" fill="#e5bcdc" stroke="#ce8cbe" stroke-width="1"/><text x="825.0" y="330.0" font-size="11" fill="#6e205c" font-weight="700" text-anchor="middle">↔ 1, 3</text><rect x="40.0" y="400.2" width="401.0" height="63.0" rx="8" fill="#ffffff" stroke="#ce8cbe" stroke-width="1.4"/><rect x="40.0" y="408.2" width="5" height="47.0" rx="2" fill="#ac3991"/><text x="56.0" y="422.2" font-size="13.5" fill="#6e205c" font-weight="700" text-anchor="start"><tspan x="56.0">Contribución por canal</tspan></text><text x="56.0" y="442.0" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Margen que aporta cada canal después de sus costos</tspan></text><rect x="379.0" y="408.2" width="54" height="20" rx="10" fill="#e5bcdc" stroke="#ce8cbe" stroke-width="1"/><text x="406.0" y="422.2" font-size="11" fill="#6e205c" font-weight="700" text-anchor="middle">↔ 1</text><rect x="459.0" y="400.2" width="401.0" height="63.0" rx="8" fill="#ffffff" stroke="#ce8cbe" stroke-width="1.4"/><rect x="459.0" y="408.2" width="5" height="47.0" rx="2" fill="#ac3991"/><text x="475.0" y="422.2" font-size="13.5" fill="#6e205c" font-weight="700" text-anchor="start"><tspan x="475.0">Velocidad de escalamiento</tspan></text><text x="475.0" y="442.0" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Rapidez con que el movimiento puede aumentar su producción</tspan></text><rect x="798.0" y="408.2" width="54" height="20" rx="10" fill="#e5bcdc" stroke="#ce8cbe" stroke-width="1"/><text x="825.0" y="422.2" font-size="11" fill="#6e205c" font-weight="700" text-anchor="middle">↔ 4</text><text x="40" y="495.18" font-size="11.5" fill="#ac3991" font-weight="700" letter-spacing="1.4">QUÉ SE MIDE: NUMERADOR SOBRE DENOMINADOR</text><rect x="40.0" y="509.2" width="261.3" height="105.5" rx="8" fill="#f7e2f2" stroke="#ce8cbe" stroke-width="1.4"/><text x="54.0" y="531.2" font-size="13" fill="#6e205c" font-weight="700" text-anchor="start"><tspan x="54.0">Eficiencia del crecimiento</tspan></text><text x="54.0" y="560.3" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Ingreso incremental del periodo</tspan></text><line x1="54.0" y1="581.5" x2="287.3" y2="581.5" stroke="#ac3991" stroke-width="2"/><text x="54.0" y="599.5" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="54.0">Gasto comercial incremental</tspan></text><rect x="319.3" y="509.2" width="261.3" height="105.5" rx="8" fill="#f7e2f2" stroke="#ce8cbe" stroke-width="1.4"/><text x="333.3" y="531.2" font-size="13" fill="#6e205c" font-weight="700" text-anchor="start"><tspan x="333.3">Periodo de recuperación por</tspan><tspan x="333.3" dy="17.2">movimiento</tspan></text><text x="333.3" y="577.5" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="333.3">Meses hasta recuperar el costo de</tspan><tspan x="333.3" dy="15.2">adquisición, por movimiento</tspan></text><rect x="598.7" y="509.2" width="261.3" height="105.5" rx="8" fill="#f7e2f2" stroke="#ce8cbe" stroke-width="1.4"/><text x="612.7" y="531.2" font-size="13" fill="#6e205c" font-weight="700" text-anchor="start"><tspan x="612.7">Deterioro de eficiencia al</tspan><tspan x="612.7" dy="17.2">escalar</tspan></text><text x="612.7" y="577.5" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="612.7">Variación de la eficiencia entre</tspan><tspan x="612.7" dy="15.2">tramos crecientes de inversión</tspan></text><text x="40" y="648.7" font-size="11.5" fill="#ac3991" font-weight="700" letter-spacing="1.4">FRONTERA DE APLICACIÓN</text><rect x="40" y="658.7" width="820" height="65.0" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.4"/><polygon points="70,676.2 52,705.2 88,705.2" fill="#c2410c"/><text x="70" y="702.2" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">!</text><text x="106" y="682.7" font-size="12.5" fill="#7c2d12" font-weight="400" text-anchor="start"><tspan x="106">En etapas tempranas puede ser racional sacrificar eficiencia para ganar posición. Lo que no es racional es</tspan><tspan x="106" dy="16.5">hacerlo sin declararlo ni medirlo.</tspan></text><text x="40" y="751.7" font-size="11.5" fill="#ac3991" font-weight="700" letter-spacing="1.4">ERROR FRECUENTE Y SU CORRECCIÓN</text><rect x="40" y="761.7" width="380.0" height="77.0" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/><text x="54" y="783.7" font-size="11" fill="#b91c1c" font-weight="700" text-anchor="start"><tspan x="54">Síntoma</tspan></text><text x="54" y="801.7" font-size="12.5" fill="#7f1d1d" font-weight="400" text-anchor="start"><tspan x="54">Reportar crecimiento sin reportar eficiencia</tspan></text><line x1="426.0" y1="800.2" x2="469.0" y2="800.2" stroke="#ac3991" stroke-width="2.6" stroke-linecap="round"/><polygon points="474.0,800.2 465.9,804.1 465.9,796.3" fill="#ac3991"/><rect x="480.0" y="761.7" width="380.0" height="77.0" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.4"/><text x="494.0" y="783.7" font-size="11" fill="#15803d" font-weight="700" text-anchor="start"><tspan x="494.0">Corrección</tspan></text><text x="494.0" y="801.7" font-size="12.5" fill="#14532d" font-weight="400" text-anchor="start"><tspan x="494.0">Presenta el ingreso incremental junto al gasto</tspan><tspan x="494.0" dy="16.5">incremental que lo produjo.</tspan></text></svg>