<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1084" width="900" height="1084" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif"><title id="t">Modelo mental · Creatividades</title><desc id="d">Modelo mental de la clase 14.04: Creatividades. Método en 5 pasos; 4 conceptos; 3 señales de medición.</desc><rect x="0" y="0" width="900" height="1084" rx="14" fill="#ffffff"/><rect x="0" y="0" width="900" height="64" rx="14" fill="#6c206e"/><rect x="0" y="40" width="900" height="24" fill="#6c206e"/><text x="40" y="28" font-size="12" fill="#e4bce5" font-weight="700" letter-spacing="1.6">MODELO MENTAL · CLASE 14.04 · PARTE 14</text><text x="40" y="52" font-size="21" fill="#ffffff" font-weight="700">Creatividades</text><text x="40" y="84" font-size="11.5" fill="#a839ac" font-weight="700" letter-spacing="1.4">MÉTODO PASO A PASO</text><path d="M66.0,159.0 V202.5 H158.5" fill="none" stroke="#a839ac" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="160.5,202.5 151.5,197.5 151.5,207.5" fill="#a839ac"/><path d="M188.5,232.0 V275.5 H281.0" fill="none" stroke="#a839ac" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="283.0,275.5 274.0,270.5 274.0,280.5" fill="#a839ac"/><path d="M311.0,305.0 V348.5 H403.5" fill="none" stroke="#a839ac" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="405.5,348.5 396.5,343.5 396.5,353.5" fill="#a839ac"/><path d="M433.5,378.0 V421.5 H526.0" fill="none" stroke="#a839ac" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="528.0,421.5 519.0,416.5 519.0,426.5" fill="#a839ac"/><rect x="40.0" y="100.0" width="330" height="59.0" rx="10" fill="#f7e2f7" stroke="#cb8cce" stroke-width="1.4"/><text x="54.0" y="122.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Investigar qué importa al destinatario antes</tspan><tspan x="54.0" dy="16.5">de producir</tspan></text><circle cx="42.0" cy="102.0" r="14" fill="#6c206e"/><text x="42.0" y="106.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><rect x="162.5" y="173.0" width="330" height="59.0" rx="10" fill="#f7e2f7" stroke="#cb8cce" stroke-width="1.4"/><text x="176.5" y="195.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="176.5">Definir el concepto y sus variantes</tspan></text><circle cx="164.5" cy="175.0" r="14" fill="#6c206e"/><text x="164.5" y="179.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><rect x="285.0" y="246.0" width="330" height="59.0" rx="10" fill="#f7e2f7" stroke="#cb8cce" stroke-width="1.4"/><text x="299.0" y="268.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="299.0">Incluir activos distintivos de marca</tspan></text><circle cx="287.0" cy="248.0" r="14" fill="#6c206e"/><text x="287.0" y="252.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><rect x="407.5" y="319.0" width="330" height="59.0" rx="10" fill="#f7e2f7" stroke="#cb8cce" stroke-width="1.4"/><text x="421.5" y="341.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="421.5">Monitorear la fatiga por frecuencia de</tspan><tspan x="421.5" dy="16.5">exposición</tspan></text><circle cx="409.5" cy="321.0" r="14" fill="#6c206e"/><text x="409.5" y="325.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">4</text><rect x="530.0" y="392.0" width="330" height="59.0" rx="10" fill="#f7e2f7" stroke="#cb8cce" stroke-width="1.4"/><text x="544.0" y="414.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="544.0">Renovar creatividades antes de la caída de</tspan><tspan x="544.0" dy="16.5">desempeño</tspan></text><circle cx="532.0" cy="394.0" r="14" fill="#6c206e"/><text x="532.0" y="398.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">5</text><text x="40" y="493.0" font-size="11.5" fill="#a839ac" font-weight="700" letter-spacing="1.4">CONCEPTOS Y DÓNDE ACTÚAN EN EL MÉTODO</text><rect x="40.0" y="507.0" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#cb8cce" stroke-width="1.4"/><rect x="40.0" y="515.0" width="5" height="62.2" rx="2" fill="#a839ac"/><text x="56.0" y="529.0" font-size="13.5" fill="#6c206e" font-weight="700" text-anchor="start"><tspan x="56.0">Concepto creativo</tspan></text><text x="56.0" y="548.8" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Idea central que organiza el mensaje y lo hace reconocible</tspan></text><rect x="379.0" y="515.0" width="54" height="20" rx="10" fill="#e4bce5" stroke="#cb8cce" stroke-width="1"/><text x="406.0" y="529.0" font-size="11" fill="#6c206e" font-weight="700" text-anchor="middle">↔ 2, 5</text><rect x="459.0" y="507.0" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#cb8cce" stroke-width="1.4"/><rect x="459.0" y="515.0" width="5" height="62.2" rx="2" fill="#a839ac"/><text x="475.0" y="529.0" font-size="13.5" fill="#6c206e" font-weight="700" text-anchor="start"><tspan x="475.0">Variante</tspan></text><text x="475.0" y="548.8" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Versión que cambia un elemento específico para comparar</tspan><tspan x="475.0" dy="15.2">desempeño</tspan></text><rect x="798.0" y="515.0" width="54" height="20" rx="10" fill="#e4bce5" stroke="#cb8cce" stroke-width="1"/><text x="825.0" y="529.0" font-size="11" fill="#6c206e" font-weight="700" text-anchor="middle">↔ 2</text><rect x="40.0" y="599.2" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#cb8cce" stroke-width="1.4"/><rect x="40.0" y="607.2" width="5" height="62.2" rx="2" fill="#a839ac"/><text x="56.0" y="621.2" font-size="13.5" fill="#6c206e" font-weight="700" text-anchor="start"><tspan x="56.0">Fatiga creativa</tspan></text><text x="56.0" y="641.0" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Caída de desempeño por exposición repetida de la misma</tspan><tspan x="56.0" dy="15.2">pieza</tspan></text><rect x="379.0" y="607.2" width="54" height="20" rx="10" fill="#e4bce5" stroke="#cb8cce" stroke-width="1"/><text x="406.0" y="621.2" font-size="11" fill="#6c206e" font-weight="700" text-anchor="middle">↔ 4, 5</text><rect x="459.0" y="599.2" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#cb8cce" stroke-width="1.4"/><rect x="459.0" y="607.2" width="5" height="62.2" rx="2" fill="#a839ac"/><text x="475.0" y="621.2" font-size="13.5" fill="#6c206e" font-weight="700" text-anchor="start"><tspan x="475.0">Activo distintivo en anuncio</tspan></text><text x="475.0" y="641.0" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Elemento de marca que permite atribuir el anuncio sin leer</tspan><tspan x="475.0" dy="15.2">el nombre</tspan></text><rect x="798.0" y="607.2" width="54" height="20" rx="10" fill="#e4bce5" stroke="#cb8cce" stroke-width="1"/><text x="825.0" y="621.2" font-size="11" fill="#6c206e" font-weight="700" text-anchor="middle">↔ 3</text><text x="40" y="709.3600000000001" font-size="11.5" fill="#a839ac" font-weight="700" letter-spacing="1.4">QUÉ SE MIDE: NUMERADOR SOBRE DENOMINADOR</text><rect x="40.0" y="723.4" width="261.3" height="98.7" rx="8" fill="#f7e2f7" stroke="#cb8cce" stroke-width="1.4"/><text x="54.0" y="745.4" font-size="13" fill="#6c206e" font-weight="700" text-anchor="start"><tspan x="54.0">Desempeño por variante</tspan></text><text x="54.0" y="774.5" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Costo por resultado y tasa de clic,</tspan><tspan x="54.0" dy="15.2">por variante creativa</tspan></text><rect x="319.3" y="723.4" width="261.3" height="98.7" rx="8" fill="#f7e2f7" stroke="#cb8cce" stroke-width="1.4"/><text x="333.3" y="745.4" font-size="13" fill="#6c206e" font-weight="700" text-anchor="start"><tspan x="333.3">Frecuencia de exposición</tspan></text><text x="333.3" y="774.5" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="333.3">Impresiones promedio por persona</tspan><tspan x="333.3" dy="15.2">alcanzada, semanal</tspan></text><rect x="598.7" y="723.4" width="261.3" height="98.7" rx="8" fill="#f7e2f7" stroke="#cb8cce" stroke-width="1.4"/><text x="612.7" y="745.4" font-size="13" fill="#6c206e" font-weight="700" text-anchor="start"><tspan x="612.7">Atribución de marca</tspan></text><text x="612.7" y="774.5" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="612.7">Personas que identifican</tspan><tspan x="612.7" dy="15.2">correctamente la marca del anuncio,</tspan><tspan x="612.7" dy="15.2">en prueba con muestra</tspan></text><text x="40" y="856.0600000000002" font-size="11.5" fill="#a839ac" font-weight="700" letter-spacing="1.4">FRONTERA DE APLICACIÓN</text><rect x="40" y="866.1" width="820" height="65.0" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.4"/><polygon points="70,883.5600000000002 52,912.5600000000002 88,912.5600000000002" fill="#c2410c"/><text x="70" y="909.5600000000002" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">!</text><text x="106" y="890.1" font-size="12.5" fill="#7c2d12" font-weight="400" text-anchor="start"><tspan x="106">Producir muchas variantes tiene un costo. En presupuestos pequeños conviene menos variantes con más</tspan><tspan x="106" dy="16.5">diferencia entre ellas que muchas con diferencias marginales.</tspan></text><text x="40" y="959.0600000000002" font-size="11.5" fill="#a839ac" font-weight="700" letter-spacing="1.4">ERROR FRECUENTE Y SU CORRECCIÓN</text><rect x="40" y="969.1" width="380.0" height="77.0" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/><text x="54" y="991.1" font-size="11" fill="#b91c1c" font-weight="700" text-anchor="start"><tspan x="54">Síntoma</tspan></text><text x="54" y="1009.1" font-size="12.5" fill="#7f1d1d" font-weight="400" text-anchor="start"><tspan x="54">Sostener la misma creatividad hasta que el</tspan><tspan x="54" dy="16.5">resultado se desploma</tspan></text><line x1="426.0" y1="1007.6" x2="469.0" y2="1007.6" stroke="#a839ac" stroke-width="2.6" stroke-linecap="round"/><polygon points="474.0,1007.6 465.9,1011.5 465.9,1003.6" fill="#a839ac"/><rect x="480.0" y="969.1" width="380.0" height="77.0" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.4"/><text x="494.0" y="991.1" font-size="11" fill="#15803d" font-weight="700" text-anchor="start"><tspan x="494.0">Corrección</tspan></text><text x="494.0" y="1009.1" font-size="12.5" fill="#14532d" font-weight="400" text-anchor="start"><tspan x="494.0">Define un umbral de frecuencia y renueva antes de</tspan><tspan x="494.0" dy="16.5">alcanzar la caída de desempeño.</tspan></text></svg>