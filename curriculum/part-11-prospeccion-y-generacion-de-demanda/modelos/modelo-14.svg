<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 950" width="900" height="950" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif"><title id="t">Modelo mental · Sistema de prospección repetible</title><desc id="d">Modelo mental de la clase 11.14: Sistema de prospección repetible. Método en 5 pasos; 4 conceptos; 3 señales de medición.</desc><rect x="0" y="0" width="900" height="950" rx="14" fill="#ffffff"/><rect x="0" y="0" width="900" height="64" rx="14" fill="#206e50"/><rect x="0" y="40" width="900" height="24" fill="#206e50"/><text x="40" y="28" font-size="12" fill="#bce5d5" font-weight="700" letter-spacing="1.6">MODELO MENTAL · CLASE 11.14 · PARTE 11</text><text x="40" y="52" font-size="21" fill="#ffffff" font-weight="700">Sistema de prospección repetible</text><text x="40" y="84" font-size="11.5" fill="#39ac80" font-weight="700" letter-spacing="1.4">MÉTODO PASO A PASO</text><line x1="450.0" y1="94.0" x2="450.0" y2="317.0" stroke="#8cceb5" stroke-width="3" stroke-linecap="round"/><line x1="450.0" y1="121.2" x2="406.0" y2="121.2" stroke="#8cceb5" stroke-width="2"/><rect x="56.0" y="100" width="350" height="42.5" rx="10" fill="#e2f7ef" stroke="#8cceb5" stroke-width="1.4"/><text x="70.0" y="122" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="70.0">Consolidar perfil, fuentes y señales</tspan></text><circle cx="450.0" cy="121.2" r="15" fill="#206e50"/><text x="450.0" y="125.8" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><line x1="450.0" y1="167.5" x2="494.0" y2="167.5" stroke="#8cceb5" stroke-width="2"/><rect x="494.0" y="138" width="350" height="59.0" rx="10" fill="#e2f7ef" stroke="#8cceb5" stroke-width="1.4"/><text x="508.0" y="160" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="508.0">Documentar secuencias y criterios de</tspan><tspan x="508.0" dy="16.5">calificación</tspan></text><circle cx="450.0" cy="167.5" r="15" fill="#206e50"/><text x="450.0" y="172.0" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><line x1="450.0" y1="197.2" x2="406.0" y2="197.2" stroke="#8cceb5" stroke-width="2"/><rect x="56.0" y="176" width="350" height="42.5" rx="10" fill="#e2f7ef" stroke="#8cceb5" stroke-width="1.4"/><text x="70.0" y="198" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="70.0">Calcular la capacidad real del equipo</tspan></text><circle cx="450.0" cy="197.2" r="15" fill="#206e50"/><text x="450.0" y="201.8" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><line x1="450.0" y1="243.5" x2="494.0" y2="243.5" stroke="#8cceb5" stroke-width="2"/><rect x="494.0" y="214" width="350" height="59.0" rx="10" fill="#e2f7ef" stroke="#8cceb5" stroke-width="1.4"/><text x="508.0" y="236" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="508.0">Verificar el cumplimiento normativo de todo el</tspan><tspan x="508.0" dy="16.5">sistema</tspan></text><circle cx="450.0" cy="243.5" r="15" fill="#206e50"/><text x="450.0" y="248.0" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">4</text><line x1="450.0" y1="281.5" x2="406.0" y2="281.5" stroke="#8cceb5" stroke-width="2"/><rect x="56.0" y="252" width="350" height="59.0" rx="10" fill="#e2f7ef" stroke="#8cceb5" stroke-width="1.4"/><text x="70.0" y="274" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="70.0">Medir la relación entre actividad y</tspan><tspan x="70.0" dy="16.5">oportunidades por trimestre</tspan></text><circle cx="450.0" cy="281.5" r="15" fill="#206e50"/><text x="450.0" y="286.0" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">5</text><text x="40" y="353.0" font-size="11.5" fill="#39ac80" font-weight="700" letter-spacing="1.4">CONCEPTOS Y DÓNDE ACTÚAN EN EL MÉTODO</text><rect x="40.0" y="367.0" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#8cceb5" stroke-width="1.4"/><rect x="40.0" y="375.0" width="5" height="62.2" rx="2" fill="#39ac80"/><text x="56.0" y="389.0" font-size="13.5" fill="#206e50" font-weight="700" text-anchor="start"><tspan x="56.0">Sistema de prospección</tspan></text><text x="56.0" y="408.8" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Conjunto documentado de listas, mensajes, cadencias,</tspan><tspan x="56.0" dy="15.2">criterios y métricas</tspan></text><rect x="379.0" y="375.0" width="54" height="20" rx="10" fill="#bce5d5" stroke="#8cceb5" stroke-width="1"/><text x="406.0" y="389.0" font-size="11" fill="#206e50" font-weight="700" text-anchor="middle">↔ 2, 4</text><rect x="459.0" y="367.0" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#8cceb5" stroke-width="1.4"/><rect x="459.0" y="375.0" width="5" height="62.2" rx="2" fill="#39ac80"/><text x="475.0" y="389.0" font-size="13.5" fill="#206e50" font-weight="700" text-anchor="start"><tspan x="475.0">Predictibilidad</tspan></text><text x="475.0" y="408.8" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Capacidad de estimar resultados a partir de un nivel de</tspan><tspan x="475.0" dy="15.2">actividad conocido</tspan></text><rect x="40.0" y="459.2" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#8cceb5" stroke-width="1.4"/><rect x="40.0" y="467.2" width="5" height="62.2" rx="2" fill="#39ac80"/><text x="56.0" y="481.2" font-size="13.5" fill="#206e50" font-weight="700" text-anchor="start"><tspan x="56.0">Capacidad de prospección</tspan></text><text x="56.0" y="501.0" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Volumen de actividad sostenible con el equipo disponible</tspan></text><rect x="379.0" y="467.2" width="54" height="20" rx="10" fill="#bce5d5" stroke="#8cceb5" stroke-width="1"/><text x="406.0" y="481.2" font-size="11" fill="#206e50" font-weight="700" text-anchor="middle">↔ 3</text><rect x="459.0" y="459.2" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#8cceb5" stroke-width="1.4"/><rect x="459.0" y="467.2" width="5" height="62.2" rx="2" fill="#39ac80"/><text x="475.0" y="481.2" font-size="13.5" fill="#206e50" font-weight="700" text-anchor="start"><tspan x="475.0">Cumplimiento normativo del sistema</tspan></text><text x="475.0" y="501.0" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Conformidad de listas, mensajes y registros con la</tspan><tspan x="475.0" dy="15.2">normativa de datos y consumo</tspan></text><rect x="798.0" y="467.2" width="54" height="20" rx="10" fill="#bce5d5" stroke="#8cceb5" stroke-width="1"/><text x="825.0" y="481.2" font-size="11" fill="#206e50" font-weight="700" text-anchor="middle">↔ 4</text><text x="40" y="569.36" font-size="11.5" fill="#39ac80" font-weight="700" letter-spacing="1.4">QUÉ SE MIDE: NUMERADOR SOBRE DENOMINADOR</text><rect x="40.0" y="583.4" width="261.3" height="105.5" rx="8" fill="#e2f7ef" stroke="#8cceb5" stroke-width="1.4"/><text x="54.0" y="605.4" font-size="13" fill="#206e50" font-weight="700" text-anchor="start"><tspan x="54.0">Relación actividad-oportunidades</tspan></text><text x="54.0" y="634.5" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Oportunidades calificadas generadas</tspan></text><line x1="54.0" y1="655.7" x2="287.3" y2="655.7" stroke="#39ac80" stroke-width="2"/><text x="54.0" y="673.7" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="54.0">Contactos de calidad realizados</tspan></text><rect x="319.3" y="583.4" width="261.3" height="105.5" rx="8" fill="#e2f7ef" stroke="#8cceb5" stroke-width="1.4"/><text x="333.3" y="605.4" font-size="13" fill="#206e50" font-weight="700" text-anchor="start"><tspan x="333.3">Estabilidad de la relación</tspan></text><text x="333.3" y="634.5" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="333.3">Variación trimestral de esa</tspan><tspan x="333.3" dy="15.2">relación, por segmento</tspan></text><rect x="598.7" y="583.4" width="261.3" height="105.5" rx="8" fill="#e2f7ef" stroke="#8cceb5" stroke-width="1.4"/><text x="612.7" y="605.4" font-size="13" fill="#206e50" font-weight="700" text-anchor="start"><tspan x="612.7">Cobertura de pipeline</tspan></text><text x="612.7" y="634.5" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="612.7">Valor del pipeline generado</tspan></text><line x1="612.7" y1="655.7" x2="846.0" y2="655.7" stroke="#39ac80" stroke-width="2"/><text x="612.7" y="673.7" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="612.7">La meta del periodo siguiente</tspan></text><text x="40" y="722.88" font-size="11.5" fill="#39ac80" font-weight="700" letter-spacing="1.4">FRONTERA DE APLICACIÓN</text><rect x="40" y="732.9" width="820" height="65.0" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.4"/><polygon points="70,750.38 52,779.38 88,779.38" fill="#c2410c"/><text x="70" y="776.38" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">!</text><text x="106" y="756.9" font-size="12.5" fill="#7c2d12" font-weight="400" text-anchor="start"><tspan x="106">Un sistema predecible en un segmento no se traslada automáticamente a otro: cada segmento tiene</tspan><tspan x="106" dy="16.5">contactabilidad y tasas propias que deben medirse por separado.</tspan></text><text x="40" y="825.88" font-size="11.5" fill="#39ac80" font-weight="700" letter-spacing="1.4">ERROR FRECUENTE Y SU CORRECCIÓN</text><rect x="40" y="835.9" width="380.0" height="77.0" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/><text x="54" y="857.9" font-size="11" fill="#b91c1c" font-weight="700" text-anchor="start"><tspan x="54">Síntoma</tspan></text><text x="54" y="875.9" font-size="12.5" fill="#7f1d1d" font-weight="400" text-anchor="start"><tspan x="54">Fijar metas de pipeline sin conocer la capacidad de</tspan><tspan x="54" dy="16.5">prospección</tspan></text><line x1="426.0" y1="874.4" x2="469.0" y2="874.4" stroke="#39ac80" stroke-width="2.6" stroke-linecap="round"/><polygon points="474.0,874.4 465.9,878.3 465.9,870.5" fill="#39ac80"/><rect x="480.0" y="835.9" width="380.0" height="77.0" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.4"/><text x="494.0" y="857.9" font-size="11" fill="#15803d" font-weight="700" text-anchor="start"><tspan x="494.0">Corrección</tspan></text><text x="494.0" y="875.9" font-size="12.5" fill="#14532d" font-weight="400" text-anchor="start"><tspan x="494.0">Calcula la relación actividad-oportunidades por</tspan><tspan x="494.0" dy="16.5">segmento antes de comprometer una meta.</tspan></text></svg>