U CORRECCIÓN</text><rect x="40" y="1227.3" width="380.0" height="77.0" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/><text x="54" y="1249.3" font-size="11" fill="#b91c1c" font-weight="700" text-anchor="start"><tspan x="54">Síntoma</tspan></text><text x="54" y="1267.3" font-size="12.5" fill="#7f1d1d" font-weight="400" text-anchor="start"><tspan x="54">Convertir el indicador en meta de compensación</tspan></text><line x1="426.0" y1="1265.8" x2="469.0" y2="1265.8" stroke="#39ac44" stroke-width="2.6" stroke-linecap="round"/><polygon points="474.0,1265.8 465.9,1269.7 465.9,1261.8" fill="#39ac44"/><rect x="480.0" y="1227.3" width="380.0" height="77.0" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.4"/><text x="494.0" y="1249.3" font-size="11" fill="#15803d" font-weight="700" text-anchor="start"><tspan x="494.0">Corrección</tspan></text><text x="494.0" y="1267.3" font-size="12.5" fill="#14532d" font-weight="400" text-anchor="start"><tspan x="494.0">Usa el indicador para diagnosticar y actuar; nunca</tspan><tspan x="494.0" dy="16.5">lo vincules a incentivo individual.</tspan></text></svg>