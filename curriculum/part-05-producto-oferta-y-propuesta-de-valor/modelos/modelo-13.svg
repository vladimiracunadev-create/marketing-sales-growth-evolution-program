<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1353" width="900" height="1353" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif"><title id="t">Modelo mental · Prueba de concepto comercial</title><desc id="d">Modelo mental de la clase 05.13: Prueba de concepto comercial. Método en 5 pasos; 8 conceptos; 4 señales de medición.</desc><rect x="0" y="0" width="900" height="1353" rx="14" fill="#ffffff"/><rect x="0" y="0" width="900" height="64" rx="14" fill="#20266e"/><rect x="0" y="40" width="900" height="24" fill="#20266e"/><text x="40" y="28" font-size="12" fill="#bcbfe5" font-weight="700" letter-spacing="1.6">MODELO MENTAL · CLASE 05.13 · PARTE 05</text><text x="40" y="52" font-size="21" fill="#ffffff" font-weight="700">Prueba de concepto comercial</text><text x="40" y="84" font-size="11.5" fill="#3942ac" font-weight="700" letter-spacing="1.4">MÉTODO PASO A PASO</text><line x1="450.0" y1="94.0" x2="450.0" y2="300.5" stroke="#8c92ce" stroke-width="3" stroke-linecap="round"/><line x1="450.0" y1="121.2" x2="406.0" y2="121.2" stroke="#8c92ce" stroke-width="2"/><rect x="56.0" y="100" width="350" height="42.5" rx="10" fill="#e2e4f7" stroke="#8c92ce" stroke-width="1.4"/><text x="70.0" y="122" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="70.0">Definir la hipótesis comercial a probar</tspan></text><circle cx="450.0" cy="121.2" r="15" fill="#20266e"/><text x="450.0" y="125.8" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><line x1="450.0" y1="159.2" x2="494.0" y2="159.2" stroke="#8c92ce" stroke-width="2"/><rect x="494.0" y="138" width="350" height="42.5" rx="10" fill="#e2e4f7" stroke="#8c92ce" stroke-width="1.4"/><text x="508.0" y="160" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="508.0">Preparar propuesta y precio reales</tspan></text><circle cx="450.0" cy="159.2" r="15" fill="#20266e"/><text x="450.0" y="163.8" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><line x1="450.0" y1="205.5" x2="406.0" y2="205.5" stroke="#8c92ce" stroke-width="2"/><rect x="56.0" y="176" width="350" height="59.0" rx="10" fill="#e2e4f7" stroke="#8c92ce" stroke-width="1.4"/><text x="70.0" y="198" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="70.0">Ejecutar con un grupo acotado y declarar el</tspan><tspan x="70.0" dy="16.5">estado del producto</tspan></text><circle cx="450.0" cy="205.5" r="15" fill="#20266e"/><text x="450.0" y="210.0" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><line x1="450.0" y1="235.2" x2="494.0" y2="235.2" stroke="#8c92ce" stroke-width="2"/><rect x="494.0" y="214" width="350" height="42.5" rx="10" fill="#e2e4f7" stroke="#8c92ce" stroke-width="1.4"/><text x="508.0" y="236" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="508.0">Registrar decisiones, objeciones y tiempos</tspan></text><circle cx="450.0" cy="235.2" r="15" fill="#20266e"/><text x="450.0" y="239.8" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">4</text><line x1="450.0" y1="273.2" x2="406.0" y2="273.2" stroke="#8c92ce" stroke-width="2"/><rect x="56.0" y="252" width="350" height="42.5" rx="10" fill="#e2e4f7" stroke="#8c92ce" stroke-width="1.4"/><text x="70.0" y="274" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="70.0">Decidir avanzar o abandonar con criterio previo</tspan></text><circle cx="450.0" cy="273.2" r="15" fill="#20266e"/><text x="450.0" y="277.8" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">5</text><text x="40" y="336.5" font-size="11.5" fill="#3942ac" font-weight="700" letter-spacing="1.4">CONCEPTOS Y DÓNDE ACTÚAN EN EL MÉTODO</text><rect x="40.0" y="350.5" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#8c92ce" stroke-width="1.4"/><rect x="40.0" y="358.5" width="5" height="62.2" rx="2" fill="#3942ac"/><text x="56.0" y="372.5" font-size="13.5" fill="#20266e" font-weight="700" text-anchor="start"><tspan x="56.0">Prueba con precio real</tspan></text><text x="56.0" y="392.3" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Presentación de la oferta con su precio efectivo para</tspan><tspan x="56.0" dy="15.2">observar decisión genuina</tspan></text><rect x="379.0" y="358.5" width="54" height="20" rx="10" fill="#bcbfe5" stroke="#8c92ce" stroke-width="1"/><text x="406.0" y="372.5" font-size="11" fill="#20266e" font-weight="700" text-anchor="middle">↔ 2</text><rect x="459.0" y="350.5" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#8c92ce" stroke-width="1.4"/><rect x="459.0" y="358.5" width="5" height="62.2" rx="2" fill="#3942ac"/><text x="475.0" y="372.5" font-size="13.5" fill="#20266e" font-weight="700" text-anchor="start"><tspan x="475.0">Compromiso condicionado</tspan></text><text x="475.0" y="392.3" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Acuerdo de compra sujeto a la entrega de una condición</tspan><tspan x="475.0" dy="15.2">futura verificable</tspan></text><rect x="40.0" y="442.7" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#8c92ce" stroke-width="1.4"/><rect x="40.0" y="450.7" width="5" height="62.2" rx="2" fill="#3942ac"/><text x="56.0" y="464.7" font-size="13.5" fill="#20266e" font-weight="700" text-anchor="start"><tspan x="56.0">Aprendizaje de objeciones</tspan></text><text x="56.0" y="484.5" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Registro estructurado de las razones de no avanzar en la</tspan><tspan x="56.0" dy="15.2">prueba</tspan></text><rect x="379.0" y="450.7" width="54" height="20" rx="10" fill="#bcbfe5" stroke="#8c92ce" stroke-width="1"/><text x="406.0" y="464.7" font-size="11" fill="#20266e" font-weight="700" text-anchor="middle">↔ 4</text><rect x="459.0" y="442.7" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#8c92ce" stroke-width="1.4"/><rect x="459.0" y="450.7" width="5" height="62.2" rx="2" fill="#3942ac"/><text x="475.0" y="464.7" font-size="13.5" fill="#20266e" font-weight="700" text-anchor="start"><tspan x="475.0">Transparencia del estado</tspan></text><text x="475.0" y="484.5" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Declaración explícita de qué existe y qué está por</tspan><tspan x="475.0" dy="15.2">construirse</tspan></text><rect x="798.0" y="450.7" width="54" height="20" rx="10" fill="#bcbfe5" stroke="#8c92ce" stroke-width="1"/><text x="825.0" y="464.7" font-size="11" fill="#20266e" font-weight="700" text-anchor="middle">↔ 3</text><rect x="40.0" y="534.9" width="401.0" height="93.4" rx="8" fill="#ffffff" stroke="#8c92ce" stroke-width="1.4"/><rect x="40.0" y="542.9" width="5" height="77.4" rx="2" fill="#3942ac"/><text x="56.0" y="556.9" font-size="13.5" fill="#20266e" font-weight="700" text-anchor="start"><tspan x="56.0">Tipo de innovación</tspan></text><text x="56.0" y="576.7" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Cambio incremental o radical en producto, servicio,</tspan><tspan x="56.0" dy="15.2">proceso o modelo de negocio con novedad y resultado</tspan><tspan x="56.0" dy="15.2">observables</tspan></text><rect x="459.0" y="534.9" width="401.0" height="93.4" rx="8" fill="#ffffff" stroke="#8c92ce" stroke-width="1.4"/><rect x="459.0" y="542.9" width="5" height="77.4" rx="2" fill="#3942ac"/><text x="475.0" y="556.9" font-size="13.5" fill="#20266e" font-weight="700" text-anchor="start"><tspan x="475.0">Deseabilidad–factibilidad–viabilidad</tspan></text><text x="475.0" y="576.7" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Prueba conjunta de valor para personas, posibilidad</tspan><tspan x="475.0" dy="15.2">técnica-operativa y sostenibilidad económica</tspan></text><rect x="40.0" y="642.2" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#8c92ce" stroke-width="1.4"/><rect x="40.0" y="650.2" width="5" height="62.2" rx="2" fill="#3942ac"/><text x="56.0" y="664.2" font-size="13.5" fill="#20266e" font-weight="700" text-anchor="start"><tspan x="56.0">Sesgo del superviviente</tspan></text><text x="56.0" y="684.0" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Error de aprender sólo de iniciativas visibles o exitosas</tspan><tspan x="56.0" dy="15.2">e ignorar abandonos y fracasos</tspan></text><rect x="459.0" y="642.2" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#8c92ce" stroke-width="1.4"/><rect x="459.0" y="650.2" width="5" height="62.2" rx="2" fill="#3942ac"/><text x="475.0" y="664.2" font-size="13.5" fill="#20266e" font-weight="700" text-anchor="start"><tspan x="475.0">Abandono oportuno</tspan></text><text x="475.0" y="684.0" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Decisión previa de detener una iniciativa cuando</tspan><tspan x="475.0" dy="15.2">evidencia, riesgo o costo superan el valor de seguir</tspan></text><rect x="798.0" y="650.2" width="54" height="20" rx="10" fill="#bcbfe5" stroke="#8c92ce" stroke-width="1"/><text x="825.0" y="664.2" font-size="11" fill="#20266e" font-weight="700" text-anchor="middle">↔ 5</text><text x="40" y="752.4000000000001" font-size="11.5" fill="#3942ac" font-weight="700" letter-spacing="1.4">QUÉ SE MIDE: NUMERADOR SOBRE DENOMINADOR</text><rect x="40.0" y="766.4" width="261.3" height="122.7" rx="8" fill="#e2e4f7" stroke="#8c92ce" stroke-width="1.4"/><text x="54.0" y="788.4" font-size="13" fill="#20266e" font-weight="700" text-anchor="start"><tspan x="54.0">Tasa de aceptación con precio</tspan><tspan x="54.0" dy="17.2">real</tspan></text><text x="54.0" y="834.7" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Aceptaciones</tspan></text><line x1="54.0" y1="855.9" x2="287.3" y2="855.9" stroke="#3942ac" stroke-width="2"/><text x="54.0" y="873.9" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="54.0">Propuestas presentadas en la prueba</tspan></text><rect x="319.3" y="766.4" width="261.3" height="122.7" rx="8" fill="#e2e4f7" stroke="#8c92ce" stroke-width="1.4"/><text x="333.3" y="788.4" font-size="13" fill="#20266e" font-weight="700" text-anchor="start"><tspan x="333.3">Tiempo de decisión</tspan></text><text x="333.3" y="817.6" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="333.3">Días entre presentación de la</tspan><tspan x="333.3" dy="15.2">propuesta y respuesta del cliente,</tspan><tspan x="333.3" dy="15.2">mediana</tspan></text><rect x="598.7" y="766.4" width="261.3" height="122.7" rx="8" fill="#e2e4f7" stroke="#8c92ce" stroke-width="1.4"/><text x="612.7" y="788.4" font-size="13" fill="#20266e" font-weight="700" text-anchor="start"><tspan x="612.7">Objeciones por categoría</tspan></text><text x="612.7" y="817.6" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="612.7">Objeciones clasificadas por causa</tspan></text><line x1="612.7" y1="838.7" x2="846.0" y2="838.7" stroke="#3942ac" stroke-width="2"/><text x="612.7" y="856.7" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="612.7">Propuestas rechazadas</tspan></text><rect x="40.0" y="903.1" width="261.3" height="188.8" rx="8" fill="#e2e4f7" stroke="#8c92ce" stroke-width="1.4"/><text x="54.0" y="925.1" font-size="13" fill="#20266e" font-weight="700" text-anchor="start"><tspan x="54.0">Tasa de aprendizaje de</tspan><tspan x="54.0" dy="17.2">innovación</tspan></text><text x="54.0" y="971.4" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Hipótesis críticas resueltas con</tspan><tspan x="54.0" dy="15.2">evidencia y decisión</tspan></text><line x1="54.0" y1="1007.8" x2="287.3" y2="1007.8" stroke="#3942ac" stroke-width="2"/><text x="54.0" y="1025.8" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="54.0">Hipótesis críticas sometidas a</tspan><tspan x="54.0" dy="15.2">prueba</tspan></text><text x="54.0" y="1070.1" font-size="10.5" fill="#7b8794" font-weight="400" text-anchor="start"><tspan x="54.0">Ventana: por ciclo y portafolio</tspan><tspan x="54.0" dy="13.9">trimestral</tspan></text><text x="40" y="1125.8400000000001" font-size="11.5" fill="#3942ac" font-weight="700" letter-spacing="1.4">FRONTERA DE APLICACIÓN</text><rect x="40" y="1135.8" width="820" height="65.0" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.4"/><polygon points="70,1153.3400000000001 52,1182.3400000000001 88,1182.3400000000001" fill="#c2410c"/><text x="70" y="1179.3400000000001" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">!</text><text x="106" y="1159.8" font-size="12.5" fill="#7c2d12" font-weight="400" text-anchor="start"><tspan x="106">Vender lo que no existe sin declararlo es engaño. La prueba exige transparencia sobre el estado y</tspan><tspan x="106" dy="16.5">condiciones claras de devolución si no se cumple lo acordado.</tspan></text><text x="40" y="1228.8400000000001" font-size="11.5" fill="#3942ac" font-weight="700" letter-spacing="1.4">ERROR FRECUENTE Y SU CORRECCIÓN</text><rect x="40" y="1238.8" width="380.0" height="77.0" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/><text x="54" y="1260.8" font-size="11" fill="#b91c1c" font-weight="700" text-anchor="start"><tspan x="54">Síntoma</tspan></text><text x="54" y="1278.8" font-size="12.5" fill="#7f1d1d" font-weight="400" text-anchor="start"><tspan x="54">Probar interés sin mostrar el precio</tspan></text><line x1="426.0" y1="1277.3" x2="469.0" y2="1277.3" stroke="#3942ac" stroke-width="2.6" stroke-linecap="round"/><polygon points="474.0,1277.3 465.9,1281.3 465.9,1273.4" fill="#3942ac"/><rect x="480.0" y="1238.8" width="380.0" height="77.0" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.4"/><text x="494.0" y="1260.8" font-size="11" fill="#15803d" font-weight="700" text-anchor="start"><tspan x="494.0">Corrección</tspan></text><text x="494.0" y="1278.8" font-size="12.5" fill="#14532d" font-weight="400" text-anchor="start"><tspan x="494.0">Presenta el precio efectivo: sin él, la aceptación</tspan><tspan x="494.0" dy="16.5">declarada no predice compra.</tspan></text></svg>