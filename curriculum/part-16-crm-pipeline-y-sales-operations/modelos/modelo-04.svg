<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1092" width="900" height="1092" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif"><title id="t">Modelo mental · Lead, contacto, cuenta y oportunidad</title><desc id="d">Modelo mental de la clase 16.04: Lead, contacto, cuenta y oportunidad. Método en 5 pasos; 4 conceptos; 3 señales de medición.</desc><rect x="0" y="0" width="900" height="1092" rx="14" fill="#ffffff"/><rect x="0" y="0" width="900" height="64" rx="14" fill="#6e4a20"/><rect x="0" y="40" width="900" height="24" fill="#6e4a20"/><text x="40" y="28" font-size="12" fill="#e5d2bc" font-weight="700" letter-spacing="1.6">MODELO MENTAL · CLASE 16.04 · PARTE 16</text><text x="40" y="52" font-size="21" fill="#ffffff" font-weight="700">Lead, contacto, cuenta y oportunidad</text><text x="40" y="84" font-size="11.5" fill="#ac7639" font-weight="700" letter-spacing="1.4">MÉTODO PASO A PASO</text><path d="M66.0,159.0 V202.5 H158.5" fill="none" stroke="#ac7639" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="160.5,202.5 151.5,197.5 151.5,207.5" fill="#ac7639"/><path d="M188.5,232.0 V275.5 H281.0" fill="none" stroke="#ac7639" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="283.0,275.5 274.0,270.5 274.0,280.5" fill="#ac7639"/><path d="M311.0,305.0 V348.5 H403.5" fill="none" stroke="#ac7639" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="405.5,348.5 396.5,343.5 396.5,353.5" fill="#ac7639"/><path d="M433.5,378.0 V421.5 H526.0" fill="none" stroke="#ac7639" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="528.0,421.5 519.0,416.5 519.0,426.5" fill="#ac7639"/><rect x="40.0" y="100.0" width="330" height="59.0" rx="10" fill="#f7ede2" stroke="#ceaf8c" stroke-width="1.4"/><text x="54.0" y="122.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Definir cada entidad por escrito y con</tspan><tspan x="54.0" dy="16.5">ejemplos</tspan></text><circle cx="42.0" cy="102.0" r="14" fill="#6e4a20"/><text x="42.0" y="106.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><rect x="162.5" y="173.0" width="330" height="59.0" rx="10" fill="#f7ede2" stroke="#ceaf8c" stroke-width="1.4"/><text x="176.5" y="195.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="176.5">Establecer las reglas de conversión entre</tspan><tspan x="176.5" dy="16.5">entidades</tspan></text><circle cx="164.5" cy="175.0" r="14" fill="#6e4a20"/><text x="164.5" y="179.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><rect x="285.0" y="246.0" width="330" height="59.0" rx="10" fill="#f7ede2" stroke="#ceaf8c" stroke-width="1.4"/><text x="299.0" y="268.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="299.0">Configurar el sistema para impedir</tspan><tspan x="299.0" dy="16.5">duplicaciones</tspan></text><circle cx="287.0" cy="248.0" r="14" fill="#6e4a20"/><text x="287.0" y="252.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><rect x="407.5" y="319.0" width="330" height="59.0" rx="10" fill="#f7ede2" stroke="#ceaf8c" stroke-width="1.4"/><text x="421.5" y="341.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="421.5">Capacitar al equipo con casos límite</tspan></text><circle cx="409.5" cy="321.0" r="14" fill="#6e4a20"/><text x="409.5" y="325.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">4</text><rect x="530.0" y="392.0" width="330" height="59.0" rx="10" fill="#f7ede2" stroke="#ceaf8c" stroke-width="1.4"/><text x="544.0" y="414.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="544.0">Auditar la consistencia del modelo cada</tspan><tspan x="544.0" dy="16.5">trimestre</tspan></text><circle cx="532.0" cy="394.0" r="14" fill="#6e4a20"/><text x="532.0" y="398.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">5</text><text x="40" y="493.0" font-size="11.5" fill="#ac7639" font-weight="700" letter-spacing="1.4">CONCEPTOS Y DÓNDE ACTÚAN EN EL MÉTODO</text><rect x="40.0" y="507.0" width="401.0" height="63.0" rx="8" fill="#ffffff" stroke="#ceaf8c" stroke-width="1.4"/><rect x="40.0" y="515.0" width="5" height="47.0" rx="2" fill="#ac7639"/><text x="56.0" y="529.0" font-size="13.5" fill="#6e4a20" font-weight="700" text-anchor="start"><tspan x="56.0">Lead</tspan></text><text x="56.0" y="548.8" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Persona o empresa con interés potencial aún no calificada</tspan></text><rect x="459.0" y="507.0" width="401.0" height="63.0" rx="8" fill="#ffffff" stroke="#ceaf8c" stroke-width="1.4"/><rect x="459.0" y="515.0" width="5" height="47.0" rx="2" fill="#ac7639"/><text x="475.0" y="529.0" font-size="13.5" fill="#6e4a20" font-weight="700" text-anchor="start"><tspan x="475.0">Contacto</tspan></text><text x="475.0" y="548.8" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Persona identificada asociada a una cuenta</tspan></text><rect x="40.0" y="584.0" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#ceaf8c" stroke-width="1.4"/><rect x="40.0" y="592.0" width="5" height="62.2" rx="2" fill="#ac7639"/><text x="56.0" y="606.0" font-size="13.5" fill="#6e4a20" font-weight="700" text-anchor="start"><tspan x="56.0">Cuenta</tspan></text><text x="56.0" y="625.8" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Organización cliente o potencial cliente como entidad</tspan><tspan x="56.0" dy="15.2">única</tspan></text><rect x="459.0" y="584.0" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#ceaf8c" stroke-width="1.4"/><rect x="459.0" y="592.0" width="5" height="62.2" rx="2" fill="#ac7639"/><text x="475.0" y="606.0" font-size="13.5" fill="#6e4a20" font-weight="700" text-anchor="start"><tspan x="475.0">Oportunidad</tspan></text><text x="475.0" y="625.8" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Posibilidad de venta calificada con valor, etapa y fecha</tspan><tspan x="475.0" dy="15.2">estimada</tspan></text><text x="40" y="694.1800000000001" font-size="11.5" fill="#ac7639" font-weight="700" letter-spacing="1.4">QUÉ SE MIDE: NUMERADOR SOBRE DENOMINADOR</text><rect x="40.0" y="708.2" width="261.3" height="122.7" rx="8" fill="#f7ede2" stroke="#ceaf8c" stroke-width="1.4"/><text x="54.0" y="730.2" font-size="13" fill="#6e4a20" font-weight="700" text-anchor="start"><tspan x="54.0">Duplicados de cuenta</tspan></text><text x="54.0" y="759.3" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Cuentas duplicadas detectadas</tspan></text><line x1="54.0" y1="780.5" x2="287.3" y2="780.5" stroke="#ac7639" stroke-width="2"/><text x="54.0" y="798.5" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="54.0">Cuentas totales</tspan></text><rect x="319.3" y="708.2" width="261.3" height="122.7" rx="8" fill="#f7ede2" stroke="#ceaf8c" stroke-width="1.4"/><text x="333.3" y="730.2" font-size="13" fill="#6e4a20" font-weight="700" text-anchor="start"><tspan x="333.3">Oportunidades sin cuenta</tspan><tspan x="333.3" dy="17.2">asociada</tspan></text><text x="333.3" y="776.5" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="333.3">Oportunidades huérfanas</tspan></text><line x1="333.3" y1="797.7" x2="566.7" y2="797.7" stroke="#ac7639" stroke-width="2"/><text x="333.3" y="815.7" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="333.3">Oportunidades activas</tspan></text><rect x="598.7" y="708.2" width="261.3" height="122.7" rx="8" fill="#f7ede2" stroke="#ceaf8c" stroke-width="1.4"/><text x="612.7" y="730.2" font-size="13" fill="#6e4a20" font-weight="700" text-anchor="start"><tspan x="612.7">Consistencia de conversión</tspan></text><text x="612.7" y="759.3" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="612.7">Leads convertidos según la regla</tspan><tspan x="612.7" dy="15.2">definida</tspan></text><line x1="612.7" y1="795.7" x2="846.0" y2="795.7" stroke="#ac7639" stroke-width="2"/><text x="612.7" y="813.7" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="612.7">Leads convertidos</tspan></text><text x="40" y="864.8600000000001" font-size="11.5" fill="#ac7639" font-weight="700" letter-spacing="1.4">FRONTERA DE APLICACIÓN</text><rect x="40" y="874.9" width="820" height="65.0" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.4"/><polygon points="70,892.3600000000001 52,921.3600000000001 88,921.3600000000001" fill="#c2410c"/><text x="70" y="918.3600000000001" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">!</text><text x="106" y="898.9" font-size="12.5" fill="#7c2d12" font-weight="400" text-anchor="start"><tspan x="106">Un modelo de datos muy estricto puede no representar estructuras reales como grupos empresariales o</tspan><tspan x="106" dy="16.5">franquicias. Debe existir un mecanismo de jerarquía.</tspan></text><text x="40" y="967.8600000000001" font-size="11.5" fill="#ac7639" font-weight="700" letter-spacing="1.4">ERROR FRECUENTE Y SU CORRECCIÓN</text><rect x="40" y="977.9" width="380.0" height="77.0" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/><text x="54" y="999.9" font-size="11" fill="#b91c1c" font-weight="700" text-anchor="start"><tspan x="54">Síntoma</tspan></text><text x="54" y="1017.9" font-size="12.5" fill="#7f1d1d" font-weight="400" text-anchor="start"><tspan x="54">Registrar sucursales como cuentas independientes</tspan></text><line x1="426.0" y1="1016.4" x2="469.0" y2="1016.4" stroke="#ac7639" stroke-width="2.6" stroke-linecap="round"/><polygon points="474.0,1016.4 465.9,1020.3 465.9,1012.4" fill="#ac7639"/><rect x="480.0" y="977.9" width="380.0" height="77.0" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.4"/><text x="494.0" y="999.9" font-size="11" fill="#15803d" font-weight="700" text-anchor="start"><tspan x="494.0">Corrección</tspan></text><text x="494.0" y="1017.9" font-size="12.5" fill="#14532d" font-weight="400" text-anchor="start"><tspan x="494.0">Define la jerarquía de cuentas y consolida las</tspan><tspan x="494.0" dy="16.5">sucursales bajo la organización matriz.</tspan></text></svg>