<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 983" width="900" height="983" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif"><title id="t">Modelo mental · Problemas, necesidades y resultados deseados</title><desc id="d">Modelo mental de la clase 02.02: Problemas, necesidades y resultados deseados. Método en 5 pasos; 4 conceptos; 3 señales de medición.</desc><rect x="0" y="0" width="900" height="983" rx="14" fill="#ffffff"/><rect x="0" y="0" width="900" height="64" rx="14" fill="#426e20"/><rect x="0" y="40" width="900" height="24" fill="#426e20"/><text x="40" y="28" font-size="12" fill="#cee5bc" font-weight="700" letter-spacing="1.6">MODELO MENTAL · CLASE 02.02 · PARTE 02</text><text x="40" y="52" font-size="21" fill="#ffffff" font-weight="700">Problemas, necesidades y resultados deseados</text><text x="40" y="84" font-size="11.5" fill="#6bac39" font-weight="700" letter-spacing="1.4">MÉTODO PASO A PASO</text><line x1="450.0" y1="94.0" x2="450.0" y2="317.0" stroke="#a9ce8c" stroke-width="3" stroke-linecap="round"/><line x1="450.0" y1="129.5" x2="406.0" y2="129.5" stroke="#a9ce8c" stroke-width="2"/><rect x="56.0" y="100" width="350" height="59.0" rx="10" fill="#ebf7e2" stroke="#a9ce8c" stroke-width="1.4"/><text x="70.0" y="122" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="70.0">Recoger los resultados en las palabras del</tspan><tspan x="70.0" dy="16.5">cliente</tspan></text><circle cx="450.0" cy="129.5" r="15" fill="#426e20"/><text x="450.0" y="134.0" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><line x1="450.0" y1="159.2" x2="494.0" y2="159.2" stroke="#a9ce8c" stroke-width="2"/><rect x="494.0" y="138" width="350" height="42.5" rx="10" fill="#ebf7e2" stroke="#a9ce8c" stroke-width="1.4"/><text x="508.0" y="160" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="508.0">Reescribirlos como enunciados medibles</tspan></text><circle cx="450.0" cy="159.2" r="15" fill="#426e20"/><text x="450.0" y="163.8" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><line x1="450.0" y1="205.5" x2="406.0" y2="205.5" stroke="#a9ce8c" stroke-width="2"/><rect x="56.0" y="176" width="350" height="59.0" rx="10" fill="#ebf7e2" stroke="#a9ce8c" stroke-width="1.4"/><text x="70.0" y="198" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="70.0">Puntuar importancia e insatisfacción de cada</tspan><tspan x="70.0" dy="16.5">uno</tspan></text><circle cx="450.0" cy="205.5" r="15" fill="#426e20"/><text x="450.0" y="210.0" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><line x1="450.0" y1="235.2" x2="494.0" y2="235.2" stroke="#a9ce8c" stroke-width="2"/><rect x="494.0" y="214" width="350" height="42.5" rx="10" fill="#ebf7e2" stroke="#a9ce8c" stroke-width="1.4"/><text x="508.0" y="236" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="508.0">Priorizar donde la brecha es mayor</tspan></text><circle cx="450.0" cy="235.2" r="15" fill="#426e20"/><text x="450.0" y="239.8" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">4</text><line x1="450.0" y1="281.5" x2="406.0" y2="281.5" stroke="#a9ce8c" stroke-width="2"/><rect x="56.0" y="252" width="350" height="59.0" rx="10" fill="#ebf7e2" stroke="#a9ce8c" stroke-width="1.4"/><text x="70.0" y="274" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="70.0">Traducir la brecha priorizada en requisito de</tspan><tspan x="70.0" dy="16.5">oferta</tspan></text><circle cx="450.0" cy="281.5" r="15" fill="#426e20"/><text x="450.0" y="286.0" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">5</text><text x="40" y="353.0" font-size="11.5" fill="#6bac39" font-weight="700" letter-spacing="1.4">CONCEPTOS Y DÓNDE ACTÚAN EN EL MÉTODO</text><rect x="40.0" y="367.0" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#a9ce8c" stroke-width="1.4"/><rect x="40.0" y="375.0" width="5" height="62.2" rx="2" fill="#6bac39"/><text x="56.0" y="389.0" font-size="13.5" fill="#426e20" font-weight="700" text-anchor="start"><tspan x="56.0">Problema</tspan></text><text x="56.0" y="408.8" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Brecha entre el estado actual y el estado deseado que</tspan><tspan x="56.0" dy="15.2">produce un costo tolerado o intolerable</tspan></text><rect x="459.0" y="367.0" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#a9ce8c" stroke-width="1.4"/><rect x="459.0" y="375.0" width="5" height="62.2" rx="2" fill="#6bac39"/><text x="475.0" y="389.0" font-size="13.5" fill="#426e20" font-weight="700" text-anchor="start"><tspan x="475.0">Resultado deseado</tspan></text><text x="475.0" y="408.8" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Enunciado medible de lo que el cliente quiere lograr, en</tspan><tspan x="475.0" dy="15.2">su propia unidad de medida</tspan></text><rect x="798.0" y="375.0" width="54" height="20" rx="10" fill="#cee5bc" stroke="#a9ce8c" stroke-width="1"/><text x="825.0" y="389.0" font-size="11" fill="#426e20" font-weight="700" text-anchor="middle">↔ 1, 2</text><rect x="40.0" y="459.2" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#a9ce8c" stroke-width="1.4"/><rect x="40.0" y="467.2" width="5" height="62.2" rx="2" fill="#6bac39"/><text x="56.0" y="481.2" font-size="13.5" fill="#426e20" font-weight="700" text-anchor="start"><tspan x="56.0">Importancia percibida</tspan></text><text x="56.0" y="501.0" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Cuánto le importa al cliente ese resultado en relación con</tspan><tspan x="56.0" dy="15.2">sus otras prioridades</tspan></text><rect x="379.0" y="467.2" width="54" height="20" rx="10" fill="#cee5bc" stroke="#a9ce8c" stroke-width="1"/><text x="406.0" y="481.2" font-size="11" fill="#426e20" font-weight="700" text-anchor="middle">↔ 1, 3</text><rect x="459.0" y="459.2" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#a9ce8c" stroke-width="1.4"/><rect x="459.0" y="467.2" width="5" height="62.2" rx="2" fill="#6bac39"/><text x="475.0" y="481.2" font-size="13.5" fill="#426e20" font-weight="700" text-anchor="start"><tspan x="475.0">Insatisfacción actual</tspan></text><text x="475.0" y="501.0" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Grado en que la solución vigente falla en entregar ese</tspan><tspan x="475.0" dy="15.2">resultado</tspan></text><rect x="798.0" y="467.2" width="54" height="20" rx="10" fill="#cee5bc" stroke="#a9ce8c" stroke-width="1"/><text x="825.0" y="481.2" font-size="11" fill="#426e20" font-weight="700" text-anchor="middle">↔ 3</text><text x="40" y="569.36" font-size="11.5" fill="#6bac39" font-weight="700" letter-spacing="1.4">QUÉ SE MIDE: NUMERADOR SOBRE DENOMINADOR</text><rect x="40.0" y="583.4" width="261.3" height="137.9" rx="8" fill="#ebf7e2" stroke="#a9ce8c" stroke-width="1.4"/><text x="54.0" y="605.4" font-size="13" fill="#426e20" font-weight="700" text-anchor="start"><tspan x="54.0">Brecha de oportunidad</tspan></text><text x="54.0" y="634.5" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Importancia más la diferencia entre</tspan><tspan x="54.0" dy="15.2">importancia e satisfacción,</tspan><tspan x="54.0" dy="15.2">calculada por resultado deseado y</tspan><tspan x="54.0" dy="15.2">por segmento</tspan></text><rect x="319.3" y="583.4" width="261.3" height="137.9" rx="8" fill="#ebf7e2" stroke="#a9ce8c" stroke-width="1.4"/><text x="333.3" y="605.4" font-size="13" fill="#426e20" font-weight="700" text-anchor="start"><tspan x="333.3">Resultados formulados de forma</tspan><tspan x="333.3" dy="17.2">medible</tspan></text><text x="333.3" y="651.7" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="333.3">Enunciados con unidad, dirección y</tspan><tspan x="333.3" dy="15.2">magnitud</tspan></text><line x1="333.3" y1="688.0" x2="566.7" y2="688.0" stroke="#6bac39" stroke-width="2"/><text x="333.3" y="706.0" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="333.3">Total de resultados recogidos</tspan></text><rect x="598.7" y="583.4" width="261.3" height="137.9" rx="8" fill="#ebf7e2" stroke="#a9ce8c" stroke-width="1.4"/><text x="612.7" y="605.4" font-size="13" fill="#426e20" font-weight="700" text-anchor="start"><tspan x="612.7">Coincidencia entre resultado</tspan><tspan x="612.7" dy="17.2">prometido y entregado</tspan></text><text x="612.7" y="651.7" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="612.7">Cuentas donde el resultado</tspan><tspan x="612.7" dy="15.2">comprometido fue verificado</tspan></text><line x1="612.7" y1="688.0" x2="846.0" y2="688.0" stroke="#6bac39" stroke-width="2"/><text x="612.7" y="706.0" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="612.7">Cuentas implementadas</tspan></text><text x="40" y="755.22" font-size="11.5" fill="#6bac39" font-weight="700" letter-spacing="1.4">FRONTERA DE APLICACIÓN</text><rect x="40" y="765.2" width="820" height="65.0" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.4"/><polygon points="70,782.72 52,811.72 88,811.72" fill="#c2410c"/><text x="70" y="808.72" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">!</text><text x="106" y="789.2" font-size="12.5" fill="#7c2d12" font-weight="400" text-anchor="start"><tspan x="106">No todos los resultados relevantes son cuantificables; algunos son sociales o emocionales, como verse</tspan><tspan x="106" dy="16.5">profesional ante los clientes. Forzar una métrica sobre ellos empobrece el diagnóstico.</tspan></text><text x="40" y="858.22" font-size="11.5" fill="#6bac39" font-weight="700" letter-spacing="1.4">ERROR FRECUENTE Y SU CORRECCIÓN</text><rect x="40" y="868.2" width="380.0" height="77.0" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/><text x="54" y="890.2" font-size="11" fill="#b91c1c" font-weight="700" text-anchor="start"><tspan x="54">Síntoma</tspan></text><text x="54" y="908.2" font-size="12.5" fill="#7f1d1d" font-weight="400" text-anchor="start"><tspan x="54">Anotar funcionalidades pedidas como si fueran</tspan><tspan x="54" dy="16.5">necesidades</tspan></text><line x1="426.0" y1="906.7" x2="469.0" y2="906.7" stroke="#6bac39" stroke-width="2.6" stroke-linecap="round"/><polygon points="474.0,906.7 465.9,910.6 465.9,902.8" fill="#6bac39"/><rect x="480.0" y="868.2" width="380.0" height="77.0" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.4"/><text x="494.0" y="890.2" font-size="11" fill="#15803d" font-weight="700" text-anchor="start"><tspan x="494.0">Corrección</tspan></text><text x="494.0" y="908.2" font-size="12.5" fill="#14532d" font-weight="400" text-anchor="start"><tspan x="494.0">Pregunta qué haría el cliente con esa funcionalidad</tspan><tspan x="494.0" dy="16.5">y qué resultado espera obtener.</tspan></text></svg>