<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 966" width="900" height="966" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif"><title id="t">Modelo mental · Diseño de experimentos</title><desc id="d">Modelo mental de la clase 19.11: Diseño de experimentos. Método en 5 pasos; 4 conceptos; 3 señales de medición.</desc><rect x="0" y="0" width="900" height="966" rx="14" fill="#ffffff"/><rect x="0" y="0" width="900" height="64" rx="14" fill="#206e65"/><rect x="0" y="40" width="900" height="24" fill="#206e65"/><text x="40" y="28" font-size="12" fill="#bce5e0" font-weight="700" letter-spacing="1.6">MODELO MENTAL · CLASE 19.11 · PARTE 19</text><text x="40" y="52" font-size="21" fill="#ffffff" font-weight="700">Diseño de experimentos</text><text x="40" y="84" font-size="11.5" fill="#39ac9e" font-weight="700" letter-spacing="1.4">MÉTODO PASO A PASO</text><line x1="450.0" y1="94.0" x2="450.0" y2="300.5" stroke="#8ccec6" stroke-width="3" stroke-linecap="round"/><line x1="450.0" y1="129.5" x2="406.0" y2="129.5" stroke="#8ccec6" stroke-width="2"/><rect x="56.0" y="100" width="350" height="59.0" rx="10" fill="#e2f7f5" stroke="#8ccec6" stroke-width="1.4"/><text x="70.0" y="122" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="70.0">Formular la hipótesis y las métricas antes de</tspan><tspan x="70.0" dy="16.5">iniciar</tspan></text><circle cx="450.0" cy="129.5" r="15" fill="#206e65"/><text x="450.0" y="134.0" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><line x1="450.0" y1="159.2" x2="494.0" y2="159.2" stroke="#8ccec6" stroke-width="2"/><rect x="494.0" y="138" width="350" height="42.5" rx="10" fill="#e2f7f5" stroke="#8ccec6" stroke-width="1.4"/><text x="508.0" y="160" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="508.0">Calcular tamaño y duración necesarios</tspan></text><circle cx="450.0" cy="159.2" r="15" fill="#206e65"/><text x="450.0" y="163.8" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><line x1="450.0" y1="197.2" x2="406.0" y2="197.2" stroke="#8ccec6" stroke-width="2"/><rect x="56.0" y="176" width="350" height="42.5" rx="10" fill="#e2f7f5" stroke="#8ccec6" stroke-width="1.4"/><text x="70.0" y="198" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="70.0">Verificar la comparabilidad de los grupos</tspan></text><circle cx="450.0" cy="197.2" r="15" fill="#206e65"/><text x="450.0" y="201.8" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><line x1="450.0" y1="235.2" x2="494.0" y2="235.2" stroke="#8ccec6" stroke-width="2"/><rect x="494.0" y="214" width="350" height="42.5" rx="10" fill="#e2f7f5" stroke="#8ccec6" stroke-width="1.4"/><text x="508.0" y="236" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="508.0">Ejecutar sin detener anticipadamente</tspan></text><circle cx="450.0" cy="235.2" r="15" fill="#206e65"/><text x="450.0" y="239.8" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">4</text><line x1="450.0" y1="273.2" x2="406.0" y2="273.2" stroke="#8ccec6" stroke-width="2"/><rect x="56.0" y="252" width="350" height="42.5" rx="10" fill="#e2f7f5" stroke="#8ccec6" stroke-width="1.4"/><text x="70.0" y="274" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="70.0">Analizar con el criterio previo y documentar</tspan></text><circle cx="450.0" cy="273.2" r="15" fill="#206e65"/><text x="450.0" y="277.8" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">5</text><text x="40" y="336.5" font-size="11.5" fill="#39ac9e" font-weight="700" letter-spacing="1.4">CONCEPTOS Y DÓNDE ACTÚAN EN EL MÉTODO</text><rect x="40.0" y="350.5" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#8ccec6" stroke-width="1.4"/><rect x="40.0" y="358.5" width="5" height="62.2" rx="2" fill="#39ac9e"/><text x="56.0" y="372.5" font-size="13.5" fill="#206e65" font-weight="700" text-anchor="start"><tspan x="56.0">Asignación comparable</tspan></text><text x="56.0" y="392.3" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Distribución de sujetos que hace equivalentes a los grupos</tspan></text><rect x="379.0" y="358.5" width="54" height="20" rx="10" fill="#bce5e0" stroke="#8ccec6" stroke-width="1"/><text x="406.0" y="372.5" font-size="11" fill="#206e65" font-weight="700" text-anchor="middle">↔ 3</text><rect x="459.0" y="350.5" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#8ccec6" stroke-width="1.4"/><rect x="459.0" y="358.5" width="5" height="62.2" rx="2" fill="#39ac9e"/><text x="475.0" y="372.5" font-size="13.5" fill="#206e65" font-weight="700" text-anchor="start"><tspan x="475.0">Tamaño mínimo detectable</tspan></text><text x="475.0" y="392.3" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Efecto más pequeño que el experimento puede identificar</tspan><tspan x="475.0" dy="15.2">con la muestra</tspan></text><rect x="798.0" y="358.5" width="54" height="20" rx="10" fill="#bce5e0" stroke="#8ccec6" stroke-width="1"/><text x="825.0" y="372.5" font-size="11" fill="#206e65" font-weight="700" text-anchor="middle">↔ 2</text><rect x="40.0" y="442.7" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#8ccec6" stroke-width="1.4"/><rect x="40.0" y="450.7" width="5" height="62.2" rx="2" fill="#39ac9e"/><text x="56.0" y="464.7" font-size="13.5" fill="#206e65" font-weight="700" text-anchor="start"><tspan x="56.0">Métrica guardarraíl</tspan></text><text x="56.0" y="484.5" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Indicador que no debe deteriorarse aunque mejore la</tspan><tspan x="56.0" dy="15.2">métrica principal</tspan></text><rect x="379.0" y="450.7" width="54" height="20" rx="10" fill="#bce5e0" stroke="#8ccec6" stroke-width="1"/><text x="406.0" y="464.7" font-size="11" fill="#206e65" font-weight="700" text-anchor="middle">↔ 1</text><rect x="459.0" y="442.7" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#8ccec6" stroke-width="1.4"/><rect x="459.0" y="450.7" width="5" height="62.2" rx="2" fill="#39ac9e"/><text x="475.0" y="464.7" font-size="13.5" fill="#206e65" font-weight="700" text-anchor="start"><tspan x="475.0">Contaminación</tspan></text><text x="475.0" y="484.5" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Situación en que el tratamiento afecta también al grupo de</tspan><tspan x="475.0" dy="15.2">control</tspan></text><text x="40" y="552.86" font-size="11.5" fill="#39ac9e" font-weight="700" letter-spacing="1.4">QUÉ SE MIDE: NUMERADOR SOBRE DENOMINADOR</text><rect x="40.0" y="566.9" width="261.3" height="137.9" rx="8" fill="#e2f7f5" stroke="#8ccec6" stroke-width="1.4"/><text x="54.0" y="588.9" font-size="13" fill="#206e65" font-weight="700" text-anchor="start"><tspan x="54.0">Potencia del experimento</tspan></text><text x="54.0" y="618.0" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Probabilidad de detectar el efecto</tspan><tspan x="54.0" dy="15.2">mínimo relevante con la muestra</tspan><tspan x="54.0" dy="15.2">disponible, calculada antes de</tspan><tspan x="54.0" dy="15.2">iniciar</tspan></text><rect x="319.3" y="566.9" width="261.3" height="137.9" rx="8" fill="#e2f7f5" stroke="#8ccec6" stroke-width="1.4"/><text x="333.3" y="588.9" font-size="13" fill="#206e65" font-weight="700" text-anchor="start"><tspan x="333.3">Experimentos detenidos</tspan><tspan x="333.3" dy="17.2">anticipadamente</tspan></text><text x="333.3" y="635.2" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="333.3">Pruebas interrumpidas antes del</tspan><tspan x="333.3" dy="15.2">plazo</tspan></text><line x1="333.3" y1="671.5" x2="566.7" y2="671.5" stroke="#39ac9e" stroke-width="2"/><text x="333.3" y="689.5" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="333.3">Pruebas ejecutadas</tspan></text><rect x="598.7" y="566.9" width="261.3" height="137.9" rx="8" fill="#e2f7f5" stroke="#8ccec6" stroke-width="1.4"/><text x="612.7" y="588.9" font-size="13" fill="#206e65" font-weight="700" text-anchor="start"><tspan x="612.7">Resultados replicados</tspan></text><text x="612.7" y="618.0" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="612.7">Resultados confirmados al repetir la</tspan><tspan x="612.7" dy="15.2">medición</tspan></text><line x1="612.7" y1="654.4" x2="846.0" y2="654.4" stroke="#39ac9e" stroke-width="2"/><text x="612.7" y="672.4" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="612.7">Resultados positivos</tspan></text><text x="40" y="738.72" font-size="11.5" fill="#39ac9e" font-weight="700" letter-spacing="1.4">FRONTERA DE APLICACIÓN</text><rect x="40" y="748.7" width="820" height="65.0" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.4"/><polygon points="70,766.22 52,795.22 88,795.22" fill="#c2410c"/><text x="70" y="792.22" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">!</text><text x="106" y="772.7" font-size="12.5" fill="#7c2d12" font-weight="400" text-anchor="start"><tspan x="106">En volúmenes bajos, la experimentación rigurosa es inviable. La alternativa honesta es decidir con</tspan><tspan x="106" dy="16.5">investigación cualitativa y declarar la incertidumbre.</tspan></text><text x="40" y="841.72" font-size="11.5" fill="#39ac9e" font-weight="700" letter-spacing="1.4">ERROR FRECUENTE Y SU CORRECCIÓN</text><rect x="40" y="851.7" width="380.0" height="77.0" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/><text x="54" y="873.7" font-size="11" fill="#b91c1c" font-weight="700" text-anchor="start"><tspan x="54">Síntoma</tspan></text><text x="54" y="891.7" font-size="12.5" fill="#7f1d1d" font-weight="400" text-anchor="start"><tspan x="54">Detener el experimento al ver un resultado</tspan><tspan x="54" dy="16.5">favorable</tspan></text><line x1="426.0" y1="890.2" x2="469.0" y2="890.2" stroke="#39ac9e" stroke-width="2.6" stroke-linecap="round"/><polygon points="474.0,890.2 465.9,894.1 465.9,886.3" fill="#39ac9e"/><rect x="480.0" y="851.7" width="380.0" height="77.0" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.4"/><text x="494.0" y="873.7" font-size="11" fill="#15803d" font-weight="700" text-anchor="start"><tspan x="494.0">Corrección</tspan></text><text x="494.0" y="891.7" font-size="12.5" fill="#14532d" font-weight="400" text-anchor="start"><tspan x="494.0">Fija duración y tamaño antes de iniciar y analiza</tspan><tspan x="494.0" dy="16.5">sólo al finalizar el plazo definido.</tspan></text></svg>