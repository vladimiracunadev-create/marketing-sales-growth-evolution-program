<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 968" width="900" height="968" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif"><title id="t">Modelo mental · Estrategia de contenidos</title><desc id="d">Modelo mental de la clase 13.01: Estrategia de contenidos. Método en 5 pasos; 4 conceptos; 3 señales de medición.</desc><rect x="0" y="0" width="900" height="968" rx="14" fill="#ffffff"/><rect x="0" y="0" width="900" height="64" rx="14" fill="#2e206e"/><rect x="0" y="40" width="900" height="24" fill="#2e206e"/><text x="40" y="28" font-size="12" fill="#c4bce5" font-weight="700" letter-spacing="1.6">MODELO MENTAL · CLASE 13.01 · PARTE 13</text><text x="40" y="52" font-size="21" fill="#ffffff" font-weight="700">Estrategia de contenidos</text><text x="40" y="84" font-size="11.5" fill="#4e39ac" font-weight="700" letter-spacing="1.4">MÉTODO PASO A PASO</text><line x1="450.0" y1="94.0" x2="450.0" y2="317.0" stroke="#988cce" stroke-width="3" stroke-linecap="round"/><line x1="450.0" y1="121.2" x2="406.0" y2="121.2" stroke="#988cce" stroke-width="2"/><rect x="56.0" y="100" width="350" height="42.5" rx="10" fill="#e6e2f7" stroke="#988cce" stroke-width="1.4"/><text x="70.0" y="122" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="70.0">Definir la audiencia y su problema principal</tspan></text><circle cx="450.0" cy="121.2" r="15" fill="#2e206e"/><text x="450.0" y="125.8" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><line x1="450.0" y1="159.2" x2="494.0" y2="159.2" stroke="#988cce" stroke-width="2"/><rect x="494.0" y="138" width="350" height="42.5" rx="10" fill="#e6e2f7" stroke="#988cce" stroke-width="1.4"/><text x="508.0" y="160" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="508.0">Declarar la promesa editorial</tspan></text><circle cx="450.0" cy="159.2" r="15" fill="#2e206e"/><text x="450.0" y="163.8" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><line x1="450.0" y1="205.5" x2="406.0" y2="205.5" stroke="#988cce" stroke-width="2"/><rect x="56.0" y="176" width="350" height="59.0" rx="10" fill="#e6e2f7" stroke="#988cce" stroke-width="1.4"/><text x="70.0" y="198" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="70.0">Asignar a cada tipo de pieza un objetivo</tspan><tspan x="70.0" dy="16.5">comercial</tspan></text><circle cx="450.0" cy="205.5" r="15" fill="#2e206e"/><text x="450.0" y="210.0" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><line x1="450.0" y1="235.2" x2="494.0" y2="235.2" stroke="#988cce" stroke-width="2"/><rect x="494.0" y="214" width="350" height="42.5" rx="10" fill="#e6e2f7" stroke="#988cce" stroke-width="1.4"/><text x="508.0" y="236" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="508.0">Fijar un ritmo sostenible con la capacidad real</tspan></text><circle cx="450.0" cy="235.2" r="15" fill="#2e206e"/><text x="450.0" y="239.8" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">4</text><line x1="450.0" y1="281.5" x2="406.0" y2="281.5" stroke="#988cce" stroke-width="2"/><rect x="56.0" y="252" width="350" height="59.0" rx="10" fill="#e6e2f7" stroke="#988cce" stroke-width="1.4"/><text x="70.0" y="274" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="70.0">Medir el efecto sobre demanda y sobre el</tspan><tspan x="70.0" dy="16.5">proceso de venta</tspan></text><circle cx="450.0" cy="281.5" r="15" fill="#2e206e"/><text x="450.0" y="286.0" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">5</text><text x="40" y="353.0" font-size="11.5" fill="#4e39ac" font-weight="700" letter-spacing="1.4">CONCEPTOS Y DÓNDE ACTÚAN EN EL MÉTODO</text><rect x="40.0" y="367.0" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#988cce" stroke-width="1.4"/><rect x="40.0" y="375.0" width="5" height="62.2" rx="2" fill="#4e39ac"/><text x="56.0" y="389.0" font-size="13.5" fill="#2e206e" font-weight="700" text-anchor="start"><tspan x="56.0">Audiencia definida</tspan></text><text x="56.0" y="408.8" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Grupo específico para el que se produce contenido de forma</tspan><tspan x="56.0" dy="15.2">consistente</tspan></text><rect x="379.0" y="375.0" width="54" height="20" rx="10" fill="#c4bce5" stroke="#988cce" stroke-width="1"/><text x="406.0" y="389.0" font-size="11" fill="#2e206e" font-weight="700" text-anchor="middle">↔ 1</text><rect x="459.0" y="367.0" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#988cce" stroke-width="1.4"/><rect x="459.0" y="375.0" width="5" height="62.2" rx="2" fill="#4e39ac"/><text x="475.0" y="389.0" font-size="13.5" fill="#2e206e" font-weight="700" text-anchor="start"><tspan x="475.0">Promesa editorial</tspan></text><text x="475.0" y="408.8" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Compromiso sobre qué tipo de utilidad entregará el</tspan><tspan x="475.0" dy="15.2">contenido</tspan></text><rect x="798.0" y="375.0" width="54" height="20" rx="10" fill="#c4bce5" stroke="#988cce" stroke-width="1"/><text x="825.0" y="389.0" font-size="11" fill="#2e206e" font-weight="700" text-anchor="middle">↔ 2</text><rect x="40.0" y="459.2" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#988cce" stroke-width="1.4"/><rect x="40.0" y="467.2" width="5" height="62.2" rx="2" fill="#4e39ac"/><text x="56.0" y="481.2" font-size="13.5" fill="#2e206e" font-weight="700" text-anchor="start"><tspan x="56.0">Ritmo sostenible</tspan></text><text x="56.0" y="501.0" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Frecuencia de publicación que el equipo puede mantener</tspan><tspan x="56.0" dy="15.2">durante años</tspan></text><rect x="379.0" y="467.2" width="54" height="20" rx="10" fill="#c4bce5" stroke="#988cce" stroke-width="1"/><text x="406.0" y="481.2" font-size="11" fill="#2e206e" font-weight="700" text-anchor="middle">↔ 4</text><rect x="459.0" y="459.2" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#988cce" stroke-width="1.4"/><rect x="459.0" y="467.2" width="5" height="62.2" rx="2" fill="#4e39ac"/><text x="475.0" y="481.2" font-size="13.5" fill="#2e206e" font-weight="700" text-anchor="start"><tspan x="475.0">Objetivo comercial del contenido</tspan></text><text x="475.0" y="501.0" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Resultado que la pieza debe habilitar: descubrimiento,</tspan><tspan x="475.0" dy="15.2">evaluación o cierre</tspan></text><rect x="798.0" y="467.2" width="54" height="20" rx="10" fill="#c4bce5" stroke="#988cce" stroke-width="1"/><text x="825.0" y="481.2" font-size="11" fill="#2e206e" font-weight="700" text-anchor="middle">↔ 3</text><text x="40" y="569.36" font-size="11.5" fill="#4e39ac" font-weight="700" letter-spacing="1.4">QUÉ SE MIDE: NUMERADOR SOBRE DENOMINADOR</text><rect x="40.0" y="583.4" width="261.3" height="122.7" rx="8" fill="#e6e2f7" stroke="#988cce" stroke-width="1.4"/><text x="54.0" y="605.4" font-size="13" fill="#2e206e" font-weight="700" text-anchor="start"><tspan x="54.0">Piezas con objetivo comercial</tspan><tspan x="54.0" dy="17.2">declarado</tspan></text><text x="54.0" y="651.7" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Piezas con objetivo asignado</tspan></text><line x1="54.0" y1="672.9" x2="287.3" y2="672.9" stroke="#4e39ac" stroke-width="2"/><text x="54.0" y="690.9" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="54.0">Piezas publicadas</tspan></text><rect x="319.3" y="583.4" width="261.3" height="122.7" rx="8" fill="#e6e2f7" stroke="#988cce" stroke-width="1.4"/><text x="333.3" y="605.4" font-size="13" fill="#2e206e" font-weight="700" text-anchor="start"><tspan x="333.3">Uso del contenido en ventas</tspan></text><text x="333.3" y="634.5" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="333.3">Piezas utilizadas en negocios</tspan><tspan x="333.3" dy="15.2">activos</tspan></text><line x1="333.3" y1="670.9" x2="566.7" y2="670.9" stroke="#4e39ac" stroke-width="2"/><text x="333.3" y="688.9" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="333.3">Piezas producidas</tspan></text><rect x="598.7" y="583.4" width="261.3" height="122.7" rx="8" fill="#e6e2f7" stroke="#988cce" stroke-width="1.4"/><text x="612.7" y="605.4" font-size="13" fill="#2e206e" font-weight="700" text-anchor="start"><tspan x="612.7">Crecimiento de audiencia propia</tspan></text><text x="612.7" y="634.5" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="612.7">Suscriptores netos ganados en el mes</tspan></text><line x1="612.7" y1="655.7" x2="846.0" y2="655.7" stroke="#4e39ac" stroke-width="2"/><text x="612.7" y="673.7" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="612.7">Suscriptores al inicio del mes</tspan></text><text x="40" y="740.04" font-size="11.5" fill="#4e39ac" font-weight="700" letter-spacing="1.4">FRONTERA DE APLICACIÓN</text><rect x="40" y="750.0" width="820" height="65.0" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.4"/><polygon points="70,767.54 52,796.54 88,796.54" fill="#c2410c"/><text x="70" y="793.54" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">!</text><text x="106" y="774.0" font-size="12.5" fill="#7c2d12" font-weight="400" text-anchor="start"><tspan x="106">El contenido tiene retorno lento. Exigirle conversión inmediata induce a producir piezas promocionales que</tspan><tspan x="106" dy="16.5">la audiencia ignora.</tspan></text><text x="40" y="843.04" font-size="11.5" fill="#4e39ac" font-weight="700" letter-spacing="1.4">ERROR FRECUENTE Y SU CORRECCIÓN</text><rect x="40" y="853.0" width="380.0" height="77.0" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/><text x="54" y="875.0" font-size="11" fill="#b91c1c" font-weight="700" text-anchor="start"><tspan x="54">Síntoma</tspan></text><text x="54" y="893.0" font-size="12.5" fill="#7f1d1d" font-weight="400" text-anchor="start"><tspan x="54">Publicar sobre temas que interesan a la empresa</tspan></text><line x1="426.0" y1="891.5" x2="469.0" y2="891.5" stroke="#4e39ac" stroke-width="2.6" stroke-linecap="round"/><polygon points="474.0,891.5 465.9,895.5 465.9,887.6" fill="#4e39ac"/><rect x="480.0" y="853.0" width="380.0" height="77.0" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.4"/><text x="494.0" y="875.0" font-size="11" fill="#15803d" font-weight="700" text-anchor="start"><tspan x="494.0">Corrección</tspan></text><text x="494.0" y="893.0" font-size="12.5" fill="#14532d" font-weight="400" text-anchor="start"><tspan x="494.0">Construye el calendario desde las preguntas</tspan><tspan x="494.0" dy="16.5">registradas en llamadas y soporte.</tspan></text></svg>