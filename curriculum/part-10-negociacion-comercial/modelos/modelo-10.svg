<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1370" width="900" height="1370" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif"><title id="t">Modelo mental · Negociar con compras y procurement</title><desc id="d">Modelo mental de la clase 10.10: Negociar con compras y procurement. Método en 5 pasos; 4 conceptos; 3 señales de medición.</desc><rect x="0" y="0" width="900" height="1370" rx="14" fill="#ffffff"/><rect x="0" y="0" width="900" height="64" rx="14" fill="#2d6e20"/><rect x="0" y="40" width="900" height="24" fill="#2d6e20"/><text x="40" y="28" font-size="12" fill="#c3e5bc" font-weight="700" letter-spacing="1.6">MODELO MENTAL · CLASE 10.10 · PARTE 10</text><text x="40" y="52" font-size="21" fill="#ffffff" font-weight="700">Negociar con compras y procurement</text><text x="40" y="84" font-size="11.5" fill="#4cac39" font-weight="700" letter-spacing="1.4">MÉTODO PASO A PASO</text><ellipse cx="450.0" cy="403.2" rx="330.0" ry="251.2" fill="none" stroke="#97ce8c" stroke-width="2" stroke-dasharray="3 8" stroke-linecap="round"/><polygon points="653.6,205.3 636.2,201.8 641.4,192.4" fill="#4cac39"/><polygon points="759.5,490.9 761.2,473.3 771.1,477.5" fill="#4cac39"/><polygon points="439.0,654.4 455.9,649.0 455.9,659.8" fill="#4cac39"/><polygon points="131.8,470.7 143.4,484.1 133.5,488.4" fill="#4cac39"/><polygon points="265.7,194.7 253.5,207.6 248.3,198.1" fill="#4cac39"/><circle cx="450.0" cy="403.2" r="100.0" fill="#c3e5bc" stroke="#97ce8c" stroke-width="1.6"/><text x="450.0" y="385.5" font-size="15" fill="#2d6e20" font-weight="700" text-anchor="middle"><tspan x="450.0">Negociar con</tspan><tspan x="450.0" dy="19.8">compras y</tspan><tspan x="450.0" dy="19.8">procurement</tspan></text><rect x="361.0" y="106.0" width="178" height="92.0" rx="10" fill="#e6f7e2" stroke="#97ce8c" stroke-width="1.4"/><text x="373.0" y="128.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="373.0">Alinear al área</tspan><tspan x="373.0" dy="16.5">usuaria antes de la</tspan><tspan x="373.0" dy="16.5">intervención de</tspan><tspan x="373.0" dy="16.5">compras</tspan></text><circle cx="363.0" cy="108.0" r="14" fill="#2d6e20"/><text x="363.0" y="112.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><rect x="674.8" y="287.8" width="178" height="75.5" rx="10" fill="#e6f7e2" stroke="#97ce8c" stroke-width="1.4"/><text x="686.8" y="309.8" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="686.8">Documentar el costo</tspan><tspan x="686.8" dy="16.5">total y los</tspan><tspan x="686.8" dy="16.5">diferenciales</tspan></text><circle cx="676.8" cy="289.8" r="14" fill="#2d6e20"/><text x="676.8" y="294.3" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><rect x="555.0" y="576.9" width="178" height="59.0" rx="10" fill="#e6f7e2" stroke="#97ce8c" stroke-width="1.4"/><text x="567.0" y="598.9" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="567.0">Preparar el paquete de</tspan><tspan x="567.0" dy="16.5">contrapartidas</tspan></text><circle cx="557.0" cy="578.9" r="14" fill="#2d6e20"/><text x="557.0" y="583.4" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><rect x="167.0" y="560.4" width="178" height="92.0" rx="10" fill="#e6f7e2" stroke="#97ce8c" stroke-width="1.4"/><text x="179.0" y="582.4" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="179.0">Responder a la</tspan><tspan x="179.0" dy="16.5">comparabilidad forzada</tspan><tspan x="179.0" dy="16.5">con criterios</tspan><tspan x="179.0" dy="16.5">objetivos</tspan></text><circle cx="169.0" cy="562.4" r="14" fill="#2d6e20"/><text x="169.0" y="566.9" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">4</text><rect x="47.2" y="287.8" width="178" height="75.5" rx="10" fill="#e6f7e2" stroke="#97ce8c" stroke-width="1.4"/><text x="59.2" y="309.8" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="59.2">Cerrar con acuerdo</tspan><tspan x="59.2" dy="16.5">escrito y condiciones</tspan><tspan x="59.2" dy="16.5">claras</tspan></text><circle cx="49.2" cy="289.8" r="14" fill="#2d6e20"/><text x="49.2" y="294.3" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">5</text><text x="40" y="742.4" font-size="11.5" fill="#4cac39" font-weight="700" letter-spacing="1.4">CONCEPTOS Y DÓNDE ACTÚAN EN EL MÉTODO</text><rect x="40.0" y="756.4" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#97ce8c" stroke-width="1.4"/><rect x="40.0" y="764.4" width="5" height="62.2" rx="2" fill="#4cac39"/><text x="56.0" y="778.4" font-size="13.5" fill="#2d6e20" font-weight="700" text-anchor="start"><tspan x="56.0">Mandato de compras</tspan></text><text x="56.0" y="798.2" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Objetivo formal con que se evalúa al área, normalmente</tspan><tspan x="56.0" dy="15.2">ahorro y control de riesgo</tspan></text><rect x="379.0" y="764.4" width="54" height="20" rx="10" fill="#c3e5bc" stroke="#97ce8c" stroke-width="1"/><text x="406.0" y="778.4" font-size="11" fill="#2d6e20" font-weight="700" text-anchor="middle">↔ 1</text><rect x="459.0" y="756.4" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#97ce8c" stroke-width="1.4"/><rect x="459.0" y="764.4" width="5" height="62.2" rx="2" fill="#4cac39"/><text x="475.0" y="778.4" font-size="13.5" fill="#2d6e20" font-weight="700" text-anchor="start"><tspan x="475.0">Comparabilidad forzada</tspan></text><text x="475.0" y="798.2" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Presión por evaluar ofertas distintas bajo un mismo</tspan><tspan x="475.0" dy="15.2">formato</tspan></text><rect x="798.0" y="764.4" width="54" height="20" rx="10" fill="#c3e5bc" stroke="#97ce8c" stroke-width="1"/><text x="825.0" y="778.4" font-size="11" fill="#2d6e20" font-weight="700" text-anchor="middle">↔ 4</text><rect x="40.0" y="848.6" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#97ce8c" stroke-width="1.4"/><rect x="40.0" y="856.6" width="5" height="62.2" rx="2" fill="#4cac39"/><text x="56.0" y="870.6" font-size="13.5" fill="#2d6e20" font-weight="700" text-anchor="start"><tspan x="56.0">Alianza con el área usuaria</tspan></text><text x="56.0" y="890.4" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Respaldo interno que sostiene el valor durante la</tspan><tspan x="56.0" dy="15.2">negociación de condiciones</tspan></text><rect x="379.0" y="856.6" width="54" height="20" rx="10" fill="#c3e5bc" stroke="#97ce8c" stroke-width="1"/><text x="406.0" y="870.6" font-size="11" fill="#2d6e20" font-weight="700" text-anchor="middle">↔ 1</text><rect x="459.0" y="848.6" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#97ce8c" stroke-width="1.4"/><rect x="459.0" y="856.6" width="5" height="62.2" rx="2" fill="#4cac39"/><text x="475.0" y="870.6" font-size="13.5" fill="#2d6e20" font-weight="700" text-anchor="start"><tspan x="475.0">Paquete de contrapartidas</tspan></text><text x="475.0" y="890.4" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Conjunto de concesiones preparadas con su exigencia</tspan><tspan x="475.0" dy="15.2">asociada</tspan></text><rect x="798.0" y="856.6" width="54" height="20" rx="10" fill="#c3e5bc" stroke="#97ce8c" stroke-width="1"/><text x="825.0" y="870.6" font-size="11" fill="#2d6e20" font-weight="700" text-anchor="middle">↔ 3</text><text x="40" y="958.76" font-size="11.5" fill="#4cac39" font-weight="700" letter-spacing="1.4">QUÉ SE MIDE: NUMERADOR SOBRE DENOMINADOR</text><rect x="40.0" y="972.8" width="261.3" height="135.9" rx="8" fill="#e6f7e2" stroke="#97ce8c" stroke-width="1.4"/><text x="54.0" y="994.8" font-size="13" fill="#2d6e20" font-weight="700" text-anchor="start"><tspan x="54.0">Diferencia de margen con y sin</tspan><tspan x="54.0" dy="17.2">intervención de compras</tspan></text><text x="54.0" y="1041.1" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Margen promedio de negocios con</tspan><tspan x="54.0" dy="15.2">compras frente a los sin compras</tspan></text><rect x="319.3" y="972.8" width="261.3" height="135.9" rx="8" fill="#e6f7e2" stroke="#97ce8c" stroke-width="1.4"/><text x="333.3" y="994.8" font-size="13" fill="#2d6e20" font-weight="700" text-anchor="start"><tspan x="333.3">Respaldo del área usuaria</tspan></text><text x="333.3" y="1023.9" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="333.3">Negociaciones con participación</tspan><tspan x="333.3" dy="15.2">activa del usuario</tspan></text><line x1="333.3" y1="1060.3" x2="566.7" y2="1060.3" stroke="#4cac39" stroke-width="2"/><text x="333.3" y="1078.3" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="333.3">Negociaciones con compras</tspan></text><rect x="598.7" y="972.8" width="261.3" height="135.9" rx="8" fill="#e6f7e2" stroke="#97ce8c" stroke-width="1.4"/><text x="612.7" y="994.8" font-size="13" fill="#2d6e20" font-weight="700" text-anchor="start"><tspan x="612.7">Contrapartidas obtenidas</tspan></text><text x="612.7" y="1023.9" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="612.7">Valor de las contrapartidas</tspan><tspan x="612.7" dy="15.2">conseguidas</tspan></text><line x1="612.7" y1="1060.3" x2="846.0" y2="1060.3" stroke="#4cac39" stroke-width="2"/><text x="612.7" y="1078.3" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="612.7">El valor de las concesiones</tspan><tspan x="612.7" dy="15.2">otorgadas</tspan></text><text x="40" y="1142.6399999999999" font-size="11.5" fill="#4cac39" font-weight="700" letter-spacing="1.4">FRONTERA DE APLICACIÓN</text><rect x="40" y="1152.6" width="820" height="65.0" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.4"/><polygon points="70,1170.1399999999999 52,1199.1399999999999 88,1199.1399999999999" fill="#c2410c"/><text x="70" y="1196.1399999999999" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">!</text><text x="106" y="1176.6" font-size="12.5" fill="#7c2d12" font-weight="400" text-anchor="start"><tspan x="106">En procesos públicos y en algunas corporaciones, el contacto con el área usuaria durante la evaluación</tspan><tspan x="106" dy="16.5">está restringido. Las reglas del proceso mandan.</tspan></text><text x="40" y="1245.6399999999999" font-size="11.5" fill="#4cac39" font-weight="700" letter-spacing="1.4">ERROR FRECUENTE Y SU CORRECCIÓN</text><rect x="40" y="1255.6" width="380.0" height="77.0" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/><text x="54" y="1277.6" font-size="11" fill="#b91c1c" font-weight="700" text-anchor="start"><tspan x="54">Síntoma</tspan></text><text x="54" y="1295.6" font-size="12.5" fill="#7f1d1d" font-weight="400" text-anchor="start"><tspan x="54">Negociar con compras sin respaldo del área usuaria</tspan></text><line x1="426.0" y1="1294.1" x2="469.0" y2="1294.1" stroke="#4cac39" stroke-width="2.6" stroke-linecap="round"/><polygon points="474.0,1294.1 465.9,1298.1 465.9,1290.2" fill="#4cac39"/><rect x="480.0" y="1255.6" width="380.0" height="77.0" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.4"/><text x="494.0" y="1277.6" font-size="11" fill="#15803d" font-weight="700" text-anchor="start"><tspan x="494.0">Corrección</tspan></text><text x="494.0" y="1295.6" font-size="12.5" fill="#14532d" font-weight="400" text-anchor="start"><tspan x="494.0">Alinea al usuario antes y solicita su participación</tspan><tspan x="494.0" dy="16.5">en la conversación de condiciones.</tspan></text></svg>