<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 940" width="900" height="940" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif"><title id="t">Modelo mental · Fuentes primarias y secundarias</title><desc id="d">Modelo mental de la clase 03.02: Fuentes primarias y secundarias. Método en 5 pasos; 4 conceptos; 3 señales de medición.</desc><rect x="0" y="0" width="900" height="940" rx="14" fill="#ffffff"/><rect x="0" y="0" width="900" height="64" rx="14" fill="#206e3b"/><rect x="0" y="40" width="900" height="24" fill="#206e3b"/><text x="40" y="28" font-size="12" fill="#bce5ca" font-weight="700" letter-spacing="1.6">MODELO MENTAL · CLASE 03.02 · PARTE 03</text><text x="40" y="52" font-size="21" fill="#ffffff" font-weight="700">Fuentes primarias y secundarias</text><text x="40" y="84" font-size="11.5" fill="#39ac61" font-weight="700" letter-spacing="1.4">MÉTODO PASO A PASO</text><rect x="40.0" y="100" width="246.7" height="75.5" rx="10" fill="#e2f7e9" stroke="#8ccea3" stroke-width="1.4"/><text x="54.0" y="122" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Buscar primero si la pregunta ya</tspan><tspan x="54.0" dy="16.5">fue respondida por una fuente</tspan><tspan x="54.0" dy="16.5">confiable</tspan></text><circle cx="42.0" cy="102.0" r="14" fill="#206e3b"/><text x="42.0" y="106.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><rect x="326.7" y="100" width="246.7" height="75.5" rx="10" fill="#e2f7e9" stroke="#8ccea3" stroke-width="1.4"/><text x="340.7" y="122" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="340.7">Leer la metodología antes de</tspan><tspan x="340.7" dy="16.5">usar la cifra</tspan></text><circle cx="328.7" cy="102.0" r="14" fill="#206e3b"/><text x="328.7" y="106.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><rect x="613.3" y="100" width="246.7" height="75.5" rx="10" fill="#e2f7e9" stroke="#8ccea3" stroke-width="1.4"/><text x="627.3" y="122" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="627.3">Registrar origen, muestra,</tspan><tspan x="627.3" dy="16.5">periodo y fecha de consulta</tspan></text><circle cx="615.3" cy="102.0" r="14" fill="#206e3b"/><text x="615.3" y="106.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><rect x="613.3" y="213.5" width="246.7" height="59.0" rx="10" fill="#e2f7e9" stroke="#8ccea3" stroke-width="1.4"/><text x="627.3" y="235.5" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="627.3">Identificar qué parte de la</tspan><tspan x="627.3" dy="16.5">pregunta sigue sin respuesta</tspan></text><circle cx="615.3" cy="215.5" r="14" fill="#206e3b"/><text x="615.3" y="220.0" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">4</text><rect x="326.7" y="213.5" width="246.7" height="59.0" rx="10" fill="#e2f7e9" stroke="#8ccea3" stroke-width="1.4"/><text x="340.7" y="235.5" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="340.7">Diseñar la recolección primaria</tspan><tspan x="340.7" dy="16.5">sólo para ese remanente</tspan></text><circle cx="328.7" cy="215.5" r="14" fill="#206e3b"/><text x="328.7" y="220.0" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">5</text><line x1="289.7" y1="137.8" x2="318.7" y2="137.8" stroke="#39ac61" stroke-width="2.2" stroke-linecap="round"/><polygon points="323.7,137.8 315.6,141.7 315.6,133.8" fill="#39ac61"/><line x1="576.3" y1="137.8" x2="605.3" y2="137.8" stroke="#39ac61" stroke-width="2.2" stroke-linecap="round"/><polygon points="610.3,137.8 602.2,141.7 602.2,133.8" fill="#39ac61"/><line x1="736.7" y1="177.5" x2="736.7" y2="205.5" stroke="#39ac61" stroke-width="2.2" stroke-linecap="round"/><polygon points="736.7,210.5 732.8,202.4 740.6,202.4" fill="#39ac61"/><line x1="610.3" y1="243.0" x2="581.3" y2="243.0" stroke="#39ac61" stroke-width="2.2" stroke-linecap="round"/><polygon points="576.3,243.0 584.4,239.1 584.4,246.9" fill="#39ac61"/><text x="40" y="310.5" font-size="11.5" fill="#39ac61" font-weight="700" letter-spacing="1.4">CONCEPTOS Y DÓNDE ACTÚAN EN EL MÉTODO</text><rect x="40.0" y="324.5" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#8ccea3" stroke-width="1.4"/><rect x="40.0" y="332.5" width="5" height="62.2" rx="2" fill="#39ac61"/><text x="56.0" y="346.5" font-size="13.5" fill="#206e3b" font-weight="700" text-anchor="start"><tspan x="56.0">Fuente primaria</tspan></text><text x="56.0" y="366.3" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Evidencia recogida directamente por la empresa para su</tspan><tspan x="56.0" dy="15.2">propia pregunta</tspan></text><rect x="379.0" y="332.5" width="54" height="20" rx="10" fill="#bce5ca" stroke="#8ccea3" stroke-width="1"/><text x="406.0" y="346.5" font-size="11" fill="#206e3b" font-weight="700" text-anchor="middle">↔ 1, 5</text><rect x="459.0" y="324.5" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#8ccea3" stroke-width="1.4"/><rect x="459.0" y="332.5" width="5" height="62.2" rx="2" fill="#39ac61"/><text x="475.0" y="346.5" font-size="13.5" fill="#206e3b" font-weight="700" text-anchor="start"><tspan x="475.0">Fuente secundaria</tspan></text><text x="475.0" y="366.3" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Dato producido por un tercero con un propósito y una</tspan><tspan x="475.0" dy="15.2">metodología ajenos</tspan></text><rect x="798.0" y="332.5" width="54" height="20" rx="10" fill="#bce5ca" stroke="#8ccea3" stroke-width="1"/><text x="825.0" y="346.5" font-size="11" fill="#206e3b" font-weight="700" text-anchor="middle">↔ 1</text><rect x="40.0" y="416.7" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#8ccea3" stroke-width="1.4"/><rect x="40.0" y="424.7" width="5" height="62.2" rx="2" fill="#39ac61"/><text x="56.0" y="438.7" font-size="13.5" fill="#206e3b" font-weight="700" text-anchor="start"><tspan x="56.0">Trazabilidad de la cifra</tspan></text><text x="56.0" y="458.5" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Registro de origen, metodología, muestra, periodo y fecha</tspan><tspan x="56.0" dy="15.2">de consulta</tspan></text><rect x="379.0" y="424.7" width="54" height="20" rx="10" fill="#bce5ca" stroke="#8ccea3" stroke-width="1"/><text x="406.0" y="438.7" font-size="11" fill="#206e3b" font-weight="700" text-anchor="middle">↔ 2, 3</text><rect x="459.0" y="416.7" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#8ccea3" stroke-width="1.4"/><rect x="459.0" y="424.7" width="5" height="62.2" rx="2" fill="#39ac61"/><text x="475.0" y="438.7" font-size="13.5" fill="#206e3b" font-weight="700" text-anchor="start"><tspan x="475.0">Vigencia del dato</tspan></text><text x="475.0" y="458.5" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Periodo durante el cual la cifra sigue siendo</tspan><tspan x="475.0" dy="15.2">representativa del fenómeno</tspan></text><text x="40" y="526.86" font-size="11.5" fill="#39ac61" font-weight="700" letter-spacing="1.4">QUÉ SE MIDE: NUMERADOR SOBRE DENOMINADOR</text><rect x="40.0" y="540.9" width="261.3" height="137.9" rx="8" fill="#e2f7e9" stroke="#8ccea3" stroke-width="1.4"/><text x="54.0" y="562.9" font-size="13" fill="#206e3b" font-weight="700" text-anchor="start"><tspan x="54.0">Cifras citadas con trazabilidad</tspan><tspan x="54.0" dy="17.2">completa</tspan></text><text x="54.0" y="609.2" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Cifras con origen, metodología y</tspan><tspan x="54.0" dy="15.2">fecha registrados</tspan></text><line x1="54.0" y1="645.5" x2="287.3" y2="645.5" stroke="#39ac61" stroke-width="2"/><text x="54.0" y="663.5" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="54.0">Cifras usadas en el informe</tspan></text><rect x="319.3" y="540.9" width="261.3" height="137.9" rx="8" fill="#e2f7e9" stroke="#8ccea3" stroke-width="1.4"/><text x="333.3" y="562.9" font-size="13" fill="#206e3b" font-weight="700" text-anchor="start"><tspan x="333.3">Antigüedad mediana de las</tspan><tspan x="333.3" dy="17.2">fuentes</tspan></text><text x="333.3" y="609.2" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="333.3">Meses transcurridos desde la</tspan><tspan x="333.3" dy="15.2">publicación de las fuentes citadas</tspan></text><rect x="598.7" y="540.9" width="261.3" height="137.9" rx="8" fill="#e2f7e9" stroke="#8ccea3" stroke-width="1.4"/><text x="612.7" y="562.9" font-size="13" fill="#206e3b" font-weight="700" text-anchor="start"><tspan x="612.7">Costo evitado por reutilización</tspan></text><text x="612.7" y="592.0" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="612.7">Estimación del costo de recolección</tspan><tspan x="612.7" dy="15.2">primaria evitado al usar fuentes</tspan><tspan x="612.7" dy="15.2">existentes</tspan></text><text x="40" y="712.72" font-size="11.5" fill="#39ac61" font-weight="700" letter-spacing="1.4">FRONTERA DE APLICACIÓN</text><rect x="40" y="722.7" width="820" height="65.0" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.4"/><polygon points="70,740.22 52,769.22 88,769.22" fill="#c2410c"/><text x="70" y="766.22" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">!</text><text x="106" y="746.7" font-size="12.5" fill="#7c2d12" font-weight="400" text-anchor="start"><tspan x="106">Las fuentes oficiales tienen rezago y niveles de agregación que pueden no servir para un segmento</tspan><tspan x="106" dy="16.5">estrecho. Su autoridad no las hace aplicables a cualquier pregunta.</tspan></text><text x="40" y="815.72" font-size="11.5" fill="#39ac61" font-weight="700" letter-spacing="1.4">ERROR FRECUENTE Y SU CORRECCIÓN</text><rect x="40" y="825.7" width="380.0" height="77.0" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/><text x="54" y="847.7" font-size="11" fill="#b91c1c" font-weight="700" text-anchor="start"><tspan x="54">Síntoma</tspan></text><text x="54" y="865.7" font-size="12.5" fill="#7f1d1d" font-weight="400" text-anchor="start"><tspan x="54">Citar cifras sin metodología ni fecha</tspan></text><line x1="426.0" y1="864.2" x2="469.0" y2="864.2" stroke="#39ac61" stroke-width="2.6" stroke-linecap="round"/><polygon points="474.0,864.2 465.9,868.1 465.9,860.3" fill="#39ac61"/><rect x="480.0" y="825.7" width="380.0" height="77.0" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.4"/><text x="494.0" y="847.7" font-size="11" fill="#15803d" font-weight="700" text-anchor="start"><tspan x="494.0">Corrección</tspan></text><text x="494.0" y="865.7" font-size="12.5" fill="#14532d" font-weight="400" text-anchor="start"><tspan x="494.0">Incluye en cada cifra origen, muestra, periodo y</tspan><tspan x="494.0" dy="16.5">fecha de consulta, o elimínala del informe.</tspan></text></svg>