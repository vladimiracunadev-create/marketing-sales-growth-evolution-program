<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 951" width="900" height="951" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif"><title id="t">Modelo mental · Prospección y ventas del Capstone</title><desc id="d">Modelo mental de la clase 24.08: Prospección y ventas del Capstone. Método en 5 pasos; 4 conceptos; 3 señales de medición.</desc><rect x="0" y="0" width="900" height="951" rx="14" fill="#ffffff"/><rect x="0" y="0" width="900" height="64" rx="14" fill="#6e5e20"/><rect x="0" y="40" width="900" height="24" fill="#6e5e20"/><text x="40" y="28" font-size="12" fill="#e5ddbc" font-weight="700" letter-spacing="1.6">MODELO MENTAL · CLASE 24.08 · PARTE 24</text><text x="40" y="52" font-size="21" fill="#ffffff" font-weight="700">Prospección y ventas del Capstone</text><text x="40" y="84" font-size="11.5" fill="#ac9539" font-weight="700" letter-spacing="1.4">MÉTODO PASO A PASO</text><line x1="450.0" y1="94.0" x2="450.0" y2="300.5" stroke="#cec08c" stroke-width="3" stroke-linecap="round"/><line x1="450.0" y1="129.5" x2="406.0" y2="129.5" stroke="#cec08c" stroke-width="2"/><rect x="56.0" y="100" width="350" height="59.0" rx="10" fill="#f7f3e2" stroke="#cec08c" stroke-width="1.4"/><text x="70.0" y="122" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="70.0">Construir la lista objetivo con base de licitud</tspan><tspan x="70.0" dy="16.5">documentada</tspan></text><circle cx="450.0" cy="129.5" r="15" fill="#6e5e20"/><text x="450.0" y="134.0" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><line x1="450.0" y1="159.2" x2="494.0" y2="159.2" stroke="#cec08c" stroke-width="2"/><rect x="494.0" y="138" width="350" height="42.5" rx="10" fill="#f7f3e2" stroke="#cec08c" stroke-width="1.4"/><text x="508.0" y="160" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="508.0">Diseñar secuencias y guiones por segmento</tspan></text><circle cx="450.0" cy="159.2" r="15" fill="#6e5e20"/><text x="450.0" y="163.8" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><line x1="450.0" y1="205.5" x2="406.0" y2="205.5" stroke="#cec08c" stroke-width="2"/><rect x="56.0" y="176" width="350" height="59.0" rx="10" fill="#f7f3e2" stroke="#cec08c" stroke-width="1.4"/><text x="70.0" y="198" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="70.0">Producir la propuesta estándar con alcance y</tspan><tspan x="70.0" dy="16.5">exclusiones</tspan></text><circle cx="450.0" cy="205.5" r="15" fill="#6e5e20"/><text x="450.0" y="210.0" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><line x1="450.0" y1="235.2" x2="494.0" y2="235.2" stroke="#cec08c" stroke-width="2"/><rect x="494.0" y="214" width="350" height="42.5" rx="10" fill="#f7f3e2" stroke="#cec08c" stroke-width="1.4"/><text x="508.0" y="236" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="508.0">Documentar objeciones frecuentes con respuesta</tspan></text><circle cx="450.0" cy="235.2" r="15" fill="#6e5e20"/><text x="450.0" y="239.8" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">4</text><line x1="450.0" y1="273.2" x2="406.0" y2="273.2" stroke="#cec08c" stroke-width="2"/><rect x="56.0" y="252" width="350" height="42.5" rx="10" fill="#f7f3e2" stroke="#cec08c" stroke-width="1.4"/><text x="70.0" y="274" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="70.0">Probar el sistema con una persona ajena</tspan></text><circle cx="450.0" cy="273.2" r="15" fill="#6e5e20"/><text x="450.0" y="277.8" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">5</text><text x="40" y="336.5" font-size="11.5" fill="#ac9539" font-weight="700" letter-spacing="1.4">CONCEPTOS Y DÓNDE ACTÚAN EN EL MÉTODO</text><rect x="40.0" y="350.5" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#cec08c" stroke-width="1.4"/><rect x="40.0" y="358.5" width="5" height="62.2" rx="2" fill="#ac9539"/><text x="56.0" y="372.5" font-size="13.5" fill="#6e5e20" font-weight="700" text-anchor="start"><tspan x="56.0">Sistema comercial ejecutable</tspan></text><text x="56.0" y="392.3" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Conjunto de materiales y reglas que permite operar sin</tspan><tspan x="56.0" dy="15.2">improvisar</tspan></text><rect x="379.0" y="358.5" width="54" height="20" rx="10" fill="#e5ddbc" stroke="#cec08c" stroke-width="1"/><text x="406.0" y="372.5" font-size="11" fill="#6e5e20" font-weight="700" text-anchor="middle">↔ 5</text><rect x="459.0" y="350.5" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#cec08c" stroke-width="1.4"/><rect x="459.0" y="358.5" width="5" height="62.2" rx="2" fill="#ac9539"/><text x="475.0" y="372.5" font-size="13.5" fill="#6e5e20" font-weight="700" text-anchor="start"><tspan x="475.0">Base de licitud de la lista</tspan></text><text x="475.0" y="392.3" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Fundamento jurídico que permite contactar a los prospectos</tspan></text><rect x="798.0" y="358.5" width="54" height="20" rx="10" fill="#e5ddbc" stroke="#cec08c" stroke-width="1"/><text x="825.0" y="372.5" font-size="11" fill="#6e5e20" font-weight="700" text-anchor="middle">↔ 1</text><rect x="40.0" y="442.7" width="401.0" height="63.0" rx="8" fill="#ffffff" stroke="#cec08c" stroke-width="1.4"/><rect x="40.0" y="450.7" width="5" height="47.0" rx="2" fill="#ac9539"/><text x="56.0" y="464.7" font-size="13.5" fill="#6e5e20" font-weight="700" text-anchor="start"><tspan x="56.0">Guion de diagnóstico</tspan></text><text x="56.0" y="484.5" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Conjunto de preguntas ordenadas por objetivo</tspan></text><rect x="379.0" y="450.7" width="54" height="20" rx="10" fill="#e5ddbc" stroke="#cec08c" stroke-width="1"/><text x="406.0" y="464.7" font-size="11" fill="#6e5e20" font-weight="700" text-anchor="middle">↔ 2</text><rect x="459.0" y="442.7" width="401.0" height="63.0" rx="8" fill="#ffffff" stroke="#cec08c" stroke-width="1.4"/><rect x="459.0" y="450.7" width="5" height="47.0" rx="2" fill="#ac9539"/><text x="475.0" y="464.7" font-size="13.5" fill="#6e5e20" font-weight="700" text-anchor="start"><tspan x="475.0">Criterio de calificación</tspan></text><text x="475.0" y="484.5" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Condiciones verificables para invertir tiempo comercial</tspan></text><text x="40" y="537.6800000000001" font-size="11.5" fill="#ac9539" font-weight="700" letter-spacing="1.4">QUÉ SE MIDE: NUMERADOR SOBRE DENOMINADOR</text><rect x="40.0" y="551.7" width="261.3" height="137.9" rx="8" fill="#f7f3e2" stroke="#cec08c" stroke-width="1.4"/><text x="54.0" y="573.7" font-size="13" fill="#6e5e20" font-weight="700" text-anchor="start"><tspan x="54.0">Materiales completos</tspan></text><text x="54.0" y="602.8" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Materiales producidos</tspan></text><line x1="54.0" y1="624.0" x2="287.3" y2="624.0" stroke="#ac9539" stroke-width="2"/><text x="54.0" y="642.0" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="54.0">Materiales definidos como necesarios</tspan></text><rect x="319.3" y="551.7" width="261.3" height="137.9" rx="8" fill="#f7f3e2" stroke="#cec08c" stroke-width="1.4"/><text x="333.3" y="573.7" font-size="13" fill="#6e5e20" font-weight="700" text-anchor="start"><tspan x="333.3">Resultado de la prueba de</tspan><tspan x="333.3" dy="17.2">ejecución</tspan></text><text x="333.3" y="620.0" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="333.3">Etapas que la persona ajena pudo</tspan><tspan x="333.3" dy="15.2">ejecutar</tspan></text><line x1="333.3" y1="656.4" x2="566.7" y2="656.4" stroke="#ac9539" stroke-width="2"/><text x="333.3" y="674.4" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="333.3">Etapas del proceso</tspan></text><rect x="598.7" y="551.7" width="261.3" height="137.9" rx="8" fill="#f7f3e2" stroke="#cec08c" stroke-width="1.4"/><text x="612.7" y="573.7" font-size="13" fill="#6e5e20" font-weight="700" text-anchor="start"><tspan x="612.7">Cumplimiento normativo de la</tspan><tspan x="612.7" dy="17.2">lista</tspan></text><text x="612.7" y="620.0" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="612.7">Contactos con base de licitud</tspan><tspan x="612.7" dy="15.2">documentada</tspan></text><line x1="612.7" y1="656.4" x2="846.0" y2="656.4" stroke="#ac9539" stroke-width="2"/><text x="612.7" y="674.4" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="612.7">Contactos de la lista</tspan></text><text x="40" y="723.5400000000001" font-size="11.5" fill="#ac9539" font-weight="700" letter-spacing="1.4">FRONTERA DE APLICACIÓN</text><rect x="40" y="733.5" width="820" height="65.0" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.4"/><polygon points="70,751.0400000000001 52,780.0400000000001 88,780.0400000000001" fill="#c2410c"/><text x="70" y="777.0400000000001" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">!</text><text x="106" y="757.5" font-size="12.5" fill="#7c2d12" font-weight="400" text-anchor="start"><tspan x="106">Sin ejecución real no hay tasas de conversión propias. Las estimaciones deben declararse como supuestos</tspan><tspan x="106" dy="16.5">con su fuente de referencia.</tspan></text><text x="40" y="826.5400000000001" font-size="11.5" fill="#ac9539" font-weight="700" letter-spacing="1.4">ERROR FRECUENTE Y SU CORRECCIÓN</text><rect x="40" y="836.5" width="380.0" height="77.0" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/><text x="54" y="858.5" font-size="11" fill="#b91c1c" font-weight="700" text-anchor="start"><tspan x="54">Síntoma</tspan></text><text x="54" y="876.5" font-size="12.5" fill="#7f1d1d" font-weight="400" text-anchor="start"><tspan x="54">Construir la lista sin documentar la base de</tspan><tspan x="54" dy="16.5">licitud</tspan></text><line x1="426.0" y1="875.0" x2="469.0" y2="875.0" stroke="#ac9539" stroke-width="2.6" stroke-linecap="round"/><polygon points="474.0,875.0 465.9,879.0 465.9,871.1" fill="#ac9539"/><rect x="480.0" y="836.5" width="380.0" height="77.0" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.4"/><text x="494.0" y="858.5" font-size="11" fill="#15803d" font-weight="700" text-anchor="start"><tspan x="494.0">Corrección</tspan></text><text x="494.0" y="876.5" font-size="12.5" fill="#14532d" font-weight="400" text-anchor="start"><tspan x="494.0">Registra origen y fundamento de cada contacto antes</tspan><tspan x="494.0" dy="16.5">de incorporarlo a la lista.</tspan></text></svg>