<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 957" width="900" height="957" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif"><title id="t">Modelo mental · Proceso comercial reproducible</title><desc id="d">Modelo mental de la clase 08.01: Proceso comercial reproducible. Método en 5 pasos; 4 conceptos; 3 señales de medición.</desc><rect x="0" y="0" width="900" height="957" rx="14" fill="#ffffff"/><rect x="0" y="0" width="900" height="64" rx="14" fill="#6e3520"/><rect x="0" y="40" width="900" height="24" fill="#6e3520"/><text x="40" y="28" font-size="12" fill="#e5c7bc" font-weight="700" letter-spacing="1.6">MODELO MENTAL · CLASE 08.01 · PARTE 08</text><text x="40" y="52" font-size="21" fill="#ffffff" font-weight="700">Proceso comercial reproducible</text><text x="40" y="84" font-size="11.5" fill="#ac5739" font-weight="700" letter-spacing="1.4">MÉTODO PASO A PASO</text><rect x="40.0" y="100" width="246.7" height="59.0" rx="10" fill="#f7e8e2" stroke="#ce9e8c" stroke-width="1.4"/><text x="54.0" y="122" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Reconstruir el proceso real que</tspan><tspan x="54.0" dy="16.5">siguen los negocios ganados</tspan></text><circle cx="42.0" cy="102.0" r="14" fill="#6e3520"/><text x="42.0" y="106.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><rect x="326.7" y="100" width="246.7" height="59.0" rx="10" fill="#f7e8e2" stroke="#ce9e8c" stroke-width="1.4"/><text x="340.7" y="122" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="340.7">Definir etapas por</tspan><tspan x="340.7" dy="16.5">comportamiento del cliente</tspan></text><circle cx="328.7" cy="102.0" r="14" fill="#6e3520"/><text x="328.7" y="106.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><rect x="613.3" y="100" width="246.7" height="59.0" rx="10" fill="#f7e8e2" stroke="#ce9e8c" stroke-width="1.4"/><text x="627.3" y="122" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="627.3">Escribir criterios de salida</tspan><tspan x="627.3" dy="16.5">verificables</tspan></text><circle cx="615.3" cy="102.0" r="14" fill="#6e3520"/><text x="615.3" y="106.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><rect x="613.3" y="197.0" width="246.7" height="75.5" rx="10" fill="#f7e8e2" stroke="#ce9e8c" stroke-width="1.4"/><text x="627.3" y="219.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="627.3">Asociar materiales y preguntas a</tspan><tspan x="627.3" dy="16.5">cada etapa</tspan></text><circle cx="615.3" cy="199.0" r="14" fill="#6e3520"/><text x="615.3" y="203.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">4</text><rect x="326.7" y="197.0" width="246.7" height="75.5" rx="10" fill="#f7e8e2" stroke="#ce9e8c" stroke-width="1.4"/><text x="340.7" y="219.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="340.7">Medir dispersión de desempeño y</tspan><tspan x="340.7" dy="16.5">corregir el proceso, no sólo a</tspan><tspan x="340.7" dy="16.5">la persona</tspan></text><circle cx="328.7" cy="199.0" r="14" fill="#6e3520"/><text x="328.7" y="203.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">5</text><line x1="289.7" y1="129.5" x2="318.7" y2="129.5" stroke="#ac5739" stroke-width="2.2" stroke-linecap="round"/><polygon points="323.7,129.5 315.6,133.4 315.6,125.6" fill="#ac5739"/><line x1="576.3" y1="129.5" x2="605.3" y2="129.5" stroke="#ac5739" stroke-width="2.2" stroke-linecap="round"/><polygon points="610.3,129.5 602.2,133.4 602.2,125.6" fill="#ac5739"/><line x1="736.7" y1="161.0" x2="736.7" y2="189.0" stroke="#ac5739" stroke-width="2.2" stroke-linecap="round"/><polygon points="736.7,194.0 732.8,185.9 740.6,185.9" fill="#ac5739"/><line x1="610.3" y1="234.8" x2="581.3" y2="234.8" stroke="#ac5739" stroke-width="2.2" stroke-linecap="round"/><polygon points="576.3,234.8 584.4,230.8 584.4,238.7" fill="#ac5739"/><text x="40" y="310.5" font-size="11.5" fill="#ac5739" font-weight="700" letter-spacing="1.4">CONCEPTOS Y DÓNDE ACTÚAN EN EL MÉTODO</text><rect x="40.0" y="324.5" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#ce9e8c" stroke-width="1.4"/><rect x="40.0" y="332.5" width="5" height="62.2" rx="2" fill="#ac5739"/><text x="56.0" y="346.5" font-size="13.5" fill="#6e3520" font-weight="700" text-anchor="start"><tspan x="56.0">Etapa comercial</tspan></text><text x="56.0" y="366.3" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Estado de la oportunidad definido por lo que el cliente ha</tspan><tspan x="56.0" dy="15.2">hecho, no por lo que el vendedor intentó</tspan></text><rect x="379.0" y="332.5" width="54" height="20" rx="10" fill="#e5c7bc" stroke="#ce9e8c" stroke-width="1"/><text x="406.0" y="346.5" font-size="11" fill="#6e3520" font-weight="700" text-anchor="middle">↔ 2, 4</text><rect x="459.0" y="324.5" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#ce9e8c" stroke-width="1.4"/><rect x="459.0" y="332.5" width="5" height="62.2" rx="2" fill="#ac5739"/><text x="475.0" y="346.5" font-size="13.5" fill="#6e3520" font-weight="700" text-anchor="start"><tspan x="475.0">Criterio de salida</tspan></text><text x="475.0" y="366.3" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Condición verificable que debe cumplirse para avanzar a la</tspan><tspan x="475.0" dy="15.2">etapa siguiente</tspan></text><rect x="798.0" y="332.5" width="54" height="20" rx="10" fill="#e5c7bc" stroke="#ce9e8c" stroke-width="1"/><text x="825.0" y="346.5" font-size="11" fill="#6e3520" font-weight="700" text-anchor="middle">↔ 3</text><rect x="40.0" y="416.7" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#ce9e8c" stroke-width="1.4"/><rect x="40.0" y="424.7" width="5" height="62.2" rx="2" fill="#ac5739"/><text x="56.0" y="438.7" font-size="13.5" fill="#6e3520" font-weight="700" text-anchor="start"><tspan x="56.0">Playbook</tspan></text><text x="56.0" y="458.5" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Documento que asocia a cada etapa sus objetivos,</tspan><tspan x="56.0" dy="15.2">preguntas, materiales y errores frecuentes</tspan></text><rect x="379.0" y="424.7" width="54" height="20" rx="10" fill="#e5c7bc" stroke="#ce9e8c" stroke-width="1"/><text x="406.0" y="438.7" font-size="11" fill="#6e3520" font-weight="700" text-anchor="middle">↔ 4</text><rect x="459.0" y="416.7" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#ce9e8c" stroke-width="1.4"/><rect x="459.0" y="424.7" width="5" height="62.2" rx="2" fill="#ac5739"/><text x="475.0" y="438.7" font-size="13.5" fill="#6e3520" font-weight="700" text-anchor="start"><tspan x="475.0">Variabilidad del desempeño</tspan></text><text x="475.0" y="458.5" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Dispersión de resultados entre vendedores que ejecutan el</tspan><tspan x="475.0" dy="15.2">mismo proceso</tspan></text><rect x="798.0" y="424.7" width="54" height="20" rx="10" fill="#e5c7bc" stroke="#ce9e8c" stroke-width="1"/><text x="825.0" y="438.7" font-size="11" fill="#6e3520" font-weight="700" text-anchor="middle">↔ 5</text><text x="40" y="526.86" font-size="11.5" fill="#ac5739" font-weight="700" letter-spacing="1.4">QUÉ SE MIDE: NUMERADOR SOBRE DENOMINADOR</text><rect x="40.0" y="540.9" width="261.3" height="137.9" rx="8" fill="#f7e8e2" stroke="#ce9e8c" stroke-width="1.4"/><text x="54.0" y="562.9" font-size="13" fill="#6e3520" font-weight="700" text-anchor="start"><tspan x="54.0">Conversión por etapa</tspan></text><text x="54.0" y="592.0" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Oportunidades que avanzan a la etapa</tspan><tspan x="54.0" dy="15.2">siguiente</tspan></text><line x1="54.0" y1="628.4" x2="287.3" y2="628.4" stroke="#ac5739" stroke-width="2"/><text x="54.0" y="646.4" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="54.0">Las que ingresaron a la etapa</tspan></text><rect x="319.3" y="540.9" width="261.3" height="137.9" rx="8" fill="#f7e8e2" stroke="#ce9e8c" stroke-width="1.4"/><text x="333.3" y="562.9" font-size="13" fill="#6e3520" font-weight="700" text-anchor="start"><tspan x="333.3">Dispersión de desempeño</tspan></text><text x="333.3" y="592.0" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="333.3">Desviación estándar de la tasa de</tspan><tspan x="333.3" dy="15.2">cierre entre vendedores del mismo</tspan><tspan x="333.3" dy="15.2">segmento</tspan></text><rect x="598.7" y="540.9" width="261.3" height="137.9" rx="8" fill="#f7e8e2" stroke="#ce9e8c" stroke-width="1.4"/><text x="612.7" y="562.9" font-size="13" fill="#6e3520" font-weight="700" text-anchor="start"><tspan x="612.7">Cumplimiento de criterios de</tspan><tspan x="612.7" dy="17.2">salida</tspan></text><text x="612.7" y="609.2" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="612.7">Oportunidades avanzadas con criterio</tspan><tspan x="612.7" dy="15.2">cumplido</tspan></text><line x1="612.7" y1="645.5" x2="846.0" y2="645.5" stroke="#ac5739" stroke-width="2"/><text x="612.7" y="663.5" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="612.7">Oportunidades avanzadas</tspan></text><text x="40" y="712.72" font-size="11.5" fill="#ac5739" font-weight="700" letter-spacing="1.4">FRONTERA DE APLICACIÓN</text><rect x="40" y="722.7" width="820" height="65.0" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.4"/><polygon points="70,740.22 52,769.22 88,769.22" fill="#c2410c"/><text x="70" y="766.22" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">!</text><text x="106" y="746.7" font-size="12.5" fill="#7c2d12" font-weight="400" text-anchor="start"><tspan x="106">Un proceso demasiado rígido ahoga la lectura situacional del vendedor. El criterio es estandarizar las</tspan><tspan x="106" dy="16.5">decisiones repetibles y dejar libertad en la conversación.</tspan></text><text x="40" y="815.72" font-size="11.5" fill="#ac5739" font-weight="700" letter-spacing="1.4">ERROR FRECUENTE Y SU CORRECCIÓN</text><rect x="40" y="825.7" width="380.0" height="93.5" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/><text x="54" y="847.7" font-size="11" fill="#b91c1c" font-weight="700" text-anchor="start"><tspan x="54">Síntoma</tspan></text><text x="54" y="865.7" font-size="12.5" fill="#7f1d1d" font-weight="400" text-anchor="start"><tspan x="54">Definir etapas por actividad del vendedor</tspan></text><line x1="426.0" y1="872.5" x2="469.0" y2="872.5" stroke="#ac5739" stroke-width="2.6" stroke-linecap="round"/><polygon points="474.0,872.5 465.9,876.4 465.9,868.6" fill="#ac5739"/><rect x="480.0" y="825.7" width="380.0" height="93.5" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.4"/><text x="494.0" y="847.7" font-size="11" fill="#15803d" font-weight="700" text-anchor="start"><tspan x="494.0">Corrección</tspan></text><text x="494.0" y="865.7" font-size="12.5" fill="#14532d" font-weight="400" text-anchor="start"><tspan x="494.0">Reescribe cada etapa según lo que el cliente hizo:</tspan><tspan x="494.0" dy="16.5">aceptó reunión, compartió datos, presentó a su</tspan><tspan x="494.0" dy="16.5">comité.</tspan></text></svg>