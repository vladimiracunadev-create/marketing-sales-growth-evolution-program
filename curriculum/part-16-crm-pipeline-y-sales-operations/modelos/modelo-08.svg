<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1289" width="900" height="1289" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif"><title id="t">Modelo mental · Cuotas y territorios</title><desc id="d">Modelo mental de la clase 16.08: Cuotas y territorios. Método en 5 pasos; 4 conceptos; 3 señales de medición.</desc><rect x="0" y="0" width="900" height="1289" rx="14" fill="#ffffff"/><rect x="0" y="0" width="900" height="64" rx="14" fill="#6e4a20"/><rect x="0" y="40" width="900" height="24" fill="#6e4a20"/><text x="40" y="28" font-size="12" fill="#e5d2bc" font-weight="700" letter-spacing="1.6">MODELO MENTAL · CLASE 16.08 · PARTE 16</text><text x="40" y="52" font-size="21" fill="#ffffff" font-weight="700">Cuotas y territorios</text><text x="40" y="84" font-size="11.5" fill="#ac7639" font-weight="700" letter-spacing="1.4">MÉTODO PASO A PASO</text><ellipse cx="450.0" cy="376.8" rx="330.0" ry="233.1" fill="none" stroke="#ceaf8c" stroke-width="2" stroke-dasharray="3 8" stroke-linecap="round"/><polygon points="653.8,193.3 636.3,190.4 641.2,180.8" fill="#ac7639"/><polygon points="759.3,458.8 761.4,441.2 771.2,445.7" fill="#ac7639"/><polygon points="439.0,609.9 455.9,604.4 455.9,615.3" fill="#ac7639"/><polygon points="131.6,438.8 143.5,451.9 133.7,456.4" fill="#ac7639"/><polygon points="265.8,183.2 253.2,195.8 248.3,186.1" fill="#ac7639"/><circle cx="450.0" cy="376.8" r="100.0" fill="#e5d2bc" stroke="#ceaf8c" stroke-width="1.6"/><text x="450.0" y="369.0" font-size="15" fill="#6e4a20" font-weight="700" text-anchor="middle"><tspan x="450.0">Cuotas y</tspan><tspan x="450.0" dy="19.8">territorios</tspan></text><rect x="361.0" y="106.0" width="178" height="75.5" rx="10" fill="#f7ede2" stroke="#ceaf8c" stroke-width="1.4"/><text x="373.0" y="128.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="373.0">Estimar el potencial</tspan><tspan x="373.0" dy="16.5">por territorio con</tspan><tspan x="373.0" dy="16.5">datos</tspan></text><circle cx="363.0" cy="108.0" r="14" fill="#6e4a20"/><text x="363.0" y="112.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><rect x="674.8" y="267.0" width="178" height="75.5" rx="10" fill="#f7ede2" stroke="#ceaf8c" stroke-width="1.4"/><text x="686.8" y="289.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="686.8">Distribuir territorios</tspan><tspan x="686.8" dy="16.5">buscando equidad de</tspan><tspan x="686.8" dy="16.5">potencial</tspan></text><circle cx="676.8" cy="269.0" r="14" fill="#6e4a20"/><text x="676.8" y="273.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><rect x="555.0" y="527.6" width="178" height="75.5" rx="10" fill="#f7ede2" stroke="#ceaf8c" stroke-width="1.4"/><text x="567.0" y="549.6" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="567.0">Derivar la cuota del</tspan><tspan x="567.0" dy="16.5">potencial y no del</tspan><tspan x="567.0" dy="16.5">deseo</tspan></text><circle cx="557.0" cy="529.6" r="14" fill="#6e4a20"/><text x="557.0" y="534.1" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><rect x="167.0" y="527.6" width="178" height="75.5" rx="10" fill="#f7ede2" stroke="#ceaf8c" stroke-width="1.4"/><text x="179.0" y="549.6" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="179.0">Verificar la</tspan><tspan x="179.0" dy="16.5">alcanzabilidad</tspan><tspan x="179.0" dy="16.5">histórica</tspan></text><circle cx="169.0" cy="529.6" r="14" fill="#6e4a20"/><text x="169.0" y="534.1" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">4</text><rect x="47.2" y="267.0" width="178" height="75.5" rx="10" fill="#f7ede2" stroke="#ceaf8c" stroke-width="1.4"/><text x="59.2" y="289.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="59.2">Revisar la asignación</tspan><tspan x="59.2" dy="16.5">cada año con datos de</tspan><tspan x="59.2" dy="16.5">resultado</tspan></text><circle cx="49.2" cy="269.0" r="14" fill="#6e4a20"/><text x="49.2" y="273.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">5</text><text x="40" y="689.6" font-size="11.5" fill="#ac7639" font-weight="700" letter-spacing="1.4">CONCEPTOS Y DÓNDE ACTÚAN EN EL MÉTODO</text><rect x="40.0" y="703.6" width="401.0" height="63.0" rx="8" fill="#ffffff" stroke="#ceaf8c" stroke-width="1.4"/><rect x="40.0" y="711.6" width="5" height="47.0" rx="2" fill="#ac7639"/><text x="56.0" y="725.6" font-size="13.5" fill="#6e4a20" font-weight="700" text-anchor="start"><tspan x="56.0">Cuota</tspan></text><text x="56.0" y="745.4" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Meta individual de resultado asignada para un periodo</tspan></text><rect x="379.0" y="711.6" width="54" height="20" rx="10" fill="#e5d2bc" stroke="#ceaf8c" stroke-width="1"/><text x="406.0" y="725.6" font-size="11" fill="#6e4a20" font-weight="700" text-anchor="middle">↔ 3, 5</text><rect x="459.0" y="703.6" width="401.0" height="63.0" rx="8" fill="#ffffff" stroke="#ceaf8c" stroke-width="1.4"/><rect x="459.0" y="711.6" width="5" height="47.0" rx="2" fill="#ac7639"/><text x="475.0" y="725.6" font-size="13.5" fill="#6e4a20" font-weight="700" text-anchor="start"><tspan x="475.0">Territorio</tspan></text><text x="475.0" y="745.4" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Conjunto de cuentas o zona asignada a un vendedor</tspan></text><rect x="798.0" y="711.6" width="54" height="20" rx="10" fill="#e5d2bc" stroke="#ceaf8c" stroke-width="1"/><text x="825.0" y="725.6" font-size="11" fill="#6e4a20" font-weight="700" text-anchor="middle">↔ 1, 2</text><rect x="40.0" y="780.6" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#ceaf8c" stroke-width="1.4"/><rect x="40.0" y="788.6" width="5" height="62.2" rx="2" fill="#ac7639"/><text x="56.0" y="802.6" font-size="13.5" fill="#6e4a20" font-weight="700" text-anchor="start"><tspan x="56.0">Equidad de oportunidad</tspan></text><text x="56.0" y="822.4" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Grado en que los territorios ofrecen potencial comparable</tspan></text><rect x="379.0" y="788.6" width="54" height="20" rx="10" fill="#e5d2bc" stroke="#ceaf8c" stroke-width="1"/><text x="406.0" y="802.6" font-size="11" fill="#6e4a20" font-weight="700" text-anchor="middle">↔ 1, 2</text><rect x="459.0" y="780.6" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#ceaf8c" stroke-width="1.4"/><rect x="459.0" y="788.6" width="5" height="62.2" rx="2" fill="#ac7639"/><text x="475.0" y="802.6" font-size="13.5" fill="#6e4a20" font-weight="700" text-anchor="start"><tspan x="475.0">Alcanzabilidad</tspan></text><text x="475.0" y="822.4" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Proporción del equipo que puede alcanzar la cuota con</tspan><tspan x="475.0" dy="15.2">desempeño normal</tspan></text><rect x="798.0" y="788.6" width="54" height="20" rx="10" fill="#e5d2bc" stroke="#ceaf8c" stroke-width="1"/><text x="825.0" y="802.6" font-size="11" fill="#6e4a20" font-weight="700" text-anchor="middle">↔ 4</text><text x="40" y="890.78" font-size="11.5" fill="#ac7639" font-weight="700" letter-spacing="1.4">QUÉ SE MIDE: NUMERADOR SOBRE DENOMINADOR</text><rect x="40.0" y="904.8" width="261.3" height="122.7" rx="8" fill="#f7ede2" stroke="#ceaf8c" stroke-width="1.4"/><text x="54.0" y="926.8" font-size="13" fill="#6e4a20" font-weight="700" text-anchor="start"><tspan x="54.0">Proporción del equipo que</tspan><tspan x="54.0" dy="17.2">alcanza la cuota</tspan></text><text x="54.0" y="973.1" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Vendedores que cumplen</tspan></text><line x1="54.0" y1="994.3" x2="287.3" y2="994.3" stroke="#ac7639" stroke-width="2"/><text x="54.0" y="1012.3" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="54.0">Vendedores con cuota</tspan></text><rect x="319.3" y="904.8" width="261.3" height="122.7" rx="8" fill="#f7ede2" stroke="#ceaf8c" stroke-width="1.4"/><text x="333.3" y="926.8" font-size="13" fill="#6e4a20" font-weight="700" text-anchor="start"><tspan x="333.3">Dispersión de potencial entre</tspan><tspan x="333.3" dy="17.2">territorios</tspan></text><text x="333.3" y="973.1" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="333.3">Diferencia de potencial estimado</tspan><tspan x="333.3" dy="15.2">entre el mayor y el menor territorio</tspan></text><rect x="598.7" y="904.8" width="261.3" height="122.7" rx="8" fill="#f7ede2" stroke="#ceaf8c" stroke-width="1.4"/><text x="612.7" y="926.8" font-size="13" fill="#6e4a20" font-weight="700" text-anchor="start"><tspan x="612.7">Rotación por territorio</tspan></text><text x="612.7" y="955.9" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="612.7">Salidas del equipo, por territorio,</tspan><tspan x="612.7" dy="15.2">en 12 meses</tspan></text><text x="40" y="1061.46" font-size="11.5" fill="#ac7639" font-weight="700" letter-spacing="1.4">FRONTERA DE APLICACIÓN</text><rect x="40" y="1071.5" width="820" height="65.0" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.4"/><polygon points="70,1088.96 52,1117.96 88,1117.96" fill="#c2410c"/><text x="70" y="1114.96" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">!</text><text x="106" y="1095.5" font-size="12.5" fill="#7c2d12" font-weight="400" text-anchor="start"><tspan x="106">La equidad perfecta de territorios no existe. El objetivo es que las diferencias sean conocidas y</tspan><tspan x="106" dy="16.5">compensadas explícitamente en la cuota.</tspan></text><text x="40" y="1164.46" font-size="11.5" fill="#ac7639" font-weight="700" letter-spacing="1.4">ERROR FRECUENTE Y SU CORRECCIÓN</text><rect x="40" y="1174.5" width="380.0" height="77.0" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/><text x="54" y="1196.5" font-size="11" fill="#b91c1c" font-weight="700" text-anchor="start"><tspan x="54">Síntoma</tspan></text><text x="54" y="1214.5" font-size="12.5" fill="#7f1d1d" font-weight="400" text-anchor="start"><tspan x="54">Asignar la misma cuota a territorios de potencial</tspan><tspan x="54" dy="16.5">distinto</tspan></text><line x1="426.0" y1="1213.0" x2="469.0" y2="1213.0" stroke="#ac7639" stroke-width="2.6" stroke-linecap="round"/><polygon points="474.0,1213.0 465.9,1216.9 465.9,1209.0" fill="#ac7639"/><rect x="480.0" y="1174.5" width="380.0" height="77.0" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.4"/><text x="494.0" y="1196.5" font-size="11" fill="#15803d" font-weight="700" text-anchor="start"><tspan x="494.0">Corrección</tspan></text><text x="494.0" y="1214.5" font-size="12.5" fill="#14532d" font-weight="400" text-anchor="start"><tspan x="494.0">Estima el potencial por territorio y ajusta la</tspan><tspan x="494.0" dy="16.5">cuota proporcionalmente.</tspan></text></svg>