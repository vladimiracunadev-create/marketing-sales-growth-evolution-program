<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 934" width="900" height="934" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif"><title id="t">Modelo mental · Nurturing</title><desc id="d">Modelo mental de la clase 17.05: Nurturing. Método en 5 pasos; 4 conceptos; 3 señales de medición.</desc><rect x="0" y="0" width="900" height="934" rx="14" fill="#ffffff"/><rect x="0" y="0" width="900" height="64" rx="14" fill="#556e20"/><rect x="0" y="40" width="900" height="24" fill="#556e20"/><text x="40" y="28" font-size="12" fill="#d8e5bc" font-weight="700" letter-spacing="1.6">MODELO MENTAL · CLASE 17.05 · PARTE 17</text><text x="40" y="52" font-size="21" fill="#ffffff" font-weight="700">Nurturing</text><text x="40" y="84" font-size="11.5" fill="#87ac39" font-weight="700" letter-spacing="1.4">MÉTODO PASO A PASO</text><line x1="450.0" y1="94.0" x2="450.0" y2="317.0" stroke="#b9ce8c" stroke-width="3" stroke-linecap="round"/><line x1="450.0" y1="129.5" x2="406.0" y2="129.5" stroke="#b9ce8c" stroke-width="2"/><rect x="56.0" y="100" width="350" height="59.0" rx="10" fill="#f1f7e2" stroke="#b9ce8c" stroke-width="1.4"/><text x="70.0" y="122" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="70.0">Definir las preguntas del contacto en cada</tspan><tspan x="70.0" dy="16.5">etapa</tspan></text><circle cx="450.0" cy="129.5" r="15" fill="#556e20"/><text x="450.0" y="134.0" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><line x1="450.0" y1="159.2" x2="494.0" y2="159.2" stroke="#b9ce8c" stroke-width="2"/><rect x="494.0" y="138" width="350" height="42.5" rx="10" fill="#f1f7e2" stroke="#b9ce8c" stroke-width="1.4"/><text x="508.0" y="160" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="508.0">Asignar contenido pertinente a cada una</tspan></text><circle cx="450.0" cy="159.2" r="15" fill="#556e20"/><text x="450.0" y="163.8" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><line x1="450.0" y1="197.2" x2="406.0" y2="197.2" stroke="#b9ce8c" stroke-width="2"/><rect x="56.0" y="176" width="350" height="42.5" rx="10" fill="#f1f7e2" stroke="#b9ce8c" stroke-width="1.4"/><text x="70.0" y="198" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="70.0">Establecer el ritmo y el criterio de salida</tspan></text><circle cx="450.0" cy="197.2" r="15" fill="#556e20"/><text x="450.0" y="201.8" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><line x1="450.0" y1="235.2" x2="494.0" y2="235.2" stroke="#b9ce8c" stroke-width="2"/><rect x="494.0" y="214" width="350" height="42.5" rx="10" fill="#f1f7e2" stroke="#b9ce8c" stroke-width="1.4"/><text x="508.0" y="236" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="508.0">Medir avance de etapa y no sólo apertura</tspan></text><circle cx="450.0" cy="235.2" r="15" fill="#556e20"/><text x="450.0" y="239.8" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">4</text><line x1="450.0" y1="281.5" x2="406.0" y2="281.5" stroke="#b9ce8c" stroke-width="2"/><rect x="56.0" y="252" width="350" height="59.0" rx="10" fill="#f1f7e2" stroke="#b9ce8c" stroke-width="1.4"/><text x="70.0" y="274" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="70.0">Retirar de la secuencia a quien avanza o pide</tspan><tspan x="70.0" dy="16.5">salir</tspan></text><circle cx="450.0" cy="281.5" r="15" fill="#556e20"/><text x="450.0" y="286.0" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">5</text><text x="40" y="353.0" font-size="11.5" fill="#87ac39" font-weight="700" letter-spacing="1.4">CONCEPTOS Y DÓNDE ACTÚAN EN EL MÉTODO</text><rect x="40.0" y="367.0" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#b9ce8c" stroke-width="1.4"/><rect x="40.0" y="375.0" width="5" height="62.2" rx="2" fill="#87ac39"/><text x="56.0" y="389.0" font-size="13.5" fill="#556e20" font-weight="700" text-anchor="start"><tspan x="56.0">Secuencia de maduración</tspan></text><text x="56.0" y="408.8" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Serie de comunicaciones diseñada para acompañar la</tspan><tspan x="56.0" dy="15.2">evolución del contacto</tspan></text><rect x="379.0" y="375.0" width="54" height="20" rx="10" fill="#d8e5bc" stroke="#b9ce8c" stroke-width="1"/><text x="406.0" y="389.0" font-size="11" fill="#556e20" font-weight="700" text-anchor="middle">↔ 5</text><rect x="459.0" y="367.0" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#b9ce8c" stroke-width="1.4"/><rect x="459.0" y="375.0" width="5" height="62.2" rx="2" fill="#87ac39"/><text x="475.0" y="389.0" font-size="13.5" fill="#556e20" font-weight="700" text-anchor="start"><tspan x="475.0">Pertinencia por etapa</tspan></text><text x="475.0" y="408.8" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Correspondencia entre el contenido y el momento del</tspan><tspan x="475.0" dy="15.2">contacto</tspan></text><rect x="798.0" y="375.0" width="54" height="20" rx="10" fill="#d8e5bc" stroke="#b9ce8c" stroke-width="1"/><text x="825.0" y="389.0" font-size="11" fill="#556e20" font-weight="700" text-anchor="middle">↔ 1, 2, 4</text><rect x="40.0" y="459.2" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#b9ce8c" stroke-width="1.4"/><rect x="40.0" y="467.2" width="5" height="62.2" rx="2" fill="#87ac39"/><text x="56.0" y="481.2" font-size="13.5" fill="#556e20" font-weight="700" text-anchor="start"><tspan x="56.0">Avance de etapa</tspan></text><text x="56.0" y="501.0" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Movimiento del contacto hacia un estado más cercano a la</tspan><tspan x="56.0" dy="15.2">compra</tspan></text><rect x="379.0" y="467.2" width="54" height="20" rx="10" fill="#d8e5bc" stroke="#b9ce8c" stroke-width="1"/><text x="406.0" y="481.2" font-size="11" fill="#556e20" font-weight="700" text-anchor="middle">↔ 1, 4</text><rect x="459.0" y="459.2" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#b9ce8c" stroke-width="1.4"/><rect x="459.0" y="467.2" width="5" height="62.2" rx="2" fill="#87ac39"/><text x="475.0" y="481.2" font-size="13.5" fill="#556e20" font-weight="700" text-anchor="start"><tspan x="475.0">Fatiga de comunicación</tspan></text><text x="475.0" y="501.0" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Pérdida de atención por exceso o repetición de mensajes</tspan></text><text x="40" y="569.36" font-size="11.5" fill="#87ac39" font-weight="700" letter-spacing="1.4">QUÉ SE MIDE: NUMERADOR SOBRE DENOMINADOR</text><rect x="40.0" y="583.4" width="261.3" height="105.5" rx="8" fill="#f1f7e2" stroke="#b9ce8c" stroke-width="1.4"/><text x="54.0" y="605.4" font-size="13" fill="#556e20" font-weight="700" text-anchor="start"><tspan x="54.0">Tasa de avance de etapa</tspan></text><text x="54.0" y="634.5" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Contactos que avanzan</tspan></text><line x1="54.0" y1="655.7" x2="287.3" y2="655.7" stroke="#87ac39" stroke-width="2"/><text x="54.0" y="673.7" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="54.0">Contactos en la secuencia</tspan></text><rect x="319.3" y="583.4" width="261.3" height="105.5" rx="8" fill="#f1f7e2" stroke="#b9ce8c" stroke-width="1.4"/><text x="333.3" y="605.4" font-size="13" fill="#556e20" font-weight="700" text-anchor="start"><tspan x="333.3">Tasa de baja por secuencia</tspan></text><text x="333.3" y="634.5" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="333.3">Bajas solicitadas</tspan></text><line x1="333.3" y1="655.7" x2="566.7" y2="655.7" stroke="#87ac39" stroke-width="2"/><text x="333.3" y="673.7" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="333.3">Contactos activos en la secuencia</tspan></text><rect x="598.7" y="583.4" width="261.3" height="105.5" rx="8" fill="#f1f7e2" stroke="#b9ce8c" stroke-width="1.4"/><text x="612.7" y="605.4" font-size="13" fill="#556e20" font-weight="700" text-anchor="start"><tspan x="612.7">Tiempo hasta avance</tspan></text><text x="612.7" y="634.5" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="612.7">Días medianos entre el ingreso a la</tspan><tspan x="612.7" dy="15.2">secuencia y el avance de etapa</tspan></text><text x="40" y="722.88" font-size="11.5" fill="#87ac39" font-weight="700" letter-spacing="1.4">FRONTERA DE APLICACIÓN</text><rect x="40" y="732.9" width="820" height="48.5" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.4"/><polygon points="70,742.13 52,771.13 88,771.13" fill="#c2410c"/><text x="70" y="768.13" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">!</text><text x="106" y="756.9" font-size="12.5" fill="#7c2d12" font-weight="400" text-anchor="start"><tspan x="106">Ninguna secuencia crea urgencia donde no hay problema. El nurturing acompaña la maduración; no la produce.</tspan></text><text x="40" y="809.38" font-size="11.5" fill="#87ac39" font-weight="700" letter-spacing="1.4">ERROR FRECUENTE Y SU CORRECCIÓN</text><rect x="40" y="819.4" width="380.0" height="77.0" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/><text x="54" y="841.4" font-size="11" fill="#b91c1c" font-weight="700" text-anchor="start"><tspan x="54">Síntoma</tspan></text><text x="54" y="859.4" font-size="12.5" fill="#7f1d1d" font-weight="400" text-anchor="start"><tspan x="54">Medir nurturing por aperturas</tspan></text><line x1="426.0" y1="857.9" x2="469.0" y2="857.9" stroke="#87ac39" stroke-width="2.6" stroke-linecap="round"/><polygon points="474.0,857.9 465.9,861.8 465.9,854.0" fill="#87ac39"/><rect x="480.0" y="819.4" width="380.0" height="77.0" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.4"/><text x="494.0" y="841.4" font-size="11" fill="#15803d" font-weight="700" text-anchor="start"><tspan x="494.0">Corrección</tspan></text><text x="494.0" y="859.4" font-size="12.5" fill="#14532d" font-weight="400" text-anchor="start"><tspan x="494.0">Evalúa por avance de etapa y retira de la secuencia</tspan><tspan x="494.0" dy="16.5">a quien ya avanzó.</tspan></text></svg>