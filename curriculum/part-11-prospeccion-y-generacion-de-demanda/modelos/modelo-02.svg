<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1302" width="900" height="1302" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif"><title id="t">Modelo mental · Construcción ética de listas</title><desc id="d">Modelo mental de la clase 11.02: Construcción ética de listas. Método en 5 pasos; 4 conceptos; 3 señales de medición.</desc><rect x="0" y="0" width="900" height="1302" rx="14" fill="#ffffff"/><rect x="0" y="0" width="900" height="64" rx="14" fill="#206e50"/><rect x="0" y="40" width="900" height="24" fill="#206e50"/><text x="40" y="28" font-size="12" fill="#bce5d5" font-weight="700" letter-spacing="1.6">MODELO MENTAL · CLASE 11.02 · PARTE 11</text><text x="40" y="52" font-size="21" fill="#ffffff" font-weight="700">Construcción ética de listas</text><text x="40" y="84" font-size="11.5" fill="#39ac80" font-weight="700" letter-spacing="1.4">MÉTODO PASO A PASO</text><ellipse cx="450.0" cy="376.8" rx="330.0" ry="233.1" fill="none" stroke="#8cceb5" stroke-width="2" stroke-dasharray="3 8" stroke-linecap="round"/><polygon points="653.8,193.3 636.3,190.4 641.2,180.8" fill="#39ac80"/><polygon points="759.3,458.8 761.4,441.2 771.2,445.7" fill="#39ac80"/><polygon points="439.0,609.9 455.9,604.4 455.9,615.3" fill="#39ac80"/><polygon points="131.6,438.8 143.5,451.9 133.7,456.4" fill="#39ac80"/><polygon points="265.8,183.2 253.2,195.8 248.3,186.1" fill="#39ac80"/><circle cx="450.0" cy="376.8" r="100.0" fill="#bce5d5" stroke="#8cceb5" stroke-width="1.6"/><text x="450.0" y="369.0" font-size="15" fill="#206e50" font-weight="700" text-anchor="middle"><tspan x="450.0">Construcción ética</tspan><tspan x="450.0" dy="19.8">de listas</tspan></text><rect x="361.0" y="106.0" width="178" height="75.5" rx="10" fill="#e2f7ef" stroke="#8cceb5" stroke-width="1.4"/><text x="373.0" y="128.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="373.0">Definir el perfil</tspan><tspan x="373.0" dy="16.5">objetivo antes de</tspan><tspan x="373.0" dy="16.5">construir la lista</tspan></text><circle cx="363.0" cy="108.0" r="14" fill="#206e50"/><text x="363.0" y="112.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><rect x="674.8" y="267.0" width="178" height="75.5" rx="10" fill="#e2f7ef" stroke="#8cceb5" stroke-width="1.4"/><text x="686.8" y="289.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="686.8">Identificar la base de</tspan><tspan x="686.8" dy="16.5">licitud del</tspan><tspan x="686.8" dy="16.5">tratamiento</tspan></text><circle cx="676.8" cy="269.0" r="14" fill="#206e50"/><text x="676.8" y="273.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><rect x="555.0" y="527.6" width="178" height="75.5" rx="10" fill="#e2f7ef" stroke="#8cceb5" stroke-width="1.4"/><text x="567.0" y="549.6" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="567.0">Verificar y documentar</tspan><tspan x="567.0" dy="16.5">la fuente de cada</tspan><tspan x="567.0" dy="16.5">contacto</tspan></text><circle cx="557.0" cy="529.6" r="14" fill="#206e50"/><text x="557.0" y="534.1" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><rect x="167.0" y="527.6" width="178" height="75.5" rx="10" fill="#e2f7ef" stroke="#8cceb5" stroke-width="1.4"/><text x="179.0" y="549.6" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="179.0">Habilitar mecanismos</tspan><tspan x="179.0" dy="16.5">de oposición y</tspan><tspan x="179.0" dy="16.5">eliminación</tspan></text><circle cx="169.0" cy="529.6" r="14" fill="#206e50"/><text x="169.0" y="534.1" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">4</text><rect x="47.2" y="267.0" width="178" height="75.5" rx="10" fill="#e2f7ef" stroke="#8cceb5" stroke-width="1.4"/><text x="59.2" y="289.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="59.2">Monitorear reputación</tspan><tspan x="59.2" dy="16.5">de dominio y tasa de</tspan><tspan x="59.2" dy="16.5">reclamos</tspan></text><circle cx="49.2" cy="269.0" r="14" fill="#206e50"/><text x="49.2" y="273.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">5</text><text x="40" y="689.6" font-size="11.5" fill="#39ac80" font-weight="700" letter-spacing="1.4">CONCEPTOS Y DÓNDE ACTÚAN EN EL MÉTODO</text><rect x="40.0" y="703.6" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#8cceb5" stroke-width="1.4"/><rect x="40.0" y="711.6" width="5" height="62.2" rx="2" fill="#39ac80"/><text x="56.0" y="725.6" font-size="13.5" fill="#206e50" font-weight="700" text-anchor="start"><tspan x="56.0">Base de licitud</tspan></text><text x="56.0" y="745.4" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Fundamento jurídico que habilita el tratamiento de los</tspan><tspan x="56.0" dy="15.2">datos personales</tspan></text><rect x="379.0" y="711.6" width="54" height="20" rx="10" fill="#bce5d5" stroke="#8cceb5" stroke-width="1"/><text x="406.0" y="725.6" font-size="11" fill="#206e50" font-weight="700" text-anchor="middle">↔ 2</text><rect x="459.0" y="703.6" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#8cceb5" stroke-width="1.4"/><rect x="459.0" y="711.6" width="5" height="62.2" rx="2" fill="#39ac80"/><text x="475.0" y="725.6" font-size="13.5" fill="#206e50" font-weight="700" text-anchor="start"><tspan x="475.0">Dato verificado</tspan></text><text x="475.0" y="745.4" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Información de contacto confirmada y vigente, con fuente</tspan><tspan x="475.0" dy="15.2">registrada</tspan></text><rect x="798.0" y="711.6" width="54" height="20" rx="10" fill="#bce5d5" stroke="#8cceb5" stroke-width="1"/><text x="825.0" y="725.6" font-size="11" fill="#206e50" font-weight="700" text-anchor="middle">↔ 3</text><rect x="40.0" y="795.8" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#8cceb5" stroke-width="1.4"/><rect x="40.0" y="803.8" width="5" height="62.2" rx="2" fill="#39ac80"/><text x="56.0" y="817.8" font-size="13.5" fill="#206e50" font-weight="700" text-anchor="start"><tspan x="56.0">Reputación de dominio</tspan></text><text x="56.0" y="837.6" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Estado del remitente ante los proveedores de correo,</tspan><tspan x="56.0" dy="15.2">afectado por rebotes y reclamos</tspan></text><rect x="379.0" y="803.8" width="54" height="20" rx="10" fill="#bce5d5" stroke="#8cceb5" stroke-width="1"/><text x="406.0" y="817.8" font-size="11" fill="#206e50" font-weight="700" text-anchor="middle">↔ 5</text><rect x="459.0" y="795.8" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#8cceb5" stroke-width="1.4"/><rect x="459.0" y="803.8" width="5" height="62.2" rx="2" fill="#39ac80"/><text x="475.0" y="817.8" font-size="13.5" fill="#206e50" font-weight="700" text-anchor="start"><tspan x="475.0">Derecho del titular</tspan></text><text x="475.0" y="837.6" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Facultad de la persona de acceder, rectificar, oponerse y</tspan><tspan x="475.0" dy="15.2">solicitar la eliminación de sus datos</tspan></text><text x="40" y="905.96" font-size="11.5" fill="#39ac80" font-weight="700" letter-spacing="1.4">QUÉ SE MIDE: NUMERADOR SOBRE DENOMINADOR</text><rect x="40.0" y="920.0" width="261.3" height="120.7" rx="8" fill="#e2f7ef" stroke="#8cceb5" stroke-width="1.4"/><text x="54.0" y="942.0" font-size="13" fill="#206e50" font-weight="700" text-anchor="start"><tspan x="54.0">Tasa de rebote</tspan></text><text x="54.0" y="971.1" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Correos rebotados</tspan></text><line x1="54.0" y1="992.3" x2="287.3" y2="992.3" stroke="#39ac80" stroke-width="2"/><text x="54.0" y="1010.3" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="54.0">Correos enviados, por campaña</tspan></text><rect x="319.3" y="920.0" width="261.3" height="120.7" rx="8" fill="#e2f7ef" stroke="#8cceb5" stroke-width="1.4"/><text x="333.3" y="942.0" font-size="13" fill="#206e50" font-weight="700" text-anchor="start"><tspan x="333.3">Tasa de reclamos por spam</tspan></text><text x="333.3" y="971.1" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="333.3">Reclamos recibidos</tspan></text><line x1="333.3" y1="992.3" x2="566.7" y2="992.3" stroke="#39ac80" stroke-width="2"/><text x="333.3" y="1010.3" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="333.3">Correos entregados</tspan></text><rect x="598.7" y="920.0" width="261.3" height="120.7" rx="8" fill="#e2f7ef" stroke="#8cceb5" stroke-width="1.4"/><text x="612.7" y="942.0" font-size="13" fill="#206e50" font-weight="700" text-anchor="start"><tspan x="612.7">Contactos con fuente documentada</tspan></text><text x="612.7" y="971.1" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="612.7">Contactos con origen y base de</tspan><tspan x="612.7" dy="15.2">licitud registrados</tspan></text><line x1="612.7" y1="1007.5" x2="846.0" y2="1007.5" stroke="#39ac80" stroke-width="2"/><text x="612.7" y="1025.5" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="612.7">Contactos de la base</tspan></text><text x="40" y="1074.66" font-size="11.5" fill="#39ac80" font-weight="700" letter-spacing="1.4">FRONTERA DE APLICACIÓN</text><rect x="40" y="1084.7" width="820" height="65.0" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.4"/><polygon points="70,1102.16 52,1131.16 88,1131.16" fill="#c2410c"/><text x="70" y="1128.16" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">!</text><text x="106" y="1108.7" font-size="12.5" fill="#7c2d12" font-weight="400" text-anchor="start"><tspan x="106">El cumplimiento formal no basta: una comunicación técnicamente lícita pero irrelevante destruye reputación</tspan><tspan x="106" dy="16.5">comercial igual que una ilícita.</tspan></text><text x="40" y="1177.66" font-size="11.5" fill="#39ac80" font-weight="700" letter-spacing="1.4">ERROR FRECUENTE Y SU CORRECCIÓN</text><rect x="40" y="1187.7" width="380.0" height="77.0" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/><text x="54" y="1209.7" font-size="11" fill="#b91c1c" font-weight="700" text-anchor="start"><tspan x="54">Síntoma</tspan></text><text x="54" y="1227.7" font-size="12.5" fill="#7f1d1d" font-weight="400" text-anchor="start"><tspan x="54">Comprar bases de contactos</tspan></text><line x1="426.0" y1="1226.2" x2="469.0" y2="1226.2" stroke="#39ac80" stroke-width="2.6" stroke-linecap="round"/><polygon points="474.0,1226.2 465.9,1230.1 465.9,1222.2" fill="#39ac80"/><rect x="480.0" y="1187.7" width="380.0" height="77.0" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.4"/><text x="494.0" y="1209.7" font-size="11" fill="#15803d" font-weight="700" text-anchor="start"><tspan x="494.0">Corrección</tspan></text><text x="494.0" y="1227.7" font-size="12.5" fill="#14532d" font-weight="400" text-anchor="start"><tspan x="494.0">Construye la lista desde el perfil objetivo con</tspan><tspan x="494.0" dy="16.5">datos verificados y base de licitud documentada.</tspan></text></svg>