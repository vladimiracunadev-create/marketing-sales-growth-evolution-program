<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1071" width="900" height="1071" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif"><title id="t">Modelo mental · Relaciones públicas, medios y comunicación corporativa</title><desc id="d">Modelo mental de la clase ESP.03: Relaciones públicas, medios y comunicación corporativa. Método en 7 pasos; 7 conceptos; 0 señales de medición.</desc><rect x="0" y="0" width="900" height="1071" rx="14" fill="#ffffff"/><rect x="0" y="0" width="900" height="64" rx="14" fill="#406e20"/><rect x="0" y="40" width="900" height="24" fill="#406e20"/><text x="40" y="28" font-size="12" fill="#cde5bc" font-weight="700" letter-spacing="1.6">MODELO MENTAL · CLASE ESP.03 · ESPECIALIZACIÓN</text><text x="40" y="52" font-size="21" fill="#ffffff" font-weight="700">Relaciones públicas, medios y comunicación corporativa</text><text x="40" y="84" font-size="11.5" fill="#69ac39" font-weight="700" letter-spacing="1.4">MÉTODO PASO A PASO</text><rect x="40.0" y="100" width="246.7" height="75.5" rx="10" fill="#ebf7e2" stroke="#a7ce8c" stroke-width="1.4"/><text x="54.0" y="122" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Definir el objetivo de la acción</tspan><tspan x="54.0" dy="16.5">en términos de comprensión o</tspan><tspan x="54.0" dy="16.5">confianza de un público concreto</tspan></text><circle cx="42.0" cy="102.0" r="14" fill="#406e20"/><text x="42.0" y="106.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><rect x="326.7" y="100" width="246.7" height="75.5" rx="10" fill="#ebf7e2" stroke="#a7ce8c" stroke-width="1.4"/><text x="340.7" y="122" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="340.7">Identificar el hecho noticiable</tspan><tspan x="340.7" dy="16.5">y por qué le interesa a quien lo</tspan><tspan x="340.7" dy="16.5">reformulará</tspan></text><circle cx="328.7" cy="102.0" r="14" fill="#406e20"/><text x="328.7" y="106.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><rect x="613.3" y="100" width="246.7" height="75.5" rx="10" fill="#ebf7e2" stroke="#a7ce8c" stroke-width="1.4"/><text x="627.3" y="122" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="627.3">Reunir hechos verificables con</tspan><tspan x="627.3" dy="16.5">fuente y definir qué se puede y</tspan><tspan x="627.3" dy="16.5">qué no se puede decir</tspan></text><circle cx="615.3" cy="102.0" r="14" fill="#406e20"/><text x="615.3" y="106.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><rect x="613.3" y="213.5" width="246.7" height="75.5" rx="10" fill="#ebf7e2" stroke="#a7ce8c" stroke-width="1.4"/><text x="627.3" y="235.5" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="627.3">Elegir el vocero y preparar</tspan><tspan x="627.3" dy="16.5">mensajes fundamentales y</tspan><tspan x="627.3" dy="16.5">respuestas a preguntas difíciles</tspan></text><circle cx="615.3" cy="215.5" r="14" fill="#406e20"/><text x="615.3" y="220.0" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">4</text><rect x="326.7" y="213.5" width="246.7" height="75.5" rx="10" fill="#ebf7e2" stroke="#a7ce8c" stroke-width="1.4"/><text x="340.7" y="235.5" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="340.7">Redactar la nota informativa con</tspan><tspan x="340.7" dy="16.5">titular, hechos, cifras, cita</tspan><tspan x="340.7" dy="16.5">autorizada y contacto</tspan></text><circle cx="328.7" cy="215.5" r="14" fill="#406e20"/><text x="328.7" y="220.0" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">5</text><rect x="40.0" y="213.5" width="246.7" height="75.5" rx="10" fill="#ebf7e2" stroke="#a7ce8c" stroke-width="1.4"/><text x="54.0" y="235.5" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Contactar al periodista adecuado</tspan><tspan x="54.0" dy="16.5">con respeto de plazos y sin</tspan><tspan x="54.0" dy="16.5">condicionar la cobertura</tspan></text><circle cx="42.0" cy="215.5" r="14" fill="#406e20"/><text x="42.0" y="220.0" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">6</text><rect x="40.0" y="327.0" width="246.7" height="75.5" rx="10" fill="#ebf7e2" stroke="#a7ce8c" stroke-width="1.4"/><text x="54.0" y="349.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Monitorear la cobertura,</tspan><tspan x="54.0" dy="16.5">corregir inexactitudes y</tspan><tspan x="54.0" dy="16.5">registrar aprendizajes</tspan></text><circle cx="42.0" cy="329.0" r="14" fill="#406e20"/><text x="42.0" y="333.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">7</text><line x1="289.7" y1="137.8" x2="318.7" y2="137.8" stroke="#69ac39" stroke-width="2.2" stroke-linecap="round"/><polygon points="323.7,137.8 315.6,141.7 315.6,133.8" fill="#69ac39"/><line x1="576.3" y1="137.8" x2="605.3" y2="137.8" stroke="#69ac39" stroke-width="2.2" stroke-linecap="round"/><polygon points="610.3,137.8 602.2,141.7 602.2,133.8" fill="#69ac39"/><line x1="736.7" y1="177.5" x2="736.7" y2="205.5" stroke="#69ac39" stroke-width="2.2" stroke-linecap="round"/><polygon points="736.7,210.5 732.8,202.4 740.6,202.4" fill="#69ac39"/><line x1="610.3" y1="251.2" x2="581.3" y2="251.2" stroke="#69ac39" stroke-width="2.2" stroke-linecap="round"/><polygon points="576.3,251.2 584.4,247.3 584.4,255.2" fill="#69ac39"/><line x1="323.7" y1="251.2" x2="294.7" y2="251.2" stroke="#69ac39" stroke-width="2.2" stroke-linecap="round"/><polygon points="289.7,251.2 297.8,247.3 297.8,255.2" fill="#69ac39"/><line x1="163.3" y1="291.0" x2="163.3" y2="319.0" stroke="#69ac39" stroke-width="2.2" stroke-linecap="round"/><polygon points="163.3,324.0 159.4,315.9 167.2,315.9" fill="#69ac39"/><text x="40" y="440.5" font-size="11.5" fill="#69ac39" font-weight="700" letter-spacing="1.4">CONCEPTOS Y DÓNDE ACTÚAN EN EL MÉTODO</text><rect x="40.0" y="454.5" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#a7ce8c" stroke-width="1.4"/><rect x="40.0" y="462.5" width="5" height="62.2" rx="2" fill="#69ac39"/><text x="56.0" y="476.5" font-size="13.5" fill="#406e20" font-weight="700" text-anchor="start"><tspan x="56.0">Relaciones públicas</tspan></text><text x="56.0" y="496.3" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Gestión de vínculos de credibilidad con públicos que</tspan><tspan x="56.0" dy="15.2">afectan o son afectados por la organización</tspan></text><rect x="379.0" y="462.5" width="54" height="20" rx="10" fill="#cde5bc" stroke="#a7ce8c" stroke-width="1"/><text x="406.0" y="476.5" font-size="11" fill="#406e20" font-weight="700" text-anchor="middle">↔ 1</text><rect x="459.0" y="454.5" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#a7ce8c" stroke-width="1.4"/><rect x="459.0" y="462.5" width="5" height="62.2" rx="2" fill="#69ac39"/><text x="475.0" y="476.5" font-size="13.5" fill="#406e20" font-weight="700" text-anchor="start"><tspan x="475.0">Publicidad</tspan></text><text x="475.0" y="496.3" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Comunicación pagada y controlada por el emisor que compra</tspan><tspan x="475.0" dy="15.2">espacio y declara su origen comercial</tspan></text><rect x="798.0" y="462.5" width="54" height="20" rx="10" fill="#cde5bc" stroke="#a7ce8c" stroke-width="1"/><text x="825.0" y="476.5" font-size="11" fill="#406e20" font-weight="700" text-anchor="middle">↔ 1</text><rect x="40.0" y="546.7" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#a7ce8c" stroke-width="1.4"/><rect x="40.0" y="554.7" width="5" height="62.2" rx="2" fill="#69ac39"/><text x="56.0" y="568.7" font-size="13.5" fill="#406e20" font-weight="700" text-anchor="start"><tspan x="56.0">Comunicación corporativa</tspan></text><text x="56.0" y="588.5" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Coordinación de todo lo que la organización dice de sí</tspan><tspan x="56.0" dy="15.2">misma para que sea coherente entre canales</tspan></text><rect x="459.0" y="546.7" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#a7ce8c" stroke-width="1.4"/><rect x="459.0" y="554.7" width="5" height="62.2" rx="2" fill="#69ac39"/><text x="475.0" y="568.7" font-size="13.5" fill="#406e20" font-weight="700" text-anchor="start"><tspan x="475.0">Comunicación institucional</tspan></text><text x="475.0" y="588.5" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Comunicación de la organización como actor social: misión,</tspan><tspan x="475.0" dy="15.2">gobierno, responsabilidad y relación con la comunidad</tspan></text><rect x="40.0" y="638.9" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#a7ce8c" stroke-width="1.4"/><rect x="40.0" y="646.9" width="5" height="62.2" rx="2" fill="#69ac39"/><text x="56.0" y="660.9" font-size="13.5" fill="#406e20" font-weight="700" text-anchor="start"><tspan x="56.0">Relaciones con medios</tspan></text><text x="56.0" y="680.7" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Trato profesional con periodistas basado en información</tspan><tspan x="56.0" dy="15.2">verificable, plazos y respeto de su independencia</tspan></text><rect x="379.0" y="646.9" width="54" height="20" rx="10" fill="#cde5bc" stroke="#a7ce8c" stroke-width="1"/><text x="406.0" y="660.9" font-size="11" fill="#406e20" font-weight="700" text-anchor="middle">↔ 6</text><rect x="459.0" y="638.9" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#a7ce8c" stroke-width="1.4"/><rect x="459.0" y="646.9" width="5" height="62.2" rx="2" fill="#69ac39"/><text x="475.0" y="660.9" font-size="13.5" fill="#406e20" font-weight="700" text-anchor="start"><tspan x="475.0">Nota informativa</tspan></text><text x="475.0" y="680.7" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Documento breve con hechos, cifras con fuente, citas</tspan><tspan x="475.0" dy="15.2">autorizadas y datos de contacto</tspan></text><rect x="798.0" y="646.9" width="54" height="20" rx="10" fill="#cde5bc" stroke="#a7ce8c" stroke-width="1"/><text x="825.0" y="660.9" font-size="11" fill="#406e20" font-weight="700" text-anchor="middle">↔ 3, 5</text><rect x="40.0" y="731.0" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#a7ce8c" stroke-width="1.4"/><rect x="40.0" y="739.0" width="5" height="62.2" rx="2" fill="#69ac39"/><text x="56.0" y="753.0" font-size="13.5" fill="#406e20" font-weight="700" text-anchor="start"><tspan x="56.0">Embargo informativo</tspan></text><text x="56.0" y="772.9" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Acuerdo por el cual el periodista recibe información antes</tspan><tspan x="56.0" dy="15.2">con la condición de publicar desde una fecha</tspan></text><rect x="379.0" y="739.0" width="54" height="20" rx="10" fill="#cde5bc" stroke="#a7ce8c" stroke-width="1"/><text x="406.0" y="753.0" font-size="11" fill="#406e20" font-weight="700" text-anchor="middle">↔ 5, 6</text><text x="40" y="843.2200000000003" font-size="11.5" fill="#69ac39" font-weight="700" letter-spacing="1.4">FRONTERA DE APLICACIÓN</text><rect x="40" y="853.2" width="820" height="65.0" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.4"/><polygon points="70,870.7200000000003 52,899.7200000000003 88,899.7200000000003" fill="#c2410c"/><text x="70" y="896.7200000000003" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">!</text><text x="106" y="877.2" font-size="12.5" fill="#7c2d12" font-weight="400" text-anchor="start"><tspan x="106">Riesgo reputacional: Prometer exclusividad a varios medios o mentir una vez deteriora la relación con</tspan><tspan x="106" dy="16.5">todos.</tspan></text><text x="40" y="946.2200000000003" font-size="11.5" fill="#69ac39" font-weight="700" letter-spacing="1.4">ERROR FRECUENTE Y SU CORRECCIÓN</text><rect x="40" y="956.2" width="380.0" height="77.0" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/><text x="54" y="978.2" font-size="11" fill="#b91c1c" font-weight="700" text-anchor="start"><tspan x="54">Síntoma</tspan></text><text x="54" y="996.2" font-size="12.5" fill="#7f1d1d" font-weight="400" text-anchor="start"><tspan x="54">Medir relaciones públicas por valor publicitario</tspan><tspan x="54" dy="16.5">equivalente</tspan></text><line x1="426.0" y1="994.7" x2="469.0" y2="994.7" stroke="#69ac39" stroke-width="2.6" stroke-linecap="round"/><polygon points="474.0,994.7 465.9,998.6 465.9,990.8" fill="#69ac39"/><rect x="480.0" y="956.2" width="380.0" height="77.0" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.4"/><text x="494.0" y="978.2" font-size="11" fill="#15803d" font-weight="700" text-anchor="start"><tspan x="494.0">Corrección</tspan></text><text x="494.0" y="996.2" font-size="12.5" fill="#14532d" font-weight="400" text-anchor="start"><tspan x="494.0">Mide precisión de mensajes, tiempo de respuesta y</tspan><tspan x="494.0" dy="16.5">confianza declarada.</tspan></text></svg>
