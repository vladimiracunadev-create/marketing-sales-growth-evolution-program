90 días</tspan></text><rect x="598.7" y="1117.7" width="261.3" height="157.7" rx="8" fill="#f7e2f2" stroke="#ce8cbe" stroke-width="1.4"/><text x="612.7" y="1139.7" font-size="13" fill="#6e205c" font-weight="700" text-anchor="start"><tspan x="612.7">Incentivos divulgados</tspan></text><text x="612.7" y="1168.9" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="612.7">Piezas y conversaciones auditadas</tspan><tspan x="612.7" dy="15.2">con divulgación</tspan></text><line x1="612.7" y1="1205.3" x2="846.0" y2="1205.3" stroke="#ac3991" stroke-width="2"/><text x="612.7" y="1223.3" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="612.7">Piezas y conversaciones auditadas</tspan><tspan x="612.7" dy="15.2">con incentivo</tspan></text><text x="612.7" y="1267.6" font-size="10.5" fill="#7b8794" font-weight="400" text-anchor="start"><tspan x="612.7">Ventana: mes</tspan></text><text x="40" y="1309.4800000000002" font-size="11.5" fill="#ac3991" font-weight="700" letter-spacing="1.4">FRONTERA DE APLICACIÓN</text><rect x="40" y="1319.5" width="820" height="65.0" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.4"/><polygon points="70,1336.9800000000002 52,1365.9800000000002 88,1365.9800000000002" fill="#c2410c"/><text x="70" y="1362.9800000000002" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">!</text><text x="106" y="1343.5" font-size="12.5" fill="#7c2d12" font-weight="400" text-anchor="start"><tspan x="106">El canal indirecto reduce el margen unitario y aleja la relación con el cliente final. Su conveniencia</tspan><tspan x="106" dy="16.5">depende del costo de acceso directo a ese segmento.</tspan></text><text x="40" y="1412.4800000000002" font-size="11.5" fill="#ac3991" font-weight="700" letter-spacing="1.4">ERROR FRECUENTE Y SU CORRECCIÓN</text><rect x="40" y="1422.5" width="380.0" height="77.0" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/><text x="54" y="1444.5" font-size="11" fill="#b91c1c" font-weight="700" text-anchor="start"><tspan x="54">Síntoma</tspan></text><text x="54" y="1462.5" font-size="12.5" fill="#7f1d1d" font-weight="400" text-anchor="start"><tspan x="54">Firmar acuerdos sin programa de habilitación</tspan></text><line x1="426.0" y1="1461.0" x2="469.0" y2="1461.0" stroke="#ac3991" stroke-width="2.6" stroke-linecap="round"/><polygon points="474.0,1461.0 465.9,1464.9 465.9,1457.1" fill="#ac3991"/><rect x="480.0" y="1422.5" width="380.0" height="77.0" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.4"/><text x="494.0" y="1444.5" font-size="11" fill="#15803d" font-weight="700" text-anchor="start"><tspan x="494.0">Corrección</tspan></text><text x="494.0" y="1462.5" font-size="12.5" fill="#14532d" font-weight="400" text-anchor="start"><tspan x="494.0">Mide socios activos y concentra formación e</tspan><tspan x="494.0" dy="16.5">incentivos en los que producen negocio.</tspan></text></svg>