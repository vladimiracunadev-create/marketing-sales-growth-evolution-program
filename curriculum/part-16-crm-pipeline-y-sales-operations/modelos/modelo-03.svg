x="40" y="493.0" font-size="11.5" fill="#ac7639" font-weight="700" letter-spacing="1.4">CONCEPTOS Y DÓNDE ACTÚAN EN EL MÉTODO</text><rect x="40.0" y="507.0" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#ceaf8c" stroke-width="1.4"/><rect x="40.0" y="515.0" width="5" height="62.2" rx="2" fill="#ac7639"/><text x="56.0" y="529.0" font-size="13.5" fill="#6e4a20" font-weight="700" text-anchor="start"><tspan x="56.0">Evidencia de avance</tspan></text><text x="56.0" y="548.8" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Hecho verificable del cliente que justifica el cambio de</tspan><tspan x="56.0" dy="15.2">etapa</tspan></text><rect x="379.0" y="515.0" width="54" height="20" rx="10" fill="#e5d2bc" stroke="#ceaf8c" stroke-width="1"/><text x="406.0" y="529.0" font-size="11" fill="#6e4a20" font-weight="700" text-anchor="middle">↔ 1, 2</text><rect x="459.0" y="507.0" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#ceaf8c" stroke-width="1.4"/><rect x="459.0" y="515.0" width="5" height="62.2" rx="2" fill="#ac7639"/><text x="475.0" y="529.0" font-size="13.5" fill="#6e4a20" font-weight="700" text-anchor="start"><tspan x="475.0">Avance sin evidencia</tspan></text><text x="475.0" y="548.8" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Cambio de etapa basado en la percepción del vendedor</tspan></text><rect x="798.0" y="515.0" width="54" height="20" rx="10" fill="#e5d2bc" stroke="#ceaf8c" stroke-width="1"/><text x="825.0" y="529.0" font-size="11" fill="#6e4a20" font-weight="700" text-anchor="middle">↔ 2</text><rect x="40.0" y="599.2" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#ceaf8c" stroke-width="1.4"/><rect x="40.0" y="607.2" width="5" height="62.2" rx="2" fill="#ac7639"/><text x="56.0" y="621.2" font-size="13.5" fill="#6e4a20" font-weight="700" text-anchor="start"><tspan x="56.0">Retroceso de etapa</tspan></text><text x="56.0" y="641.0" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Corrección que devuelve la oportunidad a un estado</tspan><tspan x="56.0" dy="15.2">anterior cuando la evidencia falla</tspan></text><rect x="379.0" y="607.2" width="54" height="20" rx="10" fill="#e5d2bc" stroke="#ceaf8c" stroke-width="1"/><text x="406.0" y="621.2" font-size="11" fill="#6e4a20" font-weight="700" text-anchor="middle">↔ 2, 3</text><rect x="459.0" y="599.2" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#ceaf8c" stroke-width="1.4"/><rect x="459.0" y="607.2" width="5" height="62.2" rx="2" fill="#ac7639"/><text x="475.0" y="621.2" font-size="13.5" fill="#6e4a20" font-weight="700" text-anchor="start"><tspan x="475.0">Auditoría de etapas</tspan></text><text x="475.0" y="641.0" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Revisión periódica de que las oportunidades cumplen el</tspan><tspan x="475.0" dy="15.2">criterio de su etapa</tspan></text><rect x="798.0" y="607.2" width="54" height="20" rx="10" fill="#e5d2bc" stroke="#ceaf8c" stroke-width="1"/><text x="825.0" y="621.2" font-size="11" fill="#6e4a20" font-weight="700" text-anchor="middle">↔ 2, 3, 4</text><text x="40" y="709.3600000000001" font-size="11.5" fill="#ac7639" font-weight="700" letter-spacing="1.4">QUÉ SE MIDE: NUMERADOR SOBRE DENOMINADOR</text><rect x="40.0" y="723.4" width="261.3" height="120.7" rx="8" fill="#f7ede2" stroke="#ceaf8c" stroke-width="1.4"/><text x="54.0" y="745.4" font-size="13" fill="#6e4a20" font-weight="700" text-anchor="start"><tspan x="54.0">Avances con evidencia registrada</tspan></text><text x="54.0" y="774.5" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Cambios de etapa con evidencia</tspan><tspan x="54.0" dy="15.2">documentada</tspan></text><line x1="54.0" y1="810.9" x2="287.3" y2="810.9" stroke="#ac7639" stroke-width="2"/><text x="54.0" y="828.9" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="54.0">Cambios de etapa</tspan></text><rect x="319.3" y="723.4" width="261.3" height="120.7" rx="8" fill="#f7ede2" stroke="#ceaf8c" stroke-width="1.4"/><text x="333.3" y="745.4" font-size="13" fill="#6e4a20" font-weight="700" text-anchor="start"><tspan x="333.3">Tasa de retroceso</tspan></text><text x="333.3" y="774.5" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="333.3">Oportunidades que retroceden de</tspan><tspan x="333.3" dy="15.2">etapa</tspan></text><line x1="333.3" y1="810.9" x2="566.7" y2="810.9" stroke="#ac7639" stroke-width="2"/><text x="333.3" y="828.9" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="333.3">Oportunidades activas</tspan></text><rect x="598.7" y="723.4" width="261.3" height="120.7" rx="8" fill="#f7ede2" stroke="#ceaf8c" stroke-width="1.4"/><text x="612.7" y="745.4" font-size="13" fill="#6e4a20" font-weight="700" text-anchor="start"><tspan x="612.7">Hallazgos de auditoría</tspan></text><text x="612.7" y="774.5" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="612.7">Oportunidades que no cumplen el</tspan><tspan x="612.7" dy="15.2">criterio de su etapa</tspan></text><line x1="612.7" y1="810.9" x2="846.0" y2="810.9" stroke="#ac7639" stroke-width="2"/><text x="612.7" y="828.9" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="612.7">Oportunidades auditadas</tspan></text><text x="40" y="878.0600000000002" font-size="11.5" fill="#ac7639" font-weight="700" letter-spacing="1.4">FRONTERA DE APLICACIÓN</text><rect x="40" y="888.1" width="820" height="65.0" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.4"/><polygon points="70,905.5600000000002 52,934.5600000000002 88,934.5600000000002" fill="#c2410c"/><text x="70" y="931.5600000000002" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">!</text><text x="106" y="912.1" font-size="12.5" fill="#7c2d12" font-weight="400" text-anchor="start"><tspan x="106">Criterios demasiado exigentes pueden dejar el pipeline vacío y desmotivar el registro. El criterio debe</tspan><tspan x="106" dy="16.5">ser verificable y alcanzable.</tspan></text><text x="40" y="981.0600000000002" font-size="11.5" fill="#ac7639" font-weight="700" letter-spacing="1.4">ERROR FRECUENTE Y SU CORRECCIÓN</text><rect x="40" y="991.1" width="380.0" height="77.0" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/><text x="54" y="1013.1" font-size="11" fill="#b91c1c" font-weight="700" text-anchor="start"><tspan x="54">Síntoma</tspan></text><text x="54" y="1031.1" font-size="12.5" fill="#7f1d1d" font-weight="400" text-anchor="start"><tspan x="54">Permitir avances de etapa sin evidencia</tspan></text><line x1="426.0" y1="1029.6" x2="469.0" y2="1029.6" stroke="#ac7639" stroke-width="2.6" stroke-linecap="round"/><polygon points="474.0,1029.6 465.9,1033.5 465.9,1025.6" fill="#ac7639"/><rect x="480.0" y="991.1" width="380.0" height="77.0" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.4"/><text x="494.0" y="1013.1" font-size="11" fill="#15803d" font-weight="700" text-anchor="start"><tspan x="494.0">Corrección</tspan></text><text x="494.0" y="1031.1" font-size="12.5" fill="#14532d" font-weight="400" text-anchor="start"><tspan x="494.0">Exige el registro del hecho del cliente que</tspan><tspan x="494.0" dy="16.5">justifica cada cambio de etapa.</tspan></text></svg>