" text-anchor="start"><tspan x="56.0">Infraestructura de experimentos</tspan></text><text x="56.0" y="641.0" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Conjunto técnico que permite asignar, medir y analizar</tspan><tspan x="56.0" dy="15.2">pruebas</tspan></text><rect x="379.0" y="607.2" width="54" height="20" rx="10" fill="#bce5e0" stroke="#8ccec6" stroke-width="1"/><text x="406.0" y="621.2" font-size="11" fill="#206e65" font-weight="700" text-anchor="middle">↔ 1</text><rect x="459.0" y="599.2" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#8ccec6" stroke-width="1.4"/><rect x="459.0" y="607.2" width="5" height="62.2" rx="2" fill="#39ac9e"/><text x="475.0" y="621.2" font-size="13.5" fill="#206e65" font-weight="700" text-anchor="start"><tspan x="475.0">Velocidad de aprendizaje</tspan></text><text x="475.0" y="641.0" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Número de experimentos válidos que el equipo puede</tspan><tspan x="475.0" dy="15.2">ejecutar por periodo</tspan></text><rect x="798.0" y="607.2" width="54" height="20" rx="10" fill="#bce5e0" stroke="#8ccec6" stroke-width="1"/><text x="825.0" y="621.2" font-size="11" fill="#206e65" font-weight="700" text-anchor="middle">↔ 1, 5</text><text x="40" y="709.3600000000001" font-size="11.5" fill="#39ac9e" font-weight="700" letter-spacing="1.4">QUÉ SE MIDE: NUMERADOR SOBRE DENOMINADOR</text><rect x="40.0" y="723.4" width="261.3" height="105.5" rx="8" fill="#e2f7f5" stroke="#8ccec6" stroke-width="1.4"/><text x="54.0" y="745.4" font-size="13" fill="#206e65" font-weight="700" text-anchor="start"><tspan x="54.0">Tiempo para lanzar un</tspan><tspan x="54.0" dy="17.2">experimento</tspan></text><text x="54.0" y="791.7" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Días entre la aprobación y el inicio</tspan><tspan x="54.0" dy="15.2">de la prueba</tspan></text><rect x="319.3" y="723.4" width="