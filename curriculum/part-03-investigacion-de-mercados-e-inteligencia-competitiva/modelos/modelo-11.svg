<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1658" width="900" height="1658" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif"><title id="t">Modelo mental · Social listening y señales de mercado</title><desc id="d">Modelo mental de la clase 03.11: Social listening y señales de mercado. Método en 5 pasos; 8 conceptos; 4 señales de medición.</desc><rect x="0" y="0" width="900" height="1658" rx="14" fill="#ffffff"/><rect x="0" y="0" width="900" height="64" rx="14" fill="#206e3b"/><rect x="0" y="40" width="900" height="24" fill="#206e3b"/><text x="40" y="28" font-size="12" fill="#bce5ca" font-weight="700" letter-spacing="1.6">MODELO MENTAL · CLASE 03.11 · PARTE 03</text><text x="40" y="52" font-size="21" fill="#ffffff" font-weight="700">Social listening y señales de mercado</text><text x="40" y="84" font-size="11.5" fill="#39ac61" font-weight="700" letter-spacing="1.4">MÉTODO PASO A PASO</text><ellipse cx="450.0" cy="376.8" rx="330.0" ry="233.1" fill="none" stroke="#8ccea3" stroke-width="2" stroke-dasharray="3 8" stroke-linecap="round"/><polygon points="653.8,193.3 636.3,190.4 641.2,180.8" fill="#39ac61"/><polygon points="759.3,458.8 761.4,441.2 771.2,445.7" fill="#39ac61"/><polygon points="439.0,609.9 455.9,604.4 455.9,615.3" fill="#39ac61"/><polygon points="131.6,438.8 143.5,451.9 133.7,456.4" fill="#39ac61"/><polygon points="265.8,183.2 253.2,195.8 248.3,186.1" fill="#39ac61"/><circle cx="450.0" cy="376.8" r="100.0" fill="#bce5ca" stroke="#8ccea3" stroke-width="1.6"/><text x="450.0" y="369.0" font-size="15" fill="#206e3b" font-weight="700" text-anchor="middle"><tspan x="450.0">Social listening y</tspan><tspan x="450.0" dy="19.8">señales de mercado</tspan></text><rect x="361.0" y="106.0" width="178" height="75.5" rx="10" fill="#e2f7e9" stroke="#8ccea3" stroke-width="1.4"/><text x="373.0" y="128.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="373.0">Definir qué fuentes se</tspan><tspan x="373.0" dy="16.5">monitorean y con qué</tspan><tspan x="373.0" dy="16.5">frecuencia</tspan></text><circle cx="363.0" cy="108.0" r="14" fill="#206e3b"/><text x="363.0" y="112.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><rect x="674.8" y="267.0" width="178" height="75.5" rx="10" fill="#e2f7e9" stroke="#8ccea3" stroke-width="1.4"/><text x="686.8" y="289.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="686.8">Clasificar los</tspan><tspan x="686.8" dy="16.5">hallazgos por tema y</tspan><tspan x="686.8" dy="16.5">por intensidad</tspan></text><circle cx="676.8" cy="269.0" r="14" fill="#206e3b"/><text x="676.8" y="273.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><rect x="555.0" y="527.6" width="178" height="75.5" rx="10" fill="#e2f7e9" stroke="#8ccea3" stroke-width="1.4"/><text x="567.0" y="549.6" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="567.0">Distinguir señal débil</tspan><tspan x="567.0" dy="16.5">de ruido con un umbral</tspan><tspan x="567.0" dy="16.5">escrito</tspan></text><circle cx="557.0" cy="529.6" r="14" fill="#206e3b"/><text x="557.0" y="534.1" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><rect x="167.0" y="527.6" width="178" height="75.5" rx="10" fill="#e2f7e9" stroke="#8ccea3" stroke-width="1.4"/><text x="179.0" y="549.6" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="179.0">Triangular con datos</tspan><tspan x="179.0" dy="16.5">propios antes de</tspan><tspan x="179.0" dy="16.5">actuar</tspan></text><circle cx="169.0" cy="529.6" r="14" fill="#206e3b"/><text x="169.0" y="534.1" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">4</text><rect x="47.2" y="275.3" width="178" height="59.0" rx="10" fill="#e2f7e9" stroke="#8ccea3" stroke-width="1.4"/><text x="59.2" y="297.3" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="59.2">Documentar la decisión</tspan><tspan x="59.2" dy="16.5">tomada y su resultado</tspan></text><circle cx="49.2" cy="277.3" r="14" fill="#206e3b"/><text x="49.2" y="281.8" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">5</text><text x="40" y="689.6" font-size="11.5" fill="#39ac61" font-weight="700" letter-spacing="1.4">CONCEPTOS Y DÓNDE ACTÚAN EN EL MÉTODO</text><rect x="40.0" y="703.6" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#8ccea3" stroke-width="1.4"/><rect x="40.0" y="711.6" width="5" height="62.2" rx="2" fill="#39ac61"/><text x="56.0" y="725.6" font-size="13.5" fill="#206e3b" font-weight="700" text-anchor="start"><tspan x="56.0">Señal débil</tspan></text><text x="56.0" y="745.4" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Indicio temprano de un cambio que aún no aparece en los</tspan><tspan x="56.0" dy="15.2">datos agregados</tspan></text><rect x="379.0" y="711.6" width="54" height="20" rx="10" fill="#bce5ca" stroke="#8ccea3" stroke-width="1"/><text x="406.0" y="725.6" font-size="11" fill="#206e3b" font-weight="700" text-anchor="middle">↔ 3</text><rect x="459.0" y="703.6" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#8ccea3" stroke-width="1.4"/><rect x="459.0" y="711.6" width="5" height="62.2" rx="2" fill="#39ac61"/><text x="475.0" y="725.6" font-size="13.5" fill="#206e3b" font-weight="700" text-anchor="start"><tspan x="475.0">Sesgo de voz</tspan></text><text x="475.0" y="745.4" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Sobrerrepresentación de opiniones extremas en canales</tspan><tspan x="475.0" dy="15.2">públicos</tspan></text><rect x="40.0" y="795.8" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#8ccea3" stroke-width="1.4"/><rect x="40.0" y="803.8" width="5" height="62.2" rx="2" fill="#39ac61"/><text x="56.0" y="817.8" font-size="13.5" fill="#206e3b" font-weight="700" text-anchor="start"><tspan x="56.0">Vocabulario del cliente</tspan></text><text x="56.0" y="837.6" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Términos concretos con que el mercado nombra su problema y</tspan><tspan x="56.0" dy="15.2">sus soluciones</tspan></text><rect x="459.0" y="795.8" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#8ccea3" stroke-width="1.4"/><rect x="459.0" y="803.8" width="5" height="62.2" rx="2" fill="#39ac61"/><text x="475.0" y="817.8" font-size="13.5" fill="#206e3b" font-weight="700" text-anchor="start"><tspan x="475.0">Umbral de acción</tspan></text><text x="475.0" y="837.6" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Criterio explícito que convierte una señal en decisión de</tspan><tspan x="475.0" dy="15.2">investigar o intervenir</tspan></text><rect x="798.0" y="803.8" width="54" height="20" rx="10" fill="#bce5ca" stroke="#8ccea3" stroke-width="1"/><text x="825.0" y="817.8" font-size="11" fill="#206e3b" font-weight="700" text-anchor="middle">↔ 3</text><rect x="40.0" y="888.0" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#8ccea3" stroke-width="1.4"/><rect x="40.0" y="896.0" width="5" height="62.2" rx="2" fill="#39ac61"/><text x="56.0" y="910.0" font-size="13.5" fill="#206e3b" font-weight="700" text-anchor="start"><tspan x="56.0">Señal débil</tspan></text><text x="56.0" y="929.8" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Mención aislada o patrón incipiente que todavía no alcanza</tspan><tspan x="56.0" dy="15.2">volumen pero puede anticipar un conflicto</tspan></text><rect x="379.0" y="896.0" width="54" height="20" rx="10" fill="#bce5ca" stroke="#8ccea3" stroke-width="1"/><text x="406.0" y="910.0" font-size="11" fill="#206e3b" font-weight="700" text-anchor="middle">↔ 3</text><rect x="459.0" y="888.0" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#8ccea3" stroke-width="1.4"/><rect x="459.0" y="896.0" width="5" height="62.2" rx="2" fill="#39ac61"/><text x="475.0" y="910.0" font-size="13.5" fill="#206e3b" font-weight="700" text-anchor="start"><tspan x="475.0">Umbral de alerta</tspan></text><text x="475.0" y="929.8" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Valor predefinido de volumen, velocidad o sentimiento que</tspan><tspan x="475.0" dy="15.2">activa una revisión humana</tspan></text><rect x="798.0" y="896.0" width="54" height="20" rx="10" fill="#bce5ca" stroke="#8ccea3" stroke-width="1"/><text x="825.0" y="910.0" font-size="11" fill="#206e3b" font-weight="700" text-anchor="middle">↔ 3</text><rect x="40.0" y="980.1" width="401.0" height="93.4" rx="8" fill="#ffffff" stroke="#8ccea3" stroke-width="1.4"/><rect x="40.0" y="988.1" width="5" height="77.4" rx="2" fill="#39ac61"/><text x="56.0" y="1002.1" font-size="13.5" fill="#206e3b" font-weight="700" text-anchor="start"><tspan x="56.0">Rumor</tspan></text><text x="56.0" y="1022.0" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Afirmación sin verificar que circula entre personas; no es</tspan><tspan x="56.0" dy="15.2">lo mismo que desinformación, que exige falsedad e</tspan><tspan x="56.0" dy="15.2">intención de dañar</tspan></text><rect x="459.0" y="980.1" width="401.0" height="93.4" rx="8" fill="#ffffff" stroke="#8ccea3" stroke-width="1.4"/><rect x="459.0" y="988.1" width="5" height="77.4" rx="2" fill="#39ac61"/><text x="475.0" y="1002.1" font-size="13.5" fill="#206e3b" font-weight="700" text-anchor="start"><tspan x="475.0">Severidad de una señal</tspan></text><text x="475.0" y="1022.0" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Combinación de alcance potencial, credibilidad de la</tspan><tspan x="475.0" dy="15.2">fuente y daño posible a personas o a la organización</tspan></text><rect x="798.0" y="988.1" width="54" height="20" rx="10" fill="#bce5ca" stroke="#8ccea3" stroke-width="1"/><text x="825.0" y="1002.1" font-size="11" fill="#206e3b" font-weight="700" text-anchor="middle">↔ 3</text><text x="40" y="1105.5" font-size="11.5" fill="#39ac61" font-weight="700" letter-spacing="1.4">QUÉ SE MIDE: NUMERADOR SOBRE DENOMINADOR</text><rect x="40.0" y="1119.5" width="261.3" height="120.7" rx="8" fill="#e2f7e9" stroke="#8ccea3" stroke-width="1.4"/><text x="54.0" y="1141.5" font-size="13" fill="#206e3b" font-weight="700" text-anchor="start"><tspan x="54.0">Volumen y tono por tema</tspan></text><text x="54.0" y="1170.7" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Menciones por tema y proporción</tspan><tspan x="54.0" dy="15.2">negativa, positiva y neutra, por</tspan><tspan x="54.0" dy="15.2">periodo</tspan></text><rect x="319.3" y="1119.5" width="261.3" height="120.7" rx="8" fill="#e2f7e9" stroke="#8ccea3" stroke-width="1.4"/><text x="333.3" y="1141.5" font-size="13" fill="#206e3b" font-weight="700" text-anchor="start"><tspan x="333.3">Tiempo de detección</tspan></text><text x="333.3" y="1170.7" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="333.3">Días entre la aparición pública de</tspan><tspan x="333.3" dy="15.2">un tema y su registro interno</tspan></text><rect x="598.7" y="1119.5" width="261.3" height="120.7" rx="8" fill="#e2f7e9" stroke="#8ccea3" stroke-width="1.4"/><text x="612.7" y="1141.5" font-size="13" fill="#206e3b" font-weight="700" text-anchor="start"><tspan x="612.7">Tasa de confirmación</tspan></text><text x="612.7" y="1170.7" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="612.7">Señales que se confirmaron con datos</tspan><tspan x="612.7" dy="15.2">propios</tspan></text><line x1="612.7" y1="1207.0" x2="846.0" y2="1207.0" stroke="#39ac61" stroke-width="2"/><text x="612.7" y="1225.0" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="612.7">Señales escaladas</tspan></text><rect x="40.0" y="1254.2" width="261.3" height="142.6" rx="8" fill="#e2f7e9" stroke="#8ccea3" stroke-width="1.4"/><text x="54.0" y="1276.2" font-size="13" fill="#206e3b" font-weight="700" text-anchor="start"><tspan x="54.0">Alertas críticas verificadas</tspan></text><text x="54.0" y="1305.4" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Alertas con hecho confirmado tras</tspan><tspan x="54.0" dy="15.2">revisión humana</tspan></text><line x1="54.0" y1="1341.7" x2="287.3" y2="1341.7" stroke="#39ac61" stroke-width="2"/><text x="54.0" y="1359.7" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="54.0">Alertas críticas emitidas</tspan></text><text x="54.0" y="1388.9" font-size="10.5" fill="#7b8794" font-weight="400" text-anchor="start"><tspan x="54.0">Ventana: mensual</tspan></text><text x="40" y="1430.76" font-size="11.5" fill="#39ac61" font-weight="700" letter-spacing="1.4">FRONTERA DE APLICACIÓN</text><rect x="40" y="1440.8" width="820" height="65.0" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.4"/><polygon points="70,1458.26 52,1487.26 88,1487.26" fill="#c2410c"/><text x="70" y="1484.26" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">!</text><text x="106" y="1464.8" font-size="12.5" fill="#7c2d12" font-weight="400" text-anchor="start"><tspan x="106">El monitoreo de conversaciones debe respetar la privacidad y los términos de cada plataforma. Recolectar y</tspan><tspan x="106" dy="16.5">almacenar datos personales de personas identificables exige base legal.</tspan></text><text x="40" y="1533.76" font-size="11.5" fill="#39ac61" font-weight="700" letter-spacing="1.4">ERROR FRECUENTE Y SU CORRECCIÓN</text><rect x="40" y="1543.8" width="380.0" height="77.0" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/><text x="54" y="1565.8" font-size="11" fill="#b91c1c" font-weight="700" text-anchor="start"><tspan x="54">Síntoma</tspan></text><text x="54" y="1583.8" font-size="12.5" fill="#7f1d1d" font-weight="400" text-anchor="start"><tspan x="54">Tomar comentarios aislados como tendencia</tspan></text><line x1="426.0" y1="1582.3" x2="469.0" y2="1582.3" stroke="#39ac61" stroke-width="2.6" stroke-linecap="round"/><polygon points="474.0,1582.3 465.9,1586.2 465.9,1578.3" fill="#39ac61"/><rect x="480.0" y="1543.8" width="380.0" height="77.0" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.4"/><text x="494.0" y="1565.8" font-size="11" fill="#15803d" font-weight="700" text-anchor="start"><tspan x="494.0">Corrección</tspan></text><text x="494.0" y="1583.8" font-size="12.5" fill="#14532d" font-weight="400" text-anchor="start"><tspan x="494.0">Fija un umbral de menciones y una verificación con</tspan><tspan x="494.0" dy="16.5">datos propios antes de escalar la señal.</tspan></text></svg>