pan></text><circle cx="49.2" cy="277.3" r="14" fill="#2e206e"/><text x="49.2" y="281.8" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">5</text><text x="40" y="689.6" font-size="11.5" fill="#4e39ac" font-weight="700" letter-spacing="1.4">CONCEPTOS Y DÓNDE ACTÚAN EN EL MÉTODO</text><rect x="40.0" y="703.6" width="401.0" height="63.0" rx="8" fill="#ffffff" stroke="#988cce" stroke-width="1.4"/><rect x="40.0" y="711.6" width="5" height="47.0" rx="2" fill="#4e39ac"/><text x="56.0" y="725.6" font-size="13.5" fill="#2e206e" font-weight="700" text-anchor="start"><tspan x="56.0">Jerarquía informativa</tspan></text><text x="56.0" y="745.4" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Orden de los bloques según las preguntas del visitante</tspan></text><rect x="379.0" y="711.6" width="54" height="20" rx="10" fill="#c4bce5" stroke="#988cce" stroke-width="1"/><text x="406.0" y="725.6" font-size="11" fill="#2e206e" font-weight="700" text-anchor="middle">↔ 2</text><rect x="459.0" y="703.6" width="401.0" height="63.0" rx="8" fill="#ffffff" stroke="#988cce" stroke-width="1.4"/><rect x="459.0" y="711.6" width="5" height="47.0" rx="2" fill="#4e39ac"/><text x="475.0" y="725.6" font-size="13.5" fill="#2e206e" font-weight="700" text-anchor="start"><tspan x="475.0">Objeción dominante</tspan></text><text x="475.0" y="745.4" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Duda que más frecuentemente impide avanzar en ese segmento</tspan></text><rect x="798.0" y="711.6" width="54" height="20" rx="10" fill="#c4bce5" stroke="#988cce" stroke-width="1"/><text x="825.0" y="725.6" font-size="11" fill="#2e206e" font-weight="700" text-anchor="middle">↔ 1</text><rect x="40.0" y="780.6" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#988cce" stroke-width="1.4"/><rect x="40.0" y="788.6" width="5" height="62.2" rx="2" fill="#4e39ac"/><text x="56.0" y="802.6" font-size="13.5" fill="#2e206e" fon