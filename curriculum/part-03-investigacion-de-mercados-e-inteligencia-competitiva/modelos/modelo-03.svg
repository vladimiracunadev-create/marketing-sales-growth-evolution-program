<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1339" width="900" height="1339" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif"><title id="t">Modelo mental · Diseño de entrevistas</title><desc id="d">Modelo mental de la clase 03.03: Diseño de entrevistas. Método en 5 pasos; 8 conceptos; 5 señales de medición.</desc><rect x="0" y="0" width="900" height="1339" rx="14" fill="#ffffff"/><rect x="0" y="0" width="900" height="64" rx="14" fill="#206e3b"/><rect x="0" y="40" width="900" height="24" fill="#206e3b"/><text x="40" y="28" font-size="12" fill="#bce5ca" font-weight="700" letter-spacing="1.6">MODELO MENTAL · CLASE 03.03 · PARTE 03</text><text x="40" y="52" font-size="21" fill="#ffffff" font-weight="700">Diseño de entrevistas</text><text x="40" y="84" font-size="11.5" fill="#39ac61" font-weight="700" letter-spacing="1.4">MÉTODO PASO A PASO</text><line x1="450.0" y1="94.0" x2="450.0" y2="317.0" stroke="#8ccea3" stroke-width="3" stroke-linecap="round"/><line x1="450.0" y1="129.5" x2="406.0" y2="129.5" stroke="#8ccea3" stroke-width="2"/><rect x="56.0" y="100" width="350" height="59.0" rx="10" fill="#e2f7e9" stroke="#8ccea3" stroke-width="1.4"/><text x="70.0" y="122" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="70.0">Definir qué hipótesis debe refutar la</tspan><tspan x="70.0" dy="16.5">entrevista</tspan></text><circle cx="450.0" cy="129.5" r="15" fill="#206e3b"/><text x="450.0" y="134.0" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><line x1="450.0" y1="159.2" x2="494.0" y2="159.2" stroke="#8ccea3" stroke-width="2"/><rect x="494.0" y="138" width="350" height="42.5" rx="10" fill="#e2f7e9" stroke="#8ccea3" stroke-width="1.4"/><text x="508.0" y="160" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="508.0">Escribir preguntas sobre comportamiento pasado</tspan></text><circle cx="450.0" cy="159.2" r="15" fill="#206e3b"/><text x="450.0" y="163.8" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><line x1="450.0" y1="205.5" x2="406.0" y2="205.5" stroke="#8ccea3" stroke-width="2"/><rect x="56.0" y="176" width="350" height="59.0" rx="10" fill="#e2f7e9" stroke="#8ccea3" stroke-width="1.4"/><text x="70.0" y="198" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="70.0">Eliminar preguntas que anticipan la respuesta</tspan><tspan x="70.0" dy="16.5">deseada</tspan></text><circle cx="450.0" cy="205.5" r="15" fill="#206e3b"/><text x="450.0" y="210.0" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><line x1="450.0" y1="235.2" x2="494.0" y2="235.2" stroke="#8ccea3" stroke-width="2"/><rect x="494.0" y="214" width="350" height="42.5" rx="10" fill="#e2f7e9" stroke="#8ccea3" stroke-width="1.4"/><text x="508.0" y="236" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="508.0">Buscar un compromiso verificable al cierre</tspan></text><circle cx="450.0" cy="235.2" r="15" fill="#206e3b"/><text x="450.0" y="239.8" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">4</text><line x1="450.0" y1="281.5" x2="406.0" y2="281.5" stroke="#8ccea3" stroke-width="2"/><rect x="56.0" y="252" width="350" height="59.0" rx="10" fill="#e2f7e9" stroke="#8ccea3" stroke-width="1.4"/><text x="70.0" y="274" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="70.0">Registrar hechos y citas textuales, no</tspan><tspan x="70.0" dy="16.5">interpretaciones</tspan></text><circle cx="450.0" cy="281.5" r="15" fill="#206e3b"/><text x="450.0" y="286.0" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">5</text><text x="40" y="353.0" font-size="11.5" fill="#39ac61" font-weight="700" letter-spacing="1.4">CONCEPTOS Y DÓNDE ACTÚAN EN EL MÉTODO</text><rect x="40.0" y="367.0" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#8ccea3" stroke-width="1.4"/><rect x="40.0" y="375.0" width="5" height="62.2" rx="2" fill="#39ac61"/><text x="56.0" y="389.0" font-size="13.5" fill="#206e3b" font-weight="700" text-anchor="start"><tspan x="56.0">Pregunta conductual</tspan></text><text x="56.0" y="408.8" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Pregunta sobre lo que la persona efectivamente hizo,</tspan><tspan x="56.0" dy="15.2">cuándo y con qué consecuencia</tspan></text><rect x="379.0" y="375.0" width="54" height="20" rx="10" fill="#bce5ca" stroke="#8ccea3" stroke-width="1"/><text x="406.0" y="389.0" font-size="11" fill="#206e3b" font-weight="700" text-anchor="middle">↔ 2, 3</text><rect x="459.0" y="367.0" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#8ccea3" stroke-width="1.4"/><rect x="459.0" y="375.0" width="5" height="62.2" rx="2" fill="#39ac61"/><text x="475.0" y="389.0" font-size="13.5" fill="#206e3b" font-weight="700" text-anchor="start"><tspan x="475.0">Sesgo de complacencia</tspan></text><text x="475.0" y="408.8" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Tendencia del entrevistado a responder lo que cree que el</tspan><tspan x="475.0" dy="15.2">entrevistador quiere oír</tspan></text><rect x="40.0" y="459.2" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#8ccea3" stroke-width="1.4"/><rect x="40.0" y="467.2" width="5" height="62.2" rx="2" fill="#39ac61"/><text x="56.0" y="481.2" font-size="13.5" fill="#206e3b" font-weight="700" text-anchor="start"><tspan x="56.0">Compromiso verificable</tspan></text><text x="56.0" y="501.0" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Señal costosa —tiempo, dinero, presentación a un jefe— que</tspan><tspan x="56.0" dy="15.2">confirma interés real</tspan></text><rect x="379.0" y="467.2" width="54" height="20" rx="10" fill="#bce5ca" stroke="#8ccea3" stroke-width="1"/><text x="406.0" y="481.2" font-size="11" fill="#206e3b" font-weight="700" text-anchor="middle">↔ 4</text><rect x="459.0" y="459.2" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#8ccea3" stroke-width="1.4"/><rect x="459.0" y="467.2" width="5" height="62.2" rx="2" fill="#39ac61"/><text x="475.0" y="481.2" font-size="13.5" fill="#206e3b" font-weight="700" text-anchor="start"><tspan x="475.0">Saturación</tspan></text><text x="475.0" y="501.0" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Punto en que nuevas entrevistas dejan de aportar</tspan><tspan x="475.0" dy="15.2">categorías nuevas</tspan></text><rect x="40.0" y="551.4" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#8ccea3" stroke-width="1.4"/><rect x="40.0" y="559.4" width="5" height="62.2" rx="2" fill="#39ac61"/><text x="56.0" y="573.4" font-size="13.5" fill="#206e3b" font-weight="700" text-anchor="start"><tspan x="56.0">Entrevista no dirigida</tspan></text><text x="56.0" y="593.2" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Conversación donde el entrevistador explora conducta</tspan><tspan x="56.0" dy="15.2">pasada sin conducir hacia su solución</tspan></text><rect x="379.0" y="559.4" width="54" height="20" rx="10" fill="#bce5ca" stroke="#8ccea3" stroke-width="1"/><text x="406.0" y="573.4" font-size="11" fill="#206e3b" font-weight="700" text-anchor="middle">↔ 1</text><rect x="459.0" y="551.4" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#8ccea3" stroke-width="1.4"/><rect x="459.0" y="559.4" width="5" height="62.2" rx="2" fill="#39ac61"/><text x="475.0" y="573.4" font-size="13.5" fill="#206e3b" font-weight="700" text-anchor="start"><tspan x="475.0">Pregunta de seguimiento</tspan></text><text x="475.0" y="593.2" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Indagación que pide ejemplo, secuencia, costo, actor o</tspan><tspan x="475.0" dy="15.2">consecuencia de una respuesta</tspan></text><rect x="798.0" y="559.4" width="54" height="20" rx="10" fill="#bce5ca" stroke="#8ccea3" stroke-width="1"/><text x="825.0" y="573.4" font-size="11" fill="#206e3b" font-weight="700" text-anchor="middle">↔ 2, 3</text><rect x="40.0" y="643.5" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#8ccea3" stroke-width="1.4"/><rect x="40.0" y="651.5" width="5" height="62.2" rx="2" fill="#39ac61"/><text x="56.0" y="665.5" font-size="13.5" fill="#206e3b" font-weight="700" text-anchor="start"><tspan x="56.0">Codificación temática</tspan></text><text x="56.0" y="685.4" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Asignación reproducible de etiquetas a fragmentos para</tspan><tspan x="56.0" dy="15.2">identificar patrones y excepciones</tspan></text><rect x="459.0" y="643.5" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#8ccea3" stroke-width="1.4"/><rect x="459.0" y="651.5" width="5" height="62.2" rx="2" fill="#39ac61"/><text x="475.0" y="665.5" font-size="13.5" fill="#206e3b" font-weight="700" text-anchor="start"><tspan x="475.0">Triangulación</tspan></text><text x="475.0" y="685.4" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Contraste de un hallazgo con métodos, fuentes o</tspan><tspan x="475.0" dy="15.2">investigadores diferentes</tspan></text><text x="40" y="753.72" font-size="11.5" fill="#39ac61" font-weight="700" letter-spacing="1.4">QUÉ SE MIDE: NUMERADOR SOBRE DENOMINADOR</text><rect x="40.0" y="767.7" width="261.3" height="137.9" rx="8" fill="#e2f7e9" stroke="#8ccea3" stroke-width="1.4"/><text x="54.0" y="789.7" font-size="13" fill="#206e3b" font-weight="700" text-anchor="start"><tspan x="54.0">Proporción de hechos sobre</tspan><tspan x="54.0" dy="17.2">opiniones</tspan></text><text x="54.0" y="836.0" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Afirmaciones sobre comportamiento</tspan><tspan x="54.0" dy="15.2">pasado registradas</tspan></text><line x1="54.0" y1="872.4" x2="287.3" y2="872.4" stroke="#39ac61" stroke-width="2"/><text x="54.0" y="890.4" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="54.0">Afirmaciones totales por entrevista</tspan></text><rect x="319.3" y="767.7" width="261.3" height="137.9" rx="8" fill="#e2f7e9" stroke="#8ccea3" stroke-width="1.4"/><text x="333.3" y="789.7" font-size="13" fill="#206e3b" font-weight="700" text-anchor="start"><tspan x="333.3">Tasa de compromiso obtenido</tspan></text><text x="333.3" y="818.9" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="333.3">Entrevistados que aceptaron un</tspan><tspan x="333.3" dy="15.2">siguiente paso costoso</tspan></text><line x1="333.3" y1="855.2" x2="566.7" y2="855.2" stroke="#39ac61" stroke-width="2"/><text x="333.3" y="873.2" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="333.3">Entrevistas realizadas</tspan></text><rect x="598.7" y="767.7" width="261.3" height="137.9" rx="8" fill="#e2f7e9" stroke="#8ccea3" stroke-width="1.4"/><text x="612.7" y="789.7" font-size="13" fill="#206e3b" font-weight="700" text-anchor="start"><tspan x="612.7">Entrevistas hasta saturación</tspan></text><text x="612.7" y="818.9" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="612.7">Número de entrevistas tras el cual</tspan><tspan x="612.7" dy="15.2">no aparecen categorías nuevas, por</tspan><tspan x="612.7" dy="15.2">segmento</tspan></text><rect x="40.0" y="919.6" width="261.3" height="157.7" rx="8" fill="#e2f7e9" stroke="#8ccea3" stroke-width="1.4"/><text x="54.0" y="941.6" font-size="13" fill="#206e3b" font-weight="700" text-anchor="start"><tspan x="54.0">Cobertura de perspectivas</tspan></text><text x="54.0" y="970.7" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Roles y estados de relación</tspan><tspan x="54.0" dy="15.2">entrevistados</tspan></text><line x1="54.0" y1="1007.1" x2="287.3" y2="1007.1" stroke="#39ac61" stroke-width="2"/><text x="54.0" y="1025.1" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="54.0">Roles y estados definidos en el plan</tspan><tspan x="54.0" dy="15.2">muestral</tspan></text><text x="54.0" y="1069.5" font-size="10.5" fill="#7b8794" font-weight="400" text-anchor="start"><tspan x="54.0">Ventana: por ronda de investigación</tspan></text><rect x="319.3" y="919.6" width="261.3" height="157.7" rx="8" fill="#e2f7e9" stroke="#8ccea3" stroke-width="1.4"/><text x="333.3" y="941.6" font-size="13" fill="#206e3b" font-weight="700" text-anchor="start"><tspan x="333.3">Saturación temática declarada</tspan></text><text x="333.3" y="970.7" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="333.3">Entrevistas consecutivas sin tema</tspan><tspan x="333.3" dy="15.2">accionable nuevo</tspan></text><line x1="333.3" y1="1007.1" x2="566.7" y2="1007.1" stroke="#39ac61" stroke-width="2"/><text x="333.3" y="1025.1" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="333.3">Entrevistas consecutivas revisadas</tspan></text><text x="333.3" y="1054.3" font-size="10.5" fill="#7b8794" font-weight="400" text-anchor="start"><tspan x="333.3">Ventana: ventana móvil de cinco</tspan><tspan x="333.3" dy="13.9">entrevistas</tspan></text><text x="40" y="1111.3200000000002" font-size="11.5" fill="#39ac61" font-weight="700" letter-spacing="1.4">FRONTERA DE APLICACIÓN</text><rect x="40" y="1121.3" width="820" height="65.0" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.4"/><polygon points="70,1138.8200000000002 52,1167.8200000000002 88,1167.8200000000002" fill="#c2410c"/><text x="70" y="1164.8200000000002" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">!</text><text x="106" y="1145.3" font-size="12.5" fill="#7c2d12" font-weight="400" text-anchor="start"><tspan x="106">Las entrevistas no dimensionan mercado ni miden frecuencia poblacional. Sirven para descubrir mecanismos y</tspan><tspan x="106" dy="16.5">vocabulario, no para estimar cuántos hay.</tspan></text><text x="40" y="1214.3200000000002" font-size="11.5" fill="#39ac61" font-weight="700" letter-spacing="1.4">ERROR FRECUENTE Y SU CORRECCIÓN</text><rect x="40" y="1224.3" width="380.0" height="77.0" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/><text x="54" y="1246.3" font-size="11" fill="#b91c1c" font-weight="700" text-anchor="start"><tspan x="54">Síntoma</tspan></text><text x="54" y="1264.3" font-size="12.5" fill="#7f1d1d" font-weight="400" text-anchor="start"><tspan x="54">Presentar la idea antes de conocer el</tspan><tspan x="54" dy="16.5">comportamiento</tspan></text><line x1="426.0" y1="1262.8" x2="469.0" y2="1262.8" stroke="#39ac61" stroke-width="2.6" stroke-linecap="round"/><polygon points="474.0,1262.8 465.9,1266.7 465.9,1258.9" fill="#39ac61"/><rect x="480.0" y="1224.3" width="380.0" height="77.0" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.4"/><text x="494.0" y="1246.3" font-size="11" fill="#15803d" font-weight="700" text-anchor="start"><tspan x="494.0">Corrección</tspan></text><text x="494.0" y="1264.3" font-size="12.5" fill="#14532d" font-weight="400" text-anchor="start"><tspan x="494.0">Deja la presentación de la solución para el final y</tspan><tspan x="494.0" dy="16.5">sólo después de haber registrado hechos.</tspan></text></svg>