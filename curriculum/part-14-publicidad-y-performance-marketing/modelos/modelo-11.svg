" fill="#a839ac" font-weight="700" letter-spacing="1.4">ERROR FRECUENTE Y SU CORRECCIÓN</text><rect x="40" y="1157.3" width="380.0" height="77.0" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/><text x="54" y="1179.3" font-size="11" fill="#b91c1c" font-weight="700" text-anchor="start"><tspan x="54">Síntoma</tspan></text><text x="54" y="1197.3" font-size="12.5" fill="#7f1d1d" font-weight="400" text-anchor="start"><tspan x="54">Reportar cifras de plataforma sin reconciliar con</tspan><tspan x="54" dy="16.5">el CRM</tspan></text><line x1="426.0" y1="1195.8" x2="469.0" y2="1195.8" stroke="#a839ac" stroke-width="2.6" stroke-linecap="round"/><polygon points="474.0,1195.8 465.9,1199.7 465.9,1191.9" fill="#a839ac"/><rect x="480.0" y="1157.3" width="380.0" height="77.0" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.4"/><text x="494.0" y="1179.3" font-size="11" fill="#15803d" font-weight="700" text-anchor="start"><tspan x="494.0">Corrección</tspan></text><text x="494.0" y="1197.3" font-size="12.5" fill="#14532d" font-weight="400" text-anchor="start"><tspan x="494.0">Concilia mensualmente y publica la diferencia junto</tspan><tspan x="494.0" dy="16.5">con el informe.</tspan></text></svg>