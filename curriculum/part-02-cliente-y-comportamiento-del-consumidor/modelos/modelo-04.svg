<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1706" width="900" height="1706" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif"><title id="t">Modelo mental · Buyer persona con evidencia</title><desc id="d">Modelo mental de la clase 02.04: Buyer persona con evidencia. Método en 5 pasos; 8 conceptos; 4 señales de medición.</desc><rect x="0" y="0" width="900" height="1706" rx="14" fill="#ffffff"/><rect x="0" y="0" width="900" height="64" rx="14" fill="#426e20"/><rect x="0" y="40" width="900" height="24" fill="#426e20"/><text x="40" y="28" font-size="12" fill="#cee5bc" font-weight="700" letter-spacing="1.6">MODELO MENTAL · CLASE 02.04 · PARTE 02</text><text x="40" y="52" font-size="21" fill="#ffffff" font-weight="700">Buyer persona con evidencia</text><text x="40" y="84" font-size="11.5" fill="#6bac39" font-weight="700" letter-spacing="1.4">MÉTODO PASO A PASO</text><ellipse cx="450.0" cy="376.8" rx="330.0" ry="233.1" fill="none" stroke="#a9ce8c" stroke-width="2" stroke-dasharray="3 8" stroke-linecap="round"/><polygon points="653.8,193.3 636.3,190.4 641.2,180.8" fill="#6bac39"/><polygon points="759.3,458.8 761.4,441.2 771.2,445.7" fill="#6bac39"/><polygon points="439.0,609.9 455.9,604.4 455.9,615.3" fill="#6bac39"/><polygon points="131.6,438.8 143.5,451.9 133.7,456.4" fill="#6bac39"/><polygon points="265.8,183.2 253.2,195.8 248.3,186.1" fill="#6bac39"/><circle cx="450.0" cy="376.8" r="100.0" fill="#cee5bc" stroke="#a9ce8c" stroke-width="1.6"/><text x="450.0" y="369.0" font-size="15" fill="#426e20" font-weight="700" text-anchor="middle"><tspan x="450.0">Buyer persona con</tspan><tspan x="450.0" dy="19.8">evidencia</tspan></text><rect x="361.0" y="106.0" width="178" height="75.5" rx="10" fill="#ebf7e2" stroke="#a9ce8c" stroke-width="1.4"/><text x="373.0" y="128.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="373.0">Definir qué decisiones</tspan><tspan x="373.0" dy="16.5">debe informar la</tspan><tspan x="373.0" dy="16.5">persona</tspan></text><circle cx="363.0" cy="108.0" r="14" fill="#426e20"/><text x="363.0" y="112.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><rect x="674.8" y="267.0" width="178" height="75.5" rx="10" fill="#ebf7e2" stroke="#a9ce8c" stroke-width="1.4"/><text x="686.8" y="289.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="686.8">Recolectar evidencia</tspan><tspan x="686.8" dy="16.5">de entrevistas, CRM y</tspan><tspan x="686.8" dy="16.5">analítica</tspan></text><circle cx="676.8" cy="269.0" r="14" fill="#426e20"/><text x="676.8" y="273.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><rect x="555.0" y="527.6" width="178" height="75.5" rx="10" fill="#ebf7e2" stroke="#a9ce8c" stroke-width="1.4"/><text x="567.0" y="549.6" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="567.0">Escribir sólo</tspan><tspan x="567.0" dy="16.5">atributos accionables</tspan><tspan x="567.0" dy="16.5">con su fuente</tspan></text><circle cx="557.0" cy="529.6" r="14" fill="#426e20"/><text x="557.0" y="534.1" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><rect x="167.0" y="527.6" width="178" height="75.5" rx="10" fill="#ebf7e2" stroke="#a9ce8c" stroke-width="1.4"/><text x="179.0" y="549.6" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="179.0">Marcar hipótesis</tspan><tspan x="179.0" dy="16.5">pendientes y su plan</tspan><tspan x="179.0" dy="16.5">de validación</tspan></text><circle cx="169.0" cy="529.6" r="14" fill="#426e20"/><text x="169.0" y="534.1" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">4</text><rect x="47.2" y="275.3" width="178" height="59.0" rx="10" fill="#ebf7e2" stroke="#a9ce8c" stroke-width="1.4"/><text x="59.2" y="297.3" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="59.2">Fijar fecha de</tspan><tspan x="59.2" dy="16.5">revisión del perfil</tspan></text><circle cx="49.2" cy="277.3" r="14" fill="#426e20"/><text x="49.2" y="281.8" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">5</text><text x="40" y="689.6" font-size="11.5" fill="#6bac39" font-weight="700" letter-spacing="1.4">CONCEPTOS Y DÓNDE ACTÚAN EN EL MÉTODO</text><rect x="40.0" y="703.6" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#a9ce8c" stroke-width="1.4"/><rect x="40.0" y="711.6" width="5" height="62.2" rx="2" fill="#6bac39"/><text x="56.0" y="725.6" font-size="13.5" fill="#426e20" font-weight="700" text-anchor="start"><tspan x="56.0">Persona basada en evidencia</tspan></text><text x="56.0" y="745.4" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Perfil donde cada atributo indica fuente, número de</tspan><tspan x="56.0" dy="15.2">observaciones y fecha</tspan></text><rect x="379.0" y="711.6" width="54" height="20" rx="10" fill="#cee5bc" stroke="#a9ce8c" stroke-width="1"/><text x="406.0" y="725.6" font-size="11" fill="#426e20" font-weight="700" text-anchor="middle">↔ 1, 2, 3, 5</text><rect x="459.0" y="703.6" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#a9ce8c" stroke-width="1.4"/><rect x="459.0" y="711.6" width="5" height="62.2" rx="2" fill="#6bac39"/><text x="475.0" y="725.6" font-size="13.5" fill="#426e20" font-weight="700" text-anchor="start"><tspan x="475.0">Atributo accionable</tspan></text><text x="475.0" y="745.4" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Característica que cambia mensaje, canal, oferta o proceso</tspan><tspan x="475.0" dy="15.2">comercial</tspan></text><rect x="798.0" y="711.6" width="54" height="20" rx="10" fill="#cee5bc" stroke="#a9ce8c" stroke-width="1"/><text x="825.0" y="725.6" font-size="11" fill="#426e20" font-weight="700" text-anchor="middle">↔ 3</text><rect x="40.0" y="795.8" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#a9ce8c" stroke-width="1.4"/><rect x="40.0" y="803.8" width="5" height="62.2" rx="2" fill="#6bac39"/><text x="56.0" y="817.8" font-size="13.5" fill="#426e20" font-weight="700" text-anchor="start"><tspan x="56.0">Hipótesis marcada</tspan></text><text x="56.0" y="837.6" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Afirmación aún no verificada que se declara como tal para</tspan><tspan x="56.0" dy="15.2">evitar tratarla como hecho</tspan></text><rect x="379.0" y="803.8" width="54" height="20" rx="10" fill="#cee5bc" stroke="#a9ce8c" stroke-width="1"/><text x="406.0" y="817.8" font-size="11" fill="#426e20" font-weight="700" text-anchor="middle">↔ 4</text><rect x="459.0" y="795.8" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#a9ce8c" stroke-width="1.4"/><rect x="459.0" y="803.8" width="5" height="62.2" rx="2" fill="#6bac39"/><text x="475.0" y="817.8" font-size="13.5" fill="#426e20" font-weight="700" text-anchor="start"><tspan x="475.0">Caducidad del perfil</tspan></text><text x="475.0" y="837.6" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Fecha a partir de la cual el perfil debe revalidarse por</tspan><tspan x="475.0" dy="15.2">cambios de mercado</tspan></text><rect x="798.0" y="803.8" width="54" height="20" rx="10" fill="#cee5bc" stroke="#a9ce8c" stroke-width="1"/><text x="825.0" y="817.8" font-size="11" fill="#426e20" font-weight="700" text-anchor="middle">↔ 5</text><rect x="40.0" y="888.0" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#a9ce8c" stroke-width="1.4"/><rect x="40.0" y="896.0" width="5" height="62.2" rx="2" fill="#6bac39"/><text x="56.0" y="910.0" font-size="13.5" fill="#426e20" font-weight="700" text-anchor="start"><tspan x="56.0">Persona hipotética</tspan></text><text x="56.0" y="929.8" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Perfil provisional compuesto por supuestos marcados que</tspan><tspan x="56.0" dy="15.2">todavía no tiene evidencia suficiente</tspan></text><rect x="379.0" y="896.0" width="54" height="20" rx="10" fill="#cee5bc" stroke="#a9ce8c" stroke-width="1"/><text x="406.0" y="910.0" font-size="11" fill="#426e20" font-weight="700" text-anchor="middle">↔ 1, 4</text><rect x="459.0" y="888.0" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#a9ce8c" stroke-width="1.4"/><rect x="459.0" y="896.0" width="5" height="62.2" rx="2" fill="#6bac39"/><text x="475.0" y="910.0" font-size="13.5" fill="#426e20" font-weight="700" text-anchor="start"><tspan x="475.0">Persona sustentada</tspan></text><text x="475.0" y="929.8" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Patrón respaldado por evidencia cualitativa y cuantitativa</tspan><tspan x="475.0" dy="15.2">trazable</tspan></text><rect x="798.0" y="896.0" width="54" height="20" rx="10" fill="#cee5bc" stroke="#a9ce8c" stroke-width="1"/><text x="825.0" y="910.0" font-size="11" fill="#426e20" font-weight="700" text-anchor="middle">↔ 1</text><rect x="40.0" y="980.1" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#a9ce8c" stroke-width="1.4"/><rect x="40.0" y="988.1" width="5" height="62.2" rx="2" fill="#6bac39"/><text x="56.0" y="1002.1" font-size="13.5" fill="#426e20" font-weight="700" text-anchor="start"><tspan x="56.0">Persona validada</tspan></text><text x="56.0" y="1022.0" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Perfil revisado contra conducta posterior, casos negativos</tspan><tspan x="56.0" dy="15.2">y una fecha de actualización</tspan></text><rect x="379.0" y="988.1" width="54" height="20" rx="10" fill="#cee5bc" stroke="#a9ce8c" stroke-width="1"/><text x="406.0" y="1002.1" font-size="11" fill="#426e20" font-weight="700" text-anchor="middle">↔ 1, 4, 5</text><rect x="459.0" y="980.1" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#a9ce8c" stroke-width="1.4"/><rect x="459.0" y="988.1" width="5" height="62.2" rx="2" fill="#6bac39"/><text x="475.0" y="1002.1" font-size="13.5" fill="#426e20" font-weight="700" text-anchor="start"><tspan x="475.0">Segmentación contextual</tspan></text><text x="475.0" y="1022.0" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Agrupación por circunstancia de decisión, uso o</tspan><tspan x="475.0" dy="15.2">restricción, no sólo por rasgos estables</tspan></text><text x="40" y="1090.3200000000002" font-size="11.5" fill="#6bac39" font-weight="700" letter-spacing="1.4">QUÉ SE MIDE: NUMERADOR SOBRE DENOMINADOR</text><rect x="40.0" y="1104.3" width="261.3" height="137.9" rx="8" fill="#ebf7e2" stroke="#a9ce8c" stroke-width="1.4"/><text x="54.0" y="1126.3" font-size="13" fill="#426e20" font-weight="700" text-anchor="start"><tspan x="54.0">Proporción de atributos con</tspan><tspan x="54.0" dy="17.2">fuente</tspan></text><text x="54.0" y="1172.6" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Atributos con fuente y fecha</tspan><tspan x="54.0" dy="15.2">registradas</tspan></text><line x1="54.0" y1="1209.0" x2="287.3" y2="1209.0" stroke="#6bac39" stroke-width="2"/><text x="54.0" y="1227.0" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="54.0">Atributos totales del perfil</tspan></text><rect x="319.3" y="1104.3" width="261.3" height="137.9" rx="8" fill="#ebf7e2" stroke="#a9ce8c" stroke-width="1.4"/><text x="333.3" y="1126.3" font-size="13" fill="#426e20" font-weight="700" text-anchor="start"><tspan x="333.3">Uso efectivo del perfil</tspan></text><text x="333.3" y="1155.5" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="333.3">Piezas o guiones que citan</tspan><tspan x="333.3" dy="15.2">explícitamente un atributo del</tspan><tspan x="333.3" dy="15.2">perfil</tspan></text><line x1="333.3" y1="1207.0" x2="566.7" y2="1207.0" stroke="#6bac39" stroke-width="2"/><text x="333.3" y="1225.0" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="333.3">Piezas producidas</tspan></text><rect x="598.7" y="1104.3" width="261.3" height="137.9" rx="8" fill="#ebf7e2" stroke="#a9ce8c" stroke-width="1.4"/><text x="612.7" y="1126.3" font-size="13" fill="#426e20" font-weight="700" text-anchor="start"><tspan x="612.7">Antigüedad del perfil</tspan></text><text x="612.7" y="1155.5" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="612.7">Meses desde la última validación con</tspan><tspan x="612.7" dy="15.2">datos nuevos</tspan></text><rect x="40.0" y="1256.2" width="261.3" height="188.8" rx="8" fill="#ebf7e2" stroke="#a9ce8c" stroke-width="1.4"/><text x="54.0" y="1278.2" font-size="13" fill="#426e20" font-weight="700" text-anchor="start"><tspan x="54.0">Proporción de atributos</tspan><tspan x="54.0" dy="17.2">validados</tspan></text><text x="54.0" y="1324.5" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Atributos con dos fuentes</tspan><tspan x="54.0" dy="15.2">convergentes y conducta posterior</tspan><tspan x="54.0" dy="15.2">compatible</tspan></text><line x1="54.0" y1="1376.0" x2="287.3" y2="1376.0" stroke="#6bac39" stroke-width="2"/><text x="54.0" y="1394.0" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="54.0">Atributos accionables de la ficha</tspan></text><text x="54.0" y="1423.2" font-size="10.5" fill="#7b8794" font-weight="400" text-anchor="start"><tspan x="54.0">Ventana: revisión trimestral o cambio de</tspan><tspan x="54.0" dy="13.9">mercado</tspan></text><text x="40" y="1478.9400000000003" font-size="11.5" fill="#6bac39" font-weight="700" letter-spacing="1.4">FRONTERA DE APLICACIÓN</text><rect x="40" y="1488.9" width="820" height="65.0" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.4"/><polygon points="70,1506.4400000000003 52,1535.4400000000003 88,1535.4400000000003" fill="#c2410c"/><text x="70" y="1532.4400000000003" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">!</text><text x="106" y="1512.9" font-size="12.5" fill="#7c2d12" font-weight="400" text-anchor="start"><tspan x="106">Una persona describe un patrón, no a un individuo. Usarla para justificar decisiones sobre un cliente</tspan><tspan x="106" dy="16.5">concreto es un error de nivel de análisis.</tspan></text><text x="40" y="1581.9400000000003" font-size="11.5" fill="#6bac39" font-weight="700" letter-spacing="1.4">ERROR FRECUENTE Y SU CORRECCIÓN</text><rect x="40" y="1591.9" width="380.0" height="77.0" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/><text x="54" y="1613.9" font-size="11" fill="#b91c1c" font-weight="700" text-anchor="start"><tspan x="54">Síntoma</tspan></text><text x="54" y="1631.9" font-size="12.5" fill="#7f1d1d" font-weight="400" text-anchor="start"><tspan x="54">Documentar rasgos irrelevantes para la decisión</tspan><tspan x="54" dy="16.5">comercial</tspan></text><line x1="426.0" y1="1630.4" x2="469.0" y2="1630.4" stroke="#6bac39" stroke-width="2.6" stroke-linecap="round"/><polygon points="474.0,1630.4 465.9,1634.4 465.9,1626.5" fill="#6bac39"/><rect x="480.0" y="1591.9" width="380.0" height="77.0" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.4"/><text x="494.0" y="1613.9" font-size="11" fill="#15803d" font-weight="700" text-anchor="start"><tspan x="494.0">Corrección</tspan></text><text x="494.0" y="1631.9" font-size="12.5" fill="#14532d" font-weight="400" text-anchor="start"><tspan x="494.0">Elimina todo atributo que no cambie mensaje, canal,</tspan><tspan x="494.0" dy="16.5">oferta o proceso.</tspan></text></svg>