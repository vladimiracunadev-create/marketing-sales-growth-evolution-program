<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1372" width="900" height="1372" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif"><title id="t">Modelo mental · Discovery</title><desc id="d">Modelo mental de la clase 08.04: Discovery. Método en 5 pasos; 4 conceptos; 3 señales de medición.</desc><rect x="0" y="0" width="900" height="1372" rx="14" fill="#ffffff"/><rect x="0" y="0" width="900" height="64" rx="14" fill="#6e3520"/><rect x="0" y="40" width="900" height="24" fill="#6e3520"/><text x="40" y="28" font-size="12" fill="#e5c7bc" font-weight="700" letter-spacing="1.6">MODELO MENTAL · CLASE 08.04 · PARTE 08</text><text x="40" y="52" font-size="21" fill="#ffffff" font-weight="700">Discovery</text><text x="40" y="84" font-size="11.5" fill="#ac5739" font-weight="700" letter-spacing="1.4">MÉTODO PASO A PASO</text><ellipse cx="450.0" cy="403.2" rx="330.0" ry="251.2" fill="none" stroke="#ce9e8c" stroke-width="2" stroke-dasharray="3 8" stroke-linecap="round"/><polygon points="653.6,205.3 636.2,201.8 641.4,192.4" fill="#ac5739"/><polygon points="759.5,490.9 761.2,473.3 771.1,477.5" fill="#ac5739"/><polygon points="439.0,654.4 455.9,649.0 455.9,659.8" fill="#ac5739"/><polygon points="131.8,470.7 143.4,484.1 133.5,488.4" fill="#ac5739"/><polygon points="265.7,194.7 253.5,207.6 248.3,198.1" fill="#ac5739"/><circle cx="450.0" cy="403.2" r="100.0" fill="#e5c7bc" stroke="#ce9e8c" stroke-width="1.6"/><text x="450.0" y="405.3" font-size="15" fill="#6e3520" font-weight="700" text-anchor="middle"><tspan x="450.0">Discovery</tspan></text><rect x="361.0" y="114.2" width="178" height="75.5" rx="10" fill="#f7e8e2" stroke="#ce9e8c" stroke-width="1.4"/><text x="373.0" y="136.2" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="373.0">Documentar la</tspan><tspan x="373.0" dy="16.5">situación actual con</tspan><tspan x="373.0" dy="16.5">datos del cliente</tspan></text><circle cx="363.0" cy="116.2" r="14" fill="#6e3520"/><text x="363.0" y="120.8" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><rect x="674.8" y="287.8" width="178" height="75.5" rx="10" fill="#f7e8e2" stroke="#ce9e8c" stroke-width="1.4"/><text x="686.8" y="309.8" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="686.8">Identificar el</tspan><tspan x="686.8" dy="16.5">problema en las</tspan><tspan x="686.8" dy="16.5">palabras del cliente</tspan></text><circle cx="676.8" cy="289.8" r="14" fill="#6e3520"/><text x="676.8" y="294.3" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><rect x="555.0" y="568.7" width="178" height="75.5" rx="10" fill="#f7e8e2" stroke="#ce9e8c" stroke-width="1.4"/><text x="567.0" y="590.7" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="567.0">Explorar implicaciones</tspan><tspan x="567.0" dy="16.5">sin sugerir la</tspan><tspan x="567.0" dy="16.5">solución</tspan></text><circle cx="557.0" cy="570.7" r="14" fill="#6e3520"/><text x="557.0" y="575.2" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><rect x="167.0" y="576.9" width="178" height="59.0" rx="10" fill="#f7e8e2" stroke="#ce9e8c" stroke-width="1.4"/><text x="179.0" y="598.9" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="179.0">Cuantificar el costo</tspan><tspan x="179.0" dy="16.5">de no actuar</tspan></text><circle cx="169.0" cy="578.9" r="14" fill="#6e3520"/><text x="169.0" y="583.4" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">4</text><rect x="47.2" y="279.6" width="178" height="92.0" rx="10" fill="#f7e8e2" stroke="#ce9e8c" stroke-width="1.4"/><text x="59.2" y="301.6" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="59.2">Confirmar el</tspan><tspan x="59.2" dy="16.5">diagnóstico por</tspan><tspan x="59.2" dy="16.5">escrito antes de</tspan><tspan x="59.2" dy="16.5">proponer</tspan></text><circle cx="49.2" cy="281.6" r="14" fill="#6e3520"/><text x="49.2" y="286.1" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">5</text><text x="40" y="742.4" font-size="11.5" fill="#ac5739" font-weight="700" letter-spacing="1.4">CONCEPTOS Y DÓNDE ACTÚAN EN EL MÉTODO</text><rect x="40.0" y="756.4" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#ce9e8c" stroke-width="1.4"/><rect x="40.0" y="764.4" width="5" height="62.2" rx="2" fill="#ac5739"/><text x="56.0" y="778.4" font-size="13.5" fill="#6e3520" font-weight="700" text-anchor="start"><tspan x="56.0">Situación actual</tspan></text><text x="56.0" y="798.2" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Descripción factual del proceso y los recursos que el</tspan><tspan x="56.0" dy="15.2">cliente usa hoy</tspan></text><rect x="379.0" y="764.4" width="54" height="20" rx="10" fill="#e5c7bc" stroke="#ce9e8c" stroke-width="1"/><text x="406.0" y="778.4" font-size="11" fill="#6e3520" font-weight="700" text-anchor="middle">↔ 1, 4</text><rect x="459.0" y="756.4" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#ce9e8c" stroke-width="1.4"/><rect x="459.0" y="764.4" width="5" height="62.2" rx="2" fill="#ac5739"/><text x="475.0" y="778.4" font-size="13.5" fill="#6e3520" font-weight="700" text-anchor="start"><tspan x="475.0">Problema declarado</tspan></text><text x="475.0" y="798.2" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Dificultad que el cliente reconoce explícitamente</tspan></text><rect x="798.0" y="764.4" width="54" height="20" rx="10" fill="#e5c7bc" stroke="#ce9e8c" stroke-width="1"/><text x="825.0" y="778.4" font-size="11" fill="#6e3520" font-weight="700" text-anchor="middle">↔ 2</text><rect x="40.0" y="848.6" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#ce9e8c" stroke-width="1.4"/><rect x="40.0" y="856.6" width="5" height="62.2" rx="2" fill="#ac5739"/><text x="56.0" y="870.6" font-size="13.5" fill="#6e3520" font-weight="700" text-anchor="start"><tspan x="56.0">Implicación</tspan></text><text x="56.0" y="890.4" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Consecuencia del problema en costo, riesgo, tiempo o</tspan><tspan x="56.0" dy="15.2">reputación</tspan></text><rect x="379.0" y="856.6" width="54" height="20" rx="10" fill="#e5c7bc" stroke="#ce9e8c" stroke-width="1"/><text x="406.0" y="870.6" font-size="11" fill="#6e3520" font-weight="700" text-anchor="middle">↔ 3</text><rect x="459.0" y="848.6" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#ce9e8c" stroke-width="1.4"/><rect x="459.0" y="856.6" width="5" height="62.2" rx="2" fill="#ac5739"/><text x="475.0" y="870.6" font-size="13.5" fill="#6e3520" font-weight="700" text-anchor="start"><tspan x="475.0">Costo de no actuar</tspan></text><text x="475.0" y="890.4" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Pérdida cuantificada que el cliente asume si mantiene la</tspan><tspan x="475.0" dy="15.2">situación actual</tspan></text><rect x="798.0" y="856.6" width="54" height="20" rx="10" fill="#e5c7bc" stroke="#ce9e8c" stroke-width="1"/><text x="825.0" y="870.6" font-size="11" fill="#6e3520" font-weight="700" text-anchor="middle">↔ 1, 4</text><text x="40" y="958.76" font-size="11.5" fill="#ac5739" font-weight="700" letter-spacing="1.4">QUÉ SE MIDE: NUMERADOR SOBRE DENOMINADOR</text><rect x="40.0" y="972.8" width="261.3" height="137.9" rx="8" fill="#f7e8e2" stroke="#ce9e8c" stroke-width="1.4"/><text x="54.0" y="994.8" font-size="13" fill="#6e3520" font-weight="700" text-anchor="start"><tspan x="54.0">Costo de no actuar cuantificado</tspan></text><text x="54.0" y="1023.9" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Oportunidades con cifra estimada por</tspan><tspan x="54.0" dy="15.2">el cliente</tspan></text><line x1="54.0" y1="1060.3" x2="287.3" y2="1060.3" stroke="#ac5739" stroke-width="2"/><text x="54.0" y="1078.3" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="54.0">Oportunidades calificadas</tspan></text><rect x="319.3" y="972.8" width="261.3" height="137.9" rx="8" fill="#f7e8e2" stroke="#ce9e8c" stroke-width="1.4"/><text x="333.3" y="994.8" font-size="13" fill="#6e3520" font-weight="700" text-anchor="start"><tspan x="333.3">Preguntas de implicación por</tspan><tspan x="333.3" dy="17.2">reunión</tspan></text><text x="333.3" y="1041.1" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="333.3">Preguntas de consecuencia</tspan><tspan x="333.3" dy="15.2">registradas</tspan></text><line x1="333.3" y1="1077.4" x2="566.7" y2="1077.4" stroke="#ac5739" stroke-width="2"/><text x="333.3" y="1095.4" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="333.3">Preguntas totales, en grabaciones</tspan></text><rect x="598.7" y="972.8" width="261.3" height="137.9" rx="8" fill="#f7e8e2" stroke="#ce9e8c" stroke-width="1.4"/><text x="612.7" y="994.8" font-size="13" fill="#6e3520" font-weight="700" text-anchor="start"><tspan x="612.7">Tasa de cierre con diagnóstico</tspan><tspan x="612.7" dy="17.2">confirmado</tspan></text><text x="612.7" y="1041.1" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="612.7">Negocios ganados con diagnóstico</tspan><tspan x="612.7" dy="15.2">escrito confirmado</tspan></text><line x1="612.7" y1="1077.4" x2="846.0" y2="1077.4" stroke="#ac5739" stroke-width="2"/><text x="612.7" y="1095.4" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="612.7">Negocios con diagnóstico</tspan></text><text x="40" y="1144.62" font-size="11.5" fill="#ac5739" font-weight="700" letter-spacing="1.4">FRONTERA DE APLICACIÓN</text><rect x="40" y="1154.6" width="820" height="65.0" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.4"/><polygon points="70,1172.12 52,1201.12 88,1201.12" fill="#c2410c"/><text x="70" y="1198.12" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">!</text><text x="106" y="1178.6" font-size="12.5" fill="#7c2d12" font-weight="400" text-anchor="start"><tspan x="106">El discovery excesivo agota al cliente. En negocios pequeños, tres preguntas bien elegidas superan a un</tspan><tspan x="106" dy="16.5">cuestionario de veinte.</tspan></text><text x="40" y="1247.62" font-size="11.5" fill="#ac5739" font-weight="700" letter-spacing="1.4">ERROR FRECUENTE Y SU CORRECCIÓN</text><rect x="40" y="1257.6" width="380.0" height="77.0" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/><text x="54" y="1279.6" font-size="11" fill="#b91c1c" font-weight="700" text-anchor="start"><tspan x="54">Síntoma</tspan></text><text x="54" y="1297.6" font-size="12.5" fill="#7f1d1d" font-weight="400" text-anchor="start"><tspan x="54">Proponer solución antes de cuantificar el problema</tspan></text><line x1="426.0" y1="1296.1" x2="469.0" y2="1296.1" stroke="#ac5739" stroke-width="2.6" stroke-linecap="round"/><polygon points="474.0,1296.1 465.9,1300.0 465.9,1292.2" fill="#ac5739"/><rect x="480.0" y="1257.6" width="380.0" height="77.0" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.4"/><text x="494.0" y="1279.6" font-size="11" fill="#15803d" font-weight="700" text-anchor="start"><tspan x="494.0">Corrección</tspan></text><text x="494.0" y="1297.6" font-size="12.5" fill="#14532d" font-weight="400" text-anchor="start"><tspan x="494.0">Exige una cifra estimada por el cliente antes de</tspan><tspan x="494.0" dy="16.5">pasar a la demostración.</tspan></text></svg>