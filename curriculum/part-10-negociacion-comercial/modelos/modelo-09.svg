<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 924" width="900" height="924" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif"><title id="t">Modelo mental · Términos y condiciones</title><desc id="d">Modelo mental de la clase 10.09: Términos y condiciones. Método en 5 pasos; 4 conceptos; 3 señales de medición.</desc><rect x="0" y="0" width="900" height="924" rx="14" fill="#ffffff"/><rect x="0" y="0" width="900" height="64" rx="14" fill="#2d6e20"/><rect x="0" y="40" width="900" height="24" fill="#2d6e20"/><text x="40" y="28" font-size="12" fill="#c3e5bc" font-weight="700" letter-spacing="1.6">MODELO MENTAL · CLASE 10.09 · PARTE 10</text><text x="40" y="52" font-size="21" fill="#ffffff" font-weight="700">Términos y condiciones</text><text x="40" y="84" font-size="11.5" fill="#4cac39" font-weight="700" letter-spacing="1.4">MÉTODO PASO A PASO</text><rect x="40.0" y="100" width="246.7" height="59.0" rx="10" fill="#e6f7e2" stroke="#97ce8c" stroke-width="1.4"/><text x="54.0" y="122" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Valorizar el costo de cada</tspan><tspan x="54.0" dy="16.5">término solicitado</tspan></text><circle cx="42.0" cy="102.0" r="14" fill="#2d6e20"/><text x="42.0" y="106.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><rect x="326.7" y="100" width="246.7" height="59.0" rx="10" fill="#e6f7e2" stroke="#97ce8c" stroke-width="1.4"/><text x="340.7" y="122" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="340.7">Priorizar qué términos son</tspan><tspan x="340.7" dy="16.5">negociables y cuáles no</tspan></text><circle cx="328.7" cy="102.0" r="14" fill="#2d6e20"/><text x="328.7" y="106.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><rect x="613.3" y="100" width="246.7" height="59.0" rx="10" fill="#e6f7e2" stroke="#97ce8c" stroke-width="1.4"/><text x="627.3" y="122" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="627.3">Verificar la coherencia con la</tspan><tspan x="627.3" dy="16.5">capacidad operativa</tspan></text><circle cx="615.3" cy="102.0" r="14" fill="#2d6e20"/><text x="615.3" y="106.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><rect x="613.3" y="197.0" width="246.7" height="59.0" rx="10" fill="#e6f7e2" stroke="#97ce8c" stroke-width="1.4"/><text x="627.3" y="219.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="627.3">Revisar el cumplimiento</tspan><tspan x="627.3" dy="16.5">normativo de las cláusulas</tspan></text><circle cx="615.3" cy="199.0" r="14" fill="#2d6e20"/><text x="615.3" y="203.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">4</text><rect x="326.7" y="197.0" width="246.7" height="59.0" rx="10" fill="#e6f7e2" stroke="#97ce8c" stroke-width="1.4"/><text x="340.7" y="219.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="340.7">Documentar el acuerdo completo y</tspan><tspan x="340.7" dy="16.5">sus anexos</tspan></text><circle cx="328.7" cy="199.0" r="14" fill="#2d6e20"/><text x="328.7" y="203.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">5</text><line x1="289.7" y1="129.5" x2="318.7" y2="129.5" stroke="#4cac39" stroke-width="2.2" stroke-linecap="round"/><polygon points="323.7,129.5 315.6,133.4 315.6,125.6" fill="#4cac39"/><line x1="576.3" y1="129.5" x2="605.3" y2="129.5" stroke="#4cac39" stroke-width="2.2" stroke-linecap="round"/><polygon points="610.3,129.5 602.2,133.4 602.2,125.6" fill="#4cac39"/><line x1="736.7" y1="161.0" x2="736.7" y2="189.0" stroke="#4cac39" stroke-width="2.2" stroke-linecap="round"/><polygon points="736.7,194.0 732.8,185.9 740.6,185.9" fill="#4cac39"/><line x1="610.3" y1="226.5" x2="581.3" y2="226.5" stroke="#4cac39" stroke-width="2.2" stroke-linecap="round"/><polygon points="576.3,226.5 584.4,222.6 584.4,230.4" fill="#4cac39"/><text x="40" y="294.0" font-size="11.5" fill="#4cac39" font-weight="700" letter-spacing="1.4">CONCEPTOS Y DÓNDE ACTÚAN EN EL MÉTODO</text><rect x="40.0" y="308.0" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#97ce8c" stroke-width="1.4"/><rect x="40.0" y="316.0" width="5" height="62.2" rx="2" fill="#4cac39"/><text x="56.0" y="330.0" font-size="13.5" fill="#2d6e20" font-weight="700" text-anchor="start"><tspan x="56.0">Costo financiero del plazo</tspan></text><text x="56.0" y="349.8" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Valor del dinero durante el periodo entre entrega y cobro</tspan></text><rect x="379.0" y="316.0" width="54" height="20" rx="10" fill="#c3e5bc" stroke="#97ce8c" stroke-width="1"/><text x="406.0" y="330.0" font-size="11" fill="#2d6e20" font-weight="700" text-anchor="middle">↔ 1</text><rect x="459.0" y="308.0" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#97ce8c" stroke-width="1.4"/><rect x="459.0" y="316.0" width="5" height="62.2" rx="2" fill="#4cac39"/><text x="475.0" y="330.0" font-size="13.5" fill="#2d6e20" font-weight="700" text-anchor="start"><tspan x="475.0">Nivel de servicio comprometido</tspan></text><text x="475.0" y="349.8" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Estándar de disponibilidad o respuesta con consecuencia</tspan><tspan x="475.0" dy="15.2">definida</tspan></text><rect x="40.0" y="400.2" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#97ce8c" stroke-width="1.4"/><rect x="40.0" y="408.2" width="5" height="62.2" rx="2" fill="#4cac39"/><text x="56.0" y="422.2" font-size="13.5" fill="#2d6e20" font-weight="700" text-anchor="start"><tspan x="56.0">Cláusula de salida</tspan></text><text x="56.0" y="442.0" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Condición que regula la terminación anticipada y sus</tspan><tspan x="56.0" dy="15.2">efectos</tspan></text><rect x="379.0" y="408.2" width="54" height="20" rx="10" fill="#c3e5bc" stroke="#97ce8c" stroke-width="1"/><text x="406.0" y="422.2" font-size="11" fill="#2d6e20" font-weight="700" text-anchor="middle">↔ 4</text><rect x="459.0" y="400.2" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#97ce8c" stroke-width="1.4"/><rect x="459.0" y="408.2" width="5" height="62.2" rx="2" fill="#4cac39"/><text x="475.0" y="422.2" font-size="13.5" fill="#2d6e20" font-weight="700" text-anchor="start"><tspan x="475.0">Propiedad y tratamiento de datos</tspan></text><text x="475.0" y="442.0" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Definición de quién es responsable y qué se puede hacer</tspan><tspan x="475.0" dy="15.2">con la información del cliente</tspan></text><text x="40" y="510.36" font-size="11.5" fill="#4cac39" font-weight="700" letter-spacing="1.4">QUÉ SE MIDE: NUMERADOR SOBRE DENOMINADOR</text><rect x="40.0" y="524.4" width="261.3" height="137.9" rx="8" fill="#e6f7e2" stroke="#97ce8c" stroke-width="1.4"/><text x="54.0" y="546.4" font-size="13" fill="#2d6e20" font-weight="700" text-anchor="start"><tspan x="54.0">Plazo de cobro promedio</tspan></text><text x="54.0" y="575.5" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Días entre facturación y cobro</tspan><tspan x="54.0" dy="15.2">efectivo, ponderado por monto</tspan></text><rect x="319.3" y="524.4" width="261.3" height="137.9" rx="8" fill="#e6f7e2" stroke="#97ce8c" stroke-width="1.4"/><text x="333.3" y="546.4" font-size="13" fill="#2d6e20" font-weight="700" text-anchor="start"><tspan x="333.3">Cumplimiento de niveles de</tspan><tspan x="333.3" dy="17.2">servicio</tspan></text><text x="333.3" y="592.7" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="333.3">Casos dentro del estándar</tspan><tspan x="333.3" dy="15.2">comprometido</tspan></text><line x1="333.3" y1="629.0" x2="566.7" y2="629.0" stroke="#4cac39" stroke-width="2"/><text x="333.3" y="647.0" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="333.3">Casos aplicables</tspan></text><rect x="598.7" y="524.4" width="261.3" height="137.9" rx="8" fill="#e6f7e2" stroke="#97ce8c" stroke-width="1.4"/><text x="612.7" y="546.4" font-size="13" fill="#2d6e20" font-weight="700" text-anchor="start"><tspan x="612.7">Contratos con cláusulas fuera de</tspan><tspan x="612.7" dy="17.2">política</tspan></text><text x="612.7" y="592.7" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="612.7">Contratos con condiciones no</tspan><tspan x="612.7" dy="15.2">estándar</tspan></text><line x1="612.7" y1="629.0" x2="846.0" y2="629.0" stroke="#4cac39" stroke-width="2"/><text x="612.7" y="647.0" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="612.7">Contratos firmados</tspan></text><text x="40" y="696.22" font-size="11.5" fill="#4cac39" font-weight="700" letter-spacing="1.4">FRONTERA DE APLICACIÓN</text><rect x="40" y="706.2" width="820" height="65.0" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.4"/><polygon points="70,723.72 52,752.72 88,752.72" fill="#c2410c"/><text x="70" y="749.72" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">!</text><text x="106" y="730.2" font-size="12.5" fill="#7c2d12" font-weight="400" text-anchor="start"><tspan x="106">Las cláusulas que limitan derechos del consumidor o el tratamiento de datos personales están sujetas a</tspan><tspan x="106" dy="16.5">normas imperativas: no todo lo acordado es exigible.</tspan></text><text x="40" y="799.22" font-size="11.5" fill="#4cac39" font-weight="700" letter-spacing="1.4">ERROR FRECUENTE Y SU CORRECCIÓN</text><rect x="40" y="809.2" width="380.0" height="77.0" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/><text x="54" y="831.2" font-size="11" fill="#b91c1c" font-weight="700" text-anchor="start"><tspan x="54">Síntoma</tspan></text><text x="54" y="849.2" font-size="12.5" fill="#7f1d1d" font-weight="400" text-anchor="start"><tspan x="54">Negociar precio ignorando el costo de los términos</tspan></text><line x1="426.0" y1="847.7" x2="469.0" y2="847.7" stroke="#4cac39" stroke-width="2.6" stroke-linecap="round"/><polygon points="474.0,847.7 465.9,851.6 465.9,843.8" fill="#4cac39"/><rect x="480.0" y="809.2" width="380.0" height="77.0" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.4"/><text x="494.0" y="831.2" font-size="11" fill="#15803d" font-weight="700" text-anchor="start"><tspan x="494.0">Corrección</tspan></text><text x="494.0" y="849.2" font-size="12.5" fill="#14532d" font-weight="400" text-anchor="start"><tspan x="494.0">Valoriza plazos, niveles de servicio y penalidades</tspan><tspan x="494.0" dy="16.5">antes de ceder en precio.</tspan></text></svg>