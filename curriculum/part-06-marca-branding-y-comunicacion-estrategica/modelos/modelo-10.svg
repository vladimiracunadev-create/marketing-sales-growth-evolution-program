<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1655" width="900" height="1655" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif"><title id="t">Modelo mental · Confianza y reputación</title><desc id="d">Modelo mental de la clase 06.10: Confianza y reputación. Método en 5 pasos; 10 conceptos; 4 señales de medición.</desc><rect x="0" y="0" width="900" height="1655" rx="14" fill="#ffffff"/><rect x="0" y="0" width="900" height="64" rx="14" fill="#57206e"/><rect x="0" y="40" width="900" height="24" fill="#57206e"/><text x="40" y="28" font-size="12" fill="#d9bce5" font-weight="700" letter-spacing="1.6">MODELO MENTAL · CLASE 06.10 · PARTE 06</text><text x="40" y="52" font-size="21" fill="#ffffff" font-weight="700">Confianza y reputación</text><text x="40" y="84" font-size="11.5" fill="#8939ac" font-weight="700" letter-spacing="1.4">MÉTODO PASO A PASO</text><path d="M66.0,159.0 V202.5 H158.5" fill="none" stroke="#8939ac" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="160.5,202.5 151.5,197.5 151.5,207.5" fill="#8939ac"/><path d="M188.5,232.0 V275.5 H281.0" fill="none" stroke="#8939ac" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="283.0,275.5 274.0,270.5 274.0,280.5" fill="#8939ac"/><path d="M311.0,305.0 V348.5 H403.5" fill="none" stroke="#8939ac" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="405.5,348.5 396.5,343.5 396.5,353.5" fill="#8939ac"/><path d="M433.5,378.0 V421.5 H526.0" fill="none" stroke="#8939ac" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="528.0,421.5 519.0,416.5 519.0,426.5" fill="#8939ac"/><rect x="40.0" y="100.0" width="330" height="59.0" rx="10" fill="#f1e2f7" stroke="#ba8cce" stroke-width="1.4"/><text x="54.0" y="122.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Monitorear señales públicas y verificar su</tspan><tspan x="54.0" dy="16.5">fuente y estado procesal</tspan></text><circle cx="42.0" cy="102.0" r="14" fill="#57206e"/><text x="42.0" y="106.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><rect x="162.5" y="173.0" width="330" height="59.0" rx="10" fill="#f1e2f7" stroke="#ba8cce" stroke-width="1.4"/><text x="176.5" y="195.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="176.5">Activar un protocolo con dueño, canal, plazo</tspan><tspan x="176.5" dy="16.5">y criterio de término</tspan></text><circle cx="164.5" cy="175.0" r="14" fill="#57206e"/><text x="164.5" y="179.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><rect x="285.0" y="246.0" width="330" height="59.0" rx="10" fill="#f1e2f7" stroke="#ba8cce" stroke-width="1.4"/><text x="299.0" y="268.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="299.0">Comunicar hechos confirmados, incertidumbres</tspan><tspan x="299.0" dy="16.5">y protección inmediata al cliente</tspan></text><circle cx="287.0" cy="248.0" r="14" fill="#57206e"/><text x="287.0" y="252.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><rect x="407.5" y="319.0" width="330" height="59.0" rx="10" fill="#f1e2f7" stroke="#ba8cce" stroke-width="1.4"/><text x="421.5" y="341.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="421.5">Corregir, reparar y documentar causa raíz</tspan><tspan x="421.5" dy="16.5">sin esperar una narrativa perfecta</tspan></text><circle cx="409.5" cy="321.0" r="14" fill="#57206e"/><text x="409.5" y="325.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">4</text><rect x="530.0" y="392.0" width="330" height="59.0" rx="10" fill="#f1e2f7" stroke="#ba8cce" stroke-width="1.4"/><text x="544.0" y="414.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="544.0">Cerrar sólo cuando la medida correctiva y la</tspan><tspan x="544.0" dy="16.5">actualización al cliente tengan evidencia</tspan></text><circle cx="532.0" cy="394.0" r="14" fill="#57206e"/><text x="532.0" y="398.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">5</text><text x="40" y="493.0" font-size="11.5" fill="#8939ac" font-weight="700" letter-spacing="1.4">CONCEPTOS Y DÓNDE ACTÚAN EN EL MÉTODO</text><rect x="40.0" y="507.0" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#ba8cce" stroke-width="1.4"/><rect x="40.0" y="515.0" width="5" height="62.2" rx="2" fill="#8939ac"/><text x="56.0" y="529.0" font-size="13.5" fill="#57206e" font-weight="700" text-anchor="start"><tspan x="56.0">Reputación</tspan></text><text x="56.0" y="548.8" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Juicio acumulado del mercado basado en el comportamiento</tspan><tspan x="56.0" dy="15.2">observado en el tiempo</tspan></text><rect x="459.0" y="507.0" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#ba8cce" stroke-width="1.4"/><rect x="459.0" y="515.0" width="5" height="62.2" rx="2" fill="#8939ac"/><text x="475.0" y="529.0" font-size="13.5" fill="#57206e" font-weight="700" text-anchor="start"><tspan x="475.0">Manejo de errores</tspan></text><text x="475.0" y="548.8" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Protocolo de reconocimiento, reparación y prevención ante</tspan><tspan x="475.0" dy="15.2">una falla propia</tspan></text><rect x="40.0" y="599.2" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#ba8cce" stroke-width="1.4"/><rect x="40.0" y="607.2" width="5" height="62.2" rx="2" fill="#8939ac"/><text x="56.0" y="621.2" font-size="13.5" fill="#57206e" font-weight="700" text-anchor="start"><tspan x="56.0">Coherencia observable</tspan></text><text x="56.0" y="641.0" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Correspondencia entre lo declarado y lo que el cliente</tspan><tspan x="56.0" dy="15.2">experimenta</tspan></text><rect x="379.0" y="607.2" width="54" height="20" rx="10" fill="#d9bce5" stroke="#ba8cce" stroke-width="1"/><text x="406.0" y="621.2" font-size="11" fill="#57206e" font-weight="700" text-anchor="middle">↔ 5</text><rect x="459.0" y="599.2" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#ba8cce" stroke-width="1.4"/><rect x="459.0" y="607.2" width="5" height="62.2" rx="2" fill="#8939ac"/><text x="475.0" y="621.2" font-size="13.5" fill="#57206e" font-weight="700" text-anchor="start"><tspan x="475.0">Costo de recuperación</tspan></text><text x="475.0" y="641.0" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Esfuerzo necesario para restablecer la confianza después</tspan><tspan x="475.0" dy="15.2">de un incidente</tspan></text><rect x="40.0" y="691.4" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#ba8cce" stroke-width="1.4"/><rect x="40.0" y="699.4" width="5" height="62.2" rx="2" fill="#8939ac"/><text x="56.0" y="713.4" font-size="13.5" fill="#57206e" font-weight="700" text-anchor="start"><tspan x="56.0">Estado procesal</tspan></text><text x="56.0" y="733.2" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Etiqueta que distingue denuncia o alegación, hecho</tspan><tspan x="56.0" dy="15.2">acreditado, condena y recurso pendiente o resuelto</tspan></text><rect x="379.0" y="699.4" width="54" height="20" rx="10" fill="#d9bce5" stroke="#ba8cce" stroke-width="1"/><text x="406.0" y="713.4" font-size="11" fill="#57206e" font-weight="700" text-anchor="middle">↔ 1</text><rect x="459.0" y="691.4" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#ba8cce" stroke-width="1.4"/><rect x="459.0" y="699.4" width="5" height="62.2" rx="2" fill="#8939ac"/><text x="475.0" y="713.4" font-size="13.5" fill="#57206e" font-weight="700" text-anchor="start"><tspan x="475.0">Capital reputacional</tspan></text><text x="475.0" y="733.2" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Confianza acumulada de los públicos clave que reduce el</tspan><tspan x="475.0" dy="15.2">costo de ser creídos y absorbe parte del daño de un error</tspan></text><rect x="40.0" y="783.5" width="401.0" height="93.4" rx="8" fill="#ffffff" stroke="#ba8cce" stroke-width="1.4"/><rect x="40.0" y="791.5" width="5" height="77.4" rx="2" fill="#8939ac"/><text x="56.0" y="805.5" font-size="13.5" fill="#57206e" font-weight="700" text-anchor="start"><tspan x="56.0">Control de daños</tspan></text><text x="56.0" y="825.4" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Conjunto de acciones para limitar el perjuicio a las</tspan><tspan x="56.0" dy="15.2">personas afectadas y a la organización mientras se</tspan><tspan x="56.0" dy="15.2">establecen los hechos</tspan></text><rect x="459.0" y="783.5" width="401.0" height="93.4" rx="8" fill="#ffffff" stroke="#ba8cce" stroke-width="1.4"/><rect x="459.0" y="791.5" width="5" height="77.4" rx="2" fill="#8939ac"/><text x="475.0" y="805.5" font-size="13.5" fill="#57206e" font-weight="700" text-anchor="start"><tspan x="475.0">Encubrimiento</tspan></text><text x="475.0" y="825.4" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Ocultar, retrasar sin justificación o deformar hechos</tspan><tspan x="475.0" dy="15.2">relevantes para evitar consecuencias; es lo opuesto al</tspan><tspan x="475.0" dy="15.2">control de daños legítimo</tspan></text><rect x="40.0" y="890.9" width="401.0" height="93.4" rx="8" fill="#ffffff" stroke="#ba8cce" stroke-width="1.4"/><rect x="40.0" y="898.9" width="5" height="77.4" rx="2" fill="#8939ac"/><text x="56.0" y="912.9" font-size="13.5" fill="#57206e" font-weight="700" text-anchor="start"><tspan x="56.0">Reparación verificable</tspan></text><text x="56.0" y="932.7" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Medida correctiva con responsable, plazo y evidencia que</tspan><tspan x="56.0" dy="15.2">un tercero puede comprobar</tspan></text><rect x="379.0" y="898.9" width="54" height="20" rx="10" fill="#d9bce5" stroke="#ba8cce" stroke-width="1"/><text x="406.0" y="912.9" font-size="11" fill="#57206e" font-weight="700" text-anchor="middle">↔ 1, 4, 5</text><rect x="459.0" y="890.9" width="401.0" height="93.4" rx="8" fill="#ffffff" stroke="#ba8cce" stroke-width="1.4"/><rect x="459.0" y="898.9" width="5" height="77.4" rx="2" fill="#8939ac"/><text x="475.0" y="912.9" font-size="13.5" fill="#57206e" font-weight="700" text-anchor="start"><tspan x="475.0">Crisis</tspan></text><text x="475.0" y="932.7" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Evento que amenaza expectativas de los públicos, exige</tspan><tspan x="475.0" dy="15.2">decisiones en plazos cortos y puede afectar la continuidad</tspan><tspan x="475.0" dy="15.2">o la legitimidad de la organización</tspan></text><text x="40" y="1016.2600000000002" font-size="11.5" fill="#8939ac" font-weight="700" letter-spacing="1.4">QUÉ SE MIDE: NUMERADOR SOBRE DENOMINADOR</text><rect x="40.0" y="1030.3" width="261.3" height="142.6" rx="8" fill="#f1e2f7" stroke="#ba8cce" stroke-width="1.4"/><text x="54.0" y="1052.3" font-size="13" fill="#57206e" font-weight="700" text-anchor="start"><tspan x="54.0">Respuesta material oportuna</tspan></text><text x="54.0" y="1081.4" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Incidentes con aviso dentro del</tspan><tspan x="54.0" dy="15.2">plazo</tspan></text><line x1="54.0" y1="1117.8" x2="287.3" y2="1117.8" stroke="#8939ac" stroke-width="2"/><text x="54.0" y="1135.8" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="54.0">Incidentes materiales</tspan></text><text x="54.0" y="1165.0" font-size="10.5" fill="#7b8794" font-weight="400" text-anchor="start"><tspan x="54.0">Ventana: trimestre</tspan></text><rect x="319.3" y="1030.3" width="261.3" height="142.6" rx="8" fill="#f1e2f7" stroke="#ba8cce" stroke-width="1.4"/><text x="333.3" y="1052.3" font-size="13" fill="#57206e" font-weight="700" text-anchor="start"><tspan x="333.3">Resolución en primera instancia</tspan></text><text x="333.3" y="1081.4" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="333.3">Reclamos cerrados sin escalamiento</tspan></text><line x1="333.3" y1="1102.6" x2="566.7" y2="1102.6" stroke="#8939ac" stroke-width="2"/><text x="333.3" y="1120.6" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="333.3">Reclamos recibidos</tspan></text><text x="333.3" y="1149.8" font-size="10.5" fill="#7b8794" font-weight="400" text-anchor="start"><tspan x="333.3">Ventana: mes móvil</tspan></text><rect x="598.7" y="1030.3" width="261.3" height="142.6" rx="8" fill="#f1e2f7" stroke="#ba8cce" stroke-width="1.4"/><text x="612.7" y="1052.3" font-size="13" fill="#57206e" font-weight="700" text-anchor="start"><tspan x="612.7">Actualizaciones cumplidas</tspan></text><text x="612.7" y="1081.4" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="612.7">Actualizaciones emitidas en la fecha</tspan><tspan x="612.7" dy="15.2">prometida</tspan></text><line x1="612.7" y1="1117.8" x2="846.0" y2="1117.8" stroke="#8939ac" stroke-width="2"/><text x="612.7" y="1135.8" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="612.7">Actualizaciones comprometidas</tspan></text><text x="612.7" y="1165.0" font-size="10.5" fill="#7b8794" font-weight="400" text-anchor="start"><tspan x="612.7">Ventana: por incidente</tspan></text><rect x="40.0" y="1186.8" width="261.3" height="190.1" rx="8" fill="#f1e2f7" stroke="#ba8cce" stroke-width="1.4"/><text x="54.0" y="1208.8" font-size="13" fill="#57206e" font-weight="700" text-anchor="start"><tspan x="54.0">Tiempo hasta primera</tspan><tspan x="54.0" dy="17.2">comunicación confirmada</tspan></text><text x="54.0" y="1255.1" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Minutos entre la detección</tspan><tspan x="54.0" dy="15.2">verificada y la primera comunicación</tspan><tspan x="54.0" dy="15.2">a afectados</tspan></text><line x1="54.0" y1="1306.7" x2="287.3" y2="1306.7" stroke="#8939ac" stroke-width="2"/><text x="54.0" y="1324.7" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="54.0">Incidentes con afectados</tspan><tspan x="54.0" dy="15.2">identificables</tspan></text><text x="54.0" y="1369.0" font-size="10.5" fill="#7b8794" font-weight="400" text-anchor="start"><tspan x="54.0">Ventana: por incidente y trimestre</tspan></text><text x="40" y="1410.9" font-size="11.5" fill="#8939ac" font-weight="700" letter-spacing="1.4">FRONTERA DE APLICACIÓN</text><rect x="40" y="1420.9" width="820" height="65.0" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.4"/><polygon points="70,1438.4 52,1467.4 88,1467.4" fill="#c2410c"/><text x="70" y="1464.4" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">!</text><text x="106" y="1444.9" font-size="12.5" fill="#7c2d12" font-weight="400" text-anchor="start"><tspan x="106">La comunicación no sustituye la reparación. Un protocolo impecable sobre un problema no resuelto acelera</tspan><tspan x="106" dy="16.5">la pérdida de confianza.</tspan></text><text x="40" y="1513.9" font-size="11.5" fill="#8939ac" font-weight="700" letter-spacing="1.4">ERROR FRECUENTE Y SU CORRECCIÓN</text><rect x="40" y="1523.9" width="380.0" height="93.5" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/><text x="54" y="1545.9" font-size="11" fill="#b91c1c" font-weight="700" text-anchor="start"><tspan x="54">Síntoma</tspan></text><text x="54" y="1563.9" font-size="12.5" fill="#7f1d1d" font-weight="400" text-anchor="start"><tspan x="54">Comunicar antes de reparar</tspan></text><line x1="426.0" y1="1570.7" x2="469.0" y2="1570.7" stroke="#8939ac" stroke-width="2.6" stroke-linecap="round"/><polygon points="474.0,1570.7 465.9,1574.6 465.9,1566.7" fill="#8939ac"/><rect x="480.0" y="1523.9" width="380.0" height="93.5" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.4"/><text x="494.0" y="1545.9" font-size="11" fill="#15803d" font-weight="700" text-anchor="start"><tspan x="494.0">Corrección</tspan></text><text x="494.0" y="1563.9" font-size="12.5" fill="#14532d" font-weight="400" text-anchor="start"><tspan x="494.0">Define el protocolo: contención, reparación,</tspan><tspan x="494.0" dy="16.5">comunicación y prevención documentada, en ese</tspan><tspan x="494.0" dy="16.5">orden.</tspan></text></svg>