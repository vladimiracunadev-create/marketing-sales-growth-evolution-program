<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 981" width="900" height="981" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif"><title id="t">Modelo mental · Selección de mercado y problema</title><desc id="d">Modelo mental de la clase 24.02: Selección de mercado y problema. Método en 5 pasos; 4 conceptos; 3 señales de medición.</desc><rect x="0" y="0" width="900" height="981" rx="14" fill="#ffffff"/><rect x="0" y="0" width="900" height="64" rx="14" fill="#6e5e20"/><rect x="0" y="40" width="900" height="24" fill="#6e5e20"/><text x="40" y="28" font-size="12" fill="#e5ddbc" font-weight="700" letter-spacing="1.6">MODELO MENTAL · CLASE 24.02 · PARTE 24</text><text x="40" y="52" font-size="21" fill="#ffffff" font-weight="700">Selección de mercado y problema</text><text x="40" y="84" font-size="11.5" fill="#ac9539" font-weight="700" letter-spacing="1.4">MÉTODO PASO A PASO</text><line x1="450.0" y1="94.0" x2="450.0" y2="317.0" stroke="#cec08c" stroke-width="3" stroke-linecap="round"/><line x1="450.0" y1="121.2" x2="406.0" y2="121.2" stroke="#cec08c" stroke-width="2"/><rect x="56.0" y="100" width="350" height="42.5" rx="10" fill="#f7f3e2" stroke="#cec08c" stroke-width="1.4"/><text x="70.0" y="122" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="70.0">Documentar el problema con evidencia primaria</tspan></text><circle cx="450.0" cy="121.2" r="15" fill="#6e5e20"/><text x="450.0" y="125.8" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><line x1="450.0" y1="159.2" x2="494.0" y2="159.2" stroke="#cec08c" stroke-width="2"/><rect x="494.0" y="138" width="350" height="42.5" rx="10" fill="#f7f3e2" stroke="#cec08c" stroke-width="1.4"/><text x="508.0" y="160" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="508.0">Verificar la accesibilidad del cliente objetivo</tspan></text><circle cx="450.0" cy="159.2" r="15" fill="#6e5e20"/><text x="450.0" y="163.8" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><line x1="450.0" y1="205.5" x2="406.0" y2="205.5" stroke="#cec08c" stroke-width="2"/><rect x="56.0" y="176" width="350" height="59.0" rx="10" fill="#f7f3e2" stroke="#cec08c" stroke-width="1.4"/><text x="70.0" y="198" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="70.0">Evaluar la capacidad de servir con recursos</tspan><tspan x="70.0" dy="16.5">reales</tspan></text><circle cx="450.0" cy="205.5" r="15" fill="#6e5e20"/><text x="450.0" y="210.0" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><line x1="450.0" y1="235.2" x2="494.0" y2="235.2" stroke="#cec08c" stroke-width="2"/><rect x="494.0" y="214" width="350" height="42.5" rx="10" fill="#f7f3e2" stroke="#cec08c" stroke-width="1.4"/><text x="508.0" y="236" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="508.0">Definir el mecanismo de captura de valor</tspan></text><circle cx="450.0" cy="235.2" r="15" fill="#6e5e20"/><text x="450.0" y="239.8" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">4</text><line x1="450.0" y1="281.5" x2="406.0" y2="281.5" stroke="#cec08c" stroke-width="2"/><rect x="56.0" y="252" width="350" height="59.0" rx="10" fill="#f7f3e2" stroke="#cec08c" stroke-width="1.4"/><text x="70.0" y="274" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="70.0">Declarar los supuestos críticos y su plan de</tspan><tspan x="70.0" dy="16.5">validación</tspan></text><circle cx="450.0" cy="281.5" r="15" fill="#6e5e20"/><text x="450.0" y="286.0" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">5</text><text x="40" y="353.0" font-size="11.5" fill="#ac9539" font-weight="700" letter-spacing="1.4">CONCEPTOS Y DÓNDE ACTÚAN EN EL MÉTODO</text><rect x="40.0" y="367.0" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#cec08c" stroke-width="1.4"/><rect x="40.0" y="375.0" width="5" height="62.2" rx="2" fill="#ac9539"/><text x="56.0" y="389.0" font-size="13.5" fill="#6e5e20" font-weight="700" text-anchor="start"><tspan x="56.0">Problema verificado</tspan></text><text x="56.0" y="408.8" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Dificultad documentada con frecuencia, costo y</tspan><tspan x="56.0" dy="15.2">consecuencia</tspan></text><rect x="379.0" y="375.0" width="54" height="20" rx="10" fill="#e5ddbc" stroke="#cec08c" stroke-width="1"/><text x="406.0" y="389.0" font-size="11" fill="#6e5e20" font-weight="700" text-anchor="middle">↔ 1, 2</text><rect x="459.0" y="367.0" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#cec08c" stroke-width="1.4"/><rect x="459.0" y="375.0" width="5" height="62.2" rx="2" fill="#ac9539"/><text x="475.0" y="389.0" font-size="13.5" fill="#6e5e20" font-weight="700" text-anchor="start"><tspan x="475.0">Accesibilidad del cliente</tspan></text><text x="475.0" y="408.8" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Existencia de un camino viable para alcanzarlo</tspan></text><rect x="798.0" y="375.0" width="54" height="20" rx="10" fill="#e5ddbc" stroke="#cec08c" stroke-width="1"/><text x="825.0" y="389.0" font-size="11" fill="#6e5e20" font-weight="700" text-anchor="middle">↔ 2</text><rect x="40.0" y="459.2" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#cec08c" stroke-width="1.4"/><rect x="40.0" y="467.2" width="5" height="62.2" rx="2" fill="#ac9539"/><text x="56.0" y="481.2" font-size="13.5" fill="#6e5e20" font-weight="700" text-anchor="start"><tspan x="56.0">Capacidad de servir</tspan></text><text x="56.0" y="501.0" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Aptitud real de entregar el resultado prometido</tspan></text><rect x="379.0" y="467.2" width="54" height="20" rx="10" fill="#e5ddbc" stroke="#cec08c" stroke-width="1"/><text x="406.0" y="481.2" font-size="11" fill="#6e5e20" font-weight="700" text-anchor="middle">↔ 3</text><rect x="459.0" y="459.2" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#cec08c" stroke-width="1.4"/><rect x="459.0" y="467.2" width="5" height="62.2" rx="2" fill="#ac9539"/><text x="475.0" y="481.2" font-size="13.5" fill="#6e5e20" font-weight="700" text-anchor="start"><tspan x="475.0">Mecanismo de captura</tspan></text><text x="475.0" y="501.0" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Forma en que la empresa convierte el valor entregado en</tspan><tspan x="475.0" dy="15.2">ingreso</tspan></text><rect x="798.0" y="467.2" width="54" height="20" rx="10" fill="#e5ddbc" stroke="#cec08c" stroke-width="1"/><text x="825.0" y="481.2" font-size="11" fill="#6e5e20" font-weight="700" text-anchor="middle">↔ 4</text><text x="40" y="569.36" font-size="11.5" fill="#ac9539" font-weight="700" letter-spacing="1.4">QUÉ SE MIDE: NUMERADOR SOBRE DENOMINADOR</text><rect x="40.0" y="583.4" width="261.3" height="135.9" rx="8" fill="#f7f3e2" stroke="#cec08c" stroke-width="1.4"/><text x="54.0" y="605.4" font-size="13" fill="#6e5e20" font-weight="700" text-anchor="start"><tspan x="54.0">Evidencia del problema</tspan></text><text x="54.0" y="634.5" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Observaciones del problema con</tspan><tspan x="54.0" dy="15.2">fuente y fecha registradas</tspan></text><line x1="54.0" y1="670.9" x2="287.3" y2="670.9" stroke="#ac9539" stroke-width="2"/><text x="54.0" y="688.9" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="54.0">Observaciones totales recogidas</tspan></text><rect x="319.3" y="583.4" width="261.3" height="135.9" rx="8" fill="#f7f3e2" stroke="#cec08c" stroke-width="1.4"/><text x="333.3" y="605.4" font-size="13" fill="#6e5e20" font-weight="700" text-anchor="start"><tspan x="333.3">Accesibilidad verificada</tspan></text><text x="333.3" y="634.5" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="333.3">Canales con costo de alcance</tspan><tspan x="333.3" dy="15.2">estimado</tspan></text><line x1="333.3" y1="670.9" x2="566.7" y2="670.9" stroke="#ac9539" stroke-width="2"/><text x="333.3" y="688.9" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="333.3">Canales identificados para el</tspan><tspan x="333.3" dy="15.2">segmento</tspan></text><rect x="598.7" y="583.4" width="261.3" height="135.9" rx="8" fill="#f7f3e2" stroke="#cec08c" stroke-width="1.4"/><text x="612.7" y="605.4" font-size="13" fill="#6e5e20" font-weight="700" text-anchor="start"><tspan x="612.7">Supuestos críticos declarados</tspan></text><text x="612.7" y="634.5" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="612.7">Supuestos identificados con plan de</tspan><tspan x="612.7" dy="15.2">validación</tspan></text><line x1="612.7" y1="670.9" x2="846.0" y2="670.9" stroke="#ac9539" stroke-width="2"/><text x="612.7" y="688.9" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="612.7">Supuestos del proyecto</tspan></text><text x="40" y="753.24" font-size="11.5" fill="#ac9539" font-weight="700" letter-spacing="1.4">FRONTERA DE APLICACIÓN</text><rect x="40" y="763.2" width="820" height="65.0" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.4"/><polygon points="70,780.74 52,809.74 88,809.74" fill="#c2410c"/><text x="70" y="806.74" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">!</text><text x="106" y="787.2" font-size="12.5" fill="#7c2d12" font-weight="400" text-anchor="start"><tspan x="106">La verificación completa del problema puede exceder el tiempo del Capstone. Lo exigible es evidencia</tspan><tspan x="106" dy="16.5">suficiente y declaración honesta de lo que falta.</tspan></text><text x="40" y="856.24" font-size="11.5" fill="#ac9539" font-weight="700" letter-spacing="1.4">ERROR FRECUENTE Y SU CORRECCIÓN</text><rect x="40" y="866.2" width="380.0" height="77.0" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/><text x="54" y="888.2" font-size="11" fill="#b91c1c" font-weight="700" text-anchor="start"><tspan x="54">Síntoma</tspan></text><text x="54" y="906.2" font-size="12.5" fill="#7f1d1d" font-weight="400" text-anchor="start"><tspan x="54">Elegir el mercado por interés personal sin</tspan><tspan x="54" dy="16.5">verificar accesibilidad</tspan></text><line x1="426.0" y1="904.7" x2="469.0" y2="904.7" stroke="#ac9539" stroke-width="2.6" stroke-linecap="round"/><polygon points="474.0,904.7 465.9,908.7 465.9,900.8" fill="#ac9539"/><rect x="480.0" y="866.2" width="380.0" height="77.0" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.4"/><text x="494.0" y="888.2" font-size="11" fill="#15803d" font-weight="700" text-anchor="start"><tspan x="494.0">Corrección</tspan></text><text x="494.0" y="906.2" font-size="12.5" fill="#14532d" font-weight="400" text-anchor="start"><tspan x="494.0">Estima el costo de alcanzar al cliente antes de</tspan><tspan x="494.0" dy="16.5">comprometer la elección.</tspan></text></svg>