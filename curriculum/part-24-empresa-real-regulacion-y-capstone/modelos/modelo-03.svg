<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1302" width="900" height="1302" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif"><title id="t">Modelo mental · Investigación con evidencia</title><desc id="d">Modelo mental de la clase 24.03: Investigación con evidencia. Método en 5 pasos; 4 conceptos; 3 señales de medición.</desc><rect x="0" y="0" width="900" height="1302" rx="14" fill="#ffffff"/><rect x="0" y="0" width="900" height="64" rx="14" fill="#6e5e20"/><rect x="0" y="40" width="900" height="24" fill="#6e5e20"/><text x="40" y="28" font-size="12" fill="#e5ddbc" font-weight="700" letter-spacing="1.6">MODELO MENTAL · CLASE 24.03 · PARTE 24</text><text x="40" y="52" font-size="21" fill="#ffffff" font-weight="700">Investigación con evidencia</text><text x="40" y="84" font-size="11.5" fill="#ac9539" font-weight="700" letter-spacing="1.4">MÉTODO PASO A PASO</text><ellipse cx="450.0" cy="376.8" rx="330.0" ry="233.1" fill="none" stroke="#cec08c" stroke-width="2" stroke-dasharray="3 8" stroke-linecap="round"/><polygon points="653.8,193.3 636.3,190.4 641.2,180.8" fill="#ac9539"/><polygon points="759.3,458.8 761.4,441.2 771.2,445.7" fill="#ac9539"/><polygon points="439.0,609.9 455.9,604.4 455.9,615.3" fill="#ac9539"/><polygon points="131.6,438.8 143.5,451.9 133.7,456.4" fill="#ac9539"/><polygon points="265.8,183.2 253.2,195.8 248.3,186.1" fill="#ac9539"/><circle cx="450.0" cy="376.8" r="100.0" fill="#e5ddbc" stroke="#cec08c" stroke-width="1.6"/><text x="450.0" y="369.0" font-size="15" fill="#6e5e20" font-weight="700" text-anchor="middle"><tspan x="450.0">Investigación con</tspan><tspan x="450.0" dy="19.8">evidencia</tspan></text><rect x="361.0" y="106.0" width="178" height="75.5" rx="10" fill="#f7f3e2" stroke="#cec08c" stroke-width="1.4"/><text x="373.0" y="128.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="373.0">Formular las preguntas</tspan><tspan x="373.0" dy="16.5">desde las decisiones</tspan><tspan x="373.0" dy="16.5">pendientes</tspan></text><circle cx="363.0" cy="108.0" r="14" fill="#6e5e20"/><text x="363.0" y="112.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><rect x="674.8" y="267.0" width="178" height="75.5" rx="10" fill="#f7f3e2" stroke="#cec08c" stroke-width="1.4"/><text x="686.8" y="289.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="686.8">Elegir el método</tspan><tspan x="686.8" dy="16.5">proporcional al tiempo</tspan><tspan x="686.8" dy="16.5">disponible</tspan></text><circle cx="676.8" cy="269.0" r="14" fill="#6e5e20"/><text x="676.8" y="273.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><rect x="555.0" y="535.8" width="178" height="59.0" rx="10" fill="#f7f3e2" stroke="#cec08c" stroke-width="1.4"/><text x="567.0" y="557.8" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="567.0">Ejecutar y documentar</tspan><tspan x="567.0" dy="16.5">el procedimiento</tspan></text><circle cx="557.0" cy="537.8" r="14" fill="#6e5e20"/><text x="557.0" y="542.3" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><rect x="167.0" y="535.8" width="178" height="59.0" rx="10" fill="#f7f3e2" stroke="#cec08c" stroke-width="1.4"/><text x="179.0" y="557.8" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="179.0">Declarar sesgos y</tspan><tspan x="179.0" dy="16.5">límites</tspan></text><circle cx="169.0" cy="537.8" r="14" fill="#6e5e20"/><text x="169.0" y="542.3" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">4</text><rect x="47.2" y="267.0" width="178" height="75.5" rx="10" fill="#f7f3e2" stroke="#cec08c" stroke-width="1.4"/><text x="59.2" y="289.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="59.2">Conectar cada hallazgo</tspan><tspan x="59.2" dy="16.5">con la decisión que</tspan><tspan x="59.2" dy="16.5">informa</tspan></text><circle cx="49.2" cy="269.0" r="14" fill="#6e5e20"/><text x="49.2" y="273.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">5</text><text x="40" y="689.6" font-size="11.5" fill="#ac9539" font-weight="700" letter-spacing="1.4">CONCEPTOS Y DÓNDE ACTÚAN EN EL MÉTODO</text><rect x="40.0" y="703.6" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#cec08c" stroke-width="1.4"/><rect x="40.0" y="711.6" width="5" height="62.2" rx="2" fill="#ac9539"/><text x="56.0" y="725.6" font-size="13.5" fill="#6e5e20" font-weight="700" text-anchor="start"><tspan x="56.0">Pregunta de investigación</tspan></text><text x="56.0" y="745.4" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Formulación que puede responderse con evidencia y que</tspan><tspan x="56.0" dy="15.2">informa una decisión</tspan></text><rect x="379.0" y="711.6" width="54" height="20" rx="10" fill="#e5ddbc" stroke="#cec08c" stroke-width="1"/><text x="406.0" y="725.6" font-size="11" fill="#6e5e20" font-weight="700" text-anchor="middle">↔ 1, 5</text><rect x="459.0" y="703.6" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#cec08c" stroke-width="1.4"/><rect x="459.0" y="711.6" width="5" height="62.2" rx="2" fill="#ac9539"/><text x="475.0" y="725.6" font-size="13.5" fill="#6e5e20" font-weight="700" text-anchor="start"><tspan x="475.0">Declaración de método</tspan></text><text x="475.0" y="745.4" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Descripción de fuentes, muestra, procedimiento y límites</tspan></text><rect x="798.0" y="711.6" width="54" height="20" rx="10" fill="#e5ddbc" stroke="#cec08c" stroke-width="1"/><text x="825.0" y="725.6" font-size="11" fill="#6e5e20" font-weight="700" text-anchor="middle">↔ 2, 4</text><rect x="40.0" y="795.8" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#cec08c" stroke-width="1.4"/><rect x="40.0" y="803.8" width="5" height="62.2" rx="2" fill="#ac9539"/><text x="56.0" y="817.8" font-size="13.5" fill="#6e5e20" font-weight="700" text-anchor="start"><tspan x="56.0">Sesgo declarado</tspan></text><text x="56.0" y="837.6" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Limitación reconocida que afecta la interpretación de los</tspan><tspan x="56.0" dy="15.2">hallazgos</tspan></text><rect x="379.0" y="803.8" width="54" height="20" rx="10" fill="#e5ddbc" stroke="#cec08c" stroke-width="1"/><text x="406.0" y="817.8" font-size="11" fill="#6e5e20" font-weight="700" text-anchor="middle">↔ 4</text><rect x="459.0" y="795.8" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#cec08c" stroke-width="1.4"/><rect x="459.0" y="803.8" width="5" height="62.2" rx="2" fill="#ac9539"/><text x="475.0" y="817.8" font-size="13.5" fill="#6e5e20" font-weight="700" text-anchor="start"><tspan x="475.0">Decisión informada</tspan></text><text x="475.0" y="837.6" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Elección concreta que cambió a partir de la evidencia</tspan></text><rect x="798.0" y="803.8" width="54" height="20" rx="10" fill="#e5ddbc" stroke="#cec08c" stroke-width="1"/><text x="825.0" y="817.8" font-size="11" fill="#6e5e20" font-weight="700" text-anchor="middle">↔ 1, 5</text><text x="40" y="905.96" font-size="11.5" fill="#ac9539" font-weight="700" letter-spacing="1.4">QUÉ SE MIDE: NUMERADOR SOBRE DENOMINADOR</text><rect x="40.0" y="920.0" width="261.3" height="120.7" rx="8" fill="#f7f3e2" stroke="#cec08c" stroke-width="1.4"/><text x="54.0" y="942.0" font-size="13" fill="#6e5e20" font-weight="700" text-anchor="start"><tspan x="54.0">Hallazgos con decisión asociada</tspan></text><text x="54.0" y="971.1" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Hallazgos que modificaron una</tspan><tspan x="54.0" dy="15.2">decisión</tspan></text><line x1="54.0" y1="1007.5" x2="287.3" y2="1007.5" stroke="#ac9539" stroke-width="2"/><text x="54.0" y="1025.5" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="54.0">Hallazgos presentados</tspan></text><rect x="319.3" y="920.0" width="261.3" height="120.7" rx="8" fill="#f7f3e2" stroke="#cec08c" stroke-width="1.4"/><text x="333.3" y="942.0" font-size="13" fill="#6e5e20" font-weight="700" text-anchor="start"><tspan x="333.3">Trazabilidad del método</tspan></text><text x="333.3" y="971.1" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="333.3">Afirmaciones con procedimiento</tspan><tspan x="333.3" dy="15.2">documentado</tspan></text><line x1="333.3" y1="1007.5" x2="566.7" y2="1007.5" stroke="#ac9539" stroke-width="2"/><text x="333.3" y="1025.5" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="333.3">Afirmaciones del informe</tspan></text><rect x="598.7" y="920.0" width="261.3" height="120.7" rx="8" fill="#f7f3e2" stroke="#cec08c" stroke-width="1.4"/><text x="612.7" y="942.0" font-size="13" fill="#6e5e20" font-weight="700" text-anchor="start"><tspan x="612.7">Sesgos declarados</tspan></text><text x="612.7" y="971.1" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="612.7">Limitaciones explicitadas</tspan></text><line x1="612.7" y1="992.3" x2="846.0" y2="992.3" stroke="#ac9539" stroke-width="2"/><text x="612.7" y="1010.3" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="612.7">Limitaciones identificables</tspan></text><text x="40" y="1074.66" font-size="11.5" fill="#ac9539" font-weight="700" letter-spacing="1.4">FRONTERA DE APLICACIÓN</text><rect x="40" y="1084.7" width="820" height="65.0" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.4"/><polygon points="70,1102.16 52,1131.16 88,1131.16" fill="#c2410c"/><text x="70" y="1128.16" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">!</text><text x="106" y="1108.7" font-size="12.5" fill="#7c2d12" font-weight="400" text-anchor="start"><tspan x="106">La investigación de un Capstone tiene muestra pequeña por diseño. Su valor está en el método y en la</tspan><tspan x="106" dy="16.5">honestidad sobre los límites, no en la representatividad.</tspan></text><text x="40" y="1177.66" font-size="11.5" fill="#ac9539" font-weight="700" letter-spacing="1.4">ERROR FRECUENTE Y SU CORRECCIÓN</text><rect x="40" y="1187.7" width="380.0" height="77.0" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/><text x="54" y="1209.7" font-size="11" fill="#b91c1c" font-weight="700" text-anchor="start"><tspan x="54">Síntoma</tspan></text><text x="54" y="1227.7" font-size="12.5" fill="#7f1d1d" font-weight="400" text-anchor="start"><tspan x="54">Presentar hallazgos sin conectarlos a decisiones</tspan></text><line x1="426.0" y1="1226.2" x2="469.0" y2="1226.2" stroke="#ac9539" stroke-width="2.6" stroke-linecap="round"/><polygon points="474.0,1226.2 465.9,1230.1 465.9,1222.2" fill="#ac9539"/><rect x="480.0" y="1187.7" width="380.0" height="77.0" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.4"/><text x="494.0" y="1209.7" font-size="11" fill="#15803d" font-weight="700" text-anchor="start"><tspan x="494.0">Corrección</tspan></text><text x="494.0" y="1227.7" font-size="12.5" fill="#14532d" font-weight="400" text-anchor="start"><tspan x="494.0">Asocia cada hallazgo a la decisión concreta que</tspan><tspan x="494.0" dy="16.5">informa o retíralo del informe.</tspan></text></svg>