<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1302" width="900" height="1302" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif"><title id="t">Modelo mental · Go-to-market del Capstone</title><desc id="d">Modelo mental de la clase 24.06: Go-to-market del Capstone. Método en 5 pasos; 4 conceptos; 3 señales de medición.</desc><rect x="0" y="0" width="900" height="1302" rx="14" fill="#ffffff"/><rect x="0" y="0" width="900" height="64" rx="14" fill="#6e5e20"/><rect x="0" y="40" width="900" height="24" fill="#6e5e20"/><text x="40" y="28" font-size="12" fill="#e5ddbc" font-weight="700" letter-spacing="1.6">MODELO MENTAL · CLASE 24.06 · PARTE 24</text><text x="40" y="52" font-size="21" fill="#ffffff" font-weight="700">Go-to-market del Capstone</text><text x="40" y="84" font-size="11.5" fill="#ac9539" font-weight="700" letter-spacing="1.4">MÉTODO PASO A PASO</text><ellipse cx="450.0" cy="376.8" rx="330.0" ry="233.1" fill="none" stroke="#cec08c" stroke-width="2" stroke-dasharray="3 8" stroke-linecap="round"/><polygon points="653.8,193.3 636.3,190.4 641.2,180.8" fill="#ac9539"/><polygon points="759.3,458.8 761.4,441.2 771.2,445.7" fill="#ac9539"/><polygon points="439.0,609.9 455.9,604.4 455.9,615.3" fill="#ac9539"/><polygon points="131.6,438.8 143.5,451.9 133.7,456.4" fill="#ac9539"/><polygon points="265.8,183.2 253.2,195.8 248.3,186.1" fill="#ac9539"/><circle cx="450.0" cy="376.8" r="100.0" fill="#e5ddbc" stroke="#cec08c" stroke-width="1.6"/><text x="450.0" y="369.0" font-size="15" fill="#6e5e20" font-weight="700" text-anchor="middle"><tspan x="450.0">Go-to-market del</tspan><tspan x="450.0" dy="19.8">Capstone</tspan></text><rect x="361.0" y="106.0" width="178" height="75.5" rx="10" fill="#f7f3e2" stroke="#cec08c" stroke-width="1.4"/><text x="373.0" y="128.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="373.0">Elegir el movimiento y</tspan><tspan x="373.0" dy="16.5">justificarlo con la</tspan><tspan x="373.0" dy="16.5">economía</tspan></text><circle cx="363.0" cy="108.0" r="14" fill="#6e5e20"/><text x="363.0" y="112.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><rect x="674.8" y="275.3" width="178" height="59.0" rx="10" fill="#f7f3e2" stroke="#cec08c" stroke-width="1.4"/><text x="686.8" y="297.3" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="686.8">Definir canales y su</tspan><tspan x="686.8" dy="16.5">contribución esperada</tspan></text><circle cx="676.8" cy="277.3" r="14" fill="#6e5e20"/><text x="676.8" y="281.8" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><rect x="555.0" y="535.8" width="178" height="59.0" rx="10" fill="#f7f3e2" stroke="#cec08c" stroke-width="1.4"/><text x="567.0" y="557.8" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="567.0">Construir la secuencia</tspan><tspan x="567.0" dy="16.5">con dependencias</tspan></text><circle cx="557.0" cy="537.8" r="14" fill="#6e5e20"/><text x="557.0" y="542.3" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><rect x="167.0" y="527.6" width="178" height="75.5" rx="10" fill="#f7f3e2" stroke="#cec08c" stroke-width="1.4"/><text x="179.0" y="549.6" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="179.0">Verificar la</tspan><tspan x="179.0" dy="16.5">coherencia con la</tspan><tspan x="179.0" dy="16.5">capacidad declarada</tspan></text><circle cx="169.0" cy="529.6" r="14" fill="#6e5e20"/><text x="169.0" y="534.1" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">4</text><rect x="47.2" y="267.0" width="178" height="75.5" rx="10" fill="#f7f3e2" stroke="#cec08c" stroke-width="1.4"/><text x="59.2" y="289.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="59.2">Definir los</tspan><tspan x="59.2" dy="16.5">indicadores de</tspan><tspan x="59.2" dy="16.5">seguimiento</tspan></text>