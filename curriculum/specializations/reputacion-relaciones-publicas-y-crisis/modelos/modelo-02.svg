<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1250" width="900" height="1250" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif"><title id="t">Modelo mental · Marca personal profesional y de liderazgo</title><desc id="d">Modelo mental de la clase ESP.02: Marca personal profesional y de liderazgo. Método en 8 pasos; 6 conceptos; 0 señales de medición.</desc><rect x="0" y="0" width="900" height="1250" rx="14" fill="#ffffff"/><rect x="0" y="0" width="900" height="64" rx="14" fill="#406e20"/><rect x="0" y="40" width="900" height="24" fill="#406e20"/><text x="40" y="28" font-size="12" fill="#cde5bc" font-weight="700" letter-spacing="1.6">MODELO MENTAL · CLASE ESP.02 · ESPECIALIZACIÓN</text><text x="40" y="52" font-size="21" fill="#ffffff" font-weight="700">Marca personal profesional y de liderazgo</text><text x="40" y="84" font-size="11.5" fill="#69ac39" font-weight="700" letter-spacing="1.4">MÉTODO PASO A PASO</text><path d="M66.0,159.0 V202.5 H106.0" fill="none" stroke="#69ac39" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="108.0,202.5 99.0,197.5 99.0,207.5" fill="#69ac39"/><path d="M136.0,232.0 V275.5 H176.0" fill="none" stroke="#69ac39" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="178.0,275.5 169.0,270.5 169.0,280.5" fill="#69ac39"/><path d="M206.0,305.0 V348.5 H246.0" fill="none" stroke="#69ac39" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="248.0,348.5 239.0,343.5 239.0,353.5" fill="#69ac39"/><path d="M276.0,378.0 V421.5 H316.0" fill="none" stroke="#69ac39" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="318.0,421.5 309.0,416.5 309.0,426.5" fill="#69ac39"/><path d="M346.0,451.0 V494.5 H386.0" fill="none" stroke="#69ac39" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="388.0,494.5 379.0,489.5 379.0,499.5" fill="#69ac39"/><path d="M416.0,524.0 V567.5 H456.0" fill="none" stroke="#69ac39" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="458.0,567.5 449.0,562.5 449.0,572.5" fill="#69ac39"/><path d="M486.0,597.0 V640.5 H526.0" fill="none" stroke="#69ac39" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="528.0,640.5 519.0,635.5 519.0,645.5" fill="#69ac39"/><rect x="40.0" y="100.0" width="330" height="59.0" rx="10" fill="#ebf7e2" stroke="#a7ce8c" stroke-width="1.4"/><text x="54.0" y="122.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Declarar el contexto y la decisión que la</tspan><tspan x="54.0" dy="16.5">presencia profesional debe facilitar</tspan></text><circle cx="42.0" cy="102.0" r="14" fill="#406e20"/><text x="42.0" y="106.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><rect x="110.0" y="173.0" width="330" height="59.0" rx="10" fill="#ebf7e2" stroke="#a7ce8c" stroke-width="1.4"/><text x="124.0" y="195.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="124.0">Acordar objetivos, consentimiento y límites</tspan><tspan x="124.0" dy="16.5">de la auditoría con la persona evaluada</tspan></text><circle cx="112.0" cy="175.0" r="14" fill="#406e20"/><text x="112.0" y="179.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><rect x="180.0" y="246.0" width="330" height="59.0" rx="10" fill="#ebf7e2" stroke="#a7ce8c" stroke-width="1.4"/><text x="194.0" y="268.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="194.0">Recoger hechos y señales actuales de perfil,</tspan><tspan x="194.0" dy="16.5">contenido, trayectoria y conducta</tspan></text><circle cx="182.0" cy="248.0" r="14" fill="#406e20"/><text x="182.0" y="252.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><rect x="250.0" y="319.0" width="330" height="59.0" rx="10" fill="#ebf7e2" stroke="#a7ce8c" stroke-width="1.4"/><text x="264.0" y="341.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="264.0">Formular la promesa profesional en una frase</tspan><tspan x="264.0" dy="16.5">refutable</tspan></text><circle cx="252.0" cy="321.0" r="14" fill="#406e20"/><text x="252.0" y="325.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">4</text><rect x="320.0" y="392.0" width="330" height="59.0" rx="10" fill="#ebf7e2" stroke="#a7ce8c" stroke-width="1.4"/><text x="334.0" y="414.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="334.0">Listar la evidencia pública por tipo:</tspan><tspan x="334.0" dy="16.5">resultado, criterio, conocimiento y trato</tspan></text><circle cx="322.0" cy="394.0" r="14" fill="#406e20"/><text x="322.0" y="398.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">5</text><rect x="390.0" y="465.0" width="330" height="59.0" rx="10" fill="#ebf7e2" stroke="#a7ce8c" stroke-width="1.4"/><text x="404.0" y="487.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="404.0">Definir el alcance: personal, profesional y</tspan><tspan x="404.0" dy="16.5">corporativo, con regla de autorización</tspan></text><circle cx="392.0" cy="467.0" r="14" fill="#406e20"/><text x="392.0" y="471.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">6</text><rect x="460.0" y="538.0" width="330" height="59.0" rx="10" fill="#ebf7e2" stroke="#a7ce8c" stroke-width="1.4"/><text x="474.0" y="560.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="474.0">Implementar cambios reversibles y medir si</tspan><tspan x="474.0" dy="16.5">cambia la comprensión de la promesa</tspan></text><circle cx="462.0" cy="540.0" r="14" fill="#406e20"/><text x="462.0" y="544.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">7</text><rect x="530.0" y="611.0" width="330" height="59.0" rx="10" fill="#ebf7e2" stroke="#a7ce8c" stroke-width="1.4"/><text x="544.0" y="633.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="544.0">Revisar cada seis meses o ante un cambio de</tspan><tspan x="544.0" dy="16.5">rol</tspan></text><circle cx="532.0" cy="613.0" r="14" fill="#406e20"/><text x="532.0" y="617.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">8</text><text x="40" y="712.0" font-size="11.5" fill="#69ac39" font-weight="700" letter-spacing="1.4">CONCEPTOS Y DÓNDE ACTÚAN EN EL MÉTODO</text><rect x="40.0" y="726.0" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#a7ce8c" stroke-width="1.4"/><rect x="40.0" y="734.0" width="5" height="62.2" rx="2" fill="#69ac39"/><text x="56.0" y="748.0" font-size="13.5" fill="#406e20" font-weight="700" text-anchor="start"><tspan x="56.0">Promesa profesional</tspan></text><text x="56.0" y="767.8" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Afirmación acotada sobre qué problema resuelve la persona,</tspan><tspan x="56.0" dy="15.2">para quién y con qué método</tspan></text><rect x="379.0" y="734.0" width="54" height="20" rx="10" fill="#cde5bc" stroke="#a7ce8c" stroke-width="1"/><text x="406.0" y="748.0" font-size="11" fill="#406e20" font-weight="700" text-anchor="middle">↔ 1, 4, 6, 7</text><rect x="459.0" y="726.0" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#a7ce8c" stroke-width="1.4"/><rect x="459.0" y="734.0" width="5" height="62.2" rx="2" fill="#69ac39"/><text x="475.0" y="748.0" font-size="13.5" fill="#406e20" font-weight="700" text-anchor="start"><tspan x="475.0">Evidencia pública</tspan></text><text x="475.0" y="767.8" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Trayectoria, resultados, publicaciones, intervenciones y</tspan><tspan x="475.0" dy="15.2">referencias que un tercero puede comprobar</tspan></text><rect x="798.0" y="734.0" width="54" height="20" rx="10" fill="#cde5bc" stroke="#a7ce8c" stroke-width="1"/><text x="825.0" y="748.0" font-size="11" fill="#406e20" font-weight="700" text-anchor="middle">↔ 5</text><rect x="40.0" y="818.2" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#a7ce8c" stroke-width="1.4"/><rect x="40.0" y="826.2" width="5" height="62.2" rx="2" fill="#69ac39"/><text x="56.0" y="840.2" font-size="13.5" fill="#406e20" font-weight="700" text-anchor="start"><tspan x="56.0">Alcance de la persona</tspan></text><text x="56.0" y="860.0" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Frontera entre lo que se dice a título personal, a título</tspan><tspan x="56.0" dy="15.2">profesional y en nombre de la organización</tspan></text><rect x="379.0" y="826.2" width="54" height="20" rx="10" fill="#cde5bc" stroke="#a7ce8c" stroke-width="1"/><text x="406.0" y="840.2" font-size="11" fill="#406e20" font-weight="700" text-anchor="middle">↔ 2, 6</text><rect x="459.0" y="818.2" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#a7ce8c" stroke-width="1.4"/><rect x="459.0" y="826.2" width="5" height="62.2" rx="2" fill="#69ac39"/><text x="475.0" y="840.2" font-size="13.5" fill="#406e20" font-weight="700" text-anchor="start"><tspan x="475.0">Coherencia de señales</tspan></text><text x="475.0" y="860.0" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Correspondencia entre biografía, perfil, contenido,</tspan><tspan x="475.0" dy="15.2">conducta y trato</tspan></text><rect x="798.0" y="826.2" width="54" height="20" rx="10" fill="#cde5bc" stroke="#a7ce8c" stroke-width="1"/><text x="825.0" y="840.2" font-size="11" fill="#406e20" font-weight="700" text-anchor="middle">↔ 3</text><rect x="40.0" y="910.4" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#a7ce8c" stroke-width="1.4"/><rect x="40.0" y="918.4" width="5" height="62.2" rx="2" fill="#69ac39"/><text x="56.0" y="932.4" font-size="13.5" fill="#406e20" font-weight="700" text-anchor="start"><tspan x="56.0">Figura pública</tspan></text><text x="56.0" y="952.2" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Persona cuya exposición es permanente y cuyas</tspan><tspan x="56.0" dy="15.2">declaraciones se interpretan más allá de su rol</tspan></text><rect x="379.0" y="918.4" width="54" height="20" rx="10" fill="#cde5bc" stroke="#a7ce8c" stroke-width="1"/><text x="406.0" y="932.4" font-size="11" fill="#406e20" font-weight="700" text-anchor="middle">↔ 5</text><rect x="459.0" y="910.4" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#a7ce8c" stroke-width="1.4"/><rect x="459.0" y="918.4" width="5" height="62.2" rx="2" fill="#69ac39"/><text x="475.0" y="932.4" font-size="13.5" fill="#406e20" font-weight="700" text-anchor="start"><tspan x="475.0">Riesgo por atribución</tspan></text><text x="475.0" y="952.2" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Daño a la organización que surge porque una declaración</tspan><tspan x="475.0" dy="15.2">personal se interpreta como corporativa</tspan></text><rect x="798.0" y="918.4" width="54" height="20" rx="10" fill="#cde5bc" stroke="#a7ce8c" stroke-width="1"/><text x="825.0" y="932.4" font-size="11" fill="#406e20" font-weight="700" text-anchor="middle">↔ 6</text><text x="40" y="1022.5400000000002" font-size="11.5" fill="#69ac39" font-weight="700" letter-spacing="1.4">FRONTERA DE APLICACIÓN</text><rect x="40" y="1032.5" width="820" height="65.0" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.4"/><polygon points="70,1050.0400000000002 52,1079.0400000000002 88,1079.0400000000002" fill="#c2410c"/><text x="70" y="1076.0400000000002" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">!</text><text x="106" y="1056.5" font-size="12.5" fill="#7c2d12" font-weight="400" text-anchor="start"><tspan x="106">Riesgo reputacional: Una declaración personal polémica puede atribuirse a la empresa aunque no lo sea; sin</tspan><tspan x="106" dy="16.5">alcance declarado, la organización responde de todos modos.</tspan></text><text x="40" y="1125.5400000000002" font-size="11.5" fill="#69ac39" font-weight="700" letter-spacing="1.4">ERROR FRECUENTE Y SU CORRECCIÓN</text><rect x="40" y="1135.5" width="380.0" height="77.0" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/><text x="54" y="1157.5" font-size="11" fill="#b91c1c" font-weight="700" text-anchor="start"><tspan x="54">Síntoma</tspan></text><text x="54" y="1175.5" font-size="12.5" fill="#7f1d1d" font-weight="400" text-anchor="start"><tspan x="54">Construir un personaje</tspan></text><line x1="426.0" y1="1174.0" x2="469.0" y2="1174.0" stroke="#69ac39" stroke-width="2.6" stroke-linecap="round"/><polygon points="474.0,1174.0 465.9,1178.0 465.9,1170.1" fill="#69ac39"/><rect x="480.0" y="1135.5" width="380.0" height="77.0" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.4"/><text x="494.0" y="1157.5" font-size="11" fill="#15803d" font-weight="700" text-anchor="start"><tspan x="494.0">Corrección</tspan></text><text x="494.0" y="1175.5" font-size="12.5" fill="#14532d" font-weight="400" text-anchor="start"><tspan x="494.0">La conducta real lo contradice tarde o temprano; se</tspan><tspan x="494.0" dy="16.5">parte de rasgos y trabajo verdaderos.</tspan></text></svg>
