<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1719" width="900" height="1719" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif"><title id="t">Modelo mental · Generación de contenido con controles</title><desc id="d">Modelo mental de la clase 21.04: Generación de contenido con controles. Método en 7 pasos; 5 conceptos; 7 señales de medición.</desc><rect x="0" y="0" width="900" height="1719" rx="14" fill="#ffffff"/><rect x="0" y="0" width="900" height="64" rx="14" fill="#43206e"/><rect x="0" y="40" width="900" height="24" fill="#43206e"/><text x="40" y="28" font-size="12" fill="#cfbce5" font-weight="700" letter-spacing="1.6">MODELO MENTAL · CLASE 21.04 · PARTE 21</text><text x="40" y="52" font-size="21" fill="#ffffff" font-weight="700">Generación de contenido con controles</text><text x="40" y="84" font-size="11.5" fill="#6d39ac" font-weight="700" letter-spacing="1.4">MÉTODO PASO A PASO</text><ellipse cx="450.0" cy="403.2" rx="330.0" ry="251.2" fill="none" stroke="#aa8cce" stroke-width="2" stroke-dasharray="3 8" stroke-linecap="round"/><polygon points="603.5,180.7 585.8,179.9 589.5,169.8" fill="#6d39ac"/><polygon points="774.9,357.8 764.9,343.2 775.2,340.1" fill="#6d39ac"/><polygon points="700.0,567.4 708.5,551.8 716.0,559.7" fill="#6d39ac"/><polygon points="439.0,654.4 455.9,649.0 455.9,659.8" fill="#6d39ac"/><polygon points="184.0,552.2 200.0,560.0 192.5,567.8" fill="#6d39ac"/><polygon points="131.4,336.8 131.8,354.5 121.4,351.4" fill="#6d39ac"/><polygon points="317.1,173.1 303.1,184.0 299.4,173.8" fill="#6d39ac"/><circle cx="450.0" cy="403.2" r="100.0" fill="#cfbce5" stroke="#aa8cce" stroke-width="1.6"/><text x="450.0" y="385.5" font-size="15" fill="#43206e" font-weight="700" text-anchor="middle"><tspan x="450.0">Generación de</tspan><tspan x="450.0" dy="19.8">contenido con</tspan><tspan x="450.0" dy="19.8">controles</tspan></text><rect x="361.0" y="106.0" width="178" height="92.0" rx="10" fill="#ece2f7" stroke="#aa8cce" stroke-width="1.4"/><text x="373.0" y="128.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="373.0">Definir qué tipos de</tspan><tspan x="373.0" dy="16.5">contenido pueden</tspan><tspan x="373.0" dy="16.5">generarse</tspan><tspan x="373.0" dy="16.5">asistidamente</tspan></text><circle cx="363.0" cy="108.0" r="14" fill="#43206e"/><text x="363.0" y="112.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><rect x="619.0" y="208.8" width="178" height="75.5" rx="10" fill="#ece2f7" stroke="#aa8cce" stroke-width="1.4"/><text x="631.0" y="230.8" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="631.0">Establecer el control</tspan><tspan x="631.0" dy="16.5">de afirmaciones como</tspan><tspan x="631.0" dy="16.5">paso obligatorio</tspan></text><circle cx="621.0" cy="210.8" r="14" fill="#43206e"/><text x="621.0" y="215.3" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><rect x="682.7" y="421.3" width="178" height="75.5" rx="10" fill="#ece2f7" stroke="#aa8cce" stroke-width="1.4"/><text x="694.7" y="443.3" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="694.7">Extraer cada claim y</tspan><tspan x="694.7" dy="16.5">enlazarlo con su</tspan><tspan x="694.7" dy="16.5">fuente</tspan></text><circle cx="684.7" cy="423.3" r="14" fill="#43206e"/><text x="684.7" y="427.8" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><rect x="504.2" y="591.8" width="178" height="75.5" rx="10" fill="#ece2f7" stroke="#aa8cce" stroke-width="1.4"/><text x="516.2" y="613.8" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="516.2">Verificar hechos,</tspan><tspan x="516.2" dy="16.5">encaje regulatorio y</tspan><tspan x="516.2" dy="16.5">reglas de detención</tspan></text><circle cx="506.2" cy="593.8" r="14" fill="#43206e"/><text x="506.2" y="598.3" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">4</text><rect x="217.8" y="600.0" width="178" height="59.0" rx="10" fill="#ece2f7" stroke="#aa8cce" stroke-width="1.4"/><text x="229.8" y="622.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="229.8">Asignar responsable</tspan><tspan x="229.8" dy="16.5">humano de publicación</tspan></text><circle cx="219.8" cy="602.0" r="14" fill="#43206e"/><text x="219.8" y="606.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">5</text><rect x="39.3" y="429.6" width="178" height="59.0" rx="10" fill="#ece2f7" stroke="#aa8cce" stroke-width="1.4"/><text x="51.3" y="451.6" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="51.3">Registrar el origen de</tspan><tspan x="51.3" dy="16.5">cada pieza</tspan></text><circle cx="41.3" cy="431.6" r="14" fill="#43206e"/><text x="41.3" y="436.1" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">6</text><rect x="103.0" y="217.1" width="178" height="59.0" rx="10" fill="#ece2f7" stroke="#aa8cce" stroke-width="1.4"/><text x="115.0" y="239.1" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="115.0">Auditar una muestra</tspan><tspan x="115.0" dy="16.5">publicada cada mes</tspan></text><circle cx="105.0" cy="219.1" r="14" fill="#43206e"/><text x="105.0" y="223.6" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">7</text><text x="40" y="742.4" font-size="11.5" fill="#6d39ac" font-weight="700" letter-spacing="1.4">CONCEPTOS Y DÓNDE ACTÚAN EN EL MÉTODO</text><rect x="40.0" y="756.4" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#aa8cce" stroke-width="1.4"/><rect x="40.0" y="764.4" width="5" height="62.2" rx="2" fill="#6d39ac"/><text x="56.0" y="778.4" font-size="13.5" fill="#43206e" font-weight="700" text-anchor="start"><tspan x="56.0">Control de afirmaciones</tspan></text><text x="56.0" y="798.2" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Verificación obligatoria del respaldo de cada afirmación</tspan><tspan x="56.0" dy="15.2">antes de publicar</tspan></text><rect x="379.0" y="764.4" width="54" height="20" rx="10" fill="#cfbce5" stroke="#aa8cce" stroke-width="1"/><text x="406.0" y="778.4" font-size="11" fill="#43206e" font-weight="700" text-anchor="middle">↔ 2</text><rect x="459.0" y="756.4" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#aa8cce" stroke-width="1.4"/><rect x="459.0" y="764.4" width="5" height="62.2" rx="2" fill="#6d39ac"/><text x="475.0" y="778.4" font-size="13.5" fill="#43206e" font-weight="700" text-anchor="start"><tspan x="475.0">Responsable de publicación</tspan></text><text x="475.0" y="798.2" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Persona que responde por el contenido con independencia de</tspan><tspan x="475.0" dy="15.2">quién lo generó</tspan></text><rect x="798.0" y="764.4" width="54" height="20" rx="10" fill="#cfbce5" stroke="#aa8cce" stroke-width="1"/><text x="825.0" y="778.4" font-size="11" fill="#43206e" font-weight="700" text-anchor="middle">↔ 1, 5, 7</text><rect x="40.0" y="848.6" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#aa8cce" stroke-width="1.4"/><rect x="40.0" y="856.6" width="5" height="62.2" rx="2" fill="#6d39ac"/><text x="56.0" y="870.6" font-size="13.5" fill="#43206e" font-weight="700" text-anchor="start"><tspan x="56.0">Factor de amplificación de error</tspan></text><text x="56.0" y="890.4" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Impactos erróneos distribuidos atribuibles a una fuente de</tspan><tspan x="56.0" dy="15.2">error durante una ventana declarada</tspan></text><rect x="459.0" y="848.6" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#aa8cce" stroke-width="1.4"/><rect x="459.0" y="856.6" width="5" height="62.2" rx="2" fill="#6d39ac"/><text x="475.0" y="870.6" font-size="13.5" fill="#43206e" font-weight="700" text-anchor="start"><tspan x="475.0">Riesgo de escala</tspan></text><text x="475.0" y="890.4" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Amplificación del daño cuando el error se replica en</tspan><tspan x="475.0" dy="15.2">muchas piezas</tspan></text><rect x="40.0" y="940.8" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#aa8cce" stroke-width="1.4"/><rect x="40.0" y="948.8" width="5" height="62.2" rx="2" fill="#6d39ac"/><text x="56.0" y="962.8" font-size="13.5" fill="#43206e" font-weight="700" text-anchor="start"><tspan x="56.0">Registro de origen</tspan></text><text x="56.0" y="982.6" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Documentación de qué contenido fue generado o asistido por</tspan><tspan x="56.0" dy="15.2">un sistema</tspan></text><rect x="379.0" y="948.8" width="54" height="20" rx="10" fill="#cfbce5" stroke="#aa8cce" stroke-width="1"/><text x="406.0" y="962.8" font-size="11" fill="#43206e" font-weight="700" text-anchor="middle">↔ 1, 6</text><text x="40" y="1050.94" font-size="11.5" fill="#6d39ac" font-weight="700" letter-spacing="1.4">QUÉ SE MIDE: NUMERADOR SOBRE DENOMINADOR</text><rect x="40.0" y="1064.9" width="261.3" height="122.7" rx="8" fill="#ece2f7" stroke="#aa8cce" stroke-width="1.4"/><text x="54.0" y="1086.9" font-size="13" fill="#43206e" font-weight="700" text-anchor="start"><tspan x="54.0">Piezas con control aplicado</tspan></text><text x="54.0" y="1116.1" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Contenidos revisados antes de</tspan><tspan x="54.0" dy="15.2">publicar</tspan></text><line x1="54.0" y1="1152.5" x2="287.3" y2="1152.5" stroke="#6d39ac" stroke-width="2"/><text x="54.0" y="1170.5" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="54.0">Contenidos publicados</tspan></text><rect x="319.3" y="1064.9" width="261.3" height="122.7" rx="8" fill="#ece2f7" stroke="#aa8cce" stroke-width="1.4"/><text x="333.3" y="1086.9" font-size="13" fill="#43206e" font-weight="700" text-anchor="start"><tspan x="333.3">Afirmaciones corregidas en</tspan><tspan x="333.3" dy="17.2">control</tspan></text><text x="333.3" y="1133.3" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="333.3">Correcciones realizadas</tspan></text><line x1="333.3" y1="1154.4" x2="566.7" y2="1154.4" stroke="#6d39ac" stroke-width="2"/><text x="333.3" y="1172.4" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="333.3">Piezas revisadas</tspan></text><rect x="598.7" y="1064.9" width="261.3" height="122.7" rx="8" fill="#ece2f7" stroke="#aa8cce" stroke-width="1.4"/><text x="612.7" y="1086.9" font-size="13" fill="#43206e" font-weight="700" text-anchor="start"><tspan x="612.7">Incidentes por contenido</tspan><tspan x="612.7" dy="17.2">publicado</tspan></text><text x="612.7" y="1133.3" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="612.7">Reclamos o correcciones posteriores</tspan></text><line x1="612.7" y1="1154.4" x2="846.0" y2="1154.4" stroke="#6d39ac" stroke-width="2"/><text x="612.7" y="1172.4" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="612.7">Piezas publicadas</tspan></text><rect x="40.0" y="1201.6" width="261.3" height="120.7" rx="8" fill="#ece2f7" stroke="#aa8cce" stroke-width="1.4"/><text x="54.0" y="1223.6" font-size="13" fill="#43206e" font-weight="700" text-anchor="start"><tspan x="54.0">Factor de amplificación de error</tspan></text><text x="54.0" y="1252.8" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Impactos erróneos distribuidos</tspan></text><line x1="54.0" y1="1274.0" x2="287.3" y2="1274.0" stroke="#6d39ac" stroke-width="2"/><text x="54.0" y="1292.0" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="54.0">Fuentes de error originarias, por</tspan><tspan x="54.0" dy="15.2">campaña y ventana</tspan></text><rect x="319.3" y="1201.6" width="261.3" height="120.7" rx="8" fill="#ece2f7" stroke="#aa8cce" stroke-width="1.4"/><text x="333.3" y="1223.6" font-size="13" fill="#43206e" font-weight="700" text-anchor="start"><tspan x="333.3">Claim rejection rate</tspan></text><text x="333.3" y="1252.8" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="333.3">Claims rechazados por el gate</tspan></text><line x1="333.3" y1="1274.0" x2="566.7" y2="1274.0" stroke="#6d39ac" stroke-width="2"/><text x="333.3" y="1292.0" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="333.3">Claims extraídos, por versión de</tspan><tspan x="333.3" dy="15.2">campaña</tspan></text><rect x="598.7" y="1201.6" width="261.3" height="120.7" rx="8" fill="#ece2f7" stroke="#aa8cce" stroke-width="1.4"/><text x="612.7" y="1223.6" font-size="13" fill="#43206e" font-weight="700" text-anchor="start"><tspan x="612.7">AI-generated-content rate</tspan></text><text x="612.7" y="1252.8" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="612.7">Piezas con generación o edición</tspan><tspan x="612.7" dy="15.2">sustantiva de IA</tspan></text><line x1="612.7" y1="1289.1" x2="846.0" y2="1289.1" stroke="#6d39ac" stroke-width="2"/><text x="612.7" y="1307.1" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="612.7">Piezas publicadas, por mes</tspan></text><rect x="40.0" y="1336.3" width="261.3" height="120.7" rx="8" fill="#ece2f7" stroke="#aa8cce" stroke-width="1.4"/><text x="54.0" y="1358.3" font-size="13" fill="#43206e" font-weight="700" text-anchor="start"><tspan x="54.0">Human-review rate</tspan></text><text x="54.0" y="1387.5" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Piezas con aprobación humana</tspan><tspan x="54.0" dy="15.2">registrada</tspan></text><line x1="54.0" y1="1423.8" x2="287.3" y2="1423.8" stroke="#6d39ac" stroke-width="2"/><text x="54.0" y="1441.8" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="54.0">Piezas publicadas, por mes</tspan></text><text x="40" y="1491.0200000000002" font-size="11.5" fill="#6d39ac" font-weight="700" letter-spacing="1.4">FRONTERA DE APLICACIÓN</text><rect x="40" y="1501.0" width="820" height="65.0" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.4"/><polygon points="70,1518.5200000000002 52,1547.5200000000002 88,1547.5200000000002" fill="#c2410c"/><text x="70" y="1544.5200000000002" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">!</text><text x="106" y="1525.0" font-size="12.5" fill="#7c2d12" font-weight="400" text-anchor="start"><tspan x="106">El control humano tiene capacidad limitada. Si el volumen generado supera la capacidad de revisión, la</tspan><tspan x="106" dy="16.5">solución es reducir el volumen y no relajar el control.</tspan></text><text x="40" y="1594.0200000000002" font-size="11.5" fill="#6d39ac" font-weight="700" letter-spacing="1.4">ERROR FRECUENTE Y SU CORRECCIÓN</text><rect x="40" y="1604.0" width="380.0" height="77.0" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/><text x="54" y="1626.0" font-size="11" fill="#b91c1c" font-weight="700" text-anchor="start"><tspan x="54">Síntoma</tspan></text><text x="54" y="1644.0" font-size="12.5" fill="#7f1d1d" font-weight="400" text-anchor="start"><tspan x="54">Publicar contenido generado sin control de</tspan><tspan x="54" dy="16.5">afirmaciones</tspan></text><line x1="426.0" y1="1642.5" x2="469.0" y2="1642.5" stroke="#6d39ac" stroke-width="2.6" stroke-linecap="round"/><polygon points="474.0,1642.5 465.9,1646.4 465.9,1638.6" fill="#6d39ac"/><rect x="480.0" y="1604.0" width="380.0" height="77.0" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.4"/><text x="494.0" y="1626.0" font-size="11" fill="#15803d" font-weight="700" text-anchor="start"><tspan x="494.0">Corrección</tspan></text><text x="494.0" y="1644.0" font-size="12.5" fill="#14532d" font-weight="400" text-anchor="start"><tspan x="494.0">Instala la revisión como paso obligatorio y ajusta</tspan><tspan x="494.0" dy="16.5">el volumen a la capacidad real de control.</tspan></text></svg>