<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1304" width="900" height="1304" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif"><title id="t">Modelo mental · Intereses versus posiciones</title><desc id="d">Modelo mental de la clase 10.02: Intereses versus posiciones. Método en 5 pasos; 4 conceptos; 3 señales de medición.</desc><rect x="0" y="0" width="900" height="1304" rx="14" fill="#ffffff"/><rect x="0" y="0" width="900" height="64" rx="14" fill="#2d6e20"/><rect x="0" y="40" width="900" height="24" fill="#2d6e20"/><text x="40" y="28" font-size="12" fill="#c3e5bc" font-weight="700" letter-spacing="1.6">MODELO MENTAL · CLASE 10.02 · PARTE 10</text><text x="40" y="52" font-size="21" fill="#ffffff" font-weight="700">Intereses versus posiciones</text><text x="40" y="84" font-size="11.5" fill="#4cac39" font-weight="700" letter-spacing="1.4">MÉTODO PASO A PASO</text><ellipse cx="450.0" cy="376.8" rx="330.0" ry="233.1" fill="none" stroke="#97ce8c" stroke-width="2" stroke-dasharray="3 8" stroke-linecap="round"/><polygon points="653.8,193.3 636.3,190.4 641.2,180.8" fill="#4cac39"/><polygon points="759.3,458.8 761.4,441.2 771.2,445.7" fill="#4cac39"/><polygon points="439.0,609.9 455.9,604.4 455.9,615.3" fill="#4cac39"/><polygon points="131.6,438.8 143.5,451.9 133.7,456.4" fill="#4cac39"/><polygon points="265.8,183.2 253.2,195.8 248.3,186.1" fill="#4cac39"/><circle cx="450.0" cy="376.8" r="100.0" fill="#c3e5bc" stroke="#97ce8c" stroke-width="1.6"/><text x="450.0" y="369.0" font-size="15" fill="#2d6e20" font-weight="700" text-anchor="middle"><tspan x="450.0">Intereses versus</tspan><tspan x="450.0" dy="19.8">posiciones</tspan></text><rect x="361.0" y="106.0" width="178" height="75.5" rx="10" fill="#e6f7e2" stroke="#97ce8c" stroke-width="1.4"/><text x="373.0" y="128.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="373.0">Registrar las</tspan><tspan x="373.0" dy="16.5">posiciones enunciadas</tspan><tspan x="373.0" dy="16.5">por ambas partes</tspan></text><circle cx="363.0" cy="108.0" r="14" fill="#2d6e20"/><text x="363.0" y="112.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><rect x="674.8" y="267.0" width="178" height="75.5" rx="10" fill="#e6f7e2" stroke="#97ce8c" stroke-width="1.4"/><text x="686.8" y="289.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="686.8">Indagar el interés</tspan><tspan x="686.8" dy="16.5">detrás de cada</tspan><tspan x="686.8" dy="16.5">posición</tspan></text><circle cx="676.8" cy="269.0" r="14" fill="#2d6e20"/><text x="676.8" y="273.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><rect x="555.0" y="527.6" width="178" height="75.5" rx="10" fill="#e6f7e2" stroke="#97ce8c" stroke-width="1.4"/><text x="567.0" y="549.6" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="567.0">Identificar</tspan><tspan x="567.0" dy="16.5">prioridades distintas</tspan><tspan x="567.0" dy="16.5">entre las partes</tspan></text><circle cx="557.0" cy="529.6" r="14" fill="#2d6e20"/><text x="557.0" y="534.1" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><rect x="167.0" y="535.8" width="178" height="59.0" rx="10" fill="#e6f7e2" stroke="#97ce8c" stroke-width="1.4"/><text x="179.0" y="557.8" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="179.0">Generar opciones antes</tspan><tspan x="179.0" dy="16.5">de evaluar cualquiera</tspan></text><circle cx="169.0" cy="537.8" r="14" fill="#2d6e20"/><text x="169.0" y="542.3" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">4</text><rect x="47.2" y="267.0" width="178" height="75.5" rx="10" fill="#e6f7e2" stroke="#97ce8c" stroke-width="1.4"/><text x="59.2" y="289.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="59.2">Elegir la combinación</tspan><tspan x="59.2" dy="16.5">que maximiza valor</tspan><tspan x="59.2" dy="16.5">conjunto</tspan></text><circle cx="49.2" cy="269.0" r="14" fill="#2d6e20"/><text x="49.2" y="273.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">5</text><text x="40" y="689.6" font-size="11.5" fill="#4cac39" font-weight="700" letter-spacing="1.4">CONCEPTOS Y DÓNDE ACTÚAN EN EL MÉTODO</text><rect x="40.0" y="703.6" width="401.0" height="63.0" rx="8" fill="#ffffff" stroke="#97ce8c" stroke-width="1.4"/><rect x="40.0" y="711.6" width="5" height="47.0" rx="2" fill="#4cac39"/><text x="56.0" y="725.6" font-size="13.5" fill="#2d6e20" font-weight="700" text-anchor="start"><tspan x="56.0">Posición</tspan></text><text x="56.0" y="745.4" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Demanda concreta que una parte formula en la mesa</tspan></text><rect x="379.0" y="711.6" width="54" height="20" rx="10" fill="#c3e5bc" stroke="#97ce8c" stroke-width="1"/><text x="406.0" y="725.6" font-size="11" fill="#2d6e20" font-weight="700" text-anchor="middle">↔ 1, 2</text><rect x="459.0" y="703.6" width="401.0" height="63.0" rx="8" fill="#ffffff" stroke="#97ce8c" stroke-width="1.4"/><rect x="459.0" y="711.6" width="5" height="47.0" rx="2" fill="#4cac39"/><text x="475.0" y="725.6" font-size="13.5" fill="#2d6e20" font-weight="700" text-anchor="start"><tspan x="475.0">Interés subyacente</tspan></text><text x="475.0" y="745.4" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Necesidad, temor o restricción que explica esa demanda</tspan></text><rect x="798.0" y="711.6" width="54" height="20" rx="10" fill="#c3e5bc" stroke="#97ce8c" stroke-width="1"/><text x="825.0" y="725.6" font-size="11" fill="#2d6e20" font-weight="700" text-anchor="middle">↔ 2</text><rect x="40.0" y="780.6" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#97ce8c" stroke-width="1.4"/><rect x="40.0" y="788.6" width="5" height="62.2" rx="2" fill="#4cac39"/><text x="56.0" y="802.6" font-size="13.5" fill="#2d6e20" font-weight="700" text-anchor="start"><tspan x="56.0">Opción de valor conjunto</tspan></text><text x="56.0" y="822.4" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Alternativa que satisface intereses de ambas partes sin</tspan><tspan x="56.0" dy="15.2">ceder lo esencial</tspan></text><rect x="379.0" y="788.6" width="54" height="20" rx="10" fill="#c3e5bc" stroke="#97ce8c" stroke-width="1"/><text x="406.0" y="802.6" font-size="11" fill="#2d6e20" font-weight="700" text-anchor="middle">↔ 1, 4, 5</text><rect x="459.0" y="780.6" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#97ce8c" stroke-width="1.4"/><rect x="459.0" y="788.6" width="5" height="62.2" rx="2" fill="#4cac39"/><text x="475.0" y="802.6" font-size="13.5" fill="#2d6e20" font-weight="700" text-anchor="start"><tspan x="475.0">Intercambio de prioridades</tspan></text><text x="475.0" y="822.4" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Acuerdo donde cada parte cede en lo que valora menos y</tspan><tspan x="475.0" dy="15.2">obtiene lo que valora más</tspan></text><rect x="798.0" y="788.6" width="54" height="20" rx="10" fill="#c3e5bc" stroke="#97ce8c" stroke-width="1"/><text x="825.0" y="802.6" font-size="11" fill="#2d6e20" font-weight="700" text-anchor="middle">↔ 2, 3</text><text x="40" y="890.78" font-size="11.5" fill="#4cac39" font-weight="700" letter-spacing="1.4">QUÉ SE MIDE: NUMERADOR SOBRE DENOMINADOR</text><rect x="40.0" y="904.8" width="261.3" height="137.9" rx="8" fill="#e6f7e2" stroke="#97ce8c" stroke-width="1.4"/><text x="54.0" y="926.8" font-size="13" fill="#2d6e20" font-weight="700" text-anchor="start"><tspan x="54.0">Opciones generadas por</tspan><tspan x="54.0" dy="17.2">negociación</tspan></text><text x="54.0" y="973.1" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Alternativas distintas planteadas</tspan><tspan x="54.0" dy="15.2">antes de decidir, por negociación</tspan></text><rect x="319.3" y="904.8" width="261.3" height="137.9" rx="8" fill="#e6f7e2" stroke="#97ce8c" stroke-width="1.4"/><text x="333.3" y="926.8" font-size="13" fill="#2d6e20" font-weight="700" text-anchor="start"><tspan x="333.3">Acuerdos con intercambio de</tspan><tspan x="333.3" dy="17.2">prioridades</tspan></text><text x="333.3" y="973.1" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="333.3">Acuerdos donde ambas partes cedieron</tspan><tspan x="333.3" dy="15.2">en distinto atributo</tspan></text><line x1="333.3" y1="1009.5" x2="566.7" y2="1009.5" stroke="#4cac39" stroke-width="2"/><text x="333.3" y="1027.5" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="333.3">Acuerdos cerrados</tspan></text><rect x="598.7" y="904.8" width="261.3" height="137.9" rx="8" fill="#e6f7e2" stroke="#97ce8c" stroke-width="1.4"/><text x="612.7" y="926.8" font-size="13" fill="#2d6e20" font-weight="700" text-anchor="start"><tspan x="612.7">Satisfacción declarada post</tspan><tspan x="612.7" dy="17.2">acuerdo</tspan></text><text x="612.7" y="973.1" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="612.7">Puntuación de satisfacción de ambas</tspan><tspan x="612.7" dy="15.2">partes al cierre, con muestra</tspan><tspan x="612.7" dy="15.2">definida</tspan></text><text x="40" y="1076.6399999999999" font-size="11.5" fill="#4cac39" font-weight="700" letter-spacing="1.4">FRONTERA DE APLICACIÓN</text><rect x="40" y="1086.6" width="820" height="65.0" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.4"/><polygon points="70,1104.1399999999999 52,1133.1399999999999 88,1133.1399999999999" fill="#c2410c"/><text x="70" y="1130.1399999999999" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">!</text><text x="106" y="1110.6" font-size="12.5" fill="#7c2d12" font-weight="400" text-anchor="start"><tspan x="106">No todos los intereses son compatibles. Cuando el conflicto es distributivo real, explorar intereses ayuda</tspan><tspan x="106" dy="16.5">a entender pero no elimina la necesidad de repartir.</tspan></text><text x="40" y="1179.6399999999999" font-size="11.5" fill="#4cac39" font-weight="700" letter-spacing="1.4">ERROR FRECUENTE Y SU CORRECCIÓN</text><rect x="40" y="1189.6" width="380.0" height="77.0" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/><text x="54" y="1211.6" font-size="11" fill="#b91c1c" font-weight="700" text-anchor="start"><tspan x="54">Síntoma</tspan></text><text x="54" y="1229.6" font-size="12.5" fill="#7f1d1d" font-weight="400" text-anchor="start"><tspan x="54">Contraofertar antes de entender el interés</tspan></text><line x1="426.0" y1="1228.1" x2="469.0" y2="1228.1" stroke="#4cac39" stroke-width="2.6" stroke-linecap="round"/><polygon points="474.0,1228.1 465.9,1232.1 465.9,1224.2" fill="#4cac39"/><rect x="480.0" y="1189.6" width="380.0" height="77.0" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.4"/><text x="494.0" y="1211.6" font-size="11" fill="#15803d" font-weight="700" text-anchor="start"><tspan x="494.0">Corrección</tspan></text><text x="494.0" y="1229.6" font-size="12.5" fill="#14532d" font-weight="400" text-anchor="start"><tspan x="494.0">Formula al menos dos preguntas sobre el porqué de</tspan><tspan x="494.0" dy="16.5">la demanda antes de responder con una cifra.</tspan></text></svg>