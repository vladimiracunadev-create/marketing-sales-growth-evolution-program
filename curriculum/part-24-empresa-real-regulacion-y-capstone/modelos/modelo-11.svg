<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1005" width="900" height="1005" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif"><title id="t">Modelo mental · Commercial Evidence Pack y dashboard comercial</title><desc id="d">Modelo mental de la clase 24.11: Commercial Evidence Pack y dashboard comercial. Método en 5 pasos; 4 conceptos; 3 señales de medición.</desc><rect x="0" y="0" width="900" height="1005" rx="14" fill="#ffffff"/><rect x="0" y="0" width="900" height="64" rx="14" fill="#6e5e20"/><rect x="0" y="40" width="900" height="24" fill="#6e5e20"/><text x="40" y="28" font-size="12" fill="#e5ddbc" font-weight="700" letter-spacing="1.6">MODELO MENTAL · CLASE 24.11 · PARTE 24</text><text x="40" y="52" font-size="21" fill="#ffffff" font-weight="700">Commercial Evidence Pack y dashboard comercial</text><text x="40" y="84" font-size="11.5" fill="#ac9539" font-weight="700" letter-spacing="1.4">MÉTODO PASO A PASO</text><rect x="40.0" y="100" width="246.7" height="92.0" rx="10" fill="#f7f3e2" stroke="#cec08c" stroke-width="1.4"/><text x="54.0" y="122" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Consolidar mercado, cliente,</tspan><tspan x="54.0" dy="16.5">competencia, propuesta y precio</tspan><tspan x="54.0" dy="16.5">con evidencia trazable</tspan></text><circle cx="42.0" cy="102.0" r="14" fill="#6e5e20"/><text x="42.0" y="106.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><rect x="326.7" y="100" width="246.7" height="92.0" rx="10" fill="#f7f3e2" stroke="#cec08c" stroke-width="1.4"/><text x="340.7" y="122" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="340.7">Conectar adquisición,</tspan><tspan x="340.7" dy="16.5">conversiones, capacidad,</tspan><tspan x="340.7" dy="16.5">retención y churn con el</tspan><tspan x="340.7" dy="16.5">forecast comercial</tspan></text><circle cx="328.7" cy="102.0" r="14" fill="#6e5e20"/><text x="328.7" y="106.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><rect x="613.3" y="100" width="246.7" height="92.0" rx="10" fill="#f7f3e2" stroke="#cec08c" stroke-width="1.4"/><text x="627.3" y="122" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="627.3">Registrar por afirmación dato,</tspan><tspan x="627.3" dy="16.5">estimación, hipótesis o</tspan><tspan x="627.3" dy="16.5">inferencia y su incertidumbre</tspan></text><circle cx="615.3" cy="102.0" r="14" fill="#6e5e20"/><text x="615.3" y="106.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><rect x="613.3" y="230.0" width="246.7" height="75.5" rx="10" fill="#f7f3e2" stroke="#cec08c" stroke-width="1.4"/><text x="627.3" y="252.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="627.3">Verificar la coherencia</tspan><tspan x="627.3" dy="16.5">aritmética de CAC, LTV, ticket,</tspan><tspan x="627.3" dy="16.5">frecuencia, clientes e ingreso</tspan></text><circle cx="615.3" cy="232.0" r="14" fill="#6e5e20"/><text x="615.3" y="236.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">4</text><rect x="326.7" y="230.0" width="246.7" height="75.5" rx="10" fill="#f7f3e2" stroke="#cec08c" stroke-width="1.4"/><text x="340.7" y="252.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="340.7">Publicar el paquete ejecutivo</tspan><tspan x="340.7" dy="16.5">con enlaces al detalle y</tspan><tspan x="340.7" dy="16.5">condiciones de revisión</tspan></text><circle cx="328.7" cy="232.0" r="14" fill="#6e5e20"/><text x="328.7" y="236.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">5</text><line x1="289.7" y1="146.0" x2="318.7" y2="146.0" stroke="#ac9539" stroke-width="2.2" stroke-linecap="round"/><polygon points="323.7,146.0 315.6,149.9 315.6,142.1" fill="#ac9539"/><line x1="576.3" y1="146.0" x2="605.3" y2="146.0" stroke="#ac9539" stroke-width="2.2" stroke-linecap="round"/><polygon points="610.3,146.0 602.2,149.9 602.2,142.1" fill="#ac9539"/><line x1="736.7" y1="194.0" x2="736.7" y2="222.0" stroke="#ac9539" stroke-width="2.2" stroke-linecap="round"/><polygon points="736.7,227.0 732.8,218.9 740.6,218.9" fill="#ac9539"/><line x1="610.3" y1="267.8" x2="581.3" y2="267.8" stroke="#ac9539" stroke-width="2.2" stroke-linecap="round"/><polygon points="576.3,267.8 584.4,263.8 584.4,271.7" fill="#ac9539"/><text x="40" y="343.5" font-size="11.5" fill="#ac9539" font-weight="700" letter-spacing="1.4">CONCEPTOS Y DÓNDE ACTÚAN EN EL MÉTODO</text><rect x="40.0" y="357.5" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#cec08c" stroke-width="1.4"/><rect x="40.0" y="365.5" width="5" height="62.2" rx="2" fill="#ac9539"/><text x="56.0" y="379.5" font-size="13.5" fill="#6e5e20" font-weight="700" text-anchor="start"><tspan x="56.0">Trazabilidad de la cifra</tspan></text><text x="56.0" y="399.3" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Posibilidad de reconstruir el cálculo desde sus</tspan><tspan x="56.0" dy="15.2">componentes</tspan></text><rect x="379.0" y="365.5" width="54" height="20" rx="10" fill="#e5ddbc" stroke="#cec08c" stroke-width="1"/><text x="406.0" y="379.5" font-size="11" fill="#6e5e20" font-weight="700" text-anchor="middle">↔ 1</text><rect x="459.0" y="357.5" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#cec08c" stroke-width="1.4"/><rect x="459.0" y="365.5" width="5" height="62.2" rx="2" fill="#ac9539"/><text x="475.0" y="379.5" font-size="13.5" fill="#6e5e20" font-weight="700" text-anchor="start"><tspan x="475.0">Coherencia aritmética</tspan></text><text x="475.0" y="399.3" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Consistencia entre los indicadores del tablero</tspan></text><rect x="798.0" y="365.5" width="54" height="20" rx="10" fill="#e5ddbc" stroke="#cec08c" stroke-width="1"/><text x="825.0" y="379.5" font-size="11" fill="#6e5e20" font-weight="700" text-anchor="middle">↔ 4</text><rect x="40.0" y="449.7" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#cec08c" stroke-width="1.4"/><rect x="40.0" y="457.7" width="5" height="62.2" rx="2" fill="#ac9539"/><text x="56.0" y="471.7" font-size="13.5" fill="#6e5e20" font-weight="700" text-anchor="start"><tspan x="56.0">Proyección con supuestos</tspan></text><text x="56.0" y="491.5" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Estimación futura acompañada de las condiciones que la</tspan><tspan x="56.0" dy="15.2">sostienen</tspan></text><rect x="459.0" y="449.7" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#cec08c" stroke-width="1.4"/><rect x="459.0" y="457.7" width="5" height="62.2" rx="2" fill="#ac9539"/><text x="475.0" y="471.7" font-size="13.5" fill="#6e5e20" font-weight="700" text-anchor="start"><tspan x="475.0">Paquete de evidencia comercial</tspan></text><text x="475.0" y="491.5" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Índice ejecutivo que conecta decisiones comerciales con</tspan><tspan x="475.0" dy="15.2">evidencia, supuestos e incertidumbres</tspan></text><rect x="798.0" y="457.7" width="54" height="20" rx="10" fill="#e5ddbc" stroke="#cec08c" stroke-width="1"/><text x="825.0" y="471.7" font-size="11" fill="#6e5e20" font-weight="700" text-anchor="middle">↔ 1, 2, 5</text><text x="40" y="559.86" font-size="11.5" fill="#ac9539" font-weight="700" letter-spacing="1.4">QUÉ SE MIDE: NUMERADOR SOBRE DENOMINADOR</text><rect x="40.0" y="573.9" width="261.3" height="153.0" rx="8" fill="#f7f3e2" stroke="#cec08c" stroke-width="1.4"/><text x="54.0" y="595.9" font-size="13" fill="#6e5e20" font-weight="700" text-anchor="start"><tspan x="54.0">Cobertura del paquete de</tspan><tspan x="54.0" dy="17.2">evidencia</tspan></text><text x="54.0" y="642.2" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Secciones obligatorias con</tspan><tspan x="54.0" dy="15.2">evidencia, supuesto e incertidumbre</tspan><tspan x="54.0" dy="15.2">declarados</tspan></text><line x1="54.0" y1="693.7" x2="287.3" y2="693.7" stroke="#ac9539" stroke-width="2"/><text x="54.0" y="711.7" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="54.0">Secciones requeridas</tspan></text><rect x="319.3" y="573.9" width="261.3" height="153.0" rx="8" fill="#f7f3e2" stroke="#cec08c" stroke-width="1.4"/><text x="333.3" y="595.9" font-size="13" fill="#6e5e20" font-weight="700" text-anchor="start"><tspan x="333.3">Coherencia aritmética verificada</tspan></text><text x="333.3" y="625.0" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="333.3">Relaciones que cuadran entre</tspan><tspan x="333.3" dy="15.2">indicadores</tspan></text><line x1="333.3" y1="661.4" x2="566.7" y2="661.4" stroke="#ac9539" stroke-width="2"/><text x="333.3" y="679.4" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="333.3">Relaciones verificables</tspan></text><rect x="598.7" y="573.9" width="261.3" height="153.0" rx="8" fill="#f7f3e2" stroke="#cec08c" stroke-width="1.4"/><text x="612.7" y="595.9" font-size="13" fill="#6e5e20" font-weight="700" text-anchor="start"><tspan x="612.7">Confianza del forecast</tspan></text><text x="612.7" y="625.0" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="612.7">Nivel sustentado en calidad y</tspan><tspan x="612.7" dy="15.2">vigencia de evidencia, cobertura,</tspan><tspan x="612.7" dy="15.2">concentración y precisión histórica</tspan></text><text x="40" y="760.9" font-size="11.5" fill="#ac9539" font-weight="700" letter-spacing="1.4">FRONTERA DE APLICACIÓN</text><rect x="40" y="770.9" width="820" height="81.5" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.4"/><polygon points="70,796.65 52,825.65 88,825.65" fill="#c2410c"/><text x="70" y="822.65" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">!</text><text x="106" y="794.9" font-size="12.5" fill="#7c2d12" font-weight="400" text-anchor="start"><tspan x="106">El paquete comercial alimenta una proyección financiera posterior, pero no modela estados financieros ni</tspan><tspan x="106" dy="16.5">reemplaza ese trabajo. Con datos simulados demuestra diseño, no desempeño; debe declararse el origen y la</tspan><tspan x="106" dy="16.5">incertidumbre de cada serie.</tspan></text><text x="40" y="880.4" font-size="11.5" fill="#ac9539" font-weight="700" letter-spacing="1.4">ERROR FRECUENTE Y SU CORRECCIÓN</text><rect x="40" y="890.4" width="380.0" height="77.0" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/><text x="54" y="912.4" font-size="11" fill="#b91c1c" font-weight="700" text-anchor="start"><tspan x="54">Síntoma</tspan></text><text x="54" y="930.4" font-size="12.5" fill="#7f1d1d" font-weight="400" text-anchor="start"><tspan x="54">Presentar el paquete como si todas sus cifras</tspan><tspan x="54" dy="16.5">fueran hechos</tspan></text><line x1="426.0" y1="928.9" x2="469.0" y2="928.9" stroke="#ac9539" stroke-width="2.6" stroke-linecap="round"/><polygon points="474.0,928.9 465.9,932.8 465.9,925.0" fill="#ac9539"/><rect x="480.0" y="890.4" width="380.0" height="77.0" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.4"/><text x="494.0" y="912.4" font-size="11" fill="#15803d" font-weight="700" text-anchor="start"><tspan x="494.0">Corrección</tspan></text><text x="494.0" y="930.4" font-size="12.5" fill="#14532d" font-weight="400" text-anchor="start"><tspan x="494.0">Etiqueta dato, estimación, hipótesis o inferencia y</tspan><tspan x="494.0" dy="16.5">comprueba la coherencia antes de presentar.</tspan></text></svg>