<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1123" width="900" height="1123" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif"><title id="t">Modelo mental · Diferenciación</title><desc id="d">Modelo mental de la clase 04.08: Diferenciación. Método en 5 pasos; 4 conceptos; 3 señales de medición.</desc><rect x="0" y="0" width="900" height="1123" rx="14" fill="#ffffff"/><rect x="0" y="0" width="900" height="64" rx="14" fill="#20646e"/><rect x="0" y="40" width="900" height="24" fill="#20646e"/><text x="40" y="28" font-size="12" fill="#bce0e5" font-weight="700" letter-spacing="1.6">MODELO MENTAL · CLASE 04.08 · PARTE 04</text><text x="40" y="52" font-size="21" fill="#ffffff" font-weight="700">Diferenciación</text><text x="40" y="84" font-size="11.5" fill="#399cac" font-weight="700" letter-spacing="1.4">MÉTODO PASO A PASO</text><path d="M66.0,159.0 V202.5 H158.5" fill="none" stroke="#399cac" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="160.5,202.5 151.5,197.5 151.5,207.5" fill="#399cac"/><path d="M188.5,232.0 V275.5 H281.0" fill="none" stroke="#399cac" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="283.0,275.5 274.0,270.5 274.0,280.5" fill="#399cac"/><path d="M311.0,305.0 V348.5 H403.5" fill="none" stroke="#399cac" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="405.5,348.5 396.5,343.5 396.5,353.5" fill="#399cac"/><path d="M433.5,378.0 V421.5 H526.0" fill="none" stroke="#399cac" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="528.0,421.5 519.0,416.5 519.0,426.5" fill="#399cac"/><rect x="40.0" y="100.0" width="330" height="59.0" rx="10" fill="#e2f5f7" stroke="#8cc5ce" stroke-width="1.4"/><text x="54.0" y="122.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Listar las diferencias reales de la oferta</tspan></text><circle cx="42.0" cy="102.0" r="14" fill="#20646e"/><text x="42.0" y="106.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><rect x="162.5" y="173.0" width="330" height="59.0" rx="10" fill="#e2f5f7" stroke="#8cc5ce" stroke-width="1.4"/><text x="176.5" y="195.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="176.5">Verificar cuáles el cliente valora con</tspan><tspan x="176.5" dy="16.5">evidencia</tspan></text><circle cx="164.5" cy="175.0" r="14" fill="#20646e"/><text x="164.5" y="179.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><rect x="285.0" y="246.0" width="330" height="59.0" rx="10" fill="#e2f5f7" stroke="#8cc5ce" stroke-width="1.4"/><text x="299.0" y="268.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="299.0">Evaluar si son perceptibles antes de comprar</tspan></text><circle cx="287.0" cy="248.0" r="14" fill="#20646e"/><text x="287.0" y="252.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><rect x="407.5" y="319.0" width="330" height="59.0" rx="10" fill="#e2f5f7" stroke="#8cc5ce" stroke-width="1.4"/><text x="421.5" y="341.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="421.5">Estimar el tiempo de imitación de cada una</tspan></text><circle cx="409.5" cy="321.0" r="14" fill="#20646e"/><text x="409.5" y="325.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">4</text><rect x="530.0" y="392.0" width="330" height="59.0" rx="10" fill="#e2f5f7" stroke="#8cc5ce" stroke-width="1.4"/><text x="544.0" y="414.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="544.0">Diseñar señales para las diferencias no</tspan><tspan x="544.0" dy="16.5">perceptibles</tspan></text><circle cx="532.0" cy="394.0" r="14" fill="#20646e"/><text x="532.0" y="398.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">5</text><text x="40" y="493.0" font-size="11.5" fill="#399cac" font-weight="700" letter-spacing="1.4">CONCEPTOS Y DÓNDE ACTÚAN EN EL MÉTODO</text><rect x="40.0" y="507.0" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#8cc5ce" stroke-width="1.4"/><rect x="40.0" y="515.0" width="5" height="62.2" rx="2" fill="#399cac"/><text x="56.0" y="529.0" font-size="13.5" fill="#20646e" font-weight="700" text-anchor="start"><tspan x="56.0">Diferencia valorada</tspan></text><text x="56.0" y="548.8" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Atributo que el cliente considera relevante para su</tspan><tspan x="56.0" dy="15.2">decisión</tspan></text><rect x="379.0" y="515.0" width="54" height="20" rx="10" fill="#bce0e5" stroke="#8cc5ce" stroke-width="1"/><text x="406.0" y="529.0" font-size="11" fill="#20646e" font-weight="700" text-anchor="middle">↔ 1, 2, 5</text><rect x="459.0" y="507.0" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#8cc5ce" stroke-width="1.4"/><rect x="459.0" y="515.0" width="5" height="62.2" rx="2" fill="#399cac"/><text x="475.0" y="529.0" font-size="13.5" fill="#20646e" font-weight="700" text-anchor="start"><tspan x="475.0">Diferencia perceptible</tspan></text><text x="475.0" y="548.8" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Atributo que el cliente puede verificar antes de comprar</tspan></text><rect x="798.0" y="515.0" width="54" height="20" rx="10" fill="#bce0e5" stroke="#8cc5ce" stroke-width="1"/><text x="825.0" y="529.0" font-size="11" fill="#20646e" font-weight="700" text-anchor="middle">↔ 1, 2, 3, 5</text><rect x="40.0" y="599.2" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#8cc5ce" stroke-width="1.4"/><rect x="40.0" y="607.2" width="5" height="62.2" rx="2" fill="#399cac"/><text x="56.0" y="621.2" font-size="13.5" fill="#20646e" font-weight="700" text-anchor="start"><tspan x="56.0">Diferencia defendible</tspan></text><text x="56.0" y="641.0" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Atributo cuya imitación exige tiempo, inversión o</tspan><tspan x="56.0" dy="15.2">capacidades que el competidor no tiene</tspan></text><rect x="379.0" y="607.2" width="54" height="20" rx="10" fill="#bce0e5" stroke="#8cc5ce" stroke-width="1"/><text x="406.0" y="621.2" font-size="11" fill="#20646e" font-weight="700" text-anchor="middle">↔ 1, 4, 5</text><rect x="459.0" y="599.2" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#8cc5ce" stroke-width="1.4"/><rect x="459.0" y="607.2" width="5" height="62.2" rx="2" fill="#399cac"/><text x="475.0" y="621.2" font-size="13.5" fill="#20646e" font-weight="700" text-anchor="start"><tspan x="475.0">Señal de calidad</tspan></text><text x="475.0" y="641.0" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Evidencia observable que comunica una diferencia difícil</tspan><tspan x="475.0" dy="15.2">de verificar directamente</tspan></text><rect x="798.0" y="607.2" width="54" height="20" rx="10" fill="#bce0e5" stroke="#8cc5ce" stroke-width="1"/><text x="825.0" y="621.2" font-size="11" fill="#20646e" font-weight="700" text-anchor="middle">↔ 2, 5</text><text x="40" y="709.3600000000001" font-size="11.5" fill="#399cac" font-weight="700" letter-spacing="1.4">QUÉ SE MIDE: NUMERADOR SOBRE DENOMINADOR</text><rect x="40.0" y="723.4" width="261.3" height="137.9" rx="8" fill="#e2f5f7" stroke="#8cc5ce" stroke-width="1.4"/><text x="54.0" y="745.4" font-size="13" fill="#20646e" font-weight="700" text-anchor="start"><tspan x="54.0">Menciones espontáneas de la</tspan><tspan x="54.0" dy="17.2">diferencia</tspan></text><text x="54.0" y="791.7" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Clientes que citan el atributo como</tspan><tspan x="54.0" dy="15.2">razón de elección</tspan></text><line x1="54.0" y1="828.0" x2="287.3" y2="828.0" stroke="#399cac" stroke-width="2"/><text x="54.0" y="846.0" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="54.0">Clientes ganados</tspan></text><rect x="319.3" y="723.4" width="261.3" height="137.9" rx="8" fill="#e2f5f7" stroke="#8cc5ce" stroke-width="1.4"/><text x="333.3" y="745.4" font-size="13" fill="#20646e" font-weight="700" text-anchor="start"><tspan x="333.3">Prima de precio sostenida</tspan></text><text x="333.3" y="774.5" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="333.3">Diferencia porcentual de precio</tspan><tspan x="333.3" dy="15.2">efectivo frente al competidor,</tspan><tspan x="333.3" dy="15.2">sostenida en el tiempo</tspan></text><rect x="598.7" y="723.4" width="261.3" height="137.9" rx="8" fill="#e2f5f7" stroke="#8cc5ce" stroke-width="1.4"/><text x="612.7" y="745.4" font-size="13" fill="#20646e" font-weight="700" text-anchor="start"><tspan x="612.7">Tiempo de imitación observado</tspan></text><text x="612.7" y="774.5" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="612.7">Meses desde el lanzamiento hasta que</tspan><tspan x="612.7" dy="15.2">un competidor ofrece un atributo</tspan><tspan x="612.7" dy="15.2">equivalente</tspan></text><text x="40" y="895.2200000000001" font-size="11.5" fill="#399cac" font-weight="700" letter-spacing="1.4">FRONTERA DE APLICACIÓN</text><rect x="40" y="905.2" width="820" height="65.0" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.4"/><polygon points="70,922.7200000000001 52,951.7200000000001 88,951.7200000000001" fill="#c2410c"/><text x="70" y="948.7200000000001" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">!</text><text x="106" y="929.2" font-size="12.5" fill="#7c2d12" font-weight="400" text-anchor="start"><tspan x="106">Una diferencia defendible hoy puede dejar de serlo con un cambio tecnológico. La revisión debe ser</tspan><tspan x="106" dy="16.5">periódica y no un ejercicio de una sola vez.</tspan></text><text x="40" y="998.2200000000001" font-size="11.5" fill="#399cac" font-weight="700" letter-spacing="1.4">ERROR FRECUENTE Y SU CORRECCIÓN</text><rect x="40" y="1008.2" width="380.0" height="77.0" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/><text x="54" y="1030.2" font-size="11" fill="#b91c1c" font-weight="700" text-anchor="start"><tspan x="54">Síntoma</tspan></text><text x="54" y="1048.2" font-size="12.5" fill="#7f1d1d" font-weight="400" text-anchor="start"><tspan x="54">Declarar diferencias que el cliente no puede</tspan><tspan x="54" dy="16.5">verificar</tspan></text><line x1="426.0" y1="1046.7" x2="469.0" y2="1046.7" stroke="#399cac" stroke-width="2.6" stroke-linecap="round"/><polygon points="474.0,1046.7 465.9,1050.6 465.9,1042.8" fill="#399cac"/><rect x="480.0" y="1008.2" width="380.0" height="77.0" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.4"/><text x="494.0" y="1030.2" font-size="11" fill="#15803d" font-weight="700" text-anchor="start"><tspan x="494.0">Corrección</tspan></text><text x="494.0" y="1048.2" font-size="12.5" fill="#14532d" font-weight="400" text-anchor="start"><tspan x="494.0">Convierte cada diferencia no perceptible en una</tspan><tspan x="494.0" dy="16.5">señal comprobable: garantía, prueba, dato público.</tspan></text></svg>