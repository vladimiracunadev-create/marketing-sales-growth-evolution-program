<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 940" width="900" height="940" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif"><title id="t">Modelo mental · Elasticidad y sensibilidad al precio</title><desc id="d">Modelo mental de la clase 07.06: Elasticidad y sensibilidad al precio. Método en 5 pasos; 4 conceptos; 3 señales de medición.</desc><rect x="0" y="0" width="900" height="940" rx="14" fill="#ffffff"/><rect x="0" y="0" width="900" height="64" rx="14" fill="#6e2048"/><rect x="0" y="40" width="900" height="24" fill="#6e2048"/><text x="40" y="28" font-size="12" fill="#e5bcd1" font-weight="700" letter-spacing="1.6">MODELO MENTAL · CLASE 07.06 · PARTE 07</text><text x="40" y="52" font-size="21" fill="#ffffff" font-weight="700">Elasticidad y sensibilidad al precio</text><text x="40" y="84" font-size="11.5" fill="#ac3974" font-weight="700" letter-spacing="1.4">MÉTODO PASO A PASO</text><rect x="40.0" y="100" width="246.7" height="75.5" rx="10" fill="#f7e2ed" stroke="#ce8cae" stroke-width="1.4"/><text x="54.0" y="122" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Identificar los factores de</tspan><tspan x="54.0" dy="16.5">sensibilidad presentes en el</tspan><tspan x="54.0" dy="16.5">segmento</tspan></text><circle cx="42.0" cy="102.0" r="14" fill="#6e2048"/><text x="42.0" y="106.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><rect x="326.7" y="100" width="246.7" height="75.5" rx="10" fill="#f7e2ed" stroke="#ce8cae" stroke-width="1.4"/><text x="340.7" y="122" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="340.7">Diseñar una prueba con variación</tspan><tspan x="340.7" dy="16.5">real y grupos comparables</tspan></text><circle cx="328.7" cy="102.0" r="14" fill="#6e2048"/><text x="328.7" y="106.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><rect x="613.3" y="100" width="246.7" height="75.5" rx="10" fill="#f7e2ed" stroke="#ce8cae" stroke-width="1.4"/><text x="627.3" y="122" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="627.3">Estimar la respuesta con</tspan><tspan x="627.3" dy="16.5">intervalo de incertidumbre</tspan></text><circle cx="615.3" cy="102.0" r="14" fill="#6e2048"/><text x="615.3" y="106.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><rect x="613.3" y="213.5" width="246.7" height="59.0" rx="10" fill="#f7e2ed" stroke="#ce8cae" stroke-width="1.4"/><text x="627.3" y="235.5" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="627.3">Verificar si la respuesta</tspan><tspan x="627.3" dy="16.5">difiere por segmento</tspan></text><circle cx="615.3" cy="215.5" r="14" fill="#6e2048"/><text x="615.3" y="220.0" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">4</text><rect x="326.7" y="213.5" width="246.7" height="59.0" rx="10" fill="#f7e2ed" stroke="#ce8cae" stroke-width="1.4"/><text x="340.7" y="235.5" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="340.7">Decidir el nivel de precio y su</tspan><tspan x="340.7" dy="16.5">condición de revisión</tspan></text><circle cx="328.7" cy="215.5" r="14" fill="#6e2048"/><text x="328.7" y="220.0" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">5</text><line x1="289.7" y1="137.8" x2="318.7" y2="137.8" stroke="#ac3974" stroke-width="2.2" stroke-linecap="round"/><polygon points="323.7,137.8 315.6,141.7 315.6,133.8" fill="#ac3974"/><line x1="576.3" y1="137.8" x2="605.3" y2="137.8" stroke="#ac3974" stroke-width="2.2" stroke-linecap="round"/><polygon points="610.3,137.8 602.2,141.7 602.2,133.8" fill="#ac3974"/><line x1="736.7" y1="177.5" x2="736.7" y2="205.5" stroke="#ac3974" stroke-width="2.2" stroke-linecap="round"/><polygon points="736.7,210.5 732.8,202.4 740.6,202.4" fill="#ac3974"/><line x1="610.3" y1="243.0" x2="581.3" y2="243.0" stroke="#ac3974" stroke-width="2.2" stroke-linecap="round"/><polygon points="576.3,243.0 584.4,239.1 584.4,246.9" fill="#ac3974"/><text x="40" y="310.5" font-size="11.5" fill="#ac3974" font-weight="700" letter-spacing="1.4">CONCEPTOS Y DÓNDE ACTÚAN EN EL MÉTODO</text><rect x="40.0" y="324.5" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#ce8cae" stroke-width="1.4"/><rect x="40.0" y="332.5" width="5" height="62.2" rx="2" fill="#ac3974"/><text x="56.0" y="346.5" font-size="13.5" fill="#6e2048" font-weight="700" text-anchor="start"><tspan x="56.0">Elasticidad precio</tspan></text><text x="56.0" y="366.3" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Variación porcentual de la cantidad ante una variación</tspan><tspan x="56.0" dy="15.2">porcentual del precio</tspan></text><rect x="379.0" y="332.5" width="54" height="20" rx="10" fill="#e5bcd1" stroke="#ce8cae" stroke-width="1"/><text x="406.0" y="346.5" font-size="11" fill="#6e2048" font-weight="700" text-anchor="middle">↔ 5</text><rect x="459.0" y="324.5" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#ce8cae" stroke-width="1.4"/><rect x="459.0" y="332.5" width="5" height="62.2" rx="2" fill="#ac3974"/><text x="475.0" y="346.5" font-size="13.5" fill="#6e2048" font-weight="700" text-anchor="start"><tspan x="475.0">Factor de sensibilidad</tspan></text><text x="475.0" y="366.3" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Condición que aumenta o reduce la reacción del cliente</tspan><tspan x="475.0" dy="15.2">ante el precio</tspan></text><rect x="798.0" y="332.5" width="54" height="20" rx="10" fill="#e5bcd1" stroke="#ce8cae" stroke-width="1"/><text x="825.0" y="346.5" font-size="11" fill="#6e2048" font-weight="700" text-anchor="middle">↔ 1, 5</text><rect x="40.0" y="416.7" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#ce8cae" stroke-width="1.4"/><rect x="40.0" y="424.7" width="5" height="62.2" rx="2" fill="#ac3974"/><text x="56.0" y="438.7" font-size="13.5" fill="#6e2048" font-weight="700" text-anchor="start"><tspan x="56.0">Segmentación de sensibilidad</tspan></text><text x="56.0" y="458.5" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Diferencia de elasticidad entre grupos de clientes del</tspan><tspan x="56.0" dy="15.2">mismo mercado</tspan></text><rect x="379.0" y="424.7" width="54" height="20" rx="10" fill="#e5bcd1" stroke="#ce8cae" stroke-width="1"/><text x="406.0" y="438.7" font-size="11" fill="#6e2048" font-weight="700" text-anchor="middle">↔ 1, 4</text><rect x="459.0" y="416.7" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#ce8cae" stroke-width="1.4"/><rect x="459.0" y="424.7" width="5" height="62.2" rx="2" fill="#ac3974"/><text x="475.0" y="438.7" font-size="13.5" fill="#6e2048" font-weight="700" text-anchor="start"><tspan x="475.0">Prueba de precio</tspan></text><text x="475.0" y="458.5" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Experimento controlado que produce variación real para</tspan><tspan x="475.0" dy="15.2">estimar la respuesta</tspan></text><rect x="798.0" y="424.7" width="54" height="20" rx="10" fill="#e5bcd1" stroke="#ce8cae" stroke-width="1"/><text x="825.0" y="438.7" font-size="11" fill="#6e2048" font-weight="700" text-anchor="middle">↔ 2, 3, 5</text><text x="40" y="526.86" font-size="11.5" fill="#ac3974" font-weight="700" letter-spacing="1.4">QUÉ SE MIDE: NUMERADOR SOBRE DENOMINADOR</text><rect x="40.0" y="540.9" width="261.3" height="137.9" rx="8" fill="#f7e2ed" stroke="#ce8cae" stroke-width="1.4"/><text x="54.0" y="562.9" font-size="13" fill="#6e2048" font-weight="700" text-anchor="start"><tspan x="54.0">Elasticidad estimada por</tspan><tspan x="54.0" dy="17.2">segmento</tspan></text><text x="54.0" y="609.2" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Variación porcentual de unidades</tspan></text><line x1="54.0" y1="630.4" x2="287.3" y2="630.4" stroke="#ac3974" stroke-width="2"/><text x="54.0" y="648.4" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="54.0">Variación porcentual de precio, con</tspan><tspan x="54.0" dy="15.2">intervalo</tspan></text><rect x="319.3" y="540.9" width="261.3" height="137.9" rx="8" fill="#f7e2ed" stroke="#ce8cae" stroke-width="1.4"/><text x="333.3" y="562.9" font-size="13" fill="#6e2048" font-weight="700" text-anchor="start"><tspan x="333.3">Tasa de abandono ante alza</tspan></text><text x="333.3" y="592.0" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="333.3">Clientes que se dan de baja tras el</tspan><tspan x="333.3" dy="15.2">aumento</tspan></text><line x1="333.3" y1="628.4" x2="566.7" y2="628.4" stroke="#ac3974" stroke-width="2"/><text x="333.3" y="646.4" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="333.3">Clientes afectados</tspan></text><rect x="598.7" y="540.9" width="261.3" height="137.9" rx="8" fill="#f7e2ed" stroke="#ce8cae" stroke-width="1.4"/><text x="612.7" y="562.9" font-size="13" fill="#6e2048" font-weight="700" text-anchor="start"><tspan x="612.7">Efecto en ingreso total</tspan></text><text x="612.7" y="592.0" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="612.7">Ingreso del grupo tratado</tspan></text><line x1="612.7" y1="613.2" x2="846.0" y2="613.2" stroke="#ac3974" stroke-width="2"/><text x="612.7" y="631.2" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="612.7">Ingreso del grupo de control, en el</tspan><tspan x="612.7" dy="15.2">mismo periodo</tspan></text><text x="40" y="712.72" font-size="11.5" fill="#ac3974" font-weight="700" letter-spacing="1.4">FRONTERA DE APLICACIÓN</text><rect x="40" y="722.7" width="820" height="65.0" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.4"/><polygon points="70,740.22 52,769.22 88,769.22" fill="#c2410c"/><text x="70" y="766.22" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">!</text><text x="106" y="746.7" font-size="12.5" fill="#7c2d12" font-weight="400" text-anchor="start"><tspan x="106">Las pruebas de precio con clientes reales tienen consecuencias comerciales y éticas: cobrar distinto a</tspan><tspan x="106" dy="16.5">personas equivalentes sin justificación puede constituir discriminación arbitraria.</tspan></text><text x="40" y="815.72" font-size="11.5" fill="#ac3974" font-weight="700" letter-spacing="1.4">ERROR FRECUENTE Y SU CORRECCIÓN</text><rect x="40" y="825.7" width="380.0" height="77.0" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/><text x="54" y="847.7" font-size="11" fill="#b91c1c" font-weight="700" text-anchor="start"><tspan x="54">Síntoma</tspan></text><text x="54" y="865.7" font-size="12.5" fill="#7f1d1d" font-weight="400" text-anchor="start"><tspan x="54">Estimar elasticidad con datos históricos sin</tspan><tspan x="54" dy="16.5">controlar mezcla</tspan></text><line x1="426.0" y1="864.2" x2="469.0" y2="864.2" stroke="#ac3974" stroke-width="2.6" stroke-linecap="round"/><polygon points="474.0,864.2 465.9,868.1 465.9,860.3" fill="#ac3974"/><rect x="480.0" y="825.7" width="380.0" height="77.0" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.4"/><text x="494.0" y="847.7" font-size="11" fill="#15803d" font-weight="700" text-anchor="start"><tspan x="494.0">Corrección</tspan></text><text x="494.0" y="865.7" font-size="12.5" fill="#14532d" font-weight="400" text-anchor="start"><tspan x="494.0">Usa grupos comparables y controla estacionalidad,</tspan><tspan x="494.0" dy="16.5">canal y mezcla de segmentos.</tspan></text></svg>