<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 949" width="900" height="949" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif"><title id="t">Modelo mental · Revenue Operations como integración</title><desc id="d">Modelo mental de la clase 01.12: Revenue Operations como integración. Método en 5 pasos; 4 conceptos; 3 señales de medición.</desc><rect x="0" y="0" width="900" height="949" rx="14" fill="#ffffff"/><rect x="0" y="0" width="900" height="64" rx="14" fill="#6e5d20"/><rect x="0" y="40" width="900" height="24" fill="#6e5d20"/><text x="40" y="28" font-size="12" fill="#e5dcbc" font-weight="700" letter-spacing="1.6">MODELO MENTAL · CLASE 01.12 · PARTE 01</text><text x="40" y="52" font-size="21" fill="#ffffff" font-weight="700">Revenue Operations como integración</text><text x="40" y="84" font-size="11.5" fill="#ac9339" font-weight="700" letter-spacing="1.4">MÉTODO PASO A PASO</text><line x1="450.0" y1="94.0" x2="450.0" y2="300.5" stroke="#cebf8c" stroke-width="3" stroke-linecap="round"/><line x1="450.0" y1="129.5" x2="406.0" y2="129.5" stroke="#cebf8c" stroke-width="2"/><rect x="56.0" y="100" width="350" height="59.0" rx="10" fill="#f7f3e2" stroke="#cebf8c" stroke-width="1.4"/><text x="70.0" y="122" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="70.0">Inventariar las definiciones actuales de las</tspan><tspan x="70.0" dy="16.5">métricas críticas</tspan></text><circle cx="450.0" cy="129.5" r="15" fill="#6e5d20"/><text x="450.0" y="134.0" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><line x1="450.0" y1="167.5" x2="494.0" y2="167.5" stroke="#cebf8c" stroke-width="2"/><rect x="494.0" y="138" width="350" height="59.0" rx="10" fill="#f7f3e2" stroke="#cebf8c" stroke-width="1.4"/><text x="508.0" y="160" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="508.0">Acordar una definición única por métrica y</tspan><tspan x="508.0" dy="16.5">documentarla</tspan></text><circle cx="450.0" cy="167.5" r="15" fill="#6e5d20"/><text x="450.0" y="172.0" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><line x1="450.0" y1="205.5" x2="406.0" y2="205.5" stroke="#cebf8c" stroke-width="2"/><rect x="56.0" y="176" width="350" height="59.0" rx="10" fill="#f7f3e2" stroke="#cebf8c" stroke-width="1.4"/><text x="70.0" y="198" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="70.0">Modelar las entidades y estados que la</tspan><tspan x="70.0" dy="16.5">sostienen</tspan></text><circle cx="450.0" cy="205.5" r="15" fill="#6e5d20"/><text x="450.0" y="210.0" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><line x1="450.0" y1="235.2" x2="494.0" y2="235.2" stroke="#cebf8c" stroke-width="2"/><rect x="494.0" y="214" width="350" height="42.5" rx="10" fill="#f7f3e2" stroke="#cebf8c" stroke-width="1.4"/><text x="508.0" y="236" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="508.0">Establecer acuerdos de servicio entre áreas</tspan></text><circle cx="450.0" cy="235.2" r="15" fill="#6e5d20"/><text x="450.0" y="239.8" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">4</text><line x1="450.0" y1="273.2" x2="406.0" y2="273.2" stroke="#cebf8c" stroke-width="2"/><rect x="56.0" y="252" width="350" height="42.5" rx="10" fill="#f7f3e2" stroke="#cebf8c" stroke-width="1.4"/><text x="70.0" y="274" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="70.0">Instalar alertas sobre las rupturas más caras</tspan></text><circle cx="450.0" cy="273.2" r="15" fill="#6e5d20"/><text x="450.0" y="277.8" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">5</text><text x="40" y="336.5" font-size="11.5" fill="#ac9339" font-weight="700" letter-spacing="1.4">CONCEPTOS Y DÓNDE ACTÚAN EN EL MÉTODO</text><rect x="40.0" y="350.5" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#cebf8c" stroke-width="1.4"/><rect x="40.0" y="358.5" width="5" height="62.2" rx="2" fill="#ac9339"/><text x="56.0" y="372.5" font-size="13.5" fill="#6e5d20" font-weight="700" text-anchor="start"><tspan x="56.0">Modelo de datos de ingresos</tspan></text><text x="56.0" y="392.3" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Conjunto de entidades, estados y relaciones que</tspan><tspan x="56.0" dy="15.2">representan el recorrido comercial completo</tspan></text><rect x="379.0" y="358.5" width="54" height="20" rx="10" fill="#e5dcbc" stroke="#cebf8c" stroke-width="1"/><text x="406.0" y="372.5" font-size="11" fill="#6e5d20" font-weight="700" text-anchor="middle">↔ 3</text><rect x="459.0" y="350.5" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#cebf8c" stroke-width="1.4"/><rect x="459.0" y="358.5" width="5" height="62.2" rx="2" fill="#ac9339"/><text x="475.0" y="372.5" font-size="13.5" fill="#6e5d20" font-weight="700" text-anchor="start"><tspan x="475.0">Definición única de métrica</tspan></text><text x="475.0" y="392.3" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Acuerdo escrito sobre numerador, denominador, ventana y</tspan><tspan x="475.0" dy="15.2">fuente de cada indicador</tspan></text><rect x="798.0" y="358.5" width="54" height="20" rx="10" fill="#e5dcbc" stroke="#cebf8c" stroke-width="1"/><text x="825.0" y="372.5" font-size="11" fill="#6e5d20" font-weight="700" text-anchor="middle">↔ 1, 2</text><rect x="40.0" y="442.7" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#cebf8c" stroke-width="1.4"/><rect x="40.0" y="450.7" width="5" height="62.2" rx="2" fill="#ac9339"/><text x="56.0" y="464.7" font-size="13.5" fill="#6e5d20" font-weight="700" text-anchor="start"><tspan x="56.0">Acuerdo de nivel de servicio interno</tspan></text><text x="56.0" y="484.5" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Compromiso explícito de tiempo y calidad entre dos áreas</tspan><tspan x="56.0" dy="15.2">del motor de ingresos</tspan></text><rect x="379.0" y="450.7" width="54" height="20" rx="10" fill="#e5dcbc" stroke="#cebf8c" stroke-width="1"/><text x="406.0" y="464.7" font-size="11" fill="#6e5d20" font-weight="700" text-anchor="middle">↔ 4</text><rect x="459.0" y="442.7" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#cebf8c" stroke-width="1.4"/><rect x="459.0" y="450.7" width="5" height="62.2" rx="2" fill="#ac9339"/><text x="475.0" y="464.7" font-size="13.5" fill="#6e5d20" font-weight="700" text-anchor="start"><tspan x="475.0">Observabilidad del proceso</tspan></text><text x="475.0" y="484.5" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Capacidad de detectar que un flujo se rompió antes de que</tspan><tspan x="475.0" dy="15.2">lo note un cliente</tspan></text><text x="40" y="552.86" font-size="11.5" fill="#ac9339" font-weight="700" letter-spacing="1.4">QUÉ SE MIDE: NUMERADOR SOBRE DENOMINADOR</text><rect x="40.0" y="566.9" width="261.3" height="120.7" rx="8" fill="#f7f3e2" stroke="#cebf8c" stroke-width="1.4"/><text x="54.0" y="588.9" font-size="13" fill="#6e5d20" font-weight="700" text-anchor="start"><tspan x="54.0">Discrepancia entre informes</tspan></text><text x="54.0" y="618.0" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Diferencia porcentual entre el mismo</tspan><tspan x="54.0" dy="15.2">indicador reportado por dos áreas,</tspan><tspan x="54.0" dy="15.2">medida mensualmente</tspan></text><rect x="319.3" y="566.9" width="261.3" height="120.7" rx="8" fill="#f7f3e2" stroke="#cebf8c" stroke-width="1.4"/><text x="333.3" y="588.9" font-size="13" fill="#6e5d20" font-weight="700" text-anchor="start"><tspan x="333.3">Completitud de campos críticos</tspan></text><text x="333.3" y="618.0" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="333.3">Registros con todos los campos</tspan><tspan x="333.3" dy="15.2">obligatorios completos</tspan></text><line x1="333.3" y1="654.4" x2="566.7" y2="654.4" stroke="#ac9339" stroke-width="2"/><text x="333.3" y="672.4" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="333.3">Registros creados en el periodo</tspan></text><rect x="598.7" y="566.9" width="261.3" height="120.7" rx="8" fill="#f7f3e2" stroke="#cebf8c" stroke-width="1.4"/><text x="612.7" y="588.9" font-size="13" fill="#6e5d20" font-weight="700" text-anchor="start"><tspan x="612.7">Tiempo de detección de ruptura</tspan></text><text x="612.7" y="618.0" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="612.7">Horas entre que un flujo</tspan><tspan x="612.7" dy="15.2">automatizado falla y que alguien lo</tspan><tspan x="612.7" dy="15.2">detecta</tspan></text><text x="40" y="721.56" font-size="11.5" fill="#ac9339" font-weight="700" letter-spacing="1.4">FRONTERA DE APLICACIÓN</text><rect x="40" y="731.6" width="820" height="65.0" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.4"/><polygon points="70,749.06 52,778.06 88,778.06" fill="#c2410c"/><text x="70" y="775.06" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">!</text><text x="106" y="755.6" font-size="12.5" fill="#7c2d12" font-weight="400" text-anchor="start"><tspan x="106">RevOps no resuelve conflictos de incentivos. Si la compensación premia comportamientos contradictorios</tspan><tspan x="106" dy="16.5">entre áreas, la integración de datos hará visible el conflicto pero no lo eliminará.</tspan></text><text x="40" y="824.56" font-size="11.5" fill="#ac9339" font-weight="700" letter-spacing="1.4">ERROR FRECUENTE Y SU CORRECCIÓN</text><rect x="40" y="834.6" width="380.0" height="77.0" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/><text x="54" y="856.6" font-size="11" fill="#b91c1c" font-weight="700" text-anchor="start"><tspan x="54">Síntoma</tspan></text><text x="54" y="874.6" font-size="12.5" fill="#7f1d1d" font-weight="400" text-anchor="start"><tspan x="54">Comprar una herramienta antes de acordar</tspan><tspan x="54" dy="16.5">definiciones</tspan></text><line x1="426.0" y1="873.1" x2="469.0" y2="873.1" stroke="#ac9339" stroke-width="2.6" stroke-linecap="round"/><polygon points="474.0,873.1 465.9,877.0 465.9,869.1" fill="#ac9339"/><rect x="480.0" y="834.6" width="380.0" height="77.0" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.4"/><text x="494.0" y="856.6" font-size="11" fill="#15803d" font-weight="700" text-anchor="start"><tspan x="494.0">Corrección</tspan></text><text x="494.0" y="874.6" font-size="12.5" fill="#14532d" font-weight="400" text-anchor="start"><tspan x="494.0">Documenta las definiciones y los acuerdos de</tspan><tspan x="494.0" dy="16.5">servicio primero; la herramienta después.</tspan></text></svg>