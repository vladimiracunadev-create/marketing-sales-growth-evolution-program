<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1408" width="900" height="1408" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif"><title id="t">Modelo mental · Forecast</title><desc id="d">Modelo mental de la clase 16.07: Forecast. Método en 5 pasos; 4 conceptos; 3 señales de medición.</desc><rect x="0" y="0" width="900" height="1408" rx="14" fill="#ffffff"/><rect x="0" y="0" width="900" height="64" rx="14" fill="#6e4a20"/><rect x="0" y="40" width="900" height="24" fill="#6e4a20"/><text x="40" y="28" font-size="12" fill="#e5d2bc" font-weight="700" letter-spacing="1.6">MODELO MENTAL · CLASE 16.07 · PARTE 16</text><text x="40" y="52" font-size="21" fill="#ffffff" font-weight="700">Forecast</text><text x="40" y="84" font-size="11.5" fill="#ac7639" font-weight="700" letter-spacing="1.4">MÉTODO PASO A PASO</text><ellipse cx="450.0" cy="429.6" rx="330.0" ry="269.4" fill="none" stroke="#ceaf8c" stroke-width="2" stroke-dasharray="3 8" stroke-linecap="round"/><polygon points="653.4,217.3 636.1,213.3 641.7,204.0" fill="#ac7639"/><polygon points="759.8,523.1 761.0,505.4 771.1,509.4" fill="#ac7639"/><polygon points="439.0,699.0 455.9,693.5 455.9,704.4" fill="#ac7639"/><polygon points="132.1,502.6 143.4,516.3 133.3,520.3" fill="#ac7639"/><polygon points="265.5,206.1 253.7,219.3 248.2,210.1" fill="#ac7639"/><circle cx="450.0" cy="429.6" r="100.0" fill="#e5d2bc" stroke="#ceaf8c" stroke-width="1.6"/><text x="450.0" y="431.7" font-size="15" fill="#6e4a20" font-weight="700" text-anchor="middle"><tspan x="450.0">Forecast</tspan></text><rect x="361.0" y="130.8" width="178" height="59.0" rx="10" fill="#f7ede2" stroke="#ceaf8c" stroke-width="1.4"/><text x="373.0" y="152.8" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="373.0">Declarar el método y</tspan><tspan x="373.0" dy="16.5">su alcance</tspan></text><circle cx="363.0" cy="132.8" r="14" fill="#6e4a20"/><text x="363.0" y="137.2" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><rect x="674.8" y="300.4" width="178" height="92.0" rx="10" fill="#f7ede2" stroke="#ceaf8c" stroke-width="1.4"/><text x="686.8" y="322.4" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="686.8">Separar compromiso,</tspan><tspan x="686.8" dy="16.5">probable y mejor caso</tspan><tspan x="686.8" dy="16.5">con criterios</tspan><tspan x="686.8" dy="16.5">verificables</tspan></text><circle cx="676.8" cy="302.4" r="14" fill="#6e4a20"/><text x="676.8" y="306.9" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><rect x="555.0" y="601.5" width="178" height="92.0" rx="10" fill="#f7ede2" stroke="#ceaf8c" stroke-width="1.4"/><text x="567.0" y="623.5" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="567.0">Contrastar con al</tspan><tspan x="567.0" dy="16.5">menos un método</tspan><tspan x="567.0" dy="16.5">alternativo y con la</tspan><tspan x="567.0" dy="16.5">capacidad disponible</tspan></text><circle cx="557.0" cy="603.5" r="14" fill="#6e4a20"/><text x="557.0" y="608.0" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><rect x="167.0" y="593.3" width="178" height="108.5" rx="10" fill="#f7ede2" stroke="#ceaf8c" stroke-width="1.4"/><text x="179.0" y="615.3" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="179.0">Calibrar la confianza</tspan><tspan x="179.0" dy="16.5">con cobertura,</tspan><tspan x="179.0" dy="16.5">vigencia,</tspan><tspan x="179.0" dy="16.5">concentración y</tspan><tspan x="179.0" dy="16.5">precisión histórica</tspan></text><circle cx="169.0" cy="595.3" r="14" fill="#6e4a20"/><text x="169.0" y="599.8" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">4</text><rect x="47.2" y="300.4" width="178" height="92.0" rx="10" fill="#f7ede2" stroke="#ceaf8c" stroke-width="1.4"/><text x="59.2" y="322.4" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="59.2">Corregir el método con</tspan><tspan x="59.2" dy="16.5">el sesgo observado sin</tspan><tspan x="59.2" dy="16.5">ocultar el intervalo</tspan><tspan x="59.2" dy="16.5">resultante</tspan></text><circle cx="49.2" cy="302.4" r="14" fill="#6e4a20"/><text x="49.2" y="306.9" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">5</text><text x="40" y="795.2" font-size="11.5" fill="#ac7639" font-weight="700" letter-spacing="1.4">CONCEPTOS Y DÓNDE ACTÚAN EN EL MÉTODO</text><rect x="40.0" y="809.2" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#ceaf8c" stroke-width="1.4"/><rect x="40.0" y="817.2" width="5" height="62.2" rx="2" fill="#ac7639"/><text x="56.0" y="831.2" font-size="13.5" fill="#6e4a20" font-weight="700" text-anchor="start"><tspan x="56.0">Método de forecast</tspan></text><text x="56.0" y="851.0" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Regla explícita que convierte el estado del pipeline en</tspan><tspan x="56.0" dy="15.2">una proyección</tspan></text><rect x="379.0" y="817.2" width="54" height="20" rx="10" fill="#e5d2bc" stroke="#ceaf8c" stroke-width="1"/><text x="406.0" y="831.2" font-size="11" fill="#6e4a20" font-weight="700" text-anchor="middle">↔ 1, 3, 5</text><rect x="459.0" y="809.2" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#ceaf8c" stroke-width="1.4"/><rect x="459.0" y="817.2" width="5" height="62.2" rx="2" fill="#ac7639"/><text x="475.0" y="831.2" font-size="13.5" fill="#6e4a20" font-weight="700" text-anchor="start"><tspan x="475.0">Sesgo de optimismo</tspan></text><text x="475.0" y="851.0" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Tendencia sistemática a proyectar más de lo que se cierra</tspan></text><rect x="798.0" y="817.2" width="54" height="20" rx="10" fill="#e5d2bc" stroke="#ceaf8c" stroke-width="1"/><text x="825.0" y="831.2" font-size="11" fill="#6e4a20" font-weight="700" text-anchor="middle">↔ 5</text><rect x="40.0" y="901.4" width="401.0" height="93.4" rx="8" fill="#ffffff" stroke="#ceaf8c" stroke-width="1.4"/><rect x="40.0" y="909.4" width="5" height="77.4" rx="2" fill="#ac7639"/><text x="56.0" y="923.4" font-size="13.5" fill="#6e4a20" font-weight="700" text-anchor="start"><tspan x="56.0">Precisión del forecast</tspan></text><text x="56.0" y="943.2" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Diferencia entre lo proyectado y lo efectivamente cerrado</tspan></text><rect x="379.0" y="909.4" width="54" height="20" rx="10" fill="#e5d2bc" stroke="#ceaf8c" stroke-width="1"/><text x="406.0" y="923.4" font-size="11" fill="#6e4a20" font-weight="700" text-anchor="middle">↔ 4</text><rect x="459.0" y="901.4" width="401.0" height="93.4" rx="8" fill="#ffffff" stroke="#ceaf8c" stroke-width="1.4"/><rect x="459.0" y="909.4" width="5" height="77.4" rx="2" fill="#ac7639"/><text x="475.0" y="923.4" font-size="13.5" fill="#6e4a20" font-weight="700" text-anchor="start"><tspan x="475.0">Confianza del forecast</tspan></text><text x="475.0" y="943.2" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Evaluación auditable basada en evidencia, cobertura,</tspan><tspan x="475.0" dy="15.2">vigencia, concentración y precisión histórica, nunca</tspan><tspan x="475.0" dy="15.2">certeza</tspan></text><rect x="798.0" y="909.4" width="54" height="20" rx="10" fill="#e5d2bc" stroke="#ceaf8c" stroke-width="1"/><text x="825.0" y="923.4" font-size="11" fill="#6e4a20" font-weight="700" text-anchor="middle">↔ 4</text><text x="40" y="1026.7400000000002" font-size="11.5" fill="#ac7639" font-weight="700" letter-spacing="1.4">QUÉ SE MIDE: NUMERADOR SOBRE DENOMINADOR</text><rect x="40.0" y="1040.7" width="261.3" height="105.5" rx="8" fill="#f7ede2" stroke="#ceaf8c" stroke-width="1.4"/><text x="54.0" y="1062.7" font-size="13" fill="#6e4a20" font-weight="700" text-anchor="start"><tspan x="54.0">Precisión del forecast</tspan></text><text x="54.0" y="1091.9" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Diferencia porcentual entre</tspan><tspan x="54.0" dy="15.2">proyección y cierre real, por</tspan><tspan x="54.0" dy="15.2">trimestre</tspan></text><rect x="319.3" y="1040.7" width="261.3" height="105.5" rx="8" fill="#f7ede2" stroke="#ceaf8c" stroke-width="1.4"/><text x="333.3" y="1062.7" font-size="13" fill="#6e4a20" font-weight="700" text-anchor="start"><tspan x="333.3">Sesgo sistemático</tspan></text><text x="333.3" y="1091.9" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="333.3">Promedio de la desviación con signo,</tspan><tspan x="333.3" dy="15.2">por vendedor y por periodo</tspan></text><rect x="598.7" y="1040.7" width="261.3" height="105.5" rx="8" fill="#f7ede2" stroke="#ceaf8c" stroke-width="1.4"/><text x="612.7" y="1062.7" font-size="13" fill="#6e4a20" font-weight="700" text-anchor="start"><tspan x="612.7">Cobertura del pipeline</tspan></text><text x="612.7" y="1091.9" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="612.7">Valor del pipeline</tspan></text><line x1="612.7" y1="1113.1" x2="846.0" y2="1113.1" stroke="#ac7639" stroke-width="2"/><text x="612.7" y="1131.1" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="612.7">La meta del periodo</tspan></text><text x="40" y="1180.2600000000002" font-size="11.5" fill="#ac7639" font-weight="700" letter-spacing="1.4">FRONTERA DE APLICACIÓN</text><rect x="40" y="1190.3" width="820" height="65.0" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.4"/><polygon points="70,1207.7600000000002 52,1236.7600000000002 88,1236.7600000000002" fill="#c2410c"/><text x="70" y="1233.7600000000002" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">!</text><text x="106" y="1214.3" font-size="12.5" fill="#7c2d12" font-weight="400" text-anchor="start"><tspan x="106">Ningún método corrige un pipeline con criterios de etapa débiles. La precisión del forecast es</tspan><tspan x="106" dy="16.5">consecuencia de la disciplina de calificación, no de la fórmula.</tspan></text><text x="40" y="1283.2600000000002" font-size="11.5" fill="#ac7639" font-weight="700" letter-spacing="1.4">ERROR FRECUENTE Y SU CORRECCIÓN</text><rect x="40" y="1293.3" width="380.0" height="77.0" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/><text x="54" y="1315.3" font-size="11" fill="#b91c1c" font-weight="700" text-anchor="start"><tspan x="54">Síntoma</tspan></text><text x="54" y="1333.3" font-size="12.5" fill="#7f1d1d" font-weight="400" text-anchor="start"><tspan x="54">Mantener el método pese a un sesgo sistemático</tspan></text><line x1="426.0" y1="1331.8" x2="469.0" y2="1331.8" stroke="#ac7639" stroke-width="2.6" stroke-linecap="round"/><polygon points="474.0,1331.8 465.9,1335.7 465.9,1327.8" fill="#ac7639"/><rect x="480.0" y="1293.3" width="380.0" height="77.0" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.4"/><text x="494.0" y="1315.3" font-size="11" fill="#15803d" font-weight="700" text-anchor="start"><tspan x="494.0">Corrección</tspan></text><text x="494.0" y="1333.3" font-size="12.5" fill="#14532d" font-weight="400" text-anchor="start"><tspan x="494.0">Mide la desviación con signo por trimestre y</tspan><tspan x="494.0" dy="16.5">corrige el método con ese factor.</tspan></text></svg>