<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 984" width="900" height="984" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif"><title id="t">Modelo mental · Negociación intercultural</title><desc id="d">Modelo mental de la clase 10.12: Negociación intercultural. Método en 5 pasos; 4 conceptos; 3 señales de medición.</desc><rect x="0" y="0" width="900" height="984" rx="14" fill="#ffffff"/><rect x="0" y="0" width="900" height="64" rx="14" fill="#2d6e20"/><rect x="0" y="40" width="900" height="24" fill="#2d6e20"/><text x="40" y="28" font-size="12" fill="#c3e5bc" font-weight="700" letter-spacing="1.6">MODELO MENTAL · CLASE 10.12 · PARTE 10</text><text x="40" y="52" font-size="21" fill="#ffffff" font-weight="700">Negociación intercultural</text><text x="40" y="84" font-size="11.5" fill="#4cac39" font-weight="700" letter-spacing="1.4">MÉTODO PASO A PASO</text><line x1="450.0" y1="94.0" x2="450.0" y2="317.0" stroke="#97ce8c" stroke-width="3" stroke-linecap="round"/><line x1="450.0" y1="129.5" x2="406.0" y2="129.5" stroke="#97ce8c" stroke-width="2"/><rect x="56.0" y="100" width="350" height="59.0" rx="10" fill="#e6f7e2" stroke="#97ce8c" stroke-width="1.4"/><text x="70.0" y="122" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="70.0">Investigar las normas del contexto antes de</tspan><tspan x="70.0" dy="16.5">negociar</tspan></text><circle cx="450.0" cy="129.5" r="15" fill="#2d6e20"/><text x="450.0" y="134.0" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><line x1="450.0" y1="167.5" x2="494.0" y2="167.5" stroke="#97ce8c" stroke-width="2"/><rect x="494.0" y="138" width="350" height="59.0" rx="10" fill="#e6f7e2" stroke="#97ce8c" stroke-width="1.4"/><text x="508.0" y="160" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="508.0">Preguntar explícitamente cómo se decide en esa</tspan><tspan x="508.0" dy="16.5">organización</tspan></text><circle cx="450.0" cy="167.5" r="15" fill="#2d6e20"/><text x="450.0" y="172.0" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><line x1="450.0" y1="205.5" x2="406.0" y2="205.5" stroke="#97ce8c" stroke-width="2"/><rect x="56.0" y="176" width="350" height="59.0" rx="10" fill="#e6f7e2" stroke="#97ce8c" stroke-width="1.4"/><text x="70.0" y="198" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="70.0">Ajustar ritmo y formalidad sin cambiar los</tspan><tspan x="70.0" dy="16.5">criterios</tspan></text><circle cx="450.0" cy="205.5" r="15" fill="#2d6e20"/><text x="450.0" y="210.0" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><line x1="450.0" y1="243.5" x2="494.0" y2="243.5" stroke="#97ce8c" stroke-width="2"/><rect x="494.0" y="214" width="350" height="59.0" rx="10" fill="#e6f7e2" stroke="#97ce8c" stroke-width="1.4"/><text x="508.0" y="236" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="508.0">Verificar entendimiento por escrito en cada</tspan><tspan x="508.0" dy="16.5">hito</tspan></text><circle cx="450.0" cy="243.5" r="15" fill="#2d6e20"/><text x="450.0" y="248.0" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">4</text><line x1="450.0" y1="281.5" x2="406.0" y2="281.5" stroke="#97ce8c" stroke-width="2"/><rect x="56.0" y="252" width="350" height="59.0" rx="10" fill="#e6f7e2" stroke="#97ce8c" stroke-width="1.4"/><text x="70.0" y="274" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="70.0">Registrar aprendizajes para futuras</tspan><tspan x="70.0" dy="16.5">negociaciones en ese mercado</tspan></text><circle cx="450.0" cy="281.5" r="15" fill="#2d6e20"/><text x="450.0" y="286.0" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">5</text><text x="40" y="353.0" font-size="11.5" fill="#4cac39" font-weight="700" letter-spacing="1.4">CONCEPTOS Y DÓNDE ACTÚAN EN EL MÉTODO</text><rect x="40.0" y="367.0" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#97ce8c" stroke-width="1.4"/><rect x="40.0" y="375.0" width="5" height="62.2" rx="2" fill="#4cac39"/><text x="56.0" y="389.0" font-size="13.5" fill="#2d6e20" font-weight="700" text-anchor="start"><tspan x="56.0">Norma de interacción</tspan></text><text x="56.0" y="408.8" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Expectativa cultural sobre ritmo, formalidad y forma de</tspan><tspan x="56.0" dy="15.2">expresar desacuerdo</tspan></text><rect x="379.0" y="375.0" width="54" height="20" rx="10" fill="#c3e5bc" stroke="#97ce8c" stroke-width="1"/><text x="406.0" y="389.0" font-size="11" fill="#2d6e20" font-weight="700" text-anchor="middle">↔ 1, 3</text><rect x="459.0" y="367.0" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#97ce8c" stroke-width="1.4"/><rect x="459.0" y="375.0" width="5" height="62.2" rx="2" fill="#4cac39"/><text x="475.0" y="389.0" font-size="13.5" fill="#2d6e20" font-weight="700" text-anchor="start"><tspan x="475.0">Rol del contrato</tspan></text><text x="475.0" y="408.8" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Grado en que el documento escrito se considera el acuerdo</tspan><tspan x="475.0" dy="15.2">definitivo o un punto de partida</tspan></text><rect x="40.0" y="459.2" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#97ce8c" stroke-width="1.4"/><rect x="40.0" y="467.2" width="5" height="62.2" rx="2" fill="#4cac39"/><text x="56.0" y="481.2" font-size="13.5" fill="#2d6e20" font-weight="700" text-anchor="start"><tspan x="56.0">Señal ambigua</tspan></text><text x="56.0" y="501.0" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Gesto o expresión cuyo significado difiere entre contextos</tspan><tspan x="56.0" dy="15.2">culturales</tspan></text><rect x="459.0" y="459.2" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#97ce8c" stroke-width="1.4"/><rect x="459.0" y="467.2" width="5" height="62.2" rx="2" fill="#4cac39"/><text x="475.0" y="481.2" font-size="13.5" fill="#2d6e20" font-weight="700" text-anchor="start"><tspan x="475.0">Verificación explícita</tspan></text><text x="475.0" y="501.0" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Práctica de confirmar entendimiento en lugar de suponerlo</tspan></text><rect x="798.0" y="467.2" width="54" height="20" rx="10" fill="#c3e5bc" stroke="#97ce8c" stroke-width="1"/><text x="825.0" y="481.2" font-size="11" fill="#2d6e20" font-weight="700" text-anchor="middle">↔ 2, 4</text><text x="40" y="569.36" font-size="11.5" fill="#4cac39" font-weight="700" letter-spacing="1.4">QUÉ SE MIDE: NUMERADOR SOBRE DENOMINADOR</text><rect x="40.0" y="583.4" width="261.3" height="122.7" rx="8" fill="#e6f7e2" stroke="#97ce8c" stroke-width="1.4"/><text x="54.0" y="605.4" font-size="13" fill="#2d6e20" font-weight="700" text-anchor="start"><tspan x="54.0">Malentendidos registrados</tspan></text><text x="54.0" y="634.5" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Aclaraciones necesarias por</tspan><tspan x="54.0" dy="15.2">diferencias de interpretación, por</tspan><tspan x="54.0" dy="15.2">negociación internacional</tspan></text><rect x="319.3" y="583.4" width="261.3" height="122.7" rx="8" fill="#e6f7e2" stroke="#97ce8c" stroke-width="1.4"/><text x="333.3" y="605.4" font-size="13" fill="#2d6e20" font-weight="700" text-anchor="start"><tspan x="333.3">Ciclo de negociación por mercado</tspan></text><text x="333.3" y="634.5" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="333.3">Días hasta acuerdo, mediana por país</tspan><tspan x="333.3" dy="15.2">o región</tspan></text><rect x="598.7" y="583.4" width="261.3" height="122.7" rx="8" fill="#e6f7e2" stroke="#97ce8c" stroke-width="1.4"/><text x="612.7" y="605.4" font-size="13" fill="#2d6e20" font-weight="700" text-anchor="start"><tspan x="612.7">Acuerdos con confirmación</tspan><tspan x="612.7" dy="17.2">escrita por hito</tspan></text><text x="612.7" y="651.7" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="612.7">Hitos confirmados por escrito</tspan></text><line x1="612.7" y1="672.9" x2="846.0" y2="672.9" stroke="#4cac39" stroke-width="2"/><text x="612.7" y="690.9" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="612.7">Hitos acordados</tspan></text><text x="40" y="740.04" font-size="11.5" fill="#4cac39" font-weight="700" letter-spacing="1.4">FRONTERA DE APLICACIÓN</text><rect x="40" y="750.0" width="820" height="65.0" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.4"/><polygon points="70,767.54 52,796.54 88,796.54" fill="#c2410c"/><text x="70" y="793.54" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">!</text><text x="106" y="774.0" font-size="12.5" fill="#7c2d12" font-weight="400" text-anchor="start"><tspan x="106">Las generalizaciones culturales son promedios y pueden convertirse en estereotipos. La organización</tspan><tspan x="106" dy="16.5">concreta y las personas concretas mandan sobre el promedio nacional.</tspan></text><text x="40" y="843.04" font-size="11.5" fill="#4cac39" font-weight="700" letter-spacing="1.4">ERROR FRECUENTE Y SU CORRECCIÓN</text><rect x="40" y="853.0" width="380.0" height="93.5" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/><text x="54" y="875.0" font-size="11" fill="#b91c1c" font-weight="700" text-anchor="start"><tspan x="54">Síntoma</tspan></text><text x="54" y="893.0" font-size="12.5" fill="#7f1d1d" font-weight="400" text-anchor="start"><tspan x="54">Asumir que el acuerdo verbal significa lo mismo en</tspan><tspan x="54" dy="16.5">todos los contextos</tspan></text><line x1="426.0" y1="899.8" x2="469.0" y2="899.8" stroke="#4cac39" stroke-width="2.6" stroke-linecap="round"/><polygon points="474.0,899.8 465.9,903.7 465.9,895.9" fill="#4cac39"/><rect x="480.0" y="853.0" width="380.0" height="93.5" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.4"/><text x="494.0" y="875.0" font-size="11" fill="#15803d" font-weight="700" text-anchor="start"><tspan x="494.0">Corrección</tspan></text><text x="494.0" y="893.0" font-size="12.5" fill="#14532d" font-weight="400" text-anchor="start"><tspan x="494.0">Confirma por escrito cada hito y pregunta</tspan><tspan x="494.0" dy="16.5">explícitamente qué falta para considerar cerrado el</tspan><tspan x="494.0" dy="16.5">acuerdo.</tspan></text></svg>