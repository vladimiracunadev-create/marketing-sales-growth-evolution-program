<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1335" width="900" height="1335" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif"><title id="t">Modelo mental · Fundamentos de marketing mix modeling</title><desc id="d">Modelo mental de la clase 20.12: Fundamentos de marketing mix modeling. Método en 5 pasos; 4 conceptos; 3 señales de medición.</desc><rect x="0" y="0" width="900" height="1335" rx="14" fill="#ffffff"/><rect x="0" y="0" width="900" height="64" rx="14" fill="#203a6e"/><rect x="0" y="40" width="900" height="24" fill="#203a6e"/><text x="40" y="28" font-size="12" fill="#bccae5" font-weight="700" letter-spacing="1.6">MODELO MENTAL · CLASE 20.12 · PARTE 20</text><text x="40" y="52" font-size="21" fill="#ffffff" font-weight="700">Fundamentos de marketing mix modeling</text><text x="40" y="84" font-size="11.5" fill="#395fac" font-weight="700" letter-spacing="1.4">MÉTODO PASO A PASO</text><ellipse cx="450.0" cy="403.2" rx="330.0" ry="251.2" fill="none" stroke="#8ca2ce" stroke-width="2" stroke-dasharray="3 8" stroke-linecap="round"/><polygon points="653.6,205.3 636.2,201.8 641.4,192.4" fill="#395fac"/><polygon points="759.5,490.9 761.2,473.3 771.1,477.5" fill="#395fac"/><polygon points="439.0,654.4 455.9,649.0 455.9,659.8" fill="#395fac"/><polygon points="131.8,470.7 143.4,484.1 133.5,488.4" fill="#395fac"/><polygon points="265.7,194.7 253.5,207.6 248.3,198.1" fill="#395fac"/><circle cx="450.0" cy="403.2" r="100.0" fill="#bccae5" stroke="#8ca2ce" stroke-width="1.6"/><text x="450.0" y="385.5" font-size="15" fill="#203a6e" font-weight="700" text-anchor="middle"><tspan x="450.0">Fundamentos de</tspan><tspan x="450.0" dy="19.8">marketing mix</tspan><tspan x="450.0" dy="19.8">modeling</tspan></text><rect x="361.0" y="106.0" width="178" height="92.0" rx="10" fill="#e2e9f7" stroke="#8ca2ce" stroke-width="1.4"/><text x="373.0" y="128.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="373.0">Verificar la</tspan><tspan x="373.0" dy="16.5">disponibilidad de</tspan><tspan x="373.0" dy="16.5">historia y de</tspan><tspan x="373.0" dy="16.5">variación</tspan></text><circle cx="363.0" cy="108.0" r="14" fill="#203a6e"/><text x="363.0" y="112.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><rect x="674.8" y="287.8" width="178" height="75.5" rx="10" fill="#e2e9f7" stroke="#8ca2ce" stroke-width="1.4"/><text x="686.8" y="309.8" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="686.8">Identificar los</tspan><tspan x="686.8" dy="16.5">factores externos</tspan><tspan x="686.8" dy="16.5">relevantes</tspan></text><circle cx="676.8" cy="289.8" r="14" fill="#203a6e"/><text x="676.8" y="294.3" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><rect x="555.0" y="568.7" width="178" height="75.5" rx="10" fill="#e2e9f7" stroke="#8ca2ce" stroke-width="1.4"/><text x="567.0" y="590.7" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="567.0">Estimar el modelo con</tspan><tspan x="567.0" dy="16.5">validación fuera de</tspan><tspan x="567.0" dy="16.5">muestra</tspan></text><circle cx="557.0" cy="570.7" r="14" fill="#203a6e"/><text x="557.0" y="575.2" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><rect x="167.0" y="568.7" width="178" height="75.5" rx="10" fill="#e2e9f7" stroke="#8ca2ce" stroke-width="1.4"/><text x="179.0" y="590.7" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="179.0">Interpretar los</tspan><tspan x="179.0" dy="16.5">coeficientes con</tspan><tspan x="179.0" dy="16.5">cautela</tspan></text><circle cx="169.0" cy="570.7" r="14" fill="#203a6e"/><text x="169.0" y="575.2" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">4</text><rect x="47.2" y="287.8" width="178" height="75.5" rx="10" fill="#e2e9f7" stroke="#8ca2ce" stroke-width="1.4"/><text x="59.2" y="309.8" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="59.2">Contrastar con</tspan><tspan x="59.2" dy="16.5">experimentos de</tspan><tspan x="59.2" dy="16.5">incrementalidad</tspan></text><circle cx="49.2" cy="289.8" r="14" fill="#203a6e"/><text x="49.2" y="294.3" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">5</text><text x="40" y="742.4" font-size="11.5" fill="#395fac" font-weight="700" letter-spacing="1.4">CONCEPTOS Y DÓNDE ACTÚAN EN EL MÉTODO</text><rect x="40.0" y="756.4" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#8ca2ce" stroke-width="1.4"/><rect x="40.0" y="764.4" width="5" height="62.2" rx="2" fill="#395fac"/><text x="56.0" y="778.4" font-size="13.5" fill="#203a6e" font-weight="700" text-anchor="start"><tspan x="56.0">Modelo agregado</tspan></text><text x="56.0" y="798.2" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Estimación basada en series temporales y no en datos</tspan><tspan x="56.0" dy="15.2">individuales</tspan></text><rect x="379.0" y="764.4" width="54" height="20" rx="10" fill="#bccae5" stroke="#8ca2ce" stroke-width="1"/><text x="406.0" y="778.4" font-size="11" fill="#203a6e" font-weight="700" text-anchor="middle">↔ 3</text><rect x="459.0" y="756.4" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#8ca2ce" stroke-width="1.4"/><rect x="459.0" y="764.4" width="5" height="62.2" rx="2" fill="#395fac"/><text x="475.0" y="778.4" font-size="13.5" fill="#203a6e" font-weight="700" text-anchor="start"><tspan x="475.0">Variación necesaria</tspan></text><text x="475.0" y="798.2" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Cambios en el gasto que permiten identificar el efecto de</tspan><tspan x="475.0" dy="15.2">cada canal</tspan></text><rect x="798.0" y="764.4" width="54" height="20" rx="10" fill="#bccae5" stroke="#8ca2ce" stroke-width="1"/><text x="825.0" y="778.4" font-size="11" fill="#203a6e" font-weight="700" text-anchor="middle">↔ 1</text><rect x="40.0" y="848.6" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#8ca2ce" stroke-width="1.4"/><rect x="40.0" y="856.6" width="5" height="62.2" rx="2" fill="#395fac"/><text x="56.0" y="870.6" font-size="13.5" fill="#203a6e" font-weight="700" text-anchor="start"><tspan x="56.0">Factor externo</tspan></text><text x="56.0" y="890.4" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Variable no controlada que afecta las ventas y debe</tspan><tspan x="56.0" dy="15.2">incluirse</tspan></text><rect x="379.0" y="856.6" width="54" height="20" rx="10" fill="#bccae5" stroke="#8ca2ce" stroke-width="1"/><text x="406.0" y="870.6" font-size="11" fill="#203a6e" font-weight="700" text-anchor="middle">↔ 2</text><rect x="459.0" y="848.6" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#8ca2ce" stroke-width="1.4"/><rect x="459.0" y="856.6" width="5" height="62.2" rx="2" fill="#395fac"/><text x="475.0" y="870.6" font-size="13.5" fill="#203a6e" font-weight="700" text-anchor="start"><tspan x="475.0">Saturación</tspan></text><text x="475.0" y="890.4" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Punto donde la inversión adicional produce retornos</tspan><tspan x="475.0" dy="15.2">decrecientes</tspan></text><text x="40" y="958.76" font-size="11.5" fill="#395fac" font-weight="700" letter-spacing="1.4">QUÉ SE MIDE: NUMERADOR SOBRE DENOMINADOR</text><rect x="40.0" y="972.8" width="261.3" height="100.7" rx="8" fill="#e2e9f7" stroke="#8ca2ce" stroke-width="1.4"/><text x="54.0" y="994.8" font-size="13" fill="#203a6e" font-weight="700" text-anchor="start"><tspan x="54.0">Historia disponible</tspan></text><text x="54.0" y="1023.9" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Meses de datos comparables,</tspan><tspan x="54.0" dy="15.2">comparados con el mínimo requerido</tspan></text><rect x="319.3" y="972.8" width="261.3" height="100.7" rx="8" fill="#e2e9f7" stroke="#8ca2ce" stroke-width="1.4"/><text x="333.3" y="994.8" font-size="13" fill="#203a6e" font-weight="700" text-anchor="start"><tspan x="333.3">Variación del gasto por canal</tspan></text><text x="333.3" y="1023.9" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="333.3">Coeficiente de variación de la</tspan><tspan x="333.3" dy="15.2">inversión mensual, por canal</tspan></text><rect x="598.7" y="972.8" width="261.3" height="100.7" rx="8" fill="#e2e9f7" stroke="#8ca2ce" stroke-width="1.4"/><text x="612.7" y="994.8" font-size="13" fill="#203a6e" font-weight="700" text-anchor="start"><tspan x="612.7">Capacidad predictiva fuera de</tspan><tspan x="612.7" dy="17.2">muestra</tspan></text><text x="612.7" y="1041.1" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="612.7">Error de predicción en periodos no</tspan><tspan x="612.7" dy="15.2">usados para estimar</tspan></text><text x="40" y="1107.44" font-size="11.5" fill="#395fac" font-weight="700" letter-spacing="1.4">FRONTERA DE APLICACIÓN</text><rect x="40" y="1117.4" width="820" height="65.0" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.4"/><polygon points="70,1134.94 52,1163.94 88,1163.94" fill="#c2410c"/><text x="70" y="1160.94" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">!</text><text x="106" y="1141.4" font-size="12.5" fill="#7c2d12" font-weight="400" text-anchor="start"><tspan x="106">El modelado agregado requiere volumen y estabilidad organizacional. En empresas pequeñas con pocos meses</tspan><tspan x="106" dy="16.5">de historia, la inversión no se justifica.</tspan></text><text x="40" y="1210.44" font-size="11.5" fill="#395fac" font-weight="700" letter-spacing="1.4">ERROR FRECUENTE Y SU CORRECCIÓN</text><rect x="40" y="1220.4" width="380.0" height="77.0" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/><text x="54" y="1242.4" font-size="11" fill="#b91c1c" font-weight="700" text-anchor="start"><tspan x="54">Síntoma</tspan></text><text x="54" y="1260.4" font-size="12.5" fill="#7f1d1d" font-weight="400" text-anchor="start"><tspan x="54">Estimar el modelo sin variación en las inversiones</tspan></text><line x1="426.0" y1="1258.9" x2="469.0" y2="1258.9" stroke="#395fac" stroke-width="2.6" stroke-linecap="round"/><polygon points="474.0,1258.9 465.9,1262.9 465.9,1255.0" fill="#395fac"/><rect x="480.0" y="1220.4" width="380.0" height="77.0" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.4"/><text x="494.0" y="1242.4" font-size="11" fill="#15803d" font-weight="700" text-anchor="start"><tspan x="494.0">Corrección</tspan></text><text x="494.0" y="1260.4" font-size="12.5" fill="#14532d" font-weight="400" text-anchor="start"><tspan x="494.0">Verifica que exista variación suficiente por canal</tspan><tspan x="494.0" dy="16.5">antes de invertir en el modelado.</tspan></text></svg>