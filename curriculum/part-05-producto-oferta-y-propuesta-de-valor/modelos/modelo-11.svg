<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1282" width="900" height="1282" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif"><title id="t">Modelo mental · Roadmap orientado a valor</title><desc id="d">Modelo mental de la clase 05.11: Roadmap orientado a valor. Método en 5 pasos; 8 conceptos; 4 señales de medición.</desc><rect x="0" y="0" width="900" height="1282" rx="14" fill="#ffffff"/><rect x="0" y="0" width="900" height="64" rx="14" fill="#20266e"/><rect x="0" y="40" width="900" height="24" fill="#20266e"/><text x="40" y="28" font-size="12" fill="#bcbfe5" font-weight="700" letter-spacing="1.6">MODELO MENTAL · CLASE 05.11 · PARTE 05</text><text x="40" y="52" font-size="21" fill="#ffffff" font-weight="700">Roadmap orientado a valor</text><text x="40" y="84" font-size="11.5" fill="#3942ac" font-weight="700" letter-spacing="1.4">MÉTODO PASO A PASO</text><rect x="40.0" y="100" width="246.7" height="59.0" rx="10" fill="#e2e4f7" stroke="#8c92ce" stroke-width="1.4"/><text x="54.0" y="122" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Organizar el roadmap por</tspan><tspan x="54.0" dy="16.5">problema y resultado</tspan></text><circle cx="42.0" cy="102.0" r="14" fill="#20266e"/><text x="42.0" y="106.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><rect x="326.7" y="100" width="246.7" height="59.0" rx="10" fill="#e2e4f7" stroke="#8c92ce" stroke-width="1.4"/><text x="340.7" y="122" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="340.7">Asignar nivel de confianza a</tspan><tspan x="340.7" dy="16.5">cada iniciativa</tspan></text><circle cx="328.7" cy="102.0" r="14" fill="#20266e"/><text x="328.7" y="106.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><rect x="613.3" y="100" width="246.7" height="59.0" rx="10" fill="#e2e4f7" stroke="#8c92ce" stroke-width="1.4"/><text x="627.3" y="122" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="627.3">Definir qué puede comunicarse</tspan><tspan x="627.3" dy="16.5">comercialmente y qué no</tspan></text><circle cx="615.3" cy="102.0" r="14" fill="#20266e"/><text x="615.3" y="106.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><rect x="613.3" y="197.0" width="246.7" height="59.0" rx="10" fill="#e2e4f7" stroke="#8c92ce" stroke-width="1.4"/><text x="627.3" y="219.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="627.3">Acordar el protocolo de</tspan><tspan x="627.3" dy="16.5">comunicación con ventas</tspan></text><circle cx="615.3" cy="199.0" r="14" fill="#20266e"/><text x="615.3" y="203.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">4</text><rect x="326.7" y="197.0" width="246.7" height="59.0" rx="10" fill="#e2e4f7" stroke="#8c92ce" stroke-width="1.4"/><text x="340.7" y="219.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="340.7">Revisar el cumplimiento de lo</tspan><tspan x="340.7" dy="16.5">comprometido cada trimestre</tspan></text><circle cx="328.7" cy="199.0" r="14" fill="#20266e"/><text x="328.7" y="203.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">5</text><line x1="289.7" y1="129.5" x2="318.7" y2="129.5" stroke="#3942ac" stroke-width="2.2" stroke-linecap="round"/><polygon points="323.7,129.5 315.6,133.4 315.6,125.6" fill="#3942ac"/><line x1="576.3" y1="129.5" x2="605.3" y2="129.5" stroke="#3942ac" stroke-width="2.2" stroke-linecap="round"/><polygon points="610.3,129.5 602.2,133.4 602.2,125.6" fill="#3942ac"/><line x1="736.7" y1="161.0" x2="736.7" y2="189.0" stroke="#3942ac" stroke-width="2.2" stroke-linecap="round"/><polygon points="736.7,194.0 732.8,185.9 740.6,185.9" fill="#3942ac"/><line x1="610.3" y1="226.5" x2="581.3" y2="226.5" stroke="#3942ac" stroke-width="2.2" stroke-linecap="round"/><polygon points="576.3,226.5 584.4,222.6 584.4,230.4" fill="#3942ac"/><text x="40" y="294.0" font-size="11.5" fill="#3942ac" font-weight="700" letter-spacing="1.4">CONCEPTOS Y DÓNDE ACTÚAN EN EL MÉTODO</text><rect x="40.0" y="308.0" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#8c92ce" stroke-width="1.4"/><rect x="40.0" y="316.0" width="5" height="62.2" rx="2" fill="#3942ac"/><text x="56.0" y="330.0" font-size="13.5" fill="#20266e" font-weight="700" text-anchor="start"><tspan x="56.0">Resultado esperado</tspan></text><text x="56.0" y="349.8" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Cambio medible que la iniciativa busca producir en el</tspan><tspan x="56.0" dy="15.2">cliente o en el negocio</tspan></text><rect x="379.0" y="316.0" width="54" height="20" rx="10" fill="#bcbfe5" stroke="#8c92ce" stroke-width="1"/><text x="406.0" y="330.0" font-size="11" fill="#20266e" font-weight="700" text-anchor="middle">↔ 1</text><rect x="459.0" y="308.0" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#8c92ce" stroke-width="1.4"/><rect x="459.0" y="316.0" width="5" height="62.2" rx="2" fill="#3942ac"/><text x="475.0" y="330.0" font-size="13.5" fill="#20266e" font-weight="700" text-anchor="start"><tspan x="475.0">Nivel de confianza</tspan></text><text x="475.0" y="349.8" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Grado de certeza declarado sobre alcance y plazo de una</tspan><tspan x="475.0" dy="15.2">iniciativa</tspan></text><rect x="798.0" y="316.0" width="54" height="20" rx="10" fill="#bcbfe5" stroke="#8c92ce" stroke-width="1"/><text x="825.0" y="330.0" font-size="11" fill="#20266e" font-weight="700" text-anchor="middle">↔ 2</text><rect x="40.0" y="400.2" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#8c92ce" stroke-width="1.4"/><rect x="40.0" y="408.2" width="5" height="62.2" rx="2" fill="#3942ac"/><text x="56.0" y="422.2" font-size="13.5" fill="#20266e" font-weight="700" text-anchor="start"><tspan x="56.0">Compromiso comercial</tspan></text><text x="56.0" y="442.0" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Afirmación sobre el futuro que la empresa queda obligada a</tspan><tspan x="56.0" dy="15.2">cumplir</tspan></text><rect x="379.0" y="408.2" width="54" height="20" rx="10" fill="#bcbfe5" stroke="#8c92ce" stroke-width="1"/><text x="406.0" y="422.2" font-size="11" fill="#20266e" font-weight="700" text-anchor="middle">↔ 3, 5</text><rect x="459.0" y="400.2" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#8c92ce" stroke-width="1.4"/><rect x="459.0" y="408.2" width="5" height="62.2" rx="2" fill="#3942ac"/><text x="475.0" y="422.2" font-size="13.5" fill="#20266e" font-weight="700" text-anchor="start"><tspan x="475.0">Gestión de expectativa</tspan></text><text x="475.0" y="442.0" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Práctica de comunicar dirección sin comprometer fechas no</tspan><tspan x="475.0" dy="15.2">confirmadas</tspan></text><rect x="40.0" y="492.4" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#8c92ce" stroke-width="1.4"/><rect x="40.0" y="500.4" width="5" height="62.2" rx="2" fill="#3942ac"/><text x="56.0" y="514.4" font-size="13.5" fill="#20266e" font-weight="700" text-anchor="start"><tspan x="56.0">Experiencia–propósito–oportunidad</tspan></text><text x="56.0" y="534.2" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Intersección entre experiencia observada, cambio que el</tspan><tspan x="56.0" dy="15.2">producto pretende causar y oportunidad viable de negocio</tspan></text><rect x="459.0" y="492.4" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#8c92ce" stroke-width="1.4"/><rect x="459.0" y="500.4" width="5" height="62.2" rx="2" fill="#3942ac"/><text x="475.0" y="514.4" font-size="13.5" fill="#20266e" font-weight="700" text-anchor="start"><tspan x="475.0">Product Discovery</tspan></text><text x="475.0" y="534.2" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Reducción continua de riesgo de valor, usabilidad,</tspan><tspan x="475.0" dy="15.2">factibilidad y viabilidad antes y durante la entrega</tspan></text><rect x="40.0" y="584.5" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#8c92ce" stroke-width="1.4"/><rect x="40.0" y="592.5" width="5" height="62.2" rx="2" fill="#3942ac"/><text x="56.0" y="606.5" font-size="13.5" fill="#20266e" font-weight="700" text-anchor="start"><tspan x="56.0">Product Delivery</tspan></text><text x="56.0" y="626.4" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Construcción, despliegue y operación confiable de cambios</tspan><tspan x="56.0" dy="15.2">priorizados</tspan></text><rect x="459.0" y="584.5" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#8c92ce" stroke-width="1.4"/><rect x="459.0" y="592.5" width="5" height="62.2" rx="2" fill="#3942ac"/><text x="475.0" y="606.5" font-size="13.5" fill="#20266e" font-weight="700" text-anchor="start"><tspan x="475.0">Gobierno de producto</tspan></text><text x="475.0" y="626.4" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Derechos de decisión, criterios, evidencia y cadencias que</tspan><tspan x="475.0" dy="15.2">conectan estrategia, roadmap, backlog y retiro</tspan></text><text x="40" y="694.72" font-size="11.5" fill="#3942ac" font-weight="700" letter-spacing="1.4">QUÉ SE MIDE: NUMERADOR SOBRE DENOMINADOR</text><rect x="40.0" y="708.7" width="261.3" height="137.9" rx="8" fill="#e2e4f7" stroke="#8c92ce" stroke-width="1.4"/><text x="54.0" y="730.7" font-size="13" fill="#20266e" font-weight="700" text-anchor="start"><tspan x="54.0">Cumplimiento de lo comprometido</tspan></text><text x="54.0" y="759.9" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Iniciativas entregadas dentro del</tspan><tspan x="54.0" dy="15.2">plazo comprometido</tspan></text><line x1="54.0" y1="796.2" x2="287.3" y2="796.2" stroke="#3942ac" stroke-width="2"/><text x="54.0" y="814.2" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="54.0">Iniciativas comprometidas</tspan></text><rect x="319.3" y="708.7" width="261.3" height="137.9" rx="8" fill="#e2e4f7" stroke="#8c92ce" stroke-width="1.4"/><text x="333.3" y="730.7" font-size="13" fill="#20266e" font-weight="700" text-anchor="start"><tspan x="333.3">Negocios cerrados con promesa</tspan><tspan x="333.3" dy="17.2">futura</tspan></text><text x="333.3" y="777.0" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="333.3">Negocios cuyo cierre dependió de una</tspan><tspan x="333.3" dy="15.2">funcionalidad no existente</tspan></text><line x1="333.3" y1="813.4" x2="566.7" y2="813.4" stroke="#3942ac" stroke-width="2"/><text x="333.3" y="831.4" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="333.3">Negocios cerrados</tspan></text><rect x="598.7" y="708.7" width="261.3" height="137.9" rx="8" fill="#e2e4f7" stroke="#8c92ce" stroke-width="1.4"/><text x="612.7" y="730.7" font-size="13" fill="#20266e" font-weight="700" text-anchor="start"><tspan x="612.7">Churn asociado a promesa</tspan><tspan x="612.7" dy="17.2">incumplida</tspan></text><text x="612.7" y="777.0" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="612.7">Bajas que citan una funcionalidad</tspan><tspan x="612.7" dy="15.2">prometida y no entregada</tspan></text><line x1="612.7" y1="813.4" x2="846.0" y2="813.4" stroke="#3942ac" stroke-width="2"/><text x="612.7" y="831.4" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="612.7">Bajas totales</tspan></text><rect x="40.0" y="860.6" width="261.3" height="159.7" rx="8" fill="#e2e4f7" stroke="#8c92ce" stroke-width="1.4"/><text x="54.0" y="882.6" font-size="13" fill="#20266e" font-weight="700" text-anchor="start"><tspan x="54.0">Adopción del resultado de</tspan><tspan x="54.0" dy="17.2">producto</tspan></text><text x="54.0" y="928.9" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Cuentas objetivo que completan la</tspan><tspan x="54.0" dy="15.2">conducta de valor</tspan></text><line x1="54.0" y1="965.3" x2="287.3" y2="965.3" stroke="#3942ac" stroke-width="2"/><text x="54.0" y="983.3" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="54.0">Cuentas objetivo habilitadas</tspan></text><text x="54.0" y="1012.4" font-size="10.5" fill="#7b8794" font-weight="400" text-anchor="start"><tspan x="54.0">Ventana: cohortes de 30 y 90 días</tspan></text><text x="40" y="1054.3000000000002" font-size="11.5" fill="#3942ac" font-weight="700" letter-spacing="1.4">FRONTERA DE APLICACIÓN</text><rect x="40" y="1064.3" width="820" height="65.0" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.4"/><polygon points="70,1081.8000000000002 52,1110.8000000000002 88,1110.8000000000002" fill="#c2410c"/><text x="70" y="1107.8000000000002" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">!</text><text x="106" y="1088.3" font-size="12.5" fill="#7c2d12" font-weight="400" text-anchor="start"><tspan x="106">Comunicar sólo dirección sin ninguna fecha puede frenar decisiones legítimas del cliente. El equilibrio es</tspan><tspan x="106" dy="16.5">declarar el nivel de confianza, no ocultar el plan.</tspan></text><text x="40" y="1157.3000000000002" font-size="11.5" fill="#3942ac" font-weight="700" letter-spacing="1.4">ERROR FRECUENTE Y SU CORRECCIÓN</text><rect x="40" y="1167.3" width="380.0" height="77.0" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/><text x="54" y="1189.3" font-size="11" fill="#b91c1c" font-weight="700" text-anchor="start"><tspan x="54">Síntoma</tspan></text><text x="54" y="1207.3" font-size="12.5" fill="#7f1d1d" font-weight="400" text-anchor="start"><tspan x="54">Vender funcionalidades que aún no existen</tspan></text><line x1="426.0" y1="1205.8" x2="469.0" y2="1205.8" stroke="#3942ac" stroke-width="2.6" stroke-linecap="round"/><polygon points="474.0,1205.8 465.9,1209.7 465.9,1201.9" fill="#3942ac"/><rect x="480.0" y="1167.3" width="380.0" height="77.0" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.4"/><text x="494.0" y="1189.3" font-size="11" fill="#15803d" font-weight="700" text-anchor="start"><tspan x="494.0">Corrección</tspan></text><text x="494.0" y="1207.3" font-size="12.5" fill="#14532d" font-weight="400" text-anchor="start"><tspan x="494.0">Prohíbe comprometer por escrito iniciativas con</tspan><tspan x="494.0" dy="16.5">nivel de confianza bajo y registra las excepciones.</tspan></text></svg>