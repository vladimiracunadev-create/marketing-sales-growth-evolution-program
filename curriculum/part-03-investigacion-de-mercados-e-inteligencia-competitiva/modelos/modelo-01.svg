<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 957" width="900" height="957" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif"><title id="t">Modelo mental · Preguntas de investigación y decisiones</title><desc id="d">Modelo mental de la clase 03.01: Preguntas de investigación y decisiones. Método en 5 pasos; 4 conceptos; 3 señales de medición.</desc><rect x="0" y="0" width="900" height="957" rx="14" fill="#ffffff"/><rect x="0" y="0" width="900" height="64" rx="14" fill="#206e3b"/><rect x="0" y="40" width="900" height="24" fill="#206e3b"/><text x="40" y="28" font-size="12" fill="#bce5ca" font-weight="700" letter-spacing="1.6">MODELO MENTAL · CLASE 03.01 · PARTE 03</text><text x="40" y="52" font-size="21" fill="#ffffff" font-weight="700">Preguntas de investigación y decisiones</text><text x="40" y="84" font-size="11.5" fill="#39ac61" font-weight="700" letter-spacing="1.4">MÉTODO PASO A PASO</text><rect x="40.0" y="100" width="246.7" height="59.0" rx="10" fill="#e2f7e9" stroke="#8ccea3" stroke-width="1.4"/><text x="54.0" y="122" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Escribir la decisión pendiente y</tspan><tspan x="54.0" dy="16.5">sus alternativas</tspan></text><circle cx="42.0" cy="102.0" r="14" fill="#206e3b"/><text x="42.0" y="106.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><rect x="326.7" y="100" width="246.7" height="59.0" rx="10" fill="#e2f7e9" stroke="#8ccea3" stroke-width="1.4"/><text x="340.7" y="122" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="340.7">Declarar qué resultado</tspan><tspan x="340.7" dy="16.5">favorecería a cada alternativa</tspan></text><circle cx="328.7" cy="102.0" r="14" fill="#206e3b"/><text x="328.7" y="106.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><rect x="613.3" y="100" width="246.7" height="59.0" rx="10" fill="#e2f7e9" stroke="#8ccea3" stroke-width="1.4"/><text x="627.3" y="122" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="627.3">Estimar el costo de equivocarse</tspan><tspan x="627.3" dy="16.5">en esa decisión</tspan></text><circle cx="615.3" cy="102.0" r="14" fill="#206e3b"/><text x="615.3" y="106.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><rect x="613.3" y="197.0" width="246.7" height="59.0" rx="10" fill="#e2f7e9" stroke="#8ccea3" stroke-width="1.4"/><text x="627.3" y="219.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="627.3">Definir el umbral de evidencia</tspan><tspan x="627.3" dy="16.5">suficiente</tspan></text><circle cx="615.3" cy="199.0" r="14" fill="#206e3b"/><text x="615.3" y="203.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">4</text><rect x="326.7" y="197.0" width="246.7" height="59.0" rx="10" fill="#e2f7e9" stroke="#8ccea3" stroke-width="1.4"/><text x="340.7" y="219.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="340.7">Elegir el método más barato que</tspan><tspan x="340.7" dy="16.5">alcance ese umbral</tspan></text><circle cx="328.7" cy="199.0" r="14" fill="#206e3b"/><text x="328.7" y="203.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">5</text><line x1="289.7" y1="129.5" x2="318.7" y2="129.5" stroke="#39ac61" stroke-width="2.2" stroke-linecap="round"/><polygon points="323.7,129.5 315.6,133.4 315.6,125.6" fill="#39ac61"/><line x1="576.3" y1="129.5" x2="605.3" y2="129.5" stroke="#39ac61" stroke-width="2.2" stroke-linecap="round"/><polygon points="610.3,129.5 602.2,133.4 602.2,125.6" fill="#39ac61"/><line x1="736.7" y1="161.0" x2="736.7" y2="189.0" stroke="#39ac61" stroke-width="2.2" stroke-linecap="round"/><polygon points="736.7,194.0 732.8,185.9 740.6,185.9" fill="#39ac61"/><line x1="610.3" y1="226.5" x2="581.3" y2="226.5" stroke="#39ac61" stroke-width="2.2" stroke-linecap="round"/><polygon points="576.3,226.5 584.4,222.6 584.4,230.4" fill="#39ac61"/><text x="40" y="294.0" font-size="11.5" fill="#39ac61" font-weight="700" letter-spacing="1.4">CONCEPTOS Y DÓNDE ACTÚAN EN EL MÉTODO</text><rect x="40.0" y="308.0" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#8ccea3" stroke-width="1.4"/><rect x="40.0" y="316.0" width="5" height="62.2" rx="2" fill="#39ac61"/><text x="56.0" y="330.0" font-size="13.5" fill="#206e3b" font-weight="700" text-anchor="start"><tspan x="56.0">Decisión pendiente</tspan></text><text x="56.0" y="349.8" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Elección concreta con alternativas definidas que la</tspan><tspan x="56.0" dy="15.2">investigación debe informar</tspan></text><rect x="379.0" y="316.0" width="54" height="20" rx="10" fill="#bce5ca" stroke="#8ccea3" stroke-width="1"/><text x="406.0" y="330.0" font-size="11" fill="#206e3b" font-weight="700" text-anchor="middle">↔ 1, 3</text><rect x="459.0" y="308.0" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#8ccea3" stroke-width="1.4"/><rect x="459.0" y="316.0" width="5" height="62.2" rx="2" fill="#39ac61"/><text x="475.0" y="330.0" font-size="13.5" fill="#206e3b" font-weight="700" text-anchor="start"><tspan x="475.0">Pregunta de investigación</tspan></text><text x="475.0" y="349.8" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Formulación que puede responderse con evidencia y que</tspan><tspan x="475.0" dy="15.2">discrimina entre alternativas</tspan></text><rect x="40.0" y="400.2" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#8ccea3" stroke-width="1.4"/><rect x="40.0" y="408.2" width="5" height="62.2" rx="2" fill="#39ac61"/><text x="56.0" y="422.2" font-size="13.5" fill="#206e3b" font-weight="700" text-anchor="start"><tspan x="56.0">Valor de la información</tspan></text><text x="56.0" y="442.0" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Reducción esperada de pérdida por decidir con evidencia en</tspan><tspan x="56.0" dy="15.2">lugar de sin ella</tspan></text><rect x="459.0" y="400.2" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#8ccea3" stroke-width="1.4"/><rect x="459.0" y="408.2" width="5" height="62.2" rx="2" fill="#39ac61"/><text x="475.0" y="422.2" font-size="13.5" fill="#206e3b" font-weight="700" text-anchor="start"><tspan x="475.0">Umbral de suficiencia</tspan></text><text x="475.0" y="442.0" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Nivel de evidencia a partir del cual seguir investigando</tspan><tspan x="475.0" dy="15.2">ya no cambia la decisión</tspan></text><rect x="798.0" y="408.2" width="54" height="20" rx="10" fill="#bce5ca" stroke="#8ccea3" stroke-width="1"/><text x="825.0" y="422.2" font-size="11" fill="#206e3b" font-weight="700" text-anchor="middle">↔ 4, 5</text><text x="40" y="510.36" font-size="11.5" fill="#39ac61" font-weight="700" letter-spacing="1.4">QUÉ SE MIDE: NUMERADOR SOBRE DENOMINADOR</text><rect x="40.0" y="524.4" width="261.3" height="137.9" rx="8" fill="#e2f7e9" stroke="#8ccea3" stroke-width="1.4"/><text x="54.0" y="546.4" font-size="13" fill="#206e3b" font-weight="700" text-anchor="start"><tspan x="54.0">Decisiones modificadas por</tspan><tspan x="54.0" dy="17.2">investigación</tspan></text><text x="54.0" y="592.7" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Decisiones cuyo curso cambió tras el</tspan><tspan x="54.0" dy="15.2">estudio</tspan></text><line x1="54.0" y1="629.0" x2="287.3" y2="629.0" stroke="#39ac61" stroke-width="2"/><text x="54.0" y="647.0" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="54.0">Estudios realizados en el periodo</tspan></text><rect x="319.3" y="524.4" width="261.3" height="137.9" rx="8" fill="#e2f7e9" stroke="#8ccea3" stroke-width="1.4"/><text x="333.3" y="546.4" font-size="13" fill="#206e3b" font-weight="700" text-anchor="start"><tspan x="333.3">Costo por estudio frente a valor</tspan><tspan x="333.3" dy="17.2">en juego</tspan></text><text x="333.3" y="592.7" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="333.3">Costo directo del estudio</tspan></text><line x1="333.3" y1="613.9" x2="566.7" y2="613.9" stroke="#39ac61" stroke-width="2"/><text x="333.3" y="631.9" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="333.3">El monto de la decisión que informa</tspan></text><rect x="598.7" y="524.4" width="261.3" height="137.9" rx="8" fill="#e2f7e9" stroke="#8ccea3" stroke-width="1.4"/><text x="612.7" y="546.4" font-size="13" fill="#206e3b" font-weight="700" text-anchor="start"><tspan x="612.7">Tiempo entre pregunta y</tspan><tspan x="612.7" dy="17.2">respuesta</tspan></text><text x="612.7" y="592.7" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="612.7">Días entre la formulación de la</tspan><tspan x="612.7" dy="15.2">pregunta y la entrega de evidencia</tspan><tspan x="612.7" dy="15.2">utilizable</tspan></text><text x="40" y="696.22" font-size="11.5" fill="#39ac61" font-weight="700" letter-spacing="1.4">FRONTERA DE APLICACIÓN</text><rect x="40" y="706.2" width="820" height="81.5" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.4"/><polygon points="70,731.97 52,760.97 88,760.97" fill="#c2410c"/><text x="70" y="757.97" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">!</text><text x="106" y="730.2" font-size="12.5" fill="#7c2d12" font-weight="400" text-anchor="start"><tspan x="106">Algunas investigaciones exploratorias no informan una decisión inmediata y aun así son valiosas para</tspan><tspan x="106" dy="16.5">detectar problemas no formulados. La regla del valor de la información aplica al gasto grande, no a la</tspan><tspan x="106" dy="16.5">conversación con clientes.</tspan></text><text x="40" y="815.72" font-size="11.5" fill="#39ac61" font-weight="700" letter-spacing="1.4">ERROR FRECUENTE Y SU CORRECCIÓN</text><rect x="40" y="825.7" width="380.0" height="93.5" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/><text x="54" y="847.7" font-size="11" fill="#b91c1c" font-weight="700" text-anchor="start"><tspan x="54">Síntoma</tspan></text><text x="54" y="865.7" font-size="12.5" fill="#7f1d1d" font-weight="400" text-anchor="start"><tspan x="54">Financiar investigación sin decisión asociada</tspan></text><line x1="426.0" y1="872.5" x2="469.0" y2="872.5" stroke="#39ac61" stroke-width="2.6" stroke-linecap="round"/><polygon points="474.0,872.5 465.9,876.4 465.9,868.6" fill="#39ac61"/><rect x="480.0" y="825.7" width="380.0" height="93.5" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.4"/><text x="494.0" y="847.7" font-size="11" fill="#15803d" font-weight="700" text-anchor="start"><tspan x="494.0">Corrección</tspan></text><text x="494.0" y="865.7" font-size="12.5" fill="#14532d" font-weight="400" text-anchor="start"><tspan x="494.0">Exige por escrito qué alternativa se descartaría</tspan><tspan x="494.0" dy="16.5">según cada resultado posible antes de aprobar el</tspan><tspan x="494.0" dy="16.5">gasto.</tspan></text></svg>