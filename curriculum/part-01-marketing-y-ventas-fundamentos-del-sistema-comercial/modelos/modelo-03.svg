<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1253" width="900" height="1253" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif"><title id="t">Modelo mental · Mercados, categorías y competencia</title><desc id="d">Modelo mental de la clase 01.03: Mercados, categorías y competencia. Método en 5 pasos; 4 conceptos; 3 señales de medición.</desc><rect x="0" y="0" width="900" height="1253" rx="14" fill="#ffffff"/><rect x="0" y="0" width="900" height="64" rx="14" fill="#6e5d20"/><rect x="0" y="40" width="900" height="24" fill="#6e5d20"/><text x="40" y="28" font-size="12" fill="#e5dcbc" font-weight="700" letter-spacing="1.6">MODELO MENTAL · CLASE 01.03 · PARTE 01</text><text x="40" y="52" font-size="21" fill="#ffffff" font-weight="700">Mercados, categorías y competencia</text><text x="40" y="84" font-size="11.5" fill="#ac9339" font-weight="700" letter-spacing="1.4">MÉTODO PASO A PASO</text><path d="M66.0,175.5 V227.2 H158.5" fill="none" stroke="#ac9339" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="160.5,227.2 151.5,222.2 151.5,232.2" fill="#ac9339"/><path d="M188.5,265.0 V316.8 H281.0" fill="none" stroke="#ac9339" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="283.0,316.8 274.0,311.8 274.0,321.8" fill="#ac9339"/><path d="M311.0,354.5 V406.2 H403.5" fill="none" stroke="#ac9339" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="405.5,406.2 396.5,401.2 396.5,411.2" fill="#ac9339"/><path d="M433.5,444.0 V495.8 H526.0" fill="none" stroke="#ac9339" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="528.0,495.8 519.0,490.8 519.0,500.8" fill="#ac9339"/><rect x="40.0" y="100.0" width="330" height="75.5" rx="10" fill="#f7f3e2" stroke="#cebf8c" stroke-width="1.4"/><text x="54.0" y="122.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Listar las alternativas que el cliente</tspan><tspan x="54.0" dy="16.5">nombró espontáneamente en discovery</tspan></text><circle cx="42.0" cy="102.0" r="14" fill="#6e5d20"/><text x="42.0" y="106.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><rect x="162.5" y="189.5" width="330" height="75.5" rx="10" fill="#f7f3e2" stroke="#cebf8c" stroke-width="1.4"/><text x="176.5" y="211.5" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="176.5">Clasificar cada alternativa como directa,</tspan><tspan x="176.5" dy="16.5">funcional o statu quo</tspan></text><circle cx="164.5" cy="191.5" r="14" fill="#6e5d20"/><text x="164.5" y="196.0" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><rect x="285.0" y="279.0" width="330" height="75.5" rx="10" fill="#f7f3e2" stroke="#cebf8c" stroke-width="1.4"/><text x="299.0" y="301.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="299.0">Identificar de qué presupuesto sale el</tspan><tspan x="299.0" dy="16.5">dinero en cada caso</tspan></text><circle cx="287.0" cy="281.0" r="14" fill="#6e5d20"/><text x="287.0" y="285.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><rect x="407.5" y="368.5" width="330" height="75.5" rx="10" fill="#f7f3e2" stroke="#cebf8c" stroke-width="1.4"/><text x="421.5" y="390.5" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="421.5">Estimar el precio de referencia asociado a</tspan><tspan x="421.5" dy="16.5">esa categoría</tspan></text><circle cx="409.5" cy="370.5" r="14" fill="#6e5d20"/><text x="409.5" y="375.0" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">4</text><rect x="530.0" y="458.0" width="330" height="75.5" rx="10" fill="#f7f3e2" stroke="#cebf8c" stroke-width="1.4"/><text x="544.0" y="480.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="544.0">Elegir la definición de categoría que se</tspan><tspan x="544.0" dy="16.5">quiere ocupar y justificar el costo de esa</tspan><tspan x="544.0" dy="16.5">elección</tspan></text><circle cx="532.0" cy="460.0" r="14" fill="#6e5d20"/><text x="532.0" y="464.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">5</text><text x="40" y="575.5" font-size="11.5" fill="#ac9339" font-weight="700" letter-spacing="1.4">CONCEPTOS Y DÓNDE ACTÚAN EN EL MÉTODO</text><rect x="40.0" y="589.5" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#cebf8c" stroke-width="1.4"/><rect x="40.0" y="597.5" width="5" height="62.2" rx="2" fill="#ac9339"/><text x="56.0" y="611.5" font-size="13.5" fill="#6e5d20" font-weight="700" text-anchor="start"><tspan x="56.0">Categoría</tspan></text><text x="56.0" y="631.3" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Conjunto de alternativas que el cliente considera</tspan><tspan x="56.0" dy="15.2">comparables para resolver el mismo trabajo</tspan></text><rect x="379.0" y="597.5" width="54" height="20" rx="10" fill="#e5dcbc" stroke="#cebf8c" stroke-width="1"/><text x="406.0" y="611.5" font-size="11" fill="#6e5d20" font-weight="700" text-anchor="middle">↔ 1, 4, 5</text><rect x="459.0" y="589.5" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#cebf8c" stroke-width="1.4"/><rect x="459.0" y="597.5" width="5" height="62.2" rx="2" fill="#ac9339"/><text x="475.0" y="611.5" font-size="13.5" fill="#6e5d20" font-weight="700" text-anchor="start"><tspan x="475.0">Competencia directa</tspan></text><text x="475.0" y="631.3" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Oferta que el cliente evalúa en el mismo proceso de compra</tspan><tspan x="475.0" dy="15.2">y con los mismos criterios</tspan></text><rect x="798.0" y="597.5" width="54" height="20" rx="10" fill="#e5dcbc" stroke="#cebf8c" stroke-width="1"/><text x="825.0" y="611.5" font-size="11" fill="#6e5d20" font-weight="700" text-anchor="middle">↔ 2</text><rect x="40.0" y="681.7" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#cebf8c" stroke-width="1.4"/><rect x="40.0" y="689.7" width="5" height="62.2" rx="2" fill="#ac9339"/><text x="56.0" y="703.7" font-size="13.5" fill="#6e5d20" font-weight="700" text-anchor="start"><tspan x="56.0">Competencia funcional</tspan></text><text x="56.0" y="723.5" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Solución distinta en forma que sustituye el mismo</tspan><tspan x="56.0" dy="15.2">resultado, incluido el proceso manual</tspan></text><rect x="379.0" y="689.7" width="54" height="20" rx="10" fill="#e5dcbc" stroke="#cebf8c" stroke-width="1"/><text x="406.0" y="703.7" font-size="11" fill="#6e5d20" font-weight="700" text-anchor="middle">↔ 2</text><rect x="459.0" y="681.7" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#cebf8c" stroke-width="1.4"/><rect x="459.0" y="689.7" width="5" height="62.2" rx="2" fill="#ac9339"/><text x="475.0" y="703.7" font-size="13.5" fill="#6e5d20" font-weight="700" text-anchor="start"><tspan x="475.0">Precio de referencia</tspan></text><text x="475.0" y="723.5" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Monto que el cliente considera normal para esa categoría y</tspan><tspan x="475.0" dy="15.2">contra el cual juzga cualquier propuesta</tspan></text><rect x="798.0" y="689.7" width="54" height="20" rx="10" fill="#e5dcbc" stroke="#cebf8c" stroke-width="1"/><text x="825.0" y="703.7" font-size="11" fill="#6e5d20" font-weight="700" text-anchor="middle">↔ 4</text><text x="40" y="791.8600000000001" font-size="11.5" fill="#ac9339" font-weight="700" letter-spacing="1.4">QUÉ SE MIDE: NUMERADOR SOBRE DENOMINADOR</text><rect x="40.0" y="805.9" width="261.3" height="153.0" rx="8" fill="#f7f3e2" stroke="#cebf8c" stroke-width="1.4"/><text x="54.0" y="827.9" font-size="13" fill="#6e5d20" font-weight="700" text-anchor="start"><tspan x="54.0">Participación en la</tspan><tspan x="54.0" dy="17.2">consideración</tspan></text><text x="54.0" y="874.2" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Oportunidades donde la empresa fue</tspan><tspan x="54.0" dy="15.2">evaluada</tspan></text><line x1="54.0" y1="910.5" x2="287.3" y2="910.5" stroke="#ac9339" stroke-width="2"/><text x="54.0" y="928.5" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="54.0">Oportunidades detectadas en el</tspan><tspan x="54.0" dy="15.2">segmento, por trimestre</tspan></text><rect x="319.3" y="805.9" width="261.3" height="153.0" rx="8" fill="#f7f3e2" stroke="#cebf8c" stroke-width="1.4"/><text x="333.3" y="827.9" font-size="13" fill="#6e5d20" font-weight="700" text-anchor="start"><tspan x="333.3">Mezcla de competidores nombrados</tspan></text><text x="333.3" y="857.0" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="333.3">Frecuencia de cada alternativa</tspan><tspan x="333.3" dy="15.2">citada por el cliente en discovery</tspan></text><line x1="333.3" y1="893.4" x2="566.7" y2="893.4" stroke="#ac9339" stroke-width="2"/><text x="333.3" y="911.4" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="333.3">El total de oportunidades del</tspan><tspan x="333.3" dy="15.2">periodo</tspan></text><rect x="598.7" y="805.9" width="261.3" height="153.0" rx="8" fill="#f7f3e2" stroke="#cebf8c" stroke-width="1.4"/><text x="612.7" y="827.9" font-size="13" fill="#6e5d20" font-weight="700" text-anchor="start"><tspan x="612.7">Dispersión de precio de cierre</tspan></text><text x="612.7" y="857.0" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="612.7">Desviación entre el precio de lista</tspan><tspan x="612.7" dy="15.2">y el precio efectivo por categoría</tspan><tspan x="612.7" dy="15.2">de competidor enfrentado</tspan></text><text x="40" y="992.9000000000001" font-size="11.5" fill="#ac9339" font-weight="700" letter-spacing="1.4">FRONTERA DE APLICACIÓN</text><rect x="40" y="1002.9" width="820" height="81.5" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.4"/><polygon points="70,1028.65 52,1057.65 88,1057.65" fill="#c2410c"/><text x="70" y="1054.65" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">!</text><text x="106" y="1026.9" font-size="12.5" fill="#7c2d12" font-weight="400" text-anchor="start"><tspan x="106">Redefinir la categoría es costoso: exige educar al mercado y sostener esa educación por años. Una empresa</tspan><tspan x="106" dy="16.5">sin presupuesto de comunicación sostenido suele obtener mejores resultados diferenciándose dentro de una</tspan><tspan x="106" dy="16.5">categoría existente que creando una nueva.</tspan></text><text x="40" y="1112.4" font-size="11.5" fill="#ac9339" font-weight="700" letter-spacing="1.4">ERROR FRECUENTE Y SU CORRECCIÓN</text><rect x="40" y="1122.4" width="380.0" height="93.5" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/><text x="54" y="1144.4" font-size="11" fill="#b91c1c" font-weight="700" text-anchor="start"><tspan x="54">Síntoma</tspan></text><text x="54" y="1162.4" font-size="12.5" fill="#7f1d1d" font-weight="400" text-anchor="start"><tspan x="54">Definir la categoría desde la sala de producto</tspan></text><line x1="426.0" y1="1169.2" x2="469.0" y2="1169.2" stroke="#ac9339" stroke-width="2.6" stroke-linecap="round"/><polygon points="474.0,1169.2 465.9,1173.1 465.9,1165.2" fill="#ac9339"/><rect x="480.0" y="1122.4" width="380.0" height="93.5" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.4"/><text x="494.0" y="1144.4" font-size="11" fill="#15803d" font-weight="700" text-anchor="start"><tspan x="494.0">Corrección</tspan></text><text x="494.0" y="1162.4" font-size="12.5" fill="#14532d" font-weight="400" text-anchor="start"><tspan x="494.0">Usa la lista de alternativas que los clientes</tspan><tspan x="494.0" dy="16.5">nombraron y no la que el equipo considera</tspan><tspan x="494.0" dy="16.5">relevante.</tspan></text></svg>