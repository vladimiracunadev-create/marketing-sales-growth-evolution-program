<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1123" width="900" height="1123" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif"><title id="t">Modelo mental · Ética y cultura comercial</title><desc id="d">Modelo mental de la clase 23.12: Ética y cultura comercial. Método en 5 pasos; 4 conceptos; 3 señales de medición.</desc><rect x="0" y="0" width="900" height="1123" rx="14" fill="#ffffff"/><rect x="0" y="0" width="900" height="64" rx="14" fill="#6e2120"/><rect x="0" y="40" width="900" height="24" fill="#6e2120"/><text x="40" y="28" font-size="12" fill="#e5bdbc" font-weight="700" letter-spacing="1.6">MODELO MENTAL · CLASE 23.12 · PARTE 23</text><text x="40" y="52" font-size="21" fill="#ffffff" font-weight="700">Ética y cultura comercial</text><text x="40" y="84" font-size="11.5" fill="#ac3b39" font-weight="700" letter-spacing="1.4">MÉTODO PASO A PASO</text><path d="M66.0,159.0 V202.5 H158.5" fill="none" stroke="#ac3b39" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="160.5,202.5 151.5,197.5 151.5,207.5" fill="#ac3b39"/><path d="M188.5,232.0 V275.5 H281.0" fill="none" stroke="#ac3b39" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="283.0,275.5 274.0,270.5 274.0,280.5" fill="#ac3b39"/><path d="M311.0,305.0 V348.5 H403.5" fill="none" stroke="#ac3b39" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="405.5,348.5 396.5,343.5 396.5,353.5" fill="#ac3b39"/><path d="M433.5,378.0 V421.5 H526.0" fill="none" stroke="#ac3b39" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="528.0,421.5 519.0,416.5 519.0,426.5" fill="#ac3b39"/><rect x="40.0" y="100.0" width="330" height="59.0" rx="10" fill="#f7e2e2" stroke="#ce8d8c" stroke-width="1.4"/><text x="54.0" y="122.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Declarar las líneas que no se cruzan, con</tspan><tspan x="54.0" dy="16.5">ejemplos concretos</tspan></text><circle cx="42.0" cy="102.0" r="14" fill="#6e2120"/><text x="42.0" y="106.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><rect x="162.5" y="173.0" width="330" height="59.0" rx="10" fill="#f7e2e2" stroke="#ce8d8c" stroke-width="1.4"/><text x="176.5" y="195.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="176.5">Revisar qué premia y qué sanciona el sistema</tspan><tspan x="176.5" dy="16.5">actual</tspan></text><circle cx="164.5" cy="175.0" r="14" fill="#6e2120"/><text x="164.5" y="179.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><rect x="285.0" y="246.0" width="330" height="59.0" rx="10" fill="#f7e2e2" stroke="#ce8d8c" stroke-width="1.4"/><text x="299.0" y="268.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="299.0">Actuar visiblemente ante el primer</tspan><tspan x="299.0" dy="16.5">incumplimiento</tspan></text><circle cx="287.0" cy="248.0" r="14" fill="#6e2120"/><text x="287.0" y="252.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><rect x="407.5" y="319.0" width="330" height="59.0" rx="10" fill="#f7e2e2" stroke="#ce8d8c" stroke-width="1.4"/><text x="421.5" y="341.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="421.5">Revisar los casos límite con el equipo</tspan></text><circle cx="409.5" cy="321.0" r="14" fill="#6e2120"/><text x="409.5" y="325.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">4</text><rect x="530.0" y="392.0" width="330" height="59.0" rx="10" fill="#f7e2e2" stroke="#ce8d8c" stroke-width="1.4"/><text x="544.0" y="414.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="544.0">Medir señales de deterioro: reclamos,</tspan><tspan x="544.0" dy="16.5">promesas incumplidas, rotación</tspan></text><circle cx="532.0" cy="394.0" r="14" fill="#6e2120"/><text x="532.0" y="398.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">5</text><text x="40" y="493.0" font-size="11.5" fill="#ac3b39" font-weight="700" letter-spacing="1.4">CONCEPTOS Y DÓNDE ACTÚAN EN EL MÉTODO</text><rect x="40.0" y="507.0" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#ce8d8c" stroke-width="1.4"/><rect x="40.0" y="515.0" width="5" height="62.2" rx="2" fill="#ac3b39"/><text x="56.0" y="529.0" font-size="13.5" fill="#6e2120" font-weight="700" text-anchor="start"><tspan x="56.0">Cultura efectiva</tspan></text><text x="56.0" y="548.8" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Conjunto de comportamientos que la organización realmente</tspan><tspan x="56.0" dy="15.2">tolera y premia</tspan></text><rect x="459.0" y="507.0" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#ce8d8c" stroke-width="1.4"/><rect x="459.0" y="515.0" width="5" height="62.2" rx="2" fill="#ac3b39"/><text x="475.0" y="529.0" font-size="13.5" fill="#6e2120" font-weight="700" text-anchor="start"><tspan x="475.0">Prueba de presión</tspan></text><text x="475.0" y="548.8" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Situación en que cumplir la meta exige comprometer un</tspan><tspan x="475.0" dy="15.2">principio</tspan></text><rect x="40.0" y="599.2" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#ce8d8c" stroke-width="1.4"/><rect x="40.0" y="607.2" width="5" height="62.2" rx="2" fill="#ac3b39"/><text x="56.0" y="621.2" font-size="13.5" fill="#6e2120" font-weight="700" text-anchor="start"><tspan x="56.0">Consecuencia visible</tspan></text><text x="56.0" y="641.0" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Acción de la dirección ante un incumplimiento ético,</tspan><tspan x="56.0" dy="15.2">observada por el equipo</tspan></text><rect x="379.0" y="607.2" width="54" height="20" rx="10" fill="#e5bdbc" stroke="#ce8d8c" stroke-width="1"/><text x="406.0" y="621.2" font-size="11" fill="#6e2120" font-weight="700" text-anchor="middle">↔ 3</text><rect x="459.0" y="599.2" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#ce8d8c" stroke-width="1.4"/><rect x="459.0" y="607.2" width="5" height="62.2" rx="2" fill="#ac3b39"/><text x="475.0" y="621.2" font-size="13.5" fill="#6e2120" font-weight="700" text-anchor="start"><tspan x="475.0">Costo de la tolerancia</tspan></text><text x="475.0" y="641.0" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Efecto acumulado de permitir prácticas indebidas por</tspan><tspan x="475.0" dy="15.2">resultado</tspan></text><text x="40" y="709.3600000000001" font-size="11.5" fill="#ac3b39" font-weight="700" letter-spacing="1.4">QUÉ SE MIDE: NUMERADOR SOBRE DENOMINADOR</text><rect x="40.0" y="723.4" width="261.3" height="137.9" rx="8" fill="#f7e2e2" stroke="#ce8d8c" stroke-width="1.4"/><text x="54.0" y="745.4" font-size="13" fill="#6e2120" font-weight="700" text-anchor="start"><tspan x="54.0">Reclamos por promesas</tspan><tspan x="54.0" dy="17.2">incumplidas</tspan></text><text x="54.0" y="791.7" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Reclamos vinculados a compromisos</tspan><tspan x="54.0" dy="15.2">comerciales</tspan></text><line x1="54.0" y1="828.0" x2="287.3" y2="828.0" stroke="#ac3b39" stroke-width="2"/><text x="54.0" y="846.0" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="54.0">Ventas del periodo</tspan></text><rect x="319.3" y="723.4" width="261.3" height="137.9" rx="8" fill="#f7e2e2" stroke="#ce8d8c" stroke-width="1.4"/><text x="333.3" y="745.4" font-size="13" fill="#6e2120" font-weight="700" text-anchor="start"><tspan x="333.3">Casos de incumplimiento con</tspan><tspan x="333.3" dy="17.2">consecuencia</tspan></text><text x="333.3" y="791.7" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="333.3">Incumplimientos con acción</tspan><tspan x="333.3" dy="15.2">documentada</tspan></text><line x1="333.3" y1="828.0" x2="566.7" y2="828.0" stroke="#ac3b39" stroke-width="2"/><text x="333.3" y="846.0" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="333.3">Incumplimientos detectados</tspan></text><rect x="598.7" y="723.4" width="261.3" height="137.9" rx="8" fill="#f7e2e2" stroke="#ce8d8c" stroke-width="1.4"/><text x="612.7" y="745.4" font-size="13" fill="#6e2120" font-weight="700" text-anchor="start"><tspan x="612.7">Rotación asociada a clima</tspan></text><text x="612.7" y="774.5" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="612.7">Salidas cuyo motivo declarado es</tspan><tspan x="612.7" dy="15.2">clima o prácticas</tspan></text><line x1="612.7" y1="810.9" x2="846.0" y2="810.9" stroke="#ac3b39" stroke-width="2"/><text x="612.7" y="828.9" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="612.7">Salidas totales</tspan></text><text x="40" y="895.2200000000001" font-size="11.5" fill="#ac3b39" font-weight="700" letter-spacing="1.4">FRONTERA DE APLICACIÓN</text><rect x="40" y="905.2" width="820" height="65.0" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.4"/><polygon points="70,922.7200000000001 52,951.7200000000001 88,951.7200000000001" fill="#c2410c"/><text x="70" y="948.7200000000001" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">!</text><text x="106" y="929.2" font-size="12.5" fill="#7c2d12" font-weight="400" text-anchor="start"><tspan x="106">Una cultura estricta sin criterio produce parálisis y ocultamiento. Debe existir un mecanismo para</tspan><tspan x="106" dy="16.5">plantear casos límite sin costo para quien los plantea.</tspan></text><text x="40" y="998.2200000000001" font-size="11.5" fill="#ac3b39" font-weight="700" letter-spacing="1.4">ERROR FRECUENTE Y SU CORRECCIÓN</text><rect x="40" y="1008.2" width="380.0" height="77.0" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/><text x="54" y="1030.2" font-size="11" fill="#b91c1c" font-weight="700" text-anchor="start"><tspan x="54">Síntoma</tspan></text><text x="54" y="1048.2" font-size="12.5" fill="#7f1d1d" font-weight="400" text-anchor="start"><tspan x="54">Premiar un resultado obtenido cruzando una línea</tspan></text><line x1="426.0" y1="1046.7" x2="469.0" y2="1046.7" stroke="#ac3b39" stroke-width="2.6" stroke-linecap="round"/><polygon points="474.0,1046.7 465.9,1050.6 465.9,1042.8" fill="#ac3b39"/><rect x="480.0" y="1008.2" width="380.0" height="77.0" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.4"/><text x="494.0" y="1030.2" font-size="11" fill="#15803d" font-weight="700" text-anchor="start"><tspan x="494.0">Corrección</tspan></text><text x="494.0" y="1048.2" font-size="12.5" fill="#14532d" font-weight="400" text-anchor="start"><tspan x="494.0">Actúa visiblemente ante el primer caso: la ausencia</tspan><tspan x="494.0" dy="16.5">de consecuencia es la política real.</tspan></text></svg>