<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 966" width="900" height="966" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif"><title id="t">Modelo mental · Challenger Sale</title><desc id="d">Modelo mental de la clase 09.03: Challenger Sale. Método en 5 pasos; 4 conceptos; 3 señales de medición.</desc><rect x="0" y="0" width="900" height="966" rx="14" fill="#ffffff"/><rect x="0" y="0" width="900" height="64" rx="14" fill="#6a6e20"/><rect x="0" y="40" width="900" height="24" fill="#6a6e20"/><text x="40" y="28" font-size="12" fill="#e3e5bc" font-weight="700" letter-spacing="1.6">MODELO MENTAL · CLASE 09.03 · PARTE 09</text><text x="40" y="52" font-size="21" fill="#ffffff" font-weight="700">Challenger Sale</text><text x="40" y="84" font-size="11.5" fill="#a6ac39" font-weight="700" letter-spacing="1.4">MÉTODO PASO A PASO</text><line x1="450.0" y1="94.0" x2="450.0" y2="317.0" stroke="#cace8c" stroke-width="3" stroke-linecap="round"/><line x1="450.0" y1="129.5" x2="406.0" y2="129.5" stroke="#cace8c" stroke-width="2"/><rect x="56.0" y="100" width="350" height="59.0" rx="10" fill="#f6f7e2" stroke="#cace8c" stroke-width="1.4"/><text x="70.0" y="122" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="70.0">Construir el insight con datos propios o de</tspan><tspan x="70.0" dy="16.5">mercado</tspan></text><circle cx="450.0" cy="129.5" r="15" fill="#6a6e20"/><text x="450.0" y="134.0" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><line x1="450.0" y1="159.2" x2="494.0" y2="159.2" stroke="#cace8c" stroke-width="2"/><rect x="494.0" y="138" width="350" height="42.5" rx="10" fill="#f6f7e2" stroke="#cace8c" stroke-width="1.4"/><text x="508.0" y="160" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="508.0">Reencuadrar el problema y verificar la reacción</tspan></text><circle cx="450.0" cy="159.2" r="15" fill="#6a6e20"/><text x="450.0" y="163.8" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><line x1="450.0" y1="197.2" x2="406.0" y2="197.2" stroke="#cace8c" stroke-width="2"/><rect x="56.0" y="176" width="350" height="42.5" rx="10" fill="#f6f7e2" stroke="#cace8c" stroke-width="1.4"/><text x="70.0" y="198" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="70.0">Adaptar el insight a la economía del cliente</tspan></text><circle cx="450.0" cy="197.2" r="15" fill="#6a6e20"/><text x="450.0" y="201.8" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><line x1="450.0" y1="235.2" x2="494.0" y2="235.2" stroke="#cace8c" stroke-width="2"/><rect x="494.0" y="214" width="350" height="42.5" rx="10" fill="#f6f7e2" stroke="#cace8c" stroke-width="1.4"/><text x="508.0" y="236" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="508.0">Conducir la conversación de decisión y proceso</tspan></text><circle cx="450.0" cy="235.2" r="15" fill="#6a6e20"/><text x="450.0" y="239.8" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">4</text><line x1="450.0" y1="281.5" x2="406.0" y2="281.5" stroke="#cace8c" stroke-width="2"/><rect x="56.0" y="252" width="350" height="59.0" rx="10" fill="#f6f7e2" stroke="#cace8c" stroke-width="1.4"/><text x="70.0" y="274" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="70.0">Verificar si el reencuadre modificó el criterio</tspan><tspan x="70.0" dy="16.5">del cliente</tspan></text><circle cx="450.0" cy="281.5" r="15" fill="#6a6e20"/><text x="450.0" y="286.0" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">5</text><text x="40" y="353.0" font-size="11.5" fill="#a6ac39" font-weight="700" letter-spacing="1.4">CONCEPTOS Y DÓNDE ACTÚAN EN EL MÉTODO</text><rect x="40.0" y="367.0" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#cace8c" stroke-width="1.4"/><rect x="40.0" y="375.0" width="5" height="62.2" rx="2" fill="#a6ac39"/><text x="56.0" y="389.0" font-size="13.5" fill="#6a6e20" font-weight="700" text-anchor="start"><tspan x="56.0">Insight comercial</tspan></text><text x="56.0" y="408.8" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Perspectiva basada en evidencia que cambia cómo el cliente</tspan><tspan x="56.0" dy="15.2">entiende su problema</tspan></text><rect x="379.0" y="375.0" width="54" height="20" rx="10" fill="#e3e5bc" stroke="#cace8c" stroke-width="1"/><text x="406.0" y="389.0" font-size="11" fill="#6a6e20" font-weight="700" text-anchor="middle">↔ 1, 3</text><rect x="459.0" y="367.0" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#cace8c" stroke-width="1.4"/><rect x="459.0" y="375.0" width="5" height="62.2" rx="2" fill="#a6ac39"/><text x="475.0" y="389.0" font-size="13.5" fill="#6a6e20" font-weight="700" text-anchor="start"><tspan x="475.0">Reencuadre</tspan></text><text x="475.0" y="408.8" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Presentación del problema en términos distintos a los que</tspan><tspan x="475.0" dy="15.2">el cliente traía</tspan></text><rect x="798.0" y="375.0" width="54" height="20" rx="10" fill="#e3e5bc" stroke="#cace8c" stroke-width="1"/><text x="825.0" y="389.0" font-size="11" fill="#6a6e20" font-weight="700" text-anchor="middle">↔ 2, 5</text><rect x="40.0" y="459.2" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#cace8c" stroke-width="1.4"/><rect x="40.0" y="467.2" width="5" height="62.2" rx="2" fill="#a6ac39"/><text x="56.0" y="481.2" font-size="13.5" fill="#6a6e20" font-weight="700" text-anchor="start"><tspan x="56.0">Adaptación económica</tspan></text><text x="56.0" y="501.0" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Traducción del insight a la realidad de costos y</tspan><tspan x="56.0" dy="15.2">prioridades del cliente</tspan></text><rect x="379.0" y="467.2" width="54" height="20" rx="10" fill="#e3e5bc" stroke="#cace8c" stroke-width="1"/><text x="406.0" y="481.2" font-size="11" fill="#6a6e20" font-weight="700" text-anchor="middle">↔ 3</text><rect x="459.0" y="459.2" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#cace8c" stroke-width="1.4"/><rect x="459.0" y="467.2" width="5" height="62.2" rx="2" fill="#a6ac39"/><text x="475.0" y="481.2" font-size="13.5" fill="#6a6e20" font-weight="700" text-anchor="start"><tspan x="475.0">Control constructivo</tspan></text><text x="475.0" y="501.0" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Capacidad de conducir la conversación de precio y proceso</tspan><tspan x="475.0" dy="15.2">sin ceder ni imponer</tspan></text><rect x="798.0" y="467.2" width="54" height="20" rx="10" fill="#e3e5bc" stroke="#cace8c" stroke-width="1"/><text x="825.0" y="481.2" font-size="11" fill="#6a6e20" font-weight="700" text-anchor="middle">↔ 1, 4</text><text x="40" y="569.36" font-size="11.5" fill="#a6ac39" font-weight="700" letter-spacing="1.4">QUÉ SE MIDE: NUMERADOR SOBRE DENOMINADOR</text><rect x="40.0" y="583.4" width="261.3" height="120.7" rx="8" fill="#f6f7e2" stroke="#cace8c" stroke-width="1.4"/><text x="54.0" y="605.4" font-size="13" fill="#6a6e20" font-weight="700" text-anchor="start"><tspan x="54.0">Negocios con insight documentado</tspan></text><text x="54.0" y="634.5" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Oportunidades donde se presentó un</tspan><tspan x="54.0" dy="15.2">insight verificable</tspan></text><line x1="54.0" y1="670.9" x2="287.3" y2="670.9" stroke="#a6ac39" stroke-width="2"/><text x="54.0" y="688.9" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="54.0">Oportunidades trabajadas</tspan></text><rect x="319.3" y="583.4" width="261.3" height="120.7" rx="8" fill="#f6f7e2" stroke="#cace8c" stroke-width="1.4"/><text x="333.3" y="605.4" font-size="13" fill="#6a6e20" font-weight="700" text-anchor="start"><tspan x="333.3">Cambio de criterio del cliente</tspan></text><text x="333.3" y="634.5" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="333.3">Casos donde el cliente incorporó un</tspan><tspan x="333.3" dy="15.2">criterio nuevo</tspan></text><line x1="333.3" y1="670.9" x2="566.7" y2="670.9" stroke="#a6ac39" stroke-width="2"/><text x="333.3" y="688.9" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="333.3">Reencuadres presentados</tspan></text><rect x="598.7" y="583.4" width="261.3" height="120.7" rx="8" fill="#f6f7e2" stroke="#cace8c" stroke-width="1.4"/><text x="612.7" y="605.4" font-size="13" fill="#6a6e20" font-weight="700" text-anchor="start"><tspan x="612.7">Tasa de cierre con reencuadre</tspan></text><text x="612.7" y="634.5" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="612.7">Negocios ganados con reencuadre</tspan><tspan x="612.7" dy="15.2">aplicado, frente a los sin</tspan><tspan x="612.7" dy="15.2">reencuadre</tspan></text><text x="40" y="738.06" font-size="11.5" fill="#a6ac39" font-weight="700" letter-spacing="1.4">FRONTERA DE APLICACIÓN</text><rect x="40" y="748.1" width="820" height="65.0" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.4"/><polygon points="70,765.56 52,794.56 88,794.56" fill="#c2410c"/><text x="70" y="791.56" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">!</text><text x="106" y="772.1" font-size="12.5" fill="#7c2d12" font-weight="400" text-anchor="start"><tspan x="106">El modelo exige una organización que produzca insights con evidencia. Sin ese soporte, el vendedor sólo</tspan><tspan x="106" dy="16.5">tiene opinión y el enfoque se vuelve contraproducente.</tspan></text><text x="40" y="841.06" font-size="11.5" fill="#a6ac39" font-weight="700" letter-spacing="1.4">ERROR FRECUENTE Y SU CORRECCIÓN</text><rect x="40" y="851.1" width="380.0" height="77.0" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/><text x="54" y="873.1" font-size="11" fill="#b91c1c" font-weight="700" text-anchor="start"><tspan x="54">Síntoma</tspan></text><text x="54" y="891.1" font-size="12.5" fill="#7f1d1d" font-weight="400" text-anchor="start"><tspan x="54">Desafiar sin evidencia que respalde el insight</tspan></text><line x1="426.0" y1="889.6" x2="469.0" y2="889.6" stroke="#a6ac39" stroke-width="2.6" stroke-linecap="round"/><polygon points="474.0,889.6 465.9,893.5 465.9,885.6" fill="#a6ac39"/><rect x="480.0" y="851.1" width="380.0" height="77.0" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.4"/><text x="494.0" y="873.1" font-size="11" fill="#15803d" font-weight="700" text-anchor="start"><tspan x="494.0">Corrección</tspan></text><text x="494.0" y="891.1" font-size="12.5" fill="#14532d" font-weight="400" text-anchor="start"><tspan x="494.0">Construye el insight con datos verificables antes</tspan><tspan x="494.0" dy="16.5">de cuestionar el criterio del cliente.</tspan></text></svg>