<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 908" width="900" height="908" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif"><title id="t">Modelo mental · Diseño de encuestas</title><desc id="d">Modelo mental de la clase 03.04: Diseño de encuestas. Método en 5 pasos; 4 conceptos; 3 señales de medición.</desc><rect x="0" y="0" width="900" height="908" rx="14" fill="#ffffff"/><rect x="0" y="0" width="900" height="64" rx="14" fill="#206e3b"/><rect x="0" y="40" width="900" height="24" fill="#206e3b"/><text x="40" y="28" font-size="12" fill="#bce5ca" font-weight="700" letter-spacing="1.6">MODELO MENTAL · CLASE 03.04 · PARTE 03</text><text x="40" y="52" font-size="21" fill="#ffffff" font-weight="700">Diseño de encuestas</text><text x="40" y="84" font-size="11.5" fill="#39ac61" font-weight="700" letter-spacing="1.4">MÉTODO PASO A PASO</text><rect x="40.0" y="100" width="246.7" height="59.0" rx="10" fill="#e2f7e9" stroke="#8ccea3" stroke-width="1.4"/><text x="54.0" y="122" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Definir el concepto a medir y su</tspan><tspan x="54.0" dy="16.5">definición operacional</tspan></text><circle cx="42.0" cy="102.0" r="14" fill="#206e3b"/><text x="42.0" y="106.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><rect x="326.7" y="100" width="246.7" height="59.0" rx="10" fill="#e2f7e9" stroke="#8ccea3" stroke-width="1.4"/><text x="340.7" y="122" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="340.7">Redactar preguntas neutras y</tspan><tspan x="340.7" dy="16.5">probarlas con cinco personas</tspan></text><circle cx="328.7" cy="102.0" r="14" fill="#206e3b"/><text x="328.7" y="106.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><rect x="613.3" y="100" width="246.7" height="59.0" rx="10" fill="#e2f7e9" stroke="#8ccea3" stroke-width="1.4"/><text x="627.3" y="122" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="627.3">Elegir escalas consistentes y</tspan><tspan x="627.3" dy="16.5">evitar preguntas dobles</tspan></text><circle cx="615.3" cy="102.0" r="14" fill="#206e3b"/><text x="615.3" y="106.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><rect x="613.3" y="197.0" width="246.7" height="75.5" rx="10" fill="#e2f7e9" stroke="#8ccea3" stroke-width="1.4"/><text x="627.3" y="219.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="627.3">Pilotear y depurar antes de</tspan><tspan x="627.3" dy="16.5">terreno</tspan></text><circle cx="615.3" cy="199.0" r="14" fill="#206e3b"/><text x="615.3" y="203.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">4</text><rect x="326.7" y="197.0" width="246.7" height="75.5" rx="10" fill="#e2f7e9" stroke="#8ccea3" stroke-width="1.4"/><text x="340.7" y="219.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="340.7">Documentar tasa de respuesta y</tspan><tspan x="340.7" dy="16.5">perfil de quienes no</tspan><tspan x="340.7" dy="16.5">respondieron</tspan></text><circle cx="328.7" cy="199.0" r="14" fill="#206e3b"/><text x="328.7" y="203.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">5</text><line x1="289.7" y1="129.5" x2="318.7" y2="129.5" stroke="#39ac61" stroke-width="2.2" stroke-linecap="round"/><polygon points="323.7,129.5 315.6,133.4 315.6,125.6" fill="#39ac61"/><line x1="576.3" y1="129.5" x2="605.3" y2="129.5" stroke="#39ac61" stroke-width="2.2" stroke-linecap="round"/><polygon points="610.3,129.5 602.2,133.4 602.2,125.6" fill="#39ac61"/><line x1="736.7" y1="161.0" x2="736.7" y2="189.0" stroke="#39ac61" stroke-width="2.2" stroke-linecap="round"/><polygon points="736.7,194.0 732.8,185.9 740.6,185.9" fill="#39ac61"/><line x1="610.3" y1="234.8" x2="581.3" y2="234.8" stroke="#39ac61" stroke-width="2.2" stroke-linecap="round"/><polygon points="576.3,234.8 584.4,230.8 584.4,238.7" fill="#39ac61"/><text x="40" y="310.5" font-size="11.5" fill="#39ac61" font-weight="700" letter-spacing="1.4">CONCEPTOS Y DÓNDE ACTÚAN EN EL MÉTODO</text><rect x="40.0" y="324.5" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#8ccea3" stroke-width="1.4"/><rect x="40.0" y="332.5" width="5" height="62.2" rx="2" fill="#39ac61"/><text x="56.0" y="346.5" font-size="13.5" fill="#206e3b" font-weight="700" text-anchor="start"><tspan x="56.0">Validez de constructo</tspan></text><text x="56.0" y="366.3" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Grado en que la pregunta mide efectivamente el concepto</tspan><tspan x="56.0" dy="15.2">que dice medir</tspan></text><rect x="379.0" y="332.5" width="54" height="20" rx="10" fill="#bce5ca" stroke="#8ccea3" stroke-width="1"/><text x="406.0" y="346.5" font-size="11" fill="#206e3b" font-weight="700" text-anchor="middle">↔ 1</text><rect x="459.0" y="324.5" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#8ccea3" stroke-width="1.4"/><rect x="459.0" y="332.5" width="5" height="62.2" rx="2" fill="#39ac61"/><text x="475.0" y="346.5" font-size="13.5" fill="#206e3b" font-weight="700" text-anchor="start"><tspan x="475.0">Pregunta sesgada</tspan></text><text x="475.0" y="366.3" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Formulación que orienta la respuesta por su redacción,</tspan><tspan x="475.0" dy="15.2">orden u opciones</tspan></text><rect x="798.0" y="332.5" width="54" height="20" rx="10" fill="#bce5ca" stroke="#8ccea3" stroke-width="1"/><text x="825.0" y="346.5" font-size="11" fill="#206e3b" font-weight="700" text-anchor="middle">↔ 2, 3</text><rect x="40.0" y="416.7" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#8ccea3" stroke-width="1.4"/><rect x="40.0" y="424.7" width="5" height="62.2" rx="2" fill="#39ac61"/><text x="56.0" y="438.7" font-size="13.5" fill="#206e3b" font-weight="700" text-anchor="start"><tspan x="56.0">Escala</tspan></text><text x="56.0" y="458.5" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Conjunto ordenado de opciones con significado uniforme</tspan><tspan x="56.0" dy="15.2">para todos los respondentes</tspan></text><rect x="379.0" y="424.7" width="54" height="20" rx="10" fill="#bce5ca" stroke="#8ccea3" stroke-width="1"/><text x="406.0" y="438.7" font-size="11" fill="#206e3b" font-weight="700" text-anchor="middle">↔ 3</text><rect x="459.0" y="416.7" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#8ccea3" stroke-width="1.4"/><rect x="459.0" y="424.7" width="5" height="62.2" rx="2" fill="#39ac61"/><text x="475.0" y="438.7" font-size="13.5" fill="#206e3b" font-weight="700" text-anchor="start"><tspan x="475.0">Tasa de respuesta</tspan></text><text x="475.0" y="458.5" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Proporción de personas invitadas que completaron el</tspan><tspan x="475.0" dy="15.2">instrumento</tspan></text><rect x="798.0" y="424.7" width="54" height="20" rx="10" fill="#bce5ca" stroke="#8ccea3" stroke-width="1"/><text x="825.0" y="438.7" font-size="11" fill="#206e3b" font-weight="700" text-anchor="middle">↔ 5</text><text x="40" y="526.86" font-size="11.5" fill="#39ac61" font-weight="700" letter-spacing="1.4">QUÉ SE MIDE: NUMERADOR SOBRE DENOMINADOR</text><rect x="40.0" y="540.9" width="261.3" height="105.5" rx="8" fill="#e2f7e9" stroke="#8ccea3" stroke-width="1.4"/><text x="54.0" y="562.9" font-size="13" fill="#206e3b" font-weight="700" text-anchor="start"><tspan x="54.0">Tasa de respuesta</tspan></text><text x="54.0" y="592.0" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Cuestionarios completos</tspan></text><line x1="54.0" y1="613.2" x2="287.3" y2="613.2" stroke="#39ac61" stroke-width="2"/><text x="54.0" y="631.2" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="54.0">Invitaciones enviadas, por canal</tspan></text><rect x="319.3" y="540.9" width="261.3" height="105.5" rx="8" fill="#e2f7e9" stroke="#8ccea3" stroke-width="1.4"/><text x="333.3" y="562.9" font-size="13" fill="#206e3b" font-weight="700" text-anchor="start"><tspan x="333.3">Tasa de abandono por pregunta</tspan></text><text x="333.3" y="592.0" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="333.3">Abandonos en cada pregunta</tspan></text><line x1="333.3" y1="613.2" x2="566.7" y2="613.2" stroke="#39ac61" stroke-width="2"/><text x="333.3" y="631.2" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="333.3">Respondentes que llegaron a ella</tspan></text><rect x="598.7" y="540.9" width="261.3" height="105.5" rx="8" fill="#e2f7e9" stroke="#8ccea3" stroke-width="1.4"/><text x="612.7" y="562.9" font-size="13" fill="#206e3b" font-weight="700" text-anchor="start"><tspan x="612.7">Consistencia interna</tspan></text><text x="612.7" y="592.0" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="612.7">Correlación entre preguntas que</tspan><tspan x="612.7" dy="15.2">miden el mismo constructo</tspan></text><text x="40" y="680.38" font-size="11.5" fill="#39ac61" font-weight="700" letter-spacing="1.4">FRONTERA DE APLICACIÓN</text><rect x="40" y="690.4" width="820" height="65.0" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.4"/><polygon points="70,707.88 52,736.88 88,736.88" fill="#c2410c"/><text x="70" y="733.88" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">!</text><text x="106" y="714.4" font-size="12.5" fill="#7c2d12" font-weight="400" text-anchor="start"><tspan x="106">Una encuesta bien diseñada con muestra sesgada sigue siendo inútil. El diseño del instrumento no compensa</tspan><tspan x="106" dy="16.5">un problema de muestreo.</tspan></text><text x="40" y="783.38" font-size="11.5" fill="#39ac61" font-weight="700" letter-spacing="1.4">ERROR FRECUENTE Y SU CORRECCIÓN</text><rect x="40" y="793.4" width="380.0" height="77.0" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/><text x="54" y="815.4" font-size="11" fill="#b91c1c" font-weight="700" text-anchor="start"><tspan x="54">Síntoma</tspan></text><text x="54" y="833.4" font-size="12.5" fill="#7f1d1d" font-weight="400" text-anchor="start"><tspan x="54">Preguntar y medir sin haber descubierto las</tspan><tspan x="54" dy="16.5">categorías</tspan></text><line x1="426.0" y1="831.9" x2="469.0" y2="831.9" stroke="#39ac61" stroke-width="2.6" stroke-linecap="round"/><polygon points="474.0,831.9 465.9,835.8 465.9,828.0" fill="#39ac61"/><rect x="480.0" y="793.4" width="380.0" height="77.0" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.4"/><text x="494.0" y="815.4" font-size="11" fill="#15803d" font-weight="700" text-anchor="start"><tspan x="494.0">Corrección</tspan></text><text x="494.0" y="833.4" font-size="12.5" fill="#14532d" font-weight="400" text-anchor="start"><tspan x="494.0">Ejecuta entrevistas cualitativas antes de fijar las</tspan><tspan x="494.0" dy="16.5">opciones de respuesta de la encuesta.</tspan></text></svg>