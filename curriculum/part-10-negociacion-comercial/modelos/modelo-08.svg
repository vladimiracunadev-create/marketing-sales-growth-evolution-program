<circle cx="49.2" cy="277.3" r="14" fill="#2d6e20"/><text x="49.2" y="281.8" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">5</text><text x="40" y="689.6" font-size="11.5" fill="#4cac39" font-weight="700" letter-spacing="1.4">CONCEPTOS Y DÓNDE ACTÚAN EN EL MÉTODO</text><rect x="40.0" y="703.6" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#97ce8c" stroke-width="1.4"/><rect x="40.0" y="711.6" width="5" height="62.2" rx="2" fill="#4cac39"/><text x="56.0" y="725.6" font-size="13.5" fill="#2d6e20" font-weight="700" text-anchor="start"><tspan x="56.0">Línea base de alcance</tspan></text><text x="56.0" y="745.4" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Conjunto documentado de entregables acordados y sus</tspan><tspan x="56.0" dy="15.2">exclusiones</tspan></text><rect x="379.0" y="711.6" width="54" height="20" rx="10" fill="#c3e5bc" stroke="#97ce8c" stroke-width="1"/><text x="406.0" y="725.6" font-size="11" fill="#2d6e20" font-weight="700" text-anchor="middle">↔ 1, 5</text><rect x="459.0" y="703.6" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#97ce8c" stroke-width="1.4"/><rect x="459.0" y="711.6" width="5" height="62.2" rx="2" fill="#4cac39"/><text x="475.0" y="725.6" font-size="13.5" fill="#2d6e20" font-weight="700" text-anchor="start"><tspan x="475.0">Cambio de alcance</tspan></text><text x="475.0" y="745.4" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Modificación posterior que altera esfuerzo, costo o plazo</tspan></text><rect x="798.0" y="711.6" width="54" height="20" rx="10" fill="#c3e5bc" stroke="#97ce8c" stroke-width="1"/><text x="825.0" y="725.6" font-size="11" fill="#2d6e20" font-weight="700" text-anchor="middle">↔ 3, 5</text><rect x="40.0" y="795.8" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#97ce8c" stroke-width="1.4"/><rect x="40.0" y="803.8" width="5" height="62.2" rx="2" fill="#4cac39"/><text x="56.0" y="817.8" font-size="13.5" fill="#2d6e20" font-weight="700" text-anchor="start"><tspan x="56.0">Costo unitario de cada elemento</tspan></text><text x="56.0" y="837.6" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Valorización interna de cada componente del alcance</tspan></text><rect x="379.0" y="803.8" width="54" height="20" rx="10" fill="#c3e5bc" stroke="#97ce8c" stroke-width="1"/><text x="406.0" y="817.8" font-size="11" fill="#2d6e20" font-weight="700" text-anchor="middle">↔ 2</text><rect x="459.0" y="795.8" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#97ce8c" stroke-width="1.4"/><rect x="459.0" y="803.8" width="5" height="62.2" rx="2" fill="#4cac39"/><text x="475.0" y="817.8" font-size="13.5" fill="#2d6e20" font-weight="700" text-anchor="start"><tspan x="475.0">Procedimiento de cambio</tspan></text><text x="475.0" y="837.6" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Regla que define cómo se aprueba y se cobra una</tspan><tspan x="475.0" dy="15.2">modificación</tspan></text><rect x="798.0" y="803.8" width="54" height="20" rx="10" fill="#c3e5bc" stroke="#97ce8c" stroke-width="1"/><text x="825.0" y="817.8" font-size="11" fill="#2d6e20" font-weight="700" text-anchor="middle">↔ 3, 4</text><text x="40" y="905.96" font-size="11.5" fill="#4cac39" font-weight="700" letter-spacing="1.4">QUÉ SE MIDE: NUMERADOR SOBRE DENOMINADOR</text><rect x="40.0" y="920.0" width="261.3" height="120.7" rx="8" fill="#e6f7e2" stroke="#97ce8c" stroke-width="1.4"/><text x="54.0" y="942.0" font-size="13" fill="#2d6e20" font-weight="700" text-anchor="start"><tspan x="54.0">Desviación de alcance</tspan></text><text x="54.0" y="971.1" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Horas ejecutadas por sobre lo</tspan><tspan x="54.0" dy="15.2">acordado</tspan></text><line x1="54.0" y1="1007.5" x2="287.3" y2="1007.5" stroke="#4cac39" stroke-width="2"/><text x="54.0" y="1025.5" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="54.0">Horas presupuestadas, por proyecto</tspan></text><rect x="319.3" y="920.0" width="261.3" height="120.7" rx="8" fill="#e6f7e2" stroke="#97ce8c" stroke-width="1.4"/><text x="333.3" y="942.0" font-size="13" fill="#2d6e20" font-weight="700" text-anchor="start"><tspan x="333.3">Cambios documentados</tspan></text><text x="333.3" y="971.1" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="333.3">Cambios de alcance con aprobación</tspan><tspan x="333.3" dy="15.2">registrada</tspan></text><line x1="333.3" y1="1007.5" x2="566.7" y2="1007.5" stroke="#4cac39" stroke-width="2"/><text x="333.3" y="1025.5" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="333.3">Cambios ejecutados</tspan></text><rect x="598.7" y="920.0" width="261.3" height="120.7" rx="8" fill="#e6f7e2" stroke="#97ce8c" stroke-width="1.4"/><text x="612.7" y="942.0" font-size="13" fill="#2d6e20" font-weight="700" text-anchor="start"><tspan x="612.7">Margen real por proyecto</tspan></text><text x="612.7" y="971.1" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="612.7">Ingreso menos costo real de</tspan><tspan x="612.7" dy="15.2">ejecución</tspan></text><line x1="612.7" y1="1007.5" x2="846.0" y2="1007.5" stroke="#4cac39" stroke-width="2"/><text x="612.7" y="1025.5" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="612.7">Ingreso del proyecto</tspan></text><text x="40" y="1074.66" font-size="11.5" fill="#4cac39" font-weight="700" letter-spacing="1.4">FRONTERA DE APLICACIÓN</text><rect x="40" y="1084.7" width="820" height="65.0" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.4"/><polygon points="70,1102.16 52,1131.16 88,1131.16" fill="#c2410c"/><text x="70" y="1128.16" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">!</text><text x="106" y="1108.7" font-size="12.5" fill="#7c2d12" font-weight="400" text-anchor="start"><tspan x="106">Un procedimiento de cambio rígido en proyectos pequeños puede deteriorar la relación por montos menores.</tspan><tspan x="106" dy="16.5">El umbral de aplicación debe ser proporcional.</tspan></text><text x="40" y="1177.66" font-size="11.5" fill="#4cac39" font-weight="700" letter-spacing="1.4">ERROR FRECUENTE Y SU CORRECCIÓN</text><rect x="40" y="1187.7" width="380.0" height="77.0" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/><text x="54" y="1209.7" font-size="11" fill="#b91c1c" font-weight="700" text-anchor="start"><tspan x="54">Síntoma</tspan></text><text x="54" y="1227.7" font-size="12.5" fill="#7f1d1d" font-weight="400" text-anchor="start"><tspan x="54">Aceptar ampliaciones informales de alcance</tspan></text><line x1="426.0" y1="1226.2" x2="469.0" y2="1226.2" stroke="#4cac39" stroke-width="2.6" stroke-linecap="round"/><polygon points="474.0,1226.2 465.9,1230.1 465.9,1222.2" fill="#4cac39"/><rect x="480.0" y="1187.7" width="380.0" height="77.0" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.4"/><text x="494.0" y="1209.7" font-size="11" fill="#15803d" font-weight="700" text-anchor="start"><tspan x="494.0">Corrección</tspan></text><text x="494.0" y="1227.7" font-size="12.5" fill="#14532d" font-weight="400" text-anchor="start"><tspan x="494.0">Aplica el procedimiento de cambio a toda</tspan><tspan x="494.0" dy="16.5">modificación que supere el umbral definido.</tspan></text></svg>