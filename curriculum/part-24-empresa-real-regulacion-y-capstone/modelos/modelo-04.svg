<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 934" width="900" height="934" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif"><title id="t">Modelo mental · Oferta y pricing del Capstone</title><desc id="d">Modelo mental de la clase 24.04: Oferta y pricing del Capstone. Método en 5 pasos; 4 conceptos; 3 señales de medición.</desc><rect x="0" y="0" width="900" height="934" rx="14" fill="#ffffff"/><rect x="0" y="0" width="900" height="64" rx="14" fill="#6e5e20"/><rect x="0" y="40" width="900" height="24" fill="#6e5e20"/><text x="40" y="28" font-size="12" fill="#e5ddbc" font-weight="700" letter-spacing="1.6">MODELO MENTAL · CLASE 24.04 · PARTE 24</text><text x="40" y="52" font-size="21" fill="#ffffff" font-weight="700">Oferta y pricing del Capstone</text><text x="40" y="84" font-size="11.5" fill="#ac9539" font-weight="700" letter-spacing="1.4">MÉTODO PASO A PASO</text><line x1="450.0" y1="94.0" x2="450.0" y2="300.5" stroke="#cec08c" stroke-width="3" stroke-linecap="round"/><line x1="450.0" y1="121.2" x2="406.0" y2="121.2" stroke="#cec08c" stroke-width="2"/><rect x="56.0" y="100" width="350" height="42.5" rx="10" fill="#f7f3e2" stroke="#cec08c" stroke-width="1.4"/><text x="70.0" y="122" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="70.0">Definir la oferta con alcance y exclusiones</tspan></text><circle cx="450.0" cy="121.2" r="15" fill="#6e5e20"/><text x="450.0" y="125.8" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><line x1="450.0" y1="159.2" x2="494.0" y2="159.2" stroke="#cec08c" stroke-width="2"/><rect x="494.0" y="138" width="350" height="42.5" rx="10" fill="#f7f3e2" stroke="#cec08c" stroke-width="1.4"/><text x="508.0" y="160" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="508.0">Fundamentar el precio con evidencia de valor</tspan></text><circle cx="450.0" cy="159.2" r="15" fill="#6e5e20"/><text x="450.0" y="163.8" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><line x1="450.0" y1="197.2" x2="406.0" y2="197.2" stroke="#cec08c" stroke-width="2"/><rect x="56.0" y="176" width="350" height="42.5" rx="10" fill="#f7f3e2" stroke="#cec08c" stroke-width="1.4"/><text x="70.0" y="198" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="70.0">Calcular la economía unitaria completa</tspan></text><circle cx="450.0" cy="197.2" r="15" fill="#6e5e20"/><text x="450.0" y="201.8" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><line x1="450.0" y1="243.5" x2="494.0" y2="243.5" stroke="#cec08c" stroke-width="2"/><rect x="494.0" y="214" width="350" height="59.0" rx="10" fill="#f7f3e2" stroke="#cec08c" stroke-width="1.4"/><text x="508.0" y="236" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="508.0">Verificar la coherencia con la capacidad</tspan><tspan x="508.0" dy="16.5">operativa</tspan></text><circle cx="450.0" cy="243.5" r="15" fill="#6e5e20"/><text x="450.0" y="248.0" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">4</text><line x1="450.0" y1="273.2" x2="406.0" y2="273.2" stroke="#cec08c" stroke-width="2"/><rect x="56.0" y="252" width="350" height="42.5" rx="10" fill="#f7f3e2" stroke="#cec08c" stroke-width="1.4"/><text x="70.0" y="274" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="70.0">Declarar los supuestos y su sensibilidad</tspan></text><circle cx="450.0" cy="273.2" r="15" fill="#6e5e20"/><text x="450.0" y="277.8" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">5</text><text x="40" y="336.5" font-size="11.5" fill="#ac9539" font-weight="700" letter-spacing="1.4">CONCEPTOS Y DÓNDE ACTÚAN EN EL MÉTODO</text><rect x="40.0" y="350.5" width="401.0" height="63.0" rx="8" fill="#ffffff" stroke="#cec08c" stroke-width="1.4"/><rect x="40.0" y="358.5" width="5" height="47.0" rx="2" fill="#ac9539"/><text x="56.0" y="372.5" font-size="13.5" fill="#6e5e20" font-weight="700" text-anchor="start"><tspan x="56.0">Estructura de oferta</tspan></text><text x="56.0" y="392.3" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Conjunto de planes, alcances y condiciones definidos</tspan></text><rect x="379.0" y="358.5" width="54" height="20" rx="10" fill="#e5ddbc" stroke="#cec08c" stroke-width="1"/><text x="406.0" y="372.5" font-size="11" fill="#6e5e20" font-weight="700" text-anchor="middle">↔ 1</text><rect x="459.0" y="350.5" width="401.0" height="63.0" rx="8" fill="#ffffff" stroke="#cec08c" stroke-width="1.4"/><rect x="459.0" y="358.5" width="5" height="47.0" rx="2" fill="#ac9539"/><text x="475.0" y="372.5" font-size="13.5" fill="#6e5e20" font-weight="700" text-anchor="start"><tspan x="475.0">Fundamento del precio</tspan></text><text x="475.0" y="392.3" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Evidencia y razonamiento que sostienen el nivel elegido</tspan></text><rect x="798.0" y="358.5" width="54" height="20" rx="10" fill="#e5ddbc" stroke="#cec08c" stroke-width="1"/><text x="825.0" y="372.5" font-size="11" fill="#6e5e20" font-weight="700" text-anchor="middle">↔ 2</text><rect x="40.0" y="427.5" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#cec08c" stroke-width="1.4"/><rect x="40.0" y="435.5" width="5" height="62.2" rx="2" fill="#ac9539"/><text x="56.0" y="449.5" font-size="13.5" fill="#6e5e20" font-weight="700" text-anchor="start"><tspan x="56.0">Economía unitaria del plan</tspan></text><text x="56.0" y="469.3" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Margen de contribución y periodo de recuperación por plan</tspan></text><rect x="379.0" y="435.5" width="54" height="20" rx="10" fill="#e5ddbc" stroke="#cec08c" stroke-width="1"/><text x="406.0" y="449.5" font-size="11" fill="#6e5e20" font-weight="700" text-anchor="middle">↔ 3</text><rect x="459.0" y="427.5" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#cec08c" stroke-width="1.4"/><rect x="459.0" y="435.5" width="5" height="62.2" rx="2" fill="#ac9539"/><text x="475.0" y="449.5" font-size="13.5" fill="#6e5e20" font-weight="700" text-anchor="start"><tspan x="475.0">Coherencia oferta-operación</tspan></text><text x="475.0" y="469.3" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Correspondencia entre lo prometido y lo que la operación</tspan><tspan x="475.0" dy="15.2">puede entregar</tspan></text><rect x="798.0" y="435.5" width="54" height="20" rx="10" fill="#e5ddbc" stroke="#cec08c" stroke-width="1"/><text x="825.0" y="449.5" font-size="11" fill="#6e5e20" font-weight="700" text-anchor="middle">↔ 1, 4</text><text x="40" y="537.6800000000001" font-size="11.5" fill="#ac9539" font-weight="700" letter-spacing="1.4">QUÉ SE MIDE: NUMERADOR SOBRE DENOMINADOR</text><rect x="40.0" y="551.7" width="261.3" height="120.7" rx="8" fill="#f7f3e2" stroke="#cec08c" stroke-width="1.4"/><text x="54.0" y="573.7" font-size="13" fill="#6e5e20" font-weight="700" text-anchor="start"><tspan x="54.0">Margen de contribución por plan</tspan></text><text x="54.0" y="602.8" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Ingreso menos costo variable de</tspan><tspan x="54.0" dy="15.2">servir</tspan></text><line x1="54.0" y1="639.2" x2="287.3" y2="639.2" stroke="#ac9539" stroke-width="2"/><text x="54.0" y="657.2" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="54.0">Ingreso del plan</tspan></text><rect x="319.3" y="551.7" width="261.3" height="120.7" rx="8" fill="#f7f3e2" stroke="#cec08c" stroke-width="1.4"/><text x="333.3" y="573.7" font-size="13" fill="#6e5e20" font-weight="700" text-anchor="start"><tspan x="333.3">Periodo de recuperación</tspan></text><text x="333.3" y="602.8" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="333.3">Meses hasta recuperar el costo de</tspan><tspan x="333.3" dy="15.2">adquisición, por plan</tspan></text><rect x="598.7" y="551.7" width="261.3" height="120.7" rx="8" fill="#f7f3e2" stroke="#cec08c" stroke-width="1.4"/><text x="612.7" y="573.7" font-size="13" fill="#6e5e20" font-weight="700" text-anchor="start"><tspan x="612.7">Fundamento documentado</tspan></text><text x="612.7" y="602.8" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="612.7">Decisiones de precio con evidencia</tspan><tspan x="612.7" dy="15.2">asociada</tspan></text><line x1="612.7" y1="639.2" x2="846.0" y2="639.2" stroke="#ac9539" stroke-width="2"/><text x="612.7" y="657.2" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="612.7">Decisiones de precio</tspan></text><text x="40" y="706.3800000000001" font-size="11.5" fill="#ac9539" font-weight="700" letter-spacing="1.4">FRONTERA DE APLICACIÓN</text><rect x="40" y="716.4" width="820" height="65.0" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.4"/><polygon points="70,733.8800000000001 52,762.8800000000001 88,762.8800000000001" fill="#c2410c"/><text x="70" y="759.8800000000001" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">!</text><text x="106" y="740.4" font-size="12.5" fill="#7c2d12" font-weight="400" text-anchor="start"><tspan x="106">Sin clientes reales, la disposición a pagar es una estimación. El trabajo debe declarar el nivel de</tspan><tspan x="106" dy="16.5">evidencia de cada supuesto de precio.</tspan></text><text x="40" y="809.3800000000001" font-size="11.5" fill="#ac9539" font-weight="700" letter-spacing="1.4">ERROR FRECUENTE Y SU CORRECCIÓN</text><rect x="40" y="819.4" width="380.0" height="77.0" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/><text x="54" y="841.4" font-size="11" fill="#b91c1c" font-weight="700" text-anchor="start"><tspan x="54">Síntoma</tspan></text><text x="54" y="859.4" font-size="12.5" fill="#7f1d1d" font-weight="400" text-anchor="start"><tspan x="54">Fijar precio sin calcular el costo real de servir</tspan></text><line x1="426.0" y1="857.9" x2="469.0" y2="857.9" stroke="#ac9539" stroke-width="2.6" stroke-linecap="round"/><polygon points="474.0,857.9 465.9,861.8 465.9,854.0" fill="#ac9539"/><rect x="480.0" y="819.4" width="380.0" height="77.0" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.4"/><text x="494.0" y="841.4" font-size="11" fill="#15803d" font-weight="700" text-anchor="start"><tspan x="494.0">Corrección</tspan></text><text x="494.0" y="859.4" font-size="12.5" fill="#14532d" font-weight="400" text-anchor="start"><tspan x="494.0">Incluye implementación y soporte en el costo antes</tspan><tspan x="494.0" dy="16.5">de declarar el margen del plan.</tspan></text></svg>