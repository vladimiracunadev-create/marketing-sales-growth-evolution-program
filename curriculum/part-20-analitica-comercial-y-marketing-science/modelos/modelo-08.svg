<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 983" width="900" height="983" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif"><title id="t">Modelo mental · Modelos de atribución</title><desc id="d">Modelo mental de la clase 20.08: Modelos de atribución. Método en 5 pasos; 4 conceptos; 3 señales de medición.</desc><rect x="0" y="0" width="900" height="983" rx="14" fill="#ffffff"/><rect x="0" y="0" width="900" height="64" rx="14" fill="#203a6e"/><rect x="0" y="40" width="900" height="24" fill="#203a6e"/><text x="40" y="28" font-size="12" fill="#bccae5" font-weight="700" letter-spacing="1.6">MODELO MENTAL · CLASE 20.08 · PARTE 20</text><text x="40" y="52" font-size="21" fill="#ffffff" font-weight="700">Modelos de atribución</text><text x="40" y="84" font-size="11.5" fill="#395fac" font-weight="700" letter-spacing="1.4">MÉTODO PASO A PASO</text><line x1="450.0" y1="94.0" x2="450.0" y2="317.0" stroke="#8ca2ce" stroke-width="3" stroke-linecap="round"/><line x1="450.0" y1="121.2" x2="406.0" y2="121.2" stroke="#8ca2ce" stroke-width="2"/><rect x="56.0" y="100" width="350" height="42.5" rx="10" fill="#e2e9f7" stroke="#8ca2ce" stroke-width="1.4"/><text x="70.0" y="122" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="70.0">Declarar el modelo y la ventana utilizados</tspan></text><circle cx="450.0" cy="121.2" r="15" fill="#203a6e"/><text x="450.0" y="125.8" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><line x1="450.0" y1="159.2" x2="494.0" y2="159.2" stroke="#8ca2ce" stroke-width="2"/><rect x="494.0" y="138" width="350" height="42.5" rx="10" fill="#e2e9f7" stroke="#8ca2ce" stroke-width="1.4"/><text x="508.0" y="160" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="508.0">Comparar la lectura bajo al menos dos modelos</tspan></text><circle cx="450.0" cy="159.2" r="15" fill="#203a6e"/><text x="450.0" y="163.8" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><line x1="450.0" y1="197.2" x2="406.0" y2="197.2" stroke="#8ca2ce" stroke-width="2"/><rect x="56.0" y="176" width="350" height="42.5" rx="10" fill="#e2e9f7" stroke="#8ca2ce" stroke-width="1.4"/><text x="70.0" y="198" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="70.0">Identificar los canales cuyo crédito varía más</tspan></text><circle cx="450.0" cy="197.2" r="15" fill="#203a6e"/><text x="450.0" y="201.8" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><line x1="450.0" y1="243.5" x2="494.0" y2="243.5" stroke="#8ca2ce" stroke-width="2"/><rect x="494.0" y="214" width="350" height="59.0" rx="10" fill="#e2e9f7" stroke="#8ca2ce" stroke-width="1.4"/><text x="508.0" y="236" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="508.0">Diseñar verificación causal para los casos</tspan><tspan x="508.0" dy="16.5">críticos</tspan></text><circle cx="450.0" cy="243.5" r="15" fill="#203a6e"/><text x="450.0" y="248.0" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">4</text><line x1="450.0" y1="281.5" x2="406.0" y2="281.5" stroke="#8ca2ce" stroke-width="2"/><rect x="56.0" y="252" width="350" height="59.0" rx="10" fill="#e2e9f7" stroke="#8ca2ce" stroke-width="1.4"/><text x="70.0" y="274" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="70.0">Publicar las limitaciones junto con los</tspan><tspan x="70.0" dy="16.5">resultados</tspan></text><circle cx="450.0" cy="281.5" r="15" fill="#203a6e"/><text x="450.0" y="286.0" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">5</text><text x="40" y="353.0" font-size="11.5" fill="#395fac" font-weight="700" letter-spacing="1.4">CONCEPTOS Y DÓNDE ACTÚAN EN EL MÉTODO</text><rect x="40.0" y="367.0" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#8ca2ce" stroke-width="1.4"/><rect x="40.0" y="375.0" width="5" height="62.2" rx="2" fill="#395fac"/><text x="56.0" y="389.0" font-size="13.5" fill="#203a6e" font-weight="700" text-anchor="start"><tspan x="56.0">Modelo basado en reglas</tspan></text><text x="56.0" y="408.8" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Convención fija que reparte el crédito según posición o</tspan><tspan x="56.0" dy="15.2">decaimiento</tspan></text><rect x="379.0" y="375.0" width="54" height="20" rx="10" fill="#bccae5" stroke="#8ca2ce" stroke-width="1"/><text x="406.0" y="389.0" font-size="11" fill="#203a6e" font-weight="700" text-anchor="middle">↔ 1, 2</text><rect x="459.0" y="367.0" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#8ca2ce" stroke-width="1.4"/><rect x="459.0" y="375.0" width="5" height="62.2" rx="2" fill="#395fac"/><text x="475.0" y="389.0" font-size="13.5" fill="#203a6e" font-weight="700" text-anchor="start"><tspan x="475.0">Modelo basado en datos</tspan></text><text x="475.0" y="408.8" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Asignación derivada del análisis de recorridos observados</tspan></text><rect x="798.0" y="375.0" width="54" height="20" rx="10" fill="#bccae5" stroke="#8ca2ce" stroke-width="1"/><text x="825.0" y="389.0" font-size="11" fill="#203a6e" font-weight="700" text-anchor="middle">↔ 1, 2</text><rect x="40.0" y="459.2" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#8ca2ce" stroke-width="1.4"/><rect x="40.0" y="467.2" width="5" height="62.2" rx="2" fill="#395fac"/><text x="56.0" y="481.2" font-size="13.5" fill="#203a6e" font-weight="700" text-anchor="start"><tspan x="56.0">Ventana de contacto</tspan></text><text x="56.0" y="501.0" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Periodo dentro del cual se consideran los puntos de</tspan><tspan x="56.0" dy="15.2">contacto</tspan></text><rect x="379.0" y="467.2" width="54" height="20" rx="10" fill="#bccae5" stroke="#8ca2ce" stroke-width="1"/><text x="406.0" y="481.2" font-size="11" fill="#203a6e" font-weight="700" text-anchor="middle">↔ 1</text><rect x="459.0" y="459.2" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#8ca2ce" stroke-width="1.4"/><rect x="459.0" y="467.2" width="5" height="62.2" rx="2" fill="#395fac"/><text x="475.0" y="481.2" font-size="13.5" fill="#203a6e" font-weight="700" text-anchor="start"><tspan x="475.0">Límite causal</tspan></text><text x="475.0" y="501.0" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Imposibilidad de establecer causalidad con datos</tspan><tspan x="475.0" dy="15.2">observacionales de atribución</tspan></text><rect x="798.0" y="467.2" width="54" height="20" rx="10" fill="#bccae5" stroke="#8ca2ce" stroke-width="1"/><text x="825.0" y="481.2" font-size="11" fill="#203a6e" font-weight="700" text-anchor="middle">↔ 4, 5</text><text x="40" y="569.36" font-size="11.5" fill="#395fac" font-weight="700" letter-spacing="1.4">QUÉ SE MIDE: NUMERADOR SOBRE DENOMINADOR</text><rect x="40.0" y="583.4" width="261.3" height="137.9" rx="8" fill="#e2e9f7" stroke="#8ca2ce" stroke-width="1.4"/><text x="54.0" y="605.4" font-size="13" fill="#203a6e" font-weight="700" text-anchor="start"><tspan x="54.0">Variación de crédito entre</tspan><tspan x="54.0" dy="17.2">modelos</tspan></text><text x="54.0" y="651.7" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Diferencia del crédito asignado a</tspan><tspan x="54.0" dy="15.2">cada canal según modelo</tspan></text><rect x="319.3" y="583.4" width="261.3" height="137.9" rx="8" fill="#e2e9f7" stroke="#8ca2ce" stroke-width="1.4"/><text x="333.3" y="605.4" font-size="13" fill="#203a6e" font-weight="700" text-anchor="start"><tspan x="333.3">Cobertura de recorridos</tspan><tspan x="333.3" dy="17.2">completos</tspan></text><text x="333.3" y="651.7" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="333.3">Conversiones con recorrido</tspan><tspan x="333.3" dy="15.2">registrado completo</tspan></text><line x1="333.3" y1="688.0" x2="566.7" y2="688.0" stroke="#395fac" stroke-width="2"/><text x="333.3" y="706.0" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="333.3">Conversiones totales</tspan></text><rect x="598.7" y="583.4" width="261.3" height="137.9" rx="8" fill="#e2e9f7" stroke="#8ca2ce" stroke-width="1.4"/><text x="612.7" y="605.4" font-size="13" fill="#203a6e" font-weight="700" text-anchor="start"><tspan x="612.7">Decisiones respaldadas por</tspan><tspan x="612.7" dy="17.2">verificación causal</tspan></text><text x="612.7" y="651.7" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="612.7">Decisiones de presupuesto con prueba</tspan><tspan x="612.7" dy="15.2">causal</tspan></text><line x1="612.7" y1="688.0" x2="846.0" y2="688.0" stroke="#395fac" stroke-width="2"/><text x="612.7" y="706.0" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="612.7">Decisiones mayores</tspan></text><text x="40" y="755.22" font-size="11.5" fill="#395fac" font-weight="700" letter-spacing="1.4">FRONTERA DE APLICACIÓN</text><rect x="40" y="765.2" width="820" height="65.0" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.4"/><polygon points="70,782.72 52,811.72 88,811.72" fill="#c2410c"/><text x="70" y="808.72" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">!</text><text x="106" y="789.2" font-size="12.5" fill="#7c2d12" font-weight="400" text-anchor="start"><tspan x="106">La reducción de cobertura de rastreo por privacidad afecta a todos los modelos. Los recorridos incompletos</tspan><tspan x="106" dy="16.5">sesgan sistemáticamente hacia los canales de último contacto.</tspan></text><text x="40" y="858.22" font-size="11.5" fill="#395fac" font-weight="700" letter-spacing="1.4">ERROR FRECUENTE Y SU CORRECCIÓN</text><rect x="40" y="868.2" width="380.0" height="77.0" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/><text x="54" y="890.2" font-size="11" fill="#b91c1c" font-weight="700" text-anchor="start"><tspan x="54">Síntoma</tspan></text><text x="54" y="908.2" font-size="12.5" fill="#7f1d1d" font-weight="400" text-anchor="start"><tspan x="54">Tratar la atribución como evidencia causal</tspan></text><line x1="426.0" y1="906.7" x2="469.0" y2="906.7" stroke="#395fac" stroke-width="2.6" stroke-linecap="round"/><polygon points="474.0,906.7 465.9,910.6 465.9,902.8" fill="#395fac"/><rect x="480.0" y="868.2" width="380.0" height="77.0" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.4"/><text x="494.0" y="890.2" font-size="11" fill="#15803d" font-weight="700" text-anchor="start"><tspan x="494.0">Corrección</tspan></text><text x="494.0" y="908.2" font-size="12.5" fill="#14532d" font-weight="400" text-anchor="start"><tspan x="494.0">Compara modelos y valida con experimentos los</tspan><tspan x="494.0" dy="16.5">canales donde la decisión es costosa.</tspan></text></svg>