<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1372" width="900" height="1372" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif"><title id="t">Modelo mental · Contexto cultural y social</title><desc id="d">Modelo mental de la clase 02.12: Contexto cultural y social. Método en 5 pasos; 4 conceptos; 3 señales de medición.</desc><rect x="0" y="0" width="900" height="1372" rx="14" fill="#ffffff"/><rect x="0" y="0" width="900" height="64" rx="14" fill="#426e20"/><rect x="0" y="40" width="900" height="24" fill="#426e20"/><text x="40" y="28" font-size="12" fill="#cee5bc" font-weight="700" letter-spacing="1.6">MODELO MENTAL · CLASE 02.12 · PARTE 02</text><text x="40" y="52" font-size="21" fill="#ffffff" font-weight="700">Contexto cultural y social</text><text x="40" y="84" font-size="11.5" fill="#6bac39" font-weight="700" letter-spacing="1.4">MÉTODO PASO A PASO</text><ellipse cx="450.0" cy="403.2" rx="330.0" ry="251.2" fill="none" stroke="#a9ce8c" stroke-width="2" stroke-dasharray="3 8" stroke-linecap="round"/><polygon points="653.6,205.3 636.2,201.8 641.4,192.4" fill="#6bac39"/><polygon points="759.5,490.9 761.2,473.3 771.1,477.5" fill="#6bac39"/><polygon points="439.0,654.4 455.9,649.0 455.9,659.8" fill="#6bac39"/><polygon points="131.8,470.7 143.4,484.1 133.5,488.4" fill="#6bac39"/><polygon points="265.7,194.7 253.5,207.6 248.3,198.1" fill="#6bac39"/><circle cx="450.0" cy="403.2" r="100.0" fill="#cee5bc" stroke="#a9ce8c" stroke-width="1.6"/><text x="450.0" y="395.4" font-size="15" fill="#426e20" font-weight="700" text-anchor="middle"><tspan x="450.0">Contexto cultural y</tspan><tspan x="450.0" dy="19.8">social</tspan></text><rect x="361.0" y="114.2" width="178" height="75.5" rx="10" fill="#ebf7e2" stroke="#a9ce8c" stroke-width="1.4"/><text x="373.0" y="136.2" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="373.0">Identificar el grupo</tspan><tspan x="373.0" dy="16.5">de referencia del</tspan><tspan x="373.0" dy="16.5">segmento</tspan></text><circle cx="363.0" cy="116.2" r="14" fill="#426e20"/><text x="363.0" y="120.8" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><rect x="674.8" y="279.6" width="178" height="92.0" rx="10" fill="#ebf7e2" stroke="#a9ce8c" stroke-width="1.4"/><text x="686.8" y="301.6" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="686.8">Documentar normas y</tspan><tspan x="686.8" dy="16.5">expectativas</tspan><tspan x="686.8" dy="16.5">observadas, no</tspan><tspan x="686.8" dy="16.5">supuestas</tspan></text><circle cx="676.8" cy="281.6" r="14" fill="#426e20"/><text x="676.8" y="286.1" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><rect x="555.0" y="568.7" width="178" height="75.5" rx="10" fill="#ebf7e2" stroke="#a9ce8c" stroke-width="1.4"/><text x="567.0" y="590.7" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="567.0">Revisar mensajes y</tspan><tspan x="567.0" dy="16.5">prácticas contra esas</tspan><tspan x="567.0" dy="16.5">normas</tspan></text><circle cx="557.0" cy="570.7" r="14" fill="#426e20"/><text x="557.0" y="575.2" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><rect x="167.0" y="576.9" width="178" height="59.0" rx="10" fill="#ebf7e2" stroke="#a9ce8c" stroke-width="1.4"/><text x="179.0" y="598.9" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="179.0">Usar prueba social</tspan><tspan x="179.0" dy="16.5">local y verificable</tspan></text><circle cx="169.0" cy="578.9" r="14" fill="#426e20"/><text x="169.0" y="583.4" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">4</text><rect x="47.2" y="296.1" width="178" height="59.0" rx="10" fill="#ebf7e2" stroke="#a9ce8c" stroke-width="1.4"/><text x="59.2" y="318.1" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="59.2">Medir diferencias de</tspan><tspan x="59.2" dy="16.5">respuesta por contexto</tspan></text><circle cx="49.2" cy="298.1" r="14" fill="#426e20"/><text x="49.2" y="302.6" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">5</text><text x="40" y="742.4" font-size="11.5" fill="#6bac39" font-weight="700" letter-spacing="1.4">CONCEPTOS Y DÓNDE ACTÚAN EN EL MÉTODO</text><rect x="40.0" y="756.4" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#a9ce8c" stroke-width="1.4"/><rect x="40.0" y="764.4" width="5" height="62.2" rx="2" fill="#6bac39"/><text x="56.0" y="778.4" font-size="13.5" fill="#426e20" font-weight="700" text-anchor="start"><tspan x="56.0">Norma social relevante</tspan></text><text x="56.0" y="798.2" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Expectativa compartida en el grupo del cliente que</tspan><tspan x="56.0" dy="15.2">condiciona qué es aceptable comprar o decir</tspan></text><rect x="379.0" y="764.4" width="54" height="20" rx="10" fill="#cee5bc" stroke="#a9ce8c" stroke-width="1"/><text x="406.0" y="778.4" font-size="11" fill="#426e20" font-weight="700" text-anchor="middle">↔ 2, 3, 4</text><rect x="459.0" y="756.4" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#a9ce8c" stroke-width="1.4"/><rect x="459.0" y="764.4" width="5" height="62.2" rx="2" fill="#6bac39"/><text x="475.0" y="778.4" font-size="13.5" fill="#426e20" font-weight="700" text-anchor="start"><tspan x="475.0">Grupo de referencia</tspan></text><text x="475.0" y="798.2" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Conjunto de personas cuya opinión el cliente considera al</tspan><tspan x="475.0" dy="15.2">evaluar una decisión</tspan></text><rect x="798.0" y="764.4" width="54" height="20" rx="10" fill="#cee5bc" stroke="#a9ce8c" stroke-width="1"/><text x="825.0" y="778.4" font-size="11" fill="#426e20" font-weight="700" text-anchor="middle">↔ 1</text><rect x="40.0" y="848.6" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#a9ce8c" stroke-width="1.4"/><rect x="40.0" y="856.6" width="5" height="62.2" rx="2" fill="#6bac39"/><text x="56.0" y="870.6" font-size="13.5" fill="#426e20" font-weight="700" text-anchor="start"><tspan x="56.0">Prueba social local</tspan></text><text x="56.0" y="890.4" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Evidencia de adopción proveniente de pares reconocibles</tspan><tspan x="56.0" dy="15.2">del mismo contexto</tspan></text><rect x="379.0" y="856.6" width="54" height="20" rx="10" fill="#cee5bc" stroke="#a9ce8c" stroke-width="1"/><text x="406.0" y="870.6" font-size="11" fill="#426e20" font-weight="700" text-anchor="middle">↔ 4</text><rect x="459.0" y="848.6" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#a9ce8c" stroke-width="1.4"/><rect x="459.0" y="856.6" width="5" height="62.2" rx="2" fill="#6bac39"/><text x="475.0" y="870.6" font-size="13.5" fill="#426e20" font-weight="700" text-anchor="start"><tspan x="475.0">Sensibilidad contextual</tspan></text><text x="475.0" y="890.4" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Capacidad de adaptar mensaje y práctica a la norma sin</tspan><tspan x="475.0" dy="15.2">perder consistencia de marca</tspan></text><rect x="798.0" y="856.6" width="54" height="20" rx="10" fill="#cee5bc" stroke="#a9ce8c" stroke-width="1"/><text x="825.0" y="870.6" font-size="11" fill="#426e20" font-weight="700" text-anchor="middle">↔ 3, 5</text><text x="40" y="958.76" font-size="11.5" fill="#6bac39" font-weight="700" letter-spacing="1.4">QUÉ SE MIDE: NUMERADOR SOBRE DENOMINADOR</text><rect x="40.0" y="972.8" width="261.3" height="137.9" rx="8" fill="#ebf7e2" stroke="#a9ce8c" stroke-width="1.4"/><text x="54.0" y="994.8" font-size="13" fill="#426e20" font-weight="700" text-anchor="start"><tspan x="54.0">Respuesta por origen geográfico</tspan><tspan x="54.0" dy="17.2">o gremial</tspan></text><text x="54.0" y="1041.1" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Tasa de respuesta y conversión</tspan><tspan x="54.0" dy="15.2">segmentada por región y por rubro</tspan></text><rect x="319.3" y="972.8" width="261.3" height="137.9" rx="8" fill="#ebf7e2" stroke="#a9ce8c" stroke-width="1.4"/><text x="333.3" y="994.8" font-size="13" fill="#426e20" font-weight="700" text-anchor="start"><tspan x="333.3">Efecto de la prueba social local</tspan></text><text x="333.3" y="1023.9" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="333.3">Diferencia de conversión entre</tspan><tspan x="333.3" dy="15.2">piezas con referencias del mismo</tspan><tspan x="333.3" dy="15.2">rubro y piezas genéricas</tspan></text><rect x="598.7" y="972.8" width="261.3" height="137.9" rx="8" fill="#ebf7e2" stroke="#a9ce8c" stroke-width="1.4"/><text x="612.7" y="994.8" font-size="13" fill="#426e20" font-weight="700" text-anchor="start"><tspan x="612.7">Participación de referidos por</tspan><tspan x="612.7" dy="17.2">gremio</tspan></text><text x="612.7" y="1041.1" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="612.7">Oportunidades originadas por</tspan><tspan x="612.7" dy="15.2">referencia dentro del mismo gremio</tspan></text><line x1="612.7" y1="1077.4" x2="846.0" y2="1077.4" stroke="#6bac39" stroke-width="2"/><text x="612.7" y="1095.4" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="612.7">Oportunidades del gremio</tspan></text><text x="40" y="1144.62" font-size="11.5" fill="#6bac39" font-weight="700" letter-spacing="1.4">FRONTERA DE APLICACIÓN</text><rect x="40" y="1154.6" width="820" height="65.0" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.4"/><polygon points="70,1172.12 52,1201.12 88,1201.12" fill="#c2410c"/><text x="70" y="1198.12" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">!</text><text x="106" y="1178.6" font-size="12.5" fill="#7c2d12" font-weight="400" text-anchor="start"><tspan x="106">El contexto explica tendencias, no individuos. Usar rasgos culturales para predecir el comportamiento de</tspan><tspan x="106" dy="16.5">una persona concreta es un error y puede ser discriminatorio.</tspan></text><text x="40" y="1247.62" font-size="11.5" fill="#6bac39" font-weight="700" letter-spacing="1.4">ERROR FRECUENTE Y SU CORRECCIÓN</text><rect x="40" y="1257.6" width="380.0" height="77.0" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/><text x="54" y="1279.6" font-size="11" fill="#b91c1c" font-weight="700" text-anchor="start"><tspan x="54">Síntoma</tspan></text><text x="54" y="1297.6" font-size="12.5" fill="#7f1d1d" font-weight="400" text-anchor="start"><tspan x="54">Trasladar mensajes de un contexto a otro sin</tspan><tspan x="54" dy="16.5">verificar</tspan></text><line x1="426.0" y1="1296.1" x2="469.0" y2="1296.1" stroke="#6bac39" stroke-width="2.6" stroke-linecap="round"/><polygon points="474.0,1296.1 465.9,1300.0 465.9,1292.2" fill="#6bac39"/><rect x="480.0" y="1257.6" width="380.0" height="77.0" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.4"/><text x="494.0" y="1279.6" font-size="11" fill="#15803d" font-weight="700" text-anchor="start"><tspan x="494.0">Corrección</tspan></text><text x="494.0" y="1297.6" font-size="12.5" fill="#14532d" font-weight="400" text-anchor="start"><tspan x="494.0">Prueba la pieza con al menos cinco personas del</tspan><tspan x="494.0" dy="16.5">contexto de destino antes de escalarla.</tspan></text></svg>