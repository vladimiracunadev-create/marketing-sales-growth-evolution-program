<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1131" width="900" height="1131" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif"><title id="t">Modelo mental · Riesgo percibido y confianza</title><desc id="d">Modelo mental de la clase 02.10: Riesgo percibido y confianza. Método en 6 pasos; 5 conceptos; 3 señales de medición.</desc><rect x="0" y="0" width="900" height="1131" rx="14" fill="#ffffff"/><rect x="0" y="0" width="900" height="64" rx="14" fill="#426e20"/><rect x="0" y="40" width="900" height="24" fill="#426e20"/><text x="40" y="28" font-size="12" fill="#cee5bc" font-weight="700" letter-spacing="1.6">MODELO MENTAL · CLASE 02.10 · PARTE 02</text><text x="40" y="52" font-size="21" fill="#ffffff" font-weight="700">Riesgo percibido y confianza</text><text x="40" y="84" font-size="11.5" fill="#6bac39" font-weight="700" letter-spacing="1.4">MÉTODO PASO A PASO</text><line x1="450.0" y1="94.0" x2="450.0" y2="368.5" stroke="#a9ce8c" stroke-width="3" stroke-linecap="round"/><line x1="450.0" y1="121.2" x2="406.0" y2="121.2" stroke="#a9ce8c" stroke-width="2"/><rect x="56.0" y="100" width="350" height="42.5" rx="10" fill="#ebf7e2" stroke="#a9ce8c" stroke-width="1.4"/><text x="70.0" y="122" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="70.0">Enumerar los riesgos percibidos por cada rol</tspan></text><circle cx="450.0" cy="121.2" r="15" fill="#426e20"/><text x="450.0" y="125.8" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><line x1="450.0" y1="167.5" x2="494.0" y2="167.5" stroke="#a9ce8c" stroke-width="2"/><rect x="494.0" y="138" width="350" height="59.0" rx="10" fill="#ebf7e2" stroke="#a9ce8c" stroke-width="1.4"/><text x="508.0" y="160" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="508.0">Clasificarlos en económico, operativo,</tspan><tspan x="508.0" dy="16.5">reputacional y personal</tspan></text><circle cx="450.0" cy="167.5" r="15" fill="#426e20"/><text x="450.0" y="172.0" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><line x1="450.0" y1="206.0" x2="406.0" y2="206.0" stroke="#a9ce8c" stroke-width="2"/><rect x="56.0" y="176" width="350" height="75.5" rx="10" fill="#ebf7e2" stroke="#a9ce8c" stroke-width="1.4"/><text x="70.0" y="198" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="70.0">Clasificar cada mensaje como afirmación</tspan><tspan x="70.0" dy="16.5">verificable, opinión, omisión material,</tspan><tspan x="70.0" dy="16.5">testimonio o incentivo</tspan></text><circle cx="450.0" cy="206.0" r="15" fill="#426e20"/><text x="450.0" y="210.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><line x1="450.0" y1="243.5" x2="494.0" y2="243.5" stroke="#a9ce8c" stroke-width="2"/><rect x="494.0" y="214" width="350" height="59.0" rx="10" fill="#ebf7e2" stroke="#a9ce8c" stroke-width="1.4"/><text x="508.0" y="236" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="508.0">Asignar a cada riesgo una evidencia primaria,</tspan><tspan x="508.0" dy="16.5">su limitación y una persona responsable</tspan></text><circle cx="450.0" cy="243.5" r="15" fill="#426e20"/><text x="450.0" y="248.0" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">4</text><line x1="450.0" y1="295.0" x2="406.0" y2="295.0" stroke="#a9ce8c" stroke-width="2"/><rect x="56.0" y="265.5" width="350" height="59.0" rx="10" fill="#ebf7e2" stroke="#a9ce8c" stroke-width="1.4"/><text x="70.0" y="287.5" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="70.0">Aumentar la reversibilidad donde el riesgo es</tspan><tspan x="70.0" dy="16.5">alto</tspan></text><circle cx="450.0" cy="295.0" r="15" fill="#426e20"/><text x="450.0" y="299.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">5</text><line x1="450.0" y1="333.0" x2="494.0" y2="333.0" stroke="#a9ce8c" stroke-width="2"/><rect x="494.0" y="303.5" width="350" height="59.0" rx="10" fill="#ebf7e2" stroke="#a9ce8c" stroke-width="1.4"/><text x="508.0" y="325.5" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="508.0">Decidir publicar, corregir o retirar y medir</tspan><tspan x="508.0" dy="16.5">calidad posterior, no sólo conversión</tspan></text><circle cx="450.0" cy="333.0" r="15" fill="#426e20"/><text x="450.0" y="337.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">6</text><text x="40" y="404.5" font-size="11.5" fill="#6bac39" font-weight="700" letter-spacing="1.4">CONCEPTOS Y DÓNDE ACTÚAN EN EL MÉTODO</text><rect x="40.0" y="418.5" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#a9ce8c" stroke-width="1.4"/><rect x="40.0" y="426.5" width="5" height="62.2" rx="2" fill="#6bac39"/><text x="56.0" y="440.5" font-size="13.5" fill="#426e20" font-weight="700" text-anchor="start"><tspan x="56.0">Riesgo percibido</tspan></text><text x="56.0" y="460.3" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Estimación subjetiva del cliente sobre la probabilidad y</tspan><tspan x="56.0" dy="15.2">magnitud de un resultado adverso</tspan></text><rect x="379.0" y="426.5" width="54" height="20" rx="10" fill="#cee5bc" stroke="#a9ce8c" stroke-width="1"/><text x="406.0" y="440.5" font-size="11" fill="#426e20" font-weight="700" text-anchor="middle">↔ 1, 4, 5</text><rect x="459.0" y="418.5" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#a9ce8c" stroke-width="1.4"/><rect x="459.0" y="426.5" width="5" height="62.2" rx="2" fill="#6bac39"/><text x="475.0" y="440.5" font-size="13.5" fill="#426e20" font-weight="700" text-anchor="start"><tspan x="475.0">Señal de confianza</tspan></text><text x="475.0" y="460.3" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Evidencia verificable que reduce la incertidumbre sobre el</tspan><tspan x="475.0" dy="15.2">desempeño futuro del proveedor</tspan></text><rect x="40.0" y="510.7" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#a9ce8c" stroke-width="1.4"/><rect x="40.0" y="518.7" width="5" height="62.2" rx="2" fill="#6bac39"/><text x="56.0" y="532.7" font-size="13.5" fill="#426e20" font-weight="700" text-anchor="start"><tspan x="56.0">Riesgo personal del recomendante</tspan></text><text x="56.0" y="552.5" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Consecuencia profesional que enfrenta quien impulsa la</tspan><tspan x="56.0" dy="15.2">compra si el proyecto falla</tspan></text><rect x="379.0" y="518.7" width="54" height="20" rx="10" fill="#cee5bc" stroke="#a9ce8c" stroke-width="1"/><text x="406.0" y="532.7" font-size="11" fill="#426e20" font-weight="700" text-anchor="middle">↔ 1, 2, 4, 5</text><rect x="459.0" y="510.7" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#a9ce8c" stroke-width="1.4"/><rect x="459.0" y="518.7" width="5" height="62.2" rx="2" fill="#6bac39"/><text x="475.0" y="532.7" font-size="13.5" fill="#426e20" font-weight="700" text-anchor="start"><tspan x="475.0">Reversibilidad de la decisión</tspan></text><text x="475.0" y="552.5" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Facilidad y costo de deshacer la compra si el resultado no</tspan><tspan x="475.0" dy="15.2">se cumple</tspan></text><rect x="798.0" y="518.7" width="54" height="20" rx="10" fill="#cee5bc" stroke="#a9ce8c" stroke-width="1"/><text x="825.0" y="532.7" font-size="11" fill="#426e20" font-weight="700" text-anchor="middle">↔ 5</text><rect x="40.0" y="602.9" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#a9ce8c" stroke-width="1.4"/><rect x="40.0" y="610.9" width="5" height="62.2" rx="2" fill="#6bac39"/><text x="56.0" y="624.9" font-size="13.5" fill="#426e20" font-weight="700" text-anchor="start"><tspan x="56.0">Jerarquía de evidencia</tspan></text><text x="56.0" y="644.7" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Orden que separa afirmación, testimonio e inferencia de un</tspan><tspan x="56.0" dy="15.2">documento verificable y de un hecho acreditado</tspan></text><rect x="379.0" y="610.9" width="54" height="20" rx="10" fill="#cee5bc" stroke="#a9ce8c" stroke-width="1"/><text x="406.0" y="624.9" font-size="11" fill="#426e20" font-weight="700" text-anchor="middle">↔ 3, 4</text><text x="40" y="713.04" font-size="11.5" fill="#6bac39" font-weight="700" letter-spacing="1.4">QUÉ SE MIDE: NUMERADOR SOBRE DENOMINADOR</text><rect x="40.0" y="727.0" width="261.3" height="142.6" rx="8" fill="#ebf7e2" stroke="#a9ce8c" stroke-width="1.4"/><text x="54.0" y="749.0" font-size="13" fill="#426e20" font-weight="700" text-anchor="start"><tspan x="54.0">Objeciones de riesgo por negocio</tspan></text><text x="54.0" y="778.2" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Objeciones clasificadas como riesgo</tspan></text><line x1="54.0" y1="799.4" x2="287.3" y2="799.4" stroke="#6bac39" stroke-width="2"/><text x="54.0" y="817.4" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="54.0">Objeciones totales</tspan></text><text x="54.0" y="846.6" font-size="10.5" fill="#7b8794" font-weight="400" text-anchor="start"><tspan x="54.0">Ventana: mes móvil</tspan></text><rect x="319.3" y="727.0" width="261.3" height="142.6" rx="8" fill="#ebf7e2" stroke="#a9ce8c" stroke-width="1.4"/><text x="333.3" y="749.0" font-size="13" fill="#426e20" font-weight="700" text-anchor="start"><tspan x="333.3">Cobertura de evidencia</tspan></text><text x="333.3" y="778.2" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="333.3">Afirmaciones con evidencia primaria</tspan><tspan x="333.3" dy="15.2">vigente</tspan></text><line x1="333.3" y1="814.6" x2="566.7" y2="814.6" stroke="#6bac39" stroke-width="2"/><text x="333.3" y="832.6" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="333.3">Afirmaciones comerciales revisadas</tspan></text><text x="333.3" y="861.7" font-size="10.5" fill="#7b8794" font-weight="400" text-anchor="start"><tspan x="333.3">Ventana: cada ciclo editorial</tspan></text><rect x="598.7" y="727.0" width="261.3" height="142.6" rx="8" fill="#ebf7e2" stroke="#a9ce8c" stroke-width="1.4"/><text x="612.7" y="749.0" font-size="13" fill="#426e20" font-weight="700" text-anchor="start"><tspan x="612.7">Tasa de reversión informada</tspan></text><text x="612.7" y="778.2" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="612.7">Compras deshechas dentro del plazo</tspan><tspan x="612.7" dy="15.2">informado</tspan></text><line x1="612.7" y1="814.6" x2="846.0" y2="814.6" stroke="#6bac39" stroke-width="2"/><text x="612.7" y="832.6" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="612.7">Compras con reversibilidad ofrecida</tspan></text><text x="612.7" y="861.7" font-size="10.5" fill="#7b8794" font-weight="400" text-anchor="start"><tspan x="612.7">Ventana: 90 días</tspan></text><text x="40" y="903.5999999999999" font-size="11.5" fill="#6bac39" font-weight="700" letter-spacing="1.4">FRONTERA DE APLICACIÓN</text><rect x="40" y="913.6" width="820" height="65.0" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.4"/><polygon points="70,931.0999999999999 52,960.0999999999999 88,960.0999999999999" fill="#c2410c"/><text x="70" y="957.0999999999999" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">!</text><text x="106" y="937.6" font-size="12.5" fill="#7c2d12" font-weight="400" text-anchor="start"><tspan x="106">Una garantía amplia mal diseñada puede atraer clientes que no lograrán resultado y trasladar el costo a la</tspan><tspan x="106" dy="16.5">operación. La garantía debe acotarse a lo que la empresa controla.</tspan></text><text x="40" y="1006.5999999999999" font-size="11.5" fill="#6bac39" font-weight="700" letter-spacing="1.4">ERROR FRECUENTE Y SU CORRECCIÓN</text><rect x="40" y="1016.6" width="380.0" height="77.0" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/><text x="54" y="1038.6" font-size="11" fill="#b91c1c" font-weight="700" text-anchor="start"><tspan x="54">Síntoma</tspan></text><text x="54" y="1056.6" font-size="12.5" fill="#7f1d1d" font-weight="400" text-anchor="start"><tspan x="54">Responder al riesgo con más argumentos de beneficio</tspan></text><line x1="426.0" y1="1055.1" x2="469.0" y2="1055.1" stroke="#6bac39" stroke-width="2.6" stroke-linecap="round"/><polygon points="474.0,1055.1 465.9,1059.0 465.9,1051.2" fill="#6bac39"/><rect x="480.0" y="1016.6" width="380.0" height="77.0" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.4"/><text x="494.0" y="1038.6" font-size="11" fill="#15803d" font-weight="700" text-anchor="start"><tspan x="494.0">Corrección</tspan></text><text x="494.0" y="1056.6" font-size="12.5" fill="#14532d" font-weight="400" text-anchor="start"><tspan x="494.0">Atiende el riesgo con evidencia y reversibilidad,</tspan><tspan x="494.0" dy="16.5">no con entusiasmo adicional.</tspan></text></svg>