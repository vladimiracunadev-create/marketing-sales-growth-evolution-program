<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1304" width="900" height="1304" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif"><title id="t">Modelo mental · Calificación de leads</title><desc id="d">Modelo mental de la clase 11.12: Calificación de leads. Método en 5 pasos; 4 conceptos; 3 señales de medición.</desc><rect x="0" y="0" width="900" height="1304" rx="14" fill="#ffffff"/><rect x="0" y="0" width="900" height="64" rx="14" fill="#206e50"/><rect x="0" y="40" width="900" height="24" fill="#206e50"/><text x="40" y="28" font-size="12" fill="#bce5d5" font-weight="700" letter-spacing="1.6">MODELO MENTAL · CLASE 11.12 · PARTE 11</text><text x="40" y="52" font-size="21" fill="#ffffff" font-weight="700">Calificación de leads</text><text x="40" y="84" font-size="11.5" fill="#39ac80" font-weight="700" letter-spacing="1.4">MÉTODO PASO A PASO</text><ellipse cx="450.0" cy="376.8" rx="330.0" ry="233.1" fill="none" stroke="#8cceb5" stroke-width="2" stroke-dasharray="3 8" stroke-linecap="round"/><polygon points="653.8,193.3 636.3,190.4 641.2,180.8" fill="#39ac80"/><polygon points="759.3,458.8 761.4,441.2 771.2,445.7" fill="#39ac80"/><polygon points="439.0,609.9 455.9,604.4 455.9,615.3" fill="#39ac80"/><polygon points="131.6,438.8 143.5,451.9 133.7,456.4" fill="#39ac80"/><polygon points="265.8,183.2 253.2,195.8 248.3,186.1" fill="#39ac80"/><circle cx="450.0" cy="376.8" r="100.0" fill="#bce5d5" stroke="#8cceb5" stroke-width="1.6"/><text x="450.0" y="369.0" font-size="15" fill="#206e50" font-weight="700" text-anchor="middle"><tspan x="450.0">Calificación de</tspan><tspan x="450.0" dy="19.8">leads</tspan></text><rect x="361.0" y="106.0" width="178" height="75.5" rx="10" fill="#e2f7ef" stroke="#8cceb5" stroke-width="1.4"/><text x="373.0" y="128.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="373.0">Definir criterios de</tspan><tspan x="373.0" dy="16.5">perfil y de intención</tspan><tspan x="373.0" dy="16.5">por separado</tspan></text><circle cx="363.0" cy="108.0" r="14" fill="#206e50"/><text x="363.0" y="112.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><rect x="674.8" y="267.0" width="178" height="75.5" rx="10" fill="#e2f7ef" stroke="#8cceb5" stroke-width="1.4"/><text x="686.8" y="289.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="686.8">Establecer el umbral</tspan><tspan x="686.8" dy="16.5">de traspaso con</tspan><tspan x="686.8" dy="16.5">evidencia de cierre</tspan></text><circle cx="676.8" cy="269.0" r="14" fill="#206e50"/><text x="676.8" y="273.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><rect x="555.0" y="527.6" width="178" height="75.5" rx="10" fill="#e2f7ef" stroke="#8cceb5" stroke-width="1.4"/><text x="567.0" y="549.6" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="567.0">Instrumentar la</tspan><tspan x="567.0" dy="16.5">retroalimentación de</tspan><tspan x="567.0" dy="16.5">ventas</tspan></text><circle cx="557.0" cy="529.6" r="14" fill="#206e50"/><text x="557.0" y="534.1" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><rect x="167.0" y="535.8" width="178" height="59.0" rx="10" fill="#e2f7ef" stroke="#8cceb5" stroke-width="1.4"/><text x="179.0" y="557.8" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="179.0">Recalibrar el modelo</tspan><tspan x="179.0" dy="16.5">con datos de resultado</tspan></text><circle cx="169.0" cy="537.8" r="14" fill="#206e50"/><text x="169.0" y="542.3" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">4</text><rect x="47.2" y="267.0" width="178" height="75.5" rx="10" fill="#e2f7ef" stroke="#8cceb5" stroke-width="1.4"/><text x="59.2" y="289.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="59.2">Documentar el acuerdo</tspan><tspan x="59.2" dy="16.5">entre marketing y</tspan><tspan x="59.2" dy="16.5">ventas</tspan></text><circle cx="49.2" cy="269.0" r="14" fill="#206e50"/><text x="49.2" y="273.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">5</text><text x="40" y="689.6" font-size="11.5" fill="#39ac80" font-weight="700" letter-spacing="1.4">CONCEPTOS Y DÓNDE ACTÚAN EN EL MÉTODO</text><rect x="40.0" y="703.6" width="401.0" height="63.0" rx="8" fill="#ffffff" stroke="#8cceb5" stroke-width="1.4"/><rect x="40.0" y="711.6" width="5" height="47.0" rx="2" fill="#39ac80"/><text x="56.0" y="725.6" font-size="13.5" fill="#206e50" font-weight="700" text-anchor="start"><tspan x="56.0">Ajuste de perfil</tspan></text><text x="56.0" y="745.4" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Correspondencia entre el lead y el perfil de cliente ideal</tspan></text><rect x="379.0" y="711.6" width="54" height="20" rx="10" fill="#bce5d5" stroke="#8cceb5" stroke-width="1"/><text x="406.0" y="725.6" font-size="11" fill="#206e50" font-weight="700" text-anchor="middle">↔ 1</text><rect x="459.0" y="703.6" width="401.0" height="63.0" rx="8" fill="#ffffff" stroke="#8cceb5" stroke-width="1.4"/><rect x="459.0" y="711.6" width="5" height="47.0" rx="2" fill="#39ac80"/><text x="475.0" y="725.6" font-size="13.5" fill="#206e50" font-weight="700" text-anchor="start"><tspan x="475.0">Señal de intención</tspan></text><text x="475.0" y="745.4" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Comportamiento que indica búsqueda activa de solución</tspan></text><rect x="798.0" y="711.6" width="54" height="20" rx="10" fill="#bce5d5" stroke="#8cceb5" stroke-width="1"/><text x="825.0" y="725.6" font-size="11" fill="#206e50" font-weight="700" text-anchor="middle">↔ 1</text><rect x="40.0" y="780.6" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#8cceb5" stroke-width="1.4"/><rect x="40.0" y="788.6" width="5" height="62.2" rx="2" fill="#39ac80"/><text x="56.0" y="802.6" font-size="13.5" fill="#206e50" font-weight="700" text-anchor="start"><tspan x="56.0">Umbral de traspaso</tspan></text><text x="56.0" y="822.4" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Nivel a partir del cual el lead se entrega al equipo</tspan><tspan x="56.0" dy="15.2">comercial</tspan></text><rect x="379.0" y="788.6" width="54" height="20" rx="10" fill="#bce5d5" stroke="#8cceb5" stroke-width="1"/><text x="406.0" y="802.6" font-size="11" fill="#206e50" font-weight="700" text-anchor="middle">↔ 2</text><rect x="459.0" y="780.6" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#8cceb5" stroke-width="1.4"/><rect x="459.0" y="788.6" width="5" height="62.2" rx="2" fill="#39ac80"/><text x="475.0" y="802.6" font-size="13.5" fill="#206e50" font-weight="700" text-anchor="start"><tspan x="475.0">Retroalimentación de ventas</tspan></text><text x="475.0" y="822.4" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Información que ventas devuelve sobre la calidad real de</tspan><tspan x="475.0" dy="15.2">los leads recibidos</tspan></text><rect x="798.0" y="788.6" width="54" height="20" rx="10" fill="#bce5d5" stroke="#8cceb5" stroke-width="1"/><text x="825.0" y="802.6" font-size="11" fill="#206e50" font-weight="700" text-anchor="middle">↔ 3, 5</text><text x="40" y="890.78" font-size="11.5" fill="#39ac80" font-weight="700" letter-spacing="1.4">QUÉ SE MIDE: NUMERADOR SOBRE DENOMINADOR</text><rect x="40.0" y="904.8" width="261.3" height="137.9" rx="8" fill="#e2f7ef" stroke="#8cceb5" stroke-width="1.4"/><text x="54.0" y="926.8" font-size="13" fill="#206e50" font-weight="700" text-anchor="start"><tspan x="54.0">Tasa de aceptación por ventas</tspan></text><text x="54.0" y="955.9" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Leads aceptados como oportunidades</tspan></text><line x1="54.0" y1="977.1" x2="287.3" y2="977.1" stroke="#39ac80" stroke-width="2"/><text x="54.0" y="995.1" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="54.0">Leads traspasados</tspan></text><rect x="319.3" y="904.8" width="261.3" height="137.9" rx="8" fill="#e2f7ef" stroke="#8cceb5" stroke-width="1.4"/><text x="333.3" y="926.8" font-size="13" fill="#206e50" font-weight="700" text-anchor="start"><tspan x="333.3">Conversión a cliente por nivel</tspan><tspan x="333.3" dy="17.2">de calificación</tspan></text><text x="333.3" y="973.1" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="333.3">Clientes ganados</tspan></text><line x1="333.3" y1="994.3" x2="566.7" y2="994.3" stroke="#39ac80" stroke-width="2"/><text x="333.3" y="1012.3" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="333.3">Leads del tramo, comparado entre</tspan><tspan x="333.3" dy="15.2">niveles de calificación</tspan></text><rect x="598.7" y="904.8" width="261.3" height="137.9" rx="8" fill="#e2f7ef" stroke="#8cceb5" stroke-width="1.4"/><text x="612.7" y="926.8" font-size="13" fill="#206e50" font-weight="700" text-anchor="start"><tspan x="612.7">Retroalimentación registrada</tspan></text><text x="612.7" y="955.9" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="612.7">Leads con evaluación devuelta por</tspan><tspan x="612.7" dy="15.2">ventas</tspan></text><line x1="612.7" y1="992.3" x2="846.0" y2="992.3" stroke="#39ac80" stroke-width="2"/><text x="612.7" y="1010.3" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="612.7">Leads traspasados</tspan></text><text x="40" y="1076.6399999999999" font-size="11.5" fill="#39ac80" font-weight="700" letter-spacing="1.4">FRONTERA DE APLICACIÓN</text><rect x="40" y="1086.6" width="820" height="65.0" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.4"/><polygon points="70,1104.1399999999999 52,1133.1399999999999 88,1133.1399999999999" fill="#c2410c"/><text x="70" y="1130.1399999999999" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">!</text><text x="106" y="1110.6" font-size="12.5" fill="#7c2d12" font-weight="400" text-anchor="start"><tspan x="106">Los modelos de calificación heredan los sesgos de los datos históricos: si la prospección pasada ignoró un</tspan><tspan x="106" dy="16.5">segmento, el modelo seguirá ignorándolo.</tspan></text><text x="40" y="1179.6399999999999" font-size="11.5" fill="#39ac80" font-weight="700" letter-spacing="1.4">ERROR FRECUENTE Y SU CORRECCIÓN</text><rect x="40" y="1189.6" width="380.0" height="77.0" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/><text x="54" y="1211.6" font-size="11" fill="#b91c1c" font-weight="700" text-anchor="start"><tspan x="54">Síntoma</tspan></text><text x="54" y="1229.6" font-size="12.5" fill="#7f1d1d" font-weight="400" text-anchor="start"><tspan x="54">Puntuar sólo interacción digital</tspan></text><line x1="426.0" y1="1228.1" x2="469.0" y2="1228.1" stroke="#39ac80" stroke-width="2.6" stroke-linecap="round"/><polygon points="474.0,1228.1 465.9,1232.1 465.9,1224.2" fill="#39ac80"/><rect x="480.0" y="1189.6" width="380.0" height="77.0" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.4"/><text x="494.0" y="1211.6" font-size="11" fill="#15803d" font-weight="700" text-anchor="start"><tspan x="494.0">Corrección</tspan></text><text x="494.0" y="1229.6" font-size="12.5" fill="#14532d" font-weight="400" text-anchor="start"><tspan x="494.0">Combina ajuste de perfil con señal de problema y</tspan><tspan x="494.0" dy="16.5">valida el modelo contra tasas de cierre reales.</tspan></text></svg>