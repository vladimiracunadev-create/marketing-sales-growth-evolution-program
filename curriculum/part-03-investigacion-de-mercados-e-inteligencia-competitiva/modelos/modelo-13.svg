<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1302" width="900" height="1302" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif"><title id="t">Modelo mental · Validación de hipótesis comerciales</title><desc id="d">Modelo mental de la clase 03.13: Validación de hipótesis comerciales. Método en 5 pasos; 4 conceptos; 3 señales de medición.</desc><rect x="0" y="0" width="900" height="1302" rx="14" fill="#ffffff"/><rect x="0" y="0" width="900" height="64" rx="14" fill="#206e3b"/><rect x="0" y="40" width="900" height="24" fill="#206e3b"/><text x="40" y="28" font-size="12" fill="#bce5ca" font-weight="700" letter-spacing="1.6">MODELO MENTAL · CLASE 03.13 · PARTE 03</text><text x="40" y="52" font-size="21" fill="#ffffff" font-weight="700">Validación de hipótesis comerciales</text><text x="40" y="84" font-size="11.5" fill="#39ac61" font-weight="700" letter-spacing="1.4">MÉTODO PASO A PASO</text><ellipse cx="450.0" cy="376.8" rx="330.0" ry="233.1" fill="none" stroke="#8ccea3" stroke-width="2" stroke-dasharray="3 8" stroke-linecap="round"/><polygon points="653.8,193.3 636.3,190.4 641.2,180.8" fill="#39ac61"/><polygon points="759.3,458.8 761.4,441.2 771.2,445.7" fill="#39ac61"/><polygon points="439.0,609.9 455.9,604.4 455.9,615.3" fill="#39ac61"/><polygon points="131.6,438.8 143.5,451.9 133.7,456.4" fill="#39ac61"/><polygon points="265.8,183.2 253.2,195.8 248.3,186.1" fill="#39ac61"/><circle cx="450.0" cy="376.8" r="100.0" fill="#bce5ca" stroke="#8ccea3" stroke-width="1.6"/><text x="450.0" y="359.1" font-size="15" fill="#206e3b" font-weight="700" text-anchor="middle"><tspan x="450.0">Validación de</tspan><tspan x="450.0" dy="19.8">hipótesis</tspan><tspan x="450.0" dy="19.8">comerciales</tspan></text><rect x="361.0" y="114.2" width="178" height="59.0" rx="10" fill="#e2f7e9" stroke="#8ccea3" stroke-width="1.4"/><text x="373.0" y="136.2" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="373.0">Escribir la hipótesis</tspan><tspan x="373.0" dy="16.5">con magnitud y plazo</tspan></text><circle cx="363.0" cy="116.2" r="14" fill="#206e3b"/><text x="363.0" y="120.8" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><rect x="674.8" y="267.0" width="178" height="75.5" rx="10" fill="#e2f7e9" stroke="#8ccea3" stroke-width="1.4"/><text x="686.8" y="289.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="686.8">Definir el criterio de</tspan><tspan x="686.8" dy="16.5">refutación antes de</tspan><tspan x="686.8" dy="16.5">ejecutar</tspan></text><circle cx="676.8" cy="269.0" r="14" fill="#206e3b"/><text x="676.8" y="273.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><rect x="555.0" y="535.8" width="178" height="59.0" rx="10" fill="#e2f7e9" stroke="#8ccea3" stroke-width="1.4"/><text x="567.0" y="557.8" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="567.0">Diseñar la prueba más</tspan><tspan x="567.0" dy="16.5">barata que discrimine</tspan></text><circle cx="557.0" cy="537.8" r="14" fill="#206e3b"/><text x="557.0" y="542.3" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><rect x="167.0" y="527.6" width="178" height="75.5" rx="10" fill="#e2f7e9" stroke="#8ccea3" stroke-width="1.4"/><text x="179.0" y="549.6" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="179.0">Ejecutar sin modificar</tspan><tspan x="179.0" dy="16.5">el criterio a mitad de</tspan><tspan x="179.0" dy="16.5">camino</tspan></text><circle cx="169.0" cy="529.6" r="14" fill="#206e3b"/><text x="169.0" y="534.1" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">4</text><rect x="47.2" y="267.0" width="178" height="75.5" rx="10" fill="#e2f7e9" stroke="#8ccea3" stroke-width="1.4"/><text x="59.2" y="289.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="59.2">Registrar el</tspan><tspan x="59.2" dy="16.5">aprendizaje y la</tspan><tspan x="59.2" dy="16.5">decisión resultante</tspan></text><circle cx="49.2" cy="269.0" r="14" fill="#206e3b"/><text x="49.2" y="273.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">5</text><text x="40" y="689.6" font-size="11.5" fill="#39ac61" font-weight="700" letter-spacing="1.4">CONCEPTOS Y DÓNDE ACTÚAN EN EL MÉTODO</text><rect x="40.0" y="703.6" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#8ccea3" stroke-width="1.4"/><rect x="40.0" y="711.6" width="5" height="62.2" rx="2" fill="#39ac61"/><text x="56.0" y="725.6" font-size="13.5" fill="#206e3b" font-weight="700" text-anchor="start"><tspan x="56.0">Hipótesis falsable</tspan></text><text x="56.0" y="745.4" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Afirmación que especifica condición, efecto esperado,</tspan><tspan x="56.0" dy="15.2">magnitud y plazo</tspan></text><rect x="379.0" y="711.6" width="54" height="20" rx="10" fill="#bce5ca" stroke="#8ccea3" stroke-width="1"/><text x="406.0" y="725.6" font-size="11" fill="#206e3b" font-weight="700" text-anchor="middle">↔ 1</text><rect x="459.0" y="703.6" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#8ccea3" stroke-width="1.4"/><rect x="459.0" y="711.6" width="5" height="62.2" rx="2" fill="#39ac61"/><text x="475.0" y="725.6" font-size="13.5" fill="#206e3b" font-weight="700" text-anchor="start"><tspan x="475.0">Criterio de refutación</tspan></text><text x="475.0" y="745.4" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Resultado definido de antemano que obligaría a abandonar</tspan><tspan x="475.0" dy="15.2">la hipótesis</tspan></text><rect x="798.0" y="711.6" width="54" height="20" rx="10" fill="#bce5ca" stroke="#8ccea3" stroke-width="1"/><text x="825.0" y="725.6" font-size="11" fill="#206e3b" font-weight="700" text-anchor="middle">↔ 2, 4</text><rect x="40.0" y="795.8" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#8ccea3" stroke-width="1.4"/><rect x="40.0" y="803.8" width="5" height="62.2" rx="2" fill="#39ac61"/><text x="56.0" y="817.8" font-size="13.5" fill="#206e3b" font-weight="700" text-anchor="start"><tspan x="56.0">Prueba mínima</tspan></text><text x="56.0" y="837.6" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Experimento más barato capaz de producir evidencia</tspan><tspan x="56.0" dy="15.2">suficiente para decidir</tspan></text><rect x="379.0" y="803.8" width="54" height="20" rx="10" fill="#bce5ca" stroke="#8ccea3" stroke-width="1"/><text x="406.0" y="817.8" font-size="11" fill="#206e3b" font-weight="700" text-anchor="middle">↔ 3</text><rect x="459.0" y="795.8" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#8ccea3" stroke-width="1.4"/><rect x="459.0" y="803.8" width="5" height="62.2" rx="2" fill="#39ac61"/><text x="475.0" y="817.8" font-size="13.5" fill="#206e3b" font-weight="700" text-anchor="start"><tspan x="475.0">Aprendizaje validado</tspan></text><text x="475.0" y="837.6" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Conclusión respaldada por evidencia que modifica la</tspan><tspan x="475.0" dy="15.2">siguiente decisión</tspan></text><rect x="798.0" y="803.8" width="54" height="20" rx="10" fill="#bce5ca" stroke="#8ccea3" stroke-width="1"/><text x="825.0" y="817.8" font-size="11" fill="#206e3b" font-weight="700" text-anchor="middle">↔ 5</text><text x="40" y="905.96" font-size="11.5" fill="#39ac61" font-weight="700" letter-spacing="1.4">QUÉ SE MIDE: NUMERADOR SOBRE DENOMINADOR</text><rect x="40.0" y="920.0" width="261.3" height="120.7" rx="8" fill="#e2f7e9" stroke="#8ccea3" stroke-width="1.4"/><text x="54.0" y="942.0" font-size="13" fill="#206e3b" font-weight="700" text-anchor="start"><tspan x="54.0">Hipótesis con criterio previo</tspan></text><text x="54.0" y="971.1" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Hipótesis con criterio de refutación</tspan><tspan x="54.0" dy="15.2">escrito antes de la prueba</tspan></text><line x1="54.0" y1="1007.5" x2="287.3" y2="1007.5" stroke="#39ac61" stroke-width="2"/><text x="54.0" y="1025.5" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="54.0">Hipótesis probadas</tspan></text><rect x="319.3" y="920.0" width="261.3" height="120.7" rx="8" fill="#e2f7e9" stroke="#8ccea3" stroke-width="1.4"/><text x="333.3" y="942.0" font-size="13" fill="#206e3b" font-weight="700" text-anchor="start"><tspan x="333.3">Tasa de refutación</tspan></text><text x="333.3" y="971.1" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="333.3">Hipótesis refutadas</tspan></text><line x1="333.3" y1="992.3" x2="566.7" y2="992.3" stroke="#39ac61" stroke-width="2"/><text x="333.3" y="1010.3" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="333.3">Hipótesis probadas en el periodo</tspan></text><rect x="598.7" y="920.0" width="261.3" height="120.7" rx="8" fill="#e2f7e9" stroke="#8ccea3" stroke-width="1.4"/><text x="612.7" y="942.0" font-size="13" fill="#206e3b" font-weight="700" text-anchor="start"><tspan x="612.7">Costo por aprendizaje</tspan></text><text x="612.7" y="971.1" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="612.7">Costo total de las pruebas</tspan></text><line x1="612.7" y1="992.3" x2="846.0" y2="992.3" stroke="#39ac61" stroke-width="2"/><text x="612.7" y="1010.3" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="612.7">Número de aprendizajes documentados</tspan></text><text x="40" y="1074.66" font-size="11.5" fill="#39ac61" font-weight="700" letter-spacing="1.4">FRONTERA DE APLICACIÓN</text><rect x="40" y="1084.7" width="820" height="65.0" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.4"/><polygon points="70,1102.16 52,1131.16 88,1131.16" fill="#c2410c"/><text x="70" y="1128.16" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">!</text><text x="106" y="1108.7" font-size="12.5" fill="#7c2d12" font-weight="400" text-anchor="start"><tspan x="106">No todo puede probarse antes: algunas decisiones son irreversibles o el costo de la prueba supera el de</tspan><tspan x="106" dy="16.5">equivocarse. En esos casos corresponde decidir con juicio explícito y dejar traza.</tspan></text><text x="40" y="1177.66" font-size="11.5" fill="#39ac61" font-weight="700" letter-spacing="1.4">ERROR FRECUENTE Y SU CORRECCIÓN</text><rect x="40" y="1187.7" width="380.0" height="77.0" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/><text x="54" y="1209.7" font-size="11" fill="#b91c1c" font-weight="700" text-anchor="start"><tspan x="54">Síntoma</tspan></text><text x="54" y="1227.7" font-size="12.5" fill="#7f1d1d" font-weight="400" text-anchor="start"><tspan x="54">Cambiar el criterio de éxito después de ver el</tspan><tspan x="54" dy="16.5">resultado</tspan></text><line x1="426.0" y1="1226.2" x2="469.0" y2="1226.2" stroke="#39ac61" stroke-width="2.6" stroke-linecap="round"/><polygon points="474.0,1226.2 465.9,1230.1 465.9,1222.2" fill="#39ac61"/><rect x="480.0" y="1187.7" width="380.0" height="77.0" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.4"/><text x="494.0" y="1209.7" font-size="11" fill="#15803d" font-weight="700" text-anchor="start"><tspan x="494.0">Corrección</tspan></text><text x="494.0" y="1227.7" font-size="12.5" fill="#14532d" font-weight="400" text-anchor="start"><tspan x="494.0">Registra el criterio en un documento fechado antes</tspan><tspan x="494.0" dy="16.5">de iniciar la prueba.</tspan></text></svg>