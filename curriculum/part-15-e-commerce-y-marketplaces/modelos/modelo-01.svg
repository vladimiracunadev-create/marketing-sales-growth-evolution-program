<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 909" width="900" height="909" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif"><title id="t">Modelo mental · Modelo operativo de e-commerce</title><desc id="d">Modelo mental de la clase 15.01: Modelo operativo de e-commerce. Método en 5 pasos; 4 conceptos; 3 señales de medición.</desc><rect x="0" y="0" width="900" height="909" rx="14" fill="#ffffff"/><rect x="0" y="0" width="900" height="64" rx="14" fill="#6e2033"/><rect x="0" y="40" width="900" height="24" fill="#6e2033"/><text x="40" y="28" font-size="12" fill="#e5bcc6" font-weight="700" letter-spacing="1.6">MODELO MENTAL · CLASE 15.01 · PARTE 15</text><text x="40" y="52" font-size="21" fill="#ffffff" font-weight="700">Modelo operativo de e-commerce</text><text x="40" y="84" font-size="11.5" fill="#ac3956" font-weight="700" letter-spacing="1.4">MÉTODO PASO A PASO</text><rect x="40.0" y="100" width="246.7" height="59.0" rx="10" fill="#f7e2e7" stroke="#ce8c9d" stroke-width="1.4"/><text x="54.0" y="122" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Mapear el flujo completo desde</tspan><tspan x="54.0" dy="16.5">el pedido hasta la entrega</tspan></text><circle cx="42.0" cy="102.0" r="14" fill="#6e2033"/><text x="42.0" y="106.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><rect x="326.7" y="100" width="246.7" height="59.0" rx="10" fill="#f7e2e7" stroke="#ce8c9d" stroke-width="1.4"/><text x="340.7" y="122" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="340.7">Costear cada paso con datos</tspan><tspan x="340.7" dy="16.5">reales</tspan></text><circle cx="328.7" cy="102.0" r="14" fill="#6e2033"/><text x="328.7" y="106.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><rect x="613.3" y="100" width="246.7" height="59.0" rx="10" fill="#f7e2e7" stroke="#ce8c9d" stroke-width="1.4"/><text x="627.3" y="122" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="627.3">Calcular el margen por pedido y</tspan><tspan x="627.3" dy="16.5">por categoría</tspan></text><circle cx="615.3" cy="102.0" r="14" fill="#6e2033"/><text x="615.3" y="106.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><rect x="613.3" y="197.0" width="246.7" height="59.0" rx="10" fill="#f7e2e7" stroke="#ce8c9d" stroke-width="1.4"/><text x="627.3" y="219.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="627.3">Identificar el punto de</tspan><tspan x="627.3" dy="16.5">equilibrio operativo</tspan></text><circle cx="615.3" cy="199.0" r="14" fill="#6e2033"/><text x="615.3" y="203.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">4</text><rect x="326.7" y="197.0" width="246.7" height="59.0" rx="10" fill="#f7e2e7" stroke="#ce8c9d" stroke-width="1.4"/><text x="340.7" y="219.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="340.7">Decidir qué pasos internalizar o</tspan><tspan x="340.7" dy="16.5">externalizar</tspan></text><circle cx="328.7" cy="199.0" r="14" fill="#6e2033"/><text x="328.7" y="203.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">5</text><line x1="289.7" y1="129.5" x2="318.7" y2="129.5" stroke="#ac3956" stroke-width="2.2" stroke-linecap="round"/><polygon points="323.7,129.5 315.6,133.4 315.6,125.6" fill="#ac3956"/><line x1="576.3" y1="129.5" x2="605.3" y2="129.5" stroke="#ac3956" stroke-width="2.2" stroke-linecap="round"/><polygon points="610.3,129.5 602.2,133.4 602.2,125.6" fill="#ac3956"/><line x1="736.7" y1="161.0" x2="736.7" y2="189.0" stroke="#ac3956" stroke-width="2.2" stroke-linecap="round"/><polygon points="736.7,194.0 732.8,185.9 740.6,185.9" fill="#ac3956"/><line x1="610.3" y1="226.5" x2="581.3" y2="226.5" stroke="#ac3956" stroke-width="2.2" stroke-linecap="round"/><polygon points="576.3,226.5 584.4,222.6 584.4,230.4" fill="#ac3956"/><text x="40" y="294.0" font-size="11.5" fill="#ac3956" font-weight="700" letter-spacing="1.4">CONCEPTOS Y DÓNDE ACTÚAN EN EL MÉTODO</text><rect x="40.0" y="308.0" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#ce8c9d" stroke-width="1.4"/><rect x="40.0" y="316.0" width="5" height="62.2" rx="2" fill="#ac3956"/><text x="56.0" y="330.0" font-size="13.5" fill="#6e2033" font-weight="700" text-anchor="start"><tspan x="56.0">Costo por pedido</tspan></text><text x="56.0" y="349.8" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Suma de costos de producto, empaque, despacho, pasarela y</tspan><tspan x="56.0" dy="15.2">atención por cada pedido</tspan></text><rect x="379.0" y="316.0" width="54" height="20" rx="10" fill="#e5bcc6" stroke="#ce8c9d" stroke-width="1"/><text x="406.0" y="330.0" font-size="11" fill="#6e2033" font-weight="700" text-anchor="middle">↔ 1, 3</text><rect x="459.0" y="308.0" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#ce8c9d" stroke-width="1.4"/><rect x="459.0" y="316.0" width="5" height="62.2" rx="2" fill="#ac3956"/><text x="475.0" y="330.0" font-size="13.5" fill="#6e2033" font-weight="700" text-anchor="start"><tspan x="475.0">Modelo de cumplimiento</tspan></text><text x="475.0" y="349.8" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Forma en que se almacena, prepara y entrega el producto</tspan></text><rect x="40.0" y="400.2" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#ce8c9d" stroke-width="1.4"/><rect x="40.0" y="408.2" width="5" height="62.2" rx="2" fill="#ac3956"/><text x="56.0" y="422.2" font-size="13.5" fill="#6e2033" font-weight="700" text-anchor="start"><tspan x="56.0">Margen por pedido</tspan></text><text x="56.0" y="442.0" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Ingreso del pedido menos todos los costos variables</tspan><tspan x="56.0" dy="15.2">asociados</tspan></text><rect x="379.0" y="408.2" width="54" height="20" rx="10" fill="#e5bcc6" stroke="#ce8c9d" stroke-width="1"/><text x="406.0" y="422.2" font-size="11" fill="#6e2033" font-weight="700" text-anchor="middle">↔ 1, 3</text><rect x="459.0" y="400.2" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#ce8c9d" stroke-width="1.4"/><rect x="459.0" y="408.2" width="5" height="62.2" rx="2" fill="#ac3956"/><text x="475.0" y="422.2" font-size="13.5" fill="#6e2033" font-weight="700" text-anchor="start"><tspan x="475.0">Punto de equilibrio operativo</tspan></text><text x="475.0" y="442.0" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Volumen a partir del cual la operación cubre sus costos</tspan><tspan x="475.0" dy="15.2">fijos</tspan></text><rect x="798.0" y="408.2" width="54" height="20" rx="10" fill="#e5bcc6" stroke="#ce8c9d" stroke-width="1"/><text x="825.0" y="422.2" font-size="11" fill="#6e2033" font-weight="700" text-anchor="middle">↔ 4</text><text x="40" y="510.36" font-size="11.5" fill="#ac3956" font-weight="700" letter-spacing="1.4">QUÉ SE MIDE: NUMERADOR SOBRE DENOMINADOR</text><rect x="40.0" y="524.4" width="261.3" height="122.7" rx="8" fill="#f7e2e7" stroke="#ce8c9d" stroke-width="1.4"/><text x="54.0" y="546.4" font-size="13" fill="#6e2033" font-weight="700" text-anchor="start"><tspan x="54.0">Margen por pedido</tspan></text><text x="54.0" y="575.5" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Ingreso menos costos variables,</tspan></text><line x1="54.0" y1="596.7" x2="287.3" y2="596.7" stroke="#ac3956" stroke-width="2"/><text x="54.0" y="614.7" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="54.0">Ingreso, por categoría</tspan></text><rect x="319.3" y="524.4" width="261.3" height="122.7" rx="8" fill="#f7e2e7" stroke="#ce8c9d" stroke-width="1.4"/><text x="333.3" y="546.4" font-size="13" fill="#6e2033" font-weight="700" text-anchor="start"><tspan x="333.3">Costo logístico sobre ingreso</tspan></text><text x="333.3" y="575.5" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="333.3">Costo de preparación y despacho</tspan></text><line x1="333.3" y1="596.7" x2="566.7" y2="596.7" stroke="#ac3956" stroke-width="2"/><text x="333.3" y="614.7" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="333.3">Ingreso del periodo</tspan></text><rect x="598.7" y="524.4" width="261.3" height="122.7" rx="8" fill="#f7e2e7" stroke="#ce8c9d" stroke-width="1.4"/><text x="612.7" y="546.4" font-size="13" fill="#6e2033" font-weight="700" text-anchor="start"><tspan x="612.7">Pedidos bajo el punto de</tspan><tspan x="612.7" dy="17.2">equilibrio</tspan></text><text x="612.7" y="592.7" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="612.7">Pedidos con margen negativo</tspan></text><line x1="612.7" y1="613.9" x2="846.0" y2="613.9" stroke="#ac3956" stroke-width="2"/><text x="612.7" y="631.9" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="612.7">Pedidos del periodo</tspan></text><text x="40" y="681.04" font-size="11.5" fill="#ac3956" font-weight="700" letter-spacing="1.4">FRONTERA DE APLICACIÓN</text><rect x="40" y="691.0" width="820" height="65.0" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.4"/><polygon points="70,708.54 52,737.54 88,737.54" fill="#c2410c"/><text x="70" y="734.54" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">!</text><text x="106" y="715.0" font-size="12.5" fill="#7c2d12" font-weight="400" text-anchor="start"><tspan x="106">El costo por pedido varía con el volumen y con la mezcla de productos. Un cálculo promedio esconde</tspan><tspan x="106" dy="16.5">categorías que pierden dinero en cada venta.</tspan></text><text x="40" y="784.04" font-size="11.5" fill="#ac3956" font-weight="700" letter-spacing="1.4">ERROR FRECUENTE Y SU CORRECCIÓN</text><rect x="40" y="794.0" width="380.0" height="77.0" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/><text x="54" y="816.0" font-size="11" fill="#b91c1c" font-weight="700" text-anchor="start"><tspan x="54">Síntoma</tspan></text><text x="54" y="834.0" font-size="12.5" fill="#7f1d1d" font-weight="400" text-anchor="start"><tspan x="54">Evaluar el canal por ingreso y no por margen por</tspan><tspan x="54" dy="16.5">pedido</tspan></text><line x1="426.0" y1="832.5" x2="469.0" y2="832.5" stroke="#ac3956" stroke-width="2.6" stroke-linecap="round"/><polygon points="474.0,832.5 465.9,836.5 465.9,828.6" fill="#ac3956"/><rect x="480.0" y="794.0" width="380.0" height="77.0" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.4"/><text x="494.0" y="816.0" font-size="11" fill="#15803d" font-weight="700" text-anchor="start"><tspan x="494.0">Corrección</tspan></text><text x="494.0" y="834.0" font-size="12.5" fill="#14532d" font-weight="400" text-anchor="start"><tspan x="494.0">Costea despacho, comisión y devoluciones antes de</tspan><tspan x="494.0" dy="16.5">declarar rentable una categoría.</tspan></text></svg>