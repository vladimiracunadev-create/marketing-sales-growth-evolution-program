<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 950" width="900" height="950" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif"><title id="t">Modelo mental · Brand equity</title><desc id="d">Modelo mental de la clase 06.09: Brand equity. Método en 5 pasos; 4 conceptos; 3 señales de medición.</desc><rect x="0" y="0" width="900" height="950" rx="14" fill="#ffffff"/><rect x="0" y="0" width="900" height="64" rx="14" fill="#57206e"/><rect x="0" y="40" width="900" height="24" fill="#57206e"/><text x="40" y="28" font-size="12" fill="#d9bce5" font-weight="700" letter-spacing="1.6">MODELO MENTAL · CLASE 06.09 · PARTE 06</text><text x="40" y="52" font-size="21" fill="#ffffff" font-weight="700">Brand equity</text><text x="40" y="84" font-size="11.5" fill="#8939ac" font-weight="700" letter-spacing="1.4">MÉTODO PASO A PASO</text><line x1="450.0" y1="94.0" x2="450.0" y2="317.0" stroke="#ba8cce" stroke-width="3" stroke-linecap="round"/><line x1="450.0" y1="129.5" x2="406.0" y2="129.5" stroke="#ba8cce" stroke-width="2"/><rect x="56.0" y="100" width="350" height="59.0" rx="10" fill="#f1e2f7" stroke="#ba8cce" stroke-width="1.4"/><text x="70.0" y="122" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="70.0">Medir notoriedad y asociaciones con muestra del</tspan><tspan x="70.0" dy="16.5">segmento</tspan></text><circle cx="450.0" cy="129.5" r="15" fill="#57206e"/><text x="450.0" y="134.0" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><line x1="450.0" y1="167.5" x2="494.0" y2="167.5" stroke="#ba8cce" stroke-width="2"/><rect x="494.0" y="138" width="350" height="59.0" rx="10" fill="#f1e2f7" stroke="#ba8cce" stroke-width="1.4"/><text x="508.0" y="160" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="508.0">Estimar la prima de precio observada frente a</tspan><tspan x="508.0" dy="16.5">competidores</tspan></text><circle cx="450.0" cy="167.5" r="15" fill="#57206e"/><text x="450.0" y="172.0" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><line x1="450.0" y1="197.2" x2="406.0" y2="197.2" stroke="#ba8cce" stroke-width="2"/><rect x="56.0" y="176" width="350" height="42.5" rx="10" fill="#f1e2f7" stroke="#ba8cce" stroke-width="1.4"/><text x="70.0" y="198" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="70.0">Aislar el efecto de promociones vigentes</tspan></text><circle cx="450.0" cy="197.2" r="15" fill="#57206e"/><text x="450.0" y="201.8" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><line x1="450.0" y1="235.2" x2="494.0" y2="235.2" stroke="#ba8cce" stroke-width="2"/><rect x="494.0" y="214" width="350" height="42.5" rx="10" fill="#f1e2f7" stroke="#ba8cce" stroke-width="1.4"/><text x="508.0" y="236" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="508.0">Seguir la evolución con olas comparables</tspan></text><circle cx="450.0" cy="235.2" r="15" fill="#57206e"/><text x="450.0" y="239.8" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">4</text><line x1="450.0" y1="281.5" x2="406.0" y2="281.5" stroke="#ba8cce" stroke-width="2"/><rect x="56.0" y="252" width="350" height="59.0" rx="10" fill="#f1e2f7" stroke="#ba8cce" stroke-width="1.4"/><text x="70.0" y="274" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="70.0">Vincular la métrica de marca con costo de</tspan><tspan x="70.0" dy="16.5">adquisición</tspan></text><circle cx="450.0" cy="281.5" r="15" fill="#57206e"/><text x="450.0" y="286.0" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">5</text><text x="40" y="353.0" font-size="11.5" fill="#8939ac" font-weight="700" letter-spacing="1.4">CONCEPTOS Y DÓNDE ACTÚAN EN EL MÉTODO</text><rect x="40.0" y="367.0" width="401.0" height="63.0" rx="8" fill="#ffffff" stroke="#ba8cce" stroke-width="1.4"/><rect x="40.0" y="375.0" width="5" height="47.0" rx="2" fill="#8939ac"/><text x="56.0" y="389.0" font-size="13.5" fill="#57206e" font-weight="700" text-anchor="start"><tspan x="56.0">Notoriedad</tspan></text><text x="56.0" y="408.8" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Nivel y calidad del recuerdo de la marca en su categoría</tspan></text><rect x="379.0" y="375.0" width="54" height="20" rx="10" fill="#d9bce5" stroke="#ba8cce" stroke-width="1"/><text x="406.0" y="389.0" font-size="11" fill="#57206e" font-weight="700" text-anchor="middle">↔ 1</text><rect x="459.0" y="367.0" width="401.0" height="63.0" rx="8" fill="#ffffff" stroke="#ba8cce" stroke-width="1.4"/><rect x="459.0" y="375.0" width="5" height="47.0" rx="2" fill="#8939ac"/><text x="475.0" y="389.0" font-size="13.5" fill="#57206e" font-weight="700" text-anchor="start"><tspan x="475.0">Significado asociado</tspan></text><text x="475.0" y="408.8" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Atributos y beneficios que el mercado vincula con la marca</tspan></text><rect x="798.0" y="375.0" width="54" height="20" rx="10" fill="#d9bce5" stroke="#ba8cce" stroke-width="1"/><text x="825.0" y="389.0" font-size="11" fill="#57206e" font-weight="700" text-anchor="middle">↔ 1, 5</text><rect x="40.0" y="444.0" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#ba8cce" stroke-width="1.4"/><rect x="40.0" y="452.0" width="5" height="62.2" rx="2" fill="#8939ac"/><text x="56.0" y="466.0" font-size="13.5" fill="#57206e" font-weight="700" text-anchor="start"><tspan x="56.0">Prima de precio</tspan></text><text x="56.0" y="485.8" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Diferencia de precio sostenible frente a alternativas</tspan><tspan x="56.0" dy="15.2">equivalentes</tspan></text><rect x="379.0" y="452.0" width="54" height="20" rx="10" fill="#d9bce5" stroke="#ba8cce" stroke-width="1"/><text x="406.0" y="466.0" font-size="11" fill="#57206e" font-weight="700" text-anchor="middle">↔ 2</text><rect x="459.0" y="444.0" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#ba8cce" stroke-width="1.4"/><rect x="459.0" y="452.0" width="5" height="62.2" rx="2" fill="#8939ac"/><text x="475.0" y="466.0" font-size="13.5" fill="#57206e" font-weight="700" text-anchor="start"><tspan x="475.0">Resonancia</tspan></text><text x="475.0" y="485.8" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Intensidad del vínculo que produce lealtad y recomendación</tspan><tspan x="475.0" dy="15.2">activa</tspan></text><text x="40" y="554.1800000000001" font-size="11.5" fill="#8939ac" font-weight="700" letter-spacing="1.4">QUÉ SE MIDE: NUMERADOR SOBRE DENOMINADOR</text><rect x="40.0" y="568.2" width="261.3" height="120.7" rx="8" fill="#f1e2f7" stroke="#ba8cce" stroke-width="1.4"/><text x="54.0" y="590.2" font-size="13" fill="#57206e" font-weight="700" text-anchor="start"><tspan x="54.0">Costo de adquisición por origen</tspan><tspan x="54.0" dy="17.2">de marca</tspan></text><text x="54.0" y="636.5" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Costo por cliente ganado en tráfico</tspan><tspan x="54.0" dy="15.2">de marca frente a tráfico genérico</tspan></text><rect x="319.3" y="568.2" width="261.3" height="120.7" rx="8" fill="#f1e2f7" stroke="#ba8cce" stroke-width="1.4"/><text x="333.3" y="590.2" font-size="13" fill="#57206e" font-weight="700" text-anchor="start"><tspan x="333.3">Prima de precio sostenida</tspan></text><text x="333.3" y="619.3" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="333.3">Diferencia porcentual de precio</tspan><tspan x="333.3" dy="15.2">efectivo frente al competidor, en el</tspan><tspan x="333.3" dy="15.2">tiempo</tspan></text><rect x="598.7" y="568.2" width="261.3" height="120.7" rx="8" fill="#f1e2f7" stroke="#ba8cce" stroke-width="1.4"/><text x="612.7" y="590.2" font-size="13" fill="#57206e" font-weight="700" text-anchor="start"><tspan x="612.7">Tasa de recomendación activa</tspan></text><text x="612.7" y="619.3" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="612.7">Clientes que originaron una</tspan><tspan x="612.7" dy="15.2">referencia en 12 meses</tspan></text><line x1="612.7" y1="655.7" x2="846.0" y2="655.7" stroke="#8939ac" stroke-width="2"/><text x="612.7" y="673.7" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="612.7">Clientes activos</tspan></text><text x="40" y="722.8800000000001" font-size="11.5" fill="#8939ac" font-weight="700" letter-spacing="1.4">FRONTERA DE APLICACIÓN</text><rect x="40" y="732.9" width="820" height="65.0" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.4"/><polygon points="70,750.3800000000001 52,779.3800000000001 88,779.3800000000001" fill="#c2410c"/><text x="70" y="776.3800000000001" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">!</text><text x="106" y="756.9" font-size="12.5" fill="#7c2d12" font-weight="400" text-anchor="start"><tspan x="106">El valor de marca se construye en años y se mide con ruido. Exigir demostración trimestral de retorno</tspan><tspan x="106" dy="16.5">induce a desmantelar la inversión de largo plazo.</tspan></text><text x="40" y="825.8800000000001" font-size="11.5" fill="#8939ac" font-weight="700" letter-spacing="1.4">ERROR FRECUENTE Y SU CORRECCIÓN</text><rect x="40" y="835.9" width="380.0" height="77.0" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/><text x="54" y="857.9" font-size="11" fill="#b91c1c" font-weight="700" text-anchor="start"><tspan x="54">Síntoma</tspan></text><text x="54" y="875.9" font-size="12.5" fill="#7f1d1d" font-weight="400" text-anchor="start"><tspan x="54">Atribuir a campañas el tráfico de marca</tspan></text><line x1="426.0" y1="874.4" x2="469.0" y2="874.4" stroke="#8939ac" stroke-width="2.6" stroke-linecap="round"/><polygon points="474.0,874.4 465.9,878.3 465.9,870.5" fill="#8939ac"/><rect x="480.0" y="835.9" width="380.0" height="77.0" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.4"/><text x="494.0" y="857.9" font-size="11" fill="#15803d" font-weight="700" text-anchor="start"><tspan x="494.0">Corrección</tspan></text><text x="494.0" y="875.9" font-size="12.5" fill="#14532d" font-weight="400" text-anchor="start"><tspan x="494.0">Separa tráfico de marca y genérico en la medición</tspan><tspan x="494.0" dy="16.5">antes de calcular retorno.</tspan></text></svg>