<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1342" width="900" height="1342" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif"><title id="t">Modelo mental · NPS, CSAT y CES</title><desc id="d">Modelo mental de la clase 18.06: NPS, CSAT y CES. Método en 5 pasos; 4 conceptos; 3 señales de medición.</desc><rect x="0" y="0" width="900" height="1342" rx="14" fill="#ffffff"/><rect x="0" y="0" width="900" height="64" rx="14" fill="#206e27"/><rect x="0" y="40" width="900" height="24" fill="#206e27"/><text x="40" y="28" font-size="12" fill="#bce5c0" font-weight="700" letter-spacing="1.6">MODELO MENTAL · CLASE 18.06 · PARTE 18</text><text x="40" y="52" font-size="21" fill="#ffffff" font-weight="700">NPS, CSAT y CES</text><text x="40" y="84" font-size="11.5" fill="#39ac44" font-weight="700" letter-spacing="1.4">MÉTODO PASO A PASO</text><ellipse cx="450.0" cy="403.2" rx="330.0" ry="251.2" fill="none" stroke="#8cce93" stroke-width="2" stroke-dasharray="3 8" stroke-linecap="round"/><polygon points="653.6,205.3 636.2,201.8 641.4,192.4" fill="#39ac44"/><polygon points="759.5,490.9 761.2,473.3 771.1,477.5" fill="#39ac44"/><polygon points="439.0,654.4 455.9,649.0 455.9,659.8" fill="#39ac44"/><polygon points="131.8,470.7 143.4,484.1 133.5,488.4" fill="#39ac44"/><polygon points="265.7,194.7 253.5,207.6 248.3,198.1" fill="#39ac44"/><circle cx="450.0" cy="403.2" r="100.0" fill="#bce5c0" stroke="#8cce93" stroke-width="1.6"/><text x="450.0" y="405.3" font-size="15" fill="#206e27" font-weight="700" text-anchor="middle"><tspan x="450.0">NPS, CSAT y CES</tspan></text><rect x="361.0" y="114.2" width="178" height="75.5" rx="10" fill="#e2f7e4" stroke="#8cce93" stroke-width="1.4"/><text x="373.0" y="136.2" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="373.0">Elegir el indicador</tspan><tspan x="373.0" dy="16.5">según la pregunta a</tspan><tspan x="373.0" dy="16.5">responder</tspan></text><circle cx="363.0" cy="116.2" r="14" fill="#206e27"/><text x="363.0" y="120.8" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><rect x="674.8" y="296.1" width="178" height="59.0" rx="10" fill="#e2f7e4" stroke="#8cce93" stroke-width="1.4"/><text x="686.8" y="318.1" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="686.8">Aplicar con método y</tspan><tspan x="686.8" dy="16.5">momento consistentes</tspan></text><circle cx="676.8" cy="298.1" r="14" fill="#206e27"/><text x="676.8" y="302.6" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><rect x="555.0" y="576.9" width="178" height="59.0" rx="10" fill="#e2f7e4" stroke="#8cce93" stroke-width="1.4"/><text x="567.0" y="598.9" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="567.0">Priorizar el análisis</tspan><tspan x="567.0" dy="16.5">del comentario abierto</tspan></text><circle cx="557.0" cy="578.9" r="14" fill="#206e27"/><text x="557.0" y="583.4" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><rect x="167.0" y="576.9" width="178" height="59.0" rx="10" fill="#e2f7e4" stroke="#8cce93" stroke-width="1.4"/><text x="179.0" y="598.9" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="179.0">Cerrar el circuito con</tspan><tspan x="179.0" dy="16.5">quien respondió</tspan></text><circle cx="169.0" cy="578.9" r="14" fill="#206e27"/><text x="169.0" y="583.4" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">4</text><rect x="47.2" y="279.6" width="178" height="92.0" rx="10" fill="#e2f7e4" stroke="#8cce93" stroke-width="1.4"/><text x="59.2" y="301.6" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="59.2">Evitar vincular el</tspan><tspan x="59.2" dy="16.5">indicador a</tspan><tspan x="59.2" dy="16.5">compensación</tspan><tspan x="59.2" dy="16.5">individual</tspan></text><circle cx="49.2" cy="281.6" r="14" fill="#206e27"/><text x="49.2" y="286.1" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">5</text><text x="40" y="742.4" font-size="11.5" fill="#39ac44" font-weight="700" letter-spacing="1.4">CONCEPTOS Y DÓNDE ACTÚAN EN EL MÉTODO</text><rect x="40.0" y="756.4" width="401.0" height="63.0" rx="8" fill="#ffffff" stroke="#8cce93" stroke-width="1.4"/><rect x="40.0" y="764.4" width="5" height="47.0" rx="2" fill="#39ac44"/><text x="56.0" y="778.4" font-size="13.5" fill="#206e27" font-weight="700" text-anchor="start"><tspan x="56.0">Indicador de recomendación</tspan></text><text x="56.0" y="798.2" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Medida de la disposición declarada a recomendar</tspan></text><rect x="379.0" y="764.4" width="54" height="20" rx="10" fill="#bce5c0" stroke="#8cce93" stroke-width="1"/><text x="406.0" y="778.4" font-size="11" fill="#206e27" font-weight="700" text-anchor="middle">↔ 1, 5</text><rect x="459.0" y="756.4" width="401.0" height="63.0" rx="8" fill="#ffffff" stroke="#8cce93" stroke-width="1.4"/><rect x="459.0" y="764.4" width="5" height="47.0" rx="2" fill="#39ac44"/><text x="475.0" y="778.4" font-size="13.5" fill="#206e27" font-weight="700" text-anchor="start"><tspan x="475.0">Satisfacción transaccional</tspan></text><text x="475.0" y="798.2" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Evaluación de una interacción específica y reciente</tspan></text><rect x="40.0" y="833.4" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#8cce93" stroke-width="1.4"/><rect x="40.0" y="841.4" width="5" height="62.2" rx="2" fill="#39ac44"/><text x="56.0" y="855.4" font-size="13.5" fill="#206e27" font-weight="700" text-anchor="start"><tspan x="56.0">Indicador de esfuerzo</tspan></text><text x="56.0" y="875.2" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Medida de la dificultad percibida para resolver algo</tspan></text><rect x="379.0" y="841.4" width="54" height="20" rx="10" fill="#bce5c0" stroke="#8cce93" stroke-width="1"/><text x="406.0" y="855.4" font-size="11" fill="#206e27" font-weight="700" text-anchor="middle">↔ 1, 5</text><rect x="459.0" y="833.4" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#8cce93" stroke-width="1.4"/><rect x="459.0" y="841.4" width="5" height="62.2" rx="2" fill="#39ac44"/><text x="475.0" y="855.4" font-size="13.5" fill="#206e27" font-weight="700" text-anchor="start"><tspan x="475.0">Cierre del circuito</tspan></text><text x="475.0" y="875.2" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Acción de responder al cliente sobre lo que se hizo con su</tspan><tspan x="475.0" dy="15.2">comentario</tspan></text><rect x="798.0" y="841.4" width="54" height="20" rx="10" fill="#bce5c0" stroke="#8cce93" stroke-width="1"/><text x="825.0" y="855.4" font-size="11" fill="#206e27" font-weight="700" text-anchor="middle">↔ 4</text><text x="40" y="943.5799999999999" font-size="11.5" fill="#39ac44" font-weight="700" letter-spacing="1.4">QUÉ SE MIDE: NUMERADOR SOBRE DENOMINADOR</text><rect x="40.0" y="957.6" width="261.3" height="122.7" rx="8" fill="#e2f7e4" stroke="#8cce93" stroke-width="1.4"/><text x="54.0" y="979.6" font-size="13" fill="#206e27" font-weight="700" text-anchor="start"><tspan x="54.0">Tasa de respuesta</tspan></text><text x="54.0" y="1008.7" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Respuestas obtenidas</tspan></text><line x1="54.0" y1="1029.9" x2="287.3" y2="1029.9" stroke="#39ac44" stroke-width="2"/><text x="54.0" y="1047.9" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="54.0">Encuestas enviadas, por punto de</tspan><tspan x="54.0" dy="15.2">medición</tspan></text><rect x="319.3" y="957.6" width="261.3" height="122.7" rx="8" fill="#e2f7e4" stroke="#8cce93" stroke-width="1.4"/><text x="333.3" y="979.6" font-size="13" fill="#206e27" font-weight="700" text-