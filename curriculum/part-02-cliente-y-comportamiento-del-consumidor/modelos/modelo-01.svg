<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1171" width="900" height="1171" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif"><title id="t">Modelo mental · Cliente, usuario, comprador y decisor</title><desc id="d">Modelo mental de la clase 02.01: Cliente, usuario, comprador y decisor. Método en 5 pasos; 4 conceptos; 3 señales de medición.</desc><rect x="0" y="0" width="900" height="1171" rx="14" fill="#ffffff"/><rect x="0" y="0" width="900" height="64" rx="14" fill="#426e20"/><rect x="0" y="40" width="900" height="24" fill="#426e20"/><text x="40" y="28" font-size="12" fill="#cee5bc" font-weight="700" letter-spacing="1.6">MODELO MENTAL · CLASE 02.01 · PARTE 02</text><text x="40" y="52" font-size="21" fill="#ffffff" font-weight="700">Cliente, usuario, comprador y decisor</text><text x="40" y="84" font-size="11.5" fill="#6bac39" font-weight="700" letter-spacing="1.4">MÉTODO PASO A PASO</text><path d="M66.0,159.0 V202.5 H158.5" fill="none" stroke="#6bac39" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="160.5,202.5 151.5,197.5 151.5,207.5" fill="#6bac39"/><path d="M188.5,232.0 V275.5 H281.0" fill="none" stroke="#6bac39" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="283.0,275.5 274.0,270.5 274.0,280.5" fill="#6bac39"/><path d="M311.0,305.0 V348.5 H403.5" fill="none" stroke="#6bac39" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="405.5,348.5 396.5,343.5 396.5,353.5" fill="#6bac39"/><path d="M433.5,378.0 V421.5 H526.0" fill="none" stroke="#6bac39" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="528.0,421.5 519.0,416.5 519.0,426.5" fill="#6bac39"/><rect x="40.0" y="100.0" width="330" height="59.0" rx="10" fill="#ebf7e2" stroke="#a9ce8c" stroke-width="1.4"/><text x="54.0" y="122.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Listar a todas las personas que tocan la</tspan><tspan x="54.0" dy="16.5">decisión</tspan></text><circle cx="42.0" cy="102.0" r="14" fill="#426e20"/><text x="42.0" y="106.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><rect x="162.5" y="173.0" width="330" height="59.0" rx="10" fill="#ebf7e2" stroke="#a9ce8c" stroke-width="1.4"/><text x="176.5" y="195.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="176.5">Asignar rol y criterio de decisión a cada</tspan><tspan x="176.5" dy="16.5">una</tspan></text><circle cx="164.5" cy="175.0" r="14" fill="#426e20"/><text x="164.5" y="179.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><rect x="285.0" y="246.0" width="330" height="59.0" rx="10" fill="#ebf7e2" stroke="#a9ce8c" stroke-width="1.4"/><text x="299.0" y="268.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="299.0">Identificar conflictos entre criterios</tspan></text><circle cx="287.0" cy="248.0" r="14" fill="#426e20"/><text x="287.0" y="252.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><rect x="407.5" y="319.0" width="330" height="59.0" rx="10" fill="#ebf7e2" stroke="#a9ce8c" stroke-width="1.4"/><text x="421.5" y="341.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="421.5">Diseñar la evidencia específica que necesita</tspan><tspan x="421.5" dy="16.5">cada rol</tspan></text><circle cx="409.5" cy="321.0" r="14" fill="#426e20"/><text x="409.5" y="325.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">4</text><rect x="530.0" y="392.0" width="330" height="59.0" rx="10" fill="#ebf7e2" stroke="#a9ce8c" stroke-width="1.4"/><text x="544.0" y="414.0" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="544.0">Definir el orden de conversaciones que</tspan><tspan x="544.0" dy="16.5">reduce el riesgo de veto tardío</tspan></text><circle cx="532.0" cy="394.0" r="14" fill="#426e20"/><text x="532.0" y="398.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">5</text><text x="40" y="493.0" font-size="11.5" fill="#6bac39" font-weight="700" letter-spacing="1.4">CONCEPTOS Y DÓNDE ACTÚAN EN EL MÉTODO</text><rect x="40.0" y="507.0" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#a9ce8c" stroke-width="1.4"/><rect x="40.0" y="515.0" width="5" height="62.2" rx="2" fill="#6bac39"/><text x="56.0" y="529.0" font-size="13.5" fill="#426e20" font-weight="700" text-anchor="start"><tspan x="56.0">Usuario</tspan></text><text x="56.0" y="548.8" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Persona que interactúa con el producto y experimenta sus</tspan><tspan x="56.0" dy="15.2">beneficios y fricciones cotidianas</tspan></text><rect x="459.0" y="507.0" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#a9ce8c" stroke-width="1.4"/><rect x="459.0" y="515.0" width="5" height="62.2" rx="2" fill="#6bac39"/><text x="475.0" y="529.0" font-size="13.5" fill="#426e20" font-weight="700" text-anchor="start"><tspan x="475.0">Comprador económico</tspan></text><text x="475.0" y="548.8" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Persona con autoridad presupuestaria para aprobar el gasto</tspan><tspan x="475.0" dy="15.2">y con responsabilidad sobre el retorno</tspan></text><rect x="40.0" y="599.2" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#a9ce8c" stroke-width="1.4"/><rect x="40.0" y="607.2" width="5" height="62.2" rx="2" fill="#6bac39"/><text x="56.0" y="621.2" font-size="13.5" fill="#426e20" font-weight="700" text-anchor="start"><tspan x="56.0">Influenciador con veto</tspan></text><text x="56.0" y="641.0" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Actor que no decide la compra pero puede detenerla por</tspan><tspan x="56.0" dy="15.2">riesgo técnico, legal o de cumplimiento</tspan></text><rect x="459.0" y="599.2" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#a9ce8c" stroke-width="1.4"/><rect x="459.0" y="607.2" width="5" height="62.2" rx="2" fill="#6bac39"/><text x="475.0" y="621.2" font-size="13.5" fill="#426e20" font-weight="700" text-anchor="start"><tspan x="475.0">Criterio de decisión por rol</tspan></text><text x="475.0" y="641.0" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Conjunto de razones y evidencias que cada rol considera</tspan><tspan x="475.0" dy="15.2">suficientes para avanzar</tspan></text><rect x="798.0" y="607.2" width="54" height="20" rx="10" fill="#cee5bc" stroke="#a9ce8c" stroke-width="1"/><text x="825.0" y="621.2" font-size="11" fill="#426e20" font-weight="700" text-anchor="middle">↔ 1, 2, 3</text><text x="40" y="709.3600000000001" font-size="11.5" fill="#6bac39" font-weight="700" letter-spacing="1.4">QUÉ SE MIDE: NUMERADOR SOBRE DENOMINADOR</text><rect x="40.0" y="723.4" width="261.3" height="153.0" rx="8" fill="#ebf7e2" stroke="#a9ce8c" stroke-width="1.4"/><text x="54.0" y="745.4" font-size="13" fill="#426e20" font-weight="700" text-anchor="start"><tspan x="54.0">Cobertura de roles por</tspan><tspan x="54.0" dy="17.2">oportunidad</tspan></text><text x="54.0" y="791.7" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Roles críticos con al menos un</tspan><tspan x="54.0" dy="15.2">contacto identificado</tspan></text><line x1="54.0" y1="828.0" x2="287.3" y2="828.0" stroke="#6bac39" stroke-width="2"/><text x="54.0" y="846.0" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="54.0">Roles críticos definidos, por</tspan><tspan x="54.0" dy="15.2">oportunidad abierta</tspan></text><rect x="319.3" y="723.4" width="261.3" height="153.0" rx="8" fill="#ebf7e2" stroke="#a9ce8c" stroke-width="1.4"/><text x="333.3" y="745.4" font-size="13" fill="#426e20" font-weight="700" text-anchor="start"><tspan x="333.3">Negocios detenidos por veto</tspan><tspan x="333.3" dy="17.2">tardío</tspan></text><text x="333.3" y="791.7" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="333.3">Oportunidades bloqueadas después de</tspan><tspan x="333.3" dy="15.2">la propuesta por un actor no</tspan><tspan x="333.3" dy="15.2">contactado</tspan></text><line x1="333.3" y1="843.2" x2="566.7" y2="843.2" stroke="#6bac39" stroke-width="2"/><text x="333.3" y="861.2" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="333.3">Oportunidades perdidas</tspan></text><rect x="598.7" y="723.4" width="261.3" height="153.0" rx="8" fill="#ebf7e2" stroke="#a9ce8c" stroke-width="1.4"/><text x="612.7" y="745.4" font-size="13" fill="#426e20" font-weight="700" text-anchor="start"><tspan x="612.7">Tiempo hasta contactar al</tspan><tspan x="612.7" dy="17.2">comprador económico</tspan></text><text x="612.7" y="791.7" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="612.7">Días entre la primera reunión y la</tspan><tspan x="612.7" dy="15.2">primera conversación con quien</tspan><tspan x="612.7" dy="15.2">controla el presupuesto</tspan></text><text x="40" y="910.4000000000001" font-size="11.5" fill="#6bac39" font-weight="700" letter-spacing="1.4">FRONTERA DE APLICACIÓN</text><rect x="40" y="920.4" width="820" height="81.5" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.4"/><polygon points="70,946.1500000000001 52,975.1500000000001 88,975.1500000000001" fill="#c2410c"/><text x="70" y="972.1500000000001" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">!</text><text x="106" y="944.4" font-size="12.5" fill="#7c2d12" font-weight="400" text-anchor="start"><tspan x="106">En negocios pequeños los cuatro roles suelen recaer en una sola persona; forzar el mapa completo</tspan><tspan x="106" dy="16.5">burocratiza una venta simple. El criterio es el valor del contrato y el riesgo percibido, no el tamaño del</tspan><tspan x="106" dy="16.5">formulario.</tspan></text><text x="40" y="1029.9" font-size="11.5" fill="#6bac39" font-weight="700" letter-spacing="1.4">ERROR FRECUENTE Y SU CORRECCIÓN</text><rect x="40" y="1039.9" width="380.0" height="93.5" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/><text x="54" y="1061.9" font-size="11" fill="#b91c1c" font-weight="700" text-anchor="start"><tspan x="54">Síntoma</tspan></text><text x="54" y="1079.9" font-size="12.5" fill="#7f1d1d" font-weight="400" text-anchor="start"><tspan x="54">Confundir entusiasmo del usuario con avance del</tspan><tspan x="54" dy="16.5">negocio</tspan></text><line x1="426.0" y1="1086.7" x2="469.0" y2="1086.7" stroke="#6bac39" stroke-width="2.6" stroke-linecap="round"/><polygon points="474.0,1086.7 465.9,1090.6 465.9,1082.7" fill="#6bac39"/><rect x="480.0" y="1039.9" width="380.0" height="93.5" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.4"/><text x="494.0" y="1061.9" font-size="11" fill="#15803d" font-weight="700" text-anchor="start"><tspan x="494.0">Corrección</tspan></text><text x="494.0" y="1079.9" font-size="12.5" fill="#14532d" font-weight="400" text-anchor="start"><tspan x="494.0">Exige evidencia de contacto con el comprador</tspan><tspan x="494.0" dy="16.5">económico antes de considerar avanzada la</tspan><tspan x="494.0" dy="16.5">oportunidad.</tspan></text></svg>