<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 996" width="900" height="996" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif"><title id="t">Modelo mental · Brand book mínimo viable</title><desc id="d">Modelo mental de la clase 06.14: Brand book mínimo viable. Método en 5 pasos; 4 conceptos; 3 señales de medición.</desc><rect x="0" y="0" width="900" height="996" rx="14" fill="#ffffff"/><rect x="0" y="0" width="900" height="64" rx="14" fill="#57206e"/><rect x="0" y="40" width="900" height="24" fill="#57206e"/><text x="40" y="28" font-size="12" fill="#d9bce5" font-weight="700" letter-spacing="1.6">MODELO MENTAL · CLASE 06.14 · PARTE 06</text><text x="40" y="52" font-size="21" fill="#ffffff" font-weight="700">Brand book mínimo viable</text><text x="40" y="84" font-size="11.5" fill="#8939ac" font-weight="700" letter-spacing="1.4">MÉTODO PASO A PASO</text><line x1="450.0" y1="94.0" x2="450.0" y2="330.5" stroke="#ba8cce" stroke-width="3" stroke-linecap="round"/><line x1="450.0" y1="121.2" x2="406.0" y2="121.2" stroke="#ba8cce" stroke-width="2"/><rect x="56.0" y="100" width="350" height="42.5" rx="10" fill="#f1e2f7" stroke="#ba8cce" stroke-width="1.4"/><text x="70.0" y="122" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="70.0">Consolidar posicionamiento, promesa y activos</tspan></text><circle cx="450.0" cy="121.2" r="15" fill="#57206e"/><text x="450.0" y="125.8" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><line x1="450.0" y1="168.0" x2="494.0" y2="168.0" stroke="#ba8cce" stroke-width="2"/><rect x="494.0" y="138" width="350" height="75.5" rx="10" fill="#f1e2f7" stroke="#ba8cce" stroke-width="1.4"/><text x="508.0" y="160" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="508.0">Escribir reglas de aplicación con ejemplos,</tspan><tspan x="508.0" dy="16.5">incluida la mascota y su corpóreo cuando</tspan><tspan x="508.0" dy="16.5">existan</tspan></text><circle cx="450.0" cy="168.0" r="15" fill="#57206e"/><text x="450.0" y="172.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><line x1="450.0" y1="197.2" x2="406.0" y2="197.2" stroke="#ba8cce" stroke-width="2"/><rect x="56.0" y="176" width="350" height="42.5" rx="10" fill="#f1e2f7" stroke="#ba8cce" stroke-width="1.4"/><text x="70.0" y="198" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="70.0">Incluir la guía verbal con antes y después</tspan></text><circle cx="450.0" cy="197.2" r="15" fill="#57206e"/><text x="450.0" y="201.8" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><line x1="450.0" y1="257.0" x2="494.0" y2="257.0" stroke="#ba8cce" stroke-width="2"/><rect x="494.0" y="227.5" width="350" height="59.0" rx="10" fill="#f1e2f7" stroke="#ba8cce" stroke-width="1.4"/><text x="508.0" y="249.5" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="508.0">Definir el sistema de medición y su</tspan><tspan x="508.0" dy="16.5">periodicidad</tspan></text><circle cx="450.0" cy="257.0" r="15" fill="#57206e"/><text x="450.0" y="261.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">4</text><line x1="450.0" y1="295.0" x2="406.0" y2="295.0" stroke="#ba8cce" stroke-width="2"/><rect x="56.0" y="265.5" width="350" height="59.0" rx="10" fill="#f1e2f7" stroke="#ba8cce" stroke-width="1.4"/><text x="70.0" y="287.5" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="70.0">Ejecutar la prueba de producción con alguien</tspan><tspan x="70.0" dy="16.5">ajeno</tspan></text><circle cx="450.0" cy="295.0" r="15" fill="#57206e"/><text x="450.0" y="299.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">5</text><text x="40" y="366.5" font-size="11.5" fill="#8939ac" font-weight="700" letter-spacing="1.4">CONCEPTOS Y DÓNDE ACTÚAN EN EL MÉTODO</text><rect x="40.0" y="380.5" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#ba8cce" stroke-width="1.4"/><rect x="40.0" y="388.5" width="5" height="62.2" rx="2" fill="#8939ac"/><text x="56.0" y="402.5" font-size="13.5" fill="#57206e" font-weight="700" text-anchor="start"><tspan x="56.0">Manual operativo de marca</tspan></text><text x="56.0" y="422.3" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Documento breve que permite producir piezas correctas sin</tspan><tspan x="56.0" dy="15.2">consulta</tspan></text><rect x="459.0" y="380.5" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#ba8cce" stroke-width="1.4"/><rect x="459.0" y="388.5" width="5" height="62.2" rx="2" fill="#8939ac"/><text x="475.0" y="402.5" font-size="13.5" fill="#57206e" font-weight="700" text-anchor="start"><tspan x="475.0">Regla de aplicación</tspan></text><text x="475.0" y="422.3" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Instrucción concreta sobre uso de activos en un soporte</tspan><tspan x="475.0" dy="15.2">específico</tspan></text><rect x="798.0" y="388.5" width="54" height="20" rx="10" fill="#d9bce5" stroke="#ba8cce" stroke-width="1"/><text x="825.0" y="402.5" font-size="11" fill="#57206e" font-weight="700" text-anchor="middle">↔ 2</text><rect x="40.0" y="472.7" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#ba8cce" stroke-width="1.4"/><rect x="40.0" y="480.7" width="5" height="62.2" rx="2" fill="#8939ac"/><text x="56.0" y="494.7" font-size="13.5" fill="#57206e" font-weight="700" text-anchor="start"><tspan x="56.0">Sistema de medición de marca</tspan></text><text x="56.0" y="514.5" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Conjunto de indicadores, método y periodicidad definidos</tspan></text><rect x="379.0" y="480.7" width="54" height="20" rx="10" fill="#d9bce5" stroke="#ba8cce" stroke-width="1"/><text x="406.0" y="494.7" font-size="11" fill="#57206e" font-weight="700" text-anchor="middle">↔ 4</text><rect x="459.0" y="472.7" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#ba8cce" stroke-width="1.4"/><rect x="459.0" y="480.7" width="5" height="62.2" rx="2" fill="#8939ac"/><text x="475.0" y="494.7" font-size="13.5" fill="#57206e" font-weight="700" text-anchor="start"><tspan x="475.0">Prueba de producción</tspan></text><text x="475.0" y="514.5" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Verificación de que una persona ajena produce una pieza</tspan><tspan x="475.0" dy="15.2">conforme</tspan></text><rect x="798.0" y="480.7" width="54" height="20" rx="10" fill="#d9bce5" stroke="#ba8cce" stroke-width="1"/><text x="825.0" y="494.7" font-size="11" fill="#57206e" font-weight="700" text-anchor="middle">↔ 5</text><text x="40" y="582.86" font-size="11.5" fill="#8939ac" font-weight="700" letter-spacing="1.4">QUÉ SE MIDE: NUMERADOR SOBRE DENOMINADOR</text><rect x="40.0" y="596.9" width="261.3" height="137.9" rx="8" fill="#f1e2f7" stroke="#ba8cce" stroke-width="1.4"/><text x="54.0" y="618.9" font-size="13" fill="#57206e" font-weight="700" text-anchor="start"><tspan x="54.0">Resultado de la prueba de</tspan><tspan x="54.0" dy="17.2">producción</tspan></text><text x="54.0" y="665.2" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Piezas conformes producidas sin</tspan><tspan x="54.0" dy="15.2">consulta</tspan></text><line x1="54.0" y1="701.5" x2="287.3" y2="701.5" stroke="#8939ac" stroke-width="2"/><text x="54.0" y="719.5" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="54.0">Piezas solicitadas</tspan></text><rect x="319.3" y="596.9" width="261.3" height="137.9" rx="8" fill="#f1e2f7" stroke="#ba8cce" stroke-width="1.4"/><text x="333.3" y="618.9" font-size="13" fill="#57206e" font-weight="700" text-anchor="start"><tspan x="333.3">Tiempo de producción de una</tspan><tspan x="333.3" dy="17.2">pieza</tspan></text><text x="333.3" y="665.2" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="333.3">Horas desde el encargo hasta la</tspan><tspan x="333.3" dy="15.2">pieza aprobada, antes y después del</tspan><tspan x="333.3" dy="15.2">manual</tspan></text><rect x="598.7" y="596.9" width="261.3" height="137.9" rx="8" fill="#f1e2f7" stroke="#ba8cce" stroke-width="1.4"/><text x="612.7" y="618.9" font-size="13" fill="#57206e" font-weight="700" text-anchor="start"><tspan x="612.7">Consistencia auditada</tspan></text><text x="612.7" y="648.0" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="612.7">Piezas conformes al manual</tspan></text><line x1="612.7" y1="669.2" x2="846.0" y2="669.2" stroke="#8939ac" stroke-width="2"/><text x="612.7" y="687.2" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="612.7">Piezas auditadas por trimestre</tspan></text><text x="40" y="768.72" font-size="11.5" fill="#8939ac" font-weight="700" letter-spacing="1.4">FRONTERA DE APLICACIÓN</text><rect x="40" y="778.7" width="820" height="65.0" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.4"/><polygon points="70,796.22 52,825.22 88,825.22" fill="#c2410c"/><text x="70" y="822.22" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">!</text><text x="106" y="802.7" font-size="12.5" fill="#7c2d12" font-weight="400" text-anchor="start"><tspan x="106">Un manual extenso no se usa. Si supera lo que una persona puede consultar en cinco minutos, hay que</tspan><tspan x="106" dy="16.5">producir una versión operativa de una página.</tspan></text><text x="40" y="871.72" font-size="11.5" fill="#8939ac" font-weight="700" letter-spacing="1.4">ERROR FRECUENTE Y SU CORRECCIÓN</text><rect x="40" y="881.7" width="380.0" height="77.0" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/><text x="54" y="903.7" font-size="11" fill="#b91c1c" font-weight="700" text-anchor="start"><tspan x="54">Síntoma</tspan></text><text x="54" y="921.7" font-size="12.5" fill="#7f1d1d" font-weight="400" text-anchor="start"><tspan x="54">Producir un manual extenso sin prueba de producción</tspan></text><line x1="426.0" y1="920.2" x2="469.0" y2="920.2" stroke="#8939ac" stroke-width="2.6" stroke-linecap="round"/><polygon points="474.0,920.2 465.9,924.1 465.9,916.3" fill="#8939ac"/><rect x="480.0" y="881.7" width="380.0" height="77.0" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.4"/><text x="494.0" y="903.7" font-size="11" fill="#15803d" font-weight="700" text-anchor="start"><tspan x="494.0">Corrección</tspan></text><text x="494.0" y="921.7" font-size="12.5" fill="#14532d" font-weight="400" text-anchor="start"><tspan x="494.0">Entrega el manual a una persona ajena y verifica si</tspan><tspan x="494.0" dy="16.5">produce una pieza conforme sin ayuda.</tspan></text></svg>