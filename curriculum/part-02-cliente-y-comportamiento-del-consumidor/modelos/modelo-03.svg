<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 998" width="900" height="998" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif"><title id="t">Modelo mental · Jobs to Be Done</title><desc id="d">Modelo mental de la clase 02.03: Jobs to Be Done. Método en 5 pasos; 4 conceptos; 3 señales de medición.</desc><rect x="0" y="0" width="900" height="998" rx="14" fill="#ffffff"/><rect x="0" y="0" width="900" height="64" rx="14" fill="#426e20"/><rect x="0" y="40" width="900" height="24" fill="#426e20"/><text x="40" y="28" font-size="12" fill="#cee5bc" font-weight="700" letter-spacing="1.6">MODELO MENTAL · CLASE 02.03 · PARTE 02</text><text x="40" y="52" font-size="21" fill="#ffffff" font-weight="700">Jobs to Be Done</text><text x="40" y="84" font-size="11.5" fill="#6bac39" font-weight="700" letter-spacing="1.4">MÉTODO PASO A PASO</text><line x1="450.0" y1="94.0" x2="450.0" y2="317.0" stroke="#a9ce8c" stroke-width="3" stroke-linecap="round"/><line x1="450.0" y1="129.5" x2="406.0" y2="129.5" stroke="#a9ce8c" stroke-width="2"/><rect x="56.0" y="100" width="350" height="59.0" rx="10" fill="#ebf7e2" stroke="#a9ce8c" stroke-width="1.4"/><text x="70.0" y="122" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="70.0">Reconstruir la línea de tiempo de una compra</tspan><tspan x="70.0" dy="16.5">reciente</tspan></text><circle cx="450.0" cy="129.5" r="15" fill="#426e20"/><text x="450.0" y="134.0" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><line x1="450.0" y1="167.5" x2="494.0" y2="167.5" stroke="#a9ce8c" stroke-width="2"/><rect x="494.0" y="138" width="350" height="59.0" rx="10" fill="#ebf7e2" stroke="#a9ce8c" stroke-width="1.4"/><text x="508.0" y="160" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="508.0">Identificar el evento disparador y la</tspan><tspan x="508.0" dy="16.5">circunstancia</tspan></text><circle cx="450.0" cy="167.5" r="15" fill="#426e20"/><text x="450.0" y="172.0" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><line x1="450.0" y1="205.5" x2="406.0" y2="205.5" stroke="#a9ce8c" stroke-width="2"/><rect x="56.0" y="176" width="350" height="59.0" rx="10" fill="#ebf7e2" stroke="#a9ce8c" stroke-width="1.4"/><text x="70.0" y="198" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="70.0">Nombrar el trabajo funcional, social y</tspan><tspan x="70.0" dy="16.5">emocional</tspan></text><circle cx="450.0" cy="205.5" r="15" fill="#426e20"/><text x="450.0" y="210.0" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><line x1="450.0" y1="243.5" x2="494.0" y2="243.5" stroke="#a9ce8c" stroke-width="2"/><rect x="494.0" y="214" width="350" height="59.0" rx="10" fill="#ebf7e2" stroke="#a9ce8c" stroke-width="1.4"/><text x="508.0" y="236" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="508.0">Mapear las cuatro fuerzas de progreso y</tspan><tspan x="508.0" dy="16.5">resistencia</tspan></text><circle cx="450.0" cy="243.5" r="15" fill="#426e20"/><text x="450.0" y="248.0" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">4</text><line x1="450.0" y1="281.5" x2="406.0" y2="281.5" stroke="#a9ce8c" stroke-width="2"/><rect x="56.0" y="252" width="350" height="59.0" rx="10" fill="#ebf7e2" stroke="#a9ce8c" stroke-width="1.4"/><text x="70.0" y="274" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="70.0">Diseñar la intervención que reduce ansiedad o</tspan><tspan x="70.0" dy="16.5">hábito</tspan></text><circle cx="450.0" cy="281.5" r="15" fill="#426e20"/><text x="450.0" y="286.0" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">5</text><text x="40" y="353.0" font-size="11.5" fill="#6bac39" font-weight="700" letter-spacing="1.4">CONCEPTOS Y DÓNDE ACTÚAN EN EL MÉTODO</text><rect x="40.0" y="367.0" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#a9ce8c" stroke-width="1.4"/><rect x="40.0" y="375.0" width="5" height="62.2" rx="2" fill="#6bac39"/><text x="56.0" y="389.0" font-size="13.5" fill="#426e20" font-weight="700" text-anchor="start"><tspan x="56.0">Job funcional</tspan></text><text x="56.0" y="408.8" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Tarea concreta que el cliente busca completar en una</tspan><tspan x="56.0" dy="15.2">circunstancia específica</tspan></text><rect x="379.0" y="375.0" width="54" height="20" rx="10" fill="#cee5bc" stroke="#a9ce8c" stroke-width="1"/><text x="406.0" y="389.0" font-size="11" fill="#426e20" font-weight="700" text-anchor="middle">↔ 3</text><rect x="459.0" y="367.0" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#a9ce8c" stroke-width="1.4"/><rect x="459.0" y="375.0" width="5" height="62.2" rx="2" fill="#6bac39"/><text x="475.0" y="389.0" font-size="13.5" fill="#426e20" font-weight="700" text-anchor="start"><tspan x="475.0">Dimensión social y emocional</tspan></text><text x="475.0" y="408.8" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Cómo quiere sentirse y ser percibido el cliente al</tspan><tspan x="475.0" dy="15.2">resolver ese trabajo</tspan></text><rect x="798.0" y="375.0" width="54" height="20" rx="10" fill="#cee5bc" stroke="#a9ce8c" stroke-width="1"/><text x="825.0" y="389.0" font-size="11" fill="#426e20" font-weight="700" text-anchor="middle">↔ 3</text><rect x="40.0" y="459.2" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#a9ce8c" stroke-width="1.4"/><rect x="40.0" y="467.2" width="5" height="62.2" rx="2" fill="#6bac39"/><text x="56.0" y="481.2" font-size="13.5" fill="#426e20" font-weight="700" text-anchor="start"><tspan x="56.0">Fuerzas de progreso</tspan></text><text x="56.0" y="501.0" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Empuje del problema y atracción de la nueva solución que</tspan><tspan x="56.0" dy="15.2">impulsan el cambio</tspan></text><rect x="379.0" y="467.2" width="54" height="20" rx="10" fill="#cee5bc" stroke="#a9ce8c" stroke-width="1"/><text x="406.0" y="481.2" font-size="11" fill="#426e20" font-weight="700" text-anchor="middle">↔ 4</text><rect x="459.0" y="459.2" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#a9ce8c" stroke-width="1.4"/><rect x="459.0" y="467.2" width="5" height="62.2" rx="2" fill="#6bac39"/><text x="475.0" y="481.2" font-size="13.5" fill="#426e20" font-weight="700" text-anchor="start"><tspan x="475.0">Fuerzas de resistencia</tspan></text><text x="475.0" y="501.0" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Ansiedad ante lo nuevo y hábito con lo actual que frenan</tspan><tspan x="475.0" dy="15.2">el cambio</tspan></text><rect x="798.0" y="467.2" width="54" height="20" rx="10" fill="#cee5bc" stroke="#a9ce8c" stroke-width="1"/><text x="825.0" y="481.2" font-size="11" fill="#426e20" font-weight="700" text-anchor="middle">↔ 4, 5</text><text x="40" y="569.36" font-size="11.5" fill="#6bac39" font-weight="700" letter-spacing="1.4">QUÉ SE MIDE: NUMERADOR SOBRE DENOMINADOR</text><rect x="40.0" y="583.4" width="261.3" height="153.0" rx="8" fill="#ebf7e2" stroke="#a9ce8c" stroke-width="1.4"/><text x="54.0" y="605.4" font-size="13" fill="#426e20" font-weight="700" text-anchor="start"><tspan x="54.0">Frecuencia de disparadores por</tspan><tspan x="54.0" dy="17.2">tipo</tspan></text><text x="54.0" y="651.7" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Eventos disparadores identificados</tspan><tspan x="54.0" dy="15.2">por categoría</tspan></text><line x1="54.0" y1="688.0" x2="287.3" y2="688.0" stroke="#6bac39" stroke-width="2"/><text x="54.0" y="706.0" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="54.0">Entrevistas de compra realizadas</tspan></text><rect x="319.3" y="583.4" width="261.3" height="153.0" rx="8" fill="#ebf7e2" stroke="#a9ce8c" stroke-width="1.4"/><text x="333.3" y="605.4" font-size="13" fill="#426e20" font-weight="700" text-anchor="start"><tspan x="333.3">Tasa de abandono por ansiedad</tspan><tspan x="333.3" dy="17.2">declarada</tspan></text><text x="333.3" y="651.7" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="333.3">Oportunidades perdidas donde el</tspan><tspan x="333.3" dy="15.2">cliente citó riesgo de migración o</tspan><tspan x="333.3" dy="15.2">aprendizaje</tspan></text><line x1="333.3" y1="703.2" x2="566.7" y2="703.2" stroke="#6bac39" stroke-width="2"/><text x="333.3" y="721.2" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="333.3">Pérdidas totales</tspan></text><rect x="598.7" y="583.4" width="261.3" height="153.0" rx="8" fill="#ebf7e2" stroke="#a9ce8c" stroke-width="1.4"/><text x="612.7" y="605.4" font-size="13" fill="#426e20" font-weight="700" text-anchor="start"><tspan x="612.7">Tiempo desde disparador hasta</tspan><tspan x="612.7" dy="17.2">búsqueda</tspan></text><text x="612.7" y="651.7" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="612.7">Días entre el evento disparador y el</tspan><tspan x="612.7" dy="15.2">primer contacto con una solución,</tspan><tspan x="612.7" dy="15.2">mediana por segmento</tspan></text><text x="40" y="770.4" font-size="11.5" fill="#6bac39" font-weight="700" letter-spacing="1.4">FRONTERA DE APLICACIÓN</text><rect x="40" y="780.4" width="820" height="65.0" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.4"/><polygon points="70,797.9 52,826.9 88,826.9" fill="#c2410c"/><text x="70" y="823.9" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">!</text><text x="106" y="804.4" font-size="12.5" fill="#7c2d12" font-weight="400" text-anchor="start"><tspan x="106">JTBD no reemplaza la segmentación operativa ni el dimensionamiento de mercado: explica por qué alguien</tspan><tspan x="106" dy="16.5">compra, no cuántos como él existen ni cómo alcanzarlos con un presupuesto dado.</tspan></text><text x="40" y="873.4" font-size="11.5" fill="#6bac39" font-weight="700" letter-spacing="1.4">ERROR FRECUENTE Y SU CORRECCIÓN</text><rect x="40" y="883.4" width="380.0" height="77.0" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/><text x="54" y="905.4" font-size="11" fill="#b91c1c" font-weight="700" text-anchor="start"><tspan x="54">Síntoma</tspan></text><text x="54" y="923.4" font-size="12.5" fill="#7f1d1d" font-weight="400" text-anchor="start"><tspan x="54">Enunciar el job en términos genéricos de negocio</tspan></text><line x1="426.0" y1="921.9" x2="469.0" y2="921.9" stroke="#6bac39" stroke-width="2.6" stroke-linecap="round"/><polygon points="474.0,921.9 465.9,925.8 465.9,918.0" fill="#6bac39"/><rect x="480.0" y="883.4" width="380.0" height="77.0" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.4"/><text x="494.0" y="905.4" font-size="11" fill="#15803d" font-weight="700" text-anchor="start"><tspan x="494.0">Corrección</tspan></text><text x="494.0" y="923.4" font-size="12.5" fill="#14532d" font-weight="400" text-anchor="start"><tspan x="494.0">Reescribe el job incluyendo circunstancia, momento</tspan><tspan x="494.0" dy="16.5">y alternativa desplazada.</tspan></text></svg>