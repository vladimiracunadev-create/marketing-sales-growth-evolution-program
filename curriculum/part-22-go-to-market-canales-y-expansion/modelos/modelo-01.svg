<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 968" width="900" height="968" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif"><title id="t">Modelo mental · Qué es una estrategia go-to-market</title><desc id="d">Modelo mental de la clase 22.01: Qué es una estrategia go-to-market. Método en 5 pasos; 4 conceptos; 3 señales de medición.</desc><rect x="0" y="0" width="900" height="968" rx="14" fill="#ffffff"/><rect x="0" y="0" width="900" height="64" rx="14" fill="#6e205c"/><rect x="0" y="40" width="900" height="24" fill="#6e205c"/><text x="40" y="28" font-size="12" fill="#e5bcdc" font-weight="700" letter-spacing="1.6">MODELO MENTAL · CLASE 22.01 · PARTE 22</text><text x="40" y="52" font-size="21" fill="#ffffff" font-weight="700">Qué es una estrategia go-to-market</text><text x="40" y="84" font-size="11.5" fill="#ac3991" font-weight="700" letter-spacing="1.4">MÉTODO PASO A PASO</text><line x1="450.0" y1="94.0" x2="450.0" y2="300.5" stroke="#ce8cbe" stroke-width="3" stroke-linecap="round"/><line x1="450.0" y1="129.5" x2="406.0" y2="129.5" stroke="#ce8cbe" stroke-width="2"/><rect x="56.0" y="100" width="350" height="59.0" rx="10" fill="#f7e2f2" stroke="#ce8cbe" stroke-width="1.4"/><text x="70.0" y="122" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="70.0">Definir el segmento objetivo y su valor de</tspan><tspan x="70.0" dy="16.5">contrato</tspan></text><circle cx="450.0" cy="129.5" r="15" fill="#6e205c"/><text x="450.0" y="134.0" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><line x1="450.0" y1="167.5" x2="494.0" y2="167.5" stroke="#ce8cbe" stroke-width="2"/><rect x="494.0" y="138" width="350" height="59.0" rx="10" fill="#f7e2f2" stroke="#ce8cbe" stroke-width="1.4"/><text x="508.0" y="160" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="508.0">Elegir el movimiento comercial coherente con</tspan><tspan x="508.0" dy="16.5">ese valor</tspan></text><circle cx="450.0" cy="167.5" r="15" fill="#6e205c"/><text x="450.0" y="172.0" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><line x1="450.0" y1="197.2" x2="406.0" y2="197.2" stroke="#ce8cbe" stroke-width="2"/><rect x="56.0" y="176" width="350" height="42.5" rx="10" fill="#f7e2f2" stroke="#ce8cbe" stroke-width="1.4"/><text x="70.0" y="198" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="70.0">Calcular el costo del movimiento por cliente</tspan></text><circle cx="450.0" cy="197.2" r="15" fill="#6e205c"/><text x="450.0" y="201.8" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><line x1="450.0" y1="243.5" x2="494.0" y2="243.5" stroke="#ce8cbe" stroke-width="2"/><rect x="494.0" y="214" width="350" height="59.0" rx="10" fill="#f7e2f2" stroke="#ce8cbe" stroke-width="1.4"/><text x="508.0" y="236" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="508.0">Verificar la coherencia con la economía</tspan><tspan x="508.0" dy="16.5">unitaria</tspan></text><circle cx="450.0" cy="243.5" r="15" fill="#6e205c"/><text x="450.0" y="248.0" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">4</text><line x1="450.0" y1="273.2" x2="406.0" y2="273.2" stroke="#ce8cbe" stroke-width="2"/><rect x="56.0" y="252" width="350" height="42.5" rx="10" fill="#f7e2f2" stroke="#ce8cbe" stroke-width="1.4"/><text x="70.0" y="274" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="70.0">Documentar la estrategia y sus supuestos</tspan></text><circle cx="450.0" cy="273.2" r="15" fill="#6e205c"/><text x="450.0" y="277.8" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">5</text><text x="40" y="336.5" font-size="11.5" fill="#ac3991" font-weight="700" letter-spacing="1.4">CONCEPTOS Y DÓNDE ACTÚAN EN EL MÉTODO</text><rect x="40.0" y="350.5" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#ce8cbe" stroke-width="1.4"/><rect x="40.0" y="358.5" width="5" height="62.2" rx="2" fill="#ac3991"/><text x="56.0" y="372.5" font-size="13.5" fill="#6e205c" font-weight="700" text-anchor="start"><tspan x="56.0">Movimiento comercial</tspan></text><text x="56.0" y="392.3" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Forma dominante en que la empresa adquiere clientes:</tspan><tspan x="56.0" dy="15.2">autoservicio, venta interna, terreno o socios</tspan></text><rect x="379.0" y="358.5" width="54" height="20" rx="10" fill="#e5bcdc" stroke="#ce8cbe" stroke-width="1"/><text x="406.0" y="372.5" font-size="11" fill="#6e205c" font-weight="700" text-anchor="middle">↔ 2, 3</text><rect x="459.0" y="350.5" width="401.0" height="78.2" rx="8" fill="#ffffff" stroke="#ce8cbe" stroke-width="1.4"/><rect x="459.0" y="358.5" width="5" height="62.2" rx="2" fill="#ac3991"/><text x="475.0" y="372.5" font-size="13.5" fill="#6e205c" font-weight="700" text-anchor="start"><tspan x="475.0">Coherencia económica</tspan></text><text x="475.0" y="392.3" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Correspondencia entre el valor del contrato y el costo del</tspan><tspan x="475.0" dy="15.2">movimiento</tspan></text><rect x="798.0" y="358.5" width="54" height="20" rx="10" fill="#e5bcdc" stroke="#ce8cbe" stroke-width="1"/><text x="825.0" y="372.5" font-size="11" fill="#6e205c" font-weight="700" text-anchor="middle">↔ 1, 2, 3, 4</text><rect x="40.0" y="442.7" width="401.0" height="63.0" rx="8" fill="#ffffff" stroke="#ce8cbe" stroke-width="1.4"/><rect x="40.0" y="450.7" width="5" height="47.0" rx="2" fill="#ac3991"/><text x="56.0" y="464.7" font-size="13.5" fill="#6e205c" font-weight="700" text-anchor="start"><tspan x="56.0">Segmento objetivo</tspan></text><text x="56.0" y="484.5" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="56.0">Grupo específico al que se dirige el movimiento</tspan></text><rect x="379.0" y="450.7" width="54" height="20" rx="10" fill="#e5bcdc" stroke="#ce8cbe" stroke-width="1"/><text x="406.0" y="464.7" font-size="11" fill="#6e205c" font-weight="700" text-anchor="middle">↔ 1</text><rect x="459.0" y="442.7" width="401.0" height="63.0" rx="8" fill="#ffffff" stroke="#ce8cbe" stroke-width="1.4"/><rect x="459.0" y="450.7" width="5" height="47.0" rx="2" fill="#ac3991"/><text x="475.0" y="464.7" font-size="13.5" fill="#6e205c" font-weight="700" text-anchor="start"><tspan x="475.0">Ciclo completo</tspan></text><text x="475.0" y="484.5" font-size="11.5" fill="#3e4c59" font-weight="400" text-anchor="start"><tspan x="475.0">Recorrido desde el descubrimiento hasta la renovación</tspan></text><text x="40" y="537.6800000000001" font-size="11.5" fill="#ac3991" font-weight="700" letter-spacing="1.4">QUÉ SE MIDE: NUMERADOR SOBRE DENOMINADOR</text><rect x="40.0" y="551.7" width="261.3" height="137.9" rx="8" fill="#f7e2f2" stroke="#ce8cbe" stroke-width="1.4"/><text x="54.0" y="573.7" font-size="13" fill="#6e205c" font-weight="700" text-anchor="start"><tspan x="54.0">Costo del movimiento por cliente</tspan></text><text x="54.0" y="602.8" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="54.0">Gasto comercial del movimiento</tspan></text><line x1="54.0" y1="624.0" x2="287.3" y2="624.0" stroke="#ac3991" stroke-width="2"/><text x="54.0" y="642.0" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="54.0">Clientes ganados</tspan></text><rect x="319.3" y="551.7" width="261.3" height="137.9" rx="8" fill="#f7e2f2" stroke="#ce8cbe" stroke-width="1.4"/><text x="333.3" y="573.7" font-size="13" fill="#6e205c" font-weight="700" text-anchor="start"><tspan x="333.3">Relación costo-valor de contrato</tspan></text><text x="333.3" y="602.8" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="333.3">Costo de adquisición</tspan></text><line x1="333.3" y1="624.0" x2="566.7" y2="624.0" stroke="#ac3991" stroke-width="2"/><text x="333.3" y="642.0" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="333.3">Valor del primer año del contrato</tspan></text><rect x="598.7" y="551.7" width="261.3" height="137.9" rx="8" fill="#f7e2f2" stroke="#ce8cbe" stroke-width="1.4"/><text x="612.7" y="573.7" font-size="13" fill="#6e205c" font-weight="700" text-anchor="start"><tspan x="612.7">Coherencia entre segmentos y</tspan><tspan x="612.7" dy="17.2">movimientos</tspan></text><text x="612.7" y="620.0" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="612.7">Segmentos atendidos con el</tspan><tspan x="612.7" dy="15.2">movimiento correspondiente</tspan></text><line x1="612.7" y1="656.4" x2="846.0" y2="656.4" stroke="#ac3991" stroke-width="2"/><text x="612.7" y="674.4" font-size="11.5" fill="#52606d" font-weight="400" text-anchor="start"><tspan x="612.7">Segmentos activos</tspan></text><text x="40" y="723.5400000000001" font-size="11.5" fill="#ac3991" font-weight="700" letter-spacing="1.4">FRONTERA DE APLICACIÓN</text><rect x="40" y="733.5" width="820" height="65.0" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.4"/><polygon points="70,751.0400000000001 52,780.0400000000001 88,780.0400000000001" fill="#c2410c"/><text x="70" y="777.0400000000001" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">!</text><text x="106" y="757.5" font-size="12.5" fill="#7c2d12" font-weight="400" text-anchor="start"><tspan x="106">Una estrategia coherente puede fallar por ejecución. El diseño no garantiza el resultado: sólo evita el</tspan><tspan x="106" dy="16.5">error de partida.</tspan></text><text x="40" y="826.5400000000001" font-size="11.5" fill="#ac3991" font-weight="700" letter-spacing="1.4">ERROR FRECUENTE Y SU CORRECCIÓN</text><rect x="40" y="836.5" width="380.0" height="93.5" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/><text x="54" y="858.5" font-size="11" fill="#b91c1c" font-weight="700" text-anchor="start"><tspan x="54">Síntoma</tspan></text><text x="54" y="876.5" font-size="12.5" fill="#7f1d1d" font-weight="400" text-anchor="start"><tspan x="54">Usar un movimiento caro para tickets bajos</tspan></text><line x1="426.0" y1="883.3" x2="469.0" y2="883.3" stroke="#ac3991" stroke-width="2.6" stroke-linecap="round"/><polygon points="474.0,883.3 465.9,887.2 465.9,879.4" fill="#ac3991"/><rect x="480.0" y="836.5" width="380.0" height="93.5" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.4"/><text x="494.0" y="858.5" font-size="11" fill="#15803d" font-weight="700" text-anchor="start"><tspan x="494.0">Corrección</tspan></text><text x="494.0" y="876.5" font-size="12.5" fill="#14532d" font-weight="400" text-anchor="start"><tspan x="494.0">Compara el costo del movimiento con el valor del</tspan><tspan x="494.0" dy="16.5">contrato antes de definir la estrategia por</tspan><tspan x="494.0" dy="16.5">segmento.</tspan></text></svg>